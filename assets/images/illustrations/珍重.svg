<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle warm ambient lighting from the interaction point -->
  <circle cx="120" cy="130" r="60" fill="#FFB74D" opacity="0.08" filter="blur(15px)"/>

  <!-- Background decorative elements: Station / Departure atmosphere (soft abstract travel lines/luggage silhouette) -->
  <path d="M70,185 L170,185" stroke="#2C323D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Person Left (Friend seeing off) -->
  <g transform="translate(65, 90)">
    <!-- Body/Coat -->
    <path d="M15,40 C15,30 25,25 35,25 C45,25 55,30 55,40 L55,95 L15,95 Z" fill="#3A4356"/>
    <!-- Head -->
    <circle cx="35" cy="14" r="10" fill="#E0E6ED"/>
    <!-- Clasping arm (reaching out to shake hands) -->
    <path d="M45,45 C52,48 62,55 70,60" stroke="#3A4356" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Person Right (Traveler leaving) -->
  <g transform="translate(120, 90)">
    <!-- Body/Coat -->
    <path d="M10,40 C10,30 20,25 30,25 C40,25 50,30 50,40 L50,95 L10,95 Z" fill="#2E394A"/>
    <!-- Head -->
    <circle cx="30" cy="14" r="10" fill="#E0E6ED"/>
    <!-- Clasping arm (meeting in the center) -->
    <path d="M20,45 C12,48 2,55 -5,60" stroke="#2E394A" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Travel luggage beside the traveler -->
    <rect x="42" y="55" width="22" height="35" rx="4" fill="#D16D43"/>
    <path d="M49,55 L49,50 C49,48 51,46 53,46 C55,46 57,48 57,50 L57,55" fill="none" stroke="#D16D43" stroke-width="3"/>
    <line x1="42" y1="65" x2="64" y2="65" stroke="#B85631" stroke-width="2"/>
  </g>

  <!-- Central Handshake (The focal point expressing "珍重" - deep care and sincere farewell) -->
  <g transform="translate(108, 142)">
    <!-- Warm glow on hands -->
    <circle cx="12" cy="8" r="16" fill="#FFB74D" opacity="0.2" filter="blur(6px)"/>
    <!-- Interlocked hands shape -->
    <path d="M0,12 C4,14 10,15 16,12 C20,10 24,6 26,2" stroke="#FFB74D" stroke-width="7" stroke-linecap="round"/>
    <path d="M-2,6 C4,8 14,8 20,2" stroke="#E6953B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!--上方意境符号：离别时的列车车窗/远方指引或淡淡的行囊标志，保持克制现代-->
  <path d="M95,62 L145,62" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="120" cy="62" r="5" fill="#FFB74D"/>
</svg>