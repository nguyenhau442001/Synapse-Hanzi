<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Interface ambient glow -->
    <circle cx="0" cy="0" r="85" fill="#252A34" opacity="0.6"/>

    <!-- Water droplet (physical object representing 折射) -->
    <path d="M 0 -72 C 0 -72, 44 -15, 44 26 C 44 50, 24 70, 0 70 C -24 70, -44 50, -44 26 C -44 -15, 0 -72, 0 -72 Z" fill="#3B82F6" opacity="0.15"/>
    <path d="M 0 -60 C 0 -60, 36 -12, 36 22 C 36 42, 20 58, 0 58 C -20 58, -36 42, -36 22 C -36 -12, 0 -60, 0 -60 Z" fill="#22D3EE" opacity="0.25"/>

    <!-- Incoming Sunbeam (White/Yellow) -->
    <line x1="-85" y1="-85" x2="-22" y2="-12" stroke="#FEF08A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-53" cy="-48" r="3" fill="#FFFFFF"/>

    <!-- Refracted Beam inside droplet (bending) -->
    <line x1="-22" y1="-12" x2="15" y2="28" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

    <!-- Rainbow dispersion emerging (Refraction/折射 output) -->
    <line x1="15" y1="28" x2="80" y2="45" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="28" x2="85" y2="60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="28" x2="70" y2="72" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <!-- Highlight on Droplet -->
    <path d="M -16 -10 C -10 -25, -5 -35, -2 -48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Focal point / center physical object emphasis -->
    <circle cx="0" cy="22" r="38" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
  </g>
</svg>