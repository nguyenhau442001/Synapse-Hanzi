<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain Path Representation -->
  <path d="M40 200 L100 120 L140 160 L200 80" stroke="#FFB347" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Jagged Mountain Peaks -->
  <path d="M30 200 L60 140 L90 180 L120 110 L150 150 L180 90 L210 200 Z" fill="#3B4252"/>
  
  <!-- Explorer Figure -->
  <g transform="translate(100, 110)">
    <!-- Body -->
    <path d="M0 0 L-10 40 L10 40 Z" fill="#FFB347"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="10" fill="#FFB347"/>
    <!-- Backpack -->
    <rect x="-12" y="5" width="8" height="15" rx="2" fill="#E5E9F0"/>
  </g>
  
  <!-- Sharp Rocks/Obstacles -->
  <path d="M50 190 L60 170 L70 190 Z" fill="#BF616A"/>
  <path d="M160 100 L170 80 L180 100 Z" fill="#BF616A"/>
  <path d="M120 150 L130 130 L140 150 Z" fill="#BF616A"/>
  
  <!-- Steep Cliff Edge -->
  <path d="M180 200 L210 200 L210 80 L190 80 Z" fill="#2E3440"/>
</svg>