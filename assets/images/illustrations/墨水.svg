<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow representing depth -->
  <circle cx="120" cy="120" r="70" fill="#222733" opacity="0.6"/>

  <!-- Fountain Pen & Ink Bottle Illustration representing 墨水 (Mòshuǐ) -->
  <g transform="translate(0, 5)">
    
    <!-- Ink Bottle Body -->
    <path d="M 85 140 L 95 105 C 96 102 98 100 102 100 L 138 100 C 142 100 144 102 145 105 L 155 140 C 162 145 168 155 168 168 C 168 180 158 190 145 190 L 95 190 C 82 190 72 180 72 168 C 72 155 78 145 85 140 Z" fill="#2E3646"/>
    
    <!-- Ink Bottle Neck & Cap Base -->
    <rect x="98" y="90" width="44" height="12" rx="3" fill="#3A445A"/>
    
    <!-- Ink Bottle Cap -->
    <path d="M 94 75 L 146 75 C 148 75 150 77 150 79 L 150 90 C 150 92 148 94 146 94 L 94 94 C 92 94 90 92 90 90 L 90 79 C 90 77 92 75 94 75 Z" fill="#F0A500"/>
    
    <!-- Liquid Ink inside Bottle (Deep dark blue with subtle surface level) -->
    <path d="M 76 155 L 85 140 L 155 140 L 164 155 C 166 161 166 178 145 186 L 95 186 C 74 178 74 161 76 155 Z" fill="#0D1B2A"/>
    <ellipse cx="120" cy="155" rx="44" ry="7" fill="#1B2A4A"/>

    <!-- Fountain Pen angled dynamically, dipping into the ink -->
    <g transform="rotate(-35, 120, 110)">
      <!-- Pen Body (Upper Barrel) -->
      <rect x="110" y="30" width="20" height="60" rx="4" fill="#E6E8EC"/>
      
      <!-- Pen Clip -->
      <rect x="118" y="35" width="4" height="35" rx="2" fill="#F0A500"/>

      <!-- Pen Grip Section -->
      <rect x="111" y="90" width="18" height="25" rx="2" fill="#2E3646"/>

      <!-- Gold Nib -->
      <path d="M 111 115 L 129 115 L 124 145 C 124 148 120 152 120 152 C 120 152 116 148 116 145 Z" fill="#F0A500"/>
      
      <!-- Nib slit and breather hole -->
      <circle cx="120" cy="123" r="1.5" fill="#1A1D24"/>
      <line x1="120" y1="125" x2="120" y2="142" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Droplets & Ink Splashes (indicating writing/usage context) -->
    <circle cx="78" cy="125" r="3.5" fill="#F0A500" opacity="0.9"/>
    <circle cx="168" cy="115" r="2" fill="#F0A500" opacity="0.8"/>
    
    <!-- Ripple lines on ink surface -->
    <ellipse cx="120" cy="155" rx="20" ry="3" fill="none" stroke="#2D4A77" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>