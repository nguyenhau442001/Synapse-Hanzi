<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow representing relief and safety -->
  <circle cx="120" cy="120" r="70" fill="#242B38"/>
  <circle cx="120" cy="120" r="50" fill="#2E384A"/>

  <!-- Central Physical Object: Modern Car Seatbelt Buckled across a safe occupant representation -->
  <!-- Seatbelt anchor top left -->
  <path d="M60 50 L95 160" stroke="#3A465B" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Main diagonal safety belt (Bright gold/amber for focus, indicating "庆幸" relief/safety) -->
  <path d="M65 50 L165 175" stroke="#F5A623" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Seatbelt texture lines for realism -->
  <path d="M72 55 L158 170" stroke="#F8C355" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/>

  <!-- Buckle mechanism at the hip (center-right) -->
  <g transform="translate(130, 140)">
    <!-- Buckle base -->
    <rect x="-16" y="-12" width="32" height="24" rx="6" fill="#D8DEE9"/>
    <!-- Red release button -->
    <rect x="-6" y="-8" width="12" height="16" rx="3" fill="#E74C3C"/>
    <!-- Metal tongue inserted -->
    <path d="M-22 -4 L-16 -4 L-16 4 L-22 4 Z" fill="#9DAABF"/>
  </g>

  <!-- Checkmark badge overlay signifying "safe / saved / lucky outcome" -->
  <g transform="translate(165, 80)">
    <circle cx="0" cy="0" r="22" fill="#2ECC71"/>
    <path d="M-8 0 L-2 6 L10 -6" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>