  <path d="M 175 110 L 202 110 L 195 118 L 178 118 Z" fill="#20BF6B"/>
  <!-- Eye -->
  <circle cx="188" cy="100" r="3.5" fill="#FFA502"/>
  <circle cx="189" cy="100" r="1.5" fill="#1A1D24"/>

  <!-- Dorsal plates / spikes (Modern iconic accent in gold/orange) -->
