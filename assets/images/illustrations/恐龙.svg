  <path d="M10 205 Q 90 195, 170 215 T 240 210" fill="none" stroke="#262B35" stroke-width="2"/>

  <!-- Dinosaur illustration (T-Rex / 恐龙) -->
  <!-- Tail -->
  <path d="M 65 140 Q 40 130, 30 100 Q 45 120, 60 130 Z" fill="#2ED573"/>
  
  <!-- Back and Body -->
  <path d="M 60 130 C 60 90, 90 85, 120 90 C 150 95, 175 110, 185 135 C 195 160, 175 170, 140 170 C 105 170, 65 160, 60 130 Z" fill="#2ED573"/>

