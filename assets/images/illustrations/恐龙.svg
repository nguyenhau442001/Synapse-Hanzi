  <!-- Legs -->
  <path d="M 95 165 L 90 195 L 105 195 L 110 165 Z" fill="#20BF6B"/>
  <path d="M 140 165 L 145 195 L 160 195 L 150 165 Z" fill="#20BF6B"/>
  <!-- Feet / Claws -->
  <path d="M 85 195 L 110 195 L 108 202 L 87 202 Z" fill="#1B9CFC"/>
  <path d="M 138 195 L 163 195 L 161 202 L 140 202 Z" fill="#1B9CFC"/>

  <!-- Head & Neck -->
