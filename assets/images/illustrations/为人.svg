<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character: The respected elder (representing the '为人' / conduct) -->
  <!-- Posture: Upright, dignified, slight bow of respect/humility -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 120 L40 60 C40 40 60 30 80 30 C100 30 120 40 120 60 L120 120" fill="#3D4451"/>
    <!-- Head -->
    <circle cx="80" cy="30" r="20" fill="#FFD180"/>
    <!-- Hair (Elderly style) -->
    <path d="M65 30 C65 15 95 15 95 30" fill="#E0E0E0"/>
    <!-- Arm gesturing towards others (Open palm, welcoming/respectful) -->
    <path d="M40 70 L20 90" stroke="#FFD180" stroke-width="8" stroke-linecap="round"/>
    <circle cx="15" cy="95" r="6" fill="#FFD180"/>
  </g>

  <!-- Interaction: The act of '为人' (Conducting oneself towards others) -->
  <!-- Represented by a younger person receiving guidance/respect -->
  <g transform="translate(140, 110)">
    <!-- Younger figure -->
    <circle cx="20" cy="20" r="12" fill="#81C784"/>
    <path d="M20 32 L20 70" stroke="#81C784" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 50 L35 50" stroke="#81C784" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Motion/Action lines indicating the exchange of respect and character -->
  <path d="M100 90 Q120 70 140 90" stroke="#FFD180" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M100 100 Q120 80 140 100" stroke="#FFD180" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- Ground line -->
  <path d="M20 200 L220 200" stroke="#3D4451" stroke-width="2"/>
</svg>