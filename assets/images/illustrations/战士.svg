<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Background (Snowy Frontier Night) -->
  <g opacity="0.8">
    <!-- Distant snowy mountains -->
    <polygon points="20,160 80,100 140,160 200,110 240,150 240,200 0,200 0,160" fill="#242B35"/>
    <polygon points="70,110 110,70 160,120 220,80 240,100 240,150 200,110 140,160 80,100" fill="#2E3748"/>
    <!-- Snow caps highlights -->
    <polyline points="70,110 110,70 160,120" fill="none" stroke="#A6B9D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="20,160 80,100" fill="none" stroke="#A6B9D0" stroke-width="2" stroke-linecap="round"/>
    <polyline points="160,120 220,80 240,100" fill="none" stroke="#A6B9D0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Falling Snowflakes -->
  <g fill="#8FA3BC" opacity="0.7">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="75" cy="30" r="2"/>
    <circle cx="120" cy="65" r="1"/>
    <circle cx="170" cy="40" r="1.5"/>
    <circle cx="205" cy="70" r="2"/>
    <circle cx="30" cy="95" r="1"/>
    <circle cx="95" cy="115" r="1.5"/>
    <circle cx="150" cy="90" r="2"/>
    <circle cx="220" cy="120" r="1"/>
  </g>

  <!-- Border Post (哨所柱标记) -->
  <g transform="translate(160, 95)">
    <!-- Wooden/Concrete Post -->
    <rect x="0" y="0" width="16" height="85" fill="#3D4A5E" rx="2"/>
    <!-- Red and white stripes characteristic of border markers -->
    <path d="M0,0 h16 v15 h-16 z" fill="#D94E4E"/>
    <path d="M0,25 h16 v15 h-16 z" fill="#D94E4E"/>
    <path d="M0,50 h16 v15 h-16 z" fill="#D94E4E"/>
    <!-- Snow accumulated on top of the post -->
    <path d="M-2,2 C-2,2 2,-4 8,-4 C14,-4 18,2 18,2 C18,2 14,5 8,5 C2,5 -2,2 -2,2 Z" fill="#E8EEF5"/>
  </g>

  <!-- Central Character: Border Soldier / 战士 -->
  <g transform="translate(65, 75)">
    <!-- Standing Body / Uniform (Dark green/slate military winter gear) -->
    <!-- Legs -->
    <rect x="34" y="90" width="14" height="40" fill="#2E4033" rx="4"/>
    <rect x="52" y="90" width="14" height="40" fill="#2E4033" rx="4"/>
    <!-- Boots -->
    <path d="M30,126 h18 v7 c0,2 -2,4 -4,4 h-10 c-2,0 -4-2 -4-4 z" fill="#1C251F"/>
    <path d="M48,126 h18 v7 c0,2 -2,4 -4,4 h-10 c-2,0 -4-2 -4-4 z" fill="#1C251F"/>

    <!-- Torso & Heavy Winter Coat -->
    <path d="M28,40 Q50,35 72,40 L76,95 Q50,102 24,95 Z" fill="#3A5042"/>
    <!-- Coat Details / Belt -->
    <rect x="26" y="72" width="48" height="8" fill="#243329"/>
    <rect x="44" y="70" width="12" height="12" fill="#D4AF37" rx="2"/> <!-- Golden Belt Buckle -->

    <!-- Coat Collar with Fur Lining -->
    <path d="M36,36 L50,48 L64,36 C64,36 68,28 50,28 C32,28 36,36 36,36 Z" fill="#E8EEF5"/>

    <!-- Head & Ushanka Winter Hat (军D帽) -->
    <!-- Hat Flaps Down / Warm Cap -->
    <circle cx="50" cy="22" r="16" fill="#3A5042"/>
    <!-- Ear flaps -->
    <path d="M34,20 C32,32 36,40 38,40 C40,40 39,26 36,20 Z" fill="#3A5042"/>
    <path d="M66,20 C68,32 64,40 62,40 C60,40 61,26 64,20 Z" fill="#3A5042"/>
    <!-- Hat Front Badge Base (Red Star accent) -->
    <circle cx="50" cy="16" r="3" fill="#D94E4E"/>

    <!-- Face Profile (Determined, facing left/forward) -->
    <path d="M42,16 C42,16 43,26 48,26 C53,26 56,22 56,18 Z" fill="#F2D3BC"/>

    <!-- Arms & Rifle -->
    <!-- Back Arm -->
    <path d="M32,45 L15,65 L22,70 L36,55 Z" fill="#2E4033"/>
    
    <!-- Rifle / Weapon (Held firmly) -->
    <!-- Barrel -->
    <line x1="5" y1="35" x2="65" y2="75" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="38" x2="60" y2="72" stroke="#8FA3BC" stroke-width="2" stroke-linecap="round"/>
    <!-- Stock & Scope details -->
    <rect x="55" y="65" width="18" height="8" rx="2" fill="#3D4A5E" transform="rotate(33 55 65)"/>

    <!-- Front Arm (Grasping rifle) -->
    <path d="M52,48 L42,68 L52,73 L62,55 Z" fill="#3A5042"/>
    <!-- Glove -->
    <circle cx="47" cy="70" r="5" fill="#1C251F"/>
  </g>

  <!-- High-contrast Focus Accent (Warm Gold Glow / Dawn light breaking through cold) -->
  <circle cx="168" cy="100" r="4" fill="#D4AF37"/>
  <circle cx="168" cy="100" r="12" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>

  <!-- Ground Snow Drift -->
  <path d="M0,200 Q60,190 120,205 Q180,220 240,200 L240,240 L0,240 Z" fill="#E8EEF5"/>
  <path d="M0,208 Q90,200 160,212 Q210,220 240,210 L240,240 L0,240 Z" fill="#D1DBE5" opacity="0.6"/>
</svg>