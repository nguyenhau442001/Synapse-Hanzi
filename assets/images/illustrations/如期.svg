<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definition Context: "如期" (On time / As scheduled - Construction completion example) -->
  <!-- Adjective/Descriptive Rule: Distinct contrast (Chaos/Night vs Synchronized/Completed precision) or Scale exaggeration representing the exact deadline hit -->
  
  <g transform="translate(0, 0)">
    <!-- Background subtle architectural blueprint grid -->
    <path d="M40 180 L200 180" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M40 140 L200 140" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M40 100 L200 100" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Clock representing the exact schedule (The 'Qí' 期 part - timeframe/deadline met) -->
    <circle cx="120" cy="70" r="32" fill="#222733" stroke="#3A4256" stroke-width="3"/>
    <!-- Clock hands hitting the exact target time -->
    <path d="M120 70 L120 52" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 70 L134 78" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <!-- Center pin -->
    <circle cx="120" cy="70" r="4" fill="#FF9F43"/>
    
    <!-- Glowing checkmark badge indicating "On Time / As Scheduled" achievement -->
    <circle cx="120" cy="70" r="16" fill="#2EC4B6" opacity="0.2"/>
    <path d="M112 70 L118 76 L130 62" fill="none" stroke="#2EC4B6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Completed Modern Architecture Building (Project delivery) -->
    <!-- Base platform -->
    <rect x="60" y="180" width="120" height="8" rx="2" fill="#3A4256"/>
    
    <!-- Building structure (Sleek modern high-rise) -->
    <path d="M85 180 L85 110 L155 110 L155 180 Z" fill="#283040"/>
    
    <!-- Architectural panels & glowing windows (Representing finished construction) -->
    <rect x="93" y="120" width="14" height="20" rx="2" fill="#FF9F43" opacity="0.8"/>
    <rect x="113" y="120" width="14" height="20" rx="2" fill="#FF9F43" opacity="0.8"/>
    <rect x="133" y="120" width="14" height="20" rx="2" fill="#FF9F43" opacity="0.8"/>

    <rect x="93" y="148" width="14" height="20" rx="2" fill="#FF9F43" opacity="0.8"/>
    <rect x="113" y="148" width="14" height="20" rx="2" fill="#FF9F43" opacity="0.8"/>
    <rect x="133" y="148" width="14" height="20" rx="2" fill="#FF9F43" opacity="0.8"/>

    <!-- Building Crown / Pinnacle -->
    <polygon points="120,92 155,110 85,110" fill="#3A4256"/>
    <rect x="118" y="78" width="4" height="16" fill="#FF9F43"/>

    <!-- Contrast elements (Scale/Timeline alignment indicators) -->
    <!-- Left marker: Start / Effort -->
    <circle cx="50" cy="180" r="5" fill="#4A5568"/>
    <!-- Right marker: Exact Deadline Hit -->
    <circle cx="190" cy="180" r="5" fill="#2EC4B6"/>
    
    <!-- Connecting target path showing successful delivery right on schedule -->
    <path d="M50 180 Q 120 195 190 180" fill="none" stroke="#2EC4B6" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Decorative status elements - Clean flat design highlights -->
    <path d="M35 125 L45 135 L60 115" fill="none" stroke="#2EC4B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M180 125 L190 135 L205 115" fill="none" stroke="#2EC4B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>