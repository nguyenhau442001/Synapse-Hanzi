<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Space Elements -->
  <g fill="#4A5568">
    <circle cx="45" cy="65" r="1" opacity="0.6"/>
    <circle cx="195" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="210" cy="180" r="1" opacity="0.5"/>
    <circle cx="50" cy="190" r="1.5" opacity="0.7"/>
    <circle cx="95" cy="40" r="0.8" opacity="0.4"/>
    <circle cx="150" cy="210" r="1.2" opacity="0.6"/>
    <circle cx="25" cy="120" r="1" opacity="0.5"/>
  </g>

  <!-- Distant Planet / Horizon Arc -->
  <path d="M-40 240 C30 180, 150 180, 280 240 Z" fill="#2D3748" opacity="0.4"/>
  <path d="M-20 240 C40 190, 140 190, 260 240 Z" fill="#3182CE" opacity="0.15"/>

  <!-- Orbit Path (Subtle) -->
  <path d="M 20 140 Q 120 70, 220 140" fill="none" stroke="#4A5568" stroke-width="0.75" stroke-dasharray="3,4" opacity="0.4"/>

  <!-- Space Station (Tiangong Style / Modular Space Station) -->
  <g transform="translate(120, 115)">
    
    <!-- Solar Panels - Left Wing -->
    <g transform="translate(-65, -15)">
      <rect x="-35" y="-12" width="32" height="24" rx="2" fill="#2B6CB0" stroke="#63B3ED" stroke-width="1.5"/>
      <line x1="-25" y1="-12" x2="-25" y2="12" stroke="#1A365D" stroke-width="1"/>
      <line x1="-15" y1="-12" x2="-15" y2="12" stroke="#1A365D" stroke-width="1"/>
      <rect x="-32" y="-9" width="5" height="18" fill="#E2E8F0" opacity="0.2"/>
      
      <rect x="-72" y="-12" width="32" height="24" rx="2" fill="#2B6CB0" stroke="#63B3ED" stroke-width="1.5"/>
      <line x1="-62" y1="-12" x2="-62" y2="12" stroke="#1A365D" stroke-width="1"/>
      <line x1="-52" y1="-12" x2="-52" y2="12" stroke="#1A365D" stroke-width="1"/>
      <rect x="-69" y="-9" width="5" height="18" fill="#E2E8F0" opacity="0.2"/>
      
      <!-- Truss Connector Left -->
      <rect x="-3" y="-5" width="6" height="10" fill="#718096"/>
    </g>

    <!-- Solar Panels - Right Wing -->
    <g transform="translate(65, -15)">
      <rect x="3" y="-12" width="32" height="24" rx="2" fill="#2B6CB0" stroke="#63B3ED" stroke-width="1.5"/>
      <line x1="15" y1="-12" x2="15" y2="12" stroke="#1A365D" stroke-width="1"/>
      <line x1="25" y1="-12" x2="25" y2="12" stroke="#1A365D" stroke-width="1"/>
      <rect x="27" y="-9" width="5" height="18" fill="#E2E8F0" opacity="0.2"/>
      
      <rect x="40" y="-12" width="32" height="24" rx="2" fill="#2B6CB0" stroke="#63B3ED" stroke-width="1.5"/>
      <line x1="52" y1="-12" x2="52" y2="12" stroke="#1A365D" stroke-width="1"/>
      <line x1="62" y1="-12" x2="62" y2="12" stroke="#1A365D" stroke-width="1"/>
      <rect x="64" y="-9" width="5" height="18" fill="#E2E8F0" opacity="0.2"/>
      
      <!-- Truss Connector Right -->
      <rect x="-3" y="-5" width="6" height="10" fill="#718096"/>
    </g>

    <!-- Main Core Module (Horizontal Cylinder) -->
    <rect x="-35" y="-12" width="70" height="24" rx="12" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1.5"/>
    
    <!-- Module Details & Seams -->
    <line x1="-15" y1="-12" x2="-15" y2="12" stroke="#CBD5E0" stroke-width="1.5"/>
    <line x1="15" y1="-12" x2="15" y2="12" stroke="#CBD5E0" stroke-width="1.5"/>
    
    <!-- Docking Port / Front Module -->
    <rect x="-50" y="-8" width="16" height="16" rx="3" fill="#A0AEC0" stroke="#CBD5E0" stroke-width="1"/>
    <circle cx="-50" cy="0" r="4" fill="#4A5568"/>

    <!-- Laboratory / Secondary Module (T-Shape Extension) -->
    <rect x="-12" y="-32" width="24" height="24" rx="6" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1.5"/>
    <line x1="-12" y1="-20" x2="12" y2="-20" stroke="#CBD5E0" stroke-width="1"/>

    <!-- Accent Elements (Focus Color: Warm Gold/Orange for scientific instrumentation & docking) -->
    <circle cx="0" cy="0" r="3" fill="#DD6B20"/>
    <rect x="-25" y="-6" width="6" height="3" rx="1.5" fill="#DD6B20"/>
    <rect x="18" y="3" width="6" height="3" rx="1.5" fill="#DD6B20"/>
    
    <!-- Small Dish Antenna -->
    <path d="M 28,-18 L 35,-25 M 32,-23 C 35,-22 36,-20 35,-18" fill="none" stroke="#CBD5E0" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="35" cy="-21" r="2" fill="#DD6B20"/>

  </g>

</svg>