<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Desk and Notebook -->
    <path d="M50 175 L190 175 L180 195 L60 195 Z" fill="#2E3440" />
    
    <!-- Open Notebook -->
    <path d="M85 145 L120 135 L155 145 L155 175 L120 180 L85 175 Z" fill="#ECEFF4" />
    <path d="M120 135 L120 180" fill="none" stroke="#D8DEE9" stroke-width="2" />
    <!-- Notebook lines -->
    <line x1="95" y1="150" x2="112" y2="147" stroke="#D8DEE9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="93" y1="157" x2="114" y2="154" stroke="#D8DEE9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="95" y1="164" x2="112" y2="161" stroke="#D8DEE9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="128" y1="147" x2="145" y2="150" stroke="#D8DEE9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="126" y1="154" x2="147" y2="157" stroke="#D8DEE9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="128" y1="161" x2="145" y2="164" stroke="#D8DEE9" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hand holding pen -->
    <path d="M135 155 L165 115" stroke="#D08770" stroke-width="4" stroke-linecap="round"/>
    <polygon points="163,113 172,108 167,118" fill="#4C566A" />

    <!-- Character Body / Shoulders -->
    <path d="M65 210 C65 185 90 175 120 175 C150 175 175 185 175 210 Z" fill="#4C566A" />
    <path d="M90 175 L120 195 L150 175" fill="#3B4252" />

    <!-- Neck -->
    <rect x="110" y="150" width="20" height="30" fill="#D08770" />

    <!-- Head -->
    <circle cx="120" cy="115" r="32" fill="#D08770" />

    <!-- Hair -->
    <path d="M88 115 C88 92 102 83 120 83 C138 83 152 92 152 115 C152 120 150 125 150 125 L145 100 L120 90 L95 100 L90 125 C90 125 88 120 88 115 Z" fill="#2E3440" />

    <!-- Face Details (Focused, Eyes Down to Notebook) -->
    <!-- Glasses for intellectual/meeting look -->
    <rect x="101" y="106" width="16" height="11" rx="2" fill="none" stroke="#ECEFF4" stroke-width="2" />
    <rect x="123" y="106" width="16" height="11" rx="2" fill="none" stroke="#ECEFF4" stroke-width="2" />
    <line x1="117" y1="111" x2="123" y2="111" stroke="#ECEFF4" stroke-width="2" />

    <!-- Eyes (looking down at notebook) -->
    <circle cx="109" cy="112" r="1.5" fill="#2E3440" />
    <circle cx="131" cy="112" r="1.5" fill="#2E3440" />

    <!-- MOUTH: Firmly closed, straight line emphasizing "一言不发" (No words spoken) -->
    <line x1="113" y1="131" x2="127" y2="131" stroke="#2E3440" stroke-width="2.5" stroke-linecap="round" />

    <!-- Subtle accent glow to create modern UI contrast -->
    <circle cx="120" cy="115" r="55" fill="none" stroke="#EBCB8B" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6" />
  </g>
</svg>