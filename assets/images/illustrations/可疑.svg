<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Shadow / Glow for Suspense -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Suspicious Figure (Person) -->
  <g transform="translate(0, 5)">
    <!-- Trench coat shoulders/body -->
    <path d="M 75 165 L 85 115 L 100 105 L 140 105 L 155 115 L 165 165 Z" fill="#2D3748"/>
    <path d="M 100 105 L 120 135 L 140 105 Z" fill="#1A202C"/>

    <!-- Raised collar (classic hiding face look) -->
    <path d="M 90 115 L 100 95 L 120 105 L 140 95 L 150 115 Z" fill="#4A5568"/>

    <!-- Head -->
    <circle cx="120" cy="75" r="22" fill="#E2E8F0"/>

    <!-- Fedora / Hat pulled down casting a shadow over eyes -->
    <path d="M 92 65 Q 120 50 148 65 Q 155 68 150 72 Q 120 62 90 72 Q 85 68 92 65 Z" fill="#1A202C"/>
    <path d="M 98 58 Q 120 48 142 58 Q 120 54 98 58 Z" fill="#2D3748"/>

    <!-- Shadow over upper face -->
    <path d="M 98 68 Q 120 63 142 68 L 138 78 Q 120 72 102 78 Z" fill="#1A202C" opacity="0.85"/>
  </g>

  <!-- High-contrast Focus Element: Shifting/Glancing Eyes & Magnifying Glass of Scrutiny -->
  <!-- Glowing Question Mark / Suspicion Indicator floating near -->
  <path d="M 160 70 Q 160 55 175 55 Q 190 55 190 70 Q 190 82 175 90 L 175 105" fill="none" stroke="#F6AD55" stroke-width="6" stroke-linecap="round"/>
  <circle cx="175" cy="120" r="3.5" fill="#F6AD55"/>

  <!-- Scanning / Investigation Accent (Magnifying glass focusing on the figure) -->
  <g transform="translate(55, 105)">
    <circle cx="35" cy="35" r="24" fill="none" stroke="#ED8936" stroke-width="4" stroke-dasharray="115" stroke-dashoffset="30" transform="rotate(-45 35 35)"/>
    <!-- Glass reflection -->
    <path d="M 22 22 Q 28 18 34 22" fill="none" stroke="#ED8936" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Handle -->
    <line x1="52" y1="52" x2="70" y2="70" stroke="#ED8936" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Subtle Warning Elements (Diagonal caution stripes at bottom border for context) -->
  <path d="M 24 210 L 216 210" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
</svg>