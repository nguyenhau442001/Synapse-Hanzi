<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Blueprint Grid Background -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="0.5">
    <line x1="30" y1="30" x2="210" y2="30"/>
    <line x1="30" y1="70" x2="210" y2="70"/>
    <line x1="30" y1="110" x2="210" y2="110"/>
    <line x1="30" y1="150" x2="210" y2="150"/>
    <line x1="30" y1="190" x2="210" y2="190"/>
    
    <line x1="30" y1="30" x2="30" y2="190"/>
    <line x1="70" y1="30" x2="70" y2="190"/>
    <line x1="110" y1="30" x2="110" y2="190"/>
    <line x1="150" y1="30" x2="150" y2="190"/>
    <line x1="190" y1="30" x2="190" y2="190"/>
  </g>

  <!-- Dimension Lines / Technical Spec Markings -->
  <g stroke="#F59E0B" stroke-width="1.5" opacity="0.8">
    <!-- Top Horizontal Dimension -->
    <line x1="65" y1="50" x2="175" y2="50"/>
    <line x1="65" y1="45" x2="65" y2="55"/>
    <line x1="175" y1="45" x2="175" y2="55"/>
    <polyline points="70,47 65,50 70,53" fill="none"/>
    <polyline points="170,47 175,50 170,53" fill="none"/>

    <!-- Left Vertical Dimension -->
    <line x1="50" y1="65" x2="50" y2="175"/>
    <line x1="45" y1="65" x2="55" y2="65"/>
    <line x1="45" y1="175" x2="55" y2="175"/>
    <polyline points="47,70 50,65 53,70" fill="none"/>
    <polyline points="47,170 50,175 53,170" fill="none"/>
  </g>

  <!-- Precision Mechanical Gear (The Physical Object representing standard/specifications) -->
  <g transform="translate(120, 120)">
    <!-- Outer Gear Body -->
    <path d="M-20,-50 L20,-50 L25,-38 L42,-42 L48,-25 L60,-20 L55,-3 L68,10 L58,25 L65,40 L48,45 L42,60 L25,55 L20,68 L-20,68 L-25,55 L-42,60 L-48,45 L-65,40 L-58,25 L-68,10 L-55,-3 L-60,-20 L-48,-25 L-42,-42 L-25,-38 Z" 
          fill="#334155" stroke="#64748B" stroke-width="3" stroke-linejoin="round"/>
          
    <!-- Gear Inner Circle -->
    <circle cx="0" cy="0" r="35" fill="#1E293B" stroke="#0EA5E9" stroke-width="3"/>
    
    <!-- Central Precision Hole -->
    <circle cx="0" cy="0" r="15" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Alignment / Tech Crosshair Marker -->
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Highlight Indicator Accents -->
  <circle cx="120" cy="120" r="55" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
</svg>