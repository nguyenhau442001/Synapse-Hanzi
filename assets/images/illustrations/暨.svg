<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "暨" (jì) as a formal, dual-event connection: 
       A podium/stage setting with two distinct focal points 
       connected by a shared, elegant golden ribbon/pathway. -->
  
  <!-- Left Object: University Anniversary (70th) -->
  <g transform="translate(60, 100)">
    <path d="M0,0 L40,0 L35,40 L5,40 Z" fill="#FFB84D"/>
    <rect x="10" y="40" width="20" height="30" fill="#FFB84D"/>
    <circle cx="20" cy="-15" r="12" fill="#FFB84D"/>
  </g>
  
  <!-- Right Object: New Building Inauguration -->
  <g transform="translate(140, 80)">
    <rect x="0" y="0" width="40" height="60" fill="#4D94FF"/>
    <rect x="10" y="10" width="20" height="10" fill="#1A1D24"/>
    <rect x="10" y="30" width="20" height="10" fill="#1A1D24"/>
  </g>
  
  <!-- The "Connector" (暨 - meaning 'and/together with') -->
  <path d="M80,150 C100,130 140,130 160,150" stroke="#FFB84D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M120,140 L120,160" stroke="#FFB84D" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Base platform connecting both -->
  <rect x="40" y="170" width="160" height="8" rx="4" fill="#3E4451"/>
</svg>