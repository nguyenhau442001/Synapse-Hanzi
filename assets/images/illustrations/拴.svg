<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ground Line / Steppe horizon suggestion -->
  <path d="M 30 185 L 210 185" stroke="#2B323D" stroke-width="3" stroke-linecap="round"/>

  <!-- Wooden Stake (Robust post driven into the ground) -->
  <path d="M 85 95 L 105 95 L 110 185 L 80 185 Z" fill="#784B29"/>
  <!-- Stake wood grain / top -->
  <ellipse cx="95" cy="95" rx="10" ry="4" fill="#9C6237"/>
  <path d="M 92 110 L 98 175" stroke="#5A351B" stroke-width="2" stroke-linecap="round"/>

  <!-- Secure Tether / Knot (Highlighting the action of "拴" - tying/binding) -->
  <!-- Rope coming from background (representing the horse/animal) -->
  <path d="M 180 140 Q 140 120 100 135" fill="none" stroke="#D18941" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Rope wrapped around the wooden stake (tight loops) -->
  <path d="M 100 135 C 115 130, 115 145, 95 148" fill="none" stroke="#E29B4F" stroke-width="7" stroke-linecap="round"/>
  <path d="M 95 148 C 80 152, 95 162, 105 158" fill="none" stroke="#C07735" stroke-width="7" stroke-linecap="round"/>

  <!-- Rope end hanging down loosely -->
  <path d="M 105 158 C 110 170, 100 180, 105 195" fill="none" stroke="#D18941" stroke-width="6" stroke-linecap="round"/>
  <!-- Frayed rope end -->
  <path d="M 102 195 L 108 200 M 105 195 L 105 201" stroke="#E29B4F" stroke-width="2" stroke-linecap="round"/>

  <!-- Tension / Focus Indicator (Golden/Orange highlight to draw eye to the knot) -->
  <circle cx="97" cy="145" r="16" fill="none" stroke="#F6AD55" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="97" cy="145" r="24" fill="none" stroke="#F6AD55" stroke-width="1" opacity="0.3"/>

  <!-- Subtle atmospheric detailing (Nomadic tent silhouette background) -->
  <path d="M 155 185 L 180 130 L 205 185 Z" fill="#242B35"/>
  <path d="M 180 130 L 180 185" stroke="#1A1D24" stroke-width="2"/>
</svg>