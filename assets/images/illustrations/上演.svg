<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle stage floor and background elements -->
  <g transform="translate(0, 15)">
    <!-- Backstage wall -->
    <rect x="25" y="25" width="190" height="150" rx="6" fill="#222732" />
    
    <!-- Dramatic stage curtains left and right -->
    <path d="M25 25 L55 25 L45 175 L25 175 Z" fill="#3D2633" opacity="0.9"/>
    <path d="M55 25 L80 25 L65 175 L45 175 Z" fill="#4E3142" opacity="0.9"/>
    
    <path d="M215 25 L185 25 L195 175 L215 175 Z" fill="#3D2633" opacity="0.9"/>
    <path d="M185 25 L160 25 L175 175 L195 175 Z" fill="#4E3142" opacity="0.9"/>

    <!-- Curtain top pelmet/valance -->
    <path d="M25 25 L215 25 L215 45 L120 55 L25 45 Z" fill="#5E3C53"/>

    <!-- Dramatic spotlight beam effect -->
    <path d="M120 25 L65 175 L175 175 Z" fill="#F5A623" opacity="0.08"/>

    <!-- Stage floor -->
    <rect x="20" y="175" width="200" height="12" fill="#2C3240" rx="2"/>
    <rect x="15" y="187" width="210" height="6" fill="#1E232D" rx="2"/>

    <!-- Central physical object/character representing a theatrical performance (上演) -->
    <!-- Stylized drama masks (comedy & tragedy) mounted on a performance stand / central focus -->
    <g transform="translate(120, 105)">
      <!-- Spotlight fixture hint at top -->
      <path d="M-15 -80 L15 -80 L10 -65 L-10 -65 Z" fill="#4A5265"/>
      <circle cx="0" cy="-72.5" r="4" fill="#F5A623" />

      <!-- Center pedestal/stand pole -->
      <rect x="-3" y="-55" width="6" height="110" fill="#4A5265" rx="2"/>
      <ellipse cx="0" cy="55" rx="18" ry="6" fill="#4A5265"/>

      <!-- Theater Mask 1: Comedy (Gold/Orange accent) -->
      <g transform="translate(-16, -15)">
        <path d="M-14 -18 C-14 -28 14 -28 14 -18 C14 2 12 18 0 22 C-12 18 -14 2 -14 -18 Z" fill="#F5A623"/>
        <!-- Eyes (happy curves) -->
        <path d="M-8 -15 Q-5 -20 -2 -15" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M2 -15 Q5 -20 8 -15" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <!-- Big happy smile -->
        <path d="M-7 3 Q0 12 7 3" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Theater Mask 2: Tragedy (Cool silver/blue contrast, slightly behind/offset) -->
      <g transform="translate(16, -5)">
        <path d="M-14 -18 C-14 -28 14 -28 14 -18 C14 2 12 18 0 22 C-12 18 -14 2 -14 -18 Z" fill="#8FA3BF"/>
        <!-- Eyes -->
        <circle cx="-5" cy="-15" r="2.5" fill="#1A1D24"/>
        <circle cx="5" cy="-15" r="2.5" fill="#1A1D24"/>
        <!-- Sad mouth -->
        <path d="M-6 8 Q0 2 6 8" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- Floating subtle performance sparkles / confetti for "debut/premiere/staging" action -->
    <circle cx="85" cy="70" r="2" fill="#F5A623" opacity="0.8"/>
    <circle cx="155" cy="65" r="2.5" fill="#F5A623" opacity="0.9"/>
    <circle cx="70" cy="120" r="1.5" fill="#8FA3BF" opacity="0.7"/>
    <circle cx="170" cy="110" r="2" fill="#F5A623" opacity="0.7"/>
  </g>
</svg>