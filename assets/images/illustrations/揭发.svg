<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Document with hidden details being pulled out -->
    <rect x="20" y="20" width="80" height="100" rx="4" fill="#3A3F4B" stroke="#FFB800" stroke-width="3"/>
    <line x1="35" y1="40" x2="85" y2="40" stroke="#5D6475" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="55" x2="85" y2="55" stroke="#5D6475" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="70" x2="65" y2="70" stroke="#5D6475" stroke-width="4" stroke-linecap="round"/>
    
    <!-- The "Revealed" element -->
    <path d="M70 80 L110 40 L130 60 L90 100 Z" fill="#FFB800"/>
    <circle cx="100" cy="70" r="12" fill="#1A1D24"/>
    <path d="M95 70 L100 75 L105 65" stroke="#FFB800" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Hand pulling the reveal -->
    <path d="M100 90 L120 110 L130 100 L110 80 Z" fill="#E0E0E0"/>
    <rect x="110" y="100" width="10" height="20" rx="2" fill="#E0E0E0"/>
  </g>
</svg>