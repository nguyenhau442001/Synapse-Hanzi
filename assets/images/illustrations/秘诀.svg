<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative academic elements -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1.5" fill="none">
    <circle cx="120" cy="120" r="90"/>
    <circle cx="120" cy="120" r="70"/>
    <path d="M120 20 L120 220 M20 120 L220 120" stroke-dasharray="4 4"/>
  </g>

  <!-- Physical Object representing "秘诀" (The Secret Key / Core Formula) -->
  <!-- Centerpiece: An intricate, glowing golden ancient key combined with modern academic geometry -->  
  
  <g transform="translate(120, 120)">
    <!-- Glowing aura behind the key -->
    <circle cx="0" cy="0" r="55" fill="#F59E0B" opacity="0.12" filter="blur(8px)"/>
    
    <!-- Key Bow (Top circular handle with mathematical/geometric star motif) -->
    <circle cx="0" cy="-62" r="22" fill="none" stroke="#F59E0B" stroke-width="6"/>
    <circle cx="0" cy="-62" r="14" fill="#1A1D24"/>
    <path d="M0 -72 L0 -52 M-10 -62 L10 -62" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Key Shaft -->
    <rect x="-4" y="-42" width="8" height="68" rx="3" fill="#F59E0B"/>

    <!-- Academic/Geometric notches on the key shaft representing steps/formula -->
    <rect x="-12" y="-15" width="8" height="6" rx="1.5" fill="#F59E0B"/>
    <rect x="-16" y="2" width="12" height="6" rx="1.5" fill="#F59E0B"/>
    <rect x="-14" y="19" width="10" height="6" rx="1.5" fill="#F59E0B"/>

    <!-- Glowing focal points (Sparkles representing insight/discovery) -->
    <g fill="#38BDF8">
      <circle cx="-35" cy="-35" r="3"/>
      <circle cx="45" cy="-25" r="2"/>
      <circle cx="30" cy="40" r="3.5"/>
      <circle cx="-40" cy="30" r="2"/>
    </g>

    <!-- Star / Sparkle highlights on the golden key -->
    <path d="M 0 -88 L 3 -80 L 11 -77 L 3 -74 L 0 -66 L -3 -74 L -11 -77 L -3 -80 Z" fill="#FDE68A"/>
    <path d="M 45 10 L 47 15 L 52 17 L 47 19 L 45 24 L 43 19 L 38 17 L 43 15 Z" fill="#FDE68A"/>
  </g>

  <!-- Subtle bottom grounding shadow -->
  <ellipse cx="120" cy="205" rx="35" ry="5" fill="#0F1115" opacity="0.6"/>
</svg>