<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground -->
  <path d="M40 190 H200" stroke="#333842" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Person 1 (The Refugee/Recipient) -->
  <g transform="translate(70, 110)">
    <circle cx="20" cy="20" r="12" fill="#FFB84D"/>
    <path d="M8 45 Q20 35 32 45 L30 80 L10 80 Z" fill="#FFB84D"/>
    <path d="M12 80 L12 110 M28 80 L28 110" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 (The Helper) -->
  <g transform="translate(130, 90)">
    <circle cx="20" cy="20" r="12" fill="#4DA6FF"/>
    <path d="M8 45 Q20 35 32 45 L30 80 L10 80 Z" fill="#4DA6FF"/>
    <path d="M12 80 L12 110 M28 80 L28 110" stroke="#4DA6FF" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- The Aid (Supplies/Package) -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="40" height="35" rx="4" fill="#FFB84D"/>
    <rect x="15" y="0" width="10" height="35" fill="#E69E30"/>
    <path d="M5 5 L35 5 M5 30 L35 30" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Interaction: Hands reaching out -->
  <path d="M105 140 L90 125" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  <path d="M135 140 L150 125" stroke="#4DA6FF" stroke-width="4" stroke-linecap="round"/>
</svg>