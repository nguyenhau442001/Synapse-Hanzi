<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative building silhouette for context (Grand Opening / Ribbon Cutting) -->
  <path d="M50 140 L50 90 L80 70 L110 90 L110 140 Z" fill="#252A34" opacity="0.6"/>
  <path d="M100 140 L100 60 L140 40 L180 60 L180 140 Z" fill="#2D3340" opacity="0.6"/>
  
  <!-- Glass Entrance Doors / Architectural Accent -->
  <rect x="110" y="95" width="20" height="45" fill="#3A4252" opacity="0.5"/>
  <rect x="135" y="95" width="20" height="45" fill="#3A4252" opacity="0.5"/>

  <!-- Festive Banner / Decor -->
  <path d="M30 80 Q120 110 210 80" stroke="#E5C158" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Red Ribbon being cut (Dynamic Action) -->
  <!-- Left static part of ribbon -->
  <path d="M30 150 C70 150 90 148 115 146" stroke="#E54B4B" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Right static part of ribbon -->
  <path d="M135 144 C160 142 180 140 210 140" stroke="#E54B4B" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Falling/Floating Ribbon Ends -->
  <path d="M120 148 Q125 160 120 170" stroke="#C73E3E" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M130 144 Q138 155 135 168" stroke="#E54B4B" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Motion lines for cutting action -->
  <path d="M105 125 Q115 135 122 142" stroke="#E5C158" stroke-width="1.5" stroke-dasharray="2,3" fill="none"/>
  <path d="M145 125 Q135 135 128 142" stroke="#E5C158" stroke-width="1.5" stroke-dasharray="2,3" fill="none"/>

  <!-- Scissors & Human Action (Golden ceremonial giant scissors) -->
  <!-- Scissors Pivot Point -->
  <circle cx="125" cy="118" r="4" fill="#E5C158"/>

  <!-- Upper Scissors Blade & Handle -->
  <path d="M125 118 L95 105" stroke="#D1A73E" stroke-width="4" stroke-linecap="round"/>
  <path d="M95 105 L87 97 C84 94 80 97 83 100 L90 108" stroke="#E5C158" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Handle hole upper -->
  <circle cx="83" cy="98" r="3.5" fill="#1A1D24" stroke="#E5C158" stroke-width="2"/>

  <!-- Lower Scissors Blade & Handle -->
  <path d="M125 118 L97 132" stroke="#B89030" stroke-width="4" stroke-linecap="round"/>
  <path d="M97 132 L91 140 C88 143 84 140 87 137 L93 129" stroke="#E5C158" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Handle hole lower -->
  <circle cx="87" cy="139" r="3.5" fill="#1A1D24" stroke="#E5C158" stroke-width="2"/>

  <!-- Character Hands holding scissors -->
  <!-- Hand holding upper handle -->
  <path d="M85 92 C88 90 92 92 94 95 C96 98 92 102 90 100" fill="#F4A261"/>
  <!-- Hand holding lower handle -->
  <path d="M89 145 C92 147 96 145 98 142 C100 139 96 135 94 137" fill="#F4A261"/>

  <!-- Character Sleeve/Arm -->
  <path d="M75 110 L90 98 C95 105 95 130 90 137 L75 125 Z" fill="#3B82F6"/>

  <!-- Sparkles / Celebration effects at the cut point -->
  <circle cx="126" cy="145" r="2.5" fill="#E5C158"/>
  <path d="M126 137 L126 141" stroke="#E5C158" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M122 145 L120 145" stroke="#E5C158" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M130 145 L132 145" stroke="#E5C158" stroke-width="1.5" stroke-linecap="round"/>
</svg>