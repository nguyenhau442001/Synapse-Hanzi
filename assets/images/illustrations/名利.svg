<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing '名' (Fame/Reputation) as a golden laurel wreath on a pedestal -->
  <g transform="translate(120, 120)">
    <path d="M-40 -20 C-40 -45 -20 -60 0 -60 C20 -60 40 -45 40 -20 L30 -20 C30 -40 15 -50 0 -50 C-15 -50 -30 -40 -30 -20 Z" fill="#FFC107"/>
    <path d="M-45 -25 L-55 -35 M-45 -15 L-55 -5 M45 -25 L55 -35 M45 -15 L55 -5" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Representing '利' (Wealth/Profit) as a stack of gold coins -->
    <ellipse cx="0" cy="40" rx="35" ry="12" fill="#E65100"/>
    <ellipse cx="0" cy="35" rx="35" ry="12" fill="#FF9800"/>
    <ellipse cx="0" cy="30" rx="35" ry="12" fill="#FFC107"/>
    <ellipse cx="0" cy="25" rx="35" ry="12" fill="#FFD54F"/>
    
    <!-- Pedestal base -->
    <rect x="-45" y="52" width="90" height="15" rx="2" fill="#37474F"/>
    <rect x="-55" y="67" width="110" height="8" rx="2" fill="#263238"/>
  </g>
</svg>