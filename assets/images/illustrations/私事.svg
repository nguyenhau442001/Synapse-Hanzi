<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk/Surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#374151"/>
  
  <!-- Personal Diary/Journal representing "Private Matter" -->
  <g transform="translate(80, 80)">
    <!-- Cover -->
    <rect x="0" y="0" width="80" height="100" rx="4" fill="#F59E0B"/>
    <!-- Binding -->
    <rect x="5" y="0" width="5" height="100" fill="#D97706"/>
    <!-- Pages -->
    <rect x="15" y="10" width="55" height="80" rx="2" fill="#E5E7EB"/>
    <line x1="25" y1="25" x2="60" y2="25" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="40" x2="60" y2="40" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="55" x2="50" y2="55" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Privacy Lock Icon (Subtle) -->
  <circle cx="120" cy="130" r="15" fill="#1A1D24"/>
  <path d="M113 125h14v10a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2v-10z" fill="#F59E0B"/>
  <path d="M116 125v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
