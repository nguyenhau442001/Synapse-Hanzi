<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Coastal Landmass Left -->
  <path d="M0,40 Q45,35 60,80 Q75,120 50,160 Q35,180 0,200 Z" fill="#2D3748"/>
  <path d="M0,50 Q40,45 52,85 Q64,120 42,155 Q30,175 0,190 Z" fill="#4A5568" opacity="0.3"/>
  <path d="M0,40 Q45,35 60,80 Q75,120 50,160 Q35,180 0,200 Z" fill="none" stroke="#63B3ED" stroke-width="2" opacity="0.4"/>

  <!-- Coastal Landmass Right -->
  <path d="M240,40 Q195,35 180,80 Q165,120 190,160 Q205,180 240,200 Z" fill="#2D3748"/>
  <path d="M240,50 Q200,45 188,85 Q176,120 198,155 Q210,175 240,190 Z" fill="#4A5568" opacity="0.3"/>
  <path d="M240,40 Q195,35 180,80 Q165,120 190,160 Q205,180 240,200 Z" fill="none" stroke="#63B3ED" stroke-width="2" opacity="0.4"/>

  <!-- Water Body in the Strait (海峡) -->
  <path d="M60,80 Q75,120 50,160 C90,150 150,150 190,160 Q165,120 180,80 C140,90 100,90 60,80 Z" fill="#2B6CB0"/>
  
  <!-- Fast Water Currents (湍急的水流) -->
  <path d="M95,100 C110,105 130,105 145,100" fill="none" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M85,115 C105,120 135,120 155,115" fill="none" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
  <path d="M100,130 C115,135 125,135 140,130" fill="none" stroke="#90CDF4" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M90,145 C115,150 125,150 150,145" fill="none" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Suspension Bridge (跨海悬索大桥) spanning across the strait -->
  <!-- Bridge Towers -->
  <rect x="73" y="65" width="8" height="60" fill="#CBD5E0"/>
  <rect x="71" y="62" width="12" height="4" fill="#E2E8F0"/>
  <rect x="159" y="65" width="8" height="60" fill="#CBD5E0"/>
  <rect x="157" y="62" width="12" height="4" fill="#E2E8F0"/>
  
  <!-- Bridge Deck -->
  <rect x="35" y="95" width="170" height="5" rx="1.5" fill="#ED8936"/>
  <rect x="35" y="94" width="170" height="2" fill="#F6AD55"/>

  <!-- Main Catenary Cables -->
  <path d="M35,95 Q77,65 77,65" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M77,65 C115,100 125,100 163,65" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M163,65 Q205,95 205,95" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Vertical Suspension Wires -->
  <line x1="50" y1="95" x2="50" y2="82" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="63" y1="95" x2="63" y2="72" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="92" y1="95" x2="92" y2="78" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="107" y1="95" x2="107" y2="87" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="120" y1="95" x2="120" y2="90" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="133" y1="95" x2="133" y2="87" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="148" y1="95" x2="148" y2="78" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="177" y1="95" x2="177" y2="72" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="190" y1="95" x2="190" y2="82" stroke="#CBD5E0" stroke-width="1"/>

</svg>