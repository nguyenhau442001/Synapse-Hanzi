<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow for contrast -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.6"/>

  <!-- Conceptual Representation for "使唤" (Commanded / Tasked / At beck and call) -->
  <!-- Adjective/State: Visual contrast showing responsive action and responsibility -->
  
  <!-- Floor/Ground Line -->
  <path d="M 50 175 L 190 175" stroke="#2D3446" stroke-width="3" stroke-linecap="round"/>

  <!-- Senior / Assigning figure (Left, seated or standing upright, giving a calm instruction) -->
  <g transform="translate(75, 105)">
    <!-- Body/Torso -->
    <path d="M -12 50 C -12 35, -5 20, 0 20 C 5 20, 12 35, 12 50 Z" fill="#64748B"/>
    <!-- Head -->
    <circle cx="0" cy="5" r="9" fill="#94A3B8"/>
    <!-- Pointing / Directing Arm -->
    <path d="M 5 28 L 22 23" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sound/Command Waves (Subtle orange accent indicating instruction) -->
  <path d="M 102 120 Q 110 125 102 130" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 106 116 Q 116 125 106 134" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Junior / Responsible & Responsive figure (Right, eagerly stepping up to handle a task) -->
  <g transform="translate(150, 95)">
    <!-- Motion lines / Forward eagerness -->
    <path d="M -25 35 L -18 35" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M -28 45 L -20 45" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Body / Torso (Active posture, leaning slightly forward) -->
    <path d="M -10 60 C -10 42, -2 30, 4 30 C 10 30, 14 45, 12 60 Z" fill="#38BDF8"/>
    <!-- Head -->
    <circle cx="2" cy="12" r="9" fill="#BAE6FD"/>
    
    <!-- Arms ready to receive/help -->
    <path d="M -4 38 L -14 44" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 8 38 L 18 42" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Legs -->
    <path d="M -2 60 L -6 80" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 6 60 L 12 80" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Central Task Object: Represents the responsibility / errand being shouldered -->
  <g transform="translate(120, 145)">
    <!-- Glowing indicator of task readiness/reliability -->
    <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <!-- Tool/Item icon (A modern sleek utility node representing "duty/errand") -->
    <path d="M -5 -5 L 5 -5 L 5 5 L -5 5 Z" fill="#F59E0B" rx="1"/>
    <circle cx="0" cy="0" r="3" fill="#1E293B"/>
  </g>

</svg>