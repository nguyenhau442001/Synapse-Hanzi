<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "回应" (Noun - physical object: A retro/modern intercom or two-way communication device representing a direct physical response object) -->
  
  <!-- Subtle background glow for the central object -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Main Object: Sleek Modern Intercom / Response Terminal (Noun representation of a physical response device/object) -->
  <!-- Device Body -->
  <rect x="85" y="55" width="70" height="130" rx="16" fill="#2F3640" stroke="#4B5563" stroke-width="2"/>
  <rect x="92" y="62" width="56" height="116" rx="10" fill="#1F242D"/>

  <!-- Speaker Grille Top -->
  <circle cx="120" cy="85" r="14" fill="#11141A" stroke="#374151" stroke-width="1.5"/>
  <circle cx="120" cy="85" r="5" fill="#F59E0B"/>

  <!-- Screen / Display Area showing inactive/waiting state ("对方没有回应" context) -->
  <rect x="102" y="110" width="36" height="24" rx="4" fill="#11141A"/>
  <!-- Flat UI waveform flatline (no response) -->
  <line x1="110" y1="122" x2="130" y2="122" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>

  <!-- Interaction Button Bottom -->
  <circle cx="120" cy="157" r="12" fill="#374151" stroke="#4B5563" stroke-width="1.5"/>
  <circle cx="120" cy="157" r="6" fill="#F59E0B"/>

  <!-- Accent signal waves indicating an attempted signal/call seeking response -->
  <!-- Left wave -->
  <path d="M 68 95 C 60 105, 60 135, 68 145" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 58 85 C 46 100, 46 140, 58 155" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Right wave -->
  <path d="M 172 95 C 180 105, 180 135, 172 145" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 182 85 C 194 100, 194 140, 182 155" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

</svg>