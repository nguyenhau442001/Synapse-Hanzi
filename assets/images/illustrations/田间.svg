  <circle cx="120" cy="90" r="30" fill="#2E3544" opacity="0.6"/>
  <circle cx="170" cy="60" r="16" fill="#F59E0B" opacity="0.9"/>

  <!-- Distant Hills / Horizon -->
  <path d="M 20 120 Q 70 95 120 120 T 220 115 L 220 140 L 20 140 Z" fill="#222733"/>

  <!-- Farmland Terraces / Ridges (田地) -->
