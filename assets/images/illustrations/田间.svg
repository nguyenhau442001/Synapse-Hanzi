  <!-- Right Sprout -->
  <path d="M 155 175 Q 155 160 145 155 Q 155 165 155 175 Z" fill="#10B981"/>
  <path d="M 155 175 Q 155 158 165 153 Q 155 163 155 175 Z" fill="#34D399"/>
  <path d="M 155 185 L 155 170" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Foreground Soil Contour / Accent -->
