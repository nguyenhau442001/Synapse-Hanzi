<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person A (The Joker) -->
  <g transform="translate(60, 80)">
    <circle cx="30" cy="30" r="25" fill="#FFB347"/>
    <path d="M15 35 Q30 45 45 35" stroke="#1A1D24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="25" r="3" fill="#1A1D24"/>
    <circle cx="40" cy="25" r="3" fill="#1A1D24"/>
    <path d="M25 60 L25 120 M35 60 L35 120" stroke="#FFB347" stroke-width="8" stroke-linecap="round"/>
    <path d="M10 70 L25 90 L40 70" stroke="#FFB347" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Person B (The Listener/Laughing) -->
  <g transform="translate(140, 90)">
    <circle cx="30" cy="30" r="25" fill="#87CEEB"/>
    <path d="M15 35 Q30 50 45 35" stroke="#1A1D24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M18 25 Q20 20 22 25 M38 25 Q40 20 42 25" stroke="#1A1D24" stroke-width="3" fill="none"/>
    <path d="M25 70 L25 120 M35 70 L35 120" stroke="#87CEEB" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 80 L30 70 L45 80" stroke="#87CEEB" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Speech Bubble Effect (Visualizing the 'teasing' motion) -->
  <path d="M100 70 Q110 50 125 60" stroke="#FFB347" stroke-width="4" fill="none" stroke-dasharray="6 6"/>
  <circle cx="130" cy="55" r="4" fill="#FFB347"/>
  <circle cx="138" cy="50" r="6" fill="#FFB347"/>
</svg>