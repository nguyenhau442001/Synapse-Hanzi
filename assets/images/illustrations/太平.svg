<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Landscape representing Taiping (Peaceful land) -->
  <!-- Distant mountains -->
  <path d="M40 160 L70 110 L100 160 Z" fill="#2C3E50"/>
  <path d="M80 160 L120 90 L160 160 Z" fill="#34495E"/>
  <path d="M140 160 L180 120 L220 160 Z" fill="#2C3E50"/>
  
  <!-- Calm river/water -->
  <rect x="0" y="160" width="240" height="80" fill="#16212D"/>
  <path d="M0 165 Q120 155 240 165" stroke="#3498DB" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Central symbolic element: A traditional peaceful pavilion (symbolizing stability/civilization) -->
  <g transform="translate(120, 140)">
    <!-- Base -->
    <rect x="-40" y="0" width="80" height="10" fill="#F39C12"/>
    <!-- Pillars -->
    <rect x="-30" y="-30" width="8" height="30" fill="#F1C40F"/>
    <rect x="22" y="-30" width="8" height="30" fill="#F1C40F"/>
    <!-- Roof -->
    <path d="M-45 -30 L0 -60 L45 -30 Z" fill="#E67E22"/>
    <path d="M-40 -30 L0 -55 L40 -30 Z" fill="#F39C12"/>
  </g>
  
  <!-- Peaceful atmosphere: A golden sun/moon rising -->
  <circle cx="180" cy="60" r="25" fill="#F1C40F"/>
  
  <!-- Foreground: A single calm, sturdy tree -->
  <path d="M30 200 C30 170 40 160 50 160 C60 160 70 170 70 200" stroke="#F39C12" stroke-width="6" fill="none"/>
  <circle cx="50" cy="155" r="15" fill="#F1C40F"/>
</svg>