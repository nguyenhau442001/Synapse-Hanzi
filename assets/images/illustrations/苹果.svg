<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b131e"/>
      <stop offset="100%" stop-color="#182332"/>
    </linearGradient>
    <!-- Tabletop Surface -->
    <linearGradient id="tableSurface" x1="0" y1="170" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Realistic 3D Apple Red Gradient -->
    <radialGradient id="appleSkin" cx="40%" cy="35%" r="65%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="95%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#2c0505"/>
    </radialGradient>
    <!-- Subtle Golden-Yellow Under-glow on Apple -->
    <radialGradient id="appleGlow" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <!-- Fresh Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="120" y1="35" x2="175" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <!-- Natural Stem Brown -->
    <linearGradient id="stemGrad" x1="0" y1="30" x2="0" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- Soft Contact Shadow -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#020617" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Clean Wooden Tabletop Divider -->
  <rect x="0" y="178" width="240" height="62" fill="url(#tableSurface)"/>
  <line x1="0" y1="178" x2="240" y2="178" stroke="#475569" stroke-width="1.5"/>

  <!-- Soft Apple Drop Shadow on Table -->
  <ellipse cx="120" cy="186" rx="55" ry="12" fill="url(#dropShadow)"/>

  <!-- Apple Stem (Curved, woody texture, emerging from top dimple) -->
  <path d="M118 72 C116 52, 122 36, 134 32 C135 34, 133 38, 126 44 C122 52, 123 62, 122 72 Z" fill="url(#stemGrad)"/>

  <!-- Fresh Green Apple Leaf -->
  <path d="M124 54 C140 40, 168 46, 172 58 C165 72, 138 72, 124 54 Z" fill="url(#leafGrad)"/>
  <!-- Leaf Center Vein -->
  <path d="M125 55 Q146 56 168 56" fill="none" stroke="#bbf7d0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Main Realistic Apple Body (Natural anatomical apple contours with top/bottom dimples) -->
  <path d="M120 74
           C102 60, 68 62, 54 86
           C36 118, 42 162, 74 176
           C90 183, 108 181, 120 178
           C132 181, 150 183, 166 176
           C198 162, 204 118, 186 86
           C172 62, 138 60, 120 74 Z"
        fill="url(#appleSkin)"/>

  <!-- Subtle Color Modulation & Yellow-Orange Sunburst Under-glow -->
  <path d="M120 74
           C102 60, 68 62, 54 86
           C36 118, 42 162, 74 176
           C90 183, 108 181, 120 178
           C132 181, 150 183, 166 176
           C198 162, 204 118, 186 86
           C172 62, 138 60, 120 74 Z"
        fill="url(#appleGlow)"/>

  <!-- Top Dimple Natural Shadow -->
  <ellipse cx="120" cy="74" rx="14" ry="4" fill="#450a0a" opacity="0.65"/>

  <!-- Realistic Specular Highlight (Soft window reflection on glossy skin) -->
  <ellipse cx="88" cy="100" rx="16" ry="24" fill="#ffffff" opacity="0.22" transform="rotate(-24 88 100)"/>
  <ellipse cx="84" cy="94" rx="7" ry="12" fill="#ffffff" opacity="0.45" transform="rotate(-24 84 94)"/>

  <!-- Secondary Soft Rim Reflection on Bottom-Right -->
  <path d="M148 168 C168 156, 184 135, 182 108" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- Natural Tiny Skin Speckles (Lenticels) -->
  <circle cx="95" cy="135" r="0.8" fill="#fef08a" opacity="0.5"/>
  <circle cx="108" cy="148" r="0.8" fill="#fef08a" opacity="0.5"/>
  <circle cx="140" cy="138" r="0.8" fill="#fef08a" opacity="0.5"/>
  <circle cx="152" cy="120" r="0.8" fill="#fef08a" opacity="0.5"/>
  <circle cx="128" cy="160" r="0.8" fill="#fef08a" opacity="0.5"/>
  <circle cx="78" cy="140" r="0.8" fill="#fef08a" opacity="0.5"/>

  <!-- Soft Ambient Focus Circle -->
  <circle cx="120" cy="120" r="65" fill="none" stroke="#ef4444" stroke-width="0.8" opacity="0.12"/>
</svg>
