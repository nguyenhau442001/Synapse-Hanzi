<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle floor shadow / surface -->
  <ellipse cx="120" cy="188" rx="60" ry="10" fill="#111318"/>

  <!-- Factory Box / Packaging (The "Yuan Zhuang" physical object representation) -->
  <g transform="translate(0, 0)">
    <!-- Box Back/Top flap depth or inner -->
    <polygon points="120,68 168,90 120,112 72,90" fill="#2D333F"/>
    
    <!-- Box Left Side -->
    <polygon points="72,90 120,112 120,172 72,150" fill="#2E3748"/>

    <!-- Box Right Side -->
    <polygon points="168,90 120,112 120,172 168,150" fill="#3B465A"/>

    <!-- Box Top Flaps (Closed & Sealed) -->
    <polygon points="120,68 168,90 120,98 72,90" fill="#475569"/>

    <!-- Factory Quality Seal / Official Stamp (Golden Orange Accent) -->
    <g transform="translate(120, 131)">
      <!-- Shield/Badge Base -->
      <path d="M0,-14 L12,-8 L12,4 C12,11 6,16 0,20 C-6,16 -12,11 -12,4 L-12,-8 Z" fill="#F59E0B"/>
      <!-- Checkmark inside seal -->
      <path d="M-4,1 L-1,5 L5,-3" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Horizontal Strapping / Packing Band -->
    <path d="M72,120 L120,142 L168,120" fill="none" stroke="#E2E8F0" stroke-width="3" opacity="0.15"/>
  </g>

  <!-- Precision Electronic Component Emerging (Reflecting "factory original device accessory") -->
  <g transform="translate(0, -6)">
    <!-- Glowing Accent Circuit/Chip -->
    <rect x="106" y="44" width="28" height="28" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <!-- Chip pins -->
    <line x1="112" y1="41" x2="112" y2="44" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="128" y1="41" x2="128" y2="44" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="112" y1="72" x2="112" y2="75" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="128" y1="72" x2="128" y2="75" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Core dot -->
    <circle cx="120" cy="58" r="4" fill="#F59E0B"/>
  </g>

  <!-- Sparkle/Authenticity Highlights -->
  <g transform="translate(162, 70)" fill="#F59E0B">
    <path d="M0,0 C0,-5 2,-7 6,-7 C2,-7 0,-9 0,-14 C0,-9 -2,-7 -6,-7 C-2,-7 0,-5 0,0 Z"/>
  </g>
  <g transform="translate(70, 110) scale(0.6)" fill="#F59E0B" opacity="0.8">
    <path d="M0,0 C0,-5 2,-7 6,-7 C2,-7 0,-9 0,-14 C0,-9 -2,-7 -6,-7 C-2,-7 0,-5 0,0 Z"/>
  </g>
</svg>