<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background elements (Moon phases orbit) -->
  <circle cx="120" cy="120" r="78" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 6"/>
  
  <!-- Mini Moon Phases along the orbit -->
  <!-- New Moon (top) -->
  <circle cx="120" cy="42" r="5" fill="#2A2F3D"/>
  <!-- Waxing Crescent (top-right) -->
  <circle cx="175" cy="65" r="5" fill="#F39C12" opacity="0.3"/>
  <!-- First Quarter (right) -->
  <path d="M 198,120 A 5,5 0 0,1 198,120 A 5,5 0 0,0 198,110 Z" fill="#F39C12" opacity="0.7"/>
  <!-- Full Moon (bottom) -->
  <circle cx="120" cy="198" r="5" fill="#F39C12"/>
  <!-- Last Quarter (left) -->
  <path d="M 42,120 A 5,5 0 0,0 42,120 A 5,5 0 0,1 42,110 Z" fill="#F39C12" opacity="0.7"/>

  <!-- Main Object: Traditional Lunar Calendar Scroll / Hanging Wall Calendar -->
  <!-- Wooden top/bottom scroll rods -->
  <rect x="75" y="55" rx="4" ry="4" width="90" height="10" fill="#D35400"/>
  <rect x="75" y="185" rx="4" ry="4" width="90" height="10" fill="#D35400"/>
  
  <!-- Hanging cord -->
  <path d="M 120,55 L 120,38" stroke="#D35400" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="36" r="4" fill="none" stroke="#D35400" stroke-width="2.5"/>

  <!-- Calendar main paper body -->
  <rect x="82" y="65" width="76" height="120" fill="#F4F6F9" rx="2"/>

  <!-- Calendar Header Red Banner (Traditional Chinese style accent) -->
  <rect x="82" y="65" width="76" height="26" fill="#E74C3C" rx="2"/>
  <!-- Header decorative inner line -->
  <rect x="88" y="73" width="64" height="10" fill="#FFFFFF" opacity="0.3" rx="2"/>

  <!-- Grid representing lunar calendar days (dots and mini crescents) -->
  <!-- Row 1 -->
  <circle cx="100" cy="110" r="4" fill="#34495E"/>
  <circle cx="120" cy="110" r="4" fill="#34495E"/>
  <circle cx="140" cy="110" r="4" fill="#34495E"/>
  
  <!-- Row 2 -->
  <circle cx="100" cy="132" r="4" fill="#34495E"/>
  <!-- Highlighted Lunar Node (e.g., 15th Full Moon) -->
  <circle cx="120" cy="132" r="7" fill="#F39C12"/>
  <circle cx="140" cy="132" r="4" fill="#34495E"/>

  <!-- Row 3 -->
  <circle cx="100" cy="154" r="4" fill="#34495E"/>
  <circle cx="120" cy="154" r="4" fill="#34495E"/>
  <circle cx="140" cy="154" r="4" fill="#34495E"/>

  <!-- Foreground accent: Large glowing golden crescent moon overlapping top-right of calendar -->
  <g transform="translate(145, 75)">
    <circle cx="0" cy="0" r="22" fill="#F39C12"/>
    <!-- Shadow to make it a crescent -->
    <circle cx="8" cy="-3" r="20" fill="#1A1D24"/>
  </g>

</svg>