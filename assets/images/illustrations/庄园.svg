<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Landscape background elements -->
  <!-- Sunlit rolling hills -->
  <path d="M 0 160 Q 90 120 240 150 L 240 240 L 0 240 Z" fill="#242933"/>
  <path d="M 0 180 Q 140 130 240 170 L 240 240 L 0 240 Z" fill="#2D3442"/>

  <!-- Vineyard rows (representing wine estate context) -->
  <path d="M 40 240 Q 90 180 120 165" stroke="#3A4454" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 80 240 Q 120 185 150 170" stroke="#3A4454" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 120 240 Q 150 190 180 175" stroke="#3A4454" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Estate / Manor Building (庄园) -->
  <!-- Main building body -->
  <rect x="75" y="105" width="90" height="60" fill="#E2E8F0"/>
  <!-- Side wing left -->
  <rect x="50" y="125" width="30" height="40" fill="#CBD5E1"/>
  <!-- Side wing right -->
  <rect x="160" y="125" width="30" height="40" fill="#CBD5E1"/>

  <!-- Roofs (Terracotta/Gold accent theme) -->
  <!-- Main roof -->
  <polygon points="70,105 120,70 170,105" fill="#F59E0B"/>
  <!-- Left wing roof -->
  <polygon points="45,125 65,105 85,125" fill="#D97706"/>
  <!-- Right wing roof -->
  <polygon points="155,125 175,105 195,125" fill="#D97706"/>

  <!-- Architectural details: Windows -->
  <rect x="90" y="120" width="12" height="18" rx="6" fill="#1A1D24"/>
  <rect x="114" y="120" width="12" height="18" rx="6" fill="#1A1D24"/>
  <rect x="138" y="120" width="12" height="18" rx="6" fill="#1A1D24"/>

  <!-- Entrance Door -->
  <rect x="111" y="145" width="18" height="20" rx="9" fill="#1A1D24"/>

  <!-- Estate Tower / Bell Gable -->
  <rect x="112" y="45" width="16" height="30" fill="#CBD5E1"/>
  <polygon points="110,45 120,30 130,45" fill="#F59E0B"/>
  <circle cx="120" cy="55" r="4" fill="#1A1D24"/>

  <!-- Cypress trees (characteristic of estates/vineyards) -->
  <!-- Left trees -->
  <path d="M 30 160 C 25 140 30 110 30 90 C 30 110 35 140 30 160 Z" fill="#10B981"/>
  <path d="M 20 170 C 16 155 20 135 20 120 C 20 135 24 155 20 170 Z" fill="#059669"/>
  <!-- Right trees -->
  <path d="M 210 165 C 205 145 210 120 210 100 C 210 120 215 145 210 165 Z" fill="#10B981"/>
</svg>