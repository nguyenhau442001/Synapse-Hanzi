<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person 1 (Child) -->
  <g transform="translate(70, 100)">
    <circle cx="20" cy="20" r="15" fill="#FFC107"/>
    <path d="M5 40 Q20 35 35 40 L30 80 L10 80 Z" fill="#FFC107"/>
  </g>
  
  <!-- Person 2 (Adult/Mother) -->
  <g transform="translate(130, 80)">
    <circle cx="20" cy="20" r="20" fill="#FFC107"/>
    <path d="M0 45 Q20 40 40 45 L35 100 L5 100 Z" fill="#FFC107"/>
  </g>
  
  <!-- Connecting visual element representing 'and' (The link between two entities) -->
  <path d="M105 120 C 115 110, 125 110, 135 120" stroke="#FF9800" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Store/Destination indicator -->
  <rect x="90" y="150" width="60" height="50" fill="#37474F" rx="4"/>
  <rect x="105" y="165" width="30" height="35" fill="#546E7A"/>
  <path d="M105 165 L120 150 L135 165 Z" fill="#FF9800"/>
</svg>