<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Table Surface -->
  <rect x="30" y="150" width="180" height="15" rx="2" fill="#2D343E"/>
  <rect x="40" y="165" width="10" height="40" fill="#2D343E"/>
  <rect x="190" y="165" width="10" height="40" fill="#2D343E"/>
  
  <!-- Blueprint Paper (The core object) -->
  <path d="M60 80 L180 80 L190 140 L70 140 Z" fill="#264653" stroke="#FFB703" stroke-width="2"/>
  
  <!-- Blueprint Lines (Technical drawing representation) -->
  <path d="M70 90 L170 90 M70 100 L170 100 M80 110 L160 110 M80 120 L160 120" stroke="#FFB703" stroke-width="1" stroke-dasharray="4 2"/>
  
  <!-- Architectural Outline on Blueprint -->
  <path d="M100 130 L100 95 L120 95 L120 130 M140 130 L140 105 L160 105 L160 130" stroke="#FFB703" stroke-width="2" fill="none"/>
  
  <!-- Drafting Tools -->
  <rect x="160" y="135" width="30" height="5" rx="1" fill="#FFB703" transform="rotate(-15 175 137)"/>
  <circle cx="150" cy="130" r="4" fill="#FFB703"/>
</svg>