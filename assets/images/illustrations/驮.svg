<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain terrain background -->
  <path d="M20 200 L60 160 L100 180 L160 120 L220 200 Z" fill="#222730"/>
  <path d="M100 200 L130 155 L170 185 L220 200 Z" fill="#2A303C"/>
  <path d="M10 200 L40 175 L80 200 Z" fill="#2A303C"/>
  
  <!-- Trail/Path -->
  <path d="M20 205 C50 190 90 160 125 160 C160 160 200 185 220 195" fill="none" stroke="#3A4250" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Pack Horse (高原矮马) -->
  <!-- Legs (Back) -->
  <line x1="90" y1="165" x2="85" y2="195" stroke="#C27835" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="160" x2="145" y2="192" stroke="#C27835" stroke-width="6" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="115" cy="150" rx="35" ry="22" fill="#E08B42"/>

  <!-- Legs (Front) -->
  <line x1="100" y1="165" x2="95" y2="195" stroke="#D1803C" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="165" x2="135" y2="193" stroke="#D1803C" stroke-width="6" stroke-linecap="round"/>

  <!-- Neck & Head -->
  <path d="M85 140 C75 125 70 110 65 100 L75 95 C82 110 88 125 95 138 Z" fill="#E08B42"/>
  <!-- Head -->
  <path d="M65 100 L50 95 C48 97 52 104 57 106 L68 110 Z" fill="#E08B42"/>
  <!-- Mane & Tail -->
  <path d="M85 135 C80 120 78 110 75 98 C78 105 82 120 88 132 Z" fill="#2C241E"/>
  <path d="M148 142 C155 150 160 165 158 175 C155 165 152 155 145 145 Z" fill="#2C241E"/>

  <!-- Heavy Cargo/Burdens (Thồ hàng) - Symmetrically strapped on back -->
  <rect x="100" y="115" width="32" height="26" rx="4" fill="#3B82F6"/>
  <rect x="104" y="119" width="24" height="18" rx="2" fill="#60A5FA"/>
  
  <rect x="108" y="110" width="26" height="24" rx="4" fill="#F59E0B"/>
  <rect x="112" y="114" width="18" height="16" rx="2" fill="#FBBF24"/>
  
  <!-- Ropes/Straps binding the cargo -->
  <line x1="105" y1="120" x2="128" y2="140" stroke="#1E293B" stroke-width="2.5"/>
  <line x1="110" y1="140" x2="130" y2="120" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Focus accent glow / dot -->
  <circle cx="118" cy="115" r="3" fill="#FFFFFF"/>
</svg>