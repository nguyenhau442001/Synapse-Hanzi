<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Elderly person silhouette representing "衰弱" (frailty/weakness) -->
  <g transform="translate(120, 120)">
    <!-- Body/Clothing -->
    <path d="M-30 80 L-35 40 L-20 10 L0 0 L20 10 L35 40 L30 80 Z" fill="#4A5568"/>
    
    <!-- Hunched back/posture -->
    <path d="M-20 10 C-10 -5 10 -5 20 10" fill="none" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="0" cy="-15" r="20" fill="#A0AEC0"/>
    
    <!-- Cane/Support -->
    <path d="M35 80 L35 20 C35 10 45 10 45 20 L45 80" fill="none" stroke="#D69E2E" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Illustrating frailty: Slight lean and lowered head -->
    <path d="M-15 -10 L-5 -5" stroke="#1A1D24" stroke-width="2"/>
    <path d="M5 -10 L15 -5" stroke="#1A1D24" stroke-width="2"/>
    
    <!-- Subtle accent for focus -->
    <circle cx="45" cy="15" r="5" fill="#D69E2E"/>
  </g>
</svg>