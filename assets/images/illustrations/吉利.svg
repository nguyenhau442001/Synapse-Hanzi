<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 112)">
    <!-- Festive Red Pocket (Hongbao / Cát tường object) -->
    <!-- Shadow/Glow -->
    <circle cx="0" cy="10" r="50" fill="#FFC107" opacity="0.1"/>
    
    <!-- Red Envelope Body -->
    <rect x="-44" y="-52" width="88" height="114" rx="12" fill="#E53935"/>
    
    <!-- Envelope Flap -->
    <path d="M-44 -52 L0 -10 L44 -52 Z" fill="#C62828"/>
    
    <!-- Gold Border / Trim -->
    <rect x="-44" y="-52" width="88" height="114" rx="12" fill="none" stroke="#FFD54F" stroke-width="2.5" opacity="0.8"/>
    <path d="M-44 -52 L0 -10 L44 -52" fill="none" stroke="#FFD54F" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Traditional Gold Fu/Good Fortune Seal (Stylized auspicious knot/coin icon) -->
    <circle cx="0" cy="12" r="22" fill="#FFA000"/>
    <circle cx="0" cy="12" r="16" fill="#FFC107"/>
    <!-- Center square hole of Chinese coin symbol -->
    <rect x="-5" y="7" width="10" height="10" rx="1" fill="#FFA000"/>
    
    <!-- Decorative auspicious clouds / sparks floating up -->
    <path d="M-28 -68 C-25 -74 -18 -74 -15 -68 C-13 -65 -8 -65 -6 -68" fill="none" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M22 -72 C25 -77 31 -77 34 -72 C36 -69 41 -69 43 -72" fill="none" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="0" cy="-60" r="2.5" fill="#FFD54F"/>
  </g>
</svg>