<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Elder figure -->
    <path d="M40 120 C40 100, 50 80, 60 80 C70 80, 80 100, 80 120 L80 160 L40 160 Z" fill="#FFC107"/>
    <circle cx="60" cy="70" r="15" fill="#FFC107"/>
    <path d="M50 140 L40 130" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 140 L80 130" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Child figure -->
    <path d="M90 130 C90 115, 95 105, 100 105 C105 105, 110 115, 110 130 L110 160 L90 160 Z" fill="#4CAF50"/>
    <circle cx="100" cy="98" r="10" fill="#4CAF50"/>
    
    <!-- Connecting gesture: Elder's hand on child's shoulder -->
    <path d="M75 115 L95 110" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Ground line -->
    <path d="M20 160 L140 160" stroke="#37474F" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>