<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements for theatrical stage context -->
  <path d="M40 50 L200 50" stroke="#2A2F3B" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M40 190 L200 190" stroke="#2A2F3B" stroke-width="2" opacity="0.5"/>
  <circle cx="120" cy="120" r="85" fill="none" stroke="#252A36" stroke-width="1.5" stroke-dasharray="8 8"/>

  <!-- Stage spotlight beam -->
  <path d="M70 20 L170 20 L210 200 L30 200 Z" fill="url(#spotlight)" opacity="0.15"/>

  <defs>
    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="maskGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="maskSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="directorSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Central Visual Representation: Theatrical Masks (Comedy & Tragedy) symbolizing Acting Skill / 演技 -->
  <!-- Left Mask (Tragedy / Emotional Depth) -->
  <g transform="translate(85, 115) rotate(-12)">
    <!-- Mask Base -->
    <path d="M -30 -40 C -35 -40 -45 -10 -45 10 C -45 35 -25 50 0 55 C 10 57 15 50 12 35 C 10 25 5 10 0 -10 C -5 -25 -20 -38 -30 -40 Z" fill="url(#maskSilver)"/>
    <!-- Eye Hole -->
    <path d="M -22 -5 C -15 -5 -12 -12 -18 -15 C -25 -18 -28 -8 -22 -5 Z" fill="#1A1D24"/>
    <!-- Sad Mouth -->
    <path d="M -25 25 C -18 18 -8 18 -2 25" stroke="#1A1D24" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Tear drop of profound emotion -->
    <path d="M -15 2 C -15 2 -10 10 -15 15 C -18 18 -22 13 -15 2 Z" fill="#38BDF8"/>
  </g>

  <!-- Right Mask (Comedy / Expressive Portrayal) - Prominent & Golden -->
  <g transform="translate(150, 105) rotate(10)">
    <!-- Mask Base -->
    <path d="M 0 -45 C -15 -43 -30 -30 -35 -10 C -40 15 -25 45 0 52 C 25 45 40 15 35 -10 C 30 -30 15 -43 0 -45 Z" fill="url(#maskGold)"/>
    <!-- Eye Hole -->
    <path d="M -18 -10 C -12 -10 -8 -18 -15 -20 C -22 -22 -24 -12 -18 -10 Z" fill="#1A1D24"/>
    <path d="M 18 -10 C 12 -10 8 -18 15 -20 C 22 -22 24 -12 18 -10 Z" fill="#1A1D24"/>
    <!-- Expressive Smiling Mouth -->
    <path d="M -18 15 C -10 32 10 32 18 15 C 12 25 -12 25 -18 15 Z" fill="#1A1D24"/>
    <!-- Cheek blush for performance vibrancy -->
    <circle cx="-22" cy="5" r="4" fill="#F59E0B" opacity="0.6"/>
    <circle cx="22" cy="5" r="4" fill="#F59E0B" opacity="0.6"/>
  </g>

  <!-- Ribbons / Dramatic Flourish wrapping the masks -->
  <path d="M 60 145 C 90 170 150 170 180 135" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <path d="M 75 160 C 105 185 145 175 170 150" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Spotlight particle effects -->
  <circle cx="95" cy="50" r="2" fill="#FCD34D" opacity="0.8"/>
  <circle cx="155" cy="65" r="1.5" fill="#FCD34D" opacity="0.6"/>
  <circle cx="125" cy="40" r="3" fill="#FCD34D" opacity="0.9"/>
  <circle cx="70" cy="80" r="1.5" fill="#FCD34D" opacity="0.7"/>
  <circle cx="170" cy="90" r="2" fill="#FCD34D" opacity="0.8"/>

</svg>