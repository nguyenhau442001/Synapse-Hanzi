<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Radiating warm background glow representing sincerity from within -->
    <circle cx="0" cy="-10" r="70" fill="#FFB74D" opacity="0.1"/>
    <circle cx="0" cy="-10" r="50" fill="#FFB74D" opacity="0.15"/>
    
    <!-- Silhouette/Form of a person placing hands genuinely over their chest (from the bottom of the heart/core) -->
    <!-- Torso and shoulders -->
    <path d="M-45,70 C-45,40 -25,30 0,30 C25,30 45,40 45,70 Z" fill="#2D323E"/>
    
    <!-- Head and neck -->
    <circle cx="0" cy="-25" r="18" fill="#4A5568"/>
    <path d="M-8,-7 L8,-7 L6,15 L-6,15 Z" fill="#4A5568"/>
    
    <!-- Warm smile / facial contour hint -->
    <path d="M-4,-20 Q0,-16 4,-20" stroke="#718096" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Crossed hands pressed gently against the center of the chest (由衷 - from the depths of the heart/sincere) -->
    <path d="M-22,22 C-15,18 -5,25 0,32 C5,25 15,18 22,22 C28,26 25,35 18,38 C10,41 0,35 -5,35 C-10,35 -20,41 -28,38 C-35,35 -28,26 -22,22 Z" fill="#FFA726"/>
    
    <!-- Core radiating light spark (representing sincere emotion welling up) -->
    <circle cx="0" cy="35" r="6" fill="#FFF" opacity="0.9"/>
    <path d="M0,22 L0,27 M0,43 L0,48 M-13,35 L-8,35 M8,35 L13,35" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>