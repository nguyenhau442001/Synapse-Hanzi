<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Subject: A group of diverse professional experts (silhouettes) -->
  <!-- Representing the "everyone/all" aspect of "无不" -->
  
  <!-- Expert 1 -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="-30" r="12" fill="#FFB347"/>
    <path d="M5 0h30v40H5z" fill="#FFB347"/>
    <path d="M10 10l10 10 10-10" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Expert 2 -->
  <g transform="translate(100, 120)">
    <circle cx="20" cy="-30" r="12" fill="#FFB347"/>
    <path d="M5 0h30v40H5z" fill="#FFB347"/>
    <path d="M10 10l10 10 10-10" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Expert 3 -->
  <g transform="translate(140, 120)">
    <circle cx="20" cy="-30" r="12" fill="#FFB347"/>
    <path d="M5 0h30v40H5z" fill="#FFB347"/>
    <path d="M10 10l10 10 10-10" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>

  <!-- The Object of admiration: A central, intricate jade-like sculpture -->
  <path d="M120 60 L140 80 L120 100 L100 80 Z" fill="#47C1FF" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M110 70 L130 90" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M130 70 L110 90" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Unanimous gesture: All hands raised in respectful applause/appreciation -->
  <path d="M70 110 L65 100 M80 110 L80 100 M90 110 L95 100" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 110 L105 100 M120 110 L120 100 M130 110 L135 100" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 110 L145 100 M160 110 L160 100 M170 110 L175 100" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>
</svg>