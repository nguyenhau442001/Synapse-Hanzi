<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle elements -->
  <circle cx="120" cy="120" r="75" fill="#222732" />
  
  <g transform="translate(120, 120)">
    <!-- Shoulders and neck -->
    <path d="M-50,75 C-50,55 -30,45 0,45 C30,45 50,55 50,75 L65,100 L-65,100 Z" fill="#2A303C"/>
    
    <!-- Neck -->
    <path d="M-18,20 L18,20 L18,52 L-18,52 Z" fill="#E8B89D"/>
    
    <!-- Face base / Head shape -->
    <path d="M-36,-10 C-36,-38 -18,-50 0,-50 C18,-50 36,-38 36,-10 C36,18 24,42 0,44 C-24,42 -36,18 -36,-10 Z" fill="#F4C2A4"/>
    
    <!-- Ears -->
    <circle cx="-38" cy="-5" r="7" fill="#E8B89D"/>
    <circle cx="38" cy="-5" r="7" fill="#E8B89D"/>

    <!-- Hair (neat, healthy dark styling) -->
    <path d="M-38,-15 C-38,-48 -18,-58 0,-58 C18,-58 38,-48 38,-15 C38,-20 30,-52 0,-52 C-30,-52 -38,-20 -38,-15 Z" fill="#2E3440"/>
    <path d="M-38,-20 C-35,-42 -15,-48 0,-48 C20,-48 35,-42 38,-20 C32,-25 15,-28 0,-28 C-15,-28 -32,-25 -38,-20 Z" fill="#3B4252"/>

    <!-- Eyes (calm, healthy, bright) -->
    <!-- Left eye -->
    <circle cx="-14" cy="-10" r="4.5" fill="#2E3440"/>
    <circle cx="-13" cy="-11" r="1.5" fill="#FFFFFF"/>
    <!-- Right eye -->
    <circle cx="14" cy="-10" r="4.5" fill="#2E3440"/>
    <circle cx="13" cy="-11" r="1.5" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M-20,-20 C-15,-23 -8,-21 -6,-19" stroke="#2E3440" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M20,-20 C15,-23 8,-21 6,-19" stroke="#2E3440" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Nose -->
    <path d="M-2,2 C-2,8 2,8 2,2" stroke="#E2AB8C" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Mouth (gentle healthy smile) -->
    <path d="M-10,22 C-5,28 5,28 10,22 C6,25 -6,25 -10,22 Z" fill="#C25E5E"/>

    <!-- HONG-RUN (红润): Vibrant healthy glowing flushed cheeks denoting recovery, vitality, and wellness -->
    <circle cx="-22" cy="7" r="11" fill="#FF5D5D" opacity="0.45" filter="blur(1px)"/>
    <circle cx="22" cy="7" r="11" fill="#FF5D5D" opacity="0.45" filter="blur(1px)"/>
    <circle cx="-20" cy="8" r="7" fill="#FF4747" opacity="0.6"/>
    <circle cx="20" cy="8" r="7" fill="#FF4747" opacity="0.6"/>
  </g>

  <!-- Accent glow ring emphasizing vitality/wellness -->
  <circle cx="120" cy="120" r="88" stroke="#F6AD55" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.6"/>
</svg>