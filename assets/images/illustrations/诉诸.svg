<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual representation of "诉诸" (resorting to/appealing to) 
       Depicting a person reaching out to a legal/formal document (contract/law) 
       as the primary means of resolution, rather than impulsive conflict. -->
  
  <!-- The Document/Contract -->
  <rect x="80" y="70" width="80" height="100" rx="4" fill="#2D343E" stroke="#FFB84D" stroke-width="2"/>
  <line x1="95" y1="90" x2="145" y2="90" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="110" x2="145" y2="110" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="130" x2="145" y2="130" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="150" x2="120" y2="150" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- The Hand reaching towards the document (The act of 'appealing to') -->
  <path d="M160 140 C 175 140 185 150 185 165 L 185 180 C 185 190 175 195 165 195 L 140 195 C 130 195 120 190 120 180 L 120 170" fill="#E0E0E0"/>
  <path d="M185 165 L 200 160 L 205 170 L 185 180" fill="#E0E0E0"/>
  
  <!-- Subtle visual cue of avoiding conflict (The 'forbidden' indicator) -->
  <circle cx="60" cy="170" r="15" fill="none" stroke="#FF5555" stroke-width="3"/>
  <line x1="50" y1="180" x2="70" y2="160" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
  <path d="M55 155 L 65 145" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
  <path d="M65 155 L 55 145" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
</svg>