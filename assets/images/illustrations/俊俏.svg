<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character: Dan role (Opera performer) -->
  <g transform="translate(120, 120)">
    <!-- Head/Face -->
    <circle cx="0" cy="-20" r="45" fill="#F8E1C6"/>
    
    <!-- Headdress (Traditional Opera style) -->
    <path d="M-45 -55 C-45 -85, 45 -85, 45 -55 L 45 -40 L -45 -40 Z" fill="#D4AF37"/>
    <path d="M-30 -65 C-30 -90, 30 -90, 30 -65 Z" fill="#B8860B"/>
    
    <!-- Hair/Features -->
    <path d="M-35 -20 C-35 -50, -10 -60, 0 -60 C10 -60, 35 -50, 35 -20" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Eyes (Meiqing-muxiu: Clear brows and bright eyes) -->
    <path d="M-20 -15 Q-10 -25, 0 -15 T 20 -15" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-10" cy="-10" r="3" fill="#2C3E50"/>
    <circle cx="10" cy="-10" r="3" fill="#2C3E50"/>
    
    <!-- Nose and Mouth -->
    <path d="M-5 0 Q0 5, 5 0" fill="none" stroke="#C0392B" stroke-width="1.5"/>
    <path d="M-8 15 Q0 20, 8 15" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Costume (Elegant collar) -->
    <path d="M-50 40 L-30 80 L30 80 L50 40 Z" fill="#C0392B"/>
    <path d="M-30 80 L0 60 L30 80" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <path d="M-40 50 L40 50" stroke="#D4AF37" stroke-width="2"/>
  </g>
</svg>