<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main object: A physical membership card representing the 'huasuan' value -->
  <g transform="translate(60, 80)">
    <!-- Card Base -->
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#2D343E" stroke="#FFB800" stroke-width="2"/>
    
    <!-- Decorative elements on card -->
    <rect x="15" y="15" width="30" height="30" rx="4" fill="#FFB800"/>
    <rect x="55" y="20" width="50" height="8" rx="2" fill="#4A5568"/>
    <rect x="55" y="35" width="30" height="8" rx="2" fill="#4A5568"/>
    
    <!-- Visualizing the 'split' or 'value' aspect: A physical coin being divided/allocated -->
    <circle cx="60" cy="110" r="20" fill="#FFB800"/>
    <path d="M60 90 L60 130" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Small coins representing the daily breakdown -->
    <circle cx="100" cy="110" r="10" fill="#FFB800" opacity="0.8"/>
    <circle cx="125" cy="110" r="10" fill="#FFB800" opacity="0.6"/>
    <circle cx="150" cy="110" r="10" fill="#FFB800" opacity="0.4"/>
  </g>
</svg>