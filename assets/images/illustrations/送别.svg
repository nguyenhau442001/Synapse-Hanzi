<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Platform Edge -->
  <rect x="0" y="180" width="240" height="60" fill="#2D343E"/>
  <rect x="0" y="180" width="240" height="8" fill="#3D4754"/>
  
  <!-- Train Silhouette (Background) -->
  <rect x="140" y="80" width="90" height="100" rx="4" fill="#3D4754"/>
  <rect x="150" y="95" width="20" height="30" rx="2" fill="#1A1D24"/>
  <rect x="180" y="95" width="20" height="30" rx="2" fill="#1A1D24"/>
  <circle cx="165" cy="160" r="12" fill="#1A1D24"/>
  <circle cx="195" cy="160" r="12" fill="#1A1D24"/>
  
  <!-- Volunteer Figure (Departing) -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="-20" r="10" fill="#FFB84D"/>
    <rect x="-6" y="-10" width="12" height="30" rx="2" fill="#FFB84D"/>
    <rect x="-12" y="20" width="24" height="50" rx="4" fill="#FFB84D"/>
    <path d="M-10 10 L-25 30 M10 10 L25 30" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Family Figure (Staying) -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="-20" r="10" fill="#A0AEC0"/>
    <rect x="-6" y="-10" width="12" height="30" rx="2" fill="#A0AEC0"/>
    <rect x="-12" y="20" width="24" height="40" rx="4" fill="#A0AEC0"/>
    <!-- Waving hand -->
    <path d="M10 0 L25 -20" stroke="#A0AEC0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="28" cy="-25" r="5" fill="#A0AEC0"/>
  </g>
  
  <!-- Another Family Figure -->
  <g transform="translate(30, 130)">
    <circle cx="0" cy="-20" r="8" fill="#718096"/>
    <rect x="-5" y="-12" width="10" height="25" rx="2" fill="#718096"/>
    <rect x="-10" y="13" width="20" height="37" rx="4" fill="#718096"/>
  </g>
  
  <!-- Steam/Whistle effect -->
  <path d="M220 80 Q 230 40 210 20" stroke="#4A5568" stroke-width="4" fill="none" stroke-dasharray="8 8"/>
</svg>