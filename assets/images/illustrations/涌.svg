<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow near the stage/bottom -->
  <ellipse cx="120" cy="210" rx="90" ry="25" fill="#FF8C42" opacity="0.15"/>

  <!-- Stage structure in background -->
  <path d="M 60 70 L 180 70 L 200 95 L 40 95 Z" fill="#2A2F3D"/>
  <rect x="70" y="65" width="100" height="5" rx="2" fill="#3D4456"/>

  <!-- Curtains left/right -->
  <path d="M 40 95 L 40 45 C 40 45 55 55 55 75 C 55 95 40 95 40 95 Z" fill="#E63946" opacity="0.8"/>
  <path d="M 200 95 L 200 45 C 200 45 185 55 185 75 C 185 95 200 95 200 95 Z" fill="#E63946" opacity="0.8"/>

  <!-- Spotlight cone -->
  <polygon points="120,40 40,210 200,210" fill="url(#spotlightGrad)" opacity="0.12"/>

  <!-- Definitions -->
  <defs>
    <linearGradient id="spotlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EA"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Directional motion lines representing "Yong" (surging/rushing forward) -->
  <g opacity="0.6">
    <path d="M 70 145 Q 90 135 110 140" stroke="#FF8C42" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 130 140 Q 150 135 170 145" stroke="#FF8C42" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 90 175 Q 110 165 130 170" stroke="#FFD166" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Dynamic arrows indicating forward rush -->
    <path d="M 115 110 L 120 100 L 125 110" fill="none" stroke="#FF8C42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 85 125 L 90 115 L 95 125" fill="none" stroke="#FF8C42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 145 125 L 150 115 L 155 125" fill="none" stroke="#FF8C42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Audience Crowd (overlapping abstract figures surging forward) -->
  <!-- Back row -->
  <circle cx="80" cy="160" r="10" fill="#3D4456"/>
  <path d="M 68 185 C 68 172 92 172 92 185 Z" fill="#3D4456"/>

  <circle cx="120" cy="150" r="11" fill="#4F5D75"/>
  <path d="M 107 178 C 107 163 133 163 133 178 Z" fill="#4F5D75"/>

  <circle cx="160" cy="160" r="10" fill="#3D4456"/>
  <path d="M 148 185 C 148 172 172 172 172 185 Z" fill="#3D4456"/>

  <!-- Middle row (surging up) -->
  <circle cx="100" cy="135" r="12" fill="#E0FBFC"/>
  <path d="M 85 162 C 85 146 115 146 115 162 Z" fill="#293241"/>

  <circle cx="140" cy="135" r="12" fill="#E0FBFC"/>
  <path d="M 125 162 C 125 146 155 146 155 162 Z" fill="#293241"/>

  <!-- Front row (eagerly leaning forward and raising hands) -->
  <!-- Left person -->
  <g transform="translate(65, 110)">
    <circle cx="15" cy="15" r="13" fill="#FFD166"/>
    <!-- Raised arm -->
    <path d="M 25 15 L 35 5" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 45 C 0 28 30 28 30 45 Z" fill="#FF8C42"/>
  </g>

  <!-- Center-left person (highest surge) -->
  <g transform="translate(95, 95)">
    <circle cx="15" cy="15" r="13" fill="#FFD166"/>
    <!-- Both arms raised excitedly -->
    <path d="M 5 10 L -2 0" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <path d="M 25 10 L 32 0" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 45 C 0 28 30 28 30 45 Z" fill="#E63946"/>
  </g>

  <!-- Center-right person -->
  <g transform="translate(125, 95)">
    <circle cx="15" cy="15" r="13" fill="#FFD166"/>
    <path d="M 5 10 L -2 0" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <path d="M 25 10 L 32 0" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 45 C 0 28 30 28 30 45 Z" fill="#E63946"/>
  </g>

  <!-- Right person -->
  <g transform="translate(155, 110)">
    <circle cx="15" cy="15" r="13" fill="#FFD166"/>
    <path d="M 5 15 L -5 5" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 45 C 0 28 30 28 30 45 Z" fill="#FF8C42"/>
  </g>

  <!-- Base surge wave line anchoring the crowd to the stage front -->
  <path d="M 40 200 Q 120 180 200 200" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
</svg>