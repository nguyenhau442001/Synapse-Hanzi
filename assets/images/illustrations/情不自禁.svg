<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for energetic burst -->
  <circle cx="120" cy="120" r="70" fill="#252A35" opacity="0.6"/>
  <path d="M120 40 L120 55 M120 185 L120 200 M40 120 L55 120 M185 120 L200 120 M65 65 L76 76 M164 164 L175 175 M65 175 L76 164 M164 76 L175 65" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Character / Person representing spontaneous joy (情不自禁 - bursting with unstoppable happiness) -->
  <g transform="translate(0, 10)">
    <!-- Dynamic jumping body posture -->
    <!-- Torso -->
    <path d="M105 105 C105 95 112 90 120 90 C128 90 135 95 135 105 L140 145 C140 150 135 155 130 155 L110 155 C105 155 100 150 100 145 Z" fill="#3B82F6"/>
    
    <!-- Head -->
    <circle cx="120" cy="70" r="18" fill="#FBBF24"/>
    
    <!-- Face (Overflowing with uncontrollable joy - laughing eyes, wide open mouth) -->
    <path d="M112 66 Q116 62 120 66" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M120 66 Q124 62 128 66" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M114 74 Q120 82 126 74" fill="#1A1D24"/>

    <!-- Raised Arms (Cheering, hands thrown up uncontrollably) -->
    <!-- Left Arm -->
    <path d="M108 95 L85 65 C82 61 86 56 90 59 L112 85" fill="#3B82F6" stroke="#3B82F6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="85" cy="59" r="5" fill="#FBBF24"/>
    
    <!-- Right Arm -->
    <path d="M132 95 L155 65 C158 61 154 56 150 59 L128 85" fill="#3B82F6" stroke="#3B82F6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="155" cy="59" r="5" fill="#FBBF24"/>

    <!-- Bent Legs (Jumping off the ground) -->
    <!-- Left Leg -->
    <path d="M110 155 L95 175 C92 179 97 183 100 179 L115 158" fill="#1E3A8A" stroke="#1E3A8A" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M93 181 L87 186" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Leg -->
    <path d="M130 155 L145 175 C148 179 143 183 140 179 L125 158" fill="#1E3A8A" stroke="#1E3A8A" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M147 181 L153 186" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Burst / Energy confetti accentuating the unstoppable impulse -->
  <g fill="#F59E0B">
    <circle cx="75" cy="110" r="3"/>
    <circle cx="165" cy="110" r="3"/>
    <rect x="65" y="140" width="6" height="6" rx="1" transform="rotate(15 65 140)" fill="#EF4444"/>
    <rect x="170" y="135" width="6" height="6" rx="1" transform="rotate(45 170 135)" fill="#3B82F6"/>
    <circle cx="95" cy="45" r="2.5" fill="#10B981"/>
    <circle cx="145" cy="45" r="2.5" fill="#F59E0B"/>
  </g>
</svg>