<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background atmosphere: Cold wind lines -->
  <path d="M40 60 Q 60 50 80 60 T 120 60" stroke="#3A404D" stroke-width="2" fill="none"/>
  <path d="M30 80 Q 50 70 70 80 T 110 80" stroke="#3A404D" stroke-width="2" fill="none"/>

  <!-- Character 1 (Listener/Agreeing): The "Yes, exactly" gesture -->
  <g transform="translate(130, 100)">
    <circle cx="20" cy="20" r="15" fill="#FFB86C"/> <!-- Head -->
    <path d="M10 40 L30 40 L25 80 L15 80 Z" fill="#FFB86C"/> <!-- Body -->
    <path d="M25 45 L45 55" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/> <!-- Nodding hand gesture -->
    <path d="M15 45 L5 55" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Speaker): Emphasizing the cold weather -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="15" fill="#8BE9FD"/> <!-- Head -->
    <path d="M10 40 L30 40 L25 80 L15 80 Z" fill="#8BE9FD"/> <!-- Body -->
    <rect x="5" y="40" width="30" height="20" rx="4" fill="#FF79C6"/> <!-- Thick coat -->
  </g>

  <!-- Visualizing the "Agreement" (The semantic meaning of 可不是) -->
  <!-- Two heads nodding in unison, representing the shared realization -->
  <g transform="translate(100, 160)">
    <path d="M0 0 L10 10 L20 0" stroke="#F8F8F2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 0 L40 10 L50 0" stroke="#F8F8F2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cold weather indicator (The context of the agreement) -->
  <path d="M200 40 L200 60 M190 50 L210 50 M193 43 L207 57 M207 43 L193 57" stroke="#8BE9FD" stroke-width="3" stroke-linecap="round"/>
</svg>