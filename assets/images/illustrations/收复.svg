<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Fortification / Map Grid Elements -->
  <path d="M40 180 L200 180" stroke="#2A313C" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M40 140 L200 140" stroke="#2A313C" stroke-width="1" opacity="0.3"/>
  <path d="M40 100 L200 100" stroke="#2A313C" stroke-width="1" opacity="0.3"/>

  <!-- Retaken Territory / Fortress Symbol -->
  <g transform="translate(0, 5)">
    <!-- Castle/Fortress Base -->
    <path d="M70 155 L70 120 L90 120 L90 135 L110 135 L110 120 L130 120 L130 135 L150 135 L150 120 L170 120 L170 155 Z" fill="#2E3846"/>
    
    <!-- Fortress Walls -->
    <rect x="65" y="155" width="110" height="25" fill="#3B4654" rx="2"/>

    <!-- Gate / Inner structure -->
    <path d="M105 180 L105 150 C105 142 135 142 135 150 L135 180 Z" fill="#1A1D24"/>
  </g>

  <!-- Reclaimed Banner / Flag (Symbolizing Recovery & Victory) -->
  <g transform="translate(0, 0)">
    <!-- Flagpole -->
    <line x1="120" y1="60" x2="120" y2="150" stroke="#8C9BA5" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Victorious Flag (Dynamic waving shape) -->
    <path d="M120 60 L175 75 L155 95 L175 115 L120 100 Z" fill="#F59E0B"/>
    
    <!-- Flag accent detail -->
    <path d="M120 70 L150 78 L140 88 L150 98 L120 90 Z" fill="#D97706" opacity="0.4"/>
  </g>

  <!-- Reclaiming Hands / Recovery Action (Strong graphic framing) -->
  <g>
    <!-- Left reclaiming arm/grip -->
    <path d="M30 120 C30 100 55 90 70 105 C80 115 75 130 65 135" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <!-- Right reclaiming arm/grip -->
    <path d="M210 120 C210 100 185 90 170 105 C160 115 165 130 175 135" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Upward directional reclaiming energy arrows -->
    <path d="M95 85 L120 60 L145 85" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Focus / Success Star Sparkle -->
  <g transform="translate(120, 35)">
    <path d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10 Z" fill="#FBBF24"/>
  </g>
</svg>