<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120) rotate(15)">
    <!-- Guitar Body -->
    <path d="M-40 -80 C -70 -80, -80 -50, -80 -20 C -80 30, -50 70, 0 70 C 50 70, 80 30, 80 -20 C 80 -50, 70 -80, 40 -80 Z" fill="#FFB347"/>
    <!-- Guitar Neck -->
    <rect x="-10" y="-130" width="20" height="60" fill="#FFB347"/>
    <!-- Headstock -->
    <rect x="-15" y="-150" width="30" height="20" rx="2" fill="#FFB347"/>
    <!-- Sound Hole -->
    <circle cx="0" cy="-10" r="15" fill="#1A1D24"/>
    <!-- Strings -->
    <line x1="-5" y1="-130" x2="-5" y2="60" stroke="#E0E0E0" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-130" x2="0" y2="65" stroke="#E0E0E0" stroke-width="1" opacity="0.6"/>
    <line x1="5" y1="-130" x2="5" y2="60" stroke="#E0E0E0" stroke-width="1" opacity="0.6"/>
    <!-- Broken String Detail -->
    <path d="M-8 -130 L -8 -40 M -8 -30 L -8 50" stroke="#FF5252" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>