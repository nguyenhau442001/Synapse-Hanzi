<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements: City landscape silhouette -->
  <path d="M40 200 L40 160 L60 160 L60 140 L80 140 L80 180 L100 180 L100 150 L120 150 L120 200 Z" fill="#2D343E"/>
  <path d="M140 200 L140 130 L160 130 L160 160 L180 160 L180 200 Z" fill="#2D343E"/>
  
  <!-- The Action: A person (official) posting a public invitation -->
  <!-- Arm and hand gesture -->
  <path d="M120 120 C 140 100, 160 100, 180 120" stroke="#FFB800" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="120" r="15" fill="#FFB800"/>
  
  <!-- The Document/Notice being posted -->
  <rect x="80" y="60" width="80" height="100" rx="4" fill="#E0E6ED"/>
  <rect x="90" y="75" width="60" height="6" rx="2" fill="#1A1D24"/>
  <rect x="90" y="90" width="40" height="6" rx="2" fill="#1A1D24"/>
  <rect x="90" y="105" width="50" height="6" rx="2" fill="#1A1D24"/>
  <rect x="90" y="120" width="30" height="6" rx="2" fill="#1A1D24"/>
  
  <!-- Motion lines indicating the act of publicizing/announcing -->
  <path d="M170 80 L190 70" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
  <path d="M175 95 L195 90" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
  
  <!-- The "Tender/Professional" touch: A person pointing to the notice -->
  <g transform="translate(100, 150)">
    <circle cx="20" cy="20" r="10" fill="#FFB800"/>
    <path d="M20 30 L20 60" stroke="#FFB800" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 45 L40 55" stroke="#FFB800" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>