<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow/track shape -->
  <path d="M40 180 C40 120, 200 120, 200 180" fill="none" stroke="#252A34" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Running Track Lanes in perspective/flat hybrid -->
  <path d="M30 190 C30 130, 210 130, 210 190" fill="none" stroke="#2F3644" stroke-width="3" stroke-dasharray="6 6"/>
  
  <!-- Starting Line (Prelims / 预赛 context) -->
  <line x1="75" y1="135" x2="75" y2="185" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M70 130 L80 130 L75 125 Z" fill="#F59E0B"/> <!-- Small start flag indicator -->

  <!-- Running Athlete 1 (Left, crouching ready at starting block) -->
  <g transform="translate(60, 145)">
    <!-- Starting blocks -->
    <rect x="-12" y="32" width="10" height="6" rx="2" fill="#4B5563"/>
    <rect x="2" y="30" width="10" height="8" rx="2" fill="#4B5563"/>
    
    <!-- Body & Limbs -->
    <path d="M0 30 L10 18 L-5 22 Z" fill="#3B82F6"/> <!-- Torso -->
    <circle cx="12" cy="12" r="6" fill="#FDE047"/> <!-- Head -->
    <path d="M10 18 L22 28" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/> <!-- Arm ground -->
    <path d="M-5 22 L-15 32" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/> <!-- Arm back -->
    <path d="M0 30 L10 36" fill="none" stroke="#F87171" stroke-width="4" stroke-linecap="round"/> <!-- Leg bent -->
    <path d="M0 30 L-8 38" fill="none" stroke="#F87171" stroke-width="4" stroke-linecap="round"/> <!-- Leg back -->
  </g>

  <!-- Running Athlete 2 (Right, starting position) -->
  <g transform="translate(100, 145)">
    <!-- Starting blocks -->
    <rect x="-12" y="32" width="10" height="6" rx="2" fill="#4B5563"/>
    <rect x="2" y="30" width="10" height="8" rx="2" fill="#4B5563"/>
    
    <!-- Body & Limbs -->
    <path d="M0 30 L10 18 L-5 22 Z" fill="#10B981"/> <!-- Torso -->
    <circle cx="12" cy="12" r="6" fill="#FDE047"/> <!-- Head -->
    <path d="M10 18 L22 28" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/> <!-- Arm ground -->
    <path d="M-5 22 L-15 32" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/> <!-- Arm back -->
    <path d="M0 30 L10 36" fill="none" stroke="#F87171" stroke-width="4" stroke-linecap="round"/> <!-- Leg bent -->
    <path d="M0 30 L-8 38" fill="none" stroke="#F87171" stroke-width="4" stroke-linecap="round"/> <!-- Leg back -->
  </g>

  <!-- Timer / Stopwatch Icon floating above representing qualification/round context -->
  <g transform="translate(120, 55)">
    <circle cx="0" cy="0" r="26" fill="#1F2937" stroke="#374151" stroke-width="3"/>
    <circle cx="0" cy="0" r="21" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="90 30"/>
    <!-- Stopwatch stem -->
    <rect x="-3.5" y="-31" width="7" height="6" rx="1" fill="#F59E0B"/>
    <circle cx="0" cy="-33" r="3" fill="#F59E0B"/>
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Number "1" / Heat Indicator Badge (representing Round 1 / Prelims) -->
  <g transform="translate(65, 55)">
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#2563EB" stroke="#60A5FA" stroke-width="2"/>
    <path d="M-3 -4 L0 -8 L5 -8 L5 8" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>