<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Folder/Case File Base (Thụ lý hồ sơ / Lập án) -->
  <g transform="translate(48, 55)">
    <!-- Back Folder Tab -->
    <path d="M 20 20 H 60 L 75 35 H 124 C 131.7 35 138 41.3 138 49 V 125 C 138 132.7 131.7 139 124 139 H 20 C 12.3 139 6 132.7 6 125 V 34 C 6 26.3 12.3 20 20 20 Z" fill="#3B4252"/>
    
    <!-- Folder Interior/Shadow -->
    <rect x="14" y="45" width="116" height="88" rx="6" fill="#2E3440"/>

    <!-- Document Inside with Official Details -->
    <g transform="translate(24, 30)">
      <rect x="0" y="0" width="96" height="100" rx="4" fill="#ECEFF4"/>
      <!-- Header lines -->
      <rect x="16" y="18" width="40" height="6" rx="3" fill="#D8DEE9"/>
      <rect x="16" y="30" width="64" height="4" rx="2" fill="#E5E9F0"/>
      <rect x="16" y="38" width="52" height="4" rx="2" fill="#E5E9F0"/>
      
      <!-- Legal Text Lines representation -->
      <rect x="16" y="56" width="64" height="4" rx="2" fill="#D8DEE9"/>
      <rect x="16" y="66" width="56" height="4" rx="2" fill="#D8DEE9"/>
      <rect x="16" y="76" width="40" height="4" rx="2" fill="#D8DEE9"/>
    </g>

    <!-- Front Folder Cover -->
    <path d="M 6 52 C 6 45.4 11.4 40 18 40 H 126 C 132.6 40 138 45.4 138 52 V 127 C 138 133.6 132.6 139 126 139 H 18 C 11.4 139 6 133.6 6 127 Z" fill="#4C566A"/>

    <!-- Official Red Seal / Stamp (Con dấu thụ lý chính thức) -->
    <g transform="translate(85, 82)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#BF616A" stroke-width="3" stroke-dasharray="3,2"/>
      <circle cx="20" cy="20" r="13" fill="#BF616A" opacity="0.15"/>
      <path d="M 12 20 L 17 25 L 28 14" fill="none" stroke="#BF616A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Golden Scale of Justice Accent (Luật pháp / Điều tra) -->
    <g transform="translate(78, 15)">
      <!-- Scale Beam & Pillar -->
      <path d="M 15 2 H 25 L 20 18 Z" fill="#EBCB8B"/>
      <rect x="18" y="18" width="4" height="12" rx="1" fill="#EBCB8B"/>
      <path d="M 10 30 H 30" stroke="#EBCB8B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Pans -->
      <path d="M 6 36 L 10 42 H 2 Z" fill="#EBCB8B"/>
      <path d="M 30 36 L 34 42 H 26 Z" fill="#EBCB8B"/>
      <line x1="8" y1="30" x2="6" y2="36" stroke="#EBCB8B" stroke-width="1.5"/>
      <line x1="12" y1="30" x2="10" y2="36" stroke="#EBCB8B" stroke-width="1.5"/>
      <line x1="28" y1="30" x2="26" y2="36" stroke="#EBCB8B" stroke-width="1.5"/>
      <line x1="32" y1="30" x2="34" y2="36" stroke="#EBCB8B" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Accent Focus Glow / Pen Tip representing "Lập" (Recording/Filing) -->
  <g transform="translate(152, 132)">
    <circle cx="16" cy="16" r="22" fill="#D08770" opacity="0.2"/>
    <circle cx="16" cy="16" r="14" fill="#D08770"/>
    <path d="M 10 16 L 14 20 L 23 11" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>