<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Silhouette of a teacher figure -->
  <g transform="translate(120, 120)">
    <!-- Body/Dress -->
    <path d="M-40,100 L-30,40 L-10,20 L10,20 L30,40 L40,100 Z" fill="#F39C12"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#F39C12"/>
    <!-- Hair -->
    <path d="M-25,-10 C-25,-35 25,-35 25,-10 L25,0 L-25,0 Z" fill="#2C3E50"/>
    
    <!-- The 'manifestation' effect: A warm, golden glow radiating from the figure, 
         depicted as soft, layered geometric light rays to show 'embodiment' -->
    <path d="M0,-60 L10,-30 L40,-40 L20,-10 L50,0 L20,10 L40,40 L10,30 L0,60 L-10,30 L-40,40 L-20,10 L-50,0 L-20,-10 L-40,-40 L-10,-30 Z" fill="#F39C12" opacity="0.3"/>
    
    <!-- Book held in hand to signify the teacher role -->
    <rect x="-15" y="30" width="30" height="20" rx="2" fill="#ECF0F1"/>
    <line x1="-10" y1="35" x2="10" y2="35" stroke="#1A1D24" stroke-width="2"/>
    <line x1="-10" y1="40" x2="10" y2="40" stroke="#1A1D24" stroke-width="2"/>
    <line x1="-10" y1="45" x2="5" y2="45" stroke="#1A1D24" stroke-width="2"/>
  </g>
</svg>