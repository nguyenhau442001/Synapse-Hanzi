<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Decorative auspicious water ripples in dark mode palette -->
    <path d="M40 180 C70 170, 90 190, 120 180 C150 170, 170 190, 200 180" fill="none" stroke="#2A3241" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 200 C85 193, 105 207, 130 200 C155 193, 175 207, 190 200" fill="none" stroke="#222834" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Stylized lucky carp (鲤鱼) leaping upwards, incorporating traditional curves -->
    <g transform="rotate(-25 120 100)">
      <!-- Tail fins -->
      <path d="M175 100 C195 80, 210 65, 220 55 C215 75, 205 95, 185 110 Z" fill="#E65C00"/>
      <path d="M175 100 C195 120, 210 135, 220 145 C215 125, 205 105, 185 90 Z" fill="#FF7A00"/>
      
      <!-- Main body (sleek flat vector) -->
      <path d="M50 100 C50 65, 90 55, 130 75 C165 92, 185 100, 185 100 C185 100, 165 108, 130 125 C90 145, 50 135, 50 100 Z" fill="#FF4500"/>
      
      <!-- Belly highlight/gradient overlay -->
      <path d="M65 100 C65 80, 95 72, 125 85 C150 95, 165 100, 165 100 C165 100, 150 105, 125 115 C95 128, 65 120, 65 100 Z" fill="#FFAA00"/>
      
      <!-- Dorsal fin -->
      <path d="M110 72 C120 50, 135 45, 145 42 C140 58, 130 70, 120 75 Z" fill="#FF7A00"/>
      
      <!-- Pectoral fin -->
      <path d="M100 115 C95 135, 80 145, 70 150 C80 135, 95 120, 105 112 Z" fill="#E65C00"/>
      
      <!-- Scale patterns (modern minimal crescents) -->
      <path d="M90 85 Q95 100 90 115" fill="none" stroke="#FF7A00" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M110 80 Q115 100 110 120" fill="none" stroke="#FF7A00" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M130 83 Q135 100 130 117" fill="none" stroke="#FF7A00" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Eye -->
      <circle cx="70" cy="90" r="4" fill="#1A1D24"/>
      <circle cx="71" cy="89" r="1.5" fill="#FFFFFF"/>
      
      <!-- Gill accent -->
      <path d="M82 85 C85 95, 85 105, 82 115" fill="none" stroke="#FFAA00" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Modern auspicious floating golden accents (representing fortune/prosperity) -->
    <circle cx="45" cy="55" r="3" fill="#FFD700" opacity="0.8"/>
    <circle cx="65" cy="35" r="2" fill="#FFD700" opacity="0.6"/>
    <circle cx="185" cy="45" r="4" fill="#FFD700" opacity="0.9"/>
    <circle cx="195" cy="140" r="2.5" fill="#FFD700" opacity="0.7"/>
    <circle cx="50" cy="150" r="3.5" fill="#FFD700" opacity="0.5"/>
  </g>
</svg>