<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: A worn-out traditional belt tightened heavily around spare clothing folds, visually representing "thắt lưng buộc bụng" (tightening the belt to economize) -->
  <g transform="translate(120, 120)">
    <!-- Background subtle glow/shadow -->
    <circle cx="0" cy="0" r="75" fill="#222730" opacity="0.8"/>
    
    <!-- Clothing folds / Fabric (representing 节衣 - saving/reducing clothing & expenses) -->
    <path d="M-60,-40 C-30,-50 30,-50 60,-40 C70,10 75,50 60,80 C30,90 -30,90 -60,80 C-75,50 -70,10 -60,-40 Z" fill="#2A303C"/>
    
    <!-- Inner cloth layers -->
    <path d="M-45,-25 C-20,-32 20,-32 45,-25 C52,15 55,45 45,70 C20,77 -20,77 -45,70 C-55,45 -52,15 -45,-25 Z" fill="#323A4B"/>

    <!-- The Belt (Leather strap pulled tightly to the extreme last hole) -->
    <!-- Main leather strap curving horizontally around the fabric -->
    <path d="M-85,-2 C-40,12 40,12 85,-2 L80,18 C40,32 -40,32 -80,18 Z" fill="#C67D3A"/>
    <!-- Darker shade for leather thickness -->
    <path d="M-85,2 C-40,16 40,16 85,2 L85,-2 C40,12 -40,12 -85,-2 Z" fill="#A46429"/>
    
    <!-- Belt holes and tightened end -->
    <circle cx="-65" cy="8" r="2.5" fill="#1A1D24"/>
    <circle cx="-55" cy="8" r="2.5" fill="#1A1D24"/>
    <circle cx="-45" cy="8" r="2.5" fill="#1A1D24"/>
    
    <!-- Belt Prong / Pin passing through a hole to show extreme tightening -->
    <rect x="-38" y="2" width="12" height="12" rx="2" fill="#E2B742" transform="rotate(10 -32 8)"/>
    <rect x="-35" y="5" width="6" height="6" rx="1" fill="#C67D3A"/>
    
    <!-- Belt Buckle (Gold/Brass modern clean flat design) -->
    <rect x="-46" y="-7" width="22" height="32" rx="4" fill="#F1C40F"/>
    <rect x="-41" y="-2" width="12" height="22" rx="2" fill="#2A303C"/>
    <rect x="-33" y="6" width="12" height="6" rx="1" fill="#F1C40F"/>

    <!-- Excess belt tail tucked tightly past the buckle -->
    <path d="M-46,5 L-70,12 C-74,13 -76,10 -73,7 L-46,-1 Z" fill="#B26C2A"/>
    <path d="M-55,9 L-65,11" stroke="#89511E" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle decorative minimalist sparkles indicating thrift/value -->
  <g fill="#F1C40F" opacity="0.6">
    <circle cx="55" cy="70" r="2"/>
    <circle cx="185" cy="85" r="1.5"/>
    <circle cx="70" cy="170" r="1.5"/>
  </g>
</svg>