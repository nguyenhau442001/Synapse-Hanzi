<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Bank / Institution Building Icon representing "Bank interest rate" context -->
  <g transform="translate(0, 0)">
    <!-- Base platform -->
    <rect x="52" y="155" width="136" height="12" rx="4" fill="#3A4252"/>
    <rect x="62" y="147" width="116" height="8" rx="2" fill="#4E586E"/>

    <!-- Pillars -->
    <rect x="76" y="95" width="12" height="48" rx="2" fill="#8892B0"/>
    <rect x="104" y="95" width="12" height="48" rx="2" fill="#8892B0"/>
    <rect x="132" y="95" width="12" height="48" rx="2" fill="#8892B0"/>
    <rect x="160" y="95" width="12" height="48" rx="2" fill="#8892B0"/>

    <!-- Roof Pediment -->
    <path d="M 60 95 L 120 55 L 180 95 Z" fill="#4E586E"/>
    <path d="M 64 91 L 120 59 L 176 91 Z" fill="#3A4252"/>

    <!-- Coin / Asset Object (Physical Noun representing Value/Rate) -->
    <circle cx="120" cy="120" r="22" fill="#F5A623"/>
    <circle cx="120" cy="120" r="16" fill="#F8B84E"/>
    <text x="120" y="126" font-family="sans-serif" font-weight="bold" font-size="20" fill="#1A1D24" text-anchor="middle">$</text>

    <!-- Clear, prominent downward adjustment arrow -->
    <g transform="translate(0, 10)">
      <path d="M 120 145 L 120 185" stroke="#FF5C5C" stroke-width="6" stroke-linecap="round"/>
      <path d="M 104 171 L 120 189 L 136 171" fill="none" stroke="#FF5C5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>