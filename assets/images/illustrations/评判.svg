<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Scale Base / Stand -->
    <path d="M120 160 L120 195" stroke="#4A5568" stroke-width="6" stroke-linecap="round"/>
    <path d="M95 195 L145 195" stroke="#4A5568" stroke-width="6" stroke-linecap="round"/>
    <path d="M105 178 L135 178" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Scale Pillar & Center Pivot -->
    <path d="M120 65 L120 160" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="65" r="7" fill="#F59E0B"/>
    
    <!-- Beam -->
    <path d="M60 75 L180 75" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="60" cy="75" r="4" fill="#F59E0B"/>
    <circle cx="180" cy="75" r="4" fill="#F59E0B"/>
    
    <!-- Left Chain & Pan -->
    <path d="M60 75 L60 115" stroke="#94A3B8" stroke-width="2"/>
    <path d="M60 75 L45 100" stroke="#94A3B8" stroke-width="2"/>
    <path d="M60 75 L75 100" stroke="#94A3B8" stroke-width="2"/>
    <path d="M40 100 Q60 120 80 100" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <!-- Left Weight (Document/Evidence) -->
    <rect x="52" y="92" width="16" height="12" rx="2" fill="#38BDF8"/>
    <path d="M55 96 L65 96" stroke="#0F172A" stroke-width="1.5"/>
    <path d="M55 100 L62 100" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Right Chain & Pan -->
    <path d="M180 75 L180 125" stroke="#94A3B8" stroke-width="2"/>
    <path d="M180 75 L165 110" stroke="#94A3B8" stroke-width="2"/>
    <path d="M180 75 L195 110" stroke="#94A3B8" stroke-width="2"/>
    <path d="M160 110 Q180 130 200 110" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Weight (Gavel head representing judgment) -->
    <rect x="171" y="100" width="18" height="12" rx="3" fill="#EF4444"/>
    <rect x="176" y="95" width="8" height="5" fill="#CBD5E1"/>

    <!-- Gavel (Symbol of ruling/evaluating) resting across base -->
    <g transform="translate(120, 140) rotate(-15)">
      <!-- Handle -->
      <rect x="-35" y="-3" width="70" height="6" rx="3" fill="#D97706"/>
      <!-- Head -->
      <rect x="-42" y="-10" width="14" height="20" rx="3" fill="#B45309"/>
      <rect x="28" y="-10" width="14" height="20" rx="3" fill="#B45309"/>
    </g>
  </g>
</svg>