<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle tactical grid lines in background -->
  <path d="M40 120 H200 M120 40 V200" stroke="#252A34" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="70" stroke="#252A34" stroke-width="1" fill="none"/>
  
  <!-- Two converging tactical forces (representing "兵分两路" / dual-prong attack) -->
  <g opacity="0.8">
    <path d="M50 80 L90 80 L110 100" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M50 160 L90 160 L110 140" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Central Target / Strongpoint (The Object/Location of the Attack) -->
  <g transform="translate(120, 120)">
    <!-- Outer fortification rings -->
    <circle r="42" fill="#222733" stroke="#323846" stroke-width="2"/>
    <circle r="30" fill="#1E232F" stroke="#FF6B35" stroke-width="2" stroke-dasharray="6 3"/>
    
    <!-- Central stronghold icon (Concrete bunker / fortress structure) -->
    <path d="M-18 12 L-22 -4 L-12 -14 L12 -14 L22 -4 L18 12 Z" fill="#2E3544" stroke="#485367" stroke-width="2"/>
    <rect x="-8" y="-4" width="16" height="16" fill="#1A1D24" rx="2"/>
    <rect x="-14" y="2" width="28" height="3" fill="#FF6B35"/>
  </g>

  <!-- Main Offensive Strike Vectors (Strong, dynamic arrows piercing toward the center) -->
  <!-- Top-left attack force arrow -->
  <g transform="translate(120, 120)">
    <path d="M -70 -50 L -35 -35" stroke="#FFA15C" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-30,-30 -42,-42 -38,-28" fill="#FFA15C"/>
  </g>

  <!-- Bottom-left attack force arrow -->
  <g transform="translate(120, 120)">
    <path d="M -70 50 L -35 35" stroke="#FFA15C" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-30,30 -42,28 -38,42" fill="#FFA15C"/>
  </g>

  <!-- Impact / Force collision markers -->
  <circle cx="82" cy="92" r="4" fill="#FFFFFF"/>
  <circle cx="82" cy="148" r="4" fill="#FFFFFF"/>
  
  <!-- Shockwave / Impact dynamic lines on the target -->
  <path d="M 88 105 L 78 100" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
  <path d="M 88 135 L 78 140" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
</svg>