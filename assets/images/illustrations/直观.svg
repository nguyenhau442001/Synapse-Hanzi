<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow representing a modern dashboard display -->
  <circle cx="120" cy="115" r="75" fill="#222733" opacity="0.6"/>
  <path d="M60 150 L90 120 L130 140 L180 80" stroke="#2B3445" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Main iconic object: A crystal-clear, glowing holographic globe and rising trend chart (Direct/Intuitive visualization) -->
  <!-- Chart Area Fill -->
  <path d="M65 145 L95 105 L135 120 L175 65 L175 160 L65 160 Z" fill="#FF9F43" opacity="0.12"/>
  
  <!-- Trend Line -->
  <path d="M65 145 L95 105 L135 120 L175 65" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Data Points -->
  <circle cx="65" cy="145" r="4" fill="#1A1D24" stroke="#FF9F43" stroke-width="3"/>
  <circle cx="95" cy="105" r="4" fill="#1A1D24" stroke="#FF9F43" stroke-width="3"/>
  <circle cx="135" cy="120" r="4" fill="#1A1D24" stroke="#FF9F43" stroke-width="3"/>
  <circle cx="175" cy="65" r="5" fill="#FF9F43"/>
  <circle cx="175" cy="65" r="9" stroke="#FF9F43" stroke-width="2" opacity="0.4" fill="none"/>

  <!-- Holographic / Magnifying Lens Frame (representing "Zhìguān" - clear, direct observation) -->
  <!-- Handle -->
  <path d="M145 145 L180 180" stroke="#546E7A" stroke-width="8" stroke-linecap="round"/>
  <circle cx="185" cy="185" r="3" fill="#546E7A"/>
  
  <!-- Lens Ring -->
  <circle cx="105" cy="105" r="45" fill="none" stroke="#00D2D3" stroke-width="4"/>
  
  <!-- Highlight on Lens -->
  <path d="M75 85 A 45 45 0 0 1 125 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Sparkle of clarity -->
  <path d="M105 50 L107 58 L115 60 L107 62 L105 70 L103 62 L95 60 L103 58 Z" fill="#00D2D3"/>
</svg>