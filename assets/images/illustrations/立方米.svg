<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 125)">
    <!-- Isometric Cube / Cubic Meter Representation -->
    <!-- Back faces for depth/darkness -->
    <path d="M 0,-60 L 52,-30 L 0,0 L -52,-30 Z" fill="#242B38"/>
    <path d="M -52,-30 L 0,0 L 0,60 L -52,30 Z" fill="#2C3545"/>
    <path d="M 0,0 L 52,-30 L 52,30 L 0,60 Z" fill="#364156"/>

    <!-- Bright Top Face -->
    <path d="M 0,-70 L 60,-38 L 0,-6 L -60,-38 Z" fill="#4B5C7E"/>
    <!-- Left Face -->
    <path d="M -60,-38 L 0,-6 L 0,62 L -60,30 Z" fill="#F59E0B"/>
    <!-- Right Face -->
    <path d="M 0,-6 L 60,-38 L 60,30 L 0,62 Z" fill="#D97706"/>

    <!-- Grid lines on faces to emphasize volume/measurement (1m x 1m x 1m grid aesthetic) -->
    <!-- Left face grid -->
    <line x1="-30" y1="-22" x2="-30" y2="46" stroke="#B45309" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="-60" y1="-4" x2="0" y2="28" stroke="#B45309" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Right face grid -->
    <line x1="30" y1="-22" x2="30" y2="46" stroke="#B45309" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="0" y1="-4" x2="60" y2="28" stroke="#B45309" stroke-width="1.5" opacity="0.4"/>

    <!-- Top face grid -->
    <line x1="-30" y1="-38" x2="30" y2="-6" stroke="#374151" stroke-width="1.5" opacity="0.5"/>
    <line x1="-30" y1="-22" x2="30" y2="-54" stroke="#374151" stroke-width="1.5" opacity="0.5"/>

    <!-- Outer crisp edge highlight -->
    <path d="M 0,-70 L 60,-38 L 60,30 L 0,62 L -60,30 L -60,-38 Z" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 0,-70 L 0,-6 L 0,62" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <path d="M -60,-38 L 0,-6 L 60,-38" fill="none" stroke="#FBBF24" stroke-width="2"/>
  </g>

  <!-- Contextual subtle excavation / earth element at the base to connect with construction theme -->
  <path d="M 40,205 Q 120,190 200,205 L 210,215 Q 120,225 30,215 Z" fill="#111318" opacity="0.8"/>
  <circle cx="70" cy="208" r="3" fill="#374151"/>
  <circle cx="160" cy="210" r="2" fill="#374151"/>
  <circle cx="105" cy="214" r="2.5" fill="#374151"/>
</svg>