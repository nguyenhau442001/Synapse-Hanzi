    <path d="M98 100 L96 97" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M142 100 L144 97" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M120 110 L117 122 C117 123 118 124 120 124 C122 124 123 123 123 122 Z" fill="#E8B493"/>

    <!-- Gentle Smile (Warm, dignified) -->
    <path d="M110 134 Q120 142 130 134" stroke="#C97A6B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Subtle Rosy Cheeks -->
    <circle cx="103" cy="118" r="7" fill="#F48FB1" opacity="0.3"/>
    <circle cx="137" cy="118" r="7" fill="#F48FB1" opacity="0.3"/>
