  <!-- Golden Accent / Glow representing time's grace & radiance ("秀丽容颜") -->
  <circle cx="120" cy="105" r="62" stroke="#F6C90E" stroke-width="1.5" stroke-dasharray="6 8" fill="none" opacity="0.4"/>
