<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle depth elements -->
  <circle cx="120" cy="120" r="80" fill="#222732" opacity="0.6"/>
  <circle cx="120" cy="120" r="60" fill="#2A303C" opacity="0.4"/>

  <!-- Central Concept: "天性" (Innate nature / Curiosity of a child) -->
  <!-- A curious child's silhouette/character peeking through or reaching upward with dynamic sparks of curiosity/nature -->
  
  <!-- Radiating sparks of curiosity & innate energy (Gold/Orange accents) -->
  <g fill="none" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round">
    <path d="M120 45 L120 30" />
    <path d="M165 65 L175 55" />
    <path d="M190 110 L205 110" />
    <path d="M75 65 L65 55" />
    <path d="M50 110 L35 110" />
  </g>
  
  <!-- Small glowing dots for energy/life -->
  <circle cx="155" cy="50" r="3" fill="#FF9F43" />
  <circle cx="85" cy="50" r="2" fill="#FF9F43" />
  <circle cx="195" cy="85" r="2" fill="#FF9F43" />
  <circle cx="45" cy="85" r="3" fill="#FF9F43" />

  <!-- Child Character (Flat Modern Vector Style) -->
  <!-- Torso & Clothing -->
  <path d="M85 175 C85 150 155 150 155 175 L165 200 C165 205 155 210 120 210 C85 210 75 205 75 200 Z" fill="#3B82F6"/>
  
  <!-- Head -->
  <circle cx="120" cy="115" r="28" fill="#FCD34D"/>
  
  <!-- Hair (Curious messy tuft) -->
  <path d="M95 105 C95 90 110 85 120 85 C130 85 145 90 145 105 C140 100 130 95 120 95 C110 95 100 100 95 105 Z" fill="#D97706"/>

  <!-- Face features (Happy, expressive eyes and smile) -->
  <circle cx="110" cy="115" r="3.5" fill="#1A1D24"/>
  <circle cx="130" cy="115" r="3.5" fill="#1A1D24"/>
  <path d="M113 125 Q120 132 127 125" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arms reaching up enthusiastically (Innate energy) -->
  <path d="M92 145 L65 115" fill="none" stroke="#FCD34D" stroke-width="8" stroke-linecap="round"/>
  <path d="M148 145 L175 115" fill="none" stroke="#FCD34D" stroke-width="8" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="62" cy="112" r="5" fill="#FCD34D"/>
  <circle cx="178" cy="112" r="5" fill="#FCD34D"/>

  <!-- Grounding element / subtle shadow -->
  <ellipse cx="120" cy="212" rx="45" ry="6" fill="#111318"/>
</svg>