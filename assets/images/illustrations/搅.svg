<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Pot shadow -->
  <ellipse cx="120" cy="180" rx="70" ry="12" fill="#111317" opacity="0.6"/>

  <!-- Pot body -->
  <path d="M 65 110 C 65 165, 175 165, 175 110 Z" fill="#2E3340"/>
  <path d="M 60 100 L 180 100 C 185 100, 185 110, 180 110 L 60 110 C 55 110, 55 100, 60 100 Z" fill="#3E4456"/>
  
  <!-- Pot rim -->
  <ellipse cx="120" cy="100" rx="60" ry="12" fill="#4E5668"/>

  <!-- Porridge inside pot (Red bean sweet porridge) -->
  <ellipse cx="120" cy="102" rx="55" ry="10" fill="#B84242"/>

  <!-- Swirl lines for stirring action -->
  <path d="M 100 100 C 100 95, 130 95, 135 102 C 140 108, 110 108, 105 102" fill="none" stroke="#D15555" stroke-width="4" stroke-linecap="round"/>
  <circle cx="115" cy="100" r="3" fill="#E67373"/>
  <circle cx="130" cy="104" r="2.5" fill="#E67373"/>

  <!-- Wooden spoon stirring -->
  <!-- Spoon handle slanted down into the pot -->
  <path d="M 155 35 L 125 98" stroke="#D99B66" stroke-width="6" stroke-linecap="round"/>
  <!-- Spoon bowl submerged/interacting with porridge -->
  <ellipse cx="120" cy="102" rx="10" ry="6" fill="#C2834D" transform="rotate(-30 120 102)"/>

  <!-- Motion lines / Stirring effect surrounding the spoon -->
  <path d="M 90 90 C 80 100, 90 115, 105 118" fill="none" stroke="#F5B85D" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 145 92 C 155 102, 145 115, 135 118" fill="none" stroke="#F5B85D" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Dynamic curved arrow indicating clockwise motion -->
  <path d="M 140 75 C 160 80, 165 100, 150 118" fill="none" stroke="#F5B85D" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="146,122 158,122 150,110" fill="#F5B85D"/>
</svg>