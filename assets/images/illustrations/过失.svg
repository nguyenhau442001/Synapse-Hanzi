<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 过失 (slip-up, oversight, unintentional mistake) -->
  <g transform="translate(0, 0)">
    <!-- Dropped Coffee Cup / Accidental Spill Scenario representing unintended oversight -->
    <!-- Desk surface -->
    <path d="M40 185 L200 185" stroke="#2F3640" stroke-width="4" stroke-linecap="round"/>

    <!-- Puddle of spilled liquid (Warning Orange) -->
    <path d="M100 183 C110 178, 145 178, 165 183 C180 186, 175 192, 130 192 C85 192, 90 186, 100 183 Z" fill="#FF9F43" opacity="0.85"/>
    <!-- Splash drops -->
    <circle cx="90" cy="183" r="3" fill="#FF9F43"/>
    <circle cx="168" cy="184" r="2.5" fill="#FF9F43"/>

    <!-- Fallen Ceramic Mug -->
    <g transform="translate(130, 165) rotate(75)">
      <!-- Mug Body -->
      <path d="M-12 -18 L12 -18 L10 14 C10 17, 7 19, 3 19 L-3 19 C-7 19, -10 17, -10 14 Z" fill="#E4E7EB"/>
      <!-- Mug Rim -->
      <ellipse cx="0" cy="-18" rx="12" ry="3.5" fill="#CBD5E1"/>
      <!-- Mug Handle -->
      <path d="M-10 -10 C-18 -10, -18 6, -10 8" stroke="#CBD5E1" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Exclamation Mark / Oversight Indicator Floating Above -->
    <g transform="translate(120, 85)">
      <!-- Outer glowing hazard ring (clean geometric, no badges) -->
      <circle cx="0" cy="0" r="32" fill="#FF9F43" opacity="0.12"/>
      
      <!-- Warning triangle symbol -->
      <path d="M0 -26 L26 20 L-26 20 Z" fill="#1A1D24" stroke="#FF9F43" stroke-width="4" stroke-linejoin="round"/>
      
      <!-- Exclamation mark elements inside triangle -->
      <rect x="-2.5" y="-9" width="5" height="15" rx="2.5" fill="#FF9F43"/>
      <circle cx="0" cy="12" r="2.5" fill="#FF9F43"/>
    </g>

    <!-- Motion lines indicating the sudden clumsy slip -->
    <path d="M95 110 C100 100, 105 95, 112 92" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="4 3"/>
    <path d="M145 115 C140 105, 135 98, 128 94" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="4 3"/>
  </g>
</svg>