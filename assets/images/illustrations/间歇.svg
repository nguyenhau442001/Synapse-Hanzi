<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background stormy sky transitioning to a clear break -->
  <!-- Dark storm clouds on left and right -->
  <path d="M 20 80 Q 30 60 55 65 Q 75 40 105 55 Q 120 50 135 60 L 135 120 L 20 120 Z" fill="#2C3545" opacity="0.7"/>
  <path d="M 120 55 Q 140 40 170 55 Q 195 45 210 70 Q 225 75 220 100 L 220 120 L 120 120 Z" fill="#2C3545" opacity="0.7"/>

  <!-- Rain on sides -->
  <g stroke="#4A5B78" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="35" y1="90" x2="25" y2="120"/>
    <line x1="55" y1="85" x2="45" y2="115"/>
    <line x1="85" y1="75" x2="75" y2="105"/>
    <line x1="165" y1="75" x2="155" y2="105"/>
    <line x1="195" y1="85" x2="185" y2="115"/>
    <line x1="210" y1="95" x2="200" y2="125"/>
  </g>

  <!-- Central calm window (The 間歇 / Break / Pause in storm) -->
  <rect x="90" y="45" width="60" height="110" rx="30" fill="#1E2633"/>

  <!-- Golden sun rays shining through the clear break -->
  <circle cx="120" cy="100" r="22" fill="#F39C12"/>
  <path d="M 120 60 L 120 70 M 120 130 L 120 140 M 85 100 L 95 100 M 145 100 L 155 100" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>

  <!-- Ground horizon and peaceful element (Calm water reflection / landscape) -->
  <path d="M 20 150 L 220 150" stroke="#3E4C65" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 150 C 90 142, 110 142, 120 150 C 130 142, 150 142, 160 150" fill="none" stroke="#F39C12" stroke-width="2" opacity="0.8"/>

  <!-- Calm bird soaring through the pause/interval -->
  <path d="M 105 95 Q 112 90 120 98 Q 128 90 135 95" fill="none" stroke="#ECF0F1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Conceptual structural brackets indicating the interval segment -->
  <path d="M 90 175 L 80 175 L 80 190 L 90 190" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="90" y1="182.5" x2="150" y2="182.5" stroke="#F39C12" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 150 175 L 160 175 L 160 190 L 150 190" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

</svg>