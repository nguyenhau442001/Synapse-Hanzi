<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Desk / Furniture representing bureaucracy -->
    <rect x="40" y="150" width="160" height="12" rx="3" fill="#2D323F" />
    <rect x="60" y="162" width="20" height="48" fill="#1F232D" />
    <rect x="160" y="162" width="20" height="48" fill="#1F232D" />
    
    <!-- Impenetrable Tall Stacks of Red Tape / Paperwork -->
    <rect x="80" y="105" width="36" height="45" rx="2" fill="#363C4E" />
    <rect x="83" y="112" width="30" height="3" fill="#D94E4E" />
    <rect x="83" y="122" width="30" height="3" fill="#D94E4E" />
    <rect x="83" y="132" width="30" height="3" fill="#D94E4E" />

    <rect x="124" y="90" width="36" height="60" rx="2" fill="#363C4E" />
    <rect x="127" y="97" width="30" height="3" fill="#D94E4E" />
    <rect x="127" y="107" width="30" height="3" fill="#D94E4E" />
    <rect x="127" y="117" width="30" height="3" fill="#D94E4E" />
    <rect x="127" y="127" width="30" height="3" fill="#D94E4E" />
    <rect x="127" y="137" width="30" height="3" fill="#D94E4E" />

    <!-- Official Stamp / Seal (Symbol of bureaucratic authority) -->
    <rect x="155" y="125" width="22" height="25" rx="3" fill="#E06C42" />
    <rect x="161" y="115" width="10" height="12" fill="#C5542E" />
    <circle cx="166" cy="137" r="5" fill="#9C3A1C" />

    <!-- Distant / Detached Official Figure (Silhouette behind the barrier of paperwork) -->
    <circle cx="120" cy="55" r="18" fill="#5C6479" />
    <path d="M 85 95 C 85 75, 100 70, 120 70 C 140 70, 155 75, 155 95 Z" fill="#5C6479" />
    
    <!-- Stern, impassive official expression (simplified flat style) -->
    <rect x="113" y="52" width="14" height="3" rx="1.5" fill="#1A1D24" />

    <!-- Official Badge / Gold Accent -->
    <circle cx="120" cy="82" r="5" fill="#E5A93B" />

    <!-- Barrier effect: Outstretched ordinary citizen hand reaching over from the side, ignored or blocked -->
    <path d="M 25 180 L 55 170 L 55 185 L 25 195 Z" fill="#E2B28B" />
    <rect x="15" y="182" width="15" height="10" rx="4" fill="#E2B28B" />
  </g>
</svg>