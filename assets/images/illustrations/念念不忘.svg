  <path d="M140 165 C148 145, 136 120, 122 118" stroke="#2563EB" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Hands gently cupping the central glowing memory -->
  <circle cx="112" cy="116" r="5" fill="#CBD5E1"/>
  <circle cx="128" cy="116" r="5" fill="#CBD5E1"/>

  <!-- Sparkles of deep recollection -->
  <path d="M78 95 L82 103 L90 107 L82 111 L78 119 L74 111 L66 107 L74 103 Z" fill="#F59E0B" opacity="0.8"/>
  <path d="M162 95 L165 100 L170 103 L165 106 L162 111 L159 106 L154 103 L159 100 Z" fill="#F59E0B" opacity="0.8"/>
  <circle cx="148" cy="84" r="2.5" fill="#FBBF24"/>
  <circle cx="92" cy="84" r="2" fill="#FBBF24"/>

  <!-- Motion/Focus lines near head indicating mental persistence ("念念不忘") -->
  <path d="M102 135 C96 132, 92 126, 90 120" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M138 135 C144 132, 148 126, 150 120" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>