<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Subtle lab/industrial tech grid) -->
  <g opacity="0.15" stroke="#4A5568" stroke-width="1" stroke-dasharray="2 4">
    <line x1="40" y1="40" x2="200" y2="40" />
    <line x1="40" y1="200" x2="200" y2="200" />
    <line x1="40" y1="40" x2="40" y2="200" />
    <line x1="200" y1="40" x2="200" y2="200" />
  </g>

  <!-- Vacuum Chamber / Sealed Pouch Structure representing 真空 (Vacuum/Hermetic seal) -->
  <!-- Contextual reference: food packaging vacuum seal -->
  
  <!-- Outer glowing energy/tech aura for modern educational feel -->
  <rect x="75" y="55" width="90" height="130" rx="12" fill="none" stroke="#F6AD55" stroke-width="1" opacity="0.4" stroke-dasharray="6 4"/>

  <!-- Vacuum Food Pouch (Semi-transparent dark body) -->
  <rect x="80" y="60" width="80" height="120" rx="10" fill="#2D3748" stroke="#718096" stroke-width="2"/>

  <!-- Sealed top edge (Heat seal pattern) -->
  <path d="M 85 70 L 155 70" stroke="#A0AEC0" stroke-width="3" stroke-dasharray="3 3"/>
  
  <!-- "Vacuumized" compressed effect lines on package sides -->
  <path d="M 82 90 L 86 95 L 82 100" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <path d="M 158 90 L 154 95 L 158 100" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <path d="M 82 140 L 86 145 L 82 150" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  <path d="M 158 140 L 154 145 L 158 150" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>

  <!-- Contents inside: Fresh food item (e.g., golden roasted meat/sausage slice tightly compressed) -->
  <g transform="translate(100, 95)">
    <!-- Food shadow -->
    <ellipse cx="20" cy="55" rx="15" ry="6" fill="#1A1D24" opacity="0.6"/>
    
    <!-- Main Food Item (Sliced Roast Meat / Cooked Food) -->
    <path d="M 5 20 C 5 10, 35 10, 35 20 C 45 30, 45 60, 35 70 C 5 70, 5 40, 5 20 Z" fill="#DD6B20"/>
    <path d="M 8 22 C 8 13, 32 13, 32 22 C 40 31, 40 58, 32 67 C 8 67, 8 40, 8 22 Z" fill="#ED8936"/>
    
    <!-- Grill marks / texture -->
    <path d="M 12 30 L 28 35" stroke="#C05621" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 10 45 L 30 50" stroke="#C05621" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14 60 L 26 63" stroke="#C05621" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Vacuum / Air-removal indicator elements (Zero Air / Negative Pressure concept) -->
  <!-- Air extraction suction icons / arrows pulling outward -->
  <g stroke="#319795" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top suction indicator -->
    <path d="M 120 40 L 120 52"/>
    <path d="M 115 45 L 120 40 L 125 45"/>
    
    <!-- Left suction -->
    <path d="M 55 120 L 67 120"/>
    <path d="M 60 115 L 55 120 L 60 125"/>

    <!-- Right suction -->
    <path d="M 185 120 L 173 120"/>
    <path d="M 180 115 L 185 120 L 180 125"/>
  </g>

  <!-- Absolute Zero / Vacuum Indicator: Minimalist '0' with precise dashed enclosure near bottom corner -->
  <circle cx="195" cy="175" r="14" fill="#2D3748" stroke="#F6AD55" stroke-width="2"/>
  <text x="195" y="181" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F6AD55" text-anchor="middle">0</text>

  <!-- Focus / Accent Ring -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="#F6AD55" stroke-width="1.5" opacity="0.3"/>
</svg>