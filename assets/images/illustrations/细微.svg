<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Magnifying Glass -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FFB800" stroke-width="6"/>
    <line x1="32" y1="32" x2="70" y2="70" stroke="#FFB800" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Surface Background -->
  <rect x="40" y="40" width="160" height="160" fill="none"/>
  
  <!-- The "Subtle" Detail (The focus) -->
  <g transform="translate(120, 120)">
    <path d="M-10 -10 L 10 -10 L 0 10 Z" fill="#FFB800"/>
    <circle cx="0" cy="0" r="3" fill="#1A1D24"/>
  </g>

  <!-- The "Large" Context (The surface) -->
  <path d="M 40 180 L 200 180" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 40 190 L 200 190" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 40 200 L 200 200" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Scale Contrast Elements -->
  <circle cx="60" cy="60" r="2" fill="#4A5568"/>
  <circle cx="180" cy="60" r="2" fill="#4A5568"/>
  <circle cx="60" cy="140" r="2" fill="#4A5568"/>
  <circle cx="180" cy="140" r="2" fill="#4A5568"/>
</svg>