<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Globe Background representation for Global Finance -->
    <circle cx="120" cy="115" r="70" fill="#222732" stroke="#2F3646" stroke-width="2"/>
    
    <!-- Grid lines (Longitude/Latitude) -->
    <path d="M 50 115 H 190" stroke="#2F3646" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 120 45 V 185" stroke="#2F3646" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 70 70 C 95 95, 145 95, 170 70" stroke="#2F3646" stroke-width="1.5" fill="none"/>
    <path d="M 70 160 C 95 135, 145 135, 170 160" stroke="#2F3646" stroke-width="1.5" fill="none"/>

    <!-- Central Gold Currency Symbol (USD / General Foreign Exchange concept) -->
    <circle cx="120" cy="115" r="42" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
    
    <!-- Dollar / Exchange Sign -->
    <path d="M 120 90 V 140 M 106 102 H 134 M 106 128 H 134" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 120 94 V 136" stroke="#FCD34D" stroke-width="2"/>

    <!-- Orbiting Exchange Arrows representing cross-border flow -->
    <!-- Top Right Arrow (Outgoing) -->
    <path d="M 160 75 C 180 95, 180 125, 160 145" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="160,152 153,142 167,142" fill="#38BDF8"/>

    <!-- Bottom Left Arrow (Incoming) -->
    <path d="M 80 155 C 60 135, 60 105, 80 85" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="80,78 87,88 73,88" fill="#38BDF8"/>

    <!-- Floating Secure Coins/Value markers -->
    <circle cx="172" cy="70" r="10" fill="#38BDF8"/>
    <text x="172" y="74" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#1A1D24" text-anchor="middle">€</text>

    <circle cx="68" cy="160" r="10" fill="#10B981"/>
    <text x="68" y="164" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#1A1D24" text-anchor="middle">¥</text>
  </g>
</svg>