<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ancestral Tablet (Spirit Tablet) -->
  <rect x="95" y="60" width="50" height="90" rx="4" fill="#2D343E" stroke="#FFB84D" stroke-width="3"/>
  <rect x="105" y="75" width="30" height="60" fill="#FFB84D"/>
  <rect x="118" y="85" width="4" height="40" fill="#2D343E"/>
  
  <!-- Base of the Tablet -->
  <rect x="85" y="150" width="70" height="10" rx="2" fill="#FFB84D"/>
  <rect x="90" y="160" width="60" height="8" rx="2" fill="#FFB84D"/>
  
  <!-- Offering Table -->
  <rect x="40" y="170" width="160" height="15" rx="4" fill="#3B4252"/>
  <rect x="50" y="185" width="10" height="20" fill="#3B4252"/>
  <rect x="180" y="185" width="10" height="20" fill="#3B4252"/>
  
  <!-- Offerings (Fruit/Bowl) -->
  <circle cx="80" cy="160" r="12" fill="#E06C75"/>
  <path d="M80 148 C 70 148, 70 155, 80 155 C 90 155, 90 148, 80 148" fill="#98C379"/>
  
  <!-- Incense Burner -->
  <rect x="130" y="155" width="30" height="15" rx="2" fill="#D19A66"/>
  <path d="M135 155 L138 140 M145 155 L145 135 M155 155 L152 140" stroke="#ABB2BF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <path d="M40 170 L200 170" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4"/>
</svg>