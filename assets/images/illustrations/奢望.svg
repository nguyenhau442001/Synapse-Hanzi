<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Gradient for unreachable starry objects / illusionary gold treasures -->
    <linearGradient id="unreachableGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- Atmospheric fade for distance -->
    <linearGradient id="spaceFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="1"/>
    </linearGradient>

    <!-- Character clothing gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background decorative elements (ground line and distant particles) -->
  <g opacity="0.3">
    <circle cx="60" cy="70" r="1" fill="#FFFFFF"/>
    <circle cx="180" cy="50" r="1.5" fill="#FFFFFF"/>
    <circle cx="200" cy="90" r="1" fill="#FFFFFF"/>
    <circle cx="40" cy="110" r="0.8" fill="#FFFFFF"/>
  </g>

  <!-- Ground / Firm baseline representing reality/down-to-earth nature -->
  <path d="M 30,190 L 210,190" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Subtle solid ground patch under feet -->
  <path d="M 85,190 L 125,190" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <!-- Unattainable target (Floating golden crown/wealth high in the air, symbolizing "shēwàng" - extravagant wish/illusion) -->
  <g transform="translate(145, 55)">
    <!-- Vertical dashed tracking/motion line showing the vast unreachable gap -->
    <line x1="0" y1="15" x2="0" y2="105" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
    
    <!-- Glow aura -->
    <circle cx="0" cy="10" r="22" fill="url(#unreachableGlow)" opacity="0.3"/>
    
    <!-- The extravagant object: Floating Crown / Valuables -->
    <path d="M -12,18 L 12,18 L 15,6 L 8,12 L 0,2 L -8,12 L -15,6 Z" fill="#F59E0B"/>
    <rect x="-14" y="20" width="28" height="4" rx="1" fill="#D97706"/>
    <!-- Sparkles around the illusion -->
    <path d="M 20,-5 L 23,-10 L 28,-7 L 23,-4 Z" fill="#FCD34D"/>
    <path d="M -22,25 L -20,20 L -15,22 L -20,24 Z" fill="#FCD34D"/>
  </g>

  <!-- Human Character (Action: Reaching up vainly into empty space, expressing yearning for the beyond-reach) -->
  <g transform="translate(85, 115)">
    <!-- Shadow beneath feet -->
    <ellipse cx="20" cy="75" rx="18" ry="4" fill="#0F172A" opacity="0.6"/>

    <!-- Body / Torso leaning slightly forward -->
    <path d="M 12,35 L 28,35 L 25,65 L 10,65 Z" fill="url(#shirtGrad)"/>

    <!-- Head -->
    <circle cx="20" cy="20" r="10" fill="#CBD5E1"/>
    <!-- Hair -->
    <path d="M 11,18 C 11,13 15,10 21,11 C 27,12 29,16 29,20 L 26,20 C 26,16 23,13 20,13 C 15,13 13,16 13,18 Z" fill="#475569"/>

    <!-- Supporting/Grounded Arm (steady, down-to-earth posture) -->
    <path d="M 14,38 L 5,55" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Reaching Arm (Dynamic action reaching high upward) -->
    <path d="M 26,38 C 36,25 48,15 52,8" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Open Palm / Hand trying to grasp -->
    <circle cx="53" cy="6" r="4" fill="#CBD5E1"/>

    <!-- Legs (Solid, planted stance) -->
    <path d="M 13,65 L 10,12" stroke="#1E293B" stroke-width="7" stroke-linecap="round" transform="translate(0, 53)"/>
    <path d="M 22,65 L 26,73" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Motion / Aspiration upward arcs (stylized minimalist lines indicating the stretch) -->
  <path d="M 125,95 C 130,80 135,70 140,65" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="3 3"/>

  <!-- Foreground aesthetic vignette / framing dark gradient overlay at bottom -->
  <rect x="0" y="200" width="240" height="40" fill="url(#spaceFade)" pointer-events="none"/>
</svg>