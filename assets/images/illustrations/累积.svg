<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stack of books representing accumulation of knowledge -->
  <g transform="translate(60, 60)">
    <!-- Bottom book -->
    <rect x="0" y="100" width="120" height="20" rx="2" fill="#3D4451"/>
    <rect x="5" y="102" width="110" height="16" rx="1" fill="#FFB347"/>
    
    <!-- Middle book -->
    <rect x="10" y="80" width="100" height="20" rx="2" fill="#3D4451"/>
    <rect x="15" y="82" width="90" height="16" rx="1" fill="#FFD700"/>
    
    <!-- Top book -->
    <rect x="20" y="60" width="80" height="20" rx="2" fill="#3D4451"/>
    <rect x="25" y="62" width="70" height="16" rx="1" fill="#FFA500"/>
    
    <!-- Top-most book -->
    <rect x="30" y="40" width="60" height="20" rx="2" fill="#3D4451"/>
    <rect x="35" y="42" width="50" height="16" rx="1" fill="#FFC125"/>
    
    <!-- Single book being placed on top -->
    <rect x="40" y="10" width="40" height="30" rx="2" fill="#FF8C00"/>
    <rect x="42" y="12" width="36" height="26" rx="1" fill="#FFD700"/>
    <path d="M40 25h40" stroke="#1A1D24" stroke-width="2"/>
  </g>
</svg>