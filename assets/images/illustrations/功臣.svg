<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing technological achievement -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Golden Laurel Wreath (Symbol of merit, contribution, and great honor) -->
  <g fill="none" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left branch -->
    <path d="M 120 185 C 85 185 60 155 60 115 C 60 90 70 70 85 55"/>
    <path d="M 82 72 Q 70 65 75 52 Q 88 52 92 65" fill="#F1C40F" stroke="none"/>
    <path d="M 70 95 Q 55 92 57 80 Q 70 80 75 90" fill="#F1C40F" stroke="none"/>
    <path d="M 65 125 Q 50 125 53 112 Q 67 114 70 122" fill="#F1C40F" stroke="none"/>
    <path d="M 78 155 Q 63 158 68 145 Q 80 148 83 153" fill="#F1C40F" stroke="none"/>
    <path d="M 102 178 Q 90 188 98 175 Q 106 178 106 178" fill="#F1C40F" stroke="none"/>

    <!-- Right branch -->
    <path d="M 120 185 C 155 185 180 155 180 115 C 180 90 170 70 155 55"/>
    <path d="M 158 72 Q 170 65 165 52 Q 152 52 148 65" fill="#F1C40F" stroke="none"/>
    <path d="M 170 95 Q 185 92 183 80 Q 170 80 165 90" fill="#F1C40F" stroke="none"/>
    <path d="M 175 125 Q 190 125 187 112 Q 173 114 170 122" fill="#F1C40F" stroke="none"/>
    <path d="M 162 155 Q 177 158 172 145 Q 160 148 157 153" fill="#F1C40F" stroke="none"/>
    <path d="M 138 178 Q 150 188 142 175 Q 134 178 134 178" fill="#F1C40F" stroke="none"/>
  </g>

  <!-- Central Character / Hero representation: Modern Tech Leader / Contributor -->
  <!-- Shoulders / Torso -->
  <path d="M 85 175 C 85 155 100 145 120 145 C 140 145 155 155 155 175 L 165 195 L 75 195 Z" fill="#2C3E50"/>
  
  <!-- Collar / Neck -->
  <rect x="112" y="132" width="16" height="18" fill="#F5CBA7" rx="3"/>
  <path d="M 112 145 L 120 155 L 128 145 Z" fill="#EAECEE"/> <!-- Shirt collar -->

  <!-- Head -->
  <circle cx="120" cy="112" r="22" fill="#F5CBA7"/>

  <!-- Hair (Stylized modern short hair) -->
  <path d="M 98 108 C 98 95 108 90 120 90 C 132 90 142 95 142 108 C 142 112 143 105 140 100 C 135 93 128 92 120 92 C 112 92 105 93 100 100 C 97 105 98 112 98 108 Z" fill="#34495E"/>

  <!-- Facial Expression (Confident, smiling) -->
  <!-- Eyes -->
  <circle cx="112" cy="110" r="2.5" fill="#2C3E50"/>
  <circle cx="128" cy="110" r="2.5" fill="#2C3E50"/>
  <!-- Smile -->
  <path d="M 114 120 Q 120 125 126 120" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing Merit Star (Symbolizing top achievement/contribution) -->
  <g transform="translate(120, 52) scale(0.9)">
    <polygon points="0,-15 4,-5 14,-5 6,1 9,11 0,5 -9,11 -6,1 -14,-5 -4,-5" fill="#F39C12"/>
    <polygon points="0,-12 3,-4 11,-4 5,1 7,9 0,4 -7,9 -5,1 -11,-4 -3,-4" fill="#F1C40F"/>
  </g>
</svg>