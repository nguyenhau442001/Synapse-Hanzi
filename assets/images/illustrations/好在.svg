<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow (Representing relief/ray of hope in dark mode) -->
  <circle cx="120" cy="110" r="70" fill="#3B82F6" opacity="0.1" />

  <!-- Rain Layer (Background streaks) -->
  <g opacity="0.25" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round">
    <line x1="45" y1="30" x2="35" y2="60" />
    <line x1="85" y1="20" x2="75" y2="50" />
    <line x1="155" y1="25" x2="145" y2="55" />
    <line x1="195" y1="40" x2="185" y2="70" />
    
    <line x1="30" y1="80" x2="20" y2="110" />
    <line x1="210" y1="90" x2="200" y2="120" />

    <line x1="50" y1="130" x2="40" y2="160" />
    <line x1="190" y1="140" x2="180" y2="170" />
  </g>

  <!-- The Backpack (Container/Object in context) -->
  <g transform="translate(65, 95)">
    <!-- Main Backpack Body -->
    <path d="M 35 15 C 35 5, 45 0, 55 0 C 65 0, 75 5, 75 15 L 75 95 C 75 103, 68 110, 60 110 L 50 110 C 42 110, 35 103, 35 95 Z" fill="#334155" />
    <!-- Backpack Top Flap/Pocket -->
    <path d="M 35 15 C 35 5, 45 0, 55 0 C 65 0, 75 5, 75 15 L 75 45 C 75 50, 65 52, 55 52 C 45 52, 35 50, 35 45 Z" fill="#475569" />
    <!-- Backpack Lower Front Pocket -->
    <rect x="42" y="62" width="26" height="36" rx="4" fill="#475569" />
    <!-- Zipper line -->
    <line x1="42" y1="75" x2="68" y2="75" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- The Magic Object: Opened Folded Umbrella (The "Save" / 好在 element) -->
  <g transform="translate(120, 75)">
    <!-- Umbrella Canopy (High contrast golden-orange accent for focus) -->
    <path d="M -60 10 C -60 -25, -30 -40, 0 -40 C 30 -40, 60 -25, 60 10 C 40 1, 20 -2, 0 -2 C -20 -2, -40 1, -60 10 Z" fill="#F59E0B" />
    <!-- Canopy segments/shading -->
    <path d="M 0 -40 C -15 -20, -30 2, -60 10 C -45 1, -25 -2, 0 -2 Z" fill="#D97706" opacity="0.4" />
    <path d="M 0 -40 C 15 -20, 30 2, 60 10 C 45 1, 25 -2, 0 -2 Z" fill="#FBBF24" opacity="0.4" />
    
    <!-- Umbrella Tip / Finial -->
    <line x1="0" y1="-40" x2="0" y2="-48" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    
    <!-- Umbrella Shaft -->
    <line x1="0" y1="-2" x2="0" y2="75" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Curved Handle -->
    <path d="M 0 75 C 0 88, -14 88, -14 75" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Rain Layer (Foreground streaks overlapping slightly for depth) -->
  <g opacity="0.6" stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
    <line x1="95" y1="50" x2="85" y2="85" />
    <line x1="140" y1="45" x2="130" y2="80" />
    <line x1="110" y1="110" x2="100" y2="145" />
  </g>

</svg>