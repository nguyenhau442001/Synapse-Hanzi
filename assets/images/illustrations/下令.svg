<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Subtle background glow for focus -->
    <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>

    <!-- Scroll / Imperial Edict Object (Noun representation of 下令 - Decree/Order) -->
    <!-- Hanging / Unrolling Official Decree Scroll -->
    
    <!-- Top & Bottom Rollers (Wood/Gold) -->
    <rect x="70" y="65" width="100" height="14" rx="7" fill="#E5A93B"/>
    <ellipse cx="120" cy="72" rx="50" ry="4" fill="#F1C453"/>
    
    <rect x="70" y="161" width="100" height="14" rx="7" fill="#E5A93B"/>
    <ellipse cx="120" cy="168" rx="50" ry="4" fill="#F1C453"/>
    
    <!-- Scroll Paper Body (Parchment/Off-white) -->
    <rect x="76" y="72" width="88" height="96" fill="#F4EDE2"/>
    
    <!-- Subtle shadow / shading inside the scroll -->
    <path d="M76 72 L164 72 L164 82 L76 82 Z" fill="#E8DEC9"/>
    <path d="M76 162 L164 162 L164 172 L76 172 Z" fill="#E8DEC9"/>

    <!-- Official Red Seal (Stamp of Authority) -->
    <rect x="132" y="122" width="22" height="22" rx="3" transform="rotate(12 143 133)" fill="#D93838"/>
    <rect x="136" y="126" width="14" height="14" rx="1" transform="rotate(12 143 133)" fill="none" stroke="#F4EDE2" stroke-width="1.5"/>

    <!-- Abstract authoritative text lines / calligraphy markers on the decree -->
    <line x1="92" y1="92" x2="92" y2="148" stroke="#3E4553" stroke-width="3" stroke-linecap="round"/>
    <line x1="104" y1="92" x2="104" y2="135" stroke="#3E4553" stroke-width="3" stroke-linecap="round"/>
    <line x1="116" y1="92" x2="116" y2="152" stroke="#3E4553" stroke-width="3" stroke-linecap="round"/>

    <!-- Golden Binding Ribbon -->
    <rect x="110" y="112" width="20" height="16" rx="2" fill="#E5A93B"/>
    <path d="M120 128 L125 142 L120 140 L115 142 Z" fill="#E5A93B"/>

    <!-- Emitting Command Wave / Authority Aura (Visualizing "Order" being issued) -->
    <path d="M52 100 C 44 110, 44 130, 52 140" fill="none" stroke="#F1C453" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M42 90 C 30 106, 30 134, 42 150" fill="none" stroke="#F1C453" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    
    <path d="M188 100 C 196 110, 196 130, 188 140" fill="none" stroke="#F1C453" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M198 90 C 210 106, 210 134, 198 150" fill="none" stroke="#F1C453" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>