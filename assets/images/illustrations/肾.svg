<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to give depth -->
  <circle cx="120" cy="120" r="70" fill="#222834" opacity="0.6"/>

  <!-- Left Kidney (Anatomically placed on viewer's right, showing bean shape and soft red/maroon medical tone) -->
  <g transform="translate(142, 120) rotate(-12)">
    <!-- Main Body -->
    <path d="M 0,-36 C 22,-36 34,-18 34,0 C 34,22 18,36 2,38 C -14,40 -28,24 -28,0 C -28,-18 -18,-36 0,-36 Z" 
          fill="#D9534F" stroke="#E66A67" stroke-width="2"/>
    <!-- Hilum / Renal sinus indentation -->
    <path d="M -15,-6 C -6,-2 -6,6 -15,10 C -19,4 -19,-2 -15,-6 Z" fill="#992D22"/>
    <!-- Subtle anatomical highlight -->
    <path d="M -6,-24 C 6,-24 16,-14 18,2 C 10, -8 0,-14 -12,-18 Z" fill="#FF7B78" opacity="0.4"/>
  </g>

  <!-- Right Kidney (Anatomically placed on viewer's left) -->
  <g transform="translate(98, 120) rotate(12)">
    <!-- Main Body -->
    <path d="M 0,-36 C -22,-36 -34,-18 -34,0 C -34,22 -18,36 -2,38 C 14,40 28,24 28,0 C 28,-18 18,-36 0,-36 Z" 
          fill="#D9534F" stroke="#E66A67" stroke-width="2"/>
    <!-- Hilum / Renal sinus indentation -->
    <path d="M 15,-6 C 6,-2 6,6 15,10 C 19,4 19,-2 15,-6 Z" fill="#992D22"/>
    <!-- Subtle anatomical highlight -->
    <path d="M 6,-24 C -6,-24 -16,-14 -18,2 C -10,-8 0,-14 12,-18 Z" fill="#FF7B78" opacity="0.4"/>
  </g>

  <!-- Renal Vasculature & Ureters (Medical context lines) -->
  <!-- Aorta & Vena Cava trunk -->
  <rect x="117" y="65" width="6" height="45" rx="3" fill="#3A4454"/>
  
  <!-- Left Renal Artery & Vein -->
  <path d="M 120,80 Q 133,75 142,88" fill="none" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120,92 Q 133,87 142,100" fill="none" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Renal Artery & Vein -->
  <path d="M 120,80 Q 107,75 98,88" fill="none" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120,92 Q 107,87 98,100" fill="none" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>

  <!-- Ureters extending downwards -->
  <path d="M 132,150 Q 130,175 125,195" fill="none" stroke="#BDC3C7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 108,150 Q 110,175 115,195" fill="none" stroke="#BDC3C7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Focus / Accent Ring -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#F1C40F" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
</svg>