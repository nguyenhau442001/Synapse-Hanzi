<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain landscape background -->
  <path d="M0 180 L60 100 L120 150 L180 80 L240 140 L240 240 L0 240 Z" fill="#2C3440"/>
  <path d="M20 240 L80 120 L140 170 L200 110 L240 160 L240 240 Z" fill="#3D4756"/>
  
  <!-- Train track -->
  <path d="M0 200 L240 160" stroke="#5D697A" stroke-width="4" stroke-dasharray="10 10"/>
  
  <!-- Train carriage -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="120" height="50" rx="4" fill="#FFB84D"/>
    <rect x="10" y="10" width="30" height="30" rx="2" fill="#1A1D24"/>
    <rect x="45" y="10" width="30" height="30" rx="2" fill="#1A1D24"/>
    <rect x="80" y="10" width="30" height="30" rx="2" fill="#1A1D24"/>
    <rect x="0" y="50" width="120" height="10" fill="#E69F2E"/>
  </g>
  
  <!-- Scenic view indicator (The "along the way" concept) -->
  <path d="M20 80 L40 60 M220 100 L200 80 M120 50 L140 30" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="3" fill="#FFD700"/>
  <circle cx="180" cy="100" r="3" fill="#FFD700"/>
  <circle cx="60" cy="140" r="3" fill="#FFD700"/>
</svg>