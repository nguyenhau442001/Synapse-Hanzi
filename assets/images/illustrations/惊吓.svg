<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171E"/>
      <stop offset="100%" stop-color="#1E2330"/>
    </linearGradient>

    <!-- Shock/Alert Glow Gradient -->
    <radialGradient id="shockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF9800" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Uniform Gradient -->
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A506B"/>
      <stop offset="100%" stop-color="#233245"/>
    </linearGradient>

    <!-- Flash/Shockwave Gradient -->
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Background Shockwave / Panic Aura -->
  <circle cx="120" cy="120" r="85" fill="url(#shockGlow)"/>

  <!-- Dynamic Fear Lines (Radiating out) -->
  <g stroke="#FF9800" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="35" x2="120" y2="20" />
    <line x1="165" y1="55" x2="175" y2="45" />
    <line x1="190" y1="95" x2="205" y2="90" />
    <line x1="75" y1="55" x2="65" y2="45" />
    <line x1="50" y1="95" x2="35" y2="90" />
  </g>

  <!-- Panic Sweat Droplets -->
  <g fill="#00E5FF">
    <path d="M 158 75 C 158 75, 164 85, 164 89 C 164 92.3, 161.3 95, 158 95 C 154.7 95, 152 92.3, 152 89 C 152 85, 158 75, 158 75 Z" opacity="0.85"/>
    <path d="M 82 82 C 82 82, 86 89, 86 92 C 86 94.2, 84.2 96, 82 96 C 79.8 96, 78 94.2, 78 92 C 78 89, 82 82, 82 82 Z" opacity="0.85"/>
  </g>

  <!-- CHARACTER: Young Guard / Person startled (Noun representation) -->
  <g id="startled-character">
    <!-- Shoulders & Uniform Body -->
    <path d="M 75 195 L 70 160 C 70 145, 85 135, 120 135 C 155 135, 170 145, 170 160 L 165 195 Z" fill="url(#uniformGrad)"/>
    
    <!-- Collar / Neck -->
    <path d="M 105 135 L 120 145 L 135 135 L 130 120 L 110 120 Z" fill="#2C3E50"/>
    <rect x="112" y="115" width="16" height="12" rx="3" fill="#EAEAEA"/>

    <!-- Guard Cap (Visor tilted back in shock) -->
    <g transform="translate(120, 75)">
      <path d="M -30 -10 C -30 -25, -15 -35, 0 -35 C 15 -35, 30 -25, 30 -10 Z" fill="#1B2A38"/>
      <!-- Cap Visor -->
      <path d="M -32 -8 C -32 -8, 0 -2, 35 -12 C 35 -12, 38 2, 32 5 C 20 10, -20 10, -32 -8 Z" fill="#0D131A"/>
      <!-- Cap Badge (Gold Star) -->
      <polygon points="0,-22 3,-15 10,-15 4,-11 6,-4 0,-8 -6,-4 -4,-11 -10,-15 -3,-15" fill="#FFD700"/>
    </g>

    <!-- Head (Recoil / Leaning Back) -->
    <circle cx="120" cy="92" r="28" fill="#FCE4D6"/>

    <!-- Wide Open Eyes (Shocked expression) -->
    <g>
      <!-- Left Eye (Big white circle with tiny pinpoint pupil) -->
      <circle cx="107" cy="90" r="7" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
      <circle cx="107" cy="90" r="2.5" fill="#1A1D24"/>
      
      <!-- Right Eye -->
      <circle cx="133" cy="90" r="7" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
      <circle cx="133" cy="90" r="2.5" fill="#1A1D24"/>
    </g>

    <!-- Raised Eyebrows (Surprise) -->
    <path d="M 98 80 Q 107 75 116 80" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 124 80 Q 133 75 142 80" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Shocked Open Mouth (O-Shape) -->
    <ellipse cx="120" cy="107" rx="5.5" ry="8" fill="#1A1D24"/>

    <!-- Stiff Jump Lines under character -->
    <g stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="90" y1="210" x2="105" y2="210" />
      <line x1="135" y1="210" x2="150" y2="210" />
    </g>
  </g>

  <!-- Dramatic Action Spark / Sudden Startle Burst at bottom center -->
  <path d="M 120 180 L 126 195 L 140 192 L 128 202 L 134 216 L 120 206 L 106 216 L 112 202 L 100 192 L 114 195 Z" fill="url(#flashGrad)" opacity="0.85" filter="url(#glow)"/>

</svg>