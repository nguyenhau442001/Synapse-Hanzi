<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 15)">
    <!-- Traditional Water Town Architecture (Jiangnan Style Background) -->
    <!-- Water base -->
    <path d="M 20 185 L 220 185" stroke="#2A3241" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Traditional Houses (Left and Right) -->
    <!-- Left house -->
    <path d="M 30 185 L 30 135 L 75 120 L 75 185 Z" fill="#252D3D"/>
    <!-- Left house roof (gable wall style) -->
    <path d="M 20 135 L 75 115 L 85 135 Z" fill="#364156"/>
    <path d="M 45 145 H 60" stroke="#1A1D24" stroke-width="3"/>
    <path d="M 45 165 H 60" stroke="#1A1D24" stroke-width="3"/>

    <!-- Right house -->
    <path d="M 165 185 L 165 140 L 210 130 L 210 185 Z" fill="#252D3D"/>
    <!-- Right house roof -->
    <path d="M 155 140 L 210 125 L 220 145 Z" fill="#364156"/>
    <path d="M 180 150 H 195" stroke="#1A1D24" stroke-width="3"/>

    <!-- Distant traditional roofline silhouettes -->
    <path d="M 75 160 L 105 150 L 135 158" fill="none" stroke="#252D3D" stroke-width="2"/>

    <!-- Arch bridge element in background -->
    <path d="M 95 185 Q 120 165 145 185" fill="none" stroke="#2F3A4C" stroke-width="3"/>

    <!-- THE CONTRASTING OBJECT: Modern Glass Skyscraper (突兀 - Tūwù) -->
    <!-- Placed right in the center, sharply clashing with the traditional aesthetic -->
    <g transform="translate(95, 60)">
      <!-- Building Body (Sleek, High-contrast Cyan/Teal Modern Glass) -->
      <rect x="0" y="0" width="50" height="125" rx="2" fill="#1B3A4B" stroke="#00B4D8" stroke-width="2"/>
      
      <!-- Modern Glass Panel Grid Lines -->
      <line x1="25" y1="0" x2="25" y2="125" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="0" y1="20" x2="50" y2="20" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="0" y1="40" x2="50" y2="40" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="0" y1="60" x2="50" y2="60" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="0" y1="80" x2="50" y2="80" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="0" y1="100" x2="50" y2="100" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.4"/>

      <!-- Glowing High-tech Antenna / Spire on top -->
      <line x1="25" y1="0" x2="25" y2="-15" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="25" cy="-16" r="3" fill="#FFB703"/>

      <!-- Accent vertical lighting strip (modern highlight) -->
      <rect x="22" y="10" width="6" height="105" fill="#90E0EF" opacity="0.3"/>
    </g>

    <!-- Visual emphasis/focus indicators (Subtle orange attention marker at the base of the clash) -->
    <path d="M 110 183 L 120 193 L 130 183" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>