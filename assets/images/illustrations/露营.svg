<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: Forest and Night Sky -->
  <!-- Night sky / dark blue atmosphere -->
  <path d="M0 0h240v240H0z" fill="#1A1D24"/>
  
  <!-- Subtle stars -->
  <circle cx="45" cy="50" r="1" fill="#E2E8F0" opacity="0.6"/>
  <circle cx="85" cy="35" r="1.5" fill="#E2E8F0" opacity="0.8"/>
  <circle cx="195" cy="45" r="1" fill="#E2E8F0" opacity="0.5"/>
  <circle cx="210" cy="80" r="1.2" fill="#E2E8F0" opacity="0.7"/>
  <circle cx="30" cy="95" r="1" fill="#E2E8F0" opacity="0.4"/>

  <!-- Distant Pine Trees / Mountain silhouettes -->
  <path d="M0 160L30 115L60 160L90 125L120 160L150 110L180 160L210 120L240 160V200H0Z" fill="#252D3D"/>

  <!-- Ground terrain -->
  <path d="M0 170 C60 150, 180 150, 240 170 V240 H0 Z" fill="#1E2633"/>

  <!-- Campfire Setup (Center-Left) -->
  <g transform="translate(70, 160)">
    <!-- Logs -->
    <rect x="-12" y="10" width="24" height="4" rx="2" fill="#8B5CF6" transform="rotate(-15 0 12)"/>
    <rect x="-12" y="8" width="24" height="4" rx="2" fill="#7C3AED" transform="rotate(20 0 10)"/>
    <!-- Fire Flames -->
    <path d="M0 5 C -6 -2, -10 -10, 0 -22 C 10 -10, 6 -2, 0 5 Z" fill="#F59E0B"/>
    <path d="M0 2 C -3 -3, -5 -8, 0 -15 C 5 -8, 3 -3, 0 2 Z" fill="#EF4444"/>
    <path d="M0 -1 C -1 -3, -2 -5, 0 -9 C 2 -5, 1 -3, 0 -1 Z" fill="#FEF3C7"/>
  </g>

  <!-- Iconic Camping Tent (Center-Right, The Main Subject) -->
  <g transform="translate(130, 105)">
    <!-- Back triangle shadow/inner -->
    <polygon points="50,65 15,35 60,35" fill="#3B82F6" opacity="0.3"/>
    
    <!-- Main Tent Body (Left Panel) -->
    <polygon points="0,65 50,65 50,35" fill="#3B82F6"/>
    
    <!-- Main Tent Body (Right Panel - lighter shade) -->
    <polygon points="50,65 100,65 50,35" fill="#60A5FA"/>
    
    <!-- Tent Entrance Flaps (Dark cutout) -->
    <polygon points="50,65 38,48 50,35" fill="#1E3A8A"/>
    <polygon points="50,65 62,48 50,35" fill="#2563EB"/>

    <!-- Tent Pegs / Guylines -->
    <line x1="0" y1="65" x2="-15" y2="70" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="100" y1="65" x2="115" y2="70" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Sleeping Bag / Outdoor Gear Accent -->
  <g transform="translate(95, 155)">
    <rect x="0" y="0" width="20" height="12" rx="6" fill="#F97316" transform="rotate(-15)"/>
  </g>

  <!-- Warm Focus Accent (Glowing Ambient Light from Fire) -->
  <circle cx="90" cy="165" r="35" fill="#F59E0B" opacity="0.08" filter="blur(8px)"/>
</svg>