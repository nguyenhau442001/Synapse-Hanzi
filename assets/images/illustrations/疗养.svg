<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Background gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242B38"/>
      <stop offset="100%" stop-color="#1E232E"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20435C"/>
      <stop offset="100%" stop-color="#152D3E"/>
    </linearGradient>
    <!-- Building gradient -->
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E3846"/>
      <stop offset="100%" stop-color="#3A4656"/>
    </linearGradient>
    <!-- Palm leaf gradient -->
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA675"/>
      <stop offset="100%" stop-color="#28704D"/>
    </linearGradient>
  </defs>

  <!-- Sky & Sea Background Setup -->
  <rect x="20" y="20" width="200" height="200" rx="16" fill="url(#skyGrad)" clip-path="url(#cardClip)"/>
  
  <clipPath id="cardClip">
    <rect width="240" height="240" rx="24"/>
  </clipPath>
  
  <g clip-path="url(#cardClip)">
    <!-- Sea horizon -->
    <rect x="20" y="130" width="200" height="90" fill="url(#seaGrad)"/>
    
    <!-- Sun / Sunset glow -->
    <circle cx="170" cy="95" r="22" fill="#E89B4C" opacity="0.15"/>
    <circle cx="170" cy="95" r="14" fill="#F3B25E" opacity="0.3"/>

    <!-- Sea Waves Gentle Lines -->
    <path d="M 40 148 Q 55 144 70 148 T 100 148 T 130 148 T 160 148 T 190 148" fill="none" stroke="#375870" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 50 162 Q 65 158 80 162 T 110 162 T 140 162 T 170 162" fill="none" stroke="#375870" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Modern Seaside Sanatorium Building (療養院) -->
    <!-- Main structure -->
    <rect x="65" y="75" width="110" height="65" rx="6" fill="url(#buildingGrad)" stroke="#49576C" stroke-width="1"/>
    
    <!-- Large glass balconies / windows -->
    <rect x="75" y="85" width="26" height="42" rx="3" fill="#1C242D"/>
    <rect x="107" y="85" width="26" height="42" rx="3" fill="#1C242D"/>
    <rect x="139" y="85" width="26" height="42" rx="3" fill="#1C242D"/>

    <!-- Balcony rails -->
    <line x1="75" y1="112" x2="101" y2="112" stroke="#6C7D93" stroke-width="1.5"/>
    <line x1="107" y1="112" x2="133" y2="112" stroke="#6C7D93" stroke-width="1.5"/>
    <line x1="139" y1="112" x2="165" y2="112" stroke="#6C7D93" stroke-width="1.5"/>

    <!-- Warm interior lights (signifying relaxation & comfort) -->
    <circle cx="88" cy="98" r="3" fill="#F3B25E"/>
    <circle cx="120" cy="98" r="3" fill="#F3B25E"/>
    <circle cx="152" cy="98" r="3" fill="#F3B25E"/>

    <!-- Roof overhang / architectural canopy -->
    <path d="M 60 75 L 180 75 L 185 68 L 55 68 Z" fill="#5A6D85"/>
    
    <!-- Medical/Wellness Cross Emblem Subtle Badge -->
    <circle cx="120" cy="55" r="10" fill="#2E3846" stroke="#49576C" stroke-width="1"/>
    <path d="M 120 50 L 120 60 M 115 55 L 125 55" stroke="#E86A58" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Foreground Coastline / Deck -->
    <path d="M 20 180 L 220 180 L 220 220 L 20 220 Z" fill="#242B38"/>
    <rect x="20" y="175" width="200" height="6" fill="#323B4A"/>

    <!-- Deck Chairs / Loungers for Recuperation (休養) -->
    <!-- Chair 1 -->
    <g transform="translate(75, 155) rotate(-15)">
      <rect x="0" y="0" width="22" height="8" rx="2" fill="#E89B4C"/>
      <line x1="4" y1="8" x2="4" y2="16" stroke="#8A9BA8" stroke-width="1.5"/>
      <line x1="18" y1="8" x2="18" y2="16" stroke="#8A9BA8" stroke-width="1.5"/>
    </g>
    
    <!-- Chair 2 -->
    <g transform="translate(135, 152) rotate(-10)">
      <rect x="0" y="0" width="22" height="8" rx="2" fill="#E89B4C"/>
      <line x1="4" y1="8" x2="4" y2="16" stroke="#8A9BA8" stroke-width="1.5"/>
      <line x1="18" y1="8" x2="18" y2="16" stroke="#8A9BA8" stroke-width="1.5"/>
    </g>

    <!-- Palm Tree / Foliage framing the scene (signifying resort environment) -->
    <!-- Trunk -->
    <path d="M 35 180 Q 42 150 40 120" fill="none" stroke="#6B5446" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Fronds -->
    <path d="M 40 120 Q 25 110 15 115" fill="none" stroke="url(#palmGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 40 120 Q 30 95 20 95" fill="none" stroke="url(#palmGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 40 120 Q 45 90 40 80" fill="none" stroke="url(#palmGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 40 120 Q 60 95 65 100" fill="none" stroke="url(#palmGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 40 120 Q 70 110 75 118" fill="none" stroke="url(#palmGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Subtle framing border for sleek modern card look -->
    <rect x="20" y="20" width="200" height="200" rx="16" fill="none" stroke="#323B4A" stroke-width="2"/>
  </g>
</svg>