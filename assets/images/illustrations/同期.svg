<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Icon Graphic: Dual Timeline / Synchronous Period Comparison (Noun - vật thể đại diện cho cùng một thời kỳ) -->
  <g transform="translate(0, 0)">
    <!-- Background Timeline Base Plate / Calendar Object -->
    <rect x="52" y="56" width="136" height="128" rx="12" fill="#262B35" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Top Header of Calendar/Period Object -->
    <path d="M 52 68 C 52 61.3726 57.3726 56 64 56 L 176 56 C 182.627 56 188 61.3726 188 68 L 188 88 L 52 88 Z" fill="#323B4D"/>
    
    <!-- Header Rings/Binding -->
    <rect x="80" y="46" width="10" height="18" rx="5" fill="#F59E0B"/>
    <rect x="150" y="46" width="10" height="18" rx="5" fill="#F59E0B"/>
    
    <!-- Period 1 Track (Past Year Same Period) -->
    <rect x="70" y="106" width="100" height="24" rx="6" fill="#1E232D"/>
    <!-- Synchronized Period Marker 1 (Gold/Active Highlight) -->
    <rect x="70" y="106" width="75" height="24" rx="6" fill="#F59E0B" opacity="0.85"/>
    <circle.inner cx="85" cy="118" r="5" fill="#1A1D24"/>
    <line x1="100" y1="118" x2="145" y2="118" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Period 2 Track (Current Year Same Period) -->
    <rect x="70" y="142" width="100" height="24" rx="6" fill="#1E232D"/>
    <!-- Synchronized Period Marker 2 (Matching Gold/Active Highlight representing 'Tóngqī' - exact same corresponding time slot) -->
    <rect x="70" y="142" width="75" height="24" rx="6" fill="#F59E0B"/>
    <circle.inner cx="85" cy="154" r="5" fill="#1A1D24"/>
    <line x1="100" y1="154" x2="145" y2="154" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Alignment Indicator / Synchronicity Brackets connecting the two matching periods -->
    <path d="M 182 108 L 192 108 C 197.523 108 202 112.477 202 118 L 202 138 C 202 143.523 197.523 148 192 148 L 182 148" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="3 3" stroke-linecap="round"/>
    <circle cx="202" cy="128" r="4" fill="#60A5FA"/>
  </g>
</svg>