<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background context (urban buildings silhouette in dark slate) -->
  <path d="M30 180 L30 130 L50 130 L50 180 Z" fill="#222730" />
  <path d="M55 180 L55 110 L85 110 L85 180 Z" fill="#222730" />
  <path d="M190 180 L190 120 L210 120 L210 180 Z" fill="#222730" />
  <path d="M160 180 L160 140 L185 140 L185 180 Z" fill="#222730" />

  <!-- Ground Plane -->
  <path d="M20 180 C80 175 160 175 220 180 L220 190 C160 185 80 185 20 190 Z" fill="#2F3642" />

  <!-- The Green Space (绿地 - Lǜdì) - Central Noun Focus -->
  <!-- Lush green rolling lawn hill -->
  <path d="M40 180 C60 145 100 140 140 150 C180 160 200 170 205 180 Z" fill="#2ECC71" />
  <path d="M50 180 C75 155 115 150 150 160 C185 170 195 175 200 180 Z" fill="#27AE60" opacity="0.6" />

  <!-- Stylized Trees on the Green Space -->
  <!-- Tree 1 (Left, small) -->
  <rect x="75" y="145" width="4" height="15" fill="#8D6E63" />
  <circle cx="77" cy="140" r="12" fill="#2ECC71" />
  <circle cx="73" cy="143" r="8" fill="#A3E4D7" opacity="0.3" />

  <!-- Tree 2 (Center, prominent) -->
  <rect x="118" y="130" width="6" height="25" fill="#8D6E63" />
  <circle cx="121" cy="120" r="18" fill="#2ECC71" />
  <circle cx="114" cy="124" r="12" fill="#A3E4D7" opacity="0.3" />
  <circle cx="128" cy="116" r="10" fill="#27AE60" opacity="0.4" />

  <!-- Tree 3 (Right, medium) -->
  <rect x="165" y="138" width="5" height="20" fill="#8D6E63" />
  <circle cx="167" cy="130" r="15" fill="#27AE60" />
  <circle cx="173" cy="133" r="10" fill="#A3E4D7" opacity="0.3" />

  <!-- Recreational Bench (indicating urban park / relaxation space) -->
  <rect x="95" y="162" width="22" height="3" rx="1.5" fill="#E67E22" />
  <rect x="97" y="165" width="18" height="2" rx="1" fill="#E67E22" />
  <path d="M97 167 L97 172 M115 167 L115 172" stroke="#BDC3C7" stroke-width="1.5" stroke-linecap="round" />

  <!-- Decorative flowers/accents on the grass -->
  <circle cx="62" cy="168" r="2" fill="#F1C40F" />
  <circle cx="145" cy="165" r="2" fill="#E74C3C" />
  <circle cx="188" cy="172" r="2" fill="#F1C40F" />

  <!-- Warm accent lighting / sun rays representing urban renewal/public amenity -->
  <path d="M121 95 L121 75" stroke="#F39C12" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M100 100 L88 88" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M142 100 L154 88" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>