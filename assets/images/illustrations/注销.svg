<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow to enhance sleek modern flat design -->
  <circle cx="120" cy="120" r="85" fill="#222730" opacity="0.6"/>
  <circle cx="120" cy="120" r="60" fill="#2A313C" opacity="0.4"/>

  <!-- Conceptual Object: Official Digital ID Card / Account Badge being terminated/crossed out -->
  <g transform="translate(120, 120)">
    <!-- Card Base Shadow -->
    <rect x="-42" y="-52" width="84" height="104" rx="10" fill="#111317" opacity="0.5"/>
    
    <!-- Card Base (Digital Account Profile) -->
    <rect x="-40" y="-50" width="80" height="100" rx="8" fill="#2E3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Header / Avatar Area -->
    <circle cx="0" cy="-20" r="14" fill="#64748B"/>
    <path d="M-18 6 C-18 -2, 18 -2, 18 6" fill="#64748B"/>
    
    <!-- Account Details Lines (representing user data to be deactivated) -->
    <rect x="-24" y="16" width="48" height="4" rx="2" fill="#475569"/>
    <rect x="-16" y="26" width="32" height="4" rx="2" fill="#475569"/>

    <!-- Dynamic Termination Stamp / Overlay Symbol representing "注销" (Revocation/Cancellation) -->
    <circle cx="0" cy="0" r="38" fill="#1A1D24" opacity="0.85"/>
    
    <!-- Vibrant High-Contrast Focus: Orange/Gold Deactivation Stamp Ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="6 3"/>

    <!-- Bold X Mark / Cross-out (Cancellation indicator) -->
    <path d="M-18 -18 L18 18 M18 -18 L-18 18" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>