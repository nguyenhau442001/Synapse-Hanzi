<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: Official Briefcase & Official Travel/Document Symbol representing "公务" (Official Business) -->
  <g transform="translate(0, 0)">
    <!-- Shadow for depth -->
    <ellipse cx="120" cy="195" rx="55" ry="8" fill="#111317" opacity="0.6"/>

    <!-- Briefcase Body (Sleek Modern Flat Design) -->
    <!-- Back handle -->
    <path d="M100 85 L100 70 C100 64.5 104.5 60 110 60 L130 60 C135.5 60 140 64.5 140 70 L140 85" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Main Case Body -->
    <rect x="65" y="85" width="110" height="78" rx="8" fill="#2C313C"/>
    
    <!-- Metallic Front Clasp / Lock Plate -->
    <path d="M105 85 L135 85 L135 96 C135 98.2 133.2 100 131 100 L109 100 C106.8 100 105 98.2 105 96 Z" fill="#F5A623"/>
    <circle cx="120" cy="92" r="3" fill="#1A1D24"/>

    <!-- Accent seam lines on briefcase -->
    <line x1="65" y1="124" x2="175" y2="124" stroke="#21252E" stroke-width="3"/>
    <rect x="75" y="95" width="90" height="58" rx="4" fill="none" stroke="#373D4A" stroke-width="2"/>

    <!-- Official Document emerging slightly to denote "Official Duty/Affairs" -->
    <path d="M92 85 L92 50 C92 47.8 93.8 46 96 46 L144 46 C146.2 46 148 47.8 148 50 L148 85 Z" fill="#EAECEF"/>
    
    <!-- Document header lines -->
    <rect x="100" y="56" width="40" height="5" rx="2.5" fill="#F5A623"/>
    <line x1="100" y1="69" x2="140" y2="69" stroke="#9BA1AE" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="78" x2="125" y2="78" stroke="#9BA1AE" stroke-width="3" stroke-linecap="round"/>

    <!-- Official Red Seal / Stamp (traditional element of official business/gōngwù) -->
    <circle cx="132" cy="74" r="9" fill="#E5484D" opacity="0.9"/>
    <path d="M130 71 L134 71 M132 69 L132 77" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>