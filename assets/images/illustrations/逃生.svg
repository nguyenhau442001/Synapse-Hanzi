<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Staircase structure -->
  <path d="M40 200 L100 200 L100 160 L130 160 L130 120 L160 120 L160 80 L200 80" stroke="#4A5568" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Person running down -->
  <g transform="translate(140, 50)">
    <circle cx="10" cy="10" r="8" fill="#FF9F43"/>
    <path d="M10 18 L10 35 M10 25 L2 35 M10 25 L18 35 M10 35 L5 50 M10 35 L15 50" stroke="#FF9F43" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Exit door frame -->
  <rect x="30" y="180" width="30" height="40" fill="none" stroke="#FF9F43" stroke-width="4"/>
  <path d="M45 180 L45 220" stroke="#FF9F43" stroke-width="4"/>
  
  <!-- Smoke/Atmosphere hint -->
  <path d="M180 40 Q200 20 220 40 T240 40" stroke="#2D3748" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M160 20 Q180 0 200 20 T220 20" stroke="#2D3748" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>