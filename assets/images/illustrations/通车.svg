<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bridge background/glow effect -->
  <path d="M 40 160 Q 120 130 200 160" fill="none" stroke="#2D3748" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Suspension Bridge Structure -->
  <!-- Towers -->
  <rect x="75" y="80" width="10" height="80" fill="#4A5568"/>
  <rect x="155" y="80" width="10" height="80" fill="#4A5568"/>
  <rect x="70" y="75" width="20" height="8" fill="#718096" rx="2"/>
  <rect x="150" y="75" width="20" height="8" fill="#718096" rx="2"/>

  <!-- Cables -->
  <path d="M 30 110 Q 80 80 120 110 Q 160 80 210 110" fill="none" stroke="#F6AD55" stroke-width="2.5"/>
  <line x1="75" y1="95" x2="75" y2="160" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="95" y1="105" x2="95" y2="160" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="145" y1="105" x2="145" y2="160" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="165" y1="95" x2="165" y2="160" stroke="#CBD5E0" stroke-width="1"/>

  <!-- Bridge Deck (Roadway) -->
  <rect x="30" y="152" width="180" height="12" fill="#2D3748" rx="2"/>
  <rect x="30" y="156" width="180" height="3" fill="#4A5568"/>
  <!-- Road markings (dashed center line) -->
  <line x1="45" y1="158" x2="65" y2="158" stroke="#ECC94B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="85" y1="158" x2="105" y2="158" stroke="#ECC94B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="125" y1="158" x2="145" y2="158" stroke="#ECC94B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="165" y1="158" x2="185" y2="158" stroke="#ECC94B" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Water Surface -->
  <path d="M 30 185 Q 60 178 90 185 T 150 185 T 210 185" fill="none" stroke="#3182CE" stroke-width="2" opacity="0.6"/>
  <path d="M 30 193 Q 60 186 90 193 T 150 193 T 210 193" fill="none" stroke="#3182CE" stroke-width="1.5" opacity="0.4"/>

  <!-- Modern Car (Representing "通车" - Traffic Flow / Opened to traffic) -->
  <!-- Car Body -->
  <path d="M 100 148 L 115 140 L 138 140 L 148 148 Z" fill="#E53E3E"/>
  <rect x="92" y="146" width="60" height="8" rx="3" fill="#F56565"/>
  <!-- Windows -->
  <path d="M 107 146 L 115 142 L 135 142 L 140 146 Z" fill="#E2E8F0"/>
  <!-- Wheels -->
  <circle cx="104" cy="155" r="4" fill="#1A202C"/>
  <circle cx="104" cy="155" r="1.5" stroke="#CBD5E0" stroke-width="1" fill="none"/>
  <circle cx="140" cy="155" r="4" fill="#1A202C"/>
  <circle cx="140" cy="155" r="1.5" stroke="#CBD5E0" stroke-width="1" fill="none"/>
  <!-- Headlights & Motion lines -->
  <circle cx="151" cy="148" r="1" fill="#FEFCBF"/>
  <line x1="155" y1="147" x2="162" y2="147" stroke="#ED8936" stroke-width="1" stroke-linecap="round"/>
  <line x1="155" y1="150" x2="160" y2="150" stroke="#ED8936" stroke-width="1" stroke-linecap="round"/>
</svg>