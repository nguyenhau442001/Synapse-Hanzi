<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric background glow / investigation board hints -->
  <path d="M40 70 L200 70" stroke="#262B35" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M40 120 L200 120" stroke="#262B35" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Visual Metaphor: "Vụ việc" / Case file unfolding & zooming in to reveal truth (Escalation / Causality / Progression) -->
  <!-- A large archival file folder opening up / shifting layers, with a magnifying glass revealing a glowing resolution node (Tranhaog bái) -->

  <!-- Folder base shadow / back layer -->
  <path d="M60 85 L100 85 L115 100 L180 100 C185 100, 190 105, 190 110 L190 170 C190 175, 185 180, 180 180 L60 180 C55 180, 50 175, 50 170 L50 95 C50 89, 55 85, 60 85 Z" fill="#2A313C"/>

  <!-- Document inside sliding up (Progression/Causality) -->
  <rect x="70" y="75" width="100" height="85" rx="4" fill="#222730"/>
  <!-- Abstract document text lines -->
  <rect x="85" y="95" width="50" height="6" rx="3" fill="#3A4454"/>
  <rect x="85" y="110" width="70" height="4" rx="2" fill="#2E3642"/>
  <rect x="85" y="122" width="60" height="4" rx="2" fill="#2E3642"/>
  <rect x="85" y="134" width="40" height="4" rx="2" fill="#2E3642"/>

  <!-- Folder front flap -->
  <path d="M50 105 L190 105 L190 175 C190 180, 185 185, 180 185 L60 185 C55 185, 50 180, 50 175 Z" fill="#323B4A"/>
  <path d="M50 105 L100 105 L115 120 L190 120" fill="none" stroke="#3D4A5E" stroke-width="2"/>

  <!-- High-contrast Accent: Glowing focus node emerging from the case file (Truth revealed / 桩 - individual distinct matter/case unit) -->
  <circle cx="140" cy="115" r="14" fill="#FF9F43" opacity="0.2"/>
  <circle cx="140" cy="115" r="8" fill="#FF9F43"/>
  <circle cx="140" cy="115" r="3" fill="#1A1D24"/>

  <!-- Magnifying glass inspecting the specific case unit (Visual metaphor for precise tracking, measure word "一桩") -->
  <g transform="translate(15, 15)">
    <!-- Glass rim -->
    <circle cx="115" cy="105" r="28" fill="#1A1D24" stroke="#FF9F43" stroke-width="5"/>
    <!-- Glass lens highlight -->
    <path d="M98 90 A 24 24 0 0 1 125 90" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Handle -->
    <path d="M135 125 L165 155" stroke="#FF9F43" stroke-width="6" stroke-linecap="round"/>
    <path d="M135 125 L165 155" stroke="#222730" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>