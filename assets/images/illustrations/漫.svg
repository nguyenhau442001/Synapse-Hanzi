<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background / River embankment scene -->
  <g id="scene">
    <!-- Sky / background night tone -->
    <path d="M0 0h240v140H0z" fill="#222730"/>
    
    <!-- Stone embankment wall (low dike) -->
    <path d="M20 140h200v14H20z" fill="#4B5563"/>
    <!-- Stone brick lines -->
    <path d="M40 140v14M80 140v14M120 140v14M160 140v14M200 140v14" stroke="#374151" stroke-width="2"/>
    <path d="M20 147h200" stroke="#374151" stroke-width="1"/>

    <!-- Retaining bank grass/ground behind -->
    <path d="M0 140h240v-10L0 120z" fill="#1E293B"/>

    <!-- Raging River water level rising below and spilling over -->
    <path d="M0 160h240v80H0z" fill="#1E3A8A"/>
    <!-- Raging wave layers -->
    <path d="M0 160c20-6 40 4 60-2s40-10 60-4 40 8 60 2 40-8 60-2v86H0z" fill="#2563EB"/>
    <path d="M0 175c30-8 50 6 80-2s40-12 80-4 40 10 80 0v65H0z" fill="#3B82F6" opacity="0.8"/>

    <!-- THE ACTION: Water overflowing (漫过) the embankment wall -->
    <!-- Overflowing wave crests washing over the 140px high wall -->
    <path d="M50 140c10-15 25-18 35-10 10-12 25-15 35-5 10-15 25-18 35-8 10-10 20-5 25 5v10H50z" fill="#60A5FA"/>
    <path d="M40 142c12-10 25-12 38-4 10-10 22-12 35-4 12-10 25-12 37-2 10-8 20-4 28 6v6H40z" fill="#93C5FD" opacity="0.9"/>

    <!-- Splashing droplets and surging foam indicating "trào ngập, lan tỏa" -->
    <circle cx="75" cy="128" r="3" fill="#E0F2FE"/>
    <circle cx="85" cy="122" r="2" fill="#E0F2FE"/>
    <circle cx="125" cy="120" r="3.5" fill="#E0F2FE"/>
    <circle cx="135" cy="115" r="2" fill="#E0F2FE"/>
    <circle cx="170" cy="126" r="3" fill="#E0F2FE"/>
    <path d="M100 112c2-4 6-4 8 0" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M145 110c2-5 7-5 9 0" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Focus Accent Overlay (Orange/Gold highlights on overflow edge to draw eye) -->
  <path d="M60 138c20-8 40-8 60 0s40 8 60 0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <circle cx="120" cy="133" r="4" fill="#F59E0B"/>
  <circle cx="90" cy="135" r="3" fill="#F59E0B"/>
  <circle cx="155" cy="135" r="3" fill="#F59E0B"/>
</svg>