<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#2D343E"/>
  
  <!-- Laptop Base -->
  <rect x="70" y="140" width="100" height="20" rx="4" fill="#4A5568"/>
  <rect x="75" y="145" width="90" height="10" rx="2" fill="#2D343E"/>
  
  <!-- Laptop Screen -->
  <rect x="85" y="70" width="70" height="70" rx="4" fill="#E2E8F0"/>
  <rect x="92" y="77" width="56" height="56" rx="2" fill="#1A1D24"/>
  
  <!-- Document/Paperwork on screen -->
  <line x1="105" y1="90" x2="135" y2="90" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  <line x1="105" y1="105" x2="135" y2="105" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  <line x1="105" y1="120" x2="120" y2="120" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Hand holding a pen, indicating "in hand" / "at hand" -->
  <path d="M140 150 L155 135 L165 145 L150 160 Z" fill="#F6AD55"/>
  <rect x="152" y="132" width="4" height="20" rx="2" transform="rotate(45 154 142)" fill="#CBD5E0"/>
  
  <!-- Focus highlight -->
  <circle cx="120" cy="105" r="50" fill="none" stroke="#F6AD55" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
</svg>