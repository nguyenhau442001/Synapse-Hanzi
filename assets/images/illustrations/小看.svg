<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Opponent Character (Small/Distant) -->
  <g transform="translate(160, 140)">
    <circle cx="0" cy="-40" r="12" fill="#FFC107"/>
    <path d="M-15 0 L15 0 L10 40 L-10 40 Z" fill="#FFC107"/>
  </g>
  
  <!-- Main Character (Arrogant/Dismissive) -->
  <g transform="translate(80, 120)">
    <!-- Body -->
    <path d="M-20 0 L20 0 L15 60 L-15 60 Z" fill="#4A90E2"/>
    <!-- Head -->
    <circle cx="0" cy="-30" r="15" fill="#E0E0E0"/>
    <!-- Dismissive Hand Gesture -->
    <path d="M15 -10 L40 -20 L45 -10" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Motion lines for dismissive wave -->
    <path d="M50 -25 L60 -30 M55 -15 L65 -20" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <!-- Arrogant posture: tilted head -->
    <path d="M-5 -35 L5 -25" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Visual indicator of "looking down" -->
  <path d="M100 80 L150 120" stroke="#555" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M145 115 L150 120 L145 125" stroke="#555" stroke-width="2" fill="none"/>
</svg>