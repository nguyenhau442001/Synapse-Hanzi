<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow representing verification / official context -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Document / Voucher / Invoice Base (Physical Object Representation) -->
  <g transform="translate(75, 45)">
    <!-- Document shadow/back sheet -->
    <rect x="6" y="6" width="78" height="102" rx="6" fill="#12151B" opacity="0.5"/>
    
    <!-- Main document sheet -->
    <rect x="0" y="0" width="78" height="102" rx="6" fill="#F0F4F8"/>
    
    <!-- Header bar -->
    <rect x="12" y="16" width="54" height="6" rx="3" fill="#3B82F6"/>
    
    <!-- Line items (representing invoice details) -->
    <rect x="12" y="32" width="40" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="12" y="42" width="54" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="12" y="52" width="30" height="4" rx="2" fill="#E2E8F0"/>
    
    <!-- Total / Amount Line -->
    <rect x="12" y="72" width="24" height="5" rx="2.5" fill="#64748B"/>
    <rect x="46" y="70" width="20" height="9" rx="2" fill="#10B981" opacity="0.2"/>
  </g>

  <!-- Official Stamp / Seal (Bằng chứng / Chứng từ xác thực) -->
  <g transform="translate(130, 95)">
    <!-- Outer stamp circle -->
    <circle cx="22" cy="22" r="22" fill="#EF4444" opacity="0.15"/>
    <circle cx="22" cy="22" r="18" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="22" cy="22" r="14" fill="none" stroke="#EF4444" stroke-width="1.5"/>
    <!-- Stamp inner star/emblem -->
    <path d="M22 13l2.4 4.8 5.3.8-3.8 3.7.9 5.2-4.8-2.5-4.8 2.5.9-5.2-3.8-3.7 5.3-.8z" fill="#EF4444"/>
  </g>

  <!-- Checkmark Badge (Focus / Validated Concept - High contrast orange/gold accent) -->
  <g transform="translate(145, 30)">
    <!-- Badge background -->
    <circle cx="20" cy="20" r="20" fill="#F59E0B"/>
    <circle cx="20" cy="20" r="16" fill="#D97706"/>
    <!-- Checkmark icon -->
    <path d="M12 20l5 5 11-11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>