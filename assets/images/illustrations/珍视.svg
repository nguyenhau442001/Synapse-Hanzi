<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Soft background glow for the treasure -->
    <circle cx="120" cy="115" r="55" fill="#F59E0B" opacity="0.12"/>
    
    <!-- Gentle supportive hands representing care and valuation -->
    <!-- Left Hand -->
    <path d="M65 145 C65 135 75 125 90 120 C95 118 100 117 105 116 C107 115 108 118 107 120 C100 125 95 132 92 142 C88 152 85 165 85 170 C85 175 75 175 72 170 C68 162 65 155 65 145 Z" fill="#334155"/>
    
    <!-- Right Hand -->
    <path d="M175 145 C175 135 165 125 150 120 C145 118 140 117 135 116 C133 115 132 118 133 120 C140 125 145 132 148 142 C152 152 155 165 155 170 C155 175 165 175 168 170 C172 162 175 155 175 145 Z" fill="#334155"/>

    <!-- Palms/Base of Hands -->
    <path d="M85 170 C85 160 95 155 120 155 C145 155 155 160 155 170 C155 180 145 185 120 185 C95 185 85 180 85 170 Z" fill="#475569"/>

    <!-- The Precious Object / Gemstone (representing peace, life, or a treasured essence) -->
    <!-- Lower facets of the gem -->
    <polygon points="120,150 95,115 145,115" fill="#D97706"/>
    <polygon points="120,150 145,115 160,95 120,80" fill="#F59E0B"/>
    <polygon points="120,150 95,115 80,95 120,80" fill="#B45309"/>

    <!-- Upper crown of the gem -->
    <polygon points="120,80 80,95 160,95" fill="#FBBF24"/>
    <polygon points="120,80 160,95 140,75 100,75" fill="#FDE68A"/>
    <polygon points="120,80 100,75 120,70" fill="#FFFBEB"/>
    <polygon points="120,80 140,75 120,70" fill="#FEF3C7"/>

    <!-- Sparkles highlighting the treasured status -->
    <path d="M145 70 L147 75 L152 77 L147 79 L145 84 L143 79 L138 77 L143 75 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M95 90 L96 93 L99 94 L96 95 L95 98 L94 95 L91 94 L94 93 Z" fill="#FFFFFF" opacity="0.7"/>

    <!-- Subtle protective glowing aura lines -->
    <path d="M95 105 C90 95 92 80 100 70" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M145 105 C150 95 148 80 140 70" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
</svg>