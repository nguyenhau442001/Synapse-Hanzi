<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow & Elements -->
  <circle cx="120" cy="110" r="70" fill="#252A34" opacity="0.5"/>
  <path d="M70 170 H170" stroke="#2D333B" stroke-width="2" stroke-linecap="round"/>

  <!-- Ballot Box (Sleek Modern Flat Design) -->
  <rect x="85" y="115" width="70" height="55" rx="4" fill="#3A414E"/>
  <!-- Ballot Box Slot -->
  <rect x="100" y="123" width="40" height="5" rx="2.5" fill="#1A1D24"/>
  <!-- Front panel shade for depth -->
  <path d="M85 145 H155 V166 C155 168.2 153.2 170 151 170 H89 C86.8 170 85 168.2 85 166 V145 Z" fill="#313843"/>
  <!-- Accent badge/line on box -->
  <rect x="115" y="140" width="10" height="2" rx="1" fill="#4E5666"/>

  <!-- Human Character Action (Abstaining / Hovering hand without dropping) -->
  <!-- Body/Shoulder base -->
  <path d="M50 190 C50 170 70 160 90 160 H150 C170 160 190 170 190 190" fill="#2D333B"/>

  <!-- Arm reaching towards the box -->
  <path d="M150 135 L120 138" stroke="#4F5D73" stroke-width="14" stroke-linecap="round"/>

  <!-- Hand holding ballot, but pulling BACK / hovering away (Abstention motion) -->
  <g transform="translate(110, 118)">
    <!-- Motion lines indicating retraction/action -->
    <path d="M -12 8 L -20 8" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 2"/>
    <path d="M -14 3 L -22 3" stroke="#E67E22" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>

    <!-- Ballot Paper (Held upright, not going into slot) -->
    <rect x="-4" y="-12" width="16" height="22" rx="1" fill="#F0F3F6" transform="rotate(-10)"/>
    
    <!-- Hand Palm & Fingers -->
    <path d="M 6 12 C 6 12 14 10 14 4 C 14 -2 8 -6 8 -6" fill="#D68955"/>
    <path d="M 2 14 C 4 15 8 13 10 11" stroke="#BD7342" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Thumb resting on ballot -->
    <circle cx="2" cy="1" r="3.5" fill="#E59866"/>
  </g>

  <!-- Visual prohibition/abstention indicator (Sleek gold/orange cross-out hovering subtly above slot) -->
  <g transform="translate(120, 95)" opacity="0.9">
    <circle cx="0" cy="0" r="14" fill="#2D333B" stroke="#E67E22" stroke-width="2.5"/>
    <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round"/>
  </g>

</svg>