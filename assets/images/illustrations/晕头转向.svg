<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Dizzy motion blur/swirl trails -->
    <path d="M-60,-30 C-30,-70 30,-70 60,-30" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M-70,10 C-30,-40 30,-40 70,10" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Cartoonish swirling stars/spinners around head -->
    <g transform="translate(0, -60)">
      <path d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z" fill="#F1C40F">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(-45, -45)">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#F39C12"/>
    </g>
    <g transform="translate(45, -45)">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#F39C12"/>
    </g>

    <!-- Character Body / Shoulders -->
    <path d="M-45,60 C-45,35 -25,25 0,25 C25,25 45,35 45,60 L55,80 C55,85 50,90 45,90 L-45,90 C-50,90 -55,85 -55,80 Z" fill="#2C3E50"/>
    
    <!-- Collar / Shirt Detail -->
    <path d="M-15,25 L0,40 L15,25 L10,25 L0,33 L-10,25 Z" fill="#34495E"/>

    <!-- Neck -->
    <rect x="-10" y="10" width="20" height="20" fill="#E0AC69"/>

    <!-- Head (Tilted & Dizzy) -->
    <g transform="rotate(15, 0, 0)">
      <!-- Face Base -->
      <circle cx="0" cy="-15" r="32" fill="#E0AC69"/>
      
      <!-- Hair -->
      <path d="M-30,-25 C-32,-40 -15,-45 0,-45 C15,-45 32,-40 30,-25 C25,-30 10,-32 0,-30 C-10,-32 -25,-30 -30,-25 Z" fill="#3E2723"/>

      <!-- Dizzy Spiral Eyes (representing 晕头转向 / hoa mắt chóng mặt) -->
      <g transform="translate(-12, -18)">
        <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
        <path d="M-3,0 A3,3 0 0,1 2,-2 A2,2 0 0,0 -1,2" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="1" fill="#2C3E50"/>
      </g>
      <g transform="translate(12, -18)">
        <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
        <path d="M-3,0 A3,3 0 0,1 2,-2 A2,2 0 0,0 -1,2" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="1" fill="#2C3E50"/>
      </g>

      <!-- Wavy / Confused Mouth -->
      <path d="M-6,-2 C-3,2 3,-2 6,2" fill="none" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Dizzy Sweat Drops -->
      <path d="M-32,-5 C-32,-2 -35,2 -37,0 C-39,-2 -37,-5 -35,-8 Z" fill="#3498DB"/>
      <path d="M34,2 C34,5 37,9 39,7 C41,5 39,2 37,-1 Z" fill="#3498DB"/>
    </g>

    <!-- Confused / Misdirection Arrows (representing 转向 - losing orientation) -->
    <g stroke="#E74C3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-65, -15 L-85, -15 L-75, -25" opacity="0.8"/>
      <path d="M65, -15 L85, -15 L75, -5" opacity="0.8"/>
      <path d="M-55, 30 L-70, 45" opacity="0.8"/>
      <path d="M55, 30 L70, 45" opacity="0.8"/>
    </g>
  </g>
</svg>