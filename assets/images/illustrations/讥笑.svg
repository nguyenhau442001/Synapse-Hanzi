<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Main Subject Character (The protagonist staying resolute, centered) -->
    <g id="protagonist" transform="translate(0, 15)">
      <!-- Body / Shoulders -->
      <path d="M-22,65 C-22,50 -12,40 0,40 C12,40 22,50 22,65 L32,85 L-32,85 Z" fill="#2D3748"/>
      <!-- Neck -->
      <rect x="-6" y="28" width="12" height="15" fill="#E2E8F0"/>
      <!-- Head -->
      <circle cx="0" cy="12" r="18" fill="#E2E8F0"/>
      <!-- Hair -->
      <path d="M-18,10 C-18,0 -10,-6 0,-6 C10,-6 18,0 18,10 L18,5 C18,-3 10,-9 0,-9 C-10,-9 -18,-3 -18,5 Z" fill="#4A5568"/>
      <!-- Calm, unbothered facial expression (straight mouth line, focused eyes) -->
      <line x1="-5" y1="10" x2="-2" y2="10" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="10" x2="5" y2="10" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <line x1="-3" y1="17" x2="3" y2="17" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Glowing inner conviction/dream symbol above or behind (Gold accent) -->
      <circle cx="0" cy="-35" r="12" fill="#D69E2E" opacity="0.2"/>
      <polygon points="0,-48 3,-39 12,-39 5,-33 8,-24 0,-29 -8,-24 -5,-33 -12,-39 -3,-39" fill="#F6E05E"/>
    </g>

    <!-- Derisive Mocking Characters (讥笑ing from the sides) -->
    <!-- Left Mocking Figure -->
    <g id="mocker-left" transform="translate(-65, 20)">
      <!-- Body -->
      <path d="M-18,60 C-18,48 -10,38 0,38 C10,38 18,48 18,60 L24,80 L-24,80 Z" fill="#4A5568"/>
      <!-- Neck -->
      <rect x="-4" y="25" width="8" height="15" fill="#CBD5E0"/>
      <!-- Head leaning forward mockingly -->
      <circle cx="-5" cy="10" r="15" fill="#CBD5E0"/>
      <!-- Hair -->
      <path d="M-18,8 C-18,0 -10,-4 -2,-4 C6,-4 12,2 12,8 Z" fill="#2D3748"/>
      <!-- Smug/Derisive Face (slanting mocking eyes and curved smirk) -->
      <line x1="-10" y1="8" x2="-2" y2="10" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10,16 Q-6,12 -2,16" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <!-- Pointing hand gesture -->
      <path d="M15,50 L35,35 L38,40 L20,58 Z" fill="#CBD5E0"/>
    </g>

    <!-- Right Mocking Figure -->
    <g id="mocker-right" transform="translate(65, 20) scale(-1, 1)">
      <!-- Body -->
      <path d="M-18,60 C-18,48 -10,38 0,38 C10,38 18,48 18,60 L24,80 L-24,80 Z" fill="#4A5568"/>
      <!-- Neck -->
      <rect x="-4" y="25" width="8" height="15" fill="#CBD5E0"/>
      <!-- Head leaning forward mockingly -->
      <circle cx="-5" cy="10" r="15" fill="#CBD5E0"/>
      <!-- Hair -->
      <path d="M-18,8 C-18,0 -10,-4 -2,-4 C6,-4 12,2 12,8 Z" fill="#2D3748"/>
      <!-- Smug/Derisive Face -->
      <line x1="-10" y1="8" x2="-2" y2="10" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10,16 Q-6,12 -2,16" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
      <!-- Pointing hand gesture -->
      <path d="M15,50 L35,35 L38,40 L20,58 Z" fill="#CBD5E0"/>
    </g>

    <!-- Visual Sound Waves / Mockery ripples (Orange/Red high-contrast accents) -->
    <g id="mockery-waves">
      <!-- Left whispers/laughter waves -->
      <path d="M-38,0 C-43,-5 -43,-15 -38,-20" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
      <path d="M-45,-5 C-52,-12 -52,-22 -45,-30" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

      <!-- Right whispers/laughter waves -->
      <path d="M38,0 C43,-5 43,-15 38,-20" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
      <path d="M45,-5 C52,-12 52,-22 45,-30" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>
</svg>