<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The "Circle" (Social/Academic Group) -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#FFB84D" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Academic Figures representing the "Circle" -->
  <!-- Person 1 -->
  <g transform="translate(120, 85)">
    <circle cx="0" cy="0" r="12" fill="#4D96FF"/>
    <path d="M-12,12 C-12,20 -5,25 0,25 C5,25 12,20 12,12" fill="#4D96FF"/>
  </g>
  
  <!-- Person 2 -->
  <g transform="translate(85, 120)">
    <circle cx="0" cy="0" r="12" fill="#4D96FF"/>
    <path d="M-12,12 C-12,20 -5,25 0,25 C5,25 12,20 12,12" fill="#4D96FF"/>
  </g>
  
  <!-- Person 3 -->
  <g transform="translate(155, 120)">
    <circle cx="0" cy="0" r="12" fill="#4D96FF"/>
    <path d="M-12,12 C-12,20 -5,25 0,25 C5,25 12,20 12,12" fill="#4D96FF"/>
  </g>
  
  <!-- Person 4 -->
  <g transform="translate(120, 155)">
    <circle cx="0" cy="0" r="12" fill="#4D96FF"/>
    <path d="M-12,12 C-12,20 -5,25 0,25 C5,25 12,20 12,12" fill="#4D96FF"/>
  </g>

  <!-- Academic symbol in center -->
  <path d="M110 120 L130 120 M120 110 L120 130" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
</svg>