<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(12, 12)">
    <!-- Glow effect behind central intrusion point -->
    <circle cx="108" cy="108" r="45" fill="#FF4D4F" opacity="0.15"/>
    <circle cx="108" cy="108" r="30" fill="#FF4D4F" opacity="0.25"/>

    <!-- Central Computer / Server Terminal (The Target) -->
    <rect x="73" y="73" width="70" height="70" rx="10" fill="#282C37" stroke="#4F5665" stroke-width="3"/>
    
    <!-- Monitor Screen Inner -->
    <rect x="83" y="83" width="50" height="42" rx="4" fill="#14161B"/>
    
    <!-- Code lines inside screen (corrupted/threatened) -->
    <line x1="90" y1="94" x2="115" y2="94" stroke="#4F5665" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="102" x2="125" y2="102" stroke="#4F5665" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="110" x2="105" y2="110" stroke="#FF4D4F" stroke-width="2" stroke-linecap="round"/>

    <!-- Computer Base/Stand -->
    <path d="M98 143H118V149H98Z" fill="#4F5665"/>
    <rect x="88" y="149" width="40" height="5" rx="2" fill="#4F5665"/>

    <!-- Incoming External Threat / Hacker (Hooded figure silhouette approaching) -->
    <g transform="translate(0, 0)">
      <!-- Red laser/intrusion beam piercing from top-left -->
      <path d="M25 25L88 88" stroke="#FF4D4F" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
      
      <!-- Hacker Node / Malicious Source Icon (Top Left) -->
      <circle cx="25" cy="25" r="16" fill="#282C37" stroke="#FF4D4F" stroke-width="3"/>
      <!-- Skull/Bug simplified symbol inside node -->
      <circle cx="21" cy="23" r="2" fill="#FF4D4F"/>
      <circle cx="29" cy="23" r="2" fill="#FF4D4F"/>
      <path d="M22 29H28" stroke="#FF4D4F" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Second Minor Intrusion Vector -->
    <path d="M195 55L138 95" stroke="#FF4D4F" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8"/>
    <circle cx="195" cy="55" r="10" fill="#282C37" stroke="#FF4D4F" stroke-width="2"/>

    <!-- Warning / Alert Symbol (Intrusion Detected) -->
    <g transform="translate(135, 60)">
      <polygon points="12,2 22,20 2,20" fill="#FFA940"/>
      <rect x="11" y="8" width="2" height="6" rx="1" fill="#1A1D24"/>
      <circle cx="12" cy="16" r="1.2" fill="#1A1D24"/>
    </g>

    <!-- Security Breach Wave Effect -->
    <path d="M68 68C83 58 133 58 148 73" stroke="#FF4D4F" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M58 88C50 108 50 128 68 148" stroke="#FF4D4F" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
</svg>