<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient background glow for consensus/harmony -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Central Action Scene: Two human characters meeting/reaching consensus -->
  <g transform="translate(0, 10)">
    <!-- Connection/Alignment Bridge (Subtle curved link path representing agreement) -->
    <path d="M 85 110 Q 120 90 155 110" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Left Character -->
    <g transform="translate(65, 95)">
      <!-- Body / Shoulders -->
      <path d="M 0 50 L 0 35 C 0 25, 10 20, 20 20 C 30 20, 40 25, 40 35 L 40 50 Z" fill="#3B82F6"/>
      <!-- Head -->
      <circle cx="20" cy="8" r="10" fill="#93C5FD"/>
      <!-- Dynamic Action: Reaching out right arm to shake/connect -->
      <path d="M 30 30 L 48 35" stroke="#93C5FD" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Right Character -->
    <g transform="translate(135, 95)">
      <!-- Body / Shoulders -->
      <path d="M 0 50 L 0 35 C 0 25, 10 20, 20 20 C 30 20, 40 25, 40 35 L 40 50 Z" fill="#10B981"/>
      <!-- Head -->
      <circle cx="20" cy="8" r="10" fill="#6EE7B7"/>
      <!-- Dynamic Action: Reaching out left arm to meet -->
      <path d="M 10 30 L -8 35" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Central Meeting Point / Spark of Consensus (Action Effect) -->
    <g transform="translate(120, 125)">
      <circle cx="0" cy="0" r="12" fill="#F59E0B" opacity="0.2"/>
      <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
      <!-- Radiating motion/success lines -->
      <path d="M -16 0 L -10 0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 10 0 L 16 0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 -16 L 0 -10" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Contextual Support Symbol: Global/Environmental Scale representing shared issues (Climate/Topics) -->
  <g transform="translate(120, 48)">
    <!-- Globe outline representing shared domain/topic -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M -14 -6 C -6 -2, 6 -2, 14 -6" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -10 6 C -4 10, 4 10, 10 6" fill="none" stroke="#64748B" stroke-width="1.5"/>
  </g>
</svg>