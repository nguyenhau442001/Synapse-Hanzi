<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing urban planning context -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Stylized modern building silhouette in background (contextual anchor for urban planning/environment) -->
  <path d="M75 140 L75 95 L95 80 L115 95 L115 140 Z" fill="#2A3241" opacity="0.7"/>
  <path d="M125 140 L125 70 L150 55 L175 70 L175 140 Z" fill="#2A3241" opacity="0.7"/>
  <!-- Building windows -->
  <rect x="83" y="100" width="8" height="10" rx="1" fill="#1A1D24" opacity="0.5"/>
  <rect x="99" y="100" width="8" height="10" rx="1" fill="#1A1D24" opacity="0.5"/>
  <rect x="138" y="80" width="10" height="12" rx="1" fill="#1A1D24" opacity="0.5"/>
  <rect x="154" y="80" width="10" height="12" rx="1" fill="#1A1D24" opacity="0.5"/>
  <rect x="138" y="105" width="10" height="12" rx="1" fill="#1A1D24" opacity="0.5"/>
  <rect x="154" y="105" width="10" height="12" rx="1" fill="#1A1D24" opacity="0.5"/>

  <!-- Central Physical Object: A stylized architectural master plan / blueprint scroll being unfurled / presented, 
       representing the physical expression of a core demand/aspiration (诉求) -->
  
  <!-- Document shadow -->
  <path d="M75 110 Q120 135 165 110 L175 155 Q120 185 65 155 Z" fill="#0D0F13" opacity="0.4"/>

  <!-- Main Document Base -->
  <path d="M70 100 Q120 125 170 100 L170 150 Q120 175 70 150 Z" fill="#E2E8F0"/>
  
  <!-- Document inner depth / thickness -->
  <path d="M70 150 Q120 175 170 150 L170 156 Q120 181 70 156 Z" fill="#CBD5E1"/>

  <!-- Architectural blueprint lines (representing urban living environment) -->
  <path d="M85 115 L105 125 M115 110 L135 120 M145 105 L155 110" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Focus Element: A glowing golden house/environment icon emerging from the document, representing core living aspiration (核心生活诉求) -->
  <circle cx="120" cy="95" r="32" fill="#1E2530" stroke="#F59E0B" stroke-width="3"/>
  
  <!-- House symbol inside focus -->
  <path d="M105 100 L120 83 L135 100 V113 H105 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="113,113 113,101 127,101 127,113" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="120" cy="93" r="3" fill="#F59E0B"/>

  <!-- Expressive Sound/Voice Waves converging into the document (representing vocalizing/expressing the demand) -->
  <path d="M45 110 Q55 115 45 125" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M35 100 Q50 115 35 130" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <path d="M195 110 Q185 115 195 125" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M205 100 Q190 115 205 130" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Accent highlight pin / marker at top of the focal point -->
  <circle cx="120" cy="53" r="4" fill="#F59E0B"/>
  <path d="M120 57 L120 63" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

</svg>