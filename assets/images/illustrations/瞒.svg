<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person standing, hiding something behind their back -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 20 L-20 80 L20 80 L20 20 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#E2E8F0"/>
    <!-- Arm visible -->
    <path d="M-20 25 L-45 50" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>
    <!-- Arm hidden behind back -->
    <path d="M20 25 L40 40" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>
    <!-- The hidden object (a document/file) -->
    <rect x="35" y="30" width="20" height="25" rx="2" fill="#F6AD55"/>
    <line x1="40" y1="38" x2="50" y2="38" stroke="#1A1D24" stroke-width="2"/>
    <line x1="40" y1="45" x2="50" y2="45" stroke="#1A1D24" stroke-width="2"/>
    <line x1="40" y1="52" x2="45" y2="52" stroke="#1A1D24" stroke-width="2"/>
  </g>
  
  <!-- Subtle shadow/curtain effect to emphasize concealment -->
  <path d="M180 0 L240 0 L240 240 L180 240 Z" fill="#000000" fill-opacity="0.2"/>
</svg>