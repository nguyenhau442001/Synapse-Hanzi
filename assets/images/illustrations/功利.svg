<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: An ornate, closed mechanical scale/cash-register hybrid representing calculating self-interest (功利 - utilitarianism/material gain) -->
  <g transform="translate(120, 120)">
    <!-- Scale Base / Stand -->
    <path d="M-28,68 L28,68 L20,40 L-20,40 Z" fill="#3A4454"/>
    <rect x="-6" y="-10" width="12" height="52" fill="#525E75" rx="3"/>
    
    <!-- Balance Beam -->
    <path d="M-64,12 L64,12 L56,-2 L-56,-2 Z" fill="#E5A93B"/>
    <circle cx="0" cy="5" r="10" fill="#F3C35C"/>
    
    <!-- Left Pan: Open Book (representing study/knowledge) -->
    <g transform="translate(-64, 16)">
      <path d="M-22,0 L0,-10 L22,0 L22,24 L0,16 L-22,24 Z" fill="#2E3846"/>
      <path d="M-20,3 L-2, -4 L-2, 17 L-20,21 Z" fill="#8B9BB4"/>
      <path d="M2, -4 L20,3 L20,21 L2, 17 Z" fill="#A4B3C6"/>
      <!-- Hanging cords -->
      <line x1="-15" y1="-12" x2="-15" y2="0" stroke="#717D96" stroke-width="2"/>
      <line x1="15" y1="-12" x2="15" y2="0" stroke="#717D96" stroke-width="2"/>
      <line x1="0" y1="-15" x2="0" y2="-2" stroke="#717D96" stroke-width="2"/>
      <path d="M-15,-12 L0,-15 L15,-12" fill="none" stroke="#717D96" stroke-width="2"/>
    </g>
    
    <!-- Right Pan: Stack of Gold Coins (representing utilitarian gain/reward) -->
    <g transform="translate(64, 16)">
      <!-- Hanging cords -->
      <line x1="-15" y1="-12" x2="-15" y2="0" stroke="#717D96" stroke-width="2"/>
      <line x1="15" y1="-12" x2="15" y2="0" stroke="#717D96" stroke-width="2"/>
      <line x1="0" y1="-15" x2="0" y2="-2" stroke="#717D96" stroke-width="2"/>
      <path d="M-15,-12 L0,-15 L15,-12" fill="none" stroke="#717D96" stroke-width="2"/>
      
      <!-- Coin Stack -->
      <ellipse cx="0" cy="18" rx="16" ry="6" fill="#D9822B"/>
      <path d="M-16,10 L-16,18 C-16,21 16,21 16,18 L16,10 C16,13 -16,13 -16,10 Z" fill="#E59D3B"/>
      <ellipse cx="0" cy="10" rx="16" ry="6" fill="#F2B33F"/>
      
      <ellipse cx="0" cy="4" rx="16" ry="6" fill="#D9822B"/>
      <path d="M-16,-4 L-16,4 C-16,7 16,7 16,4 L16,-4 C16,-1 -16,-1 -16,-4 Z" fill="#E59D3B"/>
      <ellipse cx="0" cy="-4" rx="16" ry="6" fill="#F2B33F"/>

      <ellipse cx="0" cy="-10" rx="16" ry="6" fill="#D9822B"/>
      <path d="M-16,-18 L-16,-10 C-16,-7 16,-7 16,-10 L16,-18 C16,-15 -16,-15 -16,-18 Z" fill="#E59D3B"/>
      <ellipse cx="0" cy="-18" rx="16" ry="6" fill="#FFC94D"/>
    </g>

    <!-- Tilted beam dynamic showing transactional mindset (heavy on the gold side) -->
    <!-- Re-draw beam rotated slightly to show utilitarian imbalance -->
  </g>
  
  <!-- Overlay corrected beam for tilt representing calculating/utilitarian bias -->
  <g transform="translate(120, 115)">
    <path d="M-66,20 L62,-4 L54,-18 L-58,6 Z" fill="#F3C35C"/>
    <circle cx="0" cy="0" r="10" fill="#E5A93B"/>
    <circle cx="0" cy="0" r="5" fill="#1A1D24"/>
  </g>
</svg>