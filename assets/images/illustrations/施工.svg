<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ground plane -->
  <rect x="28" y="172" width="184" height="4" rx="2" fill="#2E3440"/>
  
  <!-- Construction barrier (Yellow & Black stripes) -->
  <!-- Left support leg -->
  <path d="M52 135 L62 135 L68 172 L58 172 Z" fill="#4C566A"/>
  <!-- Right support leg -->
  <path d="M188 135 L178 135 L172 172 L182 172 Z" fill="#4C566A"/>
  <!-- Main barrier board -->
  <g rx="4">
    <rect x="42" y="105" width="156" height="34" rx="4" fill="#EBCB8B"/>
    <!-- Stripes -->
    <path d="M72 105 L62 139 L78 139 L88 105 Z" fill="#2E3440"/>
    <path d="M112 105 L102 139 L118 139 L128 105 Z" fill="#2E3440"/>
    <path d="M152 105 L142 139 L158 139 L168 105 Z" fill="#2E3440"/>
  </g>

  <!-- Construction Hat (Hard Hat) placed on barrier or prominent -->
  <g transform="translate(100, 62)">
    <!-- Hat body -->
    <path d="M 20 22 C 10 22, 2 30, 0 38 L 40 38 C 38 30, 30 22, 20 22 Z" fill="#D08770"/>
    <ellipse cx="20" cy="38" rx="22" ry="5" fill="#D08770"/>
    <!-- Hat brim ridge -->
    <path d="M 1 36 C 10 38, 30 38, 39 36" stroke="#B48EAD" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Glowing Warning Light on top of barrier -->
  <g transform="translate(120, 93)">
    <circle cx="0" cy="-6" r="6" fill="#BF616A"/>
    <path d="M-3 -6 L3 -6 L2 0 L-2 0 Z" fill="#EBCB8B"/>
    <!-- Light glow effect -->
    <circle cx="0" cy="-6" r="10" fill="#BF616A" opacity="0.25"/>
  </g>

  <!-- Tower Crane silhouette in background -->
  <g opacity="0.35">
    <!-- Mast -->
    <rect x="190" y="50" width="6" height="122" fill="#88C0D0"/>
    <!-- Jib (Boom) -->
    <path d="M100 55 L210 55 L210 63 L100 63 Z" fill="#88C0D0"/>
    <!-- Counter-jib -->
    <rect x="175" y="55" width="25" height="6" fill="#88C0D0"/>
    <!-- Counterweight -->
    <rect x="170" y="61" width="10" height="12" fill="#88C0D0" rx="2"/>
    <!-- Hook/Cable -->
    <line x1="115" y1="63" x2="115" y2="95" stroke="#88C0D0" stroke-width="2"/>
    <rect x="111" y="95" width="8" height="6" fill="#88C0D0" rx="1"/>
  </g>
</svg>