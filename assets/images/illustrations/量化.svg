<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: A sleek, modern digital clipboard and metric analyzer representing quantitative evaluation -->
  <g transform="translate(0, 0)">
    <!-- Clipboard Body (Physical Object) -->
    <rect x="70" y="45" width="100" height="150" rx="10" fill="#282D3D" stroke="#3A4256" stroke-width="3"/>
    
    <!-- Clipboard Clip -->
    <path d="M 95 45 L 95 38 C 95 35.8 96.8 34 99 34 L 141 34 C 143.2 34 145 35.8 145 38 L 145 45 Z" fill="#F39C12"/>
    <rect x="105" y="40" width="30" height="4" rx="2" fill="#1A1D24"/>

    <!-- Document Header / Target Marker -->
    <circle cx="90" cy="75" r="10" fill="#3A4256"/>
    <path d="M 86 75 L 89 78 L 95 71" fill="none" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="110" y="70" width="40" height="6" rx="3" fill="#4E5D6C"/>

    <!-- Data Rows & Quantitative Metric Bars -->
    <rect x="85" y="98" width="70" height="4" rx="2" fill="#3A4256"/>
    <!-- Quantized bar chart graphic embedded on document -->
    <rect x="85" y="112" width="25" height="8" rx="2" fill="#F39C12"/>
    <rect x="115" y="112" width="40" height="8" rx="2" fill="#F39C12"/>

    <rect x="85" y="132" width="70" height="4" rx="2" fill="#3A4256"/>
    <!-- Quantized bar chart graphic embedded on document -->
    <rect x="85" y="146" width="50" height="8" rx="2" fill="#3498DB"/>
    <rect x="140" y="146" width="15" height="8" rx="2" fill="#3A4256"/>

    <!-- Numeric Data Output Stamp (Emphasizing precise quantification) -->
    <rect x="85" y="168" width="70" height="18" rx="4" fill="#1A1D24"/>
    <circle cx="97" cy="177" r="4" fill="#2ECC71"/>
    <rect x="108" y="175" width="38" height="4" rx="2" fill="#2ECC71"/>
  </g>

  <!-- Floating precision nodes symbolizing the transformation of qualitative work into quantitative metrics -->
  <circle cx="45" cy="85" r="6" fill="#F39C12" opacity="0.9"/>
  <circle cx="195" cy="115" r="5" fill="#3498DB" opacity="0.9"/>
  <circle cx="55" cy="175" r="4" fill="#2ECC71" opacity="0.9"/>
  
  <!-- Connecting precise alignment vectors -->
  <line x1="51" y1="85" x2="70" y2="85" stroke="#F39C12" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="170" y1="115" x2="190" y2="115" stroke="#3498DB" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
</svg>