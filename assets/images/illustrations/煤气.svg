<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to highlight the object -->
  <circle cx="120" cy="120" r="70" fill="#FF7B00" opacity="0.05"/>

  <!-- Gas Stove Top (Base surface) -->
  <path d="M 60 160 L 180 160 L 190 190 L 50 190 Z" fill="#2D323E" />
  <path d="M 50 190 L 190 190 L 195 200 L 45 200 Z" fill="#222630" />

  <!-- Gas Burner Grate -->
  <rect x="85" y="145" width="70" height="15" rx="4" fill="#4B5563"/>
  <line x1="105" y1="145" x2="105" y2="160" stroke="#1A1D24" stroke-width="3"/>
  <line x1="135" y1="145" x2="135" y2="160" stroke="#1A1D24" stroke-width="3"/>

  <!-- Gas Flame (representing 煤气 in use/burning) -->
  <path d="M 120 70 Q 135 100 130 120 Q 120 135 120 135 Q 120 135 110 120 Q 105 100 120 70 Z" fill="#FF9F0A"/>
  <path d="M 120 90 Q 128 110 125 122 Q 120 130 120 130 Q 120 130 115 122 Q 112 110 120 90 Z" fill="#FFD60A"/>

  <!-- Valve Control Knob -->
  <rect x="105" y="200" width="30" height="10" rx="3" fill="#6B7280"/>
  <circle cx="120" cy="205" r="3" fill="#FF7B00"/>

  <!-- Pipe / Gas Line Connection -->
  <path d="M 120 160 L 120 185" stroke="#4B5563" stroke-width="8" stroke-linecap="round"/>

  <!-- Floating Wavy Gas/Vapor Wisps (indicating gas nature) -->
  <path d="M 90 75 Q 80 65 90 55 T 90 35" fill="none" stroke="#FF7B00" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 150 70 Q 160 55 150 45 T 150 25" fill="none" stroke="#FF7B00" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>