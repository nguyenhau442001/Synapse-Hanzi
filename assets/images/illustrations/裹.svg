<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle cold wind lines in the background -->
  <path d="M35 70 Q55 70 70 65 T105 70" stroke="#2D3748" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M140 160 Q160 160 175 155 T210 160" stroke="#2D3748" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M25 125 Q45 125 60 120 T95 125" stroke="#2D3748" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M150 85 Q170 85 185 80 T215 85" stroke="#2D3748" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Wrapped Person (Down Jacket / Puffer Coat concept visualizing "裹") -->
  <g transform="translate(0, 5)">
    <!-- Scarf wrapped tightly around neck -->
    <path d="M96 82 Q120 90 144 82 Q150 95 130 102 Q120 105 106 102 Q90 95 96 82 Z" fill="#E06D53"/>
    <path d="M110 98 L105 130 L120 132 L124 98 Z" fill="#E06D53"/>

    <!-- Puffer jacket body (thick, puffy, bundled up shape) -->
    <path d="M75 105 C75 95 165 95 165 105 C175 130 175 165 170 195 C168 205 72 205 70 195 C65 165 65 130 75 105 Z" fill="#3B82F6"/>

    <!-- Horizontal baffle lines to show thick down padding -->
    <path d="M72 125 Q120 130 168 125" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M70 145 Q120 152 170 145" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M70 165 Q120 172 170 165" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M71 185 Q120 191 169 185" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Hood tightly wrapped around head -->
    <path d="M85 75 C80 50 160 50 155 75 C150 90 150 98 120 98 C90 98 90 90 85 75 Z" fill="#2563EB"/>
    <!-- Hood opening / Face deeply tucked inside -->
    <path d="M102 70 C100 58 140 58 138 70 C136 85 104 85 102 70 Z" fill="#1E293B"/>

    <!-- Eyes peeking out, showing warmth inside the bundle -->
    <circle cx="113" cy="72" r="2.5" fill="#F8FAFC"/>
    <circle cx="127" cy="72" r="2.5" fill="#F8FAFC"/>

    <!-- Arms tightly folded/wrapped inward into the body -->
    <path d="M75 125 C60 135 65 160 85 165 L80 145 Z" fill="#3B82F6"/>
    <path d="M165 125 C180 135 175 160 155 165 L160 145 Z" fill="#3B82F6"/>
  </g>

  <!-- Focus accent / Warm glow indicator -->
  <circle cx="120" cy="120" r="95" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 12" fill="none" opacity="0.4"/>
</svg>