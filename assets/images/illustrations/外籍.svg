<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/world latitude lines for global context -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#252A34" stroke-width="1.5" stroke-dasharray="4 4"/>
  <ellipse cx="120" cy="120" rx="70" ry="26" fill="none" stroke="#252A34" stroke-width="1.5"/>
  <line x1="50" y1="120" x2="190" y2="120" stroke="#252A34" stroke-width="1.5"/>
  <line x1="120" y1="50" x2="120" y2="190" stroke="#252A34" stroke-width="1.5"/>

  <!-- Central Noun Focus: A stylized modern passport/identity document representing nationality/foreign status -->
  <g transform="translate(120, 120)">
    <!-- Passport shadow/base -->
    <rect x="-38" y="-52" width="76" height="100" rx="10" fill="#111418"/>
    
    <!-- Passport cover (Deep blue/slate with orange/gold accent representing official status/foreign identity) -->
    <rect x="-42" y="-56" width="76" height="100" rx="10" fill="#2D3748" stroke="#4A5568" stroke-width="1.5"/>
    <rect x="-42" y="-56" width="76" height="100" rx="10" fill="url(#passportGradient)" opacity="0.15"/>
    
    <!-- Globe emblem on passport cover (Gold/Orange accent) -->
    <circle cx="-4" cy="-16" r="18" fill="none" stroke="#F6AD55" stroke-width="2"/>
    <path d="M -22 -16 H 14" stroke="#F6AD55" stroke-width="1.5"/>
    <path d="M -16 -28 V -4" stroke="#F6AD55" stroke-width="1.5"/>
    <path d="M 8 -28 V -4" stroke="#F6AD55" stroke-width="1.5"/>
    <path d="M -14 -4 C -14 2, 6 2, 6 -4" fill="none" stroke="#F6AD55" stroke-width="1.5"/>
    <path d="M -16 -28 C -16 -22, 8 -22, 8 -28" fill="none" stroke="#F6AD55" stroke-width="1.5"/>

    <!-- Passport decorative lines (ID text placeholders) -->
    <rect x="-26" y="14" width="44" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="-26" y="24" width="30" height="3" rx="1.5" fill="#A0AEC0"/>
    <rect x="-26" y="31" width="36" height="3" rx="1.5" fill="#A0AEC0"/>

    <!-- Passport ribbon / Foreign visa stamp accent (Orange highlight for semantic clarity) -->
    <path d="M 34 -40 L 46 -30 L 34 -20 Z" fill="#ED8936"/>
    <circle cx="40" cy="-30" r="12" fill="none" stroke="#ED8936" stroke-width="3"/>
    
    <!-- Floating ID card overlay (representing individual foreign expert/person) -->
    <g transform="translate(26, 16)">
      <rect x="-24" y="-24" width="56" height="40" rx="6" fill="#1A202C" stroke="#ED8936" stroke-width="2"/>
      <!-- User avatar icon inside ID card -->
      <circle cx="-2" cy="-8" r="6" fill="#F6AD55"/>
      <path d="M -14 6 C -14 1, 10 1, 10 6" fill="#F6AD55"/>
      <!-- ID lines -->
      <чете rect x="6" y="-12" width="18" height="3" rx="1.5" fill="#E2E8F0"/>
      <rect x="6" y="-6" width="12" height="2" rx="1" fill="#A0AEC0"/>
      <rect x="6" y="-1" width="16" height="2" rx="1" fill="#A0AEC0"/>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="passportGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED8936"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>
  </defs>
</svg>