<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ocean waves and sea background -->
  <path d="M 0 190 Q 40 175, 80 190 T 160 190 T 240 190 L 240 240 L 0 240 Z" fill="#1E293B"/>
  <path d="M 0 205 Q 50 190, 100 205 T 200 205 T 240 205 L 240 240 L 0 240 Z" fill="#0F172A"/>
  
  <!-- Wind gusts lines (representing 呼啸的海风) -->
  <path d="M 25 70 Q 55 65, 85 75" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 15 90 Q 45 85, 75 95" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M 40 110 Q 70 105, 100 115" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- Sailboat Hull -->
  <path d="M 75 175 L 165 175 C 175 175, 180 185, 175 190 L 65 190 C 60 185, 65 175, 75 175 Z" fill="#334155"/>
  <path d="M 115 130 L 115 175" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- High lifted/hoisted white sail (扬起洁白坚固的风帆 - main focus representing 扬) -->
  <!-- Dynamic curved sail catching the wind -->
  <path d="M 115 135 C 135 110, 175 120, 185 155 C 165 165, 135 170, 115 175 Z" fill="#F8FAFC"/>
  <!-- Sail shading/depth -->
  <path d="M 115 135 C 135 110, 175 120, 185 155 C 165 160, 140 165, 115 170 Z" fill="#E2E8F0"/>
  
  <!-- Accent highlight representing the upward soaring action (扬) -->
  <path d="M 175 110 C 185 90, 200 75, 215 65" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 185 125 C 195 115, 205 105, 220 95" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Water splash around the hull -->
  <circle cx="65" cy="190" r="3" fill="#38BDF8"/>
  <circle cx="175" cy="190" r="3" fill="#38BDF8"/>
</svg>