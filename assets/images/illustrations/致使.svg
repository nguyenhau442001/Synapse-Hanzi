<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stylized physical object representing the causal agent/consequence concept: A cracked earth terrain tilting and draining into a severe deficit -->
  <g transform="translate(0, 0)">
    <!-- Background glow of drought (sun/heat source top right) -->
    <circle cx="180" cy="60" r="30" fill="#FF5722" opacity="0.15"/>
    <path d="M170 50 L190 70 M190 50 L170 70" stroke="#FF5722" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

    <!-- Tilted dry ground / reservoir bank -->
    <path d="M 40 140 L 140 140 L 200 180 L 40 180 Z" fill="#2C323D"/>
    
    <!-- Cracked ground texture lines -->
    <path d="M 60 140 L 75 155 M 75 155 L 70 165 M 75 155 L 90 150" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 110 140 L 120 158 L 135 162" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Dropped water level (Severe decrease indicator) -->
    <path d="M 140 160 L 180 180 L 140 180 Z" fill="#FF3B30" opacity="0.2"/>
    
    <!-- Low water basin -->
    <path d="M 90 170 Q 115 170 130 177 L 130 185 L 90 185 Z" fill="#007AFF" opacity="0.8"/>

    <!-- Main Causation Chain / Falling Heavy Mechanism (Visualizing "leading to / resulting in") -->
    <!-- Heavy weight pressing down (Cause) -->
    <rect x="75" y="70" width="50" height="40" rx="6" fill="#FFA726"/>
    <path d="M 90 85 L 100 95 L 110 85" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Downward impact force arrows -->
    <path d="M 100 115 L 100 135" stroke="#FF5722" stroke-width="4" stroke-linecap="round"/>
    <path d="M 92 127 L 100 137 L 108 127" fill="#FF5722"/>

    <!-- Resulting sharp decline arrow (pointing down-right, flashing red for negative consequence) -->
    <path d="M 135 110 L 175 150" stroke="#FF3B30" stroke-width="6" stroke-linecap="round"/>
    <path d="M 160 150 L 175 150 L 175 135" fill="none" stroke="#FF3B30" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Warning / Adverse effect indicator symbol -->
    <circle cx="175" cy="115" r="14" fill="#FF3B30"/>
    <path d="M 175 107 L 175 117 M 175 121 L 175 123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>