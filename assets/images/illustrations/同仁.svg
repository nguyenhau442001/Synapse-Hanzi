<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Group representing 同仁 (Colleagues / Team Members) -->
  <g transform="translate(0, 15)">
    <!-- Person 1 (Left) -->
    <g transform="translate(60, 95)">
      <!-- Body / Suit -->
      <path d="M-22 55 C-22 38 -12 30 -2 30 C8 30 18 38 18 55 L22 75 L-26 75 Z" fill="#2E4A62"/>
      <path d="M-6 30 L0 42 L6 30 Z" fill="#E2E8F0"/>
      <path d="M-2 30 L0 38 L2 30 Z" fill="#F59E0B"/>
      <!-- Head / Hair -->
      <circle cx="-2" cy="12" r="14" fill="#FBBF24"/>
      <path d="M-16 10 C-16 -2 12 -2 12 8 C12 8 8 4 -2 4 C-12 4 -16 10 -16 10 Z" fill="#1E293B"/>
    </g>

    <!-- Person 2 (Center - Slightly taller/prominent) -->
    <g transform="translate(120, 85)">
      <!-- Body / Suit -->
      <path d="M-24 65 C-24 45 -13 35 0 35 C13 35 24 45 24 65 L28 85 L-28 85 Z" fill="#3B82F6"/>
      <path d="M-7 35 L0 48 L7 35 Z" fill="#FFFFFF"/>
      <path d="M-2 35 L0 43 L2 35 Z" fill="#EF4444"/>
      <!-- Head / Hair -->
      <circle cx="0" cy="14" r="15" fill="#FBBF24"/>
      <path d="M-15 14 C-15 0 15 0 15 14 C15 14 10 6 0 6 C-10 6 -15 14 -15 14 Z" fill="#334155"/>
    </g>

    <!-- Person 3 (Right) -->
    <g transform="translate(180, 95)">
      <!-- Body / Suit -->
      <path d="M-18 55 C-18 38 -8 30 2 30 C12 30 22 38 22 55 L26 75 L-22 75 Z" fill="#0D9488"/>
      <path d="M-6 30 L0 42 L6 30 Z" fill="#E2E8F0"/>
      <path d="M-2 30 L0 38 L2 30 Z" fill="#F59E0B"/>
      <!-- Head / Hair -->
      <circle cx="2" cy="12" r="14" fill="#FBBF24"/>
      <path d="M-12 12 C-12 2 16 2 14 12 C10 8 4 6 2 6 C-4 6 -10 8 -12 12 Z" fill="#475569"/>
    </g>

    <!-- Professional Workspace Element (Desks / Connection line) -->
    <path d="M40 170 L200 170" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <rect x="75" y="155" width="90" height="6" rx="3" fill="#64748B"/>

    <!-- Subtle teamwork accent: Shared document / laptop screen -->
    <g transform="translate(105, 130)">
      <rect x="-15" y="0" width="30" height="20" rx="3" fill="#94A3B8"/>
      <path d="M-10 5 L0 5" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10 10 L10 10" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10 15 L5 15" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <path d="M-20 20 L20 20" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>