<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Object: A complex, multi-faceted abstract sculpture representing the film/subject -->
  <g transform="translate(120, 120)">
    <path d="M-40,-20 L0,-60 L40,-20 L0,20 Z" fill="#FFB84D" opacity="0.9"/>
    <path d="M-40,-20 L0,20 L-40,60 L-80,20 Z" fill="#4D94FF" opacity="0.8"/>
    <path d="M40,-20 L0,20 L40,60 L80,20 Z" fill="#FF6B6B" opacity="0.8"/>
  </g>

  <!-- Observer 1: The 'Ren' (Benevolent/Humanistic perspective) -->
  <g transform="translate(60, 180)">
    <circle cx="0" cy="-20" r="15" fill="#E0E0E0"/>
    <path d="M-20,0 Q0,-10 20,0 L15,30 L-15,30 Z" fill="#E0E0E0"/>
    <circle cx="-5" cy="-25" r="2" fill="#1A1D24"/>
    <circle cx="5" cy="-25" r="2" fill="#1A1D24"/>
  </g>

  <!-- Observer 2: The 'Zhi' (Intellectual/Analytical perspective) -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="-20" r="15" fill="#A0A0A0"/>
    <path d="M-20,0 Q0,-10 20,0 L15,30 L-15,30 Z" fill="#A0A0A0"/>
    <rect x="-8" y="-28" width="16" height="4" fill="#1A1D24"/>
    <circle cx="-5" cy="-20" r="2" fill="#1A1D24"/>
    <circle cx="5" cy="-20" r="2" fill="#1A1D24"/>
  </g>

  <!-- Connecting lines indicating different interpretations -->
  <path d="M75,160 L100,100" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M165,160 L140,100" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="4 4"/>
</svg>