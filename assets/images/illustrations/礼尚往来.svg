<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow/elements for atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Central Physical Object Group: Two stylized elegant gift boxes exchanging in mid-air to represent mutual reciprocity (礼尚往来) -->
  
  <!-- Motion / Exchange Path Arc -->
  <path d="M 70 130 Q 120 80 170 130" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Left Box (Moving Right / Given) -->
  <g transform="translate(65, 115)">
    <!-- Shadow -->
    <ellipse cx="20" cy="35" rx="16" ry="6" fill="#111317" opacity="0.4"/>
    <!-- Box Body -->
    <rect x="5" y="10" width="30" height="25" rx="3" fill="#E74C3C"/>
    <rect x="18" y="10" width="4" height="25" fill="#F1C40F"/>
    <!-- Box Lid -->
    <rect x="3" y="5" width="34" height="7" rx="2" fill="#C0392B"/>
    <rect x="18" y="5" width="4" height="7" fill="#F39C12"/>
    <!-- Bow -->
    <path d="M 15 3 C 10 -2 5 2 12 5 Z" fill="#F1C40F"/>
    <path d="M 25 3 C 30 -2 35 2 28 5 Z" fill="#F1C40F"/>
  </g>

  <!-- Right Box (Moving Left / Received in Return) -->
  <g transform="translate(135, 95)">
    <!-- Shadow -->
    <ellipse cx="20" cy="35" rx="16" ry="6" fill="#111317" opacity="0.4"/>
    <!-- Box Body -->
    <rect x="5" y="10" width="30" height="25" rx="3" fill="#3498DB"/>
    <rect x="18" y="10" width="4" height="25" fill="#2ECC71"/>
    <!-- Box Lid -->
    <rect x="3" y="5" width="34" height="7" rx="2" fill="#2980B9"/>
    <rect x="18" y="5" width="4" height="7" fill="#27AE60"/>
    <!-- Bow -->
    <path d="M 15 3 C 10 -2 5 2 12 5 Z" fill="#2ECC71"/>
    <path d="M 25 3 C 30 -2 35 2 28 5 Z" fill="#2ECC71"/>
  </g>

  <!-- Central Interaction Spark / Balance Icon -->
  <g transform="translate(120, 110)">
    <circle cx="0" cy="0" r="10" fill="#252A34" stroke="#F39C12" stroke-width="2"/>
    <!-- Reciprocal arrows inside central node -->
    <path d="M -4 -2 L 4 -2 L 2 -5 M 4 -2 L 2 1" fill="none" stroke="#F39C12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 4 2 L -4 2 L -2 5 M -4 2 L -2 -1" fill="none" stroke="#F39C12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Base Hands/Platform suggesting human connection (Simplified minimalist hands supporting the exchange) -->
  <path d="M 50 165 C 70 175 90 175 110 165" fill="none" stroke="#7F8C8D" stroke-width="3" stroke-linecap="round"/>
  <path d="M 130 165 C 150 175 170 175 190 165" fill="none" stroke="#7F8C8D" stroke-width="3" stroke-linecap="round"/>

</svg>