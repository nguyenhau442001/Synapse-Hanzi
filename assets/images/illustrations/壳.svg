  <path d="M160 130 L150 190 L190 180 L180 120 Z" fill="#F5F5F5" stroke="#1A1D24" stroke-width="2"/>
  
  <!-- Main Egg Shell -->
  <path d="M120 60 C 80 60, 70 100, 70 130 C 70 160, 90 180, 120 180 C 150 180, 170 160, 170 130 C 170 100, 160 60, 120 60 Z" fill="#FFFFFF"/>
  
  <!-- Crack -->
