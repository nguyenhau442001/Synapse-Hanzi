<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative background elements -->
  <g opacity="0.3">
    <!-- Winding path/road in the background -->
    <path d="M 40 190 Q 90 190, 120 140 T 200 50" fill="none" stroke="#2A2F3D" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Main active path representing the journey (中途 context) -->
  <path d="M 40 190 Q 90 190, 120 140" fill="none" stroke="#3E4556" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Highlighted completed path -->
  <path d="M 40 190 Q 70 190, 85 170" fill="none" stroke="#FFA116" stroke-width="12" stroke-linecap="round"/>

  <!-- Iconic Physical Object/Character Centerpiece (Traveler / Hiker paused midway) -->
  <g transform="translate(100, 110)">
    <!-- Shadow -->
    <ellipse cx="20" cy="55" rx="16" ry="6" fill="#0D0F13"/>

    <!-- Hiking backpack (Physical object representing the journey/effort) -->
    <path d="M 12 25 C 8 25, 6 28, 6 32 L 6 45 C 6 48, 8 50, 12 50 L 22 50 C 26 50, 28 48, 28 45 L 28 32 C 28 28, 26 25, 22 25 Z" fill="#D97706"/>
    <!-- Backpack details -->
    <rect x="11" y="30" width="12" height="8" rx="2" fill="#B45309"/>
    <line x1="6" y1="35" x2="28" y2="35" stroke="#B45309" stroke-width="2"/>

    <!-- Traveler body (simplified flat design human representation stopping midway) -->
    <!-- Legs -->
    <path d="M 17 50 L 14 62" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
    <path d="M 23 50 L 27 60" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso -->
    <path d="M 12 28 L 26 28 L 24 50 L 14 50 Z" fill="#6366F1"/>
    <!-- Head -->
    <circle cx="19" cy="16" r="8" fill="#FBBF24"/>
    <!-- Hat -->
    <path d="M 10 14 C 10 9, 28 9, 28 14 Z" fill="#D97706"/>
    <ellipse cx="19" cy="14" rx="11" ry="2" fill="#B45309"/>

    <!-- Arms -->
    <path d="M 25 32 L 34 38" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>
    <path d="M 13 32 L 6 28" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Milestone Marker / Signpost indicating "Midway / 中途" -->
  <g transform="translate(145, 105)">
    <!-- Wooden post -->
    <rect x="12" y="15" width="6" height="60" fill="#78350F" rx="2"/>
    <!-- Sign boards -->
    <path d="M -5 20 L 29 20 L 24 35 L -5 35 Z" fill="#B45309"/>
    <path d="M 3 40 L 33 40 L 38 55 L 3 55 Z" fill="#D97706"/>
    <!-- Base rock -->
    <path d="M 5 75 C 2 75, 0 72, 3 70 C 8 66, 17 66, 22 70 C 25 72, 23 75, 20 75 Z" fill="#4B5563"/>
  </g>

  <!-- Destination flag in the distance (ahead, yet to be reached) -->
  <g transform="translate(195, 35)">
    <line x1="5" y1="0" x2="5" y2="40" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 5 2 L 25 10 L 5 18 Z" fill="#EF4444"/>
    <circle cx="5" cy="0" r="3" fill="#E5E7EB"/>
  </g>
</svg>