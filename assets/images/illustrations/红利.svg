<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for financial success -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Central Physical Object: Modern Financial Dividend / Share Certificate with Gold Coins -->
  <!-- Document / Share Certificate Background -->
  <g transform="translate(65, 50)">
    <!-- Paper base -->
    <rect x="0" y="0" width="110" height="140" rx="8" fill="#2D3340" stroke="#3E4756" stroke-width="2"/>
    
    <!-- Document Header Accent -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 102 0 A 8 8 0 0 1 110 8 L 110 32 L 0 32 Z" fill="#363D4E"/>
    
    <!-- Header Lines / Icon representation -->
    <circle cx="20" cy="16" r="6" fill="#F59E0B"/>
    <rect x="34" y="13" width="50" height="6" rx="3" fill="#6B7280"/>

    <!-- Document Content Lines -->
    <rect x="15" y="48" width="55" height="6" rx="3" fill="#4B5563"/>
    <rect x="15" y="64" width="80" height="5" rx="2" fill="#374151"/>
    <rect x="15" y="76" width="65" height="5" rx="2" fill="#374151"/>
    <rect x="15" y="88" width="75" height="5" rx="2" fill="#374151"/>

    <!-- Graph / Upward Trend Line at bottom of document -->
    <path d="M 15 125 L 40 108 L 65 115 L 95 92" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="92" r="4" fill="#10B981"/>
  </g>

  <!-- Foreground / Overlapping Gold Dividend Coins & Wealth Symbols (Representing 利润 / 红利) -->
  <!-- Large Gold Coin -->
  <g transform="translate(145, 145)">
    <circle cx="0" cy="0" r="32" fill="#D97706"/>
    <circle cx="0" cy="0" r="26" fill="#F59E0B"/>
    <!-- Inner design -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- Dollar / Wealth symbol (abstract geometric representation) -->
    <path d="M -4 -12 L 4 -12 M 0 -14 L 0 14 M -6 8 L 6 8 M -5 3 L 5 3" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Medium Gold Coin (Stacking/Floating for abundance) -->
  <g transform="translate(85, 165)">
    <circle cx="0" cy="0" r="24" fill="#B45309"/>
    <circle cx="0" cy="0" r="19" fill="#D97706"/>
    <path d="M -3 -9 L 3 -9 M 0 -11 L 0 11 M -4 6 L 4 6" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Top Small Gold Coin -->
  <g transform="translate(130, 85)">
    <circle cx="0" cy="0" r="18" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="14" fill="#FBBF24"/>
    <path d="M -2 -7 L 2 -7 M 0 -8 L 0 8 M -3 5 L 3 5" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles / Accent highlights indicating payout & value -->
  <path d="M 180 85 L 183 95 L 193 98 L 183 101 L 180 111 L 177 101 L 167 98 L 177 95 Z" fill="#FBBF24"/>
  <path d="M 65 95 L 67 101 L 73 103 L 67 105 L 65 111 L 63 105 L 57 103 L 63 101 Z" fill="#F59E0B" opacity="0.7"/>

</svg>