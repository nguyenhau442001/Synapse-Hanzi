<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow representing warmth/care -->
  <circle cx="120" cy="115" r="70" fill="#FFB74D" opacity="0.08"/>

  <!-- Bed/Pillow setup representing the context (bedside caring) -->
  <path d="M50 165 C 50 155, 60 150, 80 150 L 160 150 C 180 150, 190 155, 190 165 L 190 185 C 190 190, 185 195, 180 195 L 60 195 C 55 195, 50 190, 50 185 Z" fill="#2A303C"/>
  <rect x="70" y="140" width="45" height="20" rx="6" fill="#363C4E"/>

  <!-- Mother Character (娘) - Seated gently beside the bed -->
  <!-- Body/Torso -->
  <path d="M 95 120 C 95 105, 105 95, 120 95 C 135 95, 145 105, 145 120 L 155 170 C 155 175, 150 180, 145 180 L 95 180 C 90 180, 85 175, 85 170 Z" fill="#3D5AFE"/>

  <!-- Head & Hair -->
  <circle cx="120" cy="78" r="18" fill="#FFCCBC"/>
  <!-- Hair styling -->
  <path d="M 102 78 C 102 66, 110 60, 120 60 C 130 60, 138 66, 138 78 C 138 74, 135 62, 120 62 C 105 62, 102 74, 102 78 Z" fill="#212121"/>
  <circle cx="129" cy="68" r="5" fill="#212121"/> <!-- Hair bun -->

  <!-- Gentle Caring Hands resting on the bed/child's area -->
  <path d="M 135 155 C 145 155, 155 160, 158 165 C 160 168, 155 172, 150 170 C 145 168, 140 165, 135 165 Z" fill="#FFCCBC"/>

  <!-- Warm Reading Lamp illuminating the scene softly -->
  <path d="M 185 60 L 205 90 L 165 90 Z" fill="#FFB74D"/>
  <rect x="183" y="90" width="4" height="60" fill="#4E5D6C"/>
  <path d="M 170 150 L 200 150" stroke="#4E5D6C" stroke-width="4" stroke-linecap="round"/>

  <!-- Soft Accent Glow on Mother's face to show attentiveness and devotion -->
  <circle cx="120" cy="78" r="22" fill="none" stroke="#FFB74D" stroke-width="1.5" opacity="0.3"/>
</svg>