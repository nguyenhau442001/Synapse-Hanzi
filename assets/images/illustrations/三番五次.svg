<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative pattern for repetition/layers -->
  <g opacity="0.15" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <circle cx="120" cy="120" r="95"/>
    <circle cx="120" cy="120" r="75"/>
    <circle cx="120" cy="120" r="55"/>
  </g>

  <!-- Repetition Indicator Waves (Representing "Again and Again" / Năm lần bảy lượt) -->
  <path d="M 60 75 C 90 55, 150 55, 180 75" fill="none" stroke="#3498DB" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 45 95 C 85 70, 155 70, 195 95" fill="none" stroke="#3498DB" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 30 115 C 80 85, 160 85, 210 115" fill="none" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Physical Object: A Classic Mechanical Document Clipboard & Checklist (representing the repeated reminder/inspection item) -->
  <!-- Clipboard Shadow -->
  <rect x="72" y="87" width="96" height="132" rx="12" fill="#0E1013" opacity="0.5"/>
  
  <!-- Clipboard Backboard -->
  <rect x="70" y="83" width="96" height="132" rx="12" fill="#2C3E50" stroke="#3E5265" stroke-width="2"/>

  <!-- Paper Sheet -->
  <rect x="82" y="103" width="72" height="102" rx="4" fill="#FFFFFF"/>

  <!-- Metal Clip at Top -->
  <path d="M 100 83 L 140 83 L 143 93 L 97 93 Z" fill="#7F8C8D"/>
  <rect x="106" y="87" width="28" height="8" rx="3" fill="#BDC3C7"/>
  <circle cx="120" cy="91" r="2.5" fill="#7F8C8D"/>

  <!-- Checklist Lines & Checkmarks (Illustrating multiple repeated checks: 三番五次) -->
  <!-- Item 1 -->
  <circle cx="95" cy="123" r="5" fill="#2ECC71"/>
  <path d="M 93 123 L 95 125 L 98 121" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="107" y="120" width="35" height="6" rx="3" fill="#BDC3C7"/>

  <!-- Item 2 -->
  <circle cx="95" cy="147" r="5" fill="#2ECC71"/>
  <path d="M 93 147 L 95 149 L 98 145" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="107" y="144" width="42" height="6" rx="3" fill="#BDC3C7"/>

  <!-- Item 3 -->
  <circle cx="95" cy="171" r="5" fill="#F39C12"/>
  <path d="M 93 171 L 95 173 L 98 169" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="107" y="168" width="28" height="6" rx="3" fill="#E5E7EB"/>

  <!-- Focal Accent Badge / Highlight (Emphasizing the core action) -->
  <circle cx="185" cy="65" r="22" fill="#F39C12" stroke="#1A1D24" stroke-width="4"/>
  <!-- Stylized Clock / Iteration Icon inside Badge -->
  <path d="M 185 53 V 65 H 193" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 175 69 A 12 12 0 1 1 195 69" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>