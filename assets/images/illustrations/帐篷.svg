<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Scenery (Contextual lake and grass reference) -->
  <path d="M0 160 Q60 150 120 155 Q180 160 240 150 L240 240 L0 240 Z" fill="#1E293B"/>
  <path d="M0 185 Q70 175 140 180 Q200 185 240 175 L240 240 L0 240 Z" fill="#0F172A"/>
  
  <!-- Lake/Water Reflection Accent -->
  <path d="M0 165 C60 158 120 162 240 158" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>

  <!-- Main Object: 帐篷 (Camping Tent) -->
  <g transform="translate(0, 5)">
    <!-- Tent Shadow/Base -->
    <ellipse cx="120" cy="163" rx="72" ry="12" fill="#0B0F17"/>

    <!-- Main Tent Body (Back Triangles / Dark Faces) -->
    <polygon points="120,60 175,155 120,155" fill="#334155"/>
    
    <!-- Main Tent Body (Front Face - Warm Orange/Gold Accent per rules) -->
    <polygon points="120,60 65,155 120,155" fill="#EA580C"/>

    <!-- Tent Entrance Flaps (Open door showing dark interior) -->
    <polygon points="120,95 90,155 120,155" fill="#C2410C"/>
    <polygon points="120,95 150,155 120,155" fill="#1E293B" opacity="0.6"/>

    <!-- Tent Pole Structure Line -->
    <line x1="120" y1="52" x2="120" y2="155" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Guy Lines & Pegs -->
    <line x1="120" y1="65" x2="45" y2="145" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="120" y1="65" x2="195" y2="145" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="45" cy="145" r="2.5" fill="#38BDF8"/>
    <circle cx="195" cy="145" r="2.5" fill="#38BDF8"/>

    <!-- Tent Accent Details (Awning / Zip seam) -->
    <path d="M120,60 L120,95" stroke="#F97316" stroke-width="2"/>
  </g>

  <!-- Ambient Nature Elements (Stars/Night outdoor camping feel) -->
  <circle cx="50" cy="50" r="1" fill="#F1F5F9" opacity="0.6"/>
  <circle cx="80" cy="35" r="1.5" fill="#F1F5F9" opacity="0.4"/>
  <circle cx="170" cy="45" r="1.2" fill="#F1F5F9" opacity="0.7"/>
  <circle cx="200" cy="70" r="1" fill="#F1F5F9" opacity="0.5"/>
</svg>