<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for "耗时" (Time-consuming / Production duration object) -->
  <!-- Represented as a physical, cinematic film production artifact spanning a long timeline scale -->
  
  <!-- Ambient glow / Shadow base -->
  <ellipse cx="120" cy="180" rx="75" ry="12" fill="#111318" opacity="0.8"/>

  <!-- Timeline Base Track representing the 3-year production period -->
  <rect x="50" y="155" width="140" height="6" rx="3" fill="#2A2F3D"/>
  
  <!-- Year Markers / Milestone nodes -->
  <circle cx="65" cy="158" r="4" fill="#3E4556"/>
  <circle cx="120" cy="158" r="4" fill="#3E4556"/>
  <circle cx="175" cy="158" r="6" fill="#F59E0B"/>

  <!-- Central Physical Object: Professional Film Clapperboard combined with an hourglass concept (representing elapsed production time) -->
  
  <!-- Clapperboard Body -->
  <rect x="75" y="80" width="90" height="65" rx="6" fill="#2E3648"/>
  <rect x="83" y="100" width="74" height="38" rx="3" fill="#1E232F"/>
  
  <!-- Clapperboard Top Strip (Angled open to show active work/duration) -->
  <g transform="rotate(-15 80 80)">
    <rect x="73" y="70" width="94" height="14" rx="3" fill="#F8FAFC"/>
    <!-- Diagonal stripes -->
    <path d="M 85 70 L 93 84 L 101 84 L 93 70 Z" fill="#1E232F"/>
    <path d="M 109 70 L 117 84 L 125 84 L 117 70 Z" fill="#1E232F"/>
    <path d="M 133 70 L 141 84 L 149 84 L 141 70 Z" fill="#1E232F"/>
  </g>

  <!-- Hinge pivot -->
  <circle cx="78" cy="77" r="3" fill="#F59E0B"/>

  <!-- Lens / Epic Film Reel subtle graphic embedded on the slate -->
  <circle cx="120" cy="119" r="14" fill="none" stroke="#3E4556" stroke-width="3"/>
  <circle cx="120" cy="119" r="4" fill="#F59E0B"/>
  <line x1="120" y1="102" x2="120" y2="108" stroke="#3E4556" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="130" x2="120" y2="136" stroke="#3E4556" stroke-width="2" stroke-linecap="round"/>
  <line x1="103" y1="119" x2="109" y2="119" stroke="#3E4556" stroke-width="2" stroke-linecap="round"/>
  <line x1="131" y1="119" x2="137" y2="119" stroke="#3E4556" stroke-width="2" stroke-linecap="round"/>

  <!-- Accents denoting intensive time passage (Clock hands subtle motif integrated above) -->
  <path d="M 120 50 L 120 62" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 56 L 126 56" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="56" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>

</svg>