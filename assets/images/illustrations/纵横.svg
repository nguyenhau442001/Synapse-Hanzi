<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Grid & Terrain Lines (representing the vast land) -->
  <g opacity="0.15" stroke="#60A5FA" stroke-width="1">
    <line x1="30" y1="60" x2="210" y2="60" stroke-dasharray="4 4"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke-dasharray="4 4"/>
    <line x1="30" y1="180" x2="210" y2="180" stroke-dasharray="4 4"/>
    <line x1="60" y1="30" x2="60" y2="210" stroke-dasharray="4 4"/>
    <line x1="120" y1="30" x2="120" y2="210" stroke-dasharray="4 4"/>
    <line x1="180" y1="30" x2="180" y2="210" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Physical Infrastructure Object: Intersecting elevated highways and rail networks (纵横交错) -->
  <g transform="translate(120, 120)">
    <!-- Base terrain shadow/glow -->
    <ellipse cx="0" cy="20" rx="80" ry="30" fill="#0F172A"/>

    <!-- Vertical Highway (Dòng - Vertical axis) -->
    <path d="M-20,-90 L-10,90 L10,90 L20,-90 Z" fill="#334155"/>
    <!-- Vertical Road Surface -->
    <path d="M-15,-90 L-7,90 L7,90 L15,-90 Z" fill="#475569"/>
    <!-- Vertical Center Dashes (Gold/Orange accent) -->
    <line x1="0" y1="-80" x2="0" y2="-60" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-40" x2="0" y2="-20" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="0" y2="60" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>

    <!-- Horizontal Bridge/Highway (Héng - Horizontal axis intersecting above) -->
    <path d="M-95,-20 L95,-10 L95,10 L-95,20 Z" fill="#1E293B"/>
    <!-- Horizontal Road Surface -->
    <path d="M-95,-15 L95,-5 L95,5 L-95,15 Z" fill="#64748B"/>
    <!-- Horizontal Lane Dividers (White & Orange) -->
    <line x1="-80" y1="-5" x2="-60" y2="-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-40" y1="-5" x2="-20" y2="-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="-5" x2="10" y2="-5" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-5" x2="40" y2="-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="-5" x2="80" y2="-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Interchange Overpass Curve (Highlighting the crossing structure) -->
    <path d="M-35,-45 C-15,-45 -5,-25 -5,-5 C-5,15 -25,25 -45,25" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M35,45 C15,45 5,25 5,5 C5,-15 25,-25 45,-25" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>

    <!-- Stylized Modern Vehicles representing connectivity (四通八达) -->
    <!-- Vertical moving vehicle -->
    <rect x="-4" y="-30" width="8" height="14" rx="3" fill="#F59E0B"/>
    <!-- Horizontal moving vehicle -->
    <rect x="30" y="-12" width="14" height="8" rx="3" fill="#38BDF8"/>
  </g>

  <!-- Ambient glowing nodes at corners to represent a vast connected network -->
  <circle cx="50" cy="50" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="190" cy="50" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="50" cy="190" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="190" cy="190" r="3" fill="#38BDF8" opacity="0.6"/>
</svg>