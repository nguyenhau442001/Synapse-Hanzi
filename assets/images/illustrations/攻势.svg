<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Soccer ball in motion -->
  <circle cx="120" cy="120" r="35" fill="#FFFFFF"/>
  <path d="M120 85 A35 35 0 0 1 155 120 L120 120 Z" fill="#2C3E50"/>
  <path d="M155 120 A35 35 0 0 1 120 155 L120 120 Z" fill="#2C3E50"/>
  <path d="M120 155 A35 35 0 0 1 85 120 L120 120 Z" fill="#2C3E50"/>
  <path d="M85 120 A35 35 0 0 1 120 85 L120 120 Z" fill="#2C3E50"/>
  
  <!-- Motion lines representing the "Gongshi" (Offensive/Attack) -->
  <g stroke="#FFB000" stroke-width="4" stroke-linecap="round">
    <line x1="70" y1="120" x2="30" y2="120"/>
    <line x1="60" y1="100" x2="20" y2="80"/>
    <line x1="60" y1="140" x2="20" y2="160"/>
  </g>
  
  <!-- Goal net structure in the background -->
  <path d="M180 80 L220 80 L220 160 L180 160" fill="none" stroke="#374151" stroke-width="3"/>
  <line x1="200" y1="80" x2="200" y2="160" stroke="#374151" stroke-width="2"/>
  <line x1="180" y1="100" x2="220" y2="100" stroke="#374151" stroke-width="2"/>
  <line x1="180" y1="120" x2="220" y2="120" stroke="#374151" stroke-width="2"/>
  <line x1="180" y1="140" x2="220" y2="140" stroke="#374151" stroke-width="2"/>
</svg>