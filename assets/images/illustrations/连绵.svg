<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Background Elements (Subtle stars/mist) -->
  <circle cx="40" cy="50" r="1" fill="#4A5568" opacity="0.6"/>
  <circle cx="200" cy="40" r="1.5" fill="#4A5568" opacity="0.8"/>
  <circle cx="210" cy="80" r="1" fill="#4A5568" opacity="0.5"/>
  <circle cx="30" cy="90" r="1.2" fill="#4A5568" opacity="0.7"/>

  <!-- Distant Mountain Range (Layer 1 - Darkest Slate Blue) -->
  <path d="M0 150 L35 115 L70 140 L110 100 L150 135 L190 105 L240 140 L240 200 L0 200 Z" fill="#242B38"/>

  <!-- Mid-distance Mountain Range (Layer 2 - Deep Teal/Green, Rolling/Trập trùng) -->
  <path d="M0 160 Q20 130 50 145 T100 120 T150 135 T190 115 T240 130 L240 210 L0 210 Z" fill="#2E4045"/>

  <!-- Foreground/Main Mountain Range (Layer 3 - Vibrant Emerald/Jade, Majestic & Continuous/连绵) -->
  <path d="M-10 180 
           Q30 110 65 145 
           Q95 90 130 130 
           Q165 85 205 125 
           Q230 100 250 120 
           L250 240 L-10 240 Z" fill="#2A7558"/>

  <!-- Mountain Peak Highlights / Ridges (Adding depth and geometric/flat vector contrast) -->
  <!-- Peak 1 -->
  <path d="M65 145 L65 145 L95 90 L130 130 Z" fill="#36966C" opacity="0.4"/>
  <!-- Peak 2 -->
  <path d="M130 130 L165 85 L205 125 Z" fill="#36966C" opacity="0.4"/>

  <!-- Golden Sunrise / Focal Point (Highlighting the majestic distance) -->
  <circle cx="195" cy="85" r="14" fill="#F6AD55"/>
  <path d="M185 85 L205 85 M195 75 L195 95 M188 78 L202 92 M188 92 L202 78" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Atmospheric mist layering (Giving the rolling infinite feel) -->
  <path d="M0 155 Q60 145 120 160 T240 150 L240 175 Q180 185 120 170 T0 185 Z" fill="#1A1D24" opacity="0.3"/>
  <path d="M0 170 Q70 160 140 175 T240 165 L240 190 Q170 200 100 185 T0 195 Z" fill="#1A1D24" opacity="0.4"/>

  <!-- Foreground Silhouette Platform (Observatory edge/Rail element for context of "looking out") -->
  <path d="M0 215 L90 205 L240 215 L240 240 L0 240 Z" fill="#15181E"/>
  <line x1="85" y1="205" x2="110" y2="240" stroke="#242B38" stroke-width="3"/>
  <line x1="10" y1="212" x2="230" y2="212" stroke="#F6AD55" stroke-width="2" opacity="0.8"/>
</svg>