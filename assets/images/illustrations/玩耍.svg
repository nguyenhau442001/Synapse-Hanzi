<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Motion lines for dynamic action -->
  <path d="M140 80 Q160 70 180 85" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="6 6"/>
  <path d="M60 100 Q80 90 100 105" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="6 6"/>

  <!-- Child 1: Jumping/Playing -->
  <g transform="translate(70, 120)">
    <circle cx="20" cy="20" r="12" fill="#FFD166"/>
    <path d="M20 32 L20 60 M20 40 L5 55 M20 40 L35 55 M20 60 L10 85 M20 60 L30 85" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Child 2: Running/Playing -->
  <g transform="translate(150, 130)">
    <circle cx="20" cy="20" r="12" fill="#4D96FF"/>
    <path d="M20 32 L20 60 M20 40 L35 30 M20 40 L5 30 M20 60 L10 85 M20 60 L30 85" stroke="#4D96FF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Ball in motion -->
  <circle cx="120" cy="100" r="10" fill="#FF6B6B"/>
  <path d="M110 100 Q120 90 130 100" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.3"/>
</svg>