<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stage Floor -->
  <path d="M20 200 L220 200 L200 230 L40 230 Z" fill="#2D343E"/>
  
  <!-- Curtains -->
  <path d="M20 20 L20 200 L80 200 L80 20 Z" fill="#FFB347"/>
  <path d="M160 20 L160 200 L220 200 L220 20 Z" fill="#FFB347"/>
  
  <!-- Motion lines for opening curtains -->
  <path d="M85 100 L105 100" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>
  <path d="M155 100 L135 100" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Spotlight beam -->
  <path d="M120 20 L80 200 L160 200 Z" fill="#FFFFFF" opacity="0.1"/>
  
  <!-- Character (Stage Performer) -->
  <g transform="translate(120, 140)">
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="15" ry="25" fill="#E0E0E0"/>
    <!-- Head -->
    <circle cx="0" cy="-10" rx="12" ry="12" fill="#E0E0E0"/>
    <!-- Arms (Dynamic gesture) -->
    <path d="M-10 15 L-30 -5" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    <path d="M10 15 L30 -5" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Musical notes (Symphony indicator) -->
  <path d="M60 60 C65 50, 70 50, 75 60" stroke="#FFD700" stroke-width="3" fill="none"/>
  <path d="M180 60 C185 50, 190 50, 195 60" stroke="#FFD700" stroke-width="3" fill="none"/>
</svg>