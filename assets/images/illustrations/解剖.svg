<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Table -->
  <rect x="40" y="170" width="160" height="10" rx="2" fill="#4A5568"/>
  <rect x="60" y="180" width="10" height="30" fill="#2D3748"/>
  <rect x="170" y="180" width="10" height="30" fill="#2D3748"/>
  
