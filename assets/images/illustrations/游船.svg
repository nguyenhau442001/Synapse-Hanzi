<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: Night sky & water -->
  <path d="M0 135C50 125 90 145 140 135C190 125 210 135 240 130V240H0V135Z" fill="#152238"/>
  <path d="M0 160C60 150 110 170 170 160C205 154 225 158 240 155V240H0V160Z" fill="#0D1726"/>

  <!-- Distant city skyline / lights for nighttime tourism context -->
  <rect x="25" y="95" width="12" height="40" fill="#222B3D"/>
  <rect x="42" y="80" width="16" height="55" fill="#283347"/>
  <rect x="63" y="105" width="10" height="30" fill="#222B3D"/>
  <rect x="180" y="88" width="14" height="47" fill="#283347"/>
  <rect x="199" y="100" width="18" height="35" fill="#222B3D"/>
  
  <!-- Glowing windows on skyline -->
  <rect x="46" y="88" width="3" height="4" fill="#F39C12" opacity="0.8"/>
  <rect x="51" y="88" width="3" height="4" fill="#F39C12" opacity="0.6"/>
  <rect x="46" y="98" width="3" height="4" fill="#F39C12" opacity="0.9"/>
  <rect x="51" y="98" width="3" height="4" fill="#F39C12" opacity="0.4"/>
  <rect x="183" y="96" width="3" height="4" fill="#F39C12" opacity="0.7"/>
  <rect x="189" y="106" width="3" height="4" fill="#F39C12" opacity="0.9"/>

  <!-- Water reflection highlights -->
  <ellipse cx="50" cy="150" rx="15" ry="1.5" fill="#3A506B" opacity="0.6"/>
  <ellipse cx="190" cy="150" rx="20" ry="1.5" fill="#3A506B" opacity="0.6"/>
  <ellipse cx="85" cy="175" rx="25" ry="2" fill="#1E324C" opacity="0.8"/>
  <ellipse cx="155" cy="185" rx="30" ry="2" fill="#1E324C" opacity="0.8"/>

  <!-- Tourist Boat (游船) -->
  <g transform="translate(30, 85)">
    <!-- Reflection of boat -->
    <path d="M15 65C65 67 115 67 165 65C170 69 160 74 150 74H30C20 74 10 69 15 65Z" fill="#1E324C" opacity="0.5"/>

    <!-- Hull bottom (dark accent) -->
    <path d="M10 45C10 45 25 58 40 60C80 65 100 65 140 60C155 58 170 45 170 45H10Z" fill="#2C3E50"/>
    
    <!-- Hull main body (sleek white/light grey) -->
    <path d="M15 28C15 28 22 43 35 45H145C158 43 165 28 165 28H15Z" fill="#ECF0F1"/>

    <!-- Water line accent strip -->
    <path d="M15 45H165V48H15Z" fill="#3498DB"/>

    <!-- Lower deck windows / interior warm lights -->
    <rect x="30" y="32" width="10" height="9" rx="2" fill="#F39C12"/>
    <rect x="45" y="32" width="10" height="9" rx="2" fill="#F39C12"/>
    <rect x="60" y="32" width="10" height="9" rx="2" fill="#F39C12"/>
    <rect x="75" y="32" width="10" height="9" rx="2" fill="#F39C12"/>
    <rect x="90" y="32" width="10" height="9" rx="2" fill="#F39C12"/>
    <rect x="105" y="32" width="10" height="9" rx="2" fill="#F39C12"/>
    <rect x="120" y="32" width="10" height="9" rx="2" fill="#F39C12"/>
    <rect x="135" y="32" width="10" height="9" rx="2" fill="#F39C12"/>

    <!-- Upper deck / Observation deck -->
    <path d="M45 15C45 15 50 26 60 28H120C130 26 135 15 135 15H45Z" fill="#BDC3C7"/>
    <rect x="55" y="18" width="12" height="8" rx="1.5" fill="#2C3E50"/>
    <rect x="72" y="18" width="12" height="8" rx="1.5" fill="#2C3E50"/>
    <rect x="89" y="18" width="12" height="8" rx="1.5" fill="#2C3E50"/>
    <rect x="106" y="18" width="12" height="8" rx="1.5" fill="#2C3E50"/>

    <!-- Roof / Top deck -->
    <path d="M48 15H132C135 15 138 12 135 10H45C42 12 45 15 48 15Z" fill="#E74C3C"/>

    <!-- Radar / Mast -->
    <line x1="90" y1="10" x2="90" y2="2" stroke="#7F8C8D" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="4" x2="95" y2="4" stroke="#7F8C8D" stroke-width="2" stroke-linecap="round"/>

    <!-- Passengers enjoying the view (Silhouettes) -->
    <circle cx="61" cy="9" r="3" fill="#2C3E50"/>
    <path d="M57 15C57 12 65 12 65 15Z" fill="#2C3E50"/>

    <circle cx="119" cy="9" r="3" fill="#2C3E50"/>
    <path d="M115 15C115 12 123 12 123 15Z" fill="#2C3E50"/>

    <!-- Elegant sweeping accent curve on hull -->
    <path d="M20 28C60 33 120 33 160 28" stroke="#E67E22" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Gentle ripples around boat -->
  <path d="M25 200C35 198 40 202 50 200" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M185 195C195 193 200 197 210 195" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M15 210C30 207 45 213 60 210" stroke="#4A90E2" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>