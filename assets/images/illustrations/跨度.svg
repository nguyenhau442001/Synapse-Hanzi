<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bridge Structure -->
  <g transform="translate(20, 100)">
    <!-- Main Span Deck -->
    <path d="M0 60 L200 60" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Pylons -->
    <rect x="20" y="20" width="10" height="60" fill="#7D8590" rx="2"/>
    <rect x="170" y="20" width="10" height="60" fill="#7D8590" rx="2"/>
    
    <!-- Suspension Cables (Catenary curve) -->
    <path d="M25 25 Q100 -10 175 25" stroke="#FFB84D" stroke-width="2" fill="none"/>
    
    <!-- Vertical Hangers -->
    <line x1="50" y1="28" x2="50" y2="60" stroke="#4A5568" stroke-width="1"/>
    <line x1="75" y1="35" x2="75" y2="60" stroke="#4A5568" stroke-width="1"/>
    <line x1="100" y1="38" x2="100" y2="60" stroke="#4A5568" stroke-width="1"/>
    <line x1="125" y1="35" x2="125" y2="60" stroke="#4A5568" stroke-width="1"/>
    <line x1="150" y1="28" x2="150" y2="60" stroke="#4A5568" stroke-width="1"/>
    
    <!-- Span Measurement Indicator -->
    <path d="M25 85 L175 85" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M25 80 L25 90" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M175 80 L175 90" stroke="#E2E8F0" stroke-width="2"/>
  </g>
</svg>