<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mannequin representing the "New Trend/Fashion" -->
  <g transform="translate(120, 120)">
    <!-- Stand -->
    <rect x="-40" y="80" width="80" height="8" rx="4" fill="#FFB800"/>
    <rect x="-5" y="40" width="10" height="40" fill="#FFB800"/>
    
    <!-- Mannequin Torso -->
    <path d="M-30 40 L30 40 L40 -20 L20 -50 L-20 -50 L-40 -20 Z" fill="#E0E0E0"/>
    
    <!-- Avant-garde Fashion Element (Asymmetric Cape/Collar) -->
    <path d="M-40 -20 L-55 -35 L-20 -50 L-10 -40 Z" fill="#FFB800"/>
    <path d="M30 40 L50 20 L40 -20 L20 -10 Z" fill="#FFB800"/>
    
    <!-- Stylized Head/Neck -->
    <circle cx="0" cy="-65" r="15" fill="#E0E0E0"/>
    
    <!-- Decorative Trend Detail -->
    <path d="M-15 -65 L15 -65 M0 -80 L0 -50" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>