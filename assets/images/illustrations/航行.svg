<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background waves and distant port/stars -->
  <g opacity="0.6">
    <circle cx="185" cy="85" r="2" fill="#64748B"/>
    <circle cx="205" cy="70" r="1.5" fill="#64748B"/>
    <circle cx="165" cy="65" r="1.5" fill="#64748B"/>
    <!-- Distant port/lighthouse -->
    <rect x="195" y="105" width="4" height="25" fill="#334155"/>
    <path d="M193 105L197 100L201 105Z" fill="#F59E0B"/>
    <path d="M197 102L225 115" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  </g>

  <!-- Deep ocean waves (Background layer) -->
  <path d="M0 160C30 150 60 170 90 160C120 150 150 170 180 160C210 150 225 160 240 155V210H0V160Z" fill="#1E293B"/>

  <!-- Dynamic choppy waves (Mid layer) -->
  <path d="M-10 175C20 165 45 185 75 175C105 165 135 185 165 175C195 165 220 180 250 175" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Large cargo ship (The physical object representing "航行") -->
  <g transform="translate(45, 95)">
    <!-- Hull water wake / splash -->
    <path d="M -15 55 C 5 50 15 58 35 55" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Ship Hull -->
    <path d="M0 45H110L95 65H15L0 45Z" fill="#EF4444"/>
    <path d="M15 65L95 65L90 72H20L15 65Z" fill="#B91C1C"/>
    <!-- Waterline stripe -->
    <path d="M5 52H105L100 56H10L5 52Z" fill="#F8FAFC"/>

    <!-- Containers on deck -->
    <rect x="25" y="25" width="20" height="20" fill="#3B82F6"/>
    <rect x="47" y="25" width="20" height="20" fill="#10B981"/>
    <rect x="69" y="30" width="18" height="15" fill="#F59E0B"/>
    
    <!-- Superstructure / Bridge -->
    <rect x="75" y="10" width="22" height="20" fill="#F8FAFC"/>
    <rect x="80" y="5" width="12" height="5" fill="#64748B"/>
    <line x1="92" y1="2" x2="92" y2="10" stroke="#94A3B8" stroke-width="2"/>

    <!-- Crane -->
    <line x1="20" y1="45" x2="20" y2="15" stroke="#64748B" stroke-width="3"/>
    <line x1="20" y1="15" x2="35" y2="22" stroke="#64748B" stroke-width="2"/>
  </g>

  <!-- Foreground crashing wave (Adding depth and motion) -->
  <path d="M0 190C40 180 70 205 110 190C150 175 190 200 240 185V240H0V190Z" fill="#0F172A"/>
  
  <!-- Dynamic wave foam accents -->
  <path d="M25 183C35 178 45 186 55 182" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M125 195C140-190 155 198 170 193" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M190 180C200 176 210 182 220 178" fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Navigation trajectory / directional motion arc -->
  <path d="M 60 120 Q 120 90 200 115" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.85"/>
</svg>