<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Circuit grid background elements -->
  <path d="M40 70 H90 V120" fill="none" stroke="#252A34" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 160 H160 V100" fill="none" stroke="#252A34" stroke-width="3" stroke-linecap="round"/>
  <circle cx="90" cy="120" r="4" fill="#252A34"/>
  <circle cx="160" cy="100" r="4" fill="#252A34"/>

  <!-- Industrial Control Panel Base -->
  <rect x="50" y="60" width="140" height="130" rx="16" fill="#222733" stroke="#2E3646" stroke-width="2"/>
  
  <!-- Status Indicator LED (Off / Manual Active) -->
  <circle cx="165" cy="85" r="5" fill="#FFB703"/>
  <circle cx="165" cy="85" r="8" fill="none" stroke="#FFB703" stroke-width="1.5" opacity="0.4"/>

  <!-- Toggle Switch (Manual / Hand-operated mechanism) -->
  <!-- Switch Housing -->
  <rect x="95" y="105" width="50" height="60" rx="8" fill="#151821" stroke="#2E3646" stroke-width="2"/>
  
  <!-- Switch Plate Detail -->
  <line x1="120" y1="115" x2="120" y2="155" stroke="#2E3646" stroke-width="2" stroke-linecap="round"/>

  <!-- Switch Lever (Tilted representing manual engagement) -->
  <g transform="rotate(-30, 120, 135)">
    <!-- Lever Base -->
    <circle cx="120" cy="135" r="10" fill="#3A4456"/>
    <!-- Lever Stick -->
    <rect x="116" y="90" width="8" height="45" rx="4" fill="#E2E8F0"/>
    <!-- Lever Knob -->
    <circle cx="120" cy="85" r="10" fill="#FFB703"/>
  </g>

  <!-- Mechanical Hand Interaction (Symbolizing "手动" / manual operation) -->
  <g transform="translate(15, 10)">
    <!-- Palm / Fingers gripping the switch knob -->
    <path d="M125 75 C125 68 135 65 142 70 L148 78 C153 84 150 95 140 98 L130 92 Z" fill="#F6BD60"/>
    <!-- Thumb -->
    <path d="M115 80 C110 82 108 90 115 95 C120 98 128 92 128 92 Z" fill="#F6BD60"/>
    <!-- Arm / Cuff extending out -->
    <path d="M142 97 L170 120 L185 110 L155 85 Z" fill="#3D5A80"/>
    <rect x="163" y="102" width="18" height="12" rx="3" transform="rotate(38, 163, 102)" fill="#98C1D9"/>
  </g>

</svg>