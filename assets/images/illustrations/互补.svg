<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Central Connecting Platform / Floor Shadow -->
    <ellipse cx="120" cy="180" rx="80" ry="16" fill="#14171D"/>

    <!-- Left Object: Theoretical Atom Model (representing Theory/Calculation) -->
    <g transform="translate(68, 120)">
      <!-- Base Stand -->
      <path d="M-20 40 L20 40 L12 55 L-12 55 Z" fill="#2E3542"/>
      <rect x="-4" y="20" width="8" height="20" fill="#4A5568"/>
      
      <!-- Core Sphere -->
      <circle cx="0" cy="0" r="18" fill="#FF8C42"/>
      
      <!-- Orbital Rings (Theory/Math symbols) -->
      <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#63B3ED" stroke-width="2.5" transform="rotate(-30)" stroke-dasharray="6 4"/>
      <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#63B3ED" stroke-width="2.5" transform="rotate(30)"/>
      <circle cx="-30" cy="15" r="4" fill="#63B3ED"/>
    </g>

    <!-- Right Object: Flask / Beaker (representing Experiment/Operation) -->
    <g transform="translate(172, 120)">
      <!-- Base Stand -->
      <path d="M-20 40 L20 40 L12 55 L-12 55 Z" fill="#2E3542"/>
      <rect x="-4" y="20" width="8" height="20" fill="#4A5568"/>
      
      <!-- Flask Body -->
      <path d="M-10 -25 L10 -25 L10 -5 L22 25 C25 32 20 38 12 38 L-12 38 C-20 38 -25 32 -22 25 L-10 -5 Z" fill="#2E3542" stroke="#CBD5E0" stroke-width="2.5" stroke-linejoin="round"/>
      
      <!-- Liquid inside flask -->
      <path d="M-19 21 C-15 15 -5 15 0 20 C5 25 15 25 19 21 L21 26 C23 31 18 36 12 36 L-12 36 C-18 36 -23 31 -21 26 Z" fill="#48BB78"/>
      
      <!-- Bubbles -->
      <circle cx="-3" cy="10" r="2.5" fill="#48BB78"/>
      <circle cx="5" cy="4" r="1.5" fill="#48BB78"/>
    </g>

    <!-- Interlocking / Complementary Puzzle Mechanism in the Center -->
    <g transform="translate(120, 110)">
      <!-- Glowing connection aura -->
      <circle cx="0" cy="0" r="32" fill="#FFB703" opacity="0.12"/>
      
      <!-- Left puzzle piece (receiver shape) -->
      <path d="M-22 -16 C-22 -24 -14 -24 -8 -24 C-4 -24 -4 -32 4 -32 C12 -32 12 -24 16 -24 C22 -24 22 -16 22 -8 C22 -4 30 -4 30 4 C30 12 22 12 22 16 C22 24 14 24 8 24 C4 24 4 32 -4 32 C-12 32 -12 24 -16 24 C-22 24 -22 16 -22 8 C-22 4 -30 4 -30 -4 C-30 -12 -22 -12 -22 -16 Z" 
            fill="none" stroke="#FFB703" stroke-width="4" stroke-dasharray="190" stroke-dashoffset="0" opacity="0.9"/>
      
      <!-- Central Spark / Synthesis Node -->
      <circle cx="0" cy="0" r="8" fill="#FFB703"/>
      <path d="M0 -14 L0 14 M-14 0 L14 0" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Dynamic Flow / Connection Arrows -->
    <path d="M 92 90 Q 120 70 148 90" fill="none" stroke="#FF8C42" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
    <path d="M 148 130 Q 120 150 92 130" fill="none" stroke="#48BB78" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>

  </g>
</svg>