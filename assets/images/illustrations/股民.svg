<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Market Grid Lines in Background -->
  <g opacity="0.15">
    <line x1="30" y1="60" x2="210" y2="60" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="30" y1="100" x2="210" y2="100" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="30" y1="140" x2="210" y2="140" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="30" y1="180" x2="210" y2="180" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Glowing Rising Trend Line (Stock Chart background element) -->
  <path d="M 35 160 Q 75 140 100 110 T 170 70 L 205 45" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Upward Trend Candlestick Bars (Background) -->
  <g opacity="0.3">
    <!-- Candle 1 -->
    <line x1="55" y1="150" x2="55" y2="120" stroke="#10B981" stroke-width="2"/>
    <rect x="51" y="130" width="8" height="15" fill="#10B981" rx="1"/>
    <!-- Candle 2 -->
    <line x1="90" y1="130" x2="90" y2="95" stroke="#10B981" stroke-width="2"/>
    <rect x="86" y="105" width="8" height="20" fill="#10B981" rx="1"/>
    <!-- Candle 3 -->
    <line x1="150" y1="100" x2="150" y2="65" stroke="#10B981" stroke-width="2"/>
    <rect x="146" y="75" width="8" height="18" fill="#10B981" rx="1"/>
    <!-- Candle 4 -->
    <line x1="185" y1="80" x2="185" y2="40" stroke="#10B981" stroke-width="2"/>
    <rect x="181" y="50" width="8" height="22" fill="#10B981" rx="1"/>
  </g>

  <!-- Central Character (Investor / 股民) -->
  <g>
    <!-- Torso / Suit jacket -->
    <path d="M 92 195 L 92 165 Q 92 155 102 155 L 138 155 Q 148 155 148 165 L 148 195 Z" fill="#3B82F6"/>
    <!-- Shirt inner / Tie V-neck -->
    <polygon points="120,155 110,175 130,175" fill="#F3F4F6"/>
    <!-- Tie -->
    <polygon points="118,172 122,172 124,195 120,202 116,195" fill="#F59E0B"/>
    
    <!-- Shoulders / Arms holding tablet -->
    <path d="M 75 210 L 92 165 L 148 165 L 165 210 Z" fill="#2563EB"/>
    
    <!-- Neck -->
    <rect x="113" y="142" width="14" height="18" fill="#F87171" rx="4"/>
    
    <!-- Head / Face -->
    <circle cx="120" cy="120" r="22" fill="#FCA5A5"/>
    
    <!-- Hair -->
    <path d="M 98 120 C 96 102 110 95 122 95 C 136 95 143 105 144 120 C 142 118 138 116 122 116 C 105 116 100 118 98 120 Z" fill="#1F2937"/>
    
    <!-- Glasses (Smart / Analytical look) -->
    <rect x="105" y="112" width="13" height="9" rx="2" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <rect x="122" y="112" width="13" height="9" rx="2" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <line x1="118" y1="116" x2="122" y2="116" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Calm, confident expression -->
    <path d="M 115 133 Q 120 137 125 133" fill="none" stroke="#7F1D1D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Financial Device / Tablet displaying Stock Data (Foreground Element) -->
  <g transform="translate(0, 5)">
    <!-- Tablet Frame -->
    <rect x="75" y="125" width="90" height="64" rx="8" fill="#111827" stroke="#374151" stroke-width="3"/>
    <!-- Screen -->
    <rect x="81" y="131" width="78" height="52" rx="4" fill="#0B0F19"/>
    
    <!-- Mini Stock Candlesticks inside screen -->
    <line x1="93" y1="165" x2="93" y2="145" stroke="#10B981" stroke-width="1.5"/>
    <rect x="90" y="152" width="6" height="10" fill="#10B981" rx="1"/>
    
    <line x1="111" y1="158" x2="111" y2="138" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="108" y="142" width="6" height="12" fill="#EF4444" rx="1"/>
    
    <line x1="129" y1="150" x2="129" y2="135" stroke="#10B981" stroke-width="1.5"/>
    <rect x="126" y="139" width="6" height="8" fill="#10B981" rx="1"/>
    
    <line x1="147" y1="145" x2="147" y2="122" stroke="#10B981" stroke-width="1.5"/>
    <rect x="144" y="127" width="6" height="14" fill="#10B981" rx="1"/>
    
    <!-- Trend Line on Screen -->
    <polyline points="93,160 111,150 129,143 147,130" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Golden Stock Certificate / Share Icon (Top Right) -->
  <g transform="translate(165, 35)">
    <rect x="0" y="0" width="36" height="46" rx="4" fill="#F59E0B"/>
    <rect x="4" y="4" width="28" height="38" rx="2" fill="#FEF3C7"/>
    <!-- Document lines -->
    <line x1="9" y1="11" x2="27" y2="11" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="18" x2="22" y2="18" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Mini upward graph on certificate -->
    <polyline points="10,33 16,27 22,30 28,23" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="23" r="2" fill="#10B981"/>
  </g>

  <!-- Glowing Accent Elements (Focus/Modern Touch) -->
  <circle cx="50" cy="50" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="195" cy="115" r="3" fill="#10B981" opacity="0.8"/>
  <circle cx="45" cy="125" r="2.5" fill="#3B82F6" opacity="0.8"/>
</svg>