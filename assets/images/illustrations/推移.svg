<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="hourglass-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sand-flow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow representing the passing of time / aging of years -->
  <circle cx="120" cy="120" r="80" fill="url(#glow)"/>

  <!-- Abstract subtle concentric time rings (not meters or dials, just aesthetic time ripples) -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <circle cx="120" cy="120" r="90" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 10" opacity="0.2"/>

  <!-- Central Physical Object: Hourglass representing "推移" (passage of time / shift) -->
  <g transform="translate(120, 120)">
    <!-- Top & Bottom Wooden/Metal Frames -->
    <!-- Top plate -->
    <path d="M-32 -68 L32 -68 L28 -60 L-28 -60 Z" fill="#64748B"/>
    <rect x="-35" y="-68" width="70" height="6" rx="3" fill="#94A3B8"/>
    
    <!-- Bottom plate -->
    <path d="M-32 60 L32 60 L28 68 L-28 68 Z" fill="#64748B"/>
    <rect x="-35" y="62" width="70" height="6" rx="3" fill="#94A3B8"/>

    <!-- Connecting Pillars/Struts -->
    <rect x="-32" y="-62" width="4" height="124" fill="#475569" rx="2"/>
    <rect x="28" y="-62" width="4" height="124" fill="#475569" rx="2"/>

    <!-- Glass bulb container -->
    <!-- Top bulb -->
    <path d="M-26 -56 C-26 -56 -26 -10 0 -2 C26 -10 26 -56 26 -56 Z" fill="url(#hourglass-glass)" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Bottom bulb -->
    <path d="M-26 56 C-26 56 -26 10 0 2 C26 10 26 56 26 56 Z" fill="url(#hourglass-glass)" stroke="#94A3B8" stroke-width="2"/>

    <!-- Sand Inside: Top bulb (decreasing) -->
    <path d="M-22 -48 C-10 -40 0 -20 0 -2 C-15 -10 -22 -30 -22 -48 Z" fill="#F59E0B" opacity="0.8"/>
    <path d="M22 -48 C10 -40 0 -20 0 -2 C15 -10 22 -30 22 -48 Z" fill="#D97706" opacity="0.9"/>
    <!-- Top flat sand surface -->
    <ellipse cx="0" cy="-45" rx="22" ry="4" fill="#FBBF24"/>

    <!-- Falling stream of sand (the active shift/transition) -->
    <line x1="0" y1="-2" x2="0" y2="15" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sand Inside: Bottom bulb (accumulating mound, representing "沉淀" / accumulation over time) -->
    <path d="M-24 50 C-10 50 -5 35 0 20 C5 35 10 50 24 50 Z" fill="url(#sand-flow)"/>
    <!-- Mound highlight -->
    <ellipse cx="0" cy="46" rx="20" ry="5" fill="#FBBF24"/>
  </g>

  <!-- Floating minimalist particle accents representing drifting moments/years -->
  <g fill="#F59E0B" opacity="0.6">
    <circle cx="70" cy="80" r="2"/>
    <circle cx="175" cy="95" r="1.5"/>
    <circle cx="85" cy="165" r="2.5"/>
    <circle cx="160" cy="150" r="1.5"/>
  </g>
</svg>