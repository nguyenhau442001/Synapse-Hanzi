<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 糟粕 (cặn bã, hủ tục, rác rưởi tư tưởng) -->
  <!-- Visualizing obsolete, decayed traditional elements (like broken ancient scrolls, dust, and sludge) being discarded -->

  <g transform="translate(120, 120)">
    <!-- Sludge / Residue base (Bottom sediment) -->
    <path d="M-60 50 C-40 65 40 65 60 50 C70 42 50 30 30 35 C10 40 -10 30 -30 35 C-50 40 -70 42 -60 50 Z" fill="#2D333B" opacity="0.8"/>
    <path d="M-45 62 C-20 72 20 72 45 62 C55 58 40 50 20 52 C0 54 -20 50 -40 52 C-50 54 -55 58 -45 62 Z" fill="#22272E" opacity="0.9"/>

    <!-- Decayed Ancient Scroll / Fragment 1 (Left tilted) -->
    <g transform="translate(-35, -15) rotate(-25)">
      <rect x="-35" y="-25" width="70" height="50" rx="4" fill="#8C6D53"/>
      <rect x="-32" y="-22" width="64" height="44" rx="2" fill="#D4B483"/>
      <!-- Damaged/torn edges and decayed lines -->
      <path d="M-32 -22 L-20 -22 L-25 0 L-32 15 Z" fill="#A8835D" opacity="0.6"/>
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#5A4033" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="-15" y1="0" x2="10" y2="0" stroke="#5A4033" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="-15" y1="10" x2="5" y2="10" stroke="#5A4033" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <!-- Rot/mold spots -->
      <circle cx="20" cy="15" r="4" fill="#3D444E"/>
      <circle cx="-5" cy="-12" r="3" fill="#3D444E"/>
    </g>

    <!-- Decayed Ancient Scroll / Fragment 2 (Right tilted, broken) -->
    <g transform="translate(30, -5) rotate(35)">
      <rect x="-30" y="-20" width="60" height="40" rx="3" fill="#8C6D53"/>
      <rect x="-27" y="-17" width="54" height="34" rx="1" fill="#D4B483"/>
      <!-- Tear marks -->
      <path d="M15 -17 L27 -17 L20 5 L27 17 Z" fill="#A8835D" opacity="0.6"/>
      <line x1="-15" y1="-7" x2="5" y2="-7" stroke="#5A4033" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="-15" y1="3" x2="-2" y2="3" stroke="#5A4033" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <!-- Rot/mold spots -->
      <circle cx="-12" cy="-8" r="5" fill="#3D444E"/>
    </g>

    <!-- Central crumbling dust/particles (Focus Accent: Amber/Gold/Orange for discarding the bad) -->
    <circle cx="-10" cy="-35" r="4" fill="#E67E22" opacity="0.9"/>
    <circle cx="15" cy="-45" r="3" fill="#E67E22" opacity="0.8"/>
    <circle cx="5" cy="-25" r="5" fill="#D35400" opacity="0.9"/>
    <circle cx="-35" cy="-55" r="2.5" fill="#E67E22" opacity="0.7"/>
    <circle cx="35" cy="-35" r="3.5" fill="#D35400" opacity="0.8"/>
    
    <!-- Floating debris dust motes -->
    <circle cx="-55" cy="-10" r="1.5" fill="#A0AAB2" opacity="0.5"/>
    <circle cx="55" cy="15" r="2" fill="#A0AAB2" opacity="0.6"/>
    <circle cx="-20" cy="25" r="1.5" fill="#A0AAB2" opacity="0.4"/>
    <circle cx="25" cy="30" r="2" fill="#A0AAB2" opacity="0.5"/>

    <!-- Subtle downward discard motion arrows (modern flat minimalist indicators) -->
    <path d="M-4 -65 L0 -55 L4 -65" fill="none" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -70 L0 -55" fill="none" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M31 -50 L35 -40 L39 -50" fill="none" stroke="#D35400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 -55 L35 -40" fill="none" stroke="#D35400" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>