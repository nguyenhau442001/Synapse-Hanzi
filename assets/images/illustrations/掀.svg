<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background elements: wind streaks and stormy atmosphere -->
  <g opacity="0.3" stroke="#56708F" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="50" x2="80" y2="50" />
    <line x1="160" y1="40" x2="220" y2="40" />
    <line x1="10" y1="90" x2="60" y2="90" />
    <line x1="180" y1="100" x2="230" y2="100" />
    <line x1="30" y1="140" x2="70" y2="140" />
  </g>

  <!-- Wind gusts / motion vectors -->
  <path d="M10,70 Q40,65 70,75 T130,70" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M120,45 Q150,40 180,50 T230,45" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M5,115 Q35,110 65,120 T110,115" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Building structure (Warehouse body) -->
  <rect x="60" y="130" width="120" height="65" rx="4" fill="#2A323D" stroke="#3B4758" stroke-width="3"/>
  
  <!-- Warehouse door and details -->
  <rect x="100" y="155" width="40" height="40" rx="2" fill="#1E232B"/>
  <circle cx="132" cy="175" r="2" fill="#56708F"/>
  <line x1="60" y1="160" x2="180" y2="160" stroke="#3B4758" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Ground line -->
  <line x1="30" y1="195" x2="210" y2="195" stroke="#3B4758" stroke-width="3" stroke-linecap="round"/>

  <!-- The flipped roof (Visualizing '掀' / lật tung, vén lên) -->
  <g transform="translate(120, 115) rotate(-32) translate(-120, -115)">
    <!-- Roof underside shadow -->
    <path d="M45,105 L195,105 L205,112 L35,112 Z" fill="#151921"/>
    <!-- Corrugated iron roof top -->
    <path d="M40,100 L200,100 L205,110 L35,110 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <!-- Roof ridges / corrugated texture -->
    <line x1="65" y1="100" x2="65" y2="110" stroke="#D97706" stroke-width="1.5"/>
    <line x1="90" y1="100" x2="90" y2="110" stroke="#D97706" stroke-width="1.5"/>
    <line x1="115" y1="100" x2="115" y2="110" stroke="#D97706" stroke-width="1.5"/>
    <line x1="140" y1="100" x2="140" y2="110" stroke="#D97706" stroke-width="1.5"/>
    <line x1="165" y1="100" x2="165" y2="110" stroke="#D97706" stroke-width="1.5"/>
    <line x1="190" y1="100" x2="190" y2="110" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <!-- Original roof anchor point (dashed outline showing where it was ripped from) -->
  <path d="M45,97 L195,97" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- Dynamic uplifting force lines/sparks at the hinge point -->
  <path d="M40,95 Q48,80 60,85" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="43" cy="93" r="2" fill="#F59E0B"/>
  <circle cx="55" cy="83" r="1.5" fill="#38BDF8"/>
</svg>