<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Central Globe representing the shared world/community -->
    <circle cx="0" cy="0" r="48" fill="#242B38" stroke="#3A465B" stroke-width="2"/>
    
    <!-- Continents/Global Connection Lines -->
    <path d="M-30,-15 C-15,-25 15,-25 30,-15 C20,15 -20,15 -30,-15 Z" fill="#2D3748" opacity="0.6"/>
    <path d="M-20,20 C-5,10 15,25 25,10 C15,-5 -15,0 -20,20 Z" fill="#2D3748" opacity="0.6"/>
    
    <circle cx="0" cy="0" r="48" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>

    <!-- Orbiting connection nodes representing unity/community -->
    <g>
      <!-- Top Left Figure/Node -->
      <g transform="translate(-65, -55)">
        <circle cx="0" cy="0" r="14" fill="#F59E0B" opacity="0.2"/>
        <circle cx="0" cy="0" r="10" fill="#F59E0B"/>
        <circle cx="0" cy="-3" r="3.5" fill="#1A1D24"/>
        <path d="M-6,7 C-6,3 6,3 6,7" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      
      <!-- Top Right Figure/Node -->
      <g transform="translate(65, -55)">
        <circle cx="0" cy="0" r="14" fill="#38BDF8" opacity="0.2"/>
        <circle cx="0" cy="0" r="10" fill="#38BDF8"/>
        <circle cx="0" cy="-3" r="3.5" fill="#1A1D24"/>
        <path d="M-6,7 C-6,3 6,3 6,7" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      
      <!-- Bottom Left Figure/Node -->
      <g transform="translate(-65, 55)">
        <circle cx="0" cy="0" r="14" fill="#34D399" opacity="0.2"/>
        <circle cx="0" cy="0" r="10" fill="#34D399"/>
        <circle cx="0" cy="-3" r="3.5" fill="#1A1D24"/>
        <path d="M-6,7 C-6,3 6,3 6,7" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      
      <!-- Bottom Right Figure/Node -->
      <g transform="translate(65, 55)">
        <circle cx="0" cy="0" r="14" fill="#EC4899" opacity="0.2"/>
        <circle cx="0" cy="0" r="10" fill="#EC4899"/>
        <circle cx="0" cy="-3" r="3.5" fill="#1A1D24"/>
        <path d="M-6,7 C-6,3 6,3 6,7" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Connecting links to the center -->
      <line x1="-55" y1="-47" x2="-35" y2="-30" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="55" y1="-47" x2="35" y2="-30" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="-55" y1="47" x2="-35" y2="30" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="55" y1="47" x2="35" y2="30" stroke="#EC4899" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Outer solidarity ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#3A465B" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
  </g>
</svg>