<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Motion lines representing sudden dynamic force / breaking apart -->
    <path d="M-75 -50 L-95 -65" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M75 -30 L95 -40" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M-80 30 L-100 45" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M70 50 L95 65" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Left hand character/element pulling away -->
    <g transform="translate(-20, 0)">
      <!-- Motion lines for pulling left -->
      <path d="M-30 -15 L-55 -15" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
      <path d="M-25 15 L-50 20" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
      
      <!-- Left person / hand structure breaking away -->
      <path d="M-20 -40 C-20 -55 -40 -60 -50 -45 C-60 -30 -55 -10 -55 0 C-55 10 -60 30 -50 45 C-40 60 -20 55 -20 40 Z" fill="#3B82F6" opacity="0.9"/>
      <!-- Arm/Hand reaching right -->
      <path d="M-20 -10 L0 -5 L-20 10 Z" fill="#3B82F6"/>
    </g>

    <!-- Right hand character/element pulling away -->
    <g transform="translate(20, 0)">
      <!-- Motion lines for pulling right -->
      <path d="M30 -15 L55 -15" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
      <path d="M25 15 L50 20" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
      
      <!-- Right person / hand structure breaking away -->
      <path d="M20 -40 C20 -55 40 -60 50 -45 C60 -30 55 -10 55 0 C55 10 60 30 50 45 C40 60 20 55 20 40 Z" fill="#60A5FA" opacity="0.9"/>
      <!-- Arm/Hand reaching left -->
      <path d="M20 -10 L0 -5 L20 10 Z" fill="#60A5FA"/>
    </g>

    <!-- Central fractured bond / shattering core -->
    <g>
      <!-- Jagged lightning-like crack down the center -->
      <path d="M-6 -70 L4 -30 L-8 -10 L6 20 L-4 50 L8 75" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Shattered fragments floating outward -->
      <path d="M-12 -25 L-25 -35 L-18 -15 Z" fill="#F59E0B" opacity="0.85"/>
      <path d="M14 10 L30 0 L22 25 Z" fill="#EF4444" opacity="0.85"/>
      <path d="M-10 35 L-25 50 L-5 45 Z" fill="#EF4444" opacity="0.85"/>
      <path d="M8 -45 L22 -55 L15 -35 Z" fill="#F59E0B" opacity="0.85"/>

      <!-- Spark particles -->
      <circle cx="-35" cy="-5" r="3" fill="#F59E0B"/>
      <circle cx="38" cy="15" r="2.5" fill="#F59E0B"/>
      <circle cx="-5" cy="-55" r="2" fill="#EF4444"/>
      <circle cx="5" cy="55" r="3" fill="#EF4444"/>
    </g>
  </g>
</svg>