<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Scale / Comparison Balance (Representing 相提并论 - placing on equal footing/comparing) -->
  <g transform="translate(120, 115)">
    <!-- Base / Stand -->
    <path d="M-12 75 L12 75 L16 85 L-16 85 Z" fill="#64748B"/>
    <rect x="-4" y="35" width="8" height="40" fill="#94A3B8"/>
    <circle cx="0" cy="35" r="8" fill="#F59E0B"/>

    <!-- Central Pivot / Beam -->
    <path d="M-80 35 L80 35 L70 25 L-70 25 Z" fill="#CBD5E1"/>
    
    <!-- Left Pan Strings & Object (Representing Subject A) -->
    <line x1="-70" y1="30" x2="-70" y2="85" stroke="#64748B" stroke-width="2"/>
    <line x1="-70" y1="30" x2="-95" y2="85" stroke="#64748B" stroke-width="2"/>
    <line x1="-70" y1="30" x2="-45" y2="85" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="-70" cy="85" rx="25" ry="8" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
    <!-- Left Object: Crown / Master Trophy -->
    <path d="M-82 75 L-78 55 L-74 68 L-70 52 L-66 68 L-62 55 L-58 75 Z" fill="#F59E0B"/>
    <rect x="-84" y="75" width="28" height="5" rx="2" fill="#D97706"/>

    <!-- Right Pan Strings & Object (Representing Subject B - Equal Comparison) -->
    <line x1="70" y1="30" x2="70" y2="85" stroke="#64748B" stroke-width="2"/>
    <line x1="70" y1="30" x2="45" y2="85" stroke="#64748B" stroke-width="2"/>
    <line x1="70" y1="30" x2="95" y2="85" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="70" cy="85" rx="25" ry="8" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
    <!-- Right Object: Matching Trophy -->
    <path d="M58 75 L62 55 L66 68 L70 52 L74 68 L78 55 L82 75 Z" fill="#38BDF8"/>
    <rect x="56" y="75" width="28" height="5" rx="2" fill="#0284C7"/>

    <!-- Balance beam tilt (Level/Balanced to show direct comparison) -->
    <path d="M-75 27 L75 23" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Accent Comparison Rings / Equal Sign Concept -->
  <g transform="translate(120, 52)">
    <rect x="-16" y="-4" width="32" height="4" rx="2" fill="#F59E0B" opacity="0.9"/>
    <rect x="-16" y="4" width="32" height="4" rx="2" fill="#F59E0B" opacity="0.9"/>
  </g>
</svg>