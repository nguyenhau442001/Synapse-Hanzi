<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground line -->
  <path d="M40 180 L200 180" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Character: A person stumbling forward -->
  <g transform="translate(100, 150)">
    <!-- Body/Torso -->
    <path d="M0 -20 L-5 20" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="10" fill="#E2E8F0"/>
    <!-- Arms -->
    <path d="M-5 -10 L-20 5" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
    <path d="M5 -10 L20 5" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs: Stumbling posture -->
    <path d="M-5 20 L-15 40" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M5 20 L15 10" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Obstacle: A small block causing the stumble -->
  <rect x="115" y="170" width="15" height="10" rx="2" fill="#F6AD55"/>
  
  <!-- Motion lines indicating sudden stop/stumble -->
  <path d="M130 140 L150 130" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <path d="M135 150 L155 145" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Impact effect -->
  <circle cx="120" cy="175" r="3" fill="#F6AD55"/>
</svg>