<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Oven Body -->
  <rect x="52" y="56" width="136" height="136" rx="16" fill="#2D333B" stroke="#3A424C" stroke-width="3"/>
  
  <!-- Oven Control Panel / Top strip -->
  <rect x="52" y="56" width="136" height="32" rx="16" fill="#22272E"/>
  <rect x="52" y="72" width="136" height="16" fill="#22272E"/>
  <!-- Knobs & Buttons -->
  <circle cx="76" cy="72" r="6" fill="#FF9F43"/>
  <circle cx="98" cy="72" r="6" fill="#3A424C"/>
  <rect x="156" y="68" width="16" height="8" rx="4" fill="#FF6B6B"/>

  <!-- Oven Window (Glass) -->
  <rect x="68" y="100" width="104" height="76" rx="8" fill="#14171C" stroke="#3A424C" stroke-width="2"/>
  
  <!-- Warm Oven Interior Glow -->
  <rect x="72" y="104" width="96" height="68" rx="6" fill="#E67E22" opacity="0.2"/>
  
  <!-- Heating Elements -->
  <line x1="84" y1="112" x2="156" y2="112" stroke="#E67E22" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="84" y1="160" x2="156" y2="160" stroke="#E67E22" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Tray -->
  <rect x="80" y="132" width="80" height="6" rx="3" fill="#48525D"/>

  <!-- Freshly Baked Bread / Pastry inside oven -->
  <path d="M 96 132 C 96 118 108 116 120 120 C 132 116 144 118 144 132 Z" fill="#D35400"/>
  <path d="M 102 132 C 102 122 112 120 120 123 C 128 120 138 122 138 132 Z" fill="#E67E22"/>
  <!-- Bread scoring marks -->
  <line x1="112" y1="123" x2="116" y2="129" stroke="#B94700" stroke-width="2" stroke-linecap="round"/>
  <line x1="124" y1="123" x2="128" y2="129" stroke="#B94700" stroke-width="2" stroke-linecap="round"/>

  <!-- Steam / Aroma Waving Lines rising from top of oven / conceptual baking -->
  <path d="M 105 44 C 100 38 110 32 105 26" fill="none" stroke="#FFD32A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 135 44 C 130 38 140 32 135 26" fill="none" stroke="#FFD32A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>