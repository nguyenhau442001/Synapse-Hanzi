<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Lake surface -->
  <path d="M0 180 C 80 160, 160 200, 240 180 L 240 240 L 0 240 Z" fill="#2C3E50"/>
  
  <!-- Willow tree silhouette -->
  <path d="M180 60 C 180 40, 170 30, 160 30 C 150 30, 140 40, 140 60 L 140 180 M140 80 C 130 70, 120 80, 120 100 C 120 120, 130 130, 140 120" stroke="#4A5568" stroke-width="4" fill="none"/>
  
  <!-- Elderly person sitting on a bench -->
  <g transform="translate(60, 130)">
    <!-- Bench -->
    <rect x="0" y="40" width="80" height="10" rx="2" fill="#D69E2E"/>
    <rect x="10" y="50" width="5" height="20" fill="#D69E2E"/>
    <rect x="65" y="50" width="5" height="20" fill="#D69E2E"/>
    
    <!-- Person -->
    <circle cx="40" cy="15" r="12" fill="#FBD38D"/>
    <path d="M30 30 C 30 20, 50 20, 50 30 L 45 45 L 35 45 Z" fill="#FBD38D"/>
    <path d="M35 45 L 30 70 M45 45 L 50 70" stroke="#FBD38D" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 45 L 20 55 M45 45 L 60 55" stroke="#FBD38D" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Chess board on small table -->
  <g transform="translate(150, 140)">
    <rect x="0" y="0" width="30" height="30" rx="2" fill="#D69E2E"/>
    <rect x="5" y="5" width="20" height="20" fill="#1A1D24"/>
    <circle cx="10" cy="10" r="3" fill="#FBD38D"/>
    <circle cx="20" cy="20" r="3" fill="#FBD38D"/>
  </g>
  
  <!-- Decorative ripples -->
  <path d="M20 200 Q 40 195 60 200" stroke="#34495E" stroke-width="2" fill="none"/>
  <path d="M80 210 Q 110 205 140 210" stroke="#34495E" stroke-width="2" fill="none"/>
</svg>