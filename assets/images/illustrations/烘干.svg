<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Washing machine body -->
  <rect x="70" y="55" width="100" height="135" rx="14" fill="#2A2F3D"/>
  <rect x="80" y="70" width="80" height="15" rx="4" fill="#1A1D24"/>
  <!-- Control panel accents -->
  <circle cx="95" cy="77" r="3" fill="#FF8C42"/>
  <rect x="110" y="75" width="30" height="4" rx="2" fill="#3E4758"/>

  <!-- Washing machine door (Outer ring) -->
  <circle cx="120" cy="135" r="42" fill="#1A1D24"/>
  <!-- Door inner glass -->
  <circle cx="120" cy="135" r="34" fill="#242936"/>

  <!-- Hanging clothing inside (t-shirt) -->
  <path d="M102 118 L112 113 L120 118 L128 113 L138 118 L142 135 L132 138 L132 152 L108 152 L108 138 L98 135 Z" fill="#4B6584"/>

  <!-- Drying hot air / heat wave elements (Orange/Gold accent) -->
  <path d="M104 140 Q112 132 120 140 T136 140" fill="none" stroke="#FF8C42" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 128 Q114 122 120 128 T132 128" fill="none" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rising steam / drying air currents escaping from top or front -->
  <path d="M90 40 C90 32, 98 32, 98 24" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 42 C120 34, 128 34, 128 26" fill="none" stroke="#FF8C42" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M150 40 C150 32, 142 32, 142 24" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>