<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glows / subtle styling -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Physical Object: Stack of gold coins and treasure chest / valuables representing 钱财 (money and wealth) -->
  <g transform="translate(0, 5)">
    <!-- Base shadow for the pile -->
    <ellipse cx="120" cy="180" rx="55" ry="14" fill="#111317"/>

    <!-- Bottom Layer Coins -->
    <g fill="#D4AF37">
      <ellipse cx="90" cy="165" rx="30" ry="10"/>
      <ellipse cx="150" cy="165" rx="30" ry="10"/>
    </g>
    <g fill="#AA820A">
      <path d="M60 165 v8 c0 5.5 13.4 10 30 10 s30-4.5 30-10 v-8 c0 5.5-13.4 10-30 10 s-30-4.5-30-10 z"/>
      <path d="M120 165 v8 c0 5.5 13.4 10 30 10 s30-4.5 30-10 v-8 c0 5.5-13.4 10-30 10 s-30-4.5-30-10 z"/>
    </g>

    <!-- Middle Layer Coins / Wealth -->
    <g fill="#F3C623">
      <ellipse cx="120" cy="140" rx="45" ry="13"/>
    </g>
    <g fill="#C29B0E">
      <path d="M75 140 v10 c0 7 20 13 45 13 s45-6 45-13 v-10 c0 7-20 13-45 13 s-45-6-45-13 z"/>
    </g>
    <!-- Square holes in coins for traditional/universal wealth aesthetic -->
    <rect x="115" y="136" width="10" height="8" fill="#1A1D24" rx="1"/>

    <!-- Top Stack / Main Gold Ingots (Yuanbao) and Coins -->
    <!-- Large Central Gold Ingot (Yuanbao) -->
    <g transform="translate(120, 105)">
      <!-- Ingot shadow -->
      <ellipse cx="0" cy="22" rx="36" ry="10" fill="#AA820A"/>
      <!-- Ingot Body -->
      <path d="M-32 10 C-32 18 -20 22 0 22 C20 22 32 18 32 10 C35 4 32 -6 24 -12 C18 -16 6 -14 0 -8 C-6 -14 -18 -16 -24 -12 C-32 -6 -35 4 -32 10 Z" fill="#FCE353"/>
      <!-- Ingot Highlights -->
      <path d="M-22 -8 C-14 -12 -4 -10 0 -5 C-10 -7 -18 -5 -22 -8 Z" fill="#FFF288"/>
      <path d="M22 -8 C14 -12 4 -10 0 -5 C10 -7 18 -5 22 -8 Z" fill="#FFF288"/>
      <path d="M-28 6 C-15 12 15 12 28 6 C31 2 28 -4 22 -8 C15 -12 -15 -12 -22 -8 C-28 -4 -31 2 -28 6 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
    </g>

    <!-- Accompanying smaller flying/glinting gold coins -->
    <g fill="#FCE353">
      <!-- Coin left -->
      <ellipse cx="65" cy="115" rx="12" ry="5"/>
      <rect x="62" y="113" width="6" height="4" fill="#1A1D24" rx="0.5"/>
      
      <!-- Coin right -->
      <ellipse cx="175" cy="115" rx="12" ry="5"/>
      <rect x="172" y="113" width="6" height="4" fill="#1A1D24" rx="0.5"/>
    </g>
    <g fill="#C29B0E">
      <path d="M53 115 v3 c0 3 5.4 5 12 5 s12-2 12-5 v-3 c0 3-5.4 5-12 5 s-12-2-12-5 z"/>
      <path d="M163 115 v3 c0 3 5.4 5 12 5 s12-2 12-5 v-3 c0 3-5.4 5-12 5 s-12-2-12-5 z"/>
    </g>

    <!-- Sparkles / Glints representing wealth/value -->
    <path d="M120 60 L122.5 70 L132.5 72.5 L122.5 75 L120 85 L117.5 75 L107.5 72.5 L117.5 70 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M75 80 L76.5 85 L81.5 86.5 L76.5 88 L75 93 L73.5 88 L68.5 86.5 L73.5 85 Z" fill="#FCE353" opacity="0.8"/>
    <path d="M165 75 L166.2 79 L170.2 80.2 L166.2 81.4 L165 85.4 L163.8 81.4 L159.8 80.2 L163.8 79 Z" fill="#FCE353" opacity="0.8"/>
  </g>
</svg>