<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "一揽子" (all-inclusive / package / bundle) -->
  <g transform="translate(0, 0)">
    <!-- Outer glow / bundle aura -->
    <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

    <!-- The "Lǎn" (Basket / Container) representing holding everything together -->
    <!-- Basket base/body -->
    <path d="M 75 110 L 90 165 C 92 170, 96 173, 102 173 L 138 173 C 144 173, 148 170, 150 165 L 165 110 Z" fill="#2D3748" stroke="#E2E8F0" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Basket weave texture lines -->
    <line x1="85" y1="125" x2="155" y2="125" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="88" y1="140" x2="152" y2="140" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="91" y1="155" x2="149" y2="155" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>

    <!-- Basket rim -->
    <path d="M 68 102 C 68 98, 72 95, 78 95 L 162 95 C 168 95, 172 98, 172 102 C 172 106, 168 109, 162 109 L 78 109 C 72 109, 68 106, 68 102 Z" fill="#4A5568" stroke="#E2E8F0" stroke-width="3"/>

    <!-- Basket handle (Large overhead arch) -->
    <path d="M 85 95 C 85 45, 155 45, 155 95" fill="none" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
    <path d="M 85 95 C 85 45, 155 45, 155 95" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Comprehensive "Package" elements inside the basket (representing the "all-inclusive" policy/plan) -->
    <!-- Element 1: Document/Plan (representing economic policy) -->
    <rect x="95" y="75" width="22" height="30" rx="3" fill="#3182CE" transform="rotate(-15 106 90)"/>
    <line x1="100" y1="83" x2="111" y2="83" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" transform="rotate(-15 106 90)"/>
    <line x1="100" y1="90" x2="108" y2="90" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" transform="rotate(-15 106 90)"/>

    <!-- Element 2: Gear/Industry (representing development/employment) -->
    <circle cx="145" cy="80" r="12" fill="#D69E2E"/>
    <circle cx="145" cy="80" r="5" fill="#2D3748"/>
    <rect x="143" y="65" width="4" height="3" fill="#D69E2E"/>
    <rect x="143" y="92" width="4" height="3" fill="#D69E2E"/>
    <rect x="130" y="78" width="3" height="4" fill="#D69E2E"/>
    <rect x="157" y="78" width="3" height="4" fill="#D69E2E"/>

    <!-- Element 3: Coin/Finance (representing investment/stimulus) -->
    <circle cx="120" cy="95" r="10" fill="#ECC94B" stroke="#B7791F" stroke-width="2"/>
    <text x="120" y="99" font-family="sans-serif" font-size="12" font-weight="bold" fill="#744210" text-anchor="middle">¥</text>

    <!-- Unified wrapping accent (Gold/Orange focus ribbon wrapping the contents together) -->
    <path d="M 72 115 Q 120 135 168 115" fill="none" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="125" r="6" fill="#ED8936"/>
  </g>
</svg>