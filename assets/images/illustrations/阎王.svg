<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Crown (Official Headgear) -->
    <path d="M-50 -40 L50 -40 L40 -70 L20 -55 L0 -80 L-20 -55 L-40 -70 Z" fill="#FFB800"/>
    <rect x="-55" y="-40" width="110" height="15" fill="#D49A00"/>
    
    <!-- Face -->
    <path d="M-45 -25 C-45 10, -20 35, 0 35 C20 35, 45 10, 45 -25 Z" fill="#E0E0E0"/>
    
    <!-- Facial Features -->
    <path d="M-25 -10 L-10 -5 M-25 -5 L-10 -10" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 -10 L25 -5 M10 -5 L25 -10" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-20 15 Q0 25 20 15" stroke="#1A1D24" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Robes -->
    <path d="M-60 30 L60 30 L50 100 L-50 100 Z" fill="#2D3436"/>
    <path d="M-40 30 L0 60 L40 30" fill="none" stroke="#FFB800" stroke-width="4"/>
    
    <!-- Scroll in hand -->
    <rect x="40" y="50" width="30" height="10" rx="2" fill="#FFB800"/>
    <rect x="45" y="45" width="20" height="20" fill="#D49A00"/>
  </g>
</svg>