<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Monument Silhouette & Subtle Glow -->
  <defs>
    <linearGradient id="monumentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4660" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowerStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="240" height="240" fill="url(#monumentGlow)"/>

  <!-- Revolutionary Martyr's Monument (Simplified Obelisk in background) -->
  <polygon points="120,45 132,150 108,150" fill="#2A3242"/>
  <rect x="100" y="150" width="40" height="12" fill="#323C50" rx="2"/>

  <!-- Ground Plane -->
  <rect x="30" y="180" width="180" height="3" fill="#323C50" rx="1.5"/>

  <!-- Central Physical Object: Pure White Memorial Flower (Chrysanthemum / Lily representation) with Red Scarf hint -->
  <!-- Flower Stem -->
  <path d="M120,180 Q118,150 120,130" stroke="url(#flowerStem)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Leaves -->
  <path d="M120,165 Q110,160 105,155 Q115,160 120,165" fill="#388E3C"/>
  <path d="M120,150 Q130,145 135,140 Q125,145 120,150" fill="#388E3C"/>

  <!-- Pure White Flower Petals (Layered for depth) -->
  <g transform="translate(120, 115)">
    <!-- Outer Petals -->
    <circle cx="0" cy="-16" r="8" fill="#ECEFF1"/>
    <circle cx="15" cy="-8" r="8" fill="#ECEFF1"/>
    <circle cx="15" cy="8" r="8" fill="#ECEFF1"/>
    <circle cx="0" cy="16" r="8" fill="#ECEFF1"/>
    <circle cx="-15" cy="8" r="8" fill="#ECEFF1"/>
    <circle cx="-15" cy="-8" r="8" fill="#ECEFF1"/>
    
    <!-- Inner Petals -->
    <circle cx="0" cy="-10" r="7" fill="#F8FAFC"/>
    <circle cx="9" cy="-5" r="7" fill="#F8FAFC"/>
    <circle cx="9" cy="5" r="7" fill="#F8FAFC"/>
    <circle cx="0" cy="10" r="7" fill="#F8FAFC"/>
    <circle cx="-9" cy="5" r="7" fill="#F8FAFC"/>
    <circle cx="-9" cy="-5" r="7" fill="#F8FAFC"/>

    <!-- Flower Center (Warm Gold Accent) -->
    <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="3.5" fill="#D97706"/>
  </g>

  <!-- Young Pioneer Red Scarf (红领巾) gracefully draped around the base of the offering -->
  <path d="M95,170 Q120,185 145,170 Q135,195 120,202 Q105,195 95,170 Z" fill="#EF4444"/>
  <polygon points="120,202 115,185 125,185" fill="#DC2626"/>

  <!-- Focal Lighting / Atmosphere Glow -->
  <circle cx="120" cy="130" r="45" fill="#F59E0B" opacity="0.08" filter="blur(8px)"/>
</svg>