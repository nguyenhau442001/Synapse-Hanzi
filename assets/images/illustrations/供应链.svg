<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Connecting Chain/Path Lines in Background -->
  <path d="M 60 120 L 100 120 M 140 120 L 180 120" stroke="#2D3748" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M 120 70 L 120 170" stroke="#2D3748" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Node 1: Factory / Production (Left) -->
  <g transform="translate(40, 90)">
    <rect x="0" y="20" width="40" height="40" rx="4" fill="#2B6CB0"/>
    <polygon points="20,5 35,20 5,20" fill="#3182CE"/>
    <rect x="25" y="0" width="6" height="10" fill="#4A5568"/>
    <!-- Cogwheel detail -->
    <circle cx="20" cy="40" r="8" fill="#1A202C"/>
    <circle cx="20" cy="40" r="3" fill="#F6AD55"/>
  </g>

  <!-- Node 2: Transport / Logistics (Center) -->
  <g transform="translate(100, 85)">
    <!-- Delivery truck -->
    <rect x="5" y="25" width="45" height="30" rx="4" fill="#DD6B20"/>
    <rect x="50" y="35" width="15" height="20" rx="3" fill="#ED8936"/>
    <path d="M 50 40 L 60 40 L 65 55 L 50 55 Z" fill="#2D3748"/>
    <!-- Wheels -->
    <circle cx="17" cy="55" r="7" fill="#2D3748"/>
    <circle cx="17" cy="55" r="3" fill="#A0AEC0"/>
    <circle cx="53" cy="55" r="7" fill="#2D3748"/>
    <circle cx="53" cy="55" r="3" fill="#A0AEC0"/>
  </g>

  <!-- Node 3: Retail / Box / Destination (Right) -->
  <g transform="translate(160, 90)">
    <!-- Package box -->
    <rect x="5" y="25" width="40" height="40" rx="4" fill="#319795"/>
    <polygon points="5,25 25,10 45,25" fill="#4FD1C5"/>
    <polygon points="25,10 45,25 25,25" fill="#319795"/>
    <rect x="22" y="25" width="6" height="40" fill="#234E52" opacity="0.3"/>
  </g>

  <!-- Node 4: Global/Source (Top) -->
  <g transform="translate(100, 30)">
    <circle cx="20" cy="20" r="18" fill="#2C5282"/>
    <path d="M 10 15 Q 20 8 30 15 Q 35 25 25 30 Q 10 30 10 15 Z" fill="#4299E1"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="#63B3ED" stroke-width="2"/>
  </g>

  <!-- Node 5: Consumer (Bottom) -->
  <g transform="translate(100, 150)">
    <circle cx="20" cy="15" r="10" fill="#ECC94B"/>
    <path d="M 5 40 C 5 28 35 28 35 40 Z" fill="#D69E2E"/>
  </g>

  <!-- Glowing Connection Overlays (Focus / Gold Accents for Chain Links) -->
  <circle cx="90" cy="120" r="5" fill="#F6AD55"/>
  <circle cx="150" cy="120" r="5" fill="#F6AD55"/>
  <circle cx="120" cy="85" r="5" fill="#F6AD55"/>
  <circle cx="120" cy="150" r="5" fill="#F6AD55"/>

  <!-- Dynamic connecting flow arrows -->
  <path d="M 85 120 L 95 120" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 145 120 L 155 120" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>