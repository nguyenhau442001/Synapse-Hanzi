<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor platform reflecting the exhibition stage -->
  <ellipse cx="120" cy="190" rx="70" ry="14" fill="#252A34"/>
  
  <!-- Focused spotlight beam shining down on the central object (The "Liàngdiǎn" / Highlight) -->
  <polygon points="120,40 70,185 170,185" fill="url(#spotlightGradient)" opacity="0.15"/>
  
  <defs>
    <linearGradient id="spotlightGradient" x1="120" y1="40" x2="120" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="robotGlow" x1="120" y1="70" x2="120" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#2B6CB0"/>
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Central Bionic Humanoid Robot (representing the physical object/attraction) -->
  <g transform="translate(0, 5)">
    <!-- Robot Head -->
    <rect x="106" y="65" width="28" height="22" rx="6" fill="#E2E8F0"/>
    <!-- Visor / Glowing eyes representing high-tech -->
    <rect x="110" y="72" width="20" height="6" rx="3" fill="#4FD1C5"/>
    
    <!-- Robot Antenna / Sensor -->
    <line x1="120" y1="65" x2="120" y2="58" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="56" r="3" fill="#FFB800"/>

    <!-- Robot Torso -->
    <path d="M100,95 L140,95 L145,130 L95,130 Z" fill="#CBD5E0" rx="4"/>
    <!-- Chest Core Light (Highlight feature) -->
    <circle cx="120" cy="112" r="7" fill="#FFB800"/>
    <circle cx="120" cy="112" r="3" fill="#FFF"/>

    <!-- Robot Arms in dynamic walking pose -->
    <!-- Left Arm -->
    <rect x="83" y="98" width="12" height="30" rx="6" fill="#A0AEC0" transform="rotate(15 89 98)"/>
    <!-- Right Arm -->
    <rect x="145" y="98" width="12" height="30" rx="6" fill="#A0AEC0" transform="rotate(-15 151 98)"/>

    <!-- Robot Legs (Walking / Fluid Motion) -->
    <!-- Left Leg (Forward) -->
    <rect x="102" y="132" width="13" height="42" rx="6" fill="#A0AEC0" transform="rotate(-10 108 132)"/>
    <!-- Right Leg (Back) -->
    <rect x="125" y="132" width="13" height="42" rx="6" fill="#718096" transform="rotate(15 131 132)"/>
    
    <!-- Joint Accents -->
    <circle cx="108" cy="132" r="4" fill="#4FD1C5"/>
    <circle cx="131" cy="132" r="4" fill="#4FD1C5"/>
  </g>

  <!-- Giant Golden Focus Star / Highlight Marker ("Liàngdiǎn" concept indicator) floating above and framing the subject -->
  <g transform="translate(120, 32) scale(0.9)">
    <polygon points="0,-16 4,-5 15,-5 6,2 9,13 0,7 -9,13 -6,2 -15,-5 -4,-5" fill="url(#accentGold)"/>
  </g>
  
  <!-- Secondary smaller glowing spark accents representing attention/attraction -->
  <g transform="translate(65, 75) scale(0.5)">
    <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,5 -7,10 -5,2 -11,-4 -3,-4" fill="#FFD700" opacity="0.8"/>
  </g>
  <g transform="translate(175, 95) scale(0.6)">
    <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,5 -7,10 -5,2 -11,-4 -3,-4" fill="#FFD700" opacity="0.9"/>
  </g>

  <!-- Sleek framing border -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#2D3748" stroke-width="2"/>
</svg>