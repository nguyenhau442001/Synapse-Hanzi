<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Shelf Structure -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#374151"/>
  <rect x="50" y="170" width="140" height="10" rx="2" fill="#374151"/>
  
  <!-- Single Product on Shelf (The "Supply") -->
  <rect x="100" y="110" width="40" height="50" rx="4" fill="#F59E0B"/>
  <rect x="105" y="115" width="30" height="10" rx="2" fill="#1A1D24" fill-opacity="0.2"/>
  
  <!-- Crowd of people (The "Demand") -->
  <g fill="#9CA3AF">
    <circle cx="60" cy="190" r="8"/>
    <path d="M52 198h16v15a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4v-15z"/>
    
    <circle cx="90" cy="190" r="8"/>
    <path d="M82 198h16v15a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4v-15z"/>
    
    <circle cx="120" cy="190" r="8"/>
    <path d="M112 198h16v15a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4v-15z"/>
    
    <circle cx="150" cy="190" r="8"/>
    <path d="M142 198h16v15a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4v-15z"/>
    
    <circle cx="180" cy="190" r="8"/>
    <path d="M172 198h16v15a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4v-15z"/>
  </g>
  
  <!-- Reaching hands indicating demand -->
  <path d="M70 150 L85 130" stroke="#F3F4F6" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 150 L155 130" stroke="#F3F4F6" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 100 L120 80" stroke="#F3F4F6" stroke-width="4" stroke-linecap="round"/>
</svg>