<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Leaf (Fresh green leaf background, curved and realistic flat vector) -->
    <path d="M 24 130 C 50 80, 110 50, 180 40 C 160 100, 120 160, 60 180 C 45 160, 32 145, 24 130 Z" fill="#2E5A36" opacity="0.9"/>
    <path d="M 24 130 C 50 80, 110 50, 180 40" stroke="#468853" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 60 120 C 80 100, 110 85, 145 75" stroke="#3D7549" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 50 145 C 75 125, 100 110, 130 95" stroke="#3D7549" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 40 170 C 65 150, 90 135, 115 120" stroke="#3D7549" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Magnifying Glass Framing the Scene (Contextual: Entomologist observing under a magnifying glass) -->
    <!-- Glass shadow / Outer glow -->
    <circle cx="120" cy="115" r="72" fill="#14171D" opacity="0.8"/>
    
    <!-- Magnifier Lens Area (Slightly lighter dark mode tint for depth) -->
    <circle cx="120" cy="115" r="66" fill="#212630"/>
    
    <!-- Insect Eggs (Microscopic, oval, translucent, glowing pearlescent/amber hue) -->
    <!-- Egg 1 (Main central) -->
    <ellipse cx="125" cy="110" rx="14" ry="9" transform="rotate(-15 125 110)" fill="#E3F4D7" opacity="0.9"/>
    <ellipse cx="125" cy="110" rx="11" ry="6.5" transform="rotate(-15 125 110)" fill="#F5FCEF" opacity="0.6"/>
    <!-- Highlight on Egg 1 -->
    <ellipse cx="121" cy="107" rx="4" ry="2" transform="rotate(-15 121 107)" fill="#FFFFFF" opacity="0.8"/>

    <!-- Egg 2 (Adjacent) -->
    <ellipse cx="98" cy="125" rx="12" ry="8" transform="rotate(25 98 125)" fill="#E3F4D7" opacity="0.85"/>
    <ellipse cx="98" cy="125" rx="9" ry="5.5" transform="rotate(25 98 125)" fill="#F5FCEF" opacity="0.5"/>
    <ellipse cx="95" cy="122" rx="3.5" ry="1.5" transform="rotate(25 95 122)" fill="#FFFFFF" opacity="0.7"/>

    <!-- Egg 3 (Smaller, background) -->
    <ellipse cx="140" cy="132" rx="10" ry="7" transform="rotate(-40 140 132)" fill="#D6EEDB" opacity="0.8"/>
    <ellipse cx="138" cy="130" rx="3" ry="1.5" transform="rotate(-40 138 130)" fill="#FFFFFF" opacity="0.6"/>

    <!-- Magnifying Glass Lens Glass Effect (Glossy reflection streak) -->
    <path d="M 66 85 A 66 66 0 0 1 174 85 C 160 70, 140 65, 120 65 C 100 65, 80 70, 66 85 Z" fill="#FFFFFF" opacity="0.06"/>

    <!-- Magnifying Glass Rim (Sleek professional gold/accent ring) -->
    <circle cx="120" cy="115" r="66" fill="none" stroke="#F39C12" stroke-width="5"/>
    <circle cx="120" cy="115" r="63.5" fill="none" stroke="#D35400" stroke-width="1"/>

    <!-- Magnifying Glass Handle -->
    <path d="M 167 162 L 202 197 C 208 203, 208 212, 202 218 C 196 224, 187 224, 181 218 L 146 183 Z" fill="#3A4252"/>
    <!-- Handle metallic highlight -->
    <path d="M 172 167 L 197 192" stroke="#525B6C" stroke-width="2" stroke-linecap="round"/>
    <!-- Handle ring connector -->
    <path d="M 160 155 L 172 167" stroke="#F39C12" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>