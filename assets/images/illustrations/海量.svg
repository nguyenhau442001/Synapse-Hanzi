<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Server Rack Silhouette representing vast data -->
  <g opacity="0.3">
    <rect x="60" y="50" width="120" height="140" rx="8" fill="#222730" stroke="#3A4252" stroke-width="2"/>
    <line x1="75" y1="75" x2="105" y2="75" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="100" x2="105" y2="100" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="125" x2="105" y2="125" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="150" x2="105" y2="150" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="150" cy="75" r="4" fill="#00E5FF"/>
    <circle cx="165" cy="75" r="4" fill="#3A4252"/>
    <circle cx="150" cy="100" r="4" fill="#00E5FF"/>
    <circle cx="165" cy="100" r="4" fill="#00E5FF"/>
    <circle cx="150" cy="125" r="4" fill="#3A4252"/>
    <circle cx="165" cy="125" r="4" fill="#00E5FF"/>
    <circle cx="150" cy="150" r="4" fill="#00E5FF"/>
    <circle cx="165" cy="150" r="4" fill="#00E5FF"/>
  </g>

  <!-- Central Physical Object: A massive, detailed storage drive / data vault container symbolizing '海量' (huge volume/capacity) -->
  <g transform="translate(0, 5)">
    <!-- Vault Outer Shell -->
    <rect x="70" y="65" width="100" height="110" rx="14" fill="#28303D" stroke="#00E5FF" stroke-width="3"/>
    
    <!-- Heavy Duty Vault Door Handle / Wheel -->
    <circle cx="120" cy="120" r="22" fill="#1A1D24" stroke="#FFB703" stroke-width="4"/>
    <circle cx="120" cy="120" r="6" fill="#FFB703"/>
    <line x1="120" y1="98" x2="120" y2="114" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="126" x2="120" y2="142" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
    <line x1="98" y1="120" x2="114" y2="120" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
    <line x1="126" y1="120" x2="142" y2="120" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>

    <!-- Status Indicator / Power Slot -->
    <rect x="95" y="82" width="50" height="8" rx="4" fill="#1A1D24"/>
    <circle cx="103" cy="86" r="2.5" fill="#00E5FF"/>
    <circle cx="113" cy="86" r="2.5" fill="#00E5FF"/>
    <circle cx="123" cy="86" r="2.5" fill="#00E5FF"/>
    <circle cx="133" cy="86" r="2.5" fill="#00E5FF"/>
    <circle cx="143" cy="86" r="2.5" fill="#00E5FF"/>

    <!-- Heavy Industrial Bolts -->
    <circle cx="82" cy="77" r="3" fill="#6C7A9C"/>
    <circle cx="158" cy="77" r="3" fill="#6C7A9C"/>
    <circle cx="82" cy="163" r="3" fill="#6C7A9C"/>
    <circle cx="158" cy="163" r="3" fill="#6C7A9C"/>
  </g>

  <!-- Cascading Data Streams / Massive Inflow (Visualizing massive volume) -->
  <g>
    <!-- Left Streams -->
    <path d="M 40 90 Q 55 90 70 105" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 30 120 Q 50 120 70 120" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M 40 150 Q 55 150 70 135" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <circle cx="45" cy="105" r="2" fill="#00E5FF"/>
    <circle cx="35" cy="120" r="3" fill="#00E5FF"/>
    <circle cx="45" cy="135" r="2" fill="#FFB703"/>

    <!-- Right Streams -->
    <path d="M 200 90 Q 185 90 170 105" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 210 120 Q 190 120 170 120" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M 200 150 Q 185 150 170 135" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <circle cx="195" cy="105" r="2" fill="#FFB703"/>
    <circle cx="205" cy="120" r="3" fill="#00E5FF"/>
    <circle cx="195" cy="135" r="2" fill="#00E5FF"/>
  </g>

  <!-- Data particles floating upward from the vault -->
  <g fill="#00E5FF">
    <rect x="112" y="38" width="4" height="8" rx="1" opacity="0.9"/>
    <rect x="124" y="32" width="4" height="10" rx="1" opacity="0.6"/>
    <circle cx="120" cy="24" r="2" fill="#FFB703"/>
  </g>
</svg>