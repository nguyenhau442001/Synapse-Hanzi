<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background library shelves subtly in dark tones -->
  <g opacity="0.3">
    <rect x="25" y="45" width="190" height="6" rx="3" fill="#3A4252"/>
    <rect x="40" y="25" width="14" height="20" rx="2" fill="#2E3642"/>
    <rect x="58" y="22" width="18" height="23" rx="2" fill="#4A5568"/>
    <rect x="160" y="20" width="16" height="25" rx="2" fill="#3B4656"/>
    <rect x="180" y="24" width="12" height="21" rx="2" fill="#2E3642"/>

    <rect x="25" y="160" width="190" height="6" rx="3" fill="#3A4252"/>
    <rect x="70" y="138" width="15" height="22" rx="2" fill="#3B4656"/>
    <rect x="88" y="141" width="12" height="19" rx="2" fill="#2E3642"/>
    <rect x="135" y="137" width="20" height="23" rx="2" fill="#4A5568"/>
  </g>

  <!-- Floor -->
  <rect x="25" y="195" width="190" height="3" rx="1.5" fill="#2E3642"/>

  <!-- Character 1 (Left - Person arriving at library) -->
  <g>
    <!-- Body -->
    <path d="M 65 135 C 65 125, 75 115, 85 115 C 95 115, 105 125, 105 135 L 100 195 L 70 195 Z" fill="#4F46E5"/>
    <!-- Head -->
    <circle cx="85" cy="100" r="14" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M 72 98 C 72 90, 78 85, 85 85 C 93 85, 98 90, 98 97 C 95 95, 90 92, 85 92 C 80 92, 75 95, 72 98 Z" fill="#1F2937"/>
    <!-- Back arm holding book -->
    <path d="M 95 125 L 80 140 L 88 145" fill="none" stroke="#4F46E5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Book -->
    <rect x="75" y="140" width="16" height="12" rx="2" fill="#EC4899"/>
    <line x1="83" y1="140" x2="83" y2="152" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Character 2 (Right - Person walking from other direction) -->
  <g>
    <!-- Body -->
    <path d="M 135 135 C 135 125, 145 115, 155 115 C 165 115, 175 125, 175 135 L 170 195 L 140 195 Z" fill="#0EA5E9"/>
    <!-- Head -->
    <circle cx="155" cy="100" r="14" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M 142 98 C 142 90, 148 85, 155 85 C 163 85, 168 90, 168 97 C 165 95, 160 92, 155 92 C 150 92, 145 95, 142 98 Z" fill="#374151"/>
    <!-- Arm -->
    <path d="M 145 125 L 155 140" fill="none" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Spark/Encounter Focus Indicator (Representing "Coincidence / 碰巧") -->
  <g transform="translate(120, 95)">
    <!-- Glowing background aura -->
    <circle cx="0" cy="0" r="24" fill="#F59E0B" opacity="0.15"/>
    <circle cx="0" cy="0" r="16" fill="#F59E0B" opacity="0.25"/>
    
    <!-- Central bright star / spark representing unexpected meeting -->
    <path d="M 0 -14 C 0 -4, 4 0, 14 0 C 4 0, 0 4, 0 14 C 0 4, -4 0, -14 0 C -4 0, 0 -4, 0 -14 Z" fill="#F59E0B"/>
    <!-- Secondary small sparkle -->
    <path d="M 12 -10 C 12 -6, 14 -4, 18 -4 C 14 -4, 12 -2, 12 2 C 12 -2, 10 -4, 6 -4 C 10 -4, 12 -6, 12 -10 Z" fill="#FCD34D"/>
    <path d="M -14 6 C -14 9, -12 10, -9 10 C -12 10, -14 12, -14 15 C -14 12, -16 10, -19 10 C -16 10, -14 9, -14 6 Z" fill="#FCD34D"/>
  </g>

  <!-- Motion lines / Intersection marker -->
  <path d="M 100 80 Q 120 70 140 80" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>
</svg>