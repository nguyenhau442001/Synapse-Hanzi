<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Concept: A solid, unyielding pillar/monolith representing "Strong/Hard" stance -->
  <rect x="100" y="60" width="40" height="120" rx="4" fill="#FFB800"/>
  
  <!-- Representing the "unyielding" aspect: A force pushing against it that fails to move it -->
  <!-- The force is depicted as a fluid, softer shape (blue) that conforms to the rigid pillar -->
  <path d="M60 100 C 80 100, 90 100, 100 100 L 100 140 C 90 140, 80 140, 60 140 Z" fill="#3B82F6" opacity="0.6"/>
  
  <!-- Visual Contrast: The pillar remains perfectly vertical and unmoved -->
  <line x1="120" y1="50" x2="120" y2="190" stroke="#2D343E" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Grounding the pillar to show stability -->
  <rect x="80" y="180" width="80" height="8" rx="2" fill="#4A5568"/>
  
  <!-- Emphasizing the "Strong/Hard" quality through scale and weight -->
  <circle cx="120" cy="40" r="6" fill="#FFB800"/>
  <circle cx="120" cy="200" r="6" fill="#FFB800"/>
</svg>