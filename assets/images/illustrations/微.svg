<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle tech grid background lines -->
  <g stroke="#2A2F3A" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="30" y1="120" x2="210" y2="120" />
    <line x1="120" y1="30" x2="120" y2="210" />
  </g>

  <!-- Scale Contrast Visualization (Adjective rule): Large reference grid vs Extremely tiny physical deformation -->
  
  <!-- Left/Upper context: High precision laser beam setup (contextual reference) -->
  <g opacity="0.3" stroke="#525B70" stroke-width="1.5">
    <!-- Laser emitter -->
    <rect x="50" y="70" width="20" height="16" rx="3" fill="#2A2F3A"/>
    <circle cx="60" cy="78" r="3" fill="#4DA3FF"/>
    <!-- Laser line -->
    <line x1="70" y1="78" x2="110" y2="78" stroke="#4DA3FF" stroke-dasharray="4 2"/>
  </g>

  <!-- Macro structure representing the massive experimental component -->
  <g fill="none" stroke="#6C7A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main structural brackets -->
    <path d="M 80 100 L 80 160 L 100 160" />
    <path d="M 160 100 L 160 160 L 140 160" />
    <!-- Central test block -->
    <rect x="95" y="110" width="50" height="40" rx="4" fill="#222733" stroke="#8A9BB8" stroke-width="2"/>
  </g>

  <!-- The "Micro" (微) focal point: Exaggerated microscopic scale view of the tiny deformation -->
  <g transform="translate(120, 130)">
    <!-- Magnifying glass lens frame representing microscopic observation -->
    <circle cx="0" cy="0" r="36" fill="#1A1D24" fill-opacity="0.9" stroke="#4DA3FF" stroke-width="2.5" stroke-dasharray="none"/>
    <!-- Glass reflection highlight -->
    <path d="M -22 -15 C -15 -25 5 -25 15 -22" fill="none" stroke="#4DA3FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- The original state outline (dashed ghost) -->
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#525B70" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- The tiny physical deformation (extremely small shift highlighted with vibrant gold/orange accent) -->
    <g>
      <!-- Slightly shifted deformed block -->
      <rect x="-11.5" y="-12" width="24" height="24" rx="2" fill="#2E3648" stroke="#F5A623" stroke-width="2"/>
      
      <!-- Internal minute detail lines showing stress/deformation -->
      <line x1="-5" y1="-6" x2="6" y2="-6" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-5" y1="0" x2="3" y2="0" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-5" y1="6" x2="5" y2="6" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Precise measurement bracket pointing out the microscopic delta -->
    <g stroke="#FF5722" stroke-width="1.5" stroke-linecap="round">
      <!-- Top tiny indicator ticks -->
      <line x1="-12" y1="-17" x2="-12" y2="-14" />
      <line x1="-11.5" y1="-17" x2="-11.5" y2="-14" />
      <!-- Dimension span line -->
      <line x1="-12" y1="-15.5" x2="-11.5" y2="-15.5" />
      <!-- Pointer arrows -->
      <polyline points="-14,-15.5 -12,-15.5 -13,-17" fill="none"/>
      <polyline points="-9.5,-15.5 -11.5,-15.5 -10.5,-17" fill="none"/>
    </g>
  </g>

  <!-- Magnifying glass handle extending downwards -->
  <line x1="145" y1="155" x2="170" y2="180" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="173" cy="183" r="2.5" fill="#4DA3FF"/>

  <!-- Focus/Precision indicator dots (orange/gold accent for focal point) -->
  <circle cx="120" cy="130" r="2" fill="#F5A623"/>
</svg>