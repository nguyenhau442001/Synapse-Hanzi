<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Floor line -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Motion lines to emphasize "straight/direct" -->
  <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="80" y1="140" x2="120" y2="140"/>
    <line x1="85" y1="155" x2="125" y2="155"/>
    <line x1="80" y1="170" x2="120" y2="170"/>
  </g>

  <!-- Character (Fire Chief) -->
  <g transform="translate(100, 100)">
    <!-- Body -->
    <path d="M0 0 L15 0 L12 60 L-12 60 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="12" fill="#FDE68A"/>
    <!-- Helmet -->
    <path d="M-14 -25 A 14 14 0 0 1 14 -25 L 10 -32 L -10 -32 Z" fill="#EF4444"/>
    <!-- Legs in motion -->
    <path d="M-5 60 L-15 90" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    <path d="M5 60 L15 90" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    <!-- Arm reaching forward -->
    <path d="M10 10 L40 30" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Destination marker (The site) -->
  <g transform="translate(180, 140)">
    <path d="M0 -20 L10 0 L-10 0 Z" fill="#EF4444"/>
    <rect x="-2" y="0" width="4" height="20" fill="#9CA3AF"/>
  </g>
</svg>