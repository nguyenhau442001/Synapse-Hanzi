<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background cinematic glow / atmosphere -->
  <circle cx="120" cy="110" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Film Strip / Plot Arc (Curved dynamic winding path representing "跌宕起伏环环相扣") -->
  <path d="M 50,150 Q 80,70 120,110 T 190,70" fill="none" stroke="#2E3646" stroke-width="20" stroke-linecap="round"/>
  <path d="M 50,150 Q 80,70 120,110 T 190,70" fill="none" stroke="#F39C12" stroke-width="4" stroke-dasharray="8 12" stroke-linecap="round"/>

  <!-- Central Physical Object: The Classic Film Clapperboard representing "剧情" (Plot/Drama) -->
  <g transform="translate(120, 115)">
    <!-- Clapperboard Body (Main slate) -->
    <rect x="-45" y="-20" width="90" height="70" rx="6" fill="#2A313C" stroke="#3E4859" stroke-width="3"/>
    
    <!-- Screen/Monitor inner cut representing narrative view -->
    <rect x="-35" y="-5" width="70" height="45" rx="3" fill="#1A1D24"/>
    <polygon points="-15,12 15,22 -15,32" fill="#E74C3C"/>

    <!-- Clapperboard Top Stripe (Hinged bar) with diagonal hazard stripes -->
    <g transform="translate(0, -20)">
      <path d="M -48,-16 L 48,-16 L 45,-26 L -45,-26 Z" fill="#F1C40F" stroke="#2A313C" stroke-width="2"/>
      <!-- Diagonal stripes on the top bar -->
      <line x1="-32" y1="-16" x2="-26" y2="-26" stroke="#2A313C" stroke-width="5"/>
      <line x1="-8" y1="-16" x2="-2" y2="-26" stroke="#2A313C" stroke-width="5"/>
      <line x1="16" y1="-16" x2="22" y2="-26" stroke="#2A313C" stroke-width="5"/>
      <line x1="40" y1="-16" x2="46" y2="-26" stroke="#2A313C" stroke-width="5"/>
    </g>

    <!-- Hinge / Pivot Dot -->
    <circle cx="-42" cy="-21" r="3" fill="#BDC3C7"/>
  </g>

  <!-- Interlocking Narrative Elements / Plot twists (Circles/Nodes along the curve) -->
  <!-- Node 1: Beginning -->
  <circle cx="65" cy="132" r="8" fill="#1A1D24" stroke="#3498DB" stroke-width="4"/>
  
  <!-- Node 2: Climax / Twist -->
  <circle cx="120" cy="110" r="10" fill="#1A1D24" stroke="#E74C3C" stroke-width="4"/>
  <circle cx="120" cy="110" r="4" fill="#E74C3C"/>

  <!-- Node 3: Resolution -->
  <circle cx="175" cy="85" r="8" fill="#1A1D24" stroke="#2ECC71" stroke-width="4"/>

  <!-- Accent sparkles indicating suspense/mystery design -->
  <path d="M 175,35 L 178,42 L 185,45 L 178,48 L 175,55 L 172,48 L 165,45 L 172,42 Z" fill="#F1C40F" opacity="0.8"/>
  <path d="M 60,75 L 62,80 L 67,82 L 62,84 L 60,89 L 58,84 L 53,82 L 58,80 Z" fill="#3498DB" opacity="0.6"/>

</svg>