<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Central figure: A young person with an expressive, upright posture -->
    <path d="M-20 40 L-20 80 L20 80 L20 40 Z" fill="#3D4451"/>
    <circle cx="0" cy="10" r="30" fill="#F4A261"/>
    <path d="M-15 -10 L-5 -10 M5 -10 L15 -10" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 5 Q0 15 10 5" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Visualizing "激荡" (Surging/Swaying energy) as physical waves within the chest area -->
    <path d="M-30 -5 C-15 -25, 15 -25, 30 -5" stroke="#E9C46A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-40 5 C-20 -15, 20 -15, 40 5" stroke="#E76F51" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-50 15 C-25 -5, 25 -5, 50 15" stroke="#F4A261" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Arms raised in a gesture of intense, surging passion -->
    <path d="M-20 30 L-50 -10" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 30 L50 -10" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>