<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow at the center representing critical moment / spotlight -->
  <circle cx="120" cy="120" r="70" fill="#262D3D" opacity="0.6"/>

  <!-- Conceptual illustration for "关头" (Critical Moment / Crossroads / Turning Point) -->
  <g transform="translate(0, 0)">
    <!-- Split path / Crossroads base (symbolizing the crucial juncture/turning point) -->
    <path d="M120 180 L120 120" stroke="#3A4454" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 120 L70 70" stroke="#3A4454" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 120 L170 70" stroke="#3A4454" stroke-width="8" stroke-linecap="round"/>

    <!-- Glowing pathway for the correct/critical choice (High-contrast accent) -->
    <path d="M120 180 L120 120 L170 70" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stylized clock/timer mechanism in the background overlay representing a precise, crucial moment -->
    <circle cx="120" cy="120" r="48" fill="none" stroke="#2F3748" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Focal Object: A glowing golden compass/turning point marker at the junction -->
    <g transform="translate(120, 120)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="22" fill="#1E2530" stroke="#F59E0B" stroke-width="3"/>
      <!-- Inner core pulse -->
      <circle cx="0" cy="0" r="14" fill="#F59E0B" opacity="0.2"/>
      <!-- Needle pointing sharply towards the critical path -->
      <polygon points="0,-16 6,4 0,12 -6,4" fill="#F59E0B"/>
      <!-- Center pin -->
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Floating accent nodes marking the decisive juncture -->
    <circle cx="70" cy="70" r="5" fill="#4B5563"/>
    <circle cx="170" cy="70" r="8" fill="#F59E0B"/>
    <circle cx="120" cy="180" r="6" fill="#60A5FA"/>
  </g>
</svg>