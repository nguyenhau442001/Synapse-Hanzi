<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow behind the book/document -->
  <circle cx="120" cy="115" r="70" fill="#2D323E" opacity="0.4"/>

  <!-- Legal Document / Constitution Base -->
  <g transform="translate(68, 55)">
    <!-- Document background (Open Book / Constitution) -->
    <path d="M 52 10 L 92 20 L 92 110 L 52 100 Z" fill="#2E3440" />
    <path d="M 52 10 L 12 20 L 12 110 L 52 100 Z" fill="#3B4252" />
    <path d="M 52 12 L 90 22 L 90 108 L 52 98 Z" fill="#ECEFF4" />
    <path d="M 52 12 L 14 22 L 14 108 L 52 98 Z" fill="#E5E9F0" />

    <!-- Center spine shadow -->
    <line x1="52" y1="12" x2="52" y2="98" stroke="#D8DEE9" stroke-width="2"/>

    <!-- Abstract text lines on the left page -->
    <line x1="22" y1="35" x2="42" y2="39" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="47" x2="44" y2="51" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="59" x2="38" y2="63" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="71" x2="42" y2="75" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>

    <!-- Abstract text lines on the right page -->
    <line x1="62" y1="37" x2="82" y2="33" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="49" x2="82" y2="45" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="61" x2="80" y2="57" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="73" x2="82" y2="69" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Golden Scale of Justice (Representing Law / Constitution) overlapping the document -->
  <g transform="translate(120, 85)">
    <!-- Stand / Pillar -->
    <rect x="-3" y="-25" width="6" height="60" fill="#EBCB8B" rx="1"/>
    <!-- Base -->
    <path d="M -16 35 L 16 35 L 12 30 L -12 30 Z" fill="#D08770"/>
    <!-- Top ring -->
    <circle cx="0" cy="-28" r="4" fill="none" stroke="#EBCB8B" stroke-width="2.5"/>
    
    <!-- Balance beam -->
    <path d="M -35 -18 L 35 -18" stroke="#EBCB8B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="0,-22 -5,-18 5,-18" fill="#EBCB8B"/>

    <!-- Left pan -->
    <line x1="-35" y1="-18" x2="-45" y2="5" stroke="#EBCB8B" stroke-width="1.5"/>
    <line x1="-35" y1="-18" x2="-25" y2="5" stroke="#EBCB8B" stroke-width="1.5"/>
    <path d="M -48 7 C -48 15 -22 15 -22 7 Z" fill="#EBCB8B" opacity="0.9"/>

    <!-- Right pan -->
    <line x1="35" y1="-18" x2="25" y2="5" stroke="#EBCB8B" stroke-width="1.5"/>
    <line x1="35" y1="-18" x2="45" y2="5" stroke="#EBCB8B" stroke-width="1.5"/>
    <path d="M 22 7 C 22 15 48 15 48 7 Z" fill="#EBCB8B" opacity="0.9"/>
  </g>

  <!-- Glowing Shield / Allegiance Element in Gold/Orange -->
  <g transform="translate(120, 155)">
    <!-- Shield background -->
    <path d="M 0 -22 C 16 -22 26 -28 26 -28 C 26 2 18 24 0 32 C -18 24 -26 2 -26 -28 C -26 -28 -16 -22 0 -22 Z" fill="#D08770"/>
    <!-- Inner Shield -->
    <path d="M 0 -18 C 13 -18 21 -23 21 -23 C 21 0 14 19 0 26 C -14 19 -21 0 -21 -23 C -21 -23 -13 -18 0 -18 Z" fill="#EBCB8B"/>

    <!-- Checkmark inside shield denoting loyalty/fidelity fulfillment -->
    <path d="M -7 0 L -2 5 L 9 -7" fill="none" stroke="#2E3440" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>