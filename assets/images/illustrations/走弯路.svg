<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Grid lines / subtle background details for modern dark UI look -->
  <line x1="40" y1="200" x2="200" y2="200" stroke="#262B35" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="40" y1="160" x2="200" y2="160" stroke="#262B35" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="40" y1="120" x2="200" y2="120" stroke="#262B35" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="40" y1="80" x2="200" y2="80" stroke="#262B35" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Conceptual Path: The Long/Winding Detour (走弯路) vs Direct Path -->
  <!-- Direct ideal path (ghosted/faded in background) -->
  <path d="M 60 180 L 190 70" fill="none" stroke="#2A3241" stroke-width="6" stroke-dasharray="6 6" stroke-linecap="round"/>
  <circle cx="190" cy="70" r="5" fill="#2A3241"/>

  <!-- Winding, inefficient detour path -->
  <path d="M 60 180 C 80 180, 85 130, 110 130 C 135 130, 130 200, 155 190 C 180 180, 175 90, 190 70" fill="none" stroke="#FF9F43" stroke-width="5" stroke-linecap="round"/>

  <!-- Destination Marker -->
  <circle cx="190" cy="70" r="8" fill="#FF9F43" opacity="0.3"/>
  <circle cx="190" cy="70" r="4" fill="#FF9F43"/>

  <!-- Start Marker -->
  <circle cx="60" cy="180" r="4" fill="#6C7A9C"/>

  <!-- Struggling human character walking the winding path (Dynamic Action) -->
  <g transform="translate(112, 112)">
    <!-- Motion lines showing backtracking/confusion -->
    <path d="M -15 -10 C -25 -15, -20 -30, -5 -25" fill="none" stroke="#6C7A9C" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M -22 -18 L -15 -10 L -25 -8" fill="none" stroke="#6C7A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

    <!-- Backpack / Effort indicator -->
    <rect x="-8" y="-2" width="10" height="14" rx="3" fill="#E17055"/>

    <!-- Body / Torso leaning forward in effort -->
    <path d="M 0 12 L -2 -3 L 4 -12" fill="none" stroke="#F1F2F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Head -->
    <circle cx="5" cy="-18" r="6" fill="#F1F2F6"/>

    <!-- Legs walking -->
    <path d="M -2 -3 L -10 6 L -6 16" fill="none" stroke="#F1F2F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -2 -3 L 7 8 L 13 4" fill="none" stroke="#F1F2F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arms swinging/balancing -->
    <path d="M 2 -9 L 10 -3" fill="none" stroke="#F1F2F6" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -1 -7 L -8 -13" fill="none" stroke="#F1F2F6" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Small decorative guide markers along the winding route -->
  <circle cx="110" cy="130" r="3" fill="#FF9F43"/>
  <circle cx="155" cy="190" r="3" fill="#FF9F43"/>

  <!-- Subtle indicator of the efficient shortcut overhead -->
  <path d="M 90 95 Q 125 75 160 95" fill="none" stroke="#2ECC71" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
  <polygon points="160,95 154,92 155,97" fill="#2ECC71" opacity="0.7"/>
</svg>