<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Elements: Distant misty mountains -->
  <path d="M40 180 Q80 120 120 160 T200 140 L200 240 L40 240 Z" fill="#2C333F"/>
  <path d="M20 200 Q60 140 100 180 T180 160 L180 240 L20 240 Z" fill="#252B36"/>
  
  <!-- Water Surface -->
  <path d="M0 180 C60 170 180 190 240 180 L240 240 L0 240 Z" fill="#1E2530"/>
  
  <!-- The "Xiumei" focal point: Contrasting the delicate bridge and graceful willow -->
  <!-- Stone Bridge (Small, elegant, curved) -->
  <path d="M60 170 C80 150 160 150 180 170" stroke="#A0A8B5" stroke-width="4" fill="none"/>
  <path d="M55 175 L185 175" stroke="#A0A8B5" stroke-width="2" fill="none"/>
  
  <!-- Willow Tree (Graceful, flowing lines) -->
  <path d="M190 120 C195 150 190 180 185 190" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 120 C180 140 175 160 170 175" stroke="#FFC107" stroke-width="2" stroke-linecap="round"/>
  <path d="M190 120 C205 140 210 160 215 175" stroke="#FFC107" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Reflection in water -->
  <path d="M60 190 C80 210 160 210 180 190" stroke="#FFC107" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  
  <!-- Visual Contrast: Scale exaggeration of the delicate bridge against the vast, calm space -->
  <circle cx="200" cy="60" r="15" fill="#FFC107" opacity="0.15"/>
  <circle cx="200" cy="60" r="8" fill="#FFC107" opacity="0.3"/>
  <circle cx="200" cy="60" r="3" fill="#FFC107"/>
</svg>