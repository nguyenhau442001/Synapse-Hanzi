<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Base Platform / Podium -->
    <path d="M 60 190 L 180 190 L 190 205 L 50 205 Z" fill="#2D323E"/>
    <rect x="70" y="180" width="100" height="10" rx="2" fill="#3E4556"/>

    <!-- Scales of Justice (Central Physical Object for "审" - Trial/Judgment) -->
    <!-- Vertical Stand / Pillar -->
    <rect x="116" y="65" width="8" height="115" rx="2" fill="#E2E8F0"/>
    
    <!-- Base Circular Weight -->
    <ellipse cx="120" cy="180" rx="22" ry="6" fill="#F59E0B"/>
    
    <!-- Top Finial / Ring -->
    <circle cx="120" cy="58" r="7" fill="none" stroke="#F59E0B" stroke-width="3"/>

    <!-- Balance Beam -->
    <!-- Tilted slightly to show active deliberation/weighing -->
    <path d="M 72 75 L 168 83 L 168 89 L 72 81 Z" fill="#F59E0B"/>
    <circle cx="120" cy="80" r="5" fill="#1A1D24" stroke="#F59E0B" stroke-width="2"/>

    <!-- Left Pan -->
    <line x1="72" y1="81" x2="55" y2="125" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="83" x2="105" y2="125" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 45 125 C 45 133, 105 133, 105 125 Z" fill="#3B82F6"/>
    <ellipse cx="75" cy="125" rx="30" ry="6" fill="#60A5FA"/>

    <!-- Right Pan -->
    <line x1="148" y1="83" x2="135" y2="115" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="168" y1="85" x2="185" y2="115" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 125 115 C 125 123, 185 123, 185 115 Z" fill="#3B82F6"/>
    <ellipse cx="155" cy="115" rx="30" ry="6" fill="#60A5FA"/>

    <!-- Legal Document / Evidence on Left Pan -->
    <rect x="65" y="112" width="20" height="15" rx="1.5" fill="#F8FAFC" transform="rotate(-10 75 120)"/>
    <line x1="69" y1="116" x2="79" y2="116" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="69" y1="120" x2="77" y2="120" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Gavel (Symbolizing judicial review/hearing) -->
    <!-- Gavel Handle -->
    <path d="M 130 145 L 175 168" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
    <!-- Gavel Head -->
    <path d="M 122 135 L 140 144 L 132 160 L 114 151 Z" fill="#D97706"/>
    <!-- Sound Block -->
    <rect x="100" y="165" width="40" height="10" rx="3" fill="#64748B"/>
  </g>
</svg>