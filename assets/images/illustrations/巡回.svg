<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222B"/>
      <stop offset="100%" stop-color="#14161C"/>
    </linearGradient>

    <!-- Global Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Globe/Route Gradients -->
    <linearGradient id="globeGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6AD55"/>
      <stop offset="100%" stop-color="#ED8936"/>
    </linearGradient>

    <!-- Marker Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F56565"/>
      <stop offset="100%" stop-color="#C53030"/>
    </linearGradient>
  </defs>

  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>

  <!-- Decorative Orbit / Circuit Lines (Tour/Circuit Concept) -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer dashed path representing international tour movement -->
    <ellipse cx="120" cy="120" rx="90" ry="42" stroke="#4A5568" stroke-width="2" stroke-dasharray="6 6" transform="rotate(-15 120 120)"/>
    <ellipse cx="120" cy="120" rx="75" ry="30" stroke="#718096" stroke-width="1.5" stroke-dasharray="4 8" transform="rotate(30 120 120)" opacity="0.6"/>
  </g>

  <!-- Central Globe (Physical Object / Destination Representation) -->
  <g filter="url(#shadow)">
    <!-- Globe Base Circle -->
    <circle cx="120" cy="120" r="54" fill="url(#globeGrad)" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Stylized Continents / Meridians (Flat Vector Style) -->
    <path d="M90 95 C 105 85, 135 90, 145 110 C 155 130, 135 150, 110 145 C 85 140, 75 110, 90 95 Z" fill="#323F4B" opacity="0.8"/>
    <path d="M135 125 C 145 120, 160 135, 155 150 C 150 165, 130 155, 135 125 Z" fill="#323F4B" opacity="0.6"/>

    <!-- Globe Grid Lines -->
    <ellipse cx="120" cy="120" rx="54" ry="20" fill="none" stroke="#4A5568" stroke-width="1.5" opacity="0.4"/>
    <line x1="120" y1="66" x2="120" y2="174" stroke="#4A5568" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Dynamic Tour / Route Arcs with Gradient -->
  <g fill="none">
    <!-- Primary Circuit Arc -->
    <path d="M 45 140 Q 120 40 195 100" stroke="url(#accentGold)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Secondary Orbit Arc -->
    <path d="M 60 80 Q 120 190 180 140" stroke="#4FD1C5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.8"/>
  </g>

  <!-- Location Pins / Tour Stops (Highlighting "巡回" - travelling destinations) -->
  <!-- Pin 1 (Top Right) -->
  <g transform="translate(165, 75)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="10" fill="url(#pinGrad)"/>
    <circle cx="0" cy="0" r="4" fill="#FFF"/>
    <!-- Pin Point -->
    <polygon points="-3,8 3,8 0,15" fill="#C53030"/>
  </g>

  <!-- Pin 2 (Bottom Left) -->
  <g transform="translate(75, 150)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="10" fill="url(#pinGrad)"/>
    <circle cx="0" cy="0" r="4" fill="#FFF"/>
    <!-- Pin Point -->
    <polygon points="-3,8 3,8 0,15" fill="#C53030"/>
  </g>

  <!-- Accent Flying Star / Sparkles for "Performance / Tour" atmosphere -->
  <g fill="#F6AD55">
    <path d="M 185 60 Q 185 50 195 50 Q 185 50 185 40 Q 185 50 175 50 Q 185 50 185 60 Z"/>
    <path d="M 55 100 Q 55 93 62 93 Q 55 93 55 86 Q 55 93 48 93 Q 55 93 55 100 Z" opacity="0.7"/>
  </g>

  <!-- Center Focal Icon overlay: A subtle rotating musical note/stage element subtly merging with movement -->
  <g transform="translate(120, 120)" filter="url(#shadow)">
    <!-- Small golden badge backing -->
    <circle cx="0" cy="0" r="22" fill="#1A202C" stroke="url(#accentGold)" stroke-width="2.5"/>
    
    <!-- Stylized Travel/Tour Symbol: Airplane or Musical Note stylized in sleek flat vector -->
    <!-- Representing the global cultural exchange tour context -->
    <path d="M-8 6 L-2 -6 L3 -3 L9 -9 L11 -7 L5 -1 L8 4 L4 5 L-1 1 L-6 8 Z" fill="url(#accentGold)"/>
  </g>

</svg>