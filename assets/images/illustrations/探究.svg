<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Cosmic/Discovery Elements -->
  <g opacity="0.4">
    <!-- Distant stars and celestial dots -->
    <circle cx="45" cy="55" r="1.5" fill="#64748B"/>
    <circle cx="195" cy="45" r="2" fill="#38BDF8"/>
    <circle cx="210" cy="115" r="1" fill="#64748B"/>
    <circle cx="35" cy="140" r="1.5" fill="#38BDF8"/>
    <circle cx="75" cy="200" r="2" fill="#64748B"/>
    <circle cx="170" cy="195" r="1.5" fill="#38BDF8"/>

    <!-- Subtle cosmic orbit rings (Deep inquiry into the universe context) -->
    <ellipse cx="140" cy="110" rx="75" ry="35" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 4" transform="rotate(-15 140 110)"/>
    <ellipse cx="130" cy="120" rx="95" ry="45" fill="none" stroke="#334155" stroke-width="0.75" transform="rotate(-15 130 120)"/>
  </g>

  <!-- Glowing celestial body / Target of exploration -->
  <circle cx="180" cy="85" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="180" cy="85" r="16" fill="#1E293B"/>
  <!-- Planet surface details / glowing core -->
  <path d="M168 80 Q176 75 188 84 Q192 92 180 96 Z" fill="#38BDF8" opacity="0.25"/>
  <circle cx="173" cy="78" r="3" fill="#38BDF8" opacity="0.6"/>

  <!-- Dynamic Beam of Discovery (Light cone from telescope) -->
  <polygon points="105,108 174,78 181,95" fill="#38BDF8" opacity="0.12"/>
  <polygon points="110,112 176,82 181,93" fill="#38BDF8" opacity="0.2"/>

  <!-- Human Character (Action: Investigating / Exploring / 探究) -->
  <!-- Character Body / Torso -->
  <path d="M75 175 L88 135 L112 145 L108 175 Z" fill="#334155"/>
  
  <!-- Character Head -->
  <circle cx="95" cy="118" r="12" fill="#CBD5E1"/>
  <!-- Hair -->
  <path d="M83 115 C83 108 92 105 102 108 C107 110 108 116 107 120 C100 118 90 118 83 115 Z" fill="#0F172A"/>

  <!-- Character Arms interacting with the scientific instrument -->
  <!-- Back arm -->
  <path d="M92 140 L115 130 L125 135" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front arm reaching to adjust/explore -->
  <path d="M98 145 L118 152 L132 138" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hand -->
  <circle cx="134" cy="136" r="3.5" fill="#CBD5E1"/>

  <!-- Scientific Instrument: Modern Sleek Telescope / Probe mechanism -->
  <!-- Telescope Mount / Tripod -->
  <path d="M110 175 L98 215" fill="none" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M110 175 L125 215" fill="none" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M110 175 L112 155" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <!-- Telescope Main Barrel (Angled precisely toward the target) -->
  <g transform="rotate(-25 110 120)">
    <!-- Barrel body -->
    <rect x="75" y="112" width="55" height="18" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <!-- Focus eyepiece -->
    <rect x="70" y="116" width="7" height="10" rx="2" fill="#F59E0B"/>
    <!-- Lens hood -->
    <path d="M125 112 L138 109 L138 131 L125 128 Z" fill="#38BDF8"/>
  </g>

  <!-- Action/Motion Lines indicating active "Deep probing/seeking" (探究) -->
  <path d="M145 98 C152 95 158 92 165 89" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M152 110 C158 107 165 103 170 100" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>

  <!-- Focus / Highlight Accent (Golden spark of discovery) -->
  <path d="M178 72 L180 78 L186 80 L180 82 L178 88 L176 82 L170 80 L176 78 Z" fill="#F59E0B"/>
  <path d="M194 98 L195 101 L198 102 L195 103 L194 106 L193 103 L190 102 L193 101 Z" fill="#F59E0B" opacity="0.8"/>
</svg>