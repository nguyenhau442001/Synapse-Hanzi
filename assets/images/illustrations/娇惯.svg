<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Floor/Ground -->
  <path d="M40 190 H200" stroke="#3A3F4B" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Parent Figure (Standing, leaning forward, hands holding child) -->
  <g transform="translate(140, 190)">
    <circle cx="0" cy="-110" r="15" fill="#FFC107"/>
    <path d="M-20 -95 L20 -95 L15 -40 L-15 -40 Z" fill="#FFC107"/>
    <path d="M-15 -40 L-25 0 M15 -40 L25 0" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Child Figure (Sitting on a pedestal/throne, arms crossed, demanding posture) -->
  <g transform="translate(80, 190)">
    <!-- Throne/Chair -->
    <path d="M-30 0 L30 0 L25 -80 L-25 -80 Z" fill="#3A3F4B"/>
    <path d="M-35 -20 L35 -20" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Child -->
    <circle cx="0" cy="-100" r="20" fill="#E0E0E0"/>
    <path d="M-25 -80 L25 -80 L20 -30 L-20 -30 Z" fill="#E0E0E0"/>
    <path d="M-20 -60 L-40 -50 M20 -60 L40 -50" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Expression: Frowning/Stubborn -->
    <path d="M-8 -105 L8 -105" stroke="#1A1D24" stroke-width="2"/>
  </g>
  
  <!-- Symbolic representation of excessive indulgence: A pile of toys/items being offered -->
  <g transform="translate(140, 140)">
    <rect x="-10" y="-10" width="20" height="20" fill="#FF9800"/>
    <rect x="-15" y="-30" width="30" height="20" fill="#FF5722"/>
  </g>
</svg>