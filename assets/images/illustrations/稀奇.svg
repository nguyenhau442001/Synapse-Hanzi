<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/ambient glow to denote greenhouse/modern tech context -->
  <path d="M40 180 L120 140 L200 180" stroke="#2A303C" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M120 70 L120 140" stroke="#2A303C" stroke-width="2" fill="none"/>
  <circle cx="120" cy="105" r="50" fill="#222834" opacity="0.5"/>

  <!-- Contrast scale exaggeration for "稀奇" (uncommon vs common / exotic in ordinary setting) -->
  <!-- Left side: The ordinary (Snowflake / Winter element, small and fading) -->
  <g transform="translate(70, 115)">
    <!-- Small winter crystal representing commonness/winter -->
    <path d="M0 -15 L0 15 M-13 -7 L13 7 M-13 7 L13 -7" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Right side: The striking contrast (Large, glowing vibrant tropical fruit in winter - representing the once "稀奇" now ordinary, or the concept of exotic wonder) -->
  <g transform="translate(155, 110)">
    <!-- Glow aura -->
    <circle cx="0" cy="0" r="42" fill="#F59E0B" opacity="0.15"/>
    <circle cx="0" cy="0" r="32" fill="#F59E0B" opacity="0.25"/>
    
    <!-- Large scale exaggerated exotic fruit (Pineapple/Tropical motif) -->
    <path d="M-18 10 C-18 28 18 28 18 10 C22 -5 18 -22 0 -30 C-18 -22 -22 -5 -18 10 Z" fill="#F59E0B"/>
    <!-- Fruit texture diamond pattern -->
    <path d="M-12 -5 L12 -5 M-15 5 L15 5 M-8 -15 L8 -15" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0 -30 L-6 -42 M0 -30 L6 -42 M0 -30 L0 -45" stroke="#10B981" stroke-width="3" stroke-linecap="round"/> <!-- Leaves -->
    
    <!-- Sparkle emphasizing rarity/astonishment quality -->
    <path d="M30 -25 L34 -33 L42 -37 L34 -41 L30 -49 L26 -41 L18 -37 L26 -33 Z" fill="#FBBF24"/>
  </g>

  <!-- Central focal comparison bracket / scale indicator showing disparity and remarkable nature -->
  <path d="M95 155 L120 170 L145 155" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="170" r="4" fill="#F59E0B"/>
</svg>