<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 平日 (Ordinary / Weekday / Routine day):
       A sleek, modern wall calendar showing a standard weekday, flanked by a neat desk lamp
       and a coffee cup, representing the rhythm of everyday ordinary life. -->

  <!-- Desk Surface -->
  <path d="M30 190 L210 190" stroke="#2F3542" stroke-width="4" stroke-linecap="round"/>

  <!-- Coffee Mug (Routine element) -->
  <g transform="translate(165, 145)">
    <path d="M10 5 C10 5 12 35 12 40 C12 43 9 45 6 45 L-6 45 C-9 45 -12 43 -12 40 C-12 35 -10 5 -10 5 Z" fill="#3A4454"/>
    <ellipse cx="0" cy="5" rx="10" ry="3" fill="#4F5D73"/>
    <path d="M10 12 C16 12 18 20 13 28" fill="none" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Desk Lamp (Work/Routine element) -->
  <g transform="translate(65, 140)">
    <!-- Base -->
    <ellipse cx="0" cy="45" rx="16" ry="6" fill="#3A4454"/>
    <!-- Stand -->
    <path d="M-8 45 L-15 15 L-5 5" fill="none" stroke="#4F5D73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shade -->
    <path d="M-20 -2 L10 -2 L3 15 L-13 15 Z" fill="#F39C12"/>
    <!-- Light Beam / Glow -->
    <path d="M-15 15 L-30 45 L15 45 Z" fill="#F39C12" opacity="0.1"/>
  </g>

  <!-- Central Calendar Object representing a standard weekday -->
  <g transform="translate(120, 105)">
    <!-- Calendar Back Shadow/Pages -->
    <rect x="-45" y="-55" width="90" height="95" rx="10" fill="#2F3542"/>
    
    <!-- Main Calendar Body -->
    <rect x="-50" y="-60" width="90" height="95" rx="10" fill="#252A34" stroke="#3A4454" stroke-width="2"/>
    
    <!-- Calendar Top Header -->
    <path d="M-50 -50 C-50 -55 -45 -60 -40 -60 L40 -60 C45 -60 50 -55 50 -50 L50 -35 L-50 -35 Z" fill="#F39C12"/>
    
    <!-- Binding Rings -->
    <circle cx="-25" cy="-63" r="4" fill="#A4B0BE"/>
    <circle cx="25" cy="-63" r="4" fill="#A4B0BE"/>

    <!-- Date Grid / Days pattern (representing regular routine days) -->
    <!-- Row 1 -->
    <rect x="-35" y="-22" width="12" height="10" rx="2" fill="#3A4454"/>
    <rect x="-15" y="-22" width="12" height="10" rx="2" fill="#3A4454"/>
    <rect x="5" y="-22" width="12" height="10" rx="2" fill="#3A4454"/>
    <rect x="25" y="-22" width="12" height="10" rx="2" fill="#3A4454"/>

    <!-- Row 2 (Highlighted active weekday) -->
    <rect x="-35" y="-6" width="12" height="10" rx="2" fill="#F39C12" opacity="0.8"/>
    <rect x="-15" y="-6" width="12" height="10" rx="2" fill="#F39C12"/> <!-- Focused Day -->
    <rect x="5" y="-6" width="12" height="10" rx="2" fill="#3A4454"/>
    <rect x="25" y="-6" width="12" height="10" rx="2" fill="#3A4454"/>

    <!-- Row 3 -->
    <rect x="-35" y="10" width="12" height="10" rx="2" fill="#3A4454"/>
    <rect x="-15" y="10" width="12" height="10" rx="2" fill="#3A4454"/>
    <rect x="5" y="10" width="12" height="10" rx="2" fill="#3A4454"/>
    <rect x="25" y="10" width="12" height="10" rx="2" fill="#3A4454"/>
  </g>

</svg>