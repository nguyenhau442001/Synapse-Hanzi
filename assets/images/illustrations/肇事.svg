<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#2D3436"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#4A5568" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- The Offending Vehicle (The "肇事" object) -->
  <g transform="translate(40, 110)">
    <!-- Body -->
    <path d="M10 40 L130 40 L120 10 L80 10 L60 25 L20 25 Z" fill="#E67E22"/>
    <!-- Windows -->
    <path d="M65 15 L85 15 L85 25 L65 25 Z" fill="#1A1D24"/>
    <!-- Wheels -->
    <circle cx="40" cy="45" r="12" fill="#333"/>
    <circle cx="100" cy="45" r="12" fill="#333"/>
    <!-- Impact/Motion Blur effect -->
    <path d="M130 25 L150 20 L130 35 Z" fill="#F1C40F" opacity="0.6"/>
  </g>

  <!-- The Collision Point -->
  <g transform="translate(170, 140)">
    <path d="M0 0 L20 -40 L40 0 L20 10 Z" fill="#E74C3C"/>
    <circle cx="20" cy="-15" r="5" fill="#F1C40F"/>
  </g>

  <!-- Damaged Object (Street Lamp) -->
  <g transform="translate(190, 100)">
    <rect x="0" y="0" width="6" height="80" fill="#95A5A6"/>
    <path d="M-10 -10 L16 -10 L16 0 L-10 0 Z" fill="#34495E"/>
    <path d="M-15 -25 L21 -25 L18 -10 L-12 -10 Z" fill="#F1C40F"/>
  </g>
</svg>