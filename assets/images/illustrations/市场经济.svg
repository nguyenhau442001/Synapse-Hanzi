<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor shadow/line -->
  <line x1="50" y1="185" x2="190" y2="185" stroke="#2A2F3B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Market Building Base Structure -->
  <rect x="70" y="85" width="100" height="90" rx="4" fill="#242936"/>
  <rect x="62" y="75" width="116" height="14" rx="3" fill="#2E3646"/>
  
  <!-- Glass storefront panels -->
  <rect x="82" y="110" width="35" height="65" rx="2" fill="#151821"/>
  <rect x="123" y="110" width="35" height="65" rx="2" fill="#151821"/>
  
  <!-- Market Pillars / Entrance -->
  <rect x="115" y="105" width="10" height="70" fill="#2E3646"/>
  
  <!-- Modern Geometric Roof / Canopy -->
  <polygon points="60,75 120,40 180,75" fill="#3B4252"/>
  
  <!-- Economic Growth Indicator (Glowing Line & Nodes representing "Economic Development") -->
  <polyline points="65,155 95,135 130,145 175,95" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data Nodes on the Line -->
  <circle cx="65" cy="155" r="4" fill="#F5A623"/>
  <circle cx="95" cy="135" r="4" fill="#F5A623"/>
  <circle cx="130" cy="145" r="4" fill="#F5A623"/>
  <circle cx="175" cy="95" r="6" fill="#F5A623"/>
  
  <!-- Central Physical Object Symbolizing Commerce/Market: Stylized Shopping Cart & Coin Integration -->
  <!-- Floating Exchange/Currency Icon (Gold) -->
  <circle cx="120" cy="58" r="14" fill="#F5A623"/>
  <!-- Simplified Currency Symbol inside coin -->
  <path d="M116 51 H124 M116 55 H124 M118 49 V65 M122 49 V65" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Accent lights/windows on building -->
  <rect x="86" y="115" width="27" height="15" rx="1" fill="#3B4252" opacity="0.4"/>
  <rect x="127" y="115" width="27" height="15" rx="1" fill="#3B4252" opacity="0.4"/>
</svg>