<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The Manipulator (The Ambitionist) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#FFB84D"/>
    <rect x="5" y="45" width="30" height="60" rx="5" fill="#FFB84D"/>
    <!-- Hand reaching out with gold coins -->
    <path d="M 0 50 L -40 60 L -35 70 L 5 60 Z" fill="#FFD700"/>
    <circle cx="-45" cy="65" r="6" fill="#FFD700"/>
  </g>

  <!-- The Target (Core Technical Staff) -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="20" fill="#64748B"/>
    <rect x="5" y="45" width="30" height="60" rx="5" fill="#64748B"/>
    <!-- Rejecting gesture -->
    <path d="M 35 55 L 70 45 L 75 55 L 40 65 Z" fill="#EF4444"/>
  </g>

  <!-- The "Temptation" - Gold coins floating between them -->
  <circle cx="120" cy="130" r="8" fill="#FFD700"/>
  <circle cx="110" cy="145" r="6" fill="#FFD700"/>
  <circle cx="130" cy="145" r="6" fill="#FFD700"/>

  <!-- Barrier/Rejection line -->
  <line x1="100" y1="70" x2="100" y2="180" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
</svg>