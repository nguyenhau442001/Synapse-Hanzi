<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(40, 45)">
    <!-- Map / Geographic Boundary (representing the domestic nation/market) -->
    <path d="M25,15 C45,10 75,18 95,10 C115,2 135,15 140,35 C145,55 130,75 140,95 C150,115 135,130 115,135 C95,140 75,125 50,135 C25,145 10,125 15,100 C20,75 5,50 25,15 Z" fill="#252A34" stroke="#3A4256" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Interior pulsing domestic activity zone (Inner Market / Domestic Consumption) -->
    <path d="M45,45 C65,40 85,45 105,50 C115,65 110,85 105,100 C85,110 60,105 45,90 C35,75 35,55 45,45 Z" fill="#1E293B" stroke="#4F46E5" stroke-dasharray="4 4" stroke-width="2"/>

    <!-- Concentric expansion waves radiating inward/outward representing consumption and demand -->
    <circle cx="75" cy="75" r="25" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.4"/>
    <circle cx="75" cy="75" r="42" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
    <circle cx="75" cy="75" r="60" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="1"/>

    <!-- Central physical iconic objects of consumption/retail within the domestic boundary -->
    <!-- Shopping Bag (representing domestic demand/retail) -->
    <path d="M57,70 L93,70 L98,105 C98,108 95,110 92,110 L58,110 C55,110 52,108 52,105 L57,70 Z" fill="#F59E0B"/>
    <path d="M66,70 C66,60 84,60 84,70" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Shopping Cart / Commerce symbol inside -->
    <path d="M65,85 L85,85 L82,98 L68,98 Z" fill="#1A1D24"/>
    <circle cx="70" cy="102" r="2.5" fill="#1A1D24"/>
    <circle cx="80" cy="102" r="2.5" fill="#1A1D24"/>

    <!-- Inward directional arrows symbolizing internal demand (内需) -->
    <path d="M120,40 L105,52 L113,52 L113,58 L127,58 L127,52 L135,52 Z" fill="#38BDF8" transform="rotate(-45 120 48)"/>
    <path d="M30,110 L15,122 L23,122 L23,128 L37,128 L37,122 L45,122 Z" fill="#38BDF8" transform="rotate(-135 30 118)"/>
  </g>
</svg>