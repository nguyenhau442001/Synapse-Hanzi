<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background tree canopy & bench setting -->
  <path d="M 60 180 L 180 180 L 170 195 L 70 195 Z" fill="#2A313C" />
  <path d="M 85 150 L 155 150 L 160 180 L 80 180 Z" fill="#242B35" />
  
  <!-- Tree foliage silhouette representing shade -->
  <circle cx="120" cy="70" r="45" fill="#242B35" opacity="0.6"/>
  <circle cx="90" cy="85" r="35" fill="#242B35" opacity="0.6"/>
  <circle cx="150" cy="85" r="35" fill="#242B35" opacity="0.6"/>

  <!-- Character 1 (Left Child) -->
  <g transform="translate(70, 110)">
    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="16" fill="#E59866"/>
    <path d="M 4 16 C 4 6, 36 6, 36 16 C 36 20, 32 24, 20 25 C 8 24, 4 20, 4 16 Z" fill="#2C3E50"/>
    <!-- Body -->
    <path d="M 8 36 C 8 30, 32 30, 32 36 L 38 65 C 38 68, 2 68, 2 65 Z" fill="#3498DB"/>
    <!-- Arms holding book -->
    <path d="M 10 42 L 30 45 L 35 55 L 20 55 Z" fill="#E59866"/>
  </g>

  <!-- Character 2 (Right Child) -->
  <g transform="translate(130, 110)">
    <!-- Head & Hair -->
    <circle cx="20" cy="20" r="16" fill="#E59866"/>
    <path d="M 4 15 C 10 4, 30 4, 36 15 C 32 23, 8 23, 4 15 Z" fill="#E67E22"/>
    <!-- Body -->
    <path d="M 8 36 C 8 30, 32 30, 32 36 L 38 65 C 38 68, 2 68, 2 65 Z" fill="#E74C3C"/>
    <!-- Arms holding book -->
    <path d="M 30 42 L 10 45 L 5 55 L 20 55 Z" fill="#E59866"/>
  </g>

  <!-- The Sci-Fi Comic Book (Central Focus of "津津有味" - engrossed reading) -->
  <g transform="translate(95, 140)">
    <!-- Open Book Base -->
    <path d="M 0 15 L 25 5 L 50 15 L 50 45 L 25 35 L 0 45 Z" fill="#ECF0F1"/>
    <!-- Book Spine -->
    <line x1="25" y1="5" x2="25" y2="35" stroke="#BDC3C7" stroke-width="2"/>
    <!-- Sci-Fi Cover / Pages Details (Planet & Rocket graphics) -->
    <path d="M 7 20 Q 12 17 17 22" fill="none" stroke="#3498DB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="22" r="5" fill="#F1C40F"/>
    <path d="M 35 25 L 41 19" stroke="#E74C3C" stroke-width="2"/>
  </g>

  <!-- Focus/Absorption visual accents (Sparkles of pure fascination) -->
  <g transform="translate(120, 50)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#F1C40F"/>
  </g>
  <g transform="translate(90, 60)">
    <path d="M 0 -5 L 1 -1 L 5 0 L 1 1 L 0 5 L -1 1 L -5 0 L -1 -1 Z" fill="#F1C40F" opacity="0.8"/>
  </g>
</svg>