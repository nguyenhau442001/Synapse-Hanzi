<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Contextual setting: Midnight winter street (dark moody tones) -->
  <!-- Ground / Road surface -->
  <path d="M0 185 Q120 180 240 185 L240 240 L0 240 Z" fill="#13151A"/>
  <path d="M0 195 L240 195" stroke="#222630" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Distant buildings silhouette in the freezing night -->
  <rect x="25" y="110" width="35" height="75" fill="#15181F"/>
  <rect x="75" y="95" width="45" height="90" fill="#15181F"/>
  <rect x="145" y="120" width="30" height="65" fill="#15181F"/>
  <rect x="190" y="100" width="40" height="85" fill="#15181F"/>

  <!-- Windows in background with cold dim light -->
  <rect x="35" y="125" width="6" height="10" rx="1" fill="#2E3544" opacity="0.6"/>
  <rect x="45" y="125" width="6" height="10" rx="1" fill="#2E3544" opacity="0.6"/>
  <rect x="85" y="110" width="8" height="12" rx="1" fill="#2E3544" opacity="0.6"/>
  <rect x="100" y="110" width="8" height="12" rx="1" fill="#2E3544" opacity="0.6"/>
  <rect x="200" y="115" width="7" height="10" rx="1" fill="#2E3544" opacity="0.6"/>

  <!-- Central Physical Object: A classic street lamp shaking/bending violently from the fierce howling wind -->
  <!-- Lamp base / pole anchored to ground -->
  <path d="M120 185 L125 105" stroke="#3A4252" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Bent upper lamp arm & fixture (visualizing kinetic force & howling impact) -->
  <path d="M125 105 Q128 75 145 68" stroke="#3A4252" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Lamp shade -->
  <path d="M133 63 L157 63 L162 72 L128 72 Z" fill="#4B5563"/>
  <!-- Glowing lamp light piercing the dark -->
  <path d="M136 72 L154 72 L168 125 L122 125 Z" fill="#F59E0B" opacity="0.15"/>
  <circle cx="145" cy="69" r="3" fill="#FBBF24"/>

  <!-- Violent Wind Gusts / Howling Force Visualized via sweeping, fierce dynamic streamlines -->
  <!-- Upper severe howling wind streams (High contrast electric blue/cyan cutting through dark mode) -->
  <path d="M15 50 Q70 45 120 60 T225 50" stroke="#38BDF8" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M5 70 Q55 60 105 78 T230 65" stroke="#E2E8F0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Mid-level turbulent howling gusts swirling around the lamp -->
  <path d="M10 95 Q65 85 115 102 T235 90" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M25 115 Q80 105 130 120 T220 110" stroke="#93C5FD" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Lower fierce gale streams ripping across the cold pavement -->
  <path d="M5 145 Q65 130 135 145 T235 135" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M15 165 Q85 150 150 168 T225 160" stroke="#E2E8F0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Flying debris / frozen snow crystals whipped up by the howling storm -->
  <circle cx="75" cy="85" r="2" fill="#E2E8F0" opacity="0.9"/>
  <path d="M68 83 L72 87" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  
  <circle cx="185" cy="105" r="2.5" fill="#E2E8F0" opacity="0.9"/>
  <path d="M182 103 L188 107" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="95" cy="135" r="1.5" fill="#E2E8F0" opacity="0.9"/>
  <circle cx="165" cy="150" r="2" fill="#E2E8F0" opacity="0.8"/>
  <path d="M162 148 L168 152" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="45" cy="155" r="2" fill="#E2E8F0" opacity="0.9"/>
  <circle cx="205" cy="75" r="1.5" fill="#E2E8F0" opacity="0.7"/>

  <!-- Dynamic impact lines showing sound/vibration of the howling wind ("hūxiào" - roars/screams of wind) -->
  <path d="M110 58 Q118 52 110 46" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M125 50 Q133 42 125 34" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Framing border/stroke matching modern flat app cards -->
  <rect width="240" height="240" rx="24" fill="none" stroke="#2E3544" stroke-width="2"/>
</svg>