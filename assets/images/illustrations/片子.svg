<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing medical backdrop -->
  <circle cx="120" cy="120" r="85" fill="#222B38" opacity="0.6"/>
  <circle cx="120" cy="120" r="70" fill="#2A3649" opacity="0.4"/>

  <!-- X-Ray Light Box (Negatoscope) Frame -->
  <rect x="70" y="45" width="100" height="130" rx="6" fill="#0F1318" stroke="#3A4D6C" stroke-width="3"/>
  
  <!-- Backlight Panel -->
  <rect x="76" y="51" width="88" height="118" rx="3" fill="#E2F1FF" opacity="0.95"/>
  
  <!-- X-Ray Film Sheet (The "Piānzi") -->
  <rect x="84" y="59" width="72" height="102" rx="2" fill="#14233C"/>
  
  <!-- Ribcage Anatomy on X-Ray (Glow/Cyan Lines) -->
  <!-- Spine -->
  <line x1="120" y1="72" x2="120" y2="140" stroke="#4DEEEA" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="76" r="2.5" fill="#14233C"/>
  <circle cx="120" cy="86" r="2.5" fill="#14233C"/>
  <circle cx="120" cy="96" r="2.5" fill="#14233C"/>
  <circle cx="120" cy="106" r="2.5" fill="#14233C"/>
  <circle cx="120" cy="116" r="2.5" fill="#14233C"/>
  <circle cx="120" cy="126" r="2.5" fill="#14233C"/>

  <!-- Left Ribs -->
  <path d="M 120 78 Q 142 78 148 94 Q 152 108 144 122" fill="none" stroke="#4DEEEA" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 120 90 Q 146 92 152 110 Q 156 125 146 142" fill="none" stroke="#4DEEEA" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 120 104 Q 142 108 146 124 Q 150 136 138 150" fill="none" stroke="#4DEEEA" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right Ribs -->
  <path d="M 120 78 Q 98 78 92 94 Q 88 108 96 122" fill="none" stroke="#4DEEEA" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 120 90 Q 94 92 88 110 Q 84 125 94 142" fill="none" stroke="#4DEEEA" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 120 104 Q 98 108 94 124 Q 90 136 102 150" fill="none" stroke="#4DEEEA" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Lungs (Subtle dark translucent shapes) -->
  <path d="M 118 78 C 105 78 98 94 102 115 C 105 130 116 135 118 135 Z" fill="#0A111C" opacity="0.4"/>
  <path d="M 122 78 C 135 78 142 94 138 115 C 135 130 124 135 122 135 Z" fill="#0A111C" opacity="0.4"/>

  <!-- Diagnostic Focus / Magnifying / Accent Glow Element -->
  <circle cx="136" cy="115" r="14" fill="none" stroke="#FFB703" stroke-width="2.5" opacity="0.9"/>
  <line x1="146" y1="125" x2="158" y2="137" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Medical Cross Accent on Lightbox Frame Top-Right -->
  <rect x="150" y="32" width="10" height="4" rx="1" fill="#FFB703"/>
  <rect x="153" y="29" width="4" height="10" rx="1" fill="#FFB703"/>
</svg>