<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Academic podium/desk base -->
    <path d="M-60,70 L60,70 L50,90 L-50,90 Z" fill="#2C3340" />
    <rect x="-35" y="45" width="70" height="25" fill="#3B4659" rx="3" />
    
    <!-- Microphone stand -->
    <rect x="-2" y="15" width="4" height="30" fill="#64748B" />
    <circle cx="0" cy="15" r="5" fill="#94A3B8" />

    <!-- Speaker character (Arrogant posture) -->
    <!-- Torso -->
    <path d="M-25,20 L25,20 L30,45 L-30,45 Z" fill="#38BDF8" />
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="18" fill="#F1F5F9" />
    
    <!-- Academic mortarboard cap -->
    <polygon points="0,-32 28,-22 0,-12 -28,-22" fill="#1E293B" />
    <rect x="-3" y="-23" width="6" height="5" fill="#1E293B" />
    <line x1="20" y1="-18" x2="26" y2="-10" stroke="#F59E0B" stroke-width="2" />
    <circle cx="26" cy="-8" r="2" fill="#F59E0B" />

    <!-- Head tilt / Expression representing absurdity and stubbornness -->
    <path d="M-6,-12 Q0,-8 6,-12" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Smug, stubborn expression -->
    <path d="M-4,-2 Q0,1 5,-3" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Crossed arms showing stubborn defiance -->
    <path d="M-22,25 L0,35 L22,25" fill="none" stroke="#0284C7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dramatic spotlight beam from above highlighting the absurd situation -->
    <path d="M-40,-120 L40,-120 L90,110 L-90,110 Z" fill="#F59E0B" opacity="0.08" />

    <!-- Visual cue of absurdity: A large, prominent floating exclamation mark combined with subtle comedy elements -->
    <g transform="translate(65, -35)">
      <circle cx="0" cy="0" r="18" fill="#EF4444" opacity="0.2" />
      <path d="M0,-10 L0,2" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
      <circle cx="0" cy="9" r="3" fill="#EF4444" />
    </g>
    
    <!-- Tiny abstract comic sweat drop / absurdity indicator -->
    <path d="M-25,-18 Q-22,-25 -19,-18 Q-19,-14 -22,-14 Q-25,-14 -25,-18 Z" fill="#38BDF8" opacity="0.8" />
  </g>
</svg>