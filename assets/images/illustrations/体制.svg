<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definition Context: "体制" (System/Institutional framework) 
       Represented as an interconnected physical architecture/framework of precision gears and structural pillars, 
       signifying an institutional system that supports structural integrity and mechanism flow. -->

  <g transform="translate(120, 118)">
    <!-- Outer structural boundary / Institutional frame -->
    <rect x="-70" y="-70" width="140" height="140" rx="16" fill="none" stroke="#2D3748" stroke-width="4" stroke-dasharray="8 4"/>

    <!-- Central Structural Pillars (representing institutional framework) -->
    <path d="M-50 50 L-50 -30 L-30 -50 L30 -50 L50 -30 L50 50 Z" fill="none" stroke="#4A5568" stroke-width="3" stroke-linejoin="round"/>

    <!-- Integrated Precision Gears (representing the "机制" mechanism within the "体制" system) -->
    <!-- Large Left Gear -->
    <g transform="translate(-22, -5)">
      <circle cx="0" cy="0" r="24" fill="#2563EB" opacity="0.2"/>
      <path d="M-20,-8 L-26,-10 L-24,-16 L-18,-15 M-8,-20 L-10,-26 L-4,-28 L-3,-22 M8,-20 L10,-26 L16,-24 L15,-18 M20,-8 L26,-10 L28,-4 L22,-3" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#3B82F6" stroke-width="4"/>
      <circle cx="0" cy="0" r="6" fill="#1A1D24" stroke="#3B82F6" stroke-width="3"/>
    </g>

    <!-- Medium Right Gear (Interlocking) -->
    <g transform="translate(26, 12)">
      <circle cx="0" cy="0" r="18" fill="#D97706" opacity="0.2"/>
      <path d="M-15,-6 L-20,-8 L-18,-13 L-13,-11 M-6,-15 L-8,-20 L-3,-21 L-2,-16 M6,-15 L8,-20 L13,-18 L11,-13 M15,-6 L20,-8 L21,-3 L16,-2" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#1A1D24" stroke="#F59E0B" stroke-width="2.5"/>
    </g>

    <!-- Top Core Node / Focus Element -->
    <g transform="translate(0, -35)">
      <circle cx="0" cy="0" r="12" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
      <circle cx="0" cy="0" r="4" fill="#F59E0B"/>
    </g>

    <!-- Connecting Institutional Flow Lines -->
    <path d="M-22,19 L-22,42 L35,42 L35,30" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,-23 L0,-47" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>

    <!-- Base Foundation Plate -->
    <rect x="-60" y="58" width="120" height="8" rx="4" fill="#334155"/>
  </g>

  <!-- Accent Detail - Focus Corner Indicators -->
  <path d="M 24 36 L 24 24 L 36 24" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 216 36 L 216 24 L 204 24" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 24 204 L 24 216 L 36 216" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 216 204 L 216 216 L 204 216" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

</svg>