<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Visual Metaphor for "虽说" (Concession / Contrast: Heavy Challenge vs. Unyielding Resolve) -->
  <!-- We use a balanced scale / pivoting structure or contrasting weight vectors to show concession: 
       Side A: Massive, heavy burden (The extreme hardship: 极其艰巨繁重)
       Side B: Uplifted, glowing resolve/action meeting the challenge (充满斗志迎难而上) -->

  <!-- Subtle background grid/glow elements for depth in dark mode -->
  <circle cx="120" cy="120" r="80" fill="#222630" opacity="0.5"/>
  <path d="M 60 140 L 180 140" stroke="#2D3340" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Fulcrum / Pivot Point representing the turning point of concession ("虽说... 但...") -->
  <polygon points="120,130 105,165 135,165" fill="#4F5D73"/>
  <rect x="115" y="165" width="10" height="15" fill="#3B4452" rx="2"/>

  <!-- Seesaw / Balance Beam angled to show tension between heavy weight and dynamic lift -->
  <!-- Rotated group for the beam -->
  <g transform="translate(120, 135) rotate(-15)">
    <!-- Beam bar -->
    <rect x="-80" y="-4" width="160" height="8" rx="4" fill="#64748B"/>
    
    <!-- LEFT SIDE: Heavy Burden (Dark, massive stacked geometric blocks representing hardship) -->
    <g transform="translate(-65, -4)">
      <!-- Heavy load representation: Stacked weighted cubes -->
      <rect x="-18" y="-42" width="36" height="36" rx="4" fill="#E74C3C" opacity="0.9"/>
      <rect x="-14" y="-74" width="28" height="28" rx="3" fill="#C0392B"/>
      <!-- Warning / tension diagonal stripes on the heavy load -->
      <line x1="-12" y1="-12" x2="12" y2="-36" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>
      <line x1="-10" y1="-50" x2="10" y2="-70" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>
      <!-- Hanging rod -->
      <line x1="0" y1="-4" x2="0" y2="-6" stroke="#475569" stroke-width="2"/>
    </g>

    <!-- RIGHT SIDE: Upward Resolve / Counteraction (Vibrant Orange/Gold, representing resilient human effort & morale) -->
    <g transform="translate(65, -4)">
      <!-- Upward surging energy / shield / striving figure metaphor -->
      <path d="M 0,-50 L 18,-15 L 8,-15 L 8,0 L -8,0 L -8,-15 L -18,-15 Z" fill="#F59E0B"/>
      <!-- Glowing core representing "充满斗志" (fighting spirit) -->
      <circle cx="0" cy="-30" r="8" fill="#FBBF24"/>
      <!-- Upward motion arrows -->
      <path d="M 0,-62 L -6,-52 L 6,-52 Z" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Central Pivot Cap -->
  <circle cx="120" cy="133" r="6" fill="#94A3B8"/>

  <!-- Dynamic contrast particles / accent elements floating between the two forces, representing transition -->
  <circle cx="85" cy="95" r="3" fill="#EF4444" opacity="0.6"/>
  <circle cx="155" cy="95" r="4" fill="#F59E0B" opacity="0.8"/>
  <path d="M 105,85 Q 120,75 135,85" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Base grounding line -->
  <rect x="70" y="182" width="100" height="4" rx="2" fill="#2D3340"/>
</svg>