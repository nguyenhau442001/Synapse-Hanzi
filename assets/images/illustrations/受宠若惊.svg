<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Senior Scholar (Left) -->
  <g transform="translate(60, 80)">
    <circle cx="30" cy="25" r="20" fill="#E0E0E0"/>
    <path d="M10 60 Q30 40 50 60 L50 120 L10 120 Z" fill="#4A90E2"/>
    <path d="M25 80 L35 80 L35 110 L25 110 Z" fill="#357ABD"/>
    <path d="M20 50 L40 50 L45 65 L15 65 Z" fill="#E0E0E0"/>
  </g>

  <!-- Young Scholar (Right) - The subject of "受宠若惊" -->
  <g transform="translate(130, 70)">
    <!-- Head with slightly flushed cheeks and wide eyes -->
    <circle cx="30" cy="30" r="22" fill="#FFD1A9"/>
    <circle cx="22" cy="25" r="2" fill="#333"/>
    <circle cx="38" cy="25" r="2" fill="#333"/>
    <ellipse cx="30" cy="38" rx="4" ry="2" fill="#333"/>
    <circle cx="20" cy="32" r="3" fill="#FF9999" opacity="0.6"/>
    <circle cx="40" cy="32" r="3" fill="#FF9999" opacity="0.6"/>
    
    <!-- Body with posture of slight hesitation/bowing -->
    <path d="M10 65 Q30 55 50 65 L45 130 L15 130 Z" fill="#FFB74D"/>
    
    <!-- Hands raised in a gesture of humble surprise -->
    <path d="M5 80 L-10 70" stroke="#FFD1A9" stroke-width="8" stroke-linecap="round"/>
    <path d="M55 80 L70 70" stroke="#FFD1A9" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Golden Laurel/Award held by Senior -->
  <path d="M85 100 C85 90 95 85 105 90 C115 85 125 90 125 100 C125 110 115 115 105 110 C95 115 85 110 85 100 Z" fill="#FFD700"/>
</svg>