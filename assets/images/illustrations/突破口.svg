<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle tech grid / investigation elements -->
  <g opacity="0.15" stroke="#4F5D75" stroke-width="1" stroke-dasharray="2 4">
    <line x1="40" y1="60" x2="200" y2="60"/>
    <line x1="40" y1="120" x2="200" y2="120"/>
    <line x1="40" y1="180" x2="200" y2="180"/>
  </g>

  <!-- Central Object representing "突破口" (Breakthrough point/key evidence breach): 
       A high-tech digital magnifying glass or scanning reticle breaking cleanly through a dark barrier wall, 
       revealing a bright golden key clue underneath, representing the exact context of cracking a cold case. -->
       
  <!-- The Barrier / Wall representing the hard obstacle/cold case -->
  <rect x="50" y="80" width="140" height="90" rx="6" fill="#222733" stroke="#2E3748" stroke-width="2"/>
  
  <!-- Grid lines on the wall (CCTV video feed concept) -->
  <rect x="62" y="92" width="54" height="32" rx="3" fill="#1A1D24"/>
  <rect x="124" y="92" width="54" height="32" rx="3" fill="#1A1D24"/>
  <rect x="62" y="128" width="54" height="32" rx="3" fill="#1A1D24"/>
  <rect x="124" y="128" width="54" height="32" rx="3" fill="#1A1D24"/>

  <!-- The Breakthrough Point: Circular fracture / lens melting through the top-left monitor tile -->
  <circle cx="89" cy="108" r="26" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
  
  <!-- Cracking energy lines radiating from the breach -->
  <path d="M 70 95 L 62 88 M 108 95 L 116 86 M 75 122 L 67 130" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- The "Clue" / Key object revealed inside the breach (Bright Gold Accent) -->
  <g transform="translate(79, 98) scale(0.8)">
    <circle cx="12" cy="12" r="8" fill="none" stroke="#FBBF24" stroke-width="3"/>
    <path d="M 18 18 L 26 26" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 22 23 L 25 21" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass handle extending out dynamically to emphasize active investigation -->
  <path d="M 108 127 L 145 164" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  <rect x="133" y="152" width="22" height="10" rx="3" transform="rotate(45 133 152)" fill="#374151"/>

  <!-- Focus Indicator Light / Spark at the breakthrough point -->
  <circle cx="89" cy="108" r="4" fill="#FFFFFF"/>
  <path d="M 89 94 V 88 M 89 122 V 128 M 75 108 H 69 M 103 108 H 109" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>

</svg>