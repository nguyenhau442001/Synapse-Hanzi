<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow filter for accent elements -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Palm Skin Gradients -->
    <linearGradient id="palmSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="50%" stop-color="#D48C62"/>
      <stop offset="100%" stop-color="#BA6F44"/>
    </linearGradient>
    
    <linearGradient id="palmShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A4A28" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D48C62" stop-opacity="0"/>
    </linearGradient>

    <!-- Callout / Focus ring gradient -->
    <linearGradient id="accentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
  </defs>

  <!-- Ambient background accent representing warmth/craft -->
  <circle cx="120" cy="120" r="75" fill="#F39C12" opacity="0.04"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- TARGET CONCEPT: "手掌" (The Palm of the Hand) -->
  <!-- Designed with strong, weathered proportions (rough, calloused worker's palm context) -->
  
  <g transform="translate(120, 126)">
    <!-- Wrist & Lower Base -->
    <path d="M-32,70 C-32,85 32,85 32,70 L30,42 C20,46 -20,46 -30,42 Z" fill="#9E5832"/>

    <!-- Main Palm Base -->
    <path d="M-45,35 C-52,10 -48,-35 -15,-45 C0,-50 15,-50 28,-42 C52,-28 55,10 42,38 C32,58 -28,62 -45,35 Z" fill="url(#palmSkin)"/>
    
    <!-- Palm Flesh / Thenar & Hypothenar Emminences -->
    <!-- Hypothenar (Left pad) -->
    <path d="M-44,22 C-45,-5 -30,-25 -18,-30 C-22,0 -30,25 -44,22 Z" fill="url(#palmShadow)" opacity="0.4"/>
    <!-- Thenar (Right thumb base pad) -->
    <path d="M36,25 C45,5 35,-20 18,-30 C28,-10 30,15 36,25 Z" fill="url(#palmShadow)" opacity="0.3"/>

    <!-- Distinctive Palm Lines (Life line, Heart line, Wisdom line - clean stylized vector representations) -->
    <g fill="none" stroke="#7A3B1B" stroke-linecap="round" stroke-opacity="0.65">
      <!-- Life Line (Curved around thumb base) -->
      <path d="M22,-22 C5,-10 -5,12 -22,35" stroke-width="3"/>
      <!-- Head Line -->
      <path d="M-12,-20 C-2,-12 15,-8 25,-12" stroke-width="2.5"/>
      <!-- Heart Line -->
      <path d="M-18,-32 C-2,-25 10,-22 22,-28" stroke-width="2.5"/>
      <!-- Minor calloused texture lines (representing "厚厚的老茧与岁月") -->
      <path d="M-32,-15 C-28,-10 -25,-12 -22,-8" stroke-width="2" stroke-opacity="0.4"/>
      <path d="M-28,2 C-22,6 -18,2 -15,8" stroke-width="2" stroke-opacity="0.4"/>
      <path d="M15,8 C22,12 28,5 32,10" stroke-width="2" stroke-opacity="0.4"/>
      <path d="M25,-8 C28,-2 32,2 35,8" stroke-width="2" stroke-opacity="0.4"/>
    </g>

    <!-- Fingers (Anatomically cropped to focus squarely on the palm / shǒuzhǎng) -->
    <!-- Thumb (Left) -->
    <path d="M-45,35 C-60,35 -68,15 -60,-2 C-55,-12 -45,-15 -38,-10 C-46,5 -42,22 -35,30 Z" fill="url(#palmSkin)"/>
    <path d="M-52,18 C-56,10 -55,0 -48,-6" fill="none" stroke="#7A3B1B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Index Finger Stub (Top Left) -->
    <path d="M-28,-42 C-32,-58 -28,-68 -15,-70 C-10,-70 -8,-60 -12,-48 Z" fill="url(#palmSkin)"/>
    <!-- Middle Finger Stub (Top Center-Left) -->
    <path d="M-10,-48 C-12,-65 -5,-75 5,-75 C10,-75 12,-65 8,-48 Z" fill="url(#palmSkin)"/>
    <!-- Ring Finger Stub (Top Center-Right) -->
    <path d="M10,-48 C15,-65 22,-72 30,-68 C35,-65 32,-55 22,-45 Z" fill="url(#palmSkin)"/>
    <!-- Pinky Finger Stub (Top Right) -->
    <path d="M28,-42 C40,-50 48,-42 45,-30 C43,-22 38,-20 35,-25 Z" fill="url(#palmSkin)"/>

    <!-- Fingertip creases / knuckles -->
    <path d="M-22,-45 C-18,-48 -12,-48 -8,-45" fill="none" stroke="#7A3B1B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
    <path d="M2,-48 C6,-50 12,-50 18,-45" fill="none" stroke="#7A3B1B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
  </g>

  <!-- Modern UI Focus Frame (Highlighting the core semantic subject) -->
  <g transform="translate(120, 120)">
    <!-- Corner brackets indicating precise focal item -->
    <path d="M-68,-78 L-82,-78 L-82,-64" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M68,-78 L82,-78 L82,-64" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-68,78 L-82,78 L-82,64" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M68,78 L82,78 L82,64" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>