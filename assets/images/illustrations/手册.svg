<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Handbook Cover -->
    <rect x="20" y="10" width="80" height="100" rx="4" fill="#FFB84D"/>
    <rect x="20" y="10" width="80" height="100" rx="4" fill="none" stroke="#1A1D24" stroke-width="2"/>
    
    <!-- Spine -->
    <rect x="15" y="10" width="5" height="100" rx="1" fill="#E69F30"/>
    
    <!-- Pages inside -->
    <rect x="24" y="14" width="72" height="92" rx="2" fill="#F0F0F0"/>
    
    <!-- Lines representing text -->
    <line x1="30" y1="25" x2="85" y2="25" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="35" x2="85" y2="35" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="45" x2="85" y2="45" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="55" x2="85" y2="55" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="65" x2="85" y2="65" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="75" x2="85" y2="75" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bookmark ribbon -->
    <path d="M70 10 L70 30 L75 25 L80 30 L80 10" fill="#FF5722"/>
  </g>
</svg>