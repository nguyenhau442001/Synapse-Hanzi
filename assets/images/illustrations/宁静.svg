<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background: Distant city silhouette (chaotic/noisy) -->
  <path d="M160 140h60v60h-60z M180 120h30v20h-30z M210 130h10v10h-10z" fill="#2C313C"/>
  <circle cx="200" cy="110" r="2" fill="#FFB86C" opacity="0.5"/>
  <circle cx="170" cy="150" r="2" fill="#FFB86C" opacity="0.3"/>
  
  <!-- Foreground: Rural landscape (calm/peaceful) -->
  <path d="M0 160c40-20 80-20 120 0s80 20 120 0v80H0z" fill="#252932"/>
  
  <!-- The Subject: A single, large, still tree under a crescent moon -->
  <path d="M60 180c-5-30 10-60 40-70 30 10 45 40 40 70" fill="none" stroke="#FFB86C" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 110c-5-15 5-25 15-25s20 10 15 25" fill="#FFB86C" opacity="0.8"/>
  
  <!-- Moon -->
  <path d="M40 40a30 30 0 1 0 0 60 25 25 0 1 1 0-60z" fill="#FFB86C"/>
  
  <!-- Contrast: Still water reflection -->
  <path d="M60 185c10 5 70 5 80 0" fill="none" stroke="#FFB86C" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- Stars for atmosphere -->
  <circle cx="30" cy="30" r="1.5" fill="#FFFFFF"/>
  <circle cx="80" cy="20" r="1" fill="#FFFFFF"/>
  <circle cx="130" cy="40" r="1.5" fill="#FFFFFF"/>
</svg>