<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ancient tomb wall atmosphere background -->
  <path d="M40 200 L200 200" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M60 170 L180 170" stroke="#252A34" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- Coffin Stand / Supports -->
  <rect x="75" y="155" width="16" height="25" rx="3" fill="#2E3544"/>
  <rect x="149" y="155" width="16" height="25" rx="3" fill="#2E3544"/>

  <!-- Main Coffin Body (Warring States Lacquered Wood style - trapezoidal/tapered aesthetic with rich dark reddish-brown wood & gold lacquer details) -->
  <g transform="translate(120, 115)">
    <!-- Back shadow -->
    <path d="M-85,-20 L85,-20 L75,25 L-75,25 Z" fill="#111318" opacity="0.5"/>
    
    <!-- Main wooden body -->
    <path d="M-80,-22 L80,-22 L70,22 L-70,22 Z" fill="#4A2511"/>
    <path d="M-78,-20 L78,-20 L68,20 L-68,20 Z" fill="#5C3017"/>

    <!-- Wood grain texture lines -->
    <path d="M-50,-15 C-30,-18 -10,-10 10,-16 C30,-22 50,-15 65,-18" stroke="#4A2511" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M-60,0 C-40,-3 -20,2 0,-2 C20,-6 40,-2 55,-4" stroke="#4A2511" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- Coffin Lid (slightly raised top plank) -->
    <path d="M-86,-28 L86,-28 L80,-22 L-80,-22 Z" fill="#6B381A"/>
    <path d="M-83,-25 L83,-25" stroke="#8B4A22" stroke-width="1.5" fill="none"/>

    <!-- Traditional Lacquer / Gold cloud/scroll decorative patterns (Warring States style Chu culture motifs) -->
    <g fill="#D4AF37" opacity="0.85">
      <!-- Center pattern -->
      <path d="M-6,0 C-10,-5 -4,-10 0,-5 C4,-10 10,-5 6,0 C10,5 4,10 0,5 C-4,10 -10,5 -6,0 Z"/>
      <!-- Left decorative swirls -->
      <path d="M-40,0 C-45,-4 -50,2 -45,6 C-40,10 -30,2 -35,-4 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="-55" cy="-2" r="2"/>
      <path d="M-22,-4 C-28,-8 -30,-2 -25,2 C-20,6 -15,-2 -22,-4 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      
      <!-- Right decorative swirls -->
      <path d="M40,0 C45,-4 50,2 45,6 C40,10 30,2 35,-4 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="55" cy="-2" r="2"/>
      <path d="M22,-4 C28,-8 30,-2 25,2 C20,6 15,-2 22,-4 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>

      <!-- Border gold trim lines -->
      <line x1="-75" y1="-21" x2="75" y2="-21" stroke="#D4AF37" stroke-width="1.5"/>
      <line x1="-70" y1="21" x2="70" y2="21" stroke="#D4AF37" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Archaeological soft focal lighting / ambiance beam from top -->
  <path d="M70,0 L170,0 L190,180 L50,180 Z" fill="url(#lightBeam)" opacity="0.08"/>
  <defs>
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
  </defs>

  <!-- Focus accent glow underneath -->
  <ellipse cx="120" cy="180" rx="70" ry="8" fill="#D4AF37" opacity="0.15"/>
</svg>