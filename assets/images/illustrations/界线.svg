<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain Range Base -->
  <path d="M40 180 L100 100 L160 180 Z" fill="#2C3440"/>
  <path d="M80 180 L140 80 L200 180 Z" fill="#374151"/>
  
  <!-- The Boundary Line (The "界线") -->
  <path d="M120 60 L120 200" stroke="#F59E0B" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Left Side: Lush Environment -->
  <circle cx="70" cy="150" r="15" fill="#10B981"/>
  <path d="M70 135 L70 120 M70 135 L60 125 M70 135 L80 125" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right Side: Arid Environment -->
  <path d="M170 150 L180 140 L170 130 L160 140 Z" fill="#D97706"/>
  <path d="M170 160 L170 170" stroke="#D97706" stroke-width="2"/>
  <path d="M165 165 L175 165" stroke="#D97706" stroke-width="2"/>
  
  <!-- Ground Line -->
  <path d="M20 180 L220 180" stroke="#4B5563" stroke-width="2"/>
</svg>