<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Crowd silhouettes in background -->
  <g opacity="0.3">
    <path d="M40 240v-60c0-10 10-20 20-20s20 10 20 20v60H40z" fill="#4A5568"/>
    <path d="M100 240v-80c0-10 10-20 20-20s20 10 20 20v80H100z" fill="#4A5568"/>
    <path d="M160 240v-70c0-10 10-20 20-20s20 10 20 20v70H160z" fill="#4A5568"/>
    <path d="M220 240v-50c0-10 10-20 20-20s20 10 20 20v50H220z" fill="#4A5568"/>
  </g>

  <!-- Central Character -->
  <g transform="translate(120, 120)">
    <!-- Motion lines indicating focus/attention -->
    <path d="M-60 -40 L-80 -60 M-60 40 L-80 60 M60 -40 L80 -60 M60 40 L80 60" stroke="#FFD700" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Vibrant Red Dress -->
    <path d="M-25 20 L-35 110 L35 110 L25 20 Z" fill="#E53E3E"/>
    <path d="M-25 20 Q0 0 25 20 Q0 40 -25 20" fill="#C53030"/>
    
    <!-- Body and Head -->
    <circle cx="0" cy="-10" r="25" fill="#FBD38D"/>
    <path d="M-25 20 L-20 10 L20 10 L25 20 Z" fill="#E53E3E"/>
    
    <!-- Hair -->
    <path d="M-25 -10 Q-30 -40 0 -40 Q30 -40 25 -10 Z" fill="#2D3748"/>
    
    <!-- Spotlight/Glow effect -->
    <circle cx="0" cy="40" r="50" fill="url(#grad1)" opacity="0.2"/>
  </g>

  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>