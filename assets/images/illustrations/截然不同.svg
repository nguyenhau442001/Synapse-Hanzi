<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Left Twin: Artistic/Creative Personality -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="0" r="35" fill="#FFB347"/>
    <path d="M-15 -10 Q 0 -25 15 -10" stroke="#1A1D24" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-10" cy="-5" r="3" fill="#1A1D24"/>
    <circle cx="10" cy="-5" r="3" fill="#1A1D24"/>
    <path d="M-10 10 L 10 10 Q 0 20 -10 10" fill="#1A1D24"/>
    <path d="M-20 -30 L -30 -50 M0 -35 L 0 -55 M20 -30 L 30 -50" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Right Twin: Logical/Technical Personality -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="0" r="35" fill="#64B5F6"/>
    <path d="M-15 10 Q 0 25 15 10" stroke="#1A1D24" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-15" y="-15" width="8" height="8" fill="#1A1D24"/>
    <rect x="7" y="-15" width="8" height="8" fill="#1A1D24"/>
    <rect x="-20" y="-40" width="40" height="10" rx="2" fill="#64B5F6"/>
    <rect x="-10" y="-50" width="20" height="10" rx="2" fill="#64B5F6"/>
  </g>

  <!-- Divider Line -->
  <line x1="120" y1="60" x2="120" y2="180" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>
</svg>