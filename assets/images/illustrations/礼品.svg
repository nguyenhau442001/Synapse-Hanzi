<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow effect background for focus -->
  <circle cx="120" cy="120" r="70" fill="#3B82F6" opacity="0.1" filter="blur(20px)"/>

  <!-- Gift Box Shadow -->
  <ellipse cx="120" cy="190" rx="45" ry="10" fill="#111318"/>

  <!-- Gift Box Base -->
  <path d="M 80 110 L 80 175 C 80 183.284 86.7157 190 95 190 L 145 190 C 153.284 190 160 183.284 160 175 L 160 110 Z" fill="#2563EB"/>
  
  <!-- Gift Box Front Ribbon (Vertical) -->
  <path d="M 112 110 L 112 190 L 128 190 L 128 110 Z" fill="#F59E0B"/>

  <!-- Gift Box Lid -->
  <rect x="72" y="94" width="96" height="22" rx="4" fill="#3B82F6"/>
  
  <!-- Lid Ribbon (Vertical) -->
  <path d="M 112 94 L 112 116 L 128 116 L 128 94 Z" fill="#F59E0B"/>

  <!-- Decorative Cultural Pattern on Box (Subtle lines representing heritage/文创) -->
  <path d="M 92 135 L 102 145 M 102 135 L 92 145" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 138 135 L 148 145 M 148 135 L 138 145" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="155" r="4" fill="#1D4ED8"/>

  <!-- Elegant Bow / Ribbon on Top -->
  <!-- Left Loop -->
  <path d="M 120 94 C 110 80 90 75 88 90 C 86 102 105 102 120 94 Z" fill="#D97706"/>
  <!-- Right Loop -->
  <path d="M 120 94 C 130 80 150 75 152 90 C 154 102 135 102 120 94 Z" fill="#FBBF24"/>
  <!-- Center Knot -->
  <rect x="115" y="88" width="10" height="10" rx="2" fill="#B45309"/>
  <!-- Ribbon Tails -->
  <path d="M 115 98 L 100 118 L 107 122 L 117 102 Z" fill="#D97706"/>
  <path d="M 125 98 L 140 118 L 133 122 L 123 102 Z" fill="#FBBF24"/>

  <!-- Sparkles / Accents indicating prestige and cultural gift (礼品/文创) -->
  <path d="M 60 85 L 63 92 L 70 95 L 63 98 L 60 105 L 57 98 L 50 95 L 57 92 Z" fill="#F59E0B" opacity="0.9"/>
  <path d="M 180 135 L 182 140 L 187 142 L 182 144 L 180 149 L 178 144 L 173 142 L 178 140 Z" fill="#3B82F6" opacity="0.8"/>
  <circle cx="170" cy="80" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="75" cy="140" r="2" fill="#3B82F6" opacity="0.7"/>

</svg>