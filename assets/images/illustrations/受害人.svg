<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing the victim (受害人) as a person who has lost something (the empty wallet/hand gesture) 
       and is being restored by the police (the hand returning the funds) -->
  
  <!-- Victim figure (simplified flat style) -->
  <g transform="translate(60, 120)">
    <circle cx="60" cy="-40" r="15" fill="#E0E0E0"/>
    <path d="M45 -25 Q60 -15 75 -25 L70 20 L50 20 Z" fill="#E0E0E0"/>
    <path d="M50 20 L40 60 M70 20 L80 60" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
    <!-- Open empty hand gesture -->
    <path d="M35 10 Q25 5 25 15" stroke="#E0E0E0" stroke-width="4" fill="none"/>
  </g>

  <!-- Police hand returning the money -->
  <g transform="translate(120, 120)">
    <path d="M0 0 L40 0 L35 -20 L5 -20 Z" fill="#FFB300"/> <!-- The money/assets -->
    <path d="M20 0 L20 40" stroke="#4A90E2" stroke-width="10" stroke-linecap="round"/> <!-- Police sleeve -->
    <path d="M10 0 L30 0" stroke="#FFB300" stroke-width="12" stroke-linecap="round"/> <!-- Hand holding money -->
  </g>

  <!-- Subtle visual cue of the recovered asset -->
  <rect x="135" y="100" width="20" height="15" rx="2" fill="#FFD700"/>
  <rect x="138" y="103" width="14" height="9" rx="1" fill="#E6AC00"/>
</svg>