<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground -->
  <path d="M0 200 L240 200 L240 240 L0 240 Z" fill="#2D343E"/>
  
  <!-- The Dog (Aggressive posture) -->
  <g transform="translate(140, 140)">
    <path d="M0 0 L40 0 L35 40 L-10 40 Z" fill="#FF6B6B"/>
    <path d="M30 -10 L50 -20 L40 10 Z" fill="#FF6B6B"/>
    <circle cx="15" cy="15" r="3" fill="#1A1D24"/>
  </g>
  
  <!-- The Boy (Action pose) -->
  <g transform="translate(60, 130)">
    <!-- Body -->
    <rect x="-10" y="0" width="20" height="60" rx="5" fill="#4ECDC4"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="15" fill="#FFE0B2"/>
    <!-- Arm holding stick -->
    <path d="M10 10 L40 -10" stroke="#FFE0B2" stroke-width="8" stroke-linecap="round"/>
    <!-- The Stick (The "Wit" / Solution) -->
    <path d="M35 -20 L70 10" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-12" y="60" width="8" height="10" fill="#4ECDC4"/>
    <rect x="4" y="60" width="8" height="10" fill="#4ECDC4"/>
  </g>

  <!-- Lightbulb/Idea Spark (Representing the "Wit" born from crisis) -->
  <g transform="translate(120, 80)">
    <path d="M0 -20 A 15 15 0 0 1 0 10 A 15 15 0 0 1 0 -20" fill="#FFD93D"/>
    <rect x="-4" y="10" width="8" height="5" fill="#FFD93D"/>
    <path d="M-10 -10 L-20 -20 M10 -10 L20 -20 M0 -25 L0 -35" stroke="#FFD93D" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>