<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid representing secure digital network -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="0.5">
    <line x1="30" y1="40" x2="210" y2="40" />
    <line x1="30" y1="90" x2="210" y2="90" />
    <line x1="30" y1="140" x2="210" y2="140" />
    <line x1="30" y1="190" x2="210" y2="190" />
    <line x1="50" y1="20" x2="50" y2="220" />
    <line x1="100" y1="20" x2="100" y2="220" />
    <line x1="150" y1="20" x2="150" y2="220" />
    <line x1="200" y1="20" x2="200" y2="220" />
  </g>

  <!-- Central Physical Object: A Secure Classified Document Folder / Data Container -->
  <!-- Back cover -->
  <path d="M 65 75 L 105 75 L 120 90 L 175 90 C 180.5 90, 185 94.5, 185 100 L 185 170 C 185 175.5, 180.5 180, 175 180 L 65 180 C 59.5 180, 55 175.5, 55 170 L 55 85 C 55 79.5, 59.5 75, 65 75 Z" fill="#2563EB" />
  
  <!-- Folder tab -->
  <path d="M 65 62 L 115 62 C 118 62, 120 64, 122 67 L 132 75 L 65 75 Z" fill="#3B82F6" />

  <!-- Confidential Stamp (Top Secret) -->
  <rect x="70" y="95" width="55" height="18" rx="2" fill="#EF4444" opacity="0.9"/>
  <rect x="73" y="98" width="49" height="12" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,1"/>

  <!-- Inside Paper / Data Sheet -->
  <path d="M 75 110 L 165 110 L 165 168 L 75 168 Z" fill="#F8FAFC" />
  <!-- Abstract secret text lines on paper -->
  <rect x="85" y="122" width="60" height="4" rx="1" fill="#94A3B8" />
  <rect x="85" y="134" width="70" height="4" rx="1" fill="#94A3B8" />
  <rect x="85" y="146" width="45" height="4" rx="1" fill="#94A3B8" />

  <!-- Front cover (slightly open/slanted to reveal leak) -->
  <path d="M 55 90 L 120 90 L 105 180 L 65 180 C 59.5 180, 55 175.5, 55 170 Z" fill="#1D4ED8" />

  <!-- THE LEAK: Glowing data bits escaping / leaking out to the right -->
  <!-- Glowing data stream trail -->
  <path d="M 160 135 C 175 130, 185 115, 205 105" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M 155 145 C 170 145, 190 140, 215 150" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3" opacity="0.9"/>

  <!-- Escaping Data Packets / Bits (Glowing Orbs and Binary-like fragments) -->
  <circle cx="170" cy="120" r="4" fill="#F59E0B" />
  <circle cx="190" cy="100" r="6" fill="#EF4444" />
  <circle cx="215" cy="90" r="3" fill="#F59E0B" />
  
  <rect x="195" y="135" width="10" height="7" rx="1.5" fill="#EF4444" />
  <rect x="175" y="155" width="12" height="8" rx="1.5" fill="#F59E0B" />
  <circle cx="210" cy="165" r="4" fill="#EF4444" />

  <!-- Focus / Focal Highlight on the breach point -->
  <circle cx="150" cy="130" r="16" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
</svg>