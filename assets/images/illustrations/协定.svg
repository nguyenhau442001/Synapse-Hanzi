<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#2D3342" opacity="0.4"/>

  <!-- Decorative contract/treaty document base -->
  <g transform="translate(68, 48)">
    <!-- Document shadow/back page -->
    <rect x="8" y="8" width="88" height="116" rx="6" fill="#252A34" opacity="0.7"/>
    
    <!-- Main Document Page -->
    <rect x="0" y="0" width="88" height="116" rx="6" fill="#E2E8F0"/>
    
    <!-- Document Header Accent -->
    <path d="M 0 6 C 0 2.686 2.686 0 6 0 L 82 0 C 85.314 0 88 2.686 88 6 L 88 24 L 0 24 Z" fill="#3B82F6"/>
    
    <!-- Text lines representation -->
    <rect x="14" y="36" width="40" height="4" rx="2" fill="#94A3B8"/>
    <rect x="14" y="46" width="60" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="14" y="53" width="50" height="3" rx="1.5" fill="#CBD5E1"/>
    
    <rect x="14" y="68" width="45" height="4" rx="2" fill="#94A3B8"/>
    <rect x="14" y="78" width="60" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="14" y="85" width="35" height="3" rx="1.5" fill="#CBD5E1"/>

    <!-- Gold Wax Seal / Official Agreement Emblem -->
    <g transform="translate(52, 90)">
      <circle cx="16" cy="16" r="16" fill="#D97706"/>
      <circle cx="16" cy="16" r="12" fill="#F59E0B"/>
      <!-- Checkmark inside seal representing agreement/treaty finalized -->
      <path d="M 10 16 L 14 20 L 22 12" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Fountain Pen Overlay symbolizing the signing of the treaty -->
  <g transform="translate(130, 95) rotate(-35)">
    <!-- Pen Nib -->
    <path d="M 12 0 L 20 16 L 16 18 L 8 18 L 4 16 Z" fill="#E2E8F0"/>
    <path d="M 12 0 L 20 16 L 12 28 L 4 16 Z" fill="#F8FAFC"/>
    <path d="M 12 6 L 12 20" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="12" cy="22" r="1.5" fill="#94A3B8"/>
    
    <!-- Pen Body -->
    <rect x="7" y="-36" width="10" height="36" rx="2" fill="#F59E0B"/>
    <!-- Pen Clip -->
    <rect x="11" y="-32" width="2" height="16" rx="1" fill="#FEF3C7"/>
    <!-- Pen Cap End -->
    <path d="M 7 -36 C 7 -38 9 -40 12 -40 C 15 -40 17 -38 17 -36 Z" fill="#D97706"/>
  </g>

  <!-- Subtle accent dots for modern aesthetic -->
  <circle cx="45" cy="70" r="3" fill="#3B82F6" opacity="0.6"/>
  <circle cx="195" cy="150" r="4" fill="#F59E0B" opacity="0.6"/>
  <circle cx="70" cy="190" r="2.5" fill="#10B981" opacity="0.6"/>
</svg>