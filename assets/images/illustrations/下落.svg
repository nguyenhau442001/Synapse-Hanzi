<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow to indicate discovery / locating -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#3A4252" stroke-width="1"/>
  
  <!-- Target Pin / Location Marker (Representing 'tung tích; nơi chốn' / whereabouts) -->
  <g transform="translate(0, -5)">
    <!-- Pin shadow -->
    <ellipse cx="120" cy="175" rx="18" ry="6" fill="#111318"/>
    
    <!-- Outer location pin body -->
    <path d="M120 45 C97.9 45 80 62.9 80 85 C80 115 120 160 120 160 C120 160 160 115 160 85 C160 62.9 142.1 45 120 45 Z" fill="#F59E0B"/>
    
    <!-- Inner cutout / detail of the pin -->
    <circle cx="120" cy="85" r="22" fill="#1A1D24"/>
  </g>
  
  <!-- Physical Object representing the recovered treasure / artifact inside the location marker -->
  <g transform="translate(0, -5)">
    <!-- Ancient Chinese bronze vessel (ding/zun silhouette) representing the historic cultural artifact mentioned in context -->
    <path d="M110 74 L130 74 L133 82 C133 85 130 88 126 88 L114 88 C110 88 107 85 107 82 Z" fill="#FBBF24"/>
    <path d="M106 91 L134 91 L131 106 C131 112 126 116 120 116 C114 116 109 112 109 106 Z" fill="#FBBF24"/>
    <!-- Artifact stand / base -->
    <rect x="113" y="116" width="14" height="4" rx="1" fill="#FBBF24"/>
  </g>
  
  <!-- Focus / Discovery indicator (Crosshair/Corner accents) -->
  <path d="M75 90 L75 75 L90 75" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165 90 L165 75 L150 75" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M75 145 L75 160 L90 160" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165 145 L165 160 L150 160" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>