<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Setting: Dark alleyway representing the contextual sentence -->
  <!-- Distant brick wall / alley perspective -->
  <path d="M40 200 L90 80 L150 80 L200 200 Z" fill="#222730"/>
  <!-- Ground -->
  <path d="M0 170 L240 170 L240 240 L0 240 Z" fill="#14171D"/>
  
  <!-- Subtle warm alley light casting from above/side -->
  <path d="M90 80 L30 200 L0 200 L0 170 Z" fill="#2A303C" opacity="0.4"/>

  <!-- Character 1: The lone pedestrian (Vulnerable traveler) -->
  <g transform="translate(75, 110)">
    <!-- Body/Coat -->
    <path d="M12 30 L28 30 L34 75 L6 75 Z" fill="#64748B"/>
    <!-- Head -->
    <circle cx="20" cy="16" r="10" fill="#CBD5E1"/>
    <!-- Legs -->
    <rect x="11" y="75" width="6" height="35" fill="#475569"/>
    <rect x="23" y="75" width="6" height="35" fill="#475569"/>
    <!-- Carrying a small bag -->
    <rect x="32" y="45" width="8" height="12" rx="2" fill="#94A3B8"/>
    <path d="M35 45 C35 40 37 40 36 37" stroke="#64748B" stroke-width="2" fill="none"/>
  </g>

  <!-- Character 2: The masked robber (Foreground threat - holding up) -->
  <g transform="translate(130, 95)">
    <!-- Body / Dark jacket -->
    <path d="M15 35 L35 35 L42 80 L8 80 Z" fill="#334155"/>
    <!-- Masked Head (Black balaclava with eye holes) -->
    <circle cx="25" cy="18" r="11" fill="#0F172A"/>
    <!-- Eye highlights -->
    <circle cx="22" cy="16" r="1.5" fill="#F59E0B"/>
    <circle cx="28" cy="16" r="1.5" fill="#F59E0B"/>
    
    <!-- Raised arm threatening / intercepting -->
    <path d="M15 40 L-10 32 L-8 28 L15 36 Z" fill="#334155"/>
    
    <!-- Legs -->
    <rect x="12" y="80" width="7" height="40" fill="#1E293B"/>
    <rect x="23" y="80" width="7" height="40" fill="#1E293B"/>
  </g>

  <!-- Dramatic Highlight / Flash / Focus (Orange/Gold accent for flashcard impact) -->
  <circle cx="95" cy="125" r="2" fill="#F59E0B"/>
  <path d="M90 120 L100 130 M100 120 L90 130" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- High contrast framing element / subtle vignette -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
</svg>