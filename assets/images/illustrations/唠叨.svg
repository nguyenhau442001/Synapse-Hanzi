<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mother character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 100 Q-40 60 0 60 Q40 60 40 100 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="25" fill="#E2E8F0"/>
    <!-- Hair -->
    <path d="M-25 30 Q-25 0 0 0 Q25 0 25 30 Z" fill="#2D3748"/>
    
    <!-- Speech bubbles representing "唠叨" (repetition/nagging) -->
    <g fill="#F6AD55">
      <!-- Small bubble -->
      <circle cx="60" cy="-20" r="8"/>
      <!-- Medium bubble -->
      <circle cx="80" cy="0" r="12"/>
      <!-- Large bubble -->
      <circle cx="100" cy="30" r="18"/>
      
      <!-- Connection lines to mouth -->
      <path d="M20 30 L52 -15" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 30 L70 5" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 30 L85 25" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Expressive mouth (open, speaking) -->
    <path d="M-5 40 Q0 45 5 40" stroke="#1A1D24" stroke-width="2" fill="none"/>
    
    <!-- Caring gesture: Hand raised slightly as if giving advice -->
    <path d="M40 50 L60 30" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>