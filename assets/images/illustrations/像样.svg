<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual Object: A sleek, polished modern software prototype interface floating on a refined device/platform (representing "像样" - decent, polished, professional-grade) -->
  
  <!-- Device/Platform Base -->
  <path d="M60 168 L180 168 L190 184 L50 184 Z" fill="#2F3643"/>
  <rect x="85" y="184" width="70" height="6" rx="3" fill="#4B5563"/>

  <!-- Main Display Tablet / Prototype Screen -->
  <rect x="55" y="48" width="130" height="112" rx="10" fill="#222730" stroke="#3A4354" stroke-width="2"/>
  
  <!-- Screen Header Bar -->
  <rect x="55" y="48" width="130" height="18" rx="10" fill="#2B323F"/>
  <circle cx="67" cy="57" r="3" fill="#EF4444"/>
  <circle cx="77" cy="57" r="3" fill="#F59E0B"/>
  <circle cx="87" cy="57" r="3" fill="#10B981"/>

  <!-- Polished UI Content inside the Prototype -->
  <!-- Sidebar -->
  <rect x="67" y="78" width="24" height="70" rx="4" fill="#2B323F"/>
  <rect x="73" y="86" width="12" height="4" rx="2" fill="#4B5563"/>
  <rect x="73" y="96" width="12" height="4" rx="2" fill="#4B5563"/>
  <rect x="73" y="106" width="12" height="4" rx="2" fill="#4B5563"/>

  <!-- Dashboard Cards (representing high quality/professional finish) -->
  <!-- Card 1 -->
  <rect x="99" y="78" width="74" height="32" rx="4" fill="#2B323F"/>
  <rect x="107" y="86" width="24" height="6" rx="2" fill="#60A5FA"/>
  <rect x="107" y="96" width="45" height="4" rx="2" fill="#4B5563"/>
  
  <!-- Card 2 with Accent (Success / Professional Grade) -->
  <rect x="99" y="116" width="74" height="32" rx="4" fill="#2B323F"/>
  <rect x="107" y="124" width="24" height="6" rx="2" fill="#34D399"/>
  <!-- Trend Graph Line inside Card 2 -->
  <path d="M 143 138 L 150 134 L 157 136 L 164 126" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Golden Accent Star/Badge indicating "Top Quality / 成熟像样" -->
  <g transform="translate(165, 38)">
    <circle cx="15" cy="15" r="16" fill="#F59E0B" opacity="0.2"/>
    <circle cx="15" cy="15" r="12" fill="#F59E0B"/>
    <!-- Checkmark icon inside the badge -->
    <path d="M10 15 L13 18 L20 11" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>