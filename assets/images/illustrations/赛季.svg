<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "赛季" (Sports Season / Championship Trophy & Calendar Motif) -->
  <g transform="translate(120, 115)">
    <!-- Subtle glow background circle -->
    <circle cx="0" cy="5" r="70" fill="#252A34" />
    
    <!-- Calendar/Season base element (Backdrop representing time/period) -->
    <path d="M-45,-40 L45,-40 C50,-40 55,-35 55,-30 L55,50 C55,55 50,60 45,60 L-45,60 C-50,60 -55,55 -55,50 L-55,-30 C-55,-35 -50,-40 -45,-40 Z" fill="#2D3342" />
    
    <!-- Calendar rings -->
    <rect x="-28" y="-50" width="8" height="18" rx="4" fill="#F59E0B" />
    <rect x="20" y="-50" width="8" height="18" rx="4" fill="#F59E0B" />
    
    <!-- Calendar inner page/panel -->
    <rect x="-42" y="-20" width="84" height="72" rx="4" fill="#1A1D24" />
    
    <!-- Championship Trophy (Represents the culmination of a season/competition) -->
    <!-- Trophy Handles -->
    <path d="M-22,-10 C-35,-10 -35,15 -22,20" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
    <path d="M22,-10 C35,-10 35,15 22,20" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
    
    <!-- Trophy Cup Body -->
    <path d="M-18,-18 L18,-18 C15,18 -15,18 -18,-18 Z" fill="#FBBF24" />
    
    <!-- Trophy Rim -->
    <ellipse cx="0" cy="-18" rx="18" ry="4" fill="#F59E0B" />
    
    <!-- Trophy Stem and Base -->
    <rect x="-3" y="18" width="6" height="14" fill="#D97706" />
    <path d="M-12,32 L12,32 C14,36 10,38 8,38 L-8,38 C-10,38 -14,36 -12,32 Z" fill="#F59E0B" />

    <!-- Star Emblem on Trophy -->
    <polygon points="0,0 2,5 7,5 3,8 5,13 0,10 -5,13 -3,8 -7,5 -2,5" fill="#FEF3C7" transform="translate(0, -3) scale(0.6)" />

    <!-- Dynamic Sport Accent Elements (Flying confetti/sparkles for competitive energy) -->
    <circle cx="-55" cy="-10" r="3" fill="#F59E0B" />
    <circle cx="62" cy="15" r="4" fill="#FBBF24" />
    <circle cx="50" cy="-35" r="2.5" fill="#38BDF8" />
    <circle cx="-48" cy="35" r="2" fill="#38BDF8" />
  </g>
</svg>