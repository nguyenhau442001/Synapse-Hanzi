<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle design elements -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#262B35" stroke-width="2" stroke-dasharray="4 6"/>
  
  <!-- Central Physical Object: Modern Vault / Treasury Chest (Physical Object representing 税收 - Tax Collection/Revenue) -->
  <g transform="translate(120, 115)">
    <!-- Vault Shadow -->
    <ellipse cx="0" cy="72" rx="48" ry="12" fill="#12141A" opacity="0.6"/>

    <!-- Vault Main Body (3D isometric-flat look) -->
    <path d="M -54,-24 L 54,-24 L 54,48 L -54,48 Z" fill="#2C3545"/>
    <path d="M -54,-24 L 0,-42 L 54,-24 L 0,-6 Z" fill="#3B475B"/>
    
    <!-- Vault Door / Front Panel -->
    <rect x="-42" y="-18" width="84" height="60" rx="4" fill="#222831"/>
    
    <!-- Gold Coins inside/emerging symbolizing revenue collection -->
    <g transform="translate(0, -6)">
      <!-- Coin stack 1 -->
      <ellipse cx="-16" cy="0" rx="10" ry="5" fill="#E5A93B"/>
      <path d="M -26,0 L -26,-6 C -26,-8.76 -16,-11 -16,-11 C -16,-11 -6,-8.76 -6,-6 L -6,0 Z" fill="#F4B843"/>
      <ellipse cx="-16" cy="-6" rx="10" ry="5" fill="#FBD365"/>

      <!-- Coin stack 2 -->
      <ellipse cx="16" cy="6" rx="10" ry="5" fill="#C68A27"/>
      <path d="M 6,6 L 6,0 C 6,-2.76 16,-5 16,-5 C 16,-5 26,-2.76 26,0 L 26,6 Z" fill="#E5A93B"/>
      <ellipse cx="16" cy="0" rx="10" ry="5" fill="#F4B843"/>
    </g>

    <!-- Vault Handle/Dial -->
    <circle cx="0" cy="12" r="14" fill="#1A1D24" stroke="#F4B843" stroke-width="3"/>
    <circle cx="0" cy="12" r="4" fill="#F4B843"/>
    <line x1="0" y1="2" x2="0" y2="8" stroke="#F4B843" stroke-width="2" stroke-linecap="round"/>

    <!-- Structural metal banding -->
    <rect x="-50" y="-20" width="100" height="4" fill="#F4B843" opacity="0.8" rx="2"/>
    <rect x="-50" y="40" width="100" height="4" fill="#F4B843" opacity="0.8" rx="2"/>
    
    <!-- Rivets -->
    <circle cx="-46" cy="-18" r="1.5" fill="#E5A93B"/>
    <circle cx="46" cy="-18" r="1.5" fill="#E5A93B"/>
    <circle cx="-46" cy="42" r="1.5" fill="#E5A93B"/>
    <circle cx="46" cy="42" r="1.5" fill="#E5A93B"/>
  </g>

  <!-- Flowing Gold Coins and Arrow indicating public contribution & collection loop (取之于民也用之于民) -->
  <g fill="#F4B843">
    <!-- Floating Coin Left -->
    <g transform="translate(48, 80) rotate(-15)">
      <ellipse cx="0" cy="0" rx="8" ry="4" fill="#E5A93B"/>
      <ellipse cx="0" cy="-2" rx="8" ry="4" fill="#FBD365"/>
    </g>
    <!-- Floating Coin Right -->
    <g transform="translate(192, 80) rotate(15)">
      <ellipse cx="0" cy="0" rx="8" ry="4" fill="#E5A93B"/>
      <ellipse cx="0" cy="-2" rx="8" ry="4" fill="#FBD365"/>
    </g>
    <!-- Small sparkles / financial tokens -->
    <circle cx="76" cy="62" r="3" fill="#FBD365"/>
    <circle cx="164" cy="62" r="3" fill="#FBD365"/>
  </g>

  <!-- Connecting curved directional flow lines (subtle, representing public revenue exchange) -->
  <path d="M 64,120 C 64,90 90,75 110,72" fill="none" stroke="#F4B843" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 176,120 C 176,90 150,75 130,72" fill="none" stroke="#F4B843" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.6"/>

  <!-- Base platform supporting the vault -->
  <rect x="80" y="196" width="80" height="6" rx="3" fill="#3B475B"/>
</svg>