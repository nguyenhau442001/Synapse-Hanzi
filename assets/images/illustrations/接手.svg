<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Industrial Factory Background Elements -->
  <path d="M 40 180 L 70 140 L 100 180 Z" fill="#222732" opacity="0.6"/>
  <path d="M 90 180 L 130 120 L 170 180 Z" fill="#222732" opacity="0.6"/>
  <rect x="30" y="180" width="180" height="4" fill="#2A303C" rx="2"/>
  
  <!-- Central Focus: "接手" (Taking over/Handing over responsibilities or management) -->
  <!-- Two stylized business figures representing the outgoing manager and incoming general manager -->
  
  <!-- Outgoing Manager (Left - passing on) -->
  <g transform="translate(0, 0)">
    <!-- Body/Suit -->
    <path d="M 65 140 C 65 125 75 115 90 115 C 105 115 115 125 115 140 L 115 185 L 65 185 Z" fill="#2E384D"/>
    <!-- Head -->
    <circle cx="90" cy="95" r="14" fill="#D0D7DE"/>
    <!-- Hair (older/greyer tone) -->
    <path d="M 76 92 C 76 84 84 81 90 81 C 97 81 104 84 104 92 Z" fill="#8B949E"/>
    <!-- Arm reaching out to pass item -->
    <path d="M 105 130 Q 125 135 135 140" stroke="#2E384D" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Incoming Manager (Right - taking over/Jiēshǒu) -->
  <g transform="translate(0, 0)">
    <!-- Body/Suit -->
    <path d="M 125 140 C 125 125 135 115 150 115 C 165 115 175 125 175 140 L 175 185 L 125 185 Z" fill="#1F6FEB"/>
    <!-- Head -->
    <circle cx="150" cy="95" r="14" fill="#E6EDF3"/>
    <!-- Hair (energetic modern cut) -->
    <path d="M 136 92 C 136 83 144 80 152 80 C 160 80 164 85 164 92 Z" fill="#484F58"/>
    <!-- Arm reaching out to receive -->
    <path d="M 135 138 Q 115 138 105 140" stroke="#1F6FEB" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Central Object of Responsibility: Briefcase / Industrial Operations Ledger / Control Module -->
  <g transform="translate(97, 126)">
    <!-- Main Case Body -->
    <rect x="0" y="8" width="46" height="30" rx="4" fill="#F0883E"/>
    <!-- Metal clasp / accent -->
    <rect x="18" y="6" width="10" height="4" rx="2" fill="#E6EDF3"/>
    <!-- Handle -->
    <path d="M 13 8 C 13 2 33 2 33 8" stroke="#E6EDF3" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Subtle digital/data lines indicating management/operations -->
    <line x1="8" y1="18" x2="38" y2="18" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="8" y1="26" x2="28" y2="26" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Directional / Action Indicator: Smooth handoff arc overlay -->
  <path d="M 100 112 Q 120 98 140 112" stroke="#F0883E" stroke-width="3" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
  
  <!-- Dynamic focus glow behind the transfer point -->
  <circle cx="120" cy="138" r="30" fill="#F0883E" opacity="0.1" filter="blur(8px)"/>
</svg>