<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(40, 45)">
    {/* Academic Monograph / Scholarly Book */}
    
    {/* Shadow / Depth */}
    <path d="M20 135 L140 135 L160 150 L40 150 Z" fill="#111317" opacity="0.6"/>
    
    {/* Book Pages Block (Thickness) */}
    <path d="M25 45 L135 45 L135 135 L25 135 Z" fill="#D8DCE3"/>
    <path d="M28 48 L132 48 L132 132 L28 132 Z" fill="#EAEFF8"/>
    {/* Page Lines representing deep academic text */}
    <line x1="45" y1="65" x2="115" y2="65" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="80" x2="115" y2="80" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="95" x2="95" y2="95" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="110" x2="105" y2="110" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    {/* Hard Cover Base (Back & Spine hints) */}
    <path d="M20 40 L140 40 L140 140 L20 140 Z" fill="#1E293B" rx="4"/>
    
    {/* Front Cover (Deep Rich Navy/Slate with Gold Academic Accents) */}
    <path d="M22 38 L138 38 L138 138 L22 138 Z" fill="#2563EB" rx="3"/>
    
    {/* Cover Border Frame (Gold/Amber for prestige) */}
    <rect x="30" y="46" width="100" height="84" rx="2" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <rect x="34" y="50" width="92" height="76" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.6"/>

    {/* Central Academic Emblem / Crest on Cover */}
    <circle cx="80" cy="74" r="14" fill="#1E3A8A" stroke="#F59E0B" stroke-width="2"/>
    <path d="M74 74 L80 66 L86 74 L80 82 Z" fill="#F59E0B"/>

    {/* Title / Author Placeholder Lines on Cover */}
    <line x1="50" y1="102" x2="110" y2="102" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="114" x2="100" y2="114" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    {/* Spine (Left side extension) */}
    <path d="M15 37 L22 38 L22 138 L15 137 Z" fill="#1D4ED8"/>
    
    {/* Bookmark Ribbon hanging down */}
    <path d="M105 38 L117 38 L117 75 L111 68 L105 75 Z" fill="#EF4444"/>

    {/* Scholarly Laurel Wreath / Feather Pen Accents resting on the book */}
    {/* Golden Quill Pen */}
    <g transform="translate(110, 15) rotate(25)">
      <path d="M15 0 C12 20 2 50 -10 70 C-5 70 0 65 5 55 C12 40 18 20 22 0 Z" fill="#FBBF24"/>
      <path d="M15 0 C12 20 2 50 -10 70 C-6 65 0 50 8 20 Z" fill="#F59E0B"/>
      <line x1="12" y1="5" x2="-2" y2="55" stroke="#FEF3C7" stroke-width="1.5"/>
      {/* Nib */}
      <path d="M-10 70 L-6 65 L-12 60 Z" fill="#94A3B8"/>
    </g>

    {/* Sparkle of Deep Knowledge / Focus Accent */}
    <path d="M150 30 Q150 45 165 45 Q150 45 150 60 Q150 45 135 45 Q150 45 150 30 Z" fill="#FBBF24" opacity="0.9"/>
    <path d="M25 15 Q25 25 35 25 Q25 25 25 35 Q25 25 15 25 Q25 25 25 15 Z" fill="#FBBF24" opacity="0.6"/>
  </g>
</svg>