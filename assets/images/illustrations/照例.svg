  <path d="M112 130 L124 118" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>

  <!-- Legs in running stride -->
  <path d="M100 156 L88 178 L78 185" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 156 L122 174 L132 188" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Motion lines indicating habitual/repeating movement (routine) -->
  <path d="M55 145 C65 145, 70 140, 75 140" stroke="#FFB74D" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M45 160 C55 160, 60 155, 65 155" stroke="#FFB74D" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Clock overlay or subtle daily routine indicator (symbolizing "as usual / routine") -->
