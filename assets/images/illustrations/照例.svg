  <circle cx="185" cy="65" r="2" fill="#FFB74D"/>
  <path d="M185 53 L185 65 L193 65" stroke="#FFB74D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small repeating arrows around clock to reinforce "routine / as always" -->
  <path d="M165 65 A20 20 0 0 1 185 45" stroke="#FFB74D" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="183,42 187,45 183,48" fill="#FFB74D"/>

</svg>