  <path d="M20 180 Q80 160 140 180 T240 175 L240 240 L0 240 Z" fill="#242B38"/>
  <path d="M0 195 Q90 180 180 195 T240 190 L240 240 L0 240 Z" fill="#1E2430"/>

  <!-- Water body representing the artificial lake -->
  <path d="M30 210 C70 200, 170 200, 220 215 C230 218, 230 240, 230 240 L10 240 C10 240, 20 213, 30 210 Z" fill="#2E4A62"/>
  <path d="M60 220 Q90 215 120 220" stroke="#4F7C9E" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M150 225 Q175 221 200 226" stroke="#4F7C9E" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Central Physical Object / Character symbolizing "照例" (The routine morning jogger / daily habit) -->
  <!-- Elderly runner silhouette/flat design -->
  <!-- Head & Hat -->
  <circle cx="105" cy="115" r="9" fill="#E2E8F0"/>
  <path d="M95 112 Q105 107 115 112" stroke="#64748B" stroke-width="2" fill="none"/>

  <!-- Torso & Jacket -->
