<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Bell Body -->
    <path d="M-50 20 C-50 -40, -30 -80, 0 -80 C30 -80, 50 -40, 50 20 L60 30 L-60 30 Z" fill="#FFB84D"/>
    <!-- Bell Rim -->
    <ellipse cx="0" cy="30" rx="60" ry="10" fill="#FF9F1A"/>
    <!-- Bell Clapper -->
    <path d="M-5 30 L0 60 L5 30 Z" fill="#E67E22"/>
    <circle cx="0" cy="65" r="10" fill="#E67E22"/>
    <!-- Sound Waves (Representing the "Warning" sound) -->
    <path d="M70 -20 A40 40 0 0 1 70 40" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M85 -35 A60 60 0 0 1 85 55" stroke="#FFB84D" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M100 -50 A80 80 0 0 1 100 70" stroke="#FFB84D" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
    <!-- Top Handle -->
    <path d="M-15 -80 C-15 -95, 15 -95, 15 -80" stroke="#FFB84D" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
</svg>