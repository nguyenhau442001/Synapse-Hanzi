<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <defs>
    <!-- Glow and gradient definitions -->
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameMain" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="50%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFEA00"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEA00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFEA00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient bonfire glow -->
  <circle cx="120" cy="180" r="70" fill="url(#fireGlow)"/>

  <!-- Dynamic music notes / rhythmic floating elements (rộn rã, vui tươi) -->
  <g fill="#FFD54F" opacity="0.85">
    <!-- Note 1 -->
    <path d="M 65 95 L 65 75 L 85 70 L 85 85" fill="none" stroke="#FFD54F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="95" r="5"/>
    <circle cx="80" cy="85" r="5"/>
    
    <!-- Note 2 (scaled up for visual contrast/expression rule) -->
    <path d="M 175 75 L 175 50 L 200 42 L 200 67" fill="none" stroke="#FFEA00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="168" cy="76" r="6"/>
    <circle cx="193" cy="67" r="6"/>

    <!-- Sparkles / Joy indicators -->
    <path d="M 45 130 L 51 130 L 54 124 L 57 130 L 63 130 L 58 134 L 60 140 L 54 136 L 48 140 L 50 134 Z" fill="#FFEA00" transform="scale(0.7) translate(20, 20)"/>
    <path d="M 180 120 L 184 120 L 186 116 L 188 120 L 192 120 L 189 123 L 190 127 L 186 124 L 182 127 L 183 123 Z" fill="#FFEA00"/>
  </g>

  <!-- Bonfire base at the center bottom -->
  <g id="bonfire">
    <!-- Logs -->
    <rect x="95" y="195" width="50" height="8" rx="4" transform="rotate(-15 120 199)" fill="#5D4037"/>
    <rect x="95" y="195" width="50" height="8" rx="4" transform="rotate(15 120 199)" fill="#4E342E"/>
    <!-- Flames -->
    <path d="M 120 155 Q 135 180 125 200 Q 120 205 120 205 Q 120 205 115 200 Q 105 180 120 155 Z" fill="url(#flameMain)"/>
    <path d="M 112 170 Q 122 185 118 200 Q 112 203 110 200 Q 102 185 112 170 Z" fill="#FF3D00"/>
    <path d="M 128 168 Q 138 185 124 200 Q 128 203 130 200 Q 138 185 128 168 Z" fill="#FFEA00"/>
  </g>

  <!-- Dancing figures (翩翩起舞) - Modern flat vector silhouettes with celebratory attire -->
  <!-- Left Dancer (Dynamic leaning pose conveying motion and joy) -->
  <g transform="translate(75, 125)">
    <!-- Skirt / Dress flare representing movement -->
    <path d="M -15 35 Q 5 55 25 35 Q 15 20 -15 35 Z" fill="#E91E63"/>
    <!-- Body & Limbs -->
    <path d="M -5 10 L 5 30 L 15 15" fill="none" stroke="#FF7043" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Head -->
    <circle cx="-8" cy="3" r="6" fill="#FFCCBC"/>
    <!-- Raised arms expressing elation -->
    <path d="M -8 8 Q -18 -5 -25 -10" fill="none" stroke="#FFCCBC" stroke-width="3" stroke-linecap="round"/>
    <path d="M -8 8 Q 5 -5 15 -10" fill="none" stroke="#FFCCBC" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right Dancer (Mirror dynamic pose with scale expression) -->
  <g transform="translate(165, 120)">
    <!-- Skirt / Dress flare -->
    <path d="M -25 35 Q -5 55 15 35 Q 5 20 -25 35 Z" fill="#9C27B0"/>
    <!-- Body & Limbs -->
    <path d="M 5 10 L -5 30 L -15 15" fill="none" stroke="#AB47BC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Head -->
    <circle cx="8" cy="2" r="6" fill="#FFCCBC"/>
    <!-- Raised arms -->
    <path d="M 8 7 Q 18 -8 26 -12" fill="none" stroke="#FFCCBC" stroke-width="3" stroke-linecap="round"/>
    <path d="M 8 7 Q -2 -8 -12 -12" fill="none" stroke="#FFCCBC" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Additional decorative festival lights / hanging elements at top -->
  <path d="M 20 30 Q 70 50 120 30 Q 170 10 220 30" fill="none" stroke="#37474F" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="70" cy="41" r="3" fill="#FFEA00"/>
  <circle cx="120" cy="30" r="3" fill="#FF3D00"/>
  <circle cx="170" cy="21" r="3" fill="#00E676"/>

</svg>