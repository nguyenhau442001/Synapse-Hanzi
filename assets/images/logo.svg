<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df5f38"/>
      <stop offset="100%" stop-color="#9e3218"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Squircle container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#hzBg)" filter="url(#logoShadow)"/>
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Cognitive network lattice / Thinking connections -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round">
    <line x1="32" y1="34" x2="86" y2="30"/>
    <line x1="86" y1="30" x2="84" y2="52"/>
    <line x1="84" y1="52" x2="94" y2="84"/>
    <line x1="32" y1="34" x2="28" y2="88"/>
  </g>
  <circle cx="32" cy="34" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="28" cy="88" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="94" cy="84" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="84" cy="52" r="2" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Golden cognitive insight spark at connection point -->
  <circle cx="86" cy="30" r="3.5" fill="url(#goldGlow)"/>
  <circle cx="86" cy="30" r="6" fill="none" stroke="#ffd166" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Chinese Character 汉 (Calligraphic / Modern Chinese Sans geometry) -->
  <text x="60" y="80" font-family="'PingFang SC', 'Hiragino Sans GB', 'STHeiti', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#ffffff" text-anchor="middle">汉</text>
</svg>
