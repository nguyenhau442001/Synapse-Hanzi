<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="sealRoughness" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- Outer Vermilion Seal Frame with rounded corners and hand-carved edge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#A8322A" filter="url(#sealRoughness)"/>
  <!-- Inner Cutout -->
  <rect x="13" y="13" width="74" height="74" rx="9" fill="#FAF6EE"/>
  <!-- Character "汉" (or Seal Character) in Vermilion -->
  <text x="50" y="70" font-family="'Songti SC', 'SimSun', 'STSong', serif" font-size="60" font-weight="900" fill="#A8322A" text-anchor="middle" filter="url(#sealRoughness)">汉</text>
</svg>