<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- Paper Canvas Wash -->
    <linearGradient id="canvasGrad_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131518" stop-opacity="1"/>
      <stop offset="50%" stop-color="#1B1F25" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1B1F25" stop-opacity="1"/>
    </linearGradient>

    <!-- Faint Atmospheric Wash -->
    <linearGradient id="faintInk_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A424E" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#3A424E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#131518" stop-opacity="0"/>
    </linearGradient>

    <!-- Mid Mountain Wash -->
    <linearGradient id="midInk_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282F3A" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#282F3A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#131518" stop-opacity="0"/>
    </linearGradient>

    <!-- Flank Ridge Ink Wash (Framing left & right, leaving center 留白) -->
    <linearGradient id="flankInkLeft_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151920" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#282F3A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#131518" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flankInkRight_dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151920" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#282F3A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#131518" stop-opacity="0"/>
    </linearGradient>

    <!-- Atmospheric Horizontal Mist Streams -->
    <linearGradient id="mistFlow_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#131518" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#131518" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#131518" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#131518" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#131518" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Water Surface Sheen (Bottom) -->
    <linearGradient id="waterSheen_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131518" stop-opacity="0"/>
      <stop offset="40%" stop-color="#282F3A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#282F3A" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Soft Mist Diffuse Filter -->
    <filter id="softMist_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="fineMist_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- 1. Paper / Nocturnal Base -->
  <rect width="100%" height="100%" fill="url(#canvasGrad_dark)"/>

  <!-- 2. Distant Horizon Mountain Silhouettes (Upper atmosphere) -->
  <g class="distant-peaks" opacity="0.85">
    <!-- Layer A: Farthest jagged karst silhouette across upper background -->
    <path d="M-50,380 C120,310 240,330 380,270 C520,210 680,290 840,240 C980,195 1100,270 1280,220 C1440,175 1600,260 1760,210 C1860,180 1940,220 2000,240 L2000,560 L-50,560 Z" fill="url(#faintInk_dark)"/>

    <!-- Layer B: Secondary graceful ridges -->
    <path d="M-50,440 C140,390 320,430 480,360 C640,290 760,380 960,340 C1120,300 1280,370 1480,320 C1660,270 1820,350 2000,310 L2000,620 L-50,620 Z" fill="url(#midInk_dark)"/>
  </g>

  <!-- 3. Left Flank: Huangshan Mountain Shoulder & Pine Silhouette (Framing left margin) -->
  <g class="left-flank" opacity="0.9">
    <!-- Deep mountain body on left side -->
    <path d="M-60,180 C80,220 160,320 220,440 C280,560 210,680 340,780 C400,820 460,890 420,1080 L-60,1080 Z" fill="url(#flankInkLeft_dark)"/>
    <!-- Delicate pine branch silhouettes on mountain edge -->
    <g stroke="#151920" stroke-width="1.4" stroke-linecap="round" opacity="0.5">
      <path d="M120,420 Q170,405 210,410 M170,405 Q205,395 235,400 M180,415 Q220,420 250,428" fill="none"/>
      <path d="M160,540 Q220,520 270,530 M220,520 Q265,510 305,515 M230,532 Q280,538 315,548" fill="none"/>
      <path d="M240,680 Q310,660 365,670 M310,660 Q360,650 405,656" fill="none"/>
    </g>
  </g>

  <!-- 4. Right Flank: Layered Karst Cliff & Misty Shore (Framing right margin) -->
  <g class="right-flank" opacity="0.9">
    <!-- Mountain mass on right side -->
    <path d="M1980,160 C1840,220 1760,330 1710,450 C1650,580 1720,700 1590,810 C1530,860 1460,930 1500,1080 L1980,1080 Z" fill="url(#flankInkRight_dark)"/>
    <!-- Subtle mountain pines on right edge -->
    <g stroke="#151920" stroke-width="1.4" stroke-linecap="round" opacity="0.45">
      <path d="M1800,430 Q1750,415 1705,420 M1750,415 Q1710,405 1675,410 M1740,425 Q1695,432 1660,438" fill="none"/>
      <path d="M1740,570 Q1680,550 1625,560 M1680,550 Q1630,540 1585,546" fill="none"/>
    </g>
  </g>

  <!-- 5. Central 留白 (Liu Bai) Negative Space Sanctuary -->
  <!-- A gentle vertical veil ensuring the card area has ultra-clean, legible contrast -->
  <rect x="360" y="0" width="1200" height="1080" fill="url(#mistFlow_dark)" opacity="0.7" filter="url(#softMist_dark)"/>

  <!-- 6. Bottom Misty Waterscape & River Reflection (Below card content) -->
  <g class="water-realm">
    <rect x="0" y="780" width="1920" height="300" fill="url(#waterSheen_dark)"/>
    <!-- Delicate rippling ink lines (water currents) -->
    <g stroke="#282F3A" stroke-width="0.75" fill="none" opacity="0.3">
      <path d="M120,920 Q320,915 540,920 T960,922"/>
      <path d="M240,960 Q480,955 720,960 T1200,962"/>
      <path d="M980,940 Q1240,935 1500,940 T1820,942"/>
      <path d="M840,980 Q1120,975 1400,980 T1780,982"/>
      <path d="M400,1020 Q700,1015 1000,1020 T1600,1022"/>
    </g>
  </g>

  <!-- 7. Auspicious Cloud Spirals (祥云纹) - Drifting high in the upper corners -->
  <g class="cloud-motifs" stroke="#D4B37F" stroke-width="1.3" fill="none" opacity="0.38">
    <!-- Top-Left Cloud Swirl -->
    <g transform="translate(220, 80) scale(0.7)">
      <path d="M0,20 C10,10 25,10 35,20 C45,10 60,10 70,20 C85,20 95,32 90,45 C85,58 70,60 55,58 L10,58 C-5,58 -15,45 -10,32 C-7,25 -2,22 0,20 Z"/>
      <path d="M25,38 C32,32 42,32 48,38 C54,44 50,52 42,52 C35,52 32,46 36,42"/>
    </g>
    <!-- Top-Right Cloud Swirl -->
    <g transform="translate(1620, 75) scale(0.65)">
      <path d="M0,20 C10,10 25,10 35,20 C45,10 60,10 70,20 C85,20 95,32 90,45 C85,58 70,60 55,58 L10,58 C-5,58 -15,45 -10,32 C-7,25 -2,22 0,20 Z"/>
      <path d="M25,38 C32,32 42,32 48,38 C54,44 50,52 42,52 C35,52 32,46 36,42"/>
    </g>
  </g>

  <!-- 8. Soaring Cranes (闲云孤鹤) - Classical poetic aspiration -->
  <g class="soaring-cranes" stroke="#D4B37F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <!-- Crane 1 (Leading) -->
    <g transform="translate(440, 140) scale(0.9)">
      <path d="M0,0 Q12,-8 24,-2 Q14,8 0,0"/>
      <path d="M12,-5 L16,-16 Q20,-18 24,-14"/>
      <path d="M24,-2 Q32,0 40,-4"/>
    </g>
    <!-- Crane 2 (Following) -->
    <g transform="translate(485, 170) scale(0.72)">
      <path d="M0,0 Q12,-8 24,-2 Q14,8 0,0"/>
      <path d="M12,-5 L16,-16 Q20,-18 24,-14"/>
      <path d="M24,-2 Q32,0 40,-4"/>
    </g>
    <!-- Crane 3 (Distant) -->
    <g transform="translate(520, 150) scale(0.55)">
      <path d="M0,0 Q12,-8 24,-2 Q14,8 0,0"/>
      <path d="M12,-5 L16,-16 Q20,-18 24,-14"/>
    </g>
  </g>
</svg>