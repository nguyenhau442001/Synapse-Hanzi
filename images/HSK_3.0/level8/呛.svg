<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Water pool background / lower section -->
    <path d="M 30,150 Q 120,135 210,150 L 210,210 Q 120,220 30,210 Z" fill="#103140" opacity="0.6"/>
    
    <!-- Water surface line -->
    <path d="M 35,150 C 70,142 105,158 140,150 C 175,142 200,152 205,150" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50,156 C 80,150 110,162 140,156 C 170,150 190,158 195,156" fill="none" stroke="#0EA5E9" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

    <!-- Swimmer head & upper body emerging / coughing -->
    <!-- Water splash/droplets -->
    <circle cx="105" cy="130" r="3.5" fill="#38BDF8"/>
    <circle cx="145" cy="125" r="4.5" fill="#38BDF8"/>
    <circle cx="155" cy="110" r="2.5" fill="#38BDF8"/>
    <circle cx="95" cy="115" r="3" fill="#38BDF8"/>
    <path d="M 120,138 Q 125,120 132,135" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 135,142 Q 142,125 148,138" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 100,142 Q 105,128 112,140" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

    <!-- Water impact rings around neck/body -->
    <ellipse cx="120" cy="150" rx="35" ry="8" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    <ellipse cx="120" cy="151" rx="20" ry="4" fill="none" stroke="#7DD3FC" stroke-width="1.5" opacity="0.5"/>

    <!-- Person shoulders & wetsuit/swimwear -->
    <path d="M 75,210 C 75,175 90,160 120,160 C 150,160 165,175 165,210 Z" fill="#0284C7"/>
    <!-- Wetsuit zipper line & details -->
    <line x1="120" y1="170" x2="120" y2="210" stroke="#0369A1" stroke-width="2"/>
    <path d="M 95,175 L 120,185 L 145,175" fill="none" stroke="#0369A1" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="108" y="142" width="24" height="22" rx="6" fill="#FCA5A5"/>

    <!-- Head profile (facing right, tilted back coughing) -->
    <!-- Hair -->
    <path d="M 98,110 C 95,85 115,75 138,80 C 155,83 162,98 160,112 C 158,118 152,118 150,112 C 145,95 130,90 110,95 C 102,97 98,104 98,110 Z" fill="#1E293B"/>

    <!-- Face skin -->
    <path d="M 102,100 C 102,90 118,88 132,94 C 148,100 156,115 150,132 C 145,145 125,148 112,140 C 105,135 102,120 102,100 Z" fill="#FCA5A5"/>

    <!-- Closed eyes (straining/coughing) -->
    <path d="M 128,112 Q 134,116 140,112" fill="none" stroke="#991B1B" stroke-width="2" stroke-linecap="round"/>
    
<!-- Eyebrow (tilted in distress) -->
    <path d="M 127,107 Q 135,103 142,107" fill="none" stroke="#991B1B" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Open mouth coughing/gasping -->
    <path d="M 144,124 C 144,124 154,122 153,128 C 152,134 143,136 143,130 Z" fill="#7F1D1D"/>
    <!-- Teeth inside open mouth -->
    <path d="M 144,125 L 149,125" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 152,114 L 158,119 L 151,121" fill="none" stroke="#F87171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Flush cheeks / choking stress effect -->
    <ellipse cx="138" cy="123" rx="5" ry="3" fill="#EF4444" opacity="0.6"/>

    <!-- Cough / Water droplet expelled from mouth -->
    <circle cx="163" cy="122" r="3" fill="#38BDF8"/>
    <circle cx="171" cy="117" r="2" fill="#38BDF8"/>
    <circle cx="178" cy="110" r="1.5" fill="#38BDF8"/>

    <!-- Motion lines for coughing / sudden burst -->
    <path d="M 158,126 Q 166,124 172,120" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round"/>
    <path d="M 157,131 Q 165,132 173,130" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Focus Accent Highlight (Orange/Gold theme as requested for focal point) -->
    <circle cx="148" cy="126" r="16" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>
  </g>
</svg>