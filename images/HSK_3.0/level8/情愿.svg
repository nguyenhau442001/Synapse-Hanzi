<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle mountain contour representing remote area support context -->
  <path d="M30 190 L90 120 L150 180 L210 140 L220 190 Z" fill="#222732" opacity="0.6"/>

  <!-- Desk Surface -->
  <rect x="40" y="170" width="160" height="8" rx="4" fill="#2E3646"/>

  <!-- Person (Representing the professional letting go of high-salary city life willingly) -->
  <!-- Head & Torso -->
  <circle cx="120" cy="85" r="22" fill="#E2E8F0"/>
  <path d="M92 145 C92 115 148 115 148 145 Z" fill="#3B82F6"/>
  <!-- Collar / Shirt -->
  <path d="M110 115 L120 128 L130 115 Z" fill="#1A1D24"/>

  <!-- Hands gently placing/letting go of a city skyline model (symbolizing high-salary urban life) -->
  <circle cx="100" cy="142" r="8" fill="#E2E8F0"/>
  <circle cx="140" cy="142" r="8" fill="#E2E8F0"/>

  <!-- City Skyline Model (Being gracefully set aside / let go willingly) -->
  <rect x="85" y="150" width="14" height="25" fill="#475569"/>
  <rect x="103" y="142" width="18" height="33" fill="#64748B"/>
  <rect x="125" y="148" width="15" height="27" fill="#475569"/>
  
  <!-- Glowing golden accent representing willingness, inner conviction, and positive choice (Qingyuan - willingly, gladly) -->
  <circle cx="120" cy="65" r="45" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
  
  <!-- Open posture: smiling calm expression lines -->
  <path d="M113 88 Q120 95 127 88" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing bright star / spark above representing clarity and willing dedication -->
  <path d="M120 30 L123 40 L133 43 L123 46 L120 56 L117 46 L107 43 L117 40 Z" fill="#F59E0B"/>
</svg>