<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle scanning grid background representing forensic/facial composite technology -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="0.5">
    <line x1="40" y1="40" x2="200" y2="40" stroke-dasharray="2 2"/>
    <line x1="40" y1="80" x2="200" y2="80" stroke-dasharray="2 2"/>
    <line x1="40" y1="120" x2="200" y2="120" stroke-dasharray="2 2"/>
    <line x1="40" y1="160" x2="200" y2="160" stroke-dasharray="2 2"/>
    <line x1="40" y1="200" x2="200" y2="200" stroke-dasharray="2 2"/>
    <line x1="60" y1="30" x2="60" y2="210" stroke-dasharray="2 2"/>
    <line x1="100" y1="30" x2="100" y2="210" stroke-dasharray="2 2"/>
    <line x1="140" y1="30" x2="140" y2="210" stroke-dasharray="2" stroke-dasharray="2 2"/>
    <line x1="180" y1="30" x2="180" y2="210" stroke-dasharray="2 2"/>
  </g>

  <!-- Central Facial Composite Concept (Xiàngmào / Facial Features & Structure) -->
  <g transform="translate(0, 5)">
    <!-- Outer Holographic Target Frame -->
    <path d="M 85 45 L 75 45 L 75 55" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 155 45 L 165 45 L 165 55" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 85 195 L 75 195 L 75 185" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 155 195 L 165 195 L 165 185" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Silhouette Head Base -->
    <path d="M 95 75 C 95 62, 145 62, 145 75 C 148 95, 148 115, 145 135 C 143 148, 138 160, 120 162 C 102 160, 97 148, 95 135 C 92 115, 92 95, 95 75 Z" fill="#262C38" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Hair Contour -->
    <path d="M 94 78 C 96 60, 108 52, 120 52 C 132 52, 144 60, 146 78 C 138 74, 130 73, 120 73 C 110 73, 102 74, 94 78 Z" fill="#38BDF8" opacity="0.8"/>

    <!-- Facial Mapping Wireframe & Features (Xiàngmào details) -->
    <!-- Eyes mapping -->
    <circle cx="106" cy="100" r="4" fill="#1A1D24" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="134" cy="100" r="4" fill="#1A1D24" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="102" y1="92" x2="110" y2="94" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="130" y1="94" x2="138" y2="92" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose mapping -->
    <polyline points="120,105 117,122 124,122" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mouth mapping -->
    <path d="M 112 138 C 116 141, 124 141, 128 138" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Facial Structure / Jawline Grid Overlay -->
    <path d="M 98 115 L 120 152 L 142 115" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 2" opacity="0.7"/>
    <line x1="120" y1="70" x2="120" y2="155" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <line x1="95" y1="100" x2="145" y2="100" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>

    <!-- Precise Targeting Nodes (Focus on features) -->
    <circle cx="120" cy="122" r="2" fill="#F59E0B"/>
    <circle cx="120" cy="139" r="2" fill="#F59E0B"/>
    
    <!-- Measurement / Analysis Brackets -->
    <path d="M 88 95 L 85 95 L 85 105 L 88 105" fill="none" stroke="#38BDF8" stroke-width="1"/>
    <path d="M 152 95 L 155 95 L 155 105 L 152 105" fill="none" stroke="#38BDF8" stroke-width="1"/>
  </g>
</svg>