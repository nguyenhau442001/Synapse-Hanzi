<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient light background -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.6"/>

  <!-- Conceptual illustration: "专程" (Making a dedicated, special trip to arrive somewhere with purpose) -->
  <!-- We visualize this as a high-speed transit journey directly mapping to a destination pin/house, emphasizing intention and effort. -->

  <!-- Curved travel path / Route arc -->
  <path d="M 60 155 Q 120 70 180 155" fill="none" stroke="#2F3646" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 6"/>
  
  <!-- Direct trajectory beam (highlighting the "dedicated trip") -->
  <path d="M 70 140 Q 120 80 170 140" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Destination Marker / House (Representing arrival at the specific destination, e.g., friend's new home) -->
  <g transform="translate(150, 110)">
    <!-- Map pin background glow -->
    <circle cx="20" cy="25" r="22" fill="#F59E0B" opacity="0.15"/>
    
    <!-- House icon integrated with pin -->
    <path d="M 20 2 C 10 2 2 10 2 20 C 2 34 20 52 20 52 C 20 52 38 34 38 20 C 38 10 30 2 20 2 Z" fill="#2E384D" stroke="#475569" stroke-width="2"/>
    
    <!-- House Roof -->
    <path d="M 11 18 L 20 10 L 29 18" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- House Body & Door -->
    <rect x="14" y="18" width="12" height="13" fill="#1A1D24" rx="1"/>
    <rect x="17" y="23" width="6" height="8" fill="#F59E0B" rx="1"/>
  </g>

  <!-- High-Speed Train / Traveler icon (Representing the dedicated journey) -->
  <g transform="translate(55, 120)">
    <!-- Motion lines -->
    <line x1="-12" y1="12" x2="-2" y2="12" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-16" y1="18" x2="-6" y2="18" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Sleek modern bullet train head -->
    <path d="M 0 10 C 12 10 25 12 32 15 C 38 18 42 22 42 24 C 42 26 35 27 25 27 L 0 27 Z" fill="#3B82F6"/>
    <path d="M 15 13 L 28 16 C 34 18 38 21 39 23 L 0 23 Z" fill="#60A5FA"/>
    
    <!-- Train windshield -->
    <path d="M 26 16 C 30 17 34 19 37 21 L 28 21 Z" fill="#1A1D24" opacity="0.8"/>

    <!-- Wheels -->
    <circle cx="10" cy="28" r="3.5" fill="#94A3B8"/>
    <circle cx="10" cy="28" r="1.5" fill="#1A1D24"/>
    <circle cx="30" cy="28" r="3.5" fill="#94A3B8"/>
    <circle cx="30" cy="28" r="1.5" fill="#1A1D24"/>
  </g>

  <!-- Directional focus sparkle / Special trip indicator -->
  <g transform="translate(120, 75)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#F59E0B"/>
  </g>
  <g transform="translate(90, 95) scale(0.6)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#F59E0B" opacity="0.7"/>
  </g>

</svg>