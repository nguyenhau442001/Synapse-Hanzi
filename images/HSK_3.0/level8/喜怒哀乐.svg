<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Central theatrical mask split into expressive facets representing the spectrum of emotions -->
    
    <!-- Outer glow / aura representing dramatic stage energy -->
    <circle r="82" fill="#252A34" opacity="0.6"/>
    
    <!-- Dramatic Stage Frame / Minimalist Arch -->
    <path d="M -65 65 L -65 -25 C -65 -60 65 -60 65 -25 L 65 65" fill="none" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
    <line x1="-75" y1="65" x2="75" y2="65" stroke="#3A4252" stroke-width="4" stroke-linecap="round"/>

    <!-- Main Mask Base -->
    <path d="M -45 -10 C -45 -42 45 -42 45 -10 C 45 35 30 60 0 60 C -30 60 -45 35 -45 -10 Z" fill="#2D3342" stroke="#60A5FA" stroke-width="2"/>
    
    <!-- Vertical dividing line for emotional duality -->
    <line x1="0" y1="-38" x2="0" y2="58" stroke="#1A1D24" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Left Side: Joy & Anger (喜/怒) -->
    <g>
      <!-- Left Eye: Sharp, upturned (Joy/Anger blend) -->
      <path d="M -32 -18 C -22 -26 -10 -22 -5 -18 C -10 -15 -22 -15 -32 -18 Z" fill="#F59E0B"/>
      <!-- Left Brow: Angled up fiercely -->
      <path d="M -35 -27 C -25 -32 -10 -26 -5 -28" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Left Mouth: Dynamic curved grin/shout -->
      <path d="M -30 20 C -20 38 -5 32 0 25 C -10 22 -20 20 -30 20 Z" fill="#F59E0B"/>
    </g>

    <!-- Right Side: Sorrow & Delight (哀/乐) -->
    <g>
      <!-- Right Eye: Downward slope, weeping/tender -->
      <path d="M 32 -18 C 22 -26 10 -22 5 -18 C 10 -15 22 -15 32 -18 Z" fill="#38BDF8"/>
      <!-- Right Brow: Drooping softly -->
      <path d="M 35 -27 C 25 -32 10 -26 5 -28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Right Mouth: Gentle upward smile -->
      <path d="M 5 25 C 10 32 20 38 30 20 C 20 20 10 22 5 25 Z" fill="#38BDF8"/>
    </g>

    <!-- Floating expressive motif icons representing the four elements (Joy, Anger, Sorrow, Happiness) -->
    <!-- Joyful Spark (Top Right) -->
    <path d="M 68 -35 L 72 -45 L 82 -41 L 72 -37 L 68 -27 L 64 -37 L 54 -41 L 64 -45 Z" fill="#F59E0B" opacity="0.85"/>
    
    <!-- Sorrow Tear (Top Left) -->
    <path d="M -68 -35 C -68 -42 -74 -48 -74 -48 C -74 -48 -80 -42 -80 -35 C -80 -30 -76 -27 -74 -27 C -72 -27 -68 -30 -68 -35 Z" fill="#38BDF8" opacity="0.85"/>

    <!-- Dramatic Accent Footlights at the base -->
    <circle cx="-35" cy="73" r="4" fill="#F59E0B"/>
    <circle cx="35" cy="73" r="4" fill="#F59E0B"/>
    <path d="M -45 79 L -25 79" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 25 79 L 45 79" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>