    <path d="M0,-45 C25,-45 45,-25 45,0 C45,25 25,45 0,45 C-25,45 -45,25 -45,0 C-45,-25 -25,-45 0,-45" fill="#FF4500"/>
    <path d="M0,-35 C20,-35 35,-20 35,0 C35,20 20,35 0,35 C-20,35 -35,20 -35,0 C-35,-20 -20,-35 0,-35" fill="#FF6347"/>
    <path d="M0,-25 C15,-25 25,-15 25,0 C25,15 15,25 0,25 C-15,25 -25,15 -25,0 C-25,-15 -15,-25 0,-25" fill="#FF8C00"/>
    
