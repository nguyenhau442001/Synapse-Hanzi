<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Railway Tracks -->
  <path d="M40 180 L200 180 M40 195 L200 195" stroke="#4A5568" stroke-width="4"/>
  <path d="M50 170 L50 205 M80 170 L80 205 M110 170 L110 205 M140 170 L140 205 M170 170 L170 205" stroke="#4A5568" stroke-width="3"/>

  <!-- Freight Train Container -->
  <g transform="translate(60, 100)">
    <!-- Container Body -->
    <rect x="0" y="0" width="120" height="70" rx="4" fill="#F6AD55"/>
    <!-- Container Details -->
    <rect x="10" y="10" width="100" height="50" fill="#DD6B20" opacity="0.3"/>
    <rect x="25" y="15" width="10" height="40" fill="#1A1D24" opacity="0.2"/>
    <rect x="55" y="15" width="10" height="40" fill="#1A1D24" opacity="0.2"/>
    <rect x="85" y="15" width="10" height="40" fill="#1A1D24" opacity="0.2"/>
    
    <!-- Wheels -->
    <circle cx="30" cy="80" r="10" fill="#718096"/>
    <circle cx="90" cy="80" r="10" fill="#718096"/>
    <circle cx="30" cy="80" r="4" fill="#1A1D24"/>
    <circle cx="90" cy="80" r="4" fill="#1A1D24"/>
  </g>

  <!-- Motion Lines -->
  <path d="M190 120 L210 110 M190 140 L215 130" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
</svg>