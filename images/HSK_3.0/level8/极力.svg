<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle lighting for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Podium / Press Conference Desk -->
  <path d="M80 175 L160 175 L170 205 L70 205 Z" fill="#2E3648"/>
  <path d="M75 170 L165 170 L160 175 L80 175 Z" fill="#3E4A61"/>
  <!-- Microphone on podium -->
  <rect x="116" y="150" width="8" height="25" fill="#6B7A99"/>
  <circle cx="120" cy="146" r="6" fill="#F39C12"/>

  <!-- Spokesperson Character (Physical Object/Person representing "极力" action - steadfastly defending/clarifying) -->
  <!-- Body/Suit -->
  <path d="M95 150 C95 130 145 130 145 150 L155 175 L85 175 Z" fill="#31394D"/>
  <!-- Shirt & Tie -->
  <polygon points="120,138 127,155 113,155" fill="#E2E8F0"/>
  <polygon points="120,146 123,165 120,172 117,165" fill="#E74C3C"/>

  <!-- Neck -->
  <rect x="114" y="122" width="12" height="12" fill="#E0A96D"/>

  <!-- Head with determined expression -->
  <circle cx="120" cy="104" r="18" fill="#E0A96D"/>
  <!-- Hair -->
  <path d="M102 100 C102 88 138 88 138 100 C138 96 135 90 120 90 C105 90 102 96 102 100 Z" fill="#2C3E50"/>

  <!-- Arms expressing intense effort (极力 - putting forth utmost strength/arguments) -->
  <!-- Left arm raised firmly, gesturing forcefully -->
  <path d="M95 140 L65 115 L72 108 L102 133 Z" fill="#31394D"/>
  <circle cx="62" cy="112" r="6" fill="#E0A96D"/>

  <!-- Right arm pushing forward with unwavering resolve -->
  <path d="M145 140 L178 125 L175 117 L142 132 Z" fill="#31394D"/>
  <circle cx="182" cy="122" r="6" fill="#E0A96D"/>

  <!-- Dynamic energy / truth clarification aura lines emanating from the speaker -->
  <path d="M95 72 L88 62" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 66 L120 54" stroke="#F39C12" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M145 72 L152 62" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>

  <!-- Focal highlight stars representing absolute conviction and truth -->
  <polygon points="120,38 122,44 128,45 123,49 125,55 120,51 115,55 117,49 112,45 118,44" fill="#F1C40F"/>
</svg>