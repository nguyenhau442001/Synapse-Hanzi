<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(30, 20)">
    <!-- Detective Silhouette / Head & Hat -->
    <path d="M90 40 C60 40 45 60 45 85 L45 95 L135 95 L135 85 C135 60 120 40 90 40 Z" fill="#2E3440"/>
    
    <!-- Trench Coat Collar & Shoulders -->
    <path d="M30 160 C30 120 55 105 90 105 C125 105 150 120 150 160 L165 170 L15 170 Z" fill="#3B4252"/>
    <path d="M75 105 L90 135 L105 105 Z" fill="#2E3440"/>
    
    <!-- Fedora Hat Details -->
    <path d="M30 45 C70 45 110 45 150 45 C155 45 155 35 150 35 C110 32 70 32 30 35 C25 35 25 45 30 45 Z" fill="#E5C07B"/>
    <path d="M50 38 C75 35 105 35 130 38 L128 45 C105 42 75 42 52 45 Z" fill="#D19A66"/>
    
    <!-- Magnifying Glass (Central Iconic Object) -->
    <g transform="translate(65, 80)">
      <!-- Glass Beam / Reflection Effect -->
      <circle cx="50" cy="50" r="38" fill="#2E3440" stroke="#61AFEF" stroke-width="8"/>
      <circle cx="50" cy="50" r="32" fill="#1E222B" opacity="0.8"/>
      
      <!-- Lens glare -->
      <path d="M30 30 Q45 20 60 30" stroke="#61AFEF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
      
      <!-- Handle -->
      <rect x="72" y="72" width="36" height="12" rx="6" fill="#E5C07B" transform="rotate(45 72 72)"/>
      <rect x="78" y="78" width="24" height="4" rx="2" fill="#D19A66" transform="rotate(45 78 78)"/>
    </g>
    
    <!-- Subtle Clue Element under lens -->
    <path d="M100 125 L115 125 M107.5 117.5 L107.5 132.5" stroke="#E06C75" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>