<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Background glow/accent representing metal processing heat -->
    <path d="M-60,-20 Q0,-50 60,-20 Q70,40 0,70 Q-70,40 -60,-20 Z" fill="#F59E0B" opacity="0.1" filter="blur(8px)"/>

    <!-- Left fixed anchor / vise grip -->
    <path d="M-90,-50 L-60,-50 L-60,50 L-90,50 Z" fill="#334155" rx="4"/>
    <rect x="-95" y="-60" width="10" height="120" rx="2" fill="#64748B"/>
    <line x1="-90" y1="-40" x2="-90" y2="40" stroke="#1A1D24" stroke-width="4"/>

    <!-- Right tension mechanism / pulling force indicator -->
    <path d="M60,-50 L90,-50 L90,50 L60,50 Z" fill="#334155" rx="4"/>
    <rect x="85" y="-60" width="10" height="120" rx="2" fill="#64748B"/>
    <line x1="90" y1="-40" x2="90" y2="40" stroke="#1A1D24" stroke-width="4"/>

    <!-- Tension arrows (pulling apart) -->
    <path d="M-105,0 L-95,0 M-105,0 L-100,-5 M-105,0 L-100,5" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105,0 L95,0 M105,0 L100,-5 M105,0 L100,5" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- The Steel Bar bending flexibly under high tensile stress (韧性 - toughness/ductility) -->
    <!-- It bends upward smoothly, showing elasticity and resilience rather than snapping -->
    <path d="M -60,0 C -20,-45 20,-45 60,0 C 20,-25 -20,-25 -60,0 Z" fill="#94A3B8" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Highlights and heat-treatment grain details on the steel bar -->
    <path d="M -45,-12 C -15,-30 15,-30 45,-12" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Heat/Energy sparkles indicating treated steel structure -->
    <circle cx="0" cy="-28" r="3" fill="#F59E0B"/>
    <path d="M-15,-20 L-5,-25" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M15,-20 L5,-25" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>