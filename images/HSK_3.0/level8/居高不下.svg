<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Supporting Pillar Structure -->
  <rect x="60" y="180" width="120" height="10" fill="#4A5568" rx="2"/>
  <rect x="110" y="80" width="20" height="100" fill="#4A5568"/>
  
  <!-- The Object (A heavy, solid block representing the price/value) -->
  <rect x="80" y="50" width="80" height="30" fill="#F6AD55" rx="4"/>
  
  <!-- Visualizing "High and not falling" - The object is physically fixed at the top -->
  <path d="M120 80 L120 50" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative elements to show it is stuck/fixed at a high level -->
  <rect x="90" y="55" width="60" height="20" fill="#D69E2E" rx="2"/>
  
  <!-- Ground reference -->
  <line x1="40" y1="190" x2="200" y2="190" stroke="#2D3748" stroke-width="2"/>
</svg>