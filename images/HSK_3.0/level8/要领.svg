<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Educational Illustration for "要领" (Core Essence / Key Technique) -->
  <!-- Adjective/State: Visual contrast between chaotic/diffused state (faded/small) and the concentrated, precise core technique (large, glowing, golden, accented). -->

  <!-- Background Ambient Glow representing deep focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Chaotic/Scattered outer elements representing raw, unguided movement -->
  <g opacity="0.35" stroke="#8A99AD" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5">
    <path d="M 60 70 Q 80 50 100 65"/>
    <path d="M 180 80 Q 160 60 140 75"/>
    <path d="M 55 160 Q 75 180 95 165"/>
    <path d="M 185 150 Q 165 175 145 160"/>
  </g>

  <!-- Secondary supporting nodes (contextual steps leading to the core) -->
  <circle cx="85" cy="95" r="8" fill="#3E4C59"/>
  <circle cx="155" cy="95" r="8" fill="#3E4C59"/>
  <circle cx="120" cy="165" r="8" fill="#3E4C59"/>

  <!-- Connecting energy streams toward the center -->
  <path d="M 85 95 L 110 115" stroke="#3E4C59" stroke-width="3" stroke-linecap="round"/>
  <path d="M 155 95 L 130 115" stroke="#3E4C59" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 165 L 120 135" stroke="#3E4C59" stroke-width="3" stroke-linecap="round"/>

  <!-- THE CORE ESSENCE (要领 - Highlighted with scale exaggeration, golden accent, and precise geometric focal point) -->
  <!-- Outer radiant ring -->
  <circle cx="120" cy="120" r="32" fill="none" stroke="#F6AD55" stroke-width="2" opacity="0.4" stroke-dasharray="6 4"/>
  
  <!-- Solid core anchor background -->
  <circle cx="120" cy="120" r="26" fill="#2D3748" stroke="#F6AD55" stroke-width="2.5"/>

  <!-- Inner precision symbol (Target / Focal Focus / Ultimate Key) -->
  <circle cx="120" cy="120" r="14" fill="#F6AD55"/>
  <circle cx="120" cy="120" r="6" fill="#1A1D24"/>
  <circle cx="120" cy="120" r="2" fill="#F6AD55"/>

  <!-- Radiating focal precision bursts (Golden accent marks) -->
  <line x1="120" y1="80" x2="120" y2="88" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="152" x2="120" y2="160" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="88" y2="120" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="120" x2="160" y2="120" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
</svg>