<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid for technical/professional context -->
  <path d="M40,60 H200 M40,100 H200 M40,140 H200 M40,180 H200" stroke="#262B35" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Main Physical Object: Official Certificate / Credential / License Document (Representing '资质' - official qualification/legal capacity) -->
  <g transform="translate(60, 45)">
    <!-- Document Base / Folder -->
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#2E3646" stroke="#3E4A61" stroke-width="2"/>
    
    <!-- Inner Paper -->
    <rect x="12" y="16" width="96" height="118" rx="4" fill="#F4F6F8"/>
    
    <!-- Official Header / Ribbon area -->
    <rect x="30" y="30" width="60" height="8" rx="2" fill="#E2B714"/>
    
    <!-- Text Lines Representation -->
    <rect x="30" y="50" width="60" height="5" rx="1.5" fill="#D0D5DD"/>
    <rect x="30" y="62" width="45" height="5" rx="1.5" fill="#D0D5DD"/>
    <rect x="30" y="74" width="52" height="5" rx="1.5" fill="#D0D5DD"/>

    <!-- Verification Checkmark / Stamp Area -->
    <circle cx="60" cy="108" r="14" fill="#EBF8FF" stroke="#3182CE" stroke-width="2"/>
    <path d="M53 108 L58 113 L68 102" fill="none" stroke="#3182CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gold Official Seal (Represents state/official certification and qualification) -->
    <g transform="translate(90, 95)">
      <circle cx="0" cy="0" r="18" fill="#E2B714"/>
      <circle cx="0" cy="0" r="14" fill="#F6D860"/>
      <path d="M-6 -2 L-2 4 L6 -5" fill="none" stroke="#9A7B0C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>