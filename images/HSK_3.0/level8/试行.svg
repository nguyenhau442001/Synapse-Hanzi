<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "试行" (Trial implementation of an educational initiative/policy) -->
  <g transform="translate(0, 0)">
    <!-- Background Document / Policy Paper -->
    <rect x="52" y="44" width="136" height="152" rx="8" fill="#282D3D" stroke="#3A4256" stroke-width="2"/>
    
    <!-- Header line of the document -->
    <rect x="72" y="64" width="70" height="8" rx="4" fill="#F59E0B"/>
    
    <!-- Body lines of the document -->
    <rect x="72" y="88" width="96" height="6" rx="3" fill="#4B5563"/>
    <rect x="72" y="104" width="80" height="6" rx="3" fill="#4B5563"/>
    <rect x="72" y="120" width="88" height="6" rx="3" fill="#4B5563"/>

    <!-- Physical Object: A modern clipboard/evaluation interface representing practical implementation/trial -->
    <path d="M 68 132 L 172 132 L 172 188 C 172 192.418 168.418 196 164 196 L 76 196 C 71.582 196 68 192.418 68 188 Z" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>

    <!-- Clip at the top of the trial form -->
    <rect x="96" y="126" width="48" height="12" rx="3" fill="#F59E0B"/>
    <rect x="108" y="122" width="24" height="6" rx="2" fill="#D97706"/>

    <!-- Checkboxes and trial marks (Tick / Test symbol) -->
    <!-- Item 1: Checked -->
    <rect x="84" y="150" width="12" height="12" rx="3" fill="#3B82F6"/>
    <path d="M 87 156 L 90 159 L 95 153" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="104" y="153" width="48" height="6" rx="3" fill="#94A3B8"/>

    <!-- Item 2: Active Trial (Pencil drawing / Testing mark) -->
    <rect x="84" y="172" width="12" height="12" rx="3" fill="#3B82F6"/>
    <path d="M 87 178 L 90 181 L 95 175" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="104" y="175" width="36" height="6" rx="3" fill="#94A3B8"/>

    <!-- Floating modern stylus/pencil indicating "trial/testing in progress" -->
    <g transform="translate(145, 125) rotate(-35)">
      <!-- Pencil Body -->
      <polygon points="0,0 12,0 10,40 2,40" fill="#F59E0B"/>
      <!-- Pencil Tip -->
      <polygon points="2,40 10,40 6,48" fill="#D97706"/>
      <!-- Eraser / Metal ferrule -->
      <rect x="0" y="-6" width="12" height="6" rx="1" fill="#64748B"/>
      <rect x="0" y="-10" width="12" height="4" rx="1" fill="#EF4444"/>
    </g>

    <!-- Glowing accent sparks representing new policy implementation -->
    <circle cx="170" cy="56" r="3" fill="#38BDF8"/>
    <circle cx="60" cy="110" r="2.5" fill="#F59E0B"/>
  </g>
</svg>