<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Road & Environment (Dark Theme) -->
  <!-- Dark road surface -->
  <path d="M 30,195 Q 120,155 210,195 L 210,215 Q 120,175 30,215 Z" fill="#2A2F3A"/>
  <path d="M 20,185 Q 120,135 220,185 L 210,215 Q 120,165 30,215 Z" fill="#222630"/>

  <!-- Dashed center lane marker (curved) -->
  <path d="M 65,189 Q 120,152 175,189" fill="none" stroke="#3A4252" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Skid marks leading off the road -->
  <path d="M 115,163 Q 140,145 165,110" fill="none" stroke="#121418" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 122,167 Q 147,149 172,114" fill="none" stroke="#121418" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Physical Object: The Car (Modern Flat Vector, skewed/rotated for the crash/skid outcome context) -->
  <g transform="translate(145, 95) rotate(-35)">
    <!-- Car Shadow -->
    <ellipse cx="0" cy="22" rx="28" ry="10" fill="#121418" opacity="0.6"/>

    <!-- Car Body - Sleek Modern Hatchback/Sedan -->
    <path d="M -22,8 L -18,-2 Q -12,-10 0,-12 L 14,-8 Q 24,-6 26,4 L 28,12 L -24,12 Z" fill="#E05638"/>
    <!-- Roof & Windows -->
    <path d="M -12,-2 L -8,-9 Q -4,-12 6,-10 L 14,-3 L 14,3 L -12,3 Z" fill="#1F242C"/>
    <!-- Windshield sheen -->
    <path d="M -10,-3 L -7,-9 Q -3,-11 4,-10 L 10,-3 Z" fill="#3A4252" opacity="0.5"/>

    <!-- Headlight glow (focus element for "leading to/causing") -->
    <path d="M 26,2 L 36,-1 L 36,6 Z" fill="#F1C40F" opacity="0.9"/>
    <ellipse cx="36" cy="2" rx="3" ry="5" fill="#FFF" opacity="0.8"/>

    <!-- Wheels -->
    <circle cx="-14" cy="12" r="6" fill="#121418"/>
    <circle cx="-14" cy="12" r="3" fill="#4E5D6C"/>
    <circle cx="16" cy="12" r="6" fill="#121418"/>
    <circle cx="16" cy="12" r="3" fill="#4E5D6C"/>

    <!-- Motion/Impact Effect Lines -->
    <line x1="-30" y1="0" x2="-24" y2="4" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
    <line x1="-32" y1="8" x2="-26" y2="10" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Spark / Consequence Accent (Visualizing the exact moment of "causing/resulting in") -->
  <g transform="translate(170, 75)">
    <circle cx="0" cy="0" r="16" fill="#F39C12" opacity="0.15"/>
    <circle cx="0" cy="0" r="8" fill="#F39C12" opacity="0.3"/>
    <!-- Sharp impact vector rays -->
    <path d="M 0,-12 L 2,-4 L 10,-6 L 4,0 L 12,4 L 4,4 L 6,12 L 0,6 L -6,12 L -4,4 L -12,4 L -4,0 L -10,-6 L -2,-4 Z" fill="#F1C40F"/>
  </g>

  <!-- Ground disturbance / dust particles at the off-road point -->
  <circle cx="130" cy="125" r="3" fill="#4E5D6C" opacity="0.7"/>
  <circle cx="145" cy="115" r="4.5" fill="#4E5D6C" opacity="0.5"/>
  <circle cx="155" cy="100" r="2" fill="#4E5D6C" opacity="0.8"/>
</svg>