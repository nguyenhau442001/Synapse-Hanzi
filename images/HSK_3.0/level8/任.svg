<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing professional guidance and standing -->
  <circle cx="120" cy="120" r="70" fill="#252D3D" opacity="0.6"/>

  <!-- Character / Person representing a Teacher (Role / 任 as a person/position) -->
  <!-- Shoulders and Suit Jacket -->
  <path d="M 80,185 L 95,145 L 120,155 L 145,145 L 160,185 Z" fill="#2A3447"/>
  
  <!-- Shirt & Tie -->
  <polygon points="120,155 110,135 130,135" fill="#E2E8F0"/>
  <polygon points="118,135 120,170 122,135" fill="#F59E0B"/> <!-- Gold/Orange accent tie -->

  <!-- Neck -->
  <rect x="112" y="122" width="16" height="20" fill="#E2B395"/>

  <!-- Head -->
  <circle cx="120" cy="100" r="22" fill="#E2B395"/>

  <!-- Hair (Neat, professional dark hair) -->
  <path d="M 98,100 C 98,82 104,78 120,78 C 136,78 142,82 142,100 C 142,105 140,92 140,88 C 140,82 133,80 120,80 C 107,80 100,82 100,88 C 100,92 98,105 98,100 Z" fill="#2C3E50"/>

  <!-- Glasses (Intellectual / Teacher attribute) -->
  <rect x="106" y="92" width="12" height="8" rx="2" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="122" y="92" width="12" height="8" rx="2" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <line x1="118" y1="96" x2="122" y2="96" stroke="#F59E0B" stroke-width="2"/>

  <!-- Gentle, confident smile -->
  <path d="M 114,112 Q 120,117 126,112" fill="none" stroke="#A0522D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Symbolic Role Badge / Official Standing Element (Representing the "Post/Duty/Office" meaning of 任) -->
  <!-- A sleek modern podium / emblem base in front -->
  <path d="M 90,200 L 150,200 L 140,175 L 100,175 Z" fill="#3B82F6" opacity="0.2"/>
  <rect x="95" y="195" width="50" height="6" rx="3" fill="#F59E0B"/>

  <!-- Floating focal point representing responsibility/duty above the person -->
  <circle cx="120" cy="52" r="14" fill="#F59E0B" opacity="0.15"/>
  <circle cx="120" cy="52" r="8" fill="#F59E0B"/>
  
  <!-- Checkmark inside the responsibility focal point (denoting accountability/responsibility - 负责任) -->
  <path d="M 116,52 L 119,55 L 125,48" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>