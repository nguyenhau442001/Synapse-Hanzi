<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Audience silhouette representing the crowd -->
  <path d="M40 220 C40 180, 80 160, 120 160 C160 160, 200 180, 200 220 Z" fill="#3D4451"/>
  <path d="M60 220 C60 190, 80 175, 100 175 C120 175, 140 190, 140 220 Z" fill="#4B5563"/>
  <path d="M100 220 C100 190, 120 175, 140 175 C160 175, 180 190, 180 220 Z" fill="#4B5563"/>
  
  <!-- Hands clapping in the center -->
  <g transform="translate(120, 130)">
    <!-- Left Hand -->
    <path d="M-40 0 C-60 -20, -70 -50, -40 -70 C-20 -80, 0 -70, 10 -50 L-10 -20 Z" fill="#FFB84D"/>
    <!-- Right Hand -->
    <path d="M40 0 C60 -20, 70 -50, 40 -70 C20 -80, 0 -70, -10 -50 L10 -20 Z" fill="#FFB84D"/>
    <!-- Motion lines -->
    <path d="M-50 -80 L-65 -95" stroke="#FFD699" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 -80 L65 -95" stroke="#FFD699" stroke-width="4" stroke-linecap="round"/>
    <path d="M-60 -40 L-80 -40" stroke="#FFD699" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 -40 L80 -40" stroke="#FFD699" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Spotlight effect -->
  <ellipse cx="120" cy="100" rx="90" ry="40" fill="url(#grad1)" opacity="0.2"/>
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFB84D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1D24;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>