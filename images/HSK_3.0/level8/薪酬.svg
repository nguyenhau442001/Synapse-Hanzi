<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Glow effect behind the object -->
    <circle cx="0" cy="15" r="55" fill="#F59E0B" opacity="0.12" filter="blur(8px)"/>
    
    <!-- Open Leather Briefcase (Base) -->
    <path d="M-65 30 L-50 70 L50 70 L65 30 Z" fill="#2D3748" stroke="#4A5568" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Briefcase Interior / Lining -->
    <path d="M-58 35 L-45 65 L45 65 L58 35 Z" fill="#1A202C"/>
    
    <!-- Briefcase Front Flap / Opening -->
    <path d="M-72 25 L72 25 L60 30 L-60 30 Z" fill="#3B4252" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Briefcase Clasps & Hardware (Gold) -->
    <rect x="-10" y="27" width="20" height="6" rx="2" fill="#F59E0B"/>
    <circle cx="0" cy="30" r="2" fill="#1A202C"/>
    
    <!-- Briefcase Handle -->
    <path d="M-22 25 C-22 10 22 10 22 25" fill="none" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <path d="M-20 25 C-20 12 20 12 20 25" fill="none" stroke="#718096" stroke-width="2" stroke-linecap="round"/>

    <!-- Stack of Gold Coins (Salary/Compensation) -->
    <!-- Coin Stack 1 (Left) -->
    <g transform="translate(-30, 20)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#D97706"/>
      <path d="M-14 0 L-14 15 C-14 19 0 19 14 19 L14 0 Z" fill="#D97706"/>
      <ellipse cx="0" cy="15" rx="14" ry="7" fill="#F59E0B"/>
      <path d="M-14 15 L-14 30 C-14 34 0 34 14 34 L14 15 Z" fill="#D97706"/>
      <ellipse cx="0" cy="30" rx="14" ry="7" fill="#FBBF24"/>
      <ellipse cx="0" cy="30" rx="9" ry="4.5" fill="none" stroke="#D97706" stroke-width="1.5"/>
    </g>

    <!-- Coin Stack 2 (Right) -->
    <g transform="translate(30, 15)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#D97706"/>
      <path d="M-14 0 L-14 15 C-14 19 0 19 14 19 L14 0 Z" fill="#D97706"/>
      <ellipse cx="0" cy="15" rx="14" ry="7" fill="#F59E0B"/>
      <path d="M-14 15 L-14 30 C-14 34 0 34 14 34 L14 15 Z" fill="#D97706"/>
      <ellipse cx="0" cy="30" rx="14" ry="7" fill="#FBBF24"/>
      <path d="M-14 30 L-14 45 C-14 49 0 49 14 49 L14 30 Z" fill="#D97706"/>
      <ellipse cx="0" cy="45" rx="14" ry="7" fill="#FBBF24"/>
      <ellipse cx="0" cy="45" rx="9" ry="4.5" fill="none" stroke="#D97706" stroke-width="1.5"/>
    </g>

    <!-- Coin Stack 3 (Center Foreground - Tallest) -->
    <g transform="translate(0, 5)">
      <ellipse cx="0" cy="0" rx="15" ry="7.5" fill="#D97706"/>
      <path d="M-15 0 L-15 14 C-15 18.1 0 18.1 15 14 L15 0 Z" fill="#D97706"/>
      <ellipse cx="0" cy="14" rx="15" ry="7.5" fill="#F59E0B"/>
      <path d="M-15 14 L-15 28 C-15 32.1 0 32.1 15 28 L15 14 Z" fill="#D97706"/>
      <ellipse cx="0" cy="28" rx="15" ry="7.5" fill="#F59E0B"/>
      <path d="M-15 28 L-15 42 C-15 46.1 0 46.1 15 42 L15 28 Z" fill="#D97706"/>
      <ellipse cx="0" cy="42" rx="15" ry="7.5" fill="#FBBF24"/>
      <ellipse cx="0" cy="42" rx="10" ry="5" fill="none" stroke="#D97706" stroke-width="1.5"/>
    </g>

    <!-- Floating Sparkles / Value Indicators -->
    <path d="M-45 -25 L-42 -33 L-35 -36 L-42 -39 L-45 -47 L-48 -39 L-55 -36 L-48 -33 Z" fill="#FBBF24" opacity="0.9"/>
    <path d="M52 -40 L54 -45 L59 -47 L54 -49 L52 -54 L50 -49 L45 -47 L50 -45 Z" fill="#FBBF24" opacity="0.9"/>
    <path d="M12 -52 L14 -57 L19 -59 L14 -61 L12 -66 L10 -61 L5 -59 L10 -57 Z" fill="#F59E0B" opacity="0.8"/>
  </g>
</svg>