    <path d="M33 52 Q40 58 47 52" stroke="#1A1D24" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="35" y="65" width="10" height="30" rx="2" fill="#FFB74D"/>
  </g>

  <!-- Connection line indicating similarity -->
  <path d="M115 100 L130 100" stroke="#FFB74D" stroke-width="2" stroke-dasharray="4 4"/>
</svg>