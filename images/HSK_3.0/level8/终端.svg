<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow representing cloud/network connection -->
  <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Server nodes at the top (representing the backend / "đầu cuối" network hub) -->
  <g transform="translate(92, 42)">
    <rect x="0" y="0" width="56" height="16" rx="4" fill="#2E384D"/>
    <circle cx="10" cy="8" r="2.5" fill="#38BDF8"/>
    <circle cx="18" cy="8" r="1.5" fill="#4ADE80"/>
    <rect x="38" y="6" width="10" height="4" rx="1" fill="#4B5563"/>
  </g>
  <g transform="translate(92, 20)">
    <rect x="0" y="0" width="56" height="16" rx="4" fill="#2E384D"/>
    <circle cx="10" cy="8" r="2.5" fill="#38BDF8"/>
    <circle cx="18" cy="8" r="1.5" fill="#4ADE80"/>
    <rect x="38" y="6" width="10" height="4" rx="1" fill="#4B5563"/>
  </g>

  <!-- Connection signal waves from server down to mobile terminal -->
  <path d="M120 58 L120 78" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
  <path d="M96 68 Q120 82 135 92" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M144 68 Q120 82 105 92" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Mobile Terminal (Smartphone - physical device / "thiết bị đầu cuối") -->
  <!-- Phone Shadow -->
  <rect x="79" y="99" width="82" height="126" rx="16" fill="#0F1115" opacity="0.5"/>

  <!-- Phone Body -->
  <rect x="77" y="96" width="86" height="130" rx="16" fill="#334155"/>
  <rect x="80" y="99" width="80" height="124" rx="13" fill="#0F172A"/>

  <!-- Screen bezel / Speaker notch -->
  <rect x="108" y="105" width="24" height="4" rx="2" fill="#334155"/>

  <!-- App UI Interface inside the Mobile Terminal -->
  <rect x="88" y="120" width="64" height="88" rx="8" fill="#1E293B"/>

  <!-- UI Header -->
  <rect x="96" y="130" width="28" height="6" rx="3" fill="#38BDF8"/>
  <rect x="96" y="140" width="48" height="4" rx="2" fill="#64748B"/>

  <!-- UI Content Cards -->
  <rect x="96" y="152" width="48" height="22" rx="4" fill="#0F172A"/>
  <circle cx="106" cy="163" r="5" fill="#38BDF8" opacity="0.8"/>
  <rect x="116" y="160" width="20" height="3" rx="1.5" fill="#94A3B8"/>
  <rect x="116" y="166" width="14" height="2" rx="1" fill="#475569"/>

  <!-- Action Button on Screen -->
  <rect x="96" y="180" width="48" height="20" rx="6" fill="#F59E0B"/>
  <rect x="112" y="188" width="16" height="4" rx="2" fill="#FFFFFF"/>

  <!-- Interactive Finger / Touch Gesture ("chạm nhẹ trên thiết bị đầu cuối") -->
  <!-- Pointing Finger -->
  <path d="M128 215 C128 215 132 203 135 198 C138 193 143 191 146 195 C149 199 148 204 144 209 C140 214 136 220 136 220 L128 215 Z" fill="#FBCFE8"/>
  <!-- Finger base / hand curve -->
  <path d="M136 220 C136 220 142 226 148 223 C154 220 159 212 159 212" fill="none" stroke="#FBCFE8" stroke-width="6" stroke-linecap="round"/>
  <!-- Touch Ripple Effect on Screen -->
  <circle cx="120" cy="190" r="10" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>
  <circle cx="120" cy="190" r="18" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
</svg>