<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Mountain Rescue / Exhaustion Context Graphic -->
    <!-- Background Mountain Silhouette -->
    <path d="M 40 180 L 90 100 L 140 160 L 180 110 L 210 180 Z" fill="#242833"/>
    <path d="M 20 180 L 60 130 L 110 180 Z" fill="#20242E"/>

    <!-- Exhausted Rescue Worker Character -->
    <!-- Ground / Rock -->
    <path d="M 50 180 C 100 175, 140 185, 190 180 L 200 195 L 40 195 Z" fill="#2F3542"/>
    
    <!-- Slumped Body (Sitting/Leaning exhausted) -->
    <!-- Legs bent -->
    <path d="M 105 175 L 130 185 L 155 175" fill="none" stroke="#E67E22" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torso leaning forward -->
    <path d="M 105 175 L 95 140" fill="none" stroke="#2980B9" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Dropped Arm & Hand resting on ground -->
    <path d="M 100 145 L 85 170" fill="none" stroke="#2980B9" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Head dropped down low -->
    <circle cx="82" cy="130" r="12" fill="#F39C12"/>
    <!-- Protective Helmet (Mountain Rescue context) -->
    <path d="M 68 128 C 68 120, 80 112, 94 124 Z" fill="#E67E22"/>

    <!-- Rescue Gear / Backpack beside -->
    <rect x="145" y="150" width="24" height="30" rx="6" fill="#D35400"/>
    <path d="M 152 150 L 152 142 C 152 138, 162 138, 162 142 L 162 150" fill="none" stroke="#A04000" stroke-width="3"/>
    
    <!-- Dropped Trekking Pole / Staff -->
    <line x1="110" y1="182" x2="175" y2="125" stroke="#7F8C8D" stroke-width="4" stroke-linecap="round"/>
    <line x1="165" y1="130" x2="175" y2="122" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>

    <!-- Visual symbols of utter exhaustion / heavy breathing -->
    <path d="M 62 105 Q 67 98 62 90" fill="none" stroke="#546E7A" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 52 108 Q 57 101 52 93" fill="none" stroke="#546E7A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Subtle HUD / Focus Ring highlighting the subject -->
    <circle cx="115" cy="145" r="75" fill="none" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  </g>
</svg>