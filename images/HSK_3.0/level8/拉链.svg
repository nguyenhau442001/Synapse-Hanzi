<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Zipper Track -->
  <path d="M110 40 L110 200 M130 40 L130 200" stroke="#4A5568" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Zipper Teeth -->
  <g stroke="#A0AEC0" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="50" x2="130" y2="50"/>
    <line x1="110" y1="70" x2="130" y2="70"/>
    <line x1="110" y1="90" x2="130" y2="90"/>
    <line x1="110" y1="110" x2="130" y2="110"/>
    <line x1="110" y1="130" x2="130" y2="130"/>
    <line x1="110" y1="150" x2="130" y2="150"/>
    <line x1="110" y1="170" x2="130" y2="170"/>
    <line x1="110" y1="190" x2="130" y2="190"/>
  </g>
  
  <!-- Zipper Slider Body -->
  <rect x="105" y="65" width="30" height="40" rx="4" fill="#ECC94B"/>
  
  <!-- Zipper Pull Tab -->
  <path d="M120 105 L120 135" stroke="#ECC94B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="142" r="8" fill="#ECC94B"/>
  
  <!-- Highlight on Slider -->
  <rect x="110" y="70" width="20" height="10" rx="2" fill="#F6E05E" opacity="0.6"/>
</svg>