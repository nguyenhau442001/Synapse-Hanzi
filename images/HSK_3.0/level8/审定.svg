<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: Official Textbook and Review Stamp representing "审定" (Examination & Approval) -->
  
  <!-- Textbook Base (Stack/Book) -->
  <g transform="translate(48, 55)">
    <!-- Book Shadow -->
    <rect x="12" y="12" width="120" height="150" rx="6" fill="#111318" opacity="0.5"/>
    
    <!-- Back Cover / Pages Depth -->
    <rect x="8" y="8" width="120" height="150" rx="6" fill="#2A2F3D"/>
    
    <!-- Main Cover -->
    <rect x="0" y="0" width="120" height="150" rx="6" fill="#3B82F6"/>
    
    <!-- Spine Accent -->
    <rect x="0" y="0" width="16" height="150" rx="4" fill="#2563EB"/>
    
    <!-- Cover Design Elements (Abstract representation of educational content) -->
    <!-- Title bar -->
    <rect x="32" y="30" width="68" height="10" rx="3" fill="#93C5FD"/>
    <!-- Sub lines -->
    <rect x="32" y="50" width="50" height="6" rx="2" fill="#60A5FA"/>
    <rect x="32" y="64" width="60" height="6" rx="2" fill="#60A5FA"/>
    
    <!-- Educational graphic on cover (Tree of knowledge / sprout) -->
    <circle cx="62" cy="105" r="22" fill="#1E40AF" opacity="0.3"/>
    <path d="M62 120 V96 M62 106 C54 102 52 94 56 90 C60 86 64 92 62 106 Z" fill="#60A5FA"/>
    <path d="M62 102 C70 98 72 90 68 86 C64 82 60 88 62 102 Z" fill="#93C5FD"/>
  </g>

  <!-- Official Approval Stamp / Seal (Layered on top to show "审定" action) -->
  <g transform="translate(110, 100)">
    <!-- Stamp Body / Handle (Isometric or Top-down perspective) -->
    <ellipse cx="40" cy="20" rx="28" ry="12" fill="#1E293B"/>
    <path d="M12 20 L16 35 C16 38 26 40 40 40 C54 40 64 38 64 35 L68 20 Z" fill="#334155"/>
    <ellipse cx="40" cy="35" rx="24" ry="8" fill="#475569"/>
    <rect x="32" y="8" width="16" height="14" fill="#64748B"/>
    <ellipse cx="40" cy="8" rx="8" ry="4" fill="#94A3B8"/>

    <!-- Stamp Base / Rubber Pad -->
    <rect x="10" y="42" width="60" height="14" rx="4" fill="#B91C1C"/>
    <rect x="6" y="52" width="68" height="8" rx="3" fill="#DC2626"/>

    <!-- Official Approval Mark (Checkmark in Star/Shield contour stamped in Gold/Amber) -->
    <g transform="translate(18, 70)">
      <!-- Drop shadow for stamped effect -->
      <path d="M 22 2 C 34 2 40 8 40 20 C 40 32 26 42 22 46 C 18 42 4 32 4 20 C 4 8 10 2 22 2 Z" fill="#000000" opacity="0.3" transform="translate(0, 3)"/>
      
      <!-- Shield / Badge background -->
      <path d="M 22 0 C 34 0 40 6 40 18 C 40 30 26 40 22 44 C 18 40 4 30 4 18 C 4 6 10 0 22 0 Z" fill="#F59E0B"/>
      <path d="M 22 3 C 32 3 37 8 37 18 C 37 28 25 37 22 40 C 19 37 7 28 7 18 C 7 8 12 3 22 3 Z" fill="#FBBF24"/>
      
      <!-- Precision Checkmark representing verified/approved (审定) -->
      <path d="M 13 18 L 19 24 L 31 11" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

</svg>