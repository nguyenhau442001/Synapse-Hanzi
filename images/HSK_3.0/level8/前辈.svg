<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Senior Figure (The "Qianbei") -->
  <g transform="translate(130, 80)">
    <circle cx="20" cy="20" r="18" fill="#FFB84D"/>
    <path d="M5 45 C5 35, 35 35, 35 45 L35 80 C35 90, 5 90, 5 80 Z" fill="#4D94FF"/>
    <rect x="15" y="80" width="10" height="40" fill="#4D94FF"/>
    <path d="M10 50 L30 50" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Junior Figure (The Learner) -->
  <g transform="translate(70, 110)">
    <circle cx="20" cy="20" r="14" fill="#A0A0A0"/>
    <path d="M5 40 C5 32, 35 32, 35 40 L35 70 C35 80, 5 80, 5 70 Z" fill="#707070"/>
    <rect x="15" y="70" width="8" height="30" fill="#707070"/>
    <!-- Bowing posture -->
    <path d="M20 35 L45 55" stroke="#707070" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Interaction/Knowledge Transfer Symbol -->
  <g transform="translate(110, 100)">
    <path d="M20 0 L20 30 M10 10 L20 0 L30 10" stroke="#FFB84D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>