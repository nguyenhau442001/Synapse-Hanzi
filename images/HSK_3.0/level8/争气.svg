<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character: A student character standing tall, looking determined -->
  <g transform="translate(120, 180)">
    <!-- Body -->
    <path d="M-20 0 L20 0 L15 -60 L-15 -60 Z" fill="#4A90E2"/>
    <!-- Head -->
    <circle cx="0" cy="-85" r="25" fill="#FFD700"/>
    <!-- Motion lines indicating upward focus/aspiration -->
    <path d="M0 -120 L0 -150 M-10 -130 L0 -150 M10 -130 L0 -150" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Achievement: A stylized academic cap (mortarboard) floating slightly above the character's reach, symbolizing the goal/success -->
  <g transform="translate(120, 70)">
    <polygon points="-40,0 0,20 40,0 0,-20" fill="#FF8C00"/>
    <rect x="-5" y="-10" width="10" height="30" fill="#FF8C00"/>
    <circle cx="0" cy="-20" r="6" fill="#FFD700"/>
  </g>

  <!-- Ground/Base -->
  <path d="M40 180 L200 180" stroke="#333B47" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Subtle upward motion lines near the feet -->
  <path d="M80 180 L70 150 M160 180 L170 150" stroke="#333B47" stroke-width="2" stroke-dasharray="4 4"/>
</svg>