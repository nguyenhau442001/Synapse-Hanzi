<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(12, 12)">
    <!-- Steam / Fresh Aroma Waves (Top) -->
    <path d="M100 45 C95 38 95 30 102 22 C109 14 105 8 100 2" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M118 42 C115 36 116 28 123 20 C130 12 126 6 122 1" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M82 48 C80 43 81 37 86 30 C91 23 88 18 85 13" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Bowl Rim / Back wall -->
    <ellipse cx="108" cy="95" rx="72" ry="24" fill="#334155"/>
    
    <!-- Clear Broth / Soup Surface -->
    <ellipse cx="108" cy="98" rx="66" ry="20" fill="#0EA5E9" opacity="0.3"/>
    <ellipse cx="108" cy="97" rx="62" ry="18" fill="#38BDF8" opacity="0.4"/>

    <!-- Garnishes (Spring onion rings) -->
    <circle cx="85" cy="92" r="3.5" fill="none" stroke="#22C55E" stroke-width="2"/>
    <circle cx="130" cy="102" r="3" fill="none" stroke="#22C55E" stroke-width="2"/>
    <circle cx="115" cy="90" r="2.5" fill="none" stroke="#22C55E" stroke-width="1.8"/>

    <!-- Fresh Cold-Water Fish (Arched elegantly in the bowl) -->
    <!-- Tail (submerged/dipping) -->
    <path d="M 52 105 Q 45 100 40 92 L 35 102 L 40 110 L 35 118 L 42 124 Q 46 115 52 110 Z" fill="#94A3B8"/>
    <path d="M 50 106 L 38 106" stroke="#64748B" stroke-width="1.5"/>
    
    <!-- Main Body -->
    <path d="M 50 108 C 65 92, 95 82, 125 90 C 148 96, 162 110, 172 125 C 162 132, 142 135, 120 130 C 90 122, 65 122, 50 108 Z" fill="#E2E8F0"/>
    
    <!-- Fish Underbelly Highlights (Fresh/Tender look) -->
    <path d="M 60 115 C 80 122, 110 125, 135 120 C 150 116, 160 110, 168 122 C 150 132, 100 132, 60 115 Z" fill="#F8FAFC" opacity="0.9"/>
    
    <!-- Scales Pattern (Subtle) -->
    <path d="M80 103 Q85 100 90 103" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M95 98 Q100 95 105 98" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M110 97 Q115 94 120 97" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M125 99 Q130 96 135 99" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Dorsal Fin -->
    <path d="M 90 92 Q 100 78 115 85 Q 105 90 90 92 Z" fill="#64748B"/>
    
    <!-- Pectoral Fin -->
    <path d="M 115 112 Q 125 125 120 132 Q 112 122 115 112 Z" fill="#CBD5E1" opacity="0.9"/>

    <!-- Eye -->
    <circle cx="158" cy="116" r="3" fill="#0F172A"/>
    <circle cx="159" cy="115" r="1" fill="#FFFFFF"/>

    <!-- Bowl Body (Front Section) -->
    <path d="M 36 95 C 36 140, 60 168, 108 168 C 156 168, 180 140, 180 95 C 180 112, 156 182, 108 182 C 60 182, 36 112, 36 95 Z" fill="#1E293B"/>
    <path d="M 36 95 C 36 140, 60 168, 108 168 C 156 168, 180 140, 180 95 C 180 120, 156 176, 108 176 C 60 176, 36 120, 36 95 Z" fill="#475569"/>

    <!-- Bowl Base -->
    <ellipse cx="108" cy="176" rx="42" ry="8" fill="#334155"/>

    <!-- Freshness/Quality Sparkles (Golden Yellow accents for 'Xiamei' excellence) -->
    <g transform="translate(155, 60)">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#FBBF24"/>
      <circle cx="0" cy="0" r="1" fill="#FEF3C7"/>
    </g>
    <g transform="translate(65, 55) scale(0.7)">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#FBBF24"/>
    </g>
    <g transform="translate(135, 45) scale(0.5)">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F59E0B"/>
    </g>
  </g>
</svg>