  <path d="M20 200 C35 195 45 205 60 200 C75 195 85 205 100 200 C115 195 125 205 140 200 C155 195 165 205 180 200 C195 195 205 205 220 200" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
