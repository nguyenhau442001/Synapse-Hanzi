<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="120" r="70" fill="#3B82F6" opacity="0.08"/>

  <!-- Conceptual Object: A sleek, concise document scroll/summary sheet (Physical Object representation) -->
  <!-- Main Document Board -->
  <g transform="translate(65, 45)">
    <!-- Document shadow/back layer -->
    <rect x="0" y="10" width="110" height="135" rx="8" fill="#111318"/>
    
    <!-- Main document page -->
    <rect x="0" y="0" width="110" height="135" rx="8" fill="#252A34" stroke="#374151" stroke-width="2"/>
    
    <!-- Header bar representing the briefing title -->
    <rect x="18" y="20" width="45" height="10" rx="3" fill="#3B82F6"/>
    <circle cx="85" cy="25" r="5" fill="#10B981"/>

    <!-- Concise summary lines (representing "简要" - brief, concise points) -->
    <!-- Point 1 -->
    <rect x="18" y="45" width="74" height="6" rx="3" fill="#9CA3AF"/>
    <rect x="18" y="56" width="50" height="6" rx="3" fill="#4B5563"/>

    <!-- Point 2 -->
    <rect x="18" y="75" width="74" height="6" rx="3" fill="#9CA3AF"/>
    <rect x="18" y="86" width="60" height="6" rx="3" fill="#4B5563"/>

    <!-- Point 3 -->
    <rect x="18" y="105" width="74" height="6" rx="3" fill="#9CA3AF"/>
    <rect x="18" y="116" width="35" height="6" rx="3" fill="#4B5563"/>

    <!-- Focal Accent: Gold checkmark/highlight badge for precision and summary -->
    <circle cx="85" cy="119" r="14" fill="#F59E0B"/>
    <!-- Checkmark path -->
    <path d="M78 119 L83 124 L93 113" fill="none" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>