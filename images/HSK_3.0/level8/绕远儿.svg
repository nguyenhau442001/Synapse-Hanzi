<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Mountain Background & Blocked Path Concept -->
  <!-- Mountain Silhouette -->
  <path d="M30 190 L95 100 L160 190 Z" fill="#222733"/>
  <path d="M110 190 L165 70 L220 190 Z" fill="#2A3142"/>

  <!-- Direct Path (Blocked) -->
  <path d="M125 190 L125 140" stroke="#3A445C" stroke-width="4" stroke-dasharray="4 4" fill="none"/>
  <!-- Landslide / Blockade Marker (X shape) -->
  <g transform="translate(125, 130)">
    <circle cx="0" cy="0" r="10" fill="#E74C3C"/>
    <path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Detour Route (绕远儿 - Long curving path around the mountain) -->
  <path d="M50 190 C 50 140, 90 120, 140 110 C 180 102, 210 130, 200 170 C 195 190, 180 190, 180 190" stroke="#F39C12" stroke-width="4" stroke-dasharray="6 6" fill="none"/>

  <!-- Motion/Action Arrow indicating the detour direction -->
  <path d="M135 105 L143 111 L136 117" stroke="#F39C12" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hiking Character walking the detour (Dynamic action) -->
  <g transform="translate(110, 85)">
    <!-- Hiking backpack -->
    <rect x="-8" y="4" width="8" height="12" rx="2" fill="#E67E22"/>
    <!-- Body / Torso leaned forward into the walk -->
    <line x1="-4" y1="18" x2="2" y2="6" stroke="#3498DB" stroke-width="5" stroke-linecap="round"/>
    <!-- Head with sun hat -->
    <circle cx="4" cy="1" r="4" fill="#FAD7A0"/>
    <path d="M0 -1 L8 -1" stroke="#E67E22" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Legs in motion -->
    <line x1="2" y1="18" x2="8" y2="24" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    <line x1="-4" y1="18" x2="-8" y2="25" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    <!-- Walking stick -->
    <line x1="6" y1="12" x2="14" y2="26" stroke="#95A5A6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Secondary Character following the detour path -->
  <g transform="translate(75, 120)">
    <rect x="-6" y="4" width="7" height="10" rx="2" fill="#D35400"/>
    <line x1="-3" y1="16" x2="1" y2="6" stroke="#2ECC71" stroke-width="4" stroke-linecap="round"/>
    <circle cx="3" cy="2" r="3.5" fill="#FAD7A0"/>
    <line x1="1" y1="16" x2="6" y2="22" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
    <line x1="-3" y1="16" x2="-6" y2="22" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Motion lines emphasizing the long sweeping journey -->
  <path d="M70 145 C 80 135, 95 130, 110 130" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="2 3" fill="none" opacity="0.6"/>
  <path d="M140 130 C 160 130, 180 145, 175 165" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="2 3" fill="none" opacity="0.6"/>

</svg>