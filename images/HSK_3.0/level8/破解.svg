<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative technical grid lines (subtle background) -->
  <path d="M40 60 H200 M40 100 H200 M40 140 H200 M40 180 H200" stroke="#252A34" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M60 40 V200 M100 40 V200 M140 40 V200 M180 40 V200" stroke="#252A34" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Complex Technical Core / Problem (Lock / Circuit structure opening up) -->
  <g transform="translate(120, 115)">
    <!-- Outer Shield / Hexagon Framework -->
    <path d="M-35 -55 L35 -55 L55 -15 L0 45 L-55 -15 Z" fill="#222831" stroke="#3A435E" stroke-width="2"/>
    
    <!-- Glowing Circuit Pathways (The Puzzle) -->
    <path d="M-25 -30 H0 V-10 H25" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-25" cy="-30" r="4" fill="#FF9F43"/>
    <circle cx="25" cy="-10" r="4" fill="#FF9F43"/>

    <path d="M-15 10 H15" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="4" fill="#FF9F43"/>

    <!-- Central Lock Mechanism Breaking Open (Decoding /破解 Action) -->
    <path d="M-12 -25 C-12 -38 12 -38 12 -25 V-15 H-12 Z" fill="none" stroke="#00D2D3" stroke-width="3"/>
    <rect x="-18" y="-15" width="36" height="28" rx="4" fill="#2E4057" stroke="#00D2D3" stroke-width="2"/>
    
    <!-- Code / Data streams emerging (Decoding effect) -->
    <line x1="-6" y1="-5" x2="6" y2="-5" stroke="#00D2D3" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="2" x2="8" y2="2" stroke="#00D2D3" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="9" x2="4" y2="9" stroke="#00D2D3" stroke-width="2" stroke-linecap="round"/>

    <!-- Dynamic Breaking apart fragments (Action) -->
    <path d="M-38 -35 L-48 -45" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M38 -35 L48 -45" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-42 0 L-54 0" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M42 0 L54 0" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Human Character Action (Researcher/Engineer hands actively solving/decoding) -->
  <!-- Left Hand / Arm -->
  <g transform="translate(65, 155)">
    <path d="M -15 35 L 15 5 L 35 15" fill="none" stroke="#4A5568" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sleeve -->
    <path d="M -20 40 L 5 15 L 20 28 L -5 50 Z" fill="#2E4057"/>
    <!-- Hand interacting -->
    <circle cx="33" cy="14" r="7" fill="#E2E8F0"/>
    <!-- Action motion lines -->
    <path d="M 45 5 L 55 -2" fill="none" stroke="#00D2D3" stroke-width="2" stroke-linecap="round"/>
    <path d="M 48 15 L 58 12" fill="none" stroke="#00D2D3" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Hand / Arm (Precision action tool/finger pointing) -->
  <g transform="translate(175, 155)">
    <path d="M 15 35 L -15 5 L -35 15" fill="none" stroke="#4A5568" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sleeve -->
    <path d="M 20 40 L -5 15 L -20 28 L 5 50 Z" fill="#2E4057"/>
    <!-- Hand interacting -->
    <circle cx="-33" cy="14" r="7" fill="#E2E8F0"/>
    <!-- Action motion lines -->
    <path d="M -45 5 L -55 -2" fill="none" stroke="#00D2D3" stroke-width="2" stroke-linecap="round"/>
    <path d="M -48 15 L -58 12" fill="none" stroke="#00D2D3" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Success / Solution Light Sparks -->
  <g transform="translate(120, 60)">
    <circle cx="0" cy="0" r="3" fill="#FFD32A"/>
    <path d="M -12 -12 L -6 -6" stroke="#FFD32A" stroke-width="2" stroke-linecap="round"/>
    <path d="M 12 -12 L 6 -6" stroke="#FFD32A" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 -16 V -8" stroke="#FFD32A" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>