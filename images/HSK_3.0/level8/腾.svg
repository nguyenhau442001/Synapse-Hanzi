<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "腾" (dọn trống, nhường chỗ - clearing space, making room in a bedroom context) -->
  <!-- Interior Bedroom Scene -->
  <!-- Wall Background -->
  <rect x="36" y="40" width="168" height="130" rx="6" fill="#242933"/>
  <!-- Floor -->
  <path d="M26 170 H214 L224 200 H16 Z" fill="#2E3440"/>

  <!-- Large South-facing Window with Warm Sunlight -->
  <rect x="52" y="56" width="60" height="85" rx="4" fill="#1E232B"/>
  <!-- Window Glass / Warm Sun Beam -->
  <path d="M56 60 H108 V137 H56 Z" fill="#FFB74D" fill-opacity="0.15"/>
  <!-- Window Frame Grids -->
  <line x1="86" y1="60" x2="86" y2="137" stroke="#3A4454" stroke-width="2"/>
  <line x1="56" y1="98" x2="108" y2="98" stroke="#3A4454" stroke-width="2"/>
  <!-- Sun rays diagonal accent -->
  <polygon points="56,60 130,170 110,170 56,80" fill="#FFB74D" fill-opacity="0.08"/>

  <!-- Cleared, Ready & Made King-size Bed (Representing the prepared master bedroom) -->
  <g transform="translate(116, 100)">
    <!-- Bed Frame -->
    <rect x="0" y="30" width="84" height="48" rx="4" fill="#3B4252"/>
    <rect x="4" y="36" width="76" height="42" rx="3" fill="#ECEFF4"/>
    <!-- Folded Blanket / Pillows at the head -->
    <rect x="8" y="42" width="26" height="30" rx="4" fill="#88C0D0"/>
    <rect x="38" y="42" width="26" height="30" rx="4" fill="#88C0D0"/>
    <!-- Headboard -->
    <path d="M-2 15 C-2 12 2 8 6 8 H78 C82 8 86 12 86 15 V78 H-2 Z" fill="#4C566A"/>
  </g>

  <!-- Moving Box / Luggage Being Cleared Out to Make Space (Action of dọn trống) -->
  <g transform="translate(68, 130)">
    <!-- Cardboard Box -->
    <rect x="0" y="10" width="36" height="30" rx="2" fill="#D08770"/>
    <path d="M0 10 L18 20 L36 10 Z" fill="#E59882"/>
    <!-- Box Flaps Open -->
    <path d="M0 10 L8 2 L18 10 Z" fill="#B45C3D"/>
    <path d="M36 10 L28 2 L18 10 Z" fill="#C67053"/>
    <!-- Packing Tape indicator -->
    <rect x="16" y="10" width="4" height="30" fill="#E5E9F0" fill-opacity="0.3"/>
  </g>

  <!-- Glowing Focus Accent: Neat, spacious arrangement emphasizing 'nhường chỗ / dọn trống' -->
  <circle cx="150" cy="110" r="3" fill="#FFB74D"/>
  <circle cx="160" cy="95" r="2" fill="#FFB74D" fill-opacity="0.6"/>
</svg>