<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <defs>
    <!-- Background Glow -->
    <radialGradient id="deepGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2D4A77" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>

    <!-- Crystal Gradients -->
    <linearGradient id="crystalOuter" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#E2F1FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#64B5F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0D47A1" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="crystalFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90CAF9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="crystalFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#42A5F5" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="coreBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFD54F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="120" cy="115" r="90" fill="url(#deepGlow)"/>

  <!-- Emitted Light Rays passing through the transparent object -->
  <g filter="url(#glow)">
    <polygon points="120,115 70,40 85,35" fill="#FFD54F" opacity="0.15"/>
    <polygon points="120,115 170,40 155,35" fill="#FFD54F" opacity="0.15"/>
    <polygon points="120,115 40,110 35,95" fill="#FFD54F" opacity="0.15"/>
    <polygon points="120,115 200,110 205,95" fill="#FFD54F" opacity="0.15"/>
  </g>

  <!-- Central Piercing Beam (Thorough / 透) -->
  <polygon points="112,190 128,190 135,35 105,35" fill="url(#coreBeam)" opacity="0.9"/>
  <polygon points="116,190 124,190 128,35 112,35" fill="#FFF" opacity="0.6"/>

  <!-- Transparent Crystal Object (Diamond / Prism structure) -->
  <g stroke="#90CAF9" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Outer Silhouette -->
    <polygon points="120,40 170,90 120,190 70,90" fill="url(#crystalOuter)"/>

    <!-- Inner Facet Lines / Transparency Detail -->
    <!-- Top Apex to Center -->
    <line x1="120" y1="40" x2="120" y2="115" stroke-opacity="0.6"/>
    
    <!-- Facet 1: Top Left -->
    <polygon points="120,40 70,90 120,115" fill="url(#crystalFacet1)"/>
    
    <!-- Facet 2: Top Right -->
    <polygon points="120,40 170,90 120,115" fill="url(#crystalFacet2)"/>

    <!-- Facet 3: Bottom Left -->
    <polygon points="120,190 70,90 120,115" fill="url(#crystalFacet2)" opacity="0.7"/>

    <!-- Facet 4: Bottom Right -->
    <polygon points="120,190 170,90 120,115" fill="url(#crystalFacet1)" opacity="0.7"/>

    <!-- Horizontal girdle line for gemstone realism -->
    <line x1="70" y1="90" x2="170" y2="90" stroke-opacity="0.8"/>
  </g>

  <!-- Refraction Highlights (Clarity / 彻) -->
  <path d="M120,50 L145,85 L120,105" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="95" y1="90" x2="110" y2="135" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Focused Core Spark at Center -->
  <circle cx="120" cy="115" r="4" fill="#FFFFFF" filter="url(#glow)"/>
</svg>