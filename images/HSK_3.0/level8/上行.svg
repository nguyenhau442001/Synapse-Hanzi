<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Tunnel/Track Background Structure -->
  <path d="M 60,200 L 90,60 L 150,60 L 180,200 Z" fill="#222730" />
  
  <!-- Perspective track lines -->
  <line x1="120" y1="60" x2="120" y2="200" stroke="#2D333D" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="97" y1="60" x2="70" y2="200" stroke="#2D333D" stroke-width="2"/>
  <line x1="143" y1="60" x2="170" y2="200" stroke="#2D333D" stroke-width="2"/>
  
  <!-- Subway Tunnel Arch (Curved Lines) -->
  <path d="M 75,55 Q 120,40 165,55" fill="none" stroke="#2D333D" stroke-width="3" stroke-linecap="round"/>
  <path d="M 65,90 Q 120,70 175,90" fill="none" stroke="#2D333D" stroke-width="2" opacity="0.5"/>
  <path d="M 60,130 Q 120,110 180,130" fill="none" stroke="#2D333D" stroke-width="2" opacity="0.5"/>

  <!-- Motion lines indicating upward travel -->
  <g opacity="0.6">
    <line x1="120" y1="35" x2="120" y2="20" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="105" y1="42" x2="98" y2="28" stroke="#FFB703" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="42" x2="142" y2="28" stroke="#FFB703" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sleek Modern Metro Train (Ascending / Shàngxíng) -->
  <!-- Main Body (Perspective narrowed towards top) -->
  <path d="M 94,80 L 146,80 L 158,160 L 82,160 Z" fill="#3A86FF" />
  <path d="M 94,80 L 146,80 L 158,160 L 82,160 Z" fill="url(#trainGrad)" />
  
  <!-- Train Nose / Front Bevel -->
  <path d="M 94,80 L 146,80 L 140,68 L 100,68 Z" fill="#4EA8DE" />

  <!-- Windshield / Driver Cabin Window -->
  <path d="M 103,73 L 137,73 L 143,84 L 97,84 Z" fill="#1A1D24" />

  <!-- Passenger Windows -->
  <rect x="91" y="94" width="16" height="18" rx="2" fill="#1A1D24" />
  <rect x="112" y="94" width="16" height="18" rx="2" fill="#1A1D24" />
  <rect x="133" y="94" width="16" height="18" rx="2" fill="#1A1D24" />

  <rect x="88" y="122" width="18" height="18" rx="2" fill="#1A1D24" />
  <rect x="111" y="122" width="18" height="18" rx="2" fill="#1A1D24" />
  <rect x="134" y="122" width="18" height="18" rx="2" fill="#1A1D24" />

  <!-- Headlights (Orange/Gold Accent) -->
  <circle cx="104" cy="65" r="3" fill="#FFB703" />
  <circle cx="136" cy="65" r="3" fill="#FFB703" />
  
  <!-- Light Beam Effect -->
  <path d="M 102,65 L 85,45 L 95,45 Z" fill="#FFB703" opacity="0.2"/>
  <path d="M 138,65 L 155,45 L 145,45 Z" fill="#FFB703" opacity="0.2"/>

  <!-- High-contrast Directional Arrow Overlay (Floating subtly above to emphasize 'shàngxíng' / upward direction) -->
  <g transform="translate(0, -5)">
    <path d="M 120,28 L 132,44 L 125,44 L 125,52 L 115,52 L 115,44 L 108,44 Z" fill="#FFB703" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A86FF"/>
      <stop offset="50%" stop-color="#4895EF"/>
      <stop offset="100%" stop-color="#3A86FF"/>
    </linearGradient>
  </defs>
</svg>