<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Shadow/Glow under the shaker -->
  <ellipse cx="120" cy="200" rx="45" ry="12" fill="#111318" opacity="0.8"/>
  <ellipse cx="120" cy="198" rx="35" ry="8" fill="#4B6584" opacity="0.15"/>

  <!-- Glass/Plastic Body of the Seasoning Shaker -->
  <path d="M 90 90 L 95 180 C 95 190, 145 190, 145 180 L 150 90 Z" fill="#2C3A47" stroke="#4B6584" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Transparent reflection on the bottle -->
  <path d="M 98 100 L 101 170 C 103 170, 107 170, 109 100 Z" fill="#FFFFFF" opacity="0.1"/>

  <!-- MSG Crystals inside the bottle -->
  <g fill="#F1F2F6" opacity="0.9">
    <polygon points="105,170 115,160 120,175 110,180"/>
    <polygon points="120,165 130,155 135,170 125,175"/>
    <polygon points="130,178 140,168 143,182 135,185"/>
    <polygon points="100,155 110,145 118,160 108,162"/>
    <polygon points="115,145 125,135 132,150 122,155"/>
    <polygon points="128,140 138,130 142,145 132,148"/>
    <polygon points="108,130 118,120 125,135 115,140"/>
  </g>
  <g fill="#FFD32A" opacity="0.6">
    <polygon points="112,162 118,155 122,165 116,168"/>
    <polygon points="122,148 128,142 132,152 126,155"/>
  </g>

  <!-- Metal/Plastic Collar -->
  <rect x="88" y="78" width="64" height="14" rx="3" fill="#718093" stroke="#2C3A47" stroke-width="2"/>
  <line x1="95" y1="85" x2="145" y2="85" stroke="#2C3A47" stroke-width="2" opacity="0.4"/>

  <!-- Dome Cap -->
  <path d="M 92 78 C 92 50, 148 50, 148 78 Z" fill="#FF4757" stroke="#2C3A47" stroke-width="2"/>
  <path d="M 115 54 C 120 52, 130 53, 135 56 C 130 54, 120 54, 115 54 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- Shaker Holes (Dispensing top) -->
  <circle cx="112" cy="68" r="1.5" fill="#2C3A47"/>
  <circle cx="120" cy="64" r="1.5" fill="#2C3A47"/>
  <circle cx="128" cy="68" r="1.5" fill="#2C3A47"/>
  <circle cx="120" cy="72" r="1.5" fill="#2C3A47"/>

  <!-- Sprinkled MSG Crystals / Umami Effect floating above -->
  <g transform="translate(0, -10)">
    <!-- Crystal 1 -->
    <polygon points="120,40 125,32 130,42 124,45" fill="#FFD32A"/>
    <!-- Crystal 2 -->
    <polygon points="100,48 105,42 109,50 103,53" fill="#F1F2F6"/>
    <!-- Crystal 3 -->
    <polygon points="140,46 146,38 150,48 144,51" fill="#F1F2F6"/>
    
    <!-- Sparkles/Focus Accents -->
    <path d="M 120,20 L 120,28 M 116,24 L 124,24" stroke="#FFD32A" stroke-width="2" stroke-linecap="round"/>
    <path d="M 90,38 L 94,42 M 90,42 L 94,38" stroke="#FFD32A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 150,36 L 154,40 M 150,40 L 154,36" stroke="#FFD32A" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>