<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Track A (International Standard) -->
  <path d="M40 80 L200 80" stroke="#4A5568" stroke-width="12" stroke-linecap="round"/>
  <rect x="50" y="74" width="12" height="24" rx="2" fill="#718096"/>
  <rect x="80" y="74" width="12" height="24" rx="2" fill="#718096"/>
  <rect x="110" y="74" width="12" height="24" rx="2" fill="#718096"/>
  <rect x="140" y="74" width="12" height="24" rx="2" fill="#718096"/>
  <rect x="170" y="74" width="12" height="24" rx="2" fill="#718096"/>
  
  <!-- Track B (Domestic Standard - Connecting) -->
  <path d="M40 160 L120 160" stroke="#F6AD55" stroke-width="12" stroke-linecap="round"/>
  <rect x="50" y="154" width="12" height="24" rx="2" fill="#ED8936"/>
  <rect x="80" y="154" width="12" height="24" rx="2" fill="#ED8936"/>
  
  <!-- The Connection Point (The "Jie Gui" action) -->
  <path d="M120 160 L120 80" stroke="#F6AD55" stroke-width="8" stroke-dasharray="6 6"/>
  <circle cx="120" cy="80" r="8" fill="#F6AD55"/>
  
  <!-- Joining Mechanism -->
  <path d="M110 150 L130 150 L125 90 L115 90 Z" fill="#ECC94B"/>
  <path d="M112 110 L128 110" stroke="#1A1D24" stroke-width="2"/>
  <path d="M114 125 L126 125" stroke="#1A1D24" stroke-width="2"/>
  <path d="M116 140 L124 140" stroke="#1A1D24" stroke-width="2"/>
</svg>