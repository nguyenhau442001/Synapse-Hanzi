<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle icy ground context -->
  <path d="M30 190 L210 190" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 196 L200 196" stroke="#262D3D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ice reflection gleams -->
  <path d="M60 187 L90 187" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M140 187 L170 187" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Motion & Slip effects (Action lines) -->
  <path d="M100 110 Q120 100 140 90" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" stroke-dasharray="4 4"/>
  
  <!-- Fallen Character (Simplified dynamic pose for 摔跤 - slipping/falling) -->
  <g transform="translate(120, 140) rotate(-35)">
    
    <!-- Flying winter scarf -->
    <path d="M-10 -25 C-30 -35 -40 -10 -55 -20" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Torso (Winter jacket) -->
    <rect x="-18" y="-20" width="36" height="42" rx="10" fill="#3B82F6"/>
    <!-- Jacket zipper detail -->
    <line x1="0" y1="-20" x2="0" y2="22" stroke="#1D4ED8" stroke-width="3"/>

    <!-- Head & Winter Beanie -->
    <circle cx="0" cy="-34" r="14" fill="#FBBF24"/>
    <path d="M-14 -38 C-14 -50 14 -50 14 -38 Z" fill="#EF4444"/>
    <circle cx="0" cy="-51" r="4" fill="#FFFFFF"/>

    <!-- Legs slipping / mid-fall -->
    <!-- Left leg (bent up) -->
    <path d="M-10 20 L-25 45 L-10 50" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right leg (extended forward/sliding) -->
    <path d="M10 20 L35 35 L50 30" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arms flailing for balance -->
    <!-- Left arm (backward) -->
    <path d="M-15 -10 L-40 5" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-42" cy="7" r="4" fill="#FBBF24"/>
    
    <!-- Right arm (forward/touching ground) -->
    <path d="M15 -10 L30 15" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="18" r="4" fill="#FBBF24"/>
  </g>

  <!-- Impact / Slip Sparkles -->
  <g transform="translate(135, 175)">
    <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
    <path d="M-8 -6 L-14 -10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 -6 L14 -10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 -10 L0 -18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>