<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle lighting glow -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Official License Document / Certificate Base -->
  <rect x="75" y="45" width="90" height="120" rx="6" fill="#2D3340" stroke="#3F485B" stroke-width="2"/>
  
  <!-- Document Header / Header Bar -->
  <rect x="90" y="60" width="60" height="8" rx="4" fill="#4E5970"/>
  
  <!-- Document Lines representing authenticated content -->
  <rect x="90" y="78" width="50" height="4" rx="2" fill="#3F485B"/>
  <rect x="90" y="88" width="40" height="4" rx="2" fill="#3F485B"/>
  <rect x="90" y="98" width="45" height="4" rx="2" fill="#3F485B"/>

  <!-- Security Hologram / Official Digital Badge -->
  <circle cx="120" cy="125" r="16" fill="#F59E0B" opacity="0.15"/>
  <circle cx="120" cy="125" r="12" fill="#F59E0B"/>
  
  <!-- Star icon inside the seal to represent premium authenticity -->
  <polygon points="120,118 122.2,122.8 127.5,123.5 123.7,127.3 124.6,132.5 120,129.9 115.4,132.5 116.3,127.3 112.5,123.5 117.8,122.8" fill="#1A1D24"/>

  <!-- Verified Checkmark Badge (overlapping bottom right of document) -->
  <g transform="translate(132, 135)">
    <circle cx="20" cy="20" r="18" fill="#1A1D24" stroke="#2D3340" stroke-width="3"/>
    <circle cx="20" cy="20" r="15" fill="#10B981"/>
    <!-- Checkmark -->
    <path d="M13 20.5L17.5 25L27 15.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>