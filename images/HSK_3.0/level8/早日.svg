<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sun rising over the horizon to represent "Early Day" (早日) -->
  <circle cx="120" cy="180" r="120" fill="#2C313C" clip-path="url(#clip)"/>
  <defs>
    <clipPath id="clip">
      <rect width="240" height="240" rx="24"/>
    </clipPath>
  </defs>

  <!-- Horizon line -->
  <path d="M40 160 L200 160" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>

  <!-- Sun -->
  <circle cx="120" cy="160" r="35" fill="#FFB84D"/>
  
  <!-- Rays -->
  <g stroke="#FFB84D" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="110" x2="120" y2="90"/>
    <line x1="170" y1="140" x2="185" y2="125"/>
    <line x1="70" y1="140" x2="55" y2="125"/>
  </g>

  <!-- Calendar page showing a single day/date to represent "Day" -->
  <rect x="95" y="145" width="50" height="60" rx="4" fill="#2C313C" stroke="#FFB84D" stroke-width="3"/>
  <rect x="95" y="145" width="50" height="15" rx="4" fill="#FFB84D"/>
  <circle cx="107" cy="152" r="3" fill="#1A1D24"/>
  <circle cx="133" cy="152" r="3" fill="#1A1D24"/>
  
  <!-- Clock hands on the calendar to represent "Early" -->
  <line x1="120" y1="175" x2="120" y2="160" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="175" x2="135" y2="175" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
</svg>