<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Motion lines for high-speed travel -->
    <g opacity="0.3" stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
      <line x1="30" y1="180" x2="70" y2="180" />
      <line x1="15" y1="192" x2="55" y2="192" />
      <line x1="40" y1="168" x2="90" y2="168" />
    </g>

    <!-- Railway track -->
    <path d="M 20 205 L 220 205" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 212 L 225 212" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
    <!-- Sleepers / Ties -->
    <path d="M 30 203 L 25 214 M 60 203 L 55 214 M 90 203 L 85 214 M 120 203 L 115 214 M 150 203 L 145 214 M 180 203 L 175 214 M 210 203 L 205 214" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

    <!-- Modern High-Speed Passenger Train (Bullet Train / 客运列车) -->
    <g id="bullet-train">
      <!-- Train Body Base -->
      <path d="M 45 185 C 30 185 22 175 18 165 C 14 150 25 130 55 130 L 195 130 C 215 130 220 145 220 160 C 220 178 200 185 180 185 Z" fill="#F3F4F6"/>
      
      <!-- Aerodynamic Nose / Lower Dark Accent -->
      <path d="M 18 165 C 14 150 25 130 55 130 L 120 130 L 120 185 L 45 185 C 30 185 22 175 18 165 Z" fill="#E5E7EB"/>
      
      <!-- Orange/Gold Accent Stripe -->
      <path d="M 19 162 C 22 170 30 177 45 177 L 212 177 C 215 170 215 158 212 150 L 22 150 C 19 155 18 159 19 162 Z" fill="#F59E0B"/>

      <!-- Dark Window Band -->
      <path d="M 50 138 L 195 138 C 205 138 210 142 210 147 L 45 147 C 45 142 48 138 50 138 Z" fill="#1F2937"/>

      <!-- Individual Passenger Windows -->
      <rect x="70" y="140" width="14" height="7" rx="2" fill="#60A5FA" opacity="0.8"/>
      <rect x="90" y="140" width="14" height="7" rx="2" fill="#60A5FA" opacity="0.8"/>
      <rect x="110" y="140" width="14" height="7" rx="2" fill="#60A5FA" opacity="0.8"/>
      <rect x="130" y="140" width="14" height="7" rx="2" fill="#60A5FA" opacity="0.8"/>
      <rect x="150" y="140" width="14" height="7" rx="2" fill="#60A5FA" opacity="0.8"/>
      <rect x="170" y="140" width="14" height="7" rx="2" fill="#60A5FA" opacity="0.8"/>
      <rect x="190" y="140" width="12" height="7" rx="2" fill="#60A5FA" opacity="0.8"/>

      <!-- Driver's Cabin Windshield -->
      <path d="M 32 154 C 35 154 38 155 40 157 L 42 165 C 38 166 30 165 26 160 C 28 156 30 154 32 154 Z" fill="#1E3A8A"/>

      <!-- Headlight / Indicator -->
      <circle cx="23" cy="170" r="3" fill="#FEF08A"/>
      <circle cx="28" cy="170" r="2" fill="#EF4444"/>

      <!-- Bogies / Wheels Base -->
      <rect x="65" y="185" width="25" height="6" rx="3" fill="#4B5563"/>
      <circle cx="72" cy="194" r="5" fill="#374151"/>
      <circle cx="83" cy="194" r="5" fill="#374151"/>

      <rect x="145" y="185" width="25" height="6" rx="3" fill="#4B5563"/>
      <circle cx="152" cy="194" r="5" fill="#374151"/>
      <circle cx="163" cy="194" r="5" fill="#374151"/>
    </g>

    <!-- Passenger Silhouette Elements inside upper section (representing people / 客) -->
    <g transform="translate(0, -35)">
      <!-- Stylized passenger icons above the train to emphasize "Passenger Transport" -->
      <g fill="#9CA3AF" transform="translate(85, 110)">
        <!-- Person 1 -->
        <circle cx="10" cy="5" r="4"/>
        <path d="M 3 16 C 3 11 17 11 17 16 Z"/>
      </g>
      <g fill="#9CA3AF" transform="translate(115, 110)">
        <!-- Person 2 -->
        <circle cx="10" cy="5" r="4"/>
        <path d="M 3 16 C 3 11 17 11 17 16 Z"/>
      </g>
      <g fill="#9CA3AF" transform="translate(145, 110)">
        <!-- Person 3 -->
        <circle cx="10" cy="5" r="4"/>
        <path d="M 3 16 C 3 11 17 11 17 16 Z"/>
      </g>
    </g>

    <!-- Station Departure Board / Sign Indicator Frame (Minimalist contextual graphic) -->
    <g transform="translate(70, 45)">
      <rect x="0" y="0" width="100" height="36" rx="6" fill="#111827" stroke="#374151" stroke-width="2"/>
      <!-- Glowing dot indicating active status -->
      <circle cx="14" cy="18" r="4" fill="#10B981"/>
      <!-- Abstract text/schedule lines representing transit -->
      <rect x="26" y="12" width="45" height="4" rx="2" fill="#E5E7EB"/>
      <rect x="26" y="21" width="30" height="3" rx="1.5" fill="#9CA3AF"/>
      <rect x="76" y="13" width="14" height="10" rx="2" fill="#F59E0B" opacity="0.2"/>
      <path d="M 81 16 L 86 18 L 81 20 Z" fill="#F59E0B"/>
    </g>
  </g>
</svg>