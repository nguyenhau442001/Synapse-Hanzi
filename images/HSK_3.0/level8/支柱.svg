<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Foundation Base -->
  <rect x="40" y="180" width="160" height="15" rx="2" fill="#4A5568"/>
  
  <!-- Main Pillar (The "Zhizhu") -->
  <rect x="100" y="60" width="40" height="120" rx="4" fill="#F6AD55"/>
  
  <!-- Top Structural Support -->
  <rect x="70" y="45" width="100" height="15" rx="4" fill="#E2E8F0"/>
  
  <!-- Decorative/Structural accents on the pillar -->
  <rect x="105" y="80" width="30" height="5" fill="#DD6B20" opacity="0.5"/>
  <rect x="105" y="110" width="30" height="5" fill="#DD6B20" opacity="0.5"/>
  <rect x="105" y="140" width="30" height="5" fill="#DD6B20" opacity="0.5"/>
  
  <!-- Shadow cast by the pillar -->
  <path d="M100 180 L140 180 L150 195 L90 195 Z" fill="#000000" opacity="0.3"/>
</svg>