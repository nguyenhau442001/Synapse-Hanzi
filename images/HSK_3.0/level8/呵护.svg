<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background ambient glow for warmth -->
  <circle cx="120" cy="130" r="70" fill="#E5A93B" opacity="0.06" filter="blur(20px)"/>

  <!-- Ground / Base line -->
  <path d="M 70 190 L 170 190" stroke="#2A303C" stroke-width="3" stroke-linecap="round"/>

  <!-- Thriving Green Sprout (The protected life/child) -->
  <g id="sprout">
    <path d="M 120 190 L 120 155" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M 120 168 C 105 160 95 145 102 135 C 109 125 118 140 120 168 Z" fill="#22C55E"/>
    <!-- Right leaf -->
    <path d="M 120 160 C 135 150 145 135 138 125 C 131 115 122 130 120 160 Z" fill="#4ADE80"/>
  </g>

  <!-- Gentle Cupping Hands (Nurturing, protecting, caring action) -->
  <!-- Back/Upper Hand (providing shelter/warmth from above) -->
  <g id="upper-hand">
    <path d="M 85 115 C 95 100 120 95 140 100 C 155 104 165 112 165 112" fill="none" stroke="#F6AD55" stroke-width="12" stroke-linecap="round"/>
    <!-- Fingers contour -->
    <path d="M 140 100 L 152 108" stroke="#DD6B20" stroke-width="4" stroke-linecap="round"/>
    <path d="M 115 97 L 122 105" stroke="#DD6B20" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Front/Lower Hands (cupping gently from below, symbolizing parents' care) -->
  <g id="lower-hands">
    <!-- Left cupping hand -->
    <path d="M 75 160 C 80 175 95 185 112 182" fill="none" stroke="#F6AD55" stroke-width="13" stroke-linecap="round"/>
    <!-- Right cupping hand -->
    <path d="M 165 160 C 160 175 145 185 128 182" fill="none" stroke="#ED8936" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- Soft focal highlights/sparkles indicating warmth and tenderness -->
  <circle cx="95" cy="125" r="2.5" fill="#FEEBC8" opacity="0.8"/>
  <circle cx="148" cy="135" r="2" fill="#FEEBC8" opacity="0.8"/>
  <circle cx="120" cy="115" r="3" fill="#FEEBC8" opacity="0.9"/>
</svg>