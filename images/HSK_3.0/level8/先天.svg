<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow for genetic/medical context -->
  <circle cx="120" cy="115" r="75" fill="#242B38" opacity="0.6"/>

  <!-- Conceptual illustration: DNA double helix transforming into a glowing infant silhouette representing "bẩm sinh" (先天 / innate / congenital) -->
  <g transform="translate(0, 0)">
    <!-- DNA Strand Left (Back) -->
    <path d="M 85,60 Q 110,85 85,110 Q 60,135 85,160 Q 110,185 85,200" fill="none" stroke="#384356" stroke-width="4" stroke-linecap="round"/>
    
    <!-- DNA Strand Right (Back) -->
    <path d="M 155,60 Q 130,85 155,110 Q 180,135 155,160 Q 130,185 155,200" fill="none" stroke="#384356" stroke-width="4" stroke-linecap="round"/>

    <!-- DNA Connecting Base Pairs -->
    <line x1="91" y1="75" x2="149" y2="75" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="110" x2="165" y2="110" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="91" y1="145" x2="149" y2="145" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="180" x2="160" y2="180" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>

    <!-- Glowing focal point / Central Infant/Life Symbol representing innate/congenital life -->
    <!-- Protective, nurturing cupped hands surrounding the inner spark of life -->
    <path d="M 75,135 C 75,155 95,170 120,170 C 145,170 165,155 165,135" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 85,145 C 85,160 100,175 120,175 C 140,175 155,160 155,145" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Central glowing abstract representation of a newborn child / life nucleus -->
    <circle cx="120" cy="110" r="26" fill="#1A1D24" stroke="#FFB703" stroke-width="3"/>
    
    <!-- Stylized newborn profile / innate spark inside the core -->
    <path d="M 110,105 C 110,98 115,95 122,98 C 128,100 132,106 130,113 C 128,118 123,122 118,122 C 115,122 112,120 110,117" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
    <circle cx="125" cy="104" r="2" fill="#FFB703"/>

    <!-- Radiating bright accent nodes representing genetic screening / discovery (scientific precision) -->
    <circle cx="155" cy="60" r="5" fill="#00E5FF"/>
    <circle cx="85" cy="60" r="5" fill="#00E5FF"/>
    <circle cx="120" cy="40" r="4" fill="#FFB703"/>
    
    <!-- Connection beam to top node -->
    <line x1="120" y1="40" x2="120" y2="70" stroke="#00E5FF" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
    <circle cx="120" cy="70" r="6" fill="#00E5FF"/>
  </g>
</svg>