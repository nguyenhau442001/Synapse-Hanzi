<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Dumbbell icon representing gym / physical training context -->
    <path d="M 50 100 L 70 100" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    <path d="M 130 100 L 150 100" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

    <!-- Broad robust shoulders and torso silhouette -->
    <!-- Head -->
    <circle cx="100" cy="55" r="16" fill="#4B6584"/>
    
    <!-- Neck -->
    <rect x="92" y="70" width="16" height="10" fill="#4B6584" rx="2"/>

    <!-- Broad Shoulders and Muscular Upper Body -->
    <path d="M 55 115 C 55 85, 75 80, 100 80 C 125 80, 145 85, 145 115 C 155 130, 160 160, 160 180 L 40 180 C 40 160, 45 130, 55 115 Z" fill="#2D3748"/>
    
    <!-- Muscle Definition Highlights (Strong, Vamvỡ/Cường tráng) -->
    <!-- Chest / Pectorals -->
    <path d="M 75 105 Q 100 120 125 105 Q 135 125 120 145 Q 100 155 80 145 Q 65 125 75 105 Z" fill="#4B6584"/>
    <path d="M 85 110 Q 100 122 115 110" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="100" y1="120" x2="100" y2="150" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

    <!-- Accent glow / fitness energy arc -->
    <path d="M 35 95 C 20 125, 20 155, 35 185" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 165 95 C 180 125, 180 155, 165 185" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Strength indicator check/sparkle -->
    <circle cx="100" cy="30" r="4" fill="#FF9F43"/>
    <path d="M 96 30 L 104 30 M 100 26 L 100 34" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>