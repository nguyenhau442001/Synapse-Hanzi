<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Water basin / bowl -->
  <path d="M60 120 C60 160 80 180 120 180 C160 180 180 160 180 120 Z" fill="#242933" stroke="#3A4250" stroke-width="4"/>
  
  <!-- Water surface inside bowl -->
  <ellipse cx="120" cy="120" rx="54" ry="24" fill="#1E3A5F" opacity="0.8"/>
  
  <!-- Swirling water currents (clockwise motion) -->
  <path d="M 90 125 C 95 110, 115 110, 130 115 C 145 120, 155 130, 140 135" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 100 115 C 110 110, 120 115, 125 125" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Grains of rice swirling in water (gold/cream colored, angled) -->
  <g fill="#FDE047">
    <ellipse cx="100" cy="118" rx="5" ry="2.5" transform="rotate(25 100 118)" />
    <ellipse cx="115" cy="112" rx="5" ry="2.5" transform="rotate(-15 115 112)" />
    <ellipse cx="132" cy="122" rx="5" ry="2.5" transform="rotate(40 132 122)" />
    <ellipse cx="108" cy="130" rx="5" ry="2.5" transform="rotate(65 108 130)" />
    <ellipse cx="125" cy="132" rx="5" ry="2.5" transform="rotate(-30 125 132)" />
    <ellipse cx="140" cy="120" rx="5" ry="2.5" transform="rotate(10 140 120)" />
    <ellipse cx="92" cy="127" rx="5" ry="2.5" transform="rotate(-45 92 127)" />
  </g>

  <!-- Impurities / heavy sand particles sinking at the bottom -->
  <g fill="#EF4444">
    <circle cx="118" cy="148" r="2" />
    <circle cx="123" cy="152" r="1.5" />
    <circle cx="112" cy="150" r="1.5" />
  </g>

  <!-- Rim of the basin (front overlay for depth) -->
  <path d="M60 120 C60 135, 80 145, 120 145 C160 145, 180 135, 180 120" stroke="#4B5563" stroke-width="4" fill="none"/>

  <!-- Hands gently washing/swirling (side motion indicators) -->
  <path d="M 45 105 Q 55 115 65 105" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 195 135 Q 185 125 175 135" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>