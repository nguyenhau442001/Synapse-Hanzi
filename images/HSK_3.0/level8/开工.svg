<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background engineering grid lines -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="3 3">
    <line x1="40" y1="40" x2="200" y2="40"/>
    <line x1="40" y1="90" x2="200" y2="90"/>
    <line x1="40" y1="140" x2="200" y2="140"/>
    <line x1="40" y1="190" x2="200" y2="190"/>
    <line x1="60" y1="30" x2="60" y2="210"/>
    <line x1="120" y1="30" x2="120" y2="210"/>
    <line x1="180" y1="30" x2="180" y2="210"/>
  </g>

  <!-- Ground construction base -->
  <rect x="30" y="175" width="180" height="8" rx="4" fill="#334155"/>
  <rect x="25" y="183" width="190" height="4" rx="2" fill="#0F172A"/>

  <!-- Excavator (representing "kāigōng" - heavy construction / startup of project) -->
  <g transform="translate(0, 5)">
    <!-- Tracks / Tread -->
    <g transform="translate(65, 140)">
      <rect x="0" y="0" width="55" height="22" rx="11" fill="#475569"/>
      <rect x="4" y="4" width="47" height="14" rx="7" fill="#1E293B"/>
      <!-- Tread teeth/details -->
      <circle cx="15" cy="11" r="5" fill="#64748B"/>
      <circle cx="40" cy="11" r="5" fill="#64748B"/>
      <line x1="27" y1="4" x2="27" y2="18" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- Excavator Body / Cab -->
    <g transform="translate(75, 100)">
      <!-- Main yellow body casing -->
      <path d="M 0 30 L 0 15 C 0 8, 8 5, 15 5 L 35 5 C 42 5, 48 10, 50 18 L 52 30 Z" fill="#F59E0B"/>
      <rect x="0" y="25" width="52" height="18" rx="2" fill="#D97706"/>
      
      <!-- Cabin Glass & Interior -->
      <path d="M 12 8 L 32 8 L 38 25 L 12 25 Z" fill="#0EA5E9" opacity="0.8"/>
      <!-- Operator silhouette hint -->
      <circle cx="22" cy="16" r="3" fill="#1E293B"/>
      <path d="M 19 23 C 19 20, 25 20, 25 23" fill="#1E293B"/>

      <!-- Exhaust Pipe emitting startup exhaust/steam -->
      <rect x="6" y="-3" width="3" height="8" fill="#64748B"/>
      <ellipse cx="7.5" cy="-5" rx="2" ry="1" fill="#94A3B8" opacity="0.6"/>
      <circle cx="6" cy="-10" r="3" fill="#94A3B8" opacity="0.4"/>
      <circle cx="9" cy="-15" r="4.5" fill="#94A3B8" opacity="0.2"/>
    </g>

    <!-- Articulated Boom & Arm (Raised high in action) -->
    <!-- Boom (lower arm) -->
    <path d="M 115 115 L 145 80" stroke="#D97706" stroke-width="10" stroke-linecap="round"/>
    <path d="M 115 115 L 145 80" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Joint pivot -->
    <circle cx="145" cy="80" r="5" fill="#334155"/>

    <!-- Stick (upper arm) -->
    <path d="M 145 80 L 175 105" stroke="#D97706" stroke-width="8" stroke-linecap="round"/>
    <path d="M 145 80 L 175 105" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>

    <!-- Bucket (digging into ground) -->
    <g transform="translate(175, 100)">
      <path d="M 0 0 L 12 -5 L 18 10 L 5 15 Z" fill="#475569"/>
      <path d="M 12 -5 L 16 -8 L 22 2 L 18 10 Z" fill="#64748B"/>
      <!-- Bucket teeth -->
      <path d="M 16 -8 L 18 -11 M 19 -5 L 22 -7 M 22 1 L 26 0" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Construction Sparks / Energy indicators (Clean vector style, NO abstract non-standard UI) -->
  <g transform="translate(185, 115)">
    <circle cx="0" cy="0" r="2" fill="#FBBF24"/>
    <circle cx="8" cy="-8" r="1.5" fill="#FBBF24"/>
    <path d="M 3 -4 L 7 -7" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Ground excavated earth mound -->
  <path d="M 165 178 C 170 170, 185 168, 195 178 Z" fill="#D97706"/>
  <path d="M 175 178 C 180 172, 190 172, 205 178 Z" fill="#B45309"/>

  <!-- Sleek Modern Frame Accent (Top-left architectural cue) -->
  <path d="M 30 50 L 30 35 L 45 35" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 210 50 L 210 35 L 195 35" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 30 190 L 30 205 L 45 205" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 210 190 L 210 205 L 195 205" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

</svg>