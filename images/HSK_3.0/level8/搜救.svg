<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Terrain: Mountainous silhouette -->
  <path d="M0 240 L0 180 L40 140 L80 180 L130 120 L180 170 L240 130 L240 240 Z" fill="#2C313A"/>
  
  <!-- Drone (Search) -->
  <g transform="translate(160, 60)">
    <path d="M-15 -5 L15 -5 L10 5 L-10 5 Z" fill="#FFB347"/>
    <circle cx="-12" cy="0" r="4" fill="#FFD700"/>
    <circle cx="12" cy="0" r="4" fill="#FFD700"/>
    <path d="M0 0 L0 20" stroke="#FFB347" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="0" cy="22" r="3" fill="#FFD700"/>
  </g>

  <!-- Search Dog (Action) -->
  <g transform="translate(60, 160)">
    <path d="M-10 -10 L10 -10 L15 0 L15 10 L-15 10 L-15 0 Z" fill="#E0E0E0"/>
    <path d="M-12 -12 L-8 -18 L-4 -12 Z" fill="#E0E0E0"/>
    <path d="M8 -12 L12 -18 L16 -12 Z" fill="#E0E0E0"/>
    <path d="M5 -5 L15 -5" stroke="#FFB347" stroke-width="2"/>
  </g>

  <!-- Rescuer (Action) -->
  <g transform="translate(110, 140)">
    <path d="M0 0 L10 0 L8 40 L-2 40 Z" fill="#FFB347"/>
    <circle cx="4" cy="-5" r="8" fill="#FFB347"/>
    <path d="M-10 10 L0 20 L10 10" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>
    <!-- Motion lines for search -->
    <path d="M20 20 Q30 10 40 20" stroke="#FFD700" stroke-width="2" fill="none"/>
    <path d="M25 25 Q35 15 45 25" stroke="#FFD700" stroke-width="2" fill="none"/>
  </g>

  <!-- Rain/Weather effect -->
  <line x1="20" y1="0" x2="10" y2="20" stroke="#78909C" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="0" x2="70" y2="20" stroke="#78909C" stroke-width="1" opacity="0.4"/>
  <line x1="140" y1="0" x2="130" y2="20" stroke="#78909C" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="0" x2="190" y2="20" stroke="#78909C" stroke-width="1" opacity="0.4"/>
</svg>