<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Leg silhouette -->
  <path d="M85 50 C 85 50, 70 120, 85 190 C 85 190, 120 200, 155 190 C 155 190, 140 120, 155 50 Z" fill="#2D343E"/>
  
  <!-- Acupuncture point markers (Huyệt vị) -->
  <circle cx="120" cy="80" r="6" fill="#FFB84D"/>
  <circle cx="120" cy="130" r="6" fill="#FFB84D"/>
  <circle cx="120" cy="170" r="6" fill="#FFB84D"/>
  
