    <line x1="120" y1="80" x2="120" y2="30" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="30" r="4" fill="#E0E0E0"/>
  </g>
  
  <!-- Subtle anatomical lines -->
  <path d="M95 70 Q 120 80 145 70" stroke="#3E4756" stroke-width="2" fill="none"/>
  <path d="M95 120 Q 120 130 145 120" stroke="#3E4756" stroke-width="2" fill="none"/>
  <path d="M95 160 Q 120 170 145 160" stroke="#3E4756" stroke-width="2" fill="none"/>
