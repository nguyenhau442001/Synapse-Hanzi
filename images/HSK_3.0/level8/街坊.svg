<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements: Simplified house silhouettes -->
  <path d="M30 180 L30 120 L60 90 L90 120 L90 180 Z" fill="#2C333F"/>
  <path d="M150 180 L150 120 L180 90 L210 120 L210 180 Z" fill="#2C333F"/>
  
  <!-- Character 1 (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="30" cy="30" r="25" fill="#FFB84D"/>
    <path d="M15 60 Q30 80 45 60 L45 120 L15 120 Z" fill="#FFB84D"/>
    <path d="M20 45 L25 50 M35 45 L40 50" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 55 Q30 60 38 55" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Character 2 (Right) -->
  <g transform="translate(130, 100)">
    <circle cx="30" cy="30" r="25" fill="#4D9FFF"/>
    <path d="M15 60 Q30 80 45 60 L45 120 L15 120 Z" fill="#4D9FFF"/>
    <path d="M20 45 L25 50 M35 45 L40 50" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 55 Q30 60 38 55" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- The shared item: A plate with simple pastries -->
  <g transform="translate(95, 160)">
    <ellipse cx="25" cy="10" rx="30" ry="8" fill="#E0E0E0"/>
    <circle cx="15" cy="5" r="6" fill="#FFD700"/>
    <circle cx="35" cy="5" r="6" fill="#FFD700"/>
  </g>
  
  <!-- Interaction: Hands exchanging -->
  <path d="M85 150 L105 140" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
  <path d="M155 150 L135 140" stroke="#4D9FFF" stroke-width="6" stroke-linecap="round"/>
</svg>