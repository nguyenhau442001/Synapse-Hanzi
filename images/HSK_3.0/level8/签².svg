<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Document / Contract Sheet representing the signing context -->
  <g transform="translate(45, 30)">
    <!-- Paper base -->
    <rect width="150" height="160" rx="6" fill="#F4F5F7"/>
    
    <!-- Header line -->
    <rect x="25" y="24" width="60" height="8" rx="4" fill="#D0D4DC"/>
    
    <!-- Text placeholder lines -->
    <rect x="25" y="48" width="100" height="5" rx="2.5" fill="#E2E5EC"/>
    <rect x="25" y="62" width="85" height="5" rx="2.5" fill="#E2E5EC"/>
    <rect x="25" y="76" width="95" height="5" rx="2.5" fill="#E2E5EC"/>

    <!-- Signature line area -->
    <line x1="25" y1="125" x2="125" y2="125" stroke="#CBD0DC" stroke-width="2" stroke-dasharray="4 3"/>
    
    <!-- Stylized dynamic signature (noun: the signature itself) -->
    <path d="M 38 122 C 45 110, 52 135, 60 115 C 65 105, 70 128, 82 118 C 90 112, 105 110, 115 116" 
          fill="none" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Modern sleek pen completing the signature (Accent color: Gold/Orange) -->
  <g transform="translate(110, 35) rotate(35)">
    <!-- Pen body -->
    <path d="M 0 0 L 12 0 L 10 95 L 2 95 Z" fill="#F59E0B"/>
    <!-- Pen grip/details -->
    <rect x="2" y="20" width="8" height="15" fill="#D97706"/>
    <!-- Pen tip -->
    <path d="M 2 95 L 6 108 L 10 95 Z" fill="#374151"/>
    <!-- Metal nib -->
    <path d="M 4 99 L 6 108 L 8 99 Z" fill="#9CA3AF"/>
  </g>
</svg>