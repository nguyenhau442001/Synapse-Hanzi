<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mountain Path Context -->
  <path d="M40 180 L120 120 L200 180" stroke="#4A5568" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8 8"/>
  
  <!-- Character: Hiking/Walking -->
  <g transform="translate(100, 100)">
    <!-- Body -->
    <path d="M20 80 L20 50 L35 40 L50 50 L50 80" fill="#E2E8F0"/>
    <!-- Head -->
    <circle cx="35" cy="30" r="12" fill="#E2E8F0"/>
    <!-- Arm pointing/warning gesture -->
    <path d="M35 50 L60 30" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 30 L70 40" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Emphasis/Action: The "Remember/Warning" gesture -->
  <g transform="translate(170, 70)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#F6AD55" stroke-width="3" stroke-dasharray="4 6"/>
    <path d="M0 -10 L0 5" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="12" r="2" fill="#F6AD55"/>
  </g>
  
  <!-- Visualizing "Remember/Keep in mind" (Finger to temple) -->
  <g transform="translate(135, 130)">
    <path d="M0 0 C10 -20 30 -20 40 0" stroke="#F6AD55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M20 -15 L20 -30" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>