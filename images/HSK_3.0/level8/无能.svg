<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient grid/circuit lines representing global cybersecurity context -->
  <g opacity="0.15" stroke="#00E5FF" stroke-width="1" fill="none">
    <path d="M40 60 H200" stroke-dasharray="2 4"/>
    <path d="M40 180 H200" stroke-dasharray="2 4"/>
    <circle cx="120" cy="120" r="70" stroke-dasharray="4 6"/>
  </g>

  <!-- Central Character representing "Wuneng" (Incompetence / Helplessness in crisis) -->
  <g transform="translate(0, 5)">
    <!-- Office Chair -->
    <path d="M105 160 L105 185 L95 195 H145 L135 185 L135 160 Z" fill="#2D323E"/>
    <rect x="95" y="115" width="50" height="45" rx="6" fill="#3B4252"/>
    <rect x="100" y="80" width="40" height="35" rx="4" fill="#3B4252"/>

    <!-- Slumped Person / Human Figure showing defeat/powerlessness -->
    <!-- Head (bowed down in despair/helplessness) -->
    <circle cx="120" cy="72" r="14" fill="#E5E9F0"/>
    <!-- Hair -->
    <path d="M106 70 C106 62 112 56 120 56 C128 56 134 62 134 70 Z" fill="#4C566A"/>

    <!-- Slumped Torso -->
    <path d="M102 95 C102 95 105 120 120 125 C135 120 138 95 138 95 Z" fill="#D08770"/>

    <!-- Powerless Dropped Arms (hanging limp) -->
    <!-- Left Arm -->
    <path d="M104 98 L85 125 L75 125" fill="none" stroke="#D08770" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm -->
    <path d="M136 98 L155 125 L165 125" fill="none" stroke="#D08770" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Legs (sitting defeated) -->
    <path d="M108 150 L95 175 L80 175" fill="none" stroke="#5E81AC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 150 L145 175 L160 175" fill="none" stroke="#5E81AC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Broken / Unresponsive Terminal Screens floating around (Representing cyber defense failure) -->
  <!-- Screen 1 (Left, error state) -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="44" height="32" rx="4" fill="#2E3440" stroke="#BF616A" stroke-width="2"/>
    <path d="M12 10 L32 22 M32 10 L12 22" stroke="#BF616A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Screen 2 (Right, threat intrusion warning) -->
  <g transform="translate(160, 85)">
    <rect x="0" y="0" width="48" height="36" rx="4" fill="#2E3440" stroke="#BF616A" stroke-width="2"/>
    <!-- Warning exclamation mark -->
    <circle cx="24" cy="15" r="3" fill="#BF616A"/>
    <path d="M24 21 V25" stroke="#BF616A" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 6 H36" stroke="#4C566A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Focal Accent (Orange/Gold highlight for conceptual focus without breaking rules) -->
  <path d="M120 30 L124 38 L132 39 L126 45 L128 53 L120 49 L112 53 L114 45 L108 39 L116 38 Z" fill="#EBCB8B" opacity="0.8"/>
</svg>