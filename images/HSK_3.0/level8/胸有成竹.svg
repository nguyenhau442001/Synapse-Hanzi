<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle grid for context -->
  <path d="M0 120h240M120 0v240" stroke="#2D343E" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- The "Bamboo" (Representing the plan/strategy) -->
  <g transform="translate(160, 60)">
    <rect x="-6" y="0" width="12" height="120" rx="2" fill="#2ECC71"/>
    <rect x="-4" y="20" width="8" height="2" fill="#1A1D24"/>
    <rect x="-4" y="60" width="8" height="2" fill="#1A1D24"/>
    <rect x="-4" y="100" width="8" height="2" fill="#1A1D24"/>
    <path d="M6 30l20-10M6 70l20-10" stroke="#2ECC71" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The Person (Calm, confident, holding the plan) -->
  <g transform="translate(80, 120)">
    <!-- Body -->
    <path d="M-30 100c0-30 15-40 30-40s30 10 30 40" fill="#3498DB"/>
    <!-- Head -->
    <circle cx="0" cy="30" r="25" fill="#FAD7A0"/>
    <!-- Calm Expression -->
    <path d="M-10 25h5M10 25h5" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 40q8 5 16 0" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Hand holding the bamboo -->
    <path d="M20 60l20-10" stroke="#FAD7A0" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Visual contrast: The "Goal" (Large, bright, achieved) -->
  <circle cx="180" cy="180" r="30" fill="none" stroke="#F1C40F" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="180" cy="180" r="15" fill="#F1C40F"/>
</svg>