<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="beamGrad" x1="120" y1="40" x2="120" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0.0"/>
    </linearGradient>
    
    <linearGradient id="handsGrad" x1="120" y1="130" x2="120" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A4454"/>
      <stop offset="100%" stop-color="#282E3B"/>
    </linearGradient>

    <linearGradient id="itemGrad" x1="95" y1="95" x2="145" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light Beam / Presentation Aura -->
  <polygon points="120,40 175,185 65,185" fill="url(#beamGrad)"/>

  <!-- Background Subtle Architectural Arch / Institution Context -->
  <path d="M85,85 L120,60 L155,85 L155,100 L85,100 Z" fill="#242B38" opacity="0.6"/>
  <rect x="90" y="100" width="60" height="4" fill="#323B4D" rx="2"/>

  <!-- High-tech Scientific Instrument (The physical object being dedicated / donated) -->
  <g filter="url(#glow)">
    <!-- Base platform -->
    <path d="M90,165 L150,165 L158,175 L82,175 Z" fill="#2E384A"/>
    
    <!-- Central Optical/Scientific Core -->
    <circle cx="120" cy="125" r="22" fill="#151922" stroke="url(#itemGrad)" stroke-width="4"/>
    <circle cx="120" cy="125" r="10" fill="#00E5FF" opacity="0.8"/>
    
    <!-- Emitting energy rays upward -->
    <line x1="120" y1="95" x2="120" y2="75" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="102" x2="95" y2="90" stroke="#FFB800" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="135" y1="102" x2="145" y2="90" stroke="#FFB800" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Supporting rings -->
    <path d="M102,135 C108,145 132,145 138,135" fill="none" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Presenting Hands (Respectful offering gesture) -->
  <g>
    <!-- Left Hand -->
    <path d="M60,195 C60,175 75,155 95,150 C100,149 104,152 103,157 C102,161 96,166 88,172 C80,178 74,185 73,195 Z" fill="url(#handsGrad)" stroke="#4E5D73" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Right Hand -->
    <path d="M180,195 C180,175 165,155 145,150 C140,149 136,152 137,157 C138,161 144,166 152,172 C160,178 166,185 167,195 Z" fill="url(#handsGrad)" stroke="#4E5D73" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Cuffs / Sleeves -->
    <path d="M50,195 L90,195 L85,210 L45,210 Z" fill="#242B38"/>
    <path d="M190,195 L150,195 L155,210 L195,210 Z" fill="#242B38"/>
  </g>

  <!-- Focal Golden Sparkles (Denoting value, contribution, ceremony) -->
  <path d="M120,55 L122,62 L129,64 L122,66 L120,73 L118,66 L111,64 L118,62 Z" fill="#FFB800"/>
  <path d="M75,115 L76,119 L80,120 L76,121 L75,125 L74,121 L70,120 L74,119 Z" fill="#FFB800" opacity="0.8"/>
  <path d="M165,115 L166,119 L170,120 L166,121 L165,125 L164,121 L160,120 L164,119 Z" fill="#FFB800" opacity="0.8"/>
</svg>