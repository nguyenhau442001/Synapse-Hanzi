<svg width="240" height="240" rx="24" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle laboratory background elements -->
  <path d="M40 180 L200 180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <!-- Cracked wall detail -->
  <path d="M180 80 L185 95 L178 105 L182 120" stroke="#2A2F3D" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Centered Iconic Object representing "简陋" (Rudimentary/Spacious/Crude Laboratory Equipment) -->
  <g transform="translate(0, 5)">
    <!-- Wooden/Improvised Table -->
    <rect x="60" y="145" width="120" height="10" rx="2" fill="#5C4033"/>
    <rect x="75" y="155" width="12" height="30" fill="#3E2723"/>
    <rect x="153" y="155" width="12" height="30" fill="#3E2723"/>

    <!-- Makeshift Lab Stand (Crude, uneven) -->
    <path d="M95 145 L95 95 L102 95 L102 145 Z" fill="#718096"/>
    <path d="M100 105 L120 105" stroke="#718096" stroke-width="4" stroke-linecap="round"/>

    <!-- Crude Flask with bubbling liquid (representing early scientific research in rudimentary conditions) -->
    <path d="M105 115 L135 115 L145 140 L95 140 Z" fill="#2D3748" stroke="#A0AEC0" stroke-width="2" stroke-linejoin="round"/>
    <rect x="115" y="105" width="10" height="10" fill="#A0AEC0"/>
    
    <!-- Liquid inside flask -->
    <path d="M100 130 L140 130 L143 138 L97 138 Z" fill="#DD6B20" opacity="0.8"/>

    <!-- Bubbles -->
    <circle cx="115" cy="123" r="2" fill="#F6AD55"/>
    <circle cx="125" cy="120" r="1.5" fill="#F6AD55"/>

    <!-- Makeshift Bunsen Burner / Heat Source -->
    <rect x="72" y="133" width="16" height="12" rx="2" fill="#4A5568"/>
    <path d="M80 133 C80 125 75 120 80 115 C85 120 80 125 80 133 Z" fill="#ED8936"/>

    <!-- Loose, messy wires/tubing (adding to the 'sơ sài, tồi tàn' aspect) -->
    <path d="M138 135 C150 135 155 120 170 125" stroke="#4A5568" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- An old-fashioned, simple vacuum tube or makeshift bulb -->
    <ellipse cx="170" cy="115" rx="8" ry="12" fill="none" stroke="#A0AEC0" stroke-width="2"/>
    <line x1="170" y1="127" x2="170" y2="135" stroke="#A0AEC0" stroke-width="2"/>
    <path d="M167 113 L173 113" stroke="#ED8936" stroke-width="2"/>
  </g>

  <!-- Accent glow for focal point -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#ED8936" stroke-width="1" opacity="0.15" stroke-dasharray="4 8"/>
</svg>