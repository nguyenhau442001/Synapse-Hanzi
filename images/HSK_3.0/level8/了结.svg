<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background graphical context -->
  <g opacity="0.15">
    <line x1="40" y1="180" x2="200" y2="180" stroke="#8EA4C8" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M70,120 L120,90 L170,120" fill="none" stroke="#8EA4C8" stroke-width="2"/>
  </g>

  <!-- Central Visual Representation: '了结' (Resolution / Finalizing an agreement / Closing a dispute) -->
  <!-- Document / Contract Base representing the resolved dispute/agreement -->
  <g transform="translate(60, 45)">
    <!-- Document background sheet -->
    <rect x="15" y="10" width="90" height="115" rx="6" fill="#2B313C" stroke="#3E4756" stroke-width="2"/>
    
    <!-- Document header lines (agreement text representation) -->
    <rect x="28" y="25" width="40" height="6" rx="3" fill="#526075"/>
    <rect x="28" y="39" width="64" height="4" rx="2" fill="#3E4756"/>
    <rect x="28" y="49" width="52" height="4" rx="2" fill="#3E4756"/>
    
    <!-- Checkmark/Seal indicating final resolution (Orange/Gold accent for focus) -->
    <circle cx="85" cy="85" r="18" fill="#F59E0B" opacity="0.15"/>
    <circle cx="85" cy="85" r="14" fill="#F59E0B"/>
    <!-- Checkmark icon inside seal -->
    <path d="M78 85 L83 90 L93 79" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dynamic Human Action: A hand firmly placing the final stamp / concluding the document with motion lines -->
  <g transform="translate(0, 0)">
    <!-- Motion lines indicating the concluding downward action -->
    <path d="M 135 110 L 135 95" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 148 115 L 148 100" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Arm and hand gripping a golden pen/stamp to execute the final closure -->
    <path d="M 155 155 C 150 140, 142 125, 138 112" fill="none" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Stylized hand closing the matter -->
    <circle cx="137" cy="110" r="8" fill="#93C5FD"/>
    
    <!-- Pen / Seal tool in action -->
    <rect x="131" y="95" width="12" height="20" rx="3" fill="#F59E0B" transform="rotate(-15 137 105)"/>
  </g>

  <!-- Decorative Spark/Burst indicating successful completion/resolution -->
  <g transform="translate(165, 55)">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="10" cy="10" r="3" fill="#F59E0B"/>
  </g>
</svg>