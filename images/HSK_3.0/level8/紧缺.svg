<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid lines for high-tech context -->
  <g opacity="0.15">
    <line x1="40" y1="40" x2="200" y2="40" stroke="#60A5FA" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="40" y1="100" x2="200" y2="100" stroke="#60A5FA" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="40" y1="160" x2="200" y2="160" stroke="#60A5FA" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="70" y1="30" x2="70" y2="210" stroke="#60A5FA" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="120" y1="30" x2="120" y2="210" stroke="#60A5FA" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="170" y1="30" x2="170" y2="210" stroke="#60A5FA" stroke-width="0.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Central Physical Object: Microchip / Integrated Circuit (representing high-tech specialized talent/component) -->
  <g transform="translate(65, 65)">
    <!-- Outer glow / highlight aura representing high value & scarce focus -->
    <rect x="-6" y="-6" width="122" height="122" rx="20" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Chip Base -->
    <rect x="0" y="0" width="110" height="110" rx="12" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Chip Pins (Top) -->
    <rect x="25" y="-8" width="8" height="8" fill="#F59E0B"/>
    <rect x="51" y="-8" width="8" height="8" fill="#F59E0B"/>
    <rect x="77" y="-8" width="8" height="8" fill="#F59E0B"/>
    
    <!-- Chip Pins (Bottom) -->
    <rect x="25" y="110" width="8" height="8" fill="#F59E0B"/>
    <rect x="51" y="110" width="8" height="8" fill="#F59E0B"/>
    <rect x="77" y="110" width="8" height="8" fill="#F59E0B"/>
    
    <!-- Chip Pins (Left) -->
    <rect x="-8" y="25" width="8" height="8" fill="#F59E0B"/>
    <rect x="-8" y="51" width="8" height="8" fill="#F59E0B"/>
    <rect x="-8" y="77" width="8" height="8" fill="#F59E0B"/>
    
    <!-- Chip Pins (Right) -->
    <rect x="110" y="25" width="8" height="8" fill="#F59E0B"/>
    <rect x="110" y="51" width="8" height="8" fill="#F59E0B"/>
    <rect x="110" y="77" width="8" height="8" fill="#F59E0B"/>
    
    <!-- Inner Die / Core -->
    <rect x="18" y="18" width="74" height="74" rx="8" fill="#1A202C" stroke="#2B6CB0" stroke-width="2"/>
    
    <!-- Circuit Paths inside Chip -->
    <path d="M 30 55 L 45 55 L 55 40 L 80 40" fill="none" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="40" r="3" fill="#63B3ED"/>
    
    <path d="M 30 75 L 50 75 L 65 60 L 80 60" fill="none" stroke="#63B3ED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="60" r="3" fill="#63B3ED"/>
    
    <path d="M 55 30 L 55 45" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="55" cy="30" r="3" fill="#F59E0B"/>

    <!-- Central Focal Point -->
    <rect x="42" y="42" width="26" height="26" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="48" y="48" width="14" height="14" rx="2" fill="#1A202C"/>
  </g>

  <!-- Scarcity Indicator: Stylized clean frame cutout or subtle bracket overlay denoting absolute shortage/tight supply -->
  <g stroke="#EF4444" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Top-Left Corner Accent -->
    <path d="M 45 60 L 45 45 L 60 45"/>
    <!-- Top-Right Corner Accent -->
    <path d="M 195 60 L 195 45 L 180 45"/>
    <!-- Bottom-Left Corner Accent -->
    <path d="M 45 180 L 45 195 L 60 195"/>
    <!-- Bottom-Right Corner Accent -->
    <path d="M 195 180 L 195 195 L 180 195"/>
  </g>

  <!-- Warning / Critical Focus Indicator (Pulsing-style minimalist node) -->
  <circle cx="195" cy="120" r="6" fill="#EF4444"/>
  <circle cx="195" cy="120" r="12" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.6"/>
</svg>