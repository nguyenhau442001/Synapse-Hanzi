<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient glow representing park atmosphere -->
  <circle cx="120" cy="110" r="70" fill="#FFB703" opacity="0.08"/>
  
  <!-- Stylized cheerful children figures (joyful silhouettes/flat characters) -->
  <!-- Child 1 (Left, jumping/laughing) -->
  <g transform="translate(65, 100)">
    <!-- Body/Clothing -->
    <path d="M 0 35 L 20 35 L 22 70 L 15 75 L 5 75 L -2 70 Z" fill="#FFB703"/>
    <!-- Head -->
    <circle cx="10" cy="15" r="12" fill="#FFE169"/>
    <!-- Hair -->
    <path d="M -1 8 Q 10 2 21 8 Q 15 2 10 4 Q 5 2 -1 8" fill="#D97706"/>
    <!-- Arms raised in laughter/joy -->
    <path d="M 5 25 L -8 12 M 15 25 L 28 12" stroke="#FFE169" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="3" y1="75" x2="-2" y2="95" stroke="#FFE169" stroke-width="4" stroke-linecap="round"/>
    <line x1="17" y1="75" x2="22" y2="95" stroke="#FFE169" stroke-width="4" stroke-linecap="round"/>
    <!-- Face (laughing eyes & open mouth) -->
    <path d="M 6 12 Q 8 15 10 12" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 12 12 Q 14 15 16 12" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 9 17 Q 11 21 13 17 Z" fill="#1A1D24"/>
  </g>

  <!-- Child 2 (Right, arms up, laughing) -->
  <g transform="translate(145, 90)">
    <!-- Body/Clothing -->
    <path d="M 0 35 L 20 35 L 24 70 L 16 77 L 4 77 L -2 70 Z" fill="#FB8500"/>
    <!-- Head -->
    <circle cx="10" cy="15" r="12" fill="#FFD166"/>
    <!-- Hair pigtails -->
    <circle cx="-1" cy="12" r="4" fill="#E85D04"/>
    <circle cx="21" cy="12" r="4" fill="#E85D04"/>
    <path d="M -1 8 Q 10 0 21 8" fill="#E85D04"/>
    <!-- Arms raised -->
    <path d="M 2 22 L -10 32 M 18 22 L 30 32" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="4" y1="77" x2="0" y2="98" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="77" x2="20" y2="98" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <!-- Face -->
    <path d="M 6 13 Q 8 10 10 13" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 12 13 Q 14 10 16 13" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 8 16 Q 11 21 14 16 Z" fill="#1A1D24"/>
  </g>

  <!-- Child 3 (Center, bursting with laughter, arms wide) -->
  <g transform="translate(100, 75)">
    <!-- Body/Clothing -->
    <path d="M 0 40 L 20 40 L 22 75 L 15 80 L 5 80 L -2 75 Z" fill="#219EBC"/>
    <!-- Head -->
    <circle cx="10" cy="16" r="13" fill="#FFB703"/>
    <!-- Hair tuft -->
    <path d="M 7 5 Q 10 -2 13 5 Z" fill="#023047"/>
    <!-- Arms wide open in cheer -->
    <path d="M 2 28 L -12 20 M 18 28 L 32 20" stroke="#FFB703" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="4" y1="80" x2="2" y2="102" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="80" x2="18" y2="102" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
    <!-- Face - big happy laugh -->
    <path d="M 5 13 Q 7 11 9 13" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 13 13 Q 15 11 17 13" stroke="#1A1D24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 7 17 Q 10 23 13 17 Z" fill="#1A1D24"/>
  </g>

  <!-- Sound/Laughter Waves (Visualizing "欢声" - sounds of joy & laughter) -->
  <g fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <!-- Left waves -->
    <path d="M 45 75 Q 38 85 45 95"/>
    <path d="M 35 68 Q 25 85 35 102" opacity="0.6"/>
    
    <!-- Right waves -->
    <path d="M 195 75 Q 202 85 195 95"/>
    <path d="M 205 68 Q 215 85 205 102" opacity="0.6"/>
    
    <!-- Top melodic sound notes / accents -->
    <path d="M 85 40 Q 90 32 95 40" stroke-width="2"/>
    <circle cx="95" cy="30" r="2.5" fill="#FFB703"/>
    
    <path d="M 145 35 Q 150 27 155 35" stroke-width="2"/>
    <circle cx="145" cy="25" r="2.5" fill="#FFB703"/>
  </g>

  <!-- Joyful sparkles / confetti elements representing festive park atmosphere -->
  <g fill="#FFD166" opacity="0.9">
    <circle cx="50" cy="45" r="3"/>
    <circle cx="190" cy="50" r="2.5"/>
    <circle cx="120" cy="28" r="3.5"/>
    <rect x="30" y="115" width="4" height="4" rx="1" transform="rotate(45 32 117)" fill="#219EBC"/>
    <rect x="210" y="110" width="5" height="5" rx="1" transform="rotate(15 212 112)" fill="#FB8500"/>
    <rect x="105" y="15" width="4" height="4" rx="1" transform="rotate(30 107 17)" fill="#FFB703"/>
  </g>

  <!-- Ground Line representing park terrain -->
  <path d="M 30 195 Q 120 185 210 195" stroke="#2A2F3D" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>