<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "依次" (sequentially / in order at an airport security check):
       A conveyor belt with successive, orderly bins/luggage trays moving through an X-ray scanner arch,
       clearly depicting a sequence of discrete objects in exact order. -->

  <!-- Conveyor Belt Table/Base -->
  <path d="M 28 140 L 212 140 L 202 176 L 38 176 Z" fill="#2D323E"/>
  <path d="M 28 140 L 212 140 L 212 146 L 28 146 Z" fill="#3E4453"/>

  <!-- Conveyor Rollers / Stripes -->
  <line x1="55" y1="146" x2="60" y2="170" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="146" x2="95" y2="170" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="146" x2="130" y2="170" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="146" x2="165" y2="170" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="146" x2="200" y2="170" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>

  <!-- Sequence Items 1, 2, 3 (Bins on Conveyor in precise order) -->
  
  <!-- Tray 1 (Back/Left - First in sequence) -->
  <g transform="translate(45, 115)">
    <!-- Tray body -->
    <path d="M 0 10 L 10 25 L 45 25 L 55 10 Z" fill="#4B5263"/>
    <path d="M 2 10 L 10 8 L 45 8 L 53 10 Z" fill="#6C757D"/>
    <!-- Item inside: Laptop -->
    <rect x="15" y="10" width="25" height="12" rx="2" fill="#94A3B8"/>
    <rect x="18" y="12" width="19" height="8" fill="#CBD5E1"/>
  </g>

  <!-- Tray 2 (Middle - Second in sequence) -->
  <g transform="translate(100, 110)">
    <!-- Tray body -->
    <path d="M 0 10 L 10 25 L 45 25 L 55 10 Z" fill="#4B5263"/>
    <path d="M 2 10 L 10 8 L 45 8 L 53 10 Z" fill="#6C757D"/>
    <!-- Item inside: Backpack/Bag -->
    <path d="M 17 6 C 17 3 20 2 25 2 C 30 2 33 3 33 6 L 33 20 L 17 20 Z" fill="#F59E0B"/>
    <rect x="21" y="9" width="13" height="10" rx="2" fill="#D97706"/>
  </g>

  <!-- Tray 3 (Front/Right - Third in sequence) -->
  <g transform="translate(155, 105)">
    <!-- Tray body -->
    <path d="M 0 10 L 10 25 L 45 25 L 55 10 Z" fill="#4B5263"/>
    <path d="M 2 10 L 10 8 L 45 8 L 53 10 Z" fill="#6C757D"/>
    <!-- Item inside: Suitcase -->
    <rect x="16" y="6" width="23" height="18" rx="3" fill="#3B82F6"/>
    <line x1="16" y1="12" x2="39" y2="12" stroke="#1E40AF" stroke-width="2"/>
    <path d="M 24 6 L 24 4 C 24 3 25 2 27 2 C 29 2 30 3 30 4 L 30 6" fill="none" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- X-Ray Scanner Arch (Context frame on the right) -->
  <path d="M 165 40 L 210 40 L 210 150 L 195 150 L 195 55 L 180 55 L 180 150 L 165 150 Z" fill="#334155"/>
  <rect x="175" y="45" width="30" height="12" rx="3" fill="#0EA5E9"/>
  <!-- Scanner opening / tunnel glow -->
  <rect x="180" y="70" width="20" height="60" fill="#0F172A"/>
  <line x1="190" y1="70" x2="190" y2="130" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Directional / Sequence Flow Arrows (indicating "依次" - one after another) -->
  <g fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 70 85 Q 90 75 110 85"/>
    <polyline points="102,80 110,85 103,91"/>

    <path d="M 125 85 Q 145 75 165 85"/>
    <polyline points="157,80 165,85 158,91"/>
  </g>

</svg>