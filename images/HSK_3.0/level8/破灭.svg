<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "破灭" (shattered illusion/bubble) as a fragile, ornate glass sphere shattering -->
  <g transform="translate(120, 120)">
    <!-- Main glowing core fragments -->
    <path d="M-40 -20 L-10 -50 L20 -30 L5 -10 Z" fill="#FFB347" opacity="0.8"/>
    <path d="M10 10 L40 40 L10 60 L-20 30 Z" fill="#FFD700" opacity="0.9"/>
    
    <!-- Sharp shards flying outwards -->
    <path d="M-60 -60 L-40 -80 L-30 -60 Z" fill="#FF8C00"/>
    <path d="M50 -50 L70 -30 L50 -20 Z" fill="#FF8C00"/>
    <path d="M-50 40 L-70 60 L-40 70 Z" fill="#FF8C00"/>
    <path d="M40 50 L60 70 L80 50 Z" fill="#FF8C00"/>
    
    <!-- Central crack lines -->
    <path d="M-30 -30 L0 0 L30 -30" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M0 0 L0 40" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M0 0 L-30 20" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    
    <!-- Circular outline remnants -->
    <path d="M-60 0 A60 60 0 0 1 0 -60" stroke="#FFD700" stroke-width="3" fill="none" stroke-dasharray="10 5"/>
    <path d="M0 60 A60 60 0 0 1 60 0" stroke="#FFD700" stroke-width="3" fill="none" stroke-dasharray="10 5"/>
  </g>
</svg>