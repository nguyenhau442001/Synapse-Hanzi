<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glows -->
  <circle cx="120" cy="130" r="70" fill="#262B35" opacity="0.6"/>

  <!-- Wine jar / Urn (Traditional Chinese ceramic jar for brewing - 酿造) -->
  <g transform="translate(0, 5)">
    <!-- Jar Base / Shadow -->
    <ellipse cx="120" cy="205" rx="35" ry="8" fill="#111318"/>

    <!-- Main Body of the Clay Pot -->
    <path d="M 85,100 C 85,85 95,75 110,75 L 130,75 C 145,75 155,85 155,100 L 168,140 C 175,165 160,195 120,195 C 80,195 65,165 72,140 Z" fill="#C25936"/>
    <!-- Shading on the pot body for 3D/Flat depth -->
    <path d="M 120,75 L 120,195 C 150,195 165,165 168,140 L 155,100 C 155,85 145,75 130,75 Z" fill="#A84524"/>

    <!-- Pot Neck & Rim -->
    <ellipse cx="120" cy="75" rx="20" ry="6" fill="#D66843"/>
    <path d="M 100,75 C 100,70 110,67 120,67 C 130,67 140,70 140,75 L 140,82 C 140,87 130,90 120,90 C 110,90 100,87 100,82 Z" fill="#E2734C"/>
    <ellipse cx="120" cy="75" rx="15" ry="4" fill="#A84524"/>

    <!-- Traditional Clay Seal / Cloth cover with rope -->
    <path d="M 92,72 C 92,62 105,58 120,58 C 135,58 148,62 148,72 C 148,76 135,80 120,80 C 105,80 92,76 92,72 Z" fill="#D4AF37"/>
    <path d="M 96,72 C 96,65 106,62 120,62 C 134,62 144,65 144,72 Z" fill="#F4D06F"/>
    <!-- Rope Tied Around Neck -->
    <path d="M 101,75 C 110,78 130,78 139,75" stroke="#5C3A21" stroke-width="3" fill="none"/>
    <circle cx="120" cy="77" r="2.5" fill="#5C3A21"/>

    <!-- Decorative Label / Emblem on Urn -->
    <g transform="translate(120, 135)">
      <rect x="-16" y="-22" width="32" height="44" rx="4" fill="#F4D06F"/>
      <rect x="-13" y="-19" width="26" height="38" rx="2" fill="#E0B84C"/>
      <!-- Abstract seal script lines representing traditional brewing quality -->
      <line x1="-6" y1="-11" x2="6" y2="-11" stroke="#A84524" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-8" y1="-3" x2="8" y2="-3" stroke="#A84524" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-5" y1="5" x2="5" y2="5" stroke="#A84524" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-7" y1="13" x2="7" y2="13" stroke="#A84524" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Sorghum Stalks / Grains (Representing raw ingredients: 高粱) flanking the jar -->
    <!-- Left Sorghum -->
    <g transform="translate(60, 110) rotate(-15)">
      <path d="M 0,50 L 0,-20" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>
      <!-- Grain buds -->
      <ellipse cx="0" cy="-25" rx="5" ry="8" fill="#E5A93B"/>
      <ellipse cx="-6" cy="-15" rx="4" ry="6" fill="#D97724"/>
      <ellipse cx="6" cy="-15" rx="4" ry="6" fill="#D97724"/>
      <ellipse cx="-4" cy="-5" rx="4" ry="6" fill="#E5A93B"/>
      <ellipse cx="4" cy="-5" rx="4" ry="6" fill="#E5A93B"/>
      <ellipse cx="-5" cy="5" rx="4" ry="6" fill="#D97724"/>
      <ellipse cx="5" cy="5" rx="4" ry="6" fill="#D97724"/>
      <path d="M -8,15 C -4,12 4,12 8,15" stroke="#795548" stroke-width="2" fill="none"/>
    </g>

    <!-- Right Sorghum -->
    <g transform="translate(180, 110) rotate(15)">
      <path d="M 0,50 L 0,-20" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>
      <!-- Grain buds -->
      <ellipse cx="0" cy="-25" rx="5" ry="8" fill="#E5A93B"/>
      <ellipse cx="-6" cy="-15" rx="4" ry="6" fill="#D97724"/>
      <ellipse cx="6" cy="-15" rx="4" ry="6" fill="#D97724"/>
      <ellipse cx="-4" cy="-5" rx="4" ry="6" fill="#E5A93B"/>
      <ellipse cx="4" cy="-5" rx="4" ry="6" fill="#E5A93B"/>
      <ellipse cx="-5" cy="5" rx="4" ry="6" fill="#D97724"/>
      <ellipse cx="5" cy="5" rx="4" ry="6" fill="#D97724"/>
      <path d="M -8,15 C -4,12 4,12 8,15" stroke="#795548" stroke-width="2" fill="none"/>
    </g>

    <!-- Bubbles / Aroma rising (Visualizing fermentation and maturing process) -->
    <g opacity="0.8">
      <circle cx="105" cy="45" r="4" fill="#F4D06F" opacity="0.6"/>
      <circle cx="135" cy="38" r="6" fill="#F4D06F" opacity="0.8"/>
      <circle cx="120" cy="25" r="3" fill="#F4D06F" opacity="0.5"/>
      <circle cx="128" cy="14" r="5" fill="#F4D06F" opacity="0.3"/>
    </g>
  </g>
</svg>