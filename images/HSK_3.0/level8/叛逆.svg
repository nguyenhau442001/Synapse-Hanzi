<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow symbolizing inner tension -->
  <circle cx="120" cy="120" r="70" fill="#2D2235" opacity="0.6"/>

  <!-- Character / Object representing "叛逆" (Rebel / Defiance): A youthful silhouette breaking through a rigid barrier -->
  <g transform="translate(0, 0)">
    <!-- Shattered barrier / grid representing rules or conformity -->
    <!-- Left falling shard -->
    <path d="M 60 70 L 40 100 L 55 110 Z" fill="#3E4C59" opacity="0.6" transform="rotate(-15, 50, 90)"/>
    <!-- Right falling shard -->
    <path d="M 180 70 L 200 100 L 185 110 Z" fill="#3E4C59" opacity="0.6" transform="rotate(15, 190, 90)"/>
    
    <!-- Central cracked barrier lines -->
    <path d="M 80 60 L 95 120 L 85 180" stroke="#4E5D6C" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
    <path d="M 160 60 L 145 120 L 155 180" stroke="#4E5D6C" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.4"/>

    <!-- Dynamic Youthful Rebel Figure (Noun: a rebel / defiant adolescent) -->
    <!-- Hoodie/Body with energetic posture -->
    <path d="M 100 170 L 95 130 L 110 115 L 130 115 L 145 130 L 140 170 Z" fill="#313A46"/>
    <path d="M 95 130 L 120 145 L 145 130 L 135 110 L 105 110 Z" fill="#4A5568"/> <!-- Shoulders & Upper torso -->

    <!-- Head tilted defiantly upward -->
    <circle cx="120" cy="92" r="18" fill="#F6AD55"/> <!-- Warm-toned face -->
    
    <!-- Spiky/Messy defiant hair (orange accent for focus) -->
    <path d="M 100 85 Q 105 70 120 72 Q 135 70 140 85 Q 145 80 140 95 Q 120 85 100 95 Q 95 80 100 85 Z" fill="#DD6B20"/>

    <!-- Defiant gesture: arms crossed or fists raised boldly -->
    <!-- Left arm -->
    <path d="M 105 115 L 85 135 L 95 145 L 112 130 Z" fill="#313A46"/>
    <!-- Right arm pointing forward/up -->
    <path d="M 135 115 L 160 100 L 165 112 L 142 128 Z" fill="#313A46"/>
    <!-- Hands / fists -->
    <circle cx="88" cy="142" r="5" fill="#F6AD55"/>
    <circle cx="163" cy="106" r="5" fill="#F6AD55"/>

    <!-- Dynamic energy streak / breakout flash (Orange/Gold accent) -->
    <path d="M 75 120 L 105 105 L 90 90 L 130 95" stroke="#ED8936" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Spark indicators of independent spark -->
    <circle cx="155" cy="80" r="3" fill="#ECC94B"/>
    <circle cx="85" cy="170" r="2.5" fill="#ECC94B"/>
    <path d="M 150 140 L 162 135" stroke="#ED8936" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>