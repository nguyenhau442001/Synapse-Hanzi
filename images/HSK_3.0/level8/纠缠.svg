<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "纠缠" (Entanglement / Messy ties) -->
  <g transform="translate(120, 120)">
    <!-- Ambient glow for focal point -->
    <circle cx="0" cy="0" r="70" fill="#FF7F50" opacity="0.06"/>

    <!-- Tangled, chaotic knot/cords representing complex emotional/past entanglements -->
    <!-- Cord 1: Deep blue/slate curved path -->
    <path d="M -50,30 C -70,-20 -20,-60 20,-40 C 60,-20 30,50 -20,20 C -40,10 -30,-20 10,-30" 
          fill="none" stroke="#3A4D6B" stroke-width="8" stroke-linecap="round"/>

    <!-- Cord 2: Secondary conflicting path -->
    <path d="M -40,-35 C 0,-60 50,-10 40,40 C 30,70 -30,50 -50,-10 C -60,-40 -20,-50 10,-20" 
          fill="none" stroke="#4C648B" stroke-width="6" stroke-linecap="round"/>

    <!-- Focal Tangled Core with Vibrant Accent (Orange/Gold for "纠缠" focal point) -->
    <path d="M -25,15 C -5,-30 40,-35 45,-5 C 50,25 0,55 -25,35 C -45,20 -15,-5 25,-15" 
          fill="none" stroke="#FF7F50" stroke-width="7" stroke-linecap="round"/>

    <!-- Intertwining loops / knots -->
    <path d="M -15,-25 C 15,-40 30,10 0,25 C -20,35 -35,5 -15,-25 Z" 
          fill="none" stroke="#FFB347" stroke-width="5" stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Central knot nodes/accents -->
    <circle cx="-10" cy="10" r="5" fill="#FF7F50"/>
    <circle cx="15" cy="-10" r="4" fill="#FFB347"/>
    <circle cx="5" cy="20" r="3.5" fill="#3A4D6B"/>
    <circle cx="-25" cy="-15" r="4" fill="#4C648B"/>
  </g>
</svg>