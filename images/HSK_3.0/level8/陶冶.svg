<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Base pottery wheel / crafting stand representing "陶" (pottery/molding) -->
    <path d="M-50,60 L50,60 L40,80 L-40,80 Z" fill="#3A4454"/>
    <ellipse cx="0" cy="60" rx="50" ry="10" fill="#4E5D73"/>
    
    <!-- Hands gently shaping a glowing, ascending art object representing "冶" (refining/cultivating) -->
    <!-- Left Hand -->
    <path d="M-65,30 C-65,45 -55,55 -35,55 C-25,55 -20,40 -25,25 C-30,10 -50,5 -60,15 Z" fill="#E0A96D"/>
    <path d="M-55,25 L-35,35" stroke="#C69255" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Right Hand -->
    <path d="M65,30 C65,45 55,55 35,55 C25,55 20,40 25,25 C30,10 50,5 60,15 Z" fill="#E0A96D"/>
    <path d="M55,25 L35,35" stroke="#C69255" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Central Art Object / Vase being shaped, emitting warm/aesthetic light -->
    <ellipse cx="0" cy="-20" rx="22" ry="7" fill="#F39C12" opacity="0.3"/>
    <path d="M-22,-20 C-25,-40 -12,-60 0,-70 C12,-60 25,-40 22,-20 C18,0 15,30 15,50 L-15,50 C-15,30 -18,0 -22,-20 Z" fill="url(#vaseGrad)"/>
    
    <!-- Aesthetic / Cultural elements inside the object (musical notes / book curves stylized subtly) -->
    <path d="M-5,-5 C-2,-15 5,-25 2,-40" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <circle cx="2" cy="-40" r="3" fill="#F1C40F"/>
    
    <!-- Upward glowing aura representing cultivation and elevation of mind -->
    <path d="M0,-85 L-8,-70 L8,-70 Z" fill="#F1C40F" opacity="0.8"/>
    <circle cx="0" cy="-90" r="2.5" fill="#F1C40F"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="vaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
  </defs>
</svg>