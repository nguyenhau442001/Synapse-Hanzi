<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Night Sky Background Elements -->
  <circle cx="180" cy="60" r="2" fill="#F8F9FA" opacity="0.3"/>
  <circle cx="40" cy="80" r="1.5" fill="#F8F9FA" opacity="0.4"/>
  <circle cx="120" cy="30" r="2" fill="#F8F9FA" opacity="0.2"/>
  
  <!-- Distant Village Silhouette -->
  <path d="M20,200 L60,170 L100,200 L140,160 L180,200 L220,180 L220,240 L20,240 Z" fill="#2D3436"/>
  
  <!-- Central Subject: A warm, glowing traditional paper lantern hanging in the center -->
  <!-- Represents the "祥和" (peaceful/auspicious) atmosphere of the village night -->
  <g transform="translate(120, 120)">
    <!-- Lantern Body -->
    <path d="M-30,-40 C-30,-60 -10,-70 0,-70 C10,-70 30,-60 30,-40 L30,40 C30,60 10,70 0,70 C-10,70 -30,60 -30,40 Z" fill="#FFB74D"/>
    
    <!-- Lantern Details (Ribs) -->
    <path d="M-30,-40 C-30,-20 -10,-10 0,-10 C10,-10 30,-20 30,-40" stroke="#E65100" stroke-width="2" fill="none"/>
    <path d="M-30,0 C-30,20 -10,30 0,30 C10,30 30,20 30,0" stroke="#E65100" stroke-width="2" fill="none"/>
    
    <!-- Lantern Top and Bottom Caps -->
    <rect x="-20" y="-75" width="40" height="10" rx="2" fill="#D84315"/>
    <rect x="-20" y="70" width="40" height="10" rx="2" fill="#D84315"/>
    
    <!-- Hanging Cord -->
    <line x1="0" y1="-120" x2="0" y2="-75" stroke="#FFB74D" stroke-width="2"/>
    
    <!-- Tassel -->
    <rect x="-5" y="80" width="10" height="20" rx="2" fill="#D84315"/>
    <line x1="-3" y1="100" x2="-3" y2="115" stroke="#D84315" stroke-width="2"/>
    <line x1="0" y1="100" x2="0" y2="115" stroke="#D84315" stroke-width="2"/>
    <line x1="3" y1="100" x2="3" y2="115" stroke="#D84315" stroke-width="2"/>
    
    <!-- Soft Glow Effect -->
    <circle cx="0" cy="0" r="50" fill="#FFB74D" opacity="0.15"/>
  </g>
</svg>