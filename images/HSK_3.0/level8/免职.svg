<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g id="mianzhi-illustration">
    <!-- Subtle background desk/podium plane -->
    <path d="M40 185 L200 185 L215 205 L25 205 Z" fill="#242832" opacity="0.6"/>
    <line x1="30" y1="185" x2="210" y2="185" stroke="#333947" stroke-width="2"/>

    <!-- Executive Office Chair representing "职务" (Position/Office) -->
    <g id="office-chair">
      <!-- Chair Base & Wheels -->
      <path d="M120 185 L100 198" stroke="#4F5665" stroke-width="4" stroke-linecap="round"/>
      <path d="M120 185 L140 198" stroke="#4F5665" stroke-width="4" stroke-linecap="round"/>
      <path d="M120 185 L120 199" stroke="#4F5665" stroke-width="4" stroke-linecap="round"/>
      <circle cx="97" cy="199" r="3" fill="#333947"/>
      <circle cx="143" cy="199" r="3" fill="#333947"/>
      <circle cx="120" cy="201" r="3" fill="#333947"/>
      
      <!-- Gas Cylinder / Stem -->
      <rect x="116" y="165" width="8" height="22" fill="#4F5665" rx="2"/>
      
      <!-- Seat Cushion -->
      <path d="M90 155 L150 155 C155 155, 158 162, 150 167 L90 167 C82 162, 85 155, 90 155 Z" fill="#3B82F6"/>
      
      <!-- Backrest (Slumping/Detaching to signify dismissal/removal from office) -->
      <g transform="translate(15, -5) rotate(-18 105 130)">
        <!-- Armrest left -->
        <path d="M92 130 L92 155 C92 158, 96 158, 96 155 L96 135" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
        <!-- Armrest right -->
        <path d="M148 130 L148 155 C148 158, 144 158, 144 155 L144 135" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Backrest Panel -->
        <rect x="94" y="95" width="52" height="62" rx="8" fill="#2563EB"/>
        <rect x="100" y="102" width="40" height="48" rx="4" fill="#1D4ED8"/>
      </g>
    </g>

    <!-- Official Nameplate / Badge (Representing official duty/title being removed) -->
    <g id="official-nameplate">
      <!-- Angled drop shadow -->
      <path d="M65 145 L175 145 L165 175 L75 175 Z" fill="#111318" opacity="0.4"/>
      <!-- Wooden/Metal Base -->
      <path d="M60 148 L180 148 L170 172 L70 172 Z" fill="#333947"/>
      <!-- Gold Plate Surface -->
      <path d="M65 150 L175 150 L170 168 L70 168 Z" fill="#F59E0B"/>
      <!-- Plate reflection line -->
      <line x1="72" y1="154" x2="168" y2="154" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Clear Action/Dismissal Indicator (Red Stamp / Crossed Element / Official Dismissal) -->
    <g id="dismissal-stamp">
      <!-- Bold dynamic prohibition / removal slash -->
      <circle cx="120" cy="115" r="48" fill="none" stroke="#EF4444" stroke-width="8" stroke-dasharray="240" stroke-dashoffset="0" opacity="0.95"/>
      <line x1="86" y1="81" x2="154" y2="149" stroke="#EF4444" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- Highlight Accent Particles (Modern flat UI accent) -->
    <circle cx="55" cy="70" r="3" fill="#F59E0B" opacity="0.6"/>
    <circle cx="195" cy="90" r="4" fill="#3B82F6" opacity="0.6"/>
    <circle cx="180" cy="45" r="2.5" fill="#EF4444" opacity="0.6"/>
  </g>
</svg>