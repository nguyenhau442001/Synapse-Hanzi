<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definition Context: Physical torment / Chronic joint suffering (dày vò / tra tấn) -->
  <g transform="translate(120, 120)">
    <!-- Subtle radiating pain rings in dark red/crimson -->
    <circle cx="0" cy="15" r="55" fill="none" stroke="#E53935" stroke-width="1.5" opacity="0.15" stroke-dasharray="4 4"/>
    <circle cx="0" cy="15" r="40" fill="none" stroke="#E53935" stroke-width="2" opacity="0.25"/>

    <!-- Silhouette of a person sitting, hunched over in chronic physical anguish/torment -->
    <!-- Head -->
    <circle cx="0" cy="-35" r="14" fill="#64748B"/>
    <!-- Body / Back (hunched) -->
    <path d="M-8,-21 C-15,-10 -22,5 -18,25 C-15,38 -5,45 8,45 C15,45 22,40 25,32" fill="none" stroke="#64748B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Legs folded / seated -->
    <path d="M-18,25 C-30,28 -40,35 -45,48" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
    <path d="M8,45 C20,48 35,48 45,45" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>

    <!-- Focal Point: The Joint (Knee/Back) being pierced by sharp, gnawing pain (representing 慢性关节疾病 / 折磨) -->
    <g transform="translate(-15, 28)">
      <!-- Joint node -->
      <circle cx="0" cy="0" r="10" fill="#EF4444"/>
      <!-- Internal glow / intense pain center -->
      <circle cx="0" cy="0" r="5" fill="#FCA5A5"/>

      <!-- Sharp jagged pain spikes (刺痛 / 痛苦) -->
      <path d="M-14,-14 L-6,-6" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M14,-14 L6,-6" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,-18 L0,-8" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-16,4 L-6,2" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Additional radiating sharp stress indicators -->
    <path d="M35,-25 C45,-20 50,-5 45,10" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M42,-18 L48,-24" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <path d="M48,-5 L54,-3" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>