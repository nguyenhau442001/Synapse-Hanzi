<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/field to indicate air/flight environment -->
  <circle cx="120" cy="115" r="70" fill="#222834" opacity="0.6"/>

  <!-- Light Helicopter Illustration (轻型直升机) -->
  <g transform="translate(0, 5)">
    <!-- Motion lines / upward lightness indicators (orange accent) -->
    <g opacity="0.8" stroke="#F39C12" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 60 145 L 50 135"/>
      <path d="M 50 165 L 38 153"/>
      <path d="M 180 145 L 190 135"/>
      <path d="M 190 165 L 202 153"/>
    </g>

    <!-- Main Rotor Blade Blur / Motion -->
    <ellipse cx="120" cy="65" rx="85" ry="8" fill="#4A5568" opacity="0.4"/>
    <rect x="40" y="63" width="160" height="4" rx="2" fill="#E2E8F0"/>
    <circle cx="120" cy="65" r="5" fill="#F39C12"/>

    <!-- Helicopter Cabin / Body (Sleek, lightweight aerodynamic styling) -->
    <path d="M 90 90 
             C 80 90, 70 100, 70 115 
             C 70 130, 85 140, 115 140 
             L 155 140 
             C 170 140, 175 130, 170 118 
             C 165 105, 150 90, 125 90 
             Z" fill="#3B82F6"/>

    <!-- Lightweight Cockpit Windshield (Modern flat cyan tint) -->
    <path d="M 115 95 
             C 140 95, 158 105, 162 118 
             L 115 118 
             Z" fill="#93C5FD" opacity="0.8"/>

    <!-- Cabin Frame Details -->
    <path d="M 115 95 L 115 140" stroke="#1E3A8A" stroke-width="2"/>

    <!-- Tail Boom -->
    <path d="M 155 125 L 200 110 L 200 118 L 155 133 Z" fill="#2563EB"/>

    <!-- Tail Rotor -->
    <g transform="translate(200, 114)">
      <ellipse cx="0" cy="0" rx="3" ry="12" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="2" fill="#F39C12"/>
    </g>
    <path d="M 196 122 L 204 106" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Skids / Landing Gear (Lightweight tubular design) -->
    <!-- Front strut -->
    <path d="M 95 140 L 90 155" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Back strut -->
    <path d="M 140 140 L 145 155" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Skid bar -->
    <path d="M 75 155 L 160 155" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    <!-- Rescue / Emergency Indicator (Orange accent cross on the side) -->
    <g transform="translate(130, 112)">
      <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#FFFFFF"/>
      <rect x="-8" y="-3" width="16" height="6" rx="1" fill="#FFFFFF"/>
      <rect x="-2" y="-6" width="4" height="12" rx="0.5" fill="#EF4444"/>
      <rect x="-6" y="-2" width="12" height="4" rx="0.5" fill="#EF4444"/>
    </g>
  </g>
  
  <!-- Modern ground reference line representing complex terrain/ops smoothly -->
  <path d="M 50 185 Q 90 175, 120 185 T 190 180" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle cx="95" cy="181" r="2" fill="#F39C12"/>
  <circle cx="150" cy="183" r="2" fill="#F39C12"/>
</svg>