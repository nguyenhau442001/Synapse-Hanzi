<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Atmosphere -->
  <path d="M0 120 Q 120 100 240 120 L 240 240 L 0 240 Z" fill="#2C3E50"/>
  
  <!-- Distant Mountains -->
  <path d="M20 180 L 60 100 L 100 180 Z" fill="#34495E"/>
  <path d="M80 180 L 130 80 L 180 180 Z" fill="#455A64"/>
  <path d="M150 180 L 200 120 L 240 180 Z" fill="#34495E"/>
  
  <!-- Snow Caps -->
  <path d="M45 130 L 60 100 L 75 130 Z" fill="#E0E6ED"/>
  <path d="M110 100 L 130 80 L 150 100 Z" fill="#E0E6ED"/>
  <path d="M185 135 L 200 120 L 215 135 Z" fill="#E0E6ED"/>
  
  <!-- Central Subject: Iconic Pine Tree in Cold Climate -->
  <g transform="translate(120, 190)">
    <!-- Trunk -->
    <rect x="-6" y="-60" width="12" height="60" fill="#5D4037"/>
    <!-- Foliage Layers -->
    <path d="M-40 0 L 0 -40 L 40 0 Z" fill="#2E7D32"/>
    <path d="M-30 -25 L 0 -65 L 30 -25 Z" fill="#388E3C"/>
    <path d="M-20 -50 L 0 -90 L 20 -50 Z" fill="#4CAF50"/>
    <!-- Snow on branches -->
    <path d="M-40 0 L 0 -40 L 40 0 L 0 -10 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M-30 -25 L 0 -65 L 30 -25 L 0 -35 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M-20 -50 L 0 -90 L 20 -50 L 0 -60 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
  
  <!-- Ground Snow -->
  <ellipse cx="120" cy="210" rx="100" ry="20" fill="#CFD8DC"/>
  
  <!-- Accent: Cold Star/Sun -->
  <circle cx="190" cy="50" r="25" fill="#FFC107" opacity="0.9"/>
  <circle cx="190" cy="50" r="15" fill="#1A1D24"/>
</svg>