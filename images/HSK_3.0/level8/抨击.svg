<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The "抨击" (Criticism/Attack) concept: A sharp, stylized quill pen or pointer striking a deceptive document -->
  
  <!-- The deceptive document (representing the false advertisement) -->
  <rect x="60" y="80" width="120" height="100" rx="4" fill="#2C313C" stroke="#4A5568" stroke-width="2"/>
  <line x1="80" y1="100" x2="160" y2="100" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="160" y2="120" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="140" x2="130" y2="140" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The striking element (The criticism/attack) -->
  <path d="M180 60 L120 120 L130 130 L190 70 Z" fill="#FFB84D"/>
  <path d="M180 60 L190 70 L205 55 Z" fill="#FF9F1A"/>
  
  <!-- Impact effect lines -->
  <line x1="115" y1="115" x2="100" y2="100" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="125" x2="110" y2="140" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
</svg>