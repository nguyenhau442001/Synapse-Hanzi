<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow/accent for focal point -->
  <circle cx="120" cy="125" r="75" fill="#252A34" opacity="0.6"/>

  <!-- Puffer jacket outline / silhouette representing "羽绒服" -->
  <path d="M90 60 
           C90 52, 98 45, 120 45 
           C142 45, 150 52, 150 60
           L155 75 
           C175 80, 195 95, 190 120
           L185 185
           C184 193, 177 198, 168 198
           L72 198
           C63 198, 56 193, 55 185
           L50 120
           C45 95, 65 80, 85 75
           Z" 
        fill="#2D3748" 
        stroke="#4A5568" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Jacket inner chambers / quilted segments (partially filled/puffing up) -->
  <!-- Left arm -->
  <path d="M52 110 C52 110, 65 115, 75 125" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M48 135 C48 135, 60 140, 70 150" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Right arm -->
  <path d="M188 110 C188 110, 175 115, 165 125" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M192 135 C192 135, 180 140, 170 150" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Torso quilting lines -->
  <path d="M70 95 Q120 105 170 95" stroke="#4A5568" stroke-width="2" fill="none"/>
  <path d="M65 130 Q120 140 175 130" stroke="#4A5568" stroke-width="2" fill="none"/>
  <path d="M62 165 Q120 175 178 165" stroke="#4A5568" stroke-width="2" fill="none"/>

  <!-- Cutaway / Open section revealing the filling process -->
  <path d="M90 95 
           C110 95, 125 105, 125 130
           C125 155, 110 165, 90 165
           Z" 
        fill="#1A202C" 
        stroke="#F6AD55" 
        stroke-width="2.5" 
        stroke-dasharray="4 2"/>

  <!-- Fluffy Down Feathers / Filling material (Goose down fluff) inside the cutout -->
  <g fill="#F7FAFC">
    <!-- Soft clustered down shapes representing "羽绒" / "填充" -->
    <circle cx="95" cy="115" r="9" />
    <circle cx="108" cy="110" r="11" />
    <circle cx="100" cy="130" r="12" />
    <circle cx="115" cy="125" r="10" />
    <circle cx="105" cy="145" r="11" />
    <circle cx="92" cy="140" r="8" />
    <circle cx="118" cy="142" r="9" />
  </g>
  <!-- Secondary softer tones for depth in feathers -->
  <g fill="#CBD5E0">
    <circle cx="98" cy="122" r="6" />
    <circle cx="110" cy="135" r="7" />
    <circle cx="104" cy="118" r="5" />
  </g>

  <!-- Nozzle / Tool pumping/filling element (representing the action of filling/trám đầy) -->
  <g transform="translate(145, 75) rotate(-35)">
    <!-- Nozzle body -->
    <path d="M0 0 L15 -25 L35 -20 L20 5 Z" fill="#E2E8F0" stroke="#CBD5E0" stroke-width="1.5"/>
    <!-- Nozzle tip pointing into the jacket -->
    <polygon points="0,0 -8,5 -5,10" fill="#CBD5E0"/>
    <!-- Extension tube -->
    <rect x="25" y="-22" width="35" height="12" rx="3" fill="#4A5568"/>
    <!-- Action flow particles (down/filling entering) -->
    <circle cx="-12" cy="15" r="3" fill="#F6AD55"/>
    <circle cx="-20" cy="22" r="2" fill="#F6AD55" opacity="0.8"/>
  </g>

  <!-- Focus Accent: High-contrast golden/orange highlights representing precise action -->
  <path d="M85 75 L95 75" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 75 L160 75" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="45" r="3" fill="#F6AD55"/>

</svg>