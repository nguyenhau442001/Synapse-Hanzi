<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground / Soil layer -->
  <path d="M 40 180 Q 120 165 200 180 L 200 200 L 40 200 Z" fill="#2D231E"/>
  <path d="M 40 180 Q 120 165 200 180" stroke="#E67E22" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Tilled soil rows / Furrows -->
  <path d="M 60 190 Q 90 180 120 195 Q 150 210 180 190" stroke="#1F1815" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 50 205 Q 100 195 150 210 Q 180 215 195 205" stroke="#1F1815" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Young vibrant sprouts (representing growth/harvest from hard work) -->
  <g transform="translate(0, 5)">
    <!-- Sprout 1 -->
    <path d="M 90 175 Q 90 150 75 140 Q 95 145 95 175" fill="#2ECC71"/>
    <path d="M 90 175 Q 90 155 105 145 Q 90 150 90 175" fill="#27AE60"/>
    <path d="M 90 178 L 90 173" stroke="#2ECC71" stroke-width="2"/>

    <!-- Sprout 2 (Center, taller) -->
    <path d="M 120 170 Q 120 135 100 120 Q 125 130 125 170" fill="#2ECC71"/>
    <path d="M 120 170 Q 120 140 140 125 Q 120 135 120 170" fill="#27AE60"/>
    <path d="M 120 175 L 120 168" stroke="#2ECC71" stroke-width="2"/>

    <!-- Sprout 3 -->
    <path d="M 150 177 Q 150 155 135 145 Q 155 150 155 177" fill="#2ECC71"/>
    <path d="M 150 177 Q 150 160 165 150 Q 150 155 150 177" fill="#27AE60"/>
  </g>

  <!-- The Plow / Agricultural Tool (Physical Object representing 'gēngyún') -->
  <g transform="translate(15, -5)">
    <!-- Wooden Beam / Handle -->
    <path d="M 60 110 L 170 160" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
    <!-- Extension grip -->
    <path d="M 50 105 L 65 112" stroke="#78350F" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Metal Plowshare / Blade (Bright Orange/Gold Accent) -->
    <path d="M 150 150 L 180 165 L 165 185 Z" fill="#F39C12"/>
    <path d="M 150 150 L 165 185 L 155 188 Z" fill="#D35400"/>
    
    <!-- Structural bracket -->
    <path d="M 160 152 L 165 162" stroke="#7F8C8D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Golden Sweat Droplets (Symbolizing hard work / effort from the context) -->
  <g fill="#F1C40F" opacity="0.9">
    <path d="M 75 95 C 75 95 71 102 71 105 C 71 107.2 72.8 109 75 109 C 77.2 109 79 107.2 79 105 C 79 102 75 95 75 95 Z"/>
    <path d="M 165 80 C 165 80 161 87 161 90 C 161 92.2 162.8 94 165 94 C 167.2 94 169 92.2 169 90 C 169 87 165 80 165 80 Z"/>
    <path d="M 105 70 C 105 70 101 77 101 80 C 101 82.2 102.8 84 105 84 C 107.2 84 109 82.2 109 80 C 109 77 105 70 105 70 Z"/>
  </g>

  <!-- Subtle ambient lighting / glow on top -->
  <circle cx="120" cy="50" r="70" fill="#3498DB" opacity="0.03" filter="blur(20px)"/>
</svg>