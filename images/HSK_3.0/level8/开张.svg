<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background storefront architectural elements -->
  <path d="M60 85 L180 85 L190 190 L50 190 Z" fill="#222733"/>
  
  <!-- Traditional Chinese storefront eaves / roof -->
  <path d="M45 85 L195 85 L180 65 L60 65 Z" fill="#D94E34"/>
  <path d="M40 65 L200 65 L200 72 L40 72 Z" fill="#B83A22"/>

  <!-- Storefront pillar left & right -->
  <rect x="55" y="85" width="10" height="105" fill="#3E4452"/>
  <rect x="175" y="85" width="10" height="105" fill="#3E4452"/>

  <!-- Central wooden shop plaque (Signboard representing "开张" / Grand Opening) -->
  <g transform="translate(120, 105)">
    <!-- Gold border frame -->
    <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#E6A15C"/>
    <!-- Dark rich wood inner plate -->
    <rect x="-39" y="-15" width="78" height="30" rx="2" fill="#5C3A21"/>
    <!-- Decorative carved wood corners -->
    <circle cx="-33" cy="-9" r="2.5" fill="#E6A15C"/>
    <circle cx="33" cy="-9" r="2.5" fill="#E6A15C"/>
    <circle cx="-33" cy="9" r="2.5" fill="#E6A15C"/>
    <circle cx="33" cy="9" r="2.5" fill="#E6A15C"/>
    <!-- Ribbon / Red Silk draped on top of plaque signaling celebration/opening -->
    <path d="M-45 -18 Q-20 -28 0 -18 Q20 -28 45 -18 L40 -10 Q20 -20 0 -10 Q-20 -20 -40 -10 Z" fill="#E74C3C"/>
  </g>

  <!-- Celebration hanging lanterns flanking the signboard -->
  <!-- Left Lantern -->
  <g transform="translate(75, 110)">
    <line x1="0" y1="-25" x2="0" y2="-15" stroke="#E6A15C" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="10" ry="12" fill="#E74C3C"/>
    <rect x="-7" y="-12" width="14" height="4" rx="1" fill="#E6A15C"/>
    <rect x="-7" y="8" width="14" height="4" rx="1" fill="#E6A15C"/>
    <line x1="0" y1="12" x2="0" y2="20" stroke="#E6A15C" stroke-width="1.5"/>
  </g>

  <!-- Right Lantern -->
  <g transform="translate(165, 110)">
    <line x1="0" y1="-25" x2="0" y2="-15" stroke="#E6A15C" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="10" ry="12" fill="#E74C3C"/>
    <rect x="-7" y="-12" width="14" height="4" rx="1" fill="#E6A15C"/>
    <rect x="-7" y="8" width="14" height="4" rx="1" fill="#E6A15C"/>
    <line x1="0" y1="12" x2="0" y2="20" stroke="#E6A15C" stroke-width="1.5"/>
  </g>

  <!-- Festive Ribbon / Silk Banner unfurled below plaque -->
  <path d="M70 145 Q120 160 170 145 L175 158 Q120 175 65 158 Z" fill="#E74C3C"/>
  <path d="M65 158 L55 170 L75 162 Z" fill="#B83A22"/>
  <path d="M175 158 L185 170 L165 162 Z" fill="#B83A22"/>

  <!-- Firecrackers hanging on the sides to represent the bustling opening ceremony -->
  <!-- Left Firecrackers -->
  <g transform="translate(48, 115)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#E6A15C" stroke-width="1.5"/>
    <rect x="-3" y="5" width="6" height="8" rx="1" fill="#D94E34"/>
    <rect x="-3" y="16" width="6" height="8" rx="1" fill="#D94E34"/>
    <rect x="-3" y="27" width="6" height="8" rx="1" fill="#D94E34"/>
    <rect x="-3" y="38" width="6" height="8" rx="1" fill="#D94E34"/>
  </g>

  <!-- Right Firecrackers -->
  <g transform="translate(192, 115)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#E6A15C" stroke-width="1.5"/>
    <rect x="-3" y="5" width="6" height="8" rx="1" fill="#D94E34"/>
    <rect x="-3" y="16" width="6" height="8" rx="1" fill="#D94E34"/>
    <rect x="-3" y="27" width="6" height="8" rx="1" fill="#D94E34"/>
    <rect x="-3" y="38" width="6" height="8" rx="1" fill="#D94E34"/>
  </g>

  <!-- Store entrance double doors (open) -->
  <path d="M90 190 L90 140 L120 140 L120 190 Z" fill="#15181E"/>
  <path d="M120 190 L120 140 L150 140 L150 190 Z" fill="#15181E"/>
  
  <!-- Door threshold -->
  <rect x="85" y="187" width="70" height="5" fill="#3E4452" rx="1"/>

  <!-- Sparkling celebratory confetti / gold dust floating around to emphasize the grand opening event -->
  <circle cx="95" cy="75" r="2.5" fill="#E6A15C"/>
  <circle cx="145" cy="70" r="2" fill="#E6A15C"/>
  <circle cx="105" cy="135" r="1.5" fill="#F1C40F"/>
  <circle cx="135" cy="135" r="2" fill="#F1C40F"/>
  <polygon points="170,80 173,85 170,90 167,85" fill="#E6A15C"/>
  <polygon points="70,80 73,85 70,90 67,85" fill="#E6A15C"/>
</svg>