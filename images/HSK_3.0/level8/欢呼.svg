<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle stadium background glow/elements -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.6"/>
  <path d="M40 180 Q120 130 200 180" fill="none" stroke="#2D3342" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Soundwaves / Cheering energy waves -->
  <path d="M85 85 C95 70, 145 70, 155 85" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M70 70 C85 50, 155 50, 170 70" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M55 55 C75 30, 165 30, 185 55" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Confetti / Celebration elements -->
  <circle cx="65" cy="100" r="3.5" fill="#38BDF8"/>
  <rect x="170" y="95" width="6" height="6" rx="1" fill="#F43F5E" transform="rotate(45 173 98)"/>
  <rect x="50" y="140" width="5" height="8" rx="1" fill="#F59E0B" transform="rotate(-15 52.5 144)"/>
  <circle cx="185" cy="135" r="3" fill="#34D399"/>
  <rect x="95" y="45" width="4" height="6" rx="1" fill="#A78BFA" transform="rotate(30 97 48)"/>
  <circle cx="145" cy="45" r="2.5" fill="#F43F5E"/>

  <!-- Central Character (Person cheering enthusiastically) -->
  <!-- Torso & Shoulders -->
  <path d="M85 200 C85 175, 95 165, 120 165 C145 165, 155 175, 155 200 Z" fill="#3B82F6"/>
  <path d="M100 165 L120 185 L140 165" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neck -->
  <rect x="111" y="138" width="18" height="30" rx="6" fill="#FBBF24"/>

  <!-- Head -->
  <circle cx="120" cy="122" r="24" fill="#FBBF24"/>

  <!-- Hair -->
  <path d="M96 118 C96 100, 104 94, 120 94 C136 94, 144 100, 144 118 C144 124, 142 112, 138 106 C130 98, 110 98, 102 106 C98 112, 96 124, 96 118 Z" fill="#1E293B"/>

  <!-- Facial expression: Open mouth cheering (Joyful) -->
  <path d="M112 128 C112 128, 120 136, 128 128 Z" fill="#78350F"/>
  <!-- Closed happy eyes (arcs) -->
  <path d="M106 116 Q111 110 116 116" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M124 116 Q129 110 134 116" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="105" cy="124" r="3" fill="#F43F5E" opacity="0.4"/>
  <circle cx="135" cy="124" r="3" fill="#F43F5E" opacity="0.4"/>

  <!-- Raised Arms & Hands (Signifying cheering / "欢呼") -->
  <!-- Left Arm -->
  <path d="M90 170 C70 140, 60 110, 68 92" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
  <!-- Left Hand -->
  <circle cx="70" cy="85" r="7" fill="#FBBF24"/>

  <!-- Right Arm -->
  <path d="M150 170 C170 140, 180 110, 172 92" fill="none" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
  <!-- Right Hand -->
  <circle cx="170" cy="85" r="7" fill="#FBBF24"/>
</svg>