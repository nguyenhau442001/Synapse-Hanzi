  <rect x="112" y="128" width="16" height="20" fill="#E0AC69"/>
  <circle cx="120" cy="108" r="22" fill="#E0AC69"/>
  
  <!-- Hair (Neat, modern style) -->
  <path d="M98 102C98 90 106 84 120 84C134 84 142 90 142 102V112H98V102Z" fill="#2C221E"/>

  <!-- Friendly Smile & Expression -->
  <circle cx="112" cy="108" r="2" fill="#3E2723"/>
  <circle cx="128" cy="108" r="2" fill="#3E2723"/>
  <path d="M116 116C118 118 122 118 124 116" stroke="#3E2723" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Arms holding out a stack of books (helpful service action) -->
  <!-- Left Arm -->
  <path d="M95 145L75 160L85 170L102 155" fill="#323B4C"/>
  <!-- Right Arm -->
  <path d="M145 145L165 160L155 170L138 155" fill="#323B4C"/>

