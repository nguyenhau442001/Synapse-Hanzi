<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background bookshelf silhouette for community library context -->
  <path d="M48 60H192V180H48V60Z" fill="#222732"/>
  <rect x="56" y="70" width="38" height="50" fill="#2A303C" rx="2"/>
  <rect x="98" y="70" width="44" height="50" fill="#2A303C" rx="2"/>
  <rect x="146" y="70" width="38" height="50" fill="#2A303C" rx="2"/>
