<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Central Physical Object: Open Book morphing into a magical fantasy castle/creature silhouette -->
    <!-- Open Book Base -->
    <path d="M60 150 C80 145, 110 148, 120 152 C130 148, 160 145, 180 150 L180 185 C160 180, 130 183, 120 187 C110 183, 80 180, 60 185 Z" fill="#282D37"/>
    <path d="M120 152 L120 187" stroke="#3A4150" stroke-width="2"/>
    
    <!-- Pages -->
    <path d="M65 145 C85 140, 110 143, 119 147 L119 180 C110 176, 85 173, 65 178 Z" fill="#D1D5DB"/>
    <path d="M175 145 C155 140, 130 143, 121 147 L121 180 C130 176, 155 173, 175 178 Z" fill="#9CA3AF"/>
    
    <!-- Lines on pages (fading out) -->
    <line x1="75" y1="155" x2="105" y2="152" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="162" x2="100" y2="159" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="152" x2="165" y2="155" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="159" x2="165" y2="162" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>

    <!-- Emerging Imagination / Fiction (The "Constructed" element rising from pages) -->
    <!-- Magical construct pillar / glowing fantasy structure -->
    <path d="M105 140 L120 70 L135 140 Z" fill="url(#grad-construct)" opacity="0.15"/>
    
    <!-- Floating fantasy castle / architectural creation -->
    <g transform="translate(0, -15)">
      <!-- Main towers -->
      <rect x="105" y="85" width="30" height="50" rx="3" fill="#3B82F6"/>
      <rect x="92" y="100" width="18" height="35" rx="2" fill="#2563EB"/>
      <rect x="130" y="100" width="18" height="35" rx="2" fill="#2563EB"/>
      
      <!-- Roofs (Golden/Orange accent for focus) -->
      <polygon points="120,55 100,85 140,85" fill="#F59E0B"/>
      <polygon points="101,75 90,100 112,100" fill="#D97706"/>
      <polygon points="139,75 128,100 150,100" fill="#D97706"/>
      
      <!-- Floating geometric elements representing imagination/fiction -->
      <circle cx="80" cy="90" r="4" fill="#60A5FA" opacity="0.8"/>
      <circle cx="160" cy="85" r="6" fill="#F59E0B" opacity="0.8"/>
      <polygon points="120,40 123,48 131,48 125,53 127,61 120,56 113,61 115,53 109,48 117,48" fill="#FDE047"/>
      
      <!-- Magical swirl connecting book to castle -->
      <path d="M120 145 C120 120, 100 110, 105 95" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
      <path d="M120 145 C120 120, 140 110, 135 95" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad-construct" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>