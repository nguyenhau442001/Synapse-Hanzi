<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Auctioneer Podium -->
  <path d="M60 180 L180 180 L170 210 L70 210 Z" fill="#374151"/>
  <path d="M70 210 L170 210 L175 225 L65 225 Z" fill="#1F2937"/>
  
  <!-- Auctioneer Character -->
  <circle cx="120" cy="140" r="15" fill="#F3F4F6"/>
  <path d="M105 155 L135 155 L130 180 L110 180 Z" fill="#3B82F6"/>
  
  <!-- Gavel Motion -->
  <path d="M135 145 L165 125" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M165 125 L175 135" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <rect x="160" y="115" width="20" height="8" rx="2" fill="#F59E0B" transform="rotate(30 170 120)"/>
  
  <!-- Motion Lines for Gavel -->
  <path d="M150 110 L160 100" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M175 115 L185 105" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- The Item (Painting) -->
  <rect x="40" y="80" width="50" height="60" fill="#E5E7EB"/>
  <rect x="45" y="85" width="40" height="40" fill="#111827"/>
  <path d="M50 135 L85 135" stroke="#374151" stroke-width="2"/>
  <path d="M50 140 L85 140" stroke="#374151" stroke-width="2"/>
  
  <!-- Bidders -->
  <circle cx="40" cy="190" r="10" fill="#9CA3AF"/>
  <circle cx="200" cy="190" r="10" fill="#9CA3AF"/>
  
  <!-- Hand raised by bidder -->
  <path d="M200 180 L200 160" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="155" r="5" fill="#9CA3AF"/>
</svg>