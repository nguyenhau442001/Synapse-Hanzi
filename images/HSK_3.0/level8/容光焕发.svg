<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Ambient glowing aura representing radiant vitality (容光焕发) -->
    <circle cx="120" cy="115" r="55" fill="#3D2C1E" opacity="0.6"/>
    <circle cx="120" cy="115" r="45" fill="#FFB703" opacity="0.12"/>
    
    <!-- Radiant light rays emanating behind the head -->
    <g stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <line x1="120" y1="50" x2="120" y2="38" />
      <line x1="165" y1="70" x2="174" y2="61" />
      <line x1="185" y1="115" x2="197" y2="115" />
      <line x1="165" y1="160" x2="174" y2="169" />
      <line x1="75" y1="70" x2="66" y2="61" />
      <line x1="55" y1="115" x2="43" y2="115" />
      <line x1="75" y1="160" x2="66" y2="169" />
    </g>

    <!-- Character Body / Shoulders -->
    <path d="M 75 190 C 75 160 95 145 120 145 C 145 145 165 160 165 190 Z" fill="#2E3944"/>
    <path d="M 90 190 C 90 168 104 156 120 156 C 136 156 150 168 150 190 Z" fill="#FFB703" opacity="0.9"/>
    <path d="M 100 190 L 120 168 L 140 190 Z" fill="#1A1D24"/>

    <!-- Neck -->
    <rect x="108" y="125" width="24" height="28" rx="6" fill="#F4A261"/>

    <!-- Head / Face base -->
    <circle cx="120" cy="105" r="34" fill="#F4A261"/>

    <!-- Ears -->
    <circle cx="88" cy="106" r="5" fill="#E76F51"/>
    <circle cx="152" cy="106" r="5" fill="#E76F51"/>

    <!-- Stylish Hair (Dark theme contrast) -->
    <path d="M 86 100 C 86 78 100 70 120 70 C 140 70 154 78 154 100 C 154 105 156 112 156 112 C 156 112 148 102 138 98 C 128 94 112 94 102 98 C 92 102 86 112 86 112 C 86 112 86 105 86 100 Z" fill="#2B2D42"/>
    <path d="M 110 72 C 120 68 135 70 145 76 C 138 66 125 64 110 72 Z" fill="#4A4E69"/>

    <!-- Glowing Rosy Cheeks (Indicating health and glowing complexion) -->
    <ellipse cx="100" cy="113" rx="6" ry="4" fill="#E76F51" opacity="0.5"/>
    <ellipse cx="140" cy="113" rx="6" ry="4" fill="#E76F51" opacity="0.5"/>

    <!-- Eyes (Happy, bright, smiling eyes) -->
    <path d="M 102 98 Q 108 104 114 98" fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 126 98 Q 132 104 138 98" fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyebrows (Relaxed, upbeat) -->
    <path d="M 100 92 Q 108 88 116 92" fill="none" stroke="#2B2D42" stroke-width="2" stroke-linecap="round"/>
    <path d="M 124 92 Q 132 88 140 92" fill="none" stroke="#2B2D42" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 120 102 L 117 112 L 122 113" fill="none" stroke="#E76F51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bright, confident smile -->
    <path d="M 108 116 Q 120 128 132 116" fill="#D90429" stroke="#2B2D42" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 112 118 Q 120 124 128 118" fill="#FFFFFF"/>

    <!-- Sparkles / Vitality indicators floating around the head -->
    <g fill="#FFB703">
      <!-- Top right sparkle -->
      <path d="M 158 78 Q 164 78 164 72 Q 164 78 170 78 Q 164 78 164 84 Q 164 78 158 78 Z" />
      <!-- Top left sparkle -->
      <path d="M 72 85 Q 77 85 77 80 Q 77 85 82 85 Q 77 85 77 90 Q 77 85 72 85 Z" />
      <!-- Lower right sparkle -->
      <path d="M 152 135 Q 156 135 156 131 Q 156 135 160 135 Q 156 135 156 139 Q 156 135 152 135 Z" />
    </g>
  </g>
</svg>