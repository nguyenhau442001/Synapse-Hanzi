<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Dawn / Street background context -->
  <!-- Subtle warm gradient glow on the horizon indicating early dawn -->
  <defs>
    <linearGradient id="dawnGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1A1D24" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF9E42" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="beamGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB057" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Horizon glow -->
  <rect x="0" y="120" width="240" height="120" fill="url(#dawnGlow)"/>

  <!-- Streetground -->
  <path d="M0 190 L240 190 L240 240 L0 240 Z" fill="#15181F"/>
  <!-- Street curb -->
  <rect x="0" y="185" width="240" height="5" fill="#252A35"/>

  <!-- Light beam from early morning sun -->
  <polygon points="190,0 240,0 120,190 80,190" fill="url(#beamGradient)"/>

  <!-- Distant cityscape silhouette -->
  <path d="M0 190 L0 155 L20 155 L20 190 L45 190 L45 130 L65 130 L65 190 L100 190 L100 145 L115 145 L115 190 L160 190 L160 160 L180 160 L180 190 L240 190 L240 190 Z" fill="#212530" opacity="0.6"/>

  <!-- THE CENTRAL FIGURE / SHēnyǐng (Silhouette / Figure) -->
  <!-- Floor Shadow / Projection -->
  <ellipse cx="115" cy="190" rx="28" ry="6" fill="#0D0F13"/>

  <!-- Worker Figure Group (Sleek flat vector) -->
  <g transform="translate(85, 95)">
    <!-- Body / Torso (Bright Orange uniform as referenced in context) -->
    <path d="M22 40 L38 40 L44 85 L16 85 Z" fill="#FF7E21"/>
    
    <!-- Reflective vest safety stripe details -->
    <path d="M25 45 L35 45 L37 75 L23 75 Z" fill="#FFC857" opacity="0.9"/>
    <line x1="23" y1="58" x2="37" y2="58" stroke="#FF7E21" stroke-width="3"/>

    <!-- Head & Cap -->
    <!-- Cap with brim -->
    <path d="M23 20 L37 20 C38 23 38 26 35 27 L25 27 C22 26 22 23 23 20 Z" fill="#FF5500"/>
    <path d="M20 25 L40 25 L38 27 L22 27 Z" fill="#E04600"/>
    <!-- Head/Face profile silhouette -->
    <circle cx="30" cy="14" r="8" fill="#FFD1A9"/>

    <!-- Limbs - Dynamic working posture (sweeping / holding broom) -->
    <!-- Back arm -->
    <path d="M24 45 L12 60 L8 70" stroke="#FF7E21" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front arm -->
    <path d="M36 45 L50 62 L64 72" stroke="#FF7E21" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Legs -->
    <!-- Back leg -->
    <path d="M21 82 L14 110 L8 115" stroke="#252A35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front leg -->
    <path d="M35 82 L42 108 L48 115" stroke="#252A35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Broom tool -->
    <!-- Handle -->
    <line x1="68" y1="76" x2="0" y2="45" stroke="#8C6747" stroke-width="3" stroke-linecap="round"/>
    <!-- Bristles -->
    <path d="M60 72 L74 78 L68 90 L54 84 Z" fill="#E5C158"/>
    <line x1="60" y1="78" x2="68" y2="84" stroke="#A88B34" stroke-width="2"/>
  </g>

  <!-- Environmental detail: Floating morning dust / light particles -->
  <circle cx="70" cy="80" r="1.5" fill="#FFC857" opacity="0.6"/>
  <circle cx="150" cy="60" r="2" fill="#FFC857" opacity="0.4"/>
  <circle cx="170" cy="110" r="1" fill="#FFC857" opacity="0.7"/>
  <circle cx="50" cy="130" r="1.5" fill="#FFC857" opacity="0.5"/>
</svg>