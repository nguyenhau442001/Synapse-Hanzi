<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Field turf background lines / tactical board ambiance -->
  <path d="M40 120 L200 120" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="45" fill="none" stroke="#252A34" stroke-width="2"/>

  <!-- Dynamic impact zone in the center -->
  <circle cx="120" cy="120" r="30" fill="#FF5722" opacity="0.15"/>

  <!-- Left Team Player (Attacking / Blue Theme) -->
  <g id="player-left">
    <!-- Body & Uniform -->
    <path d="M75 140 L90 100 L105 140 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="90" cy="85" r="10" fill="#FFD166"/>
    <!-- Leg extending towards center -->
    <path d="M95 135 L115 135" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <!-- Foot/Boot -->
    <path d="M112 131 L122 135 L112 139 Z" fill="#1E293B"/>
    <!-- Action arm -->
    <path d="M85 105 L70 120" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Right Team Player (Defending / Orange-Red Theme) -->
  <g id="player-right">
    <!-- Body & Uniform -->
    <path d="M165 140 L150 100 L135 140 Z" fill="#EF4444"/>
    <!-- Head -->
    <circle cx="150" cy="85" r="10" fill="#FFD166"/>
    <!-- Leg extending towards center (clashing) -->
    <path d="M145 135 L125 135" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <!-- Foot/Boot -->
    <path d="M128 131 L118 135 L128 139 Z" fill="#1E293B"/>
    <!-- Action arm -->
    <path d="M155 105 L170 120" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Soccer Ball at the precise point of impact -->
  <g id="clashing-ball" transform="translate(120, 133)">
    <circle cx="0" cy="0" r="11" fill="#FFFFFF"/>
    <!-- Modern geometric soccer ball pattern pentagons -->
    <polygon points="0,-4 4,-1 2,4 -2,4 -4,-1" fill="#1E293B"/>
    <path d="M-6 -7 L-4 -4" stroke="#1E293B" stroke-width="2"/>
    <path d="M6 -7 L4 -4" stroke="#1E293B" stroke-width="2"/>
    <path d="M-7 4 L-2 4" stroke="#1E293B" stroke-width="2"/>
    <path d="M7 4 L2 4" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- High-impact energy sparks / collision lines -->
  <g id="impact-effects" stroke="#F59E0B" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="105" x2="120" y2="90" />
    <line x1="105" y1="120" x2="95" y2="115" />
    <line x1="135" y1="120" x2="145" y2="115" />
    <circle cx="120" cy="110" r="2" fill="#FFFFFF"/>
  </g>

</svg>