<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Deep Space Background & Stars -->
  <g fill="#4A5568">
    <circle cx="40" cy="50" r="1" opacity="0.6"/>
    <circle cx="90" cy="30" r="1.5" opacity="0.8"/>
    <circle cx="180" cy="40" r="1" opacity="0.5"/>
    <circle cx="210" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="30" cy="120" r="1" opacity="0.4"/>
    <circle cx="70" cy="180" r="1.5" opacity="0.9"/>
    <circle cx="150" cy="200" r="1" opacity="0.6"/>
    <circle cx="200" cy="160" r="1.5" opacity="0.8"/>
    <circle cx="220" cy="210" r="1" opacity="0.5"/>
  </g>
  
  <!-- Distant Glowing Stars (Orange/Gold Accent) -->
  <circle cx="170" cy="70" r="2" fill="#F6AD55" opacity="0.9"/>
  <circle cx="55" cy="85" r="1.5" fill="#F6AD55" opacity="0.7"/>
  <circle cx="195" cy="135" r="2" fill="#F6AD55" opacity="0.8"/>

  <!-- Vast Nebula / Galaxy Cloud -->
  <path d="M60 140 C 80 100, 140 80, 180 110 C 210 135, 170 180, 120 170 C 70 160, 40 180, 60 140 Z" fill="#2B3748" opacity="0.6"/>
  <path d="M80 130 C 95 105, 135 95, 160 115 C 180 130, 150 160, 110 155 C 75 150, 65 145, 80 130 Z" fill="#3182CE" opacity="0.3"/>

  <!-- Massive Planet / Celestial Body (Representing Haohan / Vastness) -->
  <circle cx="180" cy="180" r="60" fill="#2D3748"/>
  <path d="M 130 150 A 60 60 0 0 0 238 180 A 60 60 0 0 1 130 150 Z" fill="#1A202C" opacity="0.7"/>
  
  <!-- Planet Ring -->
  <ellipse cx="180" cy="180" rx="85" ry="22" fill="none" stroke="#E2E8F0" stroke-width="4" transform="rotate(-25 180 180)" opacity="0.8"/>
  <ellipse cx="180" cy="180" rx="85" ry="22" fill="none" stroke="#F6AD55" stroke-width="1.5" transform="rotate(-25 180 180)" opacity="0.9"/>

  <!-- Space Station Window Frame (Foreground, Dark Sleek Style) -->
  <!-- Outer Window Structure -->
  <path d="M 0 0 L 240 0 L 240 240 L 0 240 Z M 20 20 L 220 20 L 220 220 L 20 220 Z" fill="#111318" fill-rule="evenodd"/>
  
  <!-- Curved Rounded Window Port Outline -->
  <rect x="24" y="24" width="192" height="192" rx="32" fill="none" stroke="#2D3748" stroke-width="8"/>
  <rect x="24" y="24" width="192" height="192" rx="32" fill="none" stroke="#F6AD55" stroke-width="2" opacity="0.4"/>

  <!-- Astronaut Helmet / Visor Reflection Edge at bottom-left corner of window -->
  <path d="M 24 180 C 24 200, 40 216, 60 216 L 24 216 Z" fill="#2D3748" opacity="0.5"/>
</svg>