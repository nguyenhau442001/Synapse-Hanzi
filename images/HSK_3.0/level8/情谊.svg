<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative warmth (subtle ambient glow representing deep bond) -->
  <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.06"/>

  <!-- Character 1 (Left Person) -->
  <g transform="translate(75, 115)">
    <!-- Body / Torso -->
    <path d="M-22 65 C-22 45, -12 35, 0 35 C12 35, 22 45, 22 65 Z" fill="#2E4057"/>
    <!-- Head -->
    <circle cx="0" cy="12" r="15" fill="#FFD166"/>
    <!-- Hair -->
    <path d="M-13 6 C-13 1, -6 -3, 0 -3 C6 -3, 13 1, 13 6 C13 9, 10 7, 0 7 C-10 7, -13 9, -13 6 Z" fill="#3D5A80"/>
    <!-- Friendly smiling eye & expression -->
    <path d="M -5 12 Q -2 15 1 12" stroke="#1D3557" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Character 2 (Right Person) -->
  <g transform="translate(165, 115)">
    <!-- Body / Torso -->
    <path d="M-22 65 C-22 45, -12 35, 0 35 C12 35, 22 45, 22 65 Z" fill="#3D5A80"/>
    <!-- Head -->
    <circle cx="0" cy="12" r="15" fill="#FFD166"/>
    <!-- Hair -->
    <path d="M-13 6 C-13 1, -6 -3, 0 -3 C6 -3, 13 1, 13 6 C13 9, 10 7, 0 7 C-10 7, -13 9, -13 6 Z" fill="#2E4057"/>
    <!-- Friendly smiling eye & expression -->
    <path d="M -1 12 Q 2 15 5 12" stroke="#1D3557" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Interlocking Arms / Strong Handshake representing "情谊" (deep companionship and brotherhood) -->
  <g transform="translate(120, 135)">
    <!-- Left arm reaching center -->
    <path d="M-45 10 C-30 5, -20 -5, -10 -5" stroke="#2E4057" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Right arm reaching center -->
    <path d="M45 10 C30 5, 20 -5, 10 -5" stroke="#3D5A80" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Clasped Hands at the focal center -->
    <circle cx="0" cy="-5" r="11" fill="#FFB703"/>
    <circle cx="-3" cy="-3" r="4" fill="#F77F00" opacity="0.4"/>
  </g>

  <!-- Upper visual bond: Warm golden ascending light representing shared journey / enduring trust -->
  <path d="M 100 65 Q 120 45 140 65" stroke="#FFB703" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <circle cx="120" cy="50" r="3" fill="#FFD166"/>
</svg>