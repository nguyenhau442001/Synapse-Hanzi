<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Document/Protocol Base (representing the established procedure/regulation) -->
    <rect x="70" y="45" width="100" height="135" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Document Header & Lines -->
    <rect x="90" y="65" width="60" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="90" y="85" width="40" height="4" rx="2" fill="#718096"/>
    <rect x="90" y="97" width="50" height="4" rx="2" fill="#718096"/>
    <rect x="90" y="109" width="45" height="4" rx="2" fill="#718096"/>

    <!-- Medical Cross Badge on Document (referencing medical safety protocol context) -->
    <circle cx="120" cy="142" r="16" fill="#3182CE"/>
    <rect x="115" y="132" width="10" height="20" rx="2" fill="#FFFFFF"/>
    <rect x="110" y="137" width="20" height="10" rx="2" fill="#FFFFFF"/>

    <!-- Physical 'Compliance' / 'Action' Stamp Overlay (Gold/Orange Accent) representing strict adherence -->
    <g transform="translate(115, 125) rotate(-12)">
      <rect x="-35" y="-14" width="70" height="28" rx="6" fill="none" stroke="#D69E2E" stroke-width="3"/>
      <!-- Checkmark symbol inside stamp -->
      <path d="M-12 1 L-3 9 L15 -7" fill="none" stroke="#D69E2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Precise 指引/Pointing Hand (acting in accordance with) -->
    <g transform="translate(145, 155)">
      <!-- Cuff -->
      <rect x="20" y="20" width="30" height="25" rx="4" fill="#4A5568"/>
      <!-- Hand Shape -->
      <path d="M 0 25 C -5 20 -10 15 -10 10 C -10 5 -5 0 2 0 C 7 0 10 3 12 7 C 15 5 19 6 21 10 C 24 9 27 12 28 16 C 30 22 25 35 15 40 C 5 45 -5 30 0 25 Z" fill="#E2E8F0"/>
      <!-- Index Finger pointing directly at the compliant document protocol -->
      <path d="M -10 10 L -35 10 C -38 10 -40 12 -40 15 C -40 18 -38 20 -35 20 L -12 22" fill="#E2E8F0"/>
    </g>
  </g>
</svg>