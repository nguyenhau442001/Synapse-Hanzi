  <line x1="88" y1="62" x2="88" y2="178" stroke="#0B131E" stroke-width="3" opacity="0.4"/>
  <line x1="152" y1="57" x2="152" y2="178" stroke="#0B131E" stroke-width="3" opacity="0.4"/>

  <!-- PRESTIGIOUS MASTERPIECE ACCENTS (Classic Crown / Starburst element above) -->
