  <line x1="63" y1="90" x2="76" y2="88" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="105" x2="78" y2="102" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="120" x2="75" y2="117" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="61" y1="135" x2="77" y2="132" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Page Content Lines -->
  <line x1="164" y1="88" x2="177" y2="90" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="162" y1="102" x2="178" y2="105" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="117" x2="178" y2="120" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="163" y1="132" x2="179" y2="135" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>

