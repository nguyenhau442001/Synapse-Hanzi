<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow representing care and preservation -->
  <circle cx="120" cy="120" r="70" fill="#2D3340" opacity="0.6"/>
  <circle cx="120" cy="120" r="50" fill="#D4AF37" opacity="0.08"/>

  <!-- Protective glowing aura / velvet inner cushion -->
  <path d="M 85 105 Q 120 90 155 105 Q 165 140 120 160 Q 75 140 85 105 Z" fill="#232833"/>

  <!-- Delicate Hands Cupping / Preserving Object (Carefully holding) -->
  <!-- Left Hand -->
  <path d="M 70 145 C 75 130, 85 115, 100 120 C 110 123, 115 135, 105 145 C 95 152, 85 155, 70 145 Z" fill="#E5B299"/>
  <!-- Right Hand -->
  <path d="M 170 145 C 165 130, 155 115, 140 120 C 130 123, 125 135, 135 145 C 145 152, 155 155, 170 145 Z" fill="#E5B299"/>

  <!-- Pocket Watch (怀表 - Heirloom / 珍藏 object) -->
  <!-- Watch Chain -->
  <path d="M 120 60 C 100 60, 85 75, 92 90" fill="none" stroke="#F0C674" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Watch Ring & Crown -->
  <circle cx="120" cy="62" r="7" fill="none" stroke="#F0C674" stroke-width="2.5"/>
  <rect x="117.5" y="69" width="5" height="4" rx="1" fill="#F0C674"/>

  <!-- Watch Outer Casing -->
  <circle cx="120" cy="108" r="32" fill="#2E3440" stroke="#F0C674" stroke-width="3.5"/>
  
  <!-- Watch Inner Face -->
  <circle cx="120" cy="108" r="27" fill="#1E222B"/>

  <!-- Watch Dial Markings (Subtle ticks) -->
  <line x1="120" y1="83" x2="120" y2="86" stroke="#C0C5CE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="130" x2="120" y2="133" stroke="#C0C5CE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="95" y1="108" x2="98" y2="108" stroke="#C0C5CE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="142" y1="108" x2="145" y2="108" stroke="#C0C5CE" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Watch Hands (Classic vintage style) -->
  <!-- Hour hand -->
  <line x1="120" y1="108" x2="110" y2="100" stroke="#F0C674" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="120" y1="108" x2="132" y2="96" stroke="#F0C674" stroke-width="2" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="120" cy="108" r="3" fill="#F0C674"/>

  <!-- Sparkles/Glimmers indicating high value, cherished memory, and timelessness -->
  <path d="M 162 78 L 165 85 L 172 88 L 165 91 L 162 98 L 159 91 L 152 88 L 159 85 Z" fill="#F0C674" opacity="0.9"/>
  <path d="M 80 128 L 82 132 L 86 134 L 82 136 L 80 140 L 78 136 L 74 134 L 78 132 Z" fill="#F0C674" opacity="0.7"/>
  <circle cx="148" cy="132" r="1.5" fill="#F0C674" opacity="0.8"/>
  <circle cx="92" cy="78" r="2" fill="#F0C674" opacity="0.8"/>

</svg>