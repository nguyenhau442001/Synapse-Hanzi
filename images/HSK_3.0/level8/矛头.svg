<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Radial target lines representing focus/attention converging -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#2A303C" stroke-width="2"/>
    
    <!-- Converging direction indicators (spearhead motifs representing 'máo tóu') -->
    <path d="M-90 0 L-70 -10 L-70 10 Z" fill="#F59E0B" opacity="0.6"/>
    <path d="M0 -90 L-10 -70 L10 -70 Z" fill="#F59E0B" opacity="0.3"/>
    <path d="M90 0 L70 -10 L70 10 Z" fill="#F59E0B" opacity="0.3"/>

    <!-- Central physical object: Sleek, sharp, modern spearhead (矛头) -->
    <g transform="rotate(-45)">
      <!-- Spear shaft going backward -->
      <rect x="-6" y="20" width="12" height="60" rx="4" fill="#4B5563"/>
      
      <!-- Spear collar / fitting -->
      <path d="M-10 15 L10 15 L8 25 L-8 25 Z" fill="#9CA3AF"/>
      
      <!-- Main blade body (left half darker for 3D/flat facet effect) -->
      <path d="M0 -80 L-18 15 L0 25 Z" fill="#E5E7EB"/>
      
      <!-- Main blade body (right half lighter) -->
      <path d="M0 -80 L18 15 L0 25 Z" fill="#F9FAFB"/>
      
      <!-- Center ridge line -->
      <line x1="0" y1="-80" x2="0" y2="25" stroke="#D1D5DB" stroke-width="2"/>
      
      <!-- High-contrast focus accent glow/edge -->
      <path d="M0 -84 L-3 -80 L0 -75 L3 -80 Z" fill="#F59E0B"/>
    </g>
    
    <!-- Dynamic focus burst dots -->
    <circle cx="-50" cy="-50" r="3" fill="#F59E0B"/>
    <circle cx="60" cy="-40" r="2" fill="#F59E0B"/>
    <circle cx="-35" cy="55" r="2.5" fill="#F59E0B"/>
    <circle cx="50" cy="45" r="3" fill="#F59E0B"/>
  </g>
</svg>