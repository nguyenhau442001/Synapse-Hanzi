<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The "Light Source" (The successful brother) -->
  <circle cx="120" cy="80" r="35" fill="#FFC107"/>
  <circle cx="120" cy="80" r="25" fill="#FF9800"/>
  
  <!-- Rays of light/prestige -->
  <path d="M120 40 L120 20 M145 55 L160 40 M160 80 L180 80 M145 105 L160 120 M120 120 L120 140 M95 105 L80 120 M80 80 L60 80 M95 55 L80 40" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The Family (The ones "沾光" - basking in the light) -->
  <g transform="translate(60, 160)">
    <circle cx="20" cy="20" r="15" fill="#E0E0E0"/>
    <path d="M5 45 Q20 35 35 45 L35 70 L5 70 Z" fill="#4A90E2"/>
  </g>
  
  <g transform="translate(105, 160)">
    <circle cx="20" cy="20" r="15" fill="#E0E0E0"/>
    <path d="M5 45 Q20 35 35 45 L35 70 L5 70 Z" fill="#4A90E2"/>
  </g>
  
  <g transform="translate(150, 160)">
    <circle cx="20" cy="20" r="15" fill="#E0E0E0"/>
    <path d="M5 45 Q20 35 35 45 L35 70 L5 70 Z" fill="#4A90E2"/>
  </g>
  
  <!-- Light reflection on the family -->
  <path d="M60 160 L120 80 L180 160 Z" fill="url(#grad1)" opacity="0.3"/>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1D24;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>