<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Starry/Outdoor Night Background Elements -->
  <circle cx="185" cy="55" r="1.5" fill="#4A5568"/>
  <circle cx="205" cy="75" r="1" fill="#4A5568"/>
  <circle cx="55" cy="65" r="1.5" fill="#4A5568"/>
  <circle cx="35" cy="45" r="1" fill="#4A5568"/>
  <circle cx="85" cy="35" r="2" fill="#4A5568"/>

  <!-- Tent Ground Anchor & Grass Patches -->
  <path d="M40 190 L200 190" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 190 L53 183 M53 190 L51 185" stroke="#2D3748" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M190 190 L187 183" stroke="#2D3748" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Makeshift Field Tent (Visualizing '将就' - making do with makeshift shelter) -->
  <!-- Main Tent Body (Canvas/Olive tone for field expedition) -->
  <polygon points="120,70 50,185 190,185" fill="#3E4C59"/>
  
  <!-- Tent Flap / Opening (Darker shade) -->
  <polygon points="120,70 120,185 180,185" fill="#2C353D"/>
  
  <!-- Tent Structural Patch/Tear (Indicating rough/makeshift condition) -->
  <path d="M85,130 L95,135 L90,145 Z" fill="#E2E8F0" opacity="0.8"/>
  <path d="M91,135 L102,140" stroke="#2C353D" stroke-width="1.5"/>

  <!-- Support Pole (Improvised stick) -->
  <line x1="120" y1="70" x2="120" y2="185" stroke="#1A1D24" stroke-width="3"/>
  <line x1="118" y1="70" x2="122" y2="70" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Guy Lines / Ropes tethering the tent -->
  <line x1="50" y1="185" x2="25" y2="140" stroke="#718096" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="190" y1="185" x2="215" y2="140" stroke="#718096" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Makeshift Bedding Inside (Sleeping bag / makeshift pallet) -->
  <path d="M110,165 Q135,160 160,175 L175,185 L105,185 Z" fill="#E53E3E"/>
  <path d="M110,165 Q118,163 125,168" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Focus / Accent Lighting (Warm lantern illuminating the makeshift interior) -->
  <circle cx="135" cy="115" r="14" fill="#F6AD55" opacity="0.25"/>
  <circle cx="135" cy="115" r="8" fill="#F6AD55" opacity="0.4"/>
  <path d="M132 105 L138 105 L140 115 L130 115 Z" fill="#CBD5E0"/>
  <circle cx="135" cy="113" r="3" fill="#FFEE58"/>
</svg>