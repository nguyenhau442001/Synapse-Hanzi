<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Document / Fact sheet being verified -->
  <g transform="translate(70, 50)">
    <!-- Paper base -->
    <rect x="0" y="0" width="100" height="130" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <!-- Document header line -->
    <rect x="16" y="20" width="45" height="8" rx="4" fill="#E2E8F0"/>
    <!-- Document content lines -->
    <rect x="16" y="42" width="68" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="16" y="56" width="55" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="16" y="70" width="62" height="5" rx="2.5" fill="#CBD5E1"/>
    
    <!-- Official verification stamp / seal watermark -->
    <circle cx="68" cy="98" r="20" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.7"/>
    <path d="M58 98 L65 105 L79 91" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Magnifying Glass (Verification Tool) representing Qiuzheng (Fact-checking/Verifying) -->
  <g transform="translate(100, 75)">
    <!-- Glass lens shadow -->
    <circle cx="45" cy="45" r="32" fill="#1A1D24" opacity="0.4"/>
    <!-- Glass outer rim -->
    <circle cx="45" cy="45" r="30" fill="#2C3E50" stroke="#F59E0B" stroke-width="5"/>
    <!-- Glass inner reflection/tint -->
    <circle cx="45" cy="45" r="25" fill="#38BDF8" opacity="0.25"/>
    <path d="M28 32 Q36 24 50 26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Magnifying glass handle -->
    <path d="M24 66 L2 88 C-1 91 -1 95 2 98 C5 101 9 101 12 98 L34 76 Z" fill="#64748B"/>
    <path d="M24 66 L2 88 C-1 91 -1 95 2 98 C5 101 9 101 12 98 L34 76 Z" fill="#F59E0B" opacity="0.2"/>
    <!-- Handle grip detail -->
    <line x1="12" y1="88" x2="20" y2="96" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Verification Checkmark Accent Symbol floating near the lens -->
  <g transform="translate(145, 65)">
    <circle cx="16" cy="16" r="16" fill="#10B981"/>
    <path d="M9 16 L13 20 L23 10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>