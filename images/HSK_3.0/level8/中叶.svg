<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "中叶" (Mid-century / Middle of an era) -->
  <!-- Context: 18th-century industrial revolution mid-point, represented via a sleek modern clock/timeline gear mechanism showing the exact middle point -->
  
  <g transform="translate(120, 115)">
    <!-- Outer clock/era ring representing a century span (1700 to 1800) -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#2A303C" stroke-width="8" stroke-dasharray="4 4"/>
    
    <!-- Time track arc with warm glowing accent -->
    <path d="M 0 -72 A 72 72 0 0 1 72 0" fill="none" stroke="#3A4454" stroke-width="8"/>
    <path d="M -72 0 A 72 72 0 0 1 0 -72" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>

    <!-- Era tick marks (representing decades: start, early, mid, late, end) -->
    <!-- Start (0 deg) -->
    <line x1="0" y1="-76" x2="0" y2="-68" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <!-- Middle (Top, -90 deg / 12 o'clock) -> THE EXACT "中叶" (Mid-point) -->
    <line x1="-76" y1="0" x2="-68" y2="0" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="0" x2="68" y2="0" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Central mechanical gear representing historical era / industrial transition -->
    <circle cx="0" cy="0" r="48" fill="#242B38" stroke="#334155" stroke-width="3"/>
    
    <!-- Gear teeth -->
    <path d="M-12 -52 L12 -52 L14 -46 L-14 -46 Z" fill="#F59E0B"/>
    <path d="M-12 52 L12 52 L14 46 L-14 46 Z" fill="#F59E0B"/>
    <path d="M-52 -12 L-52 12 L-46 14 L-46 -14 Z" fill="#F59E0B"/>
    <path d="M52 -12 L52 12 L46 14 L46 -14 Z" fill="#F59E0B"/>
    
    <path d="M-37 -37 L-21 -21 L-26 -16 L-42 -32 Z" fill="#F59E0B"/>
    <path d="M37 37 L21 21 L26 16 L42 32 Z" fill="#F59E0B"/>
    <path d="M37 -37 L21 -21 L16 -26 L32 -42 Z" fill="#F59E0B"/>
    <path d="M-37 37 L-21 21 L-16 26 L-32 42 Z" fill="#F59E0B"/>

    <!-- Inner gear core -->
    <circle cx="0" cy="0" r="24" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>

    <!-- Center Indicator Arrow pointing straight up (The exact midpoint marker) -->
    <polygon points="0,-36 -6,-22 6,-22" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
  </g>

  <!-- Modern UI subtle label badge at the bottom representing historical timeline concept -->
  <rect x="70" y="202" width="100" height="12" rx="6" fill="#242B38"/>
  <circle cx="85" cy="208" r="3" fill="#F59E0B"/>
  <rect x="95" y="206" width="60" height="4" rx="2" fill="#475569"/>
</svg>