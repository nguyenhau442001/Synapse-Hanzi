<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#262B36" opacity="0.6"/>

  <!-- Olympic/Global Sporting Event Bid Concept (申办 - Bid/Apply to Host) -->
  <g transform="translate(0, 5)">
    <!-- Official Document / Bid Dossier Base -->
    <path d="M75 55 L145 55 L165 75 L165 175 L75 175 Z" fill="#2E3646" rx="4"/>
    <path d="M145 55 L145 75 L165 75 Z" fill="#3D475C"/>
    
    <!-- Document Header Lines (Abstract text lines) -->
    <rect x="90" y="72" width="50" height="6" rx="3" fill="#4E5D78"/>
    <rect x="90" y="88" width="60" height="4" rx="2" fill="#3D475C"/>
    <rect x="90" y="98" width="40" height="4" rx="2" fill="#3D475C"/>

    <!-- Official Stamp / Seal of Approval (Golden Accent) -->
    <circle cx="135" cy="145" r="18" fill="#F39C12" opacity="0.2"/>
    <circle cx="135" cy="145" r="14" fill="#F39C12"/>
    <path d="M129 145 L133 149 L142 139" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Global / Stadium Graphic on the Document -->
    <circle cx="105" cy="135" r="16" fill="#1E232E"/>
    <!-- Stadium arches -->
    <path d="M91 138 C91 127 119 127 119 138" stroke="#3D475C" stroke-width="3" fill="none"/>
    <path d="M95 142 C95 133 115 133 115 142" stroke="#4E5D78" stroke-width="2" fill="none"/>
    <!-- Orbit / International Symbol -->
    <ellipse cx="105" cy="135" rx="20" ry="8" transform="rotate(-30 105 135)" stroke="#F39C12" stroke-width="1.5" fill="none" opacity="0.8"/>

    <!-- Golden Fountain Pen / Application Tool -->
    <g transform="translate(115, 80) rotate(45)">
      <!-- Pen Body -->
      <path d="M10 0 L22 0 L26 70 L6 70 Z" fill="#F39C12"/>
      <path d="M10 0 L16 0 L16 70 L6 70 Z" fill="#E08E0B" opacity="0.6"/>
      <!-- Pen Nib -->
      <path d="M6 70 L16 70 L16 90 L11 96 L6 90 Z" fill="#D1D5DB"/>
      <!-- Nib Split Line -->
      <line x1="11" y1="75" x2="11" y2="88" stroke="#4B5563" stroke-width="1"/>
      <!-- Pen Clip -->
      <rect x="14" y="10" width="3" height="25" rx="1.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Interactive Sparkles / Official Submission Effect -->
    <circle cx="65" cy="75" r="3" fill="#F39C12"/>
    <path d="M65 67 L65 83 M57 75 L73 75" stroke="#F39C12" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <circle cx="175" cy="125" r="2.5" fill="#F39C12"/>
    <path d="M175 119 L175 131 M169 125 L181 125" stroke="#F39C12" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  </g>
</svg>