<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="pathGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A4454"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow for Causality / Outcome Peak -->
  <circle cx="185" cy="65" r="45" fill="url(#glowGrad)"/>

  <!-- Visual Metaphor: Progression & Causality (Staircase / Stepping Stones leading to a Goal) -->
  <!-- Base Ground Line -->
  <path d="M 30 190 L 210 190" stroke="#2B313D" stroke-width="2" stroke-linecap="round"/>

  <!-- Step 1: Effort / Condition (Start) -->
  <g transform="translate(0, 0)">
    <rect x="40" y="160" width="30" height="30" rx="4" fill="#2B313D"/>
    <!-- Small indicator dot -->
    <circle cx="55" cy="145" r="4" fill="#626C7D"/>
    <!-- Connecting dashed line showing progression -->
    <path d="M 70 175 C 90 175, 90 145, 110 145" stroke="#F5A623" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.5"/>
  </g>

  <!-- Step 2: Persistence (Middle) -->
  <g transform="translate(0, 0)">
    <rect x="110" y="130" width="30" height="60" rx="4" fill="#323B4B"/>
    <circle cx="125" cy="115" r="5" fill="#F5A623" opacity="0.6"/>
    <!-- Connecting dashed line -->
    <path d="M 140 145 C 160 145, 160 85, 180 85" stroke="#F5A623" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  </g>

  <!-- Step 3: Success / Target (Peak / Consequence "就") -->
  <g transform="translate(0, 0)">
    <rect x="180" y="80" width="30" height="110" rx="4" fill="url(#pathGradient)"/>
    
    <!-- Target / Achievement Star Icon at the Peak -->
    <g transform="translate(195, 55)">
      <circle cx="0" cy="0" r="14" fill="#1A1D24" stroke="#F5A623" stroke-width="3"/>
      <!-- Simple checkmark / success symbol -->
      <path d="M -5 -1 L -1 3 L 6 -4" fill="none" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Structural Causality Indicator (If -> Then Arrow flow) -->
  <!-- Conditional node (Left) -->
  <rect x="42" y="202" width="56" height="16" rx="8" fill="#2B313D"/>
  <circle cx="52" cy="210" r="3" fill="#626C7D"/>
  <circle cx="62" cy="210" r="3" fill="#626C7D"/>
  <circle cx="72" cy="210" r="3" fill="#626C7D"/>

  <!-- Directional Flow Arrow -->
  <path d="M 105 210 L 135 210" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
  <polygon points="133,206 141,210 133,214" fill="#F5A623"/>

  <!-- Result node (Right) -->
  <rect x="144" y="202" width="56" height="16" rx="8" fill="#3A4454"/>
  <circle cx="160" cy="210" r="4" fill="#F5A623"/>
  <circle cx="176" cy="210" r="4" fill="#F5A623"/>

</svg>