<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient glow for golden osmanthus theme -->
  <circle cx="120" cy="115" r="70" fill="#F5A623" opacity="0.08" filter="blur(15px)"/>

  <!-- Stem & Branch Structure -->
  <path d="M 70 180 Q 90 140 120 135 T 180 120" fill="none" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>
  <path d="M 110 145 Q 130 110 155 100" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M 95 160 Q 80 125 65 115" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>

  <!-- Leaves (Dark mode stylized deep green) -->
  <!-- Leaf 1 bottom left -->
  <path d="M 80 160 Q 50 170 40 145 Q 60 140 80 160 Z" fill="#234E52" stroke="#319795" stroke-width="1.5"/>
  <path d="M 50 153 L 70 155" fill="none" stroke="#319795" stroke-width="1" opacity="0.6"/>

  <!-- Leaf 2 top right -->
  <path d="M 150 100 Q 185 85 190 110 Q 170 120 150 100 Z" fill="#234E52" stroke="#319795" stroke-width="1.5"/>
  <path d="M 178 98 L 160 108" fill="none" stroke="#319795" stroke-width="1" opacity="0.6"/>

  <!-- Leaf 3 center back -->
  <path d="M 115 135 Q 100 95 125 85 Q 135 110 115 135 Z" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.5" opacity="0.2"/> <!-- subtle variation -->
  <path d="M 115 135 Q 105 105 120 95 Q 125 115 115 135 Z" fill="#134E4A" stroke="#2DD4BF" stroke-width="1.5"/>

  <!-- Osmanthus Flowers (Clusters of tiny vibrant 4-petal golden-orange blossoms) -->
  
  <!-- Cluster 1 (Top Left) -->
  <g transform="translate(85, 95)">
    <!-- Flower 1 -->
    <path d="M0 -6 C3 -6 6 -3 6 0 C6 3 3 6 0 6 C-3 6 -6 3 -6 0 C-6 -3 -3 -6 0 -6 Z" fill="#F6AD55" stroke="#DD6B20" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.5" fill="#C05621"/>
    <!-- Flower 2 -->
    <path d="M12 -2 C14 -2 17 0 17 3 C17 6 14 8 12 8 C9 8 7 6 7 3 C7 0 9 -2 12 -2 Z" fill="#ED8936" stroke="#C05621" stroke-width="1"/>
    <!-- Flower 3 -->
    <path d="M3 10 C5 10 8 12 8 15 C8 18 5 20 3 20 C0 20 -2 18 -2 15 C-2 12 0 10 3 10 Z" fill="#F6AD55" stroke="#DD6B20" stroke-width="1"/>
  </g>

  <!-- Cluster 2 (Main Center Focus - Largest) -->
  <g transform="translate(130, 110)">
    <!-- Flower A -->
    <path d="M0 -8 C4 -8 8 -4 8 0 C8 4 4 8 0 8 C-4 8 -8 4 -8 0 C-8 -4 -4 -8 0 -8 Z" fill="#FBD38D" stroke="#ED8936" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#DD6B20"/>
    
    <!-- Flower B -->
    <path d="M10 -6 C13 -6 16 -3 16 0 C16 3 13 6 10 6 C7 6 5 3 5 0 C5 -3 7 -6 10 -6 Z" fill="#F6AD55" stroke="#DD6B20" stroke-width="1.5"/>
    <circle cx="10.5" cy="0" r="1.5" fill="#C05621"/>

    <!-- Flower C -->
    <path d="M-10 -4 C-7 -4 -4 -1 -4 2 C-4 5 -7 8 -10 8 C-13 8 -16 5 -16 2 C-16 -1 -13 -4 -10 -4 Z" fill="#ED8936" stroke="#C05621" stroke-width="1.5"/>
    
    <!-- Flower D -->
    <path d="M-4 9 C-1 9 2 12 2 15 C2 18 -1 21 -4 21 C-7 21 -10 18 -10 15 C-10 12 -7 9 -4 9 Z" fill="#FBD38D" stroke="#ED8936" stroke-width="1.5"/>
    <circle cx="-4" cy="15" r="1.5" fill="#DD6B20"/>

    <!-- Flower E -->
    <path d="M8 8 C11 8 14 11 14 14 C14 17 11 20 8 20 C5 20 2 17 2 14 C2 11 5 8 8 8 Z" fill="#F6AD55" stroke="#DD6B20" stroke-width="1.5"/>
  </g>

  <!-- Cluster 3 (Bottom Right branch accent) -->
  <g transform="translate(160, 145)">
    <path d="M0 0 C3 0 5 2 5 5 C5 8 3 10 0 10 C-3 10 -5 8 -5 5 C-5 2 -3 0 0 0 Z" fill="#ED8936" stroke="#C05621" stroke-width="1"/>
    <path d="M8 -4 C11 -4 13 -2 13 1 C13 4 11 6 8 6 C5 6 3 4 3 1 C3 -2 5 -4 8 -4 Z" fill="#FBD38D" stroke="#ED8936" stroke-width="1"/>
    <circle cx="8" cy="1" r="1.2" fill="#DD6B20"/>
  </g>

  <!-- Floating Aroma / Pollen Particles (Visualizing the "guìhuā xiāng" scent drifting in autumn air) -->
  <g opacity="0.8">
    <circle cx="105" cy="65" r="2" fill="#FBD38D" filter="blur(0.5px)"/>
    <circle cx="125" cy="50" r="1.5" fill="#F6AD55"/>
    <circle cx="150" cy="60" r="2.5" fill="#FBD38D" filter="blur(1px)"/>
    <circle cx="170" cy="80" r="1.5" fill="#ED8936"/>
    
    <!-- Tiny floating four-petal scent wisps -->
    <path d="M 95 75 Q 98 72 101 75 Q 98 78 95 75 Z" fill="#FBD38D" opacity="0.6"/>
    <path d="M 140 45 Q 142 43 144 45 Q 142 47 140 45 Z" fill="#F6AD55" opacity="0.7"/>
    <path d="M 185 70 Q 187 68 189 70 Q 187 72 185 70 Z" fill="#FBD38D" opacity="0.5"/>
  </g>

</svg>