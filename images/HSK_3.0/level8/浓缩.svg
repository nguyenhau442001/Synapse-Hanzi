<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Glowing atmosphere effect for concentration/condensation -->
    <circle cx="120" cy="115" r="70" fill="#2D3748" opacity="0.4" />
    <circle cx="120" cy="115" r="50" fill="#3182CE" opacity="0.15" />

    <!-- Outer expansive realm (representing centuries/large volume) -->
    <path d="M 60 70 Q 120 40 180 70" fill="none" stroke="#4A5568" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
    <path d="M 45 95 Q 120 60 195 95" fill="none" stroke="#4A5568" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>
    
    <!-- Flowing convergence lines / funnel paths -->
    <path d="M 60 70 C 90 90, 100 100, 110 115" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 180 70 C 150 90, 140 100, 130 115" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 45 95 C 80 105, 100 110, 112 118" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 195 95 C 160 105, 140 110, 128 118" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Dynamic condensing particles -->
    <circle cx="75" cy="65" r="3" fill="#ED8936"/>
    <circle cx="165" cy="65" r="2.5" fill="#ED8936"/>
    <circle cx="55" cy="85" r="2" fill="#F6AD55"/>
    <circle cx="185" cy="85" r="3" fill="#F6AD55"/>
    <circle cx="95" cy="80" r="2" fill="#ECC94B"/>
    <circle cx="145" cy="80" r="2.5" fill="#ECC94B"/>

    <!-- Central physical object: The Essence Drop / Condensed Core -->
    <path d="M 120 75 C 120 75, 145 105, 145 125 C 145 138.807, 133.807 150, 120 150 C 106.193 150, 95 138.807, 95 125 C 95 105, 120 75, 120 75 Z" fill="url(#coreGradient)" stroke="#DD6B20" stroke-width="2"/>

    <!-- Core Inner Highlights for 3D glossy flat look -->
    <path d="M 110 110 C 112 105, 118 95, 120 90 C 122 95, 128 105, 130 110 C 135 116, 135 128, 130 135 C 125 140, 115 140, 110 135 C 105 128, 105 116, 110 110 Z" fill="#FEEBC8" opacity="0.3"/>
    <path d="M 112 115 C 116 110, 118 102, 120 98 C 121 103, 123 108, 126 114 C 130 120, 130 128, 126 133 C 122 137, 118 137, 114 133 C 110 128, 110 120, 112 115 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Focus sparkle/gem element -->
    <path d="M 120 102 L 122 110 L 130 112 L 122 114 L 120 122 L 118 114 L 110 112 L 118 110 Z" fill="#FFF5F5" opacity="0.9"/>
  </g>

  <!-- Definitions -->
  <defs>
    <linearGradient id="coreGradient" x1="95" y1="75" x2="145" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6AD55"/>
      <stop offset="50%" stop-color="#DD6B20"/>
      <stop offset="100%" stop-color="#9C4221"/>
    </linearGradient>
  </defs>
</svg>