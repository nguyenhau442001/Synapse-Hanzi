<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow for Focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Table / Surface -->
  <path d="M 60,170 L 180,170 L 200,195 L 40,195 Z" fill="#2D323E"/>
  <path d="M 50,170 L 190,170" stroke="#3A4150" stroke-width="2" stroke-linecap="round"/>

  <!-- Go Board (Goban) / Chess context in perspective -->
  <path d="M 80,135 L 160,135 L 175,160 L 65,160 Z" fill="#E5A967"/>
  <!-- Board grid lines -->
  <line x1="95" y1="135" x2="80" y2="160" stroke="#C48E4D" stroke-width="1.5"/>
  <line x1="120" y1="135" x2="120" y2="160" stroke="#C48E4D" stroke-width="1.5"/>
  <line x1="145" y1="135" x2="160" y2="160" stroke="#C48E4D" stroke-width="1.5"/>
  <line x1="73" y1="147" x2="167" y2="147" stroke="#C48E4D" stroke-width="1.5"/>

  <!-- Game pieces (stones) -->
  <ellipse cx="105" cy="142" rx="5" ry="3.5" fill="#222222"/>
  <ellipse cx="135" cy="152" rx="5" ry="3.5" fill="#F4F4F4"/>

  <!-- Character Left (Active/Moving) -->
  <!-- Body/Torso -->
  <path d="M 75,170 C 75,145 90,130 95,130 C 100,130 115,145 115,170 Z" fill="#3B82F6"/>
  <!-- Head -->
  <circle cx="95" cy="105" r="14" fill="#FFD166"/>
  <!-- Hair Left -->
  <path d="M 81,105 C 81,95 90,91 97,91 C 104,91 109,98 109,105 Z" fill="#2B2D42"/>
  <!-- Arm Left (Placing piece) -->
  <path d="M 85,140 C 95,140 102,142 108,145" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Hand Left -->
  <circle cx="111" cy="146" r="4.5" fill="#FFD166"/>

  <!-- Character Right (Observing/Thinking/Exchanging) -->
  <!-- Body/Torso -->
  <path d="M 125,170 C 125,145 140,130 145,130 C 150,130 165,145 165,170 Z" fill="#F97316"/>
  <!-- Head -->
  <circle cx="145" cy="105" r="14" fill="#FFD166"/>
  <!-- Hair Right -->
  <path d="M 131,105 C 131,97 138,91 145,91 C 153,91 159,97 159,105 Z" fill="#2B2D42"/>
  <!-- Arm Right (Thoughtful gesture - hand on chin) -->
  <path d="M 155,140 C 150,145 147,138 145,128" stroke="#F97316" stroke-width="8" stroke-linecap="round" fill="round" fill="none"/>
  <!-- Hand Right -->
  <circle cx="143" cy="123" r="4.5" fill="#FFD166"/>

  <!-- Dynamic Interaction / Motion Lines (Indicating "qiēcuō" - mutual exchange/sparring) -->
  <path d="M 110,90 Q 120,78 130,90" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="4 3"/>
  <path d="M 115,84 Q 120,74 125,84" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Sparkle / Insight elements representing learning and skill exchange -->
  <path d="M 120,55 L 122,63 L 130,65 L 122,67 L 120,75 L 118,67 L 110,65 L 118,63 Z" fill="#FBBF24"/>
  <path d="M 72,75 L 73,79 L 77,80 L 73,81 L 72,85 L 71,81 L 67,80 L 71,79 Z" fill="#38BDF8" opacity="0.8"/>
  <path d="M 168,75 L 169,79 L 173,80 L 169,81 L 168,85 L 167,81 L 163,80 L 167,79 Z" fill="#FB923C" opacity="0.8"/>
</svg>