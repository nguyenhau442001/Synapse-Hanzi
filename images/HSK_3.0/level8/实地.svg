<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Mountain Background Layers (Geological site context) -->
    <path d="M 20 130 L 70 60 L 120 110 L 160 80 L 200 130 Z" fill="#242B38" />
    <path d="M 0 130 L 40 85 L 90 140 L 140 100 L 200 140 Z" fill="#2C3546" />
    
    <!-- Ground / Terrain Layer -->
    <path d="M 0 140 Q 60 135 100 142 T 200 140 L 200 170 L 0 170 Z" fill="#323E52" />
    
    <!-- Warning/Hazard Zone Indicator (Subtle geological slip area) -->
    <path d="M 85 115 Q 105 110 125 135 L 75 140 Z" fill="#E67E22" opacity="0.3"/>
    <path d="M 95 125 L 110 120 L 105 132 Z" fill="#F1C40F"/>
    
    <!-- Tripod / Survey Instrument (Theodolite / Total Station representing "实地勘察" - Field Survey) -->
    <!-- Legs -->
    <line x1="100" y1="105" x2="75" y2="155" stroke="#95A5A6" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="105" x2="125" y2="155" stroke="#95A5A6" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="105" x2="105" y2="160" stroke="#7F8C8D" stroke-width="3" stroke-linecap="round"/>
    <!-- Instrument Head -->
    <rect x="91" y="95" width="18" height="12" rx="3" fill="#E67E22"/>
    <circle cx="100" cy="101" r="5" fill="#F39C12"/>
    <rect x="96" y="90" width="8" height="5" fill="#BDC3C7"/>
    
    <!-- Geologist / Expert inspecting (Representing "实地" - On-site / In-person physical presence) -->
    <!-- Body & Vest (Field gear) -->
    <path d="M 140 150 C 135 135 138 120 148 115 C 158 120 160 135 155 150 Z" fill="#34495E"/>
    <path d="M 138 125 L 158 125 L 156 150 L 140 150 Z" fill="#E67E22"/> <!-- Field vest -->
    
    <!-- Head & Hard Hat -->
    <circle cx="148" cy="105" r="7" fill="#F5CBA7"/>
    <ellipse cx="148" cy="101" rx="9" ry="3" fill="#F1C40F"/> <!-- Hard Hat -->
    
    <!-- Arms pointing / examining -->
    <path d="M 144 125 L 125 135" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>
    <path d="M 152 125 L 140 138" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>

    <!-- Magnifying Glass / Inspection Beam highlighting the ground (Focus on "现场" / "实地") -->
    <circle cx="120" cy="142" r="14" fill="none" stroke="#3498DB" stroke-width="3" opacity="0.8"/>
    <line x1="108" y1="154" x2="98" y2="164" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Ground details / rocks being inspected -->
    <circle cx="118" cy="144" r="2" fill="#E74C3C"/>
    <circle cx="125" cy="140" r="1.5" fill="#BDC3C7"/>

    <!-- Location Pin icon integrated cleanly to reinforce physical location/site meaning -->
    <g transform="translate(35, 75)">
      <path d="M 12 0 C 5.4 0 0 5.4 0 12 C 0 21 12 32 12 32 C 12 32 24 21 24 12 C 24 5.4 18.6 0 12 0 Z" fill="#E74C3C"/>
      <circle cx="12" cy="11" r="4.5" fill="#1A1D24"/>
    </g>
  </g>
</svg>