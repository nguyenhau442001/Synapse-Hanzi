  <line x1="130" y1="142" x2="160" y2="142" stroke="#2C3E50" stroke-width="2"/>
  
  <!-- Fence/Yard boundary -->
  <rect x="30" y="160" width="10" height="20" fill="#95A5A6"/>
  <rect x="200" y="160" width="10" height="20" fill="#95A5A6"/>
  <line x1="35" y1="170" x2="205" y2="170" stroke="#95A5A6" stroke-width="2"/>
  
  <!-- Tree -->
