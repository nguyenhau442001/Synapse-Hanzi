  <!-- House Structure -->
  <rect x="60" y="110" width="120" height="70" fill="#E67E22"/>
  
  <!-- Roof -->
  <path d="M50 110 L120 70 L190 110 Z" fill="#D35400"/>
  
  <!-- Door -->
  <rect x="80" y="135" width="30" height="45" fill="#2C3E50"/>
  
  <!-- Window -->
  <rect x="130" y="130" width="30" height="25" fill="#F1C40F"/>
