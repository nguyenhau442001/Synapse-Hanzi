<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Background Glow for Chest/Heart Area -->
    <radialGradient id="chestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9F43" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Rising Future / Aspiration Light Gradient -->
    <linearGradient id="futureLight" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF9F43" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFD32A" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background decorative subtle elements representing future horizons and aspirations -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="#60A5FA" stroke-width="1"/>
  </g>

  <!-- Rays of ambition/future shining upward -->
  <path d="M120 120 L80 40 M120 120 L160 40 M120 120 L120 30 M120 120 L50 70 M120 120 L190 70" stroke="#FFD32A" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Character / Bust representing the human vessel ("nhân vật/trong lòng") -->
  <g>
    <!-- Shoulders and Body -->
    <path d="M 70 200 C 70 170, 90 150, 120 150 C 150 150, 170 170, 170 200 Z" fill="#2D3748"/>
    
    <!-- Collar / Graduation or Professional attire hint -->
    <path d="M 100 150 L 120 170 L 140 150" fill="none" stroke="#4A5568" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Chest Glow representing "满怀" (fullness of heart, aspirations, and grand ambitions inside) -->
    <circle cx="120" cy="135" r="45" fill="url(#chestGlow)"/>
    
    <!-- Golden radiant core inside the chest symbolizing "đoàn hoài bão, chí khí" -->
    <circle cx="120" cy="135" r="22" fill="#FF9F43" opacity="0.9"/>
    <circle cx="120" cy="135" r="14" fill="#FFD32A"/>
  </g>

  <!-- Rising symbols of bright future, dreams, and aspirations emerging directly from within/above -->
  <g>
    <!-- Central upward-soaring star/spark of ambition -->
    <path d="M 120 75 L 123 90 L 138 93 L 123 96 L 120 111 L 117 96 L 102 93 L 117 90 Z" fill="#FFD32A"/>
    
    <!-- Secondary glowing sparkles representing "triển vọng, tương lai tươi đẹp" -->
    <path d="M 85 95 L 87 101 L 93 103 L 87 105 L 85 111 L 83 105 L 77 103 L 83 101 Z" fill="#FF9F43" opacity="0.8"/>
    <path d="M 155 95 L 157 101 L 163 103 L 157 105 L 155 111 L 153 105 L 147 103 L 153 101 Z" fill="#FF9F43" opacity="0.8"/>

    <!-- Small ascending particles -->
    <circle cx="105" cy="65" r="2.5" fill="#FFD32A" opacity="0.9"/>
    <circle cx="135" cy="60" r="2" fill="#FFD32A" opacity="0.7"/>
    <circle cx="120" cy="45" r="3" fill="#FFD32A" opacity="0.95"/>
  </g>

</svg>