<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for the planting scene -->
  <circle cx="120" cy="140" r="70" fill="#2E3842" opacity="0.4"/>

  <!-- Sparing hillside mound -->
  <path d="M 40,165 Q 120,135 200,165 L 210,195 L 30,195 Z" fill="#242B35"/>
  <path d="M 40,165 Q 120,135 200,165" fill="none" stroke="#3A4756" stroke-width="3" stroke-linecap="round"/>

  <!-- Deeply planted roots in the earth -->
  <g fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 120,155 Q 110,170 95,180"/>
    <path d="M 120,155 Q 130,170 145,180"/>
    <path d="M 120,165 Q 120,180 120,190"/>
  </g>

  <!-- Tree trunk and branches (Strong structure representing "Zai" / Planting firmly) -->
  <path d="M 113,115 L 113,165 Q 113,168 120,168 Q 127,168 127,165 L 127,115 Z" fill="#94A3B8"/>
  <path d="M 120,130 L 95,110" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120,120 L 145,100" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <!-- Vibrant green foliage (Thriving sapling) -->
  <g fill="#10B981">
    <circle cx="120" cy="85" r="30"/>
    <circle cx="95" cy="105" r="22"/>
    <circle cx="145" cy="95" r="25"/>
    <circle cx="120" cy="65" r="20"/>
  </g>

  <!-- Highlight details on leaves -->
  <g fill="#34D399" opacity="0.6">
    <circle cx="115" cy="75" r="10"/>
    <circle cx="92" cy="100" r="7"/>
    <circle cx="140" cy="90" r="8"/>
  </g>

  <!-- Interactive gardening hands planting firmly -->
  <!-- Left hand -->
  <g transform="translate(65, 135) rotate(-15)">
    <path d="M 15,10 C 10,10 5,15 5,22 C 5,28 10,32 15,35 L 25,45 C 30,50 40,50 45,45 C 50,40 50,30 42,22 L 32,12 C 28,8 20,10 15,10 Z" fill="#FBBF24"/>
    <path d="M 32,22 L 45,15 C 48,13 50,9 47,6 C 44,3 39,5 35,8 L 27,16" fill="#FBBF24"/>
  </g>

  <!-- Right hand -->
  <g transform="translate(175, 145) scale(-1, 1) rotate(-15)">
    <path d="M 15,10 C 10,10 5,15 5,22 C 5,28 10,32 15,35 L 25,45 C 30,50 40,50 45,45 C 50,40 50,30 42,22 L 32,12 C 28,8 20,10 15,10 Z" fill="#FBBF24"/>
    <path d="M 32,22 L 45,15 C 48,13 50,9 47,6 C 44,3 39,5 35,8 L 27,16" fill="#FBBF24"/>
  </g>

  <!-- Ground surface soil particles / accents -->
  <circle cx="100" cy="158" r="2" fill="#4B5563"/>
  <circle cx="140" cy="160" r="2.5" fill="#4B5563"/>
  <circle cx="108" cy="164" r="1.5" fill="#4B5563"/>
  <circle cx="132" cy="163" r="2" fill="#4B5563"/>
</svg>