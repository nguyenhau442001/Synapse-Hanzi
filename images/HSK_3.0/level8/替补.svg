<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle pitch background elements -->
  <path d="M40 120 L200 120" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="50" fill="none" stroke="#252A34" stroke-width="2"/>
  
  <!-- Substitution Board Graphic (Representing "替补" - Sub/Replacement) -->
  <!-- Outer Frame -->
  <rect x="75" y="60" width="90" height="120" rx="12" fill="#111318" stroke="#323846" stroke-width="3"/>
  <rect x="83" y="68" width="74" height="104" rx="8" fill="#1A1D24"/>
  
  <!-- Outgoing Number (Red, top half) -->
  <path d="M102 96 L112 86 L112 116" fill="none" stroke="#FF5C5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 86 L148 86 L138 101 L148 116 L128 116" fill="none" stroke="#FF5C5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="95" y1="124" x2="145" y2="124" stroke="#252A34" stroke-width="2"/>

  <!-- Incoming Number (Green/Gold accent, bottom half) -->
  <path d="M107 140 L127 140 L127 165" fill="none" stroke="#FFB800" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M135 140 L135 165 M135 152.5 L145 152.5" fill="none" stroke="#FFB800" stroke-width="6" stroke-linecap="round"/>

  <!-- Up/Down Indicator Arrows on the side of the board -->
  <polygon points="175,95 183,105 167,105" fill="#FF5C5C"/>
  <polygon points="175,145 183,135 167,135" fill="#FFB800"/>

  <!-- Player silhouette peeking / stepping in from the side (Contextual: young dynamic substitute) -->
  <g transform="translate(15, 30)">
    <!-- Dynamic angled figure representing entry -->
    <path d="M35 100 C35 85 45 75 55 75 C65 75 75 85 75 100 L70 140 L40 140 Z" fill="#252A34"/>
    <circle cx="55" cy="58" r="12" fill="#323846"/>
    <!-- Arm reaching forward holding the board base or ready -->
    <path d="M50 110 L75 115" stroke="#323846" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Highlight accent badge (Tactical focal point) -->
  <circle cx="120" cy="60" r="6" fill="#FFB800"/>
</svg>