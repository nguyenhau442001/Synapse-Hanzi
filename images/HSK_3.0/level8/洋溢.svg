<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Head of the elderly principal -->
  <g transform="translate(120, 120)">
    <!-- Face shape -->
    <path d="M-40,-20 C-40,20 -20,50 0,50 C20,50 40,20 40,-20 C40,-60 20,-80 0,-80 C-20,-80 -40,-60 -40,-20 Z" fill="#D4A373"/>
    
    <!-- Wrinkles/Crows feet to show "沧桑" (weathered/aged) -->
    <path d="M32,-30 L42,-35 M32,-20 L45,-22 M-32,-30 L-42,-35 M-32,-20 L-45,-22" stroke="#A67C52" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Eyes (closed in a genuine, warm, crinkled smile) -->
    <path d="M-25,-25 C-15,-35 -5,-35 5,-25 M15,-25 C25,-35 35,-35 45,-25" stroke="#4A3728" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Mouth (wide, radiant smile) -->
    <path d="M-20,10 C-10,30 10,30 20,10" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Hair (sparse, grey/white) -->
    <path d="M-35,-60 C-40,-85 -10,-95 0,-95 C10,-95 40,-85 35,-60" fill="#E0E0E0"/>
    
    <!-- Radiance effect (subtle gold light emanating from the smile/face area) -->
    <circle cx="0" cy="-10" r="70" fill="url(#grad1)" opacity="0.15"/>
  </g>
  
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>