<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Soil layer -->
  <path d="M0 160 C 40 150, 200 150, 240 160 L 240 240 L 0 240 Z" fill="#2D343E"/>
  <path d="M0 175 C 60 165, 180 165, 240 175 L 240 240 L 0 240 Z" fill="#3A424F"/>
  
  <!-- Deep Roots -->
  <g stroke="#FFB84D" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M120 165 C 110 190, 80 200, 70 230"/>
    <path d="M120 165 C 130 190, 160 200, 170 230"/>
    <path d="M120 165 C 120 200, 120 210, 120 240"/>
    <path d="M120 165 C 100 180, 90 190, 85 210"/>
    <path d="M120 165 C 140 180, 150 190, 155 210"/>
  </g>
  
  <!-- Human Character (Action: Firmly planting/holding) -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-15 0 L 15 0 L 10 40 L -10 40 Z" fill="#E0E6ED"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="15" fill="#E0E6ED"/>
    <!-- Arms pushing down -->
    <path d="M-15 5 L -35 25" stroke="#E0E6ED" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 5 L 35 25" stroke="#E0E6ED" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Motion lines indicating depth/stability -->
  <g stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4">
    <path d="M50 180 L 50 220"/>
    <path d="M190 180 L 190 220"/>
  </g>
</svg>