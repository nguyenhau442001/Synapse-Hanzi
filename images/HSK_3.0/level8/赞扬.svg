<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Podium/Platform -->
  <path d="M60 190 L180 190 L170 205 L70 205 Z" fill="#374151"/>
  <path d="M70 205 L170 205 L165 215 L75 215 Z" fill="#1F2937"/>
  
  <!-- Character representing the person being praised -->
  <g transform="translate(120, 180)">
    <!-- Body -->
    <path d="M-25 0 C-25 -30, 25 -30, 25 0 L20 10 L-20 10 Z" fill="#9CA3AF"/>
    <!-- Head -->
    <circle cx="0" cy="-45" r="20" fill="#E5E7EB"/>
    <!-- Smile -->
    <path d="M-8 -40 Q0 -35 8 -40" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Spotlight/Focus effect -->
  <path d="M120 20 L160 190 L80 190 Z" fill="#F59E0B" opacity="0.15"/>
  
  <!-- Hands clapping (The act of praise) -->
  <g transform="translate(60, 80)">
    <path d="M0 0 C-10 -20, 10 -20, 0 0" fill="#FBBF24"/>
    <path d="M20 10 C10 -10, 30 -10, 20 10" fill="#FBBF24"/>
  </g>
  
  <g transform="translate(180, 80) scale(-1, 1)">
    <path d="M0 0 C-10 -20, 10 -20, 0 0" fill="#FBBF24"/>
    <path d="M20 10 C10 -10, 30 -10, 20 10" fill="#FBBF24"/>
  </g>
  
  <!-- Laurel Wreath (Symbol of honor/praise) -->
  <path d="M120 120 C140 120, 150 135, 150 150 C150 165, 140 180, 120 180 C100 180, 90 165, 90 150 C90 135, 100 120, 120 120 Z" fill="none" stroke="#FBBF24" stroke-width="4" stroke-dasharray="10 5"/>
</svg>