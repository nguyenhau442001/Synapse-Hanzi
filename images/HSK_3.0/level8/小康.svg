<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle horizon line -->
  <path d="M0 180 L240 180" stroke="#2D343E" stroke-width="2"/>
  
  <!-- The "Small" (Xiao) element: A modest, comfortable, well-built home structure -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="60" height="60" fill="#3A4454" rx="4"/>
    <rect x="15" y="15" width="30" height="45" fill="#4A5568" rx="2"/>
    <rect x="22" y="25" width="16" height="20" fill="#FFD700"/>
    <path d="M0 0 L30 -25 L60 0 Z" fill="#FF8C00"/>
  </g>
  
  <!-- The "Kang" (Well-being/Prosperity) element: Exaggerated scale of abundance -->
  <!-- A large, overflowing basket of fresh produce representing sufficiency and comfort -->
  <g transform="translate(130, 100)">
    <path d="M10 140 L70 140 L60 80 L20 80 Z" fill="#D4AF37"/>
    <circle cx="30" cy="70" r="12" fill="#FF6B6B"/>
    <circle cx="50" cy="75" r="10" fill="#FFD700"/>
    <circle cx="40" cy="60" r="14" fill="#FF8C00"/>
    <circle cx="20" cy="85" r="8" fill="#FFD700"/>
  </g>
  
  <!-- Visual contrast: The transition from basic to flourishing -->
  <path d="M105 150 L125 150" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <path d="M115 140 L115 160" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative elements indicating stability and growth -->
  <path d="M20 200 Q120 170 220 200" stroke="#FFD700" stroke-width="2" fill="none" opacity="0.3"/>
</svg>