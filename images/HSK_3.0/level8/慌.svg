<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character representing 'Panic/Huāng' -->
  <!-- Body -->
  <path d="M120 100c-15 0-25 10-25 25v60c0 5 5 10 10 10h30c5 0 10-5 10-10v-60c0-15-10-25-25-25z" fill="#E0E0E0"/>
  
  <!-- Head -->
  <circle cx="120" cy="80" r="25" fill="#E0E0E0"/>
  
  <!-- Expression: Wide eyes and open mouth for panic -->
  <circle cx="110" cy="75" r="4" fill="#1A1D24"/>
  <circle cx="130" cy="75" r="4" fill="#1A1D24"/>
  <ellipse cx="120" cy="90" rx="6" ry="8" fill="#1A1D24"/>
  
  <!-- Arms in panicked gesture (raised/flailing) -->
  <path d="M95 110 L70 90" stroke="#E0E0E0" stroke-width="12" stroke-linecap="round"/>
  <path d="M145 110 L170 90" stroke="#E0E0E0" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Motion lines indicating frantic movement -->
  <path d="M180 70 Q190 80 180 90" stroke="#FF9800" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M185 60 Q200 75 185 90" stroke="#FF9800" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M60 70 Q50 80 60 90" stroke="#FF9800" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M55 60 Q40 75 55 90" stroke="#FF9800" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Accent: Fire/Danger indicator (abstract but clear context) -->
  <path d="M120 190 L110 210 L130 210 Z" fill="#FF9800"/>
  <path d="M120 185 L115 195 L125 195 Z" fill="#FFC107"/>
</svg>