<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    {/* Ground / Base */}
    <path d="M50 190 L190 190" stroke="#2D323F" stroke-width="3" stroke-linecap="round"/>
    
    {/* Warning Sign Post */}
    <rect x="117" y="110" width="6" height="80" fill="#4A5568" rx="3"/>
    
    {/* Warning Sign Board (Triangle) */}
    <path d="M120 45 L175 125 L65 125 Z" fill="#262D3D" stroke="#E65F2B" stroke-width="4" stroke-linejoin="round"/>
    <path d="M120 58 L164 120 L76 120 Z" fill="#FFA500"/>
    
    {/* Exclamation Mark inside Triangle */}
    <rect x="117" y="78" width="6" height="24" rx="3" fill="#1A1D24"/>
    <circle cx="120" cy="110" r="3.5" fill="#1A1D24"/>
    
    {/* Falling / Consequence Action (Representing "Bear the Consequences") */}
    <path d="M85 85 C85 85 95 70 100 80" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="82" cy="85" r="4" fill="#E2E8F0"/>
