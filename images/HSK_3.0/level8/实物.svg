<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow / Focus Circle -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual Representation of "实物" (Physical Object / Real Object) -->
  <!-- Context: Comparing digital/online representation with the actual physical object -->

  <!-- Digital screen frame (representing online preview / webpage) -->
  <g transform="translate(45, 60)">
    <!-- Screen shadow -->
    <rect x="-3" y="-3" width="70" height="85" rx="8" fill="#121418" opacity="0.5"/>
    <!-- Screen body -->
    <rect x="0" y="0" width="64" height="80" rx="6" fill="#2B313D" stroke="#3E4553" stroke-width="2"/>
    <!-- Screen content area (Digital photo) -->
    <rect x="6" y="8" width="52" height="46" rx="4" fill="#3D4654"/>
    <!-- Abstract item on screen (glowing vibrant color) -->
    <circle cx="32" cy="31" r="16" fill="#FF79C6" opacity="0.8"/>
    <!-- Screen UI lines -->
    <rect x="8" y="60" width="30" height="4" rx="2" fill="#525D70"/>
    <rect x="8" y="68" width="18" height="4" rx="2" fill="#3E4553"/>
  </g>

  <!-- Transformation / Comparison Arrow -->
  <g transform="translate(113, 92)">
    <path d="M 0 12 L 14 12 M 10 7 L 15 12 L 10 17" stroke="#6272A4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The "实物" (The Actual Physical Box / Real Object with vivid, tangible form and high-contrast accent) -->
  <g transform="translate(133, 50)">
    <!-- Package/Box Shadow -->
    <ellipse cx="37" cy="95" rx="28" ry="8" fill="#121418" opacity="0.7"/>
    
    <!-- Box Back/Top Flaps (Open/Dimensional) -->
    <path d="M 12 25 L 37 12 L 62 25 L 37 38 Z" fill="#E69138"/>

    <!-- Box Main Body -->
    <path d="M 12 28 L 37 41 L 62 28 L 62 78 L 37 92 L 12 78 Z" fill="#F39C12"/>
    
    <!-- Box Front Split (3D depth) -->
    <path d="M 37 41 L 37 92" stroke="#D68910" stroke-width="2"/>

    <!-- Ribbon / Details on Real Object -->
    <path d="M 37 41 L 37 92" stroke="#FFF" stroke-width="4" stroke-opacity="0.3"/>
    <path d="M 12 53 L 37 66 L 62 53" stroke="#D68910" stroke-width="2" fill="none"/>

    <!-- Star/Quality Badge highlighting "Real / Authentic" -->
    <circle cx="37" cy="62" r="10" fill="#FFD700"/>
    <path d="M 37 56 L 38.5 59.5 L 42 60 L 39.5 62.5 L 40 66 L 37 64 L 34 66 L 34.5 62.5 L 32 60 L 35.5 59.5 Z" fill="#B38600"/>
  </g>

  <!-- Ambient UI Elements (Modern Flat Aesthetic, No Text) -->
  <!-- Subtle decorative dots -->
  <circle cx="30" cy="40" r="3" fill="#3E4553"/>
  <circle cx="210" cy="45" r="2" fill="#3E4553"/>
  <circle cx="200" cy="190" r="3.5" fill="#3E4553"/>
  <circle cx="45" cy="180" r="2" fill="#3E4553"/>

  <!-- Base platform line representing tangible reality -->
  <path d="M 40 170 L 200 170" stroke="#2B313D" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</svg>