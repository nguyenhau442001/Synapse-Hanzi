<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: subtle progression path -->
  <path d="M40 190 C 80 190, 100 130, 140 110 C 180 90, 190 70, 200 50" fill="none" stroke="#262B35" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Progression Metaphor: Step-by-step growth/causality culminating smoothly in a natural outcome -->
  <!-- Step 1: Small foundation / effort -->
  <g transform="translate(45, 140)">
    <rect x="0" y="20" width="30" height="30" rx="6" fill="#2D3748"/>
    <!-- Small sprout -->
    <path d="M15 20 C 15 10, 20 5, 25 5 C 25 12, 20 15, 15 20 Z" fill="#38B2AC"/>
    <path d="M15 20 C 15 12, 10 8, 5 10 C 8 16, 12 18, 15 20 Z" fill="#319795"/>
    <line x1="15" y1="20" x2="15" y2="25" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Connecting smooth curve / arrow representing natural flow -->
  <path d="M85 150 C 105 145, 115 130, 125 110" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="127,105 121,112 126,114" fill="#4A5568"/>

  <!-- Step 2: Intermediate progression -->
  <g transform="translate(105, 95)">
    <rect x="0" y="30" width="36" height="36" rx="8" fill="#323F4B"/>
    <!-- Growing plant / stronger stem -->
    <rect x="16" y="15" width="4" height="20" rx="2" fill="#4FD1C5"/>
    <circle cx="18" cy="12" r="7" fill="#38B2AC"/>
    <circle cx="10" cy="18" r="5" fill="#319795"/>
    <circle cx="26" cy="18" r="5" fill="#319795"/>
  </g>

  <!-- Connecting smooth curve 2 -->
  <path d="M150 105 C 165 95, 175 80, 185 65" fill="none" stroke="#ECC94B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2"/>
  <polygon points="189,61 181,64 185,69" fill="#ECC94B"/>

  <!-- Final Outcome: "自然而然" (Blooming naturally as a result of consistent accumulation) -->
  <g transform="translate(165, 40)">
    <!-- Base platform -->
    <rect x="-5" y="65" width="55" height="10" rx="4" fill="#2D3748"/>
    
    <!-- Full-bloom flower / flourishing natural result (accent color: gold/orange) -->
    <!-- Stem -->
    <path d="M22 65 C 22 45, 22 35, 22 25" fill="none" stroke="#48BB78" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <path d="M22 45 C 12 43, 8 35, 12 30 C 16 28, 20 38, 22 45 Z" fill="#38A169"/>
    <path d="M22 40 C 32 38, 36 30, 32 25 C 28 23, 24 33, 22 40 Z" fill="#38A169"/>

    <!-- Blossoming Petals (Harmonious, effortless growth) -->
    <g transform="translate(22, 22)">
      <circle cx="0" cy="-14" r="8" fill="#F6AD55"/>
      <circle cx="12" cy="-7" r="8" fill="#ED8936"/>
      <circle cx="12" cy="7" r="8" fill="#F6AD55"/>
      <circle cx="0" cy="14" r="8" fill="#ED8936"/>
      <circle cx="-12" cy="7" r="8" fill="#F6AD55"/>
      <circle cx="-12" cy="-7" r="8" fill="#ED8936"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="7" fill="#ECC94B"/>
    </g>
  </g>

  <!-- Subtle ambient particles representing smooth, organic progression -->
  <circle cx="70" cy="95" r="2.5" fill="#4A5568" opacity="0.6"/>
  <circle cx="90" cy="75" r="2" fill="#ECC94B" opacity="0.4"/>
  <circle cx="150" cy="140" r="3" fill="#38B2AC" opacity="0.5"/>
  <circle cx="195" cy="130" r="2" fill="#4A5568" opacity="0.8"/>
  <circle cx="140" cy="45" r="2.5" fill="#F6AD55" opacity="0.5"/>
</svg>