<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Bank Card -->
  <rect x="70" y="80" width="100" height="64" rx="6" fill="#2D343E" stroke="#FFB84D" stroke-width="2"/>
  <rect x="80" y="95" width="20" height="14" rx="2" fill="#FFB84D"/>
  <rect x="80" y="115" width="60" height="4" rx="2" fill="#4A5568"/>
  <rect x="80" y="125" width="40" height="4" rx="2" fill="#4A5568"/>
  
  <!-- Activation Spark/Pulse -->
  <circle cx="170" cy="80" r="8" fill="#FFB84D"/>
  <path d="M170 65 L170 55 M170 95 L170 105 M155 80 L145 80 M185 80 L195 80" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Hand holding phone performing authentication -->
  <path d="M130 140 L160 140 L155 180 L125 180 Z" fill="#3B82F6"/>
  <rect x="125" y="145" width="35" height="50" rx="4" fill="#2D343E" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="142.5" cy="175" r="3" fill="#3B82F6"/>
  
  <!-- Checkmark indicating success -->
  <path d="M145 155 L148 158 L154 152" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>