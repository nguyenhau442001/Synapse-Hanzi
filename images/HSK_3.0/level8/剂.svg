<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Glow effect for the medicinal dose / heart stimulant -->
  <circle cx="120" cy="115" r="55" fill="#3B82F6" opacity="0.15"/>
  <circle cx="120" cy="115" r="40" fill="#3B82F6" opacity="0.25"/>

  <!-- Medical Vial / Dose Container (剂 - Medicine dose) -->
  <g transform="translate(0, 5)">
    <!-- Vial Body (Glass) -->
    <rect x="96" y="85" width="48" height="70" rx="6" fill="#22D3EE" opacity="0.2" stroke="#22D3EE" stroke-width="3"/>
    
    <!-- Liquid Content Inside Vial -->
    <path d="M 99 110 L 141 110 L 141 150 Q 141 152 139 152 L 101 152 Q 99 152 99 150 Z" fill="#38BDF8"/>
    <circle cx="120" cy="130" r="8" fill="#F43F5E" opacity="0.8"/>

    <!-- Measurement markings on vial -->
    <line x1="128" y1="120" x2="135" y2="120" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    <line x1="128" y1="130" x2="135" y2="130" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    <line x1="128" y1="140" x2="135" y2="140" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

    <!-- Vial Neck -->
    <rect x="108" y="70" width="24" height="15" rx="2" fill="#E2E8F0" opacity="0.9"/>
    
    <!-- Vial Cap / Seal -->
    <rect x="104" y="62" width="32" height="10" rx="3" fill="#F43F5E"/>
  </g>

  <!-- Dynamic Energy / Vitality Sparks (Representing "强心针" / uplifting dose) -->
  <g fill="#FBBF24">
    <!-- Top left spark -->
    <path d="M 65 75 Q 70 75 70 70 Q 70 75 75 75 Q 70 75 70 80 Q 70 75 65 75 Z"/>
    <!-- Top right spark -->
    <path d="M 175 75 Q 180 75 180 70 Q 180 75 185 75 Q 180 75 180 80 Q 180 75 175 75 Z"/>
    <!-- Mid left spark -->
    <path d="M 50 120 Q 55 120 55 115 Q 55 120 60 120 Q 55 120 55 125 Q 55 120 50 120 Z"/>
    <!-- Mid right spark -->
    <path d="M 190 120 Q 195 120 195 115 Q 195 120 200 120 Q 195 120 195 125 Q 195 120 190 120 Z"/>
  </g>

  <!-- Base / Platform -->
  <ellipse cx="120" cy="185" rx="45" ry="8" fill="#0F172A"/>
</svg>