<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Genuine Item (Left) -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#3B82F6"/>
    <rect x="5" y="10" width="30" height="5" rx="1" fill="#FFFFFF"/>
    <rect x="5" y="20" width="30" height="5" rx="1" fill="#FFFFFF"/>
    <rect x="5" y="30" width="20" height="5" rx="1" fill="#FFFFFF"/>
    <circle cx="35" cy="45" r="5" fill="#F59E0B"/>
  </g>

  <!-- Counterfeit Item (Right) -->
  <g transform="translate(140, 80)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#EF4444"/>
    <rect x="5" y="10" width="30" height="5" rx="1" fill="#FFFFFF"/>
    <rect x="5" y="20" width="30" height="5" rx="1" fill="#FFFFFF"/>
    <rect x="5" y="30" width="20" height="5" rx="1" fill="#FFFFFF"/>
    <path d="M30 40 L40 50 M40 40 L30 50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass focusing on the counterfeit -->
  <g transform="translate(130, 70)">
    <circle cx="15" cy="15" r="15" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <line x1="25" y1="25" x2="40" y2="40" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>