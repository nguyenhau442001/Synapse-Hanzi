<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Network Node Representation -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="6" fill="#FF9F1C"/>
    <circle cx="80" cy="20" r="6" fill="#FF9F1C"/>
    <circle cx="50" cy="70" r="6" fill="#FF9F1C"/>
    <path d="M26 20 L74 20 M23 25 L47 65 M77 25 L53 65" stroke="#4A5568" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Hacker Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 20 L-20 60 L20 60 L20 20 Z" fill="#718096"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#E2E8F0"/>
    <!-- Hoodie -->
    <path d="M-22 -10 L-22 20 L22 20 L22 -10 A 22 22 0 0 0 -22 -10" fill="#4A5568"/>
    <!-- Action: Hand interacting with digital stream -->
    <path d="M20 30 L45 10" stroke="#FF9F1C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="10" r="5" fill="#FF9F1C"/>
    <!-- Motion lines -->
    <path d="M55 5 L65 -5 M58 15 L70 10" stroke="#FF9F1C" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Targeted Data Stream -->
  <g transform="translate(160, 60)">
    <rect x="0" y="0" width="30" height="40" rx="4" fill="#2D3748" stroke="#FF9F1C" stroke-width="2"/>
    <rect x="5" y="10" width="20" height="4" fill="#FF9F1C"/>
    <rect x="5" y="20" width="20" height="4" fill="#FF9F1C"/>
  </g>
</svg>