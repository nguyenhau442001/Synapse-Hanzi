<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Grid / Technical background patterns representing scope/scale -->
  <g opacity="0.15">
    <circle cx="120" cy="130" r="90" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="120" cy="130" r="60" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="120" y1="30" x2="120" y2="230" stroke="#60A5FA" stroke-width="0.5"/>
    <line x1="20" y1="130" x2="220" y2="130" stroke="#60A5FA" stroke-width="0.5"/>
  </g>

  <!-- Visual Metaphor: Escalation & Expansion (Local to Global / National to Worldwide scope via telescoping/zooming layers) -->
  
  <!-- Level 1: Base / Local Node (Inner circle / Foundation) -->
  <g transform="translate(120, 155)">
    <!-- Base platform -->
    <ellipse cx="0" cy="15" rx="35" ry="12" fill="#334155"/>
    <!-- National/Inner sphere -->
    <circle cx="0" cy="0" r="22" fill="#3B82F6" opacity="0.3"/>
    <circle cx="0" cy="0" r="16" fill="#3B82F6"/>
    <!-- Focus node/pin point -->
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Escalation Connection Arcs (Showing transition from local to global, "thậm chí / cho đến") -->
  <g fill="none" stroke-linecap="round" stroke-width="2.5">
    <!-- Left expansion arc -->
    <path d="M 95 140 C 65 110, 60 70, 75 55" stroke="#F59E0B" stroke-dasharray="4 4"/>
    <path d="M 75 55 L 82 58 M 75 55 L 72 63" stroke="#F59E0B"/>

    <!-- Right expansion arc (The extreme/ultimate leap: 乃至) -->
    <path d="M 145 140 C 175 110, 180 70, 165 55" stroke="#F59E0B" stroke-width="3"/>
    <path d="M 165 55 L 158 58 M 165 55 L 168 63" stroke="#F59E0B"/>
  </g>

  <!-- Level 2: Extreme / Global Outer Scope (Representing 全世界 - Worldwide) -->
  <g transform="translate(120, 55)">
    <!-- Outer expansive ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>
    
    <!-- Central glowing focus representing the peak discovery/attention -->
    <circle cx="0" cy="0" r="20" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Radiating beams of attention/escalation -->
    <path d="M 0 -10 L 0 -2" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-14" r="3" fill="#F59E0B"/>
    <circle cx="-12" cy="6" r="2.5" fill="#F59E0B"/>
    <circle cx="12" cy="6" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Floating magnitude markers emphasizing progression/escalation -->
  <g transform="translate(0, 0)">
    <!-- Small step indicator -->
    <rect x="35" y="165" width="28" height="16" rx="4" fill="#334155"/>
    <circle cx="43" cy="173" r="3" fill="#60A5FA"/>
    <line x1="50" y1="173" x2="57" y2="173" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <!-- Escalation arrow pointing upward -->
    <path d="M 120 100 L 120 80 M 115 85 L 120 78 L 125 85" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ultimate/Extreme step indicator (Highlighting 乃至) -->
    <rect x="177" y="45" width="28" height="16" rx="4" fill="#78350F" opacity="0.8"/>
    <circle cx="185" cy="53" r="3" fill="#F59E0B"/>
    <line x1="192" y1="53" x2="199" y2="53" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>