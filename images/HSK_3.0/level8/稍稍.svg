<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "稍稍" (a slight degree/a little bit) through a physical scale: 
       A hand gently adjusting a small, delicate balance weight on a scale, 
       showing a tiny, precise, and intentional shift. -->
  
  <!-- Scale Base -->
  <path d="M80 190 L160 190 L150 210 L90 210 Z" fill="#4A5568"/>
  <rect x="115" y="100" width="10" height="90" fill="#718096"/>
  
  <!-- Scale Beam -->
  <rect x="60" y="90" width="120" height="6" rx="3" fill="#A0AEC0"/>
  
  <!-- Left side: The weight being adjusted -->
  <circle cx="80" cy="115" r="12" fill="#F6AD55"/>
  
  <!-- Right side: The object being measured (a small leaf) -->
  <path d="M160 115 C 160 105, 175 100, 175 115 C 175 130, 160 125, 160 115" fill="#68D391"/>
  
  <!-- Hand adjusting the weight -->
  <g transform="translate(65, 120)">
    <path d="M10 10 C 5 20, 5 30, 15 35 L 25 35 C 35 30, 35 20, 30 10 Z" fill="#D6BCFA"/>
    <rect x="18" y="35" width="4" height="15" fill="#D6BCFA"/>
    <rect x="24" y="35" width="4" height="12" fill="#D6BCFA"/>
  </g>
  
  <!-- Indicator needle showing a slight tilt -->
  <path d="M120 90 L115 60" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
</svg>