<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: Overflowing Sugar & Salt Jar (Representing 过量 / Excess) -->
  <g transform="translate(0, 5)">
    <!-- Base Glow/Shadow -->
    <ellipse cx="120" cy="205" rx="55" ry="12" fill="#111318"/>

    <!-- Glass Jar Body -->
    <path d="M 85,90 L 155,90 L 165,160 C 165,185 150,195 120,195 C 90,195 75,185 75,160 Z" fill="#2A3242" opacity="0.6"/>
    
    <!-- Jar Contents (Granular/Crystallized Overload) -->
    <!-- Sugar/Salt Level inside jar -->
    <path d="M 80,115 L 160,115 L 165,160 C 165,185 150,195 120,195 C 90,195 75,185 75,160 Z" fill="#E2E8F0"/>
    
    <!-- Overflowing pile on top (Spilling over edges - core meaning of 过量) -->
    <path d="M 75,90 C 75,90 90,65 120,65 C 150,65 165,90 165,90 Z" fill="#F8FAFC"/>
    
    <!-- Spilling stream left -->
    <path d="M 78,92 C 60,105 50,120 45,135 C 55,140 65,130 75,110 Z" fill="#E2E8F0" opacity="0.9"/>
    <!-- Spilling mound left base -->
    <ellipse cx="48" cy="140" rx="12" ry="6" fill="#CBD5E1"/>

    <!-- Spilling stream right -->
    <path d="M 162,92 C 180,105 190,120 195,135 C 185,140 175,130 165,110 Z" fill="#CBD5E1" opacity="0.9"/>
    <!-- Spilling mound right base -->
    <ellipse cx="192" cy="140" rx="12" ry="6" fill="#94A3B8"/>

    <!-- Jar Rim / Neck -->
    <path d="M 80,85 L 160,85 L 160,95 L 80,95 Z" fill="#475569"/>

    <!-- Jar Lid (Off-center/Tilted to show overflowing state) -->
    <g transform="translate(130, 52) rotate(22)">
      <rect x="-30" y="-10" width="60" height="14" rx="3" fill="#F59E0B"/>
      <rect x="-24" y="-16" width="48" height="6" rx="2" fill="#D97706"/>
    </g>

    <!-- Glass Highlights -->
    <path d="M 90,105 L 95,175" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
    <path d="M 100,100 L 102,150" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

    <!-- Warning / Excess Accent Indicator (Subtle high-contrast glowing particles/sparks) -->
    <circle cx="120" cy="45" r="3" fill="#F59E0B"/>
    <circle cx="102" cy="48" r="1.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="138" cy="48" r="1.5" fill="#F59E0B" opacity="0.8"/>
    <path d="M 120,32 L 120,38 M 117,35 L 123,35" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>