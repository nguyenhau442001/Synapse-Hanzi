<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="130" r="70" fill="#0D2B3E" opacity="0.4"/>

  <!-- Soil / Underground layer representing the "root" (根) -->
  <path d="M40 165 C70 155, 170 155, 200 165 L210 200 C170 215, 70 215, 30 200 Z" fill="#242B38"/>
  <path d="M50 175 C80 168, 160 168, 190 175 L195 195 C155 205, 85 205, 45 195 Z" fill="#18202A"/>

  <!-- Underground diseased/tangled roots being pulled out (Tearing out the root / 彻底根治) -->
  <path d="M110 170 C100 190, 80 195, 60 210" fill="none" stroke="#E05656" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M125 170 C135 195, 155 200, 170 215" fill="none" stroke="#E05656" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M118 172 C115 190, 105 200, 115 215" fill="none" stroke="#E05656" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Motion lines indicating extraction / thorough removal -->
  <path d="M100 145 C95 130, 95 115, 100 100" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M140 145 C145 130, 145 115, 140 100" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- Arrow indicators of complete eradication upwards -->
  <path d="M120 150 L120 105" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 113 L120 101 L128 113" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Healthy vibrant sprout growing above ground (Result of cure) -->
  <path d="M120 165 C120 145, 120 130, 120 110" fill="none" stroke="#2EC4B6" stroke-width="4" stroke-linecap="round"/>
  <!-- Left leaf -->
  <path d="M120 130 C105 125, 95 135, 100 145 C108 147, 116 140, 120 130 Z" fill="#2EC4B6"/>
  <!-- Right leaf -->
  <path d="M120 120 C135 115, 145 125, 140 135 C132 137, 124 130, 120 120 Z" fill="#2EC4B6"/>

  <!-- Human Hands (Medical Practitioner / Action of eradicating the root) -->
  <!-- Left hand -->
  <path d="M75 110 C85 105, 100 105, 110 115 C115 120, 115 125, 110 130 C105 132, 95 130, 85 125 Z" fill="#E29578"/>
  <path d="M90 107 L85 95 C82 92, 77 94, 78 98 L83 110" fill="#E29578"/>
  <path d="M100 110 L100 96 C100 92, 106 92, 106 96 L105 112" fill="#E29578"/>

  <!-- Right hand -->
  <path d="M165 110 C155 105, 140 105, 130 115 C125 120, 125 125, 130 130 C135 132, 145 130, 155 125 Z" fill="#E29578"/>
  <path d="M150 107 L155 95 C158 92, 163 94, 162 98 L157 110" fill="#E29578"/>
  <path d="M140 110 L140 96 C140 92, 134 92, 134 96 L135 112" fill="#E29578"/>

  <!-- Sleeves / arms connecting to hands -->
  <path d="M60 90 L80 105 L70 125 L50 110 Z" fill="#4A90E2"/>
  <path d="M180 90 L160 105 L170 125 L190 110 Z" fill="#4A90E2"/>

  <!-- Sparkles / Success indicators -->
  <g fill="#FFB703">
    <circle cx="85" cy="80" r="2"/>
    <circle cx="155" cy="80" r="2"/>
    <path d="M120 70 L121.5 74.5 L126 76 L121.5 77.5 L120 82 L118.5 77.5 L114 76 L118.5 74.5 Z"/>
    <path d="M95 90 L95.8 92.2 L98 93 L95.8 93.8 L95 96 L94.2 93.8 L92 93 L94.2 92.2 Z" opacity="0.7"/>
    <path d="M145 90 L145.8 92.2 L148 93 L145.8 93.8 L145 96 L144.2 93.8 L142 93 L144.2 92.2 Z" opacity="0.7"/>
  </g>

</svg>