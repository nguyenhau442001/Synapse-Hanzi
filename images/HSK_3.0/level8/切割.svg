<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Steel Plate -->
  <rect x="60" y="110" width="120" height="40" rx="2" fill="#7F8C8D"/>
  <rect x="60" y="110" width="120" height="40" rx="2" fill="none" stroke="#BDC3C7" stroke-width="1"/>
  
  <!-- Laser Beam -->
  <line x1="120" y1="60" x2="120" y2="110" stroke="#FF9F43" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="110" r="3" fill="#FF9F43"/>
  
  <!-- Laser Head -->
  <rect x="105" y="40" width="30" height="20" rx="2" fill="#3498DB"/>
  <rect x="110" y="35" width="20" height="5" rx="1" fill="#2980B9"/>
  
  <!-- Motion Lines -->
  <path d="M125 110 L135 100 M125 120 L135 110 M125 130 L135 120" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Separated Plate Piece -->
  <rect x="122" y="110" width="58" height="40" rx="2" fill="#95A5A6"/>
  
  <!-- Worker's Hand (Simplified) -->
  <path d="M80 160 C80 150, 90 145, 100 145 L110 145 C120 145, 130 150, 130 160" fill="#E67E22"/>
  <rect x="80" y="160" width="50" height="10" rx="2" fill="#D35400"/>
</svg>