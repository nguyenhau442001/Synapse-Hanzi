  <line x1="95" y1="100" x2="145" y2="100" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="120" x2="145" y2="120" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="140" x2="145" y2="140" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="160" x2="145" y2="160" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Checkboxes -->
  <rect x="85" y="75" width="6" height="6" rx="1" fill="#E67E22"/>
  <rect x="85" y="95" width="6" height="6" rx="1" fill="#E67E22"/>
  <rect x="85" y="115" width="6" height="6" rx="1" fill="#E67E22"/>
