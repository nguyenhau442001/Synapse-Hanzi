<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    {/* Background Blackboard Structure */}
    <rect x="24" y="28" width="192" height="136" rx="6" fill="#242936" stroke="#374151" stroke-width="2"/>
    <rect x="30" y="34" width="180" height="124" fill="#1E232F"/>
    
    {/* Geometric Analysis Drawings on Blackboard (解析 visual context) */}
    <g transform="translate(45, 45)" opacity="0.85">
      {/* Coordinate axes */}
      <line x1="15" y1="85" x2="105" y2="85" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="15" y1="85" x2="15" y2="15" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="3,3"/>
      
      {/* Circle / Triangle breakdown */}
      <circle cx="65" cy="50" r="30" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
      <polygon points="35,70 65,20 95,70" fill="none" stroke="#F59E0B" stroke-width="2"/>
      
      {/* Breakdown analytical callouts / lines */}
      <line x1="65" y1="20" x2="120" y2="30" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="120" cy="30" r="3" fill="#F43F5E"/>
      
      <line x1="95" y1="70" x2="135" y2="70" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="135" cy="70" r="3" fill="#F43F5E"/>
      
      <line x1="35" y1="70" x2="105" y2="100" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="105" cy="100" r="3" fill="#F43F5E"/>
    </g>

    {/* Magnifying Glass / Analysis Instrument (Physical Object Objectifying "解析") */}
    <g transform="translate(130, 75)">
      {/* Outer glow/lens effect */}
      <circle cx="45" cy="45" r="38" fill="#111827" fill-opacity="0.9" stroke="#3B82F6" stroke-width="3"/>
      <circle cx="45" cy="45" r="34" fill="#1E3A8A" fill-opacity="0.3"/>
      
      {/* Highlight inside lens */}
      <path d="M 23 30 A 25 25 0 0 1 67 30" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      
      {/* Magnified detailed geometric intersection inside lens */}
      <g transform="translate(45, 45)">
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#60A5FA" stroke-width="1"/>
        <line x1="0" y1="-20" x2="0" y2="20" stroke="#60A5FA" stroke-width="1"/>
        <path d="M-15 15 L 0 -15 L 15 15 Z" fill="none" stroke="#F59E0B" stroke-width="2"/>
        <circle cx="0" cy="-15" r="3" fill="#EF4444"/>
        <circle cx="-15" cy="15" r="3" fill="#EF4444"/>
        <circle cx="15" cy="15" r="3" fill="#EF4444"/>
      </g>
      
      {/* Magnifying glass handle */}
      <path d="M 18 68 L -10 96" stroke="#4B5563" stroke-width="10" stroke-linecap="round"/>
      <path d="M 18 68 L -10 96" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
      <rect x="-16" y="90" width="12" height="12" rx="3" transform="rotate(-45 -10 96)" fill="#1F2937"/>
    </g>

    {/* Blackboard Tray at the bottom */}
    <rect x="20" y="164" width="200" height="6" rx="3" fill="#4B5563"/>
    
    {/* Chalks on tray */}
    <rect x="40" y="159" width="16" height="5" rx="2" fill="#F3F4F6"/>
    <rect x="62" y="159" width="12" height="5" rx="2" fill="#F59E0B"/>
  </g>
</svg>