<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Leg structure representing the knee joint -->
  <g transform="translate(120, 120)">
    <!-- Thigh bone -->
    <path d="M-15,-60 L-15,0 L15,0 L15,-60 Z" fill="#7D8590" rx="8"/>
    <!-- Shin bone -->
    <path d="M-12,20 L-12,80 L12,80 L12,20 Z" fill="#7D8590" rx="8"/>
    
    <!-- Knee Joint (The focus) -->
    <circle cx="0" cy="10" r="28" fill="#F39C12" stroke="#1A1D24" stroke-width="4"/>
    <circle cx="0" cy="10" r="18" fill="#E67E22"/>
    
    <!-- Highlight on the joint -->
    <path d="M-12,-8 A20,20 0 0,1 12,-8" fill="none" stroke="#FDCB6E" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Subtle warmth indicator (representing care/protection from cold) -->
    <path d="M-35,-20 L-25,-30 M35,-20 L25,-30 M0,-40 L0,-50" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  </g>
</svg>