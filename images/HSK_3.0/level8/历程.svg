<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for "历程" (Journey / Process / Historical Path) -->
  <!-- We visualize this as a tangible, physical architectural milestone marker combined with a winding path/road, representing a historical journey/process -->

  <!-- Winding Path representing the Journey/Process (chặng đường, hành trình) -->
  <path d="M50 185 C 80 185, 90 145, 120 145 C 150 145, 160 100, 190 100" fill="none" stroke="#2A2F3D" stroke-width="16" stroke-linecap="round"/>
  <path d="M50 185 C 80 185, 90 145, 120 145 C 150 145, 160 100, 190 100" fill="none" stroke="#F39C12" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 10"/>

  <!-- Milestone 1: Past / Origin (Small house / Fisher village reference) -->
  <g transform="translate(45, 140)">
    <rect x="0" y="15" width="24" height="20" fill="#34495E" rx="2"/>
    <polygon points="12,2 28,15 -4,15" fill="#E67E22"/>
    <rect x="8" y="23" width="8" height="12" fill="#1A1D24"/>
  </g>

  <!-- Milestone 2: Transition / Growth (Mid-point pavilion/structure) -->
  <g transform="translate(110, 95)">
    <rect x="-2" y="15" width="28" height="25" fill="#2C3E50" rx="2"/>
    <path d="M -6 15 L 14 3 L 34 15 Z" fill="#E67E22"/>
    <rect x="8" y="25" width="10" height="15" fill="#1A1D24"/>
    <circle cx="13" cy="8" r="3" fill="#F1C40F"/>
  </g>

  <!-- Milestone 3: Modern Metropolis / Pinnacle (Main Physical Monument representing the destination of the journey) -->
  <g transform="translate(170, 45)">
    <!-- Tall Modern Structure / Skyscraper representation -->
    <rect x="5" y="10" width="20" height="75" fill="#3498DB" rx="3"/>
    <rect x="2" y="80" width="26" height="6" fill="#BDC3C7" rx="1"/>
    <!-- Glowing architectural spire -->
    <polygon points="15,0 19,10 11,10" fill="#F1C40F"/>
    <line x1="15" y1="0" x2="15" y2="-8" stroke="#F1C40F" stroke-width="2"/>
    <!-- Windows pattern -->
    <rect x="9" y="18" width="4" height="6" fill="#1A1D24" rx="1"/>
    <rect x="17" y="18" width="4" height="6" fill="#1A1D24" rx="1"/>
    <rect x="9" y="30" width="4" height="6" fill="#1A1D24" rx="1"/>
    <rect x="17" y="30" width="4" height="6" fill="#1A1D24" rx="1"/>
    <rect x="9" y="42" width="4" height="6" fill="#1A1D24" rx="1"/>
    <rect x="17" y="42" width="4" height="6" fill="#1A1D24" rx="1"/>
    <rect x="9" y="54" width="4" height="6" fill="#1A1D24" rx="1"/>
    <rect x="17" y="54" width="4" height="6" fill="#1A1D24" rx="1"/>
  </g>

  <!-- Decorative directional indicator / forward motion -->
  <circle cx="190" cy="100" r="5" fill="#F39C12"/>
</svg>