<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stylized Globe representing the world -->
  <circle cx="120" cy="120" r="70" fill="#2C3E50" stroke="#34495E" stroke-width="4"/>
  
  <!-- Stylized Landmasses -->
  <path d="M80 90 Q100 70 120 90 T160 90 Q170 110 150 130 T110 140 T80 90" fill="#3498DB"/>
  <path d="M140 150 Q160 140 180 150 T170 170 T140 160" fill="#3498DB"/>
  
  <!-- Converging paths/lines representing people coming from all directions -->
  <g stroke="#F1C40F" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="20" x2="120" y2="80"/>
    <line x1="120" y1="220" x2="120" y2="160"/>
    <line x1="20" y1="120" x2="80" y2="120"/>
    <line x1="220" y1="120" x2="160" y2="120"/>
    <line x1="50" y1="50" x2="95" y2="95"/>
    <line x1="190" y1="190" x2="145" y2="145"/>
  </g>
  
  <!-- Central gathering point (University/Academic building silhouette) -->
  <path d="M105 135 L135 135 L135 110 L120 95 L105 110 Z" fill="#E67E22"/>
  <rect x="115" y="115" width="10" height="20" fill="#D35400"/>
  
  <!-- Stylized figures converging -->
  <circle cx="120" cy="120" r="8" fill="#F1C40F"/>
  <circle cx="90" cy="90" r="6" fill="#BDC3C7"/>
  <circle cx="150" cy="90" r="6" fill="#BDC3C7"/>
  <circle cx="90" cy="150" r="6" fill="#BDC3C7"/>
  <circle cx="150" cy="150" r="6" fill="#BDC3C7"/>
</svg>