<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative depth elements representing mountains/terrain -->
  <path d="M 20 180 L 80 120 L 140 160 L 200 100 L 220 120 L 220 200 L 20 200 Z" fill="#242933" opacity="0.6"/>
  <path d="M 0 160 L 50 110 L 110 150 L 170 90 L 240 140 L 240 200 L 0 200 Z" fill="#2C3340" opacity="0.8"/>

  <!-- Mountain body (Cross-section view showing the tunnel piercing through) -->
  <path d="M 15 150 Q 80 50 125 50 Q 180 50 225 150 Z" fill="#3A4252"/>
  
  <!-- Mountain highlight top ridge -->
  <path d="M 125 50 Q 180 50 225 150 L 180 150 Q 130 75 125 50 Z" fill="#475266" opacity="0.4"/>

  <!-- Mountain Interior / Cutaway for Tunnel (贯通 - Through and Connected) -->
  <!-- Tunnel opening left & right and inner light -->
  <!-- Inside tunnel glow path -->
  <path d="M 45 135 L 195 135" stroke="#FFB703" stroke-width="16" stroke-linecap="round" opacity="0.15"/>

  <!-- Mountain Core cutaway floor -->
  <rect x="40" y="130" width="160" height="15" fill="#1E232D"/>

  <!-- High-Speed Train Tracks piercing completely through -->
  <rect x="30" y="138" width="180" height="4" fill="#606A7D"/>
  <line x1="40" y1="138" x2="200" y2="138" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,6"/>

  <!-- Left Tunnel Portal -->
  <path d="M 40 140 L 40 110 Q 55 100 70 110 L 70 140 Z" fill="#1A1D24"/>
  <path d="M 37 142 L 37 108 Q 55 96 73 108 L 73 142 Z" fill="none" stroke="#606A7D" stroke-width="3"/>

  <!-- Right Tunnel Portal -->
  <path d="M 170 140 L 170 110 Q 185 100 200 110 L 200 140 Z" fill="#1A1D24"/>
  <path d="M 167 142 L 167 108 Q 185 96 203 108 L 203 142 Z" fill="none" stroke="#606A7D" stroke-width="3"/>

  <!-- Modern Bullet Train (representing connectivity and successful breakthrough) shooting out/through -->
  <!-- Train body streamlined -->
  <g transform="translate(145, 118)">
    <!-- Train Head -->
    <path d="M 0 16 L 35 16 C 42 16 48 13 52 8 L 56 4 C 58 2 56 0 53 0 L 0 0 Z" fill="#FFB703"/>
    <!-- Windshield -->
    <path d="M 32 4 L 46 4 C 48 4 50 6 48 8 C 44 11 38 12 32 12 Z" fill="#1A1D24"/>
    <!-- Body stripe -->
    <rect x="0" y="7" width="35" height="3" fill="#FB8500"/>
    <!-- Wheels/Underframe -->
    <rect x="8" y="16" width="10" height="3" fill="#606A7D"/>
    <rect x="30" y="16" width="10" height="3" fill="#606A7D"/>
  </g>

  <!-- Speed / Connection Light Rays emerging from the center/tunnel -->
  <line x1="120" y1="120" x2="100" y2="105" stroke="#FFB703" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="130" y1="125" x2="125" y2="100" stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="110" y1="130" x2="90" y2="135" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Success / Connection indicator sparks (Golden accents) -->
  <circle cx="125" cy="85" r="3" fill="#FFB703"/>
  <circle cx="140" cy="75" r="2" fill="#FB8500"/>
  <circle cx="110" cy="78" r="1.5" fill="#FFB703"/>
  
  <!-- Focus highlight glowing from the center exit -->
  <circle cx="185" cy="125" r="18" fill="#FFB703" opacity="0.2" filter="blur(4px)"/>
  <circle cx="55" cy="125" r="18" fill="#FFB703" opacity="0.2" filter="blur(4px)"/>

</svg>