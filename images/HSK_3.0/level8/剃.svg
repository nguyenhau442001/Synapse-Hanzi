<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle lighting effect -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Hair shaving / razor concept visualization (Noun/Object focus: Modern electric razor / shaving action) -->
  <!-- Sleek Modern Electric Shaver (Central Object representing "剃" - cạo râu, tóc) -->
  <g transform="translate(120, 120)">
    
    <!-- Floating speed lines / precision motion lines -->
    <path d="M-55 -40 L-40 -30" stroke="#3E4553" stroke-width="3" stroke-linecap="round"/>
    <path d="M55 -40 L40 -30" stroke="#3E4553" stroke-width="3" stroke-linecap="round"/>
    <path d="M-60 0 L-45 0" stroke="#3E4553" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Shaver Body -->
    <rect x="-26" y="-35" width="52" height="90" rx="14" fill="#2E3646" stroke="#485368" stroke-width="2"/>
    
    <!-- Shaver Grip Detail (Internal groove) -->
    <rect x="-18" y="10" width="36" height="35" rx="6" fill="#232833"/>
    
    <!-- Power Button -->
    <circle cx="0" cy="-10" r="7" fill="#FF8C00"/>
    <path d="M0 -13 V-9" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Shaver Head / Foil Unit -->
    <path d="M-30 -55 H30 V-35 H-30 Z" fill="#3B4455" stroke="#56627A" stroke-width="2" rx="4"/>
    
    <!-- Cutting Blades / Foil Texture Details -->
    <line x1="-18" y1="-50" x2="-18" y2="-40" stroke="#8A9BB8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="-50" x2="-10" y2="-40" stroke="#8A9BB8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-2" y1="-50" x2="-2" y2="-40" stroke="#8A9BB8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-50" x2="6" y2="-40" stroke="#8A9BB8" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="-50" x2="14" y2="-40" stroke="#8A9BB8" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="-50" x2="22" y2="-40" stroke="#8A9BB8" stroke-width="2" stroke-linecap="round"/>

    <!-- Shaving action visualization: Falling hair strands cleanly cut -->
    <path d="M-35 -62 C-35 -70 -25 -75 -30 -85" fill="none" stroke="#FF8C00" stroke-width="3" stroke-linecap="round"/>
    <path d="M-20 -65 C-15 -75 -10 -80 -15 -90" fill="none" stroke="#FF8C00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 -65 C25 -75 20 -85 28 -92" fill="none" stroke="#FF8C00" stroke-width="3" stroke-linecap="round"/>
    <path d="M35 -60 C40 -70 45 -75 42 -85" fill="none" stroke="#FF8C00" stroke-width="2" stroke-linecap="round"/>

    <!-- Sparkle / Precision Indicator (Gold/Orange accent) -->
    <circle cx="45" cy="-25" r="3" fill="#FF8C00"/>
    <circle cx="-48" cy="-10" r="2" fill="#FF8C00" opacity="0.8"/>
  </g>
</svg>