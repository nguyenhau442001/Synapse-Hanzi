<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk/Study Surface -->
  <rect x="40" y="150" width="160" height="12" rx="4" fill="#343A46"/>
  
  <!-- Bookshelf Background -->
  <rect x="60" y="60" width="120" height="90" rx="4" fill="#252A34"/>
  <rect x="70" y="70" width="100" height="10" rx="2" fill="#343A46"/>
  <rect x="70" y="90" width="100" height="10" rx="2" fill="#343A46"/>
  <rect x="70" y="110" width="100" height="10" rx="2" fill="#343A46"/>
  <rect x="70" y="130" width="100" height="10" rx="2" fill="#343A46"/>
  
  <!-- Person diving into the study (The "一头扎进" action) -->
  <g transform="translate(120, 140)">
    <!-- Legs -->
    <rect x="-15" y="0" width="10" height="40" rx="3" fill="#FFB86C"/>
    <rect x="5" y="0" width="10" height="40" rx="3" fill="#FFB86C"/>
    
    <!-- Torso -->
    <rect x="-20" y="-40" width="40" height="40" rx="8" fill="#FFB86C"/>
    
    <!-- Head (Hidden/Entering the study) -->
    <circle cx="0" cy="-50" r="15" fill="#FFB86C"/>
    
    <!-- Book being held -->
    <rect x="-10" y="-60" width="20" height="25" rx="2" fill="#FF79C6"/>
  </g>
  
  <!-- Floor shadow -->
  <ellipse cx="120" cy="165" rx="50" ry="8" fill="#000000" opacity="0.2"/>
</svg>