<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Intersection Road Network Background -->
  <g opacity="0.3">
    <!-- Vertical Road -->
    <rect x="100" y="30" width="40" height="180" fill="#2A2F3B"/>
    <line x1="120" y1="30" x2="120" y2="210" stroke="#3E4556" stroke-width="2" stroke-dasharray="6,6"/>
    
    <!-- Horizontal Road -->
    <rect x="30" y="100" width="180" height="40" fill="#2A2F3B"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke="#3E4556" stroke-width="2" stroke-dasharray="6,6"/>
  </g>

  <!-- Physical Objects / Street Elements representing "交叉" (Crossing / Intersection) -->
  <g>
    <!-- Traffic Light Post (Top Right) -->
    <rect x="155" y="65" width="6" height="45" fill="#525B70" rx="3"/>
    <rect x="150" y="50" width="16" height="22" fill="#2A2F3B" rx="3"/>
    <circle cx="158" cy="56" r="3" fill="#E74C3C"/>
    <circle cx="158" cy="66" r="3" fill="#F1C40F"/>

    <!-- Traffic Light Post (Bottom Left) -->
    <rect x="79" y="130" width="6" height="45" fill="#525B70" rx="3"/>
    <rect x="74" y="168" width="16" height="22" fill="#2A2F3B" rx="3"/>
    <circle cx="82" cy="174" r="3" fill="#2ECC71"/>
    <circle cx="82" cy="184" r="3" fill="#F1C40F"/>

    <!-- Center Crosswalk / Zebra Crossing (Overlapping / Intersecting) -->
    <!-- Vertical zebra stripes -->
    <rect x="108" y="100" width="6" height="40" fill="#FFFFFF" opacity="0.8"/>
    <rect x="118" y="100" width="6" height="40" fill="#FFFFFF" opacity="0.8"/>
    <rect x="128" y="100" width="6" height="40" fill="#FFFFFF" opacity="0.8"/>

    <!-- Horizontal zebra stripes -->
    <rect x="100" y="108" width="40" height="6" fill="#FFFFFF" opacity="0.8"/>
    <rect x="100" y="118" width="40" height="6" fill="#FFFFFF" opacity="0.8"/>
    <rect x="100" y="128" width="40" height="6" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Dynamic Accent Overlay: The Exact Intersecting Paths (Gold/Orange for focus) -->
  <g>
    <!-- Diagonal intersecting vector arrows representing crossing flow -->
    <path d="M 75 75 L 165 165" stroke="#F39C12" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,4"/>
    <path d="M 165 75 L 75 165" stroke="#F39C12" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,4"/>

    <!-- Central Focus Intersection Node -->
    <circle cx="120" cy="120" r="16" fill="#1A1D24" stroke="#F39C12" stroke-width="4"/>
    <circle cx="120" cy="120" r="6" fill="#E67E22"/>
  </g>
</svg>