<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Tropical Rainforest Elements -->
  <path d="M60 200 C 60 160, 80 140, 100 140 C 120 140, 140 160, 140 200 Z" fill="#2D5A27"/>
  <path d="M120 200 C 120 150, 150 130, 180 130 C 210 130, 240 150, 240 200 Z" fill="#1E3D1A"/>
  
  <!-- Explorer Character -->
  <g transform="translate(100, 110)">
    <!-- Backpack -->
    <rect x="15" y="40" width="25" height="30" rx="4" fill="#D97706"/>
    <!-- Body -->
    <path d="M20 40 L40 40 L35 90 L25 90 Z" fill="#F59E0B"/>
    <!-- Head -->
    <circle cx="30" cy="30" r="12" fill="#FFD700"/>
    <!-- Hat -->
    <path d="M10 25 L50 25 L45 15 L15 15 Z" fill="#B45309"/>
    <!-- Legs -->
    <rect x="22" y="90" width="6" height="20" fill="#F59E0B"/>
    <rect x="32" y="90" width="6" height="20" fill="#F59E0B"/>
  </g>
  
  <!-- Magnifying Glass (Focusing on the exploration) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#FFD700" stroke-width="4"/>
    <line x1="30" y1="30" x2="50" y2="50" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Distant Mountain/Terrain -->
  <path d="M0 240 L40 160 L80 200 L120 170 L160 210 L240 240 Z" fill="#2A323D"/>
</svg>