<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed dark mode container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>

  <!-- Physical Object representing "灭绝" (Extinction/Dying out): A solitary fossilized ammonite/ancient shell embedded in rock strata, fading into dust particles and glowing amber embers to signify ultimate loss -->
  <g transform="translate(120, 115)">
    <!-- Rock formation base -->
    <path d="M-60,50 L-70,75 L70,75 L60,50 Z" fill="#2C3240"/>
    <path d="M-50,30 L-60,50 L60,50 L50,30 Z" fill="#343C4D"/>

    <!-- Fossil shell (Ammonite representation) -->
    <!-- Outer stone matrix -->
    <circle cx="0" cy="-5" r="42" fill="#3D4659"/>
    <circle cx="0" cy="-5" r="36" fill="#252A36"/>

    <!-- Fossil chambers (spiral fading from solid to broken/dust) -->
    <path d="M 0,-5 A 30,30 0 1,1 -20,-30" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round"/>
    <path d="M -20,-30 A 18,18 0 1,1 0,-23" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0,-23 A 8,8 0 1,1 0,-13" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>

    <!-- Crack lines on fossil -->
    <path d="M10,-10 L25,5" stroke="#1A1D24" stroke-width="2"/>
    <path d="M-10,-20 L-25,-35" stroke="#1A1D24" stroke-width="2"/>
    <path d="M-5,15 L-15,30" stroke="#1A1D24" stroke-width="2"/>

    <!-- Fading into dust / embers floating upward (extinction motif) -->
    <!-- Glowing amber/gold particles -->
    <circle cx="35" cy="-25" r="3.5" fill="#FF7A00" opacity="0.9"/>
    <circle cx="48" cy="-15" r="2" fill="#FFB800" opacity="0.8"/>
    <circle cx="55" cy="-40" r="1.5" fill="#FF7A00" opacity="0.7"/>
    <circle cx="20" cy="-48" r="2.5" fill="#FFB800" opacity="0.9"/>
    
    <circle cx="-35" cy="-45" r="2" fill="#FF7A00" opacity="0.8"/>
    <circle cx="-50" cy="-30" r="3" fill="#FFB800" opacity="0.9"/>
    <circle cx="-42" cy="-12" r="1.5" fill="#FF7A00" opacity="0.6"/>

    <circle cx="5" cy="-60" r="2.5" fill="#FFB800" opacity="0.9"/>
    <circle cx="-15" cy="-68" r="1.5" fill="#FF7A00" opacity="0.7"/>
    <circle cx="15" cy="-75" r="2" fill="#FF7A00" opacity="0.5"/>
  </g>
</svg>