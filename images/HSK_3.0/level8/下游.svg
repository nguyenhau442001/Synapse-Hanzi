<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Upstream/Source Phase (Dim, upstream context) -->
    <path d="M 40 70 Q 70 70 90 90 T 140 110" fill="none" stroke="#2D3748" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Industrial processing nodes upstream -->
    <rect x="50" y="55" width="28" height="28" rx="6" fill="#2D3748"/>
    <rect x="95" y="75" width="28" height="28" rx="6" fill="#2D3748"/>

    <!-- Flow connection arrow -->
    <path d="M 135 112 L 155 125 L 135 138 Z" fill="#F6AD55" opacity="0.4"/>

    <!-- Downstream (Highlighted focal point: 下游 - Fine chemical manufacturing / End product) -->
    <path d="M 130 115 Q 160 135 190 170" fill="none" stroke="#F6AD55" stroke-width="10" stroke-linecap="round"/>

    <!-- Main Downstream Facility / High-Value Product Node -->
    <g transform="translate(155, 135)">
      <!-- Glow/Focus background -->
      <circle cx="25" cy="25" r="32" fill="#F6AD55" opacity="0.15"/>
      
      <!-- Factory/Refinery Base -->
      <rect x="10" y="20" width="30" height="25" rx="4" fill="#2B6CB0"/>
      <path d="M 15 20 L 20 8 L 30 8 L 35 20 Z" fill="#4299E1"/>
      <!-- Smokestack -->
      <rect x="32" y="10" width="5" height="15" fill="#CBD5E0"/>
      <ellipse cx="34" cy="8" rx="4" ry="2" fill="#E2E8F0" opacity="0.8"/>

      <!-- High-value output flask / chemistry symbol -->
      <path d="M 38 32 L 48 45 C 50 48 48 52 44 52 L 16 52 C 12 52 10 48 12 45 L 22 32 Z" fill="#6EE7B7" opacity="0.9"/>
      <rect x="23" y="26" width="4" height="8" fill="#6EE7B7"/>
      <rect x="21" y="24" width="8" height="3" rx="1" fill="#FFFFFF"/>
    </g>

    <!-- Secondary Downstream Node representing extended supply chain -->
    <g transform="translate(110, 165)">
      <rect x="10" y="10" width="28" height="28" rx="6" fill="#319795"/>
      <circle cx="24" cy="24" r="6" fill="#E6FFFA"/>
    </g>
    <path d="M 140 160 L 115 170" fill="none" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>

    <!-- Directional Flow Indicators -->
    <circle cx="165" cy="120" r="3" fill="#F6AD55"/>
    <circle cx="178" cy="135" r="4" fill="#F6AD55"/>
    <circle cx="190" cy="153" r="5" fill="#F6AD55"/>

    <!-- Base anchor/platform representing industrial chain foundation -->
    <path d="M 30 195 L 210 195" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Marker brackets highlighting the downstream section -->
    <path d="M 115 190 L 115 202 M 115 196 L 210 196 M 210 190 L 210 202" fill="none" stroke="#F6AD55" stroke-width="2"/>
  </g>
</svg>