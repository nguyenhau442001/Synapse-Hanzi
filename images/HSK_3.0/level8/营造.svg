<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Ambient glow / atmosphere representing the "营造" (creating an environment/atmosphere) -->
    <circle cx="120" cy="110" r="70" fill="#252A34" opacity="0.6"/>
    <circle cx="120" cy="110" r="50" fill="#2D3748" opacity="0.4"/>

    <!-- Structural arches/pillars representing architecture/building (构造/建造) -->
    <path d="M70,140 L70,80 C70,60 90,50 120,50 C150,50 170,60 170,80 L170,140" fill="none" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Foundation base platform -->
    <rect x="50" y="140" width="140" height="10" rx="3" fill="#2D3748"/>
    <rect x="60" y="150" width="120" height="6" rx="2" fill="#1A202C"/>

    <!-- Central physical building/creation object (Physical iconic representation of "营造") -->
    <path d="M90,140 L90,95 L120,70 L150,95 L150,140 Z" fill="#2B6CB0"/>
    
    <!-- Architectural roof detail -->
    <polygon points="120,58 85,90 155,90" fill="#3182CE"/>

    <!-- Windows of the created structure -->
    <rect x="105" y="100" width="14" height="20" rx="2" fill="#E2E8F0"/>
    <rect x="121" y="100" width="14" height="20" rx="2" fill="#E2E8F0"/>

    <!-- Door -->
    <rect x="107" y="123" width="26" height="17" rx="2" fill="#1A202C"/>

    <!-- Dynamic construction/creation elements (Golden accent representing active crafting/forming) -->
    <path d="M150,75 L175,65" stroke="#D69E2E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="178" cy="64" r="3" fill="#D69E2E"/>
    
    <path d="M90,75 L65,65" stroke="#D69E2E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="62" cy="64" r="3" fill="#D69E2E"/>

    <path d="M165,110 L190,105" stroke="#D69E2E" stroke-width="2" stroke-linecap="round"/>
    <path d="M75,110 L50,105" stroke="#D69E2E" stroke-width="2" stroke-linecap="round"/>

    <!-- Constructing hands / drafting compass subtle overlay -->
    <path d="M100,165 C100,155 110,150 120,150 C130,150 140,155 140,165" fill="none" stroke="#ED8936" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="148" r="4" fill="#ED8936"/>
  </g>
</svg>