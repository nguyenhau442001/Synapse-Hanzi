<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for "正经" (Serious business / Proper matter / Formal discussion) -->
  <!-- We depict a sleek, professional briefcase resting on an organized desk with a formal document, representing "正经事" (serious business/matter) -->

  <!-- Background Desk Surface -->
  <path d="M 30,170 L 210,170 L 220,200 L 20,200 Z" fill="#242833"/>
  <rect x="25" y="195" width="190" height="4" rx="2" fill="#323846"/>

  <!-- Document / Contract representing "正经事" -->
  <g transform="translate(65, 95)">
    <!-- Paper shadow -->
    <rect x="5" y="5" width="70" height="85" rx="4" fill="#12141A" opacity="0.4"/>
    <!-- Paper base -->
    <rect x="0" y="0" width="70" height="85" rx="4" fill="#EAECEF"/>
    <!-- Header line (Gold/Orange accent for focus) -->
    <rect x="12" y="14" width="30" height="6" rx="3" fill="#F59E0B"/>
    <!-- Text lines -->
    <rect x="12" y="30" width="46" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="12" y="42" width="46" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="12" y="54" width="30" height="4" rx="2" fill="#9CA3AF"/>
    <!-- Formal Seal / Checkmark -->
    <circle cx="50" cy="67" r="8" fill="#10B981" opacity="0.2"/>
    <path d="M 46,67 L 49,70 L 55,63" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Sleek Professional Briefcase representing "正经" (Proper/Formal) -->
  <g transform="translate(75, 115)">
    <!-- Briefcase Shadow -->
    <ellipse cx="45" cy="58" rx="38" ry="6" fill="#12141A" opacity="0.5"/>
    
    <!-- Main Body Back -->
    <rect x="10" y="15" width="70" height="42" rx="6" fill="#1E293B"/>
    
    <!-- Metal Clasps & Latches -->
    <rect x="28" y="12" width="8" height="6" rx="1" fill="#F59E0B"/>
    <rect x="54" y="12" width="8" height="6" rx="1" fill="#F59E0B"/>
    
    <!-- Handle -->
    <path d="M 34,12 C 34,4 56,4 56,12" stroke="#64748B" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Main Body Front (Slightly lighter flat layer) -->
    <rect x="10" y="20" width="70" height="37" rx="6" fill="#334155"/>
    
    <!-- Center Lock Detail -->
    <rect x="41" y="32" width="8" height="6" rx="2" fill="#F59E0B"/>
    
    <!-- Subtle front seam line -->
    <line x1="10" y1="35" x2="80" y2="35" stroke="#1E293B" stroke-width="1.5"/>
  </g>

  <!-- Accent Focus Glow / Indicator representing clarity and seriousness -->
  <circle cx="120" cy="55" r="3" fill="#F59E0B"/>
  <circle cx="120" cy="55" r="8" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2,3" fill="none" opacity="0.6"/>

</svg>