<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 110)">
    <!-- Outer Yin-Yang Circle Base -->
    <circle cx="0" cy="0" r="76" fill="#2A2F3D" />
    
    <!-- Yin-Yang Halves & Flow -->
    <path d="M 0,-76 A 76 76 0 0 1 0,76 A 38 38 0 0 1 0,0 A 38 38 0 0 0 0,-76 Z" fill="#E2E8F0" />
    <path d="M 0,-76 A 76 76 0 0 0 0,76 A 38 38 0 0 0 0,0 A 38 38 0 0 1 0,-76 Z" fill="#F59E0B" />
    
    <!-- Yin-Yang Dots -->
    <circle cx="0" cy="-38" r="12" fill="#2A2F3D" />
    <circle cx="0" cy="38" r="12" fill="#E2E8F0" />
    
    <!-- Subtle energy arcs representing Tai Chi movement in the park (晨练) -->
    <path d="M -95,-20 C -95,40 -60,85 0,95" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 95,20 C 95,-40 60,-85 0,-95" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
</svg>