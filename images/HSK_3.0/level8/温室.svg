  <polygon points="120,74 158,104 158,145 120,145" fill="none" stroke="#64DFDF" stroke-width="1.5" opacity="0.6"/>
  <polygon points="120,74 82,104 82,145 120,145" fill="none" stroke="#64DFDF" stroke-width="1.5" opacity="0.6"/>

  <polygon points="82,150 120,150 120,190 78,190" fill="#48BFE3" opacity="0.15"/>
  <polygon points="122,150 158,150 162,190 122,190" fill="#48BFE3" opacity="0.1"/>
  <polygon points="82,150 120,150 120,190 78,190" fill="none" stroke="#64DFDF" stroke-width="1.5" opacity="0.5"/>
  <polygon points="122,150 158,150 162,190 122,190" fill="none" stroke="#64DFDF" stroke-width="1.5" opacity="0.5"/>

