  <circle cx="120" cy="50" r="3" fill="#FCBF49"/>
  <path d="M112 55 Q120 48 128 55" fill="none" stroke="#FCBF49" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Thriving High-Quality Out-of-Season Crops (反季节瓜果 / 绿色植物) inside -->
  <!-- Plant 1 (Left - Leafy greens) -->
  <path d="M95 185 C95 165 105 160 105 150 C105 165 115 170 115 185 Z" fill="#52B788"/>
  <path d="M90 185 C90 170 98 165 100 155 C102 165 110 170 110 185 Z" fill="#74C69D"/>

  <!-- Plant 2 (Center - Glowing premium eco-fruit plant) -->
  <path d="M120 190 L120 155" stroke="#52B788" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 175 C110 170 105 160 110 150 C115 160 120 165 120 175 Z" fill="#40916C"/>
  <path d="M120 165 C130 160 135 150 130 140 C125 150 120 155 120 165 Z" fill="#52B788"/>
  
