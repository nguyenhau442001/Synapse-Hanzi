  <circle cx="118" cy="140" r="2" fill="#FCBF49" opacity="0.8"/>

  <!-- Plant 3 (Right) -->
  <path d="M135 185 C135 170 142 165 145 155 C148 165 155 170 155 185 Z" fill="#74C69D"/>

