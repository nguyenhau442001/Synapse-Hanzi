<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground Layer -->
  <path d="M0 160 Q 120 140 240 160 L 240 240 L 0 240 Z" fill="#2D343E"/>
  <path d="M0 180 Q 120 160 240 180 L 240 240 L 0 240 Z" fill="#3A424F"/>
  
  <!-- Underground Minerals -->
  <g transform="translate(120, 190)">
    <!-- Gold/Ore 1 -->
    <polygon points="-60,0 -40,-40 -20,-10 -30,10" fill="#FFB800"/>
    <polygon points="-50,-5 -35,-30 -25,-15" fill="#FFD666"/>
    
    <!-- Gold/Ore 2 -->
    <polygon points="10,0 30,-50 50,-20 40,10" fill="#E69500"/>
    <polygon points="15,-5 35,-40 45,-25" fill="#FFC107"/>
    
    <!-- Gemstone/Crystal -->
    <polygon points="-10,-20 10,-20 20,0 0,30 -20,0" fill="#4A90E2"/>
    <polygon points="-10,-20 0,0 -20,0" fill="#357ABD"/>
    <polygon points="10,-20 0,0 20,0" fill="#5CA3E8"/>
  </g>
  
  <!-- Surface Detail -->
  <path d="M20 160 C 50 140, 80 150, 100 155 C 130 160, 160 150, 190 155 C 220 160, 230 150, 240 155" stroke="#4A5568" stroke-width="2" fill="none"/>
</svg>