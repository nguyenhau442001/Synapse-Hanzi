<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Television Frame -->
  <rect x="50" y="60" width="140" height="100" rx="8" fill="#2D343E" stroke="#FFB800" stroke-width="3"/>
  
  <!-- Screen Content: Representing a "Column/Segment" (栏目) as a structured list of media content -->
  <rect x="65" y="75" width="110" height="15" rx="4" fill="#FFB800"/>
  <rect x="65" y="100" width="80" height="10" rx="3" fill="#4A5568"/>
  <rect x="65" y="115" width="95" height="10" rx="3" fill="#4A5568"/>
  <rect x="65" y="130" width="70" height="10" rx="3" fill="#4A5568"/>
  
  <!-- TV Stand -->
  <rect x="115" y="160" width="10" height="20" fill="#FFB800"/>
  <rect x="90" y="180" width="60" height="5" rx="2" fill="#FFB800"/>
  
  <!-- Decorative elements to imply broadcast/media -->
  <circle cx="170" cy="70" r="4" fill="#FFB800"/>
</svg>