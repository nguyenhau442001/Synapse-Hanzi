<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Scale (Balance) representing legal justice & prosecution -->
    <!-- Base -->
    <path d="M90 170 L110 170 L115 185 L85 185 Z" fill="#4A5568" />
    <rect x="94" y="60" width="12" height="115" rx="3" fill="#E2E8F0" />
    
    <!-- Top ornamental ring / finial -->
    <circle cx="100" cy="50" r="8" fill="none" stroke="#E2E8F0" stroke-width="4" />
    
    <!-- Central beam -->
    <path d="M40 75 L160 75 L160 85 L40 85 Z" fill="#F6AD55" rx="2" />
    <circle cx="100" cy="80" r="6" fill="#DD6B20" />

    <!-- Left Pan & Chains -->
    <line x1="40" y1="80" x2="30" y2="125" stroke="#CBD5E0" stroke-width="2" />
    <line x1="40" y1="80" x2="70" y2="125" stroke="#CBD5E0" stroke-width="2" />
    <path d="M20 125 Q50 135 80 125 Z" fill="none" stroke="#CBD5E0" stroke-width="2" />
    <path d="M25 125 C25 140, 75 140, 75 125 Z" fill="#4A5568" opacity="0.8" />

    <!-- Right Pan & Chains (Slightly tilted down to represent weighing evidence) -->
    <line x1="160" y1="80" x2="135" y2="135" stroke="#CBD5E0" stroke-width="2" />
    <line x1="160" y1="80" x2="175" y2="135" stroke="#CBD5E0" stroke-width="2" />
    <path d="M125 135 Q155 145 185 135 Z" fill="none" stroke="#CBD5E0" stroke-width="2" />
    <path d="M130 135 C130 150, 180 150, 180 135 Z" fill="#4A5568" opacity="0.8" />

    <!-- Magnifying Glass representing investigation/inspection (检察) -->
    <g transform="translate(105, 95)">
      <!-- Glass handle -->
      <path d="M 25 25 L 45 45" stroke="#3182CE" stroke-width="8" stroke-linecap="round" />
      <circle cx="0" cy="0" r="22" fill="#2B6CB0" fill-opacity="0.3" stroke="#63B3ED" stroke-width="5" />
      <!-- Document lines inside lens -->
      <line x1="-10" y1="-7" x2="6" y2="-7" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
      <line x1="-10" y1="1" x2="10" y2="1" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
      <line x1="-10" y1="9" x2="2" y2="9" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>