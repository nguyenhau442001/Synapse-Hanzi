<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    {/* Central physical object: A classic, balanced mechanical scale representing equality and same level */}
    
    {/* Base of the scale */}
    <path d="M100 175 L140 175 L150 190 L90 190 Z" fill="#2E3542"/>
    <rect x="114" y="110" width="12" height="65" rx="3" fill="#4B5563"/>
    
    {/* Top sphere of the scale */}
    <circle cx="120" cy="110" r="10" fill="#F59E0B"/>
    
    {/* Main horizontal beam - perfectly balanced and horizontal */}
    <rect x="60" y="102" width="120" height="6" rx="3" fill="#E5E7EB"/>
    
    {/* Left pivot pin */}
    <circle cx="66" cy="105" r="4" fill="#F59E0B"/>
    {/* Right pivot pin */}
    <circle cx="174" cy="105" r="4" fill="#F59E0B"/>
    
    {/* Left chains */}
    <line x1="66" y1="105" x2="66" y2="145" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="66" y1="105" x2="86" y2="145" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3,3"/>
    
    {/* Right chains */}
    <line x1="174" y1="105" x2="154" y2="145" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="174" y1="105" x2="174" y2="145" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3,3"/>
    
    {/* Left scale pan */}
    <path d="M50 145 C50 145, 60 160, 76 160 C92 160, 102 145, 102 145 Z" fill="#3B82F6"/>
    
    {/* Right scale pan */}
    <path d="M138 145 C138 145, 148 160, 164 160 C180 160, 190 145, 190 145 Z" fill="#3B82F6"/>
    
    {/* Identical objects on both pans representing 'equal/same' (同等) */}
    {/* Left object: Blue document/credential */}
    <rect x="68" y="125" width="16" height="20" rx="2" fill="#60A5FA"/>
    <line x1="72" y1="131" x2="80" y2="131" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="137" x2="78" y2="137" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    {/* Right object: Identical blue document/credential */}
    <rect x="156" y="125" width="16" height="20" rx="2" fill="#60A5FA"/>
    <line x1="160" y1="131" x2="168" y2="131" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="137" x2="166" y2="137" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    {/* Glowing accent indicators showing level equilibrium */}
    <circle cx="120" cy="80" r="6" fill="#10B981" opacity="0.2"/>
    <path d="M116 80 L119 83 L125 77" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>