<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Camping Tent -->
  <path d="M70 180 L170 180 L120 100 Z" fill="#4A5568"/>
  <path d="M120 100 L120 180" stroke="#2D3748" stroke-width="4"/>
  
  <!-- Rain effect -->
  <line x1="80" y1="60" x2="80" y2="90" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="50" x2="100" y2="80" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="60" x2="120" y2="90" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="50" x2="140" y2="80" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="60" x2="160" y2="90" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Character looking disappointed -->
  <g transform="translate(120, 180)">
    <!-- Body -->
    <path d="M-20 0 C-20 -20, 20 -20, 20 0" fill="#E2E8F0"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="15" fill="#E2E8F0"/>
    <!-- Sad facial features -->
    <path d="M-5 -38 L-2 -35 L1 -38" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <path d="M5 -38 L8 -35 L11 -38" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <path d="M-5 -28 Q0 -25 5 -28" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Accent: Gold/Orange highlight on the tent entrance to show the ruined plan -->
  <path d="M120 100 L145 180 L120 180 Z" fill="#F6AD55" opacity="0.6"/>
</svg>