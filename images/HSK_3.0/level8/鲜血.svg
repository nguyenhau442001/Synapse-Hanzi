<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to emphasize warmth and focus -->
  <circle cx="120" cy="125" r="70" fill="#E63946" opacity="0.08" filter="blur(15px)"/>

  <!-- Conceptual Representation of "鲜血" (Fresh, vibrant blood / warm life-blood) -->
  <!-- Falling/flowing dynamic droplets representing vibrant vital fluid -->
  <g transform="translate(0, 5)">
    <!-- Large Central Droplet -->
    <path d="M120 45 C120 45 152 95 152 122 C152 140 137 155 120 155 C103 155 88 140 88 122 C88 95 120 45 120 45 Z" fill="url(#bloodGrad)" />
    
    <!-- Dynamic Secondary Droplets -->
    <!-- Left Droplet -->
    <path d="M72 90 C72 90 90 120 90 135 C90 145 82 152 72 152 C62 152 54 145 54 135 C54 120 72 90 72 90 Z" fill="#E63946" opacity="0.9" />
    <!-- Right Droplet -->
    <path d="M168 105 C168 105 184 130 184 143 C184 152 176 160 168 160 C160 160 152 152 152 143 C152 130 168 105 168 105 Z" fill="#D90429" opacity="0.95" />
    
    <!-- Small Splash/Ripple Accents at base -->
    <ellipse cx="120" cy="172" rx="24" ry="5" fill="#E63946" opacity="0.4"/>
    <ellipse cx="72" cy="165" rx="10" ry="2.5" fill="#E63946" opacity="0.3"/>
    <ellipse cx="168" cy="170" rx="14" ry="3" fill="#E63946" opacity="0.3"/>
    
    <!-- Highlight on main droplet for sleek modern vector finish -->
    <path d="M115 65 C115 65 132 100 135 115 C136 120 130 125 125 120 C120 115 110 90 110 80 C110 75 112 68 115 65 Z" fill="#FF87AB" opacity="0.5"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bloodGrad" x1="120" y1="45" x2="120" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="50%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#9B0016"/>
    </linearGradient>
  </defs>
</svg>