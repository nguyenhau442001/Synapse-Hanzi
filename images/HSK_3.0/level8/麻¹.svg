<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Leg representation -->
  <g transform="translate(120, 120)">
    <!-- Leg shape -->
    <path d="M-20 -60 L-20 60 L20 60 L20 -60 Z" fill="#4A5568" rx="10"/>
    <path d="M-20 60 L-20 80 L30 80 L30 60 Z" fill="#4A5568" rx="5"/>
    
    <!-- Numbness effect: Static/Electric sparks represented by sharp, high-contrast yellow lines -->
    <g stroke="#FFD700" stroke-width="3" stroke-linecap="round">
      <line x1="-15" y1="-40" x2="-30" y2="-55"/>
      <line x1="15" y1="-20" x2="30" y2="-35"/>
      <line x1="-10" y1="0" x2="-35" y2="5"/>
      <line x1="10" y1="30" x2="35" y2="25"/>
      <line x1="-5" y1="50" x2="-25" y2="65"/>
      <line x1="15" y1="65" x2="35" y2="55"/>
    </g>
    
    <!-- Focus highlight on the sensation -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  </g>
</svg>