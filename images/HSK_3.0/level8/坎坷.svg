<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground path representing the uneven, rugged terrain (坎坷) -->
  <path d="M20 180 C 50 180, 70 140, 90 170 C 110 200, 130 130, 150 160 C 170 190, 190 150, 220 160" 
        stroke="#FFB84D" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- A determined figure walking up the rugged path -->
  <g transform="translate(110, 110)">
    <!-- Body -->
    <path d="M10 60 L10 30 L20 25 L30 30 L30 60" fill="#E0E0E0"/>
    <!-- Head -->
    <circle cx="20" cy="20" r="8" fill="#E0E0E0"/>
    <!-- Leg in motion -->
    <path d="M12 60 L8 80" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
    <path d="M28 60 L32 75" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
    <!-- Arm in motion -->
    <path d="M10 35 L0 45" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 35 L40 45" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Obstacles on the path (stones) -->
  <circle cx="60" cy="175" r="5" fill="#5D6D7E"/>
  <circle cx="130" cy="155" r="7" fill="#5D6D7E"/>
  <circle cx="180" cy="165" r="4" fill="#5D6D7E"/>
</svg>