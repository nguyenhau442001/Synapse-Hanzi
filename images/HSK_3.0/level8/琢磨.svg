<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Desk Surface / Shadow -->
  <path d="M40 185 L200 185 L215 205 L25 205 Z" fill="#121418" opacity="0.6"/>
  
  <!-- Background Glow to emphasize focus -->
  <circle cx="120" cy="115" r="70" fill="#00D2FF" opacity="0.04" filter="blur(15px)"/>

  <!-- Desk & Chair Backrest (Context: Sitting at a desk) -->
  <rect x="70" y="170" width="100" height="12" rx="4" fill="#2E3440"/>
  <rect x="105" y="145" width="30" height="30" fill="#2E3440" opacity="0.5"/>

  <!-- Character Head & Shoulders (Contemplating / Pondering) -->
  <!-- Body/Shoulders -->
  <path d="M75 185 C75 160 95 145 120 145 C145 145 165 160 165 185 Z" fill="#3B4252"/>
  <!-- Neck -->
  <rect x="111" y="130" width="18" height="22" fill="#E5C1B3"/>
  <!-- Head -->
  <circle cx="120" cy="108" r="22" fill="#E5C1B3"/>
  <!-- Hair (Modern styling, dark blue-grey) -->
  <path d="M98 108 C98 94 108 86 120 86 C132 86 142 94 142 108 C142 112 140 115 140 115 C140 115 137 98 120 96 C103 98 100 115 100 115 C100 115 98 112 98 108 Z" fill="#4C566A"/>

  <!-- Hand on Chin / Thinking Gesture (Key to "琢磨" - pondering/deliberating) -->
  <path d="M112 122 C112 118 116 114 122 116 C126 118 128 123 126 128 Z" fill="#E5C1B3"/>
  <path d="M110 132 C110 126 118 124 124 128 C128 131 125 138 120 138 C114 138 110 135 110 132 Z" fill="#E5C1B3"/>

  <!-- Open Math Problem Book / Complex Diagram on Desk -->
  <path d="M80 165 L160 165 L175 180 L65 180 Z" fill="#ECEFF4"/>
  <!-- Book spine -->
  <line x1="120" y1="165" x2="120" y2="180" stroke="#D8DEE9" stroke-width="2"/>
  <!-- Abstract math symbols / geometric lines on book pages -->
  <path d="M90 170 L98 175 L106 170" stroke="#4C566A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="145" cy="173" r="4" stroke="#4C566A" stroke-width="1.5" fill="none"/>
  <line x1="135" y1="173" x2="141" y2="173" stroke="#4C566A" stroke-width="1.5"/>

  <!-- Floating Conceptual Elements: Gear + Lightbulb (Mind at work, analyzing, processing deeply) -->
  <g transform="translate(120, 52)">
    <!-- Lightbulb Aura -->
    <circle cx="0" cy="0" r="26" fill="#FFD700" opacity="0.1" filter="blur(6px)"/>
    
    <!-- Glowing Gear (Mechanism of thought / working through complexity) -->
    <path d="M-12,-4 L-15,-6 L-13,-11 L-9,-10 L-6,-13 L-8,-17 L-4,-19 L-1,-16 L4,-16 L7,-19 L11,-17 L9,-13 L12,-10 L16,-11 L18,-6 L15,-4 L15,1 L18,3 L16,8 L12,7 L9,10 L11,14 L7,16 L4,13 L-1,13 L-4,16 L-8,14 L-6,10 L-9,7 L-13,8 L-15,3 L-12,1 Z" fill="#D8DEE9" opacity="0.25"/>
    <circle cx="0" cy="0" r="5" fill="#1A1D24" opacity="0.5"/>

    <!-- Lightbulb Core (Realization / Focused Thought) -->
    <path d="M-8,-2 C-8,-10 -3,-14 0,-14 C3,-14 8,-10 8,-2 C8,3 5,6 4,9 L-4,9 C-5,6 -8,3 -8,-2 Z" fill="#FFD700"/>
    <rect x="-3" y="10" width="6" height="3" rx="1" fill="#E5E9F0"/>
    <path d="M-2,14 L2,14 L1,17 L-1,17 Z" fill="#4C566A"/>
    
    <!-- Focus Sparkles / Active Cogitation Indicator -->
    <circle cx="-20" cy="-6" r="1.5" fill="#FFD700"/>
    <circle cx="21" cy="-2" r="2" fill="#FFD700"/>
    <circle cx="16" cy="-18" r="1" fill="#FFD700"/>
  </g>
</svg>