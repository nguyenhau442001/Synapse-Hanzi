<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main Scene: Intervention/Investigation -->
  <!-- The "Case/Incident" represented by a folder/document cluster -->
  <rect x="70" y="100" width="100" height="70" rx="4" fill="#3B4252" stroke="#4C566A" stroke-width="2"/>
  <rect x="75" y="90" width="90" height="10" rx="2" fill="#4C566A"/>
  
  <!-- The "Intervening Force" represented by a professional inspector/agent hand -->
  <!-- Hand reaching into the scene to place a magnifying glass or marker -->
  <path d="M140 180 C 140 150, 150 140, 170 140 L 180 140 C 190 140, 195 145, 195 155 L 195 160 C 195 170, 190 175, 180 175 L 170 175" fill="#D8DEE9"/>
  
  <!-- Magnifying Glass representing the "Investigation" aspect of the intervention -->
  <circle cx="150" cy="120" r="20" fill="none" stroke="#FFB86C" stroke-width="4"/>
  <line x1="165" y1="135" x2="190" y2="160" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Highlight accent on the document to show focus -->
  <rect x="85" y="115" width="40" height="8" rx="2" fill="#FFB86C"/>
  <rect x="85" y="135" width="60" height="8" rx="2" fill="#4C566A"/>
  <rect x="85" y="155" width="30" height="8" rx="2" fill="#4C566A"/>
</svg>