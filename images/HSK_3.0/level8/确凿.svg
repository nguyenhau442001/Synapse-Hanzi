<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle details -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="40" y1="60" x2="200" y2="60"/>
    <line x1="40" y1="100" x2="200" y2="100"/>
    <line x1="40" y1="140" x2="200" y2="140"/>
    <line x1="40" y1="180" x2="200" y2="180"/>
  </g>

  <!-- Legal Document / Evidence Base -->
  <g transform="translate(45, 55)">
    <!-- Document shadow -->
    <rect x="6" y="6" width="100" height="130" rx="6" fill="#0D0F12" opacity="0.5"/>
    <!-- Document background -->
    <rect x="0" y="0" width="100" height="130" rx="6" fill="#2D323E"/>
    <!-- Document Header Accent -->
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 94 0 A 6 6 0 0 1 100 6 L 100 24 L 0 24 Z" fill="#3D4454"/>
    
    <!-- Text lines on document -->
    <rect x="14" y="38" width="45" height="6" rx="3" fill="#6E7687"/>
    <rect x="14" y="52" width="72" height="4" rx="2" fill="#4E5668"/>
    <rect x="14" y="62" width="60" height="4" rx="2" fill="#4E5668"/>
    <rect x="14" y="72" width="68" height="4" rx="2" fill="#4E5668"/>
    <rect x="14" y="82" width="40" height="4" rx="2" fill="#4E5668"/>

    <!-- Red Seal / Stamp (Official Stamp of Proof) -->
    <g transform="translate(55, 85)">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="5 2"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#E5484D" stroke-width="1"/>
      <path d="M 12 20 L 17 25 L 28 14" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Magnifying Glass (Focus on Evidence / Certainty) -->
  <g transform="translate(95, 80)">
    <!-- Glass shadow -->
    <circle cx="53" cy="53" r="36" fill="#0D0F12" opacity="0.4"/>
    
    <!-- Handle -->
    <path d="M 25 75 L -5 105 C -9 109 -9 115 -5 119 L -1 123 C 3 127 9 127 13 123 L 43 93 Z" fill="#3D4454"/>
    <path d="M 22 78 L -1 101 C -3 103 -3 107 -1 109 L 1 111 C 3 113 7 113 9 111 L 32 88 Z" fill="#E6AF2E"/>
    <circle cx="-3" cy="113" r="3" fill="#3D4454"/>

    <!-- Lens Rim (Gold / Accent) -->
    <circle cx="50" cy="50" r="38" fill="#2D323E"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#F5D97E" stroke-width="6"/>

    <!-- Lens Glass & Reflection -->
    <circle cx="50" cy="50" r="32" fill="#4DA6FF" fill-opacity="0.15"/>
    <path d="M 28 32 C 35 24 45 22 55 24 C 40 26 30 36 28 50 C 27 43 27 37 28 32 Z" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>

  <!-- Verification Checkmark Badge (Absolute Certainty) -->
  <g transform="translate(150, 40)">
    <circle cx="24" cy="24" r="22" fill="#1A1D24" stroke="#2D323E" stroke-width="4"/>
    <circle cx="24" cy="24" r="18" fill="#30A46C"/>
    <path d="M 15 24 L 21 30 L 33 16" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>