<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Elements: Mountain peaks and terrain representing outdoor trekking -->
  <path d="M 30 180 L 90 110 L 140 160 L 185 95 L 220 180 Z" fill="#252A34"/>
  <path d="M 70 180 L 120 130 L 165 180 Z" fill="#2D3340"/>
  
  <!-- Snow caps on distant mountains -->
  <path d="M 90 110 L 105 130 L 98 135 L 90 125 L 82 135 L 75 125 Z" fill="#E2E8F0" opacity="0.8"/>
  <path d="M 185 95 L 198 115 L 190 120 L 185 112 L 178 120 L 172 110 Z" fill="#E2E8F0" opacity="0.8"/>

  <!-- Motion lines indicating walking / trekking action -->
  <path d="M 65 170 C 80 170, 95 165, 105 160" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
  <path d="M 80 185 C 95 185, 110 180, 125 175" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" fill="none" opacity="0.6"/>

  <!-- Hiking Character (Side Profile, Dynamic Walking Action) -->
  <g transform="translate(90, 90)">
    <!-- Backpack -->
    <rect x="-6" y="25" width="14" height="22" rx="4" fill="#FF9F43"/>
    <path d="M -2 25 L -2 40" stroke="#E2E8F0" stroke-width="1.5" opacity="0.5"/>

    <!-- Walking Stick (Trekking Pole) -->
    <line x1="28" y1="20" x2="8" y2="85" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Body & Limbs (Dynamic pose) -->
    <!-- Back Leg -->
    <path d="M 2 45 L -8 72 L -2 80" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front Leg -->
    <path d="M 2 45 L 18 68 L 28 78" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Torso -->
    <path d="M -2 20 L 6 48" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Back Arm holding pole -->
    <path d="M 2 26 L 18 36 L 24 25" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front Arm -->
    <path d="M 4 26 L -4 42" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Head & Cap -->
    <circle cx="6" cy="11" r="7" fill="#FDE047"/>
    <path d="M -1 7 L 13 7 L 15 10 L -3 10 Z" fill="#FF9F43"/>
  </g>

  <!-- Foreground ground line -->
  <path d="M 20 180 L 220 180" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
</svg>