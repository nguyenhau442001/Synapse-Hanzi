<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Background subtle structural grid to represent framework/system context -->
    <line x1="50" y1="20" x2="50" y2="180" stroke="#2A313C" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="150" y1="20" x2="150" y2="180" stroke="#2A313C" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="60" x2="180" y2="60" stroke="#2A313C" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="140" x2="180" y2="140" stroke="#2A313C" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Outer Structural Frame (Kuangjia - 框架) -->
    <!-- Main outer bold architectural boundary -->
    <rect x="35" y="35" width="130" height="130" rx="6" fill="none" stroke="#F39C12" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Corner brackets for structural precision -->
    <path d="M35 50 L35 35 L50 35" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 35 L165 35 L165 50" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M165 150 L165 165 L150 165" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 165 L35 165 L35 150" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Internal Framework Elements (Beams / Skeleton / System Structure) -->
    <!-- Horizontal structural beam 1 -->
    <rect x="45" y="75" width="110" height="10" rx="2" fill="#2E394A" stroke="#4E617C" stroke-width="2"/>
    <!-- Horizontal structural beam 2 -->
    <rect x="45" y="115" width="110" height="10" rx="2" fill="#2E394A" stroke="#4E617C" stroke-width="2"/>
    
    <!-- Vertical supporting pillar -->
    <rect x="75" y="45" width="10" height="110" rx="2" fill="#2E394A" stroke="#4E617C" stroke-width="2"/>
    <rect x="115" y="45" width="10" height="110" rx="2" fill="#2E394A" stroke="#4E617C" stroke-width="2"/>

    <!-- Focal nodes / interlocking joints (Representing institutional agreement points) -->
    <circle cx="80" cy="80" r="6" fill="#F39C12"/>
    <circle cx="120" cy="80" r="6" fill="#F39C12"/>
    <circle cx="80" cy="120" r="6" fill="#F39C12"/>
    <circle cx="120" cy="120" r="6" fill="#F39C12"/>

    <!-- Central core integration hub -->
    <rect x="92" y="92" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#F39C12" stroke-width="3"/>

    <!-- Floating accent indicators giving a sleek modern architectural blueprint feel -->
    <circle cx="15" cy="35" r="3" fill="#4E617C"/>
    <circle cx="185" cy="35" r="3" fill="#4E617C"/>
    <circle cx="15" cy="165" r="3" fill="#4E617C"/>
    <circle cx="185" cy="165" r="3" fill="#4E617C"/>
  </g>
</svg>