<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Outer Target Rings representing "aim/purpose" (zhǐzài) -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#2A3241" stroke-width="12"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#3A465B" stroke-width="8" stroke-dasharray="8 6"/>
    
    <!-- Central Bullseye Accent (Golden Orange for focus) -->
    <circle cx="0" cy="0" r="28" fill="#FF8C42" opacity="0.18"/>
    <circle cx="0" cy="0" r="18" fill="#FF8C42"/>
    <circle cx="0" cy="0" r="8" fill="#FFF1E8"/>

    <!-- Precision Arrow piercing the center -->
    <!-- Arrow shaft behind -->
    <line x1="-75" y1="75" x2="-14" y2="14" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Feathered tail of the arrow -->
    <path d="M -85 70 L -70 85 M -80 65 L -73 72 M -75 80 L -68 87" stroke="#FF8C42" stroke-width="3" stroke-linecap="round"/>

    <!-- Arrowhead piercing the bullseye from top-left -->
    <polygon points="0,0 -8,12 -12,8" fill="#FFFFFF"/>
    <path d="M -14 14 L 0 0" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>