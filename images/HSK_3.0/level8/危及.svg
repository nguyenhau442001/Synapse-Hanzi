<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Water Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background decorative depth elements -->
  <path d="M 40 180 Q 120 150 200 180" stroke="#2A303C" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M 40 195 Q 120 165 200 195" stroke="#2A303C" stroke-width="2" fill="none"/>

  <!-- Underground Water Stream (The Physical Object being threatened) -->
  <path d="M 20 140 C 70 140, 90 170, 140 170 C 190 170, 210 140, 220 140" fill="none" stroke="#238636" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
  <path d="M 20 140 C 70 140, 90 170, 140 170 C 190 170, 210 140, 220 140" fill="none" stroke="#3FB950" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Droplets representing clean water source -->
  <path d="M 60 120 C 60 120, 50 132, 50 138 C 50 143.5, 54.5 148, 60 148 C 65.5 148, 70 143.5, 70 138 C 70 132, 60 120, 60 120 Z" fill="#3FB950" opacity="0.8"/>
  <path d="M 180 115 C 180 115, 172 125, 172 130 C 172 134.4, 175.6 138, 180 138 C 184.4 138, 188 134.4, 188 130 C 188 125, 180 115, 180 115 Z" fill="#3FB950" opacity="0.8"/>

  <!-- Industrial Pipe (Source of Threat) -->
  <path d="M 10 50 L 90 50 L 90 90 L 10 90 Z" fill="#30363D"/>
  <rect x="5" y="45" width="10" height="50" rx="2" fill="#484F58"/>
  
  <!-- Toxic Waste Flow / Threat Agent (Dripping heavily into the stream) -->
  <path d="M 70 90 L 70 120 C 70 135, 95 135, 95 150 L 95 155" fill="none" stroke="#F85149" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 70 90 L 70 120 C 70 135, 95 135, 95 150 L 95 155" fill="none" stroke="#FF7B72" stroke-width="8" stroke-linecap="round"/>

  <!-- Hazardous Industrial Contaminant Drops (Impacting and poisoning the water) -->
  <circle cx="95" cy="162" r="5" fill="#F85149" filter="url(#glow)"/>
  <circle cx="115" cy="165" r="3" fill="#F85149"/>
  <circle cx="75" cy="160" r="4" fill="#F85149"/>

  <!-- Warning / Danger Indicator (Sharp Hazard Symbol integrated cleanly without abstract badges) -->
  <g transform="translate(120, 65)">
    <!-- Hazard Triangle Frame -->
    <path d="M 0 -22 L 22 18 L -22 18 Z" fill="#1A1D24" stroke="#F85149" stroke-width="4" stroke-linejoin="round"/>
    <!-- Exclamation Mark -->
    <line x1="0" y1="-8" x2="0" y2="4" stroke="#F85149" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="11" r="2" fill="#F85149"/>
  </g>

  <!-- Ripples of impact on the water stream showing disruption -->
  <ellipse cx="95" cy="165" rx="12" ry="4" fill="none" stroke="#FF7B72" stroke-width="2" opacity="0.8"/>
  <ellipse cx="95" cy="165" rx="22" ry="7" fill="none" stroke="#FF7B72" stroke-width="1.5" opacity="0.4"/>

</svg>