<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Celestial Transition / Night and Day Split Background -->
  <g clip-path="url(#circle-clip)">
    <clipPath id="circle-clip">
      <circle cx="120" cy="120" r="80"/>
    </clipPath>
    <!-- Left side: Night (Dark Blue) -->
    <rect x="40" y="40" width="80" height="160" fill="#11151C"/>
    <!-- Right side: Day (Deep Warm Blue/Teal) -->
    <rect x="120" y="40" width="80" height="160" fill="#1E293B"/>

    <!-- Stars on Night side -->
    <circle cx="65" cy="75" r="1.5" fill="#94A3B8"/>
    <circle cx="85" cy="105" r="1" fill="#64748B"/>
    <circle cx="70" cy="140" r="1.5" fill="#E2E8F0"/>

    <!-- Sun rays / glow on Day side -->
    <circle cx="175" cy="75" r="12" fill="#F59E0B" opacity="0.9"/>
    <path d="M175 53V59M175 91V97M153 75H159M191 75H197" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Crescent Moon on Night side -->
    <path d="M75 95C72 95 69.5 93 69 90C67 85 71 79 76 78C73.5 81 73.5 86 75 95Z" fill="#FCD34D"/>
  </g>

  <!-- Central Object: Detailed Modern Scientific Monitor / Data Station representing 24/7 continuous research & monitoring -->
  <g transform="translate(120, 120)">
    <!-- Stand -->
    <path d="M-12 56H12L16 66H-16L-12 56Z" fill="#475569"/>
    <rect x="-4" y="38" width="8" height="20" fill="#64748B"/>
    <rect x="-24" y="64" width="48" height="4" rx="2" fill="#94A3B8"/>

    <!-- Monitor Outer Frame -->
    <rect x="-56" y="-46" width="112" height="84" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Monitor Inner Screen -->
    <rect x="-50" y="-40" width="100" height="72" rx="4" fill="#0F172A"/>

    <!-- Continuous Data Visualization (Waveform / Monitoring) -->
    <path d="M-42 0L-30 -12L-18 15L-6 -25L6 18L18 -8L30 10L42 -5" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Glowing data points -->
    <circle cx="-30" cy="-12" r="2.5" fill="#38BDF8"/>
    <circle cx="-6" cy="-25" r="2.5" fill="#38BDF8"/>
    <circle cx="18" cy="-8" r="2.5" fill="#38BDF8"/>

    <!-- Accent UI elements on screen -->
    <line x1="-42" y1="22" x2="42" y2="22" stroke="#1E293B" stroke-width="2"/>
    <rect x="-42" y="-32" width="16" height="4" rx="2" fill="#F59E0B"/>
    <rect x="-22" y="-32" width="8" height="4" rx="2" fill="#34D399"/>
  </g>

  <!-- Circular Continuous Flow / Orbit Accent symbolizing unbroken cycle of day and night -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.6"/>

  <!-- Glowing focal elements on the orbit -->
  <circle cx="28" cy="120" r="4" fill="#F59E0B"/>
  <circle cx="212" cy="120" r="4" fill="#F59E0B"/>
</svg>