<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing the balance of two distinct entities: Economic Growth (Gold Coin) and Environmental Responsibility (Green Leaf) -->
  
  <!-- The Scale/Balance Beam -->
  <path d="M60 180 L180 180 M120 180 L120 120" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 120 L160 120" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Left side: Economic Growth (Gold Coin) -->
  <circle cx="80" cy="120" r="25" fill="#1A1D24" stroke="#F6AD55" stroke-width="4"/>
  <circle cx="80" cy="120" r="15" fill="#F6AD55"/>
  
  <!-- Right side: Environmental Responsibility (Green Leaf) -->
  <path d="M160 120 C 160 100, 185 100, 185 120 C 185 140, 160 140, 160 120" fill="#48BB78"/>
  <path d="M160 120 L 185 120" stroke="#2F855A" stroke-width="2"/>
  
  <!-- Connecting lines to the scale -->
  <path d="M80 145 L80 120" stroke="#718096" stroke-width="3"/>
  <path d="M160 145 L160 120" stroke="#718096" stroke-width="3"/>
  
  <!-- Supporting base -->
  <path d="M100 200 L140 200" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
</svg>