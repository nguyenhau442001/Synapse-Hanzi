<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Illustration: 客房 (Hotel Guest Room / Room Interior) -->
  <g transform="translate(30, 40)">
    <!-- Room Background / Wall -->
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#242933"/>
    
    <!-- Floor -->
    <rect x="0" y="110" width="180" height="20" fill="#1E222A"/>

    <!-- Window with Sea View Horizon & Sun/Moon -->
    <rect x="115" y="20" width="50" height="60" rx="4" fill="#14171E" stroke="#2F3642" stroke-width="2"/>
    <!-- Sea View -->
    <path d="M 117 55 Q 130 50, 145 55 T 163 55 L 163 78 L 117 78 Z" fill="#2A4B6B"/>
    <!-- Sun/Moon in window -->
    <circle cx="140" cy="38" r="8" fill="#E5A93B"/>

    <!-- Bed Frame & Mattress -->
    <rect x="15" y="70" width="80" height="45" rx="4" fill="#303846"/>
    <!-- Pillows -->
    <rect x="20" y="73" width="22" height="14" rx="3" fill="#E6EDF5"/>
    <rect x="46" y="73" width="22" height="14" rx="3" fill="#E6EDF5"/>
    <!-- Blanket / Duvet -->
    <path d="M 15 87 L 95 87 L 95 115 L 15 115 Z" fill="#4B566A"/>
    <!-- Bed Accent Fold -->
    <rect x="15" y="100" width="80" height="15" fill="#E5A93B" opacity="0.85"/>

    <!-- Bedside Table -->
    <rect x="100" y="85" width="12" height="30" rx="2" fill="#3A4454"/>
    <!-- Lamp on Bedside Table -->
    <path d="M 104 75 L 108 75 L 110 85 L 102 85 Z" fill="#E6EDF5"/>
    <line x1="106" y1="70" x2="106" y2="75" stroke="#E5A93B" stroke-width="2"/>
    <circle cx="106" cy="68" r="3" fill="#E5A93B"/>

    <!-- Wall Art / Modern Painting -->
    <rect x="25" y="22" width="35" height="30" rx="3" fill="#2F3642"/>
    <circle cx="42" cy="37" r="8" fill="#E5A93B" opacity="0.7"/>
    <path d="M 28 45 L 38 35 L 48 45 Z" fill="#4B566A"/>

    <!-- Warm Ambient Light Glow (representing smart luxury hospitality) -->
    <path d="M 0 0 L 180 0 L 180 130 L 0 130 Z" fill="none" stroke="#E5A93B" stroke-width="1.5" stroke-opacity="0.25" rx="8"/>
  </g>
</svg>