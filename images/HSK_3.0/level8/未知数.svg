<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle cosmic background grid/dots -->
  <circle cx="60" cy="50" r="1" fill="#3A4252"/>
  <circle cx="180" cy="70" r="1.5" fill="#3A4252"/>
  <circle cx="90" cy="190" r="1" fill="#3A4252"/>
  <circle cx="170" cy="180" r="1" fill="#3A4252"/>
  <circle cx="40" cy="130" r="1.5" fill="#3A4252"/>
  <circle cx="205" cy="130" r="1" fill="#3A4252"/>

  <!-- Scientific instrument / Deep space probe base silhouette -->
  <g transform="translate(0, 5)">
    <!-- Satellite body -->
    <path d="M105 110 L135 110 L140 145 L100 145 Z" fill="#2D3748"/>
    <rect x="108" y="115" width="24" height="25" rx="3" fill="#1A202C"/>
    <!-- Dish / Sensor head -->
    <path d="M95 110 C95 95 145 95 145 110 Z" fill="#4A5568"/>
    <circle cx="120" cy="103" r="3" fill="#63B3ED"/>
    <!-- Solar panels left -->
    <rect x="50" y="115" width="45" height="22" rx="2" fill="#2B6CB0"/>
    <line x1="65" y1="115" x2="65" y2="137" stroke="#1A365D" stroke-width="1.5"/>
    <line x1="80" y1="115" x2="80" y2="137" stroke="#1A365D" stroke-width="1.5"/>
    <!-- Solar panels right -->
    <rect x="145" y="115" width="45" height="22" rx="2" fill="#2B6CB0"/>
    <line x1="160" y1="115" x2="160" y2="137" stroke="#1A365D" stroke-width="1.5"/>
    <line x1="175" y1="115" x2="175" y2="137" stroke="#1A365D" stroke-width="1.5"/>
    <!-- Thruster nozzle -->
    <path d="M110 145 L130 145 L125 155 L115 155 Z" fill="#718096"/>
  </g>

  <!-- Central iconic physical object: The "Unknown" (A metallic, enigmatic physics containment orb floating above the probe, glowing with high-energy mysteries) -->
  <g transform="translate(0, -5)">
    <!-- Outer containment ring / magnetic field lines (physical object representation) -->
    <ellipse cx="120" cy="95" rx="42" ry="16" fill="none" stroke="#ED8936" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
    <ellipse cx="120" cy="95" rx="28" ry="32" fill="none" stroke="#ED8936" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Central mysterious core orb -->
    <circle cx="120" cy="95" r="22" fill="#1A202C" stroke="#CBD5E0" stroke-width="2"/>
    
    <!-- Physical question-mark shaped metallic core cut out / glowing element inside the orb -->
    <path d="M113 85 C113 80 127 80 127 88 C127 94 117 93 117 101" fill="none" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
    <circle cx="117" cy="111" r="2.5" fill="#F6AD55"/>

    <!-- Energy beam linking probe to the unknown variable -->
    <path d="M120 100 L120 115" stroke="#63B3ED" stroke-width="2" stroke-dasharray="2 2" opacity="0.7"/>
  </g>

  <!-- Extreme environment indicators (Thermal waves / Cosmic particles) -->
  <path d="M35 75 Q45 70 55 75 T75 75" fill="none" stroke="#E53E3E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M165 75 Q175 70 185 75 T205 75" fill="none" stroke="#3182CE" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <circle cx="45" cy="165" r="2" fill="#E53E3E" opacity="0.8"/>
  <circle cx="195" cy="155" r="1.5" fill="#3182CE" opacity="0.8"/>
  <circle cx="180" cy="195" r="2" fill="#E53E3E" opacity="0.6"/>
  <circle cx="55" cy="185" r="1.5" fill="#3182CE" opacity="0.6"/>
</svg>