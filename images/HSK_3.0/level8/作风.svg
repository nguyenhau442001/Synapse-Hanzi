<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(40, 40)">
    <!-- Desk Surface -->
    <path d="M0 130 L160 130 L150 150 L10 150 Z" fill="#2D343E"/>
    
    <!-- Document Stack (Representing Work/Lề lối) -->
    <rect x="30" y="100" width="100" height="30" rx="2" fill="#3D4756"/>
    <rect x="35" y="90" width="90" height="10" rx="2" fill="#5D6B82"/>
    <rect x="40" y="80" width="80" height="10" rx="2" fill="#7D8CA3"/>
    
    <!-- Fountain Pen (Representing Professionalism/Action) -->
    <path d="M130 110 L155 85 L165 95 L140 120 Z" fill="#FFB84D"/>
    <path d="M150 90 L160 100" stroke="#1A1D24" stroke-width="2"/>
    
    <!-- Magnifying Glass (Representing "求真" - Seeking Truth) -->
    <circle cx="50" cy="50" r="25" fill="none" stroke="#FFB84D" stroke-width="6"/>
    <path d="M68 68 L90 90" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="10" fill="none" stroke="#FFB84D" stroke-width="3"/>
    
    <!-- Checklist Mark (Representing "务实" - Pragmatism) -->
    <path d="M100 30 L110 40 L130 20" fill="none" stroke="#FFB84D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>