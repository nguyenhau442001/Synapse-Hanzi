<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground Team Member -->
  <g transform="translate(60, 120)">
    <path d="M20 80 L60 80 L55 40 L25 40 Z" fill="#FF9F1C"/>
    <circle cx="40" cy="30" r="15" fill="#E0E0E0"/>
    <path d="M30 50 L35 70 M50 50 L45 70" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Air Team Member (Helicopter Pilot) -->
  <g transform="translate(140, 80)">
    <path d="M10 20 L50 20 L45 60 L15 60 Z" fill="#4A90E2"/>
    <circle cx="30" cy="10" r="15" fill="#E0E0E0"/>
    <path d="M0 15 L60 15" stroke="#FF9F1C" stroke-width="3"/>
  </g>

  <!-- Integrated Data/Connection Link -->
  <path d="M85 110 C 100 80, 120 80, 135 100" stroke="#FF9F1C" stroke-width="4" fill="none" stroke-dasharray="6 6"/>
  
  <!-- Central Coordination Point (Map/Tablet) -->
  <rect x="90" y="140" width="60" height="40" rx="4" fill="#2C3E50" stroke="#FF9F1C" stroke-width="2"/>
  <path d="M100 150 L140 150 M100 160 L130 160 M100 170 L120 170" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
</svg>