<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person A (Left) -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="-40" r="15" fill="#FFB84D"/>
    <path d="M-25 0 L25 0 L20 60 L-20 60 Z" fill="#4D88FF"/>
    <path d="M-15 10 L-35 35" stroke="#FFB84D" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Person B (Right) -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="-40" r="15" fill="#FF6B6B"/>
    <path d="M-25 0 L25 0 L20 60 L-20 60 Z" fill="#5D6D7E"/>
    <path d="M15 10 L35 35" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Central Conflict Point (The "Dispute" object/interaction) -->
  <g transform="translate(120, 100)">
    <path d="M-15 -10 L15 10 M-15 10 L15 -10" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#FFB84D" stroke-width="4" stroke-dasharray="8 8"/>
  </g>
  
  <!-- Ground line -->
  <line x1="30" y1="180" x2="210" y2="180" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>
</svg>