<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Counter/Kitchen Surface Base -->
  <rect x="30" y="165" width="180" height="15" rx="3" fill="#2D323E"/>
  
  <!-- Microwave Oven Body -->
  <rect x="50" y="60" width="140" height="105" rx="12" fill="#2E3544"/>
  <rect x="56" y="66" width="128" height="93" rx="8" fill="#222733"/>
  
  <!-- Microwave Glass Door -->
  <rect x="64" y="74" width="82" height="77" rx="6" fill="#1A1D24"/>
  <!-- Interior Turntable & Plate -->
  <rect x="85" y="132" width="40" height="6" rx="3" fill="#3E4452"/>
  <circle cx="105" cy="115" r="16" fill="none" stroke="#FFA726" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>
  
  <!-- Heating Wave Effects inside window -->
  <path d="M 85 98 Q 95 90 105 98 T 125 98" fill="none" stroke="#FF7043" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 85 112 Q 95 104 105 112 T 125 112" fill="none" stroke="#FF7043" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Control Panel (Right side) -->
  <rect x="154" y="74" width="22" height="77" rx="4" fill="#29303D"/>
  
  <!-- Digital Display -->
  <rect x="160" y="82" width="10" height="14" rx="2" fill="#FFA726" opacity="0.9"/>
  
  <!-- Control Buttons / Touchpad grid -->
  <circle cx="165" cy="106" r="3" fill="#4E5668"/>
  <circle cx="165" cy="118" r="3" fill="#4E5668"/>
  <circle cx="165" cy="130" r="3" fill="#4E5668"/>
  
  <!-- Handle on Door -->
  <rect x="142" y="85" width="4" height="40" rx="2" fill="#E2E8F0"/>
  
  <!-- Ambient glow/accent representing microwave operation -->
  <circle cx="105" cy="112" r="28" fill="#FFA726" opacity="0.08" filter="blur(4px)"/>
</svg>