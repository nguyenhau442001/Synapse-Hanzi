<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(40, 45)">
    {/* Scientific model / structural framework representing the hypothesis/premise */}
    <g transform="translate(80, 50)">
      {/* Central node / core proposition */}
      <circle cx="0" cy="0" r="18" fill="#F39C12"/>
      <circle cx="0" cy="0" r="10" fill="#1A1D24"/>
      
      {/* Supporting nodes / logical branches */}
      <line x1="0" y1="0" x2="-45" y2="-35" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-45" cy="-35" r="12" fill="#3498DB"/>
      
      <line x1="0" y1="0" x2="45" y2="-35" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>
      <circle cx="45" cy="-35" r="12" fill="#3498DB"/>
      
      <line x1="0" y1="0" x2="-35" y2="35" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-35" cy="35" r="10" fill="#95A5A6"/>
      
      <line x1="0" y1="0" x2="35" y2="35" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>
      <circle cx="35" cy="35" r="10" fill="#95A5A6"/>
    </g>

    {/* Platform / foundation base representing the assumed premise */}
    <path d="M 15 110 L 145 110 C 145 110, 150 125, 135 130 L 25 130 C 10 125, 15 110, 15 110 Z" fill="#2C3E50"/>
    <rect x="35" y="130" width="90" height="8" rx="4" fill="#4E5D6C"/>

    {/* Floating dotted construction lines indicating provisional / temporary scaffolding status */}
    <path d="M 35 15 C 80 -5, 125 15, 125 15" fill="none" stroke="#F39C12" stroke-width="3" stroke-dasharray="6,6" opacity="0.8"/>
    
    {/* Magnifying lens evaluating the premise */}
    <g transform="translate(105, 75)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ECF0F1" stroke-width="4"/>
      <circle cx="0" cy="0" r="18" fill="#3498DB" opacity="0.2"/>
      <line x1="15" y1="15" x2="32" y2="32" stroke="#ECF0F1" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>