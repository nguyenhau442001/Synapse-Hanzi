<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Decorative autumn leaves (representing 金秋十月) -->
    <path d="M45 65 Q 55 55, 65 65 Q 55 75, 45 65" fill="#D97706" opacity="0.4"/>
    <path d="M195 165 Q 205 155, 215 165 Q 205 175, 195 165" fill="#D97706" opacity="0.4"/>
    <path d="M185 50 Q 193 42, 201 50 Q 193 58, 185 50" fill="#F59E0B" opacity="0.5"/>
    <path d="M50 180 Q 58 172, 66 180 Q 58 188, 50 180" fill="#F59E0B" opacity="0.5"/>

    <!-- Crab Shadow/Glow -->
    <ellipse cx="120" cy="142" rx="55" ry="18" fill="#111318" opacity="0.6"/>

    <!-- Left Walking Legs -->
    <path d="M90 120 C 65 105, 50 115, 38 135 C 50 135, 65 130, 85 130 Z" fill="#D97706"/>
    <path d="M92 133 C 65 125, 48 140, 35 165 C 48 162, 65 150, 88 140 Z" fill="#D97706"/>
    <path d="M96 145 C 72 145, 55 165, 45 190 C 58 183, 75 170, 93 150 Z" fill="#D97706"/>

    <!-- Right Walking Legs -->
    <path d="M150 120 C 175 105, 190 115, 202 135 C 190 135, 175 130, 155 130 Z" fill="#D97706"/>
    <path d="M148 133 C 175 125, 192 140, 205 165 C 192 162, 175 150, 152 140 Z" fill="#D97706"/>
    <path d="M144 145 C 168 145, 185 165, 195 190 C 182 183, 165 170, 147 150 Z" fill="#D97706"/>

    <!-- Main Shell (Carapace) -->
    <path d="M 80 125 
             C 70 100, 90 75, 120 75 
             C 150 75, 170 100, 160 125 
             C 165 145, 150 160, 120 160 
             C 90 160, 75 145, 80 125 Z" 
          fill="#EF4444"/>
          
    <!-- Carapace Ridges/Details (Flat Modern Style) -->
    <path d="M100 90 Q 120 85, 140 90" stroke="#F87171" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M92 103 Q 120 95, 148 103" stroke="#F87171" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M88 116 Q 120 108, 152 116" stroke="#F87171" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Carapace Spines/Bumps (Top Edge) -->
    <polygon points="105,76 110,70 115,76" fill="#DC2626"/>
    <polygon points="125,76 130,70 135,76" fill="#DC2626"/>
    <polygon points="85,87 80,82 89,84" fill="#DC2626"/>
    <polygon points="155,87 160,82 151,84" fill="#DC2626"/>

    <!-- Eyes -->
    <circle cx="108" cy="74" r="5" fill="#1A1D24"/>
    <circle cx="108" cy="74" r="2" fill="#FFFFFF"/>
    <circle cx="132" cy="74" r="5" fill="#1A1D24"/>
    <circle cx="132" cy="74" r="2" fill="#FFFFFF"/>
    
    <!-- Eye Stalks -->
    <rect x="106" y="73" width="4" height="8" rx="2" fill="#EF4444"/>
    <rect x="130" y="73" width="4" height="8" rx="2" fill="#EF4444"/>

    <!-- Left Pincer Arm -->
    <path d="M 95 110 
             C 75 95, 60 105, 50 90 
             C 40 75, 55 60, 75 80 
             C 85 90, 95 105, 95 110 Z" 
          fill="#F59E0B"/>
    <!-- Left Pincer Claws -->
    <path d="M 50 90 C 40 80, 35 90, 42 102 C 45 98, 48 95, 50 90 Z" fill="#D97706"/>
    <path d="M 50 90 C 38 95, 38 105, 48 105 C 48 100, 49 95, 50 90 Z" fill="#F59E0B"/>

    <!-- Right Pincer Arm -->
    <path d="M 145 110 
             C 165 95, 180 105, 190 90 
             C 200 75, 185 60, 165 80 
             C 155 90, 145 105, 145 110 Z" 
          fill="#F59E0B"/>
    <!-- Right Pincer Claws -->
    <path d="M 190 90 C 200 80, 205 90, 198 102 C 195 98, 192 95, 190 90 Z" fill="#D97706"/>
    <path d="M 190 90 C 202 95, 202 105, 192 105 C 192 100, 191 95, 190 90 Z" fill="#F59E0B"/>
  </g>
</svg>