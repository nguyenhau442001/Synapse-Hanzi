<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Speed lines background effect -->
  <g opacity="0.2">
    <line x1="30" y1="120" x2="90" y2="120" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
    <line x1="150" y1="120" x2="210" y2="120" stroke="#FFC107" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="95" x2="80" y2="95" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="160" y1="145" x2="200" y2="145" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="50" y1="145" x2="70" y2="145" stroke="#FF5722" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Ground Track Line -->
  <path d="M 20 165 L 220 165" stroke="#2C323D" stroke-width="4" stroke-linecap="round"/>
  <rect x="50" y="167" width="20" height="3" fill="#3E4553" rx="1"/>
  <rect x="110" y="167" width="20" height="3" fill="#3E4553" rx="1"/>
  <rect x="170" y="167" width="20" height="3" fill="#3E4553" rx="1"/>

  <!-- Formula Racing Car Group (赛车) -->
  <g transform="translate(0, 0)">
    <!-- Rear Wing -->
    <path d="M 50 120 L 70 120 L 68 135 L 52 135 Z" fill="#2C323D"/>
    <rect x="48" y="117" width="24" height="4" rx="2" fill="#FF5722"/>
    <line x1="56" y1="125" x2="64" y2="125" stroke="#1A1D24" stroke-width="2"/>

    <!-- Rear Wheel -->
    <circle cx="75" cy="142" r="18" fill="#1A1D24"/>
    <circle cx="75" cy="142" r="11" fill="#2C323D"/>
    <circle cx="75" cy="142" r="5" fill="#FFC107"/>

    <!-- Front Wheel -->
    <circle cx="175" cy="142" r="16" fill="#1A1D24"/>
    <circle cx="175" cy="142" r="10" fill="#2C323D"/>
    <circle cx="175" cy="142" r="4" fill="#FFC107"/>

    <!-- Main Chassis / Body (Sleek aerodynamic profile) -->
    <!-- Lower aerodynamic floor -->
    <path d="M 60 148 L 190 148 L 195 142 L 55 142 Z" fill="#E64A19"/>
    
    <!-- Main red body -->
    <path d="M 70 138 C 90 138, 120 130, 155 130 C 175 130, 185 135, 195 142 L 65 142 Z" fill="#FF5722"/>

    <!-- Cockpit Cowling & Windscreen -->
    <path d="M 115 130 L 135 110 L 155 130 Z" fill="#2C323D"/>
    <path d="M 125 128 L 135 114 L 145 128 Z" fill="#434D5B"/>

    <!-- Driver Helmet visible in cockpit -->
    <circle cx="135" cy="116" r="6" fill="#FFC107"/>
    <path d="M 132 116 L 138 116 L 138 119 L 132 119 Z" fill="#1A1D24"/>

    <!-- Front Nose Cone -->
    <path d="M 170 135 L 210 143 L 170 148 Z" fill="#FF5722"/>
    <rect x="207" y="141" width="5" height="3" rx="1.5" fill="#FFFFFF"/>

    <!-- Racing Decals / Stripe Accents -->
    <path d="M 90 136 L 110 136 L 105 142 L 85 142 Z" fill="#FFC107"/>
    <circle cx="115" cy="138" r="4" fill="#FFFFFF"/>
    
    <!-- Exhaust flame/glow for high speed effect -->
    <path d="M 48 132 C 40 133, 30 135, 22 136 C 30 137, 40 139, 48 140 Z" fill="#FFC107"/>
    <path d="M 52 134 C 46 135, 38 136, 30 136 C 38 136, 46 137, 52 138 Z" fill="#FFFFFF"/>
  </g>

  <!-- Speed Motion Blur Streaks in front -->
  <g opacity="0.5">
    <line x1="215" y1="110" x2="230" y2="110" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
    <line x1="205" y1="125" x2="235" y2="125" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="210" y1="155" x2="225" y2="155" stroke="#FF5722" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>