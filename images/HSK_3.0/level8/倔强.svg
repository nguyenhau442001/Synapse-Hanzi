<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric details: Dark windy storm background -->
  <!-- Wind streaks -->
  <path d="M20 70 L90 60" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M120 40 L190 30" stroke="#3A4454" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M40 120 L110 110" stroke="#3A4454" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M140 90 L220 75" stroke="#3A4454" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Rain drops -->
  <line x1="75" y1="50" x2="65" y2="80" stroke="#4A5568" stroke-width="1.5" opacity="0.7"/>
  <line x1="105" y1="30" x2="95" y2="60" stroke="#4A5568" stroke-width="1.5" opacity="0.7"/>
  <line x1="165" y1="50" x2="155" y2="80" stroke="#4A5568" stroke-width="1.5" opacity="0.7"/>
  <line x1="45" y1="90" x2="35" y2="120" stroke="#4A5568" stroke-width="1.5" opacity="0.7"/>
  <line x1="195" y1="100" x2="185" y2="130" stroke="#4A5568" stroke-width="1.5" opacity="0.7"/>

  <!-- Cliff / Rock edge -->
  <path d="M 10 210 L 140 210 L 140 190 L 230 185 L 230 240 L 10 240 Z" fill="#2C323D"/>
  <path d="M 80 195 L 140 190 L 230 185 L 230 200 L 130 205 L 80 195 Z" fill="#3B424E"/>
  <!-- Cliff edge highlight -->
  <path d="M 78 194 L 140 189 L 230 184" stroke="#525B6C" stroke-width="2" fill="none"/>

  <!-- The Resilient Young Pine Tree (Juéjiàng / Quật cường) -->
  <!-- Main trunk bending forcefully against the wind (curving left due to wind blowing from right, but apex stubbornly defiant pointing upright) -->
  <path d="M 115 192 C 110 160, 95 130, 85 105 C 80 92, 78 80, 85 65" stroke="#8A5A36" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 112 192 C 107 160, 92 130, 82 105 C 77 92, 75 80, 82 65" stroke="#A7744E" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Stubborn Pine Needles / Foliage - Vibrant glowing green/gold representing life force -->
  <g>
    <!-- Lower cluster -->
    <path d="M 85 105 C 65 105, 55 95, 60 85 C 65 75, 85 85, 90 95 Z" fill="#2E7D32"/>
    <path d="M 88 100 C 70 100, 60 92, 65 84 C 70 76, 85 84, 90 92 Z" fill="#4CAF50"/>

    <!-- Middle cluster -->
    <path d="M 83 85 C 60 80, 50 65, 62 55 C 74 45, 88 65, 85 75 Z" fill="#2E7D32"/>
    <path d="M 82 82 C 63 78, 55 65, 65 57 C 75 49, 85 65, 84 73 Z" fill="#4CAF50"/>

    <!-- Apex (Proudly defiant, thrusting upward against all odds) -->
    <path d="M 85 65 C 75 45, 80 25, 95 20 C 110 15, 115 35, 100 50 Z" fill="#388E3C"/>
    <path d="M 85 63 C 78 47, 83 30, 95 24 C 107 18, 110 35, 98 48 Z" fill="#66BB6A"/>
    
    <!-- Accent highlight on the top crown for sharp focal impact -->
    <path d="M 95 24 C 102 22, 108 30, 102 42 C 98 46, 94 45, 95 24 Z" fill="#A5D6A7" opacity="0.8"/>
  </g>

  <!-- Small stubborn root gripping the rock firmly -->
  <path d="M 115 192 C 122 195, 135 194, 142 191" stroke="#6E4426" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 110 191 C 105 198, 95 199, 88 196" stroke="#6E4426" stroke-width="3" stroke-linecap="round" fill="none"/>

</svg>