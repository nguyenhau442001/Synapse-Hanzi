<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Details -->
  <circle cx="120" cy="115" r="65" fill="#252A34"/>
  <path d="M 60 175 L 180 175" stroke="#2F3643" stroke-width="3" stroke-linecap="round"/>

  <!-- Stray Kitten -->
  <g transform="translate(110, 130)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="14" ry="10" fill="#E59866"/>
    <!-- Head -->
    <circle cx="-8" cy="8" r="10" fill="#E59866"/>
    <!-- Ears -->
    <polygon points="-15,2 -13,-4 -8,2" fill="#E59866"/>
    <polygon points="-5,2 0,-4 -3,4" fill="#E59866"/>
    <!-- Tail -->
    <path d="M 12 20 C 20 20 22 10 20 5" fill="none" stroke="#E59866" stroke-width="3" stroke-linecap="round"/>
    <!-- Paws -->
    <circle cx="-12" cy="28" r="3" fill="#E59866"/>
    <circle cx="-4" cy="28" r="3" fill="#E59866"/>
  </g>

  <!-- Protective / Caring Human Hands (Representing '忍心' - holding back harshness, unable to ignore) -->
  <g>
    <!-- Left Cupping Hand -->
    <path d="M 65 145 C 60 145 52 135 55 120 C 58 105 70 95 85 90 C 80 100 75 110 75 125 C 75 135 70 145 65 145 Z" fill="#F39C12"/>
    <!-- Left Fingers -->
    <path d="M 85 90 C 95 95 102 102 105 108 C 98 108 92 106 88 102" fill="none" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Cupping Hand -->
    <path d="M 175 145 C 180 145 188 135 185 120 C 182 105 170 95 155 90 C 160 100 165 110 165 125 C 165 135 170 145 175 145 Z" fill="#F39C12"/>
    <!-- Right Fingers -->
    <path d="M 155 90 C 145 95 138 102 135 108 C 142 108 148 106 152 102" fill="none" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Empathy / Warm Connection Aura (Subtle dots/sparks of care) -->
  <circle cx="120" cy="95" r="2" fill="#F1C40F" opacity="0.8"/>
  <circle cx="100" cy="85" r="1.5" fill="#F1C40F" opacity="0.6"/>
  <circle cx="140" cy="85" r="1.5" fill="#F1C40F" opacity="0.6"/>

  <!-- UI Label / Frame Accent -->
  <text x="120" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#8C9EA3" text-anchor="middle" letter-spacing="1">ĐÀNH LÒNG • NHẪN TÂM</text>
</svg>