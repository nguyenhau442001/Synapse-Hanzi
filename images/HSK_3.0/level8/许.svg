<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptualizing "许" (Promise/Commitment) via a formal handshake gesture -->
  <!-- Representing the act of making a solemn promise/commitment -->
  
  <!-- Hand 1 (The Promiser) -->
  <path d="M120 140 C 120 120, 130 110, 145 110 L 160 110 C 175 110, 185 120, 185 140 L 185 180 L 120 180 Z" fill="#FFB84D"/>
  <path d="M145 110 L 145 100 C 145 90, 155 90, 155 100 L 155 110" fill="#FFB84D"/>
  
  <!-- Hand 2 (The Receiver/Agreement) -->
  <path d="M55 140 C 55 120, 65 110, 80 110 L 95 110 C 110 110, 120 120, 120 140 L 120 180 L 55 180 Z" fill="#FFD699"/>
  <path d="M80 110 L 80 100 C 80 90, 90 90, 90 100 L 90 110" fill="#FFD699"/>
  
  <!-- Connecting lines/cuff details for professional context -->
  <rect x="50" y="180" width="140" height="15" rx="2" fill="#3A3F4B"/>
  
  <!-- Subtle accent to denote the "weight" of the promise -->
  <circle cx="120" cy="100" r="4" fill="#FFB84D"/>
  <path d="M110 90 L 130 90" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
</svg>