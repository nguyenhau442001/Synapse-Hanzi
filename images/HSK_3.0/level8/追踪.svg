<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle tech grid background elements -->
  <g opacity="0.15" stroke="#4A90E2" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="30" y1="120" x2="210" y2="120" />
    <line x1="120" y1="30" x2="120" y2="210" />
    <circle cx="120" cy="120" r="70" fill="none" />
    <circle cx="120" cy="120" r="40" fill="none" />
  </g>

  <!-- Satellite / Tracking Source (Top Right) -->
  <g transform="translate(160, 45)">
    <circle cx="0" cy="0" r="10" fill="#2C323D"/>
    <path d="M-8 -3 L-14 -8 M8 -3 L14 -8 M-5 5 L-10 12 M5 5 L10 12" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#F5A623"/>
    <!-- Signal beams pointing down-left -->
    <path d="M-12 12 L-40 40 M-6 18 L-34 52" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  </g>

  <!-- Escape trajectory / Tracking path (Dotted Red/Orange curve) -->
  <path d="M 55 170 Q 90 90, 160 85" fill="none" stroke="#FF5C5C" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- Target Object: Sleek Modern Sedan / Car (The subject being tracked) -->
  <g transform="translate(130, 70)">
    <!-- Car shadow -->
    <ellipse cx="25" cy="30" rx="30" ry="6" fill="#0D0E12" opacity="0.6"/>
    
    <!-- Car Body -->
    <path d="M 5 22 L 15 12 L 35 12 L 45 22 L 52 22 C 55 22, 57 24, 55 27 L 50 30 L 10 30 L 5 27 C 3 24, 5 22, 5 22 Z" fill="#2E5BFF"/>
    
    <!-- Windows & Roof -->
    <path d="M 17 13 L 23 6 L 33 6 L 39 13 Z" fill="#1A1D24"/>
    
    <!-- Wheels -->
    <circle cx="16" cy="28" r="5" fill="#111318"/>
    <circle cx="16" cy="28" r="2" fill="#8892B0"/>
    <circle cx="42" cy="28" r="5" fill="#111318"/>
    <circle cx="42" cy="28" r="2" fill="#8892B0"/>
    
    <!-- Headlight / Taillight glow -->
    <circle cx="6" cy="24" r="1.5" fill="#FFEB3B"/>
    <circle cx="50" cy="24" r="1.5" fill="#FF5C5C"/>
  </g>

  <!-- GPS Pin / Tracking Marker over the vehicle -->
  <g transform="translate(150, 48)">
    <path d="M0 0 C-6 0 -10 -4 -10 -10 C-10 -16 0 -26 0 -26 C0 -26 10 -16 10 -10 C10 -4 6 0 0 0 Z" fill="#FF5C5C"/>
    <circle cx="0" cy="-10" r="3.5" fill="#1A1D24"/>
    <!-- Pulse ring under pin -->
    <ellipse cx="0" cy="2" rx="6" ry="2.5" fill="#FF5C5C" opacity="0.6"/>
  </g>

  <!-- Historical Tracking Waypoints (Footprints / Dots along the path) -->
  <g fill="#F5A623">
    <circle cx="65" cy="155" r="3"/>
    <circle cx="85" cy="130" r="3.5"/>
    <circle cx="110" cy="105" r="4"/>
  </g>

  <!-- Magnifier / Scope frame (Foreground UI element emphasizing tracking/investigation) -->
  <g transform="translate(85, 125)">
    <!-- Magnifier Glass Circle -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#F5A623" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="0" r="32" fill="#4A90E2" fill-opacity="0.08"/>
    
    <!-- Crosshair inside magnifier -->
    <path d="M-8 0 L8 0 M0 -8 L0 8" stroke="#F5A623" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Magnifier Handle -->
    <path d="M 22 22 L 40 40" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Small digital target brackets around the vehicle path -->
  <g stroke="#4A90E2" stroke-width="1.5" fill="none">
    <!-- Top-left bracket -->
    <path d="M 60 75 L 50 75 L 50 85"/>
    <!-- Bottom-right bracket -->
    <path d="M 180 100 L 190 100 L 190 90"/>
  </g>
</svg>