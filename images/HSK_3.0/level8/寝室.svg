  <line x1="180" y1="50" x2="180" y2="105" stroke="#1A1D24" stroke-width="2"/>
  <line x1="165" y1="77" x2="195" y2="77" stroke="#1A1D24" stroke-width="2"/>

  <!-- Study Desk and Lamp (referencing late night study context) -->
  <rect x="145" y="150" width="60" height="8" rx="2" fill="#3A4454"/>
