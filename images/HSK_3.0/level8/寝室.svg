<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Elements (Dorm Room Interior at Night) -->
  <rect x="24" y="24" width="192" height="192" rx="16" fill="#222733"/>
  
  <!-- Window with Night Sky -->
  <path d="M165 50H195V105H165V50Z" fill="#151821"/>
