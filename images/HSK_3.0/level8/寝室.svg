  <!-- Main Object: Bunk Bed / Dorm Bed (Representing 寝室 - Bedroom/Dormitory) -->
  <!-- Bed Frame -->
  <rect x="45" y="90" width="100" height="110" rx="4" fill="#2C3440"/>
  <rect x="52" y="97" width="86" height="96" fill="#333B4A"/>
  
  <!-- Mattress / Bedding -->
  <rect x="56" y="125" width="78" height="64" rx="6" fill="#4A5568"/>
  
  <!-- Pillow -->
  <rect x="62" y="105" width="30" height="16" rx="6" fill="#E2E8F0"/>
  
  <!-- Cozy Blanket / Quilt with Accent Color -->
  <path d="M56 140H134V183C134 186.314 131.314 189 128 189H62C58.6863 189 56 186.314 56 183V140Z" fill="#3182CE"/>
  <path d="M56 160H134V183C134 186.314 131.314 189 128 189H62C58.6863 189 56 186.314 56 183V160Z" fill="#2B6CB0"/>
  
  <!-- Folded blanket trim / pillow accent (Orange/Gold focus color) -->
  <rect x="62" y="107" width="8" height="12" rx="3" fill="#F39C12"/>
