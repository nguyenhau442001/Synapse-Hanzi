  <!-- Bed Ladder -->
  <line x1="135" y1="95" x2="135" y2="195" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="95" x2="145" y2="195" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="115" x2="145" y2="115" stroke="#718096" stroke-width="2"/>
  <line x1="135" y1="135" x2="145" y2="135" stroke="#718096" stroke-width="2"/>
  <line x1="135" y1="155" x2="145" y2="155" stroke="#718096" stroke-width="2"/>
  <line x1="135" y1="175" x2="145" y2="175" stroke="#718096" stroke-width="2"/>

  <!-- Little Dorm Essentials: Slippers neatly placed beside bed -->
