<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Subtle background winding paths representing complexity/twists (周折) -->
    <path d="M 50 120 C 50 80, 90 80, 90 120 C 90 160, 150 160, 150 120 C 150 80, 190 80, 190 120" 
          fill="none" stroke="#2A2F3D" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>
    
    <!-- Main winding path in bright accent color showing a circuitous route -->
    <path d="M 60 170 Q 60 90, 120 90 T 180 170" 
          fill="none" stroke="#3A4254" stroke-width="12" stroke-linecap="round"/>
          
    <path d="M 60 170 C 60 110, 110 110, 120 120 C 130 130, 180 130, 180 70" 
          fill="none" stroke="#F39C12" stroke-width="4" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="1000;0" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- The physical lost document folder (证件) successfully recovered at the end of the twists -->
    <g transform="translate(150, 45)">
      <!-- Folder back -->
      <rect x="0" y="5" width="44" height="34" rx="4" fill="#E67E22"/>
      <path d="M 0 9 L 14 9 L 18 13 L 40 13 C 42.2 13, 44 14.8, 44 17 L 44 35 C 44 37.2, 42.2 39, 40 39 L 4 39 C 1.8 39, 0 37.2, 0 35 Z" fill="#D35400"/>
      <!-- Document inside sticking out -->
      <rect x="8" y="0" width="28" height="26" rx="2" fill="#FFFFFF"/>
      <!-- Abstract ID card elements -->
      <circle cx="15" cy="8" r="4" fill="#3A4254"/>
      <rect x="22" y="6" width="10" height="2" rx="1" fill="#95A5A6"/>
      <rect x="22" y="10" width="10" height="2" rx="1" fill="#95A5A6"/>
      <rect x="12" y="16" width="20" height="2" rx="1" fill="#BDC3C7"/>
      <rect x="12" y="20" width="14" height="2" rx="1" fill="#BDC3C7"/>
      <!-- Folder front flap -->
      <path d="M 0 17 C 0 14.8, 1.8 13, 4 13 L 40 13 C 42.2 13, 44 14.8, 44 17 L 44 35 C 44 37.2, 42.2 39, 40 39 L 4 39 C 1.8 39, 0 37.2, 0 35 Z" fill="#F39C12" opacity="0.9"/>
    </g>

    <!-- Starting point marker -->
    <circle cx="60" cy="170" r="8" fill="#2C3E50" stroke="#F39C12" stroke-width="3"/>
    <circle cx="60" cy="170" r="3" fill="#F39C12"/>

    <!-- Destination checkmark badge representing "失而复得" (finally recovered) -->
    <circle cx="180" cy="70" r="14" fill="#2ECC71"/>
    <path d="M 173 70 L 178 75 L 188 65" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>