<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Airport Terminal Floor/Background -->
  <path d="M0 180h240v60H0z" fill="#252932"/>
  <path d="M40 180l20-40h120l20 40" fill="#2D343E"/>
  
  <!-- Teacher (The one leaving) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#FFC107"/>
    <path d="M5 40h30l-5 60h-20z" fill="#4A90E2"/>
    <path d="M10 100h20v20h-20z" fill="#2D343E"/>
    <path d="M35 50l20 10" fill="none" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Students (The ones seeing off) -->
  <g transform="translate(60, 90)">
    <circle cx="20" cy="20" r="12" fill="#E0E0E0"/>
    <path d="M8 35h24l-5 50h-14z" fill="#FF9800"/>
    <path d="M15 85h10v25h-10z" fill="#2D343E"/>
    <path d="M5 45l-15 10" fill="none" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(90, 100)">
    <circle cx="20" cy="20" r="12" fill="#E0E0E0"/>
    <path d="M8 35h24l-5 50h-14z" fill="#FF9800"/>
    <path d="M15 85h10v25h-10z" fill="#2D343E"/>
    <path d="M35 45l15 10" fill="none" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Luggage -->
  <rect x="170" y="140" width="30" height="40" rx="4" fill="#795548"/>
  <path d="M175 135h20v5h-20z" fill="#5D4037"/>
  
  <!-- Departure Signage (Abstract) -->
  <path d="M20 30h60v20H20z" fill="#2D343E"/>
  <path d="M25 35h50v10H25z" fill="#FFC107"/>
</svg>