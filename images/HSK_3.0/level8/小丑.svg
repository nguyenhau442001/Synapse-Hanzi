<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Clown Hat -->
    <path d="M-40 -30 C-40 -70, -10 -90, 0 -90 C10 -90, 40 -70, 40 -30 Z" fill="#FFD700"/>
    <circle cx="0" cy="-90" r="8" fill="#FF5722"/>
    <path d="M-45 -30 L45 -30 L50 -20 L-50 -20 Z" fill="#FF5722"/>
    
    <!-- Face -->
    <ellipse cx="0" cy="10" rx="45" ry="40" fill="#FFF5E1"/>
    
    <!-- Hair -->
    <circle cx="-50" cy="0" r="15" fill="#FF5722"/>
    <circle cx="50" cy="0" r="15" fill="#FF5722"/>
    
    <!-- Eyes -->
    <path d="M-20 -5 A10 10 0 0 1 -5 -5 A10 10 0 0 1 -20 -5" fill="#1A1D24"/>
    <path d="M5 -5 A10 10 0 0 1 20 -5 A10 10 0 0 1 5 -5" fill="#1A1D24"/>
    
    <!-- Nose -->
    <circle cx="0" cy="15" r="10" fill="#FF5722"/>
    
    <!-- Mouth -->
    <path d="M-25 30 Q0 50 25 30" stroke="#FF5722" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Collar -->
    <path d="M-30 45 L-50 70 L-10 55 L0 80 L10 55 L50 70 L30 45 Z" fill="#FFD700"/>
  </g>
</svg>