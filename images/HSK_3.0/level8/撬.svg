<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Heavy Iron Door (Right side, slightly ajar/pried open) -->
    <path d="M120 20 L180 35 L180 165 L120 180 Z" fill="#2C3542" stroke="#4A5568" stroke-width="2"/>
    <!-- Door texture lines -->
    <line x1="135" y1="50" x2="165" y2="55" stroke="#3A4454" stroke-width="2"/>
    <line x1="135" y1="100" x2="165" y2="105" stroke="#3A4454" stroke-width="2"/>
    <line x1="135" y1="150" x2="165" y2="155" stroke="#3A4454" stroke-width="2"/>
    
    <!-- Door Frame / Wall Left Side -->
    <rect x="75" y="15" width="20" height="170" rx="2" fill="#1E242C" stroke="#2C3542" stroke-width="2"/>
    
    <!-- Rusty Deadbolt Lock & Hasp on Door -->
    <rect x="112" y="90" width="16" height="24" rx="3" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <circle cx="120" cy="102" r="3" fill="#78350F"/>
    
    <!-- Crowbar / Pry Tool (Physical Object Noun Representation) -->
    <!-- Curved prying end inserted into the gap, handle extending down-left -->
    <g transform="translate(95, 102) rotate(-25)">
      <!-- Main bar body -->
      <rect x="-70" y="-6" width="90" height="12" rx="3" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
      <!-- Highlight -->
      <rect x="-65" y="-4" width="80" height="4" rx="2" fill="#F8FAFC" opacity="0.6"/>
      <!-- Curved tip (claw) -->
      <path d="M 20 -6 L 32 -10 C 35 -11, 38 -8, 35 -5 L 20 6 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
      <!-- Orange rubber grip handle at the end -->
      <rect x="-70" y="-7" width="30" height="14" rx="4" fill="#F97316"/>
    </g>

    <!-- Action / Force Indicator lines (Showing the leverage/pry motion) -->
    <path d="M 60 125 C 70 115, 80 115, 85 110" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M 105 85 C 110 80, 115 75, 120 70" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Spark / Friction accents indicating mechanical effort -->
    <circle cx="115" cy="95" r="2" fill="#F59E0B"/>
    <circle cx="123" cy="85" r="1.5" fill="#FBBF24"/>
  </g>
</svg>