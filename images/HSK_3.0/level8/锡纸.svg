<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative shadow/glow for the object -->
  <ellipse cx="120" cy="140" rx="70" ry="25" fill="#111318"/>

  <!-- Unrolled Tin Foil Roll / Sheet (锡纸 - Aluminum foil) -->
  <g transform="translate(120, 115)">
    <!-- Base shadow for the sheet -->
    <path d="M-60,5 L-40,65 L60,40 L40,-15 Z" fill="#2A303C" opacity="0.5"/>

    <!-- The flat foil sheet part -->
    <path d="M-55,10 L-35,70 L55,45 L35,-15 Z" fill="url(#foilGradient)" stroke="#8FA3B8" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Creases and reflection lines on the sheet -->
    <path d="M-45,30 L25,10" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    <path d="M-30,50 L40,30" stroke="#FFFFFF" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
    <path d="M-50,20 L5,-5" stroke="#4A5A6D" stroke-width="1" opacity="0.5"/>

    <!-- Foil Roll Cylinder (Left/Back part) -->
    <g transform="translate(-35, -5)">
      <!-- Roll body -->
      <rect x="-25" y="-15" width="40" height="35" rx="6" fill="url(#rollGradient)" stroke="#8FA3B8" stroke-width="2"/>
      
      <!-- Inner cardboard core (visible side) -->
      <ellipse cx="-25" cy="2" rx="4" ry="11.5" fill="#4A3B32" stroke="#665245" stroke-width="1"/>
      <ellipse cx="-25" cy="2" rx="2" ry="7" fill="#2B211C"/>

      <!-- End of the roll cap / sheen -->
      <path d="M15,-15 C21,-15 21,20 15,20 Z" fill="#D6E4F0" opacity="0.4"/>
      
      <!-- Highlight stripe along the roll -->
      <path d="M-20,-10 L10,-10" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8" stroke-linecap="round"/>
      <path d="M-20,0 L10,0" stroke="#4A5A6D" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Ripped/Jagged edge effect on the right side of the sheet -->
    <path d="M35,-15 L40,-5 L38,5 L45,15 L41,25 L48,35 L55,45" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Floating metallic sparkle accents to indicate shiny foil material -->
  <g transform="translate(150, 65)" fill="#FACC15">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z"/>
  </g>
  <g transform="translate(75, 155)" fill="#93C5FD">
    <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="foilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="rollGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="20%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
</svg>