<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative warmth (spring sunlight / subtle rays) -->
  <path d="M120 40 L160 120 L80 120 Z" fill="#FFA726" opacity="0.03"/>
  <circle cx="120" cy="90" r="60" fill="#FFA726" opacity="0.04"/>

  <!-- Soil / Earth layer (rich fertile ground profile) -->
  <path d="M 40,160 Q 90,145 120,155 T 200,160 L 200,195 Q 120,205 40,195 Z" fill="#2E2522"/>
  <path d="M 40,158 Q 90,143 120,153 T 200,158 L 200,165 Q 120,175 40,165 Z" fill="#4E3B31"/>
  <!-- Soil surface contour -->
  <path d="M 40,160 Q 90,145 120,155 T 200,160" fill="none" stroke="#6D5344" stroke-width="2" stroke-linecap="round"/>

  <!-- Gently cupping protective hands (representing nurturing environment) -->
  <!-- Left hand -->
  <path d="M 50,170 C 65,185 85,185 95,175" fill="none" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Right hand -->
  <path d="M 190,170 C 175,185 155,185 145,175" fill="none" stroke="#FFB74D" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- The Sprout / Bud ("芽") - Central Focus -->
  <!-- Main stem -->
  <path d="M 120,160 Q 118,125 120,105" fill="none" stroke="#81C784" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left tender leaf / cotyledon -->
  <path d="M 120,120 Q 95,110 90,90 C 95,115 110,122 120,120 Z" fill="#A5D6A7"/>
  <path d="M 120,120 Q 102,112 90,90" fill="none" stroke="#C8E6C9" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right tender leaf / cotyledon (unfurling, catching the spring breeze) -->
  <path d="M 120,110 Q 148,98 152,78 C 145,102 128,110 120,110 Z" fill="#81C784"/>
  <path d="M 120,110 Q 138,100 152,78" fill="none" stroke="#A5D6A7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Apex bud (the fresh growing tip) -->
  <path d="M 120,105 Q 124,95 120,88 Q 116,95 120,105 Z" fill="#C8E6C9"/>

  <!-- Ambient light / Spring breeze accents -->
  <path d="M 60,85 Q 75,80 90,90" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 150,125 Q 165,120 180,130" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Warm highlight sparkling on top -->
  <circle cx="152" cy="78" r="3" fill="#FFF" opacity="0.6"/>
  <circle cx="90" cy="90" r="2.5" fill="#FFF" opacity="0.5"/>
</svg>