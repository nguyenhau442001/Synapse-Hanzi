<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Official Document / Decree Base -->
    <rect x="70" y="45" width="100" height="135" rx="6" fill="#2D333B" stroke="#484F58" stroke-width="2"/>
    
    <!-- Paper Header Accent -->
    <rect x="85" y="60" width="40" height="8" rx="4" fill="#388BFd"/>
    <circle cx="150" cy="64" r="4" fill="#F85149"/>

    <!-- Document Lines representing text/policy content -->
    <rect x="85" y="82" width="70" height="4" rx="2" fill="#8B949E"/>
    <rect x="85" y="96" width="55" height="4" rx="2" fill="#8B949E"/>
    <rect x="85" y="110" width="65" height="4" rx="2" fill="#8B949E"/>
    <rect x="85" y="124" width="45" height="4" rx="2" fill="#8B949E"/>

    <!-- Wax Seal / Official Stamp (Representing promulgation/release) -->
    <circle cx="135" cy="148" r="16" fill="#F0883E"/>
    <circle cx="135" cy="148" r="12" fill="#D16928"/>
    <path d="M129 148 L133 152 L142 143" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Action Waves / Radiating Public Attention (Visualizing "引起广泛关注") -->
    <!-- Top-left wave -->
    <path d="M 52 75 C 45 85 45 95 52 105" fill="none" stroke="#388BFD" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 40 65 C 30 80 30 95 40 115" fill="none" stroke="#388BFD" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Top-right wave -->
    <path d="M 188 75 C 195 85 195 95 188 105" fill="none" stroke="#388BFD" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 200 65 C 210 80 210 95 200 115" fill="none" stroke="#388BFD" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Focal / Sparkle Accents (Golden / Orange high contrast) -->
    <path d="M 60 45 L 63 52 L 70 55 L 63 58 L 60 65 L 57 58 L 50 55 L 57 52 Z" fill="#F0883E"/>
    <path d="M 180 38 L 182 43 L 187 45 L 182 47 L 180 52 L 178 47 L 173 45 L 178 43 Z" fill="#F0883E"/>
    <path d="M 195 130 L 197 134 L 201 136 L 197 138 L 195 142 L 193 138 L 189 136 L 193 134 Z" fill="#F0883E"/>
    <path d="M 45 140 L 46.5 143.5 L 50 145 L 46.5 146.5 L 45 150 L 43.5 146.5 L 40 145 L 43.5 143.5 Z" fill="#388BFD"/>

    <!-- Base Platform / Floor Line -->
    <line x1="60" y1="195" x2="180" y2="195" stroke="#30363D" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>