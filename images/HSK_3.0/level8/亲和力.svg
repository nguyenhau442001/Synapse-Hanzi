<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Teacher character -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-30 80 C-30 40, -10 30, 0 30 C10 30, 30 40, 30 80" fill="#F4F4F4"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="35" fill="#FFD1A9"/>
    <!-- Hair -->
    <path d="M-35 -10 C-35 -45, 35 -45, 35 -10 C35 15, 20 25, 0 25 C-20 25, -35 15, -35 -10" fill="#4A3728"/>
    <!-- Face: Warm smile and eyes -->
    <ellipse cx="-12" cy="-15" rx="3" ry="4" fill="#2D3436"/>
    <ellipse cx="12" cy="-15" rx="3" ry="4" fill="#2D3436"/>
    <path d="M-10 5 C-5 12, 5 12, 10 5" stroke="#2D3436" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Arm reaching out to child -->
    <path d="M30 40 L55 55" stroke="#FFD1A9" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Child character -->
  <g transform="translate(180, 160)">
    <!-- Body -->
    <path d="M-15 50 C-15 25, -5 20, 0 20 C5 20, 15 25, 15 50" fill="#FFB84D"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#FFD1A9"/>
    <!-- Hair -->
    <path d="M-20 0 C-20 -25, 20 -25, 20 0" fill="#4A3728"/>
    <!-- Face: Happy expression -->
    <circle cx="-7" cy="-2" r="2" fill="#2D3436"/>
    <circle cx="7" cy="-2" r="2" fill="#2D3436"/>
    <path d="M-5 8 C-2 12, 2 12, 5 8" stroke="#2D3436" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Hand reaching to teacher -->
    <path d="M-15 30 L-35 45" stroke="#FFD1A9" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>