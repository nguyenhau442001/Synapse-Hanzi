<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person 1 (The Intervener) -->
  <g transform="translate(160, 120)">
    <circle cx="0" cy="-40" r="15" fill="#FFB84D"/>
    <path d="M-15 0 L15 0 L10 60 L-10 60 Z" fill="#FFB84D"/>
    <path d="M0 0 L-20 40" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 0 L20 40" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- The Intervening Hand/Gesture -->
  <path d="M130 120 L90 120" stroke="#FFB84D" stroke-width="12" stroke-linecap="round"/>
  <path d="M90 100 L90 140" stroke="#FFB84D" stroke-width="12" stroke-linecap="round"/>

  <!-- Person 2 (The Perpetrator) -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="-40" r="15" fill="#5D6D7E"/>
    <path d="M-15 0 L15 0 L10 60 L-10 60 Z" fill="#5D6D7E"/>
    <path d="M0 0 L-20 40" stroke="#5D6D7E" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 0 L20 40" stroke="#5D6D7E" stroke-width="8" stroke-linecap="round"/>
    <!-- The Object being stopped -->
    <rect x="-25" y="-10" width="20" height="15" fill="#AAB7B8"/>
  </g>
</svg>