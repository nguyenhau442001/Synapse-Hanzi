<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Modern Dark Theme Background Elements (subtle runway lights/horizon hint) -->
  <line x1="20" y1="180" x2="220" y2="180" stroke="#2A303C" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Aircraft (客机 - Commercial Airliner) -->
  <g transform="translate(120, 115)">
    <!-- Motion / Speed lines (subtle) -->
    <path d="M-90 30 L-70 30" stroke="#3A4454" stroke-width="2" stroke-linecap="round"/>
    <path d="M-80 40 L-60 40" stroke="#3A4454" stroke-width="2" stroke-linecap="round"/>

    <!-- Tail Wing (Back) -->
    <path d="M-55,-10 L-40,-30 L-25,-30 L-35,-10 Z" fill="#64748B"/>

    <!-- Main Fuselage -->
    <ellipse cx="0" cy="0" rx="75" ry="16" fill="#F1F5F9"/>
    
    <!-- Nose Cone (Rounded, sleek) -->
    <path d="M 60,-16 C 75,-16 78,0 78,0 C 78,0 75,16 60,16 Z" fill="#E2E8F0"/>

    <!-- Cockpit Windows -->
    <path d="M 50,-8 C 55,-8 60,-4 60,0 C 60,4 55,8 50,8 Z" fill="#3B82F6"/>

    <!-- Passenger Windows (Row of small sleek windows) -->
    <circle cx="35" cy="-4" r="2" fill="#1E293B"/>
    <circle cx="23" cy="-4" r="2" fill="#1E293B"/>
    <circle cx="11" cy="-4" r="2" fill="#1E293B"/>
    <circle cx="-1" cy="-4" r="2" fill="#1E293B"/>
    <circle cx="-13" cy="-4" r="2" fill="#1E293B"/>
    <circle cx="-25" cy="-4" r="2" fill="#1E293B"/>
    <circle cx="-37" cy="-4" r="2" fill="#1E293B"/>
    <circle cx="-49" cy="-4" r="2" fill="#1E293B"/>

    <!-- Airline Livery Stripe (Modern Accent) -->
    <path d="M-75,2 L60,8 L60,12 L-75,5 Z" fill="#F97316"/>

    <!-- Main Wing (Back layer / Far side) -->
    <path d="M-10,-5 L 15,-45 L 35,-45 L 10,-2 Z" fill="#CBD5E1"/>

    <!-- Main Wing (Front layer / Near side) -->
    <path d="M-15,4 L 10,52 L 35,52 L 15,10 Z" fill="#E2E8F0"/>
    <path d="M-10,6 L 8,42 L 28,42 L 12,10 Z" fill="#CBD5E1"/> <!-- Wing shadow detail -->

    <!-- Jet Engine (Under near wing) -->
    <path d="M-2,32 L 12,34 L 10,46 L -4,44 Z" fill="#64748B"/>
    <ellipse cx="5" cy="39" rx="3" ry="5" fill="#334155"/>

    <!-- Tail Fin (Vertical Stabilizer) -->
    <path d="M-55,-16 L-30,-55 L-10,-55 L-20,-16 Z" fill="#F1F5F9"/>
    <!-- Tail Fin Accent -->
    <path d="M-45,-35 L-22,-55 L-15,-55 L-35,-35 Z" fill="#F97316"/>

    <!-- Horizontal Stabilizer (Back tail wings) -->
    <path d="M-50,0 L-35,-20 L-25,-20 L-35,0 Z" fill="#CBD5E1"/>
    <path d="M-50,0 L-35,20 L-25,20 L-35,0 Z" fill="#E2E8F0"/>
  </g>
</svg>