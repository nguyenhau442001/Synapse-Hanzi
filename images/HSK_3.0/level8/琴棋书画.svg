<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle decorative circular background glow to anchor the iconic objects -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.6"/>

  <!-- Composition: 4 quadrants representing 琴 (Guqin/Music), 棋 (Go Board/Strategy), 书 (Calligraphy/Writing), 画 (Landscape Painting/Art) -->
  
  <!-- Top-Left Quadrant: 琴 (Guqin - Zither) -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="65" height="65" rx="8" fill="#2A303C"/>
    <!-- Guqin body -->
    <path d="M12 32 C 12 28, 52 26, 56 32 C 56 38, 12 36, 12 32 Z" fill="#D99B26"/>
    <!-- Strings -->
    <line x1="15" y1="30" x2="53" y2="30" stroke="#1A1D24" stroke-width="1.2"/>
    <line x1="15" y1="32" x2="53" y2="32" stroke="#1A1D24" stroke-width="1"/>
    <line x1="15" y1="34" x2="53" y2="34" stroke="#1A1D24" stroke-width="1.2"/>
    <!-- Tuning pegs -->
    <circle cx="15" cy="32" r="2.5" fill="#EAEAEA"/>
  </g>

  <!-- Top-Right Quadrant: 棋 (Weiqi / Go board & stones) -->
  <g transform="translate(130, 45)">
    <rect x="0" y="0" width="65" height="65" rx="8" fill="#2A303C"/>
    <!-- Go Board -->
    <rect x="14" y="14" width="37" height="37" rx="3" fill="#E5C185"/>
    <!-- Grid lines -->
    <line x1="22" y1="14" x2="22" y2="51" stroke="#C49A54" stroke-width="1"/>
    <line x1="32" y1="14" x2="32" y2="51" stroke="#C49A54" stroke-width="1"/>
    <line x1="42" y1="14" x2="42" y2="51" stroke="#C49A54" stroke-width="1"/>
    <line x1="14" y1="22" x2="51" y2="22" stroke="#C49A54" stroke-width="1"/>
    <line x1="14" y1="32" x2="51" y2="32" stroke="#C49A54" stroke-width="1"/>
    <line x1="14" y1="42" x2="51" y2="42" stroke="#C49A54" stroke-width="1"/>
    <!-- Go Stones -->
    <circle cx="22" cy="32" r="3.5" fill="#1A1D24"/>
    <circle cx="32" cy="22" r="3.5" fill="#EAEAEA"/>
    <circle cx="32" cy="32" r="3.5" fill="#1A1D24"/>
  </g>

  <!-- Bottom-Left Quadrant: 书 (Calligraphy brush & scroll) -->
  <g transform="translate(45, 130)">
    <rect x="0" y="0" width="65" height="65" rx="8" fill="#2A303C"/>
    <!-- Open scroll representation -->
    <rect x="14" y="18" width="37" height="29" rx="2" fill="#F4EAD2"/>
    <line x1="20" y1="25" x2="32" y2="25" stroke="#4A3B32" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="36" y2="32" stroke="#4A3B32" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="39" x2="28" y2="39" stroke="#4A3B32" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Calligraphy Brush -->
    <path d="M42 12 L 48 18 L 35 48 C 34 50, 32 52, 30 52 C 28 52, 32 46, 35 42 Z" fill="#D99B26"/>
    <path d="M30 52 C 28 52, 29 48, 35 42 L 40 47 C 34 50, 32 52, 30 52 Z" fill="#1A1D24"/>
  </g>

  <!-- Bottom-Right Quadrant: 画 (Landscape Painting scroll/art) -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="65" height="65" rx="8" fill="#2A303C"/>
    <!-- Painting Scroll Frame -->
    <rect x="15" y="15" width="35" height="35" rx="3" fill="#F4EAD2"/>
    <!-- Mini Mountain/River Art inside -->
    <path d="M 18 42 L 28 25 L 36 34 L 44 20 L 47 42 Z" fill="#6A8A70"/>
    <circle cx="38" cy="24" r="3" fill="#D99B26"/>
    <!-- Scroll Roll Ends -->
    <rect x="12" y="13" width="3" height="39" rx="1.5" fill="#8C6747"/>
    <rect x="50" y="13" width="3" height="39" rx="1.5" fill="#8C6747"/>
  </g>
</svg>