<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements representing the project/work -->
  <rect x="60" y="140" width="120" height="40" rx="4" fill="#2D343E"/>
  <rect x="70" y="150" width="100" height="4" rx="2" fill="#4A5568"/>
  <rect x="70" y="160" width="60" height="4" rx="2" fill="#4A5568"/>
  
  <!-- The "Manager" character (The one who is NOT over-intervening) -->
  <circle cx="180" cy="80" r="20" fill="#F6AD55"/>
  <path d="M165 110 C165 100, 195 100, 195 110 L190 160 L170 160 Z" fill="#F6AD55"/>
  
  <!-- The "Team Member" character -->
  <circle cx="60" cy="120" r="20" fill="#63B3ED"/>
  <path d="M45 150 C45 140, 75 140, 75 150 L70 200 L50 200 Z" fill="#63B3ED"/>
  
  <!-- The Action: "过问" (Intervening/Inquiring) represented by a hand reaching towards the work -->
  <!-- Motion lines indicating the act of checking/intervening -->
  <path d="M140 90 L110 120" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M135 85 L105 115" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- Hand reaching out -->
  <path d="M145 95 L125 115 L135 125 L155 105 Z" fill="#F6AD55"/>
  
  <!-- Focus highlight on the interaction point -->
  <circle cx="115" cy="115" r="8" fill="none" stroke="#F6AD55" stroke-width="2"/>
</svg>