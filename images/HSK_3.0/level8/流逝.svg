<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Sand particles flowing down -->
    <circle cx="0" cy="10" r="1.5" fill="#E5A93B" opacity="0.8"/>
    <circle cx="-3" cy="22" r="1.5" fill="#E5A93B" opacity="0.6"/>
    <circle cx="2" cy="35" r="1.5" fill="#E5A93B" opacity="0.4"/>
    <circle cx="-1" cy="48" r="1.5" fill="#E5A93B" opacity="0.2"/>

    <!-- Bottom sand pile -->
    <path d="M -30 80 Q 0 65 30 80 L 35 85 L -35 85 Z" fill="#E5A93B" opacity="0.9"/>
    
    <!-- Top bulb sand -->
    <path d="M -35 -85 L 35 -85 Q 25 -45 0 -45 Q -25 -45 -35 -85 Z" fill="#E5A93B" opacity="0.9"/>

    <!-- Modern Hourglass Frame -->
    <!-- Top cap -->
    <rect x="-45" y="-95" width="90" height="10" rx="3" fill="#2E3440"/>
    <!-- Bottom cap -->
    <rect x="-45" y="85" width="90" height="10" rx="3" fill="#2E3440"/>

    <!-- Glass bulb outline (Top & Bottom) -->
    <path d="M -40 -85 Q -40 -35 0 0 Q 40 -35 40 -85 Z" fill="none" stroke="#61AFEF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M -40 85 Q -40 35 0 0 Q 40 35 40 85 Z" fill="none" stroke="#61AFEF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Center neck accent -->
    <rect x="-4" y="-3" width="8" height="6" fill="#61AFEF" opacity="0.8"/>
  </g>
</svg>