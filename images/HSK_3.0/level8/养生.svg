<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background elements representing seasons/harmony (Four seasons circle abstract trace) -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#252A35" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="120" cy="120" r="68" fill="none" stroke="#2A313D" stroke-width="1" opacity="0.5"/>

  <!-- Central Noun Illustration for "养生" (Traditional Health & Vitality Care: A stylized, elegant glowing medicinal herbal vessel/pot with a fresh life sprout, symbolizing cultivation of life and nourishment) -->
  
  <!-- Subtle ground shadow -->
  <ellipse cx="120" cy="182" rx="36" ry="6" fill="#111317" opacity="0.8"/>

  <!-- Steam / Vitality Qi (氣) rising gracefully -->
  <path d="M 112 80 C 108 68, 122 60, 116 48 C 112 40, 120 34, 118 28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 128 78 C 133 66, 120 58, 126 46 C 130 38, 122 32, 125 26" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Traditional Herbal Teapot / Medicine Pot Base (Body) -->
  <path d="M 84 110 C 84 98, 92 90, 120 90 C 148 90, 156 98, 156 110 L 164 150 C 164 168, 148 176, 120 176 C 92 176, 76 168, 76 150 Z" fill="#2D3748" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Pot Belly Shading / Inner Warmth (Golden accent) -->
  <path d="M 84 130 C 92 155, 148 155, 156 130 L 161 150 C 161 166, 145 173, 120 173 C 95 173, 79 166, 79 150 Z" fill="#1E2530"/>

  <!-- Center Health Emblem (Traditional Yin-Yang / Balance motif, minimalist and clean) -->
  <circle cx="120" cy="133" r="16" fill="#1A1D24" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 120 117 C 128.8 117, 136 124.2, 136 133 C 136 141.8, 128.8 149, 120 149 C 111.2 149, 104 141.8, 104 133 C 104 129.5, 105.2 126.3, 107.3 123.7" fill="#F59E0B" opacity="0.9"/>
  <circle cx="120" cy="125" r="3.5" fill="#1A1D24"/>
  <circle cx="120" cy="141" r="3.5" fill="#F59E0B"/>

  <!-- Pot Lid -->
  <ellipse cx="120" cy="90" rx="24" ry="6" fill="#3B4252" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="120" cy="80" r="5" fill="#F59E0B"/>

  <!-- Pot Handle (Left) -->
  <path d="M 78 115 C 62 115, 62 145, 78 145" fill="none" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Pot Spout (Right) -->
  <path d="M 162 112 C 178 108, 184 96, 188 88" fill="none" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Fresh Life Sprout / Herb emerging from the top (symbolizing health cultivation) -->
  <path d="M 120 80 L 120 62" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaf Left -->
  <path d="M 120 70 C 110 68, 106 60, 110 54 C 116 54, 120 62, 120 70 Z" fill="#10B981"/>
  <!-- Leaf Right -->
  <path d="M 120 64 C 130 62, 134 54, 130 48 C 124 48, 120 56, 120 64 Z" fill="#34D399"/>

  <!-- Floating Nature/Vitality Elements (Harmonious balance) -->
  <!-- Sun / Warmth Symbol (Top Right) -->
  <circle cx="186" cy="62" r="10" fill="#F59E0B" opacity="0.9"/>
  <path d="M 186 46 L 186 49" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 186 75 L 186 78" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 170 62 L 173 62" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 199 62 L 202 62" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Moon / Rest Symbol (Top Left - representing Yin/Yang balance of rest and activity) -->
  <path d="M 54 55 C 50 55, 46 58, 46 62 C 46 68, 52 72, 58 70 C 55 67, 54 62, 54 55 Z" fill="#38BDF8" opacity="0.8"/>

</svg>