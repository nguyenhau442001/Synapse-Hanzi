<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- School Building Structure -->
  <path d="M60 180 L180 180 L180 100 L120 70 L60 100 Z" fill="#34495E" stroke="#F39C12" stroke-width="3"/>
  
  <!-- Roof Detail -->
  <path d="M60 100 L120 70 L180 100" fill="none" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Windows representing private institution -->
  <rect x="80" y="110" width="25" height="25" fill="#F39C12" rx="2"/>
  <rect x="135" y="110" width="25" height="25" fill="#F39C12" rx="2"/>
  
  <!-- Entrance Gate -->
  <rect x="100" y="145" width="40" height="35" fill="#2C3E50" stroke="#F39C12" stroke-width="2"/>
  
  <!-- People (Teacher and Student) -->
  <circle cx="170" cy="160" r="8" fill="#BDC3C7"/>
  <path d="M170 168 L170 180 M165 185 L170 180 L175 185" fill="none" stroke="#BDC3C7" stroke-width="2"/>
  
  <circle cx="190" cy="165" r="6" fill="#F39C12"/>
  <path d="M190 171 L190 180 M185 185 L190 180 L195 185" fill="none" stroke="#F39C12" stroke-width="2"/>
  
  <!-- Decorative element indicating private/independent nature -->
  <circle cx="120" cy="90" r="5" fill="#F39C12"/>
</svg>