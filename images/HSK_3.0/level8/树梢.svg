<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Tree Trunk -->
  <path d="M110 240 L110 160 L130 160 L130 240 Z" fill="#4A5568"/>
  
  <!-- Tree Branches -->
  <path d="M120 160 L120 100 M120 100 L90 70 M120 100 L150 70 M120 120 L100 100 M120 120 L140 100" stroke="#718096" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Tree Canopy (Leaves) -->
  <circle cx="90" cy="70" r="25" fill="#2D3748"/>
  <circle cx="150" cy="70" r="25" fill="#2D3748"/>
  <circle cx="120" cy="50" r="30" fill="#2D3748"/>
  
  <!-- The Tip (Shùshāo - Highlighted) -->
  <circle cx="120" cy="40" r="12" fill="#F6AD55"/>
  
  <!-- Bird on the tip -->
  <path d="M110 40 Q120 30 130 40 Q120 45 110 40" fill="#E2E8F0"/>
  <path d="M112 38 L108 35" stroke="#E2E8F0" stroke-width="2"/>
</svg>