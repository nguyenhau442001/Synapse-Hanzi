<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative motion/energy waves representing momentum -->
  <path d="M 40 180 Q 80 140 120 180 T 200 180" fill="none" stroke="#2A323D" stroke-width="4" stroke-linecap="round"/>
  <path d="M 30 200 Q 75 160 120 200 T 210 200" fill="none" stroke="#2A323D" stroke-width="3" stroke-linecap="round"/>

  <!-- Iconic Object (Noun representation): A traditional Chinese war drum (战鼓) being struck decisively, symbolizing "一鼓作气" (dồn sức làm một mạch, thừa thắng xông lên) -->
  
  <!-- Drum stand / mount -->
  <path d="M 90 190 L 120 135 L 150 190" fill="none" stroke="#4A5568" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="75" y1="190" x2="165" y2="190" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>

  <!-- Drum body (Barrel shape) -->
  <path d="M 85 95 Q 75 135 85 175 L 155 175 Q 165 135 155 95 Z" fill="#C53030"/>

  <!-- Wood grain / barrel ribs accent -->
  <path d="M 120 95 L 120 175" fill="none" stroke="#9B2C2C" stroke-width="3"/>
  <path d="M 100 97 L 97 173" fill="none" stroke="#9B2C2C" stroke-width="2"/>
  <path d="M 140 97 L 143 173" fill="none" stroke="#9B2C2C" stroke-width="2"/>

  <!-- Drum rim (Top gold ring) -->
  <ellipse cx="120" cy="95" rx="35" ry="12" fill="#D69E2E" stroke="#B7791F" stroke-width="2"/>

  <!-- Drum head (Top surface with tension tacks) -->
  <ellipse cx="120" cy="93" rx="31" ry="9" fill="#EDF2F7"/>
  <!-- Tension tacks around rim -->
  <circle cx="95" cy="95" r="1.5" fill="#4A5568"/>
  <circle cx="105" cy="97" r="1.5" fill="#4A5568"/>
  <circle cx="115" cy="98" r="1.5" fill="#4A5568"/>
  <circle cx="125" cy="98" r="1.5" fill="#4A5568"/>
  <circle cx="135" cy="97" r="1.5" fill="#4A5568"/>
  <circle cx="145" cy="95" r="1.5" fill="#4A5568"/>

  <!-- Dynamic Qi / Sound Wave Burst (Representing "Qi" / energy released in one breath) -->
  <path d="M 120 70 Q 140 50 160 55" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 62 Q 150 35 180 42" fill="none" stroke="#ED8936" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120 54 Q 160 20 200 30" fill="none" stroke="#DD6B20" stroke-width="3" stroke-linecap="round"/>

  <!-- Left side energy bursts -->
  <path d="M 120 70 Q 100 50 80 55" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 62 Q 90 35 60 42" fill="none" stroke="#ED8936" stroke-width="4" stroke-linecap="round"/>

  <!-- Drumsticks striking down with high energy (Action lines) -->
  <!-- Left drumstick -->
  <line x1="50" y1="45" x2="100" y2="85" stroke="#ECC94B" stroke-width="6" stroke-linecap="round"/>
  <!-- Right drumstick -->
  <line x1="190" y1="45" x2="140" y2="85" stroke="#ECC94B" stroke-width="6" stroke-linecap="round"/>

  <!-- Impact Flash / Spark at the center of the drum head -->
  <circle cx="120" cy="90" r="8" fill="#FFF5F5"/>
  <polygon points="120,70 125,85 140,90 125,95 120,110 115,95 100,90 115,85" fill="#F6AD55"/>
</svg>