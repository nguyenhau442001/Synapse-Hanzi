<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background atmosphere: starry dark night sky with subtle gradient -->
  <circle cx="185" cy="55" r="2" fill="#4A5568" opacity="0.6"/>
  <circle cx="55" cy="45" r="1.5" fill="#4A5568" opacity="0.4"/>
  <circle cx="130" cy="35" r="1" fill="#4A5568" opacity="0.5"/>
  <circle cx="75" cy="70" r="1.5" fill="#4A5568" opacity="0.3"/>
  
  <!-- Distant mountain range 1 (Background) -->
  <polygon points="10,180 80,110 160,160 230,120 230,180" fill="#252D3D"/>
  
  <!-- Distant mountain range 2 (Midground) -->
  <polygon points="0,180 50,135 120,175 190,130 240,150 240,180" fill="#2D3748"/>

  <!-- Foreground jagged mountain peak representing remote geography -->
  <polygon points="20,180 90,85 170,180" fill="#3B4758"/>
  <polygon points="90,85 105,180 170,180" fill="#2E3846"/>
  <!-- Mountain snow cap / ridge highlight -->
  <polygon points="90,85 75,115 105,110 108,95" fill="#E2E8F0" opacity="0.9"/>

  <!-- Winding path / remote distance indicator -->
  <path d="M105,180 Q115,150 95,130 T120,105" fill="none" stroke="#718096" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- The central icon subject: A rustic wooden cabin/house situated far away in the wilderness -->
  <polygon points="120,140 145,120 170,140" fill="#DD6B20"/> <!-- Roof -->
  <rect x="128" y="140" width="34" height="28" fill="#CBD5E0"/> <!-- Walls -->
  <rect x="140" y="150" width="10" height="18" fill="#1A1D24"/> <!-- Door -->
  <rect x="132" y="144" width="7" height="7" fill="#F6AD55"/> <!-- Warm lit window indicating habitation in isolation -->

  <!-- Pine trees flanking the remote location -->
  <!-- Tree left -->
  <polygon points="95,150 102,135 109,150" fill="#2F855A"/>
  <polygon points="97,140 102,125 107,140" fill="#38A169"/>
  <rect x="101" y="150" width="2" height="10" fill="#718096"/>

  <!-- Tree right -->
  <polygon points="175,155 182,140 189,155" fill="#2F855A"/>
  <polygon points="177,145" x2="182" y2="130" points-suffix="187,145" fill="#38A169"/>
  <polygon points="177,145 182,130 187,145" fill="#38A169"/>
  <rect x="181" y="155" width="2" height="8" fill="#718096"/>

  <!-- Ground plane -->
  <rect x="0" y="180" width="240" height="60" fill="#1E2530"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#4A5568" stroke-width="2"/>

  <!-- Modern UI Focus Accent: Subtle glowing focal point above the cabin denoting distance/isolation -->
  <circle cx="145" cy="112" r="1.5" fill="#F6AD55"/>
  <circle cx="145" cy="112" r="4" stroke="#F6AD55" stroke-width="1" fill="none" opacity="0.6"/>
</svg>