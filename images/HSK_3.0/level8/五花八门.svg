<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Composition: A diverse collection of items representing "五花八门" -->
  
  <!-- Traditional Chinese Lantern (Red/Gold) -->
  <path d="M60 80c0-20 15-35 35-35s35 15 35 35-15 35-35 35-35-15-35-35z" fill="#FF5722"/>
  <rect x="90" y="115" width="10" height="20" fill="#FFC107"/>
  
  <!-- Clay Figurine (Blue) -->
  <circle cx="170" cy="90" r="15" fill="#2196F3"/>
  <rect x="160" y="105" width="20" height="25" rx="5" fill="#2196F3"/>
  
  <!-- Skewered Street Food (Orange/Yellow) -->
  <rect x="50" y="150" width="4" height="60" fill="#8D6E63"/>
  <circle cx="52" cy="140" r="8" fill="#FF9800"/>
  <circle cx="52" cy="160" r="8" fill="#FFC107"/>
  <circle cx="52" cy="180" r="8" fill="#FF5722"/>
  
  <!-- Traditional Fan (Teal) -->
  <path d="M130 160 L170 160 L150 200 Z" fill="#009688"/>
  <line x1="150" y1="160" x2="150" y2="200" stroke="#004D40" stroke-width="2"/>
  
  <!-- Ceramic Vase (Purple) -->
  <path d="M190 170c0 10-5 20-15 20s-15-10-15-20 5-20 15-20 15 10 15 20z" fill="#9C27B0"/>
  <rect x="182" y="145" width="6" height="25" fill="#7B1FA2"/>
  
  <!-- Small Drum (Green) -->
  <circle cx="90" cy="180" r="15" fill="#4CAF50"/>
  <rect x="85" y="165" width="10" height="30" fill="#388E3C"/>
  
  <!-- Decorative Knot (Gold) -->
  <path d="M120 120 L130 130 L120 140 L110 130 Z" fill="#FFD700"/>
  <line x1="120" y1="140" x2="120" y2="155" stroke="#FFD700" stroke-width="2"/>
</svg>