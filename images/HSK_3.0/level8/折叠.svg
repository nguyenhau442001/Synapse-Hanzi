<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Wall surface line in background -->
    <line x1="-80" y1="80" x2="80" y2="80" stroke="#2D323E" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="-80" x2="70" y2="80" stroke="#2D323E" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Motion arc / folding indicator -->
    <path d="M -15 -45 A 50 50 0 0 1 35 15" fill="none" stroke="#FFA726" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>
    <polygon points="35,10 43,18 31,22" fill="#FFA726"/>

    <!-- Folded Table against the wall (Vertical/Stored state) -->
    <g transform="translate(50, 0)">
      <!-- Tabletop hanging vertically -->
      <rect x="-6" y="-60" width="12" height="120" rx="3" fill="#3B82F6" stroke="#60A5FA" stroke-width="2"/>
      
      <!-- Folded Support Leg -->
      <rect x="-3" y="-40" width="6" height="80" rx="2" fill="#94A3B8"/>
      
      <!-- Wall mount bracket / hinge -->
      <rect x="-12" y="-15" width="6" height="30" rx="1" fill="#64748B"/>
      <circle cx="-9" cy="0" r="3" fill="#FFA726"/>
    </g>

    <!-- Faint outline of table in unfolded/horizontal use state -->
    <g opacity="0.35">
      <!-- Tabletop horizontal -->
      <path d="M -60 20 L 10 20 L 50 60 L -20 60 Z" fill="#3B82F6" stroke="#60A5FA" stroke-width="1.5"/>
      <!-- Table legs -->
      <rect x="-50" y="25" width="4" height="45" rx="1" fill="#94A3B8"/>
      <rect x="-10" y="25" width="4" height="45" rx="1" fill="#94A3B8"/>
    </g>

    <!-- Hinge joint detail at center of folding mechanism -->
    <circle cx="50" cy="0" r="6" fill="#1E293B" stroke="#FFA726" stroke-width="2.5"/>
    <circle cx="50" cy="0" r="2" fill="#FFA726"/>
  </g>
</svg>