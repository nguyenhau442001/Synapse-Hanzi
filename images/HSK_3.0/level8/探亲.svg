<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements for warmth and travel context (Home coming) -->
  <!-- Warm welcoming window/door frame glowing softly -->
  <path d="M70 190 L70 90 Q120 60 170 90 L170 190 Z" fill="#252A34" opacity="0.6"/>
  
  <!-- Glowing warm light from home interior -->
  <path d="M85 190 L85 105 Q120 80 155 105 L155 190 Z" fill="#FFB703" opacity="0.1"/>

  <!-- Traditional red lantern hanging implicitly at the top (Lunar New Year context) -->
  <line x1="120" y1="35" x2="120" y2="55" stroke="#E63946" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="120" cy="70" rx="14" ry="18" fill="#E63946"/>
  <path d="M112 62 Q120 66 128 62" stroke="#FFD166" stroke-width="2" fill="none"/>
  <path d="M112 78 Q120 74 128 78" stroke="#FFD166" stroke-width="2" fill="none"/>
  <line x1="120" y1="88" x2="120" y2="98" stroke="#FFD166" stroke-width="2"/>

  <!-- Motion lines indicating arrival/journey back home -->
  <path d="M35 150 Q50 145 65 155" stroke="#3A86EF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M25 165 Q42 158 55 168" stroke="#3A86EF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Floor line -->
  <line x1="30" y1="190" x2="210" y2="190" stroke="#323846" stroke-width="3" stroke-linecap="round"/>

  <!-- Character 1: Traveler/Engineer returning home (Dynamic action: leaning forward to embrace/greet) -->
  <g id="traveler">
    <!-- Body/Torso (Blue jacket) -->
    <path d="M85 130 L105 130 L112 175 L90 190 L75 165 Z" fill="#3A86EF"/>
    <!-- Head -->
    <circle cx="88" cy="105" r="12" fill="#F3C68F"/>
    <!-- Hair -->
    <path d="M78 103 Q86 91 98 99 Z" fill="#2B2D42"/>
    <!-- Arm reaching out dynamically -->
    <path d="M98 135 Q115 130 128 140" stroke="#3A86EF" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="131" cy="142" r="5" fill="#F3C68F"/>
    <!-- Legs -->
    <line x1="85" y1="180" x2="80" y2="190" stroke="#2B2D42" stroke-width="6" stroke-linecap="round"/>
    <line x1="102" y1="180" x2="108" y2="190" stroke="#2B2D42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Character 2: Elderly parent/family member waiting at home (Welcoming stance) -->
  <g id="family-member">
    <!-- Body/Torso (Warm orange/gold sweater - high contrast accent) -->
    <path d="M155 130 L135 130 L128 175 L150 190 L165 165 Z" fill="#FFB703"/>
    <!-- Head -->
    <circle cx="152" cy="105" r="12" fill="#F3C68F"/>
    <!-- Hair (Elderly, styled gray/white) -->
    <path d="M141 106 Q152 92 163 106 Z" fill="#8D99AE"/>
    <!-- Arm reaching out to meet/embrace -->
    <path d="M142 135 Q128 130 129 142" stroke="#FFB703" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="127" cy="144" r="5" fill="#F3C68F"/>
    <!-- Legs -->
    <line x1="155" y1="180" x2="160" y2="190" stroke="#2B2D42" stroke-width="6" stroke-linecap="round"/>
    <line x1="138" y1="180" x2="132" y2="190" stroke="#2B2D42" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Luggage bag on the side (signifying long journey / returning from afar) -->
  <g id="luggage" transform="translate(42, 155)">
    <rect x="0" y="10" width="18" height="25" rx="3" fill="#E76F51"/>
    <path d="M6 10 L6 6 Q6 3 9 3 Q12 3 12 6 L12 10" stroke="#8D99AE" stroke-width="2" fill="none"/>
    <line x1="0" y1="18" x2="18" y2="18" stroke="#D00000" stroke-width="2"/>
    <!-- Small wheels -->
    <circle cx="4" cy="37" r="2" fill="#212529"/>
    <circle cx="14" cy="37" r="2" fill="#212529"/>
  </g>

  <!-- Warm sparkling reunion indicator (Clean abstract dots, NO HEARTS) -->
  <circle cx="120" cy="115" r="3" fill="#FFD166"/>
  <circle cx="125" cy="100" r="2" fill="#FFD166"/>
  <circle cx="112" cy="104" r="1.5" fill="#FFD166"/>
</svg>