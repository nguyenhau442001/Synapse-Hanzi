<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Knitting needles -->
  <path d="M160 80 L80 160" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
  <path d="M170 90 L90 170" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Yarn ball -->
  <circle cx="70" cy="180" r="25" fill="#FF79C6"/>
  <path d="M70 155 Q85 140 100 130" stroke="#FF79C6" stroke-width="4" fill="none"/>
  
  <!-- Knitted fabric texture -->
  <path d="M100 130 L150 80 L170 100 L120 150 Z" fill="#BD93F9"/>
  <path d="M100 130 L120 150 M110 140 L130 120 M120 150 L140 130 M130 160 L150 140 M140 110 L160 90" stroke="#1A1D24" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Warm light glow effect -->
  <circle cx="120" cy="120" r="100" fill="url(#grad)" opacity="0.1"/>
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFB86C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1D24;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>