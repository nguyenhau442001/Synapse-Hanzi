<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk surface -->
  <rect x="40" y="160" width="160" height="10" fill="#2D343E" rx="2"/>
  
  <!-- Character 1 (The Prober) -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="12" fill="#F39C12"/>
    <path d="M20 32 L20 80 M20 45 L5 60 M20 45 L35 60" stroke="#F39C12" stroke-width="6" stroke-linecap="round"/>
    <!-- Extending hand -->
    <path d="M20 45 L50 45" stroke="#F39C12" stroke-width="6" stroke-linecap="round"/>
    <circle cx="55" cy="45" r="5" fill="#F39C12"/>
  </g>
  
  <!-- Character 2 (The Receiver) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="12" fill="#5DADE2"/>
    <path d="M20 32 L20 80 M20 45 L5 60 M20 45 L35 60" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- The "Probe" (Motion lines indicating cautious reach) -->
  <path d="M115 125 Q130 110 145 125" stroke="#F39C12" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M115 130 Q130 115 145 130" stroke="#F39C12" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Subtle barrier/object between them -->
  <rect x="115" y="100" width="10" height="60" fill="#3E4756" rx="2"/>
</svg>