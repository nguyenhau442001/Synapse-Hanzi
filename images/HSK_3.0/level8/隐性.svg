<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- DNA Helix representing the genetic context -->
  <g transform="translate(120, 120)">
    <!-- Main visible helix structure -->
    <path d="M-20 -60 C 0 -40, 0 -20, -20 0 C -40 20, -40 40, -20 60" stroke="#5D6D7E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M20 -60 C 0 -40, 0 -20, 20 0 C 40 20, 40 40, 20 60" stroke="#5D6D7E" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- The "hidden" recessive gene segment (highlighted in gold) -->
    <path d="M-20 -20 C 0 0, 0 20, -20 40" stroke="#FFC107" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M20 -20 C 0 0, 0 20, 20 40" stroke="#FFC107" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Connecting rungs -->
    <line x1="-15" y1="-40" x2="15" y2="-40" stroke="#5D6D7E" stroke-width="4"/>
    <line x1="-15" y1="40" x2="15" y2="40" stroke="#5D6D7E" stroke-width="4"/>
    
    <!-- The hidden trait rung (Gold) -->
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle overlay indicating depth/hidden nature -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#2C3E50" stroke-width="2" stroke-dasharray="8 8"/>
</svg>