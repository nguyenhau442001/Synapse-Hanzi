<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Atmospheric background elements representing deep dark forest / wilderness context -->
  <g opacity="0.25">
    <!-- Pine/conifer tree silhouettes in background -->
    <polygon points="30,160 50,110 70,160" fill="#4B6584"/>
    <polygon points="50,140 70,85 90,140" fill="#4B6584"/>
    <polygon points="170,170 190,120 210,170" fill="#4B6584"/>
    <polygon points="190,150 210,95 230,150" fill="#4B6584"/>
  </g>

  <!-- Ground plane -->
  <path d="M 20 185 Q 120 170 220 185 L 220 210 L 20 210 Z" fill="#252A34"/>

  <!-- Main Subject: Wild Beast (Yěshòu - Noun) -->
  <!-- Sleek modern flat vector predatory animal silhouette/form (Wolf/Large Feline archetype) -->
  <g transform="translate(15, 10)">
    <!-- Body -->
    <path d="M 65,115 C 75,95 95,85 125,85 C 150,85 170,95 185,115 C 195,130 190,155 175,165 C 150,175 95,175 75,165 C 60,155 55,130 65,115 Z" fill="#2F3640"/>
    
    <!-- Chest & Underbelly subtle contrast -->
    <path d="M 85,115 C 95,100 115,95 135,95 C 155,95 170,105 175,125 C 160,145 100,145 85,115 Z" fill="#353B48"/>

    <!-- Head & Snout -->
    <path d="M 165,85 L 205,65 L 195,95 L 175,105 Z" fill="#2F3640"/>

    <!-- Erect Pointed Ears -->
    <polygon points="168,87 178,55 188,83" fill="#2F3640"/>
    <polygon points="185,83 197,58 202,84" fill="#2F3640"/>

    <!-- Powerful Limbs/Paws (Standing alert stance) -->
    <!-- Front Leg 1 -->
    <polygon points="175,140 185,185 170,185 160,145" fill="#2F3640"/>
    <!-- Front Leg 2 -->
    <polygon points="160,140 168,185 155,185 148,145" fill="#252A34"/>
    <!-- Back Leg 1 -->
    <polygon points="85,140 75,185 90,185 98,145" fill="#2F3640"/>
    <!-- Back Leg 2 -->
    <polygon points="98,140 90,185 105,185 110,145" fill="#252A34"/>

    <!-- Tail (Low and sweeping) -->
    <path d="M 65,125 C 45,130 30,145 20,165 C 35,160 50,145 65,125 Z" fill="#2F3640"/>

    <!-- Fierce Glowing Accent Eye & Focus (Orange/Gold theme for contrast and wild nature) -->
    <circle cx="187" cy="74" r="3.5" fill="#F39C12"/>
    <path d="M 183,72 L 191,76" stroke="#1A1D24" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Subtle menacing teeth glint (minimal flat accent) -->
    <polygon points="194,88 198,90 192,91" fill="#F5F6FA"/>
  </g>

  <!-- Infrared trail/sensor subtle framing elements (referencing context) -->
  <g stroke="#E74C3C" stroke-width="1.5" fill="none" opacity="0.6" stroke-dasharray="3 3">
    <!-- Framing reticle top right -->
    <path d="M 205,35 L 215,35 L 215,45"/>
    <!-- Framing reticle bottom left -->
    <path d="M 35,205 L 25,205 L 25,195"/>
  </g>
  
  <!-- Subtle ambient nature dots/fireflies or dust -->
  <circle cx="50" cy="70" r="1.5" fill="#F1C40F" opacity="0.4"/>
  <circle cx="190" cy="130" r="1" fill="#F1C40F" opacity="0.5"/>
  <circle cx="110" cy="50" r="1.2" fill="#F1C40F" opacity="0.3"/>
</svg>