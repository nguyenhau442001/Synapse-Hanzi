<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Flame Gradients -->
    <linearGradient id="outerFlame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    
    <linearGradient id="innerFlame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- Character / Torch Holder Gradients -->
    <linearGradient id="torchMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#455A64"/>
    </linearGradient>

    <linearGradient id="personBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="90" fill="url(#bgGlow)"/>

  <!-- Geometric Accent Rings (Clean Flat Modern) -->
  <circle cx="120" cy="120" r="75" fill="none" stroke="#2C353D" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="120" cy="120" r="90" fill="none" stroke="#2C353D" stroke-width="1.5" opacity="0.5"/>

  <!-- Central Physical Object/Character representing "火热" (Passionate/Fiery Youth) -->
  <g transform="translate(0, 5)">
    <!-- Base Human Silhouette (Representing the enthusiastic youth "广大青年") -->
    <path d="M 120 125 
             C 100 125, 80 135, 70 155 
             L 65 185 
             L 175 185 
             L 170 155 
             C 160 135, 140 125, 120 125 Z" 
          fill="url(#personBody)"/>
          
    <!-- Torso Accent (Collar / Vest) -->
    <path d="M 100 125 L 120 145 L 140 125 Z" fill="#FF5722" opacity="0.8"/>

    <!-- Upstretched Arm (Holding the fire/passion high) -->
    <path d="M 145 130 C 160 110, 165 90, 165 75 L 155 75 C 155 90, 150 105, 135 120 Z" fill="url(#torchMetal)"/>

    <!-- Head -->
    <circle cx="120" cy="105" r="16" fill="#37474F"/>

    <!-- Giant Dynamic Flame bursting directly from the core (Visualizing "火热" - Burning, Fervent) -->
    <g transform="translate(120, 55)">
      <!-- Outer large flame -->
      <path d="M 0 -35 
               C 25 -10, 30 10, 15 30 
               C 25 20, 20 0, 10 -5
               C 20 15, 5 35, 0 45
               C -5 35, -20 15, -10 -5
               C -20 0, -25 20, -15 30
               C -30 10, -25 -10, 0 -35 Z" 
            fill="url(#outerFlame)"/>

      <!-- Inner bright flame -->
      <path d="M 0 -15 
               C 12 0, 15 15, 8 25 
               C 12 15, 10 5, 4 2
               C 8 15, 2 25, 0 32
               C -2 25, -8 15, -4 2
               C -10 5, -12 15, -8 25
               C -15 15, -12 0, 0 -15 Z" 
            fill="url(#innerFlame)"/>
    </g>
  </g>

  <!-- Radiating Energy Sparks (Modern flat styling) -->
  <circle cx="85" cy="70" r="3" fill="#FFB300"/>
  <circle cx="160" cy="50" r="2" fill="#FF5722"/>
  <circle cx="155" cy="95" r="2.5" fill="#FFC107"/>
  <circle cx="80" cy="105" r="2" fill="#FF9800"/>
  
  <!-- Subtle ground shadow -->
  <ellipse cx="120" cy="190" rx="45" ry="5" fill="#111317"/>
</svg>