<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Shopping Basket/Container -->
  <path d="M60 80h120l-15 100H75L60 80z" fill="#2D343E" stroke="#FFB84D" stroke-width="3"/>
  <path d="M60 80h120" stroke="#FFB84D" stroke-width="4"/>
  
