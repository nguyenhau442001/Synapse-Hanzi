<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Envelope Body -->
  <path d="M60 80h120v90H60z" fill="#2D343E" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Envelope Flap -->
  <path d="M60 80l60 45 60-45" fill="#3B4452" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Lightning Bolt Symbol (representing 'Electric/Telegram') -->
  <path d="M110 105l20 0l-10 30l20 0l-30 40l10 -30l-20 0z" fill="#FFD700"/>
  
  <!-- Decorative Lines representing the telegram paper inside -->
  <line x1="80" y1="100" x2="160" y2="100" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="160" y2="120" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="140" x2="160" y2="140" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="160" x2="130" y2="160" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
</svg>