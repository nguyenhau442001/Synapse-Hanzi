<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow -->
  <circle cx="120" cy="120" r="80" fill="#0EA5E9" opacity="0.05" filter="blur(20px)"/>

  <!-- Conceptual Visual Metaphor: Progression/Escalation from Illness to Recovery (Liáofǎ / Treatment Method) -->
  
  <!-- Step/Progression Background Structure -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="50" y1="160" x2="190" y2="160" />
    <line x1="50" y1="120" x2="190" y2="120" />
    <line x1="50" y1="80" x2="190" y2="80" />
  </g>

  <!-- Timeline / Progression Path -->
  <path d="M 60 160 Q 100 160, 120 120 T 180 80" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M 60 160 Q 100 160, 120 120 T 180 80" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="30"/>

  <!-- Step 1: Baseline / Vulnerable State (Left Node) -->
  <circle cx="60" cy="160" r="10" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <circle cx="60" cy="160" r="4" fill="#94A3B8"/>

  <!-- Step 2: Intervention / Method Application (Middle Peak Node) -->
  <g transform="translate(120, 120)">
    <!-- Outer Pulse Ring representing active treatment/therapy -->
    <circle cx="0" cy="0" r="16" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="0" cy="0" r="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="2"/>
    <!-- Medical Cross / Synthesis Symbol integrated smoothly -->
    <path d="M -4 -1 L -1 -1 L -1 -4 L 1 -4 L 1 -1 L 4 -1 L 4 1 L 1 1 L 1 4 L -1 4 L -1 1 L -4 1 Z" fill="#38BDF8"/>
  </g>

  <!-- Step 3: Optimal Outcome / Recovery (Right Zenith Node) -->
  <g transform="translate(180, 80)">
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#10B981" stroke-width="2.5"/>
    <!-- Checkmark representing successful recovery -->
    <path d="M -4 0 L -1 3 L 5 -3" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Escalation / Transformation Elements (Flowing Metaphor) -->
  <!-- Ascending arrow / momentum indicator -->
  <g transform="translate(150, 95) rotate(-35)">
    <path d="M 0 0 L 16 0 M 11 -4 L 16 0 L 11 4" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Abstract Focused Detail (Magnifying/Analyzing the Intervention) -->
  <g transform="translate(120, 120)">
    <!-- Connection beam representing systematic integration (TCM + Western Medicine) -->
    <path d="M -60 40 L -20 0" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
    <path d="M 20 -40 L 60 -80" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Ambient glowing focal nodes -->
  <circle cx="60" cy="160" r="2" fill="#94A3B8"/>
  <circle cx="120" cy="120" r="3" fill="#38BDF8"/>
  <circle cx="180" cy="80" r="3" fill="#10B981"/>

</svg>