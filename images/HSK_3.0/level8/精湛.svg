<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Ambient glowing aura representing supreme craftsmanship & excellence -->
    <circle cx="120" cy="115" r="70" fill="#FFB703" opacity="0.08"/>
    <circle cx="120" cy="115" r="50" fill="#FFB703" opacity="0.12"/>
    
    <!-- Scale Exaggeration & Visual Contrast Principle for Adjectives -->
    <!-- Giant Magnifying Glass focusing on exquisite precision -->
    <!-- Magnifying Glass Handle -->
    <path d="M 148 143 L 185 180" stroke="#4A5568" stroke-width="12" stroke-linecap="round"/>
    <path d="M 152 147 L 181 176" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Magnifying Glass Rim (Large Scale) -->
    <circle cx="105" cy="100" r="46" fill="#1A1D24" stroke="#FFB703" stroke-width="6"/>
    
    <!-- Lens Glow & Inner Circle -->
    <circle cx="105" cy="100" r="40" fill="#0F172A"/>
    
    <!-- Exquisite Porcelain Vase (The Subject of 精湛 Craftsmanship) -->
    <!-- Base -->
    <path d="M 97 126 L 113 126 L 111 118 L 99 118 Z" fill="#E2E8F0"/>
    <!-- Body - Elegant Curves -->
    <path d="M 99 118 C 93 110, 88 95, 93 83 C 96 76, 101 74, 105 74 C 109 74, 114 76, 117 83 C 122 95, 117 110, 111 118 Z" fill="#F8FAFC"/>
    <!-- Neck & Rim -->
    <path d="M 101 74 L 109 74 L 108 67 C 108 66, 106 65, 105 65 C 104 65, 102 66, 102 67 Z" fill="#E2E8F0"/>
    
    <!-- Intricate, Flawless Gold Patterns on the Miniature Vase (Highlighting 精湛 / Exquisite Skill) -->
    <path d="M 101 85 Q 105 82 109 85" stroke="#D97706" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 97 95 Q 105 91 113 95" stroke="#D97706" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 96 105 Q 105 101 114 105" stroke="#D97706" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Precision Sparkles / Mastery Indicators -->
    <path d="M 72 75 L 75 70 L 78 75 L 75 80 Z" fill="#FFB703"/>
    <path d="M 132 110 L 134 107 L 137 110 L 134 113 Z" fill="#FFB703"/>
    <circle cx="130" cy="72" r="2" fill="#FFB703"/>
    <circle cx="78" cy="115" r="1.5" fill="#FFB703"/>
    
    <!-- Stylized Crafting Tool (Fine Engraving Needle / Brush) hovering with precision -->
    <path d="M 60 135 L 88 107" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 57 138 L 62 133 L 65 136 L 60 141 Z" fill="#CBD5E1"/>
