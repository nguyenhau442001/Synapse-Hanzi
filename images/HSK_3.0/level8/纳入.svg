<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Drop Shadow for layered elements -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Glow for the focal moving item -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient lighting/glow behind main system -->
  <circle cx="150" cy="120" r="60" fill="#3B82F6" opacity="0.08" filter="blur(20px)"/>

  <!-- TARGET SYSTEM (The "Plan / Registry" represented as a sleek digital document binder/planner) -->
  <g transform="translate(110, 65)" filter="url(#shadow)">
    <!-- Binder Cover/Base -->
    <rect x="0" y="0" width="85" height="110" rx="8" fill="#252A34" stroke="#374151" stroke-width="2"/>
    
    <!-- Binding Spine overlay / rings indicator -->
    <rect x="0" y="0" width="14" height="110" rx="8" fill="#1E232D"/>
    <circle cx="7" cy="25" r="3" fill="#4B5563"/>
    <circle cx="7" cy="55" r="3" fill="#4B5563"/>
    <circle cx="7" cy="85" r="3" fill="#4B5563"/>

    <!-- Document Content Lines (Representing a structured plan) -->
    <rect x="24" y="20" width="48" height="6" rx="3" fill="#374151"/>
    
    <!-- Existing slot 1 -->
    <rect x="24" y="38" width="50" height="8" rx="2" fill="#1F2937"/>
    <circle cx="28" cy="42" r="2" fill="#6B7280"/>
    
    <!-- Existing slot 2 -->
    <rect x="24" y="52" width="50" height="8" rx="2" fill="#1F2937"/>
    <circle cx="28" cy="56" r="2" fill="#6B7280"/>

    <!-- DESTINATION SLOT (Glowing, highlighting where the item enters) -->
    <rect x="22" y="66" width="54" height="14" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Target slot content lines placeholder -->
    <rect x="34" y="71" width="36" height="4" rx="2" fill="#60A5FA" opacity="0.6"/>
    <circle cx="28" cy="73" r="2" fill="#3B82F6"/>

    <!-- Bottom slot -->
    <rect x="24" y="86" width="35" height="8" rx="2" fill="#1F2937"/>
    <circle cx="28" cy="90" r="2" fill="#6B7280"/>
  </g>

  <!-- DIRECTIONAL MOTION PATH -->
  <path d="M 45 125 C 65 125, 85 115, 108 95" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Arrow Head indicating entry -->
  <path d="M 102 92 L 112 95 L 105 103" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- THE ENTERING PHYSICAL OBJECT (Representing the item/task/proposal being integrated: "纳入") -->
  <!-- Designed as a distinct, tangible modern task card/module -->
  <g transform="translate(25, 95)" filter="url(#shadow)">
    <!-- Card Body -->
    <rect x="0" y="0" width="56" height="60" rx="8" fill="#F59E0B" filter="url(#glow)"/>
    
    <!-- Inner details to make it a concrete physical/digital object -->
    <rect x="8" y="10" width="40" height="8" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="8" y="24" width="28" height="5" rx="2.5" fill="#B45309" opacity="0.6"/>
    <rect x="8" y="34" width="35" height="5" rx="2.5" fill="#B45309" opacity="0.6"/>
    
    <!-- Accent handle / grip dot -->
    <circle cx="44" cy="48" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Secondary decorative sparkle to emphasize successful integration -->
  <g transform="translate(138, 52)" opacity="0.9">
    <path d="M 0 6 C 3 6, 6 3, 6 0 C 6 3, 9 6, 12 6 C 9 6, 6 9, 6 12 C 6 9, 3 6, 0 6 Z" fill="#60A5FA"/>
  </g>
  <g transform="translate(102, 145)" opacity="0.6">
    <path d="M 0 4 C 2 4, 4 2, 4 0 C 4 2, 6 4, 8 4 C 6 4, 4 6, 4 8 C 4 6, 2 4, 0 4 Z" fill="#F59E0B"/>
  </g>

</svg>