<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/ambient light representing life choices path -->
  <path d="M60 180 C90 180, 100 120, 120 120 C140 120, 150 70, 180 70" stroke="#252A34" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Choice fork indicators (floating subtle nodes representing career / life decisions) -->
  <circle cx="150" cy="95" r="12" fill="#222733"/>
  <path d="M146 95 L154 95 M150 91 L150 99" stroke="#3A4252" stroke-width="2" stroke-linecap="round"/>

  <circle cx="130" cy="150" r="12" fill="#222733"/>
  <path d="M126 150 L134 150" stroke="#3A4252" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic human character taking charge / making a definitive decision (Verb action) -->
  <!-- Body/Torso -->
  <path d="M100 185 L92 140 C91 135, 95 130, 100 130 L115 130 C120 130, 124 135, 123 140 L115 185 Z" fill="#3B82F6"/>
  
  <!-- Head & Hair -->
  <circle cx="107.5" cy="108" r="14" fill="#FBBF24"/>
  <path d="M96 102 C96 98, 102 92, 112 94 C119 95, 120 102, 119 108 C115 106, 105 106, 96 102 Z" fill="#1E293B"/>

  <!-- Legs -->
  <path d="M100 185 L96 215 C95 218, 98 220, 101 218 L108 190 Z" fill="#1E293B"/>
  <path d="M115 185 L121 215 C122 218, 125 218, 127 215 L118 190 Z" fill="#1E293B"/>

  <!-- Confident arm gesture taking control (pointing forward/upward, dynamic action) -->
  <path d="M96 138 L72 125 C69 123, 70 119, 74 119 L82 124 L100 135 Z" fill="#3B82F6"/>
  <circle cx="70" cy="122" r="4" fill="#FBBF24"/>

  <!-- Other arm resting on hip / firm stance -->
  <path d="M120 138 L138 152 C141 155, 139 160, 135 158 L123 145 Z" fill="#2563EB"/>

  <!-- Focal interactive element: A glowing directional compass / decision wheel floating above, being controlled -->
  <circle cx="160" cy="75" r="22" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
  
  <!-- Compass needle pointing decisively upward-right -->
  <polygon points="160,59 166,75 160,71" fill="#F59E0B"/>
  <polygon points="160,91 154,75 160,79" fill="#64748B"/>
  <circle cx="160" cy="75" r="3" fill="#FFFFFF"/>

  <!-- Motion lines / Action effect showing independence and active willpower -->
  <path d="M135 60 C142 53, 150 50, 158 50" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M180 75 C182 82, 180 90, 175 97" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" fill="none"/>
  
  <!-- Action spark / Focus point -->
  <circle cx="160" cy="75" r="32" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" fill="none"/>
</svg>