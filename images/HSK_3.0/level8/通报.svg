<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle interface glow / portal effect representing official/digital broadcast -->
  <circle cx="120" cy="115" r="75" fill="#222733" opacity="0.6"/>
  <circle cx="120" cy="115" r="55" fill="#2A303C" opacity="0.4"/>

  <!-- Official Document / Bulletin Base -->
  <g transform="translate(75, 45)">
    <!-- Document background -->
    <rect x="0" y="0" width="90" height="120" rx="8" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))"/>
    
    <!-- Document Header / Official Stamp Area -->
    <rect x="15" y="15" width="28" height="28" rx="4" fill="#E2E8F0"/>
    <circle cx="29" cy="29" r="8" fill="#94A3B8"/>

    <!-- Document Lines (simulating text/bulletin content) -->
    <rect x="50" y="17" width="25" height="6" rx="3" fill="#334155"/>
    <rect x="50" y="27" width="18" height="4" rx="2" fill="#94A3B8"/>

    <rect x="15" y="55" width="60" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="15" y="67" width="60" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="15" y="79" width="45" height="4" rx="2" fill="#CBD5E1"/>
    
    <!-- Highlighted section (Notice / Violation Case) -->
    <rect x="15" y="93" width="60" height="14" rx="3" fill="#FEF2F2"/>
    <rect x="21" y="98" width="20" height="4" rx="2" fill="#EF4444"/>
    <rect x="45" y="98" width="24" height="4" rx="2" fill="#FCA5A5"/>
  </g>

  <!-- Official Red Seal / Stamp (Indicating formal public notification/bulletin) -->
  <g transform="translate(130, 115)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="4,2"/>
    <circle cx="20" cy="20" r="13" fill="#DC2626" opacity="0.15"/>
    <!-- Star icon inside official seal -->
    <path d="M20 10l2.5 5.5 6 0.8-4.3 4.2 1 6-5.2-2.8-5.2 2.8 1-6-4.3-4.2 6-0.8z" fill="#DC2626" transform="scale(0.6) translate(13, 13)"/>
  </g>

  <!-- Digital Broadcast / Public Announcement Wave Elements -->
  <path d="M45 80 C 35 95, 35 125, 45 140" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M30 65 C 15 90, 15 130, 30 155" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <path d="M195 80 C 205 95, 205 125, 195 140" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M210 65 C 225 90, 225 130, 210 155" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Megaphone / Broadcast Icon representing "Public Announcement" (通报) -->
  <g transform="translate(95, 175)">
    <!-- Handle -->
    <rect x="5" y="10" width="8" height="15" rx="3" fill="#F59E0B" transform="rotate(25 9 10)"/>
    <!-- Body -->
    <path d="M12 4 L28 10 L28 22 L12 28 Z" fill="#F59E0B"/>
    <!-- Cone / Horn -->
    <path d="M28 6 L42 0 L42 32 L28 26 Z" fill="#D97706"/>
    <!-- Sound Waves from Horn -->
    <path d="M47 8 C 50 13, 50 19, 47 24" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M52 4 C 57 11, 57 21, 52 28" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Glowing focal pin dot on top of document -->
  <circle cx="120" cy="45" r="4" fill="#F59E0B"/>
</svg>