<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Ambient glow for strategy/idea -->
    <circle cx="108" cy="108" r="70" fill="#FFB703" opacity="0.05"/>
    <circle cx="108" cy="108" r="50" fill="#FFB703" opacity="0.08"/>

    <!-- Open Scroll Base -->
    <g transform="translate(38, 52)">
      <!-- Scroll body (paper) -->
      <path d="M15 15 C 35 12, 105 12, 125 15 L 125 95 C 105 92, 35 92, 15 95 Z" fill="#2A303C"/>
      <path d="M20 22 L 120 22 M20 34 L 120 34 M20 46 L 90 46" stroke="#3A4252" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Strategic Map Path & Nodes (representing "kế sách / mưu tính") -->
      <path d="M 30 72 Q 55 50, 75 70 T 110 58" fill="none" stroke="#FFB703" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round"/>
      <circle cx="30" cy="72" r="4" fill="#FFB703"/>
      <circle cx="75" cy="70" r="4" fill="#FFB703"/>
      <circle cx="110" cy="58" r="5" fill="#EF4444"/>

      <!-- Left Scroll Roll (wooden rod) -->
      <rect x="8" y="10" width="10" height="92" rx="4" fill="#E59866"/>
      <ellipse cx="13" cy="10" rx="5" ry="3" fill="#F39C12"/>
      <ellipse cx="13" cy="102" rx="5" ry="3" fill="#D35400"/>

      <!-- Right Scroll Roll (wooden rod) -->
      <rect x="122" y="10" width="10" height="92" rx="4" fill="#E59866"/>
      <ellipse cx="127" cy="10" rx="5" ry="3" fill="#F39C12"/>
      <ellipse cx="127" cy="102" rx="5" ry="3" fill="#D35400"/>
    </g>

    <!-- Glowing Lightbulb (idea / flash of insight "生出一计") -->
    <g transform="translate(108, 38)">
      <!-- Bulb Aura -->
      <circle cx="0" cy="0" r="22" fill="#FFB703" opacity="0.15"/>
      
      <!-- Bulb Glass -->
      <path d="M -8 -4 C -8 -14, 8 -14, 8 -4 C 8 3, 4 7, 4 12 L -4 12 C -4 7, -8 3, -8 -4 Z" fill="#FFB703"/>
      
      <!-- Filament -->
      <path d="M -2 4 L 0 -1 L 2 4" fill="none" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Screw Base -->
      <rect x="-3.5" y="12" width="7" height="3" fill="#94A3B8"/>
      <rect x="-2.5" y="15" width="5" height="3" fill="#64748B"/>
      <path d="M-2 18 C-2 20, 2 20, 2 18 Z" fill="#475569"/>

      <!-- Spark Rays -->
      <line x1="0" y1="-27" x2="0" y2="-22" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-19" y1="-12" x2="-15" y2="-9" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="19" y1="-12" x2="15" y2="-9" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <!-- Strategic Chess / Calculation piece (representing "tính toán") -->
    <g transform="translate(108, 168)">
      <path d="M -16 10 L 16 10 L 12 -4 L -12 -4 Z" fill="#3B82F6"/>
      <ellipse cx="0" cy="-4" rx="12" ry="4" fill="#60A5FA"/>
      <circle cx="0" cy="-12" r="7" fill="#60A5FA"/>
      <!-- Star on piece -->
      <path d="M 0 -15 L 1.2 -12.5 L 3.8 -12.5 L 1.8 -11 L 2.5 -8.5 L 0 -10 L -2.5 -8.5 L -1.8 -11 L -3.8 -12.5 L -1.2 -12.5 Z" fill="#FFFFFF" transform="scale(0.6) translate(0, -18)"/>
    </g>
  </g>
</svg>