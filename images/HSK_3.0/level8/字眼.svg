<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Document / Contract Background -->
  <rect x="52" y="44" width="136" height="152" rx="10" fill="#242833" stroke="#3A4150" stroke-width="2"/>
  
  <!-- Document Header Lines -->
  <line x1="72" y1="68" x2="168" y2="68" stroke="#3A4150" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="84" x2="120" y2="84" stroke="#3A4150" stroke-width="3" stroke-linecap="round"/>

  <!-- Document Body Lines -->
  <line x1="72" y1="112" x2="168" y2="112" stroke="#2E3442" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="130" x2="150" y2="130" stroke="#2E3442" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="148" x2="160" y2="148" stroke="#2E3442" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="166" x2="135" y2="166" stroke="#2E3442" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Highlighted Specific Word / Phrase (字眼) focus zone -->
  <rect x="68" y="104" width="56" height="16" rx="4" fill="#FFB84D" opacity="0.2"/>
  <rect x="68" y="104" width="56" height="16" rx="4" fill="none" stroke="#FFB84D" stroke-width="2"/>

  <!-- Magnifying Glass Inspecting the Exact Word -->
  <g transform="translate(20, 25)">
    <!-- Glass Lens Background Glow -->
    <circle cx="120" cy="95" r="32" fill="#1A1D24" opacity="0.85"/>
    
    <!-- Magnified Content illusion: Enhanced precise lines inside lens -->
    <line x1="102" y1="91" x2="138" y2="91" stroke="#FFB84D" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="106" y1="101" x2="134" y2="101" stroke="#FFB84D" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Outer Rim -->
    <circle cx="120" cy="95" r="32" fill="none" stroke="#E6EEF8" stroke-width="5"/>
    <circle cx="120" cy="95" r="32" fill="#64B5F6" opacity="0.12"/>
    
    <!-- Lens Glass Reflection -->
    <path d="M 98 81 A 24 24 0 0 1 131 75" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Handle -->
    <path d="M 143 118 L 175 150" fill="none" stroke="#E6EEF8" stroke-width="7" stroke-linecap="round"/>
    <path d="M 143 118 L 175 150" fill="none" stroke="#3A4150" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>