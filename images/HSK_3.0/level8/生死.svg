<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Terrain -->
  <path d="M0 200 C 60 180, 180 180, 240 200 L 240 240 L 0 240 Z" fill="#2C313C"/>
  
  <!-- Rescuer (Left) -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="20" r="12" fill="#FFB84D"/>
    <path d="M10 40 L 15 80 L 35 80 L 30 40 Z" fill="#FFB84D"/>
    <path d="M5 80 L 10 110 L 20 110 L 15 80 Z" fill="#A0A0A0"/>
    <path d="M25 80 L 30 110 L 40 110 L 35 80 Z" fill="#A0A0A0"/>
  </g>
  
  <!-- Rescued Person (Right) -->
  <g transform="translate(140, 140)">
    <circle cx="20" cy="20" r="12" fill="#E0E0E0"/>
    <path d="M10 40 L 15 80 L 35 80 L 30 40 Z" fill="#E0E0E0"/>
    <path d="M5 80 L 10 100 L 20 100 L 15 80 Z" fill="#808080"/>
    <path d="M25 80 L 30 100 L 40 100 L 35 80 Z" fill="#808080"/>
  </g>
  
  <!-- Interaction: Rescuer pulling the person -->
  <path d="M85 150 L 145 150" stroke="#FFB84D" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Debris/Danger context -->
  <path d="M10 210 L 30 190 L 50 210 Z" fill="#4A4F5C"/>
  <path d="M190 220 L 210 200 L 230 220 Z" fill="#4A4F5C"/>
  <circle cx="120" cy="220" r="5" fill="#4A4F5C"/>
  <circle cx="180" cy="230" r="8" fill="#4A4F5C"/>
</svg>