<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Elder Scientist (The Object of Respect) -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 80 C-30 50, -20 40, 0 40 C20 40, 30 50, 30 80 L30 100 L-30 100 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="25" fill="#F7FAFC"/>
    <!-- Hair (White/Grey) -->
    <path d="M-20 15 C-20 -5, 20 -5, 20 15 L20 25 L-20 25 Z" fill="#CBD5E0"/>
    <!-- Glasses -->
    <rect x="-12" y="15" width="8" height="6" rx="1" fill="none" stroke="#2D3748" stroke-width="2"/>
    <rect x="4" y="15" width="8" height="6" rx="1" fill="none" stroke="#2D3748" stroke-width="2"/>
    <line x1="-4" y1="18" x2="4" y2="18" stroke="#2D3748" stroke-width="1"/>
  </g>

  <!-- Young Scientist (The Person Showing Respect) -->
  <g transform="translate(60, 140)">
    <!-- Bowing posture -->
    <path d="M0 0 L20 -20 L40 0 L30 40 L10 40 Z" fill="#ECC94B"/>
    <!-- Head -->
    <circle cx="20" cy="-30" r="15" fill="#F7FAFC"/>
    <!-- Bowing gesture: Hands together in front -->
    <rect x="15" y="-10" width="10" height="15" rx="2" fill="#D69E2E"/>
  </g>

  <!-- Decorative Accent: Gold Laurel/Branch indicating honor -->
  <path d="M180 180 C190 160, 210 160, 220 180" fill="none" stroke="#ECC94B" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 180 L175 170" stroke="#ECC94B" stroke-width="2"/>
  <path d="M220 180 L225 170" stroke="#ECC94B" stroke-width="2"/>
</svg>