<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle radial glow for central focal point -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.6"/>

  <!-- Precision Mechanical Watch Movement (Representing 精巧 - intricate, exquisite physical object) -->
  <g transform="translate(120, 120)">
    <!-- Outer watch case ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#2D3548" stroke-width="3"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>

    <!-- Base gear plate / bridge -->
    <path d="M -45,-30 L -15,-60 L 35,-55 L 60,-20 L 45,35 L 10,65 L -40,45 Z" fill="#252B3A" stroke="#3A445D" stroke-width="1.5"/>

    <!-- Large intricate golden gear (Back) -->
    <g transform="rotate(15)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#D4AF37" stroke-width="5" stroke-dasharray="6,4" opacity="0.7"/>
      <circle cx="0" cy="0" r="38" fill="#1E2330" stroke="#D4AF37" stroke-width="1.5"/>
      <!-- Inner cutouts -->
      <circle cx="-14" cy="0" r="8" fill="#1A1D24"/>
      <circle cx="14" cy="0" r="8" fill="#1A1D24"/>
      <circle cx="0" cy="-14" r="8" fill="#1A1D24"/>
      <circle cx="0" cy="14" r="8" fill="#1A1D24"/>
    </g>

    <!-- Medium interlocking silver gear -->
    <g transform="translate(42, -22) rotate(42)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#A0AAB8" stroke-width="4" stroke-dasharray="4,3"/>
      <circle cx="0" cy="0" r="20" fill="#1E2330" stroke="#A0AAB8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#1A1D24"/>
    </g>

    <!-- Tiny precision gear meshing perfectly -->
    <g transform="translate(14, -36) rotate(12)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="3,2"/>
      <circle cx="0" cy="0" r="11" fill="#1E2330" stroke="#D4AF37" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#1A1D24"/>
    </g>

    <!-- Bottom offset micro gear -->
    <g transform="translate(-32, 30) rotate(-18)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#C27835" stroke-width="4" stroke-dasharray="4,3"/>
      <circle cx="0" cy="0" r="18" fill="#1E2330" stroke="#C27835" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#1A1D24"/>
    </g>

    <!-- Balance wheel assembly (Exquisite detail) -->
    <g transform="translate(-28, -25)">
      <!-- Balance bridge -->
      <path d="M -18,-10 C -5,-15 5,-15 18,-10" fill="none" stroke="#A0AAB8" stroke-width="3" stroke-linecap="round"/>
      <!-- Balance wheel rim -->
      <circle cx="0" cy="5" r="18" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
      <!-- Balance spokes -->
      <line x1="0" y1="5" x2="0" y2="-13" stroke="#D4AF37" stroke-width="2"/>
      <line x1="-12" y1="12" x2="12" y2="-2" stroke="#D4AF37" stroke-width="2"/>
      <!-- Hairspring spiral (stylized precision) -->
      <path d="M 0,5 C 4,5 6,2 3,0 C -1,-2 -3,2 -1,4" fill="none" stroke="#A0AAB8" stroke-width="1.2"/>
      <!-- Center jewel -->
      <circle cx="0" cy="5" r="3" fill="#E74C3C"/>
    </g>

    <!-- Ruby jewels (Bearing stones) - hallmark of fine watchmaking -->
    <circle cx="14" cy="-36" r="2.5" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <circle cx="42" cy="-22" r="2.5" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3.5" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <circle cx="-32" cy="30" r="2.5" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>

    <!-- Central watch hand pinion -->
    <circle cx="0" cy="0" r="4" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="1.5" fill="#1A1D24"/>

    <!-- Elegant sweeping watch hands indicating precision -->
    <line x1="0" y1="0" x2="25" y2="-45" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-35" y2="25" stroke="#A0AAB8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Accent sparkles emphasizing exquisite craftsmanship/precision -->
  <g fill="#D4AF37">
    <path d="M 195,70 L 197,75 L 202,77 L 197,79 L 195,84 L 193,79 L 188,77 L 193,75 Z" opacity="0.9"/>
    <path d="M 50,165 L 51,168 L 54,169 L 51,170 L 50,173 L 49,170 L 46,169 L 49,168 Z" opacity="0.7"/>
    <path d="M 175,175 L 176,178 L 179,179 L 176,180 L 175,183 L 174,180 L 171,179 L 174,178 Z" opacity="0.8"/>
  </g>
</svg>