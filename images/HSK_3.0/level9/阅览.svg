<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk -->
  <rect x="40" y="160" width="160" height="12" rx="2" fill="#343A46"/>
  <rect x="50" y="172" width="10" height="40" fill="#2A2F3A"/>
  <rect x="180" y="172" width="10" height="40" fill="#2A2F3A"/>
  
  <!-- Computer Monitor -->
  <rect x="70" y="80" width="100" height="70" rx="4" fill="#2A2F3A"/>
  <rect x="75" y="85" width="90" height="60" rx="2" fill="#4A5568"/>
  <rect x="85" y="95" width="70" height="4" rx="1" fill="#718096"/>
  <rect x="85" y="105" width="50" height="4" rx="1" fill="#718096"/>
  <rect x="85" y="115" width="60" height="4" rx="1" fill="#718096"/>
  
  <!-- Character Action (Reading/Browsing) -->
  <g transform="translate(100, 120)">
    <!-- Head -->
    <circle cx="60" cy="20" r="15" fill="#FFC09F"/>
    <!-- Hair -->
    <path d="M 45 20 A 15 15 0 0 1 75 20 L 75 10 A 15 15 0 0 0 45 10 Z" fill="#4A5568"/>
    <!-- Arm reaching to screen -->
    <path d="M 50 40 L 80 80" stroke="#FFC09F" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand interacting -->
    <circle cx="82" cy="82" r="6" fill="#FFC09F"/>
    <!-- Motion lines -->
    <path d="M 95 75 L 105 65" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
    <path d="M 100 80 L 110 70" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Chair -->
  <rect x="90" y="180" width="60" height="10" rx="2" fill="#4A5568"/>
</svg>