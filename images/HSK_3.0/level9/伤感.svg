<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Acoustic Guitar representing campus folk song/graduation memory -->
    <!-- Guitar Body -->
    <path d="M-22,25 C-38,25 -45,10 -38,-5 C-32,-20 -20,-30 0,-30 C20,-30 32,-20 38,-5 C45,10 38,25 22,25 Z" fill="#2E3440"/>
    <path d="M-18,35 C-35,35 -48,15 -40,-8 C-34,-24 -20,-38 0,-38 C20,-38 34,-24 40,-8 C48,15 35,35 18,35 Z" fill="none" stroke="#D08770" stroke-width="2.5" stroke-dasharray="4,2"/>
    
    <!-- Soundhole -->
    <circle cx="0" cy="5" r="11" fill="#1A1D24"/>
    <circle cx="0" cy="5" r="8" fill="none" stroke="#EBCB8B" stroke-width="1.5"/>
    
    <!-- Guitar Bridge -->
    <rect x="-8" y="20" width="16" height="4" rx="1" fill="#EBCB8B"/>
    <circle cx="-5" cy="22" r="1" fill="#2E3440"/>
    <circle cx="5" cy="22" r="1" fill="#2E3440"/>

    <!-- Guitar Neck -->
    <rect x="-4" y="-85" width="8" height="58" fill="#D08770"/>
    
    <!-- Frets -->
    <line x1="-4" y1="-75" x2="4" y2="-75" stroke="#2E3440" stroke-width="1"/>
    <line x1="-4" y1="-63" x2="4" y2="-63" stroke="#2E3440" stroke-width="1"/>
    <line x1="-4" y1="-51" x2="4" y2="-51" stroke="#2E3440" stroke-width="1"/>
    <line x1="-4" y1="-39" x2="4" y2="-39" stroke="#2E3440" stroke-width="1"/>

    <!-- Headstock -->
    <path d="M-6,-85 L6,-85 L4,-100 L-4,-100 Z" fill="#2E3440"/>
    
    <!-- Strings -->
    <line x1="-2" y1="-95" x2="-2" y2="22" stroke="#EBCB8B" stroke-width="0.75" opacity="0.6"/>
    <line x1="-1" y1="-95" x2="-1" y2="22" stroke="#EBCB8B" stroke-width="0.75" opacity="0.6"/>
    <line x1="1" y1="-95" x2="1" y2="22" stroke="#EBCB8B" stroke-width="0.75" opacity="0.6"/>
    <line x1="2" y1="-95" x2="2" y2="22" stroke="#EBCB8B" stroke-width="0.75" opacity="0.6"/>

    <!-- Melancholic Falling Note / Ripple Motif representing "bùi ngùi / 伤感" -->
    <g transform="translate(42, -35)">
      <path d="M0,0 C6,-6 6,-14 0,-20 C-6,-14 -6,-6 0,0 Z" fill="#5E81AC" opacity="0.9"/>
      <ellipse cx="-1" cy="-3" rx="1.5" ry="1" fill="#E5E9F0" opacity="0.6"/>
    </g>
    
    <g transform="translate(-48, -10)">
      <path d="M0,0 C4,-4 4,-10 0,-14 C-4,-10 -4,-4 0,0 Z" fill="#5E81AC" opacity="0.6"/>
    </g>
    
    <!-- Subtle teardrop accent floating downward -->
    <path d="M0,52 C3,47 5,43 5,40 C5,37 2.5,35 0,35 C-2.5,35 -5,37 -5,40 C-5,43 -3,47 0,52 Z" fill="#88C0D0" opacity="0.7"/>

  </g>
  
  <!-- Subtle minimalist framing line -->
  <rect x="16" y="16" width="208" height="208" rx="16" fill="none" stroke="#3B4252" stroke-width="1.5"/>
</svg>