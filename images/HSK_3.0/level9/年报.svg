<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow representing professional corporate data -->
  <circle cx="120" cy="120" r="80" fill="#2D333F" opacity="0.4"/>
  
  <!-- Annual Report Document (Base) -->
  <g transform="translate(64, 40)">
    <!-- Document background / pages -->
    <rect x="0" y="0" width="112" height="152" rx="8" fill="#222733" stroke="#3A4252" stroke-width="2"/>
    <rect x="12" y="12" width="88" height="128" rx="4" fill="#2B313F"/>
    
    <!-- Cover Header / Accent Bar -->
    <path d="M 12 16 C 12 13.7909 13.7909 12 16 12 L 96 12 C 98.2091 12 100 13.7909 100 16 L 100 36 L 12 36 Z" fill="#F59E0B"/>
    
    <!-- Financial Chart Representation (Bar chart & Line graph) -->
    <!-- Grid lines -->
    <line x1="24" y1="100" x2="88" y2="100" stroke="#3A4252" stroke-width="1"/>
    <line x1="24" y1="80" x2="88" y2="80" stroke="#3A4252" stroke-width="1"/>
    <line x1="24" y1="60" x2="88" y2="60" stroke="#3A4252" stroke-width="1"/>
    
    <!-- Bar chart pillars -->
    <rect x="30" y="80" width="10" height="20" rx="2" fill="#3B82F6"/>
    <rect x="46" y="70" width="10" height="30" rx="2" fill="#3B82F6"/>
    <rect x="62" y="55" width="10" height="45" rx="2" fill="#3B82F6"/>
    <rect x="78" y="45" width="10" height="55" rx="2" fill="#F59E0B"/>
    
    <!-- Trend Line overlay -->
    <path d="M 35 85 L 51 72 L 67 58 L 83 42" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="83" cy="42" r="3.5" fill="#10B981"/>

    <!-- Text placeholder lines at the bottom -->
    <rect x="24" y="114" width="60" height="4" rx="2" fill="#4B5563"/>
    <rect x="24" y="123" width="40" height="4" rx="2" fill="#4B5563"/>
  </g>

  <!-- Front overlapping folder tab / seal -->
  <g transform="translate(48, 120)">
    <rect x="0" y="20" width="144" height="64" rx="8" fill="#1F242D" stroke="#4F46E5" stroke-width="2" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))"/>
    
    <!-- Calendar/Year indicator badge -->
    <rect x="16" y="36" width="32" height="32" rx="6" fill="#4F46E5"/>
    <path d="M 24 46 L 40 46 M 24 54 L 36 54" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Document lines on folder flap -->
    <rect x="60" y="42" width="68" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="60" y="56" width="44" height="5" rx="2.5" fill="#6B7280"/>
  </g>
</svg>