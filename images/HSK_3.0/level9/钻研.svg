<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Background Layer -->
  <rect x="36" y="180" width="168" height="12" rx="4" fill="#2A2F3B"/>
  <rect x="60" y="192" width="120" height="8" rx="2" fill="#222630"/>

  <!-- Focused Researcher Figure (Upper Body) -->
  <g transform="translate(120, 150)">
    <!-- Body/Lab Coat -->
    <path d="M-40,40 C-40,15 -25,10 0,10 C25,10 40,15 40,40 L46,70 C46,75 42,80 36,80 L-36,80 C-42,80 -46,75 -46,70 Z" fill="#2E384D"/>
    <path d="M-15,10 L0,55 L15,10 Z" fill="#F0F4F8"/>
    <!-- Head -->
    <circle cx="0" cy="-12" r="18" fill="#E6BEA4"/>
    <!-- Hair -->
    <path d="M-18,-15 C-18,-26 -8,-32 0,-32 C8,-32 18,-26 18,-15 C18,-10 16,-4 16,-4 C16,-4 12,-8 0,-8 C-12,-8 -16,-4 -16,-4 C-16,-4 -18,-10 -18,-15 Z" fill="#2C221E"/>
    <!-- Focused Brow/Glasses -->
    <line x1="-8" y1="-12" x2="8" y2="-12" stroke="#2C221E" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-12" r="5" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="6" cy="-12" r="5" fill="none" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- Magnifying Focus Element & Micro-world (Deep Study) -->
  <g transform="translate(120, 95)">
    <!-- Glowing Focus Base / Target Zone -->
    <circle cx="0" cy="0" r="42" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Intricate Data / Circuitry / Core Subject Inside Lens -->
    <path d="M-15,10 L-5,-5 L5,5 L15,-10" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-15" cy="10" r="3" fill="#38BDF8"/>
    <circle cx="-5" cy="-5" r="3" fill="#F59E0B"/>
    <circle cx="5" cy="5" r="3" fill="#38BDF8"/>
    <circle cx="15" cy="-10" r="3.5" fill="#10B981"/>
    
    <!-- Floating Data Nodes representing deep analysis -->
    <circle cx="-20" cy="-15" r="1.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="18" cy="15" r="2" fill="#38BDF8" opacity="0.8"/>
    <circle cx="12" cy="-22" r="1" fill="#10B981" opacity="0.8"/>

    <!-- Magnifying Glass Rim -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#F59E0B" stroke-width="5"/>
    
    <!-- Magnifying Glass Handle extending downwards towards researcher -->
    <path d="M32,32 L58,58" stroke="#D97706" stroke-width="8" stroke-linecap="round"/>
    <path d="M32,32 L58,58" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Ambient Focus Sparks / Sparkle of Insight -->
  <path d="M 65 70 Q 70 70 70 65 Q 70 70 75 70 Q 70 70 70 75 Q 70 70 65 70 Z" fill="#F59E0B" opacity="0.9"/>
  <path d="M 175 90 Q 180 90 180 85 Q 180 90 185 90 Q 180 90 180 95 Q 180 90 175 90 Z" fill="#38BDF8" opacity="0.9"/>
</svg>