<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow / courtroom lighting -->
  <circle cx="120" cy="110" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Judge's Bench (Podium) -->
  <path d="M70 145 L170 145 L180 185 L60 185 Z" fill="#2D3748"/>
  <!-- Bench accent panel -->
  <path d="M75 152 L165 152 L172 178 L68 178 Z" fill="#3E4C59"/>
  <!-- Golden Scale of Justice Emblem on Bench -->
  <circle cx="120" cy="165" r="10" fill="#D69E2E" opacity="0.9"/>
  <path d="M115 163 H125 M120 160 V170" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Judge Character (Center, Elevated) -->
  <!-- Robe -->
  <path d="M98 100 L142 100 L148 150 L92 150 Z" fill="#2C3E50"/>
  <!-- White Collarette / Jabot -->
  <polygon points="112,100 128,100 124,115 116,115" fill="#FFFFFF"/>
  <!-- Head & Hair -->
  <circle cx="120" cy="85" r="14" fill="#FEEBC8"/>
  <path d="M106 82 C106 72 134 72 134 82 Z" fill="#4A5568"/>

  <!-- Judge's Gavel (Active Action - Raised hand striking) -->
  <g transform="translate(120, 110) rotate(-25)">
    <!-- Arm -->
    <path d="M0 10 L30 -10" stroke="#FEEBC8" stroke-width="6" stroke-linecap="round"/>
    <!-- Gavel Handle -->
    <line x1="25" y1="-12" x2="55" y2="-32" stroke="#B7791F" stroke-width="4" stroke-linecap="round"/>
    <!-- Gavel Head (Hammer) -->
    <rect x="42" y="-44" rx="3" width="20" height="12" fill="#975A16" transform="rotate(30 52 -38)"/>
  </g>

  <!-- Motion lines indicating the striking action -->
  <path d="M150 78 C155 75 160 78 162 84" stroke="#ECC94B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M156 70 C162 67 168 70 171 77" stroke="#ECC94B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Sound wave / Impact ripples from the gavel strike -->
  <path d="M168 95 Q178 105 168 115" stroke="#D69E2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M174 90 Q188 105 174 120" stroke="#D69E2E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Courtroom Elements: Scales of Justice (Left side background element) -->
  <g transform="translate(45, 95) scale(0.65)">
    <line x1="20" y1="10" x2="20" y2="70" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="20" x2="35" y2="20" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <!-- Left pan -->
    <line x1="5" y1="20" x2="2" y2="45" stroke="#718096" stroke-width="1.5"/>
    <line x1="5" y1="20" x2="18" y2="45" stroke="#718096" stroke-width="1.5"/>
    <path d="M2 45 Q10 52 18 45 Z" fill="#CBD5E0"/>
    <!-- Right pan -->
    <line x1="35" y1="20" x2="22" y2="45" stroke="#718096" stroke-width="1.5"/>
    <line x1="35" y1="20" x2="38" y2="45" stroke="#718096" stroke-width="1.5"/>
    <path d="M22 45 Q30 52 38 45 Z" fill="#CBD5E0"/>
    <!-- Base -->
    <ellipse cx="20" cy="73" rx="12" ry="4" fill="#718096"/>
  </g>

  <!-- Foreground Defense/Prosecution Desks (Setting the courtroom scene) -->
  <rect x="35" y="195" href="#" width="60" height="25" rx="4" fill="#2D3748"/>
  <rect x="145" y="195" width="60" height="25" rx="4" fill="#2D3748"/>
  
  <!-- Legal documents on desks (Minimalistic white blocks) -->
  <rect x="50" y="200" width="18" height="12" rx="1" fill="#E2E8F0"/>
  <rect x="172" y="200" width="18" height="12" rx="1" fill="#E2E8F0"/>
  <line x1="54" y1="204" x2="64" y2="204" stroke="#A0AEC0" stroke-width="1.5"/>
  <line x1="54" y1="208" x2="62" y2="208" stroke="#A0AEC0" stroke-width="1.5"/>

</svg>