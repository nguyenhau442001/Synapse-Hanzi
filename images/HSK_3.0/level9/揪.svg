<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/focus effect -->
  <circle cx="120" cy="120" r="80" fill="#242B38" opacity="0.6"/>

  <!-- Motion lines indicating action/sudden grab -->
  <g opacity="0.4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 60 90 L 85 95"/>
    <path d="M 50 120 L 80 120"/>
    <path d="M 55 150 L 80 135"/>
  </g>

  <!-- The Thief / Fleeing Character (Back/Shoulder area being grabbed) -->
  <g transform="translate(140, 60)">
    <!-- Body/Back -->
    <path d="M 20 40 C 35 45, 50 60, 55 90 L 15 90 C 15 70, 10 55, 0 45 Z" fill="#3B82F6"/>
    <!-- Head/Hoodie turning back -->
    <circle cx="10" cy="20" r="14" fill="#60A5FA"/>
    <path d="M -2 15 C 2 8, 18 8, 22 18 C 22 25, 15 30, 10 30 C 5 30, -2 22, -2 15 Z" fill="#2563EB"/>
    <!-- Dynamic fleeing lines -->
    <path d="M 45 40 L 70 30" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
    <path d="M 55 60 L 80 55" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- The Grabbed Object/Clothing (Stretched fabric indicating 'Túm lấy / Giật') -->
  <path d="M 125 100 C 135 105, 145 105, 155 100 C 145 108, 135 108, 125 100 Z" fill="#1D4ED8"/>
  <path d="M 130 102 C 140 115, 140 125, 132 135" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- The Rescuer's Hand (Strong, decisive grip - 'Túm, giật chặt') -->
  <g transform="translate(65, 85)">
    <!-- Arm -->
    <path d="M -30 45 C -15 35, 0 25, 20 20 L 25 35 C 10 40, -5 50, -20 65 Z" fill="#FBBF24"/>
    <!-- Sleeve (Heroic / Citizen outfit) -->
    <path d="M -35 50 C -20 40, -10 35, -5 32 L -10 55 C -20 55, -28 55, -35 50 Z" fill="#10B981"/>
    
    <!-- Fist firmly grabbing collar/clothes -->
    <circle cx="28" cy="25" r="12" fill="#F59E0B"/>
    <!-- Knuckles & Fingers wrapping tightly -->
    <path d="M 20 18 C 25 15, 32 15, 38 20 C 40 22, 38 28, 32 30 C 26 32, 22 28, 20 18 Z" fill="#D97706"/>
    <path d="M 22 23 C 26 21, 30 21, 34 24" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 24 28 C 28 27, 32 27, 35 30" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Impact / Tension Focal Point (Highlighting the exact moment of 'Jiū') -->
  <circle cx="132" cy="103" r="6" fill="#EF4444" opacity="0.9"/>
  <circle cx="132" cy="103" r="12" stroke="#EF4444" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>