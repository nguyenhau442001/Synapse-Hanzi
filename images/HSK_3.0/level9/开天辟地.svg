<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Background cosmic dust / stars representing the primordial void before creation -->
    <circle cx="-60" cy="-50" r="1.5" fill="#4A5568" opacity="0.6"/>
    <circle cx="70" cy="-70" r="1" fill="#4A5568" opacity="0.4"/>
    <circle cx="80" cy="40" r="1.5" fill="#4A5568" opacity="0.5"/>
    <circle cx="-75" cy="50" r="1" fill="#4A5568" opacity="0.7"/>

    <!-- The Great Split: "Khai Thiên Lập Địa" (Cleaving Heaven and Earth) -->
    
    <!-- UPPER HALF: HEAVEN (Qian / Light / Cosmos) ascending -->
    <g transform="translate(0, -38)">
      <!-- Golden radiant sun/cosmos representing the birth of heaven -->
      <circle cx="0" cy="-10" r="28" fill="#F6AD55" opacity="0.9"/>
      <circle cx="0" cy="-10" r="36" fill="none" stroke="#ED8936" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
      
      <!-- Rising celestial structure / atmospheric curve -->
      <path d="M-60,10 Q0,-15 60,10" fill="none" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
      <path d="M-40,22 Q0,0 40,22" fill="none" stroke="#90CDF4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- THE POWERFUL CLEAVING AXE / FORCE (Symbolizing unprecedented breakthrough) -->
    <g transform="rotate(-30)">
      <!-- Dynamic energy streak -->
      <path d="M-70,0 L70,0" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <path d="M-50,0 L50,0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Golden wedge / axe blade cutting through the center -->
      <path d="M10,-14 L35,0 L10,14 Z" fill="#ED8936"/>
      <path d="M22,-7 L42,0 L22,7 Z" fill="#F6AD55"/>
    </g>

    <!-- LOWER HALF: EARTH (Kun / Matter / Foundation) descending -->
    <g transform="translate(0, 38)">
      <!-- Solid tectonic plates / foundational strata -->
      <path d="M-65,-12 Q0,10 65,-12" fill="none" stroke="#48BB78" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-45,0 Q0,22 45,0" fill="none" stroke="#38A169" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-25,12 Q0,34 25,12" fill="none" stroke="#2F855A" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Central grounding core -->
      <rect x="-12" y="2" width="24" height="6" rx="2" fill="#2B6CB0"/>
    </g>

    <!-- Central energy burst representing the monumental, unprecedented moment ("xưa nay chưa từng có") -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#F6AD55" stroke-width="2" opacity="0.8"/>
  </g>
</svg>