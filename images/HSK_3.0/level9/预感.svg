<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 112)">
    <!-- Central Physical Object: A glowing crystal ball (representing intuition/premonition) resting on a sleek base -->
    
    <!-- Base shadow/glow -->
    <ellipse cx="0" cy="56" rx="36" ry="10" fill="#000000" opacity="0.4"/>
    <ellipse cx="0" cy="54" rx="28" ry="6" fill="#F5A623" opacity="0.15" filter="blur(4px)"/>

    <!-- Stand / Base -->
    <path d="M-16 46 L16 46 L20 54 L-20 54 Z" fill="#3E4C59" rx="2"/>
    <rect x="-12" y="38" width="24" height="10" rx="2" fill="#5C6F84"/>
    <path d="M-8 38 C-8 30 8 30 8 38 Z" fill="#8899A6"/>

    <!-- Crystal Ball Outer Glow -->
    <circle cx="0" cy="0" r="42" fill="#4A90E2" opacity="0.15" filter="blur(8px)"/>
    
    <!-- Crystal Ball Sphere -->
    <circle cx="0" cy="0" r="38" fill="url(#ballGradient)"/>
    
    <!-- Inner Storm / Premonition Imagery (Swirling dark clouds and faint amber flash inside the glass sphere) -->
    <clipPath id="ballClip">
      <circle cx="0" cy="0" r="38"/>
    </clipPath>
    
    <g clip-path="url(#ballClip)">
      <!-- Deep inner background -->
      <circle cx="0" cy="0" r="38" fill="#10141B"/>
      
      <!-- Swirling Clouds Inside -->
      <path d="M-40 10 C-20 0, 0 20, 20 5 C35 -8, 50 15, 55 25 L55 45 L-40 45 Z" fill="#2C3E50" opacity="0.8"/>
      <path d="M-45 20 C-25 10, -5 25, 15 15 C30 5, 45 20, 50 30 L50 45 L-45 45 Z" fill="#34495E" opacity="0.9"/>
      
      <!-- Ominous Amber Lightning / Foreboding Spark -->
      <path d="M2 -15 L-6 4 L4 6 L-2 24" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
      <circle cx="-2" cy="24" r="4" fill="#F5A623" opacity="0.6" filter="blur(2px)"/>
    </g>

    <!-- Glass Sphere Highlights (Glossy finish) -->
    <path d="M-26 -26 C-14 -36, 14 -36, 26 -26 C16 -32, -16 -32, -26 -26 Z" fill="#FFFFFF" opacity="0.4" stroke-linecap="round"/>
    <circle cx="-20" cy="-18" r="4" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="-14" cy="-22" r="2" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Outline ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#657786" stroke-width="1.5" opacity="0.6"/>

    <!-- Subtle Energy Ripples radiating outward (Pre-sentiment aura) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#F5A623" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#4A90E2" stroke-width="1" stroke-dasharray="2 6" opacity="0.3"/>
  </g>

  <!-- Gradients -->
  <defs>
    <radialGradient id="ballGradient" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2E5BFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1B2A4A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F141D" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
</svg>