      <path d="M10 12C10 10.8954 10.8954 10 12 10H20C21.1046 10 22 10.8954 22 12V22C22 23.1046 21.1046 24 20 24H12C10.8954 24 10 23.1046 10 22V12Z" fill="#1A1D24"/>
