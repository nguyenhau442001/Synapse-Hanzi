<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "回馈" (Giving back to society) as a corporate figure (representing the enterprise) 
       handing a scholarship/book to a student, symbolizing the act of social contribution. -->
  
  <!-- Ground line -->
  <path d="M40 190 H200" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Corporate Figure (Left) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="12" fill="#FBBF24"/>
    <path d="M8 40 C8 30, 32 30, 32 40 L30 80 L10 80 Z" fill="#3B82F6"/>
    <path d="M20 50 L35 70" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Student Figure (Right) -->
  <g transform="translate(140, 110)">
    <circle cx="20" cy="10" r="10" fill="#E5E7EB"/>
    <path d="M10 20 C10 15, 30 15, 30 20 L28 70 L12 70 Z" fill="#9CA3AF"/>
  </g>
  
  <!-- The "Gift/Contribution" (Book/Scholarship) being handed over -->
  <rect x="105" y="135" width="30" height="20" rx="2" fill="#FBBF24"/>
  <path d="M105 135 H135 M105 145 H135" stroke="#1A1D24" stroke-width="1"/>
  
  <!-- Gesture of giving -->
  <path d="M95 140 L105 140" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  <path d="M135 140 L145 140" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
</svg>