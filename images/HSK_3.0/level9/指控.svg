<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Gavel representing the legal accusation/judgment -->
  <g transform="translate(120, 120)">
    <!-- Gavel Head -->
    <rect x="-60" y="-20" width="120" height="40" rx="6" fill="#FFB84D"/>
    <rect x="-50" y="-30" width="100" height="15" rx="4" fill="#E69F33"/>
    
    <!-- Gavel Handle -->
    <rect x="-15" y="20" width="30" height="80" rx="5" fill="#FFB84D"/>
    <rect x="-5" y="20" width="10" height="80" fill="#E69F33"/>
    
    <!-- Sound block -->
    <rect x="-70" y="100" width="140" height="20" rx="4" fill="#3D4451"/>
  </g>
  
  <!-- Pointing finger representing the "accusation" action -->
  <path d="M180 60 L140 100 L150 110 L190 70 Z" fill="#FFB84D"/>
  <circle cx="190" cy="60" r="15" fill="#FFB84D"/>
</svg>