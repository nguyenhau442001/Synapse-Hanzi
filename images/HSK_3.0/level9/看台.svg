<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stadium Stand Structure -->
  <g transform="translate(40, 80)">
    <!-- Tier 1 -->
    <path d="M0 100 L160 100 L150 70 L10 70 Z" fill="#2D343E"/>
    <path d="M10 70 L150 70 L140 40 L20 40 Z" fill="#3A4350"/>
