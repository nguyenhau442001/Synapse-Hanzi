<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid/radar background lines for aerospace context -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A303C" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#2A303C" stroke-width="1"/>
  <circle cx="120" cy="120" r="35" fill="none" stroke="#2A303C" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="120" y1="20" x2="120" y2="220" stroke="#2A303C" stroke-width="1"/>
  <line x1="20" y1="120" x2="220" y2="120" stroke="#2A303C" stroke-width="1"/>

  <!-- Glowing background aura for the rocket -->
  <circle cx="120" cy="120" r="45" fill="#F59E0B" opacity="0.08"/>

  <!-- Rocket Body (Physical object representing absolute precision/guarantee) -->
  <g transform="translate(120, 115)">
    <!-- Flame / Exhaust -->
    <path d="M-8 42 L0 60 L8 42 Z" fill="#EF4444"/>
    <path d="M-4 42 L0 52 L4 42 Z" fill="#F59E0B"/>
    
    <!-- Fins -->
    <path d="M-12 25 L-22 38 L-12 33 Z" fill="#D97706"/>
    <path d="M12 25 L22 38 L12 33 Z" fill="#D97706"/>
    
    <!-- Main Fuselage -->
    <path d="M-12 -35 C-12 -35 -14 10 -14 30 C-14 36 14 36 14 30 C14 10 12 -35 12 -35 Z" fill="#E2E8F0"/>
    
    <!-- Nose Cone -->
    <path d="M0 -55 C6 -45 12 -35 12 -35 L-12 -35 C-12 -35 -6 -45 0 -55 Z" fill="#F59E0B"/>
    
    <!-- Window / Porthole -->
    <circle cx="0" cy="-12" r="5" fill="#1A1D24"/>
    <circle cx="0" cy="-12" r="3.5" fill="#38BDF8"/>
    <path d="M-2 -13 A2 2 0 0 1 2 -11" stroke="#E2E8F0" stroke-width="1" fill="none"/>
    
    <!-- Body stripe / detail -->
    <rect x="-13.5" y="8" width="27" height="4" fill="#EF4444"/>
  </g>

  <!-- Precision Checkmark Shield Floating near the Rocket (Representing "vàn vô nhất thất" / absolute error-free certainty) -->
  <g transform="translate(162, 70)">
    <circle cx="0" cy="0" r="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="#0F172A"/>
    <!-- Checkmark -->
    <path d="M-6 -1 L-2 4 L7 -6" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small crosshairs / alignment nodes indicating extreme exactness -->
  <g stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round">
    <!-- Top Left -->
    <path d="M55 70 h-8 v8"/>
    <!-- Bottom Right -->
    <path d="M185 170 h8 v-8"/>
  </g>
</svg>