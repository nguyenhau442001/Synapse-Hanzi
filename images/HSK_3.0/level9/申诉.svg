<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow/backdrop for focus -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Conceptual illustration for "申诉" (Formal appeal/grievance document with official seal & pen) -->
  <g transform="translate(0, 0)">
    <!-- Document shadow -->
    <rect x="73" y="47" width="94" height="136" rx="8" fill="#111318"/>

    <!-- Main Document Sheet -->
    <rect x="70" y="44" width="94" height="136" rx="8" fill="#F4F5F7"/>

    <!-- Document Header Accent Bar (Orange/Gold for legal/official focus) -->
    <path d="M 78 44 L 156 44 A 8 8 0 0 1 164 52 L 164 64 L 70 64 L 70 52 A 8 8 0 0 1 78 44 Z" fill="#F59E0B"/>

    <!-- Text lines on document representing formal appeal content -->
    <rect x="85" y="80" width="45" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="85" y="96" width="64" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="85" y="108" width="56" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="85" y="120" width="60" height="4" rx="2" fill="#E5E7EB"/>

    <!-- Official Red Seal/Stamp (Symbolizing formal legal petition/appeal) -->
    <circle cx="132" cy="144" r="14" fill="#EF4444" opacity="0.85"/>
    <circle cx="132" cy="144" r="10" fill="none" stroke="#FEF2F2" stroke-width="1.5" stroke-dasharray="3, 2"/>
    <rect x="128" y="141" width="8" height="6" rx="1" fill="#FEF2F2"/>

    <!-- Modern Stylized Pen (representing active submission/filing of appeal) -->
    <g transform="translate(130, 95) rotate(-35)">
      <!-- Pen Body -->
      <path d="M-4 0 L4 0 L3 60 L-3 60 Z" fill="#3B82F6"/>
      <!-- Pen Grip/Accent -->
      <rect x="-4" y="15" width="8" height="8" fill="#1D4ED8"/>
      <!-- Pen Tip -->
      <path d="M-3 60 L3 60 L0 72 Z" fill="#94A3B8"/>
      <!-- Pen Cap/Top -->
      <path d="M-4 0 L4 0 L3 -12 L-3 -12 Z" fill="#1E3A8A"/>
    </g>

    <!-- Upward directional indicator accent (subtle formal upward motion of appeal) -->
    <path d="M 52 110 L 42 100 L 52 90" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 45 100 L 62 100" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>