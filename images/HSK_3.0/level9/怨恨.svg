<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Heavy, jagged, dark stone-like block representing the burden of resentment -->
    <path d="M20 20 L100 10 L110 90 L30 110 Z" fill="#3D4451" stroke="#FF9F1C" stroke-width="3" stroke-linejoin="round"/>
    <!-- Cracks representing the internal bitterness -->
    <path d="M40 30 L70 50 M60 40 L50 80 M80 60 L100 30" stroke="#FF9F1C" stroke-width="2" stroke-linecap="round"/>
    <!-- Chains binding the object to show the weight of the noun -->
    <path d="M10 10 L40 30 M100 10 L80 30 M110 90 L90 110 M30 110 L50 90" stroke="#7A8494" stroke-width="4" stroke-linecap="round"/>
    <!-- A heavy iron shackle ring -->
    <circle cx="20" cy="20" r="12" fill="none" stroke="#7A8494" stroke-width="4"/>
    <circle cx="100" cy="10" r="12" fill="none" stroke="#7A8494" stroke-width="4"/>
    <circle cx="110" cy="90" r="12" fill="none" stroke="#7A8494" stroke-width="4"/>
    <circle cx="30" cy="110" r="12" fill="none" stroke="#7A8494" stroke-width="4"/>
  </g>
</svg>