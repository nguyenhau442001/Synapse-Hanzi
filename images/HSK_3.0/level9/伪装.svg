<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 15)">
    <!-- Ambient background foliage/habitat elements showing complexity -->
    <path d="M15 160 C 35 150, 45 130, 40 110 C 35 130, 20 145, 10 160 Z" fill="#243447" opacity="0.8"/>
    <path d="M185 140 C 170 120, 175 95, 195 80 C 185 100, 180 125, 190 145 Z" fill="#243447" opacity="0.8"/>
    
    <!-- Branch the chameleon is perched on -->
    <path d="M 20 160 Q 80 150 140 165 T 210 150" stroke="#374151" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 90 157 Q 130 170 170 160" stroke="#4B5563" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Chameleon Body - Flat Modern Vector Style -->
    <!-- Tail (Spiral) -->
    <path d="M 60 125 C 45 125, 35 110, 45 95 C 55 80, 75 85, 70 100" stroke="#10B981" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Main Body -->
    <ellipse cx="110" cy="115" rx="32" ry="24" fill="#10B981"/>
    
    <!-- Legs -->
    <path d="M 90 135 L 85 155 M 98 135 L 102 155" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
    <path d="M 125 130 L 135 152 M 133 130 L 145 150" stroke="#059669" stroke-width="5" stroke-linecap="round"/>

    <!-- Head -->
    <path d="M 130 110 C 140 110, 155 100, 160 85 C 165 100, 155 120, 135 122 Z" fill="#10B981"/>
    <!-- Eye turret -->
    <circle cx="145" cy="95" r="8" fill="#059669"/>
    <circle cx="147" cy="95" r="3" fill="#FBBF24"/>

    <!-- Camouflage Pattern Overlay (Camouflage/Disguise concept visual breakdown) -->
    <!-- Segment 1: Matching background texture (Blue/Slate triangles overlapping body) -->
    <polygon points="95,100 115,95 105,115" fill="#243447" opacity="0.85"/>
    <polygon points="120,110 135,100 130,125" fill="#243447" opacity="0.85"/>
    <polygon points="75,110 90,105 85,125" fill="#243447" opacity="0.85"/>

    <!-- Segment 2: Transition / Active Blending (Gold/Orange highlights showing adaptation) -->
    <circle cx="112" cy="118" r="6" fill="#FBBF24" opacity="0.7"/>
    <circle cx="130" cy="105" r="4" fill="#FBBF24" opacity="0.7"/>
    <path d="M 98 100 Q 105 90 115 105" stroke="#FBBF24" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Focus / Analysis indicator brackets (Subtle UI hints for educational context) -->
    <path d="M 15 45 L 15 30 L 30 30" stroke="#FBBF24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 185 45 L 185 30 L 170 30" stroke="#FBBF24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 15 175 L 15 190 L 30 190" stroke="#FBBF24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 185 175 L 185 190 L 170 190" stroke="#FBBF24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Subtle scanning line effect across the creature -->
    <line x1="40" y1="90" x2="160" y2="90" stroke="#FBBF24" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  </g>
</svg>