<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "公费" (State/Public funding/expenses for education/travel) -->
  <!-- Central Physical Object representation: An official government building or seal combined with a graduation scroll and flight/travel path indicating state-funded study abroad -->

  <!-- Subtle background glow / platform -->
  <ellipse cx="120" cy="180" rx="70" ry="16" fill="#252A34"/>

  <!-- Official Document / Scholarship Certificate Base -->
  <g transform="translate(65, 55)">
    <!-- Document shadow/back layer -->
    <rect x="5" y="5" width="100" height="120" rx="6" fill="#14171F" opacity="0.6"/>
    <!-- Main document paper -->
    <rect x="0" y="0" width="100" height="120" rx="6" fill="#2D3342"/>
    
    <!-- Header lines (representing official text) -->
    <rect x="18" y="20" width="64" height="6" rx="3" fill="#4F5D75"/>
    <rect x="18" y="34" width="40" height="4" rx="2" fill="#4F5D75"/>

    <!-- Content divider -->
    <line x1="18" y1="50" x2="82" y2="50" stroke="#3A4254" stroke-width="2"/>

    <!-- Academic Cap (Graduation symbol) -->
    <g transform="translate(35, 62)">
      <!-- Cap diamond -->
      <polygon points="15,0 35,8 15,16 -5,8" fill="#F39C12"/>
      <!-- Cap base/skullcap -->
      <path d="M5,13 v7 c0,5 20,5 20,0 v-7" fill="#D68910"/>
      <!-- Tassel -->
      <path d="M25,12 l10,8 v10" fill="none" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
      <circle cx="35" cy="31" r="2" fill="#F1C40F"/>
    </g>

    <!-- Official Seal / Stamp (representing State/Public funding "公") -->
    <circle cx="72" cy="90" r="18" fill="#E74C3C" opacity="0.9"/>
    <circle cx="72" cy="90" r="14" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M66,90 l4,4 8-8" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Golden Coins / Funds flowing into/out of the document (representing Financial support "费") -->
  <g transform="translate(0, 0)">
    <!-- Coin 1 -->
    <circle cx="45" cy="85" r="10" fill="#F1C40F"/>
    <circle cx="45" cy="85" r="6" fill="#2D3342"/>
    <!-- Coin 2 -->
    <circle cx="190" cy="110" r="12" fill="#F39C12"/>
    <circle cx="190" cy="110" r="7.5" fill="#2D3342"/>
    <!-- Coin 3 (falling/stacking) -->
    <circle cx="175" cy="140" r="8" fill="#F1C40F"/>
    <circle cx="175" cy="140" r="5" fill="#2D3342"/>
  </g>

  <!-- Accent highlight arc representing global travel / scholarship scope -->
  <path d="M 40 150 Q 120 185 200 150" fill="none" stroke="#3498DB" stroke-width="3" stroke-dasharray="6,6" opacity="0.8"/>
  
  <!-- Small airplane icon representing studying abroad -->
  <g transform="translate(115, 155) scale(0.7) rotate(-15)">
    <path d="M0,10 L20,0 L10,25 L5,15 L-5,15 Z" fill="#3498DB"/>
  </g>

</svg>