<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: A physical temporary structural prop/scaffolding holding up a blueprint board, representing "tạm hãy / tạm thời" (making do with the current setup until a better one arrives) -->
  
  <!-- Background subtle grid / planning elements -->
  <line x1="60" y1="180" x2="180" y2="180" stroke="#2D333D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Blueprint Board (Original Plan) -->
  <g>
    <!-- Board shadow -->
    <rect x="52" y="62" width="136" height="100" rx="6" fill="#111318"/>
    <!-- Board base -->
    <rect x="50" y="60" width="136" height="100" rx="6" fill="#252C38"/>
    <rect x="62" y="72" width="112" height="76" rx="4" fill="#1E232D"/>
    
    <!-- Plan schematic lines inside board -->
    <path d="M74 92 H114" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <path d="M74 112 H150" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <path d="M74 132 H130" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <circle cx="154" cy="92" r="6" fill="#F6AD55"/>
  </g>

  <!-- Temporary Adjustable Prop / Strut (姑且 - The temporary placeholder support) -->
  <g>
    <!-- Base plate -->
    <path d="M90 200 H150" stroke="#CBD5E0" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Lower telescoping cylinder -->
    <rect x="106" y="140" width="28" height="56" rx="3" fill="#4A5568"/>
    
    <!-- Adjustment collar / pin -->
    <rect x="102" y="134" width="36" height="10" rx="2" fill="#E2E8F0"/>
    <circle cx="120" cy="139" r="3" fill="#1A1D24"/>
    
    <!-- Upper telescoping cylinder -->
    <rect x="110" y="90" width="20" height="46" rx="2" fill="#CBD5E0"/>
    
    <!-- Top mounting plate angled to support the board -->
    <path d="M96 84 L144 84 L136 90 L104 90 Z" fill="#E2E8F0"/>
  </g>

  <!-- Focus/Action Accent: Glowing adjustment handle highlighting active "temporary" use -->
  <circle cx="146" cy="139" r="6" fill="#F6AD55"/>
</svg>