<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background graph / market trend lines (mờ mịt, khó đoán) -->
  <path d="M 40 140 Q 70 120, 100 150 T 160 100 T 200 130" fill="none" stroke="#2F3642" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M 40 160 Q 80 170, 110 130 T 170 140 T 210 110" fill="none" stroke="#2F3642" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Viewing platform edge / ground line -->
  <path d="M 30 190 L 210 190" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 198 L 200 198" stroke="#262C36" stroke-width="2" stroke-linecap="round"/>

  <!-- Character (Investor observing cautiously) -->
  <g transform="translate(100, 115)">
    <!-- Body / Torso -->
    <path d="M -15 75 L 15 75 L 20 40 L -20 40 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="14" fill="#FDE047"/>
    <!-- Neck -->
    <rect x="-4" y="32" width="8" height="10" fill="#FDE047"/>
    
    <!-- Arm leaning forward / holding posture -->
    <path d="M -15 45 L -35 55 L -45 50" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 15 45 L 35 55 L 45 65" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hands / Binoculars or hand shielding eyes -->
    <circle cx="-47" cy="48" r="6" fill="#FDE047"/>
  </g>

  <!-- High-contrast Accent: Telescope / Binoculars pointing toward the unpredictable future -->
  <g transform="translate(68, 145) rotate(-15)">
    <rect x="-25" y="-8" width="50" height="16" rx="8" fill="#F59E0B"/>
    <rect x="15" y="-11" width="12" height="22" rx="4" fill="#D97706"/>
    <rect x="-28" y="-10" width="8" height="20" rx="3" fill="#D97706"/>
    <!-- Lens reflection -->
    <line x1="20" y1="-7" x2="20" y2="7" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Motion/Sight lines extending from binoculars towards market trends -->
  <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8">
    <line x1="95" y1="130" x2="150" y2="105" stroke-dasharray="6 4"/>
    <line x1="95" y1="138" x2="165" y2="120" stroke-dasharray="4 4"/>
  </g>

  <!-- Subtle question mark / uncertainty indicator floating above the trend -->
  <path d="M 165 75 Q 172 65, 179 72 Q 185 78, 175 88 L 175 94" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="104" r="1.5" fill="#9CA3AF"/>
</svg>