<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for 籍贯 (Native place / Registration origin):
       Combines an official registry document (戶口簿/学籍) with a map pin and a home icon,
       visualizing official ancestral origin/hometown registration. -->

  <!-- Soft glow/shadow underneath -->
  <ellipse cx="120" cy="200" rx="70" ry="12" fill="#111318"/>

  <!-- Document Base (Household Register / Official Record) -->
  <g transform="translate(60, 45)">
    <!-- Document background -->
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#252A34" stroke="#343B48" stroke-width="2"/>
    
    <!-- Red Official Seal / Stamp accent -->
    <circle cx="95" cy="120" r="16" fill="none" stroke="#E54D42" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="95" cy="120" r="12" fill="#E54D42" opacity="0.2"/>

    <!-- Document Header Line -->
    <rect x="20" y="22" width="50" height="6" rx="3" fill="#E6AF2E"/>
    
    <!-- Document Text Lines (Abstracted) -->
    <rect x="20" y="44" width="80" height="4" rx="2" fill="#4E596E"/>
    <rect x="20" y="56" width="60" height="4" rx="2" fill="#4E596E"/>

    <!-- Sub-section for Origin / Hometown -->
    <rect x="20" y="76" width="80" height="45" rx="6" fill="#1E222B" stroke="#343B48" stroke-width="1.5"/>
    <rect x="30" y="88" width="40" height="4" rx="2" fill="#7888A0"/>
    <rect x="30" y="100" width="55" height="4" rx="2" fill="#E6AF2E"/>
  </g>

  <!-- Map Pin & Home Marker (Focal Point representing "Native Place") -->
  <g transform="translate(120, 95)">
    <!-- Pin drop shadow -->
    <ellipse cx="0" cy="55" rx="16" ry="5" fill="#0D0E12" opacity="0.6"/>

    <!-- Map Pin Outer Shape -->
    <path d="M 0,-30 C -18,-30 -32,-16 -32,2 C -32,18 0,50 0,50 C 0,50 32,18 32,2 C 32,-16 18,-30 0,-30 Z" fill="#E54D42"/>
    
    <!-- Pin Inner Cutout -->
    <circle cx="0" cy="0" r="18" fill="#1A1D24"/>

    <!-- House Icon inside Pin -->
    <path d="M -8,2 L 0,-5 L 8,2 L 8,10 L -8,10 Z" fill="#E6AF2E"/>
    <rect x="-3" y="4" width="6" height="6" fill="#1A1D24"/>
  </g>
</svg>