<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric background details (dune / desert edge context) -->
  <path d="M0 190 Q60 175 120 185 T240 180 L240 240 L0 240 Z" fill="#252A34"/>
  <path d="M0 205 Q90 195 180 210 T240 205 L240 240 L0 240 Z" fill="#1E232D"/>

  <!-- Distant wind/sand horizon glow -->
  <path d="M0 175 C80 170, 160 170, 240 175" stroke="#3A4454" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Poplar Tree (杨树) - Central Iconic Noun -->
  <!-- Deep Roots anchoring firmly in the saline-alkali soil -->
  <path d="M120 190 Q110 205 95 215 M120 190 Q130 205 145 215 M120 195 L120 210" stroke="#8A99AD" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Tall, straight, iconic trunk (高大挺拔) -->
  <path d="M116 65 L116 195 L124 195 L124 65 Z" fill="#78849E"/>
  <!-- Trunk texture highlights / bark lines -->
  <line x1="120" y1="70" x2="120" y2="190" stroke="#5A657D" stroke-width="1.5"/>
  <line x1="118" y1="85" x2="118" y2="105" stroke="#5A657D" stroke-width="1"/>
  <line x1="122" y1="120" x2="122" y2="145" stroke="#5A657D" stroke-width="1"/>
  <line x1="118" y1="160" x2="118" y2="180" stroke="#5A657D" stroke-width="1"/>

  <!-- Sturdy upward-reaching branches -->
  <path d="M116 90 Q95 75 80 60" stroke="#78849E" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M124 105 Q145 90 160 75" stroke="#78849E" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M118 75 Q105 50 100 35" stroke="#78849E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M122 80 Q135 55 140 40" stroke="#78849E" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Distinctive Poplar Foliage (triangular / heart-shaped leaves silhouette cluster in vibrant modern flat style) -->
  <!-- Top cluster -->
  <path d="M120 20 Q145 35 140 65 Q135 90 120 95 Q105 90 100 65 Q95 35 120 20 Z" fill="#2ECC71"/>
  
  <!-- Left mid cluster -->
  <path d="M85 55 Q105 50 110 75 Q105 95 85 90 Q65 85 70 65 Q75 55 85 55 Z" fill="#27AE60"/>

  <!-- Right mid cluster -->
  <path d="M155 70 Q135 65 130 90 Q135 110 155 105 Q175 100 170 80 Q165 70 155 70 Z" fill="#27AE60"/>

  <!-- Accent lighting (High-contrast focus on vitality) -->
  <path d="M120 25 Q135 40 132 60 Q125 80 120 85 Q115 80 108 60 Q105 40 120 25 Z" fill="#A3E4D7" opacity="0.3"/>

  <!-- Minimalist stylistic wind accent lines emphasizing resilience against wind (风沙) -->
  <path d="M25 50 Q45 45 65 55" stroke="#E67E22" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M15 80 Q40 75 55 85" stroke="#E67E22" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M175 120 Q195 115 215 125" stroke="#E67E22" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>