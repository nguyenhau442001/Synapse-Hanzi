<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Person's torso and arms -->
    <path d="M60 120 C60 90, 80 70, 120 70 C160 70, 180 90, 180 120 L180 160 L60 160 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="120" cy="60" r="30" fill="#E2E8F0"/>
    <!-- Working hands holding a tool (wrench/gear assembly) -->
    <path d="M90 130 L150 130 L145 150 L95 150 Z" fill="#F6AD55"/>
    <circle cx="120" cy="140" r="15" fill="#F6AD55"/>
    <path d="M110 130 L110 110 L130 110 L130 130" fill="none" stroke="#F6AD55" stroke-width="8" stroke-linecap="round"/>
    <!-- Gear icon representing the core technology/self-reliance -->
    <path d="M120 90 L125 80 L135 80 L140 90 L135 100 L125 100 Z" fill="#F6AD55"/>
    <circle cx="120" cy="90" r="8" fill="#1A1D24"/>
