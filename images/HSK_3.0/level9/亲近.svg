<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background organic subtle elements (Nature connection) -->
  <path d="M40 180 Q90 130 140 180 T240 180" fill="none" stroke="#252A34" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Central Scene representing "亲近大自然" (Hòa mình vào thiên nhiên / Thân thiết với tự nhiên) -->
  <!-- A person's hands gently interacting with a vibrant natural sprout/leaf, symbolizing closeness to nature -->
  
  <!-- Distant stylized sun / warm glow -->
  <circle cx="120" cy="85" r="32" fill="#2E2820"/>
  <circle cx="120" cy="85" r="24" fill="#E5A93B" opacity="0.15"/>

  <!-- Stylized green hills background -->
  <path d="M30 190 Q80 120 130 170 T210 190 Z" fill="#22302A"/>
  <path d="M70 190 Q120 140 170 190 Z" fill="#2A3D32"/>

  <!-- Character hands reaching out / cupping gently -->
  <!-- Left arm & hand -->
  <path d="M30 210 Q60 170 85 165" fill="none" stroke="#E59866" stroke-width="12" stroke-linecap="round"/>
  <circle cx="88" cy="164" r="7" fill="#E59866"/>

  <!-- Right arm & hand -->
  <path d="M210 210 Q180 170 155 165" fill="none" stroke="#E59866" stroke-width="12" stroke-linecap="round"/>
  <circle cx="152" cy="164" r="7" fill="#E59866"/>

  <!-- Central focal point: Vibrant glowing plant/sprout representing nature -->
  <!-- Stem -->
  <path d="M120 185 L120 135" fill="none" stroke="#2ECC71" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Leaves -->
  <!-- Left Leaf -->
  <path d="M120 155 Q95 140 100 120 Q115 125 120 155 Z" fill="#2ECC71"/>
  <!-- Right Leaf -->
  <path d="M120 145 Q145 130 140 110 Q125 115 120 145 Z" fill="#27AE60"/>
  <!-- Top central bud -->
  <circle cx="120" cy="125" r="8" fill="#58D68D"/>

  <!-- Focus accent ring -->
  <circle cx="120" cy="145" r="45" fill="none" stroke="#E5A93B" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
</svg>