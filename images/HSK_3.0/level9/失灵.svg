<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Sloped Road Background -->
    <path d="M 0,160 L 200,80 L 200,200 L 0,200 Z" fill="#222730" />
    <line x1="0" y1="160" x2="200" y2="80" stroke="#3A4250" stroke-width="4" stroke-linecap="round" />
    <!-- Road dashed line -->
    <path d="M 50,147 L 90,131 M 120,119 L 160,103" stroke="#F59E0B" stroke-width="3" stroke-dasharray="10,6" stroke-linecap="round" opacity="0.6"/>

    <!-- Car Body (Modern Flat Profile on Slope) -->
    <!-- Rotated/aligned with the slope: angle ~ atan(-80/200) approx -21.8 degrees -->
    <g transform="translate(10, 115) rotate(-21.8)">
      
      <!-- Motion/Danger Effect Lines Behind Car -->
      <path d="M -25,20 L -8,20" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M -30,30 L -12,30" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <path d="M -22,40 L -5,40" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

      <!-- Car Shadow -->
      <ellipse cx="60" cy="52" rx="55" ry="6" fill="#111318" opacity="0.4"/>

      <!-- Car Body Lower -->
      <path d="M 10,35 L 30,15 L 85,15 L 105,35 L 110,42 L 5,42 Z" fill="#3B82F6"/>
      <!-- Car Body Upper (Cabin) -->
      <path d="M 35,15 L 48,0 L 78,0 L 88,15 Z" fill="#2563EB"/>
      <!-- Windows -->
      <path d="M 38,13 L 48,3 L 60,3 L 60,13 Z" fill="#93C5FD" opacity="0.8"/>
      <path d="M 64,3 L 76,3 L 85,13 L 64,13 Z" fill="#93C5FD" opacity="0.8"/>

      <!-- Headlight & Tail light -->
      <circle cx="106" cy="38" r="3" fill="#FBBF24"/>
      <rect x="2" y="36" width="3" height="5" rx="1" fill="#EF4444"/>

      <!-- Wheels -->
      <circle cx="32" cy="42" r="13" fill="#111318"/>
      <circle cx="32" cy="42" r="6" fill="#6B7280"/>
      
      <circle cx="88" cy="42" r="13" fill="#111318"/>
      <circle cx="88" cy="42" r="6" fill="#6B7280"/>

      <!-- BRAKE FAILURE FOCUS: Glowing red X over wheel/brake area -->
      <g transform="translate(88, 42)">
        <circle cx="0" cy="0" r="10" fill="#EF4444" opacity="0.2"/>
        <line x1="-7" y1="-7" x2="7" y2="7" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="7" y1="-7" x2="-7" y2="7" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      
      <g transform="translate(32, 42)">
        <circle cx="0" cy="0" r="10" fill="#EF4444" opacity="0.2"/>
        <line x1="-7" y1="-7" x2="7" y2="7" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="7" y1="-7" x2="-7" y2="7" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
      </g>

    </g>

    <!-- Visual Warning Spark/Heat Symbols near brakes -->
    <path d="M 125,135 Q 130,125 135,135 T 145,135" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 72,157 Q 77,147 82,157 T 92,157" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>

  </g>
</svg>