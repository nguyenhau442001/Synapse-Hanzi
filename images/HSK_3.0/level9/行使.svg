<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "行使" (Exercising a right / Voting/Action of a citizen) -->
  <!-- Sleek modern flat design featuring a ballot box, voting ballot paper, and a hand placing it, symbolizing the legal execution of a constitutional right -->

  <!-- Background decorative subtle glow/elements -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.6"/>

  <!-- Ballot Box Base -->
  <g transform="translate(60, 110)">
    <!-- Box Front Face -->
    <path d="M 10 30 L 110 30 L 120 90 L 0 90 Z" fill="#2D3748"/>
    <path d="M 15 35 L 105 35 L 113 85 L 7 85 Z" fill="#323B4D"/>
    
    <!-- Box Front Panel Accent -->
    <rect x="35" y="50" width="50" height="20" rx="4" fill="#1E232E"/>
    <rect x="47" y="57" width="26" height="6" rx="2" fill="#F59E0B" opacity="0.8"/>

    <!-- Box Lid -->
    <polygon points="0,30 20,10 120,10 120,30" fill="#4A5568"/>
    <polygon points="10,30 25,15 115,15 110,30" fill="#5A6578"/>

    <!-- Ballot Slot -->
    <rect x="42" y="20" width="36" height="5" rx="2.5" fill="#111418"/>
  </g>

  <!-- Ballot Paper entering the slot -->
  <g transform="translate(100, 50)">
    <!-- Paper Body -->
    <rect x="0" y="0" width="40" height="55" rx="3" fill="#F8FAFC" transform="rotate(-12 20 27)" />
    <!-- Checkmark on Ballot -->
    <path d="M 12 22 L 18 28 L 28 16" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(3, 10) rotate(-12 20 27) scale(0.6)" />
    <!-- Lines on Ballot simulating text -->
    <line x1="14" y1="34" x2="32" y2="30" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" transform="rotate(-12 20 27)"/>
    <line x1="12" y1="44" x2="28" y2="40" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" transform="rotate(-12 20 27)"/>
  </g>

  <!-- Hand executing the action (Placing the ballot) -->
  <g transform="translate(105, 42)">
    <!-- Sleek Flat Design Hand -->
    <path d="M 20 50 C 20 35, 30 25, 45 25 C 55 25, 62 30, 65 35 L 70 20 C 72 15, 80 15, 83 20 L 90 40 C 95 38, 102 40, 105 45 L 110 55 C 115 65, 110 75, 100 80 L 70 95 C 55 102, 35 95, 25 80 Z" fill="#E2E8F0"/>
    
    <!-- Thumb pressing down -->
    <path d="M 35 45 C 30 50, 32 60, 40 65 L 55 70 C 60 72, 65 68, 63 62 C 60 55, 50 45, 42 42 Z" fill="#CBD5E1"/>
    
    <!-- Cuff / Sleeve hint -->
    <path d="M 15 75 L 30 65 L 45 80 L 30 95 Z" fill="#3B82F6"/>
  </g>

  <!-- Focus / Authority Symbol (Golden Star / Official Right context) -->
  <g transform="translate(170, 75)">
    <circle cx="0" cy="0" r="16" fill="#F59E0B" opacity="0.15"/>
    <circle cx="0" cy="0" r="12" fill="#F59E0B" opacity="0.25"/>
    <path d="M 0 -8 L 2 -2 L 8 -2 L 3 2 L 5 8 L 0 4 L -5 8 L -3 2 L -8 -2 L -2 -2 Z" fill="#F59E0B"/>
  </g>

</svg>