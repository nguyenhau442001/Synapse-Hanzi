<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (academic journal / office vibe) -->
  <path d="M40 180H200" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  
  <!-- The Academic Journal / Magazine (representing 主编's domain) -->
  <g transform="translate(48, 40)">
    <!-- Journal Base / Pages Stack -->
    <rect x="12" y="22" width="120" height="150" rx="4" fill="#252A37"/>
    <rect x="8" y="18" width="120" height="150" rx="4" fill="#2D3446"/>
    <rect x="4" y="14" width="120" height="150" rx="4" fill="#363E53"/>
    
    <!-- Main Cover -->
    <rect x="0" y="10" width="120" height="150" rx="4" fill="#404B65"/>
    
    <!-- Spine shading -->
    <path d="M0 14C0 11.7909 1.79086 10 4 10H16V160H4C1.79086 160 0 158.209 0 156V14Z" fill="#323A4D"/>

    <!-- Cover Layout (Abstract article preview) -->
    <rect x="24" y="32" width="72" height="10" rx="2" fill="#E2E8F0"/>
    <rect x="24" y="52" width="50" height="6" rx="1.5" fill="#64748B"/>
    <rect x="24" y="64" width="80" height="4" rx="1" fill="#4A5568"/>
    <rect x="24" y="74" width="70" height="4" rx="1" fill="#4A5568"/>
    <rect x="24" y="84" width="76" height="4" rx="1" fill="#4A5568"/>

    <!-- Review / Editing Mark (Checkmark in gold/orange accent) -->
    <circle cx="92" cy="122" r="20" fill="#F59E0B"/>
    <path d="M82 122L88 128L104 110" fill="none" stroke="#1A1D24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Editorial Fountain Pen (Symbolizing the Chief Editor's revision & authority) -->
  <g transform="translate(130, 20) rotate(25)">
    <!-- Pen Body -->
    <rect x="0" y="0" width="18" height="100" rx="3" fill="#F59E0B"/>
    <!-- Gold Band -->
    <rect x="0" y="80" width="18" height="6" fill="#FDE047"/>
    <!-- Pen Grip -->
    <path d="M0 86H18V115C18 116.657 16.6569 118 15 118H3C1.34315 118 0 116.657 0 115V86Z" fill="#1E293B"/>
    <!-- Nib -->
    <path d="M3 118H15L9 140L3 118Z" fill="#CBD5E1"/>
    <!-- Nib slit -->
    <line x1="9" y1="118" x2="9" y2="132" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="9" cy="124" r="1" fill="#64748B"/>
  </g>
</svg>