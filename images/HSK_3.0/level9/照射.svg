<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background / Room Elements -->
  <!-- Window frame outlining the light source -->
  <path d="M40 50 H90 V190 H40 Z" fill="#222730" stroke="#2D323E" stroke-width="2"/>
  <line x1="65" y1="50" x2="65" y2="190" stroke="#2D323E" stroke-width="2"/>
  <line x1="40" y1="120" x2="90" y2="120" stroke="#2D323E" stroke-width="2"/>

  <!-- Warm golden light rays shining through the window onto the desk -->
  <polygon points="65,90 200,120 200,190 65,130" fill="url(#sunbeamGradient)" opacity="0.85"/>
  <polygon points="65,110 215,160 215,195 65,150" fill="url(#sunbeamGradient)" opacity="0.4"/>

  <!-- Desk Surface -->
  <path d="M20 185 H220 L200 215 H40 Z" fill="#2C323D"/>
  <rect x="20" y="180" width="200" height="6" rx="3" fill="#384050"/>

  <!-- Objects on the desk (Book & Pencil) being illuminated -->
  <!-- Book -->
  <path d="M100 180 L140 168 L170 183 L130 195 Z" fill="#3E4859"/>
  <path d="M100 180 L135 169 L135 195 L100 195 Z" fill="#4E5A6E"/>
  <path d="M135 169 L170 183 L170 195 L135 195 Z" fill="#5B687D"/>
  <!-- Open pages highlight -->
  <path d="M110 178 L133 171 L133 189 L110 196 Z" fill="#8C9BAE"/>
  <path d="M137 171 L160 178 L160 196 L137 189 Z" fill="#A3B1C2"/>

  <!-- Small Plant Pot on Desk -->
  <path d="M75 178 L85 178 L88 190 L72 190 Z" fill="#D97706"/>
  <ellipse cx="80" cy="178" rx="5" ry="2" fill="#F59E0B"/>
  <!-- Plant Stem & Leaves illuminated -->
  <path d="M80 178 Q82 165 77 158" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M78 168 Q70 163 72 155 Q80 157 78 168 Z" fill="#34D399"/>
  <path d="M80 163 Q88 158 87 150 Q79 152 80 163 Z" fill="#059669"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="sunbeamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
</svg>