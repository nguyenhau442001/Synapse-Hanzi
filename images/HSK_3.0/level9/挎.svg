<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Tea Garden Background Elements -->
  <path d="M20 200 Q 60 160 100 200 T 180 200" fill="none" stroke="#2D5A27" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 220 Q 40 180 80 220 T 160 220 T 240 220" fill="#2D5A27"/>
  
  <!-- Character Body -->
  <g transform="translate(110, 100)">
    <!-- Arm and Shoulder -->
    <path d="M-20 20 L 20 20" stroke="#FFB347" stroke-width="8" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M-15 20 L -25 120 L 25 120 L 15 20" fill="#FFB347"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#FFB347"/>
  </g>
  
  <!-- The Basket (The object being "kuà") -->
  <g transform="translate(95, 120)">
    <!-- Strap (Diagonal) -->
    <path d="M-10 -20 L 40 20" stroke="#E0A860" stroke-width="4" stroke-linecap="round"/>
    <!-- Basket Body -->
    <path d="M30 20 L 60 20 L 55 60 L 35 60 Z" fill="#D2B48C" stroke="#A0522D" stroke-width="2"/>
    <!-- Basket Texture -->
    <path d="M35 30 L 55 30 M37 40 L 53 40 M39 50 L 51 50" stroke="#8B4513" stroke-width="1"/>
  </g>
  
  <!-- Motion Lines -->
  <g stroke="#5D6D7E" stroke-width="2" stroke-linecap="round">
    <path d="M160 100 L 180 90" />
    <path d="M165 110 L 185 100" />
  </g>
</svg>