<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle topographic background lines representing terrain/exploration -->
  <path d="M30 180 Q80 150 130 170 T230 160" fill="none" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M20 200 Q70 170 140 190 T220 180" fill="none" stroke="#2A303C" stroke-width="1.5"/>
  <path d="M40 160 Q90 130 150 150 T210 140" fill="none" stroke="#2A303C" stroke-width="1.5"/>

  <!-- Glowing path representing a journey across mountains and rivers -->
  <path d="M50 190 Q90 140 130 160 T190 90 T210 50" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="12" stroke-linecap="round"/>
  <path d="M50 190 Q90 140 130 160 T190 90 T210 50" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Mountain silhouette in background -->
  <path d="M140 110 L190 60 L220 90 L240 120 L140 120 Z" fill="#242B35"/>
  <path d="M170 80 L190 60 L210 82" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Main Footprints (Dấu chân / Vết chân) -->
  <!-- First footprint (left, smaller, fading) -->
  <g transform="translate(85, 145) rotate(-15)">
    <ellipse cx="0" cy="0" rx="10" ry="14" fill="#3B82F6" fill-opacity="0.3"/>
    <circle cx="-6" cy="-16" r="3" fill="#3B82F6" fill-opacity="0.3"/>
    <circle cx="-1" cy="-19" r="3" fill="#3B82F6" fill-opacity="0.3"/>
    <circle cx="4" cy="-18" r="2.5" fill="#3B82F6" fill-opacity="0.3"/>
    <circle cx="8" cy="-15" r="2" fill="#3B82F6" fill-opacity="0.3"/>
  </g>

  <!-- Second footprint (middle) -->
  <g transform="translate(120, 115) rotate(10)">
    <ellipse cx="0" cy="0" rx="12" ry="17" fill="#60A5FA" fill-opacity="0.6"/>
    <circle cx="-7" cy="-20" r="3.5" fill="#60A5FA" fill-opacity="0.6"/>
    <circle cx="-1" cy="-23" r="3.5" fill="#60A5FA" fill-opacity="0.6"/>
    <circle cx="5" cy="-21" r="3" fill="#60A5FA" fill-opacity="0.6"/>
    <circle cx="10" cy="-17" r="2.5" fill="#60A5FA" fill-opacity="0.6"/>
  </g>

  <!-- Third footprint (foreground, vivid orange/gold highlight) -->
  <g transform="translate(165, 85) rotate(-5)">
    <!-- Sole -->
    <ellipse cx="0" cy="0" rx="15" ry="21" fill="#F59E0B"/>
    <!-- Toes -->
    <circle cx="-9" cy="-25" r="4.5" fill="#F59E0B"/>
    <circle cx="-2" cy="-29" r="4.5" fill="#F59E0B"/>
    <circle cx="5" cy="-27" r="3.8" fill="#F59E0B"/>
    <circle cx="11" cy="-22" r="3" fill="#F59E0B"/>
    <circle cx="15" cy="-16" r="2.2" fill="#F59E0B"/>
    
    <!-- Inner sole highlight for depth -->
    <ellipse cx="0" cy="2" rx="10" ry="14" fill="#D97706" opacity="0.4"/>
  </g>

  <!-- Sparkle/Discovery accents -->
  <path d="M190 55 L192 63 L200 65 L192 67 L190 75 L188 67 L180 65 L188 63 Z" fill="#FBBF24"/>
  <path d="M100 120 L101 125 L106 126 L101 127 L100 132 L99 127 L94 126 L99 125 Z" fill="#60A5FA" opacity="0.7"/>
</svg>