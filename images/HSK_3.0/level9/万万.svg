<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle glowing warning grid to match the high-voltage inspection context -->
  <path d="M120 40 L190 85 L190 155 L120 200 L50 155 L50 85 Z" fill="none" stroke="#2D323E" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Conceptual illustration for "万万不可" (Absolute Prohibition / Safety Warning) -->
  <!-- Tower structure apex / High Voltage Pylons context -->
  <g transform="translate(0, 5)">
    <!-- Warning Shield / Stop Base (Iconic representation of absolute prohibition) -->
    <path d="M120 35 C150 35 180 40 180 40 L180 110 C180 150 150 180 120 195 C90 180 60 150 60 110 L60 40 C60 40 90 35 120 35 Z" fill="#242B38" stroke="#3A4456" stroke-width="2"/>
    <path d="M120 45 C146 45 170 49 170 49 L170 108 C170 142 144 168 120 182 C96 168 70 142 70 108 L70 49 C70 49 94 45 120 45 Z" fill="#1E232E"/>

    <!-- High Voltage Transmission Tower Silhouette -->
    <path d="M105 70 L135 70 L140 130 L100 130 Z" fill="#2A313D"/>
    <line x1="90" y1="85" x2="150" y2="85" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="105" x2="155" y2="105" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Safety Hazard / Absolute Prohibition Symbol (Bold Red Prohibited Sign overlaid) -->
    <circle cx="120" cy="105" r="42" fill="#1A1D24" stroke="#EF4444" stroke-width="6"/>
    <line x1="90" y1="75" x2="150" y2="135" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>

    <!-- Operational glove / human hand element showing caution / stop action -->
    <g transform="translate(100, 132)">
      <!-- Arm / Sleeve -->
      <path d="M10 25 L30 25 L35 45 L5 45 Z" fill="#3B82F6"/>
      <!-- Protective Glove Palm -->
      <circle cx="20" cy="18" r="14" fill="#F59E0B"/>
      <!-- Fingers -->
      <rect x="12" y="0" width="4" height="10" rx="2" fill="#F59E0B"/>
      <rect x="18" y="-2" width="4" height="10" rx="2" fill="#F59E0B"/>
      <rect x="24" y="0" width="4" height="10" rx="2" fill="#F59E0B"/>
    </g>

    <!-- Electric Sparks / Danger accents -->
    <path d="M78 62 L88 68 L82 74 L92 80" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M162 62 L152 68 L158 74 L148 80" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>