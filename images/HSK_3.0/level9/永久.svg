<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Infinity loop base shadow/glow -->
    <path d="M-45,-20 C-65,-20 -80,-5 -80,15 C-80,35 -65,50 -45,50 C-25,50 -10,35 15,0 C40,-35 55,-50 75,-50 C95,-50 110,-35 110,-15 C110,5 95,20 75,20 C55,20 40,5 15,-30 C-10,-65 -25,-80 -45,-80 C-65,-80 -80,-65 -80,-45 C-80,-25 -65,-20 -45,-20 Z" 
          fill="none" stroke="#252A34" stroke-width="20" stroke-linecap="round"/>

    <!-- Main golden infinity loop representing eternity/permanence -->
    <path d="M-45,-20 C-65,-20 -80,-5 -80,15 C-80,35 -65,50 -45,50 C-25,50 -10,35 15,0 C40,-35 55,-50 75,-50 C95,-50 110,-35 110,-15 C110,5 95,20 75,20 C55,20 40,5 15,-30 C-10,-65 -25,-80 -45,-80 C-65,-80 -80,-65 -80,-45 C-80,-25 -65,-20 -45,-20 Z" 
          fill="none" stroke="url(#goldGradient)" stroke-width="12" stroke-linecap="round"/>

    <!-- Structural nodes representing everlasting bonds/treaty connection -->
    <circle cx="-45" cy="15" r="7" fill="#FFA500"/>
    <circle cx="75" cy="-15" r="7" fill="#FFA500"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
</svg>