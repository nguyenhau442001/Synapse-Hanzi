<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Base Platform -->
    <ellipse cx="0" cy="70" rx="75" ry="16" fill="#222732" stroke="#2F3646" stroke-width="2"/>
    
    <!-- Left Calendar (Previous Year Same Period - e.g., Q2 Last Year) -->
    <g transform="translate(-65, -35)">
      <!-- Calendar Base Card -->
      <rect x="-32" y="-45" width="64" height="76" rx="8" fill="#242B38" stroke="#3A4458" stroke-width="2"/>
      <!-- Calendar Header -->
      <path d="M -32 -37 C -32 -41.4 -28.4 -45 -24 -45 L 24 -45 C 28.4 -45 32 -41.4 32 -37 L 32 -22 L -32 -22 Z" fill="#3B82F6"/>
      <!-- Binder Rings -->
      <circle cx="-16" cy="-48" r="3" fill="#64748B"/>
      <circle cx="16" cy="-48" r="3" fill="#64748B"/>
      <!-- Grid Cells (Representing time period / month) -->
      <rect x="-22" y="-14" width="10" height="10" rx="2" fill="#334155"/>
      <rect x="-6" y="-14" width="10" height="10" rx="2" fill="#334155"/>
      <rect x="10" y="-14" width="10" height="10" rx="2" fill="#334155"/>
      
      <rect x="-22" y="0" width="10" height="10" rx="2" fill="#334155"/>
      <rect x="-6" y="0" width="10" height="10" rx="2" fill="#334155"/>
      <rect x="10" y="0" width="10" height="10" rx="2" fill="#334155"/>

      <rect x="-22" y="14" width="10" height="10" rx="2" fill="#334155"/>
      <rect x="-6" y="14" width="10" height="10" rx="2" fill="#334155"/>
      <rect x="10" y="14" width="10" height="10" rx="2" fill="#334155"/>
      
      <!-- Label indicator -->
      <text x="0" y="52" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle" font-weight="bold">Q2 PREV</text>
    </g>

    <!-- Right Calendar (Current Year Same Period - e.g., Q2 This Year with Growth) -->
    <g transform="translate(65, -35)">
      <!-- Calendar Base Card -->
      <rect x="-32" y="-45" width="64" height="76" rx="8" fill="#242B38" stroke="#F59E0B" stroke-width="2"/>
      <!-- Calendar Header -->
      <path d="M -32 -37 C -32 -41.4 -28.4 -45 -24 -45 L 24 -45 C 28.4 -45 32 -41.4 32 -37 L 32 -22 L -32 -22 Z" fill="#F59E0B"/>
      <!-- Binder Rings -->
      <circle cx="-16" cy="-48" r="3" fill="#64748B"/>
      <circle cx="16" cy="-48" r="3" fill="#64748B"/>
      <!-- Grid Cells with Growth Highlights (Gold/Orange theme) -->
      <rect x="-22" y="-14" width="10" height="10" rx="2" fill="#FDE68A"/>
      <rect x="-6" y="-14" width="10" height="10" rx="2" fill="#FDE68A"/>
      <rect x="10" y="-14" width="10" height="10" rx="2" fill="#FDE68A"/>
      
      <rect x="-22" y="0" width="10" height="10" rx="2" fill="#FDE68A"/>
      <rect x="-6" y="0" width="10" height="10" rx="2" fill="#FDE68A"/>
      <rect x="10" y="0" width="10" height="10" rx="2" fill="#FDE68A"/>

      <rect x="-22" y="14" width="10" height="10" rx="2" fill="#FDE68A"/>
      <rect x="-6" y="14" width="10" height="10" rx="2" fill="#FDE68A"/>
      <rect x="10" y="14" width="10" height="10" rx="2" fill="#F59E0B"/>
      
      <!-- Label indicator -->
      <text x="0" y="52" font-family="sans-serif" font-size="10" fill="#F59E0B" text-anchor="middle" font-weight="bold">Q2 CURR</text>
    </g>

    <!-- Connecting Growth Arrow & Comparison Arc -->
    <g transform="translate(0, -25)">
      <!-- Smooth comparison curved trajectory -->
      <path d="M -32 -10 Q 0 -35 32 -10" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
      
      <!-- Upward Growth Arrow Badge in the center -->
      <circle cx="0" cy="-28" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
      <!-- Up Arrow Icon -->
      <path d="M 0 -36 L -6 -26 L -3 -26 L -3 -20 L 3 -20 L 3 -26 L 6 -26 Z" fill="#F59E0B"/>
    </g>

    <!-- Scale / Comparison Indicator Bars rising upward at the bottom -->
    <g transform="translate(0, 40)">
      <!-- Left shorter bar (Past) -->
      <rect x="-42" y="-15" width="12" height="15" rx="3" fill="#3B82F6"/>
      <!-- Right taller bar (Present with growth) -->
      <rect x="30" y="-25" width="12" height="25" rx="3" fill="#F59E0B"/>
      <!-- Equal base line connecting them visually -->
      <line x1="-55" y1="0" x2="55" y2="0" stroke="#3A4458" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>