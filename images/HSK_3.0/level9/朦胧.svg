<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nightSky" x1="120" y1="0" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#222836"/>
    </linearGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow" cx="120" cy="70" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2EDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#A5C4E0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>

    <!-- Fog Gradient for Hazy Layer -->
    <linearGradient id="fogGrad" x1="120" y1="120" x2="120" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B8C9E" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#55667A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2D3748" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Clip Path for Water Reflection -->
    <clipPath id="lakeClip">
      <path d="M 40,165 Q 120,155 200,165 L 215,210 Q 120,225 25,210 Z"/>
    </clipPath>
  </defs>

  <!-- Sky Background -->
  <rect x="0" y="0" width="240" height="170" fill="url(#nightSky)"/>

  <!-- Distant Stars / Sparkles -->
  <circle cx="50" cy="40" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="85" cy="25" r="1.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="170" cy="35" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="205" cy="65" r="1.2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="35" cy="85" r="0.8" fill="#FFFFFF" opacity="0.7"/>

  <!-- Moon Glow & Crescent/Full Moon -->
  <circle cx="120" cy="70" r="50" fill="url(#moonGlow)"/>
  <circle cx="120" cy="70" r="22" fill="#F0F4F8"/>
  <!-- Moon crater detail for texture -->
  <circle cx="113" cy="63" r="4" fill="#D5E0EC" opacity="0.6"/>
  <circle cx="128" cy="77" r="3" fill="#D5E0EC" opacity="0.5"/>
  <circle cx="123" cy="60" r="2" fill="#D5E0EC" opacity="0.4"/>

  <!-- Far Mountains (Misty / 朦胧 - Hazy, Indistinct) -->
  <!-- Mountain Range 1 (Back, lighter, heavily blurred/obscured) -->
  <path d="M 10,140 Q 60,95 120,115 Q 180,90 230,135 L 230,170 L 10,170 Z" fill="#364152" opacity="0.4"/>
  
  <!-- Mountain Range 2 (Mid, wrapped in night mist) -->
  <path d="M 0,150 Q 70,110 130,130 Q 190,105 240,145 L 240,175 L 0,175 Z" fill="#2B3442" opacity="0.7"/>

  <!-- Layer of Night Mist (烟雾) crossing the mountains -->
  <path d="M 0,125 Q 60,145 120,125 Q 180,105 240,135 L 240,165 Q 180,145 120,165 Q 60,185 0,155 Z" fill="#7A8B9E" opacity="0.25" filter="blur(4px)"/>
  <path d="M 20,135 Q 90,115 150,145 Q 210,120 240,140 L 240,170 Q 210,155 150,170 Q 90,190 20,160 Z" fill="#A4B3C6" opacity="0.2" filter="blur(6px)"/>

  <!-- Lake / Water Surface -->
  <path d="M 25,165 Q 120,155 215,165 L 225,215 Q 120,230 15,215 Z" fill="#141821"/>
  
  <!-- Water Body with Clip -->
  <g clip-path="url(#lakeClip)">
    <!-- Base water color -->
    <rect x="0" y="160" width="240" height="70" fill="#1A212D"/>
    
    <!-- Moon Reflection in Water (Misty & Shimmering) -->
    <ellipse cx="120" cy="180" rx="25" ry="4" fill="#E2EDF8" opacity="0.3"/>
    <ellipse cx="118" cy="192" rx="35" ry="3" fill="#C5D9ED" opacity="0.2"/>
    <ellipse cx="122" cy="204" rx="45" ry="2.5" fill="#A5C4E0" opacity="0.15"/>
    <ellipse cx="120" cy="214" rx="30" ry="2" fill="#8BB0D1" opacity="0.1"/>

    <!-- Gentle Ripples -->
    <path d="M 60,180 Q 90,176 120,180 Q 150,184 180,180" stroke="#8BB0D1" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 40,195 ID 80,192 120,195 Q 160,198 200,195" stroke="#8BB0D1" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M 75,210 Q 100,207 125,210 Q 150,213 175,210" stroke="#8BB0D1" stroke-width="0.8" fill="none" opacity="0.2"/>
  </g>

  <!-- Foreground Silhouettes framing the scene (Reeds / Pine branch silhouette) -->
  <path d="M 0,240 L 0,190 Q 10,185 15,210 Q 20,180 30,240 Z" fill="#11141B"/>
  <path d="M 240,240 L 235,195 Q 228,185 222,210 Q 215,180 205,240 Z" fill="#11141B"/>

  <!-- Atmospheric Haze Overlay to unify the "Ménglóng" (Misty/Dreamy/Obscured) aesthetic -->
  <rect x="0" y="0" width="240" height="240" fill="url(#fogGrad)" pointer-events="none" style="mix-blend-mode: overlay;"/>

  <!-- Subtle glowing vignette for modern UI card feel -->
  <rect x="0" y="0" width="240" height="240" rx="24" fill="none" stroke="#3A4454" stroke-width="2" opacity="0.4"/>
</svg>