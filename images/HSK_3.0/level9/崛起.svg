<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle grid / rising grid lines representing tech evolution -->
  <g opacity="0.15">
    <line x1="40" y1="200" x2="200" y2="200" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="50" y1="170" x2="190" y2="170" stroke="#38BDF8" stroke-width="1"/>
    <line x1="60" y1="140" x2="180" y2="140" stroke="#38BDF8" stroke-width="1"/>
    <line x1="70" y1="110" x2="170" y2="110" stroke="#38BDF8" stroke-width="1"/>
    <line x1="80" y1="80" x2="160" y2="80" stroke="#38BDF8" stroke-width="1"/>
    
    <!-- Perspective lines -->
    <line x1="120" y1="40" x2="40" y2="200" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="120" y1="40" x2="200" y2="200" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="4 4"/>
  </g>

  <!-- Glowing upward trajectory aura -->
  <defs>
    <linearGradient id="riseGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Rising beam of light/energy -->
  <polygon points="105,210 135,210 145,50 95,50" fill="url(#riseGlow)"/>

  <!-- Dynamic Upward Arrow / Tech Monolith Structure representing a rising startup/entity -->
  <g>
    <!-- Base Platform -->
    <ellipse cx="120" cy="205" rx="35" ry="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    
    <!-- Rising sleek rocket/pillar representing "juéqǐ" (崛起 - surging upward) -->
    <!-- Fins -->
    <path d="M100,175 L85,195 L105,190 Z" fill="#F59E0B"/>
    <path d="M140,175 L155,195 L135,190 Z" fill="#F59E0B"/>

    <!-- Main Body -->
    <path d="M120,45 C120,45 95,110 95,155 C95,175 105,190 120,190 C135,190 145,175 145,155 C145,110 120,45 120,45 Z" fill="url(#rocketBody)" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Window / Core node (Tech startup symbolism) -->
    <circle cx="120" cy="115" r="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="120" cy="115" r="4" fill="#38BDF8"/>

    <!-- Thrust / Energy Burst at base -->
    <path d="M110,190 L120,225 L130,190 Z" fill="url(#flame)"/>
    <path d="M114,190 L120,215 L126,190 Z" fill="#FEF08A"/>

    <!-- Dynamic upward motion sparks/particles -->
    <circle cx="105" cy="35" r="2.5" fill="#38BDF8"/>
    <circle cx="138" cy="28" r="1.5" fill="#F59E0B"/>
    <circle cx="125" cy="18" r="2" fill="#FFFFFF"/>
    
    <path d="M85,130 L75,125" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M155,130 L165,125" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M88,100 L78,92" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M152,100 L162,92" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>