<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background cultural motifs / invitation styling -->
  <g opacity="0.15">
    <rect x="55" y="45" width="130" height="150" rx="6" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="85" fill="none" stroke="#64748B" stroke-width="1"/>
  </g>

  <!-- Physical Object: Formal Invitation Card (representing 邀/应邀 - responding to invitation) -->
  <g transform="translate(0, 5)">
    <!-- Base Invitation Envelope / Card Layer -->
    <rect x="65" y="45" width="110" height="140" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Inner Paper / Card -->
    <rect x="75" y="55" width="90" height="120" rx="4" fill="#F8FAFC"/>
    
    <!-- Header lines on invitation -->
    <rect x="95" y="70" width="50" height="6" rx="3" fill="#3B82F6"/>
    <line x1="87" y1="92" x2="153" y2="92" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="87" y1="104" x2="140" y2="104" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

    <!-- Decorative Cultural Event Graphic on Card -->
    <circle cx="120" cy="135" r="16" fill="#FEE2E2"/>
    <path d="M120 123 L124 131 L132 133 L126 139 L128 147 L120 143 L112 147 L114 139 L108 133 L116 131 Z" fill="#EF4444"/>

    <!-- Gold Accent Wax Seal (representing fulfillment/response) -->
    <circle cx="120" cy="165" r="12" fill="#F59E0B"/>
    <path d="M115 165 L118 168 L126 160" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Active "Response / Accepting" Hand and Checkmark (Visualizing 应/Yìng - matching/responding) -->
  <g transform="translate(0, 0)">
    <!-- Checkmark Badge -->
    <circle cx="170" cy="70" r="18" fill="#10B981" stroke="#1A1D24" stroke-width="3"/>
    <path d="M162 70 L167 75 L178 63" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Responding Hand Gesture (Polite acceptance / reaching to respond) -->
    <path d="M135 195 C145 185 160 170 175 165 C185 162 192 168 188 178 C184 186 172 196 160 202 C150 207 140 205 135 195 Z" fill="#F6AD55"/>
    <path d="M175 165 C182 172 188 178 185 185 C182 190 175 192 170 190" fill="none" stroke="#DD6B20" stroke-width="2" stroke-linecap="round"/>
    <path d="M148 188 C155 182 165 178 172 176" fill="none" stroke="#DD6B20" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Focus Accent Elements (Modern Flat Aesthetic) -->
  <circle cx="50" cy="80" r="4" fill="#3B82F6"/>
  <circle cx="195" cy="130" r="3" fill="#F59E0B"/>
  <circle cx="45" cy="160" r="5" fill="#10B981" opacity="0.6"/>
</svg>