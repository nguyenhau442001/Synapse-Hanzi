<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background accent/glow representing the "road to the exam hall" / green passage -->
  <path d="M 60,200 L 100,120 L 140,120 L 180,200 Z" fill="#242B38" opacity="0.6"/>
  <path d="M 90,200 L 110,140 L 130,140 L 150,200 Z" fill="#2E384A" opacity="0.4"/>
  <line x1="120" y1="120" x2="120" y2="200" stroke="#38Bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Protective shielding hands framing the bottom/sides (representing society's protection: 保驾护航) -->
  <g fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Left sheltering hand -->
    <path d="M 35,160 C 35,140 50,135 65,145 C 75,152 85,165 85,185"/>
    <!-- Right sheltering hand -->
    <path d="M 205,160 C 205,140 190,135 175,145 C 165,152 155,165 155,185"/>
  </g>

  <!-- Central Character: A focused student / 莘莘学子 (Xuézǐ) -->
  <!-- Backpack / Student gear -->
  <path d="M 92,125 L 148,125 C 153,125 157,129 157,134 L 157,185 C 157,190 153,194 148,194 L 92,194 C 87,194 83,190 83,185 L 83,134 C 83,129 87,125 92,125 Z" fill="#3B82F6"/>
  <path d="M 102,125 L 138,125 L 135,142 L 105,142 Z" fill="#2563EB"/>
  
  <!-- Torso / Uniform -->
  <path d="M 85,175 L 120,196 L 155,175 L 155,206 C 155,211 151,215 146,215 L 94,215 C 89,215 85,211 85,206 Z" fill="#1E293B"/>
  <path d="M 105,175 L 120,192 L 135,175 L 145,190 L 120,210 L 95,190 Z" fill="#F8FAFC"/> <!-- Collar & tie hint -->

  <!-- Neck -->
  <rect x="111" y="106" width="18" height="22" rx="4" fill="#FCD34D"/>

  <!-- Head / Face -->
  <circle cx="120" cy="85" r="26" fill="#FDE68A"/>

  <!-- Hair -->
  <path d="M 94,82 C 94,66 105,58 120,58 C 135,58 146,66 146,82 C 146,86 148,88 148,92 C 144,82 136,74 120,74 C 104,74 96,82 92,92 C 92,88 94,86 94,82 Z" fill="#1E293B"/>

  <!-- Academic / Graduation elements: Graduation Cap (Mortarboard) positioned proudly -->
  <!-- Cap top diamond -->
  <polygon points="120,38 165,52 120,66 75,52" fill="#1E293B"/>
  <!-- Cap band -->
  <path d="M 100,59 L 100,68 C 100,71 110,74 120,74 C 130,74 140,71 140,68 L 140,59 Z" fill="#334155"/>
  <!-- Tassel -->
  <path d="M 152,56 C 158,62 162,72 160,82" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="160" cy="83" r="2" fill="#F59E0B"/>

  <!-- Focused, determined facial expression (minimalist sleek vectors) -->
  <!-- Eyes (focused dots/dashes) -->
  <circle cx="111" cy="84" r="2.5" fill="#1E293B"/>
  <circle cx="129" cy="84" r="2.5" fill="#1E293B"/>
  <!-- Confident gentle smile -->
  <path d="M 115,95 C 117,98 123,98 125,95" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Foreground accent: Holding a rolled diploma / success scroll -->
  <g transform="translate(100, 155)">
    <rect x="-5" y="-12" width="40" height="14" rx="3" fill="#F8FAFC" transform="rotate(-15)"/>
    <rect x="10" y="-14" width="6" height="18" rx="1" fill="#EF4444" transform="rotate(-15)"/>
  </g>

  <!-- Top-tier decorative framing (modern UI card style) -->
  <rect x="20" y="20" width="200" height="200" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
</svg>