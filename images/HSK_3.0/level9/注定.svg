<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "注定" (Destiny / Inevitable Fate / Sealed Scroll & Hourglass object representation) -->
  <g transform="translate(0, 0)">
    <!-- Ambient glow / aura representing fate/inevitability -->
    <circle cx="120" cy="115" r="65" fill="#252A34" opacity="0.6"/>
    
    <!-- Floating cosmic orbit rings (subtle, non-abstract structural element) -->
    <ellipse cx="120" cy="115" rx="80" ry="30" fill="none" stroke="#3A4256" stroke-width="1.5" stroke-dasharray="4 6" transform="rotate(-15 120 115)"/>
    
    <!-- Main Object: The Scroll of Fate (representing "an bài" / decreed destiny) -->
    <!-- Scroll Back Rod -->
    <rect x="75" y="80" width="10" height="70" rx="5" fill="#E5A93B"/>
    <!-- Scroll Front Rod -->
    <rect x="155" y="80" width="10" height="70" rx="5" fill="#E5A93B"/>
    
    <!-- Parchment Body -->
    <path d="M 80 85 Q 120 70 160 85 L 160 145 Q 120 160 80 145 Z" fill="#F0E6D2"/>
    <path d="M 85 92 Q 120 80 155 92 L 155 138 Q 120 150 85 138 Z" fill="#E6DAC2"/>

    <!-- Seal / Stamp of Inevitability (Red traditional stamp/badge centered on scroll) -->
    <rect x="108" y="103" width="24" height="24" rx="4" fill="#D93838" transform="rotate(12 120 115)"/>
    <!-- Stamp geometric insignia inside -->
    <path d="M 113 115 L 127 115 M 120 108 L 120 122" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Hourglass intersecting the scroll (representing immutable time / destined outcome) -->
    <g transform="translate(120, 115) scale(0.7)">
      <!-- Hourglass Frame -->
      <polygon points="-25,-35 25,-35 20,-30 -15,-30" fill="#4F5D73"/>
      <polygon points="-25,35 25,35 20,30 -15,30" fill="#4F5D73"/>
      <rect x="-2" y="-35" width="4" height="70" fill="#4F5D73"/>
      
      <!-- Glass Bulbs -->
      <path d="M -20,-30 C -20,-10 0,-5 0,0 C 0,-5 20,-10 20,-30 Z" fill="#313A48" opacity="0.8"/>
      <path d="M -20,30 C -20,10 0,5 0,0 C 0,5 20,10 20,30 Z" fill="#313A48" opacity="0.8"/>
      
      <!-- Sand inside (Upper empty, lower full - deterministic end) -->
      <path d="M -14,14 C -7,20 7,20 14,14 L 18,26 C 10,29 -10,29 -18,26 Z" fill="#F39C12"/>
    </g>

    <!-- Sparkles / Focal Points of absolute certainty -->
    <path d="M 60,65 L 63,72 L 70,75 L 63,78 L 60,85 L 57,78 L 50,75 L 57,72 Z" fill="#F39C12"/>
    <path d="M 180,145 L 182,150 L 187,152 L 182,154 L 180,159 L 178,154 L 173,152 L 178,150 Z" fill="#F39C12"/>
  </g>
</svg>