<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Global Map Grid / Perspective Plane -->
    <path d="M 20 180 L 120 120 L 220 180" fill="none" stroke="#2A2F3A" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 40 190 L 120 140 L 200 190" fill="none" stroke="#2A2F3A" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="120" x2="120" y2="40" stroke="#2A2F3A" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Target Continent / Market Base (Right) -->
    <path d="M 160 125 C 175 115, 205 115, 215 130 C 225 145, 205 165, 185 160 C 165 155, 145 140, 160 125 Z" fill="#222834" stroke="#323B4C" stroke-width="2"/>
    
    <!-- Target Marker / Flag on Market -->
    <line x1="185" y1="140" x2="185" y2="105" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <polygon points="185,105 205,112 185,119" fill="#F59E0B"/>

    <!-- Origin / Headquarters (Left) -->
    <circle cx="60" cy="155" r="14" fill="#222834" stroke="#323B4C" stroke-width="2"/>
    <circle cx="60" cy="155" r="6" fill="#60A5FA"/>

    <!-- Strategic Advance Arrow (Curved trajectory for "进军") -->
    <path d="M 72 148 Q 120 90 170 125" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <polygon points="168,122 182,130 166,137" fill="#F59E0B"/>

    <!-- Advancing Fleet / Market Expansion Icons (Isometric Container Ship / Tech Asset) -->
    <g transform="translate(115, 95)">
      <!-- Motion shadow/trail -->
      <path d="M -15 15 L -25 20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M -8 18 L -18 23" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      
      <!-- Sleek Technological Object representing Smart Home / Global Product Launch -->
      <path d="M -10 10 L 10 0 L 25 10 L 5 20 Z" fill="#3B82F6"/>
      <path d="M -10 10 L -10 2 L 5 12 L 5 20 Z" fill="#2563EB"/>
      <path d="M 10 0 L 25 10 L 25 2 L 10 -8 Z" fill="#60A5FA"/>
      <!-- Glowing core / tech accent -->
      <polygon points="7,8 13,5 13,9 7,12" fill="#F59E0B"/>
    </g>

    <!-- Scale Indicator / Expansion Rings around Target -->
    <circle cx="185" cy="135" r="28" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 3"/>
    <circle cx="185" cy="135" r="40" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.15"/>
  </g>
</svg>