<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person representing the investor/skeptic -->
  <g transform="translate(120, 120)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="30" fill="#2D3436"/>
    <!-- Eyes (Skeptical expression: one brow raised, one narrowed) -->
    <path d="M-15 -45 Q-5 -52 5 -45" stroke="#FFB900" stroke-width="2" fill="none"/>
    <path d="M-15 -35 L-5 -35" stroke="#FFB900" stroke-width="2" fill="none"/>
    <path d="M5 -35 L15 -35" stroke="#FFB900" stroke-width="2" fill="none"/>
    
    <!-- Question Mark shape formed by the posture (Skeptical leaning) -->
    <path d="M20 -20 C 40 -20 50 -10 50 10 C 50 30 30 40 20 40" stroke="#FFB900" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="60" r="4" fill="#FFB900"/>
    
    <!-- Body/Shoulders -->
    <path d="M-40 20 L40 20 L30 80 L-30 80 Z" fill="#3D444D"/>
    
    <!-- Hand gesture: chin stroking (contemplation/doubt) -->
    <path d="M-10 0 L-20 10 L-15 20" stroke="#FFB900" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>