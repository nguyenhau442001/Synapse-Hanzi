<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow & Desk Surface -->
  <ellipse cx="120" cy="190" rx="90" ry="25" fill="#111318"/>
  <rect x="36" y="195" width="168" height="4" rx="2" fill="#2E333D"/>

  <!-- Document / Financial Voucher (Physical Object representing 审核) -->
  <g transform="translate(65, 35)">
    <!-- Paper base -->
    <rect width="110" height="150" rx="8" fill="#F4F5F7" stroke="#D1D5DB" stroke-width="2"/>
    
    <!-- Document Header lines -->
    <rect x="18" y="20" width="40" height="6" rx="3" fill="#9CA3AF"/>
    <rect x="72" y="20" width="20" height="6" rx="3" fill="#D1D5DB"/>

    <!-- Line items (Financial rows) -->
    <rect x="18" y="44" width="74" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="18" y="58" width="54" height="4" rx="2" fill="#E5E7EB"/>
    
    <rect x="18" y="82" width="74" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="18" y="96" width="60" height="4" rx="2" fill="#E5E7EB"/>

    <rect x="18" y="120" width="74" height="4" rx="2" fill="#E5E7EB"/>

    <!-- Checkmark Stamp Overlay (Xét duyệt / Kiểm tra) -->
    <g transform="translate(45, 75)">
      <!-- Stamp Background Circle -->
      <circle cx="30" cy="30" r="26" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="30" cy="30" r="22" fill="#10B981" fill-opacity="0.9"/>
      
      <!-- Checkmark -->
      <path d="M19 31L26 38L42 21" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Additional Verification Badge / Accent Mark -->
    <circle cx="92" cy="18" r="4" fill="#F59E0B"/>
  </g>

  <!-- Magnifying Glass (Analyzing / Kiểm tra đối chiếu) -->
  <g transform="translate(110, 110)">
    <!-- Glass shadow -->
    <circle cx="32" cy="32" r="28" fill="#000000" fill-opacity="0.3"/>
    
    <!-- Handle -->
    <path d="M12 52L-8 72" stroke="#374151" stroke-width="10" stroke-linecap="round"/>
    <path d="M10 54L-6 70" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>

    <!-- Lens Rim -->
    <circle cx="32" cy="32" r="28" fill="#1E293B" stroke="#F59E0B" stroke-width="6"/>
    
    <!-- Lens Glass Reflection -->
    <circle cx="32" cy="32" r="22" fill="#38BDF8" fill-opacity="0.2"/>
    <path d="M18 20C24 16 36 16 44 22" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>