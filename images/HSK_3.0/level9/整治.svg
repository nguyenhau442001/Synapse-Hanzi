      <path d="M80 18 L96 45" stroke="#F6AD55" stroke-width="2.5" stroke-dasharray="3,3"/>
    </g>

    <!-- Sparkling Clean Water Droplets / Clear Transformation Indicator -->
    <path d="M100 115 C100 110, 104 104, 104 104 C104 104, 108 110, 108 115 C108 117.2, 106.2 119, 104 119 C101.8 119, 100 117.2, 100 115 Z" fill="#48CAE4"/>
    <path d="M70 122 C70 118, 73 113, 73 113 C73 113, 76 118, 76 122 C76 123.7, 74.7 125, 73 125 C71.3 125, 70 123.7, 70 122 Z" fill="#90E0EF"/>

