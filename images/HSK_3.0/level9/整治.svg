    <path d="M12 135 C50 125, 130 125, 180 138 C188 140, 192 145, 192 150 C192 165, 12 165, 12 150 Z" fill="#1B3A4B"/>
    <path d="M20 144 C60 138, 120 138, 175 146" stroke="#48CAE4" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.8"/>
    <path d="M30 152 C70 147, 110 147, 160 154" stroke="#90E0EF" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Flourishing Eco Elements (Replaced polluted setup with clean transformed habitat) -->
    <!-- Reclaimed Green Reed / Plant Left -->
    <path d="M35 135 Q30 115 25 100 Q40 115 45 135" fill="#2D6A4F"/>
    <path d="M45 138 Q42 118 40 105 Q55 120 55 138" fill="#52B788"/>
    <ellipse cx="25" cy="100" rx="3" ry="8" fill="#D8F3DC" transform="rotate(-15 25 100)"/>
    <ellipse cx="40" cy="105" rx="3" ry="8" fill="#D8F3DC" transform="rotate(10 40 105)"/>

    <!-- Reclaimed Green Reed Right -->
    <path d="M155 140 Q160 120 165 105 Q150 122 145 140" fill="#2D6A4F"/>
    <path d="M165 142 Q172 122 178 108 Q162 125 158 142" fill="#52B788"/>

    <!-- Central Focus: Environmental Restoration Device / Mechanical Dredge & Purification Module (Physical Object/Apparatus) -->
    <g transform="translate(76, 50)">
      <!-- Base Float Platform -->
      <path d="M12 56 L28 42 L68 42 L84 56 Z" fill="#4A5568"/>
      <rect x="20" y="56" width="56" height="6" rx="2" fill="#718096"/>
      
      <!-- Filtration Tower / Treatment Core -->
      <rect x="34" y="16" width="28" height="28" rx="4" fill="#2B6CB0"/>
      <rect x="38" y="20" width="20" height="20" rx="2" fill="#3182CE"/>
      
      <!-- Purifying Water Intake / Output Nozzles -->
      <path d="M48 44 L48 52" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="48" cy="30" r="6" fill="#F6AD55"/>
      <circle cx="48" cy="30" r="3" fill="#FFFAF0"/>

      <!-- Mechanical Arm / Restorative Tool -->
      <path d="M62 26 L80 18" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="80" cy="18" r="4" fill="#CBD5E0"/>
      
