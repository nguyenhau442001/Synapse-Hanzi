<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(24, 24)">
    <!-- River Bank Background -->
    <path d="M0 120 Q60 110 120 125 T192 120" stroke="#2D333B" stroke-width="3" fill="none"/>
    
