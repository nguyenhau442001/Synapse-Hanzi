<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(40, 30)">
    <!-- Motion lines representing grinding/twisting motion -->
    <path d="M70 25 C80 25, 85 30, 80 40" stroke="#E5C158" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M85 45 C90 55, 85 65, 75 65" stroke="#E5C158" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Meat Grinder Body (Main Hopper & Housing) -->
    <path d="M60 40 L100 40 L110 80 L50 80 Z" fill="#3E4C59" stroke="#526478" stroke-width="2"/>
    
    <!-- Hopper Opening & Tray -->
    <ellipse cx="80" cy="40" rx="20" ry="6" fill="#526478"/>
    <path d="M50 40 L35 25 L125 25 L110 40 Z" fill="#2C353D" stroke="#526478" stroke-width="2"/>

    <!-- Grinder Screw/Auger (visible inside neck) -->
    <path d="M70 85 L70 120 M90 85 L90 120" stroke="#E5C158" stroke-width="3" stroke-linecap="round"/>
    <path d="M65 95 L95 105 M65 110 L95 120" stroke="#E5C158" stroke-width="2" stroke-linecap="round"/>

    <!-- Grinder Horizontal Housing (The Mincing Tube) -->
    <rect x="70" y="110" width="65" height="30" rx="4" fill="#3E4C59" stroke="#526478" stroke-width="2"/>

    <!-- Front Ring Nut -->
    <rect x="125" y="106" width="15" height="38" rx="3" fill="#E5C158"/>

    <!-- Handle / Crank (Side view) -->
    <path d="M60 60 L30 60 L30 90" stroke="#A0ABBA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="30" cy="95" r="7" fill="#E5C158"/>

    <!-- Output: Minced Meat Pile -->
    <g transform="translate(135, 125)">
      <path d="M0 15 C5 5, 20 5, 25 15 C30 20, 25 28, 15 28 C5 28, -5 20, 0 15 Z" fill="#E06C75"/>
      <path d="M8 12 C12 6, 22 8, 22 15 C25 20, 18 25, 10 23 C2 21, 4 15, 8 12 Z" fill="#EF838D"/>
      <path d="M3 18 C7 14, 17 15, 18 20 C20 24, 12 27, 6 25 C1 23, -1 20, 3 18 Z" fill="#C9545D"/>
    </g>

    <!-- Base / Stand -->
    <path d="M45 140 L115 140 L125 170 L35 170 Z" fill="#2C353D" stroke="#3E4C59" stroke-width="2"/>
    <rect x="30" y="170" width="95" height="8" rx="3" fill="#1A1D24" stroke="#3E4C59" stroke-width="2"/>
  </g>
</svg>