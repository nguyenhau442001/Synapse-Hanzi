<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Surface -->
  <rect x="30" y="180" width="180" height="15" rx="2" fill="#2D343E"/>
  
  <!-- Disorganized Papers/Newspapers -->
  <!-- Stack 1 -->
  <path d="M60 180 L100 180 L110 150 L70 150 Z" fill="#E0E0E0"/>
  <path d="M65 175 L95 175 L105 155 L75 155 Z" fill="#BDBDBD"/>
  
  <!-- Stack 2 (Tilted) -->
  <path d="M110 180 L150 170 L160 195 L120 205 Z" fill="#FFB74D"/>
  <path d="M115 178 L145 170 L155 190 L125 198 Z" fill="#FFA726"/>
  
  <!-- Stack 3 (Scattered) -->
  <path d="M160 180 L190 180 L200 140 L170 140 Z" fill="#E0E0E0"/>
  <path d="M155 165 L185 165 L195 130 L165 130 Z" fill="#9E9E9E"/>
  
  <!-- Loose papers/edges -->
  <path d="M80 140 L110 140 L115 155 L85 155 Z" fill="#CFD8DC"/>
  <path d="M140 130 L170 130 L175 145 L145 145 Z" fill="#CFD8DC"/>
  
  <!-- Detail lines for "messy" look -->
  <line x1="65" y1="160" x2="95" y2="160" stroke="#757575" stroke-width="1"/>
  <line x1="65" y1="165" x2="95" y2="165" stroke="#757575" stroke-width="1"/>
  <line x1="170" y1="145" x2="195" y2="145" stroke="#757575" stroke-width="1"/>
  <line x1="170" y1="150" x2="195" y2="150" stroke="#757575" stroke-width="1"/>
  
  <!-- Accent highlight -->
  <circle cx="150" cy="150" r="4" fill="#FFB74D"/>
</svg>