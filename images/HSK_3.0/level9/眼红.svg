<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Successful neighbor (The object of envy) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#FFB84D"/>
    <rect x="5" y="45" width="30" height="60" rx="5" fill="#FFB84D"/>
    <path d="M10 105 L30 105 L35 140 L5 140 Z" fill="#E69138"/>
    <circle cx="20" cy="150" r="10" fill="#FFB84D"/>
  </g>

  <!-- Envious person (The subject of "眼红") -->
  <g transform="translate(50, 80)">
    <!-- Body -->
    <rect x="5" y="45" width="30" height="60" rx="5" fill="#7D8590"/>
    <!-- Head -->
    <circle cx="20" cy="20" r="20" fill="#AAB2BD"/>
    <!-- The "Red Eyes" - Visualizing the semantic meaning -->
    <circle cx="12" cy="18" r="4" fill="#FF4D4D"/>
    <circle cx="28" cy="18" r="4" fill="#FF4D4D"/>
    <!-- Expression: Slanted brows for jealousy -->
    <path d="M8 10 L16 14 M24 14 L32 10" stroke="#4A5057" stroke-width="2" stroke-linecap="round"/>
    <!-- Arms crossed in resentment -->
    <rect x="-5" y="55" width="50" height="8" rx="4" fill="#7D8590" transform="rotate(10 20 60)"/>
  </g>

  <!-- Wealth indicator (The source of envy) -->
  <g transform="translate(170, 160)">
    <rect x="0" y="0" width="40" height="30" rx="4" fill="#FFD700"/>
    <path d="M10 5 L30 5 M10 15 L30 15 M10 25 L30 25" stroke="#B8860B" stroke-width="2"/>
  </g>
</svg>