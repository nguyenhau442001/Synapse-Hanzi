<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Calendar Base Object (Noun Representation for Solar Calendar / 阳历) -->
  <g transform="translate(48, 42)">
    <!-- Main Calendar Body -->
    <rect x="0" y="20" width="144" height="130" rx="12" fill="#252A34" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Calendar Header (Solar / Gold Accent) -->
    <path d="M 0 32 A 12 12 0 0 1 12 20 L 132 20 A 12 12 0 0 1 144 32 L 144 56 L 0 56 Z" fill="#E6A15C"/>
    
    <!-- Top Binding Rings -->
    <rect x="36" y="10" width="12" height="16" rx="6" fill="#8C95A5"/>
    <rect x="96" y="10" width="12" height="16" rx="6" fill="#8C95A5"/>

    <!-- Sun Symbol in Header (Representing '阳' / Solar) -->
    <circle cx="72" cy="38" r="9" fill="#1A1D24"/>
    <circle cx="72" cy="38" r="6" fill="#FFF"/>

    <!-- Grid of Days (Standard Gregorian Calendar Layout) -->
    <!-- Row 1 -->
    <rect x="18" y="72" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="42" y="72" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="66" y="72" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="90" y="72" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="114" y="72" width="16" height="12" rx="3" fill="#3A4252"/>

    <!-- Row 2 -->
    <rect x="18" y="92" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="42" y="92" width="16" height="12" rx="3" fill="#E6A15C"/> <!-- Highlighted Active Date -->
    <rect x="66" y="92" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="90" y="92" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="114" y="92" width="16" height="12" rx="3" fill="#3A4252"/>

    <!-- Row 3 -->
    <rect x="18" y="112" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="42" y="112" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="66" y="112" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="90" y="112" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="114" y="112" width="16" height="12" rx="3" fill="#3A4252"/>

    <!-- Row 4 -->
    <rect x="18" y="132" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="42" y="132" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="66" y="132" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="90" y="132" width="16" height="12" rx="3" fill="#3A4252"/>
    <rect x="114" y="132" width="16" height="12" rx="3" fill="#3A4252"/>
  </g>

  <!-- Decorative Modern Accent Orbit/Globe touch -->
  <path d="M 40 185 Q 120 205 200 185" fill="none" stroke="#E6A15C" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>