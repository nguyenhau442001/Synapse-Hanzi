<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "媲美" (sánh ngang / sánh bằng / đẹp ngang hàng):
       Two classic art frames side-by-side on an easel/wall, perfectly balanced in height, 
       representing two masterpieces of equal artistic caliber ("足以与大师之作相媲美"). -->

  <!-- Left Masterpiece Frame -->
  <g transform="translate(48, 55)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="60" height="76" rx="3" fill="#D4AF37" stroke="#997A15" stroke-width="2"/>
    <!-- Inner canvas background -->
    <rect x="6" y="6" width="48" height="64" fill="#252A34"/>
    <!-- Abstract landscape/art inside frame 1 -->
    <circle cx="30" cy="26" r="12" fill="#E56B6F" opacity="0.9"/>
    <path d="M6 56 L22 36 L36 50 L48 40 L54 70 L6 70 Z" fill="#3D5A80"/>
    <path d="M22 70 L34 44 L48 70 Z" fill="#98C1D9" opacity="0.8"/>
  </g>

  <!-- Right Masterpiece Frame (Equal height & grandeur) -->
  <g transform="translate(132, 55)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="60" height="76" rx="3" fill="#D4AF37" stroke="#997A15" stroke-width="2"/>
    <!-- Inner canvas background -->
    <rect x="6" y="6" width="48" height="64" fill="#252A34"/>
    <!-- Abstract landscape/art inside frame 2 (Matching weight/balance) -->
    <circle cx="30" cy="26" r="12" fill="#F4A261" opacity="0.9"/>
    <path d="M6 56 L18 42 L32 54 L44 38 L54 70 L6 70 Z" fill="#2A9D8F"/>
    <path d="M16 70 L28 48 L42 70 Z" fill="#E9C46A" opacity="0.8"/>
  </g>

  <!-- Balance / Equality Indicator (Subtle glowing horizon line underneath linking them) -->
  <line x1="56" y1="150" x2="184" y2="150" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Floating Scale / Equilibrium Symbol (Clean flat vectors representing equal value/matching mastery) -->
  <g transform="translate(120, 168)">
    <!-- Central pivot stand -->
    <path d="M-2 16 L2 16 L4 28 L-4 28 Z" fill="#8C9BAE"/>
    <circle cx="0" cy="14" r="3" fill="#D4AF37"/>
    <!-- Beam -->
    <line x1="-36" y1="14" x2="36" y2="14" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
    <!-- Left hanging cord & pan -->
    <line x1="-36" y1="14" x2="-36" y2="28" stroke="#8C9BAE" stroke-width="1.5"/>
    <path d="M-44 28 C-44 34 -28 34 -28 28" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <!-- Right hanging cord & pan -->
    <line x1="36" y1="14" x2="36" y2="28" stroke="#8C9BAE" stroke-width="1.5"/>
    <path d="M28 28 C28 34 44 34 44 28" fill="none" stroke="#D4AF37" stroke-width="2"/>
  </g>
</svg>