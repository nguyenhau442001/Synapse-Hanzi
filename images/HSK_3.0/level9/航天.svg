<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Space Atmosphere -->
  <g opacity="0.6">
    <!-- Tiny background stars -->
    <circle cx="45" cy="50" r="1" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="195" cy="40" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="210" cy="180" r="1" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="50" cy="190" r="1.2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="120" cy="30" r="1" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Distant glowing planet / horizon curve -->
    <path d="M-20,240 C60,200 180,200 260,240 Z" fill="#0D2137" opacity="0.8"/>
    <path d="M-20,240 C60,200 180,200 260,240" stroke="#3A86FF" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Central Noun: Modern Manned Space Station (航天 - Aerospace / Space Flight) -->
  <g transform="translate(120, 115)">
    <!-- Subtle cosmic glow behind station -->
    <circle cx="0" cy="0" r="65" fill="#1E3A8A" opacity="0.3" filter="blur(8px)"/>

    <!-- Orbital Trajectory Ring -->
    <ellipse cx="0" cy="0" rx="95" ry="32" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,6" transform="rotate(-15)" opacity="0.5"/>

    <!-- Space Station Structure -->
    <g transform="rotate(-12)">
      <!-- Solar Panel Wings (Left) -->
      <g transform="translate(-65, -18)">
        <rect x="0" y="0" width="45" height="36" rx="3" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5"/>
        <!-- Panel grid lines -->
        <line x1="15" y1="0" x2="15" y2="36" stroke="#0EA5E9" stroke-width="0.75"/>
        <line x1="30" y1="0" x2="30" y2="36" stroke="#0EA5E9" stroke-width="0.75"/>
        <line x1="0" y1="18" x2="45" y2="18" stroke="#0EA5E9" stroke-width="0.75"/>
      </g>

      <!-- Solar Panel Wings (Right) -->
      <g transform="translate(20, -18)">
        <rect x="0" y="0" width="45" height="36" rx="3" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5"/>
        <!-- Panel grid lines -->
        <line x1="15" y1="0" x2="15" y2="36" stroke="#0EA5E9" stroke-width="0.75"/>
        <line x1="30" y1="0" x2="30" y2="36" stroke="#0EA5E9" stroke-width="0.75"/>
        <line x1="0" y1="18" x2="45" y2="18" stroke="#0EA5E9" stroke-width="0.75"/>
      </g>

      <!-- Central Truss / Connecting Beam -->
      <rect x="-20" y="-7" width="40" height="14" rx="2" fill="#64748B" stroke="#94A3B8" stroke-width="1"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2,2"/>

      <!-- Habitation Modules (Cylindrical Body) -->
      <!-- Core Module -->
      <rect x="-28" y="-14" width="56" height="28" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      
      <!-- Accent stripes on module -->
      <rect x="-10" y="-14" width="6" height="28" fill="#F59E0B"/>
      <rect x="12" y="-14" width="4" height="28" fill="#3B82F6"/>

      <!-- Docking Port / Forward Module -->
      <rect x="28" y="-10" width="14" height="20" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
      <rect x="40" y="-6" width="4" height="12" rx="1" fill="#64748B"/>

      <!-- Service Module / Rear Port -->
      <rect x="-38" y="-11" width="10" height="22" rx="3" fill="#64748B" stroke="#475569" stroke-width="1"/>

      <!-- Scientific Payload / Reflector Dish -->
      <path d="M-6,-22 C-6,-28 6,-28 6,-22" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
      <line x1="0" y1="-22" x2="0" y2="-14" stroke="#F59E0B" stroke-width="1.5"/>
    </g>

    <!-- High-contrast focus accent: Thruster plume glow / subtle energy spark -->
    <path d="M-62,8 L-72,12 L-62,16 Z" fill="#F59E0B" opacity="0.9"/>
    <circle cx="-60" cy="12" r="3" fill="#FDE047" opacity="0.8"/>
  </g>
</svg>