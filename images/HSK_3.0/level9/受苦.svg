<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground -->
  <path d="M40 190 L200 190" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Mother figure (bent over, carrying heavy load) -->
  <g transform="translate(80, 190)">
    <path d="M0 0 L-10 -70 L10 -70 Z" fill="#F6AD55"/> <!-- Body bent -->
    <circle cx="0" cy="-80" r="12" fill="#F6AD55"/> <!-- Head -->
    <path d="M-5 -60 L-30 -40" stroke="#F6AD55" stroke-width="6" stroke-linecap="round"/> <!-- Arm pulling load -->
    <path d="M10 -60 L30 -50" stroke="#F6AD55" stroke-width="6" stroke-linecap="round"/> <!-- Arm balancing -->
    
    <!-- Heavy Load (Sack) -->
    <path d="M-40 -45 L-20 -45 L-25 -20 L-35 -20 Z" fill="#A0AEC0"/>
    <path d="M-30 -45 L-30 -35" stroke="#718096" stroke-width="2"/>
  </g>
  
  <!-- Child figure (standing behind, sheltered) -->
  <g transform="translate(150, 190)">
    <path d="M0 0 L0 -50" stroke="#63B3ED" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="8" fill="#63B3ED"/>
  </g>
  
  <!-- Motion lines indicating strain/labor -->
  <path d="M60 -20 L70 -30 M60 -40 L70 -50" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Harsh weather element (Rain/Wind lines) -->
  <path d="M180 40 L160 80" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 50 L180 90" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
  <path d="M220 60 L200 100" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
</svg>