<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow from Data/Discovery -->
  <circle cx="150" cy="115" r="45" fill="#3B82F6" opacity="0.12"/>
  <circle cx="150" cy="115" r="25" fill="#F59E0B" opacity="0.15"/>

  <!-- Glacier / Mountain Landscape (Contextual Reference) -->
  <path d="M 35 170 L 60 135 L 85 170 Z" fill="#2D3748" opacity="0.8"/>
  <path d="M 60 135 L 68 147 L 52 147 Z" fill="#E2E8F0" opacity="0.9"/> <!-- Snow cap -->
  
  <path d="M 65 170 L 100 110 L 135 170 Z" fill="#334155"/>
  <path d="M 100 110 L 112 130 L 88 130 Z" fill="#F8FAFC"/> <!-- Snow cap -->
  
  <!-- Glacier Ice Crevasses / Melt lines -->
  <path d="M 98 135 L 103 148" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 106 142 L 112 155" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ground Line -->
  <rect x="25" y="170" width="190" height="4" rx="2" fill="#475569"/>

  <!-- Interactive Data Layer (Rising Chart / Analytics Revealing Truth) -->
  <g transform="translate(115, 80)">
    <!-- Data Grid Lines -->
    <line x1="0" y1="50" x2="70" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="0" y1="25" x2="70" y2="25" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Rising Warning Trend Line -->
    <path d="M 5 45 L 25 35 L 45 40 L 65 15" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Highlight Data Point (The "Revealed" Insight) -->
    <circle cx="65" cy="15" r="4" fill="#F59E0B"/>
    <circle cx="65" cy="15" r="8" fill="#F59E0B" opacity="0.3"/>
  </g>

  <!-- Human Character Action (Dynamic Action: Pulling/Sliding a Veil or Magnifying/Revealing) -->
  <!-- Character Body / Torso -->
  <path d="M 65 170 L 65 135 C 65 125, 75 120, 85 120 L 95 120 C 105 120, 115 125, 115 135 L 115 170 Z" fill="#3B82F6"/>
  
  <!-- Character Head -->
  <circle cx="90" cy="102" r="13" fill="#CBD5E1"/>
  <!-- Hair -->
  <path d="M 78 100 C 78 92, 85 89, 93 90 C 100 90, 103 96, 102 102 Z" fill="#1E293B"/>

  <!-- Character Arms & Action (Pulling back a dark overlay / revealing) -->
  <!-- Back Arm -->
  <path d="M 75 125 L 55 140" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Front Arm reaching forward to Reveal -->
  <path d="M 105 125 L 130 115" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="132" cy="114" r="4" fill="#CBD5E1"/> <!-- Hand -->

  <!-- The "Reveal" Spotlight / Lens Effect -->
  <g transform="translate(130, 95)">
    <!-- Magnifier / Revealing Frame -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <line x1="15" y1="15" x2="28" y2="28" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Light Rays / Action Lines indicating "Bringing to Light" / "Uncovering" -->
    <path d="M -28 -8 L -36 -12" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M -25 12 L -33 18" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Motion / Action Arcs (Showing the physical act of unveiling/revealing) -->
  <path d="M 110 90 C 120 80, 135 80, 145 90" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M 120 75 C 135 65, 155 65, 170 80" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>

</svg>