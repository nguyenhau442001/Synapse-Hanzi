<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow behind the focal point -->
  <circle cx="120" cy="130" r="60" fill="#FF5722" opacity="0.08" filter="blur(10px)"/>

  <!-- Open Bag / Backpack representing the target -->
  <g transform="translate(60, 90)">
    <!-- Bag main body (dark blue-grey fabric) -->
    <path d="M15 20 L25 100 Q60 110 95 100 L105 20 Z" fill="#2C3440" stroke="#3A4454" stroke-width="2"/>
    <!-- Bag opening / interior shadow -->
    <ellipse cx="60" cy="20" rx="45" ry="10" fill="#15181E"/>
    <path d="M15 20 Q60 30 105 20 Q60 10 15 20 Z" fill="#20252C" stroke="#3A4454" stroke-width="2"/>
    <!-- Front pocket -->
    <path d="M35 55 L40 90 Q60 95 80 90 L85 55 Z" fill="#222831" stroke="#3A4454" stroke-width="1.5"/>
    <line x1="45" y1="72" x2="75" y2="72" stroke="#3A4454" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Bag straps -->
    <path d="M30 15 Q20 5 10 10" fill="none" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
    <path d="M90 15 Q100 5 110 10" fill="none" stroke="#3A4454" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Incriminating Object being planted: Glowing Gold Necklace / Valuables -->
  <g transform="translate(120, 65)">
    <!-- Motion lines indicating dropping/planting -->
    <path d="M -15 -25 L -5 -10" stroke="#FF5722" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 15 -25 L 5 -10" stroke="#FF5722" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 0 -30 L 0 -12" stroke="#FF5722" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8"/>

    <!-- Necklace chain -->
    <path d="M-20 -5 Q 0 15 20 -5" fill="none" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Pendant (Glowing Gem) -->
    <circle cx="0" cy="10" r="10" fill="#FFA000" stroke="#FFE082" stroke-width="2"/>
    <polygon points="0,3 4,10 0,17 -4,10" fill="#FFF" opacity="0.9"/>
    
    <!-- Sparkles on the jewelry -->
    <path d="M12 -12 L16 -16 M16 -12 L12 -16" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-14 -2 L-18 -6 M-18 -2 L-14 -6" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Shady Hand planting the evidence (Action of framing / zāizāng) -->
  <g transform="translate(130, 40)">
    <!-- Sleeve / Arm -->
    <path d="M 30 10 L 80 -15 L 95 5 L 45 30 Z" fill="#374151"/>
    
    <!-- Hand silhouette -->
    <path d="M 25 15 C 20 12 10 18 5 22 C 2 24 5 28 8 26 C 13 22 18 20 22 24 Z" fill="#D1D5DB"/>
    <!-- Fingers pointing down into the bag -->
    <path d="M 15 18 C 12 15 5 22 2 28 C 0 32 5 35 8 32 C 12 28 16 25 18 28 Z" fill="#D1D5DB"/>
    <path d="M 22 22 C 20 19 14 26 12 32 C 10 35 15 38 18 35 C 22 31 24 28 25 31 Z" fill="#D1D5DB"/>
  </g>

  <!-- Focus / Warning Accent: Sleek framing indicator brackets in high-contrast orange -->
  <g stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-left corner -->
    <path d="M 36 60 L 28 60 L 28 68"/>
    <!-- Top-right corner -->
    <path d="M 204 60 L 212 60 L 212 68"/>
    <!-- Bottom-left corner -->
    <path d="M 36 180 L 28 180 L 28 172"/>
    <!-- Bottom-right corner -->
    <path d="M 204 180 L 212 180 L 212 172"/>
  </g>
</svg>