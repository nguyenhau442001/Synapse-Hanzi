<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background medical monitor glow/accents -->
    <path d="M70 120 L95 120 L105 95 L115 145 L125 105 L135 130 L145 120 L170 120" stroke="#FF5252" stroke-width="2" fill="none" opacity="0.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Medical Cross background badge subtle -->
    <circle cx="120" cy="120" r="70" fill="#222733" />
    
    <!-- Anatomical/Physical injury representation: Stylized human torso silhouette with a bandaged injury zone -->
    <!-- Shoulders and Torso -->
    <path d="M 80 170 C 80 145, 95 130, 120 130 C 145 130, 160 145, 160 170" fill="none" stroke="#6272A4" stroke-width="6" stroke-linecap="round"/>
    
    <path d="M 90 175 L 90 150 C 90 138, 102 125, 120 125 C 138 125, 150 138, 150 150 L 150 175" fill="#283044" />
    
    <!-- Chest / Sternum area showing medical attention to injury (伤势) -->
    <!-- Medical Cross / First Aid primary focus -->
    <rect x="105" y="95" width="30" height="30" rx="6" fill="#FF5252" opacity="0.15"/>
    
    <!-- Cross icon -->
    <rect x="117" y="101" width="6" height="18" rx="2" fill="#FF5252"/>
    <rect x="111" y="107" width="18" height="6" rx="2" fill="#FF5252"/>
    
    <!-- Bandage / Wound indicator (Gauze graphic) -->
    <g transform="translate(120, 120) rotate(-15)">
      <!-- Gauze base -->
      <rect x="-22" y="-10" width="44" height="20" rx="4" fill="#F8FAFC" />
      <!-- Cross stitch on bandage -->
      <path d="M-10 -4 L-4 4 M-4 -4 L-10 4" stroke="#FF5252" stroke-width="2" stroke-linecap="round"/>
      <path d="M4 -4 L10 4 M10 -4 L4 4" stroke="#FF5252" stroke-width="2" stroke-linecap="round"/>
      <!-- Medical tape ends -->
      <rect x="-26" y="-8" width="6" height="16" rx="2" fill="#CBD5E1" opacity="0.7"/>
      <rect x="20" y="-8" width="6" height="16" rx="2" fill="#CBD5E1" opacity="0.7"/>
    </g>
    
    <!-- Pulse/Vital sign indicator curving around -->
    <path d="M 45 120 C 45 95, 60 75, 85 70" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 195 120 C 195 95, 180 75, 155 70" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Focal highlight ring -->
    <circle cx="120" cy="120" r="76" fill="none" stroke="#FFA726" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>
  </g>
</svg>