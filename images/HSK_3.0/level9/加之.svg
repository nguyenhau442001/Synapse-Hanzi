<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Baseline Path: Representing the first condition (Hard training) -->
    <path d="M 40 170 L 120 170" stroke="#3A3F4B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- First Block/Pillar (Base effort) -->
    <rect x="55" y="125" width="50" height="45" rx="6" fill="#3B82F6" opacity="0.8"/>
    <path d="M 67 145 L 77 155 L 93 135" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Escalation Arrow / Transition representing "加之" (Adding to it) -->
    <path d="M 125 150 C 135 150, 140 130, 148 115" stroke="#F59E0B" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="148,107 154,118 142,118" fill="#F59E0B"/>

    <!-- Second Stacked Block/Pillar representing the additive factor (Experience) -->
    <rect x="135" y="85" width="50" height="40" rx="6" fill="#60A5FA"/>
    <circle cx="160" cy="105" r="10" fill="#1A1D24" opacity="0.2"/>
    <path d="M 152 105 L 158 111 L 170 99" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Final Peak / Outcome (Gold Medal / Triumph) representing the result -->
    <path d="M 185 105 C 195 105, 200 85, 208 70" stroke="#F59E0B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="208,62 214,73 202,73" fill="#F59E0B"/>

    <!-- Trophy / Gold Medal representing the ultimate success in the context sentence -->
    <g transform="translate(180, 25)">
      <!-- Medal Ribbon -->
      <path d="M 20 0 L 10 18 L 30 18 Z" fill="#EF4444"/>
      <path d="M 20 0 L 25 18 L 35 15 Z" fill="#DC2626"/>
      <!-- Medal Circle -->
      <circle cx="20" cy="32" r="14" fill="#F59E0B"/>
      <circle cx="20" cy="32" r="10" fill="#FBBF24"/>
      <!-- Star on medal -->
      <path d="M 20 25 L 22 30 L 27 30 L 23 33 L 25 38 L 20 35 L 15 38 L 17 33 L 13 30 L 18 30 Z" fill="#FFFFFF" transform="scale(0.5) translate(20, 42)"/>
    </g>

    <!-- Visual progression markers (Steps base) -->
    <rect x="30" y="176" width="180" height="4" rx="2" fill="#2B313B"/>
  </g>
</svg>