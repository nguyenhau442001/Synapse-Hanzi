<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Right side: Correct/Clear path (Golden/Orange) -->
  <path d="M160 80 L190 110 L160 140" stroke="#FFB84D" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="110" r="40" stroke="#FFB84D" stroke-width="4" fill="none" stroke-dasharray="8 8"/>
  
  <!-- Left side: Incorrect/Confused path (Slate/Grey) -->
  <path d="M80 80 L50 110 L80 140" stroke="#717784" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="65" cy="110" r="40" stroke="#717784" stroke-width="4" fill="none" stroke-dasharray="8 8"/>
  
  <!-- Central Character Action: The act of mixing/swapping -->
  <!-- Arms and hands manipulating the two paths -->
  <g stroke="#E0E0E0" stroke-width="5" stroke-linecap="round">
    <!-- Left Arm -->
    <path d="M120 120 L90 150 L100 180"/>
    <!-- Right Arm -->
    <path d="M120 120 L150 150 L140 180"/>
  </g>
  
  <!-- Head of the character -->
  <circle cx="120" cy="110" r="15" fill="#E0E0E0"/>
  
  <!-- Motion lines indicating the "mixing" action -->
  <path d="M100 100 Q120 80 140 100" stroke="#5D6475" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  <path d="M100 120 Q120 140 140 120" stroke="#5D6475" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  
  <!-- The "Mixing" effect: Swapping elements -->
  <rect x="105" y="160" width="30" height="10" rx="2" fill="#FFB84D"/>
  <rect x="105" y="175" width="30" height="10" rx="2" fill="#717784"/>
  
  <!-- Arrows indicating the swap -->
  <path d="M135 165 L155 165" stroke="#E0E0E0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M105 180 L85 180" stroke="#E0E0E0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E0E0E0"/>
    </marker>
  </defs>
</svg>