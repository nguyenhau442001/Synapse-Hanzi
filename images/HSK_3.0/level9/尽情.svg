<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Background Elements (草原与灿烂星空/旷野之感) -->
  <path d="M0 160 Q 60 145, 120 155 T 240 148 L 240 240 L 0 240 Z" fill="#243038"/>
  <path d="M0 180 Q 90 170, 150 185 T 240 175 L 240 240 L 0 240 Z" fill="#1E2830"/>

  <!-- Glowing Sound Waves / Joy Waves (Representing "尽情" - full release, living to the fullest) -->
  <path d="M60 115 Q 120 85, 180 115" fill="none" stroke="#FFB020" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M40 125 Q 120 80, 200 125" fill="none" stroke="#FFB020" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  <path d="M75 105 Q 120 75, 165 105" fill="none" stroke="#FFC857" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Confetti / Joyful particles -->
  <circle cx="70" cy="85" r="3" fill="#FFC857" />
  <circle cx="170" cy="75" r="2.5" fill="#FF9F43" />
  <rect x="155" y="110" width="4" height="4" rx="1" fill="#FFC857" transform="rotate(45 157 112)" />
  <rect x="80" y="115" width="5" height="3" rx="1" fill="#FF9F43" transform="rotate(20 82 116)" />

  <!-- Central Character (Person celebrating with arms wide open, leaping/dancing - 载歌载舞，尽情欢笑) -->
  <!-- Head -->
  <circle cx="120" cy="72" r="14" fill="#FFC857"/>
  <!-- Hair / Hat -->
  <path d="M106 68 Q 120 56, 134 68 Q 136 72, 134 76 L 106 76 Q 104 72, 106 68 Z" fill="#2E3B4E"/>

  <!-- Torso & Arms (Dynamic leaping pose, arms flung wide open upwards) -->
  <!-- Left Arm (raised high) -->
  <path d="M112 92 L 82 72" stroke="#FF9F43" stroke-width="7" stroke-linecap="round"/>
  <!-- Right Arm (raised high) -->
  <path d="M128 92 L 158 72" stroke="#FF9F43" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Body / Jacket -->
  <path d="M107 90 L 133 90 L 140 135 L 100 135 Z" fill="#FF9F43"/>
  
  <!-- Left Leg (bent in dance/leap) -->
  <path d="M112 135 L 98 168 L 88 173" stroke="#FFC857" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Leg (bent in dance/leap) -->
  <path d="M128 135 L 142 165 L 156 168" stroke="#FFC857" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle Accent near hands -->
  <path d="M72 65 L 75 70 L 80 72 L 75 74 L 72 79 L 69 74 L 64 72 L 69 70 Z" fill="#FFC857"/>
  <path d="M168 65 L 171 70 L 176 72 L 171 74 L 168 79 L 165 74 L 160 72 L 165 70 Z" fill="#FFC857"/>
</svg>