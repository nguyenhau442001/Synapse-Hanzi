<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120) rotate(-35)">
    <!-- Motion / Trajectory lines -->
    <path d="M-130 0 L-80 0" stroke="#FFA726" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M-110 0 L-90 0" stroke="#FFD54F" stroke-width="4" opacity="0.8"/>

    <!-- Bullet Body (Casing / Brass) -->
    <path d="M-70 -16 L-10 -16 C-5 -16 0 -12 0 -8 L0 8 C0 12 -5 16 -10 16 L-70 16 Z" fill="#D4AF37"/>
    <!-- Casing Rim -->
    <path d="M-70 -18 L-65 -18 L-65 18 L-70 18 Z" fill="#AA7C11"/>
    <!-- Primer Pocket / Groove -->
    <rect x="-62" y="-12" width="6" height="24" rx="2" fill="#B8860B"/>

    <!-- Bullet Tip / Projectile (Copper / Lead) -->
    <path d="M0 -16 L35 -16 C55 -16 70 -6 70 0 C70 6 55 16 35 16 L0 16 Z" fill="#FF7043"/>
    <!-- Bullet Tip Highlight -->
    <path d="M10 -8 L35 -8 C45 -8 55 -3 58 0 C55 3 45 8 35 8 L10 8 Z" fill="#FF8A65" opacity="0.6"/>
  </g>

  <!-- Speed lines / Impact context -->
  <path d="M30 190 L50 170" stroke="#37474F" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 70 L210 50" stroke="#37474F" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 190 L170 170" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
</svg>