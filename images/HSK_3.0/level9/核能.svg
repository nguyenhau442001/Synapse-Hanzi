<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow representing clean energy -->
  <circle cx="120" cy="120" r="70" fill="#0EA5E9" opacity="0.08" />
  <circle cx="120" cy="120" r="45" fill="#38BDF8" opacity="0.1" />

  <!-- Orbiting Electrons / Energy Rings -->
  <!-- Ring 1 (Tilted) -->
  <ellipse cx="120" cy="120" rx="72" ry="26" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.6" transform="rotate(-30 120 120)" />
  <!-- Ring 2 (Tilted opposite) -->
  <ellipse cx="120" cy="120" rx="72" ry="26" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.6" transform="rotate(30 120 120)" />
  <!-- Ring 3 (Horizontal) -->
  <ellipse cx="120" cy="120" rx="76" ry="26" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.8" transform="rotate(90 120 120)" />

  <!-- Electrons (Glowing Dots on Orbits) -->
  <!-- On Ring 1 -->
  <circle cx="58" cy="84" r="5" fill="#38BDF8" />
  <circle cx="182" cy="156" r="4" fill="#38BDF8" />

  <!-- On Ring 2 -->
  <circle cx="182" cy="84" r="5" fill="#38BDF8" />
  <circle cx="58" cy="156" r="4" fill="#38BDF8" />

  <!-- On Ring 3 -->
  <circle cx="120" cy="44" r="5.5" fill="#F59E0B" />
  <circle cx="120" cy="196" r="4.5" fill="#F59E0B" />

  <!-- Central Atomic Nucleus (Representing "核" - Core/Nucleus) -->
  <!-- Outer shell of nucleus -->
  <circle cx="120" cy="120" r="32" fill="#1E293B" stroke="#0EA5E9" stroke-width="3" />

  <!-- Protons and Neutrons clusters inside the nucleus -->
  <!-- Protons (Warm Orange/Gold for focus) -->
  <circle cx="107" cy="108" r="11" fill="#F59E0B" />
  <circle cx="135" cy="124" r="10" fill="#F59E0B" />
  <circle cx="118" cy="136" r="10.5" fill="#F59E0B" />

  <!-- Neutrons (Cool Slate Blue/Cyan) -->
  <circle cx="132" cy="104" r="10" fill="#38BDF8" />
  <circle cx="106" cy="130" r="10" fill="#0284C7" />

  <!-- Bright Core Energy Spark -->
  <circle cx="113" cy="116" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="130" cy="120" r="2.5" fill="#FFFFFF" opacity="0.8" />
</svg>