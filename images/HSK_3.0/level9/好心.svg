<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Atmosphere -->
  <circle cx="120" cy="120" r="80" fill="#242B38" opacity="0.6"/>
  <circle cx="120" cy="110" r="50" fill="#FFB703" opacity="0.08"/>

  <!-- Scene: "好心" (Good intention / Kindness in action - peacemaking gesture) -->
  <!-- Ground line -->
  <line x1="60" y1="180" x2="180" y2="180" stroke="#323B4D" stroke-width="3" stroke-linecap="round"/>

  <!-- Person A (Stepping forward with open palm / peacemaking gesture) -->
  <g transform="translate(0, 0)">
    <!-- Body / Torso -->
    <path d="M 85 180 L 85 145 C 85 135, 93 125, 105 125 L 115 125 C 127 125, 135 135, 135 145 L 135 180 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="110" cy="100" r="16" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M 95 98 C 96 88, 104 84, 110 84 C 118 84, 124 90, 125 98 Z" fill="#1E293B"/>
    <!-- Gentle encouraging face expression / head tilt -->
    <circle cx="116" cy="99" r="1.5" fill="#1E293B"/>
    <path d="M 114 105 Q 117 108 120 105" stroke="#1E293B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Outstretched Arm (Offering goodwill / stopping conflict) -->
    <path d="M 125 135 L 155 135" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
    <!-- Open Palm / Hand -->
    <circle cx="160" cy="135" r="5" fill="#FBBF24"/>
  </g>

  <!-- Person B (Relenting / Calming down, showing the result of "好心" intervention) -->
  <g transform="translate(0, 0)">
    <!-- Body / Torso -->
    <path d="M 145 180 L 145 150 C 145 142, 151 135, 159 135 L 171 135 C 179 135, 185 142, 185 150 L 185 180 Z" fill="#64748B"/>
    <!-- Head (slightly turned back / lowering shoulders) -->
    <circle cx="165" cy="108" r="15" fill="#E2E8F0"/>
    <!-- Hair -->
    <path d="M 153 104 C 154 96, 160 92, 166 92 C 173 92, 178 97, 179 104 Z" fill="#334155"/>
    <!-- Calmed face -->
    <circle cx="161" cy="107" r="1.5" fill="#334155"/>
    <path d="M 164 113 Q 167 111 170 113" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Lowered Arm -->
    <path d="M 150 145 L 142 165" stroke="#64748B" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Warm Goodwill Aura / Focus Effect -->
  <g transform="translate(135, 95)" opacity="0.9">
    <!-- Gentle radiance lines symbolizing pure intent/warmth -->
    <line x1="0" y1="0" x2="12" y2="-12" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="5" x2="28" y2="-2" stroke="#FFB703" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="18" x2="15" y2="28" stroke="#FFB703" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Peaceful / Harmonious Element (Abstract balance indicators - strictly non-badge/non-text) -->
  <path d="M 110 68 Q 120 58 130 68" stroke="#FFB703" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <circle cx="120" cy="55" r="3" fill="#FFB703" opacity="0.8"/>
</svg>