<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed dark mode container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative landscape hinting at a scenic wetlands park -->
  <!-- Distant rolling hills / marsh horizon -->
  <path d="M20 180 Q 80 150, 140 170 T 220 165 L 220 200 L 20 200 Z" fill="#242936"/>
  <!-- Distant reed silhouettes -->
  <path d="M35 180 L35 150 M40 180 L40 145 M45 180 L45 155 M190 175 L190 145 M196 175 L196 140" stroke="#2D3548" stroke-width="2" stroke-linecap="round"/>

  <!-- Water body / winding path representing the "destination" (chốn dừng chân) -->
  <path d="M0 200 C 60 190, 100 210, 240 195 L 240 240 L 0 240 Z" fill="#16202E"/>
  <path d="M60 215 Q 120 205, 180 218" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.4"/>

  <!-- Central Focus: Destination Marker / Rest Pavilion (chốn dừng chân / nơi đến) -->
  <!-- Wooden / Modern scenic boardwalk platform -->
  <path d="M60 190 L 180 190 L 190 205 L 50 205 Z" fill="#334155"/>
  <rect x="70" y="185" width="100" height="6" fill="#475569" rx="2"/>

  <!-- Elegant modern gazebo / rest shelter (iconic "go-to place" / destination) -->
  <!-- Pillars -->
  <rect x="85" y="130" width="8" height="60" fill="#64748B" rx="2"/>
  <rect x="147" y="130" width="8" height="60" fill="#64748B" rx="2"/>
  
  <!-- Roof structure (sleek architectural canopy) -->
  <path d="M70 130 L 120 100 L 170 130 Z" fill="#0EA5E9"/>
  <path d="M65 130 L 120 95 L 175 130 L 170 135 L 120 105 L 70 135 Z" fill="#38BDF8"/>

  <!-- Hanging warm lantern / accent light representing relaxation and welcome -->
  <circle cx="120" cy="135" r="8" fill="#F59E0B"/>
  <path d="M120 120 L 120 127" stroke="#94A3B8" stroke-width="2"/>
  <!-- Glow from lantern -->
  <circle cx="120" cy="135" r="16" fill="#F59E0B" opacity="0.2"/>

  <!-- Scenic nature elements: Reeds & Tree flanking the destination -->
  <!-- Stylized tree on the right -->
  <path d="M195 195 L 195 150" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <circle cx="195" cy="140" r="18" fill="#10B981" opacity="0.8"/>
  <circle cx="185" cy="148" r="12" fill="#059669" opacity="0.7"/>

  <!-- Reeds on the left -->
  <path d="M30 200 L 28 140 M 35 200 L 37 130 M 40 200 L 43 145" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="28" cy="138" rx="2" ry="6" fill="#F59E0B"/>
  <ellipse cx="37" cy="128" rx="2" ry="6" fill="#F59E0B"/>

  <!-- Primary Map Pin / Destination Marker hovering above to explicitly signify "Place / Destination" (去处) -->
  <g transform="translate(0, -5)">
    <!-- Pin drop shadow -->
    <ellipse cx="120" cy="92" rx="6" ry="3" fill="#000000" opacity="0.4"/>
    
    <!-- Pin Body -->
    <path d="M120 52 C 107.8 52, 98 61.8, 98 74 C 98 91, 120 108, 120 108 C 120 108, 142 91, 142 74 C 142 61.8, 132.2 52, 120 52 Z" fill="#F59E0B"/>
    
    <!-- Inner white core of the pin -->
    <circle cx="120" cy="73" r="8" fill="#1A1D24"/>
    <!-- Center dot -->
    <circle cx="120" cy="73" r="3.5" fill="#F59E0B"/>
  </g>

  <!-- Ambient decorative nature particles (serene floating leaves/dots) -->
  <circle cx="75" cy="150" r="2" fill="#38BDF8" opacity="0.6"/>
  <circle cx="165" cy="165" r="1.5" fill="#38BDF8" opacity="0.5"/>
  <circle cx="95" cy="170" r="2" fill="#10B981" opacity="0.7"/>
  <circle cx="145" cy="145" r="1.5" fill="#F59E0B" opacity="0.6"/>
</svg>