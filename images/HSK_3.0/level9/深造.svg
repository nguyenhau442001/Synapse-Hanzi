<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Decorative Elements (Global Atmosphere) -->
  <g opacity="0.15">
    <circle cx="120" cy="110" r="80" fill="none" stroke="#64748B" stroke-dasharray="4 4" stroke-width="1.5"/>
    <circle cx="120" cy="110" r="95" fill="none" stroke="#64748B" stroke-width="0.75"/>
    <path d="M40 110 H200" stroke="#64748B" stroke-width="0.75"/>
    <path d="M120 30 V190" stroke="#64748B" stroke-width="0.75"/>
  </g>

  <!-- Glowing Accent Glow Behind the Graduation/Elevation Motif -->
  <circle cx="120" cy="105" r="50" fill="#F59E0B" opacity="0.12" filter="blur(8px)"/>

  <!-- Architectural/Academic Peak Motif (Symbolizing Higher Education & Advancement) -->
  <g fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Elevated stair platform / foundation -->
    <path d="M80 165 H160" stroke-width="3"/>
    <path d="M95 150 H145" stroke-width="3"/>
  </g>

  <!-- Main Dynamic Character (Action: Advancing, Ascending, Studying Deeply) -->
  <g>
    <!-- Character Body & Posture (Leaning forward, walking upward/forward into knowledge) -->
    <!-- Torso -->
    <path d="M110 135 L116 100 C117 95, 122 93, 126 96 L138 106 C141 108, 142 113, 139 116 L130 135" fill="#3B82F6"/>
    
    <!-- Head -->
    <circle cx="122" cy="80" r="10" fill="#E2E8F0"/>
    
    <!-- Graduation Cap (Mastery / Advanced Studies context) -->
    <polygon points="122,64 140,71 122,78 104,71" fill="#F59E0B"/>
    <polygon points="122,64 140,71 122,78 104,71" stroke="#D97706" stroke-width="1"/>
    <!-- Cap tassel -->
    <path d="M131 74.5 L135 83" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="135" cy="84" r="1.5" fill="#F59E0B"/>

    <!-- Dynamic Arms interacting with the book of advanced knowledge -->
    <!-- Back Arm -->
    <path d="M116 105 L102 118 L112 124" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Arm reaching forward -->
    <path d="M132 108 L148 114 L142 126" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="142" cy="126" r="3" fill="#E2E8F0"/> <!-- Hand -->

    <!-- Legs in motion (Walking up / Action step) -->
    <!-- Back Leg -->
    <path d="M116 135 L104 155 L95 153" fill="none" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Leg stepping up -->
    <path d="M126 135 L136 150 L146 148" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Open Book / Advanced Research Symbol (Direct interaction object) -->
  <g transform="translate(142, 110)">
    <!-- Book Base -->
    <path d="M-10 15 C-2 10, 8 10, 16 15 L16 30 C8 25, -2 25, -10 30 Z" fill="#F8FAFC"/>
    <!-- Left Page -->
    <path d="M-10 15 C-3 12, 5 12, 10 15 L10 30 C5 27, -3 27, -10 30 Z" fill="#E2E8F0"/>
    <!-- Spine -->
    <line x1="3" y1="12" x2="3" y2="28" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Text lines inside book indicating deep study -->
    <line x1="-7" y1="18" x2="-2" y2="17" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    <line x1="-7" y1="21" x2="-3" y2="20" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="11" y2="19" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="21" x2="10" y2="22" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Motion & Elevation Lines (Action / Verb indicator: upward progression, advancement) -->
  <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M 85 95 Q 92 85 90 70" fill="none" stroke-dasharray="3 3"/>
    <path d="M 155 75 Q 162 65 160 50" fill="none"/>
    <path d="M 160 50 L 156 55" />
    <path d="M 160 50 L 165 54" />
  </g>

  <!-- Floating Sparkles / Knowledge Ascending Effect -->
  <g fill="#F59E0B">
    <path d="M75 110 L77 114 L81 116 L77 118 L75 122 L73 118 L69 116 L73 114 Z" opacity="0.7"/>
    <path d="M165 85 L166.5 88 L169.5 89.5 L166.5 91 L165 94 L163.5 91 L160.5 89.5 L163.5 88 Z"/>
    <circle cx="100" cy="55" r="2" opacity="0.6"/>
    <circle cx="145" cy="45" r="1.5" opacity="0.8"/>
  </g>

</svg>