<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background architectural wall structure (Ancient city wall context) -->
  <g id="ancient-wall" opacity="0.85">
    <!-- Main wall base -->
    <rect x="50" y="40" width="140" height="160" rx="6" fill="#2A303C"/>
    
    <!-- Brick pattern (horizontal mortar lines) -->
    <line x1="50" y1="70" x2="190" y2="70" stroke="#1A1D24" stroke-width="2"/>
    <line x1="50" y1="100" x2="190" y2="100" stroke="#1A1D24" stroke-width="2"/>
    <line x1="50" y1="130" x2="190" y2="130" stroke="#1A1D24" stroke-width="2"/>
    <line x1="50" y1="160" x2="190" y2="160" stroke="#1A1D24" stroke-width="2"/>

    <!-- Brick pattern (staggered vertical mortar lines) -->
    <!-- Row 1 -->
    <line x1="90" y1="40" x2="90" y2="70" stroke="#1A1D24" stroke-width="2"/>
    <line x1="140" y1="40" x2="140" y2="70" stroke="#1A1D24" stroke-width="2"/>
    <!-- Row 2 -->
    <line x1="70" y1="70" x2="70" y2="100" stroke="#1A1D24" stroke-width="2"/>
    <line x1="115" y1="70" x2="115" y2="100" stroke="#1A1D24" stroke-width="2"/>
    <line x1="165" y1="70" x2="165" y2="100" stroke="#1A1D24" stroke-width="2"/>
    <!-- Row 3 -->
    <line x1="95" y1="100" x2="95" y2="130" stroke="#1A1D24" stroke-width="2"/>
    <line x1="145" y1="100" x2="145" y2="130" stroke="#1A1D24" stroke-width="2"/>
    <!-- Row 4 -->
    <line x1="75" y1="130" x2="75" y2="160" stroke="#1A1D24" stroke-width="2"/>
    <line x1="120" y1="130" x2="120" y2="160" stroke="#1A1D24" stroke-width="2"/>
    <line x1="160" y1="130" x2="160" y2="160" stroke="#1A1D24" stroke-width="2"/>
    <!-- Row 5 -->
    <line x1="100" y1="160" x2="100" y2="200" stroke="#1A1D24" stroke-width="2"/>
    <line x1="150" y1="160" x2="150" y2="200" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Exposed inner core where tiles fell off (Weathered texture) -->
  <path d="M 105,75 Q 125,80 135,100 Q 145,130 120,150 Q 100,165 90,135 Q 80,105 105,75 Z" fill="#1E232D"/>
  <circle cx="110" cy="110" r="3" fill="#15181F"/>
  <circle cx="125" cy="125" r="2" fill="#15181F"/>
  <circle cx="100" cy="135" r="2.5" fill="#15181F"/>

  <!-- Weathering / Erosion environmental elements (Wind/Rain lines) -->
  <g opacity="0.3" stroke="#798294" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="60" x2="55" y2="65"/>
    <line x1="25" y1="95" x2="50" y2="100"/>
    <line x1="35" y1="140" x2="55" y2="145"/>
  </g>

  <!-- THE ACTION: "Tuōluò" - Detaching / Falling off pieces with dynamic motion lines -->
  <g id="detaching-elements">
    <!-- Falling brick tile 1 (Mid-fall with rotation) -->
    <g transform="translate(145, 115) rotate(25)">
      <rect x="0" y="0" width="36" height="22" rx="3" fill="#D97706"/>
      <!-- Inner texture highlight -->
      <rect x="3" y="3" width="30" height="16" rx="2" fill="#F59E0B" opacity="0.4"/>
    </g>

    <!-- Falling mortar/smaller debris 2 -->
    <g transform="translate(110, 165) rotate(-15)">
      <rect x="0" y="0" width="22" height="14" rx="2" fill="#B45309"/>
    </g>

    <!-- Tiny particulate dust/crumbs -->
    <circle cx="130" cy="150" r="2.5" fill="#D97706"/>
    <circle cx="155" cy="155" r="1.5" fill="#F59E0B"/>
    <circle cx="168" cy="140" r="2" fill="#B45309"/>

    <!-- Motion lines indicating peeling/falling away from the wall -->
    <path d="M 138,100 Q 148,108 152,114" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M 120,135 Q 125,145 130,152" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
  </g>

  <!-- Human Action / Interaction (Environmental researcher / inspector pointing or checking the erosion) -->
  <g id="human-character">
    <!-- Arm reaching out to indicate the action/cause -->
    <path d="M 50,180 C 65,175 80,170 95,175" fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand pointing at the peeling area -->
    <circle cx="98" cy="175" r="4" fill="#93C5FD"/>
  </g>

  <!-- Focus accent framing (Subtle glow/bracket to draw eye to the action) -->
  <path d="M 85,65 L 85,55 L 95,55" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 165,160 L 165,170 L 155,170" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

</svg>