<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Shelf structure representing retail storefront -->
  <path d="M48 90 L192 90 L192 96 L48 96 Z" fill="#2D333F"/>
  <path d="M48 150 L192 150 L192 156 L48 156 Z" fill="#2D333F"/>
  
  <!-- Products on shelves (colorful small flat items) -->
  <!-- Top shelf items -->
  <rect x="64" y="66" width="16" height="24" rx="3" fill="#E06C75"/>
  <rect x="88" y="70" width="18" height="20" rx="3" fill="#61AFEF"/>
  <rect x="114" y="62" width="14" height="28" rx="3" fill="#98C379"/>
  <rect x="136" y="68" width="20" height="22" rx="3" fill="#E5C07B"/>
  
  <!-- Middle shelf items -->
  <rect x="68" y="126" width="15" height="24" rx="3" fill="#C678DD"/>
  <rect x="91" y="130" width="16" height="20" rx="3" fill="#56B6C2"/>
  <rect x="115" y="122" width="18" height="28" rx="3" fill="#E06C75"/>

  <!-- Dynamic Action: A customer picking up a single item (Retail / Bán lẻ action) -->
  <!-- Customer hand reaching to grab a single item -->
  <path d="M150 135 C150 120, 160 115, 172 118" stroke="#E5C07B" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- The single item being retailed/purchased -->
  <rect x="162" y="104" width="16" height="22" rx="3" fill="#98C379"/>

  <!-- Motion lines indicating the action of taking the single item -->
  <path d="M178 96 C182 90, 185 85, 182 78" stroke="#61AFEF" stroke-width="2.5" stroke-dasharray="3,3" stroke-linecap="round" fill="none"/>
  <path d="M185 88 L183 78 L191 81" stroke="#61AFEF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Counter desk -->
  <path d="M36 186 L204 186 L212 210 L28 210 Z" fill="#21252B"/>
  <rect x="28" y="180" width="184" height="8" rx="2" fill="#3A4250"/>

  <!-- Cash register / POS terminal indicating transaction -->
  <rect x="156" y="160" width="32" height="20" rx="3" fill="#4B5263"/>
  <polygon points="160,160 184,146 188,154 164,168" fill="#5C6370"/>
  <rect x="164" y="150" width="12" height="8" rx="1" fill="#61AFEF"/>

  <!-- Shopping basket with a few items (representing retail context) -->
  <path d="M60 166 L100 166 L106 186 L54 186 Z" fill="#E5C07B"/>
  <path d="M52 164 C52 158, 108 158, 108 164" stroke="#D19A66" stroke-width="3" fill="none"/>
  <!-- Items in basket -->
  <circle cx="70" cy="162" r="6" fill="#E06C75"/>
  <circle cx="88" cy="161" r="7" fill="#98C379"/>

</svg>