<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow behind the receipt/cashier area -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Cashier Counter / Surface -->
  <path d="M 40 180 L 200 180 L 210 205 L 30 205 Z" fill="#2E3544"/>
  <rect x="30" y="175" width="180" height="7" rx="3.5" fill="#3E475C"/>

  <!-- Modern POS / Cash Register Terminal -->
  <!-- Base & Stand -->
  <path d="M 105 175 L 135 175 L 140 155 L 100 155 Z" fill="#4E5D78"/>
  <rect x="114" y="140" width="12" height="18" fill="#6C7A9C" rx="2"/>
  
  <!-- Tablet Screen (Dark Mode UI) -->
  <rect x="85" y="85" width="70" height="58" rx="6" fill="#111318" stroke="#3E475C" stroke-width="2"/>
  <!-- UI Dashboard elements inside screen -->
  <rect x="93" y="94" width="30" height="6" rx="2" fill="#F59E0B"/>
  <rect x="93" y="106" width="54" height="4" rx="2" fill="#3E475C"/>
  <rect x="93" y="114" width="45" height="4" rx="2" fill="#3E475C"/>
  <rect x="93" y="122" width="25" height="4" rx="2" fill="#10B981"/>
  <!-- Checkmark icon on screen representing calculation/settlement -->
  <circle cx="138" cy="124" r="6" fill="#10B981"/>
  <path d="M 135 124 L 137 126 L 141 121" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Physical Receipt / Bill (The core object of "suànzhàng" / checking lists and paying) -->
  <!-- Paper sliding out from top of terminal or held up -->
  <g transform="translate(115, 45)">
    <!-- Receipt paper body with jagged/perforated bottom -->
    <path d="M 0 0 
             L 36 0 
             L 36 85 
             L 33 90 L 30 85 L 27 90 L 24 85 L 21 90 L 18 85 L 15 90 L 12 85 L 9 90 L 6 85 L 3 90 L 0 85 
             Z" fill="#F3F4F6"/>
    
    <!-- Receipt Header line -->
    <rect x="8" y="10" width="20" height="4" rx="1" fill="#9CA3AF"/>
    
    <!-- Itemized lines (simulating the checklist) -->
    <rect x="8" y="20" width="14" height="2" rx="1" fill="#D1D5DB"/>
    <rect x="25" y="20" width="4" height="2" rx="1" fill="#4B5563"/>

    <rect x="8" y="26" width="18" height="2" rx="1" fill="#D1D5DB"/>
    <rect x="28" y="26" width="2" height="2" rx="1" fill="#4B5563"/>

    <rect x="8" y="32" width="12" height="2" rx="1" fill="#D1D5DB"/>
    <rect x="24" y="32" width="5" height="2" rx="1" fill="#4B5563"/>

    <!-- Divider line -->
    <line x1="8" y1="40" x2="28" y2="40" stroke="#E5E7EB" stroke-dasharray="2 2" stroke-width="1"/>

    <!-- Total amount highlighted (Crucial for "suànzhàng") -->
    <rect x="8" y="46" width="20" height="4" rx="1" fill="#F59E0B"/>
    
    <!-- Checkmark badge stamped on receipt -->
    <circle cx="18" cy="67" r="10" fill="#10B981"/>
    <path d="M 14 67 L 17 70 L 23 63" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Hand sliding/pointing or holding a payment card / interacting -->
  <!-- Sleek minimalist hand element coming from right side -->
  <path d="M 180 150 C 165 145 155 135 152 120 L 160 115 C 165 125 175 135 185 140 Z" fill="#E5B299"/>
  <!-- Modern Bank Card / Payment token -->
  <g transform="translate(145, 98) rotate(-15)">
    <rect width="32" height="20" rx="3" fill="#3B82F6"/>
    <rect x="4" y="4" width="7" height="5" rx="1" fill="#FCD34D"/>
    <rect x="4" y="13" width="14" height="2" rx="1" fill="#93C5FD"/>
  </g>

  <!-- Focus accent sparkles / visual cues for precise settlement -->
  <circle cx="65" cy="85" r="2.5" fill="#F59E0B" opacity="0.8"/>
  <path d="M 65 77 L 65 93 M 57 85 L 73 85" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <circle cx="185" cy="85" r="2" fill="#10B981" opacity="0.8"/>
</svg>