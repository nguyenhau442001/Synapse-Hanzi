  <circle cx="85" cy="130" r="1" fill="#94A3B8" opacity="0.4"/>
  <circle cx="160" cy="120" r="1.5" fill="#94A3B8" opacity="0.5"/>
  <circle cx="150" cy="100" r="1" fill="#94A3B8" opacity="0.3"/>
