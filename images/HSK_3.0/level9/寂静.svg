  <path d="M20 160 L90 90 L160 160 Z" fill="#242B38"/>
  <path d="M100 160 L165 75 L230 160 Z" fill="#2E384A"/>
  
  <!-- Mirror-like Calm Lake -->
  <rect x="20" y="160" width="200" height="40" rx="4" fill="#151820"/>
  <path d="M90 160 L90 175 L160 175 L160 160 Z" fill="#1E2430" opacity="0.4"/>
  <path d="M165 160 L165 172 L230 172 L230 160 Z" fill="#242B38" opacity="0.4"/>

  <!-- Crescent Moon and Soft Glow -->
  <circle cx="180" cy="55" r="14" fill="#E2E8F0"/>
  <circle cx="185" cy="52" r="12" fill="#1A1D24"/>
  <ellipse cx="120" cy="168" rx="80" ry="3" fill="#64748B" opacity="0.2"/>

  <!-- Central Physical Object: A Serene Mountain Pavilion/Shrine (Physical Place/Object representing 寂静) -->
  <!-- Base platform -->
  <rect x="100" y="135" width="40" height="10" rx="2" fill="#3B4659"/>
  <!-- Pillars -->
  <rect x="108" y="115" width="6" height="20" fill="#64748B"/>
  <rect x="126" y="115" width="6" height="20" fill="#64748B"/>
  <!-- Roof -->
