<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: Captain's Control Yoke & Hand representing Decisiveness/果断 (Firm, instant control action) -->
  <g transform="translate(120, 125)">
    <!-- Motion lines representing quick, decisive action -->
    <path d="M-65 -45 L-40 -45" stroke="#FFA726" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M50 -45 L70 -45" stroke="#FFA726" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M-75 -20 L-50 -20" stroke="#FFA726" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M60 -20 L80 -20" stroke="#FFA726" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- Aircraft Control Yoke (Steering column / Wheel) -->
    <!-- Center Column -->
    <rect x="-10" y="-10" width="20" height="85" rx="4" fill="#37474F"/>
    <rect x="-6" y="-5" width="12" height="75" rx="2" fill="#263238"/>
    
    <!-- Yoke Base Mount -->
    <path d="M-22 65 L22 65 L28 75 L-28 75 Z" fill="#455A64"/>
    <rect x="-35" y="75" width="70" height="8" rx="2" fill="#263238"/>

    <!-- Yoke Wings (Steering Wheel) -->
    <!-- Left Handle -->
    <path d="M-15 -10 C-15 -35 -35 -45 -60 -40 C-75 -37 -80 -20 -75 -5 C-70 10 -55 20 -40 15 C-25 10 -15 0 -15 -10 Z" fill="#37474F"/>
    <!-- Left Grip Accent -->
    <path d="M-55 -32 C-65 -30 -70 -20 -65 -10" stroke="#546E7A" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Right Handle -->
    <path d="M15 -10 C15 -35 35 -45 60 -40 C75 -37 80 -20 75 -5 C70 10 55 20 40 15 C25 10 15 0 15 -10 Z" fill="#37474F"/>
    <!-- Right Grip Accent -->
    <path d="M55 -32 C65 -30 70 -20 65 -10" stroke="#546E7A" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Center Hub with Captain Insignia / Horizon Indicator -->
    <circle cx="0" cy="-12" r="18" fill="#263238"/>
    <circle cx="0" cy="-12" r="14" fill="#1C252B"/>
    <!-- Artificial Horizon Line representing pilot control -->
    <path d="M-10 -12 L10 -12" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-12" r="3" fill="#FFFFFF"/>

    <!-- Firm, Decisive Hands gripping the yoke firmly -->
    <!-- Left Hand -->
    <path d="M-45 -25 C-50 -25 -55 -15 -50 -5 C-48 0 -40 5 -35 2 C-30 -1 -35 -15 -40 -20 Z" fill="#FFCC80"/>
    <path d="M-48 -22 L-38 -15" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
    <!-- Right Hand -->
    <path d="M45 -25 C50 -25 55 -15 50 -5 C48 0 40 5 35 2 C30 -1 35 -15 40 -20 Z" fill="#FFCC80"/>
    <path d="M48 -22 L38 -15" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>

    <!-- Action / Alert indicator light at the top (Crisp amber glow representing prompt reaction to emergency) -->
    <circle cx="0" cy="-75" r="8" fill="#FF5722"/>
    <circle cx="0" cy="-75" r="4" fill="#FFCC80"/>
    <path d="M0 -90 L0 -85" stroke="#FF5722" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>