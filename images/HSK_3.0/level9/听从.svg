<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow elements for context -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#262B35" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Directional audio waves / listening symbol -->
  <path d="M 90 75 Q 75 90 75 105 Q 75 120 90 135" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 80 65 Q 60 85 60 105 Q 60 125 80 145" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>

  <!-- Leader / Instructor Character (Giving Command) -->
  <g transform="translate(-35, -5)">
    <!-- Body/Torso -->
    <path d="M 105 130 L 100 165 L 125 165 L 125 130 Z" fill="#2B6CB0"/>
    <!-- Head -->
    <circle cx="115" cy="110" r="11" fill="#E2E8F0"/>
    <!-- Pointing / Directing Arm -->
    <path d="M 115 125 L 135 110 L 148 115" fill="none" stroke="#2B6CB0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <circle cx="150" cy="116" r="3" fill="#E2E8F0"/>
    <!-- Megaphone / Command indicator -->
    <path d="M 135 102 L 155 92 L 155 112 Z" fill="#D69E2E"/>
    <path d="M 155 90 C 160 92, 163 96, 163 102 C 163 108, 160 112, 155 114" fill="none" stroke="#D69E2E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Follower Character (Action: Obedience / Compliance / Tīngcóng) -->
  <g transform="translate(35, 5)">
    <!-- Dynamic leaning forward body posture showing readiness and listening -->
    <!-- Torso angled forward -->
    <path d="M 110 125 L 115 165 L 90 165 L 95 125 Z" fill="#319795"/>
    
    <!-- Head tilted slightly up and forward -->
    <circle cx="105" cy="103" r="11" fill="#E2E8F0"/>
    
    <!-- Ear highlight/focus indicator -->
    <circle cx="113" cy="103" r="2.5" stroke="#ECC94B" stroke-width="1.5" fill="none"/>

    <!-- Motion/Attention lines toward ear -->
    <line x1="124" y1="98" x2="117" y2="100" stroke="#ECC94B" stroke-width="2" stroke-linecap="round"/>
    <line x1="126" y1="104" x2="117" y2="104" stroke="#ECC94B" stroke-width="2" stroke-linecap="round"/>

    <!-- Salute / Compliance Arm gesture (Placing hand respectfully to chest/head) -->
    <path d="M 105 120 L 95 108 L 102 103" fill="none" stroke="#319795" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="103" cy="102" r="2.5" fill="#E2E8F0"/>

    <!-- Legs planted firmly in ready stance -->
    <path d="M 98 165 L 92 195 L 82 195" fill="none" stroke="#285E61" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 110 165 L 118 195 L 128 195" fill="none" stroke="#285E61" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- High-contrast Accent Elements (Directional cues / Compliance signal) -->
  <!-- Checkmark / Alignment symbol integrated cleanly -->
  <circle cx="120" cy="50" r="16" fill="#D69E2E"/>
  <path d="M 112 50 L 117 55 L 129 42" fill="none" stroke="#1A1D24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ground Line -->
  <line x1="60" y1="200" x2="180" y2="200" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
</svg>