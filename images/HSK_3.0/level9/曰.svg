<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Scroll background -->
    <path d="M50 75 C50 66.7157 56.7157 60 65 60 L175 60 C183.284 60 190 66.7157 190 75 L190 165 C190 173.284 183.284 180 175 180 L65 180 C56.7157 180 50 173.284 50 165 Z" fill="#EAE2B7" opacity="0.95"/>
    <path d="M45 70 C45 61.7157 51.7157 55 60 55 L180 55 C188.284 55 195 61.7157 195 70 L195 170 C195 178.284 188.284 185 180 185 L60 185 C51.7157 185 45 178.284 45 170 Z" fill="#F4F1DE"/>
    
    <!-- Scroll rollers (top and bottom) -->
    <rect x="40" y="50" width="160" height="12" rx="6" fill="#D4A373"/>
    <rect x="42" y="52" width="156" height="8" rx="4" fill="#FAEDCD"/>
    
    <rect x="40" y="178" width="160" height="12" rx="6" fill="#D4A373"/>
    <rect x="42" y="180" width="156" height="8" rx="4" fill="#FAEDCD"/>
    
    <!-- Classical Scholar Figure (Silhouette/Profile representing Confucius speaking) -->
    <g transform="translate(70, 75)">
      <!-- Scholar hat/cap -->
      <path d="M15 28 L45 28 L40 18 L20 18 Z" fill="#2B2D42"/>
      <rect x="25" y="12" width="10" height="6" fill="#2B2D42"/>
      
      <!-- Head and face profile -->
      <path d="M22 28 C22 28 20 42 28 48 C32 51 38 48 40 42 C41 38 39 32 39 28 Z" fill="#DDA15E"/>
      
      <!-- Beard (wise elder) -->
      <path d="M35 44 C38 48 42 55 40 62 C38 65 33 60 30 52 Z" fill="#F4F1DE"/>
      
      <!-- Robe body -->
      <path d="M12 90 C12 70 25 60 40 55 C55 60 68 70 68 90 Z" fill="#3D5A80"/>
      <!-- Robe collar overlay -->
      <path d="M30 55 L40 70 L50 55 Z" fill="#E0FBFC"/>
    </g>

    <!-- Speech / Pronouncement Visual Element -->
    <g transform="translate(130, 85)">
      <!-- Speech bubble backing -->
      <path d="M10 10 C10 4.47715 14.4772 0 20 0 L65 0 C70.5228 0 75 4.47715 75 10 L75 35 C75 40.5228 70.5228 45 65 45 L30 45 L15 58 L18 45 L20 45 C14.4772 45 10 40.5228 10 35 Z" fill="#E63946"/>
      
      <!-- Accent quotation mark inside bubble -->
      <path d="M25 15 C28 15 31 18 31 22 C31 27 27 32 21 34 L19 30 C22 29 25 26 25 23 L22 23 C19 23 17 21 17 18 C17 16 19 15 21 15 L25 15 Z" fill="#FFFFFF"/>
      <path d="M50 15 C53 15 56 18 56 22 C56 27 52 32 46 34 L44 30 C47 29 50 26 50 23 L47 23 C44 23 42 21 42 18 C42 16 44 15 46 15 L50 15 Z" fill="#FFFFFF"/>
    </g>

    <!-- Subtle ancient text lines on scroll -->
    <line x1="75" y1="145" x2="115" y2="145" stroke="#BC6C25" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="75" y1="160" x2="105" y2="160" stroke="#BC6C25" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>