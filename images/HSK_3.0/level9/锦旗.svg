<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Shadow / Glow effect for focal point -->
  <circle cx="120" cy="115" r="70" fill="#2D323E" opacity="0.4"/>

  <!-- Hanging Rod / Top Bar -->
  <line x1="80" y1="52" x2="160" y2="52" stroke="#D19A66" stroke-width="4" stroke-linecap="round"/>
  <!-- Top Finials -->
  <circle cx="80" cy="52" r="4" fill="#E5C07B"/>
  <circle cx="160" cy="52" r="4" fill="#E5C07B"/>
  <!-- Hanging String / Tassels -->
  <path d="M 120 40 L 120 52" stroke="#E5C07B" stroke-width="2"/>
  <circle cx="120" cy="38" r="3" fill="none" stroke="#E5C07B" stroke-width="2"/>

  <!-- Main Banner Body (Red Silk Pennant) -->
  <path d="M 85 52 L 155 52 L 155 165 L 120 185 L 85 165 Z" fill="#E06C75"/>
  <!-- Inner Gold Border / Trim -->
  <path d="M 91 58 L 149 58 L 149 157 L 120 173 L 91 157 Z" fill="none" stroke="#E5C07B" stroke-width="2" stroke-linejoin="round"/>

  <!-- Symbolic Decorative Motif on Banner (Abstract Medical/Gratitude Cross & Star in Gold) -->
  <g fill="#E5C07B">
    <!-- Center Star -->
    <path d="M 120 85 L 123.5 93 L 132 94 L 125.5 100 L 127.5 108.5 L 120 104 L 112.5 108.5 L 114.5 100 L 108 94 L 116.5 93 Z"/>
    <!-- Decorative Lines representing honorary inscriptions -->
    <rect x="103" y="118" width="34" height="3" rx="1.5"/>
    <rect x="108" y="127" width="24" height="3" rx="1.5"/>
    <rect x="112" y="136" width="16" height="3" rx="1.5"/>
  </g>

  <!-- Bottom Fringe (Gold tassels) -->
  <path d="M 85 165 L 89 173 L 93 165 L 97 173 L 101 165 L 105 173 L 109 165 L 113 173 L 117 165 L 121 173 L 125 165 L 129 173 L 133 165 L 137 173 L 141 165 L 145 173 L 149 165 L 153 173 L 155 165 L 138 185 L 120 195 L 102 185 Z" fill="#E5C07B"/>
</svg>