<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(40, 40)">
    <!-- Ground -->
    <path d="M0 160 L160 160" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Uprooted Tree -->
    <g transform="translate(80, 160)">
      <path d="M0 0 L-20 -10 L-10 -30 L-30 -50 L-10 -70 L-20 -100 L0 -120 L20 -100 L10 -70 L30 -50 L10 -30 L20 -10 Z" fill="#718096"/>
      <!-- Roots -->
      <path d="M0 0 C -20 0 -20 -20 0 -20 C 20 -20 20 0 0 0" fill="#A0AEC0"/>
      <path d="M-5 0 L-15 10 M5 0 L15 10 M0 0 L0 15" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Wind/Rain Force -->
    <g stroke="#F6AD55" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M-20 20 L20 60" opacity="0.8"/>
      <path d="M0 40 L40 80" opacity="0.6"/>
      <path d="M20 60 L60 100" opacity="0.4"/>
      <path d="M-30 80 L10 120" opacity="0.7"/>
      <path d="M-10 100 L30 140" opacity="0.5"/>
    </g>
    
    <!-- Gust Effect -->
    <path d="M-40 40 Q -10 30 20 50 T 80 40" stroke="#ED8936" stroke-width="4" fill="none" stroke-dasharray="8 8"/>
  </g>
</svg>