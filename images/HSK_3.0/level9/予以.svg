<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Physical Object: A sleek, modern award plaque/trophy representing formal bestowal ("予以" - giving/granting an award) -->
  
  <!-- Plaque Base/Stand -->
  <path d="M95 180H145L155 195H85L95 180Z" fill="#3A4256"/>
  <rect x="100" y="165" width="40" height="15" fill="#4F5D75" rx="2"/>

  <!-- Plaque Main Body (Dark Obsidian/Slate) -->
  <path d="M80 60C80 54.4772 84.4772 50 90 50H150C155.523 50 160 54.4772 160 60V165H80V60Z" fill="#2B3448"/>
  <path d="M84 64C84 61.7909 85.7909 60 88 60H152C154.209 60 156 61.7909 156 64V161H84V64Z" fill="#1E2533"/>

  <!-- Gold Border Inset -->
  <rect x="90" y="70" width="60" height="80" rx="4" fill="none" stroke="#F6C90E" stroke-width="2" opacity="0.8"/>

  <!-- Golden Star Emblem (Representing Material Reward / Honor bestowed) -->
  <g transform="translate(120, 110)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="24" fill="#F6C90E" opacity="0.15"/>
    
    <!-- Star Shape -->
    <path d="M0 -18L4.5 -5.5H18L7 2.5L11 15L0 7.5L-11 15L-7 2.5L-18 -5.5H-4.5L0 -18Z" fill="#F6C90E"/>
    
    <!-- Inner detail -->
    <path d="M0 -12L3 -3.5H12L4.5 1.5L7 10L0 5L-7 10L-4.5 1.5L-12 -3.5H-3L0 -12Z" fill="#FFD700" opacity="0.6"/>
  </g>

  <!-- Ribbon / Sash hanging below star -->
  <path d="M108 130L120 145L132 130V155L120 148L108 155V130Z" fill="#E63946"/>

  <!-- Dynamic "Bestowal" Action Elements: Glowing particles floating upward/outward -->
  <circle cx="70" cy="100" r="3" fill="#F6C90E" opacity="0.8"/>
  <circle cx="170" cy="95" r="2" fill="#F6C90E" opacity="0.6"/>
  <circle cx="165" cy="140" r="3.5" fill="#F6C90E" opacity="0.9"/>
  <circle cx="75" cy="135" r="2" fill="#F6C90E" opacity="0.5"/>
  
  <path d="M55 115C60 115 63 118 63 123" stroke="#F6C90E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M185 110C180 110 177 113 177 118" stroke="#F6C90E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

</svg>