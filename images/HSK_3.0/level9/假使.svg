<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Visualizing "假使" (Hypothetical/Causality) as a domino effect chain -->
  <!-- The first domino represents the "Hypothetical" trigger -->
  <rect x="40" y="160" width="15" height="40" rx="2" fill="#FFB347"/>
  
  <!-- The middle dominoes representing the progression -->
  <rect x="75" y="160" width="15" height="40" rx="2" fill="#5DADE2"/>
  <rect x="110" y="160" width="15" height="40" rx="2" fill="#5DADE2"/>
  
  <!-- The final domino representing the "Outcome" of the hypothetical condition -->
  <rect x="145" y="160" width="15" height="40" rx="2" fill="#FFB347"/>
  
  <!-- The "Causality" path: A curved line showing the flow of consequence -->
  <path d="M 47 150 C 80 120, 130 120, 160 150" stroke="#E5E7EB" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
  
  <!-- The "Result" icon: A completed architectural structure (representing the project) -->
  <path d="M 180 180 L 215 180 L 215 200 L 180 200 Z" fill="#5DADE2"/>
  <path d="M 185 180 L 185 160 L 210 160 L 210 180" fill="#FFB347"/>
  
  <!-- Decorative ground line -->
  <line x1="30" y1="200" x2="220" y2="200" stroke="#374151" stroke-width="2"/>
</svg>