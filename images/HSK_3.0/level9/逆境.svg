<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Environment Lines (Subtle Adversity/Storm elements) -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="60" x2="60" y2="75" />
    <line x1="180" y1="50" x2="210" y2="65" />
    <line x1="20" y1="110" x2="50" y2="125" />
    <line x1="190" y1="130" x2="220" y2="145" />
  </g>

  <!-- Ground / Terrain -->
  <path d="M40 185 L120 170 L200 185 L200 200 L40 200 Z" fill="#2A2F3D"/>
  <line x1="40" y1="185" x2="200" y2="185" stroke="#3E4556" stroke-width="2"/>

  <!-- Iconic Physical Object representing "逆境" (Hardship & Resilience): 
       A sturdy rock formation breaking through a harsh landscape, with a resilient green sprout growing out of its fissure. -->
  <g id="adversity-rock-and-sprout">
    <!-- Jagged Adversity Rock (Main Mass) -->
    <path d="M80 185 L95 120 L115 135 L130 95 L160 140 L175 185 Z" fill="#363C4E"/>
    <!-- Rock Facets (Shading for depth) -->
    <path d="M130 95 L160 140 L130 185 L115 135 Z" fill="#2C3240"/>
    <path d="M95 120 L115 135 L130 185 L80 185 Z" fill="#424A5D"/>

    <!-- Crack / Fissure in the Rock -->
    <path d="M125 110 L118 135 L125 160" stroke="#1A1D24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Resilient Sprout (Hope/Strength in Adversity) -->
    <!-- Stem -->
    <path d="M120 155 Q118 130 123 115" stroke="#4ADE80" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Leaves (Vibrant Gold/Green representing thriving despite conditions) -->
    <path d="M123 115 C115 110 110 120 123 125 C136 120 131 110 123 115 Z" fill="#FACC15"/>
    <path d="M121 130 C113 127 110 135 121 138 C132 135 129 127 121 130 Z" fill="#4ADE80"/>
  </g>

  <!-- Focus Accent Elements (Warm glowing light breaking through the top) -->
  <path d="M120 70 L125 45 M100 80 L85 60 M145 80 L160 60" stroke="#FACC15" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="120" cy="40" r="3" fill="#FACC15"/>

</svg>