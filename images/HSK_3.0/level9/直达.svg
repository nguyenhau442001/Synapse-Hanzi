<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background path representing direct transit line (dashed starting, solid direct line) -->
  <line x1="30" y1="160" x2="210" y2="160" stroke="#2A303C" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Direct trajectory arrow/beam -->
  <path d="M 60 160 L 190 160" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- Skipped/Bypassed intermediate stations (showing "non-stop" action) -->
  <circle cx="95" cy="160" r="4" fill="#4B5563"/>
  <line x1="95" y1="148" x2="95" y2="154" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
  
  <circle cx="145" cy="160" r="4" fill="#4B5563"/>
  <line x1="145" y1="148" x2="145" y2="154" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic Motion Lines representing high speed -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="40" y1="125" x2="70" y2="125"/>
    <line x1="30" y1="135" x2="80" y2="135"/>
    <line x1="50" y1="145" x2="90" y2="145"/>
  </g>

  <!-- High-speed train (Sleek modern flat design, Action/Verb representation) -->
  <g transform="translate(100, 110)">
    <!-- Train Body -->
    <path d="M 10 35 L 75 35 C 88 35 98 42 102 48 L 108 55 L 0 55 L 5 45 C 7 38 10 35 10 35 Z" fill="#38BDF8"/>
    
    <!-- Train Head Aerodynamic Nose -->
    <path d="M 108 55 L 118 55 C 122 55 120 48 114 44 L 102 48 Z" fill="#0EA5E9"/>

    <!-- Windshield / Windows -->
    <path d="M 85 39 L 100 39 C 103 39 106 42 107 45 L 85 45 Z" fill="#1A1D24"/>
    <rect x="25" y="40" width="12" height="8" rx="2" fill="#1A1D24"/>
    <rect x="45" y="40" width="12" height="8" rx="2" fill="#1A1D24"/>
    <rect x="65" y="40" width="12" height="8" rx="2" fill="#1A1D24"/>

    <!-- Underbody chassis -->
    <rect x="10" y="55" width="95" height="4" rx="2" fill="#64748B"/>

    <!-- Wheels -->
    <circle cx="25" cy="63" r="5" fill="#94A3B8"/>
    <circle cx="25" cy="63" r="2" fill="#1A1D24"/>
    <circle cx="85" cy="63" r="5" fill="#94A3B8"/>
    <circle cx="85" cy="63" r="2" fill="#1A1D24"/>
  </g>

  <!-- Destination Marker (Accent color: Gold/Orange) -->
  <g transform="translate(195, 140)">
    <circle cx="0" cy="0" r="12" fill="#F59E0B" opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
    <path d="M -2 2 L 0 4 L 3 -1" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Origin Marker -->
  <g transform="translate(45, 140)">
    <circle cx="0" cy="0" r="6" fill="#64748B"/>
  </g>

</svg>