<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle anatomical grid / background elements -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#2A313C" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Stylized human body silhouette / cross-section (chest/abdomen area) -->
  <path d="M75,90 C85,75 100,70 120,70 C140,70 155,75 165,90 C175,110 180,140 175,180 C173,195 165,200 150,200 L90,200 C75,200 67,195 65,180 C60,140 65,110 75,90 Z" fill="#222733" stroke="#3A4454" stroke-width="2"/>
  
  <!-- Internal organ (e.g., stylized liver or tissue bed) -->
  <path d="M95,110 C105,100 135,100 150,115 C165,130 160,160 145,170 C130,180 100,175 90,160 C80,145 85,120 95,110 Z" fill="#2E3846" stroke="#46546A" stroke-width="2"/>
  
  <!-- The Tumor (Khối u / Bướu) - Distinct, organic, multi-lobular shape with contrasting warning color -->
  <g transform="translate(120, 135)">
    <!-- Tumor shadow/glow -->
    <path d="M -22,-5 C -25,-25 -5,-30 5,-22 C 20,-28 32,-15 28,0 C 35,15 20,28 5,25 C -5,30 -22,20 -25,5 C -30,-2 -25,-2 -22,-5 Z" fill="#FF8C42" opacity="0.2" filter="blur(4px)"/>
    
    <!-- Main tumor body -->
    <path d="M -20,-4 C -22,-22 -4,-26 4,-19 C 18,-24 28,-13 25,0 C 31,13 18,25 4,22 C -4,26 -20,17 -22,4 C -26,-1 -22,-2 -20,-4 Z" fill="#FF6B35" stroke="#FF9F1C" stroke-width="2"/>
    
    <!-- Internal organic texture details (nodules) -->
    <circle cx="-5" cy="-5" r="5" fill="#E85D24"/>
    <circle cx="8" cy="6" r="6" fill="#E85D24"/>
    <circle cx="4" cy="-8" r="4" fill="#FFA559"/>
    <circle cx="-8" cy="8" r="4" fill="#FFA559"/>
  </g>

  <!-- Precision Medical Laser / Surgical Target Indicator (representing modern excision / 微创手术) -->
  <g opacity="0.85">
    <!-- Target reticle ring -->
    <circle cx="120" cy="135" r="38" fill="none" stroke="#4EA8DE" stroke-width="1.5" stroke-dasharray="6 3"/>
    
    <!-- Precision crosshairs -->
    <line x1="120" y1="87" x2="120" y2="97" stroke="#4EA8DE" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="173" x2="120" y2="183" stroke="#4EA8DE" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="135" x2="82" y2="135" stroke="#4EA8DE" stroke-width="2" stroke-linecap="round"/>
    <line x1="158" y1="135" x2="168" y2="135" stroke="#4EA8DE" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Laser beam point indicating removal/targeting -->
    <circle cx="120" cy="135" r="3" fill="#4EA8DE"/>
  </g>
</svg>