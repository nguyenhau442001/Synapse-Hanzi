<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Arm and Hand -->
  <g transform="translate(60, 80)">
    <path d="M20 120 L100 40 L120 60 L40 140 Z" fill="#E0A860"/>
    <path d="M100 40 L120 60 L140 40 L120 20 Z" fill="#D4944D"/>
    <!-- Fingers -->
    <path d="M120 20 L135 35 L125 45 L110 30 Z" fill="#E0A860"/>
    <path d="M115 15 L130 30 L120 40 L105 25 Z" fill="#E0A860"/>
  </g>

  <!-- Skin Surface -->
  <path d="M40 160 C 80 140, 160 140, 200 160" stroke="#A0A0A0" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Ointment Layer being spread -->
  <path d="M70 155 C 90 145, 130 145, 150 155" stroke="#FFC107" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Ointment blob -->
  <circle cx="65" cy="155" r="6" fill="#FFC107"/>
</svg>