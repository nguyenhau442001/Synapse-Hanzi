<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Steam / Heat rising -->
    <path d="M95 65 C90 50, 100 40, 95 25" stroke="#FF7A00" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M120 60 C125 45, 115 35, 120 20" stroke="#FFD600" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M145 65 C150 50, 140 40, 145 25" stroke="#FF7A00" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Wok Handle (Left) -->
    <path d="M40 105 L70 115" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
    <path d="M25 100 L45 106" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>

    <!-- Wok Handle (Right) -->
    <path d="M200 105 L170 115" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Wok Body (Outer) -->
    <path d="M60 100 C60 155, 180 155, 180 100 Z" fill="#2D3748"/>
    
    <!-- Wok Body (Inner / Food area) -->
    <path d="M65 102 C65 150, 175 150, 175 102 Z" fill="#1E293B"/>

    <!-- Delicious food being stir-fried -->
    <ellipse cx="120" cy="122" rx="42" ry="16" fill="#0F172A" opacity="0.3"/>
    
    <!-- Food pieces & veggies -->
    <circle cx="100" cy="118" r="8" fill="#E11D48"/>
    <circle cx="135" cy="115" r="9" fill="#EA580C"/>
    <rect x="110" y="122" width="14" height="8" rx="3" fill="#16A34A" transform="rotate(-15 117 126)"/>
    <rect x="85" y="125" width="12" height="7" rx="3" fill="#EAB308" transform="rotate(20 91 128)"/>
    <circle cx="145" cy="126" r="7" fill="#16A34A"/>
    <circle cx="115" cy="112" r="6" fill="#F97316"/>

    <!-- Wok Rim (Highlight) -->
    <ellipse cx="120" cy="100" rx="60" ry="12" fill="none" stroke="#64748B" stroke-width="4"/>

    <!-- Flames / Huohou (Precise Heat) underneath the Wok -->
    <g transform="translate(120, 150)">
      <!-- Center Main Flame -->
      <path d="M0 0 C-12 -25, -22 -40, 0 -60 C22 -40, 12 -25, 0 0 Z" fill="#FF3D00"/>
      <path d="M0 -10 C-6 -25, -12 -35, 0 -48 C12 -35, 6 -25, 0 -10 Z" fill="#FFC107"/>

      <!-- Left Flame -->
      <path d="M-30 5 C-40 -15, -48 -25, -30 -45 C-15 -30, -22 -15, -30 5 Z" fill="#FF7A00"/>
      <path d="M-30 -2 C-35 -12, -40 -18, -30 -32 C-20 -20, -25 -10, -30 -2 Z" fill="#FFD600"/>

      <!-- Right Flame -->
      <path d="M30 5 C40 -15, 48 -25, 30 -45 C15 -30, 22 -15, 30 5 Z" fill="#FF7A00"/>
      <path d="M30 -2 C35 -12, 40 -18, 30 -32 C20 -20, 25 -10, 30 -2 Z" fill="#FFD600"/>
      
      <!-- Stove Base Ring -->
      <path d="M-55 10 L55 10" stroke="#4B5563" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>