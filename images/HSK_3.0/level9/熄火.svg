<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Water level -->
  <path d="M0 160 Q 120 140 240 160 L 240 240 L 0 240 Z" fill="#2C3E50" opacity="0.8"/>
  
  <!-- Car body -->
  <g transform="translate(60, 130)">
    <path d="M10 40 L110 40 L105 15 L80 15 L60 0 L30 0 L10 15 Z" fill="#E74C3C"/>
    <circle cx="30" cy="40" r="10" fill="#34495E"/>
    <circle cx="90" cy="40" r="10" fill="#34495E"/>
  </g>
  
  <!-- Water splash/intake effect -->
  <path d="M70 150 L90 130 M80 150 L100 130 M90 150 L110 130" stroke="#3498DB" stroke-width="3" stroke-linecap="round"/>
  
  <!-- The "熄火" action: Smoke/Steam rising from the hood -->
  <path d="M75 130 Q 70 110 80 90 Q 90 70 85 50" stroke="#BDC3C7" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M85 130 Q 80 110 90 90 Q 100 70 95 50" stroke="#BDC3C7" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  
  <!-- X mark indicating stop/failure -->
  <g stroke="#F1C40F" stroke-width="6" stroke-linecap="round">
    <line x1="105" y1="105" x2="135" y2="135"/>
    <line x1="135" y1="105" x2="105" y2="135"/>
  </g>
</svg>