<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: A mechanical vintage apothecary scale (so đo, tính toán, so bì chi li) -->
  <g transform="translate(120, 115)">
    <!-- Scale Base -->
    <path d="M-30,65 L30,65 L22,78 L-22,78 Z" fill="#4A5568"/>
    <rect x="-10" y="25" width="20" height="40" rx="4" fill="#718096"/>
    
    <!-- Central Pillar & Top Finial -->
    <rect x="-3" y="-55" width="6" height="85" fill="#E2E8F0"/>
    <circle cx="0" cy="-58" r="8" fill="#F6AD55"/>
    
    <!-- Scale Beam (tipped slightly to show meticulous calculation/bias) -->
    <g transform="rotate(-6)">
      <path d="M-75,-25 L75,-25 L65,-15 L-65,-15 Z" fill="#CBD5E0"/>
      
      <!-- Left Chain & Pan -->
      <line x1="-70" y1="-20" x2="-70" y2="20" stroke="#A0AEC0" stroke-width="2"/>
      <line x1="-70" y1="-20" x2="-85" y2="20" stroke="#A0AEC0" stroke-width="1.5"/>
      <line x1="-70" y1="-20" x2="-55" y2="20" stroke="#A0AEC0" stroke-width="1.5"/>
      <path d="M-92,20 C-92,32 -58,32 -48,20 Z" fill="#4A5568"/>
      <!-- Tiny meticulous items on left pan -->
      <circle cx="-72" cy="18" r="4" fill="#F6AD55"/>
      <circle cx="-63" cy="20" r="3.5" fill="#ED8936"/>
      <circle cx="-80" cy="21" r="3" fill="#DD6B20"/>

      <!-- Right Chain & Pan -->
      <line x1="70" y1="-20" x2="70" y2="12" stroke="#A0AEC0" stroke-width="2"/>
      <line x1="70" y1="-20" x2="55" y2="12" stroke="#A0AEC0" stroke-width="1.5"/>
      <line x1="70" y1="-20" x2="85" y2="12" stroke="#A0AEC0" stroke-width="1.5"/>
      <path d="M48,12 C48,24 82,24 92,12 Z" fill="#4A5568"/>
      <!-- Tiny meticulous items on right pan -->
      <circle cx="68" cy="10" r="3.5" fill="#ED8936"/>
      <circle cx="77" cy="12" r="4" fill="#F6AD55"/>
    </g>

    <!-- Accent glow indicating calculation/nitpicking focus -->
    <circle cx="-70" cy="15" r="16" fill="none" stroke="#F6AD55" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  </g>
</svg>