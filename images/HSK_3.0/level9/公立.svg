<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background architectural subtle glow -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.5"/>

  <!-- Public School Building (公立学校 - Noun: Place) -->
  <g transform="translate(45, 60)">
    <!-- Main Building Body -->
    <rect x="25" y="40" width="100" height="75" fill="#2C3545" rx="2"/>
    
    <!-- Foundation Base -->
    <rect x="20" y="115" width="110" height="8" fill="#3A4454" rx="1"/>

    <!-- Classic School Columns (representing public/governmental institution) -->
    <rect x="35" y="60" width="8" height="55" fill="#E2E8F0"/>
    <rect x="52" y="60" width="8" height="55" fill="#E2E8F0"/>
    <rect x="90" y="60" width="8" height="55" fill="#E2E8F0"/>
    <rect x="107" y="60" width="8" height="55" fill="#E2E8F0"/>

    <!-- Entrance Doorway -->
    <path d="M 68 85 L 68 115 L 82 115 L 82 85 Z" fill="#1A1D24"/>
    <path d="M 75 78 C 71.5 78 68 80.5 68 85 L 82 85 C 82 80.5 78.5 78 75 78 Z" fill="#1A1D24"/>

    <!-- Windows (Upper Floor) -->
    <rect x="33" y="47" width="12" height="10" fill="#38BDF8" rx="1"/>
    <rect x="53" y="47" width="12" height="10" fill="#38BDF8" rx="1"/>
    <rect x="85" y="47" width="12" height="10" fill="#38BDF8" rx="1"/>
    <rect x="105" y="47" width="12" height="10" fill="#38BDF8" rx="1"/>

    <!-- Triangular Pediment (Roof) -->
    <polygon points="15,40 135,40 75,10" fill="#3B82F6"/>
    <!-- Roof Accent Trim -->
    <polygon points="19,40 131,40 75,13" fill="#60A5FA"/>

    <!-- Official Emblem / Star on Pediment (signifying public/governmental backing) -->
    <circle cx="75" cy="27" r="7" fill="#F59E0B"/>
    <polygon points="75,22 76.5,25.5 80,26 77.5,28.5 78,32 75,30 72,32 72.5,28.5 70,26 73.5,25.5" fill="#FFFFFF"/>

    <!-- Flagpole & Flag (Civic/Public institution symbol) -->
    <rect x="12" y="15" width="2" height="85" fill="#94A3B8"/>
    <polygon points="14,18 36,25 14,32" fill="#EF4444"/>
  </g>

  <!-- Ground Landscape / Pathway -->
  <path d="M 30 185 L 210 185 L 225 198 L 15 198 Z" fill="#334155"/>
  <path d="M 105 185 L 135 185 L 145 198 L 95 198 Z" fill="#F59E0B" opacity="0.8"/> <!-- Pathway to entrance -->

  <!-- Foreground tree/nature elements to frame the educational setting -->
  <g transform="translate(180, 135)">
    <rect x="12" y="25" width="6" height="30" fill="#78350F"/>
    <circle cx="15" cy="18" r="16" fill="#10B981"/>
    <circle cx="22" cy="25" r="12" fill="#059669"/>
  </g>
  <g transform="translate(25, 135)">
    <rect x="12" y="25" width="6" height="30" fill="#78350F"/>
    <circle cx="15" cy="18" r="16" fill="#10B981"/>
    <circle cx="8" cy="25" r="12" fill="#059669"/>
  </g>
</svg>