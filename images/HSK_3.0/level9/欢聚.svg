<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Warm Glow for Festive Atmosphere -->
  <circle cx="120" cy="130" r="70" fill="#FF9F43" opacity="0.08" filter="blur(15px)"/>

  <!-- Traditional Festive Lantern (Symbolizing Reunion/Joyful Gathering) -->
  <g transform="translate(120, 45)">
    <!-- Hanging String -->
    <line x1="0" y1="-25" x2="0" y2="-10" stroke="#718096" stroke-width="2" stroke-linecap="round"/>
    <!-- Top Cap -->
    <path d="M-8,-10 L8,-10 L5,0 L-5,0 Z" fill="#E53E3E"/>
    <!-- Lantern Body -->
    <path d="M-5,0 C-30,0 -35,35 0,55 C35,35 30,0 5,0 Z" fill="#F56565"/>
    <!-- Lantern Ribs / Highlights -->
    <path d="M-5,0 C-15,10 -18,30 0,55 C18,30 15,10 5,0" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.8"/>
    <path d="M-5,0 C-5,10 -5,30 0,55 C5,30 5,10 5,0" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.6"/>
    <!-- Bottom Cap -->
    <path d="M-5,55 L5,55 L8,62 L-8,62 Z" fill="#E53E3E"/>
    <!-- Tassel -->
    <line x1="0" y1="62" x2="0" y2="76" stroke="#FFD166" stroke-width="2"/>
    <rect x="-3" y="76" width="6" height="10" rx="2" fill="#F6AD55"/>
  </g>

  <!-- Dining Table & Feast (Central Object for "Huān jù" - Reunion Dinner) -->
  <g transform="translate(120, 165)">
    <!-- Table Surface (Ellipse) -->
    <ellipse cx="0" cy="20" rx="85" ry="24" fill="#2D3748"/>
    <ellipse cx="0" cy="16" rx="80" ry="20" fill="#4A5568"/>

    <!-- Tablecloth / Runner Accent -->
    <path d="M-40,16 Q0,32 40,16 Q0,38 -40,16 Z" fill="#E53E3E" opacity="0.85"/>

    <!-- Hot Pot / Central Feast Bowl -->
    <circle cx="0" cy="8" r="22" fill="#718096"/>
    <circle cx="0" cy="8" r="18" fill="#FC8181"/>
    <!-- Steam / Warmth Lines -->
    <path d="M-4,-2 C-8,-8 -2,-14 -6,-20" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M4,-2 C8,-8 2,-14 6,-20" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Side Dishes / Bowls -->
    <ellipse cx="-45" cy="12" rx="10" ry="6" fill="#EDF2F7"/>
    <circle cx="-45" cy="10" r="6" fill="#F6AD55"/>

    <ellipse cx="45" cy="12" rx="10" ry="6" fill="#EDF2F7"/>
    <circle cx="45" cy="10" r="6" fill="#48BB78"/>

    <ellipse cx="-25" cy="24" rx="8" ry="5" fill="#EDF2F7"/>
    <ellipse cx="25" cy="24" rx="8" ry="5" fill="#EDF2F7"/>
  </g>

  <!-- Family Silhouettes / Figures Gathering Around (Representing Multi-generational Family) -->
  <!-- Left Figure (Grandparent/Parent) -->
  <g transform="translate(55, 140)">
    <circle cx="0" cy="-15" r="9" fill="#CBD5E0"/>
    <path d="M-12,8 C-12,-3 -6,-5 0,-5 C6,-5 12,-3 12,8 Z" fill="#4FD1C5"/>
  </g>

  <!-- Right Figure (Family Member) -->
  <g transform="translate(185, 140)">
    <circle cx="0" cy="-15" r="9" fill="#CBD5E0"/>
    <path d="M-12,8 C-12,-3 -6,-5 0,-5 C6,-5 12,-3 12,8 Z" fill="#F6AD55"/>
  </g>

  <!-- Foreground Center Figure (Smiling Family Member) -->
  <g transform="translate(120, 130)">
    <circle cx="0" cy="-15" r="10" fill="#CBD5E0"/>
    <path d="M-14,8 C-14,-3 -7,-6 0,-6 C7,-6 14,-3 14,8 Z" fill="#63B3ED"/>
  </g>
</svg>