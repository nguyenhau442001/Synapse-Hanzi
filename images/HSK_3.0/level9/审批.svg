<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow -->
  <circle cx="120" cy="120" r="70" fill="#222733" opacity="0.6"/>

  <!-- Document / Official Paper representing the application file -->
  <g transform="translate(65, 38)">
    <rect x="0" y="0" width="110" height="145" rx="8" fill="#282E3D" stroke="#3A4255" stroke-width="2"/>
    
    <!-- Document Header Accent -->
    <rect x="16" y="20" width="40" height="8" rx="4" fill="#4B556B"/>
    
    <!-- Document Lines -->
    <rect x="16" y="44" width="78" height="6" rx="3" fill="#3A4255"/>
    <rect x="16" y="62" width="60" height="6" rx="3" fill="#3A4255"/>
    <rect x="16" y="80" width="72" height="6" rx="3" fill="#3A4255"/>
    
    <!-- Checklist rows -->
    <rect x="16" y="104" width="10" height="10" rx="2" fill="#3B82F6" opacity="0.4"/>
    <rect x="32" y="106" width="45" height="5" rx="2.5" fill="#4B556B"/>
    
    <rect x="16" y="122" width="10" height="10" rx="2" fill="#3B82F6" opacity="0.4"/>
    <rect x="32" y="124" width="35" height="5" rx="2.5" fill="#4B556B"/>
  </g>

  <!-- Official Stamp / Seal (Red/Coral Accent representing Approval) -->
  <g transform="translate(130, 115)">
    <!-- Stamp Handle -->
    <rect x="18" y="-22" width="14" height="22" rx="3" fill="#E5E7EB"/>
    <ellipse cx="25" cy="-22" rx="7" ry="3" fill="#9CA3AF"/>
    <rect x="12" y="0" width="26" height="6" rx="2" fill="#D1D5DB"/>

    <!-- Circular Seal Base -->
    <circle cx="25" cy="30" r="28" fill="#1E222B" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="25" cy="30" r="22" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,2"/>
    
    <!-- Checkmark representing Approval (审批通过) -->
    <path d="M14 31L21 38L38 20" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Digital connectivity wave / One-Net-Access cue -->
  <path d="M45 185C75 195 165 195 195 185" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="120" cy="190" r="4" fill="#3B82F6"/>
</svg>