<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow representing current operational status -->
  <circle cx="120" cy="115" r="70" fill="#222B38" opacity="0.6"/>

  <!-- Central Physical Object: A sleek, modern legal code document / statute book representing "现行法律法规" (current active laws/regulations) -->
  <g transform="translate(0, 5)">
    <!-- Base shadow -->
    <ellipse cx="120" cy="180" rx="55" ry="10" fill="#0D0F13"/>

    <!-- Document Back Pages / Binding Thickness -->
    <path d="M75,65 L165,65 L165,160 L75,160 Z" fill="#2E3846" rx="6"/>
    
    <!-- Main Cover Book / Statute Volume -->
    <rect x="70" y="60" width="100" height="105" rx="8" fill="#2563EB"/>
    
    <!-- Spine Accent / Golden Binding Edge -->
    <path d="M70,68 C70,64 73,61 77,61 L83,61 L83,165 L77,165 C73,165 70,162 70,158 Z" fill="#D97706"/>

    <!-- Cover Details: Title representation (Horizontal lines) -->
    <rect x="95" y="82" width="55" height="6" rx="3" fill="#60A5FA"/>
    <rect x="95" y="98" width="40" height="4" rx="2" fill="#93C5FD"/>
    <rect x="95" y="110" width="50" height="4" rx="2" fill="#93C5FD"/>

    <!-- Official Seal / Stamp Symbolizing "Active/Current" (现行) Status -->
    <circle cx="135" cy="138" r="18" fill="#10B981" stroke="#1A1D24" stroke-width="3"/>
    <!-- Checkmark inside seal -->
    <path d="M127,138 L133,144 L145,130" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dynamic Active Pulse Indicator (Visualizing "Currently in Force / Applying Now") -->
  <g transform="translate(120, 32)">
    <circle cx="0" cy="0" r="14" fill="#10B981" opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#10B981"/>
    <!-- Live wave / action vector lines radiating outward -->
    <path d="M -22 -5 C -25 -2, -25 2, -22 5" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <path d="M 22 -5 C 25 -2, 25 2, 22 5" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>