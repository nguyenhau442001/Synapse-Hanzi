<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background graphical depth representing hidden scheming/calculating -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="85" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="120" cy="120" r="65" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
    <path d="M120 35 L120 205 M35 120 L205 120" stroke="#F59E0B" stroke-width="0.75" stroke-dasharray="3 3"/>
  </g>

  <!-- Central Physical Object representing "算计" (Calculated Scheme / Hidden Strategy) -->
  <g transform="translate(120, 120)">
    <!-- Main blueprint / tactical board backdrop -->
    <path d="M-55,-45 L55,-45 L65,55 L-65,55 Z" fill="#252A34" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Blueprint grid lines -->
    <path d="M-40,-25 L40,-25 M-40,-5 L40,-5 M-40,15 L40,15 M-40,35 L40,35" stroke="#3A4252" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Hidden tactical gears/cogs overlapping in shadow (scheming) -->
    <g transform="translate(-25, 0) scale(0.65)" opacity="0.8">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#64748B" stroke-width="6"/>
      <path d="M0,-36 L0,-28 M0,28 L0,36 M-36,0 L-28,0 M-28,0 L-36,0 M28,0 L36,0 M-25,-25 L-19,-19 M19,19 L25,25 M-25,25 L-19,19 M19,-19 L25,-25" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(25, -10) scale(0.45)" opacity="0.6">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#64748B" stroke-width="6"/>
      <path d="M0,-36 L0,-28 M0,28 L0,36 M-36,0 L-28,0 M28,0 L36,0 M-25,-25 L-19,-19 M19,19 L25,25 M-25,25 L-19,19 M19,-19 L25,-25" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Chess/Game pieces representing calculated human plotting -->
    <!-- Opponent/Pawn piece (being manipulated) -->
    <g transform="translate(-15, 10)">
      <path d="M-8,15 L8,15 L6,5 L-6,5 Z" fill="#64748B"/>
      <circle cx="0" cy="-3" r="6" fill="#94A3B8"/>
      <path d="M-4,3 L4,3 L3,5 L-3,5 Z" fill="#94A3B8"/>
    </g>

    <!-- Main scheming/manipulating piece (Focus Accent: Orange/Gold) -->
    <g transform="translate(20, -5)">
      <!-- Piece Base -->
      <path d="M-12,22 L12,22 L9,10 L-9,10 Z" fill="#D97706"/>
      <!-- Piece Body -->
      <path d="M-8,10 C-8,3 -4,0 -4,-8 L4,-8 C4,0 8,3 8,10 Z" fill="#F59E0B"/>
      <!-- Piece Crown / Top (King/Strategist marker) -->
      <circle cx="0" cy="-13" r="7" fill="#FBBF24"/>
      <path d="M-5,-19 L0,-23 L5,-19 Z" fill="#D97706"/>
    </g>

    <!-- Manipulative connecting arrow / hidden vector trajectory -->
    <path d="M10,-12 C-2,-15 -10,-2 -15,2" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    
    <!-- Dividers/Calculated angles overlay (Protractor arc) -->
    <path d="M-45,-30 A 55 55 0 0 1 45,-30" fill="none" stroke="#3A4252" stroke-width="1.5"/>
    <line x1="0" y1="-30" x2="35" y2="-55" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="35" cy="-55" r="3" fill="#F59E0B"/>
  </g>

  <!-- Marker definition for SVG -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#F59E0B"/>
    </marker>
  </defs>
</svg>