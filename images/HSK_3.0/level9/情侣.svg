  <path d="M70 180h10v30H70zM160 180h10v30h-10z" fill="#4A5568"/>
  
  <!-- Couple sitting -->
  <!-- Person 1 (Left) -->
  <g transform="translate(90, 110)">
    <circle cx="15" cy="20" r="12" fill="#FFD700"/>
    <path d="M5 35h20l-2 25h-16z" fill="#FFD700"/>
    <path d="M10 60h10v10h-10z" fill="#FFD700"/>
  </g>
  
  <!-- Person 2 (Right) -->
  <g transform="translate(125, 110)">
    <circle cx="15" cy="20" r="12" fill="#FF8C00"/>
    <path d="M5 35h20l2 25h-16z" fill="#FF8C00"/>
    <path d="M10 60h10v10h-10z" fill="#FF8C00"/>
  </g>
  
  <!-- Interaction: Leaning towards each other -->
