<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "鲜活" (vivid/fresh/alive) through a street market scene: a fresh, vibrant fish being held up, symbolizing the "freshness" and "vividness" of daily life -->
  
  <!-- Hand holding the fish -->
  <path d="M100 180c-5 0-10-2-15-5l-10-20c-5-10-5-20 0-30l10-10c5-5 15-5 20 0l5 5c5 5 10 10 15 10h20c10 0 20 10 20 20v10c0 10-10 20-20 20h-30" fill="#FFC107"/>
  
  <!-- The fish (vivid, fresh, orange/gold) -->
  <path d="M120 130c20-10 40-10 60 0l10 5c5 2 5 8 0 10l-10 5c-20 10-40 10-60 0l-10-5c-5-2-5-8 0-10z" fill="#FF9800"/>
  <path d="M180 135l15-10v20z" fill="#FFC107"/>
  <path d="M125 132c5-2 10-2 15 0" stroke="#1A1D24" stroke-width="2" fill="none"/>
  
  <!-- Market background elements (subtle, non-distracting) -->
  <path d="M40 200h160v10H40z" fill="#2C313C"/>
  <path d="M60 190h20v10H60z" fill="#3E4451"/>
  <path d="M100 190h20v10H100z" fill="#3E4451"/>
  <path d="M140 190h20v10H140z" fill="#3E4451"/>
  <path d="M180 190h20v10H180z" fill="#3E4451"/>
  
  <!-- Steam/Vibrancy lines -->
  <path d="M150 120c5-10 15-10 20 0" stroke="#FFC107" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M160 110c5-10 15-10 20 0" stroke="#FFC107" stroke-width="2" fill="none" opacity="0.4"/>
</svg>