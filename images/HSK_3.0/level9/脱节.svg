<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Chain link representing the connection -->
  <g transform="translate(60, 100)">
    <!-- Left side of the chain -->
    <path d="M40 20 L20 20 C10 20 10 40 20 40 L40 40 C50 40 50 20 40 20 Z" fill="#FFB84D"/>
    <path d="M40 24 L20 24 C14 24 14 36 20 36 L40 36 C46 36 46 24 40 24 Z" fill="#1A1D24"/>
    
    <!-- The break point: Right side of the chain shifted away -->
    <path d="M80 20 L100 20 C110 20 110 40 100 40 L80 40 C70 40 70 20 80 20 Z" fill="#FFB84D"/>
    <path d="M80 24 L100 24 C106 24 106 36 100 36 L80 36 C74 36 74 24 80 24 Z" fill="#1A1D24"/>
    
    <!-- Visual indicators of the snap/break -->
    <path d="M55 15 L65 10 M55 45 L65 50" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
    <path d="M75 10 L85 15 M75 50 L85 45" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>