<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "年薪" (Annual Salary / Yearly Income) -->
  <!-- Combining a sleek calendar/time motif with a prominent gold coin/wealth stack, strictly as a physical object -->

  <!-- Background subtle glow -->
  <circle cx="120" cy="120" r="70" fill="#FFC107" opacity="0.05"/>

  <!-- Calendar Base (Representing "年" / Year) -->
  <g transform="translate(65, 55)">
    <!-- Calendar Body -->
    <rect x="0" y="20" width="110" height="100" rx="12" fill="#2A2F3D" stroke="#3A4256" stroke-width="3"/>
    
    <!-- Calendar Header -->
    <path d="M 0 32 A 12 12 0 0 1 12 20 L 98 20 A 12 12 0 0 1 110 32 L 110 50 L 0 50 Z" fill="#FF8F00"/>
    
    <!-- Calendar Rings -->
    <rect x="25" y="10" width="8" height="16" rx="4" fill="#64748B"/>
    <rect x="77" y="10" width="8" height="16" rx="4" fill="#64748B"/>

    <!-- Calendar Grid / Lines -->
    <line x1="25" y1="70" x2="45" y2="70" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="70" x2="85" y2="70" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="95" x2="45" y2="95" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="95" x2="85" y2="95" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Wealth / Salary Element (Stack of Gold Coins overlapping the calendar to signify Annual Income) -->
  <g transform="translate(100, 115)">
    <!-- Coin 3 (Bottom) -->
    <ellipse cx="40" cy="70" rx="36" ry="16" fill="#D97706"/>
    <path d="M 4 70 A 36 16 0 0 0 76 70 Z" fill="#F59E0B"/>
    <ellipse cx="40" cy="70" rx="24" ry="10" fill="#B45309"/>

    <!-- Coin 2 (Middle) -->
    <ellipse cx="40" cy="48" rx="36" ry="16" fill="#D97706"/>
    <path d="M 4 48 A 36 16 0 0 0 76 48 Z" fill="#F59E0B"/>
    <ellipse cx="40" cy="48" rx="24" ry="10" fill="#B45309"/>

    <!-- Coin 1 (Top) -->
    <ellipse cx="40" cy="26" rx="36" ry="16" fill="#F59E0B"/>
    <path d="M 4 26 A 36 16 0 0 0 76 26 Z" fill="#FBBF24"/>
    <ellipse cx="40" cy="26" rx="24" ry="10" fill="#D97706"/>
    <!-- Inner shine on top coin -->
    <ellipse cx="40" cy="24" rx="16" ry="6" fill="#FDE68A"/>
  </g>

  <!-- Sparkles / Accent highlights representing high value -->
  <g fill="#FBBF24">
    <!-- Top Right Sparkle -->
    <path d="M 185 70 Q 185 85 170 85 Q 185 85 185 100 Q 185 85 200 85 Q 185 85 185 70 Z"/>
    <!-- Small Left Sparkle -->
    <path d="M 55 125 Q 55 133 47 133 Q 55 133 55 141 Q 55 133 63 133 Q 55 133 55 125 Z"/>
  </g>
</svg>