<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow -->
  <circle cx="120" cy="110" r="80" fill="#2D3748" opacity="0.3"/>

  <!-- Document / Long Name block (Representing the full name) -->
  <g transform="translate(36, 60)">
    <rect x="0" y="0" width="88" height="100" rx="6" fill="#2A313C" stroke="#3F4A5D" stroke-width="2"/>
    <!-- Document lines representing long text -->
    <rect x="14" y="20" width="60" height="6" rx="3" fill="#64748B"/>
    <rect x="14" y="36" width="45" height="6" rx="3" fill="#475569"/>
    <rect x="14" y="52" width="55" height="6" rx="3" fill="#475569"/>
    <rect x="14" y="68" width="35" height="6" rx="3" fill="#475569"/>
  </g>

  <!-- Dynamic Action: Person editing / condensing the text -->
  <g transform="translate(10, 0)">
    <!-- Motion lines representing the contraction/abbreviation action -->
    <path d="M112 110 L92 110" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M110 102 L98 110 L110 118" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Editing stylus / cutting tool indicating "shortening" -->
    <path d="M125 95 L155 125 L145 135 L115 105 Z" fill="#E2E8F0"/>
    <path d="M115 105 L125 95 L130 100 L120 110 Z" fill="#94A3B8"/>
    <path d="M145 135 L155 125 L165 145 Z" fill="#F59E0B"/>
  </g>

  <!-- Result / Short Name block (Representing the acronym/abbreviation) -->
  <g transform="translate(144, 75)">
    <rect x="0" y="0" width="60" height="70" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- Condensed text representation (bold distinct blocks) -->
    <rect x="12" y="14" width="36" height="10" rx="4" fill="#F59E0B"/>
    <rect x="12" y="32" width="24" height="8" rx="3" fill="#94A3B8"/>
    <circle cx="44" cy="36" r="3" fill="#F59E0B"/>
    <rect x="12" y="48" width="16" height="8" rx="3" fill="#64748B"/>
  </g>

</svg>