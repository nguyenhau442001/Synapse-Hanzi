<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Illustration: 零碎 (Scattered small items / odds and ends) -->
  <g transform="translate(0, 0)">
    <!-- Open drawer outline / tray base representing the context -->
    <path d="M 45 90 L 195 90 L 180 200 L 60 200 Z" fill="#222730" stroke="#3A4252" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 38 78 L 202 78 L 195 90 L 45 90 Z" fill="#2D3340" stroke="#3A4252" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Drawer Handle -->
    <rect x="95" y="165" width="50" height="8" rx="4" fill="#4E5D6C"/>

    <!-- Scattered small objects (Odds and ends / 零碎杂物) -->
    <!-- 1. Buttons (纽扣) -->
    <circle cx="85" cy="115" r="12" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
    <circle cx="85" cy="115" r="4" fill="#2D3340"/>
    <circle cx="82" cy="113" r="1" fill="#E67E22"/>
    <circle cx="88" cy="113" r="1" fill="#E67E22"/>

    <circle cx="155" cy="135" r="9" fill="#3498DB" stroke="#2980B9" stroke-width="2"/>
    <circle cx="155" cy="135" r="3" fill="#2D3340"/>

    <circle cx="110" cy="145" r="10" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
    <circle cx="110" cy="145" r="3" fill="#2D3340"/>

    <!-- 2. Spool of Thread (线轴) -->
    <g transform="translate(130, 105) rotate(15)">
      <rect x="-6" y="-12" width="12" height="24" rx="2" fill="#9B59B6"/>
      <rect x="-9" y="-14" width="18" height="4" rx="2" fill="#8E44AD"/>
      <rect x="-9" y="10" width="18" height="4" rx="2" fill="#8E44AD"/>
      <!-- Thread lines -->
      <line x1="-5" y1="-6" x2="5" y2="-6" stroke="#D2B4DE" stroke-width="1.5"/>
      <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#D2B4DE" stroke-width="1.5"/>
      <line x1="-5" y1="2" x2="5" y2="2" stroke="#D2B4DE" stroke-width="1.5"/>
    </g>

    <!-- 3. Sewing Needle (针) -->
    <path d="M 65 140 L 135 115" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="67" cy="139" r="1.5" fill="#2D3340"/>

    <!-- 4. Small paper clip / miscellaneous small hardware -->
    <path d="M 160 100 C 165 95, 172 102, 168 108 L 163 115" fill="none" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- 5. Tiny scattered beads / fragments -->
    <circle cx="100" cy="125" r="3.5" fill="#1ABC9C"/>
    <circle cx="140" cy="155" r="3" fill="#E67E22"/>
    <circle cx="75" cy="155" r="2.5" fill="#E84393"/>
    <circle cx="125" cy="120" r="2" fill="#F39C12"/>
    <rect x="115" y="100" width="5" height="5" rx="1" fill="#2ECC71" transform="rotate(45 117.5 102.5)"/>
  </g>
</svg>