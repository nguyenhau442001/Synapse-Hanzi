<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Satellite Orbit Path -->
  <path d="M180,60 C180,120 120,180 60,180" stroke="#3A404D" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Satellite -->
  <g transform="translate(170, 50)">
    <rect x="-8" y="-4" width="16" height="8" fill="#FFB84D"/>
    <rect x="-12" y="-2" width="4" height="4" fill="#FFB84D"/>
    <rect x="8" y="-2" width="4" height="4" fill="#FFB84D"/>
  </g>
  
  <!-- Map Surface -->
  <path d="M60,140 L180,140 L160,190 L40,190 Z" fill="#2D3442"/>
  <path d="M70,150 L100,155 L90,170 L65,165 Z" fill="#4A5568"/>
  <path d="M120,155 L150,150 L160,175 L130,180 Z" fill="#4A5568"/>
  
  <!-- Human Hand Drawing -->
  <g transform="translate(120, 120)">
    <path d="M0,0 L20,-40" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="-40" r="4" fill="#FFB84D"/>
    
    <!-- Hand -->
    <path d="M-10,10 C-15,0 -5,-10 5,-5 C10,-10 20,-5 15,5 L5,15 Z" fill="#E2E8F0"/>
    <path d="M-5,15 L-15,30 L-5,35 Z" fill="#E2E8F0"/>
  </g>
  
  <!-- Motion Lines -->
  <path d="M135,80 Q145,70 155,80" stroke="#FFB84D" stroke-width="2" fill="none"/>
  <path d="M140,75 Q150,65 160,75" stroke="#FFB84D" stroke-width="2" fill="none"/>
</svg>