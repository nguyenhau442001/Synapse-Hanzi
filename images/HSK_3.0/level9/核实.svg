<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle Background Grid/Accent for Tech/Journalistic Precision -->
  <g opacity="0.15">
    <line x1="40" y1="60" x2="200" y2="60" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="40" y1="120" x2="200" y2="120" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="40" y1="180" x2="200" y2="180" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Central Physical Object: Professional Clipboard with Official Verification Document -->
  <!-- Clipboard Shadow -->
  <rect x="72" y="32" width="96" height="176" rx="12" fill="#0F1117" opacity="0.6"/>
  
  <!-- Clipboard Base (Dark Slate/Blue) -->
  <rect x="68" y="28" width="96" height="176" rx="12" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Metallic Clip at Top -->
  <path d="M96 28h48v12c0 2.2-1.8 4-4 4h-40c-2.2 0-4-1.8-4-4V28z" fill="#718096"/>
  <rect x="108" y="32" width="24" height="6" rx="3" fill="#A0AEC0"/>
  
  <!-- Paper Document -->
  <rect x="80" y="48" width="80" height="144" rx="4" fill="#F7FAFC"/>
  
  <!-- Document Header Lines (Simulating news text/facts) -->
  <rect x="92" y="64" width="40" height="6" rx="3" fill="#CBD5E0"/>
  <rect x="92" y="76" width="56" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="92" y="84" width="48" height="4" rx="2" fill="#E2E8F0"/>
  
  <!-- Fact Checking Rows -->
  <g transform="translate(0, 8)">
    <!-- Row 1 -->
    <circle cx="98" cy="94" r="5" fill="#48BB78"/>
    <path d="M96 94l1.5 1.5 3-3" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="108" y="92" width="40" height="4" rx="2" fill="#CBD5E0"/>
    
    <!-- Row 2 -->
    <circle cx="98" cy="116" r="5" fill="#48BB78"/>
    <path d="M96 116l1.5 1.5 3-3" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="108" y="114" width="36" height="4" rx="2" fill="#CBD5E0"/>

    <!-- Row 3: Target/Verification Point -->
    <circle cx="98" cy="138" r="5" fill="#ED8936"/>
    <path d="M95 138l2 2 4-4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="108" y="136" width="44" height="4" rx="2" fill="#A0AEC0"/>
  </g>

  <!-- Official Authority Stamp (Red/Gold Seal of Authenticity) -->
  <g transform="translate(122, 140)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#E53E3E" stroke-width="2" stroke-dasharray="3 1"/>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#E53E3E" stroke-width="1"/>
    <!-- Checkmark inside stamp -->
    <path d="M14 20l4 4 8-8" fill="none" stroke="#E53E3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Magnifying Glass (Active Verification Tool - High Contrast Focus) -->
  <g transform="translate(100, 110)">
    <!-- Glass Drop Shadow -->
    <circle cx="44" cy="44" r="28" fill="#000000" opacity="0.3"/>
    
    <!-- Outer Rim -->
    <circle cx="42" cy="42" r="28" fill="#2B6CB0" stroke="#E2E8F0" stroke-width="3"/>
    <!-- Lens Reflection/Surface -->
    <circle cx="42" cy="42" r="23" fill="#63B3ED" opacity="0.25"/>
    <path d="M26 32a20 20 0 0 1 20-16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Handle -->
    <path d="M62 62L82 82C84 84 84 87 82 89L80 91C78 93 75 93 73 91L53 71Z" fill="#D69E2E" stroke="#B7791F" stroke-width="2" stroke-linejoin="round"/>
    <rect x="66" y="69" width="12" height="12" rx="2" transform="rotate(45 72 75)" fill="#ECC94B"/>
  </g>
</svg>