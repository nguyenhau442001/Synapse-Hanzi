<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Factory Building representing "实体经济" (Physical Economy) -->
  <g transform="translate(60, 80)">
    <!-- Main Building Body -->
    <rect x="10" y="40" width="100" height="60" fill="#3A404D" rx="4"/>
    
    <!-- Roof -->
    <path d="M5,40 L60,10 L115,40 Z" fill="#FFB347"/>
    
    <!-- Windows -->
    <rect x="20" y="50" width="15" height="15" fill="#1A1D24"/>
    <rect x="45" y="50" width="15" height="15" fill="#1A1D24"/>
    <rect x="70" y="50" width="15" height="15" fill="#1A1D24"/>
    <rect x="20" y="75" width="15" height="15" fill="#1A1D24"/>
    <rect x="45" y="75" width="15" height="15" fill="#1A1D24"/>
    <rect x="70" y="75" width="15" height="15" fill="#1A1D24"/>
    
    <!-- Chimney -->
    <rect x="85" y="15" width="15" height="25" fill="#FFB347"/>
    <rect x="88" y="5" width="9" height="10" fill="#5D6575"/>
  </g>
  
  <!-- Gear representing Industry/Economic Activity -->
  <circle cx="180" cy="180" r="30" fill="none" stroke="#FFB347" stroke-width="8" stroke-dasharray="10 10"/>
  <circle cx="180" cy="180" r="15" fill="#FFB347"/>
  
  <!-- Ground Line -->
  <rect x="30" y="190" width="180" height="4" fill="#5D6575" rx="2"/>
</svg>