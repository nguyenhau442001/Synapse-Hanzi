<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Left character: The Original/Model -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="-40" r="15" fill="#FFC107"/>
    <path d="M-20 0 L20 0 L15 50 L-15 50 Z" fill="#FFC107"/>
    <path d="M-10 20 L-25 40" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 20 L25 40" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Right character: The Imitator -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="-40" r="15" fill="#4FC3F7"/>
    <path d="M-20 0 L20 0 L15 50 L-15 50 Z" fill="#4FC3F7"/>
    <path d="M-10 20 L-25 40" stroke="#4FC3F7" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 20 L25 40" stroke="#4FC3F7" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Motion/Imitation Lines -->
  <path d="M90 80 Q120 50 150 80" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.6"/>
  <path d="M90 100 Q120 70 150 100" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.6"/>
  
  <!-- Directional arrow -->
  <path d="M100 140 L140 140 L135 135 M140 140 L135 145" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>