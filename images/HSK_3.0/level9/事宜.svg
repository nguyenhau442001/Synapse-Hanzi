<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(30, 40)">
    <!-- Desk / Table surface -->
    <path d="M 15 130 L 165 130 L 180 150 L 0 150 Z" fill="#2D3340" />
    <rect x="25" y="150" width="12" height="30" fill="#1E232D" rx="3"/>
    <rect x="143" y="150" width="12" height="30" fill="#1E232D" rx="3"/>
    
    <!-- Document / Folder representing "Matters / Affairs" (事宜) -->
    <g transform="translate(60, 95) rotate(-8)">
      <rect x="0" y="0" width="60" height="45" rx="4" fill="#3E4756" />
      <rect x="5" y="-6" width="22" height="8" rx="2" fill="#525E75" />
      <rect x="10" y="12" width="28" height="4" rx="2" fill="#8896AB" />
      <rect x="10" y="22" width="40" height="4" rx="2" fill="#8896AB" />
      <rect x="10" y="32" width="20" height="4" rx="2" fill="#8896AB" />
    </g>

    <g transform="translate(85, 80) rotate(5)">
      <rect x="0" y="0" width="60" height="45" rx="4" fill="#E6EDF5" />
      <rect x="5" y="-6" width="22" height="8" rx="2" fill="#B0C4DE" />
      <line x1="12" y1="14" x2="35" y2="14" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="24" x2="48" y2="24" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="34" x2="26" y2="34" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
      <!-- Checkmark accent (representing negotiated/settled matters) -->
      <circle cx="46" cy="34" r="8" fill="#F59E0B"/>
      <path d="M 42 34 L 45 37 L 51 31" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Person Left (Representing Party A in negotiation) -->
    <g transform="translate(10, 40)">
      <!-- Body / Suit -->
      <path d="M 15 100 C 15 80, 25 70, 45 70 C 65 70, 75 80, 75 100 Z" fill="#2E4A62" />
      <path d="M 35 70 L 45 90 L 55 70 Z" fill="#E6EDF5" />
      <polygon points="41,80 49,80 45,92" fill="#E53E3E" />
      
      <!-- Head & Hair -->
      <circle cx="45" cy="45" r="18" fill="#E0AC69" />
      <path d="M 28 45 C 28 30, 35 25, 45 25 C 55 25, 62 30, 62 45 C 60 42, 55 38, 45 38 C 35 38, 30 42, 28 45 Z" fill="#2D3748" />

      <!-- Arm gesturing / negotiating -->
      <path d="M 60 85 Q 75 80, 80 95" fill="none" stroke="#2E4A62" stroke-width="12" stroke-linecap="round" />
      <circle cx="82" cy="98" r="6" fill="#E0AC69" />
    </g>

    <!-- Person Right (Representing Party B in negotiation) -->
    <g transform="translate(95, 40)">
      <!-- Body / Suit -->
      <path d="M 15 100 C 15 80, 25 70, 45 70 C 65 70, 75 80, 75 100 Z" fill="#3B3B54" />
      <path d="M 35 70 L 45 90 L 55 70 Z" fill="#E6EDF5" />
      <polygon points="41,80 49,80 45,92" fill="#3182CE" />
      
      <!-- Head & Hair -->
      <circle cx="45" cy="45" r="18" fill="#F3C5A8" />
      <path d="M 28 42 C 30 30, 38 27, 47 27 C 58 27, 62 35, 62 45 C 55 42, 40 40, 28 42 Z" fill="#4A3525" />

      <!-- Arm gesturing / negotiating -->
      <path d="M 30 85 Q 15 80, 10 95" fill="none" stroke="#3B3B54" stroke-width="12" stroke-linecap="round" />
      <circle cx="8" cy="98" r="6" fill="#F3C5A8" />
    </g>

    <!-- Glowing focal indicator for mutual agreement / affairs discussion -->
    <circle cx="90" cy="55" r="3" fill="#F59E0B" />
    <circle cx="90" cy="55" r="8" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>