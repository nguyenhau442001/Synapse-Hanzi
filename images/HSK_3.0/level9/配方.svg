    <path d="M70 70 L170 70 C175.5 70 180 74.5 180 80 L180 170 C180 175.5 175.5 180 170 180 L70 180 C64.5 180 60 175.5 60 170 L60 80 C60 74.5 64.5 70 70 70 Z" fill="#2C3240" stroke="#3E4556" stroke-width="2"/>
    
    <!-- Paper sheet on top -->
