<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The "Entity" (Factory/Business) -->
  <g transform="translate(100, 100)">
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#FFB84D"/>
    <rect x="-12" y="-12" width="8" height="8" fill="#1A1D24"/>
    <rect x="4" y="-12" width="8" height="8" fill="#1A1D24"/>
    <rect x="-12" y="4" width="24" height="8" fill="#1A1D24"/>
  </g>

  <!-- The "Vortex" (The Price War/Complex Situation) -->
  <path d="M120 120 C 180 120, 200 60, 120 60 C 40 60, 60 180, 120 180 C 180 180, 160 120, 120 120" 
        fill="none" stroke="#5D6D7E" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Swirling motion lines indicating being pulled in -->
  <path d="M160 80 L 140 100" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 160 L 100 140" stroke="#FFB84D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Outer spiral elements -->
  <path d="M200 120 A 80 80 0 0 0 120 40" fill="none" stroke="#34495E" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 120 A 80 80 0 0 0 120 200" fill="none" stroke="#34495E" stroke-width="6" stroke-linecap="round"/>
</svg>