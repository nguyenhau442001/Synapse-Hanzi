<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stove base -->
  <rect x="60" y="160" width="120" height="20" rx="4" fill="#4A5568"/>
  <rect x="80" y="180" width="80" height="10" rx="2" fill="#2D3748"/>
  
  <!-- Pan -->
  <path d="M70 150 L170 150 L160 120 L80 120 Z" fill="#718096"/>
  <rect x="165" y="125" width="25" height="5" rx="2" fill="#4A5568"/>
  
  <!-- Fire -->
  <path d="M120 160 C 135 150, 140 130, 120 110 C 100 130, 105 150, 120 160" fill="#F6AD55"/>
  
  <!-- Smoke -->
  <path d="M120 110 C 100 80, 140 70, 130 40 C 160 60, 180 50, 190 30" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M120 110 C 110 70, 80 80, 70 50 C 50 70, 30 60, 20 40" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- Person reacting -->
  <circle cx="120" cy="80" r="25" fill="#CBD5E0"/>
  <path d="M105 85 L115 85 M125 85 L135 85" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 95 C 115 90, 125 90, 130 95" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Hand covering nose -->
  <path d="M100 90 L80 80 L70 95 L90 105 Z" fill="#CBD5E0"/>
  <rect x="70" y="95" width="20" height="5" rx="2" fill="#A0AEC0"/>
</svg>