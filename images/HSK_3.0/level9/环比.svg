<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow representing a chart structure -->
  <path d="M40 180 L200 180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 60 L40 190" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- First Period Bar (Previous Month) -->
  <g>
    <rect x="70" y="110" width="35" height="70" rx="6" fill="#3A4256"/>
    <!-- Internal detail to show structure -->
    <rect x="78" y="125" width="19" height="8" rx="2" fill="#4E5873"/>
    <rect x="78" y="141" width="19" height="8" rx="2" fill="#4E5873"/>
  </g>

  <!-- Second Period Bar (Current Month - slightly higher, showing sequential growth "环比") -->
  <g>
    <rect x="135" y="85" width="35" height="95" rx="6" fill="#F59E0B"/>
    <!-- Internal detail to show structure -->
    <rect x="143" y="100" width="19" height="8" rx="2" fill="#FBBF24"/>
    <rect x="143" y="116" width="19" height="8" rx="2" fill="#FBBF24"/>
    <rect x="143" y="132" width="19" height="8" rx="2" fill="#FBBF24"/>
  </g>

  <!-- Connecting Sequential Growth Arrow (Curved cycle/comparison arrow indicating month-to-month link) -->
  <path d="M 87 95 C 105 70, 135 70, 152 75" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <!-- Arrowhead pointing to the current period -->
  <path d="M 142 68 L 155 74 L 145 84" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small positive trend indicator badge floating above -->
  <circle cx="190" cy="70" r="18" fill="#064E3B"/>
  <path d="M182 74 L190 64 L198 74" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 64 L190 80" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
</svg>