<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Elderly person sitting in a chair -->
  <g transform="translate(70, 100)">
    <path d="M20 80h60v10H20z" fill="#4A5568"/>
    <path d="M30 40c0-15 10-25 25-25s25 10 25 25v30H30V40z" fill="#E2E8F0"/>
    <circle cx="55" cy="30" r="15" fill="#E2E8F0"/>
    <path d="M45 25h5M60 25h5" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Younger person offering a warm bowl of food with a respectful slight bow -->
  <g transform="translate(130, 80)">
    <path d="M40 100c-5-20 0-40 10-50l10 5" fill="none" stroke="#F6AD55" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 50c0-10 10-20 20-20s20 10 20 20v10H50V50z" fill="#F6AD55"/>
    <circle cx="70" cy="40" r="12" fill="#F6AD55"/>
    
    <!-- The bowl being offered -->
    <path d="M20 60h25v10a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10V60z" fill="#D69E2E"/>
    <path d="M22 60h21" stroke="#FBD38D" stroke-width="2"/>
  </g>

  <!-- Decorative floor element -->
  <path d="M20 190h200v5H20z" fill="#2D3748"/>
</svg>