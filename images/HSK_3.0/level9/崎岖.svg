<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle grid background -->
  <path d="M40 180 L200 180" stroke="#2A2F3A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40 200 L200 200" stroke="#2A2F3A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Conceptual illustration for 崎岖 (rugged, bumpy, treacherous mountain terrain) -->
  
  <!-- Mountain silhouette background -->
  <polygon points="30,180 90,110 150,180" fill="#242933"/>
  <polygon points="110,180 170,95 220,180" fill="#20252F"/>

  <!-- Rugged terrain / winding, jagged mountain road -->
  <!-- Path layers creating depth -->
  <path d="M30 180 C 45 170, 60 165, 80 165 C 100 165, 110 145, 130 140 C 150 135, 165 155, 185 150 C 205 145, 215 130, 225 125" 
        fill="none" stroke="#1A1D24" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Main road surface with rugged rocky texture -->
  <path d="M30 180 C 45 170, 60 165, 80 165 C 100 165, 110 145, 130 140 C 150 135, 165 155, 185 150 C 205 145, 215 130, 225 125" 
        fill="none" stroke="#3E4451" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Jagged rock obstacles / bumps along the road -->
  <!-- Rock 1 -->
  <polygon points="75,172 82,162 89,173" fill="#5C6370"/>
  <polygon points="80,166 85,160 88,168" fill="#848D97"/>

  <!-- Rock 2 -->
  <polygon points="122,148 130,135 139,147" fill="#5C6370"/>
  <polygon points="127,140 133,133 136,143" fill="#848D97"/>

  <!-- Rock 3 -->
  <polygon points="178,157 185,145 194,158" fill="#5C6370"/>

  <!-- The Off-road Vehicle (越野车) navigating the rugged path (as referenced in context) -->
  <g transform="translate(112, 115) rotate(-18)">
    <!-- Suspension / Underbody shadow -->
    <ellipse cx="0" cy="12" rx="14" ry="4" fill="#111318"/>

    <!-- Vehicle Body - Modern Flat Design -->
    <!-- Main orange/gold high-contrast accent body -->
    <path d="M -16,4 L -12,-4 L -4,-8 L 8,-8 L 14,-2 L 16,6 L -16,6 Z" fill="#E5C07B"/>
    <path d="M -12,-4 L -4,-8 L 6,-8 L 12,-2 L 12,3 L -12,3 Z" fill="#F4D69A"/>

    <!-- Cabin / Roof -->
    <path d="M -6,-8 L -2,-13 L 6,-13 L 9,-8 Z" fill="#ABB2BF"/>
    <!-- Windows -->
    <path d="M -5,-9 L -2,-12 L 3,-12 L 5,-9 Z" fill="#1A1D24"/>

    <!-- Wheels (Sturdy off-road tires) -->
    <circle cx="-10" cy="6" r="5" fill="#282C34"/>
    <circle cx="-10" cy="6" r="2" fill="#5C6370"/>
    
    <circle cx="9" cy="6" r="5" fill="#282C34"/>
    <circle cx="9" cy="6" r="2" fill="#5C6370"/>

    <!-- Headlights / Details -->
    <rect x="13" y="1" width="3" height="2" rx="1" fill="#61AFEF"/>
    <rect x="-17" y="2" width="2" height="2" rx="0.5" fill="#E06C75"/>
  </g>

  <!-- Sharp mountain peaks in the distance for dramatic height/steepness (险峻) -->
  <path d="M 175,95 L 190,65 L 205,95" fill="none" stroke="#2C313C" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 90,110 L 105,75 L 120,110" fill="none" stroke="#2C313C" stroke-width="2" stroke-linejoin="round"/>
</svg>