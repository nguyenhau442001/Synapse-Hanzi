<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Base podium / foundation representing cultural heritage/depth -->
    <path d="M-60 55 L60 55 L45 75 L-45 75 Z" fill="#2A303C"/>
    <rect x="-50" y="45" width="100" height="12" rx="3" fill="#3A4252"/>
    
    <!-- Traditional Chinese architectural element (Roof/Eaves representing profound tradition) -->
    <path d="M-55 25 Q0 10 55 25 L65 35 Q0 20 -65 35 Z" fill="#D4AF37"/>
    <path d="M-40 35 Q0 25 40 35 L45 42 Q0 32 -45 42 Z" fill="#B38F27"/>

    <!-- Flowing ribbon / scroll translating intangible cultural influence (Soft Power) -->
    <!-- Elegantly curving gold and vibrant cyan wave loops intertwining -->
    <path d="M-70 5 Q -20 -35, 0 -5 C 20 25, 60 -15, 75 0" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round"/>
    <path d="M-65 15 Q -15 -25, 5 5 C 25 35, 65 -5, 80 10" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.8" stroke-linecap="round"/>
    
    <!-- Central upright brush/quill blending heritage with modern influence -->
    <rect x="-6" y="-35" width="12" height="70" rx="4" fill="#F1F5F9"/>
    <!-- Brush tip -->
    <path d="M-6 35 C-6 50 0 65 0 65 C0 65 6 50 6 35 Z" fill="#D4AF37"/>
    <!-- Collar -->
    <rect x="-7" y="33" width="14" height="6" rx="2" fill="#38BDF8"/>

    <!-- Subtle radiating accent nodes (global cultural reach/attraction) -->
    <circle cx="-50" cy="-10" r="3" fill="#38BDF8"/>
    <circle cx="55" cy="-25" r="4" fill="#D4AF37"/>
    <circle cx="35" cy="-45" r="2.5" fill="#38BDF8"/>
    <circle cx="-30" cy="-55" r="3.5" fill="#D4AF37"/>
  </g>
  
  <!-- Subtle accent dots/stars in background for sleek modern dark mode UI card feel -->
  <circle cx="40" cy="50" r="1" fill="#475569"/>
  <circle cx="200" cy="70" r="1.5" fill="#475569"/>
  <circle cx="180" cy="190" r="1" fill="#475569"/>
  <circle cx="60" cy="185" r="1.5" fill="#475569"/>
</svg>