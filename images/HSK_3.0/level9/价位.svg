<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 116)">
    <!-- Smartphone representing the contextual object ("这款新型智能手机") -->
    <rect x="-36" y="-70" width="72" height="136" rx="12" fill="#2D333B" stroke="#484F58" stroke-width="2"/>
    <!-- Screen -->
    <rect x="-30" y="-56" width="60" height="110" rx="6" fill="#0D1117"/>
    <!-- Screen interface elements: Sleek flat representation of "性能卓越" (performance graph/elements) -->
    <rect x="-20" y="-42" width="40" height="6" rx="3" fill="#388BFd"/>
    <path d="M-20 -24 L-8 -12 L0 -20 L16 -4 L20 -8" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="-8" r="3" fill="#3FB950"/>
    
    <!-- Camera notch / speaker -->
    <rect x="-10" y="-64" width="20" height="3" rx="1.5" fill="#484F58"/>

    <!-- Price Tag floating dynamically, embodying "价位" (tier/range of price) -->
    <!-- Tag Body -->
    <path d="M 12 12 L 68 -44 C 71.3 -47.3 76.7 -47.3 80 -44 L 88 -36 C 91.3 -32.7 91.3 -27.3 88 -24 L 32 32 Z" fill="#F0883E"/>
    <!-- Tag Hole -->
    <circle cx="56" cy="-20" r="4" fill="#1A1D24"/>
    
    <!-- Distinctive price indicator marks on the tag (abstract currency/tier lines, avoiding text/numbers) -->
    <rect x="42" y="-3" width="20" height="4" rx="2" fill="#1A1D24" opacity="0.8"/>
    <rect x="52" y="7" width="20" height="4" rx="2" fill="#1A1D24" opacity="0.8"/>

    <!-- Golden accent star/sparkle representing "合理" / premium value tier -->
    <path d="M -60 -36 L -55 -46 L -50 -36 L -40 -31 L -50 -26 L -55 -16 L -60 -26 L -70 -31 Z" fill="#D29922"/>
  </g>
</svg>