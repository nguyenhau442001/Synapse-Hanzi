<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central grouping representing "things of this kind" -->
  <!-- Refrigerator icon -->
  <rect x="50" y="80" width="35" height="80" rx="4" fill="#FFB347"/>
  <rect x="55" y="85" width="25" height="30" rx="2" fill="#1A1D24"/>
  <rect x="55" y="120" width="25" height="35" rx="2" fill="#1A1D24"/>
  
  <!-- Washing machine icon -->
  <rect x="100" y="100" width="40" height="60" rx="4" fill="#FFB347"/>
  <circle cx="120" cy="125" r="15" fill="#1A1D24"/>
  <rect x="105" y="145" width="30" height="5" rx="1" fill="#1A1D24"/>
  
  <!-- Air conditioner icon -->
  <rect x="155" y="90" width="50" height="20" rx="2" fill="#FFB347"/>
  <rect x="158" y="95" width="44" height="10" rx="1" fill="#1A1D24"/>
  
  <!-- Ellipsis-like visual representation of "and so on" -->
  <circle cx="120" cy="190" r="4" fill="#5D6D7E"/>
  <circle cx="135" cy="190" r="4" fill="#5D6D7E"/>
  <circle cx="150" cy="190" r="4" fill="#5D6D7E"/>
</svg>