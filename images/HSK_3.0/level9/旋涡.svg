<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Atmospheric deep water background glow -->
    <circle r="96" fill="#1E293B" opacity="0.6"/>

    <!-- Outer swirling rapids and turbulent water layers -->
    <!-- Layer 1: Deep dark current backdrop -->
    <path d="M-90,-20 C-90,-60 -50,-90 0,-90 C50,-90 90,-50 90,0 C90,50 50,90 0,90 C-40,90 -75,60 -85,20" 
          fill="none" stroke="#2563EB" stroke-width="12" stroke-linecap="round" opacity="0.3"/>

    <!-- Layer 2: Raging canyon walls / converging current streams -->
    <path d="M-80,-40 C-80,-70 -40,-80 0,-80 C40,-80 80,-40 80,0 C80,40 40,80 0,80 C-30,80 -65,50 -70,10" 
          fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

    <!-- Layer 3: Main powerful vortex spiral arms -->
    <path d="M-70, -20 C-70, -50 -35, -65 0, -65 C35, -65 65, -35 65, 0 C65, 35 35, 65 0, 65 C-25, 65 -50, 40 -55, 0" 
          fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>

    <path d="M-55, 10 C-55, -30 -25, -45 0, -45 C25, -45 45, -25 45, 0 C45, 25 25, 45 0, 45 C-15, 45 -35, 25 -35, 0" 
          fill="none" stroke="#93C5FD" stroke-width="6" stroke-linecap="round"/>

    <path d="M-30, 0 C-30, -18 -15, -25 0, -25 C15, -25 25, -15 25, 0 C25, 15 15, 25 0, 25 C-10, 25 -20, 15 -20, 0" 
          fill="none" stroke="#BFDBFE" stroke-width="4" stroke-linecap="round"/>

    <!-- Center abyss / deep vortex eye -->
    <circle r="12" fill="#0F172A"/>
    <circle r="6" fill="#020617"/>

    <!-- Raging white water foam / dynamic splashes highlighting the danger -->
    <!-- Foam accent 1 -->
    <path d="M -50,-50 Q -40,-60 -30,-50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-35" cy="-55" r="2" fill="#FFFFFF" opacity="0.9"/>

    <!-- Foam accent 2 -->
    <path d="M 40,-40 Q 55,-30 45,-20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="50" cy="-28" r="2.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Foam accent 3 -->
    <path d="M 35,40 Q 25,55 10,45" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="20" cy="50" r="2" fill="#FFFFFF" opacity="0.9"/>

    <!-- Foam accent 4 -->
    <path d="M -40,35 Q -55,20 -40,10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-48" cy="22" r="2.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- High-contrast focus element (amber/gold droplet caught in the vortex rim to guide the eye) -->
    <circle cx="52" cy="25" r="4" fill="#F59E0B"/>
    <circle cx="51" cy="24" r="1.5" fill="#FDE68A"/>

    <!-- Additional dynamic current swooshes -->
    <path d="M-75, 45 C-90, 10 -80,-30 -60,-60" fill="none" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
    <path d="M60, 60 C80, 30 75,-20 45,-55" fill="none" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>