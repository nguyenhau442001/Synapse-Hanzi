<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background grid hints for medical posture reference -->
    <line x1="120" y1="40" x2="120" y2="200" stroke="#2A313C" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="70" y1="80" x2="170" y2="80" stroke="#2A313C" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="70" y1="160" x2="170" y2="160" stroke="#2A313C" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Spine correction apparatus / Orthopedic Spinal Brace & Vertebrae Object -->
    <!-- Support structure / Outer brace -->
    <path d="M 95 65 Q 110 60 120 75 Q 130 60 145 65 L 145 175 Q 130 180 120 165 Q 110 180 95 175 Z" fill="#2E384D" stroke="#4A5A75" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Spine column - straightening effect (top to bottom vertebrae) -->
    <!-- Upper aligned vertebrae -->
    <rect x="114" y="68" width="12" height="10" rx="3" fill="#64748B"/>
    <rect x="113" y="82" width="14" height="11" rx="3" fill="#64748B"/>
    
    <!-- Center deviation section being actively corrected by medical calipers/brackets -->
    <rect x="112" y="97" width="16" height="12" rx="3" fill="#38BDF8"/>
    <rect x="110" y="112" width="20" height="13" rx="3" fill="#38BDF8"/>
    <rect x="112" y="128" width="16" height="12" rx="3" fill="#38BDF8"/>
    
    <!-- Lower aligned vertebrae -->
    <rect x="113" y="143" width="14" height="11" rx="3" fill="#64748B"/>
    <rect x="114" y="157" width="12" height="10" rx="3" fill="#64748B"/>

    <!-- Mechanical correction arms / Orthopedic calibration calipers -->
    <!-- Left adjuster arm -->
    <path d="M 75 110 L 104 116 L 104 124 L 75 118 Z" fill="#F59E0B"/>
    <circle cx="75" cy="114" r="5" fill="#D97706"/>
    
    <!-- Right adjuster arm -->
    <path d="M 165 110 L 136 116 L 136 124 L 165 118 Z" fill="#F59E0B"/>
    <circle cx="165" cy="114" r="5" fill="#D97706"/>

    <!-- Correction directional arrows (Action: straightening / bending back into place) -->
    <!-- Left inward force arrow -->
    <path d="M 85 92 L 102 102 L 85 112 Z" fill="#F59E0B" opacity="0.9"/>
    <!-- Right inward force arrow -->
    <path d="M 155 92 L 138 102 L 155 112 Z" fill="#F59E0B" opacity="0.9"/>

    <!-- Vertical alignment indicator glow at top -->
    <circle cx="120" cy="52" r="4" fill="#38BDF8"/>
    <path d="M 120 44 L 120 36" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 116 40 L 120 36 L 124 40" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Base stand -->
    <rect x="100" y="185" width="40" height="6" rx="3" fill="#64748B"/>
  </g>
</svg>