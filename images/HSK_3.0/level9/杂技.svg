<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Stage spotlights effect -->
    <path d="M-60 -75 L-90 85 L-50 85 Z" fill="#FFC107" opacity="0.08"/>
    <path d="M60 -75 L50 85 L90 85 Z" fill="#00E5FF" opacity="0.08"/>
    
    <!-- Juggling pins (clubs) -->
    <!-- Pin 1 (Left, falling) -->
    <g transform="translate(-55, -20) rotate(-35)">
      <path d="M-6,-25 C-12,-25 -12,-10 -6,10 C-4,18 -3,28 -3,38 L3,38 C3,28 4,18 6,10 C12,-10 12,-25 6,-25 Z" fill="#FF5722"/>
      <ellipse cx="0" cy="-25" rx="6" ry="3" fill="#FF8A65"/>
      <rect x="-3" y="10" width="6" height="28" fill="#E64A19"/>
    </g>

    <!-- Pin 2 (Right, rising) -->
    <g transform="translate(45, -35) rotate(25)">
      <path d="M-6,-25 C-12,-25 -12,-10 -6,10 C-4,18 -3,28 -3,38 L3,38 C3,28 4,18 6,10 C12,-10 12,-25 6,-25 Z" fill="#00E5FF"/>
      <ellipse cx="0" cy="-25" rx="6" ry="3" fill="#84FFFF"/>
      <rect x="-3" y="10" width="6" height="28" fill="#00B8D4"/>
    </g>

    <!-- Pin 3 (Top center, apex) -->
    <g transform="translate(0, -65) rotate(0)">
      <path d="M-6,-25 C-12,-25 -12,-10 -6,10 C-4,18 -3,28 -3,38 L3,38 C3,28 4,18 6,10 C12,-10 12,-25 6,-25 Z" fill="#FFC107"/>
      <ellipse cx="0" cy="-25" rx="6" ry="3" fill="#FFE082"/>
      <rect x="-3" y="10" width="6" height="28" fill="#FFA000"/>
    </g>

    <!-- Acrobat Character -->
    <!-- Balance/Leap Torso & Head -->
    <g transform="translate(0, 15)">
      <!-- Motion lines / flow -->
      <path d="M-40,40 C-20,10 20,10 40,40" fill="none" stroke="#2C313C" stroke-width="4" stroke-linecap="round"/>

      <!-- Legs in split/jump -->
      <path d="M0,10 L-35,35 L-45,25" fill="none" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0,10 L35,25 L45,15" fill="none" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Body / Leotard -->
      <path d="M-12,-15 C-15,0 -10,15 0,15 C10,15 15,0 12,-15 Z" fill="#9C27B0"/>
      <path d="M-12,-15 L12,-15 L8,-30 L-8,-30 Z" fill="#BA68C8"/>

      <!-- Arms extended dynamically -->
      <path d="M-8,-25 L-35,-15 L-45,-25" fill="none" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8,-25 L35,-5 L45,-12" fill="none" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Head -->
      <circle cx="0" cy="-42" r="9" fill="#FFCCBC"/>
      <!-- Hair/Accs -->
      <path d="M-9,-45 C-5,-52 5,-52 9,-45" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Balancing Plate / Extra Acrobatics Prop -->
    <g transform="translate(0, -25)">
      <ellipse cx="0" cy="0" rx="18" ry="4" fill="none" stroke="#E0E0E0" stroke-width="2"/>
    </g>
  </g>
</svg>