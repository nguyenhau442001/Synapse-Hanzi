<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Football Pitch Ground -->
  <path d="M40 180 L200 180 L180 220 L60 220 Z" fill="#2C333D"/>
  
  <!-- Football -->
  <circle cx="120" cy="190" r="12" fill="#FFFFFF"/>
  <path d="M120 178 A 12 12 0 0 1 132 190 A 12 12 0 0 1 120 202 A 12 12 0 0 1 108 190 A 12 12 0 0 1 120 178" fill="#1A1D24"/>
  
  <!-- Coach Figure (Upper Body) -->
  <g transform="translate(120, 100)">
    <!-- Shoulders/Body -->
    <path d="M-40 60 L40 60 L30 10 L-30 10 Z" fill="#FFB800"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#E0E0E0"/>
    <!-- Tactical Board -->
    <rect x="-15" y="15" width="30" height="40" rx="2" fill="#FFFFFF"/>
    <circle cx="-5" cy="25" r="3" fill="#FF3D00"/>
    <circle cx="5" cy="35" r="3" fill="#1A1D24"/>
    <line x1="-5" y1="25" x2="5" y2="35" stroke="#1A1D24" stroke-width="2"/>
  </g>
  
  <!-- Tactical Arrow indicating second half momentum -->
  <path d="M160 100 L200 60 L180 60 L200 40 L200 60 L200 80" stroke="#FFB800" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>