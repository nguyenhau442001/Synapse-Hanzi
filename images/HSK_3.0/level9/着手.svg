<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Surface -->
  <rect x="40" y="160" width="160" height="10" rx="2" fill="#2D343E"/>
  
  <!-- Document/Project Paper -->
  <rect x="70" y="100" width="100" height="60" rx="4" fill="#E0E6ED"/>
  <rect x="80" y="115" width="80" height="6" rx="2" fill="#B0B8C4"/>
  <rect x="80" y="130" width="60" height="6" rx="2" fill="#B0B8C4"/>
  
  <!-- Hand Action (The "Action" of starting) -->
  <g fill="#FFB454">
    <!-- Arm -->
    <path d="M180 180 L180 140 C180 130 170 120 160 120 L140 120" stroke="#FFB454" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hand -->
    <path d="M140 120 L130 110 L125 115 L135 125 Z" fill="#FFB454"/>
    <circle cx="132" cy="112" r="4" fill="#FFB454"/>
  </g>
  
  <!-- Motion Lines indicating the start of the action -->
  <path d="M120 100 L110 90" stroke="#FFB454" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 105 L105 95" stroke="#FFB454" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pen/Tool -->
  <rect x="120" y="110" width="20" height="4" rx="1" fill="#F8F9FA" transform="rotate(-30 130 112)"/>
  <path d="M115 118 L125 112" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
</svg>