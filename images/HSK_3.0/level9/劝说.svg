<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to focus on the interaction -->
  <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Character 1 (Family Member / Speaker - Left) -->
  <g transform="translate(65, 120)">
    <!-- Body / Torso -->
    <path d="M-15 45 C-15 30 -5 20 0 20 C5 20 15 30 15 45 L20 70 L-20 70 Z" fill="#3B82F6"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="14" fill="#FBBF24"/>
    <!-- Hair -->
    <path d="M-12 -6 C-12 -12 -6 -15 0 -15 C6 -15 12 -12 12 -6 C8 -10 -8 -10 -12 -6 Z" fill="#4B5563"/>
    <!-- Gesturing Arm (Persuading / Explaining) -->
    <path d="M10 25 C20 25 28 35 32 42" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Open palm hand gesture -->
    <circle cx="34" cy="44" r="4" fill="#FBBF24"/>
  </g>

  <!-- Character 2 (Elderly Person / Listener - Right) -->
  <g transform="translate(175, 120)">
    <!-- Body / Torso -->
    <path d="M-15 45 C-15 30 -5 20 0 20 C5 20 15 30 15 45 L22 70 L-22 70 Z" fill="#10B981"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="14" fill="#FBBF24"/>
    <!-- Hair (Elderly - receding / grey sides) -->
    <path d="M-10 -8 C-10 -13 -5 -14 0 -14 C5 -14 10 -13 10 -8" stroke="#9CA3AF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Listening Posture / Receptive Arm -->
    <path d="M-10 30 C-18 35 -20 40 -15 45" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Hand on chin/chest showing contemplation and yielding -->
    <circle cx="-14" cy="46" r="4" fill="#FBBF24"/>
  </g>

  <!-- Communication / Persuasion Visual Cues (Flowing gentle dialogue elements, no text) -->
  <g transform="translate(120, 95)" fill="none" stroke-linecap="round">
    <!-- Gentle speech / advice flowing from left to right -->
    <path d="M-25 -5 C-15 -15 0 5 10 -10 C15 -17 25 -17 30 -10" stroke="#60A5FA" stroke-width="3" opacity="0.8"/>
    <!-- Small subtle pulse indicators of patient communication -->
    <circle cx="-10" cy="-10" r="2" fill="#60A5FA"/>
    <circle cx="5" cy="-12" r="3" fill="#60A5FA"/>
    <circle cx="20" cy="-8" r="2" fill="#60A5FA"/>
  </g>

  <!-- Focus / Accent Highlights (Gold/Orange for semantic emphasis) -->
  <circle cx="120" cy="115" r="2" fill="#F59E0B" opacity="0.9"/>
  <path d="M115 135 Q120 128 125 135" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

</svg>