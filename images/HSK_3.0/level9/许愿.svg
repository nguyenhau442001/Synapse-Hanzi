<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Starry Sky Background -->
  <circle cx="180" cy="50" r="1.5" fill="#F8F9FA" opacity="0.6"/>
  <circle cx="200" cy="80" r="2" fill="#F8F9FA" opacity="0.8"/>
  <circle cx="150" cy="30" r="1" fill="#F8F9FA" opacity="0.5"/>
  <circle cx="220" cy="40" r="1.2" fill="#F8F9FA" opacity="0.7"/>
  
  <!-- Birthday Cake -->
  <rect x="80" y="180" width="80" height="30" rx="4" fill="#E67E22"/>
  <rect x="85" y="170" width="70" height="10" rx="2" fill="#D35400"/>
  
  <!-- Candle -->
  <rect x="117" y="155" width="6" height="15" fill="#F1C40F"/>
  <path d="M120 150 C 125 145, 125 140, 120 135 C 115 140, 115 145, 120 150" fill="#F39C12"/>
  
  <!-- Motion lines for blowing -->
  <path d="M105 145 L 90 140 M 105 150 L 85 150 M 105 155 L 90 160" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Girl Character -->
  <g transform="translate(120, 180)">
    <!-- Shoulders/Torso -->
    <path d="M-40 40 Q 0 20 40 40 L 30 60 L -30 60 Z" fill="#34495E"/>
    <!-- Face -->
    <circle cx="0" cy="-10" r="25" fill="#FAD7A0"/>
    <!-- Closed Eyes -->
    <path d="M-15 -15 L -5 -15 M 5 -15 L 15 -15" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M-10 0 Q 0 8 10 0" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M-25 -10 Q -30 -30 0 -35 Q 30 -30 25 -10 L 25 10 L -25 10 Z" fill="#2C3E50"/>
  </g>
  
  <!-- Hands clasped in prayer -->
  <g transform="translate(120, 130)">
    <path d="M-10 0 L 0 -15 L 10 0" fill="#FAD7A0" stroke="#E59866" stroke-width="1"/>
    <path d="M-8 0 L 0 -12 L 8 0" fill="#FAD7A0" stroke="#E59866" stroke-width="1"/>
  </g>
</svg>