<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="130" r="70" fill="#222732" opacity="0.8"/>

  <!-- Calendar / Timeline Base (Representing the "Present Moment") -->
  <g transform="translate(60, 45)">
    <!-- Calendar Body -->
    <rect x="0" y="20" width="120" height="130" rx="12" fill="#282E3D"/>
    <!-- Calendar Header -->
    <path d="M 0 32 A 12 12 0 0 1 12 20 L 108 20 A 12 12 0 0 1 120 32 L 120 50 L 0 50 Z" fill="#3B82F6"/>
    <!-- Binding Rings -->
    <rect x="32" y="10" width="8" height="16" rx="4" fill="#64748B"/>
    <rect x="80" y="10" width="8" height="16" rx="4" fill="#64748B"/>
    
    <!-- Grid Days / Abstract Calendar Content -->
    <rect x="18" y="68" width="20" height="16" rx="4" fill="#363C4E"/>
    <rect x="50" y="68" width="20" height="16" rx="4" fill="#363C4E"/>
    <rect x="82" y="68" width="20" height="16" rx="4" fill="#363C4E"/>

    <rect x="18" y="96" width="20" height="16" rx="4" fill="#363C4E"/>
    <!-- Highlighted "Present" Day -->
    <rect x="50" y="96" width="20" height="16" rx="4" fill="#F59E0B"/>
    <rect x="82" y="96" width="20" height="16" rx="4" fill="#363C4E"/>
  </g>

  <!-- Precise Target / Focus Element (Highlighting "Right Here, Right Now") -->
  <g transform="translate(120, 141)">
    <!-- Outer Focus Ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
    <!-- Center Indicator -->
    <circle cx="0" cy="0" r="14" fill="#F59E0B"/>
    <!-- Inner Core Dot -->
    <circle cx="0" cy="0" r="6" fill="#1A1D24"/>
  </g>

  <!-- Ground Shadow/Platform -->
  <ellipse cx="120" cy="195" rx="50" ry="8" fill="#111318"/>
</svg>