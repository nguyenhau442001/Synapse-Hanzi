<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Path split / Divergence concept representing "歪门邪道" (deviant/crooked path) -->
    <!-- Background subtle grid/path markers -->
    <path d="M120 40 L120 200" stroke="#2A2F3D" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- Straight, righteous path (faded/background reference) -->
    <path d="M120 200 L120 70" stroke="#3A4255" stroke-width="8" stroke-linecap="round" />
    
    <!-- The Crooked/Deviant Path (Tà đạo) branching off sharply into darkness/danger -->
    <path d="M120 140 Q120 100 160 85 T190 55" fill="none" stroke="#EF4444" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Warning glow/hazard aura around the deviant path -->
    <path d="M120 140 Q120 100 160 85 T190 55" fill="none" stroke="#FEE2E2" stroke-width="2" stroke-dasharray="3 6" opacity="0.6" />

    <!-- Fork in the road (Ground markers) -->
    <circle cx="120" cy="140" r="6" fill="#4B5563" />

    <!-- Tempting illusory golden lure / shortcut trap (暴利诱惑) -->
    <g transform="translate(190, 42)">
      <!-- Golden coin / treasure item representing illegal shortcut -->
      <circle cx="0" cy="0" r="16" fill="#F59E0B" />
      <circle cx="0" cy="0" r="12" fill="#FBBF24" />
      <text x="0" y="5" font-size="14" font-weight="bold" fill="#78350F" text-anchor="middle">$</text>
      <!-- Sparkle/trap glint -->
      <path d="M0 -20 L3 -13 L10 -10 L3 -7 L0 0 L-3 -7 L-10 -10 L-3 -13 Z" fill="#FEF3C7" />
    </g>

    <!-- The central figurative human figure facing the temptation / taking the crooked turn -->
    <g transform="translate(120, 140)">
      <!-- Body leaning towards the red crooked path -->
      <path d="M0 25 L8 0 L25 -15" fill="none" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Head turning toward the golden lure -->
      <circle cx="28" cy="-22" r="9" fill="#CBD5E1" />
      <!-- Shadow/Silhouette effect highlighting deviation from the upright stance -->
      <path d="M-4 35 L0 25 L8 0" fill="none" stroke="#64748B" stroke-width="12" stroke-linecap="round" />
      <circle cx="0" cy="42" r="7" fill="#64748B" />
    </g>

    <!-- Warning / Prohibition indicator subtly framing the crooked vector -->
    <g transform="translate(165, 105)">
      <circle cx="0" cy="0" r="12" fill="#1A1D24" stroke="#EF4444" stroke-width="3" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>