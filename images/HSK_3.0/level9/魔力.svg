<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Definitions for Gradients and Glows -->
  <defs>
    <!-- Background aura for magic -->
    <radialGradient id="magicAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#7B2CBF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Music note gradient (Gold/Orange focus) -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>

    <!-- Magic wand handle gradient -->
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EA8DE"/>
      <stop offset="100%" stop-color="#560BAD"/>
    </linearGradient>
  </defs>

  <!-- Ambient Magic Aura Background -->
  <circle cx="120" cy="120" r="90" fill="url(#magicAura)"/>

  <!-- Floating Magic Sparkles / Particles -->
  <g fill="#FFD166" opacity="0.8">
    <path d="M70,75 L73,83 L81,86 L73,89 L70,97 L67,89 L59,86 L67,83 Z" transform="scale(0.6) translate(40, 20)"/>
    <path d="M170,145 L172,150 L177,152 L172,154 L170,159 L168,154 L163,152 L168,150 Z" transform="scale(0.8) translate(35, 10)"/>
    <path d="M150,60 L152,65 L157,67 L152,69 L150,74 L148,69 L143,67 L148,65 Z" transform="scale(0.7) translate(20, 20)"/>
    <circle cx="85" cy="150" r="2.5" fill="#4EA8DE" opacity="0.9"/>
    <circle cx="155" cy="90" r="2" fill="#FFD166" opacity="0.9"/>
    <circle cx="95" cy="70" r="1.5" fill="#7209B7"/>
    <circle cx="140" cy="165" r="2" fill="#4EA8DE"/>
  </g>

  <!-- Magical Swirls / Aura Lines -->
  <path d="M 70 140 C 70 110, 100 85, 130 90 C 150 93, 165 110, 160 135" fill="none" stroke="#FFB800" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M 85 160 C 95 120, 130 100, 155 115" fill="none" stroke="#4EA8DE" stroke-width="1.5" opacity="0.4"/>

  <!-- Central Physical Object: Musical Note infused with Magic Waves (Ma lực) -->
  <g transform="translate(0, 5)">
    <!-- Outer radiating sound/magic waves -->
    <path d="M 90 75 C 80 90, 80 130, 95 145" fill="none" stroke="#FF9F1C" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 150 75 C 160 90, 160 130, 145 145" fill="none" stroke="#FF9F1C" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    
    <path d="M 75 60 C 60 85, 60 135, 80 160" fill="none" stroke="#FFD166" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 165 60 C 180 85, 180 135, 160 160" fill="none" stroke="#FFD166" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Double-beamed Musical Notes (The Core Physical Object) -->
    <!-- Note 1 (Left) -->
    <ellipse cx="98" cy="148" rx="14" ry="10" fill="url(#noteGrad)" transform="rotate(-20 98 148)"/>
    <rect x="108" y="98" width="5" height="53" rx="2.5" fill="url(#noteGrad)"/>
    
    <!-- Note 2 (Right) -->
    <ellipse cx="142" cy="138" rx="14" ry="10" fill="url(#noteGrad)" transform="rotate(-20 142 138)"/>
    <rect x="152" y="88" width="5" height="53" rx="2.5" fill="url(#noteGrad)"/>
    
    <!-- Beam connecting the notes -->
    <path d="M 110 98 L 157 88 L 157 101 L 110 111 Z" fill="url(#noteGrad)"/>

    <!-- Magical Starburst emerging from the music -->
    <g transform="translate(120, 60)">
      <path d="M0,-18 C2,-8 8,-2 18,0 C8,2 2,8 0,18 C-2,8 -8,2 -18,0 C-8,-2 -2,-8 0,-18 Z" fill="#FFF" opacity="0.9"/>
    </g>
  </g>

  <!-- Interactive/Magical Orbiting Elements -->
  <!-- Wand crossing diagonally for clear "magic" context -->
  <g transform="translate(120, 120) rotate(-45)">
    <rect x="-70" y="-3" width="110" height="6" rx="3" fill="url(#wandGrad)"/>
    <circle cx="-70" cy="0" r="5" fill="#FFD166"/>
    <!-- Wand Tip Glow -->
    <circle cx="40" cy="0" r="8" fill="#FFF" opacity="0.9"/>
    <circle cx="40" cy="0" r="14" fill="#FFB800" opacity="0.4"/>
  </g>

</svg>