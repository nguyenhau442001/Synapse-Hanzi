<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sky/Heaven representation (Upper half) -->
  <path d="M40 120 C 40 60, 200 60, 200 120" fill="none" stroke="#FFB84D" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="180" cy="70" r="12" fill="#FFB84D"/>
  
  <!-- Earth/Ground representation (Lower half) -->
  <path d="M40 120 L 200 120 L 180 180 L 60 180 Z" fill="#3B82F6"/>
  <path d="M60 180 L 180 180 L 190 200 L 50 200 Z" fill="#2563EB"/>
  
  <!-- Central figure: A person standing on the ground, reaching towards the sky -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="-20" r="10" fill="#FFFFFF"/>
    <path d="M0 -10 L 0 10 M0 0 L -15 -10 M0 0 L 15 -10 M0 10 L -10 30 M0 10 L 10 30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>