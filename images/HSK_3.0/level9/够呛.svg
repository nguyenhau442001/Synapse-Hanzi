<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk surface -->
  <path d="M 30 180 L 210 180 L 210 190 L 30 190 Z" fill="#2D333B" rx="2"/>
  <rect x="70" y="190" width="10" height="30" fill="#22262E"/>
  <rect x="160" y="190" width="10" height="30" fill="#22262E"/>

  <!-- Glowing Monitor (Working late concept) -->
  <rect x="50" y="70" width="140" height="90" rx="6" fill="#2D333B"/>
  <rect x="56" y="76" width="128" height="78" rx="4" fill="#0D1117"/>
  <!-- Code/Chart lines on screen -->
  <rect x="66" y="90" width="45" height="6" rx="3" fill="#388BFd" opacity="0.6"/>
  <rect x="66" y="104" width="80" height="5" rx="2.5" fill="#30363D"/>
  <rect x="66" y="116" width="60" height="5" rx="2.5" fill="#30363D"/>
  <rect x="66" y="128" width="70" height="5" rx="2.5" fill="#30363D"/>
  <!-- Monitor Stand -->
  <path d="M 110 160 L 130 160 L 135 180 L 105 180 Z" fill="#3A424D"/>

  <!-- Coffee Mug -->
  <rect x="165" y="152" width="16" height="22" rx="3" fill="#F0883E"/>
  <path d="M 181 157 C 187 157 187 169 181 169" stroke="#F0883E" stroke-width="2.5" fill="none"/>
  <!-- Steam lines (exhaustion) -->
  <path d="M 170 144 C 173 140 170 136 173 132" stroke="#8B949E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Exhausted Character slumped over -->
  <!-- Head & Hair (Facing down onto arms) -->
  <circle cx="120" cy="115" r="22" fill="#E6EDF3"/>
  <path d="M 98 115 C 98 100 110 93 125 93 C 140 93 144 105 144 115 Z" fill="#D29922"/>
  
  <!-- Slumped Body / Back -->
  <path d="M 100 130 C 110 120 135 120 145 135 C 155 150 140 175 120 175 C 95 175 90 145 100 130 Z" fill="#F85149"/>
  
  <!-- Arms resting on desk, head buried -->
  <path d="M 105 135 C 115 135 130 135 140 135 C 145 135 148 145 138 148 C 125 152 110 152 102 148 C 98 145 100 135 105 135 Z" fill="#E6EDF3"/>

  <!-- Visual contrast/stress indicator: Heavy weight / Alert state represented with sharp angles & high contrast accent -->
  <path d="M 112 70 L 128 50 L 120 70 L 134 56" stroke="#F85149" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 100 75 L 92 60" stroke="#F85149" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 140 75 L 148 60" stroke="#F85149" stroke-width="2.5" stroke-linecap="round" fill="none"/>

</svg>