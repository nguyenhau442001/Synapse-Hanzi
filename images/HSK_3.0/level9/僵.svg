<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Falling snow background effect -->
  <circle cx="45" cy="50" r="1.5" fill="#4A5568" opacity="0.6"/>
  <circle cx="85" cy="30" r="2" fill="#4A5568" opacity="0.4"/>
  <circle cx="195" cy="65" r="1.5" fill="#4A5568" opacity="0.5"/>
  <circle cx="210" cy="130" r="2" fill="#4A5568" opacity="0.3"/>
  <circle cx="35" cy="150" r="2" fill="#4A5568" opacity="0.5"/>
  <circle cx="160" cy="40" r="1" fill="#4A5568" opacity="0.7"/>

  <!-- Frost/Ice Ground Layer -->
  <path d="M 30 195 L 210 195 L 215 205 L 25 205 Z" fill="#2C3544"/>
  <path d="M 40 195 L 60 185 L 80 195 L 120 187 L 160 195 L 190 188 L 205 195 Z" fill="#E2E8F0" opacity="0.8"/>

  <!-- Visual Contrast: Normal/Warm Fluidity vs Rigid/Frozen Stiff (Adjective representation) -->
  <!-- On the left: Subtle indicator of previous normal state (faded orange energy/fluid lines) -->
  <path d="M 60 110 C 60 95, 80 95, 80 110" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 70 100 C 70 90, 85 90, 85 100" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Central Character/Subject: Rigid, straight, locked posture (僵 - Stiff/Frozen) -->
  <!-- Body/Torso in winter coat -->
  <path d="M 105 110 L 135 110 L 142 175 L 98 175 Z" fill="#3B82F6"/>
  <!-- Head -->
  <circle cx="120" cy="85" r="16" fill="#CBD5E1"/>
  <!-- Hood/Hat -->
  <path d="M 102 85 C 102 70, 138 70, 138 85 C 138 90, 142 95, 142 95 L 98 95 C 98 95, 102 90, 102 85 Z" fill="#1E3A8A"/>

  <!-- Rigid, completely straight locked arms (Key visual for "僵" - frozen stiff, unable to bend) -->
  <!-- Left arm (straight down, locked) -->
  <rect x="91" y="112" width="12" height="55" rx="6" fill="#2563EB" transform="rotate(5 97 112)"/>
  <!-- Right arm (straight down, locked) -->
  <rect x="137" y="112" width="12" height="55" rx="6" fill="#2563EB" transform="rotate(-5 143 112)"/>

  <!-- Frozen Hands / Mittens -->
  <circle cx="94" cy="170" r="7" fill="#60A5FA"/>
  <circle cx="146" cy="170" r="7" fill="#60A5FA"/>

  <!-- Legs - rigidly locked straight -->
  <rect x="106" y="172" width="11" height="26" rx="4" fill="#1E3A8A"/>
  <rect x="123" y="172" width="11" height="26" rx="4" fill="#1E3A8A"/>

  <!-- Frost/Ice Crystals overlaying the joints and extremities to emphasize "彻底发僵" (completely frozen stiff) -->
  <!-- Ice crystals on hands -->
  <path d="M 94 163 L 94 177 M 87 170 L 101 170" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  <path d="M 146 163 L 146 177 M 139 170 L 153 170" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>

  <!-- Ice accumulation on shoulders -->
  <path d="M 100 110 L 105 103 L 110 110" fill="#E2E8F0"/>
  <path d="M 130 110 L 135 103 L 140 110" fill="#E2E8F0"/>

  <!-- Stiff/Rigid indicator lines (Sharp angular brackets emphasizing locked movement) -->
  <path d="M 83 125 L 89 125 L 89 155 L 83 155" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 157 125 L 151 125 L 151 155 L 157 155" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Focus / Accent: Frost crystal floating beside emphasizing extreme cold state -->
  <g transform="translate(180, 90)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="8" x2="8" y2="-8" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#F59E0B"/>
  </g>
  
  <g transform="translate(60, 70)">
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="5" x2="5" y2="-5" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>