    <rect x="45" y="60" width="10" height="30" rx="2" fill="#1A1D24"/>
    
    <!-- Hand holding the tool -->
    <path d="M35 70 C 35 60, 55 60, 55 70 L 55 85 C 55 95, 35 95, 35 85 Z" fill="#FFD8A8"/>
