    <rect x="0" y="100" width="120" height="10" rx="2" fill="#343A46"/>
    <rect x="10" y="110" width="100" height="10" fill="#2C313C"/>
    
    <!-- Precision Tool (The "Skill/Specialty") -->
    <path d="M60 20 L85 45 L80 50 L55 25 Z" fill="#FFB86C"/>
    <path d="M40 40 L65 65 L60 70 L35 45 Z" fill="#FFB86C"/>
