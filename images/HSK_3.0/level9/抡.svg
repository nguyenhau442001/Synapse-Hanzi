<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow filters for fire and motion -->
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="motionGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background decorative elements (ambient workshop glow) -->
  <circle cx="150" cy="170" r="45" fill="#E85D04" opacity="0.12"/>
  <circle cx="120" cy="120" r="90" fill="#2D323E" opacity="0.3"/>

  <!-- MOTION ARC: Visualizing the powerful full swing ("抡圆了") -->
  <path d="M 60 70 A 90 90 0 1 1 200 130" fill="none" stroke="#FFA726" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M 50 100 A 85 85 0 0 1 185 75" fill="none" stroke="#FF7043" stroke-width="6" stroke-linecap="round" opacity="0.8" filter="url(#motionGlow)"/>

  <!-- Anvil & Red-hot Iron Piece -->
  <!-- Anvil Base -->
  <path d="M 125 185 L 145 185 L 140 160 L 165 150 L 115 150 L 130 160 Z" fill="#4B5563"/>
  <rect x="110" y="185" width="40" height="12" rx="3" fill="#374151"/>
  <path d="M 100 145 L 180 145 L 175 150 L 105 150 Z" fill="#6B7280"/>
  
  <!-- Red-hot Iron Anvil Top Block -->
  <path d="M 120 142 H 160 V 150 H 120 Z" fill="#9CA3AF"/>
  
  <!-- Glowing Hot Iron Piece being struck -->
  <path d="M 130 138 Q 140 132 150 138 Q 145 144 130 138 Z" fill="#FFF" filter="url(#fireGlow)"/>
  <path d="M 126 140 H 154 V 145 H 126 Z" fill="#FF4500" filter="url(#fireGlow)"/>
  <ellipse cx="140" cy="142.5" rx="14" ry="3.5" fill="#FFD54F" filter="url(#fireGlow)"/>
  <!-- Sparks -->
  <circle cx="120" cy="130" r="2.5" fill="#FFA726"/>
  <circle cx="162" cy="125" r="2" fill="#FF7043"/>
  <circle cx="155" cy="115" r="1.5" fill="#FFD54F"/>
  <circle cx="132" cy="120" r="2" fill="#FFD54F"/>
  <path d="M 145 130 L 148 122" stroke="#FF7043" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 135 132 L 131 125" stroke="#FFA726" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Blacksmith Character (Upper body, powerful pose executing "抡") -->
  <!-- Back/Shoulder muscles (Vigorous pose) -->
  <path d="M 75 110 C 75 90 95 80 115 90 C 130 98 135 125 125 150 L 80 150 Z" fill="#D97706"/>
  
  <!-- Head & Determined Face Profile -->
  <circle cx="72" cy="92" r="14" fill="#FBBF24"/>
  <!-- Arm muscles straining (two strong arms gripping the sledgehammer) -->
  <path d="M 85 95 C 70 100 60 115 65 125 C 70 132 85 130 95 115 Z" fill="#F59E0B"/>
  <path d="M 90 98 C 80 108 78 120 88 128 C 98 134 110 120 100 105 Z" fill="#D97706"/>

  <!-- Sledgehammer (The heavy iron hammer swinging in a dynamic arc) -->
  <g transform="rotate(-35 120 85)">
    <!-- Wooden Handle -->
    <rect x="105" y="45" width="10" height="90" rx="3" fill="#9A3412"/>
    <!-- Iron Hammer Head (Massive) -->
    <path d="M 90 32 H 135 C 138 32 140 35 140 42 C 140 49 138 52 135 52 H 90 C 87 52 85 49 85 42 C 85 35 87 32 90 32 Z" fill="#374151" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="92" y="36" width="41" height="12" rx="2" fill="#4B5563"/>
    <path d="M 90 37 H 96 V 47 H 90 Z" fill="#6B7280" opacity="0.6"/>
  </g>

</svg>