<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: A secure physical bank vault door / barrier representing an upper limit/maximum ceiling -->
  <!-- Outer vault frame -->
  <circle cx="120" cy="120" r="80" fill="#252A34" stroke="#3A4252" stroke-width="4"/>
  
  <!-- Vault wheel/locking mechanism -->
  <circle cx="120" cy="120" r="54" fill="#1E232D" stroke="#E5A93B" stroke-width="3"/>

  <!-- Vault handle spokes -->
  <line x1="120" y1="66" x2="120" y2="174" stroke="#E5A93B" stroke-width="4" stroke-linecap="round"/>
  <line x1="66" y1="120" x2="174" y2="120" stroke="#E5A93B" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="82" x2="158" y2="158" stroke="#E5A93B" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="158" x2="158" y2="82" stroke="#E5A93B" stroke-width="4" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="120" cy="120" r="18" fill="#E5A93B"/>
  <circle cx="120" cy="120" r="10" fill="#1E232D"/>

  <!-- Upper Limit indicator: Bold ceiling bar with upward arrow representing maximum boundary -->
  <path d="M 70 32 L 170 32" stroke="#FF5757" stroke-width="6" stroke-linecap="round"/>
  <path d="M 120 18 L 120 46 M 106 32 L 120 18 L 134 32" fill="none" stroke="#FF5757" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>