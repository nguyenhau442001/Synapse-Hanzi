<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle transition line -->
  <path d="M0 120 L240 120" stroke="#2D343E" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Left side: Military/Industrial origin (Abstracted mechanical gear/tech) -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="0" r="35" fill="#3D4A5D"/>
    <path d="M-20 -20 L20 -20 L20 20 L-20 20 Z" fill="#5D6D7E"/>
    <path d="M-10 -10 L10 -10 L10 10 L-10 10 Z" fill="#1A1D24"/>
  </g>
  
  <!-- Arrow indicating transition -->
  <path d="M100 120 L140 120 M130 110 L140 120 L130 130" stroke="#FFB347" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Right side: Civil/Public use (A modern, sleek home appliance/laptop) -->
  <g transform="translate(180, 120)">
    <rect x="-35" y="-25" width="70" height="45" rx="4" fill="#FFB347"/>
    <rect x="-30" y="-20" width="60" height="35" rx="2" fill="#1A1D24"/>
    <rect x="-35" y="20" width="70" height="5" rx="2" fill="#FFB347"/>
    <rect x="-10" y="25" width="20" height="10" rx="1" fill="#3D4A5D"/>
  </g>
</svg>