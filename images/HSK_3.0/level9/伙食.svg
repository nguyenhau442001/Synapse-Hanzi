<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambience for the meal setup -->
  <circle cx="120" cy="130" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Tray background -->
  <rect x="52" y="70" width="136" height="116" rx="20" fill="#2C3240" stroke="#3A4254" stroke-width="2"/>

  <!-- Compartments on the tray representing nutritional variety -->
  <!-- Rice/Carb compartment (Top Left) -->
  <rect x="64" y="82" width="52" height="42" rx="10" fill="#222731"/>
  <ellipse cx="90" cy="103" rx="18" ry="12" fill="#E2E8F0"/>
  <!-- Rice grains details -->
  <circle cx="85" cy="100" r="1.5" fill="#CBD5E1"/>
  <circle cx="95" cy="104" r="1.5" fill="#CBD5E1"/>
  <circle cx="90" cy="108" r="1.5" fill="#CBD5E1"/>

  <!-- Vegetables compartment (Top Right) -->
  <rect x="124" y="82" width="52" height="42" rx="10" fill="#222731"/>
  <!-- Broccoli / Greens -->
  <circle cx="140" cy="100" r="8" fill="#10B981"/>
  <circle cx="152" cy="96" r="9" fill="#059669"/>
  <circle cx="148" cy="110" r="8" fill="#10B981"/>
  <path d="M140 108 L140 114 M150 105 L150 112" stroke="#047857" stroke-width="3" stroke-linecap="round"/>

  <!-- Main dish/Protein compartment (Bottom) -->
  <rect x="64" y="132" width="112" height="42" rx="10" fill="#222731"/>
  <!-- Grilled fish / Meat fillet with warm accent -->
  <path d="M80 153 Q120 140 160 153 Q130 166 80 153 Z" fill="#F59E0B"/>
  <path d="M95 149 Q120 143 145 149" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Carrot slices garnish -->
  <circle cx="100" cy="160" r="5" fill="#EF4444"/>
  <circle cx="135" cy="157" r="4" fill="#EF4444"/>

  <!-- Chopsticks placed neatly across the top -->
  <rect x="70" y="48" width="100" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="74" y="55" width="92" height="4" rx="2" fill="#CBD5E1"/>

  <!-- Steam wisps representing freshly prepared hot food -->
  <path d="M100 36 C95 28 105 22 100 14" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M120 38 C115 30 125 24 120 16" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M140 36 C135 28 145 22 140 14" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>