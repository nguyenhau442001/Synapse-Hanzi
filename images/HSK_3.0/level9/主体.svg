<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Architectural Blueprint / Grid Background Effect -->
  <g opacity="0.15">
    <line x1="30" y1="210" x2="210" y2="210" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="30" y1="30" x2="30" y2="210" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="210" y1="30" x2="210" y2="210" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Secondary/Surrounding Construction Elements (Faded context: scaffolding / auxiliary parts) -->
  <g opacity="0.4">
    <!-- Left scaffolding -->
    <line x1="50" y1="90" x2="50" y2="200" stroke="#64748B" stroke-width="2"/>
    <line x1="45" y1="120" x2="55" y2="120" stroke="#64748B" stroke-width="2"/>
    <line x1="45" y1="160" x2="55" y2="160" stroke="#64748B" stroke-width="2"/>
    
    <!-- Right scaffolding -->
    <line x1="190" y1="90" x2="190" y2="200" stroke="#64748B" stroke-width="2"/>
    <line x1="185" y1="120" x2="195" y2="120" stroke="#64748B" stroke-width="2"/>
    <line x1="185" y1="160" x2="195" y2="160" stroke="#64748B" stroke-width="2"/>
  </g>

  <!-- MAIN OBJECT: "主体" (The core main structure of a modern architectural building/stadium) -->
  <g>
    <!-- Building Foundation Base -->
    <rect x="65" y="195" width="110" height="12" rx="3" fill="#334155"/>
    <rect x="75" y="207" width="90" height="6" rx="2" fill="#475569"/>

    <!-- Main Core Structure Body -->
    <!-- Curved stadium/modern building silhouette -->
    <path d="M 75 195 L 85 95 C 85 85, 95 75, 120 75 C 145 75, 155 85, 155 95 L 165 195 Z" fill="#1E293B" stroke="#64748B" stroke-width="2"/>

    <!-- Highlighted Core Framework (Emphasizing 主体 - The core body/nucleus) -->
    <!-- Central vertical structural pillars -->
    <rect x="116" y="80" width="8" height="115" fill="#38BDF8"/>
    <rect x="96" y="105" width="6" height="90" fill="#0EA5E9"/>
    <rect x="138" y="105" width="6" height="90" fill="#0EA5E9"/>

    <!-- Horizontal floor slabs / core framework beams -->
    <rect x="81" y="115" width="78" height="6" rx="1" fill="#38BDF8"/>
    <rect x="85" y="145" width="70" height="6" rx="1" fill="#38BDF8"/>
    <rect x="89" y="175" width="62" height="6" rx="1" fill="#38BDF8"/>

    <!-- Glowing Accent for "Core/Main" (Orange/Gold focus) -->
    <circle cx="120" cy="118" r="4" fill="#F59E0B"/>
    <circle cx="120" cy="148" r="4" fill="#F59E0B"/>
    <circle cx="120" cy="178" r="4" fill="#F59E0B"/>

    <!-- Architectural Roof Canopy Curve (Main Body Element) -->
    <path d="M 70 95 Q 120 60 170 95 L 165 105 Q 120 72 75 105 Z" fill="#F59E0B"/>
  </g>

  <!-- Focus Indicator (Subtle professional brackets highlighting the core structure) -->
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Top Left Bracket -->
    <path d="M 62 75 L 55 75 L 55 85"/>
    <!-- Bottom Left Bracket -->
    <path d="M 62 205 L 55 205 L 55 195"/>
    <!-- Top Right Bracket -->
    <path d="M 178 75 L 185 75 L 185 85"/>
    <!-- Bottom Right Bracket -->
    <path d="M 178 205 L 185 205 L 185 195"/>
  </g>
</svg>