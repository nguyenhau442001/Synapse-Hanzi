<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background warmth -->
  <circle cx="120" cy="110" r="70" fill="#F59E0B" opacity="0.05"/>

  <!-- Main illustration representing "衷心" (from the bottom of the heart / deepest sincerity / heartfelt gesture):
       A professional, respectful human interaction embodying profound sincerity and warm wishes (matching "最衷心的节日祝福").
       Depicting two figures bowing/greeting with hands folded respectfully over the chest/heart region, radiating warm golden light/energy of sincerity. -->

  <!-- Left Figure (Greeter/Sender of sincere wishes) -->
  <g transform="translate(65, 130)">
    <!-- Body / Suit -->
    <path d="M-15 70 L-25 90 H25 L15 70 Z" fill="#2563EB"/>
    <!-- Head -->
    <circle cx="0" cy="35" r="14" fill="#CBD5E1"/>
    <!-- Torso -->
    <path d="M-15 45 H15 V70 H-15 Z" fill="#3B82F6"/>
    <!-- Bowing/Sincere Posture Arms crossed/placed over chest -->
    <path d="M-12 50 L0 58 L12 50" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Figure / Recipient of sincere wishes -->
  <g transform="translate(175, 130)">
    <!-- Body / Suit -->
    <path d="M-15 70 L-25 90 H25 L15 70 Z" fill="#0D9488"/>
    <!-- Head -->
    <circle cx="0" cy="35" r="14" fill="#CBD5E1"/>
    <!-- Torso -->
    <path d="M-15 45 H15 V70 H-15 Z" fill="#14B8A6"/>
    <!-- Gesturing respectfully back -->
    <path d="M-12 52 L0 58 L12 52" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Focal Point: The embodiment of "Deepest Sincerity" (From the core/center outwards) -->
  <g transform="translate(120, 105)">
    <!-- Sincerity / Warmth Rays radiating outward -->
    <path d="M 0 -35 L 0 -48" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M -25 -25 L -35 -35" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25 -25 L 35 -35" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Glowing warm core representing "从心底" (from the bottom of the heart) -->
    <circle cx="0" cy="-5" r="22" fill="#D97706" opacity="0.3"/>
    <circle cx="0" cy="-5" r="14" fill="#F59E0B"/>
    
    <!-- Stylized emblem of pure, genuine intent (A clean symmetrical spark/starburst signifying sincerity and authenticity, strictly avoiding generic cartoon heart shapes) -->
    <path d="M0 -22 C4 -12 12 -4 22 0 C12 4 4 12 0 22 C-4 12 -12 4 -22 0 C-12 -4 -4 -12 0 -22 Z" fill="#FEF3C7"/>
  </g>

  <!-- Ground shadow / base line -->
  <ellipse cx="120" cy="205" rx="70" ry="6" fill="#111827"/>
</svg>