<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Central Circular Rotation Track -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#2A303C" stroke-width="6" stroke-dasharray="8 6"/>
    
    <!-- Rotating Cycle Arrows -->
    <!-- Top Arrow -->
    <path d="M -20 -64 A 64 64 0 0 1 20 -64" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <polygon points="20,-58 28,-64 20,-70" fill="#F59E0B"/>
    
    <!-- Bottom Arrow -->
    <path d="M 20 64 A 64 64 0 0 1 -20 64" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <polygon points="-20,58 -28,64 -20,70" fill="#F59E0B"/>

    <!-- Left Character (Outgoing/Resting) -->
    <g transform="translate(-55, 0)">
      <!-- Base/Uniform body -->
      <path d="M-14 36 C-14 24 -6 20 0 20 C6 20 14 24 14 36 Z" fill="#3B82F6"/>
      <!-- Shoulders/Torso -->
      <rect x="-16" y="4" width="32" height="26" rx="6" fill="#1D4ED8"/>
      <!-- Collar -->
      <path d="M-6 4 L0 12 L6 4" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
      <!-- Head -->
      <circle cx="0" cy="-10" r="11" fill="#D1D5DB"/>
      <!-- Cap/Helmet -->
      <path d="M-12 -14 C-12 -20 12 -20 12 -14 C12 -12 -12 -12 -12 -14 Z" fill="#1E40AF"/>
      <path d="M-14 -14 L16 -14" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Shift-handover clipboard or gear representation -->
      <rect x="12" y="-2" width="10" height="14" rx="2" fill="#E5E7EB" transform="rotate(15)"/>
    </g>

    <!-- Right Character (Incoming/Active Duty) -->
    <g transform="translate(55, 0)">
      <!-- Base/Uniform body -->
      <path d="M-14 36 C-14 24 -6 20 0 20 C6 20 14 24 14 36 Z" fill="#10B981"/>
      <!-- Shoulders/Torso -->
      <rect x="-16" y="4" width="32" height="26" rx="6" fill="#047857"/>
      <!-- Collar -->
      <path d="M-6 4 L0 12 L6 4" fill="none" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
      <!-- Head -->
      <circle cx="0" cy="-10" r="11" fill="#D1D5DB"/>
      <!-- Cap/Helmet -->
      <path d="M-12 -14 C-12 -20 12 -20 12 -14 C12 -12 -12 -12 -12 -14 Z" fill="#065F46"/>
      <path d="M-14 -14 L16 -14" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Forward-facing alert posture / hand raised to salute/take over -->
      <path d="M8 -2 C14 -4 18 -10 16 -14" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Central Hub / Transition Indicator (Shield / Post Badge) -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="18" fill="#1A1D24" stroke="#F59E0B" stroke-width="3"/>
      <!-- Check/Exchange icon inside hub -->
      <path d="M-6 0 L-2 4 L7 -5" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Subtle top accent line -->
  <line x1="80" y1="24" x2="160" y2="24" stroke="#2A303C" stroke-width="2" stroke-linecap="round"/>
</svg>