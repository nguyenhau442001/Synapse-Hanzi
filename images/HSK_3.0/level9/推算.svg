<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration: Celestial Orbit Calculation (推算) -->
  <g transform="translate(0, 0)">
    <!-- Background grid / astrolabe rings for calculation theme -->
    <circle cx="120" cy="120" r="85" fill="none" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="120" cy="120" r="60" fill="none" stroke="#2A303C" stroke-width="1"/>
    
    <!-- Coordinate axes / projection lines -->
    <line x1="120" y1="25" x2="120" y2="215" stroke="#262D3D" stroke-width="1"/>
    <line x1="25" y1="120" x2="215" y2="120" stroke="#262D3D" stroke-width="1"/>

    <!-- Earth (Central physical object representing the anchor of the context) -->
    <circle cx="120" cy="120" r="28" fill="#1E293B"/>
    <!-- Earth continents abstraction -->
    <path d="M110 105 Q120 100 130 110 T125 135 T105 125 Z" fill="#38BDF8" opacity="0.8"/>
    <path d="M115 130 Q125 135 120 145 T110 140 Z" fill="#38BDF8" opacity="0.8"/>

    <!-- Orbital path (Dashed elliptical projection representing computation/prediction) -->
    <ellipse cx="120" cy="120" rx="88" ry="42" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-25 120 120)"/>

    <!-- Calculation nodes / mathematical coordinate points along the orbit -->
    <circle cx="50" cy="85" r="3" fill="#60A5FA"/>
    <line x1="50" y1="85" x2="62" y2="92" stroke="#60A5FA" stroke-width="1" stroke-dasharray="2 2"/>
    
    <circle cx="185" cy="140" r="3" fill="#60A5FA"/>
    <line x1="185" y1="140" x2="170" y2="132" stroke="#60A5FA" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Near-Earth Asteroid (Target object being computed) -->
    <g transform="translate(195, 82)">
      <!-- Motion trail -->
      <path d="M 12 -4 L 28 -12" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5"/>
      <!-- Asteroid body -->
      <path d="M-6 -4 L-2 -8 L5 -5 L8 3 L2 8 L-5 5 Z" fill="#94A3B8"/>
      <path d="M-2 -3 L2 -5 L4 1 L-1 3 Z" fill="#64748B"/>
      <!-- Trajectory marker/lock-on reticle -->
      <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    </g>

    <!-- Analytical Compass / Caliper instrument overlay representing "Tuīsuàn" (Calculation/Deduction) -->
    <g transform="translate(120, 120) rotate(35)">
      <!-- Caliper legs -->
      <line x1="0" y1="-75" x2="-35" y2="65" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-75" x2="35" y2="65" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
      <!-- Hinge / Pivot -->
      <circle cx="0" cy="-75" r="6" fill="#D97706"/>
      <circle cx="0" cy="-75" r="2.5" fill="#FEF3C7"/>
      <!-- Arc gauge -->
      <path d="M-15 -35 A 40 40 0 0 0 15 -35" fill="none" stroke="#FBBF24" stroke-width="2"/>
    </g>
  </g>
</svg>