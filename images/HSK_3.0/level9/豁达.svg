<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background horizon/mountain lines representing broad horizons (khoáng đạt) -->
  <path d="M 20 180 Q 90 140 160 170 T 220 160 L 220 220 L 20 220 Z" fill="#222733"/>
  <path d="M 0 195 Q 70 165 140 185 T 240 175 L 240 240 L 0 240 Z" fill="#1E232F"/>

  <!-- Glowing warm sun rising / broad open perspective -->
  <circle cx="180" cy="90" r="28" fill="#FFB74D" opacity="0.15"/>
  <circle cx="180" cy="90" r="20" fill="#FFB74D" opacity="0.3"/>
  <circle cx="180" cy="90" r="12" fill="#FFB74D"/>

  <!-- Character representing an open-minded, magnanimous person (cởi mở, độ lượng) -->
  <!-- Body/Torso -->
  <path d="M 95 190 C 95 160 105 140 120 140 C 135 140 145 160 145 190 Z" fill="#3A435E"/>
  
  <!-- Head -->
  <circle cx="120" cy="115" r="16" fill="#FFD54F"/>

  <!-- Open Arms / Welcoming & Untroubled Gesture (豁达 - unconstrained, broad-minded) -->
  <!-- Left arm outstretched openly -->
  <path d="M 110 150 C 90 150 70 130 55 125" stroke="#FFD54F" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Right arm outstretched openly -->
  <path d="M 130 150 C 150 150 170 130 185 125" stroke="#FFD54F" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Peaceful facial posture representation (implied calm upward gaze towards vast space) -->
  <path d="M 115 118 Q 120 123 125 118" stroke="#4A5568" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Floating abstract birds/wind lines representing freedom from trivial worries (不怨天尤人) -->
  <path d="M 60 70 Q 70 60 80 70 Q 90 60 100 70" stroke="#64B5F6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 135 55 Q 142 47 150 55 Q 158 47 165 55" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Accent glow under the person for grounding -->
  <ellipse cx="120" cy="195" rx="35" ry="6" fill="#0E1116"/>
</svg>