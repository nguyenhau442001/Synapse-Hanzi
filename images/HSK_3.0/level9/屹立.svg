<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric Background: Dark ocean, starry night sky, subtle wind/rain streaks -->
  <g opacity="0.3">
    <!-- Stars -->
    <circle cx="50" cy="40" r="1" fill="#FFFFFF"/>
    <circle cx="90" cy="30" r="1.5" fill="#FFFFFF"/>
    <circle cx="180" cy="50" r="1" fill="#FFFFFF"/>
    <circle cx="210" cy="70" r="1.2" fill="#FFFFFF"/>
    <!-- Wind/storm diagonal lines representing centuries of wind and rain -->
    <line x1="20" y1="80" x2="80" y2="110" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>
    <line x1="60" y1="60" x2="120" y2="90" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>
    <line x1="120" y1="70" x2="180" y2="100" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>
  </g>

  <!-- Ocean Waves (Dynamic, crashing against the cliff) -->
  <path d="M 0 190 Q 40 180 80 195 T 160 190 T 240 185 L 240 240 L 0 240 Z" fill="#0F172A"/>
  <path d="M 0 205 Q 50 195 100 210 T 200 205 T 240 200 L 240 240 L 0 240 Z" fill="#1E293B"/>
  <!-- Sea Foam -->
  <path d="M 60 195 C 75 190, 85 200, 100 195 C 115 190, 125 200, 140 197" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 150 190 C 165 185, 175 195, 190 190" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Cliff / Rocky Shore (Strong, stable foundation for 屹立) -->
  <path d="M 120 130 L 190 150 L 210 220 L 30 220 L 70 150 Z" fill="#334155"/>
  <path d="M 120 130 L 70 150 L 30 220 L 90 220 Z" fill="#475569"/>
  <path d="M 120 130 L 190 150 L 210 220 L 150 220 Z" fill="#1E293B"/>
  <!-- Cliff edge highlights -->
  <path d="M 120 130 L 70 150 L 90 220" fill="none" stroke="#64748B" stroke-width="1.5" opacity="0.5"/>

  <!-- Ancient Lighthouse (The iconic physical object representing 屹立) -->
  <!-- Lighthouse Base -->
  <polygon points="105,140 135,140 142,200 98,200" fill="#CBD5E1"/>
  <!-- Lighthouse Stripes (Classic red and white/dark red pattern for weathering) -->
  <polygon points="108,160 132,160 134,175 106,175" fill="#EF4444"/>
  <polygon points="102,190 138,190 140,205 100,205" fill="#EF4444"/>
  
  <!-- Lighthouse Body Shading (Left side shadow) -->
  <polygon points="105,140 120,140 123,200 98,200" fill="#94A3B8" opacity="0.4"/>

  <!-- Door & Windows -->
  <rect x="114" y="185" width="12" height="15" rx="6" fill="#1E293B"/>
  <rect x="116" y="155" width="8" height="10" fill="#1E293B"/>
  <rect x="116" y="170" width="8" height="10" fill="#1E293B"/>

  <!-- Lighthouse Balcony / Gallery -->
  <path d="M 99,138 L 141,138 L 138,143 L 102,143 Z" fill="#0F172A"/>

  <!-- Lighthouse Lantern Room (Glass) -->
  <rect x="108" y="122" width="24" height="16" fill="#F1F5F9" opacity="0.9"/>
  <line x1="120" y1="122" x2="120" y2="138" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Lighthouse Roof / Dome -->
  <path d="M 120 110 C 132 110, 137 122, 137 122 L 103 122 C 103 122, 108 110, 120 110 Z" fill="#EF4444"/>
  <circle cx="120" cy="109" r="2.5" fill="#FBBF24"/>

  <!-- Beacon Light / Focal Point (Golden accent representing enduring strength and illumination) -->
  <circle cx="120" cy="130" r="18" fill="#FBBF24" opacity="0.25"/>
  <path d="M 120 130 L 220 110 L 210 145 Z" fill="#FEF08A" opacity="0.2"/>
  <path d="M 120 130 L 20 110 L 30 145 Z" fill="#FEF08A" opacity="0.2"/>
  <circle cx="120" cy="130" r="5" fill="#FEF08A"/>

</svg>