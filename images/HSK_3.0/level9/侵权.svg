<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/backdrop for focal object -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Document / Intellectual Property (Copyright symbol base) -->
  <g transform="translate(70, 55)">
    <!-- Document background paper -->
    <rect x="0" y="0" width="100" height="125" rx="8" fill="#2A303C"/>
    <!-- Document folded top-right corner -->
    <path d="M72 0 L100 28 L100 28 L72 28 Z" fill="#1A1D24"/>
    <path d="M72 0 L100 28 L72 28 Z" fill="#3A4252"/>
    
    <!-- Abstract document content lines -->
    <rect x="18" y="24" width="40" height="6" rx="3" fill="#4E5D6C"/>
    <rect x="18" y="38" width="64" height="4" rx="2" fill="#3A4252"/>
    <rect x="18" y="48" width="50" height="4" rx="2" fill="#3A4252"/>

    <!-- Content image placeholder with a camera/art icon inside -->
    <rect x="18" y="62" width="64" height="42" rx="4" fill="#1F242D"/>
    <circle cx="50" cy="80" r="10" fill="#3A4252"/>
    <path d="M30 96 L42 82 L54 94 L68 80 L78 96 Z" fill="#3A4252"/>
  </g>

  <!-- Giant Red Unauthorized Stamp (Overlaying the document, indicating 侵权 / Infringement) -->
  <g transform="translate(120, 115) rotate(-15)">
    <!-- Outer stamp ring -->
    <rect x="-65" y="-32" width="130" height="64" rx="32" fill="none" stroke="#FF4D4F" stroke-width="6" opacity="0.9"/>
    
    <!-- Inner stamp decoration lines -->
    <line x1="-50" y1="-20" x2="-35" y2="-20" stroke="#FF4D4F" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="35" y1="20" x2="50" y2="20" stroke="#FF4D4F" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Unauthorized X symbol inside stamp -->
    <path d="M-18 -16 L18 16 M18 -16 L-18 16" stroke="#FF4D4F" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Digital data transmission waves / unauthorized network broadcast concept -->
  <g transform="translate(120, 26)" stroke="#FFA940" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M -15 6 Q 0 -2 15 6" />
    <path d="M -25 13 Q 0 1 25 13" />
  </g>
</svg>