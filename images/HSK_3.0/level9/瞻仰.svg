<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Monument Base -->
  <rect x="80" y="180" width="80" height="15" fill="#4A5568"/>
  <rect x="95" y="160" width="50" height="20" fill="#718096"/>
  
  <!-- Monument Pillar -->
  <rect x="105" y="80" width="30" height="80" fill="#A0AEC0"/>
  <polygon points="105,80 120,60 135,80" fill="#CBD5E0"/>
  
  <!-- Silhouette of person bowing -->
  <g transform="translate(60, 150)">
    <path d="M20,40 L35,40 L30,25 L25,25 Z" fill="#F6AD55"/>
    <circle cx="27.5" cy="20" r="8" fill="#F6AD55"/>
    <path d="M15,40 C15,40 10,50 20,55 L35,55 C45,50 40,40 40,40" fill="#F6AD55"/>
  </g>
  
  <!-- Another silhouette for scale -->
  <g transform="translate(160, 150)">
    <path d="M20,40 L35,40 L30,25 L25,25 Z" fill="#F6AD55"/>
    <circle cx="27.5" cy="20" r="8" fill="#F6AD55"/>
    <path d="M15,40 C15,40 10,50 20,55 L35,55 C45,50 40,40 40,40" fill="#F6AD55"/>
  </g>
  
  <!-- Decorative ground lines -->
  <line x1="40" y1="195" x2="200" y2="195" stroke="#2D3748" stroke-width="2"/>
</svg>