<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Tactical Board Object (Noun Representation of "战术" - Tactics) -->
  <g transform="translate(30, 45)">
    <!-- Board Outer Casing -->
    <rect x="0" y="0" width="180" height="130" rx="10" fill="#2D333B" stroke="#4F5D75" stroke-width="3"/>
    
    <!-- Playing Field Surface -->
    <rect x="12" y="12" width="156" height="106" rx="6" fill="#1B4D3E"/>
    
    <!-- Field Markings (Half-court tactical view) -->
    <!-- Center Line -->
    <line x1="90" y1="12" x2="90" y2="118" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Center Circle -->
    <circle cx="90" cy="65" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="90" cy="65" r="2" fill="#FFFFFF" fill-opacity="0.4"/>
    <!-- Penalty Area / Goal Box -->
    <rect x="12" y="38" width="30" height="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="138" y="38" width="30" height="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Tactical Movement Arrows & Paths -->
    <!-- Curved passing/running path -->
    <path d="M 50 65 Q 70 35 110 50" fill="none" stroke="#FFB703" stroke-width="3" stroke-dasharray="5,3" stroke-linecap="round"/>
    <polygon points="112,47 118,52 110,55" fill="#FFB703"/>

    <!-- Dashing attacking path -->
    <path d="M 110 50 Q 130 65 145 40" fill="none" stroke="#FF5400" stroke-width="3" stroke-linecap="round"/>
    <polygon points="148,37 149,44 142,42" fill="#FF5400"/>

    <!-- Tactical Player Tokens (Magnets) -->
    <!-- Defensive / Midfield Player 1 (Blue) -->
    <circle cx="50" cy="65" r="7" fill="#3A86EF" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Attacking Player 2 (Orange/Focus) -->
    <circle cx="110" cy="50" r="7" fill="#FF5400" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Striker / Target Player (Orange/Focus) -->
    <circle cx="145" cy="40" r="7" fill="#FF5400" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Supporting Teammate (Blue) -->
    <circle cx="75" cy="90" r="7" fill="#3A86EF" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Pass line to supporting player -->
    <line x1="50" y1="65" x2="75" y2="90" stroke="#3A86EF" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Opponent Marker (Red/Neutral) -->
    <circle cx="95" cy="55" r="7" fill="#E63946" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="130" cy="70" r="7" fill="#E63946" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Tactical Pen / Stylus Accent (Tool of Strategy) -->
  <g transform="translate(145, 175) rotate(-35)">
    <rect x="0" y="0" width="36" height="6" rx="3" fill="#FFB703"/>
    <polygon points="36,0 44,3 36,6" fill="#D4AF37"/>
    <rect x="4" y="1" width="10" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
</svg>