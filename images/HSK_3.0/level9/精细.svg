<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow for surgical environment -->
  <circle cx="120" cy="120" r="85" fill="#222733" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="50" fill="none" stroke="#2F3644" stroke-width="1"/>

  <!-- Surgical Microscope Objective & Light cone -->
  <path d="M95 40 L145 40 L165 75 L75 75 Z" fill="#2E384D"/>
  <rect x="90" y="75" width="60" height="15" rx="3" fill="#4B5E80"/>
  <!-- Focus light beam -->
  <polygon points="105,90 135,90 155,160 85,160" fill="#38BDF8" opacity="0.12"/>
  <polygon points="112,90 128,90 142,150 98,150" fill="#38BDF8" opacity="0.18"/>

  <!-- Surgical Instrument & Micro-suture details (Representing 精细 - meticulous precision) -->
  <!-- Delicate Tissue background -->
  <path d="M70 145 C 90 130, 150 130, 170 145 C 180 155, 170 175, 120 180 C 70 175, 60 155, 70 145 Z" fill="#2C2329" stroke="#E11D48" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Microscopic Blood Vessels & Nerves -->
  <!-- Vessel 1 (Blue/Red anatomy) -->
  <path d="M80 155 Q 110 140, 160 152" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
  <path d="M85 160 Q 115 145, 165 157" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ultra-fine surgical needle & thread -->
  <!-- Needle holder tip -->
  <path d="M150 90 L132 128 L138 131 L156 93 Z" fill="#94A3B8"/>
  <circle cx="135" cy="129" r="2.5" fill="#334155"/>
  
  <!-- Curved micro-needle -->
  <path d="M133 128 C 128 135, 118 138, 112 135" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Micro-suture thread (Golden thread for contrast and precision focus) -->
  <path d="M112 135 C 105 131, 102 120, 108 112 C 112 107, 120 108, 122 114" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="1.5 1"/>
  <!-- Second stitch loop -->
  <path d="M122 114 C 124 118, 120 125, 116 128" fill="none" stroke="#FBBF24" stroke-width="1.2"/>

  <!-- Magnifying Lens / Focus Ring overlay -->
  <circle cx="120" cy="135" r="42" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.9"/>
  <!-- Lens reflection highlight -->
  <path d="M92 115 A 42 42 0 0 1 130 95" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <circle cx="120" cy="135" r="44" fill="none" stroke="#0EA5E9" stroke-width="0.75" opacity="0.4"/>

  <!-- Precision crosshairs inside lens -->
  <line x1="120" y1="125" x2="120" y2="145" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
  <line x1="110" y1="135" x2="130" y2="135" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>

  <!-- Accent glow spots for modern tech UI feel -->
  <circle cx="75" cy="75" r="2" fill="#38BDF8"/>
  <circle cx="165" cy="75" r="2" fill="#38BDF8"/>
  <circle cx="65" cy="120" r="1.5" fill="#FBBF24"/>
  <circle cx="175" cy="120" r="1.5" fill="#FBBF24"/>
</svg>