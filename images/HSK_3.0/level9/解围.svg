<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background subtle elements (Academic presentation screen/podium outline) -->
    <path d="M50 160 L190 160 L170 195 L70 195 Z" fill="#262C38" opacity="0.6"/>
    <rect x="105" y="145" width="30" height="15" fill="#323B4D"/>
    
    <!-- Struggling Intern (Left character, trapped/embarrassed) -->
    <g transform="translate(70, 95)">
      <!-- Body -->
      <path d="M15 65 L35 65 L30 100 L5 100 Z" fill="#4B5563"/>
      <!-- Head -->
      <circle cx="20" cy="40" r="14" fill="#E5E7EB"/>
      <!-- Hair -->
      <path d="M8 35 C10 25, 30 25, 32 35 Z" fill="#9CA3AF"/>
      <!-- Sweat drop (embarrassment) -->
      <path d="M35 38 C35 38, 40 43, 40 46 C40 48, 38 50, 36 50 C34 50, 32 48, 32 46 C32 43, 35 38, 35 38 Z" fill="#38BDF8"/>
      <!-- Expression: nervous, looking down/trapped -->
      <line x1="15" y1="38" x2="19" y2="40" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <line x1="21" y1="40" x2="25" y2="38" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 48 C19 46, 21 46, 22 48" stroke="#1F2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Tangled barrier / confusion lines around intern -->
      <path d="M -5 30 Q 15 15, 35 30" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
      <path d="M -2 70 Q 10 50, -5 30" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3" opacity="0.8"/>
    </g>

    <!-- Mentor / Rescuer (Right character, stepping in, speaking/gesturing to rescue) -->
    <g transform="translate(140, 85)">
      <!-- Body -->
      <path d="M15 75 L40 75 L45 110 L10 110 Z" fill="#3B82F6"/>
      <!-- Head -->
      <circle cx="25" cy="45" r="15" fill="#F3F4F6"/>
      <!-- Hair -->
      <path d="M12 40 C14 28, 36 28, 38 40 Z" fill="#4B5563"/>
      <!-- Confident/Friendly Expression -->
      <circle cx="21" cy="43" r="1.5" fill="#1F2937"/>
      <circle cx="29" cy="43" r="1.5" fill="#1F2937"/>
      <path d="M22 51 C24 53, 26 53, 28 51" stroke="#1F2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Arm gesturing / speaking outward to deflect difficulty -->
      <path d="M15 70 C5 70, -15 55, -25 50" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="-25" cy="50" r="4" fill="#F3F4F6"/>
    </g>

    <!-- Central "Rescue" Effect: Breaking through the barrier / Shielding wave of support -->
    <g transform="translate(115, 110)">
      <!-- Golden/Orange accent beam cutting through -->
      <path d="M -30 10 L 20 -10" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <path d="M -20 30 L 30 5" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <!-- Glowing spark/star indicating brilliant verbal rescue -->
      <path d="M 0 -20 L 3 -12 L 10 -10 L 3 -8 L 0 0 L -3 -8 L -10 -10 L -3 -12 Z" fill="#FBBF24"/>
    </g>
  </g>
</svg>