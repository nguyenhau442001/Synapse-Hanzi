<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Definition Context: "刻意" (Deliberate, forced, calculated action / performing a contrived mask or artificial stance) -->
  <!-- We visualize a character putting on a meticulously calculated, artificial smiling mask over their true self, representing "刻意" (deliberately forcing an expression/behavior to please others) -->

  <!-- Background subtle design elements -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Character / Physical Object representing the concept -->
  <!-- Inner genuine/natural profile (subtle, dark slate silhouette) -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Body -->
    <path d="M 80 165 C 80 140 100 130 120 130 C 140 130 160 140 160 165 Z" fill="#2A3245"/>
    
    <!-- Natural Head silhouette -->
    <circle cx="120" cy="100" r="28" fill="#2A3245"/>

    <!-- The "Deliberate" (刻意) Mask being held up or fitted precisely -->
    <!-- Floating artificial glowing mask with high-contrast accent color (Gold/Orange for focus) -->
    <g transform="translate(0, -2)">
      <!-- Mask Face Base -->
      <path d="M 92 95 C 92 78 104 68 120 68 C 136 68 148 78 148 95 C 148 115 136 128 120 128 C 104 128 92 115 92 95 Z" fill="#222836" stroke="#F59E0B" stroke-width="3"/>
      
      <!-- Contrived/Forced Smile (Geometric, exaggerated, calculating arc) -->
      <path d="M 106 108 Q 120 120 134 108" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      
      <!-- Artificial Eyes (Sharp, calculating, non-genuine) -->
      <path d="M 104 88 L 114 91" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 126 91 L 136 88" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Mechanical/Calculated holding hands/rods emphasizing the deliberate effort -->
      <path d="M 85 145 L 98 118" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M 155 145 L 142 118" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

</svg>