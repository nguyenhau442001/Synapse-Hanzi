<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Scale Beam (Tilted, showing relief/lifting of heavy load) -->
    <path d="M-70,0 L70,-20" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
    <!-- Fulcrum Triangle -->
    <polygon points="0,-10 -15,40 15,40" fill="#718096"/>
    <circle cx="0" cy="-5" r="5" fill="#A0AEC0"/>

    <!-- Left Side: Heavy Load (School Bag being lifted/removed) -->
    <g transform="translate(-65, 10)">
      <!-- Suspension rope -->
      <line x1="0" y1="-10" x2="0" y2="15" stroke="#718096" stroke-width="3"/>
      <!-- Backpack -->
      <rect x="-18" y="15" width="36" height="42" rx="8" fill="#E53E3E"/>
      <path d="M-12,15 C-12,8 12,8 12,15" fill="none" stroke="#C53030" stroke-width="3"/>
      <rect x="-12" y="25" width="24" height="18" rx="4" fill="#FC8181"/>
      <circle cx="0" cy="34" r="3" fill="#FFF"/>
      <!-- Glowing upward motion arrows indicating reduction/lifting -->
      <path d="M-25,75 L0,55 L25,75" fill="none" stroke="#319795" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-25,90 L0,70 L25,90" fill="none" stroke="#319795" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    </g>

    <!-- Right Side: Lightened / Balanced side with Book & Sparkle -->
    <g transform="translate(65, -5)">
      <!-- Suspension rope -->
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#718096" stroke-width="3"/>
      <!-- Open Book (Joyful/Light learning) -->
      <path d="M-22,25 C-10,20 0,25 0,25 C0,25 10,20 22,25 L22,45 C10,40 0,45 0,45 C0,45 -10,40 -22,45 Z" fill="#ECC94B"/>
      <path d="M0,25 L0,45" stroke="#D69E2E" stroke-width="2"/>
      <!-- Gentle Glow / Sparkles indicating mental relief -->
      <path d="M0,-25 L3,-32 L10,-35 L3,-38 L0,-45 L-3,-38 L-10,-35 L-3,-32 Z" fill="#F6E05E"/>
      <circle cx="22" cy="-20" r="2.5" fill="#F6E05E"/>
      <circle cx="-25" cy="-10" r="2" fill="#F6E05E"/>
    </g>
  </g>
</svg>