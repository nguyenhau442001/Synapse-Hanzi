  <rect x="90" y="193" width="5" height="12" rx="2" fill="#222730"/>
  <rect x="115" y="193" width="5" height="12" rx="2" fill="#222730"/>
  <!-- Mug on Table -->
  <rect x="97" y="178" width="10" height="10" rx="2" fill="#F4F1DE"/>
  <path d="M107 180 C110 180 110 186 107 186" stroke="#F4F1DE" stroke-width="2" fill="none"/>
  <!-- Steam from mug -->
  <path d="M100 172 C102 170 99 166 101 164" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
