  <rect x="95" y="65" width="50" height="60" rx="4" fill="#2E3748"/>
  <rect x="100" y="70" width="19" height="50" rx="2" fill="#FFD166" opacity="0.85"/>
  <rect x="121" y="70" width="19" height="50" rx="2" fill="#FFD166" opacity="0.85"/>

