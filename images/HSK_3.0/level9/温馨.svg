  <path d="M64 130 L64 165" stroke="#BC8A5F" stroke-width="2"/>
  <!-- Pot -->
  <path d="M50 165 L78 165 L73 190 L55 190 Z" fill="#E9C46A"/>
  <!-- Green Leaves -->
  <circle cx="64" cy="120" r="14" fill="#2A9D8F"/>
  <circle cx="53" cy="125" r="10" fill="#264653"/>
  <circle cx="75" cy="125" r="10" fill="#264653"/>
  <circle cx="64" cy="108" r="11" fill="#2A9D8F"/>

  <!-- Cozy Armchair -->
  <path d="M140 145 C140 125 180 125 180 145 L185 190 C185 195 180 198 175 198 L145 198 C140 198 135 195 135 190 Z" fill="#E76F51"/>
  <!-- Armchair Seat & Backrest Softness -->
  <rect x="143" y="135" width="34" height="45" rx="10" fill="#F4A261"/>
  <rect x="138" y="165" width="44" height="25" rx="8" fill="#E76F51"/>
  <!-- Chair Legs -->
  <rect x="146" y="198" width="4" height="15" rx="2" fill="#2C333F"/>
  <rect x="170" y="198" width="4" height="15" rx="2" fill="#2C333F"/>

  <!-- Floor Lamp -->
  <rect x="185" y="100" width="4" height="113" fill="#6C757D"/>
