<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for the diamond -->
  <circle cx="120" cy="120" r="70" fill="#00D2FF" opacity="0.08" filter="blur(10px)"/>
  <circle cx="120" cy="120" r="45" fill="#E0F7FA" opacity="0.04" filter="blur(5px)"/>

  <!-- Diamond (Zuànshí) Vector Illustration -->
  <g transform="translate(120, 120)">
    <!-- Back facets/shadows (darker blues) -->
    <polygon points="0,-50 -35,-20 0,60" fill="#0077B6" opacity="0.7"/>
    <polygon points="0,-50 35,-20 0,60" fill="#00B4D8" opacity="0.6"/>
    
    <!-- Left and right main body facets -->
    <polygon points="-75,-20 -35,-20 0,60" fill="#90E0EF" opacity="0.5"/>
    <polygon points="75,-20 35,-20 0,60" fill="#CAF0F8" opacity="0.4"/>

    <!-- Upper pavilion facets -->
    <polygon points="-75,-20 -55,-50 -35,-20" fill="#00B4D8" opacity="0.8"/>
    <polygon points="75,-20 55,-50 35,-20" fill="#90E0EF" opacity="0.7"/>
    <polygon points="-35,-20 -55,-50 0,-50" fill="#ADE8F4" opacity="0.9"/>
    <polygon points="35,-20 55,-50 0,-50" fill="#CAF0F8" opacity="0.8"/>

    <!-- Table (top flat surface) -->
    <polygon points="-35,-50 35,-50 55,-20 -55,-20" fill="#E0F7FA" opacity="0.95"/>

    <!-- Crisp outlines and internal refraction lines -->
    <polygon points="-75,-20 75,-20 35,-50 -35,-50" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"/>
    <polyline points="-75,-20 0,60 75,-20" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" opacity="0.8"/>
    <line x1="-35" y1="-50" x2="-35" y2="-20" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="35" y1="-50" x2="35" y2="-20" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="-55" y1="-50" x2="-75" y2="-20" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="55" y1="-50" x2="75" y2="-20" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="-35" y1="-20" x2="0" y2="60" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="35" y1="-20" x2="0" y2="60" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="-55" y1="-50" x2="0" y2="-50" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="55" y1="-50" x2="0" y2="-50" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>

    <!-- Sparkle highlights -->
    <g transform="translate(-55, -55)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#FFFFFF"/>
    </g>
    <g transform="translate(65, -35) scale(0.6)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#FFFFFF"/>
    </g>
    <g transform="translate(-20, 25) scale(0.4)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>