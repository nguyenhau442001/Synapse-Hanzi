<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Subtle Grid / Interface Field -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="40" y1="60" x2="200" y2="60"/>
    <line x1="40" y1="120" x2="200" y2="120"/>
    <line x1="40" y1="180" x2="200" y2="180"/>
    <line x1="60" y1="40" x2="60" y2="200"/>
    <line x1="120" y1="40" x2="120" y2="200"/>
    <line x1="180" y1="40" x2="180" y2="200"/>
  </g>

  <!-- Central Human-Machine Object: Modern Futuristic Holographic Interface Device with Human Hand Interaction -->
  
  <!-- Base Device / Holographic Projector -->
  <path d="M 80 180 L 160 180 L 175 200 L 65 200 Z" fill="#2A303C"/>
  <path d="M 95 180 L 145 180 L 140 174 L 100 174 Z" fill="#3A4454"/>
  <!-- Glowing Base Accent -->
  <rect x="105" y="188" width="30" height="3" rx="1.5" fill="#FFA800"/>

  <!-- Holographic Beam (Cone of light) -->
  <polygon points="120,95 75,170 165,170" fill="url(#holo-gradient)" opacity="0.25"/>

  <!-- Holographic UI Elements (Floating Virtual Object being manipulated) -->
  <g transform="translate(120, 110)">
    <!-- Outer Rings -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FFA800" stroke-width="1" opacity="0.4"/>
    
    <!-- Central Floating Data Node -->
    <polygon points="0,-16 14,8 -14,8" fill="#FFA800" opacity="0.85"/>
    <circle cx="0" cy="2" r="4" fill="#1A1D24"/>
  </g>

  <!-- Human Hand (Representing the user interacting with the interface) -->
  <g transform="translate(45, 120)">
    <!-- Arm / Sleeve -->
    <path d="M -10 60 L 30 50 L 45 75 L 0 85 Z" fill="#2E384D"/>
    
    <!-- Hand Palm & Fingers -->
    <path d="M 30 50 C 35 45, 45 40, 55 45 C 60 48, 62 55, 58 60 C 55 63, 50 62, 45 60 Z" fill="#E0AC9D"/>
    
    <!-- Index Finger Pointing/Interacting precisely with the hologram -->
    <path d="M 52 52 C 62 42, 75 35, 82 38 C 86 40, 86 45, 80 48 C 72 52, 60 58, 52 58 Z" fill="#E0AC9D"/>

    <!-- Touch Point / Spark (Indicates active interaction) -->
    <circle cx="82" cy="39" r="4" fill="#00E5FF"/>
    <circle cx="82" cy="39" r="8" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Dynamic Connection Waves (Feedback loop between human and machine) -->
  <path d="M 90 95 C 105 85, 110 85, 125 95" fill="none" stroke="#FFA800" stroke-width="2" stroke-linecap="round"/>
  <path d="M 95 85 C 110 73, 115 73, 130 85" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="holo-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
</svg>