<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background atmosphere (tight, enclosed feeling) -->
  <path d="M70 40 L170 40 L190 200 L50 200 Z" fill="#222630" opacity="0.4"/>
  
  <!-- Character representing "窘迫" (A person cornered, overwhelmed by financial strait/dilemma) -->
  <!-- Floor line -->
  <line x1="50" y1="185" x2="190" y2="185" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Empty/Flipped Wallet concept represented by posture and drooping lines -->
  <!-- Slumping body -->
  <!-- Head -->
  <circle cx="120" cy="95" r="16" fill="#4E5D6C"/>
  <!-- Hair -->
  <path d="M104 92 C106 82 122 81 136 88 C130 84 112 84 104 92 Z" fill="#2E3842"/>
  
  <!-- Body/Torso hunched over -->
  <path d="M110 110 C105 125 100 150 105 170 C107 178 113 182 118 182 C123 182 127 175 125 160 C122 135 125 120 135 110" fill="#3B82F6" opacity="0.8"/>
  
  <!-- Crossed arms holding head in dilemma / stress -->
  <path d="M105 122 Q120 135 135 122" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Hands on head -->
  <circle cx="110" cy="115" r="5" fill="#E2E8F0"/>
  <circle cx="130" cy="115" r="5" fill="#E2E8F0"/>

  <!-- Empty Wallet / Financial strain floating symbols (Minimal, flat, clear) -->
  <!-- Opened empty wallet dropped on the floor -->
  <path d="M85 170 L115 170 L120 182 L80 182 Z" fill="#D97706" opacity="0.6"/>
  <path d="M85 165 L115 165 L115 170 L85 170 Z" fill="#F59E0B" opacity="0.8"/>
  
  <!-- Single fallen coin (representing exhaustion of savings) -->
  <circle cx="145" cy="177" r="5" fill="#F59E0B"/>
  <text x="143" y="180" font-family="sans-serif" font-weight="bold" font-size="7" fill="#1A1D24">$</text>
  
  <!-- Abstract pressure lines (Visualizing 'tight squeeze' / ngặt nghèo) -->
  <path d="M75 80 L90 95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M165 80 L150 95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M70 120 L88 125" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M170 120 L152 125" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>