<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Elderly Person -->
  <g transform="translate(70, 120)">
    <circle cx="20" cy="-30" r="12" fill="#E0E0E0"/>
    <path d="M8 10 L32 10 L28 40 L12 40 Z" fill="#5D6D7E"/>
    <path d="M12 40 L10 70 M28 40 L30 70" stroke="#5D6D7E" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 55 L5 60" stroke="#5D6D7E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Volunteer -->
  <g transform="translate(130, 90)">
    <circle cx="20" cy="20" r="12" fill="#FFB74D"/>
    <path d="M8 35 L32 35 L28 70 L12 70 Z" fill="#FFA726"/>
    <path d="M12 70 L10 100 M28 70 L30 100" stroke="#FFA726" stroke-width="4" stroke-linecap="round"/>
    <!-- Helping gesture: Hand reaching out to support -->
    <path d="M32 45 L45 40" stroke="#FFB74D" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="38" r="4" fill="#FFB74D"/>
  </g>

  <!-- Supporting object: Grocery bag being handed over -->
  <path d="M85 140 L115 140 L110 170 L90 170 Z" fill="#A1887F"/>
  <path d="M90 140 L90 130 L110 130 L110 140" fill="none" stroke="#A1887F" stroke-width="3"/>

  <!-- Ground line -->
  <path d="M40 190 L200 190" stroke="#34495E" stroke-width="2" stroke-linecap="round"/>
</svg>