<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Window Frame -->
  <rect x="70" y="40" width="100" height="120" rx="4" fill="none" stroke="#4A5568" stroke-width="6"/>
  <line x1="120" y1="40" x2="120" y2="160" stroke="#4A5568" stroke-width="6"/>
  <line x1="70" y1="100" x2="170" y2="100" stroke="#4A5568" stroke-width="6"/>
  
  <!-- Floor -->
  <rect x="0" y="160" width="240" height="80" fill="#2D3748"/>
  
  <!-- Projected Light Beams (The "投射" action) -->
  <polygon points="70,40 120,40 160,160 110,160" fill="#F6E05E" opacity="0.3"/>
  <polygon points="120,40 170,40 210,160 160,160" fill="#F6E05E" opacity="0.3"/>
  
  <!-- Dappled Light Patches on Floor -->
  <ellipse cx="130" cy="180" rx="25" ry="10" fill="#F6E05E" opacity="0.6"/>
  <ellipse cx="170" cy="200" rx="15" ry="8" fill="#F6E05E" opacity="0.6"/>
  <ellipse cx="100" cy="210" rx="20" ry="10" fill="#F6E05E" opacity="0.6"/>
  
  <!-- Window Sill Shadow -->
  <rect x="65" y="160" width="110" height="10" fill="#1A1D24" opacity="0.4"/>
</svg>