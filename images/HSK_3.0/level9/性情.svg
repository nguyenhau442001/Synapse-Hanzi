<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The Professor's Profile: Representing "性情" (Character/Temperament) -->
  <!-- Head and Shoulders representing the "Gentleman" (君子) persona -->
  <g transform="translate(120, 130)">
    <!-- Shoulders/Clothing -->
    <path d="M-60,80 C-60,40 -30,20 0,20 C30,20 60,40 60,80 L60,110 L-60,110 Z" fill="#2C3E50"/>
    
    <!-- Face Shape -->
    <path d="M-35,-20 C-35,-50 -20,-70 0,-70 C20,-70 35,-50 35,-20 C35,10 20,30 0,30 C-20,30 -35,10 -35,-20" fill="#E6B89C"/>
    
    <!-- Gentle Expression: Closed eyes and soft smile -->
    <path d="M-18,-25 Q-12,-30 -6,-25" stroke="#4A3428" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M6,-25 Q12,-30 18,-25" stroke="#4A3428" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-12,-5 Q0,2 12,-5" stroke="#4A3428" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Hair -->
    <path d="M-36,-25 C-38,-60 -15,-85 0,-85 C15,-85 38,-60 36,-25 Z" fill="#3E2723"/>
  </g>
  
  <!-- Symbolizing "温润如玉" (Warm as Jade) - A glowing jade pendant -->
  <circle cx="120" cy="160" r="15" fill="#A8E063" opacity="0.8"/>
  <circle cx="120" cy="160" r="10" fill="#56AB2F"/>
  
  <!-- Subtle warm ambient light to suggest "温和" (Gentle/Warm) -->
  <circle cx="120" cy="80" r="80" fill="url(#grad1)" opacity="0.1"/>
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1D24;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>