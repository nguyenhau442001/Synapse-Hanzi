<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Child drawing at a desk -->
  <g transform="translate(60, 120)">
    <rect x="0" y="20" width="60" height="40" rx="4" fill="#3B4252"/>
    <circle cx="30" cy="0" r="15" fill="#E5E9F0"/>
    <path d="M20 15h20v5h-20z" fill="#D8DEE9"/>
    <rect x="25" y="25" width="10" height="20" fill="#88C0D0"/>
  </g>

  <!-- The person standing "yìpáng" (to the side) -->
  <g transform="translate(150, 80)">
    <circle cx="20" cy="30" r="12" fill="#FFB86C"/>
    <rect x="15" y="42" width="10" height="40" rx="2" fill="#FFB86C"/>
    <path d="M10 50 l-5 20 M30 50 l5 20" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
    <path d="M12 30 l-4 5 M28 30 l4 5" stroke="#FFB86C" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floor line -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#4C566A" stroke-width="2"/>
</svg>