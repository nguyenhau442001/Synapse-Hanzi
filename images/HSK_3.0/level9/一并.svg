<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow for focal point -->
  <circle cx="120" cy="120" r="80" fill="#2D3748" opacity="0.4" filter="blur(20px)"/>

  <!-- Document 1: Safety Design Plan (Back/Left offset) -->
  <g transform="translate(62, 54)">
    <!-- Paper shadow -->
    <rect x="0" y="4" width="76" height="96" rx="6" fill="#0D1117" opacity="0.6"/>
    <!-- Paper base -->
    <rect x="0" y="0" width="76" height="96" rx="6" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    <!-- Header accent -->
    <rect x="12" y="14" width="28" height="6" rx="3" fill="#F0883E"/>
    <!-- Content lines -->
    <rect x="12" y="32" width="52" height="4" rx="2" fill="#8B949E"/>
    <rect x="12" y="44" width="40" height="4" rx="2" fill="#484F58"/>
    <rect x="12" y="56" width="48" height="4" rx="2" fill="#484F58"/>
    <!-- Shield / Safety Icon Badge -->
    <circle cx="38" cy="76" r="12" fill="#1F242C"/>
    <path d="M38 68 L44 71 V77 C44 80.5 41.5 83.5 38 85 C34.5 83.5 32 80.5 32 77 V71 L38 68 Z" fill="none" stroke="#F0883E" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Document 2: EIA Report (Front/Right offset, overlapping) -->
  <g transform="translate(102, 70)">
    <!-- Paper shadow -->
    <rect x="0" y="4" width="76" height="96" rx="6" fill="#0D1117" opacity="0.8"/>
    <!-- Paper base -->
    <rect x="0" y="0" width="76" height="96" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
    <!-- Header accent -->
    <rect x="12" y="14" width="28" height="6" rx="3" fill="#58A6FF"/>
    <!-- Content lines -->
    <rect x="12" y="32" width="52" height="4" rx="2" fill="#C9D1D9"/>
    <rect x="12" y="44" width="36" height="4" rx="2" fill="#8B949E"/>
    <rect x="12" y="56" width="44" height="4" rx="2" fill="#8B949E"/>
    <!-- Leaf / Environment Icon Badge -->
    <circle cx="38" cy="76" r="12" fill="#1F242C"/>
    <path d="M38 84 C38 84 34 80 34 75 C34 72.5 35.8 70.5 38 70 C40.2 70.5 42 72.5 42 75 C42 80 38 84 38 84 Z" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linejoin="round"/>
    <path d="M38 74 V81" stroke="#58A6FF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Submission / Simultaneous Action Indicators (Upward & Unified Motion) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left upward sync arrow -->
    <path d="M50 110 L38 98 L26 110" stroke="#F0883E" stroke-width="2.5"/>
    <path d="M38 102 V132" stroke="#F0883E" stroke-width="2.5"/>

    <!-- Right upward sync arrow -->
    <path d="M190 110 L202 98 L214 110" stroke="#58A6FF" stroke-width="2.5"/>
    <path d="M202 102 V132" stroke="#58A6FF" stroke-width="2.5"/>

    <!-- Central merging bracket / Together symbol at base -->
    <path d="M90 190 H150" stroke="#8B949E" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M106 182 L120 190 L106 198" fill="none" stroke="#C9D1D9" stroke-width="2"/>
    <path d="M134 182 L120 190 L134 198" fill="none" stroke="#C9D1D9" stroke-width="2"/>
  </g>

  <!-- Unified presentation platform / tray -->
  <path d="M70 174 H170 L160 184 H80 Z" fill="#30363D"/>
  <rect x="75" y="178" width="90" height="2" fill="#484F58"/>
</svg>