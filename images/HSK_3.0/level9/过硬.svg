<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#222834" opacity="0.6"/>

  <!-- Physical object representing "过硬" (Solid, unyielding, exceptionally high-grade/tempered material - represented by an anvil and a glowing tempered gear/blade structure) -->
  <g transform="translate(0, 5)">
    <!-- Base / Anvil floor shadow -->
    <ellipse cx="120" cy="185" rx="55" ry="10" fill="#111318"/>

    <!-- Anvil Body (Symbol of solid foundation & heavy-duty resilience) -->
    <!-- Base -->
    <path d="M 85 175 L 155 175 L 145 150 L 95 150 Z" fill="#2E3646"/>
    <!-- Waist -->
    <rect x="102" y="130" width="36" height="20" fill="#3A445A"/>
    <!-- Main Block / Horn -->
    <path d="M 75 110 L 175 110 C 185 110, 185 130, 175 130 L 65 130 C 55 130, 55 110, 65 110 Z" fill="#4B566D"/>
    <!-- Anvil Face (Polished top) -->
    <rect x="80" y="105" width="90" height="6" rx="2" fill="#6C7A9C"/>

    <!-- The "Guoying" Object: A precisely tempered, high-grade golden gear/shield mechanism firmly anchored, showing flawless professional precision -->
    <g transform="translate(120, 85)">
      <!-- Outer radiant glow for high quality/perfection -->
      <circle cx="0" cy="0" r="42" fill="#F5A623" opacity="0.15"/>
      
      <!-- Precision Hexagon Shield / Core -->
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="#1A1D24" stroke="#F5A623" stroke-width="4" stroke-linejoin="round"/>
      
      <!-- Inner mechanical / structural facets indicating "Tough & Precise" (过硬) -->
      <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="#293042"/>
      
      <!-- Central checkmark / diamond emblem of certified excellence -->
      <path d="M -12 0 L -3 9 L 14 -8" fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Spark particles representing tempering, strength, and rigorous quality -->
    <circle cx="70" cy="85" r="3" fill="#F5A623"/>
    <path d="M 68 85 L 62 82" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    
    <circle cx="170" cy="85" r="3.5" fill="#F5A623"/>
    <path d="M 172 85 L 179 82" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>

    <circle cx="145" cy="50" r="2.5" fill="#FFD166"/>
    <circle cx="95" cy="55" r="2" fill="#FFD166"/>
  </g>
</svg>