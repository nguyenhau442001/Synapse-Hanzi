<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Aura / Determination Glow Background -->
    <circle cx="0" cy="0" r="75" fill="#242B35"/>
    <path d="M0 -65 L14 -22 L60 -22 L24 5 L38 48 L0 22 L-38 48 L-24 5 L-60 -22 L-14 -22 Z" fill="#FF9F1C" opacity="0.1"/>
    
    <!-- Athlete silhouette (Fierce competitor stance) -->
    <!-- Head & Sweatband -->
    <circle cx="0" cy="-35" r="16" fill="#F4F6F8"/>
    <path d="M-17 -37 L17 -37 L16 -30 L-16 -30 Z" fill="#FF3366"/>
    <!-- Determined Eye & Brow -->
    <path d="M-6 -35 L-2 -37 L2 -35" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Torso (Leaning forward aggressively) -->
    <path d="M-18 -10 C-18 -22 -10 -25 0 -25 C10 -25 18 -22 18 -10 L14 25 L-14 25 Z" fill="#FF9F1C"/>
    
    <!-- Arms in dynamic competitive/reaching pose -->
    <path d="M-15 -18 L-35 -5 L-28 8" fill="none" stroke="#F4F6F8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 -18 L38 2 L30 15" fill="none" stroke="#F4F6F8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Motion/Intensity Lines -->
    <path d="M-55 20 L-35 20" stroke="#FF3366" stroke-width="4" stroke-linecap="round"/>
    <path d="M-65 32 L-40 32" stroke="#FF9F1C" stroke-width="3" stroke-linecap="round"/>
    <path d="M45 28 L65 28" stroke="#FF3366" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Ground / Court line -->
    <line x1="-70" y1="50" x2="70" y2="50" stroke="#3A4454" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Peak / Achievement Star Symbol floating above -->
    <path d="M0 -78 L4 -66 L16 -66 L7 -58 L10 -46 L0 -53 L-10 -46 L-7 -58 L-16 -66 L-4 -66 Z" fill="#FFD166"/>
  </g>
</svg>