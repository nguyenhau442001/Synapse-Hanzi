<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative lines representing motion/track -->
  <g opacity="0.15">
    <line x1="30" y1="185" x2="210" y2="185" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="45" y1="195" x2="195" y2="195" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Starting Line / Starting Block (Physical Object representing '起步' - Starting point / Takeoff) -->
  <g>
    <!-- Ground surface -->
    <path d="M 20 175 L 220 175" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Starting Blocks Structure (Solid physical object) -->
    <!-- Main base rail -->
    <rect x="70" y="163" href="#" width="100" height="6" rx="3" fill="#4A5568"/>
    
    <!-- First starting block (angled footplate) -->
    <path d="M 85 163 L 95 135 L 115 135 L 105 163 Z" fill="#718096"/>
    <path d="M 95 135 L 115 135 L 112 130 L 98 130 Z" fill="#A0AEC0"/>

    <!-- Second starting block (active takeoff position) -->
    <path d="M 130 163 L 145 120 L 170 120 L 155 163 Z" fill="#E2E8F0"/>
    <path d="M 145 120 L 170 120 L 166 114 L 149 114 Z" fill="#CBD5E0"/>

    <!-- Adjusting slot details -->
    <circle cx="100" cy="166" r="1.5" fill="#1A1D24"/>
    <circle cx="115" cy="166" r="1.5" fill="#1A1D24"/>
    <circle cx="140" cy="166" r="1.5" fill="#1A1D24"/>
    <circle cx="155" cy="166" r="1.5" fill="#1A1D24"/>
  </g>

  <!-- Physical Object representing movement / forward launch (Dynamic accent) -->
  <g>
    <!-- Starting energy burst / explosive launch vector -->
    <path d="M 160 115 Q 185 95 210 75" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M 170 130 Q 195 110 225 90" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Forward momentum shoes / runner stance starting silhouette implied cleanly -->
    <ellipse cx="158" cy="118" rx="12" ry="6" transform="rotate(-30 158 118)" fill="#F59E0B"/>
    <path d="M 152 114 L 168 122" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Emphasized Starting Point Marker (Bold focal point) -->
  <g>
    <!-- Vertical start indicator beacon/flag pole -->
    <line x1="75" y1="175" x2="75" y2="70" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <!-- Glowing start flag/marker -->
    <path d="M 75 70 L 105 82 L 75 94 Z" fill="#F59E0B"/>
    <!-- Base anchor -->
    <circle cx="75" cy="175" r="4" fill="#E2E8F0"/>
  </g>
</svg>