  <circle cx="39" cy="214" r="1.5" fill="#718096"/>
  <circle cx="47" cy="218" r="1.5" fill="#718096"/>

  <!-- Steam / Culinary Essence Accents (Gold accent for focus) -->
  <path d="M100 52 C96 46 104 40 100 34" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M120 48 C116 42 124 36 120 30" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M140 52 C136 46 144 40 140 34" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>