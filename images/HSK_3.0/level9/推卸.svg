<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person 1 (The Manager/Person pushing) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#FFB347"/>
    <path d="M5 45 Q20 35 35 45 L30 80 L10 80 Z" fill="#FFB347"/>
    <path d="M35 55 L60 45" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- The "Responsibility" Object (A heavy, glowing gold cube) -->
  <rect x="90" y="110" width="60" height="60" rx="8" fill="#FFD700"/>
  <rect x="95" y="115" width="50" height="50" rx="4" fill="#FFC107"/>
  
  <!-- Person 2 (The Subordinate/Person receiving) -->
  <g transform="translate(40, 100)">
    <circle cx="20" cy="20" r="15" fill="#8892B0"/>
    <path d="M5 45 Q20 35 35 45 L30 80 L10 80 Z" fill="#8892B0"/>
    <path d="M-5 55 L20 50" stroke="#8892B0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Motion lines indicating the push -->
  <path d="M100 140 L70 140" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M95 130 L75 130" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M95 150 L75 150" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
</svg>