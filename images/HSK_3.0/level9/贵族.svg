<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Elegant aristocrat character representing '贵族' (Guìzú) -->
    <!-- Background subtle arch to represent a European noble estate/castle interior -->
    <path d="M 120,40 C 150,40 170,60 170,110 L 170,200 L 70,200 L 70,110 C 70,60 90,40 120,40 Z" fill="#242933"/>
    
    <!-- Torso and shoulders (Tailored formal suit jacket / aristocratic high-collar coat) -->
    <path d="M 80,200 L 95,145 C 105,140 135,140 145,145 L 160,200 Z" fill="#3B4252"/>
    
    <!-- Lapels -->
    <path d="M 105,145 L 120,185 L 135,145 Z" fill="#1A1D24"/>
    
    <!-- Gold embroidery / trims on jacket -->
    <path d="M 105,145 L 98,170 L 105,175" stroke="#EBCB8B" stroke-width="2" fill="none"/>
    <path d="M 135,145 L 142,170 L 135,175" stroke="#EBCB8B" stroke-width="2" fill="none"/>
    <circle cx="120" cy="165" r="2.5" fill="#EBCB8B"/>
    <circle cx="120" cy="180" r="2.5" fill="#EBCB8B"/>

    <!-- Crisp white dress shirt collar -->
    <polygon points="105,145 120,132 135,145 120,150" fill="#ECEFF4"/>
    
    <!-- Sophisticated Cravat / Ascot Tie (Classic Aristocratic Neckwear) -->
    <path d="M 113,143 L 120,162 L 127,143 Z" fill="#D08770"/>
    <circle cx="120" cy="144" r="3.5" fill="#EBCB8B"/>

    <!-- Neck -->
    <rect x="111" y="125" width="18" height="22" fill="#D8DEE9"/>

    <!-- Jaw and Face Shape -->
    <path d="M 98,100 C 98,132 142,132 142,100 L 142,95 C 142,75 120,72 120,72 C 120,72 98,75 98,95 Z" fill="#D8DEE9"/>
    
    <!-- Refined features: subtle confident smile and poised expression -->
    <path d="M 112,114 Q 120,119 128,114" stroke="#4C566A" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Eyes (Calm, dignified, intelligent) -->
    <rect x="106" y="96" width="10" height="4" rx="2" fill="#4C566A"/>
    <rect x="124" y="96" width="10" height="4" rx="2" fill="#4C566A"/>
    
    <!-- Hair (Neatly styled aristocratic hair with side parting) -->
    <path d="M 98,95 C 97,75 106,68 120,68 C 137,68 143,78 143,95 C 143,95 142,80 132,74 C 123,69 110,72 102,80 C 97,85 98,95 98,95 Z" fill="#4C566A"/>

    <!-- Ornate Aristocratic Crown / Tiara (Symbol of Nobility / 贵族) -->
    <!-- Gold Band -->
    <path d="M 97,70 L 143,70 L 141,64 L 99,64 Z" fill="#EBCB8B"/>
    <!-- Crown Peaks & Jewels -->
    <polygon points="97,64 103,50 110,64" fill="#EBCB8B"/>
    <polygon points="113,64 120,46 127,64" fill="#EBCB8B"/>
    <polygon points="130,64 137,50 143,64" fill="#EBCB8B"/>
    
    <!-- Jewels embedded in crown -->
    <circle cx="103" cy="58" r="2" fill="#BF616A"/>
    <circle cx="120" cy="54" r="2.5" fill="#5E81AC"/>
    <circle cx="137" cy="58" r="2" fill="#A3BE8C"/>
    <circle cx="120" cy="67" r="1.5" fill="#D08770"/>
  </g>
</svg>