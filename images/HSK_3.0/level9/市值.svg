<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative grid/glow to signify financial context -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Rising Chart Line (Market Value Trend) -->
  <path d="M50 160 L90 130 L130 140 L190 70" fill="none" stroke="#3A4454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 160 L90 130 L130 140 L190 70 L190 170 L50 170 Z" fill="#F5A623" fill-opacity="0.05"/>
  <path d="M50 160 L90 130 L130 140 L190 70" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Growth Data Points -->
  <circle cx="90" cy="130" r="4" fill="#1A1D24" stroke="#F5A623" stroke-width="3"/>
  <circle cx="130" cy="140" r="4" fill="#1A1D24" stroke="#F5A623" stroke-width="3"/>
  <circle cx="190" cy="70" r="6" fill="#F5A623"/>

  <!-- Central Physical Object representing Market Value / Asset / Building Corp (Financial Hub) -->
  <!-- Building Base / Financial Tower -->
  <path d="M95 185 L95 105 L145 105 L145 185 Z" fill="#2E3748"/>
  <path d="M85 185 L155 185 L155 192 L85 192 Z" fill="#4E5D78"/>
  
  <!-- Building Facade Windows (Grid pattern) -->
  <rect x="103" y="115" width="10" height="15" rx="2" fill="#61759B"/>
  <rect x="127" y="115" width="10" height="15" rx="2" fill="#61759B"/>
  
  <rect x="103" y="138" width="10" height="15" rx="2" fill="#61759B"/>
  <rect x="127" y="138" width="10" height="15" rx="2" fill="#61759B"/>

  <rect x="103" y="161" width="10" height="18" rx="2" fill="#F5A623"/>
  <rect x="127" y="161" width="10" height="18" rx="2" fill="#61759B"/>

  <!-- Golden Crown / Peak of the Tower (Symbolizing Market Dominance / Peak Value) -->
  <path d="M120 78 L148 105 L92 105 Z" fill="#F5A623"/>
  <circle cx="120" cy="70" r="5" fill="#F5A623"/>

  <!-- Floating Golden Coin / Value Symbol on Top Right -->
  <circle cx="185" cy="120" r="16" fill="#F5A623"/>
  <circle cx="185" cy="120" r="11" fill="#1A1D24"/>
  <text x="185" y="125" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#F5A623" text-anchor="middle">$</text>

  <!-- Upward Arrow floating near the coin -->
  <path d="M185 85 L175 98 L180 98 L180 105 L190 105 L190 98 L195 98 Z" fill="#4CD964"/>

</svg>