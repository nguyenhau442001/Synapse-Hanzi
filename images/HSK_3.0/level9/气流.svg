<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Airplane body -->
  <path d="M70 120 L170 120 L160 135 L80 135 Z" fill="#F39C12"/>
  <path d="M100 120 L90 100 L110 100 L105 120 Z" fill="#F39C12"/>
