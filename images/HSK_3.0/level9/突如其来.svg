<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Flash/Impact Waves (Representing Suddenness) -->
  <g opacity="0.15" stroke="#FFA726" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M120 40 L120 20"/>
    <path d="M170 60 L185 45"/>
    <path d="M70 60 L55 45"/>
    <path d="M190 110 L210 110"/>
    <path d="M50 110 L30 110"/>
  </g>

  <!-- Dramatic Lighting / Flash Arc -->
  <path d="M70 30 Q120 10 170 30" stroke="#FFD54F" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Mountain Peaks (Background) -->
  <polygon points="20,170 90,90 150,150 200,100 220,170" fill="#263238"/>
  <polygon points="80,170 120,120 180,170" fill="#37474F"/>

  <!-- The Sudden Torrent Wave (突如其来的山洪) -->
  <g>
    <!-- Wave Shadow/Base -->
    <path d="M0 170 C40 170 70 130 110 130 C150 130 170 170 240 170 L240 220 L0 220 Z" fill="#0D47A1" opacity="0.5"/>
    
    <!-- Main Torrent Body -->
    <path d="M-10 180 C30 170 60 110 105 110 C145 110 170 150 250 130 L250 240 L-10 240 Z" fill="#1976D2"/>
    
    <!-- Dynamic Frothing Crest (Sudden, Massive Surge) -->
    <path d="M60 130 C75 110 90 95 120 95 C150 95 175 120 210 105 C225 98 235 105 245 115 L250 150 C200 150 170 120 130 125 C90 130 75 145 60 130 Z" fill="#42A5F5"/>
    
    <!-- Foam Splashes & Droplets -->
    <circle cx="115" cy="90" r="4" fill="#E3F2FD"/>
    <circle cx="130" cy="82" r="3" fill="#E3F2FD"/>
    <circle cx="165" cy="95" r="5" fill="#E3F2FD"/>
    <circle cx="185" cy="88" r="3.5" fill="#E3F2FD"/>
    <circle cx="210" cy="98" r="4" fill="#E3F2FD"/>
    <path d="M140 85 Q145 75 150 85" stroke="#E3F2FD" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M195 80 Q200 70 205 80" stroke="#E3F2FD" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Impact / Alarm Accent (Orange/Gold) -->
  <g>
    <path d="M120 55 L125 70 L115 70 Z" fill="#FFA726"/>
    <circle cx="120" cy="77" r="2" fill="#FFA726"/>
  </g>

  <!-- Foreground Debris / Danger Indicator elements integrated cleanly -->
  <path d="M40 165 L55 160 L50 170 Z" fill="#5D4037"/>
  <rect x="180" y="155" width="12" height="8" rx="2" fill="#795548" transform="rotate(15 180 155)"/>

  <!-- Base Ground Line -->
  <rect x="0" y="210" width="240" height="30" fill="#111318"/>
</svg>