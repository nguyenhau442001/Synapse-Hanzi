<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#2D3342" opacity="0.4"/>

  <!-- Conceptual illustration: Respectful interaction representing "师长" (Teachers and elders/mentors) -->
  <!-- We depict a senior mentor figure (teacher/elder) and a student bowing respectfully in gratitude -->
  
  <g transform="translate(0, 10)">
    <!-- Senior Mentor / Teacher Figure (Left) -->
    <g id="mentor">
      <!-- Body/Robes -->
      <path d="M 65 145 L 85 145 L 90 190 L 60 190 Z" fill="#3B82F6"/>
      <!-- Head -->
      <circle cx="75" cy="115" r="14" fill="#FDE047"/>
      <!-- Hair/Wisdom bun or neat styling -->
      <path d="M 62 112 Q 75 100 88 112 Q 85 105 75 105 Q 65 105 62 112 Z" fill="#94A3B8"/>
      <!-- Friendly/Warm facial expression (simple clean lines) -->
      <circle cx="71" cy="114" r="1.5" fill="#1E293B"/>
      <circle cx="79" cy="114" r="1.5" fill="#1E293B"/>
      <path d="M 73 120 Q 75 122 77 120" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Warm welcoming gesture (arm raised slightly) -->
      <path d="M 70 135 Q 55 130 50 140" stroke="#FDE047" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Student / Junior Figure (Right) - Showing respectful gratitude (slight bow) -->
    <g id="student">
      <!-- Body angled in respectful bow -->
      <path d="M 140 150 L 160 140 L 175 185 L 145 190 Z" fill="#6366F1"/>
      <!-- Head -->
      <circle cx="130" cy="125" r="13" fill="#FDE047"/>
      <!-- Hair -->
      <path d="M 118 123 Q 130 112 142 123 Q 135 116 130 116 Q 125 116 118 123 Z" fill="#334155"/>
      <!-- Polite gesture: hands held in traditional respectful greeting (抱拳/拱手) -->
      <circle cx="135" cy="148" r="5" fill="#FDE047"/>
    </g>

    <!-- Symbol of Knowledge/Mentorship floating gently between them: Book & Graduation cap motif -->
    <g id="wisdom-symbol" transform="translate(100, 75)">
      <!-- Open Book Base -->
      <path d="M -15 10 Q 0 5 15 10 L 15 25 Q 0 20 -15 25 Z" fill="#F59E0B"/>
      <path d="M 0 6 L 0 22" stroke="#1A1D24" stroke-width="1.5"/>
      <!-- Graduation Cap on top -->
      <polygon points="0, -5 18, 2 0, 9 -18, 2" fill="#38BDF8"/>
      <rect x="-2" y="8" width="4" height="6" fill="#38BDF8"/>
      <!-- Tassel -->
      <path d="M 12 5 L 18 12" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Ground line for grounding the subjects -->
    <path d="M 40 190 L 200 190" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>