<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Palace Structure -->
  <g transform="translate(40, 60)">
    <!-- Main Roof -->
    <path d="M20 60 L80 20 L140 60 L140 80 L20 80 Z" fill="#D4AF37"/>
    <path d="M30 65 L80 35 L130 65 Z" fill="#B8860B"/>
    
    <!-- Palace Body -->
    <rect x="30" y="80" width="100" height="70" fill="#8B0000"/>
    
    <!-- Pillars -->
    <rect x="45" y="90" width="10" height="50" fill="#D4AF37"/>
    <rect x="75" y="90" width="10" height="50" fill="#D4AF37"/>
    <rect x="105" y="90" width="10" height="50" fill="#D4AF37"/>
    
    <!-- Entrance/Gate -->
    <rect x="65" y="110" width="30" height="40" fill="#4A0404"/>
    <rect x="70" y="115" width="20" height="35" fill="#2A0202"/>
    
    <!-- Decorative Roof Finial -->
    <circle cx="80" cy="20" r="6" fill="#FFD700"/>
  </g>
  
  <!-- Ground/Platform -->
  <rect x="30" y="210" width="180" height="5" fill="#555"/>
  <path d="M40 150 L200 150 L210 210 L30 210 Z" fill="#333"/>
</svg>