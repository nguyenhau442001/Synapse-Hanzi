<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: Subtle grid/network lines to represent digital media network -->
  <g opacity="0.15" stroke="#64748B" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="60" x2="100" y2="60"/>
    <line x1="40" y1="120" x2="80" y2="120"/>
    <line x1="40" y1="180" x2="100" y2="180"/>
  </g>

  <!-- Left Source Document / Original Article (Physical Object representing the source) -->
  <g transform="translate(36, 45)">
    <!-- Document Base -->
    <rect x="0" y="0" width="64" height="88" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Header Badge / Original Stamp -->
    <rect x="12" y="12" width="24" height="6" rx="3" fill="#F59E0B"/>
    
    <!-- Text Lines -->
    <rect x="12" y="28" width="40" height="4" rx="2" fill="#718096"/>
    <rect x="12" y="38" width="40" height="4" rx="2" fill="#718096"/>
    <rect x="12" y="48" width="28" height="4" rx="2" fill="#718096"/>

    <!-- Small embedded image placeholder -->
    <rect x="12" y="60" width="40" height="16" rx="3" fill="#1A202C"/>
  </g>

  <!-- Central Dynamic Transfer Action (Republishing / Forwarding Motion) -->
  <g transform="translate(112, 75)">
    <!-- Curved Arrow / Transfer Stream -->
    <path d="M 0 16 Q 16 -12, 32 16" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <polygon points="28,10 38,16 26,22" fill="#F59E0B"/>

    <!-- Secondary subtle sync arc -->
    <path d="M 6 26 Q 16 8, 26 26" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Right Target Device / Republished Platform (Physical Object representing the re-publication) -->
  <g transform="translate(140, 95)">
    <!-- Modern Tablet/Screen Device -->
    <rect x="0" y="0" width="64" height="88" rx="8" fill="#2D3748" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Screen Inner Area -->
    <rect x="8" y="8" width="48" height="72" rx="4" fill="#1A202C"/>

    <!-- Republished Header -->
    <rect x="14" y="16" width="20" height="5" rx="2.5" fill="#F59E0B"/>
    
    <!-- Screen Content Lines -->
    <rect x="14" y="28" width="36" height="4" rx="2" fill="#A0AEC0"/>
    <rect x="14" y="38" width="36" height="4" rx="2" fill="#A0AEC0"/>
    <rect x="14" y="48" width="24" height="4" rx="2" fill="#A0AEC0"/>

    <!-- Shared/Repost Icon Badge on Screen -->
    <circle cx="42" cy="62" r="8" fill="#F59E0B" opacity="0.2"/>
    <path d="M 39 62 L 45 62 M 42 59 L 45 62 L 42 65" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating secondary particles / data transfer aesthetic -->
  <circle cx="104" cy="50" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="120" cy="58" r="2" fill="#64748B"/>
  <circle cx="96" cy="140" r="2.5" fill="#F59E0B" opacity="0.6"/>
</svg>