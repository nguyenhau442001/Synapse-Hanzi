<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Steel Beams / Cargo -->
  <g fill="#FFB84D">
    <rect x="140" y="160" width="60" height="15" rx="2"/>
    <rect x="145" y="178" width="50" height="15" rx="2"/>
    <rect x="150" y="196" width="40" height="15" rx="2"/>
  </g>

  <!-- Motion lines for dumping/dumping action -->
  <path d="M130 150 L100 120 M140 140 L110 110" stroke="#5D6D7E" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>

  <!-- Character dumping the steel -->
  <g fill="#A0AEC0">
    <!-- Body -->
    <path d="M60 120 L100 120 L90 200 L70 200 Z" />
    <!-- Arm reaching out -->
    <path d="M80 130 L130 150" stroke="#A0AEC0" stroke-width="12" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="80" cy="100" r="20"/>
  </g>

  <!-- Price Tag (Low price indicator) -->
  <g transform="translate(160, 80)">
    <path d="M0 0 L30 0 L40 15 L30 30 L0 30 Z" fill="#E53E3E"/>
    <circle cx="10" cy="15" r="4" fill="#1A1D24"/>
    <path d="M20 10 L30 20 M30 10 L20 20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ground line -->
  <line x1="20" y1="215" x2="220" y2="215" stroke="#2D3748" stroke-width="4" stroke-linecap="round"/>
</svg>