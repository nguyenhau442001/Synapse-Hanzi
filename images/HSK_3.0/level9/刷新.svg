<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Background track / finish line representation -->
    <path d="M 40 180 L 200 180" stroke="#2A2F3D" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Dynamic Motion Lines for Action -->
    <path d="M 50 130 C 70 110, 80 110, 100 130" stroke="#3A4255" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 70 120 C 90 100, 100 100, 120 120" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Shattered Record Barrier (Representing breaking/phá vỡ a record) -->
    <g transform="translate(160, 110)">
      <!-- Left broken shard falling -->
      <path d="M -10 -40 L -20 20 L -30 60" stroke="#FF5252" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-15)"/>
      <!-- Right broken shard flying -->
      <path d="M 10 -40 L 25 10 L 40 40" stroke="#FF5252" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(25)"/>
      <!-- Floating particles / energy burst -->
      <circle cx="-15" cy="-20" r="3" fill="#FF9F43"/>
      <circle cx="20" cy="-30" r="2.5" fill="#FF9F43"/>
      <circle cx="5" cy="15" r="2" fill="#FF5252"/>
    </g>

    <!-- Running Athlete Character (Dynamic Action - Verb) -->
    <g transform="translate(110, 110)">
      <!-- Back leg (lunging forward) -->
      <path d="M 0 30 L -35 55 L -45 50" stroke="#54A0FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Torso (leaning forward for maximum speed) -->
      <path d="M -5 10 L 15 -15" stroke="#FF9F43" stroke-width="12" stroke-linecap="round"/>
      <!-- Head -->
      <circle cx="22" cy="-28" r="8" fill="#FFEAA7"/>
      <!-- Front leg (powerfully breaking through) -->
      <path d="M -5 10 L 25 45 L 45 40" stroke="#54A0FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Back arm -->
      <path d="M -5 5 L -25 -15 L -40 -5" stroke="#FF9F43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Front arm driving forward -->
      <path d="M 10 -10 L 30 -5 L 40 -20" stroke="#FF9F43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Visual Refresh/Renewal Aura ( làm mới ) -->
    <path d="M 90 65 A 50 50 0 0 1 170 85" stroke="#00D2D3" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <polygon points="170,80 178,88 168,92" fill="#00D2D3"/>
    
    <path d="M 150 165 A 50 50 0 0 1 70 145" stroke="#00D2D3" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <polygon points="70,150 62,142 72,138" fill="#00D2D3"/>
  </g>
</svg>