<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Shadow/Glow -->
    <circle cx="0" cy="15" r="55" fill="#E65100" opacity="0.15" filter="blur(8px)"/>
    
    <!-- Parchment Document (The "Plot" or "Conspiracy") -->
    <path d="M-40 -50 L30 -60 L45 -20 L-25 -10 Z" fill="#2D323B"/>
    <path d="M-30 -40 L40 -50 L55 -10 L-15 0 Z" fill="#3A404D"/>
    
    <!-- Main Scroll/Blueprint -->
    <rect x="-55" y="-30" width="100" height="75" rx="4" fill="#252A34" stroke="#3A404D" stroke-width="2"/>
    
    <!-- Sinister Blueprint Details (Dark Plot Lines) -->
    <path d="M-40 -15 L10 -15" stroke="#4F5665" stroke-width="3" stroke-linecap="round"/>
    <path d="M-40 0 L25 0" stroke="#4F5665" stroke-width="3" stroke-linecap="round"/>
    <path d="M-40 15 L-5 15" stroke="#4F5665" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Malicious Target/Crosshair Marker on Document -->
    <circle cx="20" cy="20" r="16" fill="#1A1D24" stroke="#FF6D00" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="40" stroke="#FF6D00" stroke-width="2"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#FF6D00" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="#FFB300"/>

    <!-- Ominous Floating Dagger / Threat Symbol piercing the scroll -->
    <g transform="rotate(25) translate(10, -35)">
      <!-- Blade -->
      <path d="M0 -30 L5 15 L0 25 L-5 15 Z" fill="#CFD8DC"/>
      <path d="M0 -30 L5 15 L0 25 Z" fill="#ECEFF1"/>
      <line x1="0" y1="-25" x2="0" y2="15" stroke="#90A4AE" stroke-width="1"/>
      
      <!-- Guard -->
      <path d="M-12 15 L12 15 L8 19 L-8 19 Z" fill="#FFB300"/>
      
      <!-- Hilt & Pommel -->
      <rect x="-3" y="19" width="6" height="14" rx="2" fill="#263238"/>
      <circle cx="0" cy="35" r="5" fill="#FF6D00"/>
      
      <!-- Menacing Glow / Shadow under dagger -->
      <path d="M-8 40 L8 40 L15 60 L-15 60 Z" fill="#FF6D00" opacity="0.2" filter="blur(4px)"/>
    </g>

    <!-- Sharp angular sinister aura accents -->
    <path d="M-65 -45 L-50 -35 L-60 -20 Z" fill="#FF6D00" opacity="0.8"/>
    <path d="M55 -55 L45 -40 L65 -45 Z" fill="#FFB300" opacity="0.6"/>
  </g>
</svg>