<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Ocean gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    
    <!-- Solar panel shimmer gradient -->
    <linearGradient id="solarShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Sun/Horizon glow -->
    <linearGradient id="horizonGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
    
    <clipPath id="circleClip">
      <circle cx="120" cy="120" r="88"/>
    </clipPath>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="120" cy="120" r="94" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>
  
  <!-- Main Circular Container representing the conceptual focus -->
  <circle cx="120" cy="120" r="88" fill="#0F172A"/>

  <!-- CONTENT INSIDE CLIP -->
  <g clip-path="url(#circleClip)">
    <!-- Sky / Upper background -->
    <rect x="32" y="32" width="176" height="88" fill="#0F172A"/>
    
    <!-- Horizon warm glow -->
    <rect x="32" y="70" width="176" height="50" fill="url(#horizonGlow)"/>

    <!-- Sun -->
    <circle cx="180" cy="70" r="14" fill="#F59E0B"/>
    <circle cx="180" cy="70" r="20" fill="#F59E0B" opacity="0.2"/>

    <!-- TRANSFORMATION METAPHOR: Solar Arrays merging into Ocean Waves -->
    <!-- Lower Half: Deep Blue Ocean Base -->
    <path d="M32 140 Q70 125 120 140 Q170 155 208 140 L208 208 L32 208 Z" fill="url(#oceanGrad)"/>

    <!-- Stylized Ocean Waves (Bottom) -->
    <path d="M32 165 C 60 150, 90 180, 120 165 C 150 150, 180 180, 208 165 L208 208 L32 208 Z" fill="#0369A1" opacity="0.6"/>
    <path d="M32 185 C 50 175, 80 195, 120 185 C 160 175, 190 195, 208 185 L208 208 L32 208 Z" fill="#0C4A6E" opacity="0.8"/>

    <!-- UPPER-MID: Neat rows of Solar Photovoltaic Panels (The Object) -->
    <g transform="translate(0, 10)">
      <!-- Panel Row 3 (Back) -->
      <g fill="#0284C7" stroke="#38BDF8" stroke-width="1.5">
        <rect x="45" y="65" width="38" height="22" rx="2" transform="skewX(-15)" />
        <rect x="88" y="65" width="38" height="22" rx="2" transform="skewX(-15)" />
        <rect x="131" y="65" width="38" height="22" rx="2" transform="skewX(-15)" />
      </g>
      
      <!-- Panel Row 2 (Middle) -->
      <g fill="#0369A1" stroke="#38BDF8" stroke-width="1.5">
        <rect x="38" y="92" width="46" height="26" rx="2" transform="skewX(-15)" />
        <rect x="90" y="92" width="46" height="26" rx="2" transform="skewX(-15)" />
        <rect x="142" y="92" width="46" height="26" rx="2" transform="skewX(-15)" />
      </g>

      <!-- Panel Row 1 (Front - Vibrant Solar Blue) -->
      <g fill="url(#solarShimmer)" stroke="#7DD3FC" stroke-width="1.5">
        <rect x="30" y="122" width="54" height="30" rx="3" transform="skewX(-15)" />
        <line x1="57" y1="122" x2="52" y2="152" stroke="#0284C7" stroke-width="1.5" />
        
        <rect x="91" y="122" width="54" height="30" rx="3" transform="skewX(-15)" />
        <line x1="118" y1="122" x2="113" y2="152" stroke="#0284C7" stroke-width="1.5" />
        
        <rect x="152" y="122" width="54" height="30" rx="3" transform="skewX(-15)" />
        <line x1="179" y1="122" x2="174" y2="152" stroke="#0284C7" stroke-width="1.5" />
      </g>
    </g>

    <!-- Visual Metaphor Connector: Glowing bridge/sparkles showing "Resemblance / 好似" -->
    <g opacity="0.85">
      <circle cx="75" cy="135" r="3" fill="#F59E0B"/>
      <circle cx="120" cy="140" r="4" fill="#F59E0B"/>
      <circle cx="165" cy="135" r="3" fill="#F59E0B"/>
      <!-- Subtle upward flowing light nodes -->
      <path d="M75 145 Q97 125 120 145 Q143 125 165 145" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>
  </g>

  <!-- Sleek Outer Ring Border -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Accent Focus Node (Top Right) -->
  <circle cx="195" cy="65" r="6" fill="#F59E0B"/>
  <circle cx="195" cy="65" r="10" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
</svg>