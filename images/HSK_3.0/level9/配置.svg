<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Laptop Chassis -->
  <path d="M50 160h140v10H50z" fill="#4A5568"/>
  <path d="M60 70h120v90H60z" fill="#2D3748"/>
  <path d="M65 75h110v80H65z" fill="#1A202C"/>
  
  <!-- Hardware Components (The "Configuration") -->
  <!-- CPU/Processor chip -->
  <rect x="80" y="90" width="30" height="30" rx="2" fill="#F6AD55"/>
  <rect x="85" y="95" width="20" height="20" rx="1" fill="#1A202C"/>
  
  <!-- RAM sticks -->
  <rect x="120" y="90" width="10" height="50" rx="2" fill="#63B3ED"/>
  <rect x="135" y="90" width="10" height="50" rx="2" fill="#63B3ED"/>
  
  <!-- GPU/Graphics chip -->
  <rect x="150" y="110" width="20" height="30" rx="2" fill="#F6AD55"/>
  <circle cx="160" cy="125" r="7" fill="#1A202C"/>
  
  <!-- Decorative lines for technical feel -->
