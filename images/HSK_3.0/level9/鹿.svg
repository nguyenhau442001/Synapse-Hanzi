<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle Forest/Stream Background Elements (Dark Mode) -->
  <path d="M 0 190 Q 60 175 120 185 T 240 180 L 240 240 L 0 240 Z" fill="#222831"/>
  <path d="M 0 205 Q 80 195 160 210 T 240 200 L 240 240 L 0 240 Z" fill="#161920"/>
  
  <!-- Stream/Water accent -->
  <path d="M 130 215 Q 170 210 240 220 L 240 240 L 110 240 Z" fill="#2E4057" opacity="0.4"/>
  <path d="M 150 222 Q 190 218 240 225" stroke="#4F5D75" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Pine trees background silhouettes -->
  <polygon points="30,190 40,155 50,190" fill="#222A35"/>
  <polygon points="50,195 60,160 70,195" fill="#222A35"/>
  <polygon points="15,195 23,165 31,195" fill="#1E2530"/>

  <!-- Main Subject: Sika Deer (梅花鹿) - Sleek Flat Vector Design -->
  <g transform="translate(30, 25)">
    <!-- Back legs -->
    <path d="M 75 120 L 70 158 L 65 158" stroke="#D08C48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 135 125 L 140 158 L 145 158" stroke="#D08C48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Body (Torso & Hips) -->
    <ellipse cx="105" cy="115" rx="38" ry="24" fill="#E59853"/>
    
    <!-- Front legs -->
    <path d="M 85 125 L 82 160 L 77 160" stroke="#D08C48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 125 125 L 128 160 L 133 160" stroke="#D08C48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Neck & Head (Graceful upward pose) -->
    <path d="M 120 105 Q 140 80 148 55" stroke="#E59853" stroke-width="16" stroke-linecap="round" fill="none"/>
    
    <!-- Head -->
    <path d="M 142 50 Q 162 42 168 55 Q 162 62 142 58 Z" fill="#E59853"/>
    
    <!-- Ears -->
    <ellipse cx="148" cy="44" rx="4" ry="8" transform="rotate(-20 148 44)" fill="#D08C48"/>
    
    <!-- Antlers (Gold/Amber Accent for Focus) -->
    <g stroke="#F4A261" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 152 44 Q 155 25 142 12"/>
      <path d="M 148 30 L 138 22"/>
      <path d="M 150 22 L 158 15"/>
    </g>

    <!-- White Spots on Deer (梅花鹿 markings) -->
    <circle cx="95" cy="105" r="2" fill="#FFF" opacity="0.8"/>
    <circle cx="105" cy="102" r="2.5" fill="#FFF" opacity="0.8"/>
    <circle cx="115" cy="107" r="2" fill="#FFF" opacity="0.8"/>
    <circle cx="100" cy="118" r="2.5" fill="#FFF" opacity="0.8"/>
    <circle cx="112" cy="116" r="2" fill="#FFF" opacity="0.8"/>
    <circle cx="122" cy="112" r="1.5" fill="#FFF" opacity="0.8"/>
    <circle cx="88" cy="110" r="1.5" fill="#FFF" opacity="0.8"/>
  </g>

  <!-- Foreground foliage accents (Nature Reserve context) -->
  <path d="M 0 240 Q 20 210 40 240 Z" fill="#2E3B4E"/>
  <path d="M 210 240 Q 225 215 240 235 Z" fill="#2E3B4E"/>
</svg>