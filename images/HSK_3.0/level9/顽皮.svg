<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Garden context) -->
  <path d="M40 200 C80 180, 160 180, 200 200" stroke="#2B303C" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Persimmon Tree Branch -->
  <path d="M20 90 C70 85, 130 110, 220 70" stroke="#5C4033" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M110 98 C130 70, 150 65, 170 60" stroke="#5C4033" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Persimmon Fruit -->
  <circle cx="185" cy="50" r="14" fill="#FF7A00"/>
  <path d="M185 36 Q190 40 185 44 Q180 40 185 36" fill="#3D2314"/>
  <rect x="183" y="34" width="4" height="4" fill="#3D2314"/>

  <!-- Leaves -->
  <path d="M70 75 C85 65, 95 80, 85 95 C75 90, 65 85, 70 75 Z" fill="#2E7D32"/>
  <path d="M140 85 C160 75, 170 95, 155 110 C140 105, 135 95, 140 85 Z" fill="#388E3C"/>

  <!-- Mischievous Cat (Playing / Rolling on the branch) -->
  <g transform="translate(100, 75)">
    <!-- Cat body curved playfully -->
    <path d="M10 30 C20 10, 50 10, 65 30 C75 45, 60 60, 45 50 C30 40, 40 25, 25 30 Z" fill="#FF9F43"/>
    
    <!-- Cat head (tilted upside down / sideways for mischief) -->
    <circle cx="20" cy="40" r="14" fill="#FF9F43"/>
    
    <!-- Cat Ears -->
    <polygon points="10,32 14,20 20,28" fill="#FF9F43"/>
    <polygon points="24,28 30,21 28,33" fill="#FF9F43"/>
    
    <!-- Face details (happy closed eyes representing playfulness) -->
    <path d="M14 38 Q17 41 20 38" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M22 38 Q25 41 28 38" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="21" cy="42" r="1.5" fill="#1A1D24"/>

    <!-- Paws raised playfully -->
    <circle cx="35" cy="20" r="4" fill="#FF9F43"/>
    <circle cx="45" cy="22" r="4" fill="#FF9F43"/>
    
    <!-- Back paws -->
    <circle cx="55" cy="45" r="4" fill="#FF9F43"/>

    <!-- Playful curved tail up in the air -->
    <path d="M65 35 C75 30, 80 15, 75 10" stroke="#FF9F43" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Motion lines / Sparkles of mischief -->
    <path d="M5 20 L2 15" stroke="#FFD000" stroke-width="2" stroke-linecap="round"/>
    <path d="M80 5 L85 2" stroke="#FFD000" stroke-width="2" stroke-linecap="round"/>
    <circle cx="75" cy="25" r="2" fill="#FFD000"/>
  </g>
</svg>