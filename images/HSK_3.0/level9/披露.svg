<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Document background / Closed state -->
    <rect x="70" y="55" width="100" height="130" rx="8" fill="#2D323E"/>
    
    <!-- Document lines (hidden/folded inside) -->
    <line x1="90" y1="85" x2="150" y2="85" stroke="#4B5364" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="105" x2="135" y2="105" stroke="#4B5364" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Unfolding/Revealing flap (The act of disclosure) -->
    <path d="M70 55 L170 55 L170 140 L120 185 L70 140 Z" fill="#3A4150" opacity="0.6"/>
    
    <!-- Radiant light / Exposure effect emitting from the revealed document -->
    <path d="M120 40 L120 25" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 50 L165 38" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 50 L75 38" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>

    <!-- Main document unfolding outward (Bright, revealed state) -->
    <g transform="translate(0, 8)">
      <path d="M 60 70 L 120 45 L 180 70 L 180 160 L 120 195 L 60 160 Z" fill="#252B36" stroke="#3B4252" stroke-width="2"/>
      <!-- Glowing inner document surface -->
      <path d="M 70 80 L 120 60 L 170 80 L 170 150 L 120 175 L 70 150 Z" fill="#2E3846"/>
      
      <!-- Revealed content / Data charts becoming visible -->
      <line x1="90" y1="95" x2="150" y2="95" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="115" x2="135" y2="115" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="135" x2="120" y2="135" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Magnifying glass symbolizing investigation and bringing to light -->
    <g transform="translate(110, 100)">
      <!-- Glass lens glow -->
      <circle cx="45" cy="45" r="32" fill="#1A1D24" fill-opacity="0.8"/>
      <!-- Lens rim -->
      <circle cx="45" cy="45" r="32" fill="none" stroke="#F59E0B" stroke-width="6"/>
      <!-- Lens glass reflection -->
      <path d="M 28 32 A 22 22 0 0 1 58 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
      <!-- Handle -->
      <line x1="22" y1="68" x2="2" y2="88" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>