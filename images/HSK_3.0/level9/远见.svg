<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Object: A sleek, modern astronomical telescope (representing looking far ahead, strategic foresight/tầm nhìn xa) -->
  
  <!-- Starry background details / horizon glow -->
  <circle cx="60" cy="70" r="1" fill="#4A5568"/>
  <circle cx="180" cy="60" r="1.5" fill="#4A5568"/>
  <circle cx="200" cy="110" r="1" fill="#4A5568"/>
  <circle cx="40" cy="120" r="1.2" fill="#4A5568"/>
  <path d="M20 180 L220 180" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>

  <!-- Telescope Tripod Legs -->
  <line x1="120" y1="130" x2="80" y2="180" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="130" x2="160" y2="180" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="130" x2="125" y2="182" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>

  <!-- Tripod Mount / Base -->
  <circle cx="120" cy="130" r="6" fill="#E2E8F0"/>

  <!-- Telescope Main Body (Angled upward for 'vision into the future/distance') -->
  <g transform="rotate(-30 120 115)">
    <!-- Main Tube -->
    <rect x="75" y="105" width="85" height="20" rx="4" fill="#E2E8F0"/>
    
    <!-- Focus knob -->
    <rect x="95" y="99" width="8" height="6" rx="2" fill="#D69E2E"/>

    <!-- Eyepiece -->
    <rect x="65" y="110" width="12" height="10" rx="2" fill="#4A5568"/>
    <circle cx="65" cy="115" r="3" fill="#D69E2E"/>

    <!-- Objective Lens Hood (Front) -->
    <path d="M 160 103 L 175 100 L 175 130 L 160 127 Z" fill="#CBD5E0"/>
    
    <!-- Lens Glass (Golden highlight for foresight/value) -->
    <ellipse cx="175" cy="115" rx="3" ry="15" fill="#D69E2E"/>
  </g>

  <!-- Glowing Focus / Target in the Distance (Representing the future goal/vision) -->
  <g transform="translate(185, 65)">
    <circle cx="0" cy="0" r="12" fill="#D69E2E" opacity="0.2"/>
    <circle cx="0" cy="0" r="7" fill="#D69E2E" opacity="0.4"/>
    <circle cx="0" cy="0" r="3" fill="#F6AD55"/>
    <!-- Light Rays / Sparkle -->
    <path d="M0 -10 L0 -16 M0 10 L0 16 M-10 0 L-16 0 M10 0 L16 0" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Connecting beam of light/sight (subtle dashed trajectory) -->
  <path d="M 140 95 Q 165 75 180 70" stroke="#D69E2E" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6"/>

</svg>