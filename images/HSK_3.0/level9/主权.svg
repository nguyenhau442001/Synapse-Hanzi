<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative globe grid -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#252A34" stroke-width="1.5" stroke-dasharray="4 4"/>
  <ellipse cx="120" cy="120" rx="70" ry="25" fill="none" stroke="#252A34" stroke-width="1.5"/>
  <ellipse cx="120" cy="120" rx="25" ry="70" fill="none" stroke="#252A34" stroke-width="1.5"/>

  <!-- Base platform / Territory -->
  <path d="M 60,155 L 120,135 L 180,155 L 120,175 Z" fill="#2A313C" stroke="#3A4454" stroke-width="2"/>
  <path d="M 60,155 L 60,168 L 120,188 L 120,175 Z" fill="#1F242D" stroke="#3A4454" stroke-width="2"/>
  <path d="M 180,155 L 180,168 L 120,188 L 120,175 Z" fill="#252B36" stroke="#3A4454" stroke-width="2"/>

  <!-- Shield base (Territorial integrity / Sovereignty symbol) -->
  <g transform="translate(120, 105)">
    <!-- Outer gold trim / Glow effect -->
    <path d="M 0,-42 C 22,-42 38,-35 38,-35 C 38,5 25,32 0,45 C -25,32 -38,5 -38,-35 C -38,-35 -22,-42 0,-42 Z" fill="#1F242D" stroke="#E6B800" stroke-width="4"/>
    
    <!-- Inner shield body -->
    <path d="M 0,-36 C 18,-36 32,-30 32,-30 C 32,3 21,27 0,38 C -21,27 -32,3 -32,-30 C -32,-30 -18,-36 0,-36 Z" fill="#2B3748"/>

    <!-- Emblem: Majestic golden pillar & laurel/map motif representing supreme authority and land -->
    <path d="M -3,-22 L 3,-22 L 3,18 L -3,18 Z" fill="#E6B800"/>
    <path d="M -7,-24 L 7,-24 L 8,-22 L -8,-22 Z" fill="#E6B800"/>
    <path d="M -8,18 L 8,18 L 10,22 L -10,22 Z" fill="#E6B800"/>
    
    <!-- Central star representing sovereign nation/core power -->
    <path d="M 0,-12 L 2.3,-5.3 L 9.4,-5.3 L 3.7,-1.2 L 5.9,5.5 L 0,1.3 L -5.9,5.5 L -3.7,-1.2 L -9.4,-5.3 L -2.3,-5.3 Z" fill="#FFD700"/>
  </g>

  <!-- Ground accent pin/marker highlighting supreme control -->
  <circle cx="120" cy="170" r="3" fill="#E6B800"/>
</svg>