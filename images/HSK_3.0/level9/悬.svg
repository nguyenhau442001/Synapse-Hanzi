<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background architectural structure implying high altitude -->
  <path d="M 60 210 L 180 210" stroke="#2A2F3A" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 120 40 L 120 210" stroke="#2A2F3A" stroke-width="1.5" opacity="0.4"/>

  <!-- Contrast element: Solid, stable ground platform at the bottom (Scale exaggeration / Visual contrast) -->
  <path d="M 30 205 L 90 205 L 80 215 L 40 215 Z" fill="#3A4252"/>
  <rect x="50" y="195" width="20" height="10" fill="#4E596E" rx="2"/>

  <!-- High altitude danger zone: Suspension element (lơ lửng / nguy hiểm) -->
  <!-- A tiny, precarious figure working high above, completely unattached -->
  
  <!-- Steel beam suspended in mid-air -->
  <rect x="70" y="75" width="100" height="8" rx="2" fill="#E65F2B"/>
  <circle cx="80" cy="79" r="2" fill="#1A1D24"/>
  <circle cx="160" cy="79" r="2" fill="#1A1D24"/>

  <!-- Tiny worker silhouette crouching precariously on the beam -->
  <g transform="translate(105, 45)">
    <!-- Body / Torso -->
    <path d="M 15 20 Q 20 15 25 20 L 27 28 L 13 28 Z" fill="#F39C12"/>
    <!-- Head with hard hat -->
    <circle cx="20" cy="11" r="5" fill="#F1C40F"/>
    <path d="M 14 10 L 26 10" stroke="#D35400" stroke-width="1.5"/>
    <!-- Limbs in unstable posture -->
    <path d="M 13 25 L 8 20" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
    <path d="M 27 25 L 32 20" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
    <path d="M 16 28 L 13 33" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
    <path d="M 24 28 L 27 33" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Visual indicators of extreme hazard, uncertainty, and height (chưa chắc chắn, nguy hiểm khó lường) -->
  <!-- Falling motion lines / drop zone below -->
  <path d="M 120 95 L 120 145" stroke="#E74C3C" stroke-width="2" stroke-dasharray="3 5" opacity="0.8"/>
  <path d="M 115 135 L 120 145 L 125 135" fill="none" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Warning / Danger accent glows -->
  <circle cx="120" cy="79" r="35" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="120" cy="79" r="50" fill="none" stroke="#E65F2B" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Floating warning particles / spatial tension -->
  <circle cx="75" cy="55" r="2" fill="#E74C3C" opacity="0.8"/>
  <circle cx="155" cy="110" r="1.5" fill="#E74C3C" opacity="0.6"/>
  <circle cx="140" cy="45" r="2.5" fill="#F1C40F" opacity="0.7"/>
  <circle cx="95" cy="120" r="1.5" fill="#F1C40F" opacity="0.5"/>
</svg>