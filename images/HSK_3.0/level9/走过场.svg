<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle floor line for spatial anchoring -->
  <line x1="40" y1="185" x2="200" y2="185" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- Background safety inspection zone elements (facade/superficial checklist) -->
  <!-- Clipboard hanging on a wall in the background, showing a simple rubber stamp implying routine check -->
  <rect x="160" y="70" width="45" height="55" rx="4" fill="#222733" stroke="#343B4C" stroke-width="2"/>
  <rect x="170" y="80" width="25" height="4" rx="2" fill="#343B4C"/>
  <rect x="170" y="90" width="18" height="4" rx="2" fill="#343B4C"/>
  <rect x="170" y="100" width="22" height="4" rx="2" fill="#343B4C"/>
  <!-- Faded checkmark icon on clipboard -->
  <path d="M173 114L178 119L190 107" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Dynamic Action: A worker character lazily walking past a safety hazard marker ("走过场" - superficial action) -->
  <!-- Hazard warning sign standing on the right, ignored or barely glanced at -->
  <polygon points="120,135 140,170 100,170" fill="#2A2F3D" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M120 145V158" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="164" r="1.5" fill="#F59E0B"/>

  <!-- Motion lines indicating walking motion passing by -->
  <path d="M50 120C65 115 85 115 95 120" fill="none" stroke="#343B4C" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  <path d="M45 135C60 130 80 130 90 135" fill="none" stroke="#343B4C" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>

  <!-- Character (Inspector/Worker doing a perfunctory walk-through) -->
  <!-- Head -->
  <circle cx="85" cy="95" r="12" fill="#4B5563"/>
  <!-- Safety helmet (yellow accent for focus) -->
  <path d="M71 93C71 85 78 80 85 80C92 80 99 85 99 93H71Z" fill="#F59E0B"/>
  <rect x="69" y="92" width="32" height="3" rx="1.5" fill="#D97706"/>

  <!-- Body / Uniform torso (slanted forward dynamically walking) -->
  <path d="M74 110L92 108L98 140L78 145Z" fill="#3B82F6"/>

  <!-- Arms in casual walk pose, holding nothing meaningful (emphasizing superficiality) -->
  <path d="M88 112L102 125L97 132" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 112L68 128" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>

  <!-- Legs walking stride -->
  <!-- Back leg -->
  <path d="M80 142L65 170L55 170" fill="none" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front leg -->
  <path d="M92 140L105 168L115 168" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Visual metaphor overlay: A large red superficial cross-out/swipe indicating "going through the motions" -->
  <path d="M55 75L185 165" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M185 75L55 165" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

</svg>