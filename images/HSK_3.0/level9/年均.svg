<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Calendar Base Object (representing annual / time) -->
  <g transform="translate(45, 45)">
    <!-- Calendar Body -->
    <rect x="20" y="25" width="110" height="100" rx="12" fill="#252A34" stroke="#3A4252" stroke-width="3"/>
    
    <!-- Calendar Header (Accent Color) -->
    <path d="M 32 25 L 118 25 A 12 12 0 0 1 130 37 L 130 50 L 20 50 L 20 37 A 12 12 0 0 1 32 25 Z" fill="#F59E0B"/>
    
    <!-- Rings -->
    <rect x="45" y="15" width="8" height="18" rx="4" fill="#64748B"/>
    <rect x="97" y="15" width="8" height="18" rx="4" fill="#64748B"/>
    
    <!-- Grid Dots (Days) -->
    <circle cx="45" cy="72" r="5" fill="#3A4252"/>
    <circle cx="75" cy="72" r="5" fill="#3A4252"/>
    <circle cx="105" cy="72" r="5" fill="#3A4252"/>
    
    <circle cx="45" cy="97" r="5" fill="#3A4252"/>
    <circle cx="75" cy="97" r="5" fill="#3A4252"/>
    <circle cx="105" cy="97" r="5" fill="#F59E0B"/>
  </g>

  <!-- Averaging / Equal distribution chart overlaid as the physical object attribute -->
  <g transform="translate(100, 115)">
    <!-- Backdrop card for chart -->
    <rect x="0" y="0" width="105" height="85" rx="10" fill="#1E232E" stroke="#3A4252" stroke-width="2"/>
    
    <!-- Axes -->
    <line x1="18" y1="65" x2="90" y2="65" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="20" x2="18" y2="68" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Equal level bars representing 'Average / Binh quan' -->
    <rect x="28" y="38" width="12" height="27" rx="3" fill="#38BDF8"/>
    <rect x="47" y="38" width="12" height="27" rx="3" fill="#38BDF8"/>
    <rect x="66" y="38" width="12" height="27" rx="3" fill="#38BDF8"/>
    
    <!-- Average Mean Line spanning across -->
    <line x1="22" y1="38" x2="86" y2="38" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="3,3"/>
  </g>
</svg>