<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to center attention -->
  <circle cx="120" cy="120" r="75" fill="#252A34" opacity="0.6"/>

  <!-- Scene: "啃" (Eating/gnawing a grilled corn cob hungrily) -->
  <g transform="translate(0, 5)">
    <!-- Character / Boy's Head (Chubby cheeks, energetic expression) -->
    <!-- Head base -->
    <path d="M 60 110 C 60 70, 100 70, 120 70 C 140 70, 180 70, 180 110 C 180 150, 150 175, 120 175 C 90 175, 60 150, 60 110 Z" fill="#FFD1A9"/>
    
    <!-- Chubby Cheeks / Blush -->
    <circle cx="82" cy="125" r="14" fill="#FFA384" opacity="0.6"/>
    <circle cx="158" cy="125" r="14" fill="#FFA384" opacity="0.6"/>

    <!-- Hair -->
    <path d="M 62 105 C 60 85, 75 70, 95 72 C 110 65, 130 65, 145 72 C 165 70, 180 85, 178 105 C 170 95, 150 90, 120 92 C 90 90, 70 95, 62 105 Z" fill="#2C3539"/>
    <path d="M 115 70 L 122 62 L 128 72 Z" fill="#2C3539"/>

    <!-- Eyes (Happily closed / crescent shaped for intense enjoyment) -->
    <path d="M 78 102 Q 88 94, 98 102" fill="none" stroke="#2C3539" stroke-width="4" stroke-linecap="round"/>
    <path d="M 142 102 Q 152 94, 162 102" fill="none" stroke="#2C3539" stroke-width="4" stroke-linecap="round"/>

    <!-- Big Open Happy Mouth (Chomping) -->
    <path d="M 90 128 C 90 128, 120 150, 150 128 C 150 155, 90 155, 90 128 Z" fill="#A83232"/>
    <!-- Teeth -->
    <path d="M 98 128 Q 120 136, 142 128" fill="white"/>

    <!-- Hands holding the corn -->
    <!-- Left hand -->
    <path d="M 68 152 C 58 145, 52 162, 62 172 C 72 182, 85 172, 78 160 Z" fill="#FFD1A9"/>
    <path d="M 68 152 C 58 145, 52 162, 62 172" fill="none" stroke="#E0A97F" stroke-width="2"/>

    <!-- Right hand -->
    <path d="M 172 152 C 182 145, 188 162, 178 172 C 168 182, 155 172, 162 160 Z" fill="#FFD1A9"/>
    <path d="M 172 152 C 182 145, 188 162, 178 172" fill="none" stroke="#E0A97F" stroke-width="2"/>

    <!-- The Corn Cob (Being gnawed right in the middle, showing a bite mark) -->
    <g transform="rotate(-15, 120, 135)">
      <!-- Corn Cob Body -->
      <rect x="55" y="122" width="130" height="30" rx="15" fill="#F4B41A"/>
      
      <!-- Kernels Grid / Texture -->
      <!-- Row 1 -->
      <line x1="75" y1="122" x2="75" y2="152" stroke="#E09E10" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="95" y1="122" x2="95" y2="152" stroke="#E09E10" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="115" y1="122" x2="115" y2="152" stroke="#E09E10" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="125" y1="122" x2="125" y2="152" stroke="#E09E10" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="145" y1="122" x2="145" y2="152" stroke="#E09E10" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="165" y1="122" x2="165" y2="152" stroke="#E09E10" stroke-width="2" stroke-dasharray="6,4"/>
      
      <!-- Horizontal kernel line -->
      <line x1="55" y1="137" x2="185" y2="137" stroke="#E09E10" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Bite Mark / Missing Section (Semantic core of "啃") -->
      <path d="M 112 122 C 122 132, 122 142, 112 152 Z" fill="#1A1D24"/>
      <path d="M 112 122 C 118 130, 118 144, 112 152" fill="none" stroke="#C6860D" stroke-width="2"/>

      <!-- Charred / Grilled Details (Orange/Brown spots) -->
      <circle cx="68" cy="130" r="3" fill="#D35400" opacity="0.6"/>
      <circle cx="85" cy="142" r="2.5" fill="#D35400" opacity="0.7"/>
      <circle cx="140" cy="132" r="3" fill="#D35400" opacity="0.6"/>
      <circle cx="160" cy="144" r="2" fill="#D35400" opacity="0.7"/>
      <circle cx="172" cy="130" r="2.5" fill="#D35400" opacity="0.5"/>

      <!-- Corn Husk Leaves at Ends -->
      <path d="M 45 125 Q 55 137, 45 149 Q 35 137, 45 125 Z" fill="#52B788"/>
      <path d="M 195 125 Q 185 137, 195 149 Q 205 137, 195 125 Z" fill="#52B788"/>
    </g>
  </g>

  <!-- Motion / Action lines emphasizing vigorous biting/gnawing ("啃") -->
  <path d="M 95 62 Q 105 52, 115 62" fill="none" stroke="#F4B41A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 130 58 Q 140 48, 150 58" fill="none" stroke="#F4B41A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 165 72 Q 178 68, 175 82" fill="none" stroke="#F4B41A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>