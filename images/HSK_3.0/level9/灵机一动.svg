  <!-- Geometric context: The pencil and the line -->
  <rect x="70" y="160" width="100" height="10" rx="2" fill="#4A5568"/>
  <path d="M170 165 L 200 140" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="140" r="4" fill="#F6AD55"/>
  
