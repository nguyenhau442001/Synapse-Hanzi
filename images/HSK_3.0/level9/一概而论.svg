<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Central Physical Object: A mechanical sorting/blending machine representing "treating different things as exactly the same" (一概而论) -->
    
    <!-- Machine Base & Stand -->
    <path d="M90 190 L150 190 L140 210 L100 210 Z" fill="#2E3440"/>
    <rect x="110" y="150" width="20" height="40" fill="#4C566A"/>
    
    <!-- Main Funnel / Hopper Body (Top) -->
    <path d="M70 70 L170 70 L145 130 L95 130 Z" fill="#3B4252" stroke="#4C566A" stroke-width="2"/>
    <rect x="85" y="60" width="70" height="12" rx="4" fill="#E5C07B"/>

    <!-- Distinct Objects entering from the top (Triangle, Circle, Square) -->
    <!-- Triangle (Red/Coral) -->
    <polygon points="95,45 105,25 115,45" fill="#E06C75"/>
    <!-- Circle (Blue) -->
    <circle cx="120,35" r="10" fill="#61AFEF"/>
    <!-- Square (Green) -->
    <rect x="130" y="25" width="18" height="18" rx="2" fill="#98C379"/>
    
    <!-- Downward motion arrows into hopper -->
    <path d="M120 48 L120 58" stroke="#ABB2BF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>

    <!-- Central Processing Chamber / Core -->
    <rect x="90" y="130" width="60" height="30" rx="4" fill="#2E3440" stroke="#E5C07B" stroke-width="2"/>
    <circle cx="120" cy="145" r="8" fill="#E5C07B"/>
    <!-- Cog teeth around core -->
    <path d="M116 130 L116 126 L124 126 L124 130" fill="#E5C07B"/>
    <path d="M116 160 L116 164 L124 164 L124 160" fill="#E5C07B"/>

    <!-- Output Conveyor / Chute at Bottom -->
    <path d="M70 175 L170 175 L160 190 L80 190 Z" fill="#4C566A"/>

    <!-- Identical Uniform Output Objects (Forced into identical grey disks) -->
    <circle cx="100" cy="182.5" r="6" fill="#ABB2BF"/>
    <circle cx="120" cy="182.5" r="6" fill="#ABB2BF"/>
    <circle cx="140" cy="182.5" r="6" fill="#ABB2BF"/>

    <!-- Eject / Arrow indicator for uniform output -->
    <path d="M175 182.5 L190 182.5 M185 178.5 L190 182.5 L185 186.5" stroke="#E06C75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Warning / Equalization Symbol badge overlay (representing forced generalization) -->
    <circle cx="185" cy="95" r="16" fill="#2E3440" stroke="#E06C75" stroke-width="2"/>
    <!-- Equals sign with a slash or strict equal -->
    <rect x="177" y="91" width="16" height="3" rx="1.5" fill="#E06C75"/>
    <rect x="177" y="97" width="16" height="3" rx="1.5" fill="#E06C75"/>
  </g>
</svg>