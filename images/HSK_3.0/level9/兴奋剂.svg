<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glow effect behind the central medical/doping object -->
  <circle cx="120" cy="120" r="70" fill="#2D3748" opacity="0.4"/>
  
  <!-- Subtle warning / restriction backdrop elements -->
  <circle cx="120" cy="120" r="54" fill="none" stroke="#E53E3E" stroke-width="4" stroke-dasharray="8 6" opacity="0.7"/>

  <!-- Syringe Body / Doping Injection Concept (Noun Representation) -->
  <g transform="rotate(-45 120 120)">
    <!-- Plunger rod -->
    <rect x="114" y="45" width="12" height="40" rx="3" fill="#A0AEC0"/>
    <rect x="106" y="45" width="28" height="6" rx="2" fill="#E2E8F0"/>

    <!-- Barrel / Tube -->
    <rect x="104" y="80" width="32" height="85" rx="4" fill="#2B6CB0" fill-opacity="0.3" stroke="#63B3ED" stroke-width="3"/>
    
    <!-- Liquid inside syringe (high-contrast accent color for chemical stimulant) -->
    <rect x="108" y="100" width="24" height="60" rx="2" fill="#F6AD55"/>
    
    <!-- Measurement ticks on syringe -->
    <line x1="112" y1="115" x2="118" y2="115" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="112" y1="130" x2="118" y2="130" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="112" y1="145" x2="118" y2="145" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Needle Hub -->
    <rect x="114" y="165" width="12" height="12" rx="2" fill="#718096"/>

    <!-- Sharp Needle -->
    <polygon points="117,177 123,177 120,210" fill="#E2E8F0"/>
  </g>

  <!-- Prohibition / Banned stamp overlay (Red slash / cross over the object) -->
  <circle cx="120" cy="120" r="72" fill="none" stroke="#E53E3E" stroke-width="8" opacity="0.9"/>
  <line x1="70" y1="70" x2="170" y2="170" stroke="#E53E3E" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

  <!-- Small accent sparkles for clarity -->
  <path d="M 65 90 L 68 96 L 74 99 L 68 102 L 65 108 L 62 102 L 56 99 L 62 96 Z" fill="#F6AD55" opacity="0.8"/>
  <path d="M 175 140 L 177 144 L 181 146 L 177 148 L 175 152 L 173 148 L 169 146 L 173 144 Z" fill="#F6AD55" opacity="0.6"/>
</svg>