<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "无可厚非" (nothing to blame/understandable choice): 
       A person standing at a crossroads, choosing a path of safety (shelter) 
       during a storm, with a neutral, balanced scale icon representing 
       the "reasonableness" of the decision. -->
  
  <!-- The Person -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="-45" r="12" fill="#E0E0E0"/>
    <path d="M-15 0 L-10 -30 L10 -30 L15 0 Z" fill="#4A90E2"/>
    <path d="M-10 0 L-10 40 M10 0 L10 40" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- The Shelter/Safety Concept -->
  <path d="M60 180 L180 180 L160 130 L80 130 Z" fill="#34495E"/>
  <path d="M70 130 L120 90 L170 130" fill="#E67E22"/>

  <!-- The Scale of Reason (Balanced) -->
  <g transform="translate(120, 60)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#F1C40F" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#F1C40F" stroke-width="4"/>
    <circle cx="-30" cy="10" r="8" fill="#BDC3C7"/>
    <circle cx="30" cy="10" r="8" fill="#BDC3C7"/>
  </g>

  <!-- Rain/Storm elements (Contextual) -->
  <line x1="40" y1="40" x2="50" y2="60" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="190" y1="40" x2="200" y2="60" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="200" y1="80" x2="210" y2="100" stroke="#7F8C8D" stroke-width="2"/>
</svg>