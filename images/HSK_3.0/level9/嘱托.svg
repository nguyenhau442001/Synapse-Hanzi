<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/pedestal -->
  <circle cx="120" cy="130" r="70" fill="#242933" opacity="0.6"/>
  <ellipse cx="120" cy="180" rx="40" ry="8" fill="#111318" opacity="0.8"/>

  <!-- Conceptual Representation of "嘱托" (Entrusted commission / Earnest advice & responsibility) -->
  <!-- Illustrated as an ornate, glowing official document/scroll being securely passed between hands, representing trust and responsibility. -->

  <!-- Arms / Hands representing the handover of trust -->
  <!-- Left hand (Passing/Entrusting) -->
  <path d="M 40 145 C 55 135, 75 135, 85 145 C 90 150, 92 160, 85 170 L 45 170 Z" fill="#3E4C59"/>
  <path d="M 65 142 L 83 150 L 78 165 L 60 155 Z" fill="#526478"/>

  <!-- Right hand (Receiving/Accepting the responsibility) -->
  <path d="M 200 145 C 185 135, 165 135, 155 145 C 150 150, 148 160, 155 170 L 195 170 Z" fill="#3E4C59"/>
  <path d="M 175 142 L 157 150 L 162 165 L 180 155 Z" fill="#526478"/>

  <!-- The Document / Scroll (Symbolizing the earnest words/trust) -->
  <g transform="translate(120, 110)">
    <!-- Scroll background glow -->
    <circle cx="0" cy="0" r="45" fill="#F59E0B" opacity="0.1"/>
    
    <!-- Document Body -->
    <rect x="-35" y="-25" width="70" height="50" rx="4" fill="#2D3748" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Inner lines representing text/message -->
    <line x1="-25" y1="-12" x2="25" y2="-12" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="-25" y1="0" x2="15" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="-25" y1="12" x2="5" y2="12" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Gold Wax Seal (Symbolizing official trust/gravity) -->
    <circle cx="18" cy="12" r="8" fill="#F59E0B"/>
    <circle cx="18" cy="12" r="5" fill="#D97706"/>

    <!-- Left & Right Scroll Handles -->
    <rect x="-42" y="-30" width="8" height="60" rx="4" fill="#F59E0B"/>
    <rect x="34" y="-30" width="8" height="60" rx="4" fill="#F59E0B"/>
  </g>

  <!-- Accent sparkles indicating importance, gravity, and earnestness -->
  <g fill="#F59E0B">
    <path d="M 120 45 L 122.5 52.5 L 130 55 L 122.5 57.5 L 120 65 L 117.5 57.5 L 110 55 L 117.5 52.5 Z" opacity="0.9"/>
    <path d="M 85 75 L 86.5 79.5 L 91 81 L 86.5 82.5 L 85 87 L 83.5 82.5 L 79 81 L 83.5 79.5 Z" opacity="0.6"/>
    <path d="M 155 75 L 156.5 79.5 L 161 81 L 156.5 82.5 L 155 87 L 153.5 82.5 L 149 81 L 153.5 79.5 Z" opacity="0.6"/>
  </g>
</svg>