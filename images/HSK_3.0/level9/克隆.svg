<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle laboratory grid background pattern -->
  <g opacity="0.15">
    <path d="M40,0 V240 M80,0 V240 M120,0 V240 M160,0 V240 M200,0 V240" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 4"/>
    <path d="M0,40 H240 M0,80 H240 M0,120 H240 M0,160 H240 M0,200 H240" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 4"/>
  </g>

  <!-- Central Cloning Concept Illustration -->
  <g transform="translate(0, 5)">
    <!-- DNA Strand Background Glow / Helix Axis -->
    <path d="M120,35 Q100,70 120,105 Q140,140 120,175" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.3" stroke-dasharray="4 4"/>

    <!-- Left Original Sheep (Primary Focus - Amber/Gold Accent) -->
    <g transform="translate(62, 95)">
      <!-- Body & Wool -->
      <path d="M-18,-15 C-25,-15 -30,-5 -30,5 C-30,15 -22,22 -12,22 C-8,22 -5,20 -2,22 C1,24 5,22 8,22 C18,22 25,15 25,5 C25,-5 20,-15 12,-15 C8,-15 5,-13 0,-15 C-5,-15 -12,-15 -18,-15 Z" fill="#F59E0B"/>
      <!-- Head -->
      <path d="M-28, -2 C-38,-2 -40,12 -30,14 C-25,15 -22,10 -22,5 Z" fill="#D97706"/>
      <!-- Face & Ear -->
      <circle cx="-31" cy="6" r="3" fill="#1A1D24"/>
      <path d="M-26,-2 L-32,-7" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Legs -->
      <rect x="-14" y="21" width="4" height="15" rx="2" fill="#D97706"/>
      <rect x="4" y="21" width="4" height="15" rx="2" fill="#D97706"/>
    </g>

    <!-- Holographic / Cloning Process Transfer Rays (Center) -->
    <g transform="translate(120, 112)">
      <!-- Scan / Replication Beam -->
      <polygon points="0,-40 -28,25 28,25" fill="#38BDF8" opacity="0.15"/>
      <line x1="0" y1="-45" x2="0" y2="35" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>
      
      <!-- DNA Double Helix node icon floating up -->
      <circle cx="0" cy="-15" r="8" fill="#1A1D24" stroke="#38BDF8" stroke-width="2"/>
      <path d="M-4,-18 C-2,-12 2,-18 4,-12" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-4,-12 C-2,-18 2,-12 4,-18" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Right Cloned Sheep (Sleek Cyan/Blue Modern Tech Accent) -->
    <g transform="translate(178, 95)">
      <!-- Body & Wool -->
      <path d="M-18,-15 C-25,-15 -30,-5 -30,5 C-30,15 -22,22 -12,22 C-8,22 -5,20 -2,22 C1,24 5,22 8,22 C18,22 25,15 25,5 C25,-5 20,-15 12,-15 C8,-15 5,-13 0,-15 C-5,-15 -12,-15 -18,-15 Z" fill="#38BDF8"/>
      <!-- Head -->
      <path d="M-28, -2 C-38,-2 -40,12 -30,14 C-25,15 -22,10 -22,5 Z" fill="#0EA5E9"/>
      <!-- Face & Ear -->
      <circle cx="-31" cy="6" r="3" fill="#1A1D24"/>
      <path d="M-26,-2 L-32,-7" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Legs -->
      <rect x="-14" y="21" width="4" height="15" rx="2" fill="#0EA5E9"/>
      <rect x="4" y="21" width="4" height="15" rx="2" fill="#0EA5E9"/>
    </g>

    <!-- Futuristic Lab Platform / Pod Base -->
    <path d="M50,142 L190,142 C198,142 202,148 198,154 L182,176 C179,180 174,182 168,182 H72 C66,182 61,180 58,176 L42,154 C38,148 42,142 50,142 Z" fill="#252830" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Platform Tech Accents (Glow lines) -->
    <line x1="70" y1="162" x2="170" y2="162" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
    <circle cx="120" cy="162" r="3" fill="#38BDF8"/>
    <circle cx="95" cy="162" r="1.5" fill="#F59E0B"/>
    <circle cx="145" cy="162" r="1.5" fill="#38BDF8"/>
  </g>
</svg>