<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Deep sea cage structure -->
  <g transform="translate(60, 70)">
    <!-- Main circular frame -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="#FFB347" stroke-width="6" stroke-dasharray="8 4"/>
    
    <!-- Netting structure -->
    <path d="M60 10 L60 110 M10 60 L110 60 M25 25 L95 95 M95 25 L25 95" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
    
    <!-- Fish inside the cage -->
    <path d="M40 50 L55 45 L40 40 Z" fill="#FFD700"/>
    <path d="M75 75 L90 70 L75 65 Z" fill="#FFD700"/>
    <path d="M50 80 L65 75 L50 70 Z" fill="#FFD700"/>
    <path d="M80 45 L95 40 L80 35 Z" fill="#FFD700"/>
  </g>

  <!-- Water surface line -->
  <path d="M20 60 L220 60" stroke="#2C3E50" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Decorative bubbles -->
  <circle cx="180" cy="150" r="4" fill="#4A90E2" opacity="0.3"/>
  <circle cx="190" cy="140" r="6" fill="#4A90E2" opacity="0.3"/>
  <circle cx="200" cy="160" r="3" fill="#4A90E2" opacity="0.3"/>
</svg>