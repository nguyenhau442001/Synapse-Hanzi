<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative shadow/glow for depth -->
  <circle cx="120" cy="120" r="80" fill="#252A34" opacity="0.5"/>

  <!-- Document / Contract Base -->
  <g transform="translate(65, 45)">
    <rect x="0" y="0" width="110" height="150" rx="6" fill="#2E3544"/>
    <!-- Document Header lines -->
    <rect x="18" y="24" width="74" height="6" rx="3" fill="#4B5563"/>
    <rect x="18" y="42" width="50" height="4" rx="2" fill="#4B5563"/>
    
    <!-- Body text lines -->
    <rect x="18" y="65" width="74" height="4" rx="2" fill="#3B4252"/>
    <rect x="18" y="77" width="60" height="4" rx="2" fill="#3B4252"/>
    <rect x="18" y="89" width="74" height="4" rx="2" fill="#3B4252"/>
    
    <!-- Signature line -->
    <line x1="18" y1="125" x2="60" y2="125" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
    <!-- Red Seal / Stamp representing official deposit agreement -->
    <circle cx="82" cy="120" r="14" fill="#EF4444" opacity="0.85"/>
    <circle cx="82" cy="120" r="10" fill="none" stroke="#FEE2E2" stroke-width="1.5"/>
    <path d="M77 120 L81 124 L88 116" fill="none" stroke="#FEE2E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Deposit Element: Key resting on the contract (Rent/Property Security Deposit context) -->
  <g transform="translate(0, 5)">
    <!-- Key shadow -->
    <circle cx="92" cy="117" r="16" fill="#111827" opacity="0.3"/>
    <path d="M92 103 L172 133" stroke="#111827" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

    <!-- Gold Key -->
    <!-- Bow (Handle) -->
    <circle cx="92" cy="110" r="15" fill="none" stroke="#F59E0B" stroke-width="6"/>
    <circle cx="92" cy="110" r="6" fill="#1A1D24"/>
    
    <!-- Shaft -->
    <line x1="104" y1="114" x2="168" y2="138" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Teeth -->
    <path d="M148 130 L154 142 M158 134 L164 146" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Stack of Deposit Coins overlapping at the bottom right -->
  <g transform="translate(145, 140)">
    <!-- Coin 3 (Bottom) -->
    <ellipse cx="25" cy="45" rx="22" ry="10" fill="#D97706"/>
    <path d="M3 45 v10 c0 5.5 9.8 10 22 10 s22 -4.5 22 -10 v-10" fill="#D97706"/>
    
    <!-- Coin 2 (Middle) -->
    <ellipse cx="20" cy="30" rx="22" ry="10" fill="#F59E0B"/>
    <path d="M-2 30 v10 c0 5.5 9.8 10 22 10 s22 -4.5 22 -10 v-10" fill="#F59E0B"/>
    <ellipse cx="20" cy="30" rx="12" ry="5" fill="none" stroke="#D97706" stroke-width="2"/>

    <!-- Coin 1 (Top) -->
    <ellipse cx="15" cy="15" rx="22" ry="10" fill="#FBBF24"/>
    <path d="M-7 15 v10 c0 5.5 9.8 10 22 10 s22 -4.5 22 -10 v-10" fill="#FBBF24"/>
    <ellipse cx="15" cy="15" rx="12" ry="5" fill="none" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Highlight accent badge (Focus frame) -->
  <rect x="20" y="20" width="200" height="200" rx="16" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
</svg>