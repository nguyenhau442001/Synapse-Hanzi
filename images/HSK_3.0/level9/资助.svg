<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/pedestal representing financial support foundation -->
  <ellipse cx="120" cy="180" rx="70" ry="16" fill="#252A34" opacity="0.8"/>
  <ellipse cx="120" cy="180" rx="45" ry="10" fill="#2F3644" opacity="0.6"/>

  <!-- Physical Object representing "资助" (Financial Support/Funding: A piggy bank/chest with rising gold coins and graduation mortarboard) -->
  <!-- Treasure Chest / Financial Fund Base -->
  <g transform="translate(60, 110)">
    <!-- Chest Back/Shadow -->
    <rect x="0" y="30" width="120" height="35" rx="6" fill="#2F3644"/>
    <!-- Chest Body -->
    <path d="M 0 35 L 120 35 L 114 70 C 114 73 111 75 108 75 L 12 75 C 9 75 6 73 6 70 Z" fill="#3B4252"/>
    <path d="M 12 75 L 108 75 L 112 80 C 112 83 109 85 106 85 L 14 85 C 11 85 8 83 8 80 Z" fill="#2F3644"/>
    
    <!-- Gold Trim / Details on Chest -->
    <rect x="0" y="45" width="120" height="6" fill="#F59E0B" opacity="0.3"/>
    
    <!-- Chest Lid (Open / Angled Up) -->
    <path d="M -2 32 C -2 15, 12 5, 60 5 C 108 5, 122 15, 122 32 Z" fill="#4B5563"/>
    <path d="M 2 32 C 2 18, 14 10, 60 10 C 106 10, 118 18, 118 32 Z" fill="#3B4252"/>
    <rect x="52" y="30" width="16" height="12" rx="3" fill="#F59E0B"/>
    <circle cx="60" cy="36" r="3" fill="#1A1D24"/>

    <!-- Inside Glow -->
    <ellipse cx="60" cy="32" rx="45" ry="8" fill="#F59E0B" opacity="0.2"/>
  </g>

  <!-- Gold Coins / Funds Flowing Up -->
  <g>
    <!-- Coin 1 (Lower) -->
    <ellipse cx="120" cy="100" rx="14" ry="7" fill="#D97706"/>
    <ellipse cx="120" cy="98" rx="14" ry="7" fill="#F59E0B"/>
    <ellipse cx="120" cy="98" rx="9" ry="4" fill="#FBBF24"/>

    <!-- Coin 2 (Middle) -->
    <ellipse cx="105" cy="75" rx="12" ry="6" fill="#D97706"/>
    <ellipse cx="105" cy="73" rx="12" ry="6" fill="#F59E0B"/>
    <ellipse cx="105" cy="73" rx="7" ry="3.5" fill="#FBBF24"/>

    <!-- Coin 3 (Higher) -->
    <ellipse cx="135" cy="65" rx="10" ry="5" fill="#D97706"/>
    <ellipse cx="135" cy="63" rx="10" ry="5" fill="#F59E0B"/>
    <ellipse cx="135" cy="63" rx="6" ry="3" fill="#FBBF24"/>
  </g>

  <!-- Graduation Cap (Representing Education / Returning to School Context) -->
  <g transform="translate(120, 50)">
    <!-- Cap Board (Diamond shape flattened) -->
    <polygon points="0,-18 35,0 0,18 -35,0" fill="#3B82F6"/>
    <polygon points="0,-15 30,0 0,15 -30,0" fill="#60A5FA"/>
    
    <!-- Cap Skull Cap (Bottom part) -->
    <path d="M -15 6 L 15 6 L 15 16 C 15 22, -15 22, -15 16 Z" fill="#2563EB"/>

    <!-- Tassel -->
    <path d="M 0 0 L 22 10 L 24 22" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="23" r="3" fill="#F59E0B"/>
  </g>

  <!-- Supporting Hands / Care Motif supporting from below -->
  <g transform="translate(120, 185)">
    <!-- Left Hand -->
    <path d="M -20 10 C -35 10, -50 0, -60 -15 C -65 -22, -55 -25, -48 -18 C -38 -8, -25 -5, -15 -2 Z" fill="#E2E8F0" opacity="0.9"/>
    <!-- Right Hand -->
    <path d="M 20 10 C 35 10, 50 0, 60 -15 C 65 -22, 55 -25, 48 -18 C 38 -8, 25 -5, 15 -2 Z" fill="#E2E8F0" opacity="0.9"/>
  </g>

  <!-- Sparkles / Success Indicators -->
  <g fill="#FBBF24" opacity="0.8">
    <!-- Top Left Sparkle -->
    <path d="M 75 45 Q 75 55 65 55 Q 75 55 75 65 Q 75 55 85 55 Q 75 55 75 45 Z"/>
    <!-- Top Right Sparkle -->
    <path d="M 170 85 Q 170 92 163 92 Q 170 92 170 99 Q 170 92 177 92 Q 170 92 170 85 Z"/>
  </g>
</svg>