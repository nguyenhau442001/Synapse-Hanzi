<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Large, stable figure representing the strong/supportive entity -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="15" fill="#FFB84D"/>
    <path d="M5 45 Q20 35 35 45 L35 120 Q20 110 5 120 Z" fill="#FFB84D"/>
    <path d="M10 50 L30 50 M15 60 L25 60" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small, fragile figure representing the 'weak' (ruòshì) entity -->
  <g transform="translate(60, 130)">
    <circle cx="12" cy="12" r="8" fill="#8E9AAF"/>
    <path d="M4 25 Q12 20 20 25 L20 60 Q12 55 4 60 Z" fill="#8E9AAF"/>
  </g>

  <!-- Supportive gesture: Large hand gently guiding/protecting the smaller figure -->
  <path d="M130 90 C110 90 90 100 80 120" stroke="#FFB84D" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M85 115 L80 120 L85 125" stroke="#FFB84D" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Ground plane -->
  <path d="M40 190 L200 190" stroke="#3E4451" stroke-width="2" stroke-dasharray="4 4"/>
</svg>