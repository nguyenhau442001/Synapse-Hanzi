<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Night sky background segment -->
  <path d="M0 0h240v120H0z" fill="#1A1D24"/>
  
  <!-- Sunrise horizon line -->
  <path d="M0 120h240" stroke="#FFB347" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Laboratory window frame -->
  <rect x="40" y="40" width="160" height="160" rx="8" fill="none" stroke="#374151" stroke-width="4"/>
  
  <!-- Person working at desk -->
  <g transform="translate(60, 100)">
    <rect x="20" y="60" width="80" height="40" rx="4" fill="#2D3436"/>
    <path d="M40 60V30h40v30" fill="#374151"/>
    <circle cx="60" cy="20" r="15" fill="#E5E7EB"/>
    <path d="M50 80h20v10H50z" fill="#4B5563"/>
  </g>
  
  <!-- The "Until" transition: Fading stars to Sun -->
  <circle cx="180" cy="60" r="4" fill="#F3F4F6"/>
  <circle cx="200" cy="40" r="3" fill="#F3F4F6"/>
  
  <!-- Sunrise glow at the horizon -->
  <path d="M0 120h240l-20-40H20z" fill="url(#grad1)" opacity="0.6"/>
  <defs>
    <linearGradient id="grad1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- The Sun rising -->
  <circle cx="120" cy="120" r="25" fill="#FFB347"/>
</svg>