<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle bridge pier / foundation context backdrop -->
  <path d="M 60 170 L 180 170 L 190 190 L 50 190 Z" fill="#252A34"/>
  <rect x="100" y="110" width="40" height="60" fill="#2F3643" rx="4"/>
  <rect x="90" y="100" width="60" height="14" fill="#3A4252" rx="3"/>

  <!-- Main Object: A massive concrete/steel bridge pillar section representing physical construction -->
  <g>
    <!-- Left half (Completed structural block, bright accent orange/gold) -->
    <path d="M 95 60 
             L 120 60 
             L 120 150 
             L 95 150 Z" 
          fill="#FF9F43"/>
    
    <!-- Right half (Uncompleted structural outline / grid, slate blue) -->
    <path d="M 120 60 
             L 145 60 
             L 145 150 
             L 120 150 Z" 
          fill="#31394B"/>
    
    <!-- Internal structural details - Left (Solid/Completed > 50%) -->
    <rect x="102" y="70" width="10" height="15" rx="2" fill="#E67E22" opacity="0.8"/>
    <rect x="102" y="95" width="10" height="15" rx="2" fill="#E67E22" opacity="0.8"/>
    <rect x="102" y="120" width="10" height="15" rx="2" fill="#E67E22" opacity="0.8"/>

    <!-- Internal structural details - Right (Hollow/Pending) -->
    <rect x="128" y="70" width="10" height="15" rx="2" fill="#3F4A5E"/>
    <rect x="128" y="95" width="10" height="15" rx="2" fill="#3F4A5E"/>
    <rect x="128" y="120" width="10" height="15" rx="2" fill="#3F4A5E"/>

    <!-- Center Dividing Line / Construction Marker -->
    <line x1="120" y1="50" x2="120" y2="160" stroke="#FFD32A" stroke-width="3" stroke-dasharray="4 4"/>

    <!-- Structural top cap / deck segment -->
    <path d="M 80 45 L 160 45 L 150 60 L 90 60 Z" fill="#4B5563"/>
    
    <!-- Completed deck overhang on the left -->
    <path d="M 80 45 L 120 45 L 120 60 L 90 60 Z" fill="#FFA502"/>
  </g>

  <!-- Clear physical indicator arrow showing past the halfway point -->
  <g transform="translate(120, 32)">
    <polygon points="0,-6 8,4 -4,4" fill="#FFD32A"/>
    <line x1="0" y1="4" x2="0" y2="12" stroke="#FFD32A" stroke-width="2"/>
  </g>

  <!-- Ground foundation base block -->
  <rect x="70" y="150" width="100" height="12" rx="3" fill="#4B5563"/>
</svg>