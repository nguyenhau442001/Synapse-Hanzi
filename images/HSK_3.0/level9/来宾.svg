<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Podium/Stage Base -->
  <path d="M40 200 L200 200 L190 220 L50 220 Z" fill="#2D343E"/>
  
  <!-- Guest Figure (The "来宾") -->
  <g transform="translate(120, 150)">
    <!-- Body -->
    <path d="M-25 40 C-25 10, -10 0, 0 0 C10 0, 25 10, 25 40 L25 50 L-25 50 Z" fill="#F8F9FA"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="18" fill="#F8F9FA"/>
    <!-- Suit Detail -->
    <path d="M-15 0 L0 15 L15 0" stroke="#1A1D24" stroke-width="3" fill="none"/>
  </g>

  <!-- Welcoming Host Figure -->
  <g transform="translate(60, 160)">
    <!-- Body -->
    <path d="M-20 30 C-20 5, -10 0, 0 0 C10 0, 20 5, 20 30 L20 40 L-20 40 Z" fill="#FFB84D"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="15" fill="#FFB84D"/>
    <!-- Welcoming Arm Gesture -->
    <path d="M15 10 L40 5" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Spotlight/Focus Effect -->
  <ellipse cx="120" cy="120" rx="80" ry="100" fill="url(#grad1)" opacity="0.15"/>
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1D24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Decorative Event Elements -->
  <rect x="180" y="40" width="10" height="120" rx="5" fill="#FFB84D" opacity="0.6"/>
  <rect x="50" y="60" width="10" height="100" rx="5" fill="#FFB84D" opacity="0.6"/>
</svg>