<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground line -->
  <line x1="40" y1="185" x2="200" y2="185" stroke="#2D333B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- School Building / Registration Counter Background -->
  <rect x="75" y="65" width="90" height="80" rx="4" fill="#22272E" stroke="#373E47" stroke-width="2"/>
  <!-- Open Double Doors -->
  <rect x="102" y="105" width="18" height="40" rx="2" fill="#1A1D24"/>
  <rect x="120" y="105" width="18" height="40" rx="2" fill="#1A1D24"/>
  <!-- Welcome awning -->
  <path d="M 70 65 L 170 65 L 160 50 L 80 50 Z" fill="#373E47"/>
  
  <!-- Character: New Student (新生) arriving with a backpack and enrollment document -->
  <!-- Backpack -->
  <path d="M 98 122 C 94 122 92 125 92 135 C 92 145 94 148 98 148 L 102 148 L 102 122 Z" fill="#E5C07B"/>
  
  <!-- Body/Torso -->
  <path d="M 102 115 L 118 115 L 122 155 L 98 155 Z" fill="#61AFEF"/>
  
  <!-- Head -->
  <circle cx="110" cy="98" r="10" fill="#E06C75"/>
  <!-- Hair -->
  <path d="M 100 95 C 100 90 105 87 112 88 C 119 89 120 94 120 96 Z" fill="#282C34"/>

  <!-- Legs -->
  <rect x="104" y="155" width="5" height="30" rx="2.5" fill="#ABB2BF"/>
  <rect x="113" y="155" width="5" height="30" rx="2.5" fill="#ABB2BF"/>
  <!-- Shoes -->
  <path d="M 100 185 L 106 185 C 108 185 108 182 106 182 L 100 182 Z" fill="#E5C07B"/>
  <path d="M 113 185 L 119 185 C 121 185 121 182 119 182 L 113 182 Z" fill="#E5C07B"/>

  <!-- Arms & Registration Paper -->
  <path d="M 115 120 L 132 132" stroke="#61AFEF" stroke-width="4" stroke-linecap="round"/>
  <!-- Registration Document / Acceptance Letter held out -->
  <rect x="128" y="125" width="16" height="20" rx="1" fill="#FFFFFF" transform="rotate(15 128 125)"/>
  <line x1="131" y1="130" x2="140" y2="130" stroke="#98C379" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="131" y1="134" x2="138" y2="134" stroke="#ABB2BF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="131" y1="138" x2="136" y2="138" stroke="#ABB2BF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Focus Accent: Sparkle/Fresh start indicator (Modern minimalist star) -->
  <path d="M 155 90 L 158 98 L 166 101 L 158 104 L 155 112 L 152 104 L 144 101 L 152 98 Z" fill="#E5C07B"/>
  <path d="M 75 105 L 77 110 L 82 112 L 77 114 L 75 119 L 73 114 L 68 112 L 73 110 Z" fill="#98C379" opacity="0.8"/>
  
</svg>