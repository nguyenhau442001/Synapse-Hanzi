<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk/Table -->
  <rect x="40" y="160" width="160" height="12" rx="2" fill="#343A46"/>
  
  <!-- Character 1: The Recruiter (Professional, offering) -->
  <g transform="translate(60, 80)">
    <circle cx="20" cy="20" r="16" fill="#FFB84D"/>
    <path d="M4 40c0-10 8-18 16-18h0c8 0 16 8 16 18v30H4V40z" fill="#FFB84D"/>
    <!-- Arm extending with a document -->
    <path d="M36 45l30 10" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>
    <rect x="60" y="40" width="25" height="35" rx="2" fill="#E0E0E0"/>
    <line x1="65" y1="50" x2="80" y2="50" stroke="#A0A0A0" stroke-width="2"/>
    <line x1="65" y1="60" x2="80" y2="60" stroke="#A0A0A0" stroke-width="2"/>
  </g>
  
  <!-- Character 2: The Scholar (Receiving/Accepting) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="16" fill="#4D94FF"/>
    <path d="M4 40c0-10 8-18 16-18h0c8 0 16 8 16 18v30H4V40z" fill="#4D94FF"/>
    <!-- Arm reaching out -->
    <path d="M4 45l-25 10" stroke="#4D94FF" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Motion lines indicating the action of offering/hiring -->
  <path d="M95 55 Q 110 45 125 55" stroke="#FFB84D" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Academic Cap (Symbolizing the scholar/professor role) -->
  <path d="M150 65l10-5 10 5-10 5z" fill="#FFFFFF"/>
  <rect x="155" y="65" width="10" height="5" fill="#FFFFFF"/>
</svg>