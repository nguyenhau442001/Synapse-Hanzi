<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (soft subtle grid/glow) -->
  <circle cx="120" cy="120" r="75" fill="#252A34" opacity="0.5"/>

  <!-- Clipboard / Test Sheet Body -->
  <rect x="75" y="45" width="90" height="150" rx="8" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Clipboard Clip at Top -->
  <path d="M95 45 H145 V55 C145 58 142 60 139 60 H101 C98 60 95 58 95 55 Z" fill="#64748B"/>
  <rect x="105" y="49" width="30" height="4" rx="2" fill="#334155"/>

  <!-- Checklist items / Questions -->
  <!-- Row 1 -->
  <circle cx="95" cy="80" r="5" fill="#3B82F6"/>
  <rect x="110" y="77" width="40" height="6" rx="3" fill="#CBD5E1"/>

  <!-- Row 2 -->
  <circle cx="95" cy="105" r="5" fill="#3B82F6"/>
  <rect x="110" y="102" width="48" height="6" rx="3" fill="#CBD5E1"/>

  <!-- Row 3 -->
  <circle cx="95" cy="130" r="5" fill="#3B82F6"/>
  <rect x="110" y="127" width="35" height="6" rx="3" fill="#CBD5E1"/>

  <!-- Row 4 -->
  <circle cx="95" cy="155" r="5" fill="#3B82F6"/>
  <rect x="110" y="152" width="44" height="6" rx="3" fill="#CBD5E1"/>

  <!-- Red Checkmark (Success / Test Result) -->
  <path d="M88 178 L97 187 L116 163" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orange/Gold Accent Stylized Pencil laid diagonally -->
  <g transform="translate(130, 110) rotate(45)">
    <!-- Eraser / Metal ferrule -->
    <rect x="-35" y="-6" width="10" height="12" rx="2" fill="#94A3B8"/>
    <rect x="-25" y="-6" width="6" height="12" fill="#CBD5E1"/>
    <!-- Yellow Wooden Body -->
    <rect x="-19" y="-6" width="45" height="12" fill="#F59E0B"/>
    <!-- Wooden Tip -->
    <polygon points="26,-6 38,0 26,6" fill="#FDE68A"/>
    <!-- Graphite Lead -->
    <polygon points="34,-2 38,0 34,2" fill="#334155"/>
  </g>
</svg>