<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kitchenBg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="steelWall" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="chefJacket" x1="0" y1="90" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chefApron" x1="0" y1="140" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="skinChef" x1="0" y1="40" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="140" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="url(#kitchenBg)"/>

  <!-- Kitchen Background Wall & Stainless Steel Hood -->
  <rect x="0" y="0" width="240" height="40" fill="#1e293b"/>
  <rect x="0" y="38" width="240" height="6" fill="#475569"/>
  <!-- Commercial Hanging Utensil Rack on Wall -->
  <line x1="20" y1="52" x2="220" y2="52" stroke="#64748b" stroke-width="3"/>
  <!-- Hanging stainless ladles and copper pans -->
  <circle cx="36" cy="62" r="5" fill="#94a3b8"/>
  <line x1="36" y1="52" x2="36" y2="62" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="60" cy="68" rx="8" ry="12" fill="#b45309"/>
  <line x1="60" y1="52" x2="60" y2="58" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="190" cy="68" rx="9" ry="13" fill="#64748b"/>
  <line x1="190" y1="52" x2="190" y2="56" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="212" cy="64" r="6" fill="#b45309"/>
  <line x1="212" y1="52" x2="212" y2="60" stroke="#78350f" stroke-width="2"/>

  <!-- Commercial Stainless Steel Kitchen Counter / Stove -->
  <rect x="0" y="178" width="240" height="62" fill="url(#steelWall)"/>
  <line x1="0" y1="178" x2="240" y2="178" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Gas Stove Burner Ring & Blue Flame Base -->
  <ellipse cx="165" cy="184" rx="28" ry="7" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <ellipse cx="165" cy="183" rx="22" ry="5" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>

  <!-- Chef Character Body -->
  <!-- Legs / Kitchen Pants -->
  <path d="M78 185 L74 235 L90 235 L94 185 Z" fill="#0f172a"/>
  <path d="M102 185 L106 235 L122 235 L118 185 Z" fill="#0f172a"/>
  <!-- Non-slip kitchen shoes -->
  <ellipse cx="80" cy="235" rx="10" ry="4" fill="#020617"/>
  <ellipse cx="116" cy="235" rx="10" ry="4" fill="#020617"/>

  <!-- Double-Breasted Chef Jacket & Apron -->
  <path d="M68 96 L132 96 L136 186 L64 186 Z" fill="url(#chefJacket)"/>
  <!-- Black Bistro Apron over lower jacket -->
  <path d="M72 152 L128 152 L132 195 L68 195 Z" fill="url(#chefApron)"/>
  <!-- Red neckerchief / ascot -->
  <polygon points="94,96 106,96 102,112 98,112" fill="#dc2626"/>

  <!-- Double-Breasted Black Knot Buttons -->
  <circle cx="88" cy="114" r="2.5" fill="#0f172a"/>
  <circle cx="106" cy="114" r="2.5" fill="#0f172a"/>
  <circle cx="88" cy="128" r="2.5" fill="#0f172a"/>
  <circle cx="106" cy="128" r="2.5" fill="#0f172a"/>
  <circle cx="88" cy="142" r="2.5" fill="#0f172a"/>
  <circle cx="106" cy="142" r="2.5" fill="#0f172a"/>

  <!-- Chef Left Arm (Holding Skillet Handle in dynamic cooking posture) -->
  <path d="M70 98 L52 125 L75 152 L84 142 L66 122 L80 102 Z" fill="url(#chefJacket)"/>
  <!-- Rolled up sleeve cuff -->
  <rect x="70" y="142" width="14" height="6" rx="2" fill="#cbd5e1"/>
  <!-- Hand gripping pan handle -->
  <circle cx="82" cy="152" r="6" fill="url(#skinChef)"/>

  <!-- Professional Wok / Sauté Skillet -->
  <path d="M85 153 L125 162" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <!-- Wok Pan Basin -->
  <ellipse cx="165" cy="172" rx="34" ry="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <ellipse cx="165" cy="170" rx="31" ry="11" fill="#0f172a"/>

  <!-- Sauté Flames & Fresh Sautéed Food in Motion -->
  <!-- High culinary sauté flare -->
  <path d="M145 162 Q155 125 162 105 Q170 128 175 145 Q182 118 190 148 Q182 170 145 162 Z" fill="url(#flameGrad)" opacity="0.85"/>
  <path d="M152 158 Q160 135 164 122 Q168 138 172 155 Z" fill="#fef08a" opacity="0.9"/>
  <!-- Fresh vegetables & shrimp tossed in air -->
  <!-- Sliced bell peppers -->
  <path d="M150 135 Q156 128 162 134" stroke="#22c55e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M172 125 Q178 120 184 127" stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Golden fresh shrimp / mushroom -->
  <path d="M165 110 C162 105, 172 102, 172 110 C172 115, 166 116, 165 110" stroke="#f97316" stroke-width="3" fill="none"/>

  <!-- Chef Right Arm (holding tasting spoon / seasoning in action) -->
  <path d="M130 98 L152 118 L142 136 L132 130 L138 118 L122 102 Z" fill="url(#chefJacket)"/>
  <rect x="136" y="128" width="12" height="6" rx="2" fill="#cbd5e1"/>
  <circle cx="140" cy="138" r="5" fill="url(#skinChef)"/>
  <!-- Stainless steel kitchen spatula -->
  <line x1="142" y1="138" x2="158" y2="156" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <rect x="156" y="154" width="8" height="12" rx="1" fill="#cbd5e1" transform="rotate(-35 156 154)"/>

  <!-- Chef Neck, Head & Toque Blanche (Classic Tall Chef Hat) -->
  <rect x="94" y="82" width="14" height="16" fill="url(#skinChef)"/>
  <ellipse cx="101" cy="72" rx="14" ry="16" fill="url(#skinChef)"/>
  <!-- Facial features: Focused, proud expression -->
  <circle cx="96" cy="71" r="1.3" fill="#0f172a"/>
  <circle cx="106" cy="71" r="1.3" fill="#0f172a"/>
  <path d="M98 78 Q102 81 106 78" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Neat professional mustache / sideburns -->
  <path d="M95 75 Q101 77 107 75" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Classic Toque Blanche (Tall pleated chef hat) -->
  <rect x="86" y="52" width="30" height="9" rx="1.5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
  <!-- Tall pleated crown of the hat -->
  <path d="M86 52 C82 30, 92 18, 101 18 C110 18, 120 30, 116 52 Z" fill="#ffffff"/>
  <!-- Puffs and pleats -->
  <ellipse cx="92" cy="32" rx="8" ry="12" fill="#ffffff"/>
  <ellipse cx="101" cy="26" rx="9" ry="12" fill="#ffffff"/>
  <ellipse cx="110" cy="32" rx="8" ry="12" fill="#ffffff"/>
  <line x1="94" y1="35" x2="94" y2="52" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="101" y1="30" x2="101" y2="52" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="108" y1="35" x2="108" y2="52" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Ambient kitchen warmth & lighting -->
  <circle cx="165" cy="145" r="50" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.15"/>
</svg>
