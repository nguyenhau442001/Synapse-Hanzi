<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room Environment -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <rect x="160" y="80" width="60" height="100" fill="#475569" rx="4"/>
  <circle cx="190" cy="130" r="4" fill="#fbbf24"/>
  
  <!-- Doorway/Entryway -->
  <path d="M40 60 L120 60 L120 200 L40 200 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Character arriving -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M20 120 C20 90, 40 80, 50 80 C60 80, 80 90, 80 120 L70 120 L70 110 L30 110 L30 120 Z" fill="#ec4899"/>
    <!-- Head -->
    <circle cx="50" cy="70" r="20" fill="#fde68a"/>
    <!-- Arm reaching forward -->
    <path d="M65 95 L95 85" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <!-- Leg in stride -->
    <path d="M40 120 L30 150" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <path d="M60 120 L70 140" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Welcome Mat/Floor Detail -->
  <rect x="40" y="190" width="80" height="10" fill="#10b981" rx="2"/>
  
  <!-- Lighting/Atmosphere -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.2"/>
  <circle cx="200" cy="40" r="15" fill="#fbbf24" opacity="0.4"/>
</svg>