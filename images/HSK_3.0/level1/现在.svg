<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Clock Body -->
  <circle cx="120" cy="130" r="65" fill="#f8fafc" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="120" cy="130" r="55" fill="#0f172a"/>
  
  <!-- Clock Face Details -->
  <line x1="120" y1="85" x2="120" y2="95" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="130" x2="155" y2="130" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="175" x2="120" y2="165" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="130" x2="85" y2="130" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Clock Hands -->
  <line x1="120" y1="130" x2="120" y2="95" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="130" x2="150" y2="130" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="130" r="6" fill="#ec4899"/>
  
  <!-- Ambient Props -->
  <rect x="30" y="190" width="40" height="30" rx="4" fill="#10b981"/>
  <circle cx="200" cy="200" r="15" fill="#38bdf8"/>
  <path d="M180 170 L190 150 L200 170 Z" fill="#ec4899"/>
  
  <!-- Light Glow -->
  <circle cx="120" cy="130" r="80" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
</svg>