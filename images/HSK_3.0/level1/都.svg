<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="60" rx="10" fill="#334155"/>
  
  <!-- Three identical bowls representing 'all/đều' -->
  <g transform="translate(40, 130)">
    <ellipse cx="25" cy="40" rx="20" ry="12" fill="#fb923c"/>
    <ellipse cx="25" cy="35" rx="20" ry="8" fill="#f59e0b"/>
    <circle cx="25" cy="25" r="5" fill="#ec4899"/>
  </g>
  
  <g transform="translate(100, 130)">
    <ellipse cx="25" cy="40" rx="20" ry="12" fill="#fb923c"/>
    <ellipse cx="25" cy="35" rx="20" ry="8" fill="#f59e0b"/>
    <circle cx="25" cy="25" r="5" fill="#ec4899"/>
  </g>
  
  <g transform="translate(160, 130)">
    <ellipse cx="25" cy="40" rx="20" ry="12" fill="#fb923c"/>
    <ellipse cx="25" cy="35" rx="20" ry="8" fill="#f59e0b"/>
    <circle cx="25" cy="25" r="5" fill="#ec4899"/>
  </g>

  <!-- Characters showing shared action/preference -->
  <g transform="translate(40, 60)">
    <circle cx="20" cy="20" r="15" fill="#38bdf8"/>
    <path d="M10 45 Q20 55 30 45" stroke="#fff" stroke-width="3" fill="none"/>
  </g>
  
  <g transform="translate(100, 60)">
    <circle cx="20" cy="20" r="15" fill="#10b981"/>
    <path d="M10 45 Q20 55 30 45" stroke="#fff" stroke-width="3" fill="none"/>
  </g>
  
  <g transform="translate(160, 60)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <path d="M10 45 Q20 55 30 45" stroke="#fff" stroke-width="3" fill="none"/>
  </g>

  <!-- Decorative steam/atmosphere -->
  <path d="M65 110 Q70 90 65 70" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M125 110 Q130 90 125 70" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M185 110 Q190 90 185 70" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
</svg>