<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Lamp Glow -->
  <circle cx="180" cy="60" r="40" fill="#f59e0b" opacity="0.15"/>
  <circle cx="180" cy="60" r="20" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Person 1 (Waving) -->
  <g transform="translate(60, 120)">
    <path d="M20 40 L20 80 M10 80 L20 60 L30 80" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="20" cy="30" r="12" fill="#38bdf8"/>
    <path d="M25 25 L35 15" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Person 2 (Walking away) -->
  <g transform="translate(140, 130)">
    <path d="M10 30 L10 70 M0 70 L10 50 L20 70" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="10" cy="20" r="12" fill="#10b981"/>
    <path d="M10 80 L5 110 M10 80 L15 110" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Street Elements -->
  <path d="M0 200 L240 200" stroke="#334155" stroke-width="4"/>
  <rect x="170" y="40" width="20" height="160" fill="#475569" rx="2"/>
  <circle cx="180" cy="40" r="10" fill="#f59e0b"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="3" fill="#fb923c"/>
  <circle cx="200" cy="180" r="4" fill="#ec4899"/>
  <path d="M100 180 Q120 160 140 180" stroke="#475569" stroke-width="2" fill="none"/>
</svg>