<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Character A (Apologizing) -->
  <g transform="translate(40, 80)">
    <circle cx="30" cy="30" r="25" fill="#fb923c"/>
    <path d="M15 35 Q30 45 45 35" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="20" cy="25" r="3" fill="#0f172a"/>
    <circle cx="40" cy="25" r="3" fill="#0f172a"/>
    <path d="M25 60 L25 120 M35 60 L35 120" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Character B (Reassuring - "Mei Guanxi") -->
  <g transform="translate(130, 70)">
    <circle cx="30" cy="30" r="30" fill="#38bdf8"/>
    <circle cx="20" cy="22" r="4" fill="#0f172a"/>
    <circle cx="40" cy="22" r="4" fill="#0f172a"/>
    <path d="M15 40 Q30 55 45 40" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Reassuring Hand Gesture -->
    <path d="M55 30 L80 20" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="85" cy="18" r="8" fill="#38bdf8"/>
  </g>

  <!-- Dropped Object (The cause of the apology) -->
  <g transform="translate(90, 160)">
    <ellipse cx="20" cy="10" rx="15" ry="8" fill="#ec4899"/>
    <path d="M10 5 L30 15 M10 15 L30 5" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Atmospheric Glow -->
  <circle cx="160" cy="100" r="60" fill="#fbbf24" opacity="0.05"/>
</svg>