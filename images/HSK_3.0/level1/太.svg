      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Shop Counter Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="8"/>
  
  <!-- Price Tag Floating -->
  <path d="M160 80 L200 80 L210 95 L200 110 L160 110 Z" fill="#ec4899"/>
  <circle cx="165" cy="95" r="4" fill="#fff"/>
  
  <!-- The Expensive Item (A fancy golden vase) -->
  <path d="M90 180 C80 180 80 120 120 120 C160 120 160 180 150 180 Z" fill="#fbbf24"/>
  <path d="M105 120 C105 100 135 100 135 120" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Shocked Character (Customer) -->
  <circle cx="60" cy="120" r="25" fill="#cbd5e1"/>
  <path d="M45 115 Q50 110 55 115 M65 115 Q70 110 75 115" stroke="#0f172a" stroke-width="2"/>
  <ellipse cx="60" cy="130" rx="5" ry="8" fill="#0f172a"/>
  
  <!-- Sweat drop indicating 'too much' -->
  <path d="M85 100 Q90 90 95 100 A5 5 0 1 0 85 100" fill="#38bdf8"/>
  
  <!-- Decorative elements -->
  <circle cx="190" cy="40" r="10" fill="#fb923c" opacity="0.6"/>
  <circle cx="210" cy="60" r="5" fill="#10b981" opacity="0.6"/>
  <path d="M30 50 L40 40 M40 50 L30 40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
