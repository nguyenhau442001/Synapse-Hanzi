<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(60, 80)">
    <!-- Floor -->
    <rect x="-60" y="120" width="240" height="40" fill="#0f172a" opacity="0.3"/>
    
    <!-- Daughter Character -->
    <g transform="translate(60, 0)">
      <!-- Body -->
      <path d="M-20 120 L20 120 L25 60 L-25 60 Z" fill="#ec4899"/>
      <!-- Head -->
      <circle cx="0" cy="40" r="25" fill="#fde68a"/>
      <!-- Hair -->
      <path d="M-25 40 Q-30 0 0 -5 Q30 0 25 40 Z" fill="#78350f"/>
      <!-- Arms -->
      <rect x="-35" y="65" width="10" height="30" rx="5" fill="#fde68a" transform="rotate(-20 -30 65)"/>
      <rect x="25" y="65" width="10" height="30" rx="5" fill="#fde68a" transform="rotate(20 30 65)"/>
      <!-- Legs -->
      <rect x="-15" y="120" width="10" height="30" rx="5" fill="#fde68a"/>
      <rect x="5" y="120" width="10" height="30" rx="5" fill="#fde68a"/>
    </g>
    
    <!-- Context Props: Toy block and Balloon -->
    <rect x="10" y="130" width="20" height="20" rx="2" fill="#38bdf8"/>
    <circle cx="120" cy="40" r="15" fill="#fb923c"/>
    <path d="M120 55 L120 90" stroke="#fb923c" stroke-width="2"/>
    
    <!-- Decorative Stars -->
    <path d="M-40 20 L-35 30 L-25 30 L-33 36 L-30 45 L-40 39 L-50 45 L-47 36 L-55 30 L-45 30 Z" fill="#fbbf24"/>
    <path d="M150 10 L153 16 L160 16 L155 20 L157 26 L150 22 L143 26 L145 20 L140 16 L147 16 Z" fill="#10b981"/>
  </g>
</svg>