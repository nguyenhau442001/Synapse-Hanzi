<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#334155"/>
  <rect x="0" y="155" width="240" height="10" fill="#475569"/>
  
  <!-- The Children (Representing 'jǐ' - asking for quantity) -->
  <!-- Child 1 -->
  <circle cx="60" cy="140" r="20" fill="#fde68a"/>
  <path d="M45 160 Q60 190 75 160" fill="#ec4899"/>
  <circle cx="55" cy="135" r="3" fill="#0f172a"/>
  <circle cx="65" cy="135" r="3" fill="#0f172a"/>
  
  <!-- Child 2 -->
  <circle cx="120" cy="140" r="20" fill="#fbbf24"/>
  <path d="M105 160 Q120 190 135 160" fill="#38bdf8"/>
  <circle cx="115" cy="135" r="3" fill="#0f172a"/>
  <circle cx="125" cy="135" r="3" fill="#0f172a"/>
  
  <!-- Child 3 -->
  <circle cx="180" cy="140" r="20" fill="#f59e0b"/>
  <path d="M165 160 Q180 190 195 160" fill="#10b981"/>
  <circle cx="175" cy="135" r="3" fill="#0f172a"/>
  <circle cx="185" cy="135" r="3" fill="#0f172a"/>
  
  <!-- Question Mark Concept (Represented by a floating glowing orb looking at the group) -->
  <circle cx="120" cy="60" r="15" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="6 6"/>
  <circle cx="120" cy="60" r="5" fill="#fb923c"/>
  <path d="M120 75 L120 90" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="210" cy="30" r="6" fill="#10b981" opacity="0.5"/>
  <circle cx="190" cy="200" r="5" fill="#ec4899" opacity="0.5"/>
</svg>