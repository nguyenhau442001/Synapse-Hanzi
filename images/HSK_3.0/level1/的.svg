<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- The Book (Subject) -->
  <g transform="translate(60, 100) rotate(-10)">
    <rect x="0" y="0" width="120" height="90" rx="4" fill="#fbbf24"/>
    <rect x="5" y="5" width="110" height="80" rx="2" fill="#fef3c7"/>
    <path d="M0 0 L120 0 L120 90 L0 90 Z" fill="none" stroke="#b45309" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#b45309" stroke-width="2"/>
  </g>
  
  <!-- Ownership Indicator (The 'de' relationship: Hand pointing to book) -->
  <g transform="translate(140, 130)">
    <path d="M20 20 C 10 0, 0 0, -20 10 L -40 40 L -10 60 L 10 40 Z" fill="#38bdf8"/>
    <circle cx="-15" cy="15" r="8" fill="#38bdf8"/>
    <!-- Sleeve -->
    <path d="M10 40 L30 60 L0 80 L-20 60 Z" fill="#ec4899"/>
  </g>
  
  <!-- Atmospheric details -->
  <circle cx="200" cy="40" r="3" fill="#fb923c" opacity="0.6"/>
  <circle cx="180" cy="30" r="5" fill="#fb923c" opacity="0.3"/>
  <path d="M30 180 Q 50 170 70 180" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 190 Q 200 185 220 195" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>