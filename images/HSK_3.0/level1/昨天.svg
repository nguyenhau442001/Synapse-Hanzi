<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155" opacity="0.5"/>
  
  <!-- Calendar Page (Representing Yesterday) -->
  <rect x="70" y="60" width="100" height="120" rx="8" fill="#f8fafc"/>
  <rect x="70" y="60" width="100" height="30" rx="8" fill="#ec4899"/>
  <circle cx="90" cy="75" r="4" fill="#f8fafc"/>
  <circle cx="150" cy="75" r="4" fill="#f8fafc"/>
  
  <!-- Crossed out date -->
  <line x1="90" y1="110" x2="150" y2="160" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="110" x2="90" y2="160" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Coffee Mug (Busy context) -->
  <path d="M180 140 C180 130 200 130 200 140 L200 180 C200 190 180 190 180 180 Z" fill="#fbbf24"/>
  <path d="M200 150 C215 150 215 170 200 170" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M185 130 Q190 120 195 130" stroke="#38bdf8" stroke-width="2" fill="none"/>
  
  <!-- Clock (Time passing) -->
  <circle cx="40" cy="50" r="25" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <line x1="40" y1="50" x2="40" y2="35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="50" x2="55" y2="50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="210" cy="40" r="8" fill="#10b981" opacity="0.6"/>
  <circle cx="30" cy="200" r="12" fill="#ec4899" opacity="0.4"/>
</svg>