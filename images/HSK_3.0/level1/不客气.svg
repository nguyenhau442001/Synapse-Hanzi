<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Character 1 (Giver) -->
  <g transform="translate(140, 80)">
    <circle cx="20" cy="20" r="20" fill="#fbbf24"/>
    <path d="M10 25 Q20 35 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#0f172a"/>
    <circle cx="28" cy="15" r="2" fill="#0f172a"/>
    <path d="M20 40 L20 80" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 50 L50 40" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Character 2 (Receiver - Waving hand) -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="20" fill="#38bdf8"/>
    <path d="M10 25 Q20 30 30 25" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="12" cy="15" r="2" fill="#0f172a"/>
    <circle cx="28" cy="15" r="2" fill="#0f172a"/>
    <!-- Waving hand gesture -->
    <path d="M35 30 L45 15" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="48" cy="12" r="4" fill="#38bdf8"/>
  </g>

  <!-- Gift Box -->
  <rect x="110" y="150" width="30" height="30" rx="4" fill="#ec4899"/>
  <rect x="123" y="150" width="4" height="30" fill="#fef3c7"/>
  <rect x="110" y="163" width="30" height="4" fill="#fef3c7"/>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="50" r="3" fill="#fb923c"/>
  <circle cx="40" cy="60" r="2" fill="#10b981"/>
  <path d="M190 120 L200 110" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
</svg>