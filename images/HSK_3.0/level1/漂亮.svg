  <path d="M40 40 L43 50 L53 53 L43 56 L40 66 L37 56 L27 53 L37 50 Z" fill="#ec4899"/>
  <path d="M200 150 L202 156 L208 158 L202 160 L200 166 L198 160 L192 158 L198 156 Z" fill="#10b981"/>
