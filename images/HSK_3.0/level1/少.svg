<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  
  <!-- Large empty space to emphasize 'few' -->
  <circle cx="180" cy="190" r="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- The 'Few' Subjects: Only two people in a large space -->
  <g transform="translate(40, 140)">
    <circle cx="20" cy="20" r="12" fill="#fbbf24"/>
    <path d="M8 50 Q20 35 32 50 L32 80 L8 80 Z" fill="#38bdf8"/>
  </g>
  
  <g transform="translate(90, 155)">
    <circle cx="20" cy="20" r="12" fill="#fb923c"/>
    <path d="M8 50 Q20 35 32 50 L32 65 L8 65 Z" fill="#ec4899"/>
  </g>

  <!-- Atmospheric details: A single distant lamp -->
  <rect x="200" y="80" width="10" height="100" fill="#475569"/>
  <circle cx="205" cy="70" r="15" fill="#f59e0b" opacity="0.6"/>
  <circle cx="205" cy="70" r="25" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Architectural depth -->
  <path d="M0 180 L60 140 L240 140 L240 180 Z" fill="#1e293b" opacity="0.3"/>
</svg>