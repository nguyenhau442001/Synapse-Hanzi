<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M20 160 L220 160 L230 190 L10 190 Z" fill="#334155"/>
  <path d="M20 160 L220 160 L210 150 L30 150 Z" fill="#475569"/>
  
  <!-- Table Legs -->
  <rect x="40" y="190" width="10" height="40" fill="#1e293b" opacity="0.5"/>
  <rect x="190" y="190" width="10" height="40" fill="#1e293b" opacity="0.5"/>
  
  <!-- Cat under the table -->
  <g transform="translate(90, 175)">
    <ellipse cx="30" cy="30" rx="25" ry="20" fill="#f59e0b"/>
    <circle cx="15" cy="20" r="8" fill="#f59e0b"/>
    <circle cx="45" cy="20" r="8" fill="#f59e0b"/>
    <circle cx="15" cy="18" r="3" fill="#0f172a"/>
    <circle cx="45" cy="18" r="3" fill="#0f172a"/>
    <path d="M25 35 Q30 40 35 35" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Items on top of the table -->
  <circle cx="60" cy="130" r="15" fill="#38bdf8"/>
  <rect x="140" y="120" width="40" height="30" rx="4" fill="#ec4899"/>
  <rect x="150" y="110" width="20" height="10" rx="2" fill="#fb923c"/>
  
  <!-- Ambient lighting -->
  <circle cx="120" cy="120" r="80" fill="url(#lightGrad)" opacity="0.1"/>
  <defs>
    <radialGradient id="lightGrad">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>