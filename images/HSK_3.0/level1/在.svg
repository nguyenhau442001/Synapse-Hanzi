<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Room Floor -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Chair -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="40" height="10" rx="2" fill="#fb923c"/>
    <rect x="5" y="10" width="30" height="50" rx="4" fill="#f59e0b"/>
    <rect x="5" y="60" width="10" height="30" fill="#d97706"/>
    <rect x="25" y="60" width="10" height="30" fill="#d97706"/>
  </g>
  
  <!-- Character (Sitting) -->
  <g transform="translate(65, 80)">
    <circle cx="20" cy="20" r="15" fill="#fbbf24"/>
    <rect x="5" y="35" width="30" height="40" rx="8" fill="#38bdf8"/>
    <rect x="5" y="75" width="12" height="25" rx="4" fill="#38bdf8"/>
    <rect x="23" y="75" width="12" height="25" rx="4" fill="#38bdf8"/>
    <rect x="0" y="40" width="10" height="20" rx="4" fill="#38bdf8" transform="rotate(-20 5 40)"/>
    <rect x="30" y="40" width="10" height="20" rx="4" fill="#38bdf8" transform="rotate(20 35 40)"/>
  </g>
  
  <!-- Window/Background Detail -->
  <rect x="150" y="40" width="60" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <circle cx="180" cy="70" r="15" fill="#fbbf24"/>
  
  <!-- Plant -->
  <g transform="translate(180, 150)">
    <rect x="0" y="0" width="20" height="30" rx="2" fill="#10b981"/>
    <ellipse cx="10" cy="-5" rx="15" ry="10" fill="#059669"/>
  </g>
  
  <!-- Floating Action Sparkles -->
  <path d="M120 50 L125 40 L130 50 L120 50 Z" fill="#ec4899"/>
  <path d="M200 100 L205 90 L210 100 L200 100 Z" fill="#38bdf8"/>
</svg>