<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Living room scene representing a family of three -->
  <!-- Floor -->
  <rect x="0" y="180" width="240" height="60" fill="#0f172a" opacity="0.5"/>
  
  <!-- Father figure -->
  <g transform="translate(40, 90)">
    <circle cx="20" cy="20" r="18" fill="#fbbf24"/>
    <path d="M5 45 Q20 40 35 45 L30 110 L10 110 Z" fill="#38bdf8"/>
    <circle cx="12" cy="15" r="3" fill="#0f172a"/>
    <circle cx="28" cy="15" r="3" fill="#0f172a"/>
  </g>
  
  <!-- Mother figure -->
  <g transform="translate(100, 95)">
    <circle cx="20" cy="20" r="16" fill="#fbbf24"/>
    <path d="M5 40 Q20 35 35 40 L30 105 L10 105 Z" fill="#ec4899"/>
    <circle cx="12" cy="15" r="3" fill="#0f172a"/>
    <circle cx="28" cy="15" r="3" fill="#0f172a"/>
  </g>
  
  <!-- Child figure -->
  <g transform="translate(165, 120)">
    <circle cx="15" cy="15" r="12" fill="#fbbf24"/>
    <path d="M5 30 Q15 25 25 30 L22 80 L8 80 Z" fill="#10b981"/>
    <circle cx="10" cy="12" r="2" fill="#0f172a"/>
    <circle cx="20" cy="12" r="2" fill="#0f172a"/>
  </g>
  
  <!-- Sofa backrest -->
  <path d="M20 190 L220 190 L210 140 L30 140 Z" fill="#334155"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="50" r="20" fill="#fb923c" opacity="0.2"/>
  <circle cx="40" cy="60" r="10" fill="#38bdf8" opacity="0.2"/>
</svg>