<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Popcorn Bucket -->
  <path d="M170 140 L210 140 L200 210 L180 210 Z" fill="#f8fafc"/>
  <path d="M170 140 L210 140 L215 150 L165 150 Z" fill="#e2e8f0"/>
  <circle cx="190" cy="145" r="3" fill="#fb923c"/>
  <circle cx="180" cy="160" r="8" fill="#fef3c7"/>
  <circle cx="200" cy="165" r="7" fill="#fef3c7"/>
  <circle cx="190" cy="175" r="9" fill="#fef3c7"/>
  
  <!-- Movie Screen/Projection Area -->
  <rect x="30" y="50" width="180" height="100" rx="8" fill="#334155"/>
  <rect x="40" y="60" width="160" height="80" rx="4" fill="#0f172a"/>
  
  <!-- Action Scene on Screen -->
  <circle cx="120" cy="100" r="25" fill="#f59e0b"/>
  <path d="M105 100 L135 85 L135 115 Z" fill="#0f172a"/>
  <path d="M70 120 L90 120 L80 100 Z" fill="#ec4899"/>
  <path d="M150 70 L170 70 L160 90 Z" fill="#38bdf8"/>
  
  <!-- Projector Beam -->
  <polygon points="120,150 20,240 220,240" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Theater Seats -->
  <rect x="10" y="180" width="60" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="80" y="190" width="60" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="150" y="180" width="60" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Decorative Accents -->
  <circle cx="20" cy="30" r="4" fill="#10b981"/>
  <circle cx="220" cy="30" r="4" fill="#fb923c"/>
</svg>