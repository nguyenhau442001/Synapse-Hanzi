<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Office Environment -->
  <rect x="20" y="140" width="200" height="80" rx="10" fill="#334155"/>
  <rect x="30" y="150" width="180" height="10" fill="#1e293b"/>
  <circle cx="180" cy="190" r="15" fill="#fbbf24"/>
  
  <!-- Apologizing Character -->
  <g transform="translate(40, 60)">
    <path d="M40 140 C40 120, 60 110, 80 110 C100 110, 120 120, 120 140 L120 170 L40 170 Z" fill="#38bdf8"/>
    <ellipse cx="80" cy="90" rx="25" ry="30" fill="#fde68a"/>
    <path d="M65 85 Q70 80 75 85 M85 85 Q90 80 95 85" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M70 100 Q80 105 90 100" stroke="#1e293b" stroke-width="2" fill="none"/>
    
    <!-- Bowing posture arms -->
    <path d="M40 130 L10 100" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 130 L150 100" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Clock on wall -->
  <circle cx="180" cy="50" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <line x1="180" y1="50" x2="180" y2="35" stroke="#fb923c" stroke-width="3"/>
  <line x1="180" y1="50" x2="195" y2="50" stroke="#fb923c" stroke-width="3"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="120" r="4" fill="#10b981"/>
  <circle cx="30" cy="40" r="6" fill="#ec4899"/>
</svg>