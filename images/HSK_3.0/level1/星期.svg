<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <rect x="20" y="160" width="200" height="60" rx="10" fill="#334155"/>
  
  <!-- Calendar Base -->
  <rect x="70" y="60" width="100" height="120" rx="8" fill="#f1f5f9"/>
  <rect x="70" y="60" width="100" height="30" rx="8" fill="#fb923c"/>
  
  <!-- Calendar Pages -->
  <path d="M80 100h80v60h-80z" fill="#e2e8f0"/>
  <circle cx="90" cy="75" r="4" fill="#0f172a"/>
  <circle cx="110" cy="75" r="4" fill="#0f172a"/>
  <circle cx="130" cy="75" r="4" fill="#0f172a"/>
  <circle cx="150" cy="75" r="4" fill="#0f172a"/>
  
  <!-- Calendar Grid Lines -->
  <line x1="85" y1="115" x2="155" y2="115" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="85" y1="130" x2="155" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="85" y1="145" x2="155" y2="145" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Highlighted Day -->
  <rect x="125" y="125" width="15" height="15" rx="2" fill="#f59e0b"/>
  
  <!-- Coffee Mug -->
  <path d="M180 180h40v30a10 10 0 0 1-10 10h-20a10 10 0 0 1-10-10z" fill="#38bdf8"/>
  <path d="M220 185h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5h-10" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Pen -->
  <rect x="30" y="190" width="30" height="6" rx="2" fill="#ec4899" transform="rotate(-20 30 190)"/>
  <circle cx="60" cy="180" r="3" fill="#10b981"/>
  
  <!-- Ambient Light -->
  <circle cx="200" cy="40" r="30" fill="#f59e0b" opacity="0.1"/>
