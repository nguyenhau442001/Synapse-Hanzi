<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual illustration for "增添" (adding/embellishing with vivid color) based on the context of blooming azaleas in a spring garden -->
  <g transform="translate(0, 0)">
    <!-- Garden background elements (subtle minimalist stems and leaves) -->
    <path d="M 60 180 Q 70 140 80 110" fill="none" stroke="#2E3846" stroke-width="4" stroke-linecap="round"/>
    <path d="M 180 185 Q 170 145 155 120" fill="none" stroke="#2E3846" stroke-width="4" stroke-linecap="round"/>
    <path d="M 120 190 Q 120 150 125 130" fill="none" stroke="#2E3846" stroke-width="3" stroke-linecap="round"/>

    <!-- Green leaves -->
    <path d="M 80 140 C 95 135 105 145 100 155 C 85 160 75 150 80 140 Z" fill="#284B3E"/>
    <path d="M 155 150 C 140 145 130 155 135 165 C 150 170 160 160 155 150 Z" fill="#284B3E"/>
    <path d="M 95 115 C 110 110 120 120 115 130 C 100 135 90 125 95 115 Z" fill="#2E5A44"/>

    <!-- Base flower (harmonious background blossoms) -->
    <g transform="translate(80, 100) scale(0.6)">
      <path d="M0 -30 C15 -45 35 -20 20 0 C35 20 15 45 0 30 C-15 45 -35 20 -20 0 C-35 -20 -15 -45 0 -30 Z" fill="#9B2C2C"/>
      <circle cx="0" cy="0" r="8" fill="#F6AD55"/>
    </g>
    <g transform="translate(150, 110) scale(0.55)">
      <path d="M0 -30 C15 -45 35 -20 20 0 C35 20 15 45 0 30 C-15 45 -35 20 -20 0 C-35 -20 -15 -45 0 -30 Z" fill="#9B2C2C"/>
      <circle cx="0" cy="0" r="8" fill="#F6AD55"/>
    </g>

    <!-- Main Central Flower: The vibrant highlight ("绚烂夺目的亮色" - adding brilliance) -->
    <g transform="translate(120, 95)">
      <!-- Outer glow / radiance indicating "增添" vibrancy -->
      <circle cx="0" cy="0" r="55" fill="#FF5722" opacity="0.12"/>
      <circle cx="0" cy="0" r="42" fill="#FF5722" opacity="0.18"/>

      <!-- Blooming Petals (Red Azalea style) -->
      <path d="M0 -38 C18 -55 45 -25 25 0 C45 25 18 55 0 38 C-18 55 -45 25 -25 0 C-45 -25 -18 -55 0 -38 Z" fill="#E53E3E"/>
      <path d="M-5 -35 C12 -52 48 -18 28 5 C48 30 15 52 -2 35 C-20 52 -50 25 -30 2 C-50 -18 -22 -52 -5 -35 Z" fill="#F56565"/>

      <!-- Inner petal details & texture -->
      <path d="M0 -22 C8 -32 25 -15 15 0 C25 15 8 32 0 22 C-8 32 -25 15 -15 0 C-25 -15 -8 -32 0 -22 Z" fill="#FEB2B2" opacity="0.4"/>

      <!-- Stamens / Center details -->
      <circle cx="0" cy="0" r="10" fill="#F6AD55"/>
      <circle cx="0" cy="0" r="6" fill="#DD6B20"/>
      <line x1="0" y1="0" x2="-8" y2="-12" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="8" y2="-12" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="12" y2="6" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-12" y2="6" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-8" cy="-12" r="2.5" fill="#FFF"/>
      <circle cx="8" cy="-12" r="2.5" fill="#FFF"/>
      <circle cx="12" cy="6" r="2.5" fill="#FFF"/>
      <circle cx="-12" cy="6" r="2.5" fill="#FFF"/>
    </g>

    <!-- Sparkles / Accent highlights representing the exact action of "adding luster/embellishment" -->
    <g transform="translate(170, 60)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#F6AD55"/>
    </g>
    <g transform="translate(70, 75) scale(0.7)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#F6AD55"/>
    </g>
    <g transform="translate(145, 45) scale(0.5)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#FEB2B2"/>
    </g>

    <!-- Ground / Soil bed -->
    <path d="M 40 180 C 80 170 160 170 200 180 C 210 183 210 195 200 198 C 160 205 80 205 40 198 C 30 195 30 183 40 180 Z" fill="#2D3748"/>
  </g>
</svg>