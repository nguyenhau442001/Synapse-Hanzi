<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Complex Industrial Machinery Panel -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="120" height="80" rx="4" fill="#2D343E" stroke="#4A5568" stroke-width="2"/>
    <circle cx="20" cy="20" r="6" fill="#4A5568"/>
    <circle cx="40" cy="20" r="6" fill="#4A5568"/>
    <rect x="60" y="15" width="40" height="10" rx="2" fill="#4A5568"/>
    <rect x="10" y="40" width="100" height="20" rx="2" fill="#3A424F"/>
    <line x1="20" y1="50" x2="100" y2="50" stroke="#5A6678" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Young Technician Character -->
  <g transform="translate(100, 140)">
    <!-- Arm reaching out to interact -->
    <path d="M 20 20 L 50 10" stroke="#FFB86C" stroke-width="8" stroke-linecap="round"/>
    <!-- Hand pointing/touching -->
    <circle cx="55" cy="8" r="6" fill="#FFB86C"/>
    <!-- Motion lines indicating hesitation or focus -->
    <path d="M 65 5 L 75 5 M 65 15 L 75 15" stroke="#FFB86C" stroke-width="2" stroke-linecap="round"/>
    <!-- Head/Body silhouette -->
    <circle cx="0" cy="0" r="15" fill="#E2E8F0"/>
    <path d="M -15 15 L 15 15 L 10 50 L -10 50 Z" fill="#E2E8F0"/>
  </g>

  <!-- Focus Highlight on the point of action -->
  <circle cx="115" cy="95" r="12" fill="none" stroke="#FFB86C" stroke-width="3" stroke-dasharray="6 4"/>
</svg>