<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Magnifying glass frame -->
  <circle cx="120" cy="120" r="65" fill="none" stroke="#FFB84D" stroke-width="6"/>
  <rect x="165" y="165" width="8" height="40" rx="4" fill="#FFB84D" transform="rotate(45 169 185)"/>
  
  <!-- The "Microcosm" scene inside the lens -->
  <g clip-path="url(#lensClip)">
    <circle cx="120" cy="120" r="62" fill="#2D343E"/>
    
    <!-- Miniature Village Elements -->
    <path d="M80 150 L160 150 L150 120 L90 120 Z" fill="#4A90E2"/>
    <path d="M100 120 L100 100 L120 80 L140 100 L140 120 Z" fill="#E74C3C"/>
    <rect x="145" y="130" width="10" height="20" fill="#F39C12"/>
    
    <!-- Miniature City Elements (Contrast) -->
    <rect x="115" y="100" width="10" height="50" fill="#BDC3C7"/>
    <rect x="130" y="110" width="8" height="40" fill="#95A5A6"/>
    
    <!-- Ground line -->
    <line x1="70" y1="150" x2="170" y2="150" stroke="#7F8C8D" stroke-width="2"/>
  </g>
  
  <defs>
    <clipPath id="lensClip">
      <circle cx="120" cy="120" r="62"/>
    </clipPath>
  </defs>
</svg>