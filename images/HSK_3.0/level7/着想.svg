<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements: Abstract representation of a collective/group -->
  <circle cx="120" cy="120" r="80" fill="#252A34"/>
  
  <!-- The "Self" character (left) -->
  <g transform="translate(60, 120)">
    <path d="M0,0 C0,-20 10,-30 20,-30 C30,-30 40,-20 40,0 L40,60 L0,60 Z" fill="#4A5568"/>
    <circle cx="20" cy="-40" r="15" fill="#A0AEC0"/>
  </g>
  
  <!-- The "Others/Collective" characters (right) -->
  <g transform="translate(140, 130)">
    <path d="M0,0 C0,-15 8,-25 15,-25 C22,-25 30,-15 30,0 L30,50 L0,50 Z" fill="#718096"/>
    <circle cx="15" cy="-35" r="12" fill="#CBD5E0"/>
  </g>
  
  <g transform="translate(170, 140)">
    <path d="M0,0 C0,-15 8,-25 15,-25 C22,-25 30,-15 30,0 L30,40 L0,40 Z" fill="#718096"/>
    <circle cx="15" cy="-35" r="12" fill="#CBD5E0"/>
  </g>

  <!-- Action: The "Self" character extending a hand/gesture towards the group -->
  <path d="M95,90 L135,90" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  <path d="M125,80 L135,90 L125,100" stroke="#F6AD55" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Visualizing the "Thought" (着想) - A warm, golden, non-magical, professional focus indicator -->
  <circle cx="140" cy="70" r="12" fill="#F6AD55" opacity="0.8"/>
  <path d="M140,65 L140,75 M135,70 L145,70" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Motion lines indicating the focus/care directed towards the group -->
  <path d="M105,95 Q120,85 135,95" stroke="#F6AD55" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>