  <path d="M60 150 L63 158 L71 161 L63 164 L60 172 L57 164 L49 161 L57 158 Z" fill="#F1C40F" opacity="0.2"/>

  <!-- Central Character (Young girl feeling "měizīzī" - proud, overjoyed, glowing with satisfaction) -->
  <g transform="translate(0, 10)">
    <!-- Hair background -->
    <path d="M85 85 Q75 120 80 155 Q90 170 100 175 L105 120 Q110 100 120 100 Q130 100 135 120 L140 175 Q150 170 160 155 Q165 120 155 85 Q120 70 85 85 Z" fill="#2C3E50"/>
    
