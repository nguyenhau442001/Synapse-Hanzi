    <path d="M55 70 L58 80 L68 83 L58 86 L55 96 L52 86 L42 83 L52 80 Z" fill="#F1C40F"/>
    <path d="M185 95 L187 101 L193 103 L187 105 L185 111 L183 105 L177 103 L183 101 Z" fill="#F1C40F"/>
    <path d="M75 145 L77 150 L82 152 L77 154 L75 159 L73 154 L68 152 L73 150 Z" fill="#F39C12"/>
    <path d="M165 140 L168 147 L175 150 L168 153 L165 160 L162 153 L155 150 L162 147 Z" fill="#F1C40F"/>
