    <circle cx="120" cy="135" r="14" fill="#F1C40F"/>
    <circle cx="120" cy="135" r="10" fill="#F39C12"/>
    <path d="M120 129 L122 133 L126 133 L123 135 L124 139 L120 137 L116 139 L117 135 L114 133 L118 133 Z" fill="#F1C40F"/>

