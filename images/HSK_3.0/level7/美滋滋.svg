    <!-- Rosy cheeks (sign of sweetness and joy) -->
    <circle cx="102" cy="92" r="6" fill="#FF7675" opacity="0.6"/>
    <circle cx="138" cy="92" r="6" fill="#FF7675" opacity="0.6"/>

    <!-- Eyes (happy, closed curves ^_^ ) -->
    <path d="M103 82 Q108 77 113 82" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
    <path d="M127 82 Q132 77 137 82" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

    <!-- Big joyful smile -->
    <path d="M108 92 Q120 106 132 92" fill="#D35400"/>
    <!-- Tongue detail -->
    <path d="M115 97 Q120 103 125 97 Z" fill="#FF6B81"/>

    <!-- Hair front / bangs -->
