    <path d="M110 105 L130 105 L135 115 L105 115 Z" fill="#F5CBA7"/>
    <path d="M95 112 Q120 125 145 112 L145 120 Q120 132 95 120 Z" fill="#ECF0F1"/>

    <!-- Head / Face -->
