<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle agricultural field lines in background -->
  <path d="M40 180 C 80 160, 160 160, 200 180" stroke="#2A303C" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M30 195 C 90 175, 150 175, 210 195" stroke="#2A303C" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- Soil mound -->
  <path d="M40 200 C 80 185, 160 185, 200 200 L 210 215 C 160 225, 80 225, 30 215 Z" fill="#2F3644"/>
  <ellipse cx="120" cy="202" rx="85" ry="12" fill="#3A4252"/>

  <!-- Centerpiece: Hybrid Rice / Stalk (representing 作物) -->
  <g transform="translate(120, 45)">
    <!-- Main stem -->
    <path d="M0 145 C -2 100, 2 50, 0 10" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Left leaves -->
    <path d="M-2 120 C -25 115, -40 100, -50 85 C -35 95, -20 105, -2 112" fill="#22C55E"/>
    <path d="M2 95 C 25 90, 40 75, 52 60 C 38 70, 22 80, 2 88" fill="#22C55E"/>

    <!-- Rice grains (Hybrid Rice Panicle arrangement) -->
    <!-- Central tip grain -->
    <ellipse cx="0" cy="6" rx="4" ry="7" fill="#FACC15" transform="rotate(-5 0 6)"/>
    
    <!-- Upper tier grains -->
    <g fill="#FACC15">
      <!-- Left branches & grains -->
      <path d="M-2 20 C -12 16, -20 10, -26 4" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="-26" cy="3" rx="3.5" ry="6" transform="rotate(-35 -26 3)"/>
      <ellipse cx="-16" cy="13" rx="3.5" ry="6" transform="rotate(-20 -16 13)"/>

      <!-- Right branches & grains -->
      <path d="M2 28 C 14 24, 22 18, 30 12" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="30" cy="11" rx="3.5" ry="6" transform="rotate(35 30 11)"/>
      <ellipse cx="18" cy="21" rx="3.5" ry="6" transform="rotate(20 18 21)"/>

      <!-- Mid tier grains -->
      <path d="M-1 45 C -15 40, -25 32, -35 24" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="-35" cy="23" rx="3.5" ry="6" transform="rotate(-40 -35 23)"/>
      <ellipse cx="-22" cy="35" rx="3.5" ry="6" transform="rotate(-25 -22 35)"/>

      <path d="M1 55 C 16 50, 28 42, 38 34" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="38" cy="33" rx="3.5" ry="6" transform="rotate(40 38 33)"/>
      <ellipse cx="23" cy="45" rx="3.5" ry="6" transform="rotate(25 23 45)"/>

      <!-- Lower heavy grains -->
      <path d="M-1 75 C -18 70, -30 60, -42 50" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="-42" cy="48" rx="3.5" ry="6" transform="rotate(-45 -42 48)"/>
      <ellipse cx="-25" cy="64" rx="3.5" ry="6" transform="rotate(-30 -25 64)"/>

      <path d="M1 88 C 18 83, 32 73, 44 62" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="44" cy="61" rx="3.5" ry="6" transform="rotate(45 44 61)"/>
      <ellipse cx="26" cy="77" rx="3.5" ry="6" transform="rotate(30 26 77)"/>
    </g>
  </g>

  <!-- Focus accent ring/glow behind the upper crop head -->
  <circle cx="120" cy="55" r="35" fill="none" stroke="#FACC15" stroke-width="1.5" opacity="0.25" stroke-dasharray="6 4"/>
</svg>