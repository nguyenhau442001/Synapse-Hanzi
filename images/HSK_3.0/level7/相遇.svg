<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Atmospheric background glowing nodes representing accidental crossing paths -->
  <g opacity="0.25">
    <path d="M 60 180 Q 120 180 120 120 T 180 60" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 60 60 Q 120 60 120 120 T 180 180" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Motion lines indicating movement toward each other -->
  <g opacity="0.6">
    <line x1="45" y1="135" x2="65" y2="135" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="35" y1="143" x2="55" y2="143" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    
    <line x1="195" y1="135" x2="175" y2="135" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" />
    <line x1="205" y1="143" x2="185" y2="143" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Spark / Focal point of encounter (The "Meeting" moment) -->
  <g transform="translate(120, 115)">
    <circle cx="0" cy="0" r="16" fill="#F59E0B" opacity="0.2" />
    <circle cx="0" cy="0" r="8" fill="#F59E0B" opacity="0.4" />
    <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#F59E0B" />
  </g>

  <!-- Character Left (Coming from left) -->
  <g transform="translate(85, 130)">
    <!-- Body / Torso -->
    <path d="M -15 50 L -5 20 L 15 25 L 10 50 Z" fill="#3B82F6" />
    <!-- Head -->
    <circle cx="0" cy="5" r="11" fill="#E2E8F0" />
    <!-- Hair -->
    <path d="M -11 3 C -10 -5 5 -4 10 2 C 5 0 -5 1 -11 3 Z" fill="#94A3B8" />
    <!-- Dynamic forward stepping legs -->
    <path d="M -10 50 L -18 80 L -8 82" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 5 50 L 12 75 L 22 73" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Reaching Arm -->
    <path d="M -2 25 L 25 15" fill="none" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Character Right (Coming from right) -->
  <g transform="translate(155, 130)">
    <!-- Body / Torso -->
    <path d="M 15 50 L 5 20 L -15 25 L -10 50 Z" fill="#F97316" />
    <!-- Head -->
    <circle cx="0" cy="5" r="11" fill="#E2E8F0" />
    <!-- Hair -->
    <path d="M 11 3 C 10 -5 -5 -4 -10 2 C -5 0 5 1 11 3 Z" fill="#CBD5E1" />
    <!-- Dynamic forward stepping legs -->
    <path d="M 10 50 L 18 80 L 8 82" fill="none" stroke="#C2410C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -5 50 L -12 75 L -22 73" fill="none" stroke="#F97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Reaching Arm -->
    <path d="M 2 25 L -25 15" fill="none" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Ground Shadow Line -->
  <ellipse cx="120" cy="212" rx="70" ry="4" fill="#0F172A" opacity="0.6" />
</svg>