<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Grid lines representing network/business growth -->
  <g stroke="#262B35" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="40" y1="120" x2="200" y2="120"/>
    <line x1="120" y1="40" x2="120" y2="200"/>
    <circle cx="120" cy="120" r="40" fill="none"/>
    <circle cx="120" cy="120" r="75" fill="none"/>
  </g>

  <!-- Expanding Network Nodes (Representing New Business / "新业务") -->
  <g>
    <!-- Connecting lines -->
    <line x1="120" y1="120" x2="185" y2="75" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="195" y2="140" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <line x1="185" y1="75" x2="210" y2="100" stroke="#3498DB" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Central Node -->
    <circle cx="120" cy="120" r="10" fill="#3498DB"/>
    <circle cx="120" cy="120" r="14" fill="none" stroke="#3498DB" stroke-width="1" opacity="0.5"/>

    <!-- New Expanded Nodes (Target of Action) -->
    <circle cx="185" cy="75" r="8" fill="#F5A623"/>
    <circle cx="185" cy="75" r="13" fill="none" stroke="#F5A623" stroke-width="1.5" opacity="0.7"/>

    <circle cx="195" cy="140" r="6" fill="#2ECC71"/>
    
    <!-- Expanding Outward / Growth Radiating Waves -->
    <path d="M 195 60 A 25 25 0 0 1 205 90" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 210 50 A 40 40 0 0 1 225 100" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Dynamic Human Character Action (Verb / Mở rộng) -->
  <g>
    <!-- Motion lines showing forward/outward reach -->
    <path d="M 85 85 L 105 100" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 75 100 L 95 110" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Character Body / Torso -->
    <path d="M 85 155 L 75 120 L 95 105 L 110 135 L 100 155 Z" fill="#2C3E50"/>
    
    <!-- Character Head -->
    <circle cx="85" cy="95" r="11" fill="#E0A96D"/>
    <!-- Hair -->
    <path d="M 74 93 C 74 86 82 83 91 87 C 94 88 95 91 95 94 L 74 93 Z" fill="#3E2723"/>

    <!-- Reaching Arm interacting with expansion -->
    <path d="M 95 110 L 118 118" stroke="#E0A96D" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Supporting Back Arm -->
    <path d="M 85 125 L 65 135" stroke="#2C3E50" stroke-width="5" stroke-linecap="round"/>

    <!-- Professional Attire (Modern Flat Style) -->
    <path d="M 78 118 L 95 105 L 100 130 Z" fill="#34495E"/>
    <path d="M 85 120 L 90 128 L 95 120" fill="none" stroke="#F5A623" stroke-width="1.5"/>
  </g>

  <!-- Foreground Accent Elements to enhance "Expansion" concept -->
  <g>
    <!-- Upward Growth Arrow embedded in the action -->
    <polygon points="185,60 193,72 177,72" fill="#F5A623"/>
  </g>
</svg>