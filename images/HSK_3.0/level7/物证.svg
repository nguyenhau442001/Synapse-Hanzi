<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow / lighting effect -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.6"/>

  <!-- Evidenary File / Document base (matching contextual reference to documentary evidence/case files) -->
  <g transform="translate(65, 55)">
    <!-- Folder/Document Back -->
    <rect x="0" y="0" width="110" height="135" rx="6" fill="#2E3646" />
    <!-- Paper Sheet -->
    <rect x="12" y="-8" width="86" height="20" rx="4" fill="#3A445A" />
    <rect x="15" y="15" width="80" height="105" rx="4" fill="#F0F3F8" />
    
    <!-- Document lines representing case text -->
    <rect x="25" y="30" width="40" height="6" rx="3" fill="#D0D7DE" />
    <rect x="25" y="44" width="55" height="4" rx="2" fill="#D0D7DE" />
    <rect x="25" y="56" width="50" height="4" rx="2" fill="#D0D7DE" />

    <!-- Official Red Seal / Stamp (Legal Context) -->
    <circle cx="70" cy="95" r="14" fill="none" stroke="#E05252" stroke-width="2.5" stroke-dasharray="4,2"/>
    <circle cx="70" cy="95" r="9" fill="none" stroke="#E05252" stroke-width="1.5"/>
  </g>

  <!-- Physical Material Evidence (The "物证" - Magnified Knife/Key Physical Evidence with marker) -->
  <g transform="translate(90, 85)">
    <!-- Evidence marker triangle (Crime scene style indicator) -->
    <polygon points="40,95 20,125 60,125" fill="#E6A15C" />
    <polygon points="40,101 26,121 54,121" fill="#1A1D24" />
    <!-- Number "1" inside marker -->
    <rect x="38" y="108" width="4" height="11" rx="1" fill="#E6A15C" />
    
    <!-- Physical Object: Magnifying Glass overlaying the evidence -->
    <circle cx="75" cy="55" r="32" fill="#1A1D24" fill-opacity="0.8" stroke="#38BDF8" stroke-width="5" />
    <path d="M 98 78 L 122 102" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" />
    <path d="M 98 78 L 122 102" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" />

    <!-- Scalpel / Legal Material Evidence Icon inside the focal area -->
    <g transform="translate(60, 42) rotate(-35)">
      <!-- Blade handle -->
      <rect x="0" y="5" width="22" height="6" rx="2" fill="#94A3B8" />
      <!-- Metallic Blade -->
      <path d="M 22 5 L 36 8 L 22 11 Z" fill="#E2E8F0" />
    </g>
  </g>

  <!-- Secure Evidence Seal Tape (Crossed across the composition for authenticity) -->
  <g transform="translate(30, 160) rotate(-6)">
    <rect x="0" y="0" width="180" height="18" fill="#D97706" />
    <text x="90" y="13" font-family="sans-serif" font-weight="900" font-size="10" fill="#1A1D24" text-anchor="middle" letter-spacing="4">SEALED EVIDENCE</text>
  </g>

</svg>