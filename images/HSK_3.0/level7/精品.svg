<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative architectural blueprint grid lines -->
  <line x1="40" y1="200" x2="200" y2="200" stroke="#2A303C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="60" y1="50" x2="60" y2="200" stroke="#2A303C" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="180" y1="50" x2="180" y2="200" stroke="#2A303C" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Pedestal / Display Base representing a landmark/masterpiece foundation -->
  <path d="M 70 200 L 170 200 L 160 210 L 80 210 Z" fill="#3A4252"/>
  <rect x="75" y="195" width="90" height="5" rx="1.5" fill="#4E596D"/>

  <!-- The Masterpiece Object: A Modern Architectural Landmark Structure (representing 精品 - exquisite masterpiece/building) -->
  <!-- Main skyscraper / structure body -->
  <polygon points="120,40 100,195 140,195" fill="#1E232D"/>

  <!-- Facade geometric facets (sleek, precise, architectural) -->
  <polygon points="120,40 100,195 120,195" fill="#242B38"/>
  <polygon points="120,40 120,195 140,195" fill="#2E3748"/>

  <!-- Golden Accent Lines & Apex (representing premium quality, elite craftsmanship) -->
  <line x1="120" y1="40" x2="120" y2="195" stroke="#F5A623" stroke-width="1.5"/>
  <polygon points="120,30 116,42 124,42" fill="#F5A623"/>

  <!-- Horizontal illuminated architectural floors (precision lines) -->
  <line x1="112" y1="65" x2="128" y2="65" stroke="#61AFEF" stroke-width="1"/>
  <line x1="110" y1="85" x2="130" y2="85" stroke="#61AFEF" stroke-width="1"/>
  <line x1="108" y1="105" x2="132" y2="105" stroke="#61AFEF" stroke-width="1"/>
  <line x1="106" y1="125" x2="134" y2="125" stroke="#61AFEF" stroke-width="1"/>
  <line x1="104" y1="145" x2="136" y2="145" stroke="#61AFEF" stroke-width="1"/>
  <line x1="102" y1="165" x2="138" y2="165" stroke="#61AFEF" stroke-width="1"/>
  <line x1="101" y1="185" x2="139" y2="185" stroke="#61AFEF" stroke-width="1"/>

  <!-- Central glowing core highlight -->
  <polygon points="120,60 118,180 122,180" fill="#61AFEF" opacity="0.3"/>

  <!-- Premium Quality Indicator (Subtle golden sparkle / craftsmanship badge element) -->
  <g transform="translate(165, 75)">
    <circle cx="0" cy="0" r="14" fill="#242B38" stroke="#F5A623" stroke-width="1.5"/>
    <!-- Star / Masterpiece symbol -->
    <path d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" fill="#F5A623" transform="scale(0.8)"/>
  </g>

  <!-- Drafting / Design Compass accents (emphasizing artisan/architectural creation) -->
  <path d="M 50 70 L 65 110" stroke="#4E596D" stroke-width="2" stroke-linecap="round"/>
  <path d="M 75 70 L 65 110" stroke="#4E596D" stroke-width="2" stroke-linecap="round"/>
  <circle cx="65" cy="70" r="3" fill="#F5A623"/>

  <!-- Dimensions / Precision markers -->
  <line x1="95" y1="40" x2="95" y2="195" stroke="#3A4252" stroke-dasharray="2 2"/>
  <line x1="92" y1="40" x2="98" y2="40" stroke="#3A4252" stroke-width="1"/>
  <line x1="92" y1="195" x2="98" y2="195" stroke="#3A4252" stroke-width="1"/>
</svg>