<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sea waves -->
  <path d="M0 180 Q 60 160, 120 180 T 240 180 V 240 H 0 Z" fill="#2C3E50"/>
  <path d="M0 195 Q 60 175, 120 195 T 240 195 V 240 H 0 Z" fill="#34495E"/>
  
  <!-- Destroyer Ship -->
  <g transform="translate(40, 110)">
    <!-- Hull -->
    <path d="M10 50 L 150 50 L 140 70 L 20 70 Z" fill="#7F8C8D"/>
    <!-- Superstructure -->
    <rect x="50" y="20" width="40" height="30" fill="#95A5A6"/>
    <!-- Radar/Mast -->
    <rect x="68" y="5" width="4" height="15" fill="#BDC3C7"/>
    <path d="M60 10 L 80 10" stroke="#BDC3C7" stroke-width="2"/>
    <!-- Turret/Gun -->
    <rect x="100" y="35" width="20" height="15" fill="#BDC3C7"/>
    <rect x="115" y="38" width="15" height="4" fill="#E67E22"/>
  </g>
  
  <!-- Projectile/Action trajectory -->
  <path d="M150 135 Q 180 110, 210 130" stroke="#F39C12" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="210" cy="130" r="4" fill="#F39C12"/>
  
  <!-- Target/Impact -->
  <g transform="translate(190, 110)">
    <circle cx="20" cy="20" r="12" stroke="#E74C3C" stroke-width="3" fill="none"/>
    <line x1="12" y1="12" x2="28" y2="28" stroke="#E74C3C" stroke-width="3"/>
    <line x1="28" y1="12" x2="12" y2="28" stroke="#E74C3C" stroke-width="3"/>
  </g>
</svg>