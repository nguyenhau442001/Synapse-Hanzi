<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements: Subtle geometric grid representing analysis and framework -->
  <g opacity="0.15">
    <line x1="40" y1="60" x2="200" y2="60" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="40" y1="120" x2="200" y2="120" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="40" y1="180" x2="200" y2="180" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="60" y1="40" x2="60" y2="200" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="120" y1="40" x2="120" y2="200" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="180" y1="40" x2="180" y2="200" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Character Silhouette (Self/Identity being examined) -->
  <g transform="translate(0, 5)">
    <!-- Shoulders & Body -->
    <path d="M 90 170 C 90 145 105 135 120 135 C 135 135 150 145 150 170 L 165 185 C 165 185 150 195 120 195 C 90 195 75 185 75 185 Z" fill="#2D3748"/>
    <!-- Head -->
    <circle cx="120" cy="115" r="22" fill="#3B4252"/>
    <!-- Inner self glow / core reflection -->
    <circle cx="120" cy="115" r="14" fill="#4C566A"/>
  </g>

  <!-- Magnifying Glass & Scanning/Scrutiny Elements (Representing "审视" - careful examination, deep look inward) -->
  <g>
    <!-- Focus Ray / Beam of light illuminating the self -->
    <path d="M 120 30 L 90 100 L 150 100 Z" fill="url(#lightBeam)" opacity="0.4"/>
    
    <!-- Magnifying Glass Rim (Gold/Orange accent for focus) -->
    <circle cx="120" cy="95" r="42" fill="none" stroke="#F59E0B" stroke-width="6"/>
    <circle cx="120" cy="95" r="39" fill="#1E293B" opacity="0.6"/>

    <!-- Lens Glare/Highlight -->
    <path d="M 95 75 A 39 39 0 0 1 135 60" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Magnifying Glass Handle -->
    <path d="M 148 123 L 180 155" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="180" cy="155" r="3.5" fill="#D97706"/>
  </g>

  <!-- Precision Crosshairs inside the lens for deep scrutiny -->
  <g stroke="#FCD34D" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <!-- Top cross -->
    <line x1="120" y1="65" x2="120" y2="73"/>
    <!-- Bottom cross -->
    <line x1="120" y1="117" x2="120" y2="125"/>
    <!-- Left cross -->
    <line x1="90" y1="95" x2="98" y2="95"/>
    <!-- Right cross -->
    <line x1="142" y1="95" x2="150" y2="95"/>
  </g>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="lightBeam" x1="120" y1="30" x2="120" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
</svg>