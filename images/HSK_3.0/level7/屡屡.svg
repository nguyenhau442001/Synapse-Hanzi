<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background grid/glow elements for modern CNC manufacturing context -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#262B35" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="65" fill="none" stroke="#262B35" stroke-width="1"/>

  <!-- Conceptual physical object: Modern precision CNC machining cutting head / spindle lowering repeatedly (屡屡 - repeatedly / continuously) -->
  <!-- Support arm / Gantry structure -->
  <path d="M70 65 L170 65 L170 80 L70 80 Z" fill="#2E3646" rx="3"/>
  <rect x="105" y="80" width="30" height="40" fill="#3A4459" rx="2"/>

  <!-- Vertical slide track -->
  <rect x="114" y="90" width="12" height="60" fill="#1E232D" rx="2"/>

  <!-- CNC Spindle / Cutting Head (Active physical tool) -->
  <g transform="translate(0, 15)">
    <!-- Moving carriage -->
    <path d="M100 100 L140 100 L145 135 L95 135 Z" fill="#00E5FF" opacity="0.9"/>
    <!-- Tool holder & spinning bit -->
    <polygon points="120,160 110,135 130,135" fill="#FFB703"/>
    <!-- Cutting motion blur / repeated action trails -->
    <path d="M112 150 L128 150" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <path d="M110 143 L130 143" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Precision Metal Workpiece (Object being worked on repeatedly) -->
  <path d="M75 180 L165 180 L175 200 L65 200 Z" fill="#4B5563" rx="2"/>
  <rect x="75" y="175" width="90" height="7" fill="#6B7280" rx="1"/>
  
  <!-- Precision milled slots (showing successful repeated precision output) -->
  <rect x="90" y="180" width="10" height="4" fill="#1A1D24"/>
  <rect x="110" y="180" width="10" height="4" fill="#1A1D24"/>
  <rect x="130" y="180" width="10" height="4" fill="#1A1D24"/>
  <rect x="150" y="180" width="10" height="4" fill="#1A1D24"/>

  <!-- Visual indicators of "repeated sequence" (multiple action arrows / tiers) -->
  <g fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Up/down repetition markers beside the tool -->
    <path d="M85 110 L75 120 L85 130" opacity="0.8"/>
    <path d="M155 110 L165 120 L155 130" opacity="0.8"/>
    <path d="M75 120 L95 120" opacity="0.8"/>
    <path d="M145 120 L165 120" opacity="0.8"/>
  </g>

  <!-- Success / Quality check markers (Golden accent for high-grade output records) -->
  <circle cx="185" cy="95" r="12" fill="#FFB703" opacity="0.2"/>
  <path d="M180 95 L183 98 L190 91" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="185" cy="130" r="12" fill="#FFB703" opacity="0.2"/>
  <path d="M180 130 L183 133 L190 126" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="185" cy="165" r="12" fill="#FFB703" opacity="0.2"/>
  <path d="M180 165 L183 168 L190 161" fill="none" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>