<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Subtle background glow/pedestal to anchor the core object -->
    <ellipse cx="100" cy="175" rx="55" ry="12" fill="#2A303C" opacity="0.8"/>
    
    <!-- Central Physical Object representing "宗旨" (Core Purpose/Guiding Creed as an ancient architectural compass/stele pillar of integrity) -->
    <!-- Base Plinth -->
    <path d="M 60 170 L 140 170 L 150 185 L 50 185 Z" fill="#2E3646"/>
    <rect x="65" y="160" width="70" height="10" fill="#3A4456"/>

    <!-- Main Pillar / Monument Body (representing foundation and core principle) -->
    <rect x="75" y="65" width="50" height="95" rx="4" fill="#252D3A"/>
    <!-- Inner golden inlay representing core value/mission -->
    <rect x="85" y="75" width="30" height="75" rx="2" fill="#1E2530"/>

    <!-- Compass / Guiding Star Motif (representing direction, aim, purpose) -->
    <circle cx="100" cy="112" r="22" fill="#2E3646"/>
    <circle cx="100" cy="112" r="18" fill="#1A1D24"/>
    
    <!-- Gold Compass Needles -->
    <polygon points="100,92 104,112 100,132 96,112" fill="#F59E0B"/>
    <polygon points="80,112 100,116 120,112 100,108" fill="#E2E8F0"/>
    <circle cx="100" cy="112" r="4" fill="#F59E0B"/>

    <!-- Crown / Apex representing high guiding principle (崇高奉献) -->
    <path d="M 70 65 L 100 35 L 130 65 Z" fill="#F59E0B"/>
    <path d="M 75 65 L 100 40 L 125 65 Z" fill="#FBBF24"/>
    <circle cx="100" cy="30" r="5" fill="#FBBF24"/>

    <!-- Surrounding accent elements: hands or radiating beams of societal service/care (subtle support) -->
    <path d="M 40 140 C 40 120, 55 110, 65 115" stroke="#3A4456" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 160 140 C 160 120, 145 110, 135 115" stroke="#3A4456" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Guiding light / focal points -->
    <circle cx="100" cy="15" r="2" fill="#FBBF24" opacity="0.8"/>
    <circle cx="45" cy="55" r="2.5" fill="#F59E0B" opacity="0.6"/>
    <circle cx="155" cy="55" r="2.5" fill="#F59E0B" opacity="0.6"/>
  </g>
</svg>