<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Merchant Character -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 80 L30 80 L25 30 L-25 30 Z" fill="#3A404D"/>
    <path d="M-25 30 L25 30 L20 0 L-20 0 Z" fill="#FFB84D"/>
    
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#FFD1A9"/>
    
    <!-- Hat (Traditional Merchant style) -->
    <path d="M-35 -40 L35 -40 L25 -55 L-25 -55 Z" fill="#2C313C"/>
    <path d="M-20 -55 L20 -55 C20 -65 10 -70 0 -70 C-10 -70 -20 -65 -20 -55" fill="#2C313C"/>
    
    <!-- Accessories: Abacus and Ledger -->
    <rect x="35" y="10" width="30" height="40" rx="4" fill="#E67E22"/>
    <rect x="40" y="15" width="20" height="30" fill="#F39C12"/>
    <line x1="40" y1="22" x2="60" y2="22" stroke="#2C313C" stroke-width="2"/>
    <line x1="40" y1="30" x2="60" y2="30" stroke="#2C313C" stroke-width="2"/>
    <line x1="40" y1="38" x2="60" y2="38" stroke="#2C313C" stroke-width="2"/>
    
    <rect x="-60" y="20" width="25" height="35" rx="2" fill="#D35400"/>
    <rect x="-55" y="25" width="15" height="25" fill="#E67E22"/>
    
    <!-- Facial Features -->
    <path d="M-10 -15 Q-5 -10 0 -15" stroke="#2C313C" stroke-width="2" fill="none"/>
    <path d="M10 -15 Q15 -10 20 -15" stroke="#2C313C" stroke-width="2" fill="none"/>
    <path d="M-8 0 Q0 5 8 0" stroke="#2C313C" stroke-width="2" fill="none"/>
  </g>
</svg>