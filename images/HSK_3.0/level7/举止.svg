  <circle cx="120" cy="58" r="3" fill="#F59E0B"/>
  
  <!-- Subtle dynamic alignment lines indicating poise and posture -->
  <line x1="120" y1="40" x2="120" y2="200" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 6" opacity="0.25"/>
