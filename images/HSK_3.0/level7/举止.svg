  <circle cx="120" cy="120" r="80" fill="none" stroke="#252A34" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Focused Character Representing "举止" (Graceful Deportment / Manner / Posture) -->
  <!-- Upper Body & Posture of an Elegant Person -->
  
  <!-- Torso / Suit / Elegant Attire -->
  <path d="M85 200 C85 165 95 150 120 150 C145 150 155 165 155 200 Z" fill="#2E384D"/>
  
  <!-- Collar & Neck -->
  <path d="M112 135 L120 150 L128 135 Z" fill="#4B5563"/>
  <rect x="110" y="125" width="20" height="15" rx="4" fill="#E5E7EB"/>
  
  <!-- Head & Chin -->
  <circle cx="120" cy="100" r="22" fill="#F3F4F6"/>
  
  <!-- Sophisticated Hairstyle -->
  <path d="M98 95 C98 80 110 75 120 75 C130 75 142 80 142 95 C142 105 138 92 120 90 C102 92 98 105 98 95 Z" fill="#111827"/>
  
