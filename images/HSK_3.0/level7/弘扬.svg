<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Expanding golden light rays representing propagation/spreading (弘扬) -->
    <path d="M120 120 L80 40" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M120 120 L160 40" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M120 120 L50 85" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M120 120 L190 85" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M120 120 L60 150" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M120 120 L180 150" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Central glowing aura -->
    <circle cx="120" cy="115" r="45" fill="#F59E0B" opacity="0.15"/>
    <circle cx="120" cy="115" r="30" fill="#F59E0B" opacity="0.25"/>

    <!-- Traditional Chinese Bronze Bell (Chưa/Biên-chung style) representing heritage and spreading sound/values -->
    <!-- Bell hanger/hook -->
    <path d="M110 50 L130 50 L135 60 L105 60 Z" fill="#D97706"/>
    <rect x="115" y="42" width="10" height="8" fill="#B45309" rx="2"/>

    <!-- Main Bell Body -->
    <path d="M102 62 C102 62 95 90 92 125 C90 145 95 152 102 155 L138 155 C145 152 150 145 148 125 C145 90 138 62 138 62 Z" fill="#FBBF24"/>
    
    <!-- Bell details/ridges (traditional Chinese bronze motifs) -->
    <rect x="106" y="70" width="28" height="6" rx="2" fill="#D97706"/>
    <rect x="104" y="85" width="32" height="6" rx="2" fill="#D97706"/>
    <rect x="103" y="100" width="34" height="6" rx="2" fill="#D97706"/>
    
    <!-- Bell rim (flanged base) -->
    <path d="M90 155 L150 155 L152 165 C152 165 140 168 120 168 C100 168 88 165 88 165 Z" fill="#D97706"/>

    <!-- Clapper / Sound wave emanations -->
    <circle cx="120" cy="173" r="4" fill="#FBBF24"/>
    <path d="M105 185 C112 190 128 190 135 185" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M95 195 C107 202 133 202 145 195" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Base platform representing solid cultural foundation -->
    <rect x="70" y="208" width="100" height="8" rx="4" fill="#334155"/>
    <rect x="85" y="218" width="70" height="6" rx="3" fill="#475569"/>
  </g>
</svg>