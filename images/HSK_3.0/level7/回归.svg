<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Path -->
  <path d="M40 190 C 100 170, 140 170, 200 190 L 200 210 L 40 210 Z" fill="#2D343E"/>
  
  <!-- The Person (Returning) -->
  <g transform="translate(120, 160)">
    <circle cx="0" cy="-60" r="12" fill="#FFB86C"/>
    <path d="M-8 -48 L 8 -48 L 5 -20 L -5 -20 Z" fill="#FFB86C"/>
