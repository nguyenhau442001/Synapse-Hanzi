<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative modern tech grid lines (subtle) -->
  <line x1="30" y1="120" x2="210" y2="120" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Central Physical Object: Sleek Modern Smart Banking Terminal / ATM Device representing "活期" (Liquid/Demand Deposit Account Access) -->
  
  <!-- Device Base Shadow -->
  <ellipse cx="120" cy="200" rx="60" ry="8" fill="#111318"/>

  <!-- Main Terminal Body -->
  <rect x="75" y="44" width="90" height="152" rx="12" fill="#252A37" stroke="#3A4255" stroke-width="2"/>
  
  <!-- Screen Area -->
  <rect x="85" y="56" width="70" height="78" rx="6" fill="#12151B"/>
  
  <!-- UI on Screen: Dynamic Liquid/Flow Line Graph & Currency Symbol (Instant Access Concept) -->
  <path d="M 95 110 Q 110 95 125 105 T 145 85" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  <circle cx="145" cy="85" r="4" fill="#F5A623"/>

  <!-- Currency Coin Floating/Dropping In (Instant Deposit/Withdrawal accessibility) -->
  <circle cx="120" cy="72" r="10" fill="#F5A623"/>
  <circle cx="120" cy="72" r="7" fill="#F8C15E"/>
  <!-- Simplified Yuan/Currency Symbol inside coin -->
  <line x1="120" y1="67" x2="120" y2="77" stroke="#B3740F" stroke-width="1.5"/>
  <line x1="116" y1="70" x2="124" y2="70" stroke="#B3740F" stroke-width="1.5"/>
  <line x1="117" y1="74" x2="123" y2="74" stroke="#B3740F" stroke-width="1.5"/>

  <!-- Card Slot (Indicating instant account liquidity) -->
  <rect x="95" y="146" width="50" height="6" rx="3" fill="#12151B"/>
  
  <!-- Contactless NFC / Instant Access Waves Symbol -->
  <path d="M 105 32 Q 120 22 135 32" fill="none" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 110 37 Q 120 30 130 37" fill="none" stroke="#4A90E2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="41" r="2" fill="#4A90E2"/>

  <!-- Keypad Area -->
  <circle cx="100" cy="170" r="4" fill="#3A4255"/>
  <circle cx="120" cy="170" r="4" fill="#3A4255"/>
  <circle cx="140" cy="170" r="4" fill="#3A4255"/>
  <circle cx="100" cy="184" r="4" fill="#3A4255"/>
  <circle cx="120" cy="184" r="4" fill="#F5A623"/> <!-- Accent key -->
  <circle cx="140" cy="184" r="4" fill="#3A4255"/>

  <!-- Physical Credit/Debit Card Inserted at top-right for visual grounding -->
  <g transform="translate(140, 34) rotate(15)">
    <rect x="0" y="0" width="32" height="20" rx="3" fill="#4A90E2"/>
    <rect x="0" y="4" width="32" height="4" fill="#12151B"/>
    <rect x="4" y="12" width="8" height="5" rx="1" fill="#F8C15E"/>
  </g>
</svg>