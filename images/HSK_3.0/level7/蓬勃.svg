<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground/Base -->
  <path d="M40 190 H200 V195 H40 Z" fill="#343A46"/>
  
  <!-- Central Action: A person nurturing growth -->
  <!-- Person's body -->
  <path d="M100 190 L100 140 C100 130 110 120 120 120 C130 120 140 130 140 140 L140 190" fill="#F39C12"/>
  <circle cx="120" cy="115" r="12" fill="#F39C12"/>
  
  <!-- Hands cupping the growth -->
  <path d="M105 150 C100 150 95 155 95 160 C95 165 100 170 105 170" fill="#F39C12"/>
  <path d="M135 150 C140 150 145 155 145 160 C145 165 140 170 135 170" fill="#F39C12"/>
  
  <!-- The "蓬勃" growth: A vibrant, multi-layered plant -->
  <g transform="translate(120, 160)">
    <!-- Stem -->
    <rect x="-2" y="-20" width="4" height="20" fill="#2ECC71"/>
    <!-- Leaves expanding outward -->
    <path d="M0 -20 C15 -25 20 -40 15 -45 C5 -40 0 -30 0 -20" fill="#2ECC71"/>
    <path d="M0 -20 C-15 -25 -20 -40 -15 -45 C-5 -40 0 -30 0 -20" fill="#2ECC71"/>
    <path d="M0 -35 C10 -40 15 -55 10 -60 C0 -50 0 -40 0 -35" fill="#2ECC71"/>
    <path d="M0 -35 C-10 -40 -15 -55 -10 -60 C0 -50 0 -40 0 -35" fill="#2ECC71"/>
  </g>
  
  <!-- Motion lines indicating upward energy/growth -->
  <path d="M110 130 L110 110" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 130 L130 110" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 100 L120 85" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
</svg>