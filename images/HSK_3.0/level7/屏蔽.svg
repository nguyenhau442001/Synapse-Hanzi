<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative academic grid lines -->
  <g opacity="0.15">
    <line x1="40" y1="60" x2="200" y2="60" stroke="#8EA2FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="40" y1="120" x2="200" y2="120" stroke="#8EA2FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="40" y1="180" x2="200" y2="180" stroke="#8EA2FF" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Physical Object representing 屏蔽 (Signal Jammer / Barrier Device) -->
  <g transform="translate(0, 0)">
    <!-- Device Body (Modern Sleek Metal Box) -->
    <rect x="80" y="70" width="80" height="110" rx="12" fill="#2D3343" stroke="#404B69" stroke-width="3"/>
    
    <!-- Inner panel -->
    <rect x="92" y="94" width="56" height="62" rx="6" fill="#1A1D24"/>

    <!-- Status Indicator LED (Active/Blocking) -->
    <circle cx="120" cy="110" r="6" fill="#FF5C5C"/>
    <circle cx="120" cy="110" r="10" fill="#FF5C5C" opacity="0.3"/>

    <!-- Vents / Details -->
    <line x1="102" y1="134" x2="138" y2="134" stroke="#404B69" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="146" x2="138" y2="146" stroke="#404B69" stroke-width="3" stroke-linecap="round"/>

    <!-- Antennas (Transmitting/Blocking Signal) -->
    <!-- Left Antenna -->
    <path d="M96 70 L80 35" stroke="#7E8C9D" stroke-width="5" stroke-linecap="round"/>
    <circle cx="80" cy="32" r="4" fill="#F4B860"/>
    
    <!-- Center Antenna -->
    <path d="M120 70 L120 28" stroke="#7E8C9D" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="24" r="4" fill="#F4B860"/>

    <!-- Right Antenna -->
    <path d="M144 70 L160 35" stroke="#7E8C9D" stroke-width="5" stroke-linecap="round"/>
    <circle cx="160" cy="32" r="4" fill="#F4B860"/>

    <!-- Base Mount -->
    <rect x="95" y="180" width="50" height="10" rx="4" fill="#404B69"/>
  </g>

  <!-- Blocked Signal Waves (Dynamic Visual Metaphor) -->
  <g transform="translate(0, 0)">
    <!-- Left Waves -->
    <path d="M 64 85 Q 52 100 64 115" stroke="#F4B860" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 52 75 Q 36 100 52 125" stroke="#F4B860" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Right Waves -->
    <path d="M 176 85 Q 188 100 176 115" stroke="#F4B860" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 188 75 Q 204 100 188 125" stroke="#F4B860" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- Signal Interruption / Shielding Barrier X marks or crosses -->
    <g transform="translate(42, 92)" opacity="0.9">
      <circle cx="0" cy="0" r="10" fill="#FF5C5C"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <g transform="translate(198, 92)" opacity="0.9">
      <circle cx="0" cy="0" r="10" fill="#FF5C5C"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>