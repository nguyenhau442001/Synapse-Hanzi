<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Wall-mounted Air Conditioner Unit -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="120" height="40" rx="6" fill="#374151" stroke="#6B7280" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="20" rx="2" fill="#111827"/>
    <rect x="15" y="35" width="90" height="8" rx="2" fill="#4B5563"/>
  </g>

  <!-- Cool Airflow Effect -->
  <g>
    <path d="M75 125 Q 120 150 165 125" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.8"/>
    <path d="M70 140 Q 120 165 170 140" fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.6"/>
    <path d="M65 155 Q 120 180 175 155" fill="none" stroke="#DBEAFE" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.4"/>
  </g>

  <!-- Silhouette of a person enjoying the cool air -->
  <g transform="translate(100, 160)">
    <circle cx="20" cy="10" r="10" fill="#FBBF24"/>
    <path d="M5 25 Q 20 20 35 25 L 30 60 L 10 60 Z" fill="#FBBF24"/>
    <!-- Relaxed posture -->
    <path d="M10 30 L 0 45" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 30 L 40 45" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>