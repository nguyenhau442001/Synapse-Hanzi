<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient glow behind bed -->
  <ellipse cx="120" cy="155" rx="75" ry="30" fill="#242B38" opacity="0.6"/>

  <!-- Bed Frame -->
  <!-- Headboard & Footboard -->
  <rect x="52" y="145" width="12" height="40" rx="4" fill="#3A4454"/>
  <rect x="176" y="145" width="12" height="40" rx="4" fill="#3A4454"/>
  
  <!-- Bed Base -->
  <rect x="58" y="170" width="124" height="15" rx="3" fill="#2E3748"/>
  <!-- Mattress -->
  <rect x="62" y="158" width="116" height="15" rx="5" fill="#4B5563"/>

  <!-- Pillow -->
  <rect x="72" y="142" width="36" height="20" rx="6" fill="#9CA3AF"/>

  <!-- Sleeping child tucked in safely -->
  <path d="M 85 148 Q 110 145 135 150 Q 140 152 140 158 L 78 158 Z" fill="#60A5FA"/>
  <circle cx="85" cy="148" r="8" fill="#FBBF24"/>

  <!-- Canopy Frame (Top Hook/Structure) -->
  <line x1="120" y1="45" x2="120" y2="65" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="43" r="4" fill="#E5E7EB"/>

  <!-- Mosquito Net (蚊帐) - Flowing translucent veil -->
  <!-- Back folds -->
  <path d="M 120 65 Q 165 100 174 175 L 66 175 Q 75 100 120 65 Z" fill="#E5E7EB" opacity="0.12"/>
  
  <!-- Front drape with soft folds -->
  <path d="M 120 65 C 135 110 178 140 174 175 C 150 175 130 178 120 183 C 110 178 90 175 66 175 C 62 140 105 110 120 65 Z" fill="#F3F4F6" opacity="0.22"/>

  <!-- Highlight overlay for sheer fabric look -->
  <path d="M 120 65 Q 145 110 150 178 L 90 178 Q 95 110 120 65 Z" fill="#FFFFFF" opacity="0.1"/>

  <!-- Tucked base effect (showing secure edges mentioned in context) -->
  <path d="M 58 175 L 182 175 L 185 183 L 55 183 Z" fill="#3B82F6" opacity="0.3"/>

  <!-- Focus accent: A subtle warm bedside glow hinting at a safe night -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.2" stroke-dasharray="4 8"/>
</svg>