<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Water Surface Background -->
  <path d="M 0 100 Q 60 90, 120 100 T 240 100 L 240 240 L 0 240 Z" fill="#0E2438"/>
  <path d="M 0 115 Q 60 105, 120 115 T 240 115 L 240 240 L 0 240 Z" fill="#113352"/>
  
  <!-- Underwater glow / depth -->
  <rect x="0" y="130" width="240" height="110" fill="#0A1826" opacity="0.6"/>

  <!-- Water Ripples at Surface -->
  <path d="M 40 100 Q 55 95, 70 100" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 160 105 Q 175 100, 190 105" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 100 108 Q 115 103, 130 108" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Drowning Person Vector (Submerged / Reaching up) -->
  <!-- Body submerged -->
  <path d="M 110 145 L 122 135 L 135 150 L 125 185 L 115 185 Z" fill="#F59E0B" opacity="0.85"/>
  
  <!-- Head partially underwater/tipping back -->
  <circle cx="120" cy="122" r="14" fill="#FBBF24"/>
  
  <!-- Hair strands moving in water -->
  <path d="M 110 116 Q 104 112, 107 108" stroke="#D97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 114 114 Q 108 108, 112 102" stroke="#D97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Arms reaching UP out of the water toward the surface -->
  <!-- Left arm reaching high -->
  <path d="M 112 138 Q 95 110, 85 85" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Right arm reaching high -->
  <path d="M 128 138 Q 145 110, 155 85" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Hands / FINGERS breaking the water surface -->
  <!-- Left hand -->
  <circle cx="83" cy="83" r="5" fill="#FBBF24"/>
  <path d="M 80 81 L 78 77 M 83 80 L 83 75 M 86 81 L 88 77" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right hand -->
  <circle cx="157" cy="83" r="5" fill="#FBBF24"/>
  <path d="M 154 81 L 152 77 M 157 80 L 157 75 M 160 81 L 162 77" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>

  <!-- Water splashes around the hands breaking the surface -->
  <path d="M 75 92 Q 83 82, 91 92" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 149 92 Q 157 82, 165 92" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="78" cy="88" r="2" fill="#38BDF8"/>
  <circle cx="88" cy="87" r="1.5" fill="#38BDF8"/>
  <circle cx="152" cy="88" r="1.5" fill="#38BDF8"/>
  <circle cx="162" cy="87" r="2" fill="#38BDF8"/>

  <!-- Rising Air Bubbles Underwater -->
  <circle cx="102" cy="142" r="3" fill="#38BDF8" opacity="0.7"/>
  <circle cx="98" cy="128" r="2" fill="#38BDF8" opacity="0.8"/>
  <circle cx="100" cy="116" r="1.5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="142" cy="148" r="2.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="146" cy="134" r="1.5" fill="#38BDF8" opacity="0.8"/>

  <!-- Emergency / Alert Focal Accent (Subtle Red/Orange glow highlighting danger) -->
  <circle cx="120" cy="122" r="22" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-dasharray="4,4" opacity="0.5"/>
</svg>