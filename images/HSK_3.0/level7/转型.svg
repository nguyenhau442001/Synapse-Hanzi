<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Base Platform -->
    <path d="M-75 50 L75 50 L90 70 L-90 70 Z" fill="#2A2F3D" />
    <ellipse cx="0" cy="50" rx="75" ry="12" fill="#353D50" />
    
    <!-- Left Side: Traditional Coal Industry Object (Industrial Smokestack & Gears) -->
    <g transform="translate(-45, 10)">
      <!-- Smokestack -->
      <path d="M-15 35 L-20 -15 L-10 -25 L-5 35 Z" fill="#4E596D" />
      <path d="M-22 -15 L-8 -15 L-8 -19 L-22 -19 Z" fill="#6B7A99" />
      <!-- Smoke / Pollutant puffs -->
      <circle cx="-25" cy="-35" r="7" fill="#4E596D" opacity="0.5"/>
      <circle cx="-35" cy="-48" r="10" fill="#4E596D" opacity="0.3"/>
      
      <!-- Heavy Industrial Gear -->
      <circle cx="15" cy="15" r="18" fill="#5C6B85" />
      <circle cx="15" cy="15" r="8" fill="#1A1D24" />
      <rect x="12" y="-5" width="6" height="40" fill="#5C6B85" />
      <rect x="-5" y="12" width="40" height="6" fill="#5C6B85" />
    </g>

    <!-- Center Transformation Bridge / Dynamic Transition Mechanism -->
    <g transform="translate(0, -10)">
      <!-- Sweeping dynamic energy curve indicating "Transformation/Shift" -->
      <path d="M-40 20 C -20 -10, 20 -10, 40 20" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
      <path d="M-25 30 C -10 5, 10 5, 25 30" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />
      
      <!-- Central Glowing Transition Arrow Node -->
      <circle cx="0" cy="0" r="14" fill="#F59E0B" />
      <path d="M-4 -2 L4 2 L-4 6 Z" fill="#1A1D24" />
    </g>

    <!-- Right Side: Modern Green & Low-Carbon Industry Object (Wind Turbine & Leaf Structure) -->
    <g transform="translate(45, 10)">
      <!-- Wind Turbine Tower -->
      <path d="M-2 35 L0 -25 L3 35 Z" fill="#94A3B8" />
      
      <!-- Turbine Hub & Blades -->
      <circle cx="0" cy="-25" r="5" fill="#E2E8F0" />
      <!-- Blade 1 (Top) -->
      <path d="M0 -28 C0 -45, 3 -55, 5 -60 C3 -50, 2 -38, 0 -28 Z" fill="#10B981" />
      <!-- Blade 2 (Bottom Right) -->
      <path d="M3 -23 C18 -15, 28 -5, 35 2 C25 -2, 12 -10, 3 -23 Z" fill="#10B981" />
      <!-- Blade 3 (Bottom Left) -->
      <path d="M-3 -23 C-18 -15, -28 -5, -35 2 C-25 -2, -12 -10, -3 -23 Z" fill="#10B981" />

      <!-- Supporting Eco Sprout / Leaf at base -->
      <path d="M15 35 C15 25, 25 20, 30 15 C30 25, 20 32, 15 35 Z" fill="#34D399" />
    </g>
    
    <!-- Floating Eco-Tech Particles (Representing "Green, Low-Carbon, New Structure") -->
    <circle cx="-15" cy="-35" r="3" fill="#34D399" opacity="0.8" />
    <circle cx="20" cy="-45" r="2.5" fill="#34D399" opacity="0.9" />
    <circle cx="55" cy="-15" r="2" fill="#F59E0B" opacity="0.7" />
  </g>
</svg>