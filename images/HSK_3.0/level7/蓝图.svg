<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Blueprint Paper -->
  <rect x="50" y="60" width="140" height="100" rx="4" fill="#2563EB" stroke="#60A5FA" stroke-width="2"/>
  
  <!-- Architectural Grid Lines -->
  <path d="M50 80h140M50 100h140M50 120h140M50 140h140M70 60v100M90 60v100M110 60v100M130 60v100M150 60v100M170 60v100" stroke="#1E40AF" stroke-width="1" fill="none"/>
  
  <!-- Building Outline (The "Plan") -->
  <path d="M80 140V100l30-20 30 20v40z" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="100" y="110" width="20" height="30" fill="#FBBF24" opacity="0.3"/>
  
  <!-- Drafting Tools -->
  <path d="M160 170l-30 30" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="170" r="4" fill="#FBBF24"/>
  <path d="M130 200l-10-5" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Compass/Divider -->
  <path d="M190 140l-15 40M190 140l-5 40" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="190" cy="140" r="3" fill="#FBBF24"/>
</svg>