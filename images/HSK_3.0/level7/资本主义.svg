<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Industrial Factory Background Elements -->
    <path d="M45 130 L45 175 L75 175 L75 145 L90 145 L90 175 L120 175 L120 120 L105 105 L45 130 Z" fill="#252A34"/>
    <rect x="55" y="140" width="12" height="15" rx="2" fill="#323846"/>
    <rect x="98" y="130" width="12" height="25" rx="2" fill="#323846"/>
    
    <!-- Smokestacks emitting subtle vapor -->
    <rect x="135" y="95" width="14" height="80" fill="#2D3341"/>
    <path d="M137 95 C135 80, 145 75, 142 60" stroke="#3D4454" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="175" y="105" width="12" height="70" fill="#2D3341"/>
    <path d="M181 105 C179 90, 189 85, 186 72" stroke="#3D4454" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Central Modern Factory / Industrial Architecture (Main Object) -->
    <path d="M50 175 L190 175 L190 185 L50 185 Z" fill="#3A4252"/>
    <polygon points="65,115 120,85 175,115 175,175 65,175" fill="#2A313D"/>
    
    <!-- Factory Roof Trusses/Lines -->
    <line x1="120" y1="85" x2="120" y2="175" stroke="#353E4D" stroke-width="3"/>
    
    <!-- Glowing Industrial Windows (Accent) -->
    <polygon points="75,130 110,110 110,140 75,150" fill="#FFB703" opacity="0.85"/>
    <polygon points="130,110 165,130 165,150 130,140" fill="#FFB703" opacity="0.85"/>
    
    <rect x="80" y="155" width="20" height="20" fill="#FFB703" opacity="0.9"/>
    <rect x="140" y="155" width="20" height="20" fill="#FFB703" opacity="0.9"/>

    <!-- Prominent Capital / Financial & Industrial Growth Elements -->
    <!-- Large Interlocking Industrial Gears symbolizing Production & Capital -->
    <g transform="translate(180, 105)">
      <circle cx="0" cy="0" r="22" fill="#D39E00"/>
      <circle cx="0" cy="0" r="12" fill="#1A1D24"/>
      <rect x="-4" y="-28" width="8" height="56" fill="#D39E00" rx="2"/>
      <rect x="-28" y="-4" width="56" height="8" fill="#D39E00" rx="2"/>
      <rect x="-22" y="-22" width="44" height="44" fill="#D39E00" rx="2" transform="rotate(45)"/>
    </g>

    <g transform="translate(60, 105)">
      <circle cx="0" cy="0" r="16" fill="#F4C430"/>
      <circle cx="0" cy="0" r="8" fill="#1A1D24"/>
      <rect x="-3" y="-20" width="6" height="40" fill="#F4C430" rx="1"/>
      <rect x="-20" y="-3" width="40" height="6" fill="#F4C430" rx="1"/>
      <rect x="-15" y="-15" width="30" height="30" fill="#F4C430" rx="1" transform="rotate(45)"/>
    </g>

    <!-- Financial Growth Arrow / Chart overlaying the industrial base -->
    <path d="M55 195 L95 165 L130 180 L185 125" stroke="#FFB703" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="185,115 195,125 185,135 192,125" fill="#FFB703"/>

    <!-- Growth data nodes -->
    <circle cx="95" cy="165" r="4" fill="#FFFFFF"/>
    <circle cx="130" cy="180" r="4" fill="#FFFFFF"/>
    <circle cx="185" cy="125" r="5" fill="#FFFFFF"/>
  </g>
</svg>