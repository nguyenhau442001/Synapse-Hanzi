<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main Object: A stylized, professional briefcase representing a specific fund/financial allocation -->
  <g transform="translate(60, 70)">
    <!-- Briefcase Body -->
    <rect x="0" y="20" width="120" height="80" rx="8" fill="#FFB84D"/>
    <!-- Briefcase Top Flap -->
    <path d="M0 28 C0 20, 8 12, 16 12 H104 C112 12, 120 20, 120 28 V28 H0 Z" fill="#E69F33"/>
    <!-- Handle -->
    <path d="M40 12 V0 H80 V12" fill="none" stroke="#FFB84D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lock Detail -->
    <rect x="52" y="35" width="16" height="10" rx="2" fill="#1A1D24" opacity="0.2"/>
    <!-- Currency Symbol/Indicator (Abstracted as a clean coin slot) -->
    <circle cx="60" cy="60" r="15" fill="#1A1D24" opacity="0.1"/>
    <rect x="57" y="50" width="6" height="20" rx="1" fill="#1A1D24" opacity="0.2"/>
  </g>

  <!-- Decorative elements to imply 'Specific Allocation' (Categorization) -->
  <rect x="80" y="170" width="80" height="4" rx="2" fill="#3D4451"/>
  <rect x="95" y="182" width="50" height="4" rx="2" fill="#3D4451"/>
</svg>