<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Background sand gradient -->
    <linearGradient id="sandDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D231E"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
    
    <!-- Surface sand dunes gradient -->
    <linearGradient id="duneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93B"/>
      <stop offset="100%" stop-color="#B87622"/>
    </linearGradient>
    
    <!-- Ancient artifact gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#D49419"/>
    </linearGradient>
  </defs>

  <!-- Deep underground / soil stratum -->
  <rect x="0" y="90" width="240" height="150" fill="url(#sandDeep)"/>

  <!-- Stratum lines indicating depth and time -->
  <path d="M 0 130 Q 60 120, 120 135 T 240 125" fill="none" stroke="#3A2E28" stroke-width="2" opacity="0.7"/>
  <path d="M 0 170 Q 70 185, 140 170 T 240 180" fill="none" stroke="#3A2E28" stroke-width="2" opacity="0.7"/>

  <!-- Buried Ancient Artifact (Physical Noun Representation of "埋藏") -->
  <g transform="translate(0, 15)">
    <!-- Partially revealed stone temple ruins / pillar peeking out -->
    <path d="M 90 95 L 150 95 L 160 135 L 80 135 Z" fill="#4A525D"/>
    <!-- Broken pillar top -->
    <rect x="100" y="85" width="40" height="12" rx="2" fill="#626C7A"/>
    <!-- Mysterious glowing artifact / relic embedded in earth -->
    <path d="M 120 110 L 135 125 L 120 140 L 105 125 Z" fill="url(#goldGrad)"/>
    <circle cx="120" cy="125" r="5" fill="#FFF5CC"/>
  </g>

  <!-- Surface ground line separating world and buried realm -->
  <path d="M 0 90 Q 60 100, 120 90 T 240 92" fill="none" stroke="#7A562B" stroke-width="3"/>

  <!-- Upper Layer: Rolling Desert Dunes (Contextual reference) -->
  <!-- Background dune -->
  <path d="M -10 90 Q 70 40, 150 70 Q 200 90, 250 85 L 250 95 L -10 95 Z" fill="#8C5C26" opacity="0.6"/>
  
  <!-- Foreground main dune -->
  <path d="M 0 90 Q 90 50, 180 85 Q 210 95, 240 90 L 240 240 L 0 240 Z" fill="url(#duneGrad)" opacity="0.95"/>

  <!-- Sparkling dust / hidden ancient energy escaping upward -->
  <circle cx="120" cy="75" r="2.5" fill="#FFD15C" opacity="0.8"/>
  <circle cx="105" cy="60" r="1.5" fill="#FFD15C" opacity="0.6"/>
  <circle cx="138" cy="65" r="2" fill="#FFD15C" opacity="0.7"/>
  <path d="M 120 85 L 120 65" stroke="#FFD15C" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8"/>

</svg>