<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(70, 30)">
    <!-- Smartphone Body -->
    <rect x="0" y="0" width="100" height="180" rx="14" fill="#2D333B" stroke="#4A5568" stroke-width="2"/>
    <rect x="8" y="16" width="84" height="148" rx="6" fill="#1E2229"/>
    
    <!-- Phone Screen UI: Document upload -->
    <rect x="20" y="32" width="60" height="8" rx="4" fill="#F59E0B" opacity="0.8"/>
    <rect x="20" y="52" width="60" height="40" rx="4" fill="#252A33"/>
    <circle cx="50" cy="72" r="12" fill="#3B4252"/>
    <path d="M44 72 L48 76 L56 68" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Input Fields -->
    <rect x="20" y="104" width="60" height="8" rx="2" fill="#3B4252"/>
    <rect x="20" y="118" width="45" height="8" rx="2" fill="#3B4252"/>
    
    <!-- Action Button (Ready / Completed) -->
    <rect x="20" y="138" width="60" height="16" rx="8" fill="#10B981"/>
    <path d="M47 146 L50 149 L55 143" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Phone Speaker & Notch -->
    <rect x="40" y="8" width="20" height="4" rx="2" fill="#4A5568"/>
  </g>

  <!-- Instant Success Checkmark Floating Accent -->
  <g transform="translate(150, 95)">
    <circle cx="20" cy="20" r="22" fill="#10B981" opacity="0.15"/>
    <circle cx="20" cy="20" r="16" fill="#10B981"/>
    <path d="M13 20 L18 25 L27 15" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>