<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative elements (Subtle alignment line/spotlight) -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  <ellipse cx="120" cy="195" rx="70" ry="10" fill="#12141A" opacity="0.6"/>

  <!-- Left Twin -->
  <g transform="translate(68, 55)">
    <!-- Body/Shoulders -->
    <path d="M 0 130 C 0 100, 15 90, 32 90 C 49 90, 64 100, 64 130 Z" fill="#2E384D"/>
    <!-- Collar/Shirt -->
    <path d="M 22 90 L 32 105 L 42 90 Z" fill="#4B5563"/>
    <path d="M 16 93 L 32 110 L 48 93 Z" fill="#3B82F6"/>
    <!-- Neck -->
    <rect x="25" y="75" width="14" height="20" rx="4" fill="#FDE047"/>
    <!-- Head -->
    <circle cx="32" cy="55" r="22" fill="#FDE047"/>
    <!-- Hair -->
    <path d="M 10 55 C 10 35, 20 30, 32 30 C 44 30, 54 35, 54 55 C 54 60, 48 50, 45 42 C 40 38, 24 38, 19 42 C 16 50, 10 60, 10 55 Z" fill="#1E293B"/>
    <!-- Face details (Minimalist flat) -->
    <circle cx="24" cy="54" r="2" fill="#1E293B"/>
    <circle cx="40" cy="54" r="2" fill="#1E293B"/>
    <path d="M 30 64 Q 32 67 34 64" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Academic/Identical detail: Small graduation cap or collar accent to tie to context -->
  </g>

  <!-- Right Twin -->
  <g transform="translate(108, 55)">
    <!-- Body/Shoulders -->
    <path d="M 0 130 C 0 100, 15 90, 32 90 C 49 90, 64 100, 64 130 Z" fill="#2E384D"/>
    <!-- Collar/Shirt -->
    <path d="M 22 90 L 32 105 L 42 90 Z" fill="#4B5563"/>
    <path d="M 16 93 L 32 110 L 48 93 Z" fill="#3B82F6"/>
    <!-- Neck -->
    <rect x="25" y="75" width="14" height="20" rx="4" fill="#FDE047"/>
    <!-- Head -->
    <circle cx="32" cy="55" r="22" fill="#FDE047"/>
    <!-- Hair -->
    <path d="M 10 55 C 10 35, 20 30, 32 30 C 44 30, 54 35, 54 55 C 54 60, 48 50, 45 42 C 40 38, 24 38, 19 42 C 16 50, 10 60, 10 55 Z" fill="#1E293B"/>
    <!-- Face details (Identical) -->
    <circle cx="24" cy="54" r="2" fill="#1E293B"/>
    <circle cx="40" cy="54" r="2" fill="#1E293B"/>
    <path d="M 30 64 Q 32 67 34 64" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Connection/Symmetry indicator - Gold accent representing identity/parallel -->
  <path d="M 100 135 L 140 135" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="135" r="4" fill="#F59E0B"/>
</svg>