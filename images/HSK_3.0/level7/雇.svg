<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle grid / office environment hints -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2A2F3B" stroke-width="2" stroke-linecap="round"/>
  <rect x="70" y="85" width="100" height="95" rx="4" fill="#222733"/>
  <rect x="80" y="95" width="80" height="55" rx="2" fill="#1A1D24"/>
  <!-- Computer screen interface content (abstract hiring/profile) -->
  <circle cx="100" cy="115" r="10" fill="#3A4256"/>
  <path d="M90 135 C90 128 95 125 100 125 C105 125 110 128 110 135" fill="#3A4256"/>
  <line x1="120" y1="110" x2="150" y2="110" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="125" x2="140" y2="125" stroke="#3A4256" stroke-width="3" stroke-linecap="round"/>

  <!-- Desk Surface -->
  <path d="M50 170 L190 170 L200 185 L40 185 Z" fill="#2E3646"/>

  <!-- Character 1: Employer (Giving/Offering contract) -->
  <!-- Body/Suit -->
  <path d="M50 170 L75 130 L95 170 Z" fill="#3B82F6"/>
  <circle cx="72" cy="120" r="12" fill="#FDE047"/> <!-- Head -->
  <!-- Arm reaching forward with contract/document -->
  <path d="M75 140 L115 145 L115 152 L75 148 Z" fill="#3B82F6"/>

  <!-- Character 2: Employee (Being hired / Accepting role) -->
  <!-- Body/Suit -->
  <path d="M190 170 L165 130 L145 170 Z" fill="#10B981"/>
  <circle cx="168" cy="120" r="12" fill="#FDE047"/> <!-- Head -->
  <!-- Arm reaching forward to shake/accept -->
  <path d="M165 140 L125 145 L125 152 L165 148 Z" fill="#10B981"/>

  <!-- Central Contract / Employment Offer (Focus element in Amber/Gold) -->
  <rect x="110" y="132" width="20" height="26" rx="2" fill="#FFFFFF"/>
  <line x1="114" y1="138" x2="126" y2="138" stroke="#FFB703" stroke-width="2" stroke-linecap="round"/>
  <line x1="114" y1="144" x2="126" y2="144" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="114" y1="150" x2="122" y2="150" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Handshake overlap / agreement focal point -->
  <circle cx="120" cy="148" r="5" fill="#FFB703"/>

</svg>