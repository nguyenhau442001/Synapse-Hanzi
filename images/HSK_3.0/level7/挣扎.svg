<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- River Waves -->
  <path d="M0 160 Q 60 140, 120 160 T 240 160 V 240 H 0 Z" fill="#2C3E50" opacity="0.6"/>
  <path d="M0 180 Q 80 160, 160 180 T 240 180 V 240 H 0 Z" fill="#34495E" opacity="0.8"/>
  
  <!-- Struggling Animal (Small Fox/Creature) -->
  <g transform="translate(120, 140) rotate(-15)">
    <!-- Body -->
    <path d="M-30 0 Q 0 -20, 30 0 L 20 20 L -20 20 Z" fill="#E67E22"/>
    <!-- Head -->
    <circle cx="35" cy="-10" r="15" fill="#E67E22"/>
    <!-- Ears -->
    <path d="M25 -20 L 30 -35 L 35 -20 Z" fill="#E67E22"/>
    <path d="M40 -20 L 45 -35 L 50 -20 Z" fill="#E67E22"/>
    <!-- Flailing Limbs -->
    <path d="M-20 10 L -40 0" stroke="#E67E22" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 10 L 40 0" stroke="#E67E22" stroke-width="6" stroke-linecap="round"/>
    <path d="M-10 20 L -15 40" stroke="#E67E22" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 20 L 15 40" stroke="#E67E22" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Water Splashes -->
  <circle cx="90" cy="150" r="4" fill="#F39C12" opacity="0.8"/>
  <circle cx="150" cy="130" r="6" fill="#F39C12" opacity="0.8"/>
  <circle cx="110" cy="110" r="3" fill="#F39C12" opacity="0.8"/>
  <path d="M100 140 Q 110 120, 120 140" stroke="#F39C12" stroke-width="2" fill="none" opacity="0.6"/>
</svg>