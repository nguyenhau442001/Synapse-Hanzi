<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Ambient Kitchen Background Elements -->
    <rect x="20" y="20" width="176" height="110" rx="12" fill="#242833"/>
    <path d="M 20 80 L 196 80" stroke="#2F3542" stroke-width="2"/>
    <rect x="35" y="35" width="40" height="35" rx="4" fill="#2E3440"/>
    <rect x="141" y="35" width="40" height="35" rx="4" fill="#2E3440"/>
    
    <!-- Steam / Motion lines for busy preparation -->
    <path d="M 95 65 Q 90 50 100 40 T 95 20" fill="none" stroke="#FFA116" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 121 65 Q 126 50 116 40 T 121 20" fill="none" stroke="#FFA116" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Central Character: A person bustling with activity (忙活) -->
    <!-- Body & Apron -->
    <circle cx="108" cy="85" r="16" fill="#F6C90E"/>
    <path d="M 92 101 C 92 98 124 98 124 101 L 132 155 C 132 158 129 160 126 160 L 90 160 C 87 160 84 158 84 155 Z" fill="#E74C3C"/>
    
    <!-- Apron details -->
    <path d="M 98 112 L 118 112 L 122 155 L 94 155 Z" fill="#ECF0F1"/>
    <rect x="103" y="122" width="10" height="12" rx="2" fill="#BDC3C7"/>

    <!-- Busy Multi-directional Arms (representing 'tất bật') -->
    <!-- Left Arm reaching up -->
    <path d="M 92 105 L 70 85 L 62 92" fill="none" stroke="#F6C90E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Arm holding ladle/pan -->
    <path d="M 124 105 L 150 90 L 165 100" fill="none" stroke="#F6C90E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Action Speed Lines / Motion Blur -->
    <path d="M 55 78 C 50 82 50 95 58 100" fill="none" stroke="#FFA116" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 172 88 C 178 95 178 108 168 115" fill="none" stroke="#FFA116" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Kitchen Counter -->
    <rect x="12" y="155" width="192" height="60" rx="8" fill="#3B4252"/>
    <rect x="12" y="155" width="192" height="10" fill="#4C566A"/>

    <!-- Cooking Utensils & Pots on Counter -->
    <!-- Steaming Pot -->
    <rect x="85" y="130" width="46" height="25" rx="6" fill="#D8DEE9"/>
    <path d="M 75 137 L 85 137" stroke="#D8DEE9" stroke-width="4" stroke-linecap="round"/>
    <path d="M 131 137 L 141 137" stroke="#D8DEE9" stroke-width="4" stroke-linecap="round"/>
    <circle cx="108" cy="126" r="3" fill="#E5E9F0"/>
    
    <!-- Chopping Board and Cleaver -->
    <ellipse cx="45" cy="175" rx="22" ry="10" fill="#88C0D0"/>
    <rect x="35" y="160" width="8" height="20" rx="2" fill="#E5E9F0" transform="rotate(25 35 160)"/>
    
    <!-- Dumpling / Festive food preparation bowl -->
    <path d="M 155 155 L 185 155 C 190 155 192 165 187 170 L 153 170 C 148 165 150 155 155 155 Z" fill="#ECEFF4"/>
    <circle cx="163" cy="150" r="5" fill="#E5E9F0"/>
    <circle cx="172" cy="148" r="6" fill="#E5E9F0"/>
    <circle cx="180" cy="151" r="5" fill="#E5E9F0"/>

    <!-- Accent Energy / Sparkles representing bustling effort -->
    <path d="M 32 45 L 35 52 L 42 55 L 35 58 L 32 65 L 29 58 L 22 55 L 29 52 Z" fill="#FFA116"/>
    <path d="M 184 45 L 186 50 L 191 52 L 186 54 L 184 59 L 182 54 L 177 52 L 182 50 Z" fill="#FFA116"/>
  </g>
</svg>