<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background snowy mountain peaks (连绵起伏的雪山) -->
  <path d="M 20 180 L 60 120 L 90 150 L 130 90 L 170 140 L 210 100 L 220 180 Z" fill="#222B38"/>
  <path d="M 60 120 L 75 140 L 60 155 L 45 140 Z" fill="#E2E8F0" opacity="0.8"/>
  <path d="M 130 90 L 150 120 L 130 135 L 110 120 Z" fill="#E2E8F0" opacity="0.9"/>
  <path d="M 210 100 L 220 115 L 210 125 L 200 115 Z" fill="#E2E8F0" opacity="0.85"/>
  
  <!-- Main Snow Mountain Range (Crossing Target) -->
  <path d="M 10 190 L 70 105 L 120 155 L 175 75 L 230 160 L 230 190 Z" fill="#2A3649"/>
  
  <!-- Snowcaps -->
  <path d="M 70 105 L 90 132 L 80 142 L 70 130 L 55 127 Z" fill="#F8FAFC"/>
  <path d="M 175 75 L 200 112 L 188 122 L 175 105 L 155 102 Z" fill="#F8FAFC"/>
  
  <!-- Dotted Trajectory Arc (越过 - Crossing over) -->
  <path d="M 40 160 Q 120 20 200 110" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,6" stroke-linecap="round"/>
  
  <!-- Explorer Character Mid-Air (越过) -->
  <g transform="translate(120, 68) rotate(25)">
    <!-- Backpack -->
    <rect x="-14" y="-8" width="10" height="16" rx="3" fill="#D97706"/>
    <!-- Body -->
    <path d="M-10,-6 L10,-2 L6,14 L-6,14 Z" fill="#3B82F6"/>
    <!-- Head with Helmet -->
    <circle cx="0" cy="-14" r="7" fill="#FDE68A"/>
    <path d="M-7,-14 C-7,-18 7,-18 7,-14 L7,-11 L-7,-11 Z" fill="#EF4444"/>
    <!-- Flying Limbs (Action pose) -->
    <path d="M-8,2 L-18,-4" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
    <path d="M6,6 L16,0" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
    <path d="M-4,14 L-12,22" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
    <path d="M4,14 L12,24" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Ground Foreground -->
  <path d="M 0 190 L 240 190 L 240 240 L 0 240 Z" fill="#15181E"/>
</svg>