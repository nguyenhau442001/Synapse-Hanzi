<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background terrain / ground line -->
  <path d="M20 180 L220 180" stroke="#2D333F" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Border / Gate Structure (Representing 口岸 - Port/Border Crossing) -->
  <!-- Left Pillar -->
  <rect x="50" y="80" width="20" height="100" fill="#2E384D" rx="2"/>
  <rect x="46" y="75" width="28" height="10" fill="#E67E22" rx="2"/>
  
  <!-- Right Pillar -->
  <rect x="170" y="80" width="20" height="100" fill="#2E384D" rx="2"/>
  <rect x="166" y="75" width="28" height="10" fill="#E67E22" rx="2"/>
  
  <!-- Overhead Gantry / Crossing Sign -->
  <rect x="60" y="65" width="120" height="16" fill="#3B465E" rx="3"/>
  <rect x="95" y="60" width="50" height="8" fill="#F1C40F" rx="2"/>
  
  <!-- Boom Barrier (Open/Active) -->
  <rect x="70" y="110" width="70" height="6" rx="3" fill="#E74C3C" transform="rotate(-35 70 110)"/>
  <circle cx="70" cy="110" r="5" fill="#2E384D"/>

  <!-- Railway / Road tracks passing through the port -->
  <path d="M40 180 L200 180" stroke="#3B465E" stroke-width="4"/>
  <path d="M50 176 L190 176" stroke="#4E5D78" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Freight Train / Container (Contextual reference to cargo trains passing through) -->
  <g transform="translate(105, 130)">
    <!-- Train body -->
    <rect x="-35" y="20" width="70" height="30" rx="4" fill="#3498DB"/>
    <!-- Container details -->
    <rect x="-30" y="24" width="60" height="22" fill="none" stroke="#2980B9" stroke-width="2"/>
    <line x1="-10" y1="24" x2="-10" y2="46" stroke="#2980B9" stroke-width="2"/>
    <line x1="10" y1="24" x2="10" y2="46" stroke="#2980B9" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="-20" cy="52" r="6" fill="#7F8C8D"/>
    <circle cx="-20" cy="52" r="3" fill="#2C3E50"/>
    <circle cx="20" cy="52" r="6" fill="#7F8C8D"/>
    <circle cx="20" cy="52" r="3" fill="#2C3E50"/>
    <!-- Motion lines -->
    <path d="M -45 35 L -55 35" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
    <path d="M -40 45 L -50 45" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Security / Control Booth (Representing Border Post) -->
  <g transform="translate(25, 125)">
    <rect x="0" y="15" width="24" height="40" fill="#3B465E" rx="2"/>
    <polygon points="-2,15 12,5 26,15" fill="#E74C3C"/>
    <rect x="6" y="25" width="12" height="15" fill="#F1C40F" rx="1"/>
  </g>

  <!-- Accent lighting / Modern sleek UI touch -->
  <circle cx="120" cy="40" r="3" fill="#2ECC71"/>
</svg>