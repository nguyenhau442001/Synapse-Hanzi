<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground line -->
  <path d="M40 180 L200 180" stroke="#333842" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Motion lines -->
  <path d="M60 160 L40 160" stroke="#FFB86C" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M50 145 L30 145" stroke="#FFB86C" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M55 130 L35 130" stroke="#FFB86C" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Character: Running silhouette -->
  <g fill="#E0E0E0">
    <!-- Head -->
    <circle cx="110" cy="110" r="12"/>
    <!-- Torso -->
    <path d="M110 122 L105 155 L115 155 Z"/>
    <!-- Arms -->
    <path d="M105 130 L85 145" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <path d="M115 130 L130 120" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M108 155 L95 180" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <path d="M112 155 L125 175" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Distant silhouette (The path ahead) -->
  <path d="M180 165 L190 165 L185 150 Z" fill="#333842"/>
  
  <!-- Accent: Dust/Motion effect -->
  <circle cx="80" cy="180" r="2" fill="#FFB86C"/>
  <circle cx="70" cy="178" r="1.5" fill="#FFB86C"/>
</svg>