<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing background effect representing cinematic / scary atmosphere -->
  <circle cx="120" cy="115" r="70" fill="#E53935" opacity="0.1" filter="blur(10px)"/>

  <!-- Cinema Screen Frame (representing "这部电影") -->
  <rect x="36" y="55" width="168" height="110" rx="10" fill="#222631" stroke="#323846" stroke-width="3"/>
  <rect x="44" y="63" width="152" height="94" rx="4" fill="#12141A"/>

  <!-- Screen Content: Terrifying Monster / Entity (Noun: 吓人 - physical character/object) -->
  <!-- Monster Silhouette / Shadow -->
  <path d="M100 135 C95 110 100 90 120 85 C140 90 145 110 140 135 Z" fill="#2E1A22"/>
  
  <!-- Glowing Creepy Eyes (High contrast accent color: orange/gold/red-orange) -->
  <circle cx="110" cy="103" r="5" fill="#FF5722"/>
  <circle cx="130" cy="103" r="5" fill="#FF5722"/>
  <circle cx="110" cy="103" r="2" fill="#FFE500"/>
  <circle cx="130" cy="103" r="2" fill="#FFE500"/>

  <!-- Sharp Spooky Grin -->
  <path d="M112 118 Q120 126 128 118" stroke="#FFE500" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M115 120 L117 124 M120 121 L120 125 M125 120 L123 124" stroke="#FFE500" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dramatic claws / arms reaching out of the screen -->
  <path d="M102 125 L82 115 M138 125 L158 115" stroke="#FF5722" stroke-width="4" stroke-linecap="round"/>
  <!-- Sharp Claws -->
  <path d="M80 113 L75 110 M80 115 L74 116" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 113 L165 110 M160 115 L166 116" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>

  <!-- Popcorn Bucket & Seat in Foreground (Cinematic context) -->
  <path d="M70 190 L90 155 L150 155 L170 190 Z" fill="#323846"/>
  <!-- Popcorn items spilling / flying in shock -->
  <circle cx="105" cy="145" r="5" fill="#FFC107"/>
  <circle cx="135" cy="142" r="6" fill="#FFC107"/>
  <circle cx="120" cy="138" r="5" fill="#FFC107"/>
  <path d="M95 170 Q120 160 145 170" stroke="#E53935" stroke-width="3" fill="none"/>

  <!-- Shock / Fear action lines radiating from the center -->
  <path d="M30 45 L45 55" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M210 45 L195 55" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M25 115 L40 115" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M215 115 L200 115" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>