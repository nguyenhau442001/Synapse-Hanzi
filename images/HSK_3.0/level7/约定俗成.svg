<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle historical/cultural background motif representing passage of time (concentric time rings/runes) -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A2F3D" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
  <circle cx="120" cy="120" r="65" fill="none" stroke="#2A2F3D" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Central Physical Object: An ancient stone stele / traditional scroll transitioning into modern smooth jade tablet -->
  <!-- Base pedestal / foundation -->
  <path d="M 90 180 L 150 180 L 160 192 L 80 192 Z" fill="#3A4150"/>
  
  <!-- Main Tablet Body representing established tradition / social contract -->
  <rect x="95" y="55" width="50" height="120" rx="6" fill="#252A34" stroke="#3E4756" stroke-width="2"/>
  
  <!-- Glowing golden carving/imprint representing the "agreement/custom" taking root through history -->
  <path d="M 107 75 L 133 75 M 107 92 L 133 92 M 107 109 L 125 109" stroke="#E5C158" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- People silhouette symbols merging into the monument, depicting "俗" (public/society) -->
  <circle cx="120" cy="138" r="6" fill="#F39C12"/>
  <path d="M 108 158 C 108 148, 132 148, 132 158 Z" fill="#F39C12"/>

  <!-- Hands wrapping around the monument from both sides, illustrating "约定" (social convention/agreement forged by people over time) -->
  <!-- Left Hand -->
  <path d="M 60 115 C 75 115, 88 120, 95 125 L 95 145 C 85 140, 70 135, 60 130 Z" fill="#3498DB"/>
  <circle cx="62" cy="122" r="4" fill="#2980B9"/>
  
  <!-- Right Hand -->
  <path d="M 180 115 C 165 115, 152 120, 145 125 L 145 145 C 155 140, 170 135, 180 130 Z" fill="#3498DB"/>
  <circle cx="178" cy="122" r="4" fill="#2980B9"/>

  <!-- Accents representing historical continuity and societal consensus (Gold sparkles) -->
  <path d="M 72 75 L 75 80 L 80 82 L 75 84 L 72 89 L 69 84 L 64 82 L 69 80 Z" fill="#E5C158" opacity="0.8"/>
  <path d="M 168 75 L 171 80 L 176 82 L 171 84 L 168 89 L 165 84 L 160 82 L 165 80 Z" fill="#E5C158" opacity="0.8"/>
</svg>