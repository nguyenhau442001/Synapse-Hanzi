<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing "开明" (Open-mindedness/Enlightenment) as a person with an open, glowing mind/perspective -->
  <!-- The figure is depicted with a warm, golden light emanating from the head area, symbolizing enlightened, progressive thought -->
  
  <!-- Torso -->
  <path d="M80 200 C80 170, 160 170, 160 200 L160 220 L80 220 Z" fill="#4A5568"/>
  
  <!-- Head -->
  <circle cx="120" cy="110" r="40" fill="#2D3748" stroke="#F6AD55" stroke-width="4"/>
  
  <!-- Enlightened Mind Symbol (Golden rays/open space) -->
  <path d="M120 80 L120 60 M141 89 L155 75 M150 110 L170 110 M141 131 L155 145 M120 140 L120 160 M99 131 L85 145 M90 110 L70 110 M99 89 L85 75" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Facial expression: Calm, listening, and receptive -->
  <path d="M105 105 A5 5 0 1 0 115 105 A5 5 0 1 0 105 105" fill="#F6AD55"/>
  <path d="M125 105 A5 5 0 1 0 135 105 A5 5 0 1 0 125 105" fill="#F6AD55"/>
  <path d="M110 125 Q120 132 130 125" stroke="#F6AD55" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Hands in a welcoming/open gesture -->
  <circle cx="70" cy="150" r="12" fill="#4A5568"/>
  <circle cx="170" cy="150" r="12" fill="#4A5568"/>
</svg>