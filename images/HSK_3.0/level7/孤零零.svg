<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground -->
  <path d="M0 190 C 80 180, 160 180, 240 190 L 240 240 L 0 240 Z" fill="#2C313C"/>
  
  <!-- Snow/Wind particles -->
  <circle cx="50" cy="60" r="1.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="180" cy="80" r="1" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="100" cy="40" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="200" cy="120" r="1" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- The Tree (Gūlínglíng - Solitary) -->
  <g transform="translate(120, 190)">
    <!-- Trunk -->
    <path d="M-8 0 L-8 -80 C-8 -100, 8 -100, 8 -80 L 8 0 Z" fill="#5D677A"/>
    
    <!-- Bare Branches -->
    <path d="M0 -80 L-25 -110 M0 -80 L20 -105 M-5 -90 L-10 -120 M5 -95 L15 -125" 
          stroke="#5D677A" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Single leaf/accent (Gold to highlight loneliness) -->
    <circle cx="-10" cy="-115" r="3" fill="#FFB84D"/>
  </g>
</svg>