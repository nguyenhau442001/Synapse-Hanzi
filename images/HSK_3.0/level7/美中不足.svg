<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Presentation Screen (Representing the academic seminar/conference) -->
  <g transform="translate(45, 45)">
    <!-- Screen background frame -->
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#242B38" stroke="#323B4C" stroke-width="2"/>
    
    <!-- Screen content: Academic presentation slide -->
    <rect x="15" y="15" width="120" height="70" rx="4" fill="#151921"/>
    
    <!-- Slide elements (charts & text placeholders) -->
    <rect x="25" y="25" width="40" height="6" rx="3" fill="#4B5563"/>
    <rect x="25" y="37" width="70" height="4" rx="2" fill="#374151"/>
    
    <!-- Slide graphic (bar chart) -->
    <rect x="25" y="55" width="12" height="20" rx="2" fill="#3B82F6"/>
    <rect x="43" y="47" width="12" height="28" rx="2" fill="#3B82F6"/>
    <rect x="61" y="51" width="12" height="24" rx="2" fill="#3B82F6"/>
    <rect x="79" y="43" width="12" height="32" rx="2" fill="#60A5FA"/>
    
    <!-- Projection Light Cone beam -->
    <path d="M120,-30 L20,0 L130,0 Z" fill="url(#lightBeam)" opacity="0.15"/>
    
    <!-- Projection Projector Device (Top Center) -->
    <rect x="100" y="-38" width="40" height="16" rx="4" fill="#4B5563"/>
    <circle cx="128" cy="-30" r="5" fill="#EF4444" opacity="0.9"/> <!-- Red error indicator light (the "bùzú") -->
    
    <!-- Projector lens beam exit point -->
    <rect x="117" y="-22" width="6" height="4" fill="#374151"/>
    
    <!-- Projection beam hitting the screen (The flaw / glitch line) -->
    <g transform="translate(15, 15)">
      <!-- Diagonal glitch static lines cutting across the bright display -->
      <path d="M20,20 L60,50" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M50,45 L100,25" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <!-- Digital static noise pixels -->
      <rect x="70" y="35" width="8" height="6" fill="#EF4444" opacity="0.9"/>
      <rect x="35" y="60" width="10" height="5" fill="#EF4444" opacity="0.7"/>
    </g>
    
    <!-- Stand / Base for the presentation screen -->
    <path d="M75,100 L75,120 M15,120 L135,120" stroke="#323B4C" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Definition gradient -->
  <defs>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Focal Accent Badge representing the single flaw/imperfection ("美中不足") -->
  <g transform="translate(192, 42)">
    <circle cx="0" cy="0" r="14" fill="#1F2937" stroke="#EF4444" stroke-width="2.5"/>
    <!-- Warning/Flaw Exclamation Icon -->
    <path d="M0,-5 L0,2 M0,6 L0,8" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>