<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Lower level unit (The sender) -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="12" fill="#FFB84D"/>
    <path d="M8 45 C8 35, 32 35, 32 45 L32 70 L8 70 Z" fill="#FFB84D"/>
    <rect x="15" y="65" width="10" height="20" fill="#4A5568"/>
  </g>

  <!-- The Document (The report) -->
  <g transform="translate(110, 110)">
    <rect x="0" y="0" width="20" height="28" rx="2" fill="#E2E8F0"/>
    <line x1="4" y1="6" x2="16" y2="6" stroke="#CBD5E0" stroke-width="2"/>
    <line x1="4" y1="12" x2="16" y2="12" stroke="#CBD5E0" stroke-width="2"/>
    <line x1="4" y1="18" x2="12" y2="18" stroke="#CBD5E0" stroke-width="2"/>
  </g>

  <!-- Upward Motion Arrow -->
  <path d="M120 100 L120 60 M110 70 L120 60 L130 70" stroke="#FFB84D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Higher level authority (The receiver) -->
  <g transform="translate(140, 40)">
    <circle cx="20" cy="20" r="16" fill="#6366F1"/>
    <path d="M4 50 C4 35, 36 35, 36 50 L36 80 L4 80 Z" fill="#6366F1"/>
    <rect x="15" y="75" width="10" height="15" fill="#4338CA"/>
  </g>
</svg>