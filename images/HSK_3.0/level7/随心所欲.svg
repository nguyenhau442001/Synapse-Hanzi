<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Swirling ambient motion lines (representing freedom of movement/flow) -->
    <path d="M-60 -40 C-30 -70, 30 -70, 60 -40" fill="none" stroke="#2D3748" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/>
    <path d="M-75 10 C-40 -30, 40 -30, 75 10" fill="none" stroke="#2D3748" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>

    <!-- Dynamic soaring figure/puppet symbolizing unrestrained motion and uninhibited action -->
    <circle cx="0" cy="-35" r="14" fill="#E2E8F0"/>
    <path d="M0 -21 C0 -10, -15 0, -28 15" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 -21 C0 -10, 15 0, 28 15" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Torso -->
    <path d="M0 -21 L0 25" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>

    <!-- Arms flung wide in free expression -->
    <path d="M0 -10 C-25 -25, -45 -10, -60 -2" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 -10 C25 -25, 45 -10, 60 -2" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>

    <!-- Legs flowing dynamically -->
    <path d="M0 25 C-15 45, -30 55, -45 70" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 25 C15 45, 30 55, 45 70" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>

    <!-- Focal golden energy sparks representing absolute volition/desire fulfillment -->
    <circle cx="52" cy="-22" r="5" fill="#F59E0B"/>
    <circle cx="-55" cy="20" r="4" fill="#F59E0B"/>
    <circle cx="30" cy="-60" r="3" fill="#F59E0B"/>
    <path d="M 0 -70 L 3 -62 L 11 -60 L 5 -54 L 7 -46 L 0 -50 L -7 -46 L -5 -54 L -11 -60 L -3 -62 Z" fill="#F59E0B" transform="translate(0, 5) scale(0.6)"/>
  </g>
</svg>