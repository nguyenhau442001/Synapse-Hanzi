<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ground line -->
  <path d="M40 180 L200 180" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Left Figure (Diplomat/Representative) -->
  <g transform="translate(70, 100)">
    <circle cx="20" cy="20" r="12" fill="#F6AD55"/>
    <path d="M20 32 L20 70 M20 40 L5 60 M20 40 L35 60" stroke="#F6AD55" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Right Figure (Diplomat/Representative) -->
  <g transform="translate(130, 100)">
    <circle cx="20" cy="20" r="12" fill="#63B3ED"/>
    <path d="M20 32 L20 70 M20 40 L5 60 M20 40 L35 60" stroke="#63B3ED" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Interaction: Respectful Handshake -->
  <g transform="translate(105, 135)">
    <path d="M0 0 L30 0" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#F6AD55"/>
    <circle cx="30" cy="0" r="5" fill="#63B3ED"/>
  </g>
  
  <!-- Symbol of Sovereignty/Territory (Stylized Globe Segment) -->
  <path d="M100 190 A20 20 0 0 1 140 190" fill="none" stroke="#F6E05E" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="120" cy="190" r="3" fill="#F6E05E"/>
</svg>