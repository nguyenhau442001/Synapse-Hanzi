<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle grid/glow background elements for machinery context -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#252A34" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Central Physical Object: Automated Production Line / Complex Gear & Conveyor Assembly (Representing "运转" - Operation/Running Machinery) -->
  <g transform="translate(120, 120)">
    <!-- Base mounting structure -->
    <path d="M-60 60 L60 60 L50 75 L-50 75 Z" fill="#2E3646"/>
    <rect x="-35" y="45" width="70" height="15" fill="#3A4456" rx="2"/>

    <!-- Conveyor Belt System -->
    <rect x="-75" y="25" width="150" height="25" fill="#2E3646" rx="4"/>
    <rect x="-70" y="29" width="140" height="17" fill="#1A1D24" rx="2"/>
    
    <!-- Conveyor Rollers -->
    <circle cx="-60" cy="37" r="6" fill="#6272A0"/>
    <circle cx="-20" cy="37" r="6" fill="#6272A0"/>
    <circle cx="20" cy="37" r="6" fill="#6272A0"/>
    <circle cx="60" cy="37" r="6" fill="#6272A0"/>

    <!-- Objects on belt (moving/operating) -->
    <rect x="-40" y="10" width="18" height="19" fill="#FFB86B" rx="2"/>
    <rect x="15" y="12" width="22" height="17" fill="#50FA7B" rx="3"/>

    <!-- Large Driving Gear (Left) -->
    <g transform="translate(-30, -25)">
      <circle cx="0" cy="0" r="28" fill="#3A4456"/>
      <circle cx="0" cy="0" r="22" fill="#1A1D24"/>
      <!-- Gear teeth (simplified flat design) -->
      <rect x="-5" y="-32" width="10" height="8" fill="#FFB86B" rx="1"/>
      <rect x="-5" y="24" width="10" height="8" fill="#FFB86B" rx="1"/>
      <rect x="-32" y="-5" width="8" height="10" fill="#FFB86B" rx="1"/>
      <rect x="24" y="-5" width="8" height="10" fill="#FFB86B" rx="1"/>
      <rect x="-22" y="-22" width="8" height="8" fill="#FFB86B" rx="1" transform="rotate(45)" transform-origin="center"/>
      <rect x="14" y="-22" width="8" height="8" fill="#FFB86B" rx="1" transform="rotate(45)" transform-origin="center"/>
      <rect x="-22" y="14" width="8" height="8" fill="#FFB86B" rx="1" transform="rotate(45)" transform-origin="center"/>
      <rect x="14" y="14" width="8" height="8" fill="#FFB86B" rx="1" transform="rotate(45)" transform-origin="center"/>
      <circle cx="0" cy="0" r="8" fill="#FFB86B"/>
    </g>

    <!-- Interlocking Smaller Gear (Right) -->
    <g transform="translate(30, -45)">
      <circle cx="0" cy="0" r="20" fill="#3A4456"/>
      <circle cx="0" cy="0" r="15" fill="#1A1D24"/>
      <rect x="-4" y="-23" width="8" height="6" fill="#50FA7B" rx="1"/>
      <rect x="-4" y="17" width="8" height="6" fill="#50FA7B" rx="1"/>
      <rect x="-23" y="-4" width="6" height="8" fill="#50FA7B" rx="1"/>
      <rect x="17" y="-4" width="6" height="8" fill="#50FA7B" rx="1"/>
      <circle cx="0" cy="0" r="6" fill="#50FA7B"/>
    </g>

    <!-- Motion / Rotation Indicator Arrows (Denoting "运转" movement) -->
    <path d="M -50 -60 A 35 35 0 0 1 -5 -65" fill="none" stroke="#FFB86B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-8,-60 -2,-65 -6,-71" fill="#FFB86B"/>

    <path d="M 50 -25 A 25 25 0 0 1 15 -72" fill="none" stroke="#50FA7B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="12,-68 18,-74 19,-66" fill="#50FA7B"/>
  </g>
</svg>