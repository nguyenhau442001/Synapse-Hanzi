<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle atmosphere (coastal salty mist hint) -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.5"/>

  <!-- Heavy Industrial Chain Links representing the dock machinery context -->
  <g transform="translate(120, 120)">
    <!-- Top Chain Link (Background) -->
    <rect x="-24" y="-75" width="48" height="60" rx="24" fill="none" stroke="#2C3240" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Bottom Chain Link (Background) -->
    <rect x="-24" y="15" width="48" height="60" rx="24" fill="none" stroke="#2C3240" stroke-width="12" stroke-linecap="round"/>

    <!-- Main Center Chain Link (The focus of rust / 锈) -->
    <rect x="-32" y="-45" width="64" height="90" rx="32" fill="#3A4252" stroke="#4A5262" stroke-width="4"/>
    <!-- Inner cutout of main link -->
    <rect x="-18" y="-25" width="36" height="50" rx="18" fill="#1A1D24"/>

    <!-- Thick Corrosion / Red-Brown Rust Patches (Visualizing 锈 - gỉ sét) -->
    <!-- Top-left rust accumulation -->
    <path d="M -32 -20 C -25 -35 -10 -45 5 -45 C -15 -40 -30 -30 -32 -20 Z" fill="#D95C36"/>
    <path d="M -28 -10 C -35 0 -38 -10 -28 -10 Z" fill="#E88349"/>
    
    <!-- Center-right heavy rust crust -->
    <path d="M 18 -10 C 35 0 35 25 22 38 C 30 20 28 5 18 -10 Z" fill="#D95C36"/>
    <path d="M 24 15 C 32 25 30 35 22 38 C 28 30 28 20 24 15 Z" fill="#C2411C"/>
    
    <!-- Bottom rust drip/texture -->
    <path d="M -20 32 C -5 45 10 40 22 38 C 5 43 -10 40 -20 32 Z" fill="#D95C36"/>
    <circle cx="2" cy="42" r="3" fill="#C2411C"/>
    <circle cx="-12" cy="38" r="2.5" fill="#E88349"/>

    <!-- Flaking rust spots (orange/gold highlights for high contrast accent) -->
    <circle cx="24" cy="-5" r="4" fill="#E88349"/>
    <circle cx="-25" cy="18" r="3.5" fill="#E88349"/>
    <circle cx="-10" cy="-35" r="3" fill="#F2A65A"/>
    <circle cx="12" cy="28" r="2.5" fill="#F2A65A"/>
    
    <!-- Metallic glints (clean flat modern touches) -->
    <path d="M -22 -28 L -15 -35" stroke="#717D96" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 28 L 20 33" stroke="#717D96" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>