<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to connect the two sides -->
  <ellipse cx="120" cy="120" rx="80" ry="40" fill="#2D3748" opacity="0.4"/>
  
  <!-- Central flowing connection streams (representing "tương thông" / interconnected essence) -->
  <path d="M75 120 C 95 100, 145 140, 165 120" fill="none" stroke="#F6AD55" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M75 125 C 95 145, 145 105, 165 125" fill="none" stroke="#63B3ED" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>
  
  <!-- Left Object: Music (Violin & Bow) representing art form 1 -->
  <g transform="translate(45, 75)">
    <!-- Violin body -->
    <path d="M25 15 C 10 15, 10 35, 20 45 C 12 55, 15 75, 25 75 C 35 75, 38 55, 30 45 C 40 35, 40 15, 25 15 Z" fill="#D69E2E"/>
    <!-- Violin neck & scroll -->
    <rect x="23" y="-5" width="4" height="22" fill="#718096"/>
    <circle cx="25" cy="-7" r="3" fill="#D69E2E"/>
    <!-- Bridge & F-holes -->
    <line x1="20" y1="45" x2="30" y2="45" stroke="#1A1D24" stroke-width="2"/>
    <circle cx="25" cy="50" r="2" fill="#1A1D24"/>
    <!-- Bow -->
    <line x1="-5" y1="70" x2="55" y2="10" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3" y1="67" x2="53" y2="7" stroke="#F6AD55" stroke-width="1"/>
  </g>
  
  <!-- Right Object: Painting (Art Easel & Canvas) representing art form 2 -->
  <g transform="translate(145, 75)">
    <!-- Easel legs -->
    <line x1="25" y1="10" x2="10" y2="85" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="10" x2="40" y2="85" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="10" x2="25" y2="90" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Canvas board -->
    <rect x="5" y="15" width="45" height="55" rx="3" fill="#2D3748" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Abstract art on canvas (matching emotional resonance theme) -->
    <circle cx="20" cy="35" r="8" fill="#F6AD55" opacity="0.9"/>
    <path d="M 12 50 Q 27 30 42 50" fill="none" stroke="#63B3ED" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Palette shelf -->
    <rect x="0" y="70" width="50" height="4" rx="2" fill="#D69E2E"/>
  </g>

  <!-- Central emotional convergence core (Heart/Soul resonance symbol, abstractly clean) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="16" fill="#1A1D24" stroke="#F6AD55" stroke-width="3"/>
    <!-- Glowing inner node -->
    <circle cx="0" cy="0" r="8" fill="#F6AD55"/>
  </g>
  
</svg>