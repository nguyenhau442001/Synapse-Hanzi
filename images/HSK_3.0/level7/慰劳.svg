<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Table -->
  <rect x="40" y="160" width="160" height="12" rx="2" fill="#343A46"/>
  <rect x="50" y="172" width="10" height="40" fill="#2A2F3A"/>
  <rect x="180" y="172" width="10" height="40" fill="#2A2F3A"/>
  
  <!-- Food/Dishes -->
  <circle cx="80" cy="150" r="15" fill="#E67E22"/>
  <path d="M70 150 Q80 140 90 150" fill="#D35400"/>
  <circle cx="120" cy="155" r="12" fill="#F1C40F"/>
  <circle cx="160" cy="150" r="15" fill="#E67E22"/>
  
  <!-- Researcher Character (Left) -->
  <g transform="translate(40, 80)">
    <path d="M20 100 L40 100 L35 60 L25 60 Z" fill="#5D6D7E"/>
    <circle cx="30" cy="45" r="15" fill="#BDC3C7"/>
    <path d="M22 42 L26 46 L34 38" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Project Manager Character (Right) -->
  <g transform="translate(140, 80)">
    <!-- Arm reaching out -->
    <path d="M20 60 L50 80" stroke="#E67E22" stroke-width="8" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M20 100 L40 100 L45 60 L15 60 Z" fill="#3498DB"/>
    <!-- Head -->
    <circle cx="30" cy="45" r="15" fill="#BDC3C7"/>
    <!-- Smiling expression -->
    <path d="M25 50 Q30 55 35 50" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <circle cx="25" cy="42" r="2" fill="#1A1D24"/>
    <circle cx="35" cy="42" r="2" fill="#1A1D24"/>
  </g>
  
  <!-- Motion/Action lines -->
  <path d="M100 130 Q120 120 140 130" stroke="#F1C40F" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M100 125 Q120 115 140 125" stroke="#F1C40F" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
</svg>