<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle motion lines to indicate time flow -->
  <path d="M200 60 C 160 60, 140 80, 120 120 C 100 160, 80 180, 40 180" stroke="#2D343E" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M220 80 C 180 80, 160 100, 140 140 C 120 180, 100 200, 60 200" stroke="#2D343E" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- The Human Character (Action: Gently holding back/slowing down) -->
  <g transform="translate(40, 60)">
    <!-- Arm and Hand -->
    <path d="M40 100 L 100 70" stroke="#FFB347" stroke-width="8" stroke-linecap="round"/>
    <circle cx="105" cy="67" r="12" fill="#FFB347"/>
    
    <!-- The Object being slowed (A stylized hourglass/life-cycle representation) -->
    <g transform="translate(110, 50)">
      <path d="M0 0 L 20 0 L 10 20 Z" fill="#4A90E2"/>
      <path d="M0 40 L 20 40 L 10 20 Z" fill="#4A90E2" opacity="0.6"/>
      <!-- Motion lines showing the resistance/slowing -->
      <path d="M-10 20 L -20 20" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>
      <path d="M-15 15 L -25 15" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Character Body (Minimalist) -->
    <path d="M20 160 C 20 120, 60 120, 60 160" fill="#E0E0E0"/>
    <circle cx="40" cy="110" r="20" fill="#E0E0E0"/>
  </g>

  <!-- Accent Detail: Focus on the interaction point -->
  <circle cx="150" cy="117" r="5" fill="#FFB347"/>
</svg>