<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main object: A stack of 10 blocks representing the decade, with one extra block slightly offset to represent the "surplus/more than" (余) -->
  <g transform="translate(60, 60)">
    <!-- Base stack of 10 blocks -->
    <rect x="0" y="100" width="120" height="20" rx="2" fill="#3D4451"/>
    <rect x="0" y="80" width="120" height="20" rx="2" fill="#3D4451"/>
    <rect x="0" y="60" width="120" height="20" rx="2" fill="#3D4451"/>
    <rect x="0" y="40" width="120" height="20" rx="2" fill="#3D4451"/>
    <rect x="0" y="20" width="120" height="20" rx="2" fill="#3D4451"/>
    
    <!-- The "surplus" block (the '余' part) -->
    <rect x="130" y="100" width="20" height="20" rx="2" fill="#FFB347"/>
    
    <!-- Decorative lines to show the stack -->
    <path d="M0 20 L120 20 M0 40 L120 40 M0 60 L120 60 M0 80 L120 80" stroke="#1A1D24" stroke-width="2"/>
    
    <!-- Accent highlight on the surplus block -->
    <rect x="134" y="104" width="12" height="12" rx="1" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>
</svg>