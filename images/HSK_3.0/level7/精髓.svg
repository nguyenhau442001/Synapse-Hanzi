<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow filter for the core essence -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1E2530"/>
    </linearGradient>
  </defs>

  <!-- Ambient background glow representing traditional wisdom -->
  <circle cx="120" cy="120" r="70" fill="#FFC107" opacity="0.05" filter="url(#goldGlow)"/>

  <!-- Open Ancient Scroll / Book base -->
  <g transform="translate(0, 15)">
    <!-- Scroll Left Side -->
    <path d="M 60 95 C 45 95 40 105 40 120 C 40 135 45 145 60 145 L 90 145 L 90 95 Z" fill="#D97706" opacity="0.8"/>
    <path d="M 50 98 C 45 98 42 106 42 120 C 42 134 45 142 50 142 Z" fill="#F59E0B"/>
    
    <!-- Scroll Right Side -->
    <path d="M 180 95 C 195 95 200 105 200 120 C 200 135 195 145 180 145 L 150 145 L 150 95 Z" fill="#D97706" opacity="0.8"/>
    <path d="M 190 98 C 195 98 198 106 198 120 C 198 134 195 142 190 142 Z" fill="#F59E0B"/>

    <!-- Scroll Pages / Content Base -->
    <path d="M 85 92 L 155 92 C 160 92 165 96 165 101 L 165 139 C 165 144 160 148 155 148 L 85 148 C 80 148 75 144 75 139 L 75 101 C 75 96 80 92 85 92 Z" fill="url(#bookGradient)" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Classic binding lines on pages -->
    <line x1="120" y1="92" x2="120" y2="148" stroke="#1A1D24" stroke-width="2"/>
    <line x1="95" y1="108" x2="110" y2="108" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="95" y1="120" x2="112" y2="120" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="95" y1="132" x2="105" y2="132" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    
    <line x1="130" y1="108" x2="145" y2="108" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="128" y1="120" x2="145" y2="120" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="132" x2="145" y2="132" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- The Core Essence / Tinh Hoa (Glowing physical object hovering precisely at the center) -->
  <g transform="translate(0, 0)">
    <!-- Outer light aura -->
    <circle cx="120" cy="115" r="28" fill="#FFC107" opacity="0.15" filter="url(#goldGlow)"/>
    
    <!-- Faceted Crystal / Gem representing the condensed essence (精髓) -->
    <path d="M 120 85 L 140 105 L 120 145 L 100 105 Z" fill="url(#goldGradient)" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Internal facets for 3D crystal look -->
    <polygon points="120,85 140,105 120,115" fill="#FFF" opacity="0.4"/>
    <polygon points="120,85 100,105 120,115" fill="#FFE082" opacity="0.6"/>
    <polygon points="120,145 140,105 120,115" fill="#FF8F00" opacity="0.5"/>
    <polygon points="120,145 100,105 120,115" fill="#FFA000" opacity="0.7"/>

    <!-- Sparkles emanating from the core -->
    <path d="M 120 70 L 122 78 L 130 80 L 122 82 L 120 90 L 118 82 L 110 80 L 118 78 Z" fill="#FFE082"/>
    <path d="M 155 95 L 157 99 L 161 100 L 157 101 L 155 105 L 153 101 L 149 100 L 153 99 Z" fill="#FFE082"/>
    <path d="M 85 95 L 87 99 L 91 100 L 87 101 L 85 105 L 83 101 L 79 100 L 83 99 Z" fill="#FFE082"/>
  </g>

  <!-- Ground reflection / subtle focal base -->
  <ellipse cx="120" cy="180" rx="35" ry="6" fill="#000000" opacity="0.4"/>
</svg>