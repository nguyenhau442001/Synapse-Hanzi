<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements: Faded, static clock hands representing wasted time -->
  <g opacity="0.2" stroke="#4A5568" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="120" x2="120" y2="60"/>
    <line x1="120" y1="120" x2="170" y2="120"/>
  </g>

  <!-- The Person: Slumped, relaxed, inactive posture -->
  <g transform="translate(120, 140)">
    <!-- Legs stretched out -->
    <path d="M-40 40 L-10 40 L-5 60 L-45 60 Z" fill="#718096"/>
    <path d="M10 40 L40 40 L45 60 L5 60 Z" fill="#718096"/>
    
    <!-- Torso slumped -->
    <path d="M-30 0 C-30 -30 30 -30 30 0 L20 40 L-20 40 Z" fill="#A0AEC0"/>
    
    <!-- Head tilted back -->
    <circle cx="0" cy="-35" r="25" fill="#CBD5E0"/>
    
    <!-- Closed eyes (horizontal lines) -->
    <line x1="-12" y1="-40" x2="-4" y2="-40" stroke="#4A5568" stroke-width="2"/>
    <line x1="4" y1="-40" x2="12" y2="-40" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Arms hanging loosely -->
    <path d="M-30 0 L-50 30" stroke="#A0AEC0" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 0 L50 30" stroke="#A0AEC0" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Contrast element: A vibrant, golden hourglass sitting idle, sand not flowing -->
  <g transform="translate(180, 60)">
    <path d="M-15 -25 L15 -25 L10 -5 L0 0 L10 5 L15 25 L-15 25 L-10 5 L0 0 L-10 -5 Z" fill="#ECC94B"/>
    <circle cx="0" cy="0" r="3" fill="#1A1D24"/>
  </g>
</svg>