<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk surface -->
  <path d="M 20 185 L 220 185" stroke="#2D323E" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Stack of multiple continuous files/documents representing "连" (successive/continuous series) -->
  <!-- Document 4 (Bottom) -->
  <g transform="translate(65, 105)">
    <rect x="0" y="0" width="85" height="70" rx="6" fill="#252A34" stroke="#3A4150" stroke-width="2"/>
    <path d="M 15 18 H 55" stroke="#3A4150" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 32 H 45" stroke="#3A4150" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Document 3 -->
  <g transform="translate(75, 90)">
    <rect x="0" y="0" width="85" height="70" rx="6" fill="#2D3440" stroke="#4A5568" stroke-width="2"/>
    <path d="M 15 18 H 60" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 32 H 40" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Document 2 -->
  <g transform="translate(85, 75)">
    <rect x="0" y="0" width="85" height="70" rx="6" fill="#323B4B" stroke="#606F84" stroke-width="2"/>
    <path d="M 15 18 H 50" stroke="#606F84" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 32 H 65" stroke="#606F84" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Document 1 (Top / Main focus with vibrant accent) -->
  <g transform="translate(95, 60)">
    <!-- Main Paper Body -->
    <rect x="0" y="0" width="90" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Folder Tab -->
    <path d="M 0 0 L 25 0 L 35 12 L 90 12 L 90 75 L 0 75 Z" fill="#F8FAFC"/>
    
    <!-- Accent Highlight representing continuous effort/records -->
    <path d="M 15 25 H 60" stroke="#FF9F43" stroke-width="6" stroke-linecap="round"/>
    <path d="M 15 42 H 75" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15 57 H 45" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Connecting progression indicators (successive flow) -->
  <path d="M 50 140 C 50 120, 65 110, 85 110" fill="none" stroke="#FF9F43" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M 60 125 L 85 110 L 68 100" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing accent lamp or focal point representing late night lab work context -->
  <circle cx="185" cy="55" r="14" fill="#FF9F43" opacity="0.15"/>
  <circle cx="185" cy="55" r="6" fill="#FF9F43"/>
  <path d="M 185 61 L 185 95" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>

</svg>