<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Base Platform / Podium -->
    <path d="M-60 65 L60 65 L45 80 L-45 80 Z" fill="#2A2F3D" />
    <path d="M-45 80 L45 80 L35 90 L-35 90 Z" fill="#1E222D" />
    <rect x="-30" y="45" width="60" height="20" rx="3" fill="#3A4255" />
    
    <!-- Wooden Gavel Block (Sound Block) -->
    <ellipse cx="0" cy="50" rx="28" ry="8" fill="#8B5A2B" />
    <ellipse cx="0" cy="47" rx="28" ry="8" fill="#A0652E" />

    <!-- Scales of Justice (Background Context) -->
    <path d="M0 -35 L0 35" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />
    <path d="M-22 -20 L22 -20" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-37" r="4" fill="#F6AD55" />
    <!-- Left Scale Pan -->
    <path d="M-22 -20 L-34 5 L-10 5 Z" fill="none" stroke="#4A5568" stroke-width="1.5" />
    <ellipse cx="-22" cy="5" rx="14" ry="4" fill="#CBD5E0" />
    <!-- Right Scale Pan -->
    <path d="M22 -20 L10 5 L34 5 Z" fill="none" stroke="#4A5568" stroke-width="1.5" />
    <ellipse cx="22" cy="5" rx="14" ry="4" fill="#CBD5E0" />

    <!-- Massive Legal Gavel (Foreground Focus) -->
    <g transform="rotate(-35, 0, 10)">
      <!-- Gavel Handle -->
      <rect x="-5" y="-25" width="10" height="70" rx="3" fill="#D69E2E" />
      <rect x="-3" y="-25" width="6" height="70" rx="2" fill="#ECC94B" />
      
      <!-- Gavel Head -->
      <path d="M-28 -35 L28 -35 C32 -35 35 -32 35 -28 L35 -12 C35 -8 32 -5 28 -5 L-28 -5 C-32 -5 -35 -8 -35 -12 L-35 -28 C-35 -32 -32 -35 -28 -35 Z" fill="#8B4513" />
      <path d="M-26 -33 L26 -33 C29 -33 31 -31 31 -28 L31 -12 C31 -9 29 -7 26 -7 L-26 -7 C-29 -7 -31 -9 -31 -12 L-31 -28 C-31 -31 -29 -33 -26 -33 Z" fill="#A0522D" />

      <!-- Metallic Accent Rings on Gavel Head -->
      <rect x="-24" y="-35" width="5" height="30" fill="#CBD5E0" opacity="0.8" />
      <rect x="19" y="-35" width="5" height="30" fill="#CBD5E0" opacity="0.8" />
    </g>

    <!-- Impact Spark / Decision Accent -->
    <path d="M0 45 L5 30 L15 35 L8 22 L20 18 L5 15 L0 2 L-5 15 L-20 18 L-8 22 L-15 35 L-5 30 Z" fill="#F6AD55" opacity="0.9" />
  </g>
</svg>