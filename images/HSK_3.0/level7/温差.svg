<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Landscape Object representing Desert Day-Night Thermal Difference (温差) -->
  <g transform="translate(0, 10)">
    <!-- Split Background / Dune Base -->
    <path d="M 30 140 Q 120 110 210 140 L 210 190 Q 120 210 30 190 Z" fill="#252A34"/>
    
    <!-- LEFT SIDE: Hot Desert Daytime (Sun, Orange/Gold theme) -->
    <g>
      <!-- Scorching Sun -->
      <circle cx="75" cy="65" r="22" fill="#FFB703"/>
      <!-- Sun Rays -->
      <path d="M 75 35 L 75 39 M 75 91 L 75 95 M 45 65 L 49 65 M 101 65 L 105 65 M 54 44 L 57 47 M 93 83 L 96 86 M 54 86 L 57 83 M 93 47 L 96 44" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Daytime Dune -->
      <path d="M 30 140 Q 75 120 120 140 L 120 190 L 30 190 Z" fill="#D48C46"/>
      <!-- Cactus (Day) -->
      <path d="M 70 120 L 70 145 M 63 128 L 70 133 M 77 125 L 70 130" stroke="#E09F5E" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- RIGHT SIDE: Freezing Desert Nighttime (Moon, Blue theme) -->
    <g>
      <!-- Cold Moon & Stars -->
      <path d="M 175 50 A 16 16 0 1 1 160 70 A 18 18 0 1 0 175 50 Z" fill="#90E0EF"/>
      <circle cx="200" cy="55" r="1.5" fill="#FFFFFF"/>
      <circle cx="150" cy="80" r="1" fill="#FFFFFF"/>
      <circle cx="190" cy="90" r="1.5" fill="#FFFFFF"/>
      
      <!-- Nighttime Dune -->
      <path d="M 120 140 Q 165 120 210 140 L 210 190 L 120 190 Z" fill="#1D3557"/>
      <!-- Frost / Cactus (Night) -->
      <path d="M 170 120 L 170 145 M 163 128 L 170 133 M 177 125 L 170 130" stroke="#457B9D" stroke-width="4" stroke-linecap="round"/>
      <!-- Snow/Frost flakes on ground -->
      <circle cx="150" cy="155" r="2" fill="#E0FBFC"/>
      <circle cx="185" cy="165" r="1.5" fill="#E0FBFC"/>
      <circle cx="135" cy="170" r="2" fill="#E0FBFC"/>
    </g>

    <!-- Central Thermal Gradient Divider / Contrast Indicator -->
    <path d="M 120 40 L 120 190" stroke="#3A4454" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Thermometer Icon overlaying the center to clearly signify Temperature Difference -->
    <g transform="translate(108, 75)">
      <!-- Thermometer Body -->
      <rect x="0" y="0" width="24" height="60" rx="12" fill="#2D3748" stroke="#4A5568" stroke-width="2"/>
      <!-- Bulb -->
      <circle cx="12" cy="50" r="8" fill="#FFB703"/>
      <!-- Mercury Level (Split visual representation: top cold blue, bottom hot orange) -->
      <rect x="10" y="10" width="4" height="40" rx="2" fill="#90E0EF"/>
      <rect x="10" y="35" width="4" height="15" rx="2" fill="#FFB703"/>
    </g>
  </g>
</svg>