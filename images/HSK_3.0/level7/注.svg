  <!-- Magnifying glass focusing on the note -->
  <circle cx="180" cy="130" r="25" fill="none" stroke="#FFB86C" stroke-width="4"/>
  <path d="M198 148l15 15" stroke="#FFB86C" stroke-width="6" stroke-linecap="round"/>
