<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Book base -->
  <path d="M60 60h120v120H60z" fill="#2D343E" stroke="#FFB86C" stroke-width="4" stroke-linejoin="round"/>
  <path d="M120 60v120" stroke="#FFB86C" stroke-width="4"/>
  
  <!-- Page lines (representing text) -->
  <g stroke="#8F939A" stroke-width="2" stroke-linecap="round">
    <path d="M75 80h35M75 100h35M75 120h35M75 140h35M75 160h35"/>
    <path d="M130 80h35M130 100h35M130 120h35M130 140h35M130 160h35"/>
  </g>
  
  <!-- Annotation note (The "注" concept) -->
  <path d="M165 145l25-25 10 10-25 25z" fill="#FFB86C"/>
