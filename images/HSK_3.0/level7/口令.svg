<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Megaphone representing the "command/password" concept -->
  <g transform="translate(60, 80)">
    <!-- Handle -->
    <rect x="20" y="80" width="15" height="40" rx="4" fill="#FFB84D"/>
    <!-- Main body -->
    <path d="M35 85 L120 60 L120 100 L35 75 Z" fill="#FFB84D"/>
    <path d="M120 50 L140 40 L140 120 L120 110 Z" fill="#FF9F1A"/>
    <!-- Speaker front -->
    <ellipse cx="140" cy="80" rx="10" ry="40" fill="#FFB84D"/>
    <!-- Sound waves -->
    <path d="M155 70 C165 60 165 100 155 90" stroke="#FFB84D" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M165 60 C180 45 180 115 165 100" stroke="#FFB84D" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Key representing the "password" aspect -->
  <g transform="translate(140, 140) rotate(45)">
    <circle cx="20" cy="20" r="12" fill="none" stroke="#4D9FFF" stroke-width="6"/>
    <rect x="32" y="17" width="30" height="6" rx="2" fill="#4D9FFF"/>
    <rect x="45" y="17" width="6" height="15" rx="2" fill="#4D9FFF"/>
    <rect x="55" y="17" width="6" height="10" rx="2" fill="#4D9FFF"/>
  </g>
</svg>