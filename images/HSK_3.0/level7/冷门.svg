<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Dusty, forgotten bookshelf representing 'cold/niche' subject -->
  <g transform="translate(60, 60)">
    <!-- Shelf structure -->
    <rect x="0" y="100" width="120" height="8" fill="#343A46"/>
    
    <!-- Books -->
    <rect x="10" y="40" width="15" height="60" fill="#FFB347"/>
    <rect x="30" y="50" width="15" height="50" fill="#4A5568"/>
    <rect x="50" y="60" width="15" height="40" fill="#4A5568"/>
    <rect x="70" y="55" width="15" height="45" fill="#4A5568"/>
    <rect x="95" y="45" width="15" height="55" fill="#4A5568"/>
    
    <!-- Cobwebs to signify 'cold/neglected' -->
    <path d="M10 40 L0 30 M10 40 L5 25 M110 40 L120 30 M110 40 L115 25" stroke="#718096" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Spotlight on the single 'niche' book -->
    <ellipse cx="17.5" cy="70" rx="25" ry="40" fill="none" stroke="#FFB347" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  </g>
  
  <!-- Person looking away, representing lack of attention -->
  <g transform="translate(140, 120)">
    <circle cx="20" cy="20" r="12" fill="#718096"/>
    <path d="M8 40 Q20 35 32 40 L30 80 L10 80 Z" fill="#718096"/>
    <!-- Head turned away -->
    <circle cx="20" cy="20" r="12" fill="#2D3748"/>
    <path d="M12 18 L16 18 M24 18 L28 18" stroke="#718096" stroke-width="2"/>
  </g>
</svg>