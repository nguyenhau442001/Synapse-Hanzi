<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Atmospheric elements (Desert & Night Sky) -->
  <path d="M0 160 Q 70 145, 140 165 T 240 155 L 240 240 L 0 240 Z" fill="#222733"/>
  <path d="M0 185 Q 90 175, 170 190 T 240 180 L 240 240 L 0 240 Z" fill="#15181F"/>

  <!-- Glowing Stars in the Dark Mode Sky -->
  <circle cx="45" cy="50" r="1" fill="#8899A6" opacity="0.6"/>
  <circle cx="105" cy="35" r="1.5" fill="#E1E8ED" opacity="0.8"/>
  <circle cx="195" cy="65" r="1" fill="#8899A6" opacity="0.5"/>
  <circle cx="215" cy="30" r="2" fill="#F5A623" opacity="0.9"/>

  <!-- Geological Strata / Exploration Core (Visualizing "勘探" - Surveying/Drilling/Discovery) -->
  <!-- Cross-section of earth under the desert -->
  <path d="M40 175 L 120 175 L 120 220 L 40 220 Z" fill="#2A303C" opacity="0.5"/>
  <!-- Strata lines -->
  <line x1="40" y1="190" x2="120" y2="190" stroke="#3A4454" stroke-width="2"/>
  <line x1="40" y1="205" x2="120" y2="205" stroke="#3A4454" stroke-width="2"/>

  <!-- Glowing Oil/Gas Deposit (Discovery element) -->
  <ellipse cx="80" cy="212" rx="22" ry="8" fill="#F5A623" opacity="0.3"/>
  <ellipse cx="80" cy="212" rx="14" ry="5" fill="#F5A623" opacity="0.9"/>
  <!-- Rising energy/discovery particles -->
  <circle cx="80" cy="198" r="1.5" fill="#F5A623"/>
  <circle cx="75" cy="192" r="1" fill="#F5A623" opacity="0.7"/>
  <circle cx="85" cy="194" r="1" fill="#F5A623" opacity="0.8"/>

  <!-- Drilling / Surveying Rig Apparatus -->
  <!-- Derrick structure -->
  <polygon points="70,110 80,110 90,175 60,175" fill="#3A4454"/>
  <line x1="75" y1="110" x2="75" y2="175" stroke="#1A1D24" stroke-width="2"/>
  <line x1="66" y1="130" x2="84" y2="130" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="63" y1="150" x2="87" y2="150" stroke="#1A1D24" stroke-width="1.5"/>
  <!-- Drill shaft piercing the ground -->
  <line x1="75" y1="110" x2="75" y2="212" stroke="#F5A623" stroke-width="3"/>
  <circle cx="75" cy="212" r="3" fill="#FFFFFF"/>

  <!-- Geologist / Researcher Character (Dynamic Action - examining data / surveying) -->
  <!-- Body/Torso -->
  <path d="M135 155 L 155 155 L 160 175 L 130 175 Z" fill="#2B6CB0"/>
  <!-- Head & Helmet -->
  <circle cx="145" cy="138" r="9" fill="#FEEBC8"/>
  <path d="M134 134 C 134 127, 156 127, 156 134 Z" fill="#D69E2E"/> <!-- Hard hat -->
  <rect x="132" y="133" width="26" height="3" rx="1.5" fill="#D69E2E"/>

  <!-- Legs -->
  <line x1="138" y1="175" x2="134" y2="198" stroke="#1A202C" stroke-width="5" stroke-linecap="round"/>
  <line x1="152" y1="175" x2="156" y2="198" stroke="#1A202C" stroke-width="5" stroke-linecap="round"/>

  <!-- Arms interacting with holographic/clipboard survey data -->
  <path d="M140 152 L 158 148 L 165 158" fill="none" stroke="#2B6CB0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Floating Holographic Data Interface (Representing analysis & exploration findings) -->
  <rect x="155" y="115" width="45" height="32" rx="4" fill="#0D1117" stroke="#319795" stroke-width="1.5"/>
  <!-- Data waveforms inside hologram -->
  <path d="M162 135 L 168 126 L 174 138 L 182 122 L 190 135" fill="none" stroke="#38B2AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="190" cy="122" r="2" fill="#F5A623"/>

  <!-- Motion/Action lines emphasizing active scanning/exploration -->
  <path d="M125 125 C 130 120, 130 115, 125 110" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 130 C 127 123, 127 117, 120 110" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Ground surface contour line -->
  <path d="M20 175 Q 80 165, 150 175 T 220 170" fill="none" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
</svg>