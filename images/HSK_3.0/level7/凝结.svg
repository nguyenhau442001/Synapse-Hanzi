<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow / Atmosphere representing early morning coolness -->
  <circle cx="120" cy="130" r="70" fill="#243447" opacity="0.6"/>
  <circle cx="120" cy="110" r="40" fill="#3A506B" opacity="0.4"/>

  <!-- Blade of Grass / Context Object -->
  <!-- Main grass stem curving up -->
  <path d="M 60 210 Q 90 160 115 110" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>
  <!-- Secondary soft grass leaf behind -->
  <path d="M 170 210 Q 140 150 120 100" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- Tip of the main blade supporting the droplet -->
  <path d="M 115 110 Q 120 95 125 90" fill="none" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>

  <!-- The Condensed Dewdrop (凝结 - Main Noun Focus) -->
  <!-- Outer glow/refraction of crystal clear drop -->
  <path d="M 120 62 C 102 62 90 80 90 95 C 90 112 120 135 120 135 C 120 135 150 112 150 95 C 150 80 138 62 120 62 Z" fill="#38BDF8" opacity="0.25"/>
  <path d="M 120 66 C 105 66 94 81 94 95 C 94 110 120 130 120 130 C 120 130 146 110 146 95 C 146 81 135 66 120 66 Z" fill="#0EA5E9" opacity="0.6"/>
  
  <!-- Inner core of the dewdrop (crystal clear high-contrast look) -->
  <path d="M 120 70 C 108 70 98 83 98 95 C 98 107 120 124 120 124 C 120 124 142 107 142 95 C 142 83 132 70 120 70 Z" fill="#E0F2FE"/>

  <!-- Highlights for crystal-clear texture -->
  <!-- Primary curved specular highlight on left -->
  <path d="M 106 82 C 106 82 102 92 106 102" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Secondary sharp reflection dot -->
  <circle cx="114" cy="78" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <!-- Reflected light at the bottom base -->
  <path d="M 112 114 C 116 116 124 116 128 114" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Secondary smaller surrounding condensed micro-droplets -->
  <circle cx="82" cy="120" r="5" fill="#E0F2FE" opacity="0.8"/>
  <circle cx="82" cy="120" r="2" fill="#FFFFFF" opacity="0.9"/>
  
  <circle cx="156" cy="105" r="4" fill="#E0F2FE" opacity="0.7"/>
  <circle cx="156" cy="105" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="138" cy="138" r="3" fill="#E0F2FE" opacity="0.6"/>

</svg>