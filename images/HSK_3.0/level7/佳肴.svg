    <circle cx="0" cy="-52" r="5" fill="#FBBF24"/>

    <!-- Exquisite Gourmet Dish Revealed (Half open foreground plate/food) -->
    <!-- Large round serving base -->
    <ellipse cx="0" cy="46" rx="72" ry="12" fill="#E2E8F0"/>
    <ellipse cx="0" cy="44" rx="66" ry="10" fill="#F8FAFC"/>
    
