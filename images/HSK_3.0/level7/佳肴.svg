<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 125)">
    <!-- Steam / Aroma effects -->
    <path d="M-30 -50 C-40 -65 -20 -80 -30 -95" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M0 -55 C-10 -70 10 -85 0 -100" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
