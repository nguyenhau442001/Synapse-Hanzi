<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Modern Office Building representing Private Enterprise -->
  <g transform="translate(60, 60)">
    <!-- Main Building Structure -->
    <rect x="20" y="20" width="80" height="100" rx="4" fill="#2D343E" stroke="#FFB800" stroke-width="2"/>
    
    <!-- Windows -->
    <rect x="35" y="35" width="15" height="15" fill="#FFB800" opacity="0.8"/>
    <rect x="70" y="35" width="15" height="15" fill="#FFB800" opacity="0.8"/>
    <rect x="35" y="65" width="15" height="15" fill="#FFB800" opacity="0.8"/>
    <rect x="70" y="65" width="15" height="15" fill="#FFB800" opacity="0.8"/>
    
    <!-- Entrance/Base -->
    <rect x="45" y="100" width="30" height="20" fill="#FFB800"/>
    
    <!-- Private ownership indicator: A stylized hand holding a key or building block -->
    <path d="M100 100 L120 80 L140 100 L120 120 Z" fill="#FFB800"/>
    <circle cx="120" cy="100" r="8" fill="#1A1D24"/>
  </g>
  
  <!-- Decorative ground line -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#3E4654" stroke-width="4" stroke-linecap="round"/>
</svg>