<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(30, 45)">
    <!-- Script Document (Rejected proposal) -->
    <rect x="25" y="10" width="130" height="110" rx="8" fill="#2A2F3D" stroke="#3A4255" stroke-width="2"/>
    <!-- Document lines -->
    <rect x="40" y="25" width="70" height="6" rx="3" fill="#4E5D78"/>
    <rect x="40" y="45" width="100" height="4" rx="2" fill="#3A4255"/>
    <rect x="40" y="57" width="90" height="4" rx="2" fill="#3A4255"/>
    <rect x="40" y="69" width="60" height="4" rx="2" fill="#3A4255"/>
    
    <!-- Red rejection stamp (X) -->
    <g transform="translate(60, 45)">
      <circle cx="25" cy="25" r="32" fill="#1A1D24" opacity="0.85"/>
      <circle cx="25" cy="25" r="32" fill="none" stroke="#FF4D4D" stroke-width="4" stroke-dasharray="6 3"/>
      <path d="M12 12 L38 38 M38 12 L12 38" stroke="#FF4D4D" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Modern Futuristic Rifle / Execution symbol overlapping -->
    <g transform="translate(-10, 60) rotate(-15)">
      <!-- Rifle stock & body -->
      <path d="M10 50 L40 50 L55 42 L130 42 L145 46 L175 46 L175 52 L145 52 L130 56 L55 56 L40 52 L10 52 Z" fill="#FFB800"/>
      <!-- Barrel & Scope -->
      <rect x="155" y="44" width="35" height="4" fill="#E5A100"/>
      <rect x="70" y="32" width="30" height="8" rx="2" fill="#E5A100"/>
      <line x1="75" y1="32" x2="75" y2="28" stroke="#E5A100" stroke-width="3"/>
      <line x1="95" y1="32" x2="95" y2="28" stroke="#E5A100" stroke-width="3"/>
      <!-- Grip & Trigger -->
      <path d="M45 56 L35 75 L45 78 L52 56 Z" fill="#E5A100"/>
      <circle cx="20" cy="56" r="8" fill="#FFB800"/>
    </g>
  </g>
  
  <!-- Accent highlight dots for sleek flat tech aesthetic -->
  <circle cx="40" cy="35" r="3" fill="#FFB800" opacity="0.6"/>
  <circle cx="200" cy="195" r="4" fill="#FF4D4D" opacity="0.6"/>
  <circle cx="205" cy="35" r="2" fill="#4E5D78"/>
</svg>