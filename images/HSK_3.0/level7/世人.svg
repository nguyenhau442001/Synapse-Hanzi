<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ancient Stone Bridge Silhouette -->
  <path d="M40 160 C 40 160, 80 120, 120 120 C 160 120, 200 160, 200 160 L 200 175 L 40 175 Z" fill="#4A5568"/>
  <path d="M40 175 L 200 175 L 200 185 L 40 185 Z" fill="#2D3748"/>
  
  <!-- Diverse Group of People (Representing "世人" - The World's People) -->
  <!-- Person 1 -->
  <circle cx="70" cy="110" r="12" fill="#F6AD55"/>
  <path d="M55 125 C 55 115, 85 115, 85 125 L 80 150 L 60 150 Z" fill="#F6AD55"/>
  
  <!-- Person 2 -->
  <circle cx="120" cy="100" r="14" fill="#F6AD55"/>
  <path d="M100 115 C 100 105, 140 105, 140 115 L 135 145 L 105 145 Z" fill="#F6AD55"/>
  
  <!-- Person 3 -->
  <circle cx="170" cy="110" r="12" fill="#F6AD55"/>
  <path d="M155 125 C 155 115, 185 115, 185 125 L 180 150 L 160 150 Z" fill="#F6AD55"/>
  
  <!-- Gazing lines towards the bridge -->
  <line x1="70" y1="125" x2="80" y2="135" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="115" x2="120" y2="130" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="125" x2="160" y2="135" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
</svg>