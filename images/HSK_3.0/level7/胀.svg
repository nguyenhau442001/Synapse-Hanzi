<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Head / Neck Outline -->
    <path d="M 85,90 C 85,60 105,45 120,45 C 135,45 155,60 155,90 L 150,110 C 145,115 135,118 120,118 C 105,118 95,115 90,110 Z" fill="#2D323E" />
    <path d="M 105,115 L 105,140 C 105,145 135,145 135,140 L 135,115" fill="#2D323E" />

    <!-- Torso silhouette with exaggerated bloated stomach (胀 - distension) -->
    <!-- Center of chest is around X=120, normal waist ~100-140, expanded stomach bulges outward significantly -->
    <path d="M 80,135 
             C 75,150 70,175 75,195 
             C 78,205 162,205 165,195 
             C 170,175 165,150 160,135 
             Z" 
          fill="#374151" />

    <!-- Outer distension aura / pressure ring emphasizing "胀" (bloated/swollen) -->
    <path d="M 64,165 
             C 52,175 52,195 64,205" 
          fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 176,165 
             C 188,175 188,195 176,205" 
          fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Clothing (Shirt/Jacket open over the rounded belly) -->
    <path d="M 82,135 L 68,205 L 100,205 L 108,160 L 120,175 L 132,160 L 140,205 L 172,205 L 158,135 Z" fill="#4B5563" />

    <!-- Glowing, tight stretched fabric indicator on the belly -->
    <ellipse cx="120" cy="180" rx="32" ry="20" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.9"/>

    <!-- Discomfort / Pain accents (Focusing on the stomach area) -->
    <!-- Sweat drop left -->
    <path d="M 72,125 C 72,120 78,112 78,112 C 78,112 84,120 84,125 C 84,128.3 81.3,131 78,131 C 74.7,131 72,128.3 72,125 Z" fill="#38BDF8" opacity="0.9"/>
    
    <!-- Sweat drop right -->
    <path d="M 156,125 C 156,120 162,112 162,112 C 162,112 168,120 168,125 C 168,128.3 165.3,131 162,131 C 158.7,131 156,128.3 156,125 Z" fill="#38BDF8" opacity="0.9"/>

    <!-- Hands gripping/holding the bloated stomach in discomfort -->
    <!-- Left Hand -->
    <path d="M 70,175 C 65,175 60,182 65,190 C 68,195 78,192 82,185 Z" fill="#D1D5DB" />
    <!-- Right Hand -->
    <path d="M 170,175 C 175,175 180,182 175,190 C 172,195 162,192 158,185 Z" fill="#D1D5DB" />

    <!-- Face showing discomfort (tight closed eyes, grimace) -->
    <path d="M 105,75 L 115,80" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 125,80 L 135,75" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 112,98 C 116,94 124,94 128,98" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>