<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ground line representing the farm environment -->
  <path d="M 36,192 L 204,192" stroke="#2D333F" stroke-width="4" stroke-linecap="round"/>

  <!-- Stylized Chicken (representing 家禽) -->
  <g transform="translate(48, 104)">
    <!-- Chicken body -->
    <ellipse cx="44" cy="52" rx="28" ry="22" fill="#F59E0B"/>
    <!-- Chicken tail feathers -->
    <path d="M 16,44 Q 4,32 10,20 Q 20,32 24,42 Z" fill="#D97706"/>
    <!-- Chicken wing -->
    <path d="M 36,44 Q 52,52 44,64 Q 32,58 36,44 Z" fill="#D97706"/>
    <!-- Chicken head -->
    <circle cx="68" cy="28" r="14" fill="#F59E0B"/>
    <!-- Chicken beak -->
    <polygon points="78,26 88,28 78,32" fill="#EF4444"/>
    <!-- Chicken comb -->
    <path d="M 62,14 Q 66,6 70,14 Q 74,6 76,16 Z" fill="#EF4444"/>
    <!-- Chicken wattle -->
    <path d="M 72,36 Q 76,42 72,44 Q 68,42 72,36 Z" fill="#EF4444"/>
    <!-- Chicken eye -->
    <circle cx="72" cy="25" r="2" fill="#1A1D24"/>
    <!-- Chicken legs -->
    <line x1="36" y1="74" x2="36" y2="88" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="74" x2="52" y2="88" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <!-- Chicken feet -->
    <polyline points="30,88 36,88 42,88" stroke="#EF4444" stroke-width="3" stroke-linecap="round" fill="none"/>
    <polyline points="46,88 52,88 58,88" stroke="#EF4444" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Stylized Duck (representing 家禽) -->
  <g transform="translate(132, 116)">
    <!-- Duck body -->
    <ellipse cx="40" cy="44" rx="26" ry="18" fill="#38BDF8"/>
    <!-- Duck tail -->
    <path d="M 16,40 Q 6,36 12,28 Q 18,36 20,40 Z" fill="#0EA5E9"/>
    <!-- Duck wing -->
    <path d="M 32,36 Q 48,42 40,52 Q 28,48 32,36 Z" fill="#0EA5E9"/>
    <!-- Duck neck & head -->
    <path d="M 54,42 Q 62,30 60,18 Q 58,12 66,16 Q 74,20 68,36 Z" fill="#38BDF8"/>
    <!-- Duck bill -->
    <polygon points="66,16 80,18 66,22" fill="#F59E0B"/>
    <!-- Duck eye -->
    <circle cx="62" cy="18" r="2" fill="#1A1D24"/>
    <!-- Duck legs -->
    <line x1="32" y1="62" x2="32" y2="76" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="62" x2="48" y2="76" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <!-- Duck feet (webbed simplified) -->
    <polyline points="26,76 32,76 38,76" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <polyline points="42,76 48,76 54,76" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Farm fence background elements -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <!-- Fence post 1 -->
    <line x1="28" y1="120" x2="28" y2="192"/>
    <!-- Fence post 2 -->
    <line x1="120" y1="120" x2="120" y2="192"/>
    <!-- Fence post 3 -->
    <line x1="212" y1="120" x2="212" y2="192"/>
    <!-- Fence rails -->
    <line x1="28" y1="136" x2="212" y2="136" stroke-width="3"/>
    <line x1="28" y1="168" x2="212" y2="168" stroke-width="3"/>
  </g>
</svg>