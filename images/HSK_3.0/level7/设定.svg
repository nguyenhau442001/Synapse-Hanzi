<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: Modern Smartphone (representing the device where 'shèdìng' / setting takes place) -->
  <g transform="translate(75, 30)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="90" height="180" rx="14" fill="#2D333B" stroke="#4A5568" stroke-width="2"/>
    
    <!-- Screen Area -->
    <rect x="8" y="16" width="74" height="148" rx="8" fill="#11151C"/>
    
    <!-- Speaker Notch / Island -->
    <rect x="33" y="24" width="24" height="4" rx="2" fill="#4A5568"/>
    
    <!-- Alarm Clock Icon inside Screen -->
    <circle cx="45" cy="74" r="22" fill="none" stroke="#F6AD55" stroke-width="3"/>
    <path d="M45 62 L45 74 L53 78" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 54 L30 50" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    <path d="M56 54 L60 50" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Setting / Gear Icon overlaying the alarm (Visualizing '设定' - configuration/setup) -->
    <g transform="translate(45, 118)">
      <circle cx="0" cy="0" r="14" fill="#3182CE"/>
      <path d="M0 -6 L1.5 -3 L4.5 -4.5 L3 -1.5 L6 0 L3 1.5 L4.5 4.5 L1.5 3 L0 6 L-1.5 3 L-4.5 4.5 L-3 1.5 L-6 0 L-3 -1.5 L-4.5 -4.5 L-1.5 -3 Z" fill="#E2E8F0"/>
      <circle cx="0" cy="0" r="5" fill="#3182CE"/>
    </g>
    
    <!-- Home Indicator Bar -->
    <rect x="35" y="170" width="20" height="3" rx="1.5" fill="#4A5568"/>
  </g>
</svg>