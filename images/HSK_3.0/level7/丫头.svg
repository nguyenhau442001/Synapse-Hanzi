<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 5)">
    <!-- Stylized Butterfly representing the field context -->
    <g opacity="0.8">
      <path d="M70 65 C60 55 45 60 50 75 C55 90 70 85 70 75 Z" fill="#F39C12"/>
      <path d="M70 75 C60 85 45 80 50 95 C55 110 70 100 70 85 Z" fill="#E67E22"/>
      <path d="M170 50 C180 40 195 45 190 60 C185 75 170 70 170 60 Z" fill="#3498DB"/>
      <path d="M170 60 C180 70 195 65 190 80 C185 95 170 85 170 70 Z" fill="#2980B9"/>
      <line x1="120" y1="35" x2="120" y2="45" stroke="#7F8C8D" stroke-width="2" stroke-linecap="round"/>
      <circle cx="120" cy="33" r="3" fill="#F39C12"/>
    </g>

    <!-- Nature element: Ground curve -->
    <path d="M 30 205 Q 120 190 210 205" fill="none" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 212 Q 120 202 180 212" fill="none" stroke="#16A085" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Central Character: "小丫头" (A lively young girl with traditional double buns/pigtails) -->
    <g transform="translate(0, 8)">
      <!-- Body & Dress -->
      <path d="M 105 135 L 90 185 L 150 185 L 135 135 Z" fill="#E74C3C"/>
      <path d="M 97 135 C 97 125 143 125 143 135 Z" fill="#F5B041"/>
      
      <!-- Arms in joyful motion -->
      <path d="M 105 140 Q 80 130 75 115" fill="none" stroke="#F5B041" stroke-width="8" stroke-linecap="round"/>
      <path d="M 135 140 Q 160 120 170 110" fill="none" stroke="#F5B041" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Legs in running/hopping pose -->
      <line x1="105" y1="185" x2="95" y2="210" stroke="#F5B041" stroke-width="7" stroke-linecap="round"/>
      <line x1="135" y1="185" x2="145" y2="205" stroke="#F5B041" stroke-width="7" stroke-linecap="round"/>

      <!-- Head -->
      <circle cx="120" cy="98" r="26" fill="#FAD7A0"/>

      <!-- Hair Buns (characteristic of a young girl / nha đầu styling) -->
      <circle cx="102" cy="74" r="10" fill="#2C3E50"/>
      <circle cx="138" cy="74" r="10" fill="#2C3E50"/>
      <!-- Hair base / bangs -->
      <path d="M 96 90 Q 120 102 144 90 C 145 80 130 78 120 78 C 110 78 95 80 96 90 Z" fill="#2C3E50"/>

      <!-- Joyful Facial Expression -->
      <!-- Eyes (Happy curved lines) -->
      <path d="M 110 95 Q 114 90 118 95" fill="none" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 122 95 Q 126 90 130 95" fill="none" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Rosy Cheeks -->
      <circle cx="107" cy="101" r="3.5" fill="#F1948A" opacity="0.6"/>
      <circle cx="133" cy="101" r="3.5" fill="#F1948A" opacity="0.6"/>
      <!-- Big happy open smile -->
      <path d="M 114 104 Q 120 112 126 104" fill="#2C3E50" stroke="#2C3E50" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- Floating accent botanical elements -->
    <path d="M 45 160 Q 52 145 60 160" fill="none" stroke="#27AE60" stroke-width="2" stroke-linecap="round"/>
    <path d="M 185 170 Q 190 155 200 165" fill="none" stroke="#27AE60" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>