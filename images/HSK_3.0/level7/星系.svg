<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle cosmic background dots -->
  <circle cx="45" cy="50" r="0.8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="190" cy="40" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="205" cy="180" r="0.6" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="35" cy="195" r="1.0" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="110" cy="30" r="0.7" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="180" cy="210" r="0.9" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="30" cy="120" r="0.5" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="215" cy="100" r="0.8" fill="#FFFFFF" opacity="0.4"/>

  <!-- Spiral Galaxy Representation -->
  <g transform="translate(120, 120)">
    <!-- Outer spiral glow / dust lanes -->
    <path d="M 0,0 C -30,-20 -70,-50 -55,-80 C -45,-100 -10,-95 20,-75 C 60,-50 85,-10 70,30 C 55,70 10,85 -30,70 C -70,55 -90,10 -80,-30" 
          fill="none" stroke="#3A2860" stroke-width="16" stroke-linecap="round" opacity="0.4"/>

    <!-- Main Spiral Arm 1 -->
    <path d="M 0,0 C 35,20 75,50 60,80 C 50,100 15,95 -15,75 C -55,50 -80,10 -65,-30 C -50,-70 -5,-85 35,-70 C 75,-55 95,-10 85,30" 
          fill="none" stroke="url(#galaxyGradient1)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

    <!-- Main Spiral Arm 2 (Opposite) -->
    <path d="M 0,0 C -35,-20 -75,-50 -60,-80 C -50,-100 -15,-95 15,-75 C 55,-50 80,-10 65,30 C 50,70 5,85 -35,70 C -75,55 -95,-10 -85,30" 
          fill="none" stroke="url(#galaxyGradient2)" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

    <!-- Secondary fine spiral details -->
    <path d="M 0,0 C 20,-35 50,-75 25,-90 C 5,-100 -25,-75 -50,-40 C -75,-5 -85,45 -50,65" 
          fill="none" stroke="#FF9F43" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Central Galactic Bulge Outer Glow -->
    <circle cx="0" cy="0" r="28" fill="#FF9F43" opacity="0.2"/>
    <circle cx="0" cy="0" r="18" fill="#FFC107" opacity="0.4"/>

    <!-- Bright Galactic Core -->
    <circle cx="0" cy="0" r="10" fill="#FFE082"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>

    <!-- Star Clusters along arms -->
    <circle cx="45" cy="45" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="55" cy="35" r="1.5" fill="#FFE082" opacity="0.8"/>
    <circle cx="-50" cy="-45" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-40" cy="-60" r="1.5" fill="#FFE082" opacity="0.7"/>
    <circle cx="-55" cy="35" r="2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="40" cy="-45" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="65" cy="-20" r="1.5" fill="#FFE082" opacity="0.8"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="galaxyGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" />
      <stop offset="50%" stop-color="#9C27B0" />
      <stop offset="100%" stop-color="#3F51B5" />
    </linearGradient>
    <linearGradient id="galaxyGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>
  </defs>
</svg>