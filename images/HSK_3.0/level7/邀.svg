  <path d="M40 180 L200 180 L190 220 L50 220 Z" fill="#2C313C"/>
  <ellipse cx="120" cy="180" rx="40" ry="10" fill="#3E4451"/>
  
  <!-- Tea set on table -->
  <rect x="110" y="165" width="20" height="15" rx="2" fill="#FFB347"/>
  <circle cx="140" cy="172" r="6" fill="#FFB347"/>
  
  <!-- Character: The host inviting -->
  <!-- Body -->
  <path d="M60 120 C60 100, 80 90, 100 90 C120 90, 140 100, 140 120 L130 200 L70 200 Z" fill="#4A90E2"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="20" fill="#FFD1A9"/>
  <!-- Arm gesturing invitation -->
  <path d="M85 110 L50 130 L65 145 L95 120" fill="#FFD1A9" stroke="#1A1D24" stroke-width="2"/>
  
  <!-- Guest character -->
  <!-- Body -->
  <path d="M160 130 C160 110, 180 100, 200 100 C220 100, 240 110, 240 130 L230 200 L170 200 Z" fill="#7B68EE"/>
  <!-- Head -->
  <circle cx="200" cy="95" r="18" fill="#FFD1A9"/>
  
  <!-- Motion lines for invitation gesture -->
  <path d="M55 125 Q40 115 35 100" stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M50 130 Q35 120 30 105" stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative tea steam -->
  <path d="M140 160 Q145 150 140 140" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.5"/>
