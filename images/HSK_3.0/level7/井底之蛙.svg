<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 130)">
    <!-- Outer wide world hint (top corners) -->
    <circle cx="-70" cy="-80" r="1.5" fill="#4A5568" opacity="0.5"/>
    <circle cx="80" cy="-90" r="2" fill="#4A5568" opacity="0.6"/>
    <circle cx="-30" cy="-100" r="1" fill="#4A5568" opacity="0.4"/>
    <circle cx="40" cy="-95" r="1.5" fill="#4A5568" opacity="0.5"/>

    <!-- Well Structure (Cylinder/Walls) -->
    <!-- Well Interior Shadow -->
    <ellipse cx="0" cy="15" rx="55" ry="20" fill="#0F1115"/>

    <!-- Well Wall Body -->
    <path d="M-55,15 L-55,75 C-55,86 25,86 55,75 L55,15 C55,26 25,35 0,35 C-25,35 -55,26 -55,15 Z" fill="#2D3748"/>
    
    <!-- Brick lines on the well wall -->
    <path d="M-52,35 C-30,42 30,42 52,35" stroke="#1A1D24" stroke-width="1.5" fill="none"/>
    <path d="M-54,48 C-20,55 20,55 54,48" stroke="#1A1D24" stroke-width="1.5" fill="none"/>
    <path d="M-55,62 C-20,68 20,68 55,62" stroke="#1A1D24" stroke-width="1.5" fill="none"/>

    <!-- Well Rim (Top Opening) -->
    <ellipse cx="0" cy="15" rx="55" ry="18" fill="none" stroke="#4A5568" stroke-width="6"/>
    <ellipse cx="0" cy="13" rx="55" ry="18" fill="none" stroke="#718096" stroke-width="2"/>

    <!-- Water at bottom of well -->
    <ellipse cx="0" cy="70" rx="42" ry="10" fill="#2B6CB0" opacity="0.6"/>

    <!-- The Frog (Center of the well bottom) -->
    <g transform="translate(0, 52)">
      <!-- Frog Body -->
      <ellipse cx="0" cy="12" rx="18" ry="13" fill="#48BB78"/>
      
      <!-- Frog Legs -->
      <ellipse cx="-16" cy="15" rx="7" ry="5" fill="#38A169" transform="rotate(-20 -16 15)"/>
      <ellipse cx="16" cy="15" rx="7" ry="5" fill="#38A169" transform="rotate(20 16 15)"/>
      <path d="M-18,18 C-24,20 -24,25 -20,26" stroke="#38A169" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M18,18 C24,20 24,25 20,26" stroke="#38A169" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- Frog Eyes (Prominent, looking up) -->
      <circle cx="-8" cy="1" r="6" fill="#48BB78"/>
      <circle cx="8" cy="1" r="6" fill="#48BB78"/>
      <circle cx="-8" cy="-1" r="2.5" fill="#1A202C"/>
      <circle cx="8" cy="-1" r="2.5" fill="#1A202C"/>
      <circle cx="-7" cy="-2" r="1" fill="#FFFFFF"/>
      <circle cx="9" cy="-2" r="1" fill="#FFFFFF"/>
    </g>

    <!-- Circular sky view from inside the well -->
    <clipPath id="well-opening">
      <ellipse cx="0" cy="-45" rx="65" ry="25"/>
    </clipPath>

    <g clip-path="url(#well-opening)">
      <!-- Sky gradient representing the limited view -->
      <rect x="-80" y="-80" width="160" height="60" fill="#2B4C7E"/>
      
      <!-- Tiny simple cloud passing by -->
      <path d="M-15,-48 C-15,-52 -8,-52 -5,-48 C-1,-52 6,-52 6,-47 C10,-47 10,-42 5,-42 L-15,-42 C-19,-42 -19,-47 -15,-48 Z" fill="#E2E8F0" opacity="0.3"/>
    </g>

    <!-- Well Rim Top Edge (Foreground overlap) -->
    <path d="M-65,-45 C-65,-30 65,-30 65,-45" fill="none" stroke="#718096" stroke-width="3"/>
  </g>
</svg>