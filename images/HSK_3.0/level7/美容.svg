<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character: Profile view of a woman -->
  <g transform="translate(120, 120)">
    <!-- Shoulders/Neck -->
    <path d="M-60 100 C-60 60, -30 40, 0 40 C30 40, 60 60, 60 100" fill="#2D343E"/>
    
    <!-- Face -->
    <path d="M-25 -20 C-25 -50, -10 -70, 15 -70 C40 -70, 55 -50, 55 -20 C55 10, 40 30, 15 30 C-10 30, -25 10, -25 -20" fill="#FFD1B3"/>
    
    <!-- Hair -->
    <path d="M-30 -25 C-30 -60, -10 -85, 15 -85 C45 -85, 60 -60, 60 -20 L60 20 L-25 20 Z" fill="#3D4755"/>
    
    <!-- Hand performing skincare (Action) -->
    <g transform="translate(10, -10)">
      <path d="M0 0 C5 10, 15 15, 25 10 L35 5 L40 15 C45 20, 55 15, 55 5 C55 -5, 45 -10, 40 -5 L30 0 L25 -5 C20 -10, 10 -10, 5 -5 Z" fill="#FFD1B3"/>
      <!-- Motion lines indicating gentle application/massage -->
      <path d="M10 -15 A15 15 0 0 1 25 -25" stroke="#FFB84D" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M5 -20 A20 20 0 0 1 25 -35" stroke="#FFB84D" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Cosmetic tool (Dropper/Serum) -->
    <path d="M-5 -10 L-15 10 L-10 15 L0 -5 Z" fill="#FFB84D"/>
    <rect x="-12" y="-20" width="6" height="10" rx="2" fill="#A0AEC0"/>
  </g>
</svg>