<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Ambient Glow for Focus -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Bystander / Outsider Conceptual Illustration (旁人) -->
  <!-- Central Character: The Focal Person (Focus/Main subject) -->
  <g transform="translate(0, 0)">
    <!-- Main Person's Shadow/Base -->
    <ellipse cx="120" cy="180" rx="24" ry="6" fill="#111318"/>
    <!-- Main Person Body -->
    <path d="M 100 180 C 100 155, 105 140, 120 140 C 135 140, 140 155, 140 180 Z" fill="#3B82F6"/>
    <!-- Main Person Head -->
    <circle cx="120" cy="115" r="16" fill="#60A5FA"/>
    <!-- Main Person Hair -->
    <path d="M 104 115 C 104 103, 110 98, 120 98 C 130 98, 136 103, 136 115 C 132 110, 128 108, 120 108 C 112 108, 108 110, 104 115 Z" fill="#1E3A8A"/>
  </g>

  <!-- Surrounding Figures: "旁人" (The Others / Outsiders / Bystanders looking on) -->
  <!-- Left Bystander -->
  <g transform="translate(-45, 10)">
    <!-- Shadow -->
    <ellipse cx="105" cy="175" rx="18" ry="4" fill="#111318"/>
    <!-- Body -->
    <path d="M 90 175 C 90 155, 95 142, 105 142 C 115 142, 120 155, 120 175 Z" fill="#4B5563"/>
    <!-- Head -->
    <circle cx="105" cy="120" r="13" fill="#9CA3AF"/>
    <!-- Hair -->
    <path d="M 92 120 C 92 110, 97 106, 105 106 C 113 106, 118 110, 118 120 Z" fill="#374151"/>
  </g>

  <!-- Right Bystander -->
  <g transform="translate(45, 10)">
    <!-- Shadow -->
    <ellipse cx="135" cy="175" rx="18" ry="4" fill="#111318"/>
    <!-- Body -->
    <path d="M 120 175 C 120 155, 125 142, 135 142 C 145 142, 150 155, 150 175 Z" fill="#4B5563"/>
    <!-- Head -->
    <circle cx="135" cy="120" r="13" fill="#9CA3AF"/>
    <!-- Hair -->
    <path d="M 122 120 C 122 110, 127 106, 135 106 C 143 106, 148 110, 148 120 Z" fill="#374151"/>
  </g>

  <!-- Subtle separation/distinction elements (Golden accent highlighting the separation of the main person from "others") -->
  <circle cx="120" cy="120" r="62" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
</svg>