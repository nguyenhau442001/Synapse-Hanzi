<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative pillar / monument base hint -->
  <path d="M70 190 L170 190 L160 205 L80 205 Z" fill="#2A303C"/>
  <rect x="95" y="150" width="50" height="40" fill="#242933"/>

  <!-- Memorial Wreath (花圈) as the central physical object representing '祭奠' / 'cúng viếng' -->
  <g transform="translate(120, 105)">
    <!-- Outer foliage ring (Dark & Olive Green) -->
    <circle cx="0" cy="0" r="54" fill="#1E3329" stroke="#2D4D3D" stroke-width="3"/>
    <circle cx="0" cy="0" r="44" fill="#1A1D24"/>
    
    <!-- Stylized leaves/pine details around the wreath -->
    <path d="M 0 -54 C 15 -54 30 -45 40 -30 C 50 -15 54 0 54 15 C 54 30 45 45 30 52" fill="none" stroke="#3A6B52" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 -54 C -15 -54 -30 -45 -40 -30 C -50 -15 -54 0 -54 15 C -54 30 -45 45 -30 52" fill="none" stroke="#2E5440" stroke-width="6" stroke-linecap="round"/>

    <!-- White memorial flowers (chrysanthemums stylized in flat design) -->
    <g fill="#E2E8F0">
      <!-- Top flower -->
      <circle cx="0" cy="-42" r="9"/>
      <circle cx="0" cy="-42" r="4" fill="#CBD5E1"/>
      
      <!-- Right flowers -->
      <circle cx="38" cy="-12" r="8"/>
      <circle cx="42" cy="12" r="8"/>
      
      <!-- Left flowers -->
      <circle cx="-38" cy="-12" r="8"/>
      <circle cx="-42" cy="12" r="8"/>
      
      <!-- Bottom center cluster -->
      <circle cx="-14" cy="40" r="7"/>
      <circle cx="14" cy="40" r="7"/>
    </g>

    <!-- Center Ceremonial Ribbon (Gold / Warm Accent) -->
    <g transform="translate(0, 12)">
      <!-- Ribbon Bow -->
      <path d="M-12 -12 C-20 -22 -30 -10 -16 -2 C-8 2 0 10 0 10 C0 10 8 2 16 -2 C30 -10 20 -22 12 -12 C6 -5 0 2 0 2 C0 2 -6 -5 -12 -12 Z" fill="#D97706"/>
      <circle cx="0" cy="2" r="5" fill="#F59E0B"/>
      
      <!-- Hanging Ribbon Tails -->
      <path d="M-6 7 L-18 45 L-8 48 L-2 15 Z" fill="#D97706"/>
      <path d="M6 7 L18 45 L8 48 L2 15 Z" fill="#B45309"/>
    </g>
  </g>

  <!-- Incense / Subtle flame accent at base for solemn remembrance context -->
  <g transform="translate(120, 192)">
    <!-- Incense holder base -->
    <ellipse cx="0" cy="10" rx="16" ry="5" fill="#4B5563"/>
    <rect x="-10" y="6" width="20" height="4" fill="#6B7280"/>
    
    <!-- Glowing ember / flame flicker (orange/gold accent) -->
    <path d="M0 2 C-2 -2 -3 -5 0 -8 C3 -5 2 -2 0 2 Z" fill="#F59E0B"/>
    <path d="M0 -1 C-1 -3 -1.5 -4 0 -5 C1.5 -4 1 -3 0 -1 Z" fill="#FEF3C7"/>
  </g>
</svg>