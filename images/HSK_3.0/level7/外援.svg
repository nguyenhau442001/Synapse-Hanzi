<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle stadium pitch lines in background -->
  <path d="M 40 180 L 120 180 L 120 60 L 40 60" fill="none" stroke="#262B36" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="35" fill="none" stroke="#262B36" stroke-width="2"/>
  <line x1="120" y1="60" x2="120" y2="180" stroke="#262B36" stroke-width="2"/>

  <!-- Incoming transfer/external support graphic element: Glowing arrival directional arrow -->
  <path d="M 50 120 L 100 120 M 80 100 L 100 120 L 80 140" fill="none" stroke="#FFA000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  
  <!-- Central human character (Athletic forward/external reinforcement) -->
  <g transform="translate(10, 0)">
    <!-- Body/Jersey with high-contrast accent (representing elite player reinforcement) -->
    <path d="M 115 140 L 95 200 L 145 200 L 125 140 Z" fill="#2D3748"/>
    <path d="M 105 140 L 135 140 L 140 190 L 100 190 Z" fill="#00E676"/>
    
    <!-- Dynamic arms suggesting active play -->
    <circle cx="95" cy="135" r="8" fill="#FFD166"/>
    <circle cx="145" cy="135" r="8" fill="#FFD166"/>
    
    <!-- Head -->
    <circle cx="120" cy="105" r="16" fill="#FFD166"/>
    
    <!-- Hair / Athletic headband -->
    <path d="M 104 105 C 104 90, 136 90, 136 105 Z" fill="#2D3748"/>
    <rect x="103" y="100" width="34" height="4" fill="#FFA000" rx="2"/>
  </g>

  <!-- Soccer ball at foot representing sports context -->
  <circle cx="95" cy="190" r="14" fill="#FFFFFF"/>
  <polygon points="95,183 100,187 98,193 92,193 90,187" fill="#1A1D24"/>
  <line x1="95" y1="183" x2="95" y2="176" stroke="#1A1D24" stroke-width="2"/>
  <line x1="100" y1="187" x2="106" y2="185" stroke="#1A1D24" stroke-width="2"/>
  <line x1="98" y1="193" x2="103" y2="198" stroke="#1A1D24" stroke-width="2"/>
  <line x1="92" y1="193" x2="87" y2="198" stroke="#1A1D24" stroke-width="2"/>
  <line x1="90" y1="187" x2="84" y2="185" stroke="#1A1D24" stroke-width="2"/>

  <!-- Star emblem indicating world-class elite status -->
  <path d="M 190 60 L 194 72 L 207 72 L 197 80 L 200 92 L 190 84 L 180 92 L 183 80 L 173 72 L 186 72 Z" fill="#FFD166"/>
  <path d="M 50 60 L 53 68 L 61 68 L 55 72 L 57 80 L 50 75 L 43 80 L 45 72 L 39 68 L 47 68 Z" fill="#FFD166" opacity="0.6"/>
</svg>