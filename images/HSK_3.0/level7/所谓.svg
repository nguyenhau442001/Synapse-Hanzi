<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Conceptual Illustration for "所谓" (So-called / Pretend / Quotation marks representing empty or nominal concepts) -->
  <g transform="translate(0, 0)">
    <!-- Backdrop glow for focus -->
    <circle cx="120" cy="115" r="70" fill="#242B38" opacity="0.6"/>

    <!-- Large stylized Quotation Marks representing "Cái gọi là" (so-called) -->
    <!-- Left Quotation Mark -->
    <path d="M 65 85 C 65 65 75 50 95 45 L 88 35 C 62 40 45 60 45 90 L 45 125 L 85 125 L 85 85 Z" fill="#F5A623" opacity="0.9"/>
    <path d="M 50 115 L 75 115 L 75 80 L 55 80 Z" fill="#1A1D24"/>
    <path d="M 50 100 L 70 100" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Quotation Mark -->
    <path d="M 175 85 C 175 65 185 50 205 45 L 198 35 C 172 40 155 60 155 90 L 155 125 L 195 125 L 195 85 Z" fill="#F5A623" opacity="0.35"/>
    <path d="M 160 115 L 185 115 L 185 80 L 165 80 Z" fill="#1A1D24"/>

    <!-- Central Physical Object: A physical magnifying glass inspecting/revealing an empty label/mask -->
    <!-- Mask / Hollow Tag symbolizing the superficial "so-called" label -->
    <rect x="80" y="105" width="80" height="50" rx="8" fill="#2E384D" stroke="#4A5568" stroke-width="2"/>
    <circle cx="120" cy="130" r="14" fill="#1A1D24"/>
    <!-- Question mark inside the hollow entity to denote questionable nature -->
    <path d="M 115 124 C 115 120 125 120 125 126 C 125 131 117 131 117 136" stroke="#F5A623" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="117" cy="142" r="1.5" fill="#F5A623"/>

    <!-- Magnifying Glass scrutinizing the concept -->
    <g transform="translate(15, 10) rotate(-15 130 130)">
      <!-- Glass handle -->
      <rect x="140" y="150" width="12" height="40" rx="6" fill="#F5A623"/>
      <!-- Glass rim -->
      <circle cx="134" cy="125" r="32" fill="none" stroke="#F5A623" stroke-width="6"/>
      <!-- Glass lens reflection -->
      <path d="M 112 110 A 26 26 0 0 1 148 105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>
  </g>

  <!-- Base platform line for grounding the object -->
  <line x1="70" y1="185" x2="170" y2="185" stroke="#2E384D" stroke-width="3" stroke-linecap="round"/>
</svg>