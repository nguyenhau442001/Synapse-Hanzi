<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Outer interconnected collective puzzle/network representing the 'dàjú' (big picture/collective) -->
    <path d="M-60,-60 L-20,-60 L-20,-20 L-60,-20 Z" fill="#2D3748" rx="4"/>
    <path d="M-10,-60 L30,-60 L30,-20 L-10,-20 Z" fill="#2D3748" rx="4"/>
    <path d="M40,-60 L80,-60 L80,-20 L40,-20 Z" fill="#2D3748" rx="4"/>
    
    <path d="M-60,-10 L-20,-10 L-20,30 L-60,30 Z" fill="#2D3748" rx="4"/>
    <!-- Central interlocking piece being willingly adjusted/placed to complete the whole -->
    <path d="M-12,-12 L28,-12 L28,28 L-12,28 Z" fill="#3B82F6" rx="4"/>
    
    <path d="M40,-10 L80,-10 L80,30 L40,30 Z" fill="#2D3748" rx="4"/>
    
    <path d="M-60,40 L-20,40 L-20,80 L-60,80 Z" fill="#2D3748" rx="4"/>
    <path d="M-10,40 L30,40 L30,80 L-10,80 Z" fill="#2D3748" rx="4"/>
    <path d="M40,40 L80,40 L80,80 L40,80 Z" fill="#2D3748" rx="4"/>

    <!-- Focal glowing connection point highlighting harmony and sacrifice of individual positioning for the whole -->
    <circle cx="8" cy="8" r="32" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
    
    <!-- Central symbolic figure of person contributing to the whole (gùquán) -->
    <circle cx="8" cy="-2" r="10" fill="#FBBF24"/>
    <path d="M-4,18 C-4,8 20,8 20,18" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>