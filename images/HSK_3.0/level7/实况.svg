<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Studio / Broadcasting Environment Indicators -->
  <circle cx="120" cy="120" r="90" fill="#222732" opacity="0.6"/>
  <circle cx="120" cy="120" r="70" fill="#282E3D" opacity="0.4"/>
  
  <!-- Live Signal Waves (Broadcasting "Live" effect) -->
  <path d="M 65 95 A 55 55 0 0 1 65 145" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 50 80 A 75 75 0 0 1 50 160" fill="none" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>
  <path d="M 175 95 A 55 55 0 0 0 175 145" fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 190 80 A 75 75 0 0 0 190 160" fill="none" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Professional Video Camera Body (Physical Object representing live-action scene/shíkuàng) -->
  <g transform="translate(10, 15)">
    <!-- Main Camera Body -->
    <rect x="65" y="80" width="70" height="48" rx="8" fill="#3B4252"/>
    <rect x="68" y="83" width="64" height="42" rx="6" fill="#4C566A"/>
    
    <!-- Camera Lens (Detailed optical elements) -->
    <circle cx="65" cy="104" r="22" fill="#2E3440"/>
    <circle cx="65" cy="104" r="18" fill="#3B4252"/>
    <circle cx="65" cy="104" r="13" fill="#88C0D0" opacity="0.8"/>
    <circle cx="61" cy="100" r="4" fill="#E5E9F0" opacity="0.6"/>
    <path d="M 55 94 L 59 104 L 55 114" fill="none" stroke="#5E81AC" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Camera Viewfinder & Top Details -->
    <rect x="105" y="66" width="22" height="16" rx="3" fill="#3B4252"/>
    <rect x="110" y="70" width="12" height="8" rx="2" fill="#2E3440"/>
    <rect x="80" y="72" width="16" height="8" rx="2" fill="#2E3440"/>
    
    <!-- Microphone mounted on top -->
    <rect x="83" y="52" width="26" height="10" rx="5" fill="#E5C07B"/>
    <line x1="96" y1="62" x2="96" y2="72" stroke="#3B4252" stroke-width="3"/>
    <circle cx="96" cy="67" r="2" fill="#2E3440"/>
    
    <!-- Camera Handle / Grip -->
    <path d="M 135 90 C 145 90, 148 100, 146 116 C 145 122, 140 126, 135 128" fill="none" stroke="#3B4252" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Back Screen / Monitor Display -->
    <rect x="140" y="88" width="20" height="32" rx="4" fill="#2E3440"/>
    <rect x="143" y="91" width="14" height="26" rx="2" fill="#5E81AC"/>
    <!-- Live scene graphic preview on tiny screen -->
    <circle cx="150" cy="101" r="4" fill="#E5C07B"/>
    <path d="M 143 111 L 148 106 L 152 110 L 157 105" fill="none" stroke="#A3BE8C" stroke-width="2"/>
    
    <!-- Studio Tripod Mount Base -->
    <path d="M 85" y="128" L 80" y="145" L 120" y="145" L 115" y="128" fill="#3B4252"/>
    <line x1="100" y1="145" x2="100" y2="168" stroke="#4C566A" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Tripod Legs -->
    <line x1="100" y1="168" x2="70" y2="205" stroke="#3B4252" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="168" x2="130" y2="205" stroke="#3B4252" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="168" x2="100" y2="208" stroke="#2E3440" stroke-width="5" stroke-linecap="round"/>
    
    <!-- REC / LIVE Indicator Light (Bright Orange/Red to signify real-time broadcast) -->
    <circle cx="123" cy="91" r="4" fill="#FF5722"/>
    <circle cx="123" cy="91" r="6" fill="#FF5722" opacity="0.4"/>
  </g>

  <!-- Live Action Context Indicator (Dynamic Focus Reticle framing the broadcast) -->
  <path d="M 35 60 L 50 60" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 35 60 L 35 75" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  
  <path d="M 205 60 L 190 60" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 205 60 L 205 75" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  
  <path d="M 35 180 L 50 180" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 35 180 L 35 165" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  
  <path d="M 205 180 L 190 180" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 205 180 L 205 165" fill="none" stroke="#E5C07B" stroke-width="3" stroke-linecap="round"/>

  <!-- Flashing LIVE Dot -->
  <circle cx="120" cy="32" r="5" fill="#FF5722"/>
  <circle cx="120" cy="32" r="9" fill="#FF5722" opacity="0.3"/>
</svg>