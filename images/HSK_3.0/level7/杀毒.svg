<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Computer Monitor -->
  <rect x="60" y="70" width="120" height="85" rx="4" fill="#2D343E" stroke="#4A5568" stroke-width="2"/>
  <rect x="65" y="75" width="110" height="75" rx="2" fill="#0F1217"/>
  
  <!-- Screen Content: Virus (represented as a jagged, spikey organic shape) -->
  <path d="M120 95 C 130 95, 135 100, 135 110 C 135 120, 130 125, 120 125 C 110 125, 105 120, 105 110 C 105 100, 110 95, 120 95 Z" fill="#E53E3E"/>
  <circle cx="113" cy="105" r="3" fill="#1A1D24"/>
  <circle cx="127" cy="105" r="3" fill="#1A1D24"/>
  <path d="M112 118 Q 120 114 128 118" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Scanning/Deletion Effect: A bold orange crosshair/target over the virus -->
  <line x1="120" y1="85" x2="120" y2="135" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="110" x2="145" y2="110" stroke="#F6AD55" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Monitor Stand -->
  <rect x="110" y="155" width="20" height="15" fill="#4A5568"/>
  <rect x="90" y="170" width="60" height="5" rx="2" fill="#4A5568"/>
</svg>