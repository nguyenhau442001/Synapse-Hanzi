<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Physical Object: Student Club / Organization (社团) Scene -->
  <!-- A central hub table representing a student club gathering/booth with diverse activity symbols -->
  
  <!-- Desk/Table Base -->
  <path d="M60 160 L180 160 L195 190 L45 190 Z" fill="#2D3748"/>
  <rect x="55" y="150" width="130" height="14" rx="3" fill="#4A5568"/>
  <rect x="75" y="190" width="12" height="30" fill="#2D3748"/>
  <rect x="153" y="190" width="12" height="30" fill="#2D3748"/>

  <!-- Club Activity Items on Table (Photography, Drama, Calligraphy representation) -->
  <!-- Calligraphy Brush & Scroll -->
  <path d="M75 145 L105 135 L110 145 L80 155 Z" fill="#E2E8F0"/>
  <rect x="92" y="120" width="4" height="30" rx="2" transform="rotate(-20 92 120)" fill="#D69E2E"/>
  
  <!-- Camera (Photography Club) -->
  <rect x="105" y="125" width="30" height="22" rx="4" fill="#E2E8F0"/>
  <circle cx="120" cy="136" r="7" fill="#1A1D24"/>
  <circle cx="120" cy="136" r="4" fill="#3182CE"/>
  <rect x="114" y="120" width="8" height="5" rx="1" fill="#CBD5E0"/>

  <!-- Drama Mask (Theater Club) -->
  <path d="M148 125 C143 125 140 132 140 138 C140 145 145 150 152 150 C159 150 164 145 164 138 C164 132 161 125 148 125 Z" fill="#ED8936"/>
  <circle cx="146" cy="136" r="2" fill="#1A1D24"/>
  <circle cx="156" cy="136" r="2" fill="#1A1D24"/>
  <path d="M147 143 Q151 147 155 143" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Group of Students / Members (Abstracted minimalist figures interacting) -->
  <!-- Member 1 (Left) -->
  <circle cx="70" cy="95" r="14" fill="#F6AD55"/>
  <path d="M50 135 C50 118 58 115 70 115 C82 115 90 118 90 135 Z" fill="#3182CE"/>

  <!-- Member 2 (Center - Leader/Presenter) -->
  <circle cx="120" cy="85" r="15" fill="#FEEBC8"/>
  <path d="M98 128 C98 110 106 105 120 105 C134 105 142 110 142 128 Z" fill="#ED8936"/>

  <!-- Member 3 (Right) -->
  <circle cx="170" cy="95" r="14" fill="#90CDF4"/>
  <path d="M150 135 C150 118 158 115 170 115 C182 115 190 118 190 135 Z" fill="#38A169"/>

  <!-- Banner / Backdrop representing Organization/Club identity -->
  <path d="M70 50 L170 50 L160 85 L80 85 Z" fill="#2B6CB0"/>
  <circle cx="120" cy="67" r="10" fill="#ECC94B"/>

  <!-- Decorative Accent Highlights (Modern flat UX dots/sparkles) -->
  <circle cx="45" cy="70" r="3" fill="#ED8936" opacity="0.8"/>
  <circle cx="195" cy="75" r="4" fill="#38A169" opacity="0.8"/>
  <circle cx="35" cy="130" r="2.5" fill="#3182CE" opacity="0.8"/>
  <circle cx="205" cy="140" r="3" fill="#ECC94B" opacity="0.8"/>
</svg>