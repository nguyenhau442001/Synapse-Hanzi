<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient background elements representing Jiangnan water town (bridge arch, soft willow/water line) -->
  <path d="M40 180 Q120 150 200 180" fill="none" stroke="#252A34" stroke-width="2" stroke-linecap="round"/>
  <path d="M90 190 Q120 175 150 190" fill="none" stroke="#252A34" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Elderly couple character group representing "晚年" (Golden Years / Tuổi già) -->
  <!-- Sitting together on a traditional wooden bench, peaceful and harmonious -->
  
  <!-- Wooden Bench -->
  <rect x="70" y="155" width="100" height="8" rx="2" fill="#D97706"/>
  <rect x="75" y="163" width="8" height="22" rx="1" fill="#B45309"/>
  <rect x="157" y="163" width="8" height="22" rx="1" fill="#B45309"/>

  <!-- Left Figure (Elderly Gentleman) -->
  <!-- Body/Torso -->
  <path d="M85 155 L90 120 C92 112 102 112 105 120 L110 155 Z" fill="#3B82F6"/>
  <!-- Head -->
  <circle cx="97.5" cy="103" r="11" fill="#FDE047"/>
  <!-- Hair (silver/white tufts on sides) -->
  <path d="M87 103 Q97 90 108 103" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Relaxed arm resting on bench -->
  <path d="M95 128 L80 145" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="88" y="155" width="7" height="25" rx="3.5" fill="#1E3A8A"/>

  <!-- Right Figure (Elderly Lady) -->
  <!-- Body/Torso -->
  <path d="M130 155 L135 120 C137 112 147 112 150 120 L155 155 Z" fill="#F43F5E"/>
  <!-- Head -->
  <circle cx="142.5" cy="103" r="11" fill="#FDE047"/>
  <!-- Hair (neat bun / silver) -->
  <circle cx="151" cy="101" r="4.5" fill="#E2E8F0"/>
  <path d="M132 105 Q142 93 153 103" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gentle leaning posture towards the center -->
  <path d="M140 128 L155 145" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="145" y="155" width="7" height="25" rx="3.5" fill="#881337"/>

  <!-- Warm Golden Hour Glow / Sun setting (peaceful twilight) -->
  <circle cx="195" cy="70" r="18" fill="#F59E0B" opacity="0.85"/>
  <path d="M170 85 Q195 70 220 85" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Subtle calming botanical element (bamboo or willow branch silhouette on the side) -->
  <path d="M30 140 Q35 110 25 80" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M28 115 Q18 110 20 100" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M32 95 Q42 90 40 82" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

</svg>