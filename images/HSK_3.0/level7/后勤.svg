<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Supply Crate / Logistics Box -->
  <g transform="translate(60, 80)">
    <!-- Main Box Body -->
    <path d="M20 20 L100 20 L120 40 L120 120 L40 120 L20 100 Z" fill="#3D4451" stroke="#FFB84D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20 20 L40 40 L120 40" fill="none" stroke="#FFB84D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40 40 L40 120" fill="none" stroke="#FFB84D" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Supplies inside -->
    <rect x="50" y="50" width="20" height="15" fill="#FFB84D" rx="2"/>
    <rect x="80" y="60" width="25" height="20" fill="#FFB84D" rx="2"/>
    <rect x="55" y="80" width="30" height="15" fill="#FFB84D" rx="2"/>
  </g>
  
  <!-- Conveyor / Supply Line Element -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="160" height="10" rx="5" fill="#3D4451"/>
    <circle cx="20" cy="5" r="6" fill="#FFB84D"/>
    <circle cx="60" cy="5" r="6" fill="#FFB84D"/>
    <circle cx="100" cy="5" r="6" fill="#FFB84D"/>
    <circle cx="140" cy="5" r="6" fill="#FFB84D"/>
  </g>
  
  <!-- Supporting Gear Icon (Logistics/Mechanism) -->
  <g transform="translate(180, 40)">
    <path d="M0 0 L10 0 L12 10 L20 10 L22 0 L32 0 L34 10 L42 10 L44 0 L54 0 L54 10 L44 10 L42 20 L34 20 L32 30 L22 30 L20 20 L12 20 L10 30 L0 30 L0 20 L10 20 L12 10 L0 10 Z" fill="#FFB84D"/>
    <circle cx="27" cy="15" r="8" fill="#1A1D24"/>
  </g>
</svg>