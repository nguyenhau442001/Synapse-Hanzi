<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ancient Scroll representing the secret recipe -->
  <g transform="translate(120, 120)">
    <!-- Scroll body -->
    <path d="M-60 -20 L60 -20 L60 20 L-60 20 Z" fill="#D4AF37"/>
    <path d="M-60 -20 L-60 20 L-65 25 L-65 -25 Z" fill="#B8860B"/>
    <path d="M60 -20 L60 20 L65 25 L65 -25 Z" fill="#B8860B"/>
    
    <!-- Scroll ends (rollers) -->
    <circle cx="-65" cy="0" r="10" fill="#8B4513"/>
    <circle cx="65" cy="0" r="10" fill="#8B4513"/>
    
    <!-- Seal/Wax stamp on the scroll -->
    <circle cx="0" cy="0" r="12" fill="#C0392B"/>
    <path d="M-6 -6 L6 6 M-6 6 L6 -6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Decorative lines on scroll -->
    <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#A67C00" stroke-width="1"/>
    <line x1="-50" y1="10" x2="50" y2="10" stroke="#A67C00" stroke-width="1"/>
  </g>
  
  <!-- Subtle glow effect behind the scroll -->
  <circle cx="120" cy="120" r="40" fill="url(#grad1)" opacity="0.2"/>
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1D24;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>