<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Central chaotic whirlwind / flurry effect representing "mángluàn" (confusion/hurried disorder) -->
    <path d="M-40 -40 Q 0 -60 50 -20 Q 80 10 40 40 Q 10 70 -30 30 Q -60 -10 -40 -40 Z" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6"/>
    <path d="M-50 20 Q -20 -50 30 -40 Q 70 -30 50 30 Q 30 70 -20 50 Z" fill="none" stroke="#FFA94D" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5" opacity="0.5"/>
    
    <!-- Tilted spinning desk items (representing frantic disorder) -->
    <!-- Document 1 (flying right) -->
    <g transform="translate(35, -25) rotate(25)">
      <rect x="-18" y="-24" width="36" height="48" rx="3" fill="#E2E8F0"/>
      <line x1="-10" y1="-14" x2="10" y2="-14" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="6" x2="4" y2="6" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Document 2 (flying left/falling) -->
    <g transform="translate(-40, 15) rotate(-35)">
      <rect x="-16" y="-22" width="32" height="44" rx="3" fill="#CBD5E1"/>
      <line x1="-8" y1="-12" x2="8" y2="-12" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
      <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
      <line x1="-8" y1="8" x2="2" y2="8" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Overturned coffee cup with spilled liquid -->
    <g transform="translate(15, 38) rotate(-65)">
      <path d="M -10 -12 L 10 -12 L 8 12 C 8 15 5 17 0 17 C -5 17 -8 15 -8 12 Z" fill="#FF8787"/>
      <path d="M 10 -6 C 16 -6 18 -2 18 2 C 18 6 16 10 10 10" fill="none" stroke="#FF8787" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Splash drop 1 -->
    <circle cx="45" cy="52" r="3.5" fill="#FF8787"/>
    <!-- Splash drop 2 -->
    <circle cx="58" cy="42" r="2" fill="#FF8787"/>

    <!-- Central Character: Frantic office worker with hands on head -->
    <!-- Body/Suit -->
    <path d="M-22 55 L-35 85 L35 85 L22 55 Z" fill="#3B82F6"/>
    <path d="M-8 55 L0 72 L8 55 Z" fill="#FFFFFF"/> <!-- Shirt collar -->
    <path d="M-2 72 L0 85 L2 72 Z" fill="#EF4444"/> <!-- Tie -->

    <!-- Head & Neck -->
    <rect x="-5" y="38" width="10" height="18" fill="#FBBF24"/>
    <circle cx="0" cy="30" r="18" fill="#FBBF24"/>
    
    <!-- Hair -->
    <path d="M-18 25 C-18 12 -5 12 0 10 C5 12 18 12 18 25 C15 20 10 18 0 19 C-10 18 -15 20 -18 25 Z" fill="#1E293B"/>

    <!-- Wide panicked eyes -->
    <circle cx="-6" cy="28" r="3.5" fill="#FFFFFF"/>
    <circle cx="-6" cy="28" r="1.5" fill="#1E293B"/>
    <circle cx="6" cy="28" r="3.5" fill="#FFFFFF"/>
    <circle cx="6" cy="28" r="1.5" fill="#1E293B"/>

    <!-- Open panicked mouth -->
    <ellipse cx="0" cy="38" rx="3.5" ry="5" fill="#1E293B"/>

    <!-- Frantic Arms & Hands gripping head -->
    <!-- Left arm/hand -->
    <path d="M-16 48 C-25 40 -32 25 -24 20 C-20 17 -16 22 -18 27 C-20 33 -15 40 -10 44 Z" fill="#FBBF24"/>
    <!-- Right arm/hand -->
    <path d="M16 48 C25 40 32 25 24 20 C20 17 16 22 18 27 C20 33 15 40 10 44 Z" fill="#FBBF24"/>

    <!-- Motion/Panic Sweat Droplets -->
    <path d="M-24 15 Q-28 22 -24 25 Q-20 22 -24 15 Z" fill="#38BDF8"/>
    <path d="M26 8 Q30 15 26 18 Q22 15 26 8 Z" fill="#38BDF8"/>
  </g>

  <!-- Modern UI Tag / Accent -->
  <rect x="75" y="196" width="90" height="20" rx="6" fill="#252A34"/>
  <text x="120" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FF8787" text-anchor="middle" letter-spacing="1.5">NOUN • MÁGLUÀN</text>
</svg>