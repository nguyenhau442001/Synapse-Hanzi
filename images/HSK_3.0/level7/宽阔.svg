  <!-- Car -->
  <path d="M105 180 L135 180 L130 195 L110 195 Z" fill="#E67E22"/>
  <circle cx="112" cy="195" r="5" fill="#34495E"/>
  <circle cx="128" cy="195" r="5" fill="#34495E"/>
  
  <!-- Vast open sky/horizon accent -->
  <path d="M20 120 Q120 80 220 120" stroke="#3498DB" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M40 130 Q120 90 200 130" stroke="#3498DB" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Sun/Light accent -->
