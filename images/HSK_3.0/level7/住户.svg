<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#2A3142" opacity="0.4"/>

  <!-- Conceptual illustration: "住户" (Residents / Households in an apartment building) -->
  <g transform="translate(0, 0)">
    <!-- Modern Apartment Building Structure (Representing the housing complex) -->
    <!-- Building base/frame -->
    <rect x="55" y="45" width="130" height="160" rx="6" fill="#242B38" stroke="#3A445C" stroke-width="2"/>
    
    <!-- Roof accent -->
    <path d="M 50 45 L 120 28 L 190 45 Z" fill="#3A445C"/>
    
    <!-- Apartment Windows (Grid of 3 columns x 4 rows) -->
    <!-- Row 1 -->
    <rect x="70" y="60" width="26" height="30" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>
    <rect x="107" y="60" width="26" height="30" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>
    <rect x="144" y="60" width="26" height="30" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>

    <!-- Row 2 -->
    <rect x="70" y="100" width="26" height="30" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>
    <rect x="107" y="100" width="26" height="30" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>
    <rect x="144" y="100" width="26" height="30" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>

    <!-- Row 3 -->
    <rect x="70" y="140" width="26" height="30" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>
    <!-- Highlighted Active Resident Unit (Warm light + Resident silhouette) -->
    <rect x="107" y="140" width="26" height="30" rx="3" fill="#F39C12" opacity="0.15"/>
    <rect x="107" y="140" width="26" height="30" rx="3" fill="none" stroke="#F39C12" stroke-width="2"/>
    <rect x="144" y="140" width="26" height="30" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>

    <!-- Row 4 (Ground floor / Entrance) -->
    <rect x="70" y="180" width="26" height="25" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>
    <path d="M 113 205 L 113 185 C 113 182 127 182 127 185 L 127 205 Z" fill="#3A445C"/>
    <rect x="144" y="180" width="26" height="25" rx="3" fill="#1A1D24" stroke="#3A445C" stroke-width="1.5"/>

    <!-- Warm Lit Windows indicating inhabited homes (住户) -->
    <!-- Top left window lit -->
    <rect x="73" y="63" width="20" height="24" rx="2" fill="#F39C12" opacity="0.85"/>
    <line x1="83" y1="63" x2="83" y2="87" stroke="#242B38" stroke-width="1.5"/>

    <!-- Middle right window lit -->
    <rect x="147" y="103" width="20" height="24" rx="2" fill="#F39C12" opacity="0.85"/>
    <line x1="157" y1="103" x2="157" y2="127" stroke="#242B38" stroke-width="1.5"/>

    <!-- Highlighted Resident Silhouette in the central accented window -->
    <circle cx="120" cy="150" r="5" fill="#F39C12"/>
    <path d="M 112 165 C 112 158 128 158 128 165 Z" fill="#F39C12"/>

    <!-- Focus marker / Visit indicator (referencing the context: "逐一走访了...每一家住户") -->
    <g transform="translate(120, 115)">
      <!-- Pulsing radar / targeting ring representing household visit -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#F39C12" stroke-width="1" opacity="0.3"/>
      
      <!-- Location marker pin -->
      <path d="M 0 10 C 0 10 -10 -2 -10 -9 C -10 -15 -5 -20 0 -20 C 5 -20 10 -15 10 -9 C 10 -2 0 10 0 10 Z" fill="#F39C12"/>
      <circle cx="0" cy="-9" r="3.5" fill="#1A1D24"/>
    </g>
  </g>
</svg>