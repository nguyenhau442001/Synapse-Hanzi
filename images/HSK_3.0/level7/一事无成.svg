<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Person sitting on a stool, slumped posture -->
    <path d="M60 120 C 60 100, 80 90, 100 90 C 120 90, 140 100, 140 120 L 140 160 L 60 160 Z" fill="#4A5568"/>
    <circle cx="100" cy="70" r="20" fill="#A0AEC0"/>
    <path d="M90 75 Q 100 80 110 75" stroke="#1A1D24" stroke-width="2" fill="none"/>
    
    <!-- Empty, dusty pedestal representing lack of achievement -->
    <rect x="30" y="160" width="140" height="20" fill="#2D3748"/>
    <rect x="50" y="180" width="100" height="10" fill="#1A1D24"/>
    
    <!-- Cobwebs on the pedestal to signify stagnation -->
    <path d="M50 180 L 30 160 M50 180 L 40 160 M50 180 L 35 165" stroke="#4A5568" stroke-width="1"/>
    
    <!-- Faded, drooping plant in the corner -->
    <path d="M160 180 L 160 150 M160 150 L 150 140 M160 150 L 170 140" stroke="#718096" stroke-width="2"/>
    <circle cx="150" cy="140" r="3" fill="#718096"/>
    <circle cx="170" cy="140" r="3" fill="#718096"/>
  </g>
</svg>