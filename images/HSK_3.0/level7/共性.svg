<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glowing connection network representing commonality -->
  <g opacity="0.15">
    <circle cx="70" cy="100" r="3" fill="#64B5F6"/>
    <circle cx="120" cy="80" r="3" fill="#64B5F6"/>
    <circle cx="170" cy="100" r="3" fill="#64B5F6"/>
    <line x1="70" y1="100" x2="120" y2="80" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="120" y1="80" x2="170" y2="100" stroke="#64B5F6" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Central Object: The Core Commonality (A glowing golden intersecting nexus object/prism) -->
  <g transform="translate(0, 5)">
    <!-- Outer concentric orbital rings representing universal connection -->
    <ellipse cx="120" cy="115" rx="75" ry="32" fill="none" stroke="#2A323D" stroke-width="2"/>
    <ellipse cx="120" cy="115" rx="55" ry="22" fill="none" stroke="#3A4656" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Converging abstract figures/nodes representing diverse backgrounds sharing a central point -->
    <!-- Person 1 (Left) -->
    <g transform="translate(65, 115)">
      <circle cx="0" cy="-15" r="10" fill="#EF5350"/>
      <path d="M-14 12 C-14 2, -6 0, 0 0 C6 0, 14 2, 14 12 Z" fill="#EF5350"/>
    </g>

    <!-- Person 2 (Right) -->
    <g transform="translate(175, 115)">
      <circle cx="0" cy="-15" r="10" fill="#42A5F5"/>
      <path d="M-14 12 C-14 2, -6 0, 0 0 C6 0, 14 2, 14 12 Z" fill="#42A5F5"/>
    </g>

    <!-- Person 3 (Top) -->
    <g transform="translate(120, 75)">
      <circle cx="0" cy="-12" r="9" fill="#66BB6A"/>
      <path d="M-12 10 C-12 2, -5 0, 0 0 C5 0, 12 2, 12 10 Z" fill="#66BB6A"/>
    </g>

    <!-- Connection beams leading to the absolute center -->
    <path d="M79 110 L105 105" stroke="#EF5350" stroke-width="2" opacity="0.6"/>
    <path d="M161 110 L135 105" stroke="#42A5F5" stroke-width="2" opacity="0.6"/>
    <path d="M120 88 L120 95" stroke="#66BB6A" stroke-width="2" opacity="0.6"/>

    <!-- Centerpiece: Glowing Golden Intersection (The Commonality / 共性) -->
    <g transform="translate(120, 105)">
      <!-- Outer glow -->
      <circle cx="0" cy="0" r="24" fill="#FFA726" opacity="0.2"/>
      <circle cx="0" cy="0" r="16" fill="#FFA726" opacity="0.4"/>
      <!-- Core solid emblem of shared essence -->
      <circle cx="0" cy="0" r="10" fill="#FFB74D"/>
      <path d="M-4 -2 L-1 2 L5 -4" fill="none" stroke="#1A1D24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Base platform representing objective reality / common ground -->
  <ellipse cx="120" cy="180" rx="70" ry="8" fill="#242B35"/>
  <ellipse cx="120" cy="180" rx="50" ry="5" fill="#2D3748"/>
</svg>