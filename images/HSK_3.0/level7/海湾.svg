<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Sky background -->
  <path d="M0 24C0 10.745 10.745 0 24 0H216C29.255 0 240 10.745 240 24V110H0V24Z" fill="#1e2430"/>
  
  <!-- Gentle stars/night sky dots -->
  <circle cx="40" cy="30" r="1" fill="#4a5568"/>
  <circle cx="85" cy="20" r="1.5" fill="#4a5568"/>
  <circle cx="160" cy="35" r="1" fill="#4a5568"/>
  <circle cx="205" cy="25" r="1.5" fill="#4a5568"/>

  <!-- Moon -->
  <circle cx="195" cy="55" r="14" fill="#f6ad55" opacity="0.9"/>
  <circle cx="191" cy="51" r="12" fill="#1e2430"/>

  <!-- Landmasses forming the curved bay (Haiwan / Vịnh biển) -->
  <!-- Left cliffside curve -->
  <path d="M0 90 C 40 90, 80 110, 90 140 C 95 155, 90 180, 80 210 L 0 210 Z" fill="#2d3748"/>
  <!-- Right land curve / cape -->
  <path d="M240 95 C 190 95, 160 110, 150 140 C 145 155, 150 180, 160 210 L 240 210 Z" fill="#2d3748"/>
  
  <!-- Distant horizon land -->
  <path d="M90 110 L 150 110 L 140 115 L 100 115 Z" fill="#4a5568"/>

  <!-- Calm sheltered water inside the bay -->
  <path d="M90 140 C 95 120, 110 115, 120 115 C 130 115, 145 120, 150 140 C 155 160, 140 185, 120 185 C 100 185, 85 160, 90 140 Z" fill="#2b6cb0"/>
  <!-- Outer deep water -->
  <path d="M0 110 H 240 V 240 H 0 Z" fill="#1a365d" mask="url(#bay-mask)"/>
  
  <rect x="0" y="110" width="240" height="130" fill="#234e52"/>

  <!-- Refined Water Surface & Gentle Waves in the sheltered Bay -->
  <path d="M95 135 Q 120 128 145 135" stroke="#319795" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M102 150 Q 120 144 138 150" stroke="#319795" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M110 165 Q 120 161 130 165" stroke="#319795" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Pier / Dock extending into the calm bay (orange/gold accent) -->
  <rect x="110" y="155" width="20" height="35" rx="3" fill="#dd6b20"/>
  <rect x="115" y="145" width="10" height="15" fill="#f6ad55"/>
  <line x1="110" y1="165" x2="130" y2="165" stroke="#c05621" stroke-width="2"/>
  <line x1="110" y1="175" x2="130" y2="175" stroke="#c05621" stroke-width="2"/>

  <!-- Tiny sailboat anchored in the calm waters -->
  <g transform="translate(132, 138) scale(0.7)">
    <path d="M0 10 C 2 15, 18 15, 20 10 Z" fill="#edf2f7"/>
    <line x1="10" y1="10" x2="10" y2="1" stroke="#cbd5e0" stroke-width="1.5"/>
    <polygon points="10,1 18,7 10,9" fill="#f6ad55"/>
  </g>

  <!-- Trees on cliff (left) -->
  <circle cx="30" cy="95" r="6" fill="#38a169"/>
  <circle cx="42" cy="90" r="8" fill="#2f855a"/>
  <circle cx="55" cy="98" r="7" fill="#38a169"/>

  <!-- Trees on cape (right) -->
  <circle cx="195" cy="100" r="7" fill="#38a169"/>
  <circle cx="208" cy="95" r="9" fill="#2f855a"/>
  <circle cx="220" cy="102" r="6" fill="#38a169"/>

  <!-- Focus/Framing subtle outer ring -->
  <rect x="12" y="12" width="216" height="216" rx="16" fill="none" stroke="#4a5568" stroke-width="1" opacity="0.3"/>
</svg>