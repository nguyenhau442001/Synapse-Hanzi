<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for the night sky effect -->
  <circle cx="120" cy="110" r="90" fill="#222733" opacity="0.6"/>
  
  <!-- Distant stars -->
  <circle cx="60" cy="60" r="1.5" fill="#525F7F"/>
  <circle cx="185" cy="50" r="1" fill="#525F7F"/>
  <circle cx="195" cy="130" r="1.5" fill="#525F7F"/>
  <circle cx="50" cy="160" r="1" fill="#525F7F"/>
  <circle cx="95" cy="40" r="2" fill="#E2E8F0" opacity="0.8"/>

  <!-- Comet & orbital arc (Representing the astronomical observation context) -->
  <path d="M 65 75 Q 120 100 175 145" fill="none" stroke="#313A4E" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Comet trail and head -->
  <path d="M 130 105 L 160 130" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 145 118 L 160 130" stroke="#E0F2FE" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <circle cx="163" cy="132" r="3" fill="#E0F2FE"/>
  <circle cx="163" cy="132" r="5" fill="#38BDF8" opacity="0.5"/>

  <!-- Astronomical Telescope (Physical object representing '观测' / observation) -->
  <!-- Mount / Tripod base -->
  <polygon points="120,175 105,210 135,210" fill="#475569"/>
  <line x1="120" y1="175" x2="90" y2="215" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="175" x2="150" y2="215" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Telescope Mount Joint -->
  <circle cx="120" cy="155" r="7" fill="#64748B"/>
  <rect x="117" y="152" width="6" height="23" rx="2" fill="#475569"/>

  <!-- Telescope Main Body (Angled toward the comet) -->
  <g transform="rotate(-38 120 135)">
    <!-- Main Tube -->
    <rect x="85" y="115" width="70" height="24" rx="4" fill="#E2E8F0"/>
    <rect x="90" y="117" width="45" height="20" fill="#CBD5E1"/>
    
    <!-- Focusing Eyepiece / Back piece -->
    <rect x="75" y="121" width="10" height="12" rx="2" fill="#475569"/>
    <rect x="70" y="123" width="5" height="8" rx="1" fill="#F59E0B"/>

    <!-- Dew Shield / Front Lens Barrel -->
    <rect x="145" y="112" width="16" height="30" rx="3" fill="#334155"/>
    
    <!-- Lens Glow / Objective Glass -->
    <ellipse cx="161" cy="127" rx="2" ry="15" fill="#38BDF8" opacity="0.8"/>
    <ellipse cx="161" cy="127" rx="1" ry="10" fill="#E0F2FE"/>
  </g>

  <!-- Focus / Target Sight Indicator (Gold accent highlighting precision measurement) -->
  <circle cx="163" cy="132" r="16" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
  <line x1="163" y1="110" x2="163" y2="116" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="163" y1="148" x2="163" y2="154" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="141" y1="132" x2="147" y2="132" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="179" y1="132" x2="185" y2="132" stroke="#F59E0B" stroke-width="1.5"/>

</svg>