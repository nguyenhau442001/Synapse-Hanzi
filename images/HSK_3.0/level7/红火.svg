<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Floor / Tabletop base -->
    <path d="M 40,195 L 200,195" stroke="#2D323E" stroke-width="4" stroke-linecap="round"/>

    <!-- Traditional Wok/Cauldron representing a thriving restaurant/business (生意红火) -->
    <!-- Wok Handle Left -->
    <path d="M 55,145 C 45,135 45,120 55,120 C 65,120 65,135 65,145" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <!-- Wok Handle Right -->
    <path d="M 185,145 C 195,135 195,120 185,120 C 175,120 175,135 175,145" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>

    <!-- Wok Body (Outer) -->
    <path d="M 60,140 C 60,185 180,185 180,140 Z" fill="#334155"/>
    <!-- Wok Rim -->
    <ellipse cx="120" cy="140" rx="62" ry="12" fill="#475569"/>
    <!-- Wok Inner -->
    <ellipse cx="120" cy="143" rx="56" ry="9" fill="#1E293B"/>

    <!-- Vibrant Flames (Thriving, prosperous energy) -->
    <!-- Outer Orange Flames -->
    <path d="M 90,140 C 80,110 95,80 120,65 C 145,80 160,110 150,140 Z" fill="#F97316" opacity="0.85"/>
    
    <!-- Inner Golden/Yellow Flames (Bright, Prosperous) -->
    <path d="M 105,140 C 100,115 110,95 120,80 C 130,95 140,115 135,140 Z" fill="#FBBF24"/>

    <!-- Rising Prosperity Sparks / Coins symbolizing wealth and booming business -->
    <!-- Spark 1 -->
    <circle cx="120" cy="48" r="4" fill="#FBBF24"/>
    <path d="M 120,40 L 120,44" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Spark 2 (Left) -->
    <circle cx="92" cy="62" r="3" fill="#FBBF24"/>
    <path d="M 87,57 L 90,60" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- Spark 3 (Right) -->
    <circle cx="148" cy="62" r="3" fill="#FBBF24"/>
    <path d="M 153,57 L 150,60" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- Rising Steam / Aroma wisps for delicious restaurant food -->
    <path d="M 105,75 C 100,65 110,55 105,45" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 135,75 C 140,65 130,55 135,45" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>