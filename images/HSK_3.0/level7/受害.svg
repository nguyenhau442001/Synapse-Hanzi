<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Rain/Storm Effect -->
  <g stroke="#5D6D7E" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="20" x2="30" y2="60"/>
    <line x1="80" y1="10" x2="70" y2="50"/>
    <line x1="120" y1="30" x2="110" y2="70"/>
    <line x1="160" y1="15" x2="150" y2="55"/>
    <line x1="200" y1="25" x2="190" y2="65"/>
  </g>

  <!-- Damaged Crop/Field -->
  <path d="M40 180 L200 180 L180 210 L60 210 Z" fill="#3E2723"/>
  
  <!-- Bent/Wilting Plant -->
  <path d="M120 180 Q120 140 100 130" stroke="#FF9800" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M100 130 Q90 120 85 135" stroke="#FF9800" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Human Character (Agricultural Technician) -->
  <g transform="translate(160, 120)">
    <!-- Body -->
    <path d="M0 0 L20 0 L15 60 L-5 60 Z" fill="#F44336"/>
    <!-- Head -->
    <circle cx="7" cy="-20" r="15" fill="#FFCC80"/>
    <!-- Arm reaching to help -->
    <path d="M15 10 L40 40" stroke="#FFCC80" stroke-width="8" stroke-linecap="round"/>
    <!-- Leg -->
    <path d="M5 60 L5 90" stroke="#F44336" stroke-width="10" stroke-linecap="round"/>
    <path d="M15 60 L15 90" stroke="#F44336" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Water/Flood lines -->
  <path d="M30 190 Q120 220 210 190" stroke="#2196F3" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M20 200 Q110 230 200 200" stroke="#2196F3" stroke-width="4" fill="none" opacity="0.4"/>
</svg>