<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient background cold atmosphere elements -->
  <g opacity="0.3" stroke="#4A90E2" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="50" x2="45" y2="65" />
    <line x1="210" y1="70" x2="195" y2="85" />
    <line x1="50" y1="180" x2="35" y2="195" />
    <line x1="190" y1="170" x2="205" y2="185" />
  </g>

  <!-- Ice crystals separating the two figures -->
  <g fill="none" stroke="#7DF9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M120 40 L120 200" stroke-dasharray="4 6" stroke-width="1"/>
    <polygon points="120,60 126,70 120,80 114,70" fill="#7DF9FF" opacity="0.4"/>
    <polygon points="120,110 128,122 120,134 112,122" fill="#7DF9FF" opacity="0.4"/>
    <polygon points="120,160 126,170 120,180 114,170" fill="#7DF9FF" opacity="0.4"/>
  </g>

  <!-- Left Character (Man facing right, turned away/silent) -->
  <g transform="translate(15, 0)">
    <!-- Body & Shoulders -->
    <path d="M 35 185 C 35 155, 65 145, 85 145 C 105 145, 135 155, 135 185 Z" fill="#2C3E50"/>
    <!-- Head -->
    <circle cx="85" cy="105" r="22" fill="#E0E6ED"/>
    <!-- Hair -->
    <path d="M 65 102 C 65 85, 95 85, 105 102 Z" fill="#34495E"/>
    <!-- Back of head/facing away indicator (Simple flat avatar style) -->
    <path d="M 75 98 C 80 96, 90 96, 95 98" stroke="#2C3E50" stroke-width="2" fill="none"/>
    <!-- Folded arms posture to show stubbornness/silence -->
    <path d="M 60 160 L 110 160 L 100 185 L 70 185 Z" fill="#34495E"/>
    <!-- Frost/Cold aura on left side -->
    <path d="M 40 90 Q 50 120, 40 150" fill="none" stroke="#7DF9FF" stroke-width="2" stroke-dasharray="2 4" opacity="0.5"/>
  </g>

  <!-- Right Character (Woman facing left, turned away/silent) -->
  <g transform="translate(75, 0)">
    <!-- Body & Shoulders -->
    <path d="M 35 185 C 35 155, 65 145, 85 145 C 105 145, 135 155, 135 185 Z" fill="#34495E"/>
    <!-- Head -->
    <circle cx="85" cy="105" r="22" fill="#E0E6ED"/>
    <!-- Hair (Ponytail/Longer silhouette) -->
    <path d="M 65 102 C 65 85, 105 85, 105 110 C 105 120, 115 125, 115 125 C 115 125, 105 100, 95 95 Z" fill="#E67E22"/>
    <!-- Folded arms posture -->
    <path d="M 60 160 L 110 160 L 100 185 L 70 185 Z" fill="#2C3E50"/>
    <!-- Frost/Cold aura on right side -->
    <path d="M 110 90 Q 100 120, 110 150" fill="none" stroke="#7DF9FF" stroke-width="2" stroke-dasharray="2 4" opacity="0.5"/>
  </g>

  <!-- Central Gap / Conceptual Ice barrier element -->
  <g transform="translate(120, 105)">
    <!-- Floating icicles / cold symbols -->
    <path d="M -5 -30 L 0 -45 L 5 -30 Z" fill="#7DF9FF" opacity="0.8"/>
    <path d="M -15 0 L -10 -20 L -5 0 Z" fill="#7DF9FF" opacity="0.6"/>
    <path d="M 5 10 L 10 -5 L 15 10 Z" fill="#7DF9FF" opacity="0.6"/>
    
    <!-- Silence / Distance indicator (arrows pointing away) -->
    <path d="M -25 35 L -45 35 M -35 25 L -45 35 L -35 45" stroke="#E74C3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 25 35 L 45 35 M 35 25 L 45 35 L 35 45" stroke="#E74C3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Accent focal points (orange/gold for professional contrast) -->
  <circle cx="120" cy="140" r="4" fill="#F1C40F"/>
  <circle cx="120" cy="105" r="3" fill="#E67E22"/>
</svg>