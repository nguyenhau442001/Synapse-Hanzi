<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Swimming pool lanes background context -->
  <g opacity="0.3">
    <line x1="30" y1="60" x2="210" y2="60" stroke="#2D3748" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke="#2D3748" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="30" y1="180" x2="210" y2="180" stroke="#2D3748" stroke-width="2" stroke-dasharray="6,6"/>
  </g>

  <!-- Water splash effect center -->
  <g transform="translate(120, 120)">
    <path d="M-15,-10 C-5,-25 5,-25 15,-10 C25,-5 25,5 15,15 C5,20 -5,20 -15,15 C-25,5 -25,-5 -15,-10 Z" fill="#3182CE" opacity="0.4"/>
  </g>

  <!-- Swimmer 1 (Left - Cyan/Blue theme) -->
  <g transform="translate(65, 120)">
    <!-- Motion wake -->
    <path d="M-45,0 L-10,-15 L-45,-30" fill="none" stroke="#4FD1C5" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <path d="M-40,15 L-10,5 L-40,-5" fill="none" stroke="#4FD1C5" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    
    <!-- Body / Head / Arm -->
    <circle cx="-5" cy="-8" r="7" fill="#E2E8F0"/> <!-- Head -->
    <path d="M-15,0 L15,-12 L25,-2" fill="#319795" stroke="#4FD1C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Torso & Reaching arm -->
    <path d="M-10,2 L-25,12" fill="none" stroke="#319795" stroke-width="4" stroke-linecap="round"/> <!-- Underwater arm -->
    <path d="M10,2 L25,15" fill="none" stroke="#319795" stroke-width="3" stroke-linecap="round"/> <!-- Legs -->
    
    <!-- Swim cap and goggles -->
    <path d="M-10,-12 C-5,-15 2,-12 0,-7 Z" fill="#ED8936"/>
    <line x1="-7" y1="-8" x2="-2" y2="-8" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Swimmer 2 (Right - Orange/Gold focus theme, neck-and-neck race) -->
  <g transform="translate(175, 120) scale(-1, 1)">
    <!-- Motion wake -->
    <path d="M-45,0 L-10,-15 L-45,-30" fill="none" stroke="#F6AD55" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <path d="M-40,15 L-10,5 L-40,-5" fill="none" stroke="#F6AD55" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    
    <!-- Body / Head / Arm -->
    <circle cx="-5" cy="-8" r="7" fill="#E2E8F0"/> <!-- Head -->
    <path d="M-15,0 L15,-12 L25,-2" fill="#DD6B20" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Torso & Reaching arm -->
    <path d="M-10,2 L-25,12" fill="none" stroke="#DD6B20" stroke-width="4" stroke-linecap="round"/> <!-- Underwater arm -->
    <path d="M10,2 L25,15" fill="none" stroke="#DD6B20" stroke-width="3" stroke-linecap="round"/> <!-- Legs -->
    
    <!-- Swim cap and goggles -->
    <path d="M-10,-12 C-5,-15 2,-12 0,-7 Z" fill="#3182CE"/>
    <line x1="-7" y1="-8" x2="-2" y2="-8" stroke="#1A1D24" stroke-width="2"/>
  </g>

  <!-- Intensity / Competition focal sparks (Highlighting "较量" / head-to-head clash) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ED8936" stroke-width="2" stroke-dasharray="4,8" opacity="0.8"/>
    <path d="M-3,-8 L3,-2 L-2,4 L4,10" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>