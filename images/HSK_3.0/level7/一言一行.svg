<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background ambient glow representing positive influence and guidance -->
  <circle cx="120" cy="115" r="75" fill="#2D323E" opacity="0.6"/>
  <circle cx="120" cy="115" r="50" fill="#3D4556" opacity="0.4"/>

  <!-- Parent silhouette / upper figure (representing words and actions) -->
  <!-- Body/Shoulders -->
  <path d="M 80 185 C 80 155, 100 145, 120 145 C 140 145, 160 155, 160 185" fill="#5A657D" opacity="0.4"/>
  <!-- Head -->
  <circle cx="120" cy="115" r="24" fill="#5A657D" opacity="0.5"/>

  <!-- Child silhouette / lower figure (receiving the influence) -->
  <!-- Body/Shoulders -->
  <path d="M 95 210 C 95 190, 105 185, 120 185 C 135 185, 145 190, 145 210" fill="#424A5C" opacity="0.3"/>
  <!-- Head -->
  <circle cx="120" cy="170" r="16" fill="#424A5C" opacity="0.4"/>

  <!-- Focal Elements: "一言" (Words/Speech) & "一行" (Actions/Gestures) -->
  
  <!-- Left Side: Speech bubble representing "言" (Words/Speech) -->
  <g transform="translate(48, 65)">
    <!-- Bubble background -->
    <path d="M 0 16 C 0 8, 8 0, 24 0 L 48 0 C 64 0, 72 8, 72 16 L 72 32 C 72 40, 64 48, 48 48 L 28 48 L 12 60 L 16 45 C 6 42, 0 36, 0 32 Z" fill="#242B38" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- Sound wave / speech lines inside bubble -->
    <line x1="16" y1="24" x2="56" y2="24" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="15" x2="50" y2="15" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="22" y1="33" x2="50" y2="33" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Right Side: Hand gesture / guiding palm representing "行" (Actions/Conduct) -->
  <g transform="translate(132, 53)">
    <!-- Outer badge/container for action -->
    <circle cx="30" cy="30" r="28" fill="#242B38" stroke="#3B82F6" stroke-width="2.5"/>
    <!-- Guiding open hand icon (clean, professional vector) -->
    <path d="M 20 42 C 18 42, 16 40, 16 37 L 16 26 C 16 24, 18 22, 20 22 C 22 22, 24 24, 24 26 L 24 33 L 26 33 L 26 20 C 26 18, 28 16, 30 16 C 32 16, 34 18, 34 20 L 34 33 L 36 33 L 36 22 C 36 20, 38 18, 40 18 C 42 18, 44 20, 44 22 L 44 34 C 44 40, 38 44, 30 44 C 26 44, 22 43, 20 42 Z" fill="#3B82F6"/>
    <!-- Action trail / direction indicator -->
    <path d="M 30 10 L 30 6 M 24 12 L 21 8 M 36 12 L 39 8" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Central connecting glowing pathway representing the direct impact ("言" & "行" shaping character) -->
  <path d="M 85 92 Q 120 110 120 145" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M 155 92 Q 120 110 120 145" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- Emphasized focal point sparkle -->
  <path d="M 120 135 L 123 143 L 131 146 L 123 149 L 120 157 L 117 149 L 109 146 L 117 143 Z" fill="#F59E0B"/>
</svg>