<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Glowing ambient light from the blocked path -->
  <radialGradient id="deadendGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#E54B4B" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#1A1D24" stop-opacity="0"/>
  </radialGradient>
  <rect width="240" height="240" fill="url(#deadendGlow)"/>

  <!-- Maze / Dead-end structural walls -->
  <g fill="#2A2F3D" stroke="#3A4154" stroke-width="2">
    <!-- Left wall -->
    <rect x="20" y="40" width="70" height="130" rx="6"/>
    <!-- Right wall -->
    <rect x="150" y="40" width="70" height="130" rx="6"/>
    <!-- Back blocking wall (The dead end) -->
    <rect x="90" y="40" width="60" height="40" rx="4"/>
  </g>

  <!-- Hazard / Dead-end Indicator (Bright Orange/Red Accent) -->
  <g transform="translate(120, 60)">
    <circle cx="0" cy="0" r="12" fill="#E54B4B" opacity="0.2"/>
    <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#E54B4B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floor perspective lines -->
  <path d="M90 170 L70 210 M150 170 L170 210" stroke="#3A4154" stroke-width="2" stroke-linecap="round"/>

  <!-- Character facing the dead end (Confused / Trapped posture) -->
  <g transform="translate(120, 150)">
    <!-- Shadow -->
    <ellipse cx="0" cy="40" rx="14" ry="5" fill="#111317"/>
    
    <!-- Body / Torso -->
    <path d="M-8 10 L8 10 L10 32 L-10 32 Z" fill="#3B82F6"/>
    
    <!-- Head -->
    <circle cx="0" cy="-2" r="9" fill="#FBBF24"/>
    
    <!-- Hands raised in despair/surrender -->
    <circle cx="-14" cy="12" r="4" fill="#FBBF24"/>
    <path d="M-8 12 L-14 12" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="14" cy="12" r="4" fill="#FBBF24"/>
    <path d="M8 12 L14 12" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>

    <!-- Legs -->
    <path d="M-5 32 L-6 42 M5 32 L6 42" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Subtle barrier glow at the top indicating no way forward -->
  <line x1="90" y1="40" x2="150" y2="40" stroke="#E54B4B" stroke-width="3" stroke-linecap="round"/>
</svg>