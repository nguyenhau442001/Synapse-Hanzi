<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Flower 1: Tall and slender -->
  <path d="M60 180 L60 120" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 120 C 50 100, 70 100, 60 80 C 50 100, 30 100, 60 120" fill="#FFD700"/>
  
  <!-- Flower 2: Wide and blooming -->
  <path d="M120 180 L120 130" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="130" r="15" fill="#FF6B6B"/>
  <circle cx="120" cy="115" r="8" fill="#FFD700"/>
  <circle cx="135" cy="130" r="8" fill="#FFD700"/>
  <circle cx="105" cy="130" r="8" fill="#FFD700"/>
  <circle cx="120" cy="145" r="8" fill="#FFD700"/>
  
  <!-- Flower 3: Curvy and drooping -->
  <path d="M180 180 C 180 150, 200 150, 200 120" stroke="#4A90E2" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M200 120 C 190 110, 210 110, 200 100 C 190 110, 210 110, 200 120" fill="#A8E063"/>
  
  <!-- Flower 4: Small and clustered -->
  <path d="M90 180 L90 150" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="90" cy="145" r="5" fill="#FF8C00"/>
  <circle cx="82" cy="152" r="5" fill="#FF8C00"/>
  <circle cx="98" cy="152" r="5" fill="#FF8C00"/>
  
  <!-- Flower 5: Spiral/Exotic -->
  <path d="M150 180 L150 140" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 140 C 165 140, 165 125, 150 125 C 135 125, 135 110, 150 110" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>