<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(60, 45)">
    <!-- Medicine Bottle / Prescription Drug context -->
    <rect x="22" y="25" width="76" height="95" rx="10" fill="#2E384D"/>
    <rect x="34" y="10" width="52" height="20" rx="4" fill="#64748B"/>
    <path d="M 37 55 L 83 55 L 83 95 L 37 95 Z" fill="#F8FAFC"/>
