<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(40, 30)">
    <!-- Scale Base / Stand -->
    <path d="M 80 145 L 100 145 L 105 160 L 75 160 Z" fill="#4A5568"/>
    <rect x="65" y="157" width="50" height="8" rx="4" fill="#718096"/>
    <rect x="78" y="70" width="4" height="80" fill="#CBD5E0"/>
    
    <!-- Scale Top Finial -->
    <circle cx="80" cy="68" r="8" fill="#F6E05E"/>

    <!-- Central Beam -->
    <path d="M 25 75 L 135 75 L 130 83 L 30 83 Z" fill="#E2E8F0"/>
    <circle cx="80" cy="79" r="5" fill="#DD6B20"/>

    <!-- Left Cord & Pan (Represents Practice/Evidence) -->
    <path d="M 30 80 L 15 125" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 30 80 L 45 125" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 15 125 C 15 133, 45 133, 45 125 Z" fill="#CBD5E0"/>
    <ellipse cx="30" cy="125" rx="16" ry="5" fill="#A0AEC0"/>
    
    <!-- Practical Element on Left Pan (Gear/Tool representing 实践) -->
    <circle cx="30" cy="120" r="8" fill="#4FD1C5"/>
    <circle cx="30" cy="120" r="3" fill="#1A1D24"/>

    <!-- Right Cord & Pan (Represents Truth / Core Object) -->
    <path d="M 130 80 L 115 110" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 130 80 L 145 110" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 115 110 C 115 116, 145 116, 145 110 Z" fill="#CBD5E0"/>
    <ellipse cx="130" cy="110" rx="16" ry="5" fill="#A0AEC0"/>

    <!-- Glowing Core / Truth Object (真理) on Right Pan -->
    <polygon points="130,85 139,102 121,102" fill="#F6AD55"/>
    <polygon points="130,111 121,98 139,98" fill="#ED8936"/>
    <circle cx="130" cy="100" r="6" fill="#FFEE52"/>
    
    <!-- Radiance / Truth Illumination -->
    <path d="M 80 40 L 80 50" stroke="#F6E05E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 55 48 L 62 55" stroke="#F6E05E" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 105 48 L 98 55" stroke="#F6E05E" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>