<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Elder (Receiver) -->
  <g transform="translate(140, 100)">
    <circle cx="0" cy="0" r="20" fill="#F4A261"/>
    <path d="M-15 20 Q0 40 15 20" stroke="#F4A261" stroke-width="4" fill="none"/>
    <rect x="-25" y="25" width="50" height="80" rx="10" fill="#3D4A5D"/>
  </g>

  <!-- Younger (Giver) -->
  <g transform="translate(80, 100)">
    <circle cx="0" cy="0" r="20" fill="#E9C46A"/>
    <path d="M-15 20 Q0 40 15 20" stroke="#E9C46A" stroke-width="4" fill="none"/>
    <rect x="-25" y="25" width="50" height="80" rx="10" fill="#2A3547"/>
    
    <!-- Bowing posture adjustment -->
    <g transform="rotate(-15, 0, 25)">
      <rect x="-25" y="25" width="50" height="80" rx="10" fill="#2A3547"/>
    </g>
  </g>

  <!-- Hands offering tea -->
  <g transform="translate(110, 130)">
    <rect x="-20" y="-5" width="40" height="10" rx="2" fill="#D6A04D"/>
    <circle cx="0" cy="-15" r="12" fill="#8B5E3C"/>
    <circle cx="0" cy="-15" r="8" fill="#A67C52"/>
    <path d="M-15 0 L-25 10 M15 0 L25 10" stroke="#E9C46A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Motion lines for respect -->
  <path d="M100 80 Q110 70 120 80" stroke="#F4A261" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M105 75 Q115 65 125 75" stroke="#F4A261" stroke-width="2" fill="none" opacity="0.4"/>
</svg>