<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background cliff contour -->
  <path d="M 0,240 L 0,80 L 45,95 L 90,75 L 140,100 L 190,85 L 240,110 L 240,240 Z" fill="#222730" opacity="0.6"/>

  <!-- Cliff Face (Dark slate) -->
  <path d="M 120,30 L 195,50 L 210,210 L 30,210 L 45,60 Z" fill="#2A303C"/>
  <path d="M 120,30 L 195,50 L 210,210 L 170,210 L 135,100 Z" fill="#242933"/>

  <!-- Rock texture lines -->
  <path d="M 60,80 L 85,90 M 75,130 L 100,120 M 50,170 L 80,165 M 150,70 L 175,85 M 185,130 L 160,150 M 190,180 L 205,170" stroke="#1E222B" stroke-width="2" stroke-linecap="round"/>

  <!-- Cutout Road / Tunnel into the cliff (Representing 凿 - carving/chiseling out) -->
  <path d="M 45,155 Q 90,145 135,160 L 140,185 Q 90,175 45,185 Z" fill="#15171C"/>
  <path d="M 45,155 L 45,185 Q 90,175 135,185 L 135,160 Q 90,145 45,155 Z" fill="#384152" opacity="0.4"/>
  <!-- Road surface -->
  <path d="M 45,170 Q 90,160 135,172 L 135,185 Q 90,175 45,185 Z" fill="#4E596D"/>

  <!-- Sparks / Chisel effect (Focus point) -->
  <circle cx="137" cy="165" r="4" fill="#FFA500"/>
  <path d="M 137,150 L 139,160 M 148,162 L 139,165 M 145,173 L 138,167 M 125,160 L 133,163" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <circle cx="149" cy="158" r="1.5" fill="#FFD700"/>
  <circle cx="123" cy="172" r="1.5" fill="#FFA500"/>

  <!-- The Chisel Tool (凿) - Iconic Object Centered & Angled -->
  <g transform="translate(110, 85) rotate(-35)">
    <!-- Chisel Handle (Modern flat design, ergonomic grip) -->
    <rect x="-6" y="25" width="12" height="50" rx="3" fill="#D97706"/>
    <rect x="-4" y="30" width="8" height="40" rx="2" fill="#F59E0B"/>
    <line x1="-4" y1="40" x2="4" y2="40" stroke="#B45309" stroke-width="2"/>
    <line x1="-4" y1="50" x2="4" y2="50" stroke="#B45309" stroke-width="2"/>
    <line x1="-4" y1="60" x2="4" y2="60" stroke="#B45309" stroke-width="2"/>

    <!-- Handle End Cap / Strike Surface -->
    <rect x="-8" y="75" width="16" height="6" rx="2" fill="#4B5563"/>

    <!-- Metal Ferrule / Collar -->
    <rect x="-7" y="18" width="14" height="8" rx="1" fill="#9CA3AF"/>
    <rect x="-5" y="20" width="10" height="4" fill="#D1D5DB"/>

    <!-- Steel Blade Shaft -->
    <path d="M -5,18 L -5,-10 L 5,-10 L 5,18 Z" fill="#9CA3AF"/>
    <path d="M 0,18 L 0,-10" stroke="#6B7280" stroke-width="1.5"/>

    <!-- Sharp Chiseling Tip -->
    <path d="M -5,-10 L 5,-10 L 0,-28 Z" fill="#E5E7EB"/>
    <path d="M 0,-10 L 0,-28" stroke="#9CA3AF" stroke-width="1"/>
  </g>

  <!-- Impact motion lines -->
  <path d="M 152,145 L 140,158" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 160,152 L 148,165" stroke="#FFA500" stroke-width="2" stroke-linecap="round"/>
</svg>