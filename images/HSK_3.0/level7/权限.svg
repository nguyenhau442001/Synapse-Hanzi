<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="115" r="70" fill="#00D2FF" opacity="0.05"/>

  <!-- Server / Core Database Rack (Physical Object representing the secure data location) -->
  <g transform="translate(68, 55)">
    <!-- Main Server Body -->
    <rect x="0" y="0" width="104" height="120" rx="8" fill="#282E3D" stroke="#3A445D" stroke-width="2"/>
    
    <!-- Top Unit Slot -->
    <rect x="12" y="16" width="80" height="26" rx="4" fill="#1F2430" stroke="#3A445D" stroke-width="1.5"/>
    <circle cx="26" cy="29" r="3.5" fill="#00E676"/>
    <rect x="38" y="27" width="36" height="4" rx="2" fill="#3A445D"/>

    <!-- Middle Unit Slot -->
    <rect x="12" y="54" width="80" height="26" rx="4" fill="#1F2430" stroke="#3A445D" stroke-width="1.5"/>
    <circle cx="26" cy="67" r="3.5" fill="#00E676"/>
    <rect x="38" y="65" width="36" height="4" rx="2" fill="#3A445D"/>

    <!-- Bottom Unit Slot (Core Database) -->
