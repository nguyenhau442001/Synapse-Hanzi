<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient glow behind the cinema screen -->
  <ellipse cx="120" cy="115" rx="85" ry="50" fill="#2A3448" opacity="0.4"/>

  <!-- Projector light beam -->
  <polygon points="120,40 200,200 40,200" fill="url(#lightBeam)" opacity="0.15"/>
  <defs>
    <linearGradient id="lightBeam" x1="120" y1="40" x2="120" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cinema Screen Frame -->
  <rect x="35" y="65" width="170" height="100" rx="4" fill="#0E1013" stroke="#3A4454" stroke-width="3"/>

  <!-- Silver Screen Surface (Màn bạc) -->
  <rect x="41" y="71" width="158" height="88" rx="2" fill="#E2E8F0"/>
  <!-- Subtle gradient on screen for silver sheen -->
  <rect x="41" y="71" width="158" height="88" rx="2" fill="url(#screenSheen)" opacity="0.3"/>
  <defs>
    <linearGradient id="screenSheen" x1="41" y1="71" x2="199" y2="159" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Dynamic Projected Hero Silhouette on Screen (representing 塑造了无数经典的英雄形象) -->
  <g transform="translate(100, 85)">
    <!-- Cape / Action silhouette -->
    <path d="M 15 35 L 35 60 L 25 65 L 5 45 Z" fill="#FF8C00"/>
    <!-- Hero Body -->
    <path d="M 20 20 L 25 35 L 23 60 L 17 60 L 15 35 Z" fill="#1E293B"/>
    <!-- Hero Head & Heroic Pose (Raising arm) -->
    <circle cx="20" cy="12" r="5" fill="#1E293B"/>
    <path d="M 20 23 L 32 15 L 30 12 L 19 20 Z" fill="#1E293B"/>
  </g>

  <!-- Subtle Film Projection Lines (Cinematic effect) -->
  <line x1="55" y1="90" x2="65" y2="90" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="55" y1="100" x2="80" y2="100" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="165" y1="130" x2="185" y2="130" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="175" y1="140" x2="185" y2="140" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Screen Base/Stand -->
  <rect x="110" y="165" width="20" height="15" fill="#2A3448"/>
  <path d="M 90 180 L 150 180 L 155" stroke="#3A4454" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="120" cy="180" rx="35" ry="4" fill="#3A4454"/>

  <!-- Glowing Accent Projector Dot at Top -->
  <circle cx="120" cy="40" r="3" fill="#FFB800"/>
</svg>