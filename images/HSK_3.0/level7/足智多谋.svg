<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient background glow representing deep strategy and wisdom -->
  <circle cx="120" cy="115" r="75" fill="#242B38" opacity="0.8"/>
  
  <!-- Floating strategy planning elements in the background (glowing chess/map motifs) -->
  <path d="M70,80 L90,65 L110,80" fill="none" stroke="#3A4659" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M130,80 L150,65 L170,80" fill="none" stroke="#3A4659" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  
  <!-- Zhuge Liang character representing "足智多谋" (The mastermind / strategist) -->
  <g transform="translate(0, 10)">
    <!-- Robe / Shoulders -->
    <path d="M75,175 C75,145 95,130 120,130 C145,130 165,145 165,175 L180,185 L60,185 Z" fill="#2D3B51"/>
    <!-- Inner collar -->
    <path d="M100,130 L120,150 L140,130" fill="none" stroke="#F0A500" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="111" y="116" width="18" height="20" rx="4" fill="#E8C5A0"/>

    <!-- Head / Face -->
    <circle cx="120" cy="100" r="26" fill="#E8C5A0"/>
    
    <!-- Hair / Traditional Scholar Hat (Zhuge Liang style - Zhuge Jin) -->
    <path d="M94,96 C94,80 105,74 120,74 C135,74 146,80 146,96 Z" fill="#111418"/>
    <!-- Crown / Tall Taoist hat piece -->
    <path d="M108,74 L108,45 C108,42 112,40 120,40 C128,40 132,42 132,45 L132,74 Z" fill="#111418"/>
    <path d="M112,40 L128,40 L126,74 L114,74 Z" fill="#1F2633"/>
    <circle cx="120" cy="48" r="4" fill="#F0A500"/>

    <!-- Facial expression: Wise, calm eyes & subtle knowing smile -->
    <!-- Eyes -->
    <path d="M107,98 C110,96 113,96 116,98" stroke="#1F2633" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M124,98 C127,96 130,96 133,98" stroke="#1F2633" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Gentle wise smile -->
    <path d="M115,108 C118,111 122,111 125,108" stroke="#1F2633" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Traditional wispy strategist beard -->
    <path d="M112,114 C115,124 125,124 128,114 C126,120 114,120 112,114 Z" fill="#D1D5DB"/>
  </g>

  <!-- Iconic Strategist Feather Fan (羽扇 - Yǔshàn) held in hand, symbolizing infinite plans and tactics -->
  <g transform="translate(145, 125) rotate(-15)">
    <!-- Fan Handle -->
    <rect x="-3" y="10" width="6" height="25" rx="3" fill="#D1D5DB"/>
    <!-- Fan Feathers (Golden / White layered stylized plumes) -->
    <path d="M0,10 C-25,0 -30,-30 0,-50 C30,-30 25,0 0,10 Z" fill="#F0A500" opacity="0.9"/>
    <path d="M0,5 C-18,-5 -22,-25 0,-40 C22,-25 18,-5 0,5 Z" fill="#FFC738"/>
    <!-- Subtle feather details -->
    <path d="M0,-40 L0,5" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,-30 L-12,-15" stroke="#D97706" stroke-width="1" stroke-linecap="round"/>
    <path d="M0,-30 L12,-15" stroke="#D97706" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Glowing tactical grid / floating strategic constellation nodes (representing "多谋" - numerous brilliant plans) -->
  <g fill="#F0A500">
    <circle cx="55" cy="95" r="4" opacity="0.9"/>
    <circle cx="45" cy="135" r="3" opacity="0.6"/>
    <circle cx="75" cy="55" r="3.5" opacity="0.7"/>
    <circle cx="185" cy="85" r="4.5" opacity="0.9"/>
    <circle cx="195" cy="125" r="3" opacity="0.5"/>
    <circle cx="165" cy="50" r="3.5" opacity="0.8"/>
  </g>
  
  <!-- Connecting strategy lines -->
  <path d="M55,95 L75,55 L165,50 L185,85" fill="none" stroke="#F0A500" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
  <path d="M55,95 L45,135" fill="none" stroke="#F0A500" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3"/>
  <path d="M185,85 L195,125" fill="none" stroke="#F0A500" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3"/>
  
  <!-- Subtle floor shadow under character -->
  <ellipse cx="120" cy="195" rx="45" ry="6" fill="#111418" opacity="0.6"/>
</svg>