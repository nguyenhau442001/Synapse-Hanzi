<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Character representing indignation/anger -->
    <path d="M60 20 C 40 20, 30 30, 30 50 L 30 100 C 30 110, 40 120, 60 120 L 60 120" fill="#FF9F1C" stroke="#FF9F1C" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 20 C 80 20, 90 30, 90 50 L 90 100 C 90 110, 80 120, 60 120" fill="#FF9F1C" stroke="#FF9F1C" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Furrowed brows -->
    <path d="M40 45 L 55 55 M 80 45 L 65 55" stroke="#1A1D24" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Angry eyes -->
    <circle cx="50" cy="65" r="5" fill="#1A1D24"/>
    <circle cx="70" cy="65" r="5" fill="#1A1D24"/>
    
    <!-- Clenched mouth -->
    <path d="M45 90 L 75 90" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Clenched fist -->
    <circle cx="100" cy="100" r="15" fill="#FF9F1C"/>
    <path d="M90 90 L 110 110 M 110 90 L 90 110" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>