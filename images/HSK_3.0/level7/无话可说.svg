<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 10)">
    <!-- Table Desk -->
    <path d="M50 160 L190 160 L200 190 L40 190 Z" fill="#2D333D"/>
    <rect x="55" y="190" width="14" height="25" fill="#1E232B" rx="3"/>
    <rect x="171" y="190" width="14" height="25" fill="#1E232B" rx="3"/>
    
    <!-- Evidence / Files on Desk -->
    <rect x="75" y="148" width="50" height="15" fill="#4B5563" rx="2" transform="rotate(-5 75 148)"/>
    <rect x="110" y="145" width="55" height="18" fill="#E5E7EB" rx="2" transform="rotate(8 110 145)"/>
    <rect x="120" y="150" width="35" height="2" fill="#EF4444"/>
    <rect x="120" y="155" width="25" height="2" fill="#9CA3AF"/>

    <!-- Person (Head down, defeated/speechless posture) -->
    <!-- Shoulders and Body -->
    <path d="M85 160 C90 135 110 120 120 120 C130 120 150 135 155 160 Z" fill="#3B82F6"/>
    
    <!-- Head (bowed low over the desk) -->
    <circle cx="120" cy="112" r="22" fill="#FCA5A5"/>
    
    <!-- Hair -->
    <path d="M98 108 C100 95 110 90 122 90 C134 90 142 98 144 112 C135 106 108 106 98 108 Z" fill="#1F2937"/>

    <!-- Slumped Arms on Desk -->
    <path d="M90 150 C105 145 115 145 130 150 L125 162 C115 156 105 156 95 162 Z" fill="#3B82F6"/>
    <circle cx="92" cy="155" r="7" fill="#FCA5A5"/>
    <circle cx="128" cy="155" r="7" fill="#FCA5A5"/>

    <!-- Speechless / Silence Symbol (Subtle, sleek modern floating element replacing words) -->
    <g transform="translate(120, 50)" opacity="0.9">
      <!-- Mute / Silent Chat Bubble -->
      <path d="M-22 -18 C-22 -26 -15 -32 -6 -32 L26 -32 C35 -32 42 -26 42 -18 L42 2 C42 10 35 16 26 16 L12 16 L-2 28 L2 16 L-6 16 C-15 16 -22 10 -22 2 Z" fill="#252D3D" stroke="#F59E0B" stroke-width="2.5"/>
      <!-- Crossed out lines / No words symbol inside bubble -->
      <path d="M-8 -12 L18 6" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 -12 L-8 6" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>