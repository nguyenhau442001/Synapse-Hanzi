<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Sky background gradient for twilight -->
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="40%" stop-color="#2D2338"/>
      <stop offset="70%" stop-color="#4A2A38"/>
      <stop offset="100%" stop-color="#6E3535"/>
    </linearGradient>

    <!-- Glowing sunset clouds gradient -->
    <linearGradient id="glowCloud1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7B54" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFB26B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD56F" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="glowCloud2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5C5C" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF8E53" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFC145" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Sky box -->
  <rect x="20" y="20" width="200" height="150" rx="16" fill="url(#twilightSky)"/>

  <!-- Setting Sun on the Horizon -->
  <circle cx="120" cy="115" r="24" fill="#FFD166" opacity="0.95"/>
  <circle cx="120" cy="115" r="32" fill="#FF9F43" opacity="0.3"/>

  <!-- Distant Mountains / Horizon Silhouette -->
  <path d="M20 140 L65 115 L105 130 L160 105 L220 135 L220 170 L20 170 Z" fill="#15181F"/>

  <!-- 晚霞 (Evening Glow / Afterglow Clouds) - The core semantic object -->
  <!-- Upper cloud stratum -->
  <path d="M50 75 Q70 65 95 72 Q120 60 150 70 Q180 62 200 78 Q185 90 150 82 Q120 92 90 80 Q65 90 50 75 Z" fill="url(#glowCloud1)"/>
  
  <!-- Lower denser cloud stratum catching the light -->
  <path d="M35 95 Q60 82 90 92 Q125 78 160 95 Q190 85 210 102 Q185 118 150 105 Q120 118 85 102 Q55 115 35 95 Z" fill="url(#glowCloud2)"/>

  <!-- Sun rays / atmospheric gradient overlay -->
  <path d="M120 115 L50 75 M120 115 L95 72 M120 115 L150 70 M120 115 L200 78 M120 115 L35 95 M120 115 L210 102" stroke="#FFD56F" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Foreground Silhouettes (Context: 天边 - horizon line with birds or tree branch) -->
  <!-- Delicate tree branch framing the top right corner -->
  <path d="M220 30 Q190 45 170 55 M195 42 Q185 35 175 36" stroke="#0F1115" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Little silhouette birds flying into the sunset -->
  <path d="M75 55 Q80 50 85 55 Q90 50 95 55" stroke="#15181F" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M65 62 Q68 58 72 62 Q75 58 78 62" stroke="#15181F" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Modern UI Card Base & Frame -->
  <rect x="20" y="20" width="200" height="200" rx="16" fill="none" stroke="#2D3342" stroke-width="2"/>

  <!-- Bottom Label Area representing the clean flashcard layout -->
  <rect x="20" y="170" width="200" height="50" fill="#1A1D24" rx="0" ry="0"/>
  <line x1="20" y1="170" x2="220" y2="170" stroke="#2D3342" stroke-width="2"/>

  <!-- Accent indicator dots or minimalist UI anchor -->
  <circle cx="120" cy="195" r="4" fill="#FF9F43"/>
  <circle cx="102" cy="195" r="3" fill="#2D3342"/>
  <circle cx="138" cy="195" r="3" fill="#2D3342"/>
</svg>