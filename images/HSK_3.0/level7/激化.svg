<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Representing the trade friction/tension -->
  <g transform="translate(120, 120)">
    <!-- Left side: Blue block -->
    <rect x="-70" y="-20" width="40" height="40" rx="4" fill="#4A90E2"/>
    <!-- Right side: Orange block -->
    <rect x="30" y="-20" width="40" height="40" rx="4" fill="#F5A623"/>
    
    <!-- Motion/Action: Pushing/Clashing -->
    <path d="M -30 0 L 30 0" stroke="#E74C3C" stroke-width="6" stroke-linecap="round"/>
    <path d="M -20 -10 L -30 0 L -20 10" stroke="#E74C3C" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 20 -10 L 30 0 L 20 10" stroke="#E74C3C" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Motion lines indicating intensification/pushing -->
    <path d="M -40 -30 L -60 -50" stroke="#F5A623" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 40 -30 L 60 -50" stroke="#4A90E2" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Spikes/Sharp edges to indicate "gay gắt" (intensification) -->
    <path d="M -10 -25 L 0 -45 L 10 -25" fill="#E74C3C"/>
    <path d="M -10 25 L 0 45 L 10 25" fill="#E74C3C"/>
  </g>
</svg>