<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow representing the faint evening courtyard fragrance -->
  <circle cx="120" cy="115" r="70" fill="#2E384D" opacity="0.4"/>

  <!-- Jasmine Flower (茉莉) Illustration -->
  <g transform="translate(120, 115)">
    <!-- Stem and leaves -->
    <path d="M-10,40 C-5,10 0,-15 0,-25" fill="none" stroke="#2D6A4F" stroke-width="4" stroke-linecap="round"/>
    <path d="M-5,15 C-25,10 -35,-5 -25,-15 C-15,-25 -5,-5 -5,15 Z" fill="#40916C"/>
    <path d="M2,20 C22,15 32,0 22,-10 C12,-20 2,-5 2,20 Z" fill="#52B788"/>
    <path d="M-5,15 Q-15,5 -25,-15" fill="none" stroke="#2D6A4F" stroke-width="1.5" opacity="0.6"/>
    <path d="M2,20 Q12,10 22,-10" fill="none" stroke="#2D6A4F" stroke-width="1.5" opacity="0.6"/>

    <!-- Calyx (Green sepals at the base of flower) -->
    <path d="M-6,-25 L0,-32 L6,-25 Z" fill="#2D6A4F"/>
    <path d="M-10,-28 L-3,-31 L3,-28 L10,-28 Z" fill="#40916C"/>

    <!-- Central Jasmine Bloom (Pristine White 5-petal star shape) -->
    <!-- Petal 1 (Top) -->
    <path d="M0,-30 C-12,-35 -16,-55 0,-65 C16,-55 12,-35 0,-30 Z" fill="#F8F9FA"/>
    <!-- Petal 2 (Top Right) -->
    <path d="M5,-27 C16,-32 32,-48 42,-36 C52,-24 38,-12 5,-27 Z" fill="#E9ECEF"/>
    <!-- Petal 3 (Bottom Right) -->
    <path d="M10,-20 C22,-20 38,-30 40,-15 C42,0 26,-2 10,-20 Z" fill="#DEE2E6"/>
    <!-- Petal 4 (Bottom Left) -->
    <path d="M-10,-20 C-22,-20 -38,-30 -40,-15 C-42,0 -26,-2 -10,-20 Z" fill="#E9ECEF"/>
    <!-- Petal 5 (Top Left) -->
    <path d="M-5,-27 C-16,-32 -32,-48 -42,-36 C-52,-24 -38,-12 -5,-27 Z" fill="#F1F3F5"/>

    <!-- Flower Center (Gold accent) -->
    <circle cx="0" cy="-30" r="4.5" fill="#FFB703"/>
    <circle cx="0" cy="-30" r="2" fill="#FB8500"/>
  </g>

  <!-- Floating aromatic wave lines representing "淡淡的清香" (faint fragrance) -->
  <g opacity="0.7" stroke="#FFB703" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M85,45 Q95,35 90,25" />
    <path d="M155,50 Q145,40 150,30" />
    <path d="M70,80 Q55,75 60,65" />
    <path d="M170,85 Q185,80 180,70" />
  </g>

  <!-- Sparkles / freshness indicators -->
  <g fill="#FFB703">
    <path d="M 65 110 Q 65 105 70 105 Q 65 105 65 100 Q 65 105 60 105 Q 65 105 65 110 Z" opacity="0.8"/>
    <path d="M 175 125 Q 175 120 180 120 Q 175 120 175 115 Q 175 120 170 120 Q 175 120 175 125 Z" opacity="0.6"/>
    <path d="M 100 25 Q 100 22 103 22 Q 100 22 100 19 Q 100 22 97 22 Q 100 22 100 25 Z" opacity="0.9"/>
  </g>
</svg>