<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle network connection lines (representing 网 - network) -->
  <g opacity="0.15" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <line x1="120" y1="120" x2="60" y2="70" />
    <line x1="120" y1="120" x2="180" y2="70" />
    <line x1="120" y1="120" x2="60" y2="170" />
    <line x1="120" y1="120" x2="180" y2="170" />
    <circle cx="60" cy="70" r="3" fill="#4F46E5" />
    <circle cx="180" cy="70" r="3" fill="#4F46E5" />
    <circle cx="60" cy="170" r="3" fill="#4F46E5" />
    <circle cx="180" cy="170" r="3" fill="#4F46E5" />
  </g>

  <!-- Central Physical Object: Bank Branch / Service Outpost Building (网点 - physical location/service point) -->
  <g transform="translate(0, 5)">
    <!-- Building Base / Main Structure -->
    <path d="M75 165 L75 105 L165 105 L165 165 Z" fill="#2D3748" />
    
    <!-- Glass Front Facade -->
    <path d="M85 155 L85 115 L155 115 L155 155 Z" fill="#1E293B" />
    
    <!-- Glass Door and Windows Grid -->
    <rect x="105" y="130" width="30" height="25" rx="2" fill="#3B82F6" opacity="0.4" />
    <line x1="120" y1="130" x2="120" y2="155" stroke="#1E293B" stroke-width="1.5" />
    <rect x="89" y="120" width="12" height="15" rx="1" fill="#3B82F6" opacity="0.3" />
    <rect x="139" y="120" width="12" height="15" rx="1" fill="#3B82F6" opacity="0.3" />

    <!-- Roof / Canopy -->
    <path d="M65 105 L120 75 L175 105 Z" fill="#4F46E5" />
    <path d="M70 102 L120 77 L170 102 Z" fill="#6366F1" />

    <!-- Building Pillars -->
    <rect x="80" y="105" width="6" height="60" fill="#E2E8F0" />
    <rect x="154" y="105" width="6" height="60" fill="#E2E8F0" />

    <!-- Service / Location Pin Element (Representing 点 - point/location) -->
    <g transform="translate(120, 30)">
      <!-- Pulsing ring effect -->
      <circle cx="0" cy="0" r="18" fill="#F59E0B" opacity="0.2" />
      <circle cx="0" cy="0" r="12" fill="#F59E0B" opacity="0.4" />
      
      <!-- Main Location Pin -->
      <path d="M0 -15 C-7 -15 -12 -10 -12 -3 C-12 5 0 16 0 16 C0 16 12 5 12 -3 C12 -10 7 -15 0 -15 Z" fill="#F59E0B" />
      <!-- Inner dot of pin -->
      <circle cx="0" cy="-3" r="4.5" fill="#1A1D24" />
    </g>

    <!-- Financial / Service Symbol (Coin/Shield emblem on building) -->
    <circle cx="120" cy="93" r="8" fill="#FBBF24" />
    <text x="120" y="97" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1D24" text-anchor="middle">¥</text>

    <!-- Base platform / Foundation -->
    <rect x="60" y="165" width="120" height="6" rx="3" fill="#4A5568" />
  </g>
</svg>