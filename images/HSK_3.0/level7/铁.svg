<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Glowing Heat Effect Base -->
  <ellipse cx="120" cy="180" rx="70" ry="15" fill="#E85D04" opacity="0.15" filter="blur(8px)"/>
  <ellipse cx="120" cy="155" rx="50" ry="10" fill="#F48C06" opacity="0.3" filter="blur(5px)"/>

  <!-- Anvil Base (Dark Industrial Steel) -->
  <g transform="translate(0, 15)">
    <!-- Base block -->
    <path d="M 80,145 L 160,145 L 170,175 L 70,175 Z" fill="#2B303C"/>
    <!-- Anvil waist -->
    <path d="M 90,125 L 150,125 L 160,145 L 80,145 Z" fill="#3A4252"/>
    <!-- Anvil body / horn base -->
    <path d="M 75,105 L 165,105 L 150,125 L 90,125 Z" fill="#4B5563"/>
    <!-- Anvil top flat face -->
    <path d="M 70,105 L 175,105 L 175,112 L 70,112 Z" fill="#6B7280"/>
    <!-- Anvil horn (left) -->
    <path d="M 70,105 C 50,105 40,110 35,115 C 45,115 60,112 70,110 Z" fill="#4B5563"/>
    <!-- Anvil heel (right step) -->
    <path d="M 175,105 L 195,105 L 195,115 L 175,115 Z" fill="#525B6B"/>
  </g>

  <!-- Glowing Hot Iron Block (生铁块) on Anvil -->
  <g transform="translate(0, 15)">
    <!-- Main glowing ingot -->
    <path d="M 85,95 L 155,95 C 160,95 163,98 160,103 L 150,108 C 145,110 95,110 90,108 L 80,103 C 77,98 80,95 85,95 Z" fill="#FF4D00"/>
    <!-- Inner high-heat core -->
    <path d="M 92,97 L 148,97 C 151,97 153,99 151,102 L 145,105 C 140,106 100,106 95,105 L 89,102 C 87,99 89,97 92,97 Z" fill="#FFB703"/>
    <path d="M 98,99 L 142,99 C 143,99 144,100 143,101 L 138,103 C 135,104 105,104 102,103 L 97,101 C 96,100 97,99 98,99 Z" fill="#FFF3B0"/>
  </g>

  <!-- Sparks / Ember Particles -->
  <g fill="#FFB703">
    <circle cx="100" cy="85" r="2" opacity="0.9"/>
    <circle cx="135" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="155" cy="88" r="2.5" opacity="0.8"/>
    <circle cx="85" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="120" cy="72" r="2" opacity="0.9"/>
    <circle cx="110" cy="65" r="1" opacity="0.5"/>
    <circle cx="145" cy="70" r="1.5" opacity="0.7"/>
  </g>
  <g fill="#FF4D00">
    <circle cx="92" cy="78" r="1.5" opacity="0.8"/>
    <circle cx="128" cy="76" r="2" opacity="0.7"/>
    <circle cx="160" cy="80" r="1" opacity="0.6"/>
  </g>

  <!-- Blacksmith Hammer in mid-swing -->
  <g transform="translate(0, 15)">
    <!-- Handle (angled dynamically) -->
    <path d="M 175,30 L 122,88 C 120,90 117,90 115,88 L 112,85 C 110,83 110,80 112,78 L 165,20 C 168,17 172,17 175,20 L 177,22 C 180,25 180,27 175,30 Z" fill="#9A6B38"/>
    <!-- Hammer Head -->
    <g transform="translate(110, 78) rotate(-45)">
      <!-- Metal Head Center -->
      <rect x="-22" y="-10" width="44" height="20" rx="3" fill="#9CA3AF"/>
      <!-- Hammer Strike Face (Bottom) -->
      <path d="M -22,10 L 22,10 L 20,13 L -20,13 Z" fill="#D1D5DB"/>
      <!-- Hammer Back/Peen -->
      <path d="M -22,-10 L -28,-5 L -28,5 L -22,10 Z" fill="#6B7280"/>
      <!-- Eye / Handle Hole Accent -->
      <rect x="-4" y="-7" width="8" height="14" rx="2" fill="#374151"/>
    </g>
  </g>

  <!-- Motion lines for hammer -->
  <path d="M 175,45 C 160,60 140,75 125,82" stroke="#FFB703" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 165,35 C 150,50 135,65 118,74" stroke="#FF4D00" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>