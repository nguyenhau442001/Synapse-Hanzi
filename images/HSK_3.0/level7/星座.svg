<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Night sky subtle gradient / celestial backdrop -->
  <circle cx="120" cy="115" r="95" fill="#15181F"/>

  <!-- Tiny distant stars -->
  <circle cx="60" cy="65" r="1" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="185" cy="70" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="50" cy="140" r="1" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="195" cy="150" r="1.2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="95" cy="50" r="0.8" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="150" cy="175" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="170" cy="50" r="0.8" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="70" cy="180" r="1.2" fill="#FFFFFF" opacity="0.4"/>

  <!-- Constellation lines (Geometric pattern representing '星座' - Ursa Major/Big Dipper stylized) -->
  <polyline points="75,95 100,105 130,90 155,100 170,130 145,145 130,90" fill="none" stroke="#F1C40F" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>
  <polyline points="155,100 185,85" fill="none" stroke="#F1C40F" stroke-width="1.5" opacity="0.3"/>

  <!-- Constellation Stars (Nodes) -->
  <circle cx="75" cy="95" r="3" fill="#FFEAA7"/>
  <circle cx="100" cy="105" r="2.5" fill="#FFEAA7"/>
  <circle cx="130" cy="90" r="4" fill="#F1C40F"/>
  <circle cx="155" cy="100" r="3" fill="#FFEAA7"/>
  <circle cx="170" cy="130" r="3.5" fill="#FFEAA7"/>
  <circle cx="145" cy="145" r="3" fill="#FFEAA7"/>
  <circle cx="185" cy="85" r="2.5" fill="#FFEAA7"/>

  <!-- Glowing effect for main star -->
  <circle cx="130" cy="90" r="7" fill="#F1C40F" opacity="0.2"/>

  <!-- Landscape silhouette at the bottom (mountain/plateau horizon) -->
  <path d="M 0,210 L 40,195 L 90,205 L 140,185 L 190,200 L 240,190 L 240,240 L 0,240 Z" fill="#111318"/>
  <path d="M 0,215 L 60,200 L 120,210 L 180,198 L 240,205 L 240,240 L 0,240 Z" fill="#0D0E12"/>

  <!-- Astronomical guide / Observer figure silhouette -->
  <!-- Body/Shoulders -->
  <path d="M 95,240 L 95,215 C 95,205 105,198 120,198 C 135,198 145,205 145,215 L 145,240 Z" fill="#2C3E50"/>
  <!-- Head -->
  <circle cx="120" cy="188" r="8" fill="#2C3E50"/>

  <!-- Laser pointer beam projecting towards the constellation -->
  <line x1="124" y1="187" x2="130" y2="90" stroke="#FF4757" stroke-width="2" opacity="0.8"/>
  <line x1="124" y1="187" x2="130" y2="90" stroke="#FF6B81" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Point of laser origin in hand -->
  <circle cx="124" cy="187" r="2" fill="#FF4757"/>

</svg>