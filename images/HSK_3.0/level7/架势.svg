<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(20, 20)">
    <!-- Floor shadow / court reference line -->
    <ellipse cx="100" cy="180" rx="60" ry="12" fill="#2A313C"/>
    <path d="M 60,180 L 140,150" stroke="#3A4454" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Dynamic swing motion trails -->
    <path d="M 50,70 C 80,40 140,50 170,90" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 40,90 C 70,60 130,70 160,110" fill="none" stroke="#F39C12" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Character Body - Athletic Stance (架势) -->
    <!-- Legs in solid professional lunge -->
    <path d="M 85,130 L 60,175 L 45,175" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 95,130 L 120,165 L 135,165" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Torso turned athletically -->
    <path d="M 80,90 L 105,135 L 75,130 Z" fill="#3B82F6"/>
    
    <!-- Head -->
    <circle cx="70" cy="70" r="12" fill="#F1F5F9"/>

    <!-- Arms holding racket in precise form -->
    <!-- Back arm (guiding) -->
    <path d="M 90,105 L 125,95" fill="none" stroke="#E2E8F0" stroke-width="7" stroke-linecap="round"/>
    <!-- Front arm (striking) -->
    <path d="M 80,95 L 120,70 L 145,55" fill="none" stroke="#F1F5F9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Professional Tennis Racket -->
    <g transform="translate(145, 55) rotate(25)">
      <!-- Racket handle -->
      <line x1="-15" y1="15" x2="0" y2="0" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
      <!-- Racket head (oval rim) -->
      <ellipse cx="20" cy="-20" rx="18" ry="24" fill="none" stroke="#F39C12" stroke-width="4"/>
      <!-- Inner strings -->
      <line x1="20" y1="-44" x2="20" y2="4" stroke="#F39C12" stroke-width="1" opacity="0.7"/>
      <line x1="8" y1="-20" x2="32" y2="-20" stroke="#F39C12" stroke-width="1" opacity="0.7"/>
      <line x1="11" y1="-34" x2="29" y2="-6" stroke="#F39C12" stroke-width="1" opacity="0.5"/>
      <line x1="11" y1="-6" x2="29" y2="-34" stroke="#F39C12" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Focus / Precision markers highlighting the "jiàshi" (form/posture) -->
    <circle cx="100" cy="115" r="3" fill="#F39C12"/>
    <circle cx="145" cy="55" r="3" fill="#F39C12"/>
    <path d="M 95,110 L 105,120 M 105,110 L 95,120" stroke="#F39C12" stroke-width="2"/>
    <path d="M 140,50 L 150,60 M 150,50 L 140,60" stroke="#F39C12" stroke-width="2"/>

    <!-- Subtle alignment guide framing the expert posture -->
    <path d="M 30,40 L 30,30 L 40,30" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 170,40 L 170,30 L 160,30" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 30,190 L 30,200 L 40,200" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 170,190 L 170,200 L 160,200" fill="none" stroke="#475569" stroke-width="2"/>
  </g>
</svg>