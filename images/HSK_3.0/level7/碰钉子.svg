<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle grid/glow elements for depth -->
  <circle cx="120" cy="120" r="80" fill="#222733" opacity="0.5"/>

  <!-- Physical Object Representation for "碰钉子" (Hitting a nail / Rejection barrier) -->
  <g transform="translate(0, 0)">
    <!-- Impenetrable Metallic Wall / Barrier (representing the flat refusal / trắc trở) -->
    <rect x="70" y="50" width="100" height="140" rx="8" fill="#2E364F" stroke="#48567A" stroke-width="3"/>
    <!-- Wall panel detail lines -->
    <line x1="70" y1="90" x2="170" y2="90" stroke="#1A1D24" stroke-width="2"/>
    <line x1="70" y1="130" x2="170" y2="130" stroke="#1A1D24" stroke-width="2"/>
    <line x1="70" y1="170" x2="170" y2="170" stroke="#1A1D24" stroke-width="2"/>

    <!-- The Bent Nail (representing the attempt hitting the obstacle and bending) -->
    <g transform="translate(120, 125) rotate(-35)">
      <!-- Nail Head -->
      <rect x="-12" y="-45" width="24" height="6" rx="2" fill="#E67E22"/>
      <!-- Nail Shaft (Bent sharply at the tip against the wall) -->
      <path d="M-3,-39 L-3,-10 Q-3,10 15,15" fill="none" stroke="#F39C12" stroke-width="6" stroke-linecap="round"/>
      <!-- Bent Sharp Tip -->
      <path d="M12,11 L18,17 L14,21 Z" fill="#E67E22"/>
    </g>

    <!-- Motion / Impact Effect Lines -->
    <g stroke="#E74C3C" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="95" y1="105" x2="80" y2="100" />
      <line x1="90" y1="125" x2="75" y2="125" />
      <line x1="95" y1="145" x2="80" y2="150" />
    </g>

    <!-- Spark / Impact Flash -->
    <path d="M110,110 L115,95 L125,105 L135,100 L130,115 L140,125 L125,125 L120,140 L115,125 L100,120 Z" fill="#F1C40F" opacity="0.9"/>
  </g>
</svg>