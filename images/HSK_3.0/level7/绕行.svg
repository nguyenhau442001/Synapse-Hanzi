<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background grid elements / dark mode context -->
  <g opacity="0.1" stroke="#4A5568" stroke-width="1" stroke-dasharray="4 4">
    <line x1="30" y1="180" x2="210" y2="180" />
    <line x1="30" y1="120" x2="210" y2="120" />
  </g>

  <!-- Road & Construction Elements -->
  <g>
    <!-- Main blocked road (straight path with barrier and cones) -->
    <path d="M70 210 L110 90" stroke="#2D3748" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Construction Barrier (Red and White stripes) -->
    <path d="M85 135 L125 125" stroke="#E53E3E" stroke-width="8" stroke-linecap="round"/>
    <path d="M85 135 L125 125" stroke="#CBD5E0" stroke-width="8" stroke-dasharray="8 8" stroke-linecap="round"/>
    <line x1="90" y1="145" x2="85" y2="135" stroke="#718096" stroke-width="4"/>
    <line x1="120" y1="135" x2="125" y2="125" stroke="#718096" stroke-width="4"/>

    <!-- Warning Cones -->
    <polygon points="105,115 112,95 119,115" fill="#DD6B20"/>
    <polygon points="108,105 116,105 114,110 110,110" fill="#EDF2F7"/>

    <!-- Construction Warning Light -->
    <circle cx="112" cy="92" r="3" fill="#F6AD55"/>
    <circle cx="112" cy="92" r="5" stroke="#F6AD55" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- Detour Path (绕行 - The action of going around) -->
  <g>
    <!-- Smooth curved detour road -->
    <path d="M 95 180 Q 40 160 45 110 Q 50 60 110 65 Q 170 70 185 115 Q 200 160 155 190" 
          fill="none" stroke="#2B6CB0" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Animated / Directional Dashed Line for Detour -->
    <path d="M 95 180 Q 40 160 45 110 Q 50 60 110 65 Q 170 70 185 115 Q 200 160 155 190" 
          fill="none" stroke="#63B3ED" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"/>
  </g>

  <!-- Vehicle executing the detour (Sleek Modern Car with Motion/Action) -->
  <g transform="translate(135, 145) rotate(-35)">
    <!-- Motion trails -->
    <path d="M-15 15 L-25 20" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M-15 5 L-30 8" stroke="#F6AD55" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Car Body -->
    <rect x="-16" y="-8" width="32" height="18" rx="6" fill="#F6AD55"/>
    <!-- Car Roof / Cabin -->
    <path d="M-8 -8 L-4 -14 L8 -14 L10 -8 Z" fill="#DD6B20"/>
    <!-- Headlights -->
    <circle cx="15" cy="-4" r="2" fill="#FEFCBF"/>
    <circle cx="15" cy="6" r="2" fill="#FEFCBF"/>
    <!-- Wheels -->
    <rect x="-10" y="-11" width="6" height="3" rx="1" fill="#1A1D24"/>
    <rect x="6" y="-11" width="6" height="3" rx="1" fill="#1A1D24"/>
    <rect x="-10" y="8" width="6" height="3" rx="1" fill="#1A1D24"/>
    <rect x="6" y="8" width="6" height="3" rx="1" fill="#1A1D24"/>
  </g>

  <!-- Additional directional arrow highlighting the bypass curve -->
  <g>
    <path d="M 175 105 Q 185 130 165 155" fill="none" stroke="#F6AD55" stroke-width="3" stroke-linecap="round"/>
    <polygon points="163,162 160,150 172,152" fill="#F6AD55"/>
  </g>
</svg>