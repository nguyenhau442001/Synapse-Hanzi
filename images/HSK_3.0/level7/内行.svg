<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background subtle glow/elements for painting/expert context -->
  <circle cx="120" cy="115" r="75" fill="#252A34" opacity="0.6"/>

  <!-- Easel structure -->
  <line x1="85" y1="65" x2="120" y2="175" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="65" x2="120" y2="175" stroke="#3A4252" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="50" x2="120" y2="175" stroke="#2D3440" stroke-width="2"/>
  
  <!-- Canvas board -->
  <rect x="75" y="70" width="90" height="70" rx="4" fill="#222733" stroke="#404B60" stroke-width="2"/>

  <!-- Artwork on canvas (A classic landscape with expert verification check) -->
  <!-- Landscape painting elements -->
  <path d="M 85 125 L 105 105 L 120 115 L 140 95 L 160 125 Z" fill="#2E384A"/>
  <circle cx="145" cy="88" r="8" fill="#E5C07B" opacity="0.8"/>
  
  <!-- Expert Magnifying Glass inspecting the painting (Symbol of "内行" - discerning eye/expert detail) -->
  <g transform="translate(110, 85)">
    <!-- Glass lens circle with subtle highlight -->
    <circle cx="20" cy="20" r="26" fill="#1E232D" stroke="#E5C07B" stroke-width="4"/>
    <circle cx="20" cy="20" r="22" fill="#61AFEF" fill-opacity="0.15"/>
    <path d="M 8 12 C 12 8, 20 8, 26 10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Magnifying glass handle -->
    <line x1="38" y1="38" x2="56" y2="56" stroke="#E5C07B" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Professional focus marker / Check mark inside lens indicating expert verification -->
    <path d="M 12 21 L 18 27 L 30 14" fill="none" stroke="#98C379" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>