<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Document/Invoice Representation -->
  <rect x="70" y="60" width="100" height="120" rx="4" fill="#E0E0E0"/>
  <rect x="80" y="75" width="80" height="8" rx="2" fill="#BDBDBD"/>
  <rect x="80" y="95" width="80" height="8" rx="2" fill="#BDBDBD"/>
  <rect x="80" y="115" width="50" height="8" rx="2" fill="#BDBDBD"/>
  
  <!-- The "Exemption" Stamp/Action -->
  <!-- A bold, clear diagonal strike through the document indicating removal/waiver -->
  <g stroke="#FF9800" stroke-width="8" stroke-linecap="round">
    <line x1="60" y1="50" x2="180" y2="190"/>
    <line x1="180" y1="50" x2="60" y2="190"/>
  </g>
  
  <!-- Hand gesture indicating 'waived' or 'no charge' -->
  <path d="M140 160 C 140 140, 160 130, 170 140 C 180 150, 170 170, 160 180 L 150 200 L 130 190 Z" fill="#FFC107"/>
  <path d="M150 170 L 175 155" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
</svg>