<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background grid/glow representing system/operations -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#262C3A" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="120" cy="120" r="55" fill="none" stroke="#262C3A" stroke-width="1.5"/>

  <!-- Central Physical Object representing '运作' (Operation / Complex Mechanism) -->
  <!-- Outer Ring / Large Gear -->
  <g transform="translate(120, 120)">
    <!-- Rotating gears in sleek flat vector style -->
    <!-- Large Background Gear -->
    <g fill="#2D3748">
      <path d="M-15,-55 L15,-55 L18,-42 L32,-36 L42,-45 L60,-27 L51,-17 L57,-3 L70,0 L70,30 L57,33 L51,47 L60,57 L42,75 L32,66 L18,72 L15,85 L-15,85 L-18,72 L-32,66 L-42,75 L-60,57 L-51,47 L-57,33 L-70,30 L-70,0 L-57,-3 L-51,-17 L-60,-27 L-42,-45 L-32,-36 L-18,-42 Z"/>
    </g>
    <circle cx="0" cy="0" r="48" fill="#1A1D24"/>

    <!-- Medium Accent Gear (Gold/Orange for focus) -->
    <g transform="translate(-18, -18) rotate(15)" fill="#F59E0B">
      <path d="M-10,-38 L10,-38 L12,-28 L22,-24 L28,-30 L40,-18 L34,-12 L38,-2 L48,0 L48,20 L38,22 L34,32 L40,38 L28,50 L22,44 L12,48 L10,58 L-10,58 L-12,48 L-22,44 L-28,50 L-40,38 L-34,32 L-38,22 L-48,20 L-48,0 L-38,-2 L-34,-12 L-40,-18 L-28,-30 L-22,-24 L-12,-28 Z"/>
      <circle cx="0" cy="0" r="30" fill="#1A1D24"/>
    </g>

    <!-- Small Central Gear -->
    <g transform="translate(20, 20) rotate(-25)" fill="#3B82F6">
      <path d="M-8,-26 L8,-26 L10,-18 L18,-15 L22,-21 L31,-12 L27,-6 L30,0 L38,2 L38,16 L30,18 L27,24 L31,30 L22,39 L18,33 L10,36 L8,44 L-8,44 L-10,36 L-18,33 L-22,39 L-31,30 L-27,24 L-30,18 L-38,16 L-38,2 L-30,0 L-27,-6 L-31,-12 L-22,-21 L-18,-15 L-10,-18 Z"/>
      <circle cx="0" cy="0" r="20" fill="#1A1D24"/>
    </g>

    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
  </g>

  <!-- Dynamic connection nodes representing functional workflow/coordination -->
  <circle cx="65" cy="70" r="6" fill="#3B82F6"/>
  <path d="M70,75 L90,95" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3 3"/>

  <circle cx="185" cy="90" r="6" fill="#10B981"/>
  <path d="M175,98 L155,110" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>

  <circle cx="95" cy="180" r="6" fill="#F59E0B"/>
  <path d="M100,172 L112,150" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>
</svg>