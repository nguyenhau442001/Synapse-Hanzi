<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow for heat source -->
  <circle cx="120" cy="130" r="60" fill="#FF7043" opacity="0.1" filter="blur(10px)"/>

  <!-- Radiator Base & Structure -->
  <g id="radiator">
    <!-- Main radiator body (Sections) -->
    <!-- Section 1 (Left) -->
    <rect x="74" y="90" width="18" height="70" rx="4" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
    <rect x="78" y="98" width="10" height="54" rx="2" fill="#3B4252"/>

    <!-- Section 2 (Center-Left) -->
    <rect x="94" y="85" width="18" height="75" rx="4" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
    <rect x="98" y="93" width="10" height="59" rx="2" fill="#3B4252"/>

    <!-- Section 3 (Center-Right) -->
    <rect x="114" y="85" width="18" height="75" rx="4" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
    <rect x="118" y="93" width="10" height="59" rx="2" fill="#3B4252"/>

    <!-- Section 4 (Right) -->
    <rect x="134" y="90" width="18" height="70" rx="4" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
    <rect x="138" y="98" width="10" height="54" rx="2" fill="#3B4252"/>

    <!-- Top Connecting Pipe -->
    <rect x="80" y="80" width="66" height="6" rx="3" fill="#4C566A"/>
    <!-- Bottom Connecting Pipe -->
    <rect x="80" y="154" width="66" height="6" rx="3" fill="#4C566A"/>

    <!-- Thermostatic Control Valve (Left side) -->
    <path d="M 64 105 L 74 105 L 74 125 L 64 125 Z" fill="#D8DEE9"/>
    <circle cx="64" cy="115" r="7" fill="#E5E9F0" stroke="#4C566A" stroke-width="2"/>
    <rect x="61" y="100" width="6" height="6" rx="1" fill="#E5E9F0"/>

    <!-- Inlet/Outlet Pipes at bottom right -->
    <rect x="145" y="160" width="8" height="15" fill="#4C566A"/>
    <rect x="125" y="160" width="8" height="15" fill="#4C566A"/>
  </g>

  <!-- Heat Waves / Warmth Symbolism (Orange/Gold Accents) -->
  <g id="heat-waves" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Wave -->
    <path d="M 85 70 C 75 55, 95 45, 85 30" stroke="#FF9800" stroke-width="3" opacity="0.9"/>
    <!-- Center Wave -->
    <path d="M 120 65 C 130 50, 110 40, 120 22" stroke="#FFB300" stroke-width="3.5" opacity="1"/>
    <!-- Right Wave -->
    <path d="M 155 70 C 165 55, 145 45, 155 30" stroke="#FF9800" stroke-width="3" opacity="0.9"/>
    
    <!-- Rising Warm Air Particles/Sparks -->
    <circle cx="100" cy="50" r="2" fill="#FFC107"/>
    <circle cx="140" cy="45" r="1.5" fill="#FF9800"/>
    <circle cx="120" cy="15" r="2" fill="#FFD54F"/>
  </g>

  <!-- Floor shadow -->
  <ellipse cx="120" cy="178" rx="50" ry="6" fill="#0f1115"/>
</svg>