<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <defs>
    <!-- Glow filter for urgency/time -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background decorative timeline/progression grid lines -->
  <line x1="40" y1="180" x2="200" y2="180" stroke="#2A2F3D" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="130" x2="200" y2="130" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="40" y1="80" x2="200" y2="80" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Progression / Escalation Pathway (Curved upward trajectory symbolizing "as early as possible / ahead of time") -->
  <path d="M 40 170 C 90 170, 110 130, 150 90 C 170 70, 185 55, 200 45" fill="none" stroke="#3A4255" stroke-width="8" stroke-linecap="round"/>
  <path d="M 40 170 C 90 170, 110 130, 150 90 C 170 70, 185 55, 200 45" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="30"/>

  <!-- Early phase marker (Normal / Late) -->
  <circle cx="70" cy="162" r="6" fill="#4B5563"/>

  <!-- Optimal early action marker (Highlighted Focal Point) -->
  <g transform="translate(130, 106)">
    <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <!-- Clock icon symbolizing time / urgency -->
    <circle cx="0" cy="0" r="9" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <polyline points="0,-4 0,0 3,2" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Peak / Target outcome marker (Success / Cares / Early Action achieved) -->
  <g transform="translate(195, 48)">
    <circle cx="0" cy="0" r="12" fill="#10B981" filter="url(#glow)"/>
    <!-- Checkmark representing prompt, correct action -->
    <polyline points="-4,0 -1,3 5,-3" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Abstract metaphorical timeline nodes representing steps moved forward in time -->
  <!-- Step 1 -->
  <circle cx="70" cy="162" r="3" fill="#9CA3AF"/>
  <line x1="70" y1="152" x2="70" y2="142" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/>
  <polyline points="66,146 70,142 74,146" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 (The "盡早" focal shift - moving ahead) -->
  <g>
    <!-- Upward acceleration arrow graphics -->
    <path d="M 125 90 L 140 75 L 140 88" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="125" y1="90" x2="155" y2="60" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Additional structural clarity elements: Minimalist medical/system planning context hint (hospital check-in / procedural prompt) -->
  <g transform="translate(45, 185)">
    <!-- Document shape representing procedure/plan -->
    <rect x="0" y="0" rx="3" width="22" height="28" fill="#334155"/>
    <line x1="5" y1="6" x2="14" y2="6" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="12" x2="17" y2="12" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="18" x2="11" y2="18" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Fast-forward indicator arrows next to document -->
    <path d="M 30 10 L 36 14 L 30 18" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 35 10 L 41 14 L 35 18" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Second context node (Systematic treatment plan ready ahead of time) -->
  <g transform="translate(170, 185)">
    <rect x="0" y="0" rx="3" width="22" height="28" fill="#065F46"/>
    <polyline points="6,14 10,18 16,10" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Connecting dashed action flow -->
  <line x1="72" y1="199" x2="168" y2="199" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
</svg>