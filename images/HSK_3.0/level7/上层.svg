<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Building Structure -->
  <g transform="translate(70, 40)">
    <!-- Lower floors (base) -->
    <rect x="0" y="80" width="100" height="80" fill="#2D343E" rx="4"/>
    <rect x="15" y="95" width="30" height="20" fill="#3A4452"/>
    <rect x="55" y="95" width="30" height="20" fill="#3A4452"/>
    <rect x="15" y="125" width="30" height="20" fill="#3A4452"/>
    <rect x="55" y="125" width="30" height="20" fill="#3A4452"/>
    
    <!-- Upper floors (The focus: 上层) -->
    <rect x="-10" y="20" width="120" height="60" fill="#FFB84D" rx="4"/>
    <rect x="10" y="35" width="30" height="30" fill="#1A1D24"/>
    <rect x="50" y="35" width="30" height="30" fill="#1A1D24"/>
    
    <!-- Roof/Garden detail -->
    <path d="M-10 20 L110 20 L105 10 L-5 10 Z" fill="#E6A035"/>
    <circle cx="25" cy="5" r="4" fill="#78C679"/>
    <circle cx="85" cy="5" r="4" fill="#78C679"/>
    
    <!-- Highlight line for upper section -->
    <rect x="-10" y="20" width="120" height="60" fill="none" stroke="#FFD700" stroke-width="2" rx="4"/>
  </g>
</svg>