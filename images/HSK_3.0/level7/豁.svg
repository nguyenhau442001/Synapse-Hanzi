<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- The Cotton Jacket -->
  <path d="M70 60 L170 60 L180 180 L60 180 Z" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
  <path d="M70 60 L80 180 M100 60 L110 180 M130 60 L140 180 M160 60 L170 180" stroke="#D35400" stroke-width="1" opacity="0.5"/>
  
  <!-- The Tear (The "豁" - the gap/opening) -->
  <path d="M120 80 C110 100, 140 120, 125 150" stroke="#1A1D24" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 80 C110 100, 140 120, 125 150" stroke="#F1C40F" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The Sharp Wire -->
  <path d="M40 100 L100 100 L120 80 L140 100 L200 100" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="80" r="3" fill="#BDC3C7"/>
</svg>