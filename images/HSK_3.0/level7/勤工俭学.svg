<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk Background Shape -->
  <path d="M40 185C40 182.791 41.7909 181 44 181H196C198.209 181 200 182.791 200 185V190C200 192.209 198.209 194 196 194H44C41.7909 194 40 192.209 40 190V185Z" fill="#2D333B"/>

  <!-- Open Textbook / Study element -->
  <g transform="translate(48, 125)">
