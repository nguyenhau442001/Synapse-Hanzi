    <path d="M84 20H116V23H84V20Z" fill="#8B949E" opacity="0.6"/>
    <path d="M84 27H109V30H84V27Z" fill="#8B949E" opacity="0.6"/>
    
    <!-- Center Spine Binding -->
    <path d="M71 17H73V45H71V17Z" fill="#30363D"/>
  </g>

  <!-- Laptop (Work element) -->
  <g transform="translate(70, 75)">
