    <rect x="15" y="14" width="70" height="37" rx="2" fill="#0D1117"/>
    
    <!-- UI / Dashboard mockup inside screen (representing earning/work) -->
    <rect x="21" y="20" width="30" height="4" rx="2" fill="#58A6FF"/>
    <rect x="21" y="28" width="58" height="16" rx="2" fill="#161B22"/>
    <!-- Chart lines -->
    <path d="M26 39L35 32L43 36L55 26L69 34" stroke="#3FB950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Golden Coin Floating (representing earning / self-reliance) -->
