<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(12, 12)">
    <!-- Document Base -->
    <rect x="36" y="20" width="144" height="176" rx="12" fill="#252A34" stroke="#343B4B" stroke-width="2"/>
    
    <!-- Header Accent -->
    <path d="M 56 42 H 100" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Text Lines (Indicating fluent flow) -->
    <rect x="56" y="64" width="104" height="6" rx="3" fill="#4A5568"/>
    <rect x="56" y="82" width="90" height="6" rx="3" fill="#4A5568"/>
    <rect x="56" y="100" width="96" height="6" rx="3" fill="#4A5568"/>
    
    <!-- The "Smooth Flow" Highlight Stream (Visualizing 通顺 / trôi chảy, suôn sẻ) -->
    <g>
      <path d="M 44 122 C 70 122, 90 142, 116 142 C 142 142, 160 122, 196 122" 
            fill="none" stroke="#FFB703" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Flow Directional / Speed Indicator Dots -->
      <circle cx="80" cy="132" r="3" fill="#FFE5A3"/>
      <circle cx="150" cy="130" r="3" fill="#FFE5A3"/>
      <circle cx="174" cy="125" r="3" fill="#FFE5A3"/>
    </g>
    
    <!-- Remaining Text Lines below the flow -->
    <rect x="56" y="156" width="80" height="6" rx="3" fill="#4A5568"/>
    <rect x="56" y="174" width="104" height="6" rx="3" fill="#4A5568"/>
    
    <!-- Fountain Pen Nib / Writing Element representing smooth expression -->
    <g transform="translate(142, 134) rotate(45)">
      <path d="M 0 -12 C 4 -6, 6 2, 6 12 L -6 12 C -6 2, -4 -6, 0 -12 Z" fill="#3A86FF"/>
      <path d="M -6 12 L 0 22 L 6 12 Z" fill="#2563EB"/>
      <circle cx="0" cy="4" r="1.5" fill="#1A1D24"/>
    </g>
  </g>
</svg>