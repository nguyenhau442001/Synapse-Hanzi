<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle floor shadow / ambient lighting -->
  <ellipse cx="120" cy="190" rx="70" ry="12" fill="#111318"/>

  <!-- CENTRAL ICONIC OBJECT: Legal Scales of Justice (Civil law/Dispute resolution context) -->
  <!-- Stand Base -->
  <path d="M95 180 L145 180 L140 170 L100 170 Z" fill="#4A5568"/>
  <rect x="114" y="90" width="12" height="85" rx="3" fill="#A0AEC0"/>

  <!-- Top Ring / Finial -->
  <circle cx="120" cy="84" r="8" fill="none" stroke="#F6AD55" stroke-width="4"/>

  <!-- Balance Beam -->
  <path d="M70 95 L170 95 L170 101 L70 101 Z" fill="#F6AD55"/>
  <circle cx="120" cy="98" r="6" fill="#DD6B20"/>

  <!-- Left Pan Strings & Pan -->
  <path d="M75 99 L55 140 L95 140 Z" fill="none" stroke="#CBD5E0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M50 142 C50 138 90 138 90 142 Z" fill="#E2E8F0"/>
  <ellipse cx="70" cy="142" rx="22" ry="7" fill="#CBD5E0"/>

  <!-- Right Pan Strings & Pan -->
  <path d="M165 99 L145 140 L185 140 Z" fill="none" stroke="#CBD5E0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M140 142 C140 138 180 138 180 142 Z" fill="#E2E8F0"/>
  <ellipse cx="160" cy="142" rx="22" ry="7" fill="#CBD5E0"/>

  <!-- Civil/Citizen context element: Two simple stylized silhouettes representing civilian parties (民) -->
  <!-- Left Civilian Silhouette -->
  <circle cx="55" cy="170" r="10" fill="#63B3ED"/>
  <path d="M40 195 C40 183 48 180 55 180 C62 180 70 183 70 195 Z" fill="#63B3ED"/>

  <!-- Right Civilian Silhouette -->
  <circle cx="185" cy="170" r="10" fill="#63B3ED"/>
  <path d="M170 195 C170 183 178 180 185 180 C192 180 200 183 200 195 Z" fill="#63B3ED"/>

  <!-- Document/Contract (Legal resolution emblem) nestled at the base -->
  <rect x="104" y="145" width="32" height="26" rx="3" fill="#EDF2F7"/>
  <line x1="110" y1="152" x2="130" y2="152" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="159" x2="126" y2="159" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="112" cy="166" r="2" fill="#3182CE"/>
  <line x1="117" y1="166" x2="128" y2="166" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round"/>
</svg>