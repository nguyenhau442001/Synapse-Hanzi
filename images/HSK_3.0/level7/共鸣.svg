<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Conceptual Design for 共鸣 (Resonance / Echo / Deep Emotional Connection) -->
  <g transform="translate(120, 115)">
    <!-- Outer concentric echoing resonance waves (representing sound waves, emotional ripple) -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#252D3D" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#2D3748" stroke-width="2.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#E67E22" stroke-width="3" opacity="0.4"/>

    <!-- Central resonant tuning fork / acoustic core symbol -->
    <!-- Stem & Base -->
    <path d="M-3,35 L3,35 L3,18 L-3,18 Z" fill="#E67E22"/>
    <circle cx="0" cy="40" r="7" fill="#F39C12"/>

    <!-- Fork Body (U-shape) -->
    <path d="M-18,-15 L-18,18 C-18,27 18,27 18,18 L18,-15 Z" fill="none" stroke="#F39C12" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Tines -->
    <rect x="-21" y="-50" width="6" height="35" rx="3" fill="#F39C12"/>
    <rect x="15" y="-50" width="6" height="35" rx="3" fill="#F39C12"/>

    <!-- Vibrant Resonance Waves pulsing outward from the fork -->
    <path d="M-35,-25 C-45,-10 -45,10 -35,25" fill="none" stroke="#3498DB" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M35,-25 C45,-10 45,10 35,25" fill="none" stroke="#3498DB" stroke-width="3.5" stroke-linecap="round"/>

    <path d="M-48,-40 C-62,-15 -62,15 -48,40" fill="none" stroke="#3498DB" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M48,-40 C62,-15 62,15 48,40" fill="none" stroke="#3498DB" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Harmonic Sparkles / Energy Nodes -->
    <circle cx="-42" cy="-30" r="2.5" fill="#3498DB"/>
    <circle cx="42" cy="30" r="2.5" fill="#3498DB"/>
    <circle cx="-54" cy="5" r="2" fill="#E67E22"/>
    <circle cx="54" cy="-5" r="2" fill="#E67E22"/>
  </g>
</svg>