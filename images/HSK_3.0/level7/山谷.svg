<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2433"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>

    <!-- Mountain background gradient -->
    <linearGradient id="bgMountain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313B4D"/>
      <stop offset="100%" stop-color="#242C3A"/>
    </linearGradient>

    <!-- Mountain foreground gradient -->
    <linearGradient id="fgMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#2B3444"/>
    </linearGradient>

    <!-- Valley floor gradient -->
    <linearGradient id="valleyFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F4F4F"/>
      <stop offset="100%" stop-color="#1B2E2E"/>
    </linearGradient>

    <!-- Fog gradient for mist in the valley ("山谷里弥漫着大雾") -->
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A0AEC0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#CBD5E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A0AEC0" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="20" y="20" width="200" height="200" rx="16" fill="url(#skyGrad)"/>

  <!-- Distant Background Mountains (Left & Right) -->
  <polygon points="20,150 90,75 140,150" fill="url(#bgMountain)"/>
  <polygon points="100,150 160,85 220,150" fill="url(#bgMountain)"/>

  <!-- Golden Accent light catching peaks -->
  <polyline points="90,75 105,95" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>
  <polyline points="160,85 172,100" fill="none" stroke="#F6AD55" stroke-width="2" stroke-linecap="round"/>

  <!-- Main Left Mountain (The Valley Wall) -->
  <path d="M 20 220 L 20 120 Q 55 95 90 130 Q 110 150 125 220 Z" fill="url(#fgMountain)"/>

  <!-- Main Right Mountain (The Valley Wall) -->
  <path d="M 220 220 L 220 110 Q 185 90 145 135 Q 130 155 115 220 Z" fill="url(#fgMountain)"/>

  <!-- Valley Floor (Center depth) -->
  <path d="M 90 130 Q 110 150 125 220 L 115 220 Q 130 155 145 135 Z" fill="url(#valleyFloor)"/>

  <!-- Winding stream/path in the valley -->
  <path d="M 120 180 Q 115 200 125 220" fill="none" stroke="#63B3ED" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Dense Fog / Mist Layers ("弥漫着大雾") -->
  <!-- Low fog layer 1 -->
  <ellipse cx="120" cy="190" rx="60" ry="14" fill="url(#fogGrad)"/>
  
  <!-- Mid fog layer 2 (waving across the valley gap) -->
  <path d="M 75 160 Q 105 140 140 165 Q 170 145 185 160 Q 160 185 120 170 Q 85 185 75 160 Z" fill="url(#fogGrad)"/>
  
  <!-- Wispy upper fog -->
  <ellipse cx="135" cy="140" rx="45" ry="10" fill="#E2E8F0" opacity="0.3"/>
  <ellipse cx="100" cy="150" rx="35" ry="8" fill="#CBD5E0" opacity="0.4"/>

  <!-- Pine trees on slopes for scale (Vector geometric style) -->
  <polygon points="65,145 70,135 75,145" fill="#234E52"/>
  <polygon points="65,140 70,130 75,140" fill="#285E61"/>
  <polygon points="165,155 170,145 175,155" fill="#234E52"/>
  <polygon points="165,150 170,140 175,150" fill="#285E61"/>
  <polygon points="150,165 154,155 158,165" fill="#234E52"/>

  <!-- Ambient light glow accent -->
  <circle cx="120" cy="50" r="1.5" fill="#F6AD55" opacity="0.6"/>
  <circle cx="140" cy="45" r="1" fill="#F6AD55" opacity="0.4"/>
  <circle cx="100" cy="60" r="1" fill="#F6AD55" opacity="0.5"/>

  <!-- Sleek framing border -->
  <rect x="20" y="20" width="200" height="200" rx="16" fill="none" stroke="#2D3748" stroke-width="2"/>
</svg>