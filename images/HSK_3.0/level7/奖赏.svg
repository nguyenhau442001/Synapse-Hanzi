<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background glow behind the reward -->
  <circle cx="120" cy="115" r="70" fill="#F59E0B" opacity="0.08"/>

  <!-- Glowing rays/sparkles in background -->
  <path d="M120 40 L120 50" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M120 180 L120 190" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M60 90 L68 94" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M172 136 L180 140" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M180 90 L172 94" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M60 136 L68 140" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Physical Object: A grand, ornate treasure chest filled with gold coins, representing '奖赏' (Reward) -->
  <g transform="translate(0, 15)">
    <!-- Chest Base (Back/Interior shadow) -->
    <rect x="65" y="105" width="110" height="40" rx="4" fill="#78350F"/>
    
    <!-- Gold coins spilling/stacked inside -->
    <ellipse cx="95" cy="115" rx="14" ry="7" fill="#FBBF24"/>
    <ellipse cx="120" cy="112" rx="16" ry="8" fill="#F59E0B"/>
    <ellipse cx="145" cy="115" rx="14" ry="7" fill="#FBBF24"/>
    <ellipse cx="110" cy="108" rx="12" ry="6" fill="#FDE68A"/>
    <ellipse cx="132" cy="108" rx="12" ry="6" fill="#FDE68A"/>
    
    <!-- Treasure Chest Open Lid (Angled upward) -->
    <path d="M63 105 C63 75 177 75 177 105 Z" fill="#92400E"/>
    <!-- Lid Metal Reinforcements -->
    <path d="M85 105 C85 85 95 80 100 80 L100 105 Z" fill="#451A03"/>
    <path d="M140 105 C140 85 145 80 155 80 L155 105 Z" fill="#451A03"/>
    <rect x="63" y="101" width="114" height="6" rx="3" fill="#B45309"/>

    <!-- Chest Lower Body -->
    <path d="M63 115 H177 V150 C177 156 172 160 166 160 H74 C68 160 63 156 63 150 Z" fill="#B45309"/>
    
    <!-- Wooden Planks Texture/Shading -->
    <line x1="63" y1="135" x2="177" y2="135" stroke="#78350F" stroke-width="2" opacity="0.4"/>

    <!-- Metal Straps & Corners on Chest Body -->
    <rect x="83" y="115" width="12" height="45" fill="#451A03"/>
    <rect x="145" y="115" width="12" height="45" fill="#451A03"/>
    
    <!-- Metal Rivets -->
    <circle cx="89" cy="122" r="1.5" fill="#FBBF24"/>
    <circle cx="89" cy="148" r="1.5" fill="#FBBF24"/>
    <circle cx="151" cy="122" r="1.5" fill="#FBBF24"/>
    <circle cx="151" cy="148" r="1.5" fill="#FBBF24"/>

    <!-- Central Ornate Lock/Latch -->
    <rect x="111" y="125" width="18" height="20" rx="3" fill="#D97706"/>
    <circle cx="120" cy="135" r="4" fill="#451A03"/>
  </g>

  <!-- Flowing golden silk ribbons framing the reward (representing the silk/cloth rewards from historical context) -->
  <path d="M50 150 C40 130 55 110 70 120 C85 130 80 160 65 170 C50 180 30 165 40 145" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M190 150 C200 130 185 110 170 120 C155 130 160 160 175 170 C190 180 210 165 200 145" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Prominent Sparkling Star (Accentuate achievement/reward) -->
  <g transform="translate(120, 48)">
    <path d="M0 -12 C1 -4 4 -1 12 0 C4 1 1 4 0 12 C-1 4 -4 1 -12 0 C-4 -1 -1 -4 0 -12 Z" fill="#FBBF24"/>
  </g>
  <g transform="translate(75, 70) scale(0.6)">
    <path d="M0 -12 C1 -4 4 -1 12 0 C4 1 1 4 0 12 C-1 4 -4 1 -12 0 C-4 -1 -1 -4 0 -12 Z" fill="#FDE68A"/>
  </g>
  <g transform="translate(165, 70) scale(0.6)">
    <path d="M0 -12 C1 -4 4 -1 12 0 C4 1 1 4 0 12 C-1 4 -4 1 -12 0 C-4 -1 -1 -4 0 -12 Z" fill="#FDE68A"/>
  </g>
</svg>