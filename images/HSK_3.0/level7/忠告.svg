<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle glow representing wisdom/insight -->
  <circle cx="120" cy="115" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Conceptual Object: An ancient yet modern golden scroll/document symbolizing sincere advice and words of wisdom -->
  <g transform="translate(0, 5)">
    <!-- Scroll Ribbon / Backdrop -->
    <path d="M 65 75 Q 120 60 175 75 L 175 145 Q 120 160 65 145 Z" fill="#2D3748" />

    <!-- Main Scroll Body (Parchment) -->
    <rect x="70" y="65" width="100" height="90" rx="4" fill="#E2E8F0" />
    
    <!-- Text lines on the scroll (representing sincere words/advice) -->
    <rect x="85" y="85" width="70" height="6" rx="3" fill="#CBD5E0" />
    <rect x="85" y="100" width="55" height="6" rx="3" fill="#CBD5E0" />
    <rect x="85" y="115" width="62" height="6" rx="3" fill="#CBD5E0" />
    <rect x="85" y="130" width="40" height="6" rx="3" fill="#CBD5E0" />

    <!-- Scroll Rollers (Left and Right wooden bars in striking Gold/Orange for high focus) -->
    <!-- Left Roller -->
    <rect x="62" y="60" width="12" height="100" rx="6" fill="#D69E2E" />
    <ellipse cx="68" cy="60" rx="6" ry="3" fill="#B7791F" />
    <ellipse cx="68" cy="160" rx="6" ry="3" fill="#B7791F" />

    <!-- Right Roller -->
    <rect x="166" y="60" width="12" height="100" rx="6" fill="#D69E2E" />
    <ellipse cx="172" cy="60" rx="6" ry="3" fill="#B7791F" />
    <ellipse cx="172" cy="160" rx="6" ry="3" fill="#B7791F" />

    <!-- Focal Accent: Glowing Insight Spark / Star symbol above the scroll representing valuable sincere advice -->
    <path d="M 120 35 L 123 46 L 134 49 L 123 52 L 120 63 L 117 52 L 106 49 L 117 46 Z" fill="#ECC94B" />
    
    <!-- Secondary small sparkle -->
    <path d="M 155 52 L 157 58 L 163 60 L 157 62 L 155 68 L 153 62 L 147 60 L 153 58 Z" fill="#F6AD55" opacity="0.8" />
  </g>

  <!-- Base platform supporting the advice -->
  <ellipse cx="120" cy="180" rx="55" ry="8" fill="#101217" opacity="0.8"/>
  <rect x="80" y="176" width="80" height="4" rx="2" fill="#D69E2E" opacity="0.4"/>
</svg>