<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Architecture (School Auditorium) -->
  <path d="M60 180 L60 100 L120 70 L180 100 L180 180 Z" fill="#2C313C" stroke="#4A5568" stroke-width="2"/>
  <rect x="100" y="130" width="40" height="50" fill="#1A1D24" stroke="#4A5568" stroke-width="2"/>
  
  <!-- Left Figure (Past/Younger self) -->
  <g transform="translate(70, 140)">
    <circle cx="15" cy="15" r="12" fill="#FFB347"/>
    <path d="M5 30 L25 30 L20 60 L10 60 Z" fill="#FFB347"/>
    <circle cx="10" cy="12" r="2" fill="#1A1D24"/>
    <circle cx="20" cy="12" r="2" fill="#1A1D24"/>
  </g>
  
  <!-- Right Figure (Present/Older self) -->
  <g transform="translate(150, 130)">
    <circle cx="15" cy="15" r="15" fill="#FFD700"/>
    <path d="M5 35 L25 35 L22 70 L8 70 Z" fill="#FFD700"/>
    <path d="M8 12 L12 15 L8 18" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <path d="M22 12 L18 15 L22 18" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <path d="M10 22 L20 22" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Connecting Time Element (The Gap) -->
  <path d="M95 150 Q120 120 145 150" stroke="#FFB347" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Ground -->
  <path d="M40 180 L200 180" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
</svg>