<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Glow & Atmosphere -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.6"/>
  <path d="M40 180 Q120 160 200 180 L200 210 Q120 190 40 210 Z" fill="#2A303C"/>

  <!-- Cobblestone Ground -->
  <path d="M40 190 C80 180, 160 180, 200 190 C160 210, 80 210, 40 190 Z" fill="#363E4F"/>
  <ellipse cx="90" cy="193" rx="12" ry="6" fill="#434B5C"/>
  <ellipse cx="130" cy="196" rx="15" ry="7" fill="#434B5C"/>
  <ellipse cx="165" cy="192" rx="10" ry="5" fill="#434B5C"/>
  <ellipse cx="70" cy="198" rx="8" ry="4" fill="#434B5C"/>

  <!-- Distant Mediterranean Architecture (Silhouette) -->
  <path d="M60 180 L60 145 L85 130 L110 145 L110 180 Z" fill="#252A35"/>
  <path d="M130 180 L130 135 L155 120 L180 135 L180 180 Z" fill="#252A35"/>
  <rect x="72" y="152" width="10" height="15" rx="5" fill="#1A1D24"/>
  <rect x="90" y="152" width="10" height="15" rx="5" fill="#1A1D24"/>
  <rect x="145" y="145" width="12" height="18" rx="6" fill="#1A1D24"/>

  <!-- Wanderer Character (Wandering / Roaming Concept) -->
  <!-- Legs walking -->
  <path d="M105 155 L95 185 L88 188" stroke="#E67E22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M125 155 L135 182 L143 180" stroke="#D35400" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Torso & Coat -->
  <path d="M100 120 C95 125, 95 145, 102 160 L128 160 C135 145, 135 125, 130 120 Z" fill="#F39C12"/>
  
  <!-- Backpack / Traveler Pack -->
  <rect x="122" y="122" width="14" height="22" rx="4" fill="#3498DB"/>
  
  <!-- Head & Hat (Wide-brimmed sun hat) -->
  <circle cx="115" cy="105" r="11" fill="#F5CBA7"/>
  <ellipse cx="115" cy="98" rx="18" ry="4" fill="#E67E22"/>
  <path d="M115 94 C120 90, 125 92, 122 96 Z" fill="#D35400"/>

  <!-- Arms in motion (Relaxed strolling gesture) -->
  <path d="M105 125 L92 138 L88 148" stroke="#F39C12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M125 125 L138 135 L145 130" stroke="#F39C12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Scenic Accent: Warm Sun/Light beam in the sky -->
  <circle cx="180" cy="70" r="18" fill="#F1C40F" opacity="0.8"/>
  <path d="M170 50 L160 38" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M190 55 L202 45" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M162 70 L148 70" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>