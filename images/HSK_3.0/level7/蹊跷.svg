<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Glowing subtle mystery background effects -->
  <circle cx="120" cy="110" r="70" fill="#162032" opacity="0.6"/>
  <path d="M 80 150 L 160 150 L 170 170 L 70 170 Z" fill="#222B38"/>

  <!-- Magnifying glass representing investigation into anomalies -->
  <!-- Glass rim -->
  <circle cx="115" cy="105" r="45" fill="#1E2633" stroke="#FFA726" stroke-width="4"/>
  <!-- Lens reflection -->
  <path d="M 88 85 A 35 35 0 0 1 135 80" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Handle -->
  <rect x="142" y="132" width="12" height="45" rx="6" fill="#FFA726" transform="rotate(45 142 132)"/>
  <rect x="146" y="136" width="4" height="37" rx="2" fill="#FFB74D" opacity="0.5" transform="rotate(45 146 136)"/>

  <!-- Inside the lens: The Scale/Contrast Adjective Illustration (Anomalous element) -->
  <!-- Normal standard block -->
  <rect x="85" y="90" width="22" height="35" rx="3" fill="#607D8B"/>
  <circle cx="96" cy="102" r="3" fill="#37474F"/>
  <line x1="91" y1="114" x2="101" y2="114" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>

  <!-- Anomalous, exaggerated, out-of-place contrasting element (Floating key/puzzle piece with glow) -->
  <g transform="translate(112, 85)">
    <!-- Glow aura -->
    <circle cx="10" cy="10" r="18" fill="#FFA726" opacity="0.2"/>
    <!-- Suspicious floating key shifting reality -->
    <path d="M 4 16 L 10 10 L 18 18 L 22 14" stroke="#FFA726" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="4" cy="16" r="4" fill="none" stroke="#FFA726" stroke-width="3"/>
    <line x1="14" y1="14" x2="16" y2="12" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
    <line x1="17" y1="17" x2="19" y2="15" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Question mark subtle integration floating off-center to denote suspicion/oddity -->
  <path d="M 175 70 C 175 62 185 58 190 65 C 194 71 185 78 185 85" stroke="#90A4AE" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="185" cy="95" r="2" fill="#90A4AE"/>

  <!-- Floor/surface line -->
  <line x1="50" y1="170" cy="170" x2="190" y2="170" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

  <!-- Small abstract footprints/clues leading to the anomaly -->
  <ellipse cx="80" cy="175" rx="4" ry="2" fill="#37474F"/>
  <ellipse cx="95" cy="172" rx="4" ry="2" fill="#37474F"/>
  <ellipse cx="110" cy="175" rx="4" ry="2" fill="#FFA726" opacity="0.8"/>
</svg>