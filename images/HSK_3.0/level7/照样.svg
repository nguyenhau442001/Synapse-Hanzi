<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Visual Metaphor: Contrast & Invariance (Rain/Obstacle vs Unchanging Action) -->
  <!-- Background atmosphere: Drizzle / Rain streaks -->
  <g opacity="0.4" stroke="#4A5568" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="40" x2="20" y2="70"/>
    <line x1="60" y1="30" x2="50" y2="60"/>
    <line x1="90" y1="45" x2="80" y2="75"/>
    <line x1="150" y1="35" x2="140" y2="65"/>
    <line x1="180" y1="25" x2="170" y2="55"/>
    <line x1="210" y1="40" x2="200" y2="70"/>
  </g>

  <!-- Obstacle / Barrier representing the external adverse condition (Rain/Interruption) -->
  <path d="M 20 80 Q 120 60 220 80" fill="none" stroke="#2D3748" stroke-width="4" stroke-dasharray="4 4"/>

  <!-- Timeline / Progression Baseline showing continuity "Yêu cầu / Vẫn như cũ" -->
  <line x1="30" y1="180" x2="210" y2="180" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Parallel repeating activity blocks (The action proceeding 'as usual' despite conditions) -->
  <!-- Block 1: Past / Before condition -->
  <g transform="translate(50, 110)">
    <!-- Base platform -->
    <rect x="0" y="50" width="36" height="20" rx="4" fill="#374151"/>
    <!-- Action icon representation: Running/Moving figure or marker -->
    <circle cx="18" cy="25" r="12" fill="#E2E8F0"/>
    <path d="M12 42 L18 35 L24 42" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Arrow indicating progression / continuation -->
  <path d="M 98 140 L 118 140" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 112 134 L 118 140 L 112 146" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Block 2: Present / Exactly as usual (照样) -->
  <g transform="translate(130, 110)">
    <!-- Base platform accented to show persistence -->
    <rect x="0" y="50" width="36" height="20" rx="4" fill="#1E3A8A"/>
    <!-- Highlighted identical action icon -->
    <circle cx="18" cy="25" r="12" fill="#F59E0B"/>
    <path d="M12 42 L18 35 L24 42" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Checkmark overlay emphasizing "as before / unchanged" -->
    <circle cx="28" cy="12" r="8" fill="#10B981"/>
    <path d="M25 12 L27 14 L31 9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Future / Continuing projection -->
  <path d="M 178 140 L 194 140" stroke="#374151" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 2"/>
</svg>