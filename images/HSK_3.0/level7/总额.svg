<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed dark mode container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Decorative subtle background grid/glow elements for financial/tech context -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#2A303C" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#2A303C" stroke-width="1"/>

  <!-- Central Physical Object representing "总额" (Total Amount / Sum of Money) -->
  <!-- A sleek, modern treasure chest / secure vault box overflowing with golden currency coins -->

  <!-- Vault Shadow -->
  <ellipse cx="120" cy="190" rx="65" ry="12" fill="#111318"/>

  <!-- Vault Base (Dark Metallic Body) -->
  <path d="M 65 110 L 175 110 L 185 175 C 185 180, 180 185, 175 185 L 65 185 C 60 185, 55 180, 55 175 Z" fill="#252D3D"/>
  
  <!-- Vault Front Panel Highlight -->
  <path d="M 70 120 L 170 120 L 178 172 C 178 175, 175 178, 172 178 L 68 178 C 65 178, 62 175, 62 172 Z" fill="#1E2533"/>

  <!-- Metallic Rim/Edging -->
  <rect x="62" y="110" width="116" height="10" rx="3" fill="#384259"/>

  <!-- Vault Circular Dial / Lock in Center -->
  <circle cx="120" cy="150" r="16" fill="#384259"/>
  <circle cx="120" cy="150" r="12" fill="#F59E0B"/>
  <circle cx="120" cy="150" r="7" fill="#1E2533"/>
  <line x1="120" y1="143" x2="120" y2="157" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Vault Lid (Open, angled upward) -->
  <path d="M 60 105 L 180 105 L 170 80 L 70 80 Z" fill="#323D52"/>
  <path d="M 65 102 L 175 102 L 168 83 L 72 83 Z" fill="#252D3D"/>
  <rect x="110" y="99" width="20" height="6" rx="2" fill="#F59E0B"/>

  <!-- Overflowing Gold Coins (Representing the cumulative total amount / sum) -->
  <!-- Coin Stack 1 (Back left) -->
  <ellipse cx="90" cy="85" rx="14" ry="6" fill="#D97706"/>
  <path d="M 76 85 L 76 95 C 76 98, 104 98, 104 95 L 104 85 Z" fill="#B45309"/>
  <ellipse cx="90" cy="95" rx="14" ry="6" fill="#F59E0B"/>

  <!-- Coin Stack 2 (Back right) -->
  <ellipse cx="150" cy="85" rx="15" ry="6" fill="#D97706"/>
  <path d="M 135 85 L 135 96 C 135 99, 165 99, 165 96 L 165 85 Z" fill="#B45309"/>
  <ellipse cx="150" cy="96" rx="15" ry="6" fill="#F59E0B"/>

  <!-- Coin Stack 3 (Center peak - highest point symbolizing 'total' / 'maximum sum') -->
  <ellipse cx="120" cy="70" rx="18" ry="7" fill="#FBBF24"/>
  <path d="M 102 70 L 102 82 C 102 86, 138 86, 138 82 L 138 70 Z" fill="#D97706"/>
  <ellipse cx="120" cy="82" rx="18" ry="7" fill="#F59E0B"/>
  <path d="M 102 82 L 102 94 C 102 98, 138 98, 138 94 L 138 82 Z" fill="#B45309"/>
  <ellipse cx="120" cy="94" rx="18" ry="7" fill="#D97706"/>

  <!-- Loose Coins spilling out dynamically -->
  <ellipse cx="95" cy="110" rx="8" ry="4" fill="#FBBF24" transform="rotate(-15 95 110)"/>
  <ellipse cx="145" cy="108" rx="9" ry="4.5" fill="#F59E0B" transform="rotate(20 145 108)"/>
  <ellipse cx="110" cy="104" rx="7" ry="3.5" fill="#FBBF24"/>
  <ellipse cx="132" cy="103" rx="8" ry="4" fill="#FBBF24"/>

  <!-- Highlight Sparkles for Financial Value & Wealth -->
  <path d="M 120 48 L 122 55 L 129 57 L 122 59 L 120 66 L 118 59 L 111 57 L 118 55 Z" fill="#FBBF24"/>
  <path d="M 72 65 L 73 69 L 77 70 L 73 71 L 72 75 L 71 71 L 67 70 L 71 69 Z" fill="#FBBF24" opacity="0.8"/>
  <path d="M 168 65 L 169 69 L 173 70 L 169 71 L 168 75 L 167 71 L 163 70 L 167 69 Z" fill="#FBBF24" opacity="0.8"/>
</svg>