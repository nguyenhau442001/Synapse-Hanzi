<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background temple arch/window glow -->
  <path d="M120 45 C155 45 180 75 180 115 L180 195 L60 195 L60 115 C60 75 85 45 120 45 Z" fill="#222733"/>
  <circle cx="120" cy="115" r="50" fill="#2A3142" opacity="0.5"/>

  <!-- Incense burner / altar base element -->
  <rect x="70" y="195" width="100" height="8" rx="3" fill="#3A435E"/>
  <rect x="90" y="185" width="60" height="10" rx="2" fill="#4E5A7A"/>

  <!-- Monk character (Héshang) -->
  <!-- Robe (Kasaya / Monk robes in gold/orange accent) -->
  <!-- Outer robe shadow/base -->
  <path d="M90 120 C80 140 70 185 70 195 L170 195 C170 185 160 140 150 120 Z" fill="#D97706"/>
  <!-- Inner robe / draping -->
  <path d="M95 130 C90 150 85 180 82 195 L158 195 C155 180 150 150 145 130 Z" fill="#F59E0B"/>
  <path d="M120 125 L105 195 L135 195 Z" fill="#B45309" opacity="0.3"/>

  <!-- Neck and Shoulders -->
  <path d="M102 110 L138 110 L145 130 L95 130 Z" fill="#E2B494"/>

  <!-- Head (Shaolin/Buddhist monk with clean-shaven head and 3戒疤 burnt scars on top) -->
  <circle cx="120" cy="85" r="28" fill="#E2B494"/>
  
  <!-- Subtle head shadow for depth -->
  <path d="M105 65 C112 60 128 60 135 65 C142 75 145 90 140 100 C135 105 105 105 100 100 C95 90 98 75 105 65 Z" fill="#E2B494"/>

  <!-- 3 Incense scars (Jieba) on forehead -->
  <circle cx="116" cy="67" r="1.5" fill="#5C3A21"/>
  <circle cx="120" cy="65" r="1.5" fill="#5C3A21"/>
  <circle cx="124" cy="67" r="1.5" fill="#5C3A21"/>

  <!-- Serene closed eyes / meditative expression -->
  <path d="M110 83 Q114 86 118 83" fill="none" stroke="#5C3A21" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M122 83 Q126 86 130 83" fill="none" stroke="#5C3A21" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gentle peaceful mouth -->
  <path d="M117 96 Q120 98 123 96" fill="none" stroke="#5C3A21" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hands in meditation mudra (Dhyana Mudra) resting in lap -->
  <path d="M100 165 C100 155 140 155 140 165 C140 172 100 172 100 165 Z" fill="#E2B494"/>
  <!-- Thumb touching -->
  <ellipse cx="120" cy="162" rx="4" ry="3" fill="#D4A373"/>

  <!-- Mala prayer beads draped around neck / hands -->
  <path d="M105 112 C105 130 135 130 135 112" fill="none" stroke="#8A5A36" stroke-width="3" stroke-dasharray="2,5" stroke-linecap="round"/>
  <circle cx="120" cy="167" r="2.5" fill="#8A5A36"/>

  <!-- Ambient glowing temple atmosphere -->
  <circle cx="120" cy="115" r="95" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.15"/>
</svg>