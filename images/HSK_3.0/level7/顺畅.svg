<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Road Surface -->
  <path d="M0 140 L240 140 L240 180 L0 180 Z" fill="#2D3436"/>
  
  <!-- Lane Markings -->
  <rect x="0" y="158" width="20" height="4" fill="#F1C40F"/>
  <rect x="40" y="158" width="20" height="4" fill="#F1C40F"/>
  <rect x="80" y="158" width="20" height="4" fill="#F1C40F"/>
  <rect x="120" y="158" width="20" height="4" fill="#F1C40F"/>
  <rect x="160" y="158" width="20" height="4" fill="#F1C40F"/>
  <rect x="200" y="158" width="20" height="4" fill="#F1C40F"/>
  
  <!-- Car 1 -->
  <g transform="translate(30, 115)">
    <path d="M5 20 L45 20 L40 10 L15 10 Z" fill="#E67E22"/>
    <rect x="10" y="5" width="25" height="8" rx="2" fill="#3498DB"/>
    <circle cx="12" cy="22" r="5" fill="#7F8C8D"/>
    <circle cx="38" cy="22" r="5" fill="#7F8C8D"/>
  </g>
  
  <!-- Car 2 -->
  <g transform="translate(110, 115)">
    <path d="M5 20 L45 20 L40 10 L15 10 Z" fill="#F1C40F"/>
    <rect x="10" y="5" width="25" height="8" rx="2" fill="#3498DB"/>
    <circle cx="12" cy="22" r="5" fill="#7F8C8D"/>
    <circle cx="38" cy="22" r="5" fill="#7F8C8D"/>
  </g>
  
  <!-- Car 3 -->
  <g transform="translate(190, 115)">
    <path d="M5 20 L45 20 L40 10 L15 10 Z" fill="#E74C3C"/>
    <rect x="10" y="5" width="25" height="8" rx="2" fill="#3498DB"/>
    <circle cx="12" cy="22" r="5" fill="#7F8C8D"/>
    <circle cx="38" cy="22" r="5" fill="#7F8C8D"/>
  </g>
  
  <!-- Traffic Light Pole -->
  <rect x="115" y="40" width="10" height="80" fill="#7F8C8D"/>
  
  <!-- Traffic Light Box -->
  <rect x="105" y="20" width="30" height="80" rx="5" fill="#2C3E50"/>
  
  <!-- Green Light -->
  <circle cx="120" cy="80" r="10" fill="#2ECC71"/>
  
  <!-- Red/Yellow Lights (Off) -->
  <circle cx="120" cy="40" r="10" fill="#3E4B56"/>
  <circle cx="120" cy="60" r="10" fill="#3E4B56"/>
</svg>