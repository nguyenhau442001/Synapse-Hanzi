<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background structural grid/plan lines -->
  <g opacity="0.15" stroke="#4A5568" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="60" x2="200" y2="60" />
    <line x1="40" y1="120" x2="200" y2="120" />
    <line x1="40" y1="180" x2="200" y2="180" />
    <line x1="80" y1="40" x2="80" y2="200" />
    <line x1="140" y1="40" x2="140" y2="200" />
  </g>

  <!-- Central Physical Object: Blueprint / Strategic Master Plan (Physical Object representing "móuhuà" / Hoạch định, lên kế hoạch) -->
  <g transform="translate(35, 30)">
    <!-- Blueprint / Base Document Paper -->
    <rect x="15" y="10" width="140" height="150" rx="4" fill="#242938" stroke="#3B82F6" stroke-width="2"/>
    
    <!-- Architectural / Strategic grid lines inside blueprint -->
    <path d="M25 35 L75 35 M85 35 L145 35" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M25 50 L100 50" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Strategic Flowchart Nodes (Planning concept) -->
    <!-- Node 1 -->
    <rect x="25" y="70" width="35" height="25" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="42.5" cy="82.5" r="4" fill="#60A5FA"/>
    
    <!-- Connecting Arrow 1 -->
    <path d="M60 82.5 L80 82.5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <polygon points="80,80 86,82.5 80,85" fill="#F59E0B"/>

    <!-- Node 2 (Center Focus) -->
    <rect x="86" y="65" width="45" height="35" rx="3" fill="#1E3A8A" stroke="#F59E0B" stroke-width="2"/>
    <path d="M96 77 L121 77 M96 85 L114 85" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Connecting Arrow 2 -->
    <path d="M108 100 L108 118" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <polygon points="105,118 108,124 111,118" fill="#F59E0B"/>

    <!-- Node 3 -->
    <rect x="75" y="125" width="65" height="22" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="87" cy="136" r="3" fill="#60A5FA"/>
    <path d="M95 136 L130 136" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Drafting Tools resting on/around the plan (Emphasizing the physical action of strategizing/planning) -->
  <!-- Ruler -->
  <g transform="translate(18, 140) rotate(-25)">
    <rect x="0" y="0" width="110" height="16" rx="2" fill="#334155" stroke="#64748B" stroke-width="1"/>
    <!-- Ruler markings -->
    <line x1="10" y1="0" x2="10" y2="5" stroke="#94A3B8" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="8" stroke="#94A3B8" stroke-width="1"/>
    <line x1="30" y1="0" x2="30" y2="5" stroke="#94A3B8" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="8" stroke="#94A3B8" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="5" stroke="#94A3B8" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="8" stroke="#94A3B8" stroke-width="1"/>
    <line x1="70" y1="0" x2="70" y2="5" stroke="#94A3B8" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="8" stroke="#94A3B8" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="5" stroke="#94A3B8" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="8" stroke="#94A3B8" stroke-width="1"/>
  </g>

  <!-- Compass / Divider Tool (Precision planning tool) -->
  <g transform="translate(170, 70) rotate(15)">
    <!-- Main legs -->
    <line x1="20" y1="0" x2="0" y2="100" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="40" y2="100" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Hinge / Adjustment wheel -->
    <circle cx="20" cy="15" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="2" fill="#1A1D24"/>
    <!-- Metal points -->
    <circle cx="0" cy="100" r="2" fill="#CBD5E1"/>
    <circle cx="40" cy="100" r="2" fill="#CBD5E1"/>
  </g>

  <!-- High-contrast Golden/Orange Accent Marker Pen (Symbolizing precise crafting and planning) -->
  <g transform="translate(140, 160) rotate(-40)">
    <!-- Pen Body -->
    <rect x="0" y="0" width="70" height="12" rx="2" fill="#F59E0B"/>
    <!-- Pen Cap -->
    <rect x="50" y="0" width="20" height="12" rx="2" fill="#D97706"/>
    <!-- Pen Tip -->
    <polygon points="0,2 -8,6 0,10" fill="#1E293B"/>
    <!-- Clip -->
    <rect x="55" y="3" width="10" height="2" rx="1" fill="#FEF3C7"/>
  </g>
</svg>