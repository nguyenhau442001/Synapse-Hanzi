<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Road Base (Curved/Perspective Highway Segment) -->
    <path d="M 60 200 L 100 110 L 140 110 L 180 200 Z" fill="#282F3D" />
    
    <!-- Road Shoulders / Borders -->
    <path d="M 54 200 L 96 110" stroke="#3E4A61" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 186 200 L 144 110" stroke="#3E4A61" stroke-width="4" stroke-linecap="round" fill="none" />
    
    <!-- Focus Segment Brackets (Highlighting a specific "Section/段" of the road) -->
    <!-- Top section boundary line -->
    <line x1="97" y1="110" x2="143" y2="110" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <!-- Bottom section boundary line -->
    <line x1="70" y1="170" x2="170" y2="170" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />

    <!-- Dashed Center Divider -->
    <line x1="120" y1="120" x2="120" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 4" />
    <line x1="120" y1="145" x2="120" y2="160" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 4" />
    <line x1="120" y1="170" x2="120" y2="185" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 4" />

    <!-- Cars on the road (flat vector stylized) -->
    <!-- Car 1 (top, entering segment) -->
    <rect x="108" y="118" width="10" height="16" rx="3" fill="#3B82F6" />
    <rect x="109" y="120" width="8" height="4" rx="1" fill="#93C5FD" />
    
    <!-- Car 2 (middle, inside the highlighted segment) - Orange focus accent -->
    <rect x="114" y="145" width="12" height="18" rx="3.5" fill="#F59E0B" />
    <rect x="115" y="148" width="10" height="5" rx="1" fill="#FEF3C7" />
    <circle cx="120" cy="165" r="5" fill="#EF4444" opacity="0.8" /> <!-- Glow/Indicator -->

    <!-- Location Marker Pin indicating "Segment" -->
    <g transform="translate(120, 68)">
      <!-- Pin drop shadow -->
      <ellipse cx="0" cy="22" rx="6" ry="2" fill="#000000" opacity="0.4" />
      
      <!-- Pin Body -->
      <path d="M 0 -10 C -11 -10 -20 -1 -20 10 C -20 20 0 35 0 35 C 0 35 20 20 20 10 C 20 -1 11 -10 0 -10 Z" fill="#F59E0B" />
      
      <!-- Inner white dot -->
      <circle cx="0" cy="9" r="6" fill="#1A1D24" />
    </g>

    <!-- Side Brackets/Pointers accentuating the specific interval -->
    <!-- Left bracket -->
    <path d="M 64 110 L 56 110 L 56 140 L 52 140 L 56 140 L 56 170 L 64 170" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    
    <!-- Right bracket -->
    <path d="M 176 110 L 184 110 L 184 140 L 188 140 L 184 140 L 184 170 L 176 170" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  </g>
</svg>