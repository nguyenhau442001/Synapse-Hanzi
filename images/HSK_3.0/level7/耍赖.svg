<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle floor line for ground context -->
  <line x1="30" y1="185" x2="210" y2="185" stroke="#2C323D" stroke-width="3" stroke-linecap="round"/>

  <!-- Motion lines indicating kicking/tantrum action -->
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 65 145 C 55 140, 50 125, 45 110" />
    <path d="M 55 155 C 45 145, 38 135, 30 120" />
    <!-- Impact dust lines -->
    <path d="M 110 180 L 95 190" />
    <path d="M 125 182 L 135 192" />
  </g>

  <!-- Game/Rule reference element: A flipped game board or broken rule marker in background -->
  <g transform="translate(150, 90) rotate(15)" opacity="0.4">
    <rect x="0" y="0" width="45" height="45" rx="6" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="8" y1="8" x2="37" y2="37" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="37" y1="8" x2="8" y2="37" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Character 1: The "Shuailai" person (Cù nhầy / Ăn vạ - throwing a tantrum on the floor) -->
  <g id="tantrum-character">
    <!-- Body slumped / sitting on ground -->
    <path d="M 90 140 C 90 120, 105 110, 115 125 L 125 150 C 130 160, 135 175, 120 180 L 80 180 Z" fill="#3B82F6"/>
    
    <!-- Head tilted back in defiance / crying out -->
    <circle cx="105" cy="102" r="14" fill="#FDE047"/>
    <!-- Face detail: closed eyes in stubbornness -->
    <path d="M 100 100 L 105 103 M 110 100 L 115 103" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 105 108 Q 108 112 111 108" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms flailing / crossed stubbornly -->
    <path d="M 100 125 L 75 115" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    <path d="M 118 135 L 135 125" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>

    <!-- Legs kicking up in air (showing the "cù nhầy" action) -->
    <path d="M 120 175 L 90 155 L 70 145" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoe flying off for comedic "shuailai" effect -->
    <path d="M 60 138 C 55 135, 50 140, 53 145 Z" fill="#EF4444"/>
  </g>

  <!-- Character 2: The baffled opponent/observer (standing with arms crossed, pointing out the rule) -->
  <g id="observer-character">
    <!-- Legs -->
    <line x1="175" y1="185" x2="175" y2="145" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <line x1="195" y1="185" x2="195" y2="145" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Torso -->
    <path d="M 165 110 L 205 110 L 200 150 L 170 150 Z" fill="#94A3B8"/>
    
    <!-- Head looking down in disbelief -->
    <circle cx="185" cy="85" r="13" fill="#FDE047"/>
    <!-- Expression: raised eyebrow / exasperated -->
    <path d="M 179 82 L 184 81" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 187 81 L 192 82" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 183 91 L 187 91" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms crossed in disbelief / pointing down -->
    <path d="M 170 120 L 185 135 L 200 120" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Focus accent: A subtle golden rule indicator floating above, being ignored -->
  <g transform="translate(110, 45)">
    <circle cx="10" cy="10" r="12" fill="#F59E0B" opacity="0.2"/>
    <path d="M 5 10 L 9 14 L 16 7" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>