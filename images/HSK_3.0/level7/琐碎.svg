<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Central Composition: A cluster of scattered trivial items ("琐碎" - miscellaneous tiny objects/chores) -->
  
  <!-- Surface/Desk base line subtly indicating workspace -->
  <path d="M48 180 L192 180" stroke="#2D323E" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Scattered Small Objects Group -->
  <!-- 1. A small crumpled note / receipt -->
  <g transform="translate(65, 135) rotate(-15)">
    <path d="M0 0 L24 4 L22 28 L3 25 Z" fill="#94A3B8"/>
    <path d="M4 8 L18 9 M5 14 L15 15 M4 20 L12 21" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 2. A broken paperclip -->
  <g transform="translate(150, 140) rotate(40)">
    <path d="M0 0 C6 0 8 10 4 16 C2 19 -2 15 1 11" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 3. A stray button -->
  <g transform="translate(100, 155)">
    <circle cx="0" cy="0" r="8" fill="#64748B"/>
    <circle cx="0" cy="0" r="5" fill="#334155"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="-2.5" y1="2.5" x2="2.5" y2="-2.5" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- 4. A stray key (small task / minor detail) -->
  <g transform="translate(130, 105) rotate(-35)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M4 0 L18 0 M12 -3 L12 0 M15 -2 L15 0" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 5. A small sticky note (yellow accent) -->
  <g transform="translate(145, 75) rotate(12)">
    <rect x="0" y="0" width="30" height="26" rx="2" fill="#FBBF24"/>
    <path d="M6 7 L20 7 M6 13 L24 13 M6 19 L16 19" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 6. A pencil stub / tiny pen -->
  <g transform="translate(75, 80) rotate(-65)">
    <path d="M0 0 L16 0 L16 6 L0 6 Z" fill="#EF4444"/>
    <path d="M16 0 L22 3 L16 6 Z" fill="#FDE047"/>
    <path d="M22 3 L24 3 L22 4 Z" fill="#334155"/>
  </g>

  <!-- 7. A coin (petty cash / small detail) -->
  <g transform="translate(95, 110)">
    <circle cx="0" cy="0" r="9" fill="#EAB308"/>
    <circle cx="0" cy="0" r="6.5" fill="none" stroke="#CA8A04" stroke-width="1"/>
  </g>

  <!-- 8. Another small paperwork / form fragment -->
  <g transform="translate(55, 100) rotate(22)">
    <rect x="0" y="0" width="22" height="28" rx="1.5" fill="#E2E8F0"/>
    <line x1="4" y1="6" x2="14" y2="6" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="11" x2="18" y2="11" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="10" y2="16" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="15" cy="20" r="2.5" fill="#EF4444"/>
  </g>

  <!-- Focal Centerpiece: Magnifying glass inspecting the scattered petty items (representing patient handling of trivial matters) -->
  <g transform="translate(115, 115)">
    <!-- Glass Rim & Lens Area -->
    <circle cx="0" cy="0" r="34" fill="#0F172A" fill-opacity="0.6" stroke="#38BDF8" stroke-width="4"/>
    
    <!-- Lens highlight reflection -->
    <path d="M-20 -15 C-10 -25 10 -25 18 -15" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Magnifying Glass Handle -->
    <path d="M24 24 L48 48" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M24 24 L48 48" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3" fill="#38BDF8"/>
  </g>

</svg>