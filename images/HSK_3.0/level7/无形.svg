<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient Glow representing invisible influence ("无形" influence) -->
  <circle cx="120" cy="115" r="70" fill="#3B82F6" opacity="0.08"/>
  <circle cx="120" cy="115" r="45" fill="#3B82F6" opacity="0.12"/>

  <!-- Floor line -->
  <line x1="60" y1="185" x2="180" y2="185" stroke="#2D333B" stroke-width="2" stroke-linecap="round"/>

  <!-- Adult Elder Figure (Left) - Clear physical object/character -->
  <g transform="translate(75, 110)">
    <!-- Body / Torso -->
    <path d="M-12,75 L-15,42 C-15,35 -8,30 0,30 C8,30 15,35 15,42 L12,75 Z" fill="#2563EB"/>
    <!-- Head -->
    <circle cx="0" cy="16" r="11" fill="#E2E8F0"/>
    <!-- Hair / Subtle aging detail -->
    <path d="M-9,12 C-9,8 -5,6 0,6 C5,6 9,8 9,12" fill="#94A3B8"/>
    <!-- Posture / Standing stance -->
    <line x1="-6" y1="75" x2="-6" y2="45" stroke="#1E40AF" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="75" x2="6" y2="45" stroke="#1E40AF" stroke-width="4" stroke-linecap="round"/>
    <!-- Guiding arm gesture -->
    <path d="M12,40 L28,45" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Child Figure (Right) - Clear physical object/character -->
  <g transform="translate(150, 125)">
    <!-- Body / Torso -->
    <path d="M-10,60 L-12,35 C-12,28 -7,25 0,25 C7,25 12,28 12,35 L10,60 Z" fill="#F59E0B"/>
    <!-- Head -->
    <circle cx="0" cy="12" r="9" fill="#FDE68A"/>
    <!-- Legs -->
    <line x1="-5" y1="60" x2="-5" y2="38" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="5" y1="60" x2="5" y2="38" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Reaching arm -->
    <path d="M-10,32 L-24,35" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Invisible yet powerful guiding projection (Wuxing / 无形 - intangible silhouette/shadow casting forward) -->
  <g transform="translate(0, 0)" opacity="0.45">
    <!-- Stylized ethereal/intangible upright silhouette cast ahead, demonstrating intangible moral guidance -->
    <path d="M 140 100 Q 155 120 150 185 L 175 185 Q 185 120 160 90 Z" fill="url(#intangibleGradient)" />
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="intangibleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Focus Accent: Subtle golden guiding spark representing the powerful moral legacy -->
  <circle cx="165" cy="110" r="3" fill="#F59E0B"/>
  <circle cx="180" cy="95" r="2" fill="#F59E0B" opacity="0.7"/>
</svg>