<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Public Green Space (The Object) -->
  <rect x="40" y="140" width="160" height="40" rx="4" fill="#2D5A27"/>
  <circle cx="60" cy="120" r="15" fill="#4CAF50"/>
  <circle cx="100" cy="115" r="20" fill="#4CAF50"/>
  <circle cx="140" cy="120" r="15" fill="#4CAF50"/>
  <circle cx="180" cy="115" r="20" fill="#4CAF50"/>
  
  <!-- The Aggressor (Person) -->
  <g transform="translate(100, 80)">
    <path d="M20 60 L40 60 L35 100 L25 100 Z" fill="#E67E22"/>
    <circle cx="30" cy="45" r="15" fill="#F39C12"/>
    <rect x="25" y="60" width="10" height="30" fill="#F39C12"/>
  </g>
  
  <!-- The Illegal Enclosure (The Act of Forced Occupation) -->
  <path d="M70 140 L70 80 L170 80 L170 140" stroke="#E74C3C" stroke-width="6" fill="none" stroke-dasharray="8 4"/>
  <path d="M70 140 L170 140" stroke="#E74C3C" stroke-width="6" fill="none"/>
  
  <!-- Warning/Prohibition Sign (Visualizing the 'Illegal' aspect) -->
  <circle cx="170" cy="80" r="12" fill="#C0392B"/>
  <line x1="164" y1="74" x2="176" y2="86" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>