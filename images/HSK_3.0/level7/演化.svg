<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Graphical Representation of "演化" (Evolution / Paleontological transformation chain) -->
  <g transform="translate(0, 0)">
    <!-- Geological strata layers in background -->
    <path d="M 30 160 Q 120 170 210 155" stroke="#2A313C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 30 135 Q 120 145 210 130" stroke="#2A313C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 30 110 Q 120 120 210 105" stroke="#2A313C" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Connecting evolutionary pathway / timeline curve -->
    <path d="M 50 145 C 90 145, 95 95, 120 95 C 145 95, 150 70, 190 65" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4 4" fill="none" opacity="0.6"/>

    <!-- Stage 1: Ancient Dinosaur Skeletal Fragment (Left) -->
    <g transform="translate(45, 120)">
      <!-- Ground shadow -->
      <ellipse cx="15" cy="32" rx="16" ry="5" fill="#111318"/>
      <!-- Fossil stone block -->
      <path d="M 0 15 L 10 5 L 25 8 L 30 25 L 12 30 Z" fill="#2E3642" stroke="#3A4454" stroke-width="1.5"/>
      <!-- Rib/Spine bone fossil inside -->
      <path d="M 8 18 Q 15 10 22 20" stroke="#8C9BAE" stroke-width="3" stroke-linecap="round" fill="none"/>
      <line x1="12" y1="14" x2="10" y2="22" stroke="#8C9BAE" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="12" x2="17" y2="23" stroke="#8C9BAE" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Stage 2: Transitional Form / Feathered Dinosaur (Center) -->
    <g transform="translate(100, 80)">
      <!-- Ground shadow -->
      <ellipse cx="20" cy="42" rx="18" ry="6" fill="#111318"/>
      <!-- Body -->
      <ellipse cx="20" cy="25" rx="14" ry="10" fill="#3B82F6" transform="rotate(-15 20 25)"/>
      <!-- Head -->
      <circle cx="32" cy="14" r="6" fill="#3B82F6"/>
      <!-- Beak -->
      <polygon points="37,13 43,15 37,17" fill="#F59E0B"/>
      <!-- Tail with primitive feathers -->
      <path d="M 8 30 Q -2 38 -5 45 Q 2 40 10 33" fill="#60A5FA"/>
      <!-- Legs -->
      <line x1="15" y1="33" x2="12" y2="43" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="23" y1="33" x2="26" y2="43" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Wing/Feathers developing -->
      <path d="M 16 20 Q 25 15 28 25 Q 20 28 16 20" fill="#60A5FA"/>
    </g>

    <!-- Stage 3: Modern Avian / Bird (Right) -->
    <g transform="translate(165, 40)">
      <!-- Ground shadow -->
      <ellipse cx="25" cy="48" rx="15" ry="5" fill="#111318"/>
      <!-- Sleek body -->
      <ellipse cx="22" cy="26" rx="12" ry="8" fill="#10B981" transform="rotate(-10 22 26)"/>
      <!-- Head -->
      <circle cx="32" cy="16" r="5.5" fill="#10B981"/>
      <!-- Sharp beak -->
      <polygon points="37,15 43,16 37,18" fill="#F59E0B"/>
      <!-- Wing with dynamic sweep -->
      <path d="M 16 24 C 22 15, 30 18, 25 28 C 21 28, 18 27, 16 24 Z" fill="#34D399"/>
      <!-- Tail feathers -->
      <path d="M 10 28 L 0 33 L 5 25 Z" fill="#34D399"/>
      <!-- Elegant legs -->
      <line x1="18" y1="33" x2="16" y2="46" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="24" y1="32" x2="22" y2="46" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Progression direction indicators (subtle chevrons/nodes) -->
    <circle cx="92" cy="115" r="3" fill="#D97706"/>
    <circle cx="152" cy="78" r="3" fill="#D97706"/>
  </g>
</svg>