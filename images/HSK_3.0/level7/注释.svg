<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Open Classical Book/Manuscript -->
    <!-- Book Shadow -->
    <ellipse cx="120" cy="180" rx="75" ry="12" fill="#111318"/>
    
    <!-- Left Page -->
    <path d="M 50 70 Q 85 60 120 75 L 120 175 Q 85 160 50 170 Z" fill="#E2E8F0"/>
    <path d="M 55 75 Q 85 65 115 78 L 115 167 Q 85 157 55 165 Z" fill="#F8FAFC"/>
    
    <!-- Right Page -->
    <path d="M 120 75 Q 155 60 190 70 L 190 170 Q 155 160 120 175 Z" fill="#E2E8F0"/>
    <path d="M 125 78 Q 155 65 185 75 L 185 165 Q 155 157 125 167 Z" fill="#F8FAFC"/>
    
    <!-- Book Binding / Center Crease -->
    <path d="M 115 75 C 120 73 120 73 125 75 L 125 167 C 120 165 120 165 115 167 Z" fill="#CBD5E1"/>

    <!-- Main Text Lines (Simulated classical text on pages) -->
    <!-- Left Page Main Text -->
    <rect x="65" y="90" width="35" height="4" rx="2" fill="#94A3B8"/>
    <rect x="65" y="102" width="42" height="4" rx="2" fill="#64748B"/>
    <rect x="65" y="114" width="38" height="4" rx="2" fill="#94A3B8"/>
    
    <!-- Right Page Main Text -->
    <rect x="135" y="90" width="40" height="4" rx="2" fill="#64748B"/>
    <rect x="135" y="102" width="30" height="4" rx="2" fill="#94A3B8"/>
    
    <!-- DIVIDER LINE separating main text and annotation -->
    <line x1="135" y1="122" x2="175" y2="122" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- ANNOTATION / FOOTNOTE SECTION (Focus concept: 注释 - Detailed Explanations at the bottom) -->
    <!-- Highlighted background box for annotation on the right page -->
    <rect x="128" y="128" width="54" height="32" rx="4" fill="#FEF3C7" opacity="0.9"/>
    
    <!-- Annotation text lines (smaller, precise) -->
    <rect x="133" y="134" width="44" height="3" rx="1.5" fill="#D97706"/>
    <rect x="133" y="141" width="38" height="3" rx="1.5" fill="#B45309"/>
    <rect x="133" y="148" width="28" height="3" rx="1.5" fill="#B45309"/>

    <!-- MAGNIFYING GLASS / FOCUS ICON (Highlighting the annotation concept) -->
    <g transform="translate(138, 105)">
      <!-- Glass Shadow -->
      <circle cx="21" cy="21" r="16" fill="#000000" opacity="0.2"/>
      
      <!-- Lens Body -->
      <circle cx="20" cy="20" r="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
      <circle cx="20" cy="20" r="13" fill="#FEF3C7" opacity="0.4"/>
      
      <!-- Highlight Reflection -->
      <path d="M 12 12 Q 16 8 22 10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
      
      <!-- Handle -->
      <path d="M 8 32 L 1 39" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <circle cx="1" cy="39" r="2.5" fill="#F59E0B"/>
    </g>

    <!-- Pointer / Callout indicator connecting zoom to the annotation -->
    <path d="M 145 110 L 145 130" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round"/>
  </g>
</svg>