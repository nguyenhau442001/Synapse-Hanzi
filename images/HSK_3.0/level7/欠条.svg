<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/accent -->
  <circle cx="120" cy="120" r="70" fill="#252A34" opacity="0.6"/>

  <!-- Prominent IOU / Promissory Note (欠条) Graphic -->
  <g transform="translate(0, 5)">
    <!-- Paper Document Base -->
    <rect x="75" y="45" width="90" height="125" rx="4" fill="#F0F3F8"/>
    
    <!-- Paper Header Fold/Shadow -->
    <path d="M 145 45 L 165 65 L 145 65 Z" fill="#D5DCE5"/>
    <rect x="75" y="45" width="70" height="20" fill="#E2E8F0"/>
    
    <!-- Header Stamp / Seal (Red/Coral accent to draw focus) -->
    <circle cx="138" cy="125" r="14" fill="none" stroke="#FF5C5C" stroke-width="2.5" stroke-dasharray="3 1.5"/>
    <circle cx="138" cy="125" r="10" fill="#FF5C5C" opacity="0.15"/>
    <path d="M 132 125 L 136 129 L 145 120" fill="none" stroke="#FF5C5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neatly written text lines (Representing "字迹工整") -->
    <!-- Line 1: Title placeholder -->
    <rect x="90" y="55" width="40" height="4" rx="2" fill="#4A5568"/>
    
    <!-- Line 2 -->
    <rect x="88" y="75" width="64" height="3" rx="1.5" fill="#718096"/>
    
    <!-- Line 3 -->
    <rect x="88" y="87" width="52" height="3" rx="1.5" fill="#718096"/>
    
    <!-- Line 4 -->
    <rect x="88" y="99" width="58" height="3" rx="1.5" fill="#718096"/>

    <!-- Numerical amount line (Highlighted) -->
    <rect x="88" y="115" width="35" height="4" rx="2" fill="#FFB800"/>

    <!-- Signature line at bottom -->
    <line x1="88" y1="145" x2="125" y2="145" stroke="#A0AEC0" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="145" cy="143" r="5" fill="#4A5568"/>
    <path d="M 142 148 C 142 145, 148 145, 148 148" fill="none" stroke="#4A5568" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Elegant Fountain Pen resting neatly across the document -->
  <g transform="translate(0, 5) rotate(-25 120 135)">
    <!-- Pen Body -->
    <rect x="95" y="130" width="50" height="10" rx="3" fill="#3182CE"/>
    
    <!-- Gold Clip & Ring Accents -->
    <rect x="135" y="132" width="4" height="6" rx="1" fill="#FFB800"/>
    <rect x="100" y="130" width="3" height="10" fill="#FFB800"/>
    
    <!-- Pen Cap End -->
    <path d="M 95 130 C 92 130, 92 140, 95 140 Z" fill="#2B6CB0"/>
    
    <!-- Nib Section -->
    <path d="M 145 130 L 158 135 L 145 140 Z" fill="#CBD5E0"/>
    <!-- Nib Tip -->
    <circle cx="158" cy="135" r="1.5" fill="#FFB800"/>
  </g>
</svg>