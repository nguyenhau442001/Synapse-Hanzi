<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 120)">
    <!-- Subtle target/warning background glow or marker to emphasize eradication context -->
    <circle cx="0" cy="0" r="70" fill="#FF5252" opacity="0.08"/>
    <circle cx="0" cy="0" r="50" fill="#FF5252" opacity="0.12"/>
    
    <!-- Stylized Pest (害虫 - Destructive Bug/Caterpillar) -->
    <!-- Body segments -->
    <ellipse cx="-45" cy="15" rx="14" ry="12" fill="#E53935"/>
    <ellipse cx="-20" cy="5" rx="16" ry="14" fill="#E53935"/>
    <ellipse cx="5" cy="-2" rx="16" ry="14" fill="#E53935"/>
    <ellipse cx="30" cy="-8" rx="16" ry="14" fill="#E53935"/>
    
    <!-- Head -->
    <circle cx="58" cy="-14" r="15" fill="#C62828"/>
    
    <!-- Eyes -->
    <circle cx="62" cy="-18" r="4" fill="#FFFFFF"/>
    <circle cx="63" cy="-18" r="1.5" fill="#1A1D24"/>
    
    <!-- Antennae -->
    <path d="M 66 -26 Q 78 -38 72 -44" fill="none" stroke="#C62828" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 58 -28 Q 66 -42 58 -48" fill="none" stroke="#C62828" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Dorsal Spikes/Bristles (characteristic of harmful/toxic pests) -->
    <path d="M -45 3 Q -48 -6 -42 -8" fill="none" stroke="#FFCDD2" stroke-width="3" stroke-linecap="round"/>
    <path d="M -20 -9 Q -23 -18 -17 -20" fill="none" stroke="#FFCDD2" stroke-width="3" stroke-linecap="round"/>
    <path d="M 5 -16 Q 2 -25 8 -27" fill="none" stroke="#FFCDD2" stroke-width="3" stroke-linecap="round"/>
    <path d="M 30 -22 Q 27 -31 33 -33" fill="none" stroke="#FFCDD2" stroke-width="3" stroke-linecap="round"/>

    <!-- Little Legs -->
    <path d="M -48 27 L -54 39" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
    <path d="M -23 19 L -27 33" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
    <path d="M 2 12 L 0 27" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
    <path d="M 27 6 L 29 21" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Munching/Damage indicator (Leaf being eaten) -->
    <path d="M -75 40 Q -55 55 -30 45 Q -10 35 -30 20 Q -50 5 -75 40 Z" fill="#4CAF50" opacity="0.8"/>
    <!-- Bite mark cutout in leaf -->
    <path d="M 35 -15 Q 55 -5 45 15 Q 35 25 25 10 Z" fill="#1A1D24"/>
  </g>
</svg>