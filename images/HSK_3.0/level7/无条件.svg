<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(0, 0)">
    <!-- Shield / Protection Base representing absolute commitment -->
    <path d="M120 40 C120 40 165 50 180 65 C180 120 150 170 120 195 C90 170 60 120 60 65 C75 50 120 40 120 40 Z" fill="#222834" stroke="#3A4454" stroke-width="3"/>
    
    <!-- Central Pillar / Duty & Obedience Symbol (Solid monolithic anchor) -->
    <rect x="110" y="70" width="20" height="90" rx="4" fill="#4B5563"/>
    <rect x="95" y="150" width="50" height="14" rx="3" fill="#6B7280"/>
    <rect x="100" y="65" width="40" height="10" rx="2" fill="#6B7280"/>
    
    <!-- Bold Directive Arrow pointing straight, representing unhesitating compliance -->
    <path d="M120 85 L140 110 H130 V135 H110 V110 H100 Z" fill="#F59E0B"/>
    <circle cx="120" cy="110" r="4" fill="#1A1D24"/>

    <!-- Unconditional / Absolute Check Symbol (Integrated into the shield design at top) -->
    <circle cx="120" cy="65" r="8" fill="#10B981"/>
    <path d="M116 65 L119 68 L125 61" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>