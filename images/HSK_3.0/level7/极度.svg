<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow to emphasize extreme state -->
  <circle cx="120" cy="130" r="70" fill="#FF5252" opacity="0.08"/>

  <!-- Rescue worker character in extreme exhaustion (Noun/Person focus) -->
  <g transform="translate(0, 5)">
    <!-- Slumped Shoulders & Bent Back (Body silhouette) -->
    <!-- Rescue Uniform Torso (Dark Blue/Grey) -->
    <path d="M 85 130 C 85 110, 100 100, 120 100 C 140 100, 155 110, 155 130 L 165 175 C 165 178, 162 180, 158 180 L 82 180 C 78 180, 75 178, 75 175 Z" fill="#2C3E50"/>
    
    <!-- High-visibility safety vest straps (Orange/Gold accent) -->
    <path d="M 95 102 L 105 180" stroke="#FF9800" stroke-width="4" stroke-linecap="round"/>
    <path d="M 145 102 L 135 180" stroke="#FF9800" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="125" x2="150" y2="125" stroke="#FF9800" stroke-width="3"/>

    <!-- Head & Helmet (Slumped forward, completely drained) -->
    <g transform="translate(120, 85)">
      <!-- Helmet (Rescue orange with reflective stripe) -->
      <path d="M -25 -5 C -25 -22, -12 -30, 0 -30 C 12 -30, 25 -22, 25 -5 L 28 2 C 28 5, 25 7, 20 7 L -20 7 C -25 7, -28 5, -28 2 Z" fill="#FF7043"/>
      <rect x="-15" y="-12" width="30" height="4" rx="2" fill="#FFFFFF" opacity="0.9"/>
      
      <!-- Head silhouette drooping down -->
      <circle cx="0" cy="8" r="14" fill="#E0AC69"/>
      <!-- Closed exhausted eyes / brow furrow -->
      <path d="M -6 6 L -2 8" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
      <path d="M 2 8 L 6 6" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
      <!-- Exhaustion drop of sweat -->
      <path d="M 12 10 C 14 14, 12 17, 10 17 C 8 17, 6 14, 8 10 Z" fill="#4FC3F7" opacity="0.8"/>
    </g>

    <!-- Arms hanging limply down -->
    <!-- Left Arm -->
    <path d="M 87 115 C 75 130, 68 150, 65 165" fill="none" stroke="#2C3E50" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Arm holding a heavy rescue flashlight pointed downwards to the floor -->
    <path d="M 153 115 C 165 130, 172 150, 175 165" fill="none" stroke="#2C3E50" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Heavy Rescue Flashlight (Dropped/pointing down) -->
    <g transform="translate(178, 170) rotate(45)">
      <rect x="-4" y="-15" width="8" height="20" rx="3" fill="#B0BEC5"/>
      <path d="M -7 -15 L 7 -15 L 5 -22 L -5 -22 Z" fill="#37474F"/>
      <!-- Faint beam pointing to ground -->
      <path d="M -5 -22 L -25 15 L 25 15 L 5 -22 Z" fill="#FFF59D" opacity="0.15"/>
    </g>
    
    <!-- Legs / Kneeling slightly from extreme weight/fatigue -->
    <rect x="92" y="175" width="18" height="35" rx="6" fill="#1F2A36"/>
    <rect x="130" y="175" width="18" height="35" rx="6" fill="#1F2A36"/>
    
    <!-- Boots -->
    <path d="M 85 205 L 112 205 C 115 205, 115 212, 110 212 L 85 212 Z" fill="#37474F"/>
    <path d="M 128 205 L 155 205 C 160 205, 160 212, 155 212 L 128 212 Z" fill="#37474F"/>
  </g>

  <!-- Visual indicators of extreme state (Heavy burden/exhaustion lines, perfectly clean flat vector) -->
  <g opacity="0.4" stroke="#FF5252" stroke-width="2.5" stroke-linecap="round">
    <line x1="55" y1="95" x2="65" y2="105"/>
    <line x1="45" y1="120" x2="60" y2="120"/>
    <line x1="185" y1="95" x2="175" y2="105"/>
    <line x1="195" y1="120" x2="180" y2="120"/>
  </g>
</svg>