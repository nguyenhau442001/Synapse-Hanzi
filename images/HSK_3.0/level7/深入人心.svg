<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background City Silhouette (Subtle) -->
  <path d="M40 240 L40 180 L60 160 L80 180 L100 150 L120 170 L140 140 L160 160 L180 130 L200 150 L200 240 Z" fill="#2A2E38"/>
  
  <!-- Human Figure (The "Person" / Heart/Mind) -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-30 80 C-30 40, 30 40, 30 80 L30 120 L-30 120 Z" fill="#3D4451"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="25" fill="#F4F4F4"/>
    
    <!-- The "Deep" Action: Glowing/Bright idea entering the mind -->
    <circle cx="0" cy="10" r="15" fill="#1A1D24"/>
    <circle cx="0" cy="10" r="10" fill="#FFB347"/>
    
    <!-- Motion lines showing the concept entering the center -->
    <path d="M-60 10 L-35 10" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
    <path d="M-50 25 L-30 15" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
    <path d="M-50 -5 L-30 5" stroke="#FFB347" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Environmental Concept (Green Leaf) entering the person -->
  <path d="M-10 0 C-10 10, 10 10, 10 0 C10 -10, -10 -10, -10 0" fill="#2ECC71" transform="translate(80, 130)"/>
  <path d="M0 0 L0 -15" stroke="#2ECC71" stroke-width="3" transform="translate(80, 130)"/>
  
  <!-- Accent highlight for the "Deeply rooted" aspect -->
  <circle cx="120" cy="130" r="5" fill="#FFB347"/>
</svg>