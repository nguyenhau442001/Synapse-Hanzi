<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle glow/ambience -->
  <circle cx="120" cy="120" r="90" fill="#222733" opacity="0.5"/>

  <!-- Invoice document (left, slightly angled) -->
  <g transform="translate(60, 55) rotate(-6)">
    <rect x="-35" y="-45" width="70" height="90" rx="4" fill="#2E3544" stroke="#404B60" stroke-width="2"/>
    <!-- Document header line -->
    <rect x="-25" y="-30" width="30" height="6" rx="2" fill="#5A6782"/>
    <!-- Document rows -->
    <rect x="-25" y="-15" width="50" height="4" rx="2" fill="#3E495E"/>
    <rect x="-25" y="-5" width="40" height="4" rx="2" fill="#3E495E"/>
    <rect x="-25" y="5" width="45" height="4" rx="2" fill="#3E495E"/>
    <!-- Total highlight line -->
    <rect x="-25" y="20" width="25" height="5" rx="2" fill="#FFB020"/>
  </g>

  <!-- Bank statement document (right, slightly angled the other way) -->
  <g transform="translate(180, 55) rotate(6)">
    <rect x="-35" y="-45" width="70" height="90" rx="4" fill="#2E3544" stroke="#404B60" stroke-width="2"/>
    <!-- Document header line -->
    <rect x="-25" y="-30" width="20" height="6" rx="2" fill="#5A6782"/>
    <!-- Transaction rows -->
    <rect x="-25" y="-15" width="50" height="4" rx="2" fill="#3E495E"/>
    <rect x="-25" y="-5" width="45" height="4" rx="2" fill="#3E495E"/>
    <rect x="-25" y="5" width="50" height="4" rx="2" fill="#3E495E"/>
    <!-- Matching highlight line -->
    <rect x="-25" y="20" width="25" height="5" rx="2" fill="#10B981"/>
  </g>

  <!-- Connecting bridge / Overlay representing comparison -->
  <path d="M 85 55 Q 120 70 155 55" fill="none" stroke="#FFB020" stroke-width="3" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Central Magnifying Glass and Checkmark representing "核对" (verification/checking) -->
  <g transform="translate(120, 130)">
    <!-- Magnifying glass body -->
    <circle cx="-5" cy="-5" r="38" fill="#1A1D24" stroke="#FFB020" stroke-width="6"/>
    <circle cx="-5" cy="-5" r="32" fill="#252B38" opacity="0.9"/>
    
    <!-- Handle -->
    <path d="M 20 20 L 45 45" stroke="#FFB020" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Checkmark inside lens (Verification) -->
    <path d="M -20 -3 L -9 9 L 14 -14" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Financial accent elements (Coins / Check marks floating subtly) -->
  <circle cx="55" cy="175" r="8" fill="#FFB020" opacity="0.8"/>
  <text x="55" y="179" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1A1D24" text-anchor="middle">$</text>

  <circle cx="185" cy="175" r="8" fill="#10B981" opacity="0.8"/>
  <path d="M 181 175 L 184 178 L 190 172" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>