  <path d="M 100 102 Q 104 98 108 102" stroke="#2B2D42" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Warm smile -->
  <path d="M 96 112 Q 100 116 104 112" stroke="#D90429" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Hair -->
  <path d="M 82 102 C 82 90 90 88 100 88 C 110 88 118 90 118 102 Z" fill="#2B2D42"/>

  <!-- Customer (Right character) -->
  <!-- Body -->
