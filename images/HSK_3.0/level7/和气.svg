    <path d="M 120 75 L 122 80 L 127 82 L 122 84 L 120 89 L 118 84 L 113 82 L 118 80 Z" transform="scale(0.6) translate(80, 40)"/>
    <path d="M 145 85 L 146.5 88.5 L 150 90 L 146.5 91.5 L 145 95 L 143.5 91.5 L 140 90 L 143.5 88.5 Z" transform="scale(0.5) translate(140, 20)"/>
