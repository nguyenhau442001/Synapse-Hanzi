  <!-- Head & Welcoming expression -->
  <circle cx="165" cy="108" r="16" fill="#FCEADE"/>
  <!-- Happy eyes -->
  <circle cx="161" cy="105" r="1.5" fill="#2B2D42"/>
  <circle cx="171" cy="105" r="1.5" fill="#2B2D42"/>
  <!-- Smile -->
