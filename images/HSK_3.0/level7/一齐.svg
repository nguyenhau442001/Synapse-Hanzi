<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Track lines -->
  <path d="M40 160 L200 160 M40 180 L200 180" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Starting line -->
  <line x1="60" y1="140" x2="60" y2="200" stroke="#F59E0B" stroke-width="4" stroke-dasharray="6 4"/>
  
  <!-- Athletes (Representing "一齐" - simultaneous motion) -->
  <!-- Athlete 1 -->
  <g transform="translate(90, 150)">
    <circle cx="0" cy="-20" r="8" fill="#F59E0B"/>
    <path d="M-5 0 L-2 -10 M5 0 L2 -10 M-8 10 L0 0 L8 10" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Athlete 2 -->
  <g transform="translate(120, 150)">
    <circle cx="0" cy="-20" r="8" fill="#F59E0B"/>
    <path d="M-5 0 L-2 -10 M5 0 L2 -10 M-8 10 L0 0 L8 10" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Athlete 3 -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="-20" r="8" fill="#F59E0B"/>
    <path d="M-5 0 L-2 -10 M5 0 L2 -10 M-8 10 L0 0 L8 10" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Motion lines indicating simultaneous forward movement -->
  <path d="M170 150 L190 150 M175 145 L195 145 M175 155 L195 155" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Starting Gun Flash -->
  <circle cx="50" cy="120" r="12" fill="#F59E0B" opacity="0.3"/>
  <circle cx="50" cy="120" r="6" fill="#F59E0B"/>
</svg>