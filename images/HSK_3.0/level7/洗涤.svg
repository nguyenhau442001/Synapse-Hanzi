<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative bamboo silhouettes to match context -->
  <g opacity="0.15" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="20" x2="40" y2="220"/>
    <line x1="200" y1="30" x2="200" y2="210"/>
    <line x1="20" y1="100" x2="20" y2="220"/>
    <line x1="220" y1="50" x2="220" y2="200"/>
  </g>

  <!-- Central Object: Bamboo Water Fountain / Basin (Shishiodoshi / Suikinkutsu concept - representing cleansing, washing away restlessness, purity) -->
  <g transform="translate(0, 5)">
    <!-- Stone Basin / Vessel Base -->
    <path d="M 70 160 Q 70 190 120 190 Q 170 190 170 160 L 180 135 Q 180 125 170 125 L 70 125 Q 60 125 60 135 Z" fill="#2D3748"/>
    <!-- Vessel Rim / Opening -->
    <ellipse cx="120" cy="125" rx="50" ry="12" fill="#4A5568"/>
    <!-- Water surface inside basin -->
    <ellipse cx="120" cy="126" rx="44" ry="9" fill="#319795"/>
    <ellipse cx="115" cy="125" rx="25" ry="5" fill="#4FD1C5" opacity="0.6"/>

    <!-- Bamboo Spout (Shishiodoshi style) -->
    <!-- Main diagonal bamboo stalk -->
    <g transform="rotate(-15 140 90)">
      <rect x="130" y="50" width="20" height="90" rx="4" fill="#38A169"/>
      <!-- Bamboo nodes -->
      <rect x="128" y="70" width="24" height="6" rx="2" fill="#2F855A"/>
      <rect x="128" y="110" width="24" height="6" rx="2" fill="#2F855A"/>
    </g>

    <!-- Water Stream flowing down -->
    <path d="M 105 102 Q 108 114 112 124" fill="none" stroke="#63B3ED" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Ripples on water surface -->
    <ellipse cx="112" cy="125" rx="8" ry="3" fill="none" stroke="#EBF8FF" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="112" cy="125" rx="15" ry="5" fill="none" stroke="#EBF8FF" stroke-width="1" opacity="0.4"/>

    <!-- Splash droplets (cleansing effect) -->
    <circle cx="100" cy="120" r="2" fill="#90CDF4"/>
    <circle cx="124" cy="122" r="1.5" fill="#90CDF4"/>
    <circle cx="118" cy="117" r="1" fill="#EBF8FF"/>

    <!-- Floating Clean Leaf (Symbolizing purification and nature / bamboo context) -->
    <g transform="translate(130, 130) rotate(25)">
      <path d="M 0 0 Q 10 -8 18 -2 Q 10 6 0 0 Z" fill="#68D391"/>
      <path d="M 0 0 Q 8 -3 18 -2" fill="none" stroke="#2F855A" stroke-width="1"/>
    </g>
  </g>

  <!-- Accent glow / aura representing "thorough washing/cleansing" (gột rửa / thanh lọc) -->
  <circle cx="120" cy="125" r="75" fill="none" stroke="#4FD1C5" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="120" cy="125" r="85" fill="none" stroke="#63B3ED" stroke-width="1" opacity="0.2"/>
</svg>