<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk surface -->
  <rect x="40" y="170" width="160" height="10" rx="2" fill="#2D343E"/>
  
  <!-- The "苦心" (Deep effort/painstaking labor) visualization: 
       A teacher's desk at night, showing the result of "painstaking effort" 
       through a complex, meticulously crafted lesson plan document 
       and a warm desk lamp representing the long hours of dedication. -->
  
  <!-- Desk Lamp -->
  <path d="M160 170 L175 170 L170 120 L150 120 Z" fill="#4A5568"/>
  <path d="M140 110 L180 110 C185 110 185 100 180 100 L140 100 C135 100 135 110 140 110 Z" fill="#F6AD55"/>
  <circle cx="160" cy="105" r="5" fill="#FBD38D"/>
  
  <!-- The Lesson Plan (The "Heart" of the effort) -->
  <rect x="60" y="130" width="80" height="40" rx="2" fill="#E2E8F0"/>
  <line x1="70" y1="140" x2="130" y2="140" stroke="#A0AEC0" stroke-width="2"/>
  <line x1="70" y1="150" x2="130" y2="150" stroke="#A0AEC0" stroke-width="2"/>
  <line x1="70" y1="160" x2="100" y2="160" stroke="#A0AEC0" stroke-width="2"/>
  
  <!-- Pen/Tool representing the labor -->
  <path d="M145 165 L155 155 L158 158 L148 168 Z" fill="#F6AD55"/>
  
  <!-- Subtle glow on the paper to show focus -->
  <rect x="60" y="130" width="80" height="40" rx="2" fill="#F6AD55" fill-opacity="0.1"/>
</svg>