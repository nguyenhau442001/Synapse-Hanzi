<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Main Object: A high-quality, modern product (a smartphone) -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="80" height="140" rx="8" fill="#2D343E" stroke="#FFB84D" stroke-width="2"/>
    <rect x="10" y="15" width="60" height="110" rx="2" fill="#3D4754"/>
    
    <!-- Floating Property Indicators (Physical/Functional Attributes) -->
    <!-- Weight/Mass icon (cube) -->
    <rect x="-30" y="20" width="20" height="20" rx="2" fill="#FFB84D"/>
    
    <!-- Material/Texture icon (grid) -->
    <rect x="-30" y="60" width="20" height="20" rx="2" fill="#4D96FF"/>
    <path d="M-30 70 H-10 M-20 60 V80" stroke="#1A1D24" stroke-width="2"/>
    
    <!-- Value/Price icon (coin shape) -->
    <circle cx="110" cy="40" r="12" fill="#FFB84D"/>
    <circle cx="110" cy="40" r="6" fill="#1A1D24"/>
    
    <!-- Function icon (gear) -->
    <circle cx="110" cy="100" r="12" fill="#4D96FF"/>
    <circle cx="110" cy="100" r="4" fill="#1A1D24"/>
  </g>
  
  <!-- Connecting lines to show these are inherent attributes of the object -->
  <path d="M80 60 L60 30" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M80 80 L60 70" stroke="#4D96FF" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M160 60 L180 40" stroke="#FFB84D" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M160 100 L180 100" stroke="#4D96FF" stroke-width="2" stroke-dasharray="4 4"/>
</svg>