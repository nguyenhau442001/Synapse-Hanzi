<svg width="240" height="240" viewBox="0 0 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle glowing background horizon / deep space reference -->
  <circle cx="120" cy="130" r="70" fill="#222834" opacity="0.6"/>
  <path d="M 50 160 Q 120 180 190 160" stroke="#2F3644" stroke-width="2" fill="none"/>

  <!-- Conceptual Representation of "前无古人" (Pioneering space explorer stepping into uncharted territory) -->
  <!-- Deep Space Cosmic Background Elements -->
  <circle cx="75" cy="70" r="1.5" fill="#F39C12" opacity="0.8"/>
  <circle cx="165" cy="65" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="180" cy="100" r="1" fill="#F39C12" opacity="0.5"/>
  <circle cx="60" cy="115" r="1.5" fill="#FFFFFF" opacity="0.7"/>

  <!-- Uncharted Path / Infinite Horizon / Footprint or Ahead-of-Time element -->
  <!-- Glowing golden trail ahead representing the unprecedented path -->
  <path d="M 120 160 L 120 135" stroke="#F39C12" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4" opacity="0.5"/>

  <!-- Central Character: The Pioneer Astronaut (Representing the unprecedented human) -->
  <!-- Backpack / Life support -->
  <rect x="104" y="96" width="32" height="40" rx="6" fill="#BDC3C7"/>
  <rect x="110" y="102" width="20" height="12" rx="3" fill="#34495E"/>

  <!-- Body / Spacesuit -->
  <path d="M 98 136 C 98 126 108 122 120 122 C 132 122 142 126 142 136 L 146 160 C 146 163 143 166 140 166 L 100 166 C 97 166 94 163 94 160 Z" fill="#ECF0F1"/>
  
  <!-- Suit Accent Panels -->
  <path d="M 108 136 L 132 136 L 130 154 L 110 154 Z" fill="#34495E" opacity="0.15"/>
  <circle cx="120" cy="144" r="3" fill="#F39C12"/>

  <!-- Arms -->
  <path d="M 98 130 L 86 142 L 91 146 L 100 136 Z" fill="#ECF0F1"/>
  <path d="M 142 130 L 154 142 L 149 146 L 140 136 Z" fill="#ECF0F1"/>

  <!-- Helmet -->
  <circle cx="120" cy="98" r="18" fill="#ECF0F1"/>
  <!-- Visor with golden reflection (Classic space pioneer motif) -->
  <circle cx="123" cy="97" r="12" fill="#2C3E50"/>
  <path d="M 115 91 C 120 89 128 92 131 97 C 127 96 120 95 115 91 Z" fill="#F39C12" opacity="0.8"/>

  <!-- Legs -->
  <rect x="103" y="164" width="12" height="22" rx="4" fill="#BDC3C7"/>
  <rect x="125" y="164" width="12" height="22" rx="4" fill="#BDC3C7"/>

  <!-- Boot Soles -->
  <path d="M 99 184 L 117 184 L 117 188 C 117 190 115 192 113 192 L 101 192 C 99 192 99 190 99 188 Z" fill="#E67E22"/>
  <path d="M 123 184 L 141 184 L 141 188 C 141 190 139 192 137 192 L 125 192 C 123 192 123 190 123 188 Z" fill="#E67E22"/>

  <!-- Focus/Pioneering Symbol: Radiant Golden Star / Frontier Marker hovering above -->
  <path d="M 120 40 L 123.5 50.5 L 134 54 L 123.5 57.5 L 120 68 L 116.5 57.5 L 106 54 L 116.5 50.5 Z" fill="#F39C12"/>
  <!-- Star glow rays -->
  <line x1="120" y1="32" x2="120" y2="36" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="72" x2="120" y2="76" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  <line x1="98" y1="54" x2="102" y2="54" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="54" x2="142" y2="54" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
</svg>