<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative warmth/glow representing family reunion -->
  <circle cx="120" cy="120" r="70" fill="#2D221E" opacity="0.6"/>

  <!-- Character / Subject: Mother and Daughter embracing/holding hands (reflecting "老闺女的手") -->
  <g transform="translate(0, 15)">
    <!-- Older Woman (Mother) on the left -->
    <g id="mother">
      <!-- Body / Torso -->
      <path d="M 65 140 C 65 115, 85 115, 95 115 C 105 115, 115 125, 115 140 L 115 175 L 65 175 Z" fill="#3B5998"/>
      <!-- Head / Face -->
      <circle cx="90" cy="90" r="18" fill="#F4D0B3"/>
      <!-- Hair (Grey/White styled) -->
      <path d="M 72 88 C 72 75, 82 70, 95 72 C 105 73, 110 82, 108 92 C 100 86, 85 86, 72 88 Z" fill="#E0E0E0"/>
      <!-- Gentle expression / Eye -->
      <path d="M 85 92 Q 88 95 91 92" stroke="#553322" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Happy tear / Moved emotion -->
      <circle cx="93" cy="97" r="1.5" fill="#4DA6FF"/>
    </g>

    <!-- Daughter (闺女) on the right -->
    <g id="daughter">
      <!-- Body / Torso -->
      <path d="M 125 140 C 125 115, 140 115, 150 115 C 160 115, 175 115, 175 140 L 175 175 L 125 175 Z" fill="#D9534F"/>
      <!-- Head / Face -->
      <circle cx="150" cy="85" r="18" fill="#FCE4D6"/>
      <!-- Hair (Modern sleek style) -->
      <path d="M 132 80 C 132 65, 150 65, 168 75 C 168 95, 162 105, 162 105 C 162 105, 132 95, 132 80 Z" fill="#2C221E"/>
      <!-- Warm smile / Eye -->
      <path d="M 148 88 Q 152 91 155 88" stroke="#553322" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Connected Hands in the Center (Representing the prompt's core action) -->
    <g id="clasped-hands">
      <!-- Mother's Hand -->
      <path d="M 105 132 C 112 130, 118 132, 122 136" stroke="#F4D0B3" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Daughter's Hand holding back -->
      <path d="M 135 132 C 128 130, 122 132, 118 136" stroke="#FCE4D6" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Warm glow accent on hands -->
      <circle cx="120" cy="134" r="4" fill="#FFC107" opacity="0.8"/>
    </g>
  </g>

  <!-- Accent Focus: High-contrast gold warmth element symbolizing emotional bond -->
  <path d="M 120 40 C 135 25, 160 30, 165 50 C 170 70, 145 90, 120 105 C 95 90, 70 70, 75 50 C 80 30, 105 25, 120 40 Z" fill="none" stroke="#FFC107" stroke-width="1.5" opacity="0.25" stroke-dasharray="4 4"/>
</svg>