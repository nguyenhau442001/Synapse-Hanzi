<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative subtle elements -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#2A303C" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Conceptual illustration for "收敛" (restraint, pulling back, folding in arrogance/wildness) -->
  <!-- A central physical object/character scene: A stylized figure transitioning from an outward aggressive sprawl to an inward, composed, folded posture -->
  
  <g transform="translate(120, 125)">
    <!-- Outer dashed aura representing previous wild/arrogant energy fading -->
    <path d="M -50 -30 Q -70 -70 -30 -60" fill="none" stroke="#3A4454" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M 50 -30 Q 70 -70 30 -60" fill="none" stroke="#3A4454" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

    <!-- Body / Torso (composed, contained posture) -->
    <path d="M -22 15 C -22 -15 -12 -35 0 -35 C 12 -35 22 -15 22 15 L 26 50 L -26 50 Z" fill="#3B82F6"/>

    <!-- Head (bowed slightly downward in reflection/restraint) -->
    <circle cx="0" cy="-52" r="14" fill="#FDE047"/>
    <!-- Closed calm eye / modest expression -->
    <path d="M -4 -51 Q 0 -48 4 -51" fill="none" stroke="#1A1D24" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arms folded inward tightly (kiềm chế bớt, thu mình lại) -->
    <path d="M -20 -15 C -35 -10 -40 10 -15 20" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
    <path d="M 20 -15 C 35 -10 40 10 15 20" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>

    <!-- Hands overlapping inward -->
    <circle cx="-8" cy="16" r="5" fill="#FDE047"/>
    <circle cx="8" cy="16" r="5" fill="#FDE047"/>

    <!-- Base / Standing ground -->
    <ellipse cx="0" cy="55" r="35" fill="#2A303C"/>
  </g>

  <!-- High-contrast focus accent: Arrows pointing inward symbolizing convergence/restraint -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left inward arrow -->
    <path d="M 35 120 L 55 120 M 45 110 L 35 120 L 45 130"/>
    <!-- Right inward arrow -->
    <path d="M 205 120 L 185 120 M 195 110 L 205 120 L 195 130"/>
    <!-- Top downward restraint anchor -->
    <path d="M 120 35 L 120 50 M 112 42 L 120 35 L 128 42"/>
  </g>

</svg>