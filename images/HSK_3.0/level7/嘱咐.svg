<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Mother figure -->
  <g transform="translate(80, 80)">
    <circle cx="40" cy="30" r="15" fill="#E0E0E0"/>
    <path d="M25 50h30l-5 40h-20z" fill="#4A90E2"/>
    <path d="M30 50c0-10 10-15 10-15s10 5 10 15" fill="#E0E0E0"/>
    <path d="M20 60l-15 10" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Child figure -->
  <g transform="translate(130, 100)">
    <circle cx="20" cy="20" r="10" fill="#F5A623"/>
    <path d="M10 35h20l-2 30h-16z" fill="#F5A623"/>
    <path d="M15 35c0-8 5-10 5-10s5 2 5 10" fill="#F5A623"/>
    <path d="M30 45l15 5" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Interaction: Hand gesture of instruction -->
  <g transform="translate(105, 110)">
    <path d="M0 0c5-10 15-10 20 0" stroke="#E0E0E0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="0" r="3" fill="#E0E0E0"/>
  </g>

  <!-- Contextual element: School bag -->
  <rect x="160" y="140" width="25" height="30" rx="4" fill="#50E3C2"/>
  <path d="M165 140v-5a5 5 0 0 1 10 0v5" fill="none" stroke="#50E3C2" stroke-width="3"/>

  <!-- Ground line -->
  <path d="M40 180h160" stroke="#34495E" stroke-width="2" stroke-dasharray="4 4"/>
</svg>