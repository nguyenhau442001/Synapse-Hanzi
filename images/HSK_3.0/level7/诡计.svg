<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(60, 60)">
    <!-- Shadow/Masking element -->
    <path d="M120 40 L120 120 L40 120 Z" fill="#2D343E" opacity="0.5"/>
    
    <!-- The "Mask" representing the deceptive nature -->
    <path d="M40 40 L120 40 L80 100 Z" fill="#FFB84D"/>
    <path d="M80 100 L120 40 L120 120 Z" fill="#E69F2E"/>
    
    <!-- The "Dagger" hidden behind the mask -->
    <path d="M70 30 L75 100 L85 100 L90 30 Z" fill="#94A3B8"/>
    <path d="M65 30 L95 30 L80 15 Z" fill="#CBD5E1"/>
    
    <!-- Hand holding the mask -->
    <path d="M30 120 C 30 100, 50 90, 60 100 L 70 120 Z" fill="#FFD180"/>
    <path d="M20 130 L 60 130 L 55 150 L 25 150 Z" fill="#FFB84D"/>
  </g>
</svg>