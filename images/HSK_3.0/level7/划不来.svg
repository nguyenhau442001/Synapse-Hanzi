<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Person shivering in cold -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 20 L-20 60 L20 60 L20 20 Z" fill="#4A5568"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#A0AEC0"/>
    <!-- Scarf/Collar -->
    <path d="M-25 -5 L25 -5 L20 15 L-20 15 Z" fill="#E53E3E"/>
    <!-- Shivering lines -->
    <path d="M-40 -20 Q-30 -10 -40 0" stroke="#718096" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M40 -20 Q30 -10 40 0" stroke="#718096" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- The "Cost" (The bus fare coin) -->
  <g transform="translate(180, 60)">
    <circle cx="0" cy="0" r="20" fill="#ECC94B"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#B7791F" stroke-width="4"/>
    <!-- Crossed out symbol -->
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#E53E3E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Clock indicating long wait -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="25" fill="#2D3748" stroke="#4A5568" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="12" stroke="#A0AEC0" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>