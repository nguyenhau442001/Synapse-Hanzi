<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Stage floor -->
  <path d="M40 180 L200 180 L180 200 L60 200 Z" fill="#2D343E"/>
  
  <!-- Curtain -->
  <path d="M40 40 L40 180 L60 180 L60 60 L180 60 L180 180 L200 180 L200 40 Z" fill="#E67E22" opacity="0.8"/>
  
  <!-- Character 1 (The comedian) -->
  <g transform="translate(90, 90)">
    <circle cx="20" cy="30" r="15" fill="#F39C12"/>
    <path d="M10 45 L30 45 L25 80 L15 80 Z" fill="#F39C12"/>
    <path d="M5 45 L15 60 L20 55" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <path d="M15 70 Q20 75 25 70" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Character 2 (The straight man) -->
  <g transform="translate(130, 100)">
    <circle cx="20" cy="20" r="15" fill="#BDC3C7"/>
    <path d="M10 35 L30 35 L25 70 L15 70 Z" fill="#BDC3C7"/>
    <path d="M15 30 L25 30" stroke="#1A1D24" stroke-width="2" fill="none"/>
    <path d="M15 60 L25 60" stroke="#1A1D24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Spotlight effect -->
  <path d="M120 40 L80 200 L160 200 Z" fill="#FFFFFF" opacity="0.05"/>
</svg>