<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle background glow/environment for camping context -->
  <circle cx="120" cy="120" r="85" fill="#252A34" opacity="0.6"/>
  <path d="M70,185 L120,135 L170,185 Z" fill="#222732" opacity="0.4"/>
  <circle cx="165" cy="75" r="12" fill="#F39C12" opacity="0.15"/>
  
  <!-- Sleeping Bag (睡袋) - Centered Iconic Physical Object -->
  <g transform="translate(120, 120) rotate(-35) translate(-120, -120)">
    <!-- Main Bag Body (Mummy/Contoured style for outdoor adventure) -->
    <path d="M 95,50 
             Q 105,40 120,40 
             Q 135,40 145,50 
             L 155,80 
             Q 160,110 150,150 
             Q 140,190 120,205 
             Q 100,190 90,150 
             Q 80,110 85,80 Z" 
          fill="#3498DB"/>
          
    <!-- Quilting Baffles (Horizontal insulation compartments) -->
    <path d="M 88,85 Q 120,92 152,85" stroke="#2980B9" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 86,105 Q 120,114 154,105" stroke="#2980B9" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 86,125 Q 120,135 154,125" stroke="#2980B9" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 88,145 Q 120,156 152,145" stroke="#2980B9" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 92,165 Q 120,177 148,165" stroke="#2980B9" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 100,185 Q 120,195 140,185" stroke="#2980B9" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Hood Opening (Face area) -->
    <ellipse cx="120" cy="55" rx="16" ry="10" fill="#1E232A"/>
    
    <!-- Drawstring / Cinch Cord Detail around hood -->
    <path d="M 103,50 Q 120,62 137,50" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="60" r="2" fill="#E74C3C"/>

    <!-- Zipper Track (Diagonal/Side feature) -->
    <path d="M 145,70 L 138,170" stroke="#BDC3C7" stroke-width="3" stroke-dasharray="3,3" stroke-linecap="round" fill="none"/>
    
    <!-- Warmth Accent Icon (Subtle feather/warmth indicator integrated neatly) -->
    <path d="M 120,90 Q 127,100 120,110 Q 113,100 120,90 Z" fill="#F39C12" opacity="0.8"/>
  </g>

  <!-- Floating outdoor/lightweight accent elements (stars/sparkles for night/camping) -->
  <g fill="#F1C40F" opacity="0.6">
    <path d="M 50,70 L 52,76 L 58,78 L 52,80 L 50,86 L 48,80 L 42,78 L 48,76 Z"/>
    <path d="M 190,150 L 191,154 L 195,155 L 191,156 L 190,160 L 189,156 L 185,155 L 189,154 Z" transform="scale(0.8) translate(50, 20)"/>
  </g>
</svg>