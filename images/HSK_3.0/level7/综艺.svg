<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background Glow & Studio Lighting Effects -->
  <ellipse cx="120" cy="115" rx="85" ry="65" fill="#252A34" opacity="0.6"/>
  <circle cx="120" cy="110" r="50" fill="#313846" opacity="0.3"/>
  
  <!-- Studio Spotlights (Top Left & Top Right) -->
  <path d="M120 20 L80 90 L160 90 Z" fill="#F59E0B" opacity="0.05"/>
  <circle cx="120" cy="20" r="10" fill="#2E3646"/>
  <circle cx="120" cy="20" r="6" fill="#F59E0B"/>

  <!-- TV / Broadcasting Screen Frame (Central Object) -->
  <rect x="55" y="65" width="130" height="90" rx="12" fill="#222733" stroke="#3A4454" stroke-width="3"/>
  <rect x="63" y="73" width="114" height="74" rx="6" fill="#111418"/>
  
  <!-- TV Stand Base -->
  <path d="M95 155 L145 155 L155 163 L85 163 Z" fill="#3A4454"/>
  <rect x="108" y="155" width="24" height="8" fill="#4E5D73"/>

  <!-- Variety Show Screen Content (Gameshow elements: colorful stage lights, star, microphone, confetti) -->
  <clipPath id="screen-clip">
    <rect x="63" y="73" width="114" height="74" rx="6"/>
  </clipPath>
  
  <g clip-path="url(#screen-clip)">
    <!-- Stage Background Gradients -->
    <path d="M63 73 H177 V147 H63 Z" fill="#1A2130"/>
    
    <!-- Stage Floor / Perspective lines -->
    <path d="M63 130 L177 130 L190 147 H50 Z" fill="#242E42"/>
    <polygon points="120,105 105,130 135,130" fill="#EF4444" opacity="0.2"/>
    
    <!-- Dynamic Stage Light Beams -->
    <polygon points="63,73 90,130 110,130" fill="#3B82F6" opacity="0.15"/>
    <polygon points="177,73 150,130 130,130" fill="#EC4899" opacity="0.15"/>
    
    <!-- Floating Entertainment Icons inside Screen (Star, Music Note, Confetti) -->
    <!-- Star -->
    <path d="M120 85 L124.5 94.5 L135 96 L127.5 103.5 L129.5 114 L120 109 L110.5 114 L112.5 103.5 L105 96 L115.5 94.5 Z" fill="#F59E0B"/>
    
    <!-- Microphone (Central Icon for TV Show/Gameshow Host/Performances) -->
    <g transform="translate(120, 105) scale(0.9)">
      <rect x="-4" y="6" width="8" height="14" rx="2" fill="#94A3B8"/>
      <rect x="-6" y="20" width="12" height="4" rx="1" fill="#CBD5E1"/>
      <!-- Mic Head -->
      <path d="M -8 -2 C -8 -9, 8 -9, 8 -2 L 8 4 C 8 8, -8 8, -8 4 Z" fill="#38BDF8"/>
      <path d="M -5 -3 C -5 -7, 5 -7, 5 -3" stroke="#F0F9FF" stroke-width="1.5" fill="none"/>
      <!-- Stand / Handle -->
      <path d="M 0 8 L 0 16" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Confetti / Entertainment Sparks -->
    <circle cx="80" cy="90" r="2.5" fill="#EC4899"/>
    <circle cx="160" cy="95" r="2" fill="#3B82F6"/>
    <rect x="150" y="115" width="4" height="4" transform="rotate(45 152 117)" fill="#10B981"/>
    <rect x="85" y="120" width="3" height="5" transform="rotate(20 86.5 122.5)" fill="#F59E0B"/>
  </g>

  <!-- TV Antenna / Rabbit Ears (Classic Broadcast Symbol) -->
  <path d="M110 65 L85 35" stroke="#4E5D73" stroke-width="3" stroke-linecap="round"/>
  <circle cx="85" cy="35" r="3" fill="#F59E0B"/>
  <path d="M130 65 L155 35" stroke="#4E5D73" stroke-width="3" stroke-linecap="round"/>
  <circle cx="155" cy="35" r="3" fill="#F59E0B"/>

  <!-- Foreground Dimensional Pop-outs (Play / Entertainment Accents) -->
  <!-- Play Button Badge (Bottom Right Accent) -->
  <circle cx="178" cy="165" r="20" fill="#F59E0B" stroke="#1A1D24" stroke-width="4"/>
  <polygon points="173,155 187,165 173,175" fill="#1A1D24"/>

  <!-- Knowledge & Fun / Variety Sparkles (Left Accent) -->
  <g transform="translate(48, 115)">
    <circle cx="0" cy="0" r="14" fill="#252A34" stroke="#3A4454" stroke-width="2"/>
    <!-- Lightbulb/Idea Icon -->
    <path d="M0 -5 C -3.5 -5, -5 -3, -5 -1 C -5 1, -3 2, -2 4 L -2 6 L 2 6 L 2 4 C 3 2, 5 1, 5 -1 C 5 -3, 3.5 -5, 0 -5 Z" fill="#38BDF8"/>
    <rect x="-1.5" y="7" width="3" height="2" fill="#64748B"/>
  </g>
</svg>