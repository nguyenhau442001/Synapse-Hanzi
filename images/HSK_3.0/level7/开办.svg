<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background elements: Open door/portal frame -->
  <path d="M70 180V70c0-10 10-20 20-20h60c10 0 20 10 20 20v110" stroke="#3A414D" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Character: Instructor opening the class/door -->
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-20 60h40v-40c0-10-10-20-20-20s-20 10-20 20z" fill="#FFB84D"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="15" fill="#FFD699"/>
    <!-- Arm reaching out to open -->
    <path d="M-10 30 L-35 10" stroke="#FFB84D" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Motion lines indicating opening action -->
  <path d="M170 100 Q185 120 170 140" stroke="#FFB84D" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  
  <!-- Symbol of "Class/Training" (Books/Tools) -->
  <rect x="150" y="140" width="30" height="40" rx="2" fill="#4D94FF"/>
  <rect x="155" y="145" width="20" height="5" fill="#1A1D24"/>
  <rect x="155" y="155" width="20" height="5" fill="#1A1D24"/>
  
  <!-- Floor/Ground -->
  <path d="M40 180h160" stroke="#3A414D" stroke-width="4" stroke-linecap="round"/>
</svg>