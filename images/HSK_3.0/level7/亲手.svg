<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle desk surface -->
  <path d="M40 180 L200 180 L210 205 L30 205 Z" fill="#222630" opacity="0.8"/>
  
  <!-- Shadow of the card and hand -->
  <ellipse cx="120" cy="182" rx="65" ry="8" fill="#121418"/>
  
  <!-- Invitation Card (Object being created by hand) -->
  <g transform="translate(120, 115) rotate(-6)">
    <!-- Card Base -->
    <rect x="-45" y="-55" width="90" height="110" rx="4" fill="#F4F5F7" stroke="#E2E5EB" stroke-width="2"/>
    <!-- Gold border accent on card -->
    <rect x="-38" y="-48" width="76" height="96" rx="2" fill="none" stroke="#E5A93B" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Decorative lines representing text written "by hand" -->
    <line x1="-25" y1="-25" x2="25" y2="-25" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="-25" y1="-10" x2="15" y2="-10" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <line x1="-25" y1="5" x2="25" y2="5" stroke="#4A5568" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
    <line x1="-25" y1="20" x2="0" y2="20" stroke="#4A5568" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
    
    <!-- Wax seal accent -->
    <circle cx="20" cy="35" r="9" fill="#D9534F"/>
    <path d="M17 35 L19 37 L24 32" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stylus / Pen held actively writing -->
  <g transform="translate(140, 85) rotate(-35)">
    <!-- Pen body -->
    <rect x="-4" y="-50" width="8" height="70" rx="2" fill="#E5A93B"/>
    <path d="M-4 20 L0 32 L4 20 Z" fill="#2C3E50"/>
    <!-- Metallic clip -->
    <rect x="-1.5" y="-45" width="3" height="25" rx="1" fill="#FFF" opacity="0.5"/>
  </g>

  <!-- Human Hand ("亲手" - with one's own hands) -->
  <g transform="translate(120, 140)">
    <!-- Sleeve cuff -->
    <path d="M-60 65 L-25 45 L-10 65 L-45 85 Z" fill="#3B82F6"/>
    
    <!-- Palm and lower hand structure -->
    <path d="M-25 45 C-15 35 15 35 25 45 C35 55 40 75 25 85 C10 95 -20 90 -30 75 Z" fill="#EFA983"/>
    
    <!-- Fingers gripping from the side/back -->
    <!-- Index Finger pointing toward pen/card action -->
    <path d="M10 38 C25 25 42 35 35 50 C32 56 22 55 18 48 Z" fill="#EFA983"/>
    <path d="M-15 38 C-5 25 15 30 18 45 C12 48 0 45 -5 40 Z" fill="#EFA983"/>
    
    <!-- Thumb resting naturally -->
    <path d="M-22 55 C-35 60 -40 75 -25 80 C-18 82 -15 72 -18 65 Z" fill="#E59870"/>
  </g>
  
  <!-- Focus sparkle / Accent indicating personal touch and precision -->
  <g transform="translate(90, 75)" fill="#E5A93B">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
  </g>
</svg>