<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle ambient spotlight representing narrative focus -->
  <circle cx="120" cy="115" r="75" fill="#252B3B" opacity="0.6"/>

  <!-- Dramatic Stage Spotlight Cone (Top Down) -->
  <polygon points="120,20 60,200 180,200" fill="url(#spotlightGrad)" opacity="0.15"/>

  <defs>
    <linearGradient id="spotlightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="characterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="focusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Ground plane / Stage line -->
  <line x1="60" y1="200" x2="180" y2="200" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- The Protagonist Character (Main Character / Zhǔréngōng) -->
  <!-- Confident posture representing the determined civilian hero from the reference -->
  <g transform="translate(120, 115)">
    
    <!-- Torso -->
    <path d="M-16,35 L16,35 L22,75 L-22,75 Z" fill="url(#characterGrad)"/>
    
    <!-- Head & Hair -->
    <circle cx="0" cy="-5" r="16" fill="#F8FAFC"/>
    <path d="M-16,-8 C-16,-18 16,-18 16,-8 C16,-3 12,-12 0,-12 C-12,-12 -16,-3 -16,-8 Z" fill="#334155"/>

    <!-- Dynamic scarf / accent (representing passion/drive) -->
    <path d="M-12,20 Q0,26 14,22 L18,32 Q0,38 -16,32 Z" fill="url(#focusGrad)"/>

    <!-- Outstretched arm reaching upward/forward (symbolizing pursuing dreams) -->
    <path d="M16,40 Q32,25 38,15 L44,22 Q36,32 24,48 Z" fill="#F8FAFC"/>

    <!-- Back arm -->
    <path d="M-16,40 Q-24,50 -20,60" fill="none" stroke="#0284C7" stroke-width="6" stroke-linecap="round"/>

    <!-- Legs -->
    <path d="M-10,75 L-12,110 L-5,110 L-2,75 Z" fill="#1E293B"/>
    <path d="M10,75 L12,110 L5,110 L2,75 Z" fill="#1E293B"/>
  </g>

  <!-- Narrative Focus Halo / Creative Aura behind the protagonist -->
  <circle cx="120" cy="100" r="45" fill="none" stroke="url(#focusGrad)" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 120 100" to="360 120 100" dur="25s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Cinematic Star Elements (Representing Literature/Story/Art) -->
  <g fill="url(#focusGrad)">
    <!-- Star 1 -->
    <path d="M75,55 L77,63 L85,65 L77,67 L75,75 L73,67 L65,65 L73,63 Z" transform="scale(0.8) translate(15, -10)"/>
    <!-- Star 2 -->
    <path d="M165,85 L166.5,91 L172.5,92.5 L166.5,94 L165,100 L163.5,94 L157.5,92.5 L163.5,91 Z" transform="scale(0.9) translate(20, -5)"/>
  </g>

</svg>