<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desert background / Ground representation -->
  <path d="M 30,170 Q 120,150 210,170 L 220,195 Q 120,195 20,195 Z" fill="#2E2325" opacity="0.8"/>
  <path d="M 20,180 Q 120,165 220,180 L 220,205 Q 120,205 20,205 Z" fill="#D97706" opacity="0.3"/>
  
  <!-- Heat wave refraction lines rising from the ground -->
  <g opacity="0.4" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M 60,160 Q 65,140 55,120 Q 45,100 55,80"/>
    <path d="M 90,165 Q 100,145 90,125 Q 80,105 95,85"/>
    <path d="M 150,165 Q 140,145 150,125 Q 160,105 145,85"/>
    <path d="M 180,160 Q 175,140 185,120 Q 195,100 185,80"/>
  </g>
  
  <!-- The Mirage (幻影) - Central iconic object: A translucent, shimmering oasis structure/palm tree hovering above the horizon -->
  <g opacity="0.75">
    <!-- Mirage glow / atmospheric distortion aura -->
    <ellipse cx="120" cy="95" rx="55" ry="30" fill="#60A5FA" opacity="0.15"/>
    <ellipse cx="120" cy="95" rx="35" ry="18" fill="#93C5FD" opacity="0.2"/>

    <!-- Floating / shimmering Palm Tree (Mirage) -->
    <g transform="translate(120, 105)">
      <!-- Trunk fading out at the bottom -->
      <path d="M -3,25 Q -8,10 -2,-10 Q 0,-25 -2,-40" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" fill="none"/>
      
      <!-- Fronds (Glowing / Translucent blue-cyan tones) -->
      <path d="M -2,-40 C -25,-55 -35,-30 -45,-35 C -35,-20 -20,-30 -2,-40 Z" fill="#60A5FA" opacity="0.8"/>
      <path d="M -2,-40 C -20,-70 0,-65 2,-75 C 10,-60 -5,-55 -2,-40 Z" fill="#93C5FD" opacity="0.9"/>
      <path d="M -2,-40 C 25,-55 35,-30 45,-35 C 35,-20 20,-30 -2,-40 Z" fill="#38BDF8" opacity="0.8"/>
      <path d="M -2,-40 C 20,-20 40,-25 48,-15 C 30,-15 15,-25 -2,-40 Z" fill="#60A5FA" opacity="0.7"/>
    </g>

    <!-- Faint shimmering oasis pool beneath the mirage -->
    <ellipse cx="120" cy="115" rx="28" ry="8" fill="#38BDF8" opacity="0.4"/>
  </g>

  <!-- Solid real-world reference cactus on the ground (for contrast against the illusion) -->
  <g transform="translate(65, 135)">
    <path d="M 0,25 L 0,0 Q 0,-10 6,-10 Q 12,-10 12,0 L 12,25 Z" fill="#059669"/>
    <!-- Cactus arms -->
    <path d="M 0,10 Q -10,10 -10,0 Q -10,-8 -5,-8" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 12,5 Q 20,5 20,-3 Q 20,-12 15,-12" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sun high in the sky creating the heat -->
  <circle cx="190" cy="55" r="14" fill="#F59E0B" opacity="0.9"/>
  <circle cx="190" cy="55" r="22" fill="#F59E0B" opacity="0.2"/>

</svg>