<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Parking Zone Markings -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <rect x="40" y="160" width="160" height="40" rx="4"/>
    <line x1="80" y1="160" x2="80" y2="200"/>
    <line x1="120" y1="160" x2="120" y2="200"/>
    <line x1="160" y1="160" x2="160" y2="200"/>
  </g>

  <!-- Bicycle -->
  <g transform="translate(60, 90)">
    <!-- Wheels -->
    <circle cx="20" cy="60" r="12" fill="none" stroke="#FFB800" stroke-width="3"/>
    <circle cx="80" cy="60" r="12" fill="none" stroke="#FFB800" stroke-width="3"/>
    <!-- Frame -->
    <path d="M20 60 L50 60 L65 35 L80 60 M50 60 L65 35 L50 35 Z" fill="none" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
    <!-- Handlebar -->
    <path d="M60 35 L55 25" stroke="#FFB800" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Car -->
  <g transform="translate(110, 100)">
    <path d="M10 60 L70 60 L65 40 L50 30 L20 30 L5 40 Z" fill="#FFB800"/>
    <circle cx="20" cy="60" r="8" fill="#1A1D24" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="55" cy="60" r="8" fill="#1A1D24" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="25" y="35" width="20" height="15" fill="#1A1D24" opacity="0.3"/>
  </g>
</svg>