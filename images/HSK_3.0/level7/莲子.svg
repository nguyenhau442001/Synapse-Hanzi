<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background glow for focus -->
  <circle cx="120" cy="120" r="70" fill="#242B38" opacity="0.6"/>

  <!-- Lotus Seed / 莲子 Illustration -->
  <g transform="translate(120, 120)">
    
    <!-- Opened Lotus Seed Pod (Cross-section outline providing context) -->
    <path d="M -65,-25 C -75,-60 -35,-85 0,-85 C 45,-85 75,-55 65,-15 C 60,10 75,55 50,75 C 25,90 -25,90 -50,70 C -70,55 -55,10 -65,-25 Z" 
          fill="#2A3442" stroke="#3E4C63" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Internal seed cavities / shadows -->
    <circle cx="-25" cy="-30" r="16" fill="#1F2633"/>
    <circle cx="25" cy="-35" r="15" fill="#1F2633"/>
    <circle cx="-35" cy="20" r="15" fill="#1F2633"/>
    <circle cx="30" cy="25" r="17" fill="#1F2633"/>
    <circle cx="0" cy="-5" r="16" fill="#1F2633"/>

    <!-- Central Featured Lotus Seed (The Noun: liánzǐ) - Sleek modern vector style with warm gold/ivory tone -->
    <!-- Drop shadow for the main seed -->
    <ellipse cx="2" cy="5" rx="22" ry="26" fill="#101318" opacity="0.4"/>
    
    <!-- Main seed body -->
    <path d="M 0,-28 C 14,-28 23,-15 22,5 C 21,24 12,28 0,28 C -12,28 -21,24 -22,5 C -23,-15 -14,-28 0,-28 Z" 
          fill="url(#seedGradient)" stroke="#E5B25D" stroke-width="2"/>
    
    <!-- Seed highlight for 3D flat effect -->
    <path d="M -6,-18 C -2,-22 6,-18 10,-10 C 6,-6 0,-10 -6,-18 Z" 
          fill="#FFF4D6" opacity="0.5"/>

    <!-- Tiny green plumule / sprout hint (characteristic of fresh lotus seeds) -->
    <path d="M 0,-10 C 2,-16 7,-18 7,-18 C 7,-18 4,-12 1,-6 Z" fill="#78B159"/>

    <!-- Additional scattered seeds for richness -->
    <!-- Seed 2 (top left) -->
    <g transform="translate(-25, -30) scale(0.65)">
      <ellipse cx="0" cy="2" rx="22" ry="26" fill="url(#seedGradient)" stroke="#C89A47" stroke-width="2.5"/>
      <path d="M -6,-18 C -2,-22 6,-18 10,-10 C 6,-6 0,-10 -6,-18 Z" fill="#FFF4D6" opacity="0.5"/>
    </g>

    <!-- Seed 3 (top right) -->
    <g transform="translate(25, -35) scale(0.6)">
      <ellipse cx="0" cy="2" rx="22" ry="26" fill="url(#seedGradient)" stroke="#C89A47" stroke-width="2.5"/>
      <path d="M -6,-18 C -2,-22 6,-18 10,-10 C 6,-6 0,-10 -6,-18 Z" fill="#FFF4D6" opacity="0.5"/>
    </g>

    <!-- Seed 4 (bottom left) -->
    <g transform="translate(-35, 20) scale(0.6)">
      <ellipse cx="0" cy="2" rx="22" ry="26" fill="url(#seedGradient)" stroke="#C89A47" stroke-width="2.5"/>
    </g>

    <!-- Seed 5 (bottom right) -->
    <g transform="translate(30, 25) scale(0.7)">
      <ellipse cx="0" cy="2" rx="22" ry="26" fill="url(#seedGradient)" stroke="#C89A47" stroke-width="2.5"/>
      <path d="M -6,-18 C -2,-22 6,-18 10,-10 C 6,-6 0,-10 -6,-18 Z" fill="#FFF4D6" opacity="0.5"/>
    </g>

  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="seedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="50%" stop-color="#EED7A1"/>
      <stop offset="100%" stop-color="#D4B06A"/>
    </linearGradient>
  </defs>
</svg>