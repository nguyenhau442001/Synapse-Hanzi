<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle scientific grid/dots background in dark slate -->
  <g fill="#2A303C" opacity="0.4">
    <circle cx="40" cy="40" r="1.5"/>
    <circle cx="80" cy="40" r="1.5"/>
    <circle cx="120" cy="40" r="1.5"/>
    <circle cx="160" cy="40" r="1.5"/>
    <circle cx="200" cy="40" r="1.5"/>
    <circle cx="40" cy="80" r="1.5"/>
    <circle cx="80" cy="80" r="1.5"/>
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="160" cy="80" r="1.5"/>
    <circle cx="200" cy="80" r="1.5"/>
    <circle cx="40" cy="120" r="1.5"/>
    <circle cx="80" cy="120" r="1.5"/>
    <circle cx="120" cy="120" r="1.5"/>
    <circle cx="160" cy="120" r="1.5"/>
    <circle cx="200" cy="120" r="1.5"/>
    <circle cx="40" cy="160" r="1.5"/>
    <circle cx="80" cy="160" r="1.5"/>
    <circle cx="120" cy="160" r="1.5"/>
    <circle cx="160" cy="160" r="1.5"/>
    <circle cx="200" cy="160" r="1.5"/>
    <circle cx="40" cy="200" r="1.5"/>
    <circle cx="80" cy="200" r="1.5"/>
    <circle cx="120" cy="200" r="1.5"/>
    <circle cx="160" cy="200" r="1.5"/>
    <circle cx="200" cy="200" r="1.5"/>
  </g>

  <!-- Deep Sea Hydrothermal Vent context subtly integrated -->
  <path d="M 90 240 L 105 180 L 125 150 L 145 180 L 160 240 Z" fill="#242B38"/>
  <path d="M 115 240 L 120 200 L 130 170 L 140 200 L 145 240 Z" fill="#2E3846"/>
  <!-- Heat glow from vent -->
  <circle cx="125" cy="155" r="35" fill="#FF7733" opacity="0.12" filter="blur(8px)"/>

  <!-- Microorganism / Bacterium (Main Noun Focus) -->
  <g transform="translate(120, 110)">
    <!-- Outer glow / aura representing microscopic scale/energy -->
    <ellipse cx="0" cy="0" rx="64" ry="44" fill="#38BDF8" opacity="0.08" filter="blur(6px)"/>
    <ellipse cx="0" cy="0" rx="58" ry="38" fill="#38BDF8" opacity="0.15"/>
    
    <!-- Flagella (Tail strands) -->
    <path d="M 50 0 C 70 -15, 80 15, 95 -5 C 105 -20, 115 5, 125 -10" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 45 15 C 65 25, 75 40, 90 30 C 100 20, 115 35, 125 25" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Main Pill-shaped Bacterium Body -->
    <rect x="-45" y="-30" width="90" height="60" rx="30" fill="#0EA5E9"/>
    
    <!-- Inner translucent cytoplasm highlight -->
    <rect x="-40" y="-24" width="80" height="48" rx="24" fill="#38BDF8"/>
    
    <!-- Segment lines / surface details -->
    <path d="M -15 -30 L -15 30" stroke="#0284C7" stroke-width="2" opacity="0.4"/>
    <path d="M 15 -30 L 15 30" stroke="#0284C7" stroke-width="2" opacity="0.4"/>

    <!-- Internal Organelles / DNA strands (Gold/Orange accent for high-contrast focus) -->
    <!-- Plasmid rings -->
    <circle cx="-25" cy="-8" r="7" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="28" cy="10" r="9" fill="none" stroke="#F59E0B" stroke-width="3"/>
    
    <!-- Central coiled DNA strand -->
    <path d="M -8 -5 C -3 -15, 3 15, 8 5 C 11 -2, 14 -12, 18 -5" fill="none" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Ribosome dots -->
    <circle cx="-25" cy="14" r="2.5" fill="#FDE047"/>
    <circle cx="-10" cy="-18" r="2" fill="#FDE047"/>
    <circle cx="5" cy="18" r="2.5" fill="#FDE047"/>
    <circle cx="22" cy="-14" r="2" fill="#FDE047"/>
  </g>

  <!-- Floating secondary smaller microorganisms / Archaea (Deep sea context) -->
  <g transform="translate(60, 75)">
    <circle cx="0" cy="0" r="14" fill="#10B981" opacity="0.8"/>
    <circle cx="0" cy="0" r="10" fill="#34D399"/>
    <circle cx="-3" cy="-2" r="3" fill="#F59E0B"/>
    <path d="M 12 -5 C 20 -12, 25 -2, 32 -8" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(180, 145)">
    <ellipse rx="12" ry="8" fill="#8B5CF6" opacity="0.9" transform="rotate(30)"/>
    <ellipse rx="8" ry="5" fill="#A78BFA" transform="rotate(30)"/>
    <circle cx="1" cy="-1" r="2.5" fill="#FBBF24"/>
    <path d="M -12 2 C -20 8, -22 15, -30 12" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tiny floating nutrient/chemical particles (representing chemosynthesis context) -->
  <circle cx="95" cy="140" r="2" fill="#FBBF24" opacity="0.8"/>
  <circle cx="155" cy="85" r="1.5" fill="#FBBF24" opacity="0.7"/>
  <circle cx="75" cy="175" r="2.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="165" cy="180" r="2" fill="#10B981" opacity="0.7"/>
</svg>