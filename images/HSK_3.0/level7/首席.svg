<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Desk -->
  <rect x="40" y="150" width="160" height="15" rx="2" fill="#343A46"/>
  <rect x="50" y="165" width="10" height="30" fill="#2C313C"/>
  <rect x="180" y="165" width="10" height="30" fill="#2C313C"/>
  
  <!-- Chair (The "Chief" seat) -->
  <path d="M100 130 L140 130 L145 150 L95 150 Z" fill="#FFB84D"/>
  <rect x="105" y="100" width="30" height="30" rx="4" fill="#FFB84D"/>
  <rect x="115" y="150" width="10" height="40" fill="#343A46"/>
  
  <!-- Person (The Chief/Officer) -->
  <circle cx="120" cy="85" r="15" fill="#E0E0E0"/>
  <path d="M105 100 C105 110, 135 110, 135 100 L130 130 L110 130 Z" fill="#4A90E2"/>
  
  <!-- Desk items: Laptop -->
  <rect x="60" y="135" width="40" height="25" rx="2" fill="#7D8597"/>
  <rect x="65" y="138" width="30" height="18" fill="#1A1D24"/>
  
  <!-- Spotlight/Focus effect on the chair -->
  <ellipse cx="120" cy="130" rx="40" ry="15" fill="#FFB84D" opacity="0.15"/>
</svg>