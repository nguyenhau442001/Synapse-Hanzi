<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Central Scroll / Historical Document (representing the source/ancient records) -->
    <path d="M-60,-20 L-60,30 C-60,38 -45,45 -25,45 C-5,45 10,38 10,30 L10,-20 Z" fill="#2D333F"/>
    <rect x="-65" y="-30" width="10" height="60" rx="4" fill="#FFB74D"/>
    <rect x="5" y="-30" width="10" height="60" rx="4" fill="#FFB74D"/>
    <path d="M-55,-25 C-35,-20 -15,-20 5,-25 L5,25 C-15,30 -35,30 -55,25 Z" fill="#F4EDE2"/>
    
    <!-- Text lines on scroll -->
    <line x1="-42" y1="-12" x2="-15" y2="-12" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-42" y1="-2" x2="-8" y2="-2" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-42" y1="8" x2="-22" y2="8" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    <!-- Interconnected Network / Silk Road Veins (Mailing/System/Pathways - 脉络) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main glowing connecting path -->
      <path d="M10,-5 C35,-15 55,-35 85,-35" stroke="#FFA726" stroke-width="3.5" stroke-dasharray="4 3"/>
      <path d="M10,5 C45,15 65,35 95,30" stroke="#4DB6AC" stroke-width="3.5"/>
      <path d="M5,-15 C20,-45 50,-65 80,-70" stroke="#64B5F6" stroke-width="2.5"/>
      
      <!-- Branching structural lines representing system/arteries -->
      <path d="M55,-35 C65,-50 80,-60 100,-55" stroke="#FFA726" stroke-width="2"/>
      <path d="M65,35 C75,50 95,55 110,45" stroke="#4DB6AC" stroke-width="2"/>
    </g>

    <!-- Nodes / Connection points (Historical sites / Clues) -->
    <circle cx="10" cy="-5" r="4" fill="#FFB74D"/>
    <circle cx="10" cy="5" r="4" fill="#4DB6AC"/>
    <circle cx="55" cy="-35" r="5" fill="#FFA726"/>
    <circle cx="65" cy="35" r="5" fill="#4DB6AC"/>
    <circle cx="85" cy="-35" r="6" fill="#FFA726"/>
    <circle cx="95" cy="30" r="6" fill="#4DB6AC"/>
    <circle cx="80" cy="-70" r="4" fill="#64B5F6"/>
    <circle cx="100" cy="-55" r="4" fill="#FFA726"/>
    <circle cx="110" cy="45" r="4" fill="#4DB6AC"/>

    <!-- Magnifying glass examining the historical structure (Researching/Tracing) -->
    <g transform="translate(-15, 25)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#64B5F6" stroke-width="4"/>
      <circle cx="0" cy="0" r="20" fill="#1A1D24" fill-opacity="0.3"/>
      <line x1="15" y1="15" x2="32" y2="32" stroke="#64B5F6" stroke-width="5" stroke-linecap="round"/>
      <!-- Inner mapped connection visible through lens -->
      <path d="M-10,-5 L0,8 L10,-2" fill="none" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Decorative baseline/frame accent -->
  <line x1="40" y1="210" x2="200" y2="210" stroke="#2D333F" stroke-width="2" stroke-linecap="round"/>
</svg>