<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Office Environment Hints (Desks/Chairs representing the entanglements) -->
  <g opacity="0.3">
    <rect x="50" y="80" width="140" height="8" rx="4" fill="#4A5568"/>
    <rect x="70" y="88" width="12" height="60" rx="3" fill="#4A5568"/>
    <rect x="158" y="88" width="12" height="60" rx="3" fill="#4A5568"/>
    <!-- Tangling glowing threads of business commitments -->
    <path d="M 60 110 C 90 90, 100 130, 140 100 C 160 80, 180 120, 190 100" fill="none" stroke="#F6AD55" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M 50 130 C 80 150, 110 110, 150 140 C 170 150, 180 130, 200 140" fill="none" stroke="#ED8936" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Central Character slipping away (Tuōshēn: stepping out cleanly from constraints) -->
  <!-- Motion trails / afterimage left behind -->
  <g opacity="0.25" transform="translate(-15, 0)">
    <!-- Head -->
    <circle cx="115" cy="85" r="12" fill="#63B3ED"/>
    <!-- Torso in suit -->
    <path d="M 103 102 L 127 102 L 132 150 L 98 150 Z" fill="#4A5568"/>
    <!-- Arm reaching back -->
    <path d="M 105 110 L 85 130" stroke="#4A5568" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Main Active Character stepping forward into freedom/light -->
  <g transform="translate(15, -5)">
    <!-- Dynamic Shadow below -->
    <ellipse cx="110" cy="185" rx="35" ry="8" fill="#111318"/>

    <!-- Legs in stride -->
    <!-- Back leg -->
    <path d="M 100 145 L 85 180 L 75 180" stroke="#CBD5E0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front leg -->
    <path d="M 115 145 L 130 178 L 142 178" stroke="#E2E8F0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Torso (Professional suit jacket, breaking free) -->
    <path d="M 95 95 L 125 95 L 130 150 L 90 150 Z" fill="#3182CE"/>
    <!-- Suit lapels -->
    <path d="M 110 95 L 105 120 L 110 150 L 115 120 Z" fill="#2B6CB0"/>
    <path d="M 103 95 L 110 115 L 107 95 Z" fill="#EBF8FF"/>
    <path d="M 117 95 L 110 115 L 113 95 Z" fill="#EBF8FF"/>

    <!-- Head & Dynamic Hair (turning forward, escaping) -->
    <circle cx="110" cy="76" r="13" fill="#FEEBC8"/>
    <path d="M 97 73 C 97 65, 105 61, 115 63 C 123 65, 124 73, 124 73 C 124 73, 120 68, 110 67 C 102 66, 97 73, 97 73 Z" fill="#2D3748"/>

    <!-- Arms in dynamic motion (breaking through) -->
    <!-- Back arm -->
    <path d="M 95 105 L 75 125 L 70 120" stroke="#2B6CB0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Front arm reaching forward into open space -->
    <path d="M 125 105 L 145 115 L 158 110" stroke="#3182CE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="160" cy="109" r="4" fill="#FEEBC8"/>
  </g>

  <!-- Severed/Broken glowing constraint threads (symbolizing successfully breaking away) -->
  <g>
    <!-- Left broken thread -->
    <path d="M 70 120 C 80 115, 85 125, 92 120" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="120" r="3" fill="#F6AD55"/>

    <!-- Right broken thread -->
    <path d="M 148 115 C 140 125, 135 115, 128 122" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
    <circle cx="128" cy="122" r="3" fill="#F6AD55"/>
  </g>

  <!-- Visual Accent: Clean glowing exit path / open space ahead (Evening city lights / breakthrough concept) -->
  <g transform="translate(180, 50)" opacity="0.8">
    <circle cx="0" cy="30" r="16" fill="#F6AD55" opacity="0.15"/>
    <circle cx="0" cy="30" r="8" fill="#ED8936" opacity="0.3"/>
    <path d="M -5 26 L 3 30 L -5 34" fill="none" stroke="#FBD38D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(195, 100)" opacity="0.6">
    <circle cx="0" cy="20" r="12" fill="#F6AD55" opacity="0.15"/>
    <path d="M -3 17 L 3 20 L -3 23" fill="none" stroke="#FBD38D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>