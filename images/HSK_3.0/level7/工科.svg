<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle background grid/glow elements for technical context -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#2A313C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="60" fill="none" stroke="#2A313C" stroke-width="1"/>

  <!-- Central Technical Engineering Concept (Gōngkē / Engineering Field) -->
  <!-- Combining mechanical gear, circuit nodes, and structural drafting elements -->

  <!-- Outer Gear Structure -->
  <g transform="translate(120, 115)">
    <!-- Gear teeth -->
    <path d="M-12,-52 L12,-52 L14,-38 L-14,-38 Z" fill="#38bdf8"/>
    <path d="M-12,52 L12,52 L14,38 L-14,38 Z" fill="#38bdf8"/>
    <path d="M52,-12 L52,12 L38,14 L38,-14 Z" fill="#38bdf8"/>
    <path d="M-52,-12 L-52,12 L-38,14 L-38,-14 Z" fill="#38bdf8"/>
    
    <path d="M30,-41 L41,-30 L31,-20 L20,-31 Z" fill="#38bdf8"/>
    <path d="M-30,41 L-41,30 L-31,20 L-20,31 Z" fill="#38bdf8"/>
    <path d="M30,41 L41,30 L31,20 L20,31" transform="scale(1, -1)" fill="#38bdf8"/>
    <path d="M-30,41 L-41,30 L-31,20 L-20,31" transform="scale(-1, 1)" fill="#38bdf8"/>

    <!-- Gear Body -->
    <circle cx="0" cy="0" r="38" fill="#1E293B" stroke="#38bdf8" stroke-width="4"/>
    
    <!-- Inner Circuit / Technical Accents -->
    <circle cx="0" cy="0" r="26" fill="#0F172A"/>
    <path d="M-15,0 L15,0 M0,-15 L0,15" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-15" cy="0" r="3" fill="#f59e0b"/>
    <circle cx="15" cy="0" r="3" fill="#f59e0b"/>
    <circle cx="0" cy="-15" r="3" fill="#f59e0b"/>
    <circle cx="0" cy="15" r="3" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
  </g>

  <!-- Structural Drafting / Smart Manufacturing Accents (Overlays) -->
  <!-- Wrench / Tool symbol intersecting cleanly -->
  <g transform="translate(62, 145) rotate(-45)">
    <path d="M -6,-25 L 6,-25 L 8,15 L 0,25 L -8,15 Z" fill="#f59e0b" opacity="0.9"/>
    <circle cx="0" cy="-28" r="10" fill="none" stroke="#f59e0b" stroke-width="4"/>
  </g>

  <!-- Compass / Ruler drafting element -->
  <g transform="translate(178, 145) rotate(45)">
    <path d="M-4,-30 L4,-30 L6,25 L-6,25 Z" fill="#10b981" opacity="0.9"/>
    <circle cx="0" cy="-30" r="6" fill="#10b981"/>
  </g>

  <!-- Accent highlight nodes representing high-tech/smart manufacturing -->
  <circle cx="120" cy="42" r="4" fill="#38bdf8"/>
  <line x1="120" y1="46" x2="120" y2="60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2"/>

  <circle cx="65" cy="95" r="3" fill="#f59e0b"/>
  <circle cx="175" cy="95" r="3" fill="#10b981"/>

  <!-- Base platform line representing foundation/industry -->
  <path d="M 70,185 L 170,185" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M 90,193 L 150,193" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
</svg>