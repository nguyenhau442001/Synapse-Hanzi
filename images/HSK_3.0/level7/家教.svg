<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Table representing the home environment -->
  <rect x="40" y="160" width="160" height="12" rx="2" fill="#3B4252"/>
  <rect x="50" y="172" width="10" height="40" rx="2" fill="#3B4252"/>
  <rect x="180" y="172" width="10" height="40" rx="2" fill="#3B4252"/>
  
  <!-- Adult figure (Parent) -->
  <g transform="translate(60, 80)">
    <circle cx="30" cy="30" r="20" fill="#F9A825"/>
    <path d="M10 50 Q30 70 50 50" stroke="#F9A825" stroke-width="4" fill="none"/>
    <rect x="15" y="60" width="30" height="80" rx="5" fill="#F9A825"/>
    <!-- Hand gesture: Teaching/Guiding -->
    <path d="M45 80 L60 70" stroke="#F9A825" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Child figure (Student) -->
  <g transform="translate(130, 100)">
    <circle cx="25" cy="25" r="15" fill="#E0E0E0"/>
    <rect x="15" y="45" width="20" height="60" rx="4" fill="#E0E0E0"/>
    <!-- Posture: Attentive/Respectful -->
    <path d="M10 50 L5 70" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 50 L45 70" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Book representing education/nurturing -->
  <rect x="95" y="135" width="50" height="35" rx="3" fill="#FFB74D"/>
  <path d="M95 140 L145 140" stroke="#1A1D24" stroke-width="2"/>
  <path d="M100 150 L140 150" stroke="#1A1D24" stroke-width="1"/>
  <path d="M100 155 L140 155" stroke="#1A1D24" stroke-width="1"/>
  
  <!-- Visualizing "Nurturing/Guidance" - Subtle light accent -->
  <circle cx="120" cy="110" r="40" fill="none" stroke="#F9A825" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
</svg>