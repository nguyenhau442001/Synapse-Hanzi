<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Subtle ambient glow representing sunflower disk / harvest setting -->
  <circle cx="120" cy="120" r="80" fill="#252A36" opacity="0.6"/>

  <!-- Sunflower Head Cross-Section / Base Layer -->
  <circle cx="120" cy="120" r="64" fill="#3D2914"/>
  
  <!-- Outer rim representing the flower base -->
  <circle cx="120" cy="120" r="64" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Stylized Sunflower Seeds (籽) nestled in the center -->
  <!-- Center cluster -->
  <g transform="translate(120, 120)">
    <!-- Ring 3 (Outer) -->
    <ellipse cx="0" cy="-45" rx="6" ry="10" fill="#F59E0B" transform="rotate(0)"/>
    <ellipse cx="22" cy="-39" rx="6" ry="10" fill="#D97706" transform="rotate(30)"/>
    <ellipse cx="39" cy="-22" rx="6" ry="10" fill="#F59E0B" transform="rotate(60)"/>
    <ellipse cx="45" cy="0" rx="6" ry="10" fill="#B45309" transform="rotate(90)"/>
    <ellipse cx="39" cy="22" rx="6" ry="10" fill="#F59E0B" transform="rotate(120)"/>
    <ellipse cx="22" cy="39" rx="6" ry="10" fill="#D97706" transform="rotate(150)"/>
    <ellipse cx="0" cy="45" rx="6" ry="10" fill="#F59E0B" transform="rotate(180)"/>
    <ellipse cx="-22" cy="39" rx="6" ry="10" fill="#B45309" transform="rotate(210)"/>
    <ellipse cx="-39" cy="22" rx="6" ry="10" fill="#F59E0B" transform="rotate(240)"/>
    <ellipse cx="-45" cy="0" rx="6" ry="10" fill="#D97706" transform="rotate(270)"/>
    <ellipse cx="-39" cy="-22" rx="6" ry="10" fill="#F59E0B" transform="rotate(300)"/>
    <ellipse cx="-22" cy="-39" rx="6" ry="10" fill="#B45309" transform="rotate(330)"/>

    <!-- Ring 2 (Middle) -->
    <ellipse cx="0" cy="-25" rx="5" ry="9" fill="#FBBF24" transform="rotate(15)"/>
    <ellipse cx="17" cy="-17" rx="5" ry="9" fill="#F59E0B" transform="rotate(45)"/>
    <ellipse cx="25" cy="0" rx="5" ry="9" fill="#D97706" transform="rotate(75)"/>
    <ellipse cx="17" cy="17" rx="5" ry="9" fill="#FBBF24" transform="rotate(105)"/>
    <ellipse cx="0" cy="25" rx="5" ry="9" fill="#F59E0B" transform="rotate(135)"/>
    <ellipse cx="-17" cy="17" rx="5" ry="9" fill="#D97706" transform="rotate(165)"/>
    <ellipse cx="-25" cy="0" rx="5" ry="9" fill="#FBBF24" transform="rotate(195)"/>
    <ellipse cx="-17" cy="-17" rx="5" ry="9" fill="#F59E0B" transform="rotate(225)"/>

    <!-- Ring 1 (Inner core) -->
    <ellipse cx="0" cy="-10" rx="4" ry="7" fill="#FDE68A" transform="rotate(40)"/>
    <ellipse cx="7" cy="-7" rx="4" ry="7" fill="#FBBF24" transform="rotate(80)"/>
    <ellipse cx="10" cy="0" rx="4" ry="7" fill="#F59E0B" transform="rotate(120)"/>
    <ellipse cx="7" cy="7" rx="4" ry="7" fill="#FDE68A" transform="rotate(160)"/>
    <ellipse cx="0" cy="10" rx="4" ry="7" fill="#FBBF24" transform="rotate(200)"/>
    <ellipse cx="-7" cy="7" rx="4" ry="7" fill="#F59E0B" transform="rotate(240)"/>
    <ellipse cx="-10" cy="0" rx="4" ry="7" fill="#FDE68A" transform="rotate(280)"/>
    <ellipse cx="-7" cy="-7" rx="4" ry="7" fill="#FBBF24" transform="rotate(320)"/>
    
    <!-- Absolute center seed -->
    <circle cx="0" cy="0" r="4" fill="#FDE68A"/>
  </g>

  <!-- Highlight / Focal Floating Seed (representing the "Zǐ" noun object clearly detached for emphasis) -->
  <g transform="translate(182, 62) rotate(25)">
    <!-- Shadow for floating effect -->
    <ellipse cx="2" cy="16" rx="10" ry="4" fill="#000000" opacity="0.4"/>
    <!-- Seed Body -->
    <path d="M 0,-14 C 8,-14 14,-6 10,8 C 7,16 0,18 -4,14 C -9,9 -8,-2 -4,-10 C -2,-13 0,-14 0,-14 Z" fill="#F59E0B"/>
    <!-- Seed Highlight Line -->
    <path d="M -1,-10 C 2,-8 5,0 3,8" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Secondary Floating Seed (balanced composition) -->
  <g transform="translate(62, 178) rotate(-35)">
    <ellipse cx="1" cy="12" rx="8" ry="3" fill="#000000" opacity="0.3"/>
    <path d="M 0,-11 C 6,-11 11,-4 8,6 C 5,12 0,13 -3,10 C -7,6 -6,-1 -3,-8 C -1,-10 0,-11 0,-11 Z" fill="#D97706"/>
    <path d="M -1,-8 C 1,-6 4,0 2,6" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>