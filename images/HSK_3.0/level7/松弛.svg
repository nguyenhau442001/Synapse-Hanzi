<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  <g transform="translate(120, 120)">
    <!-- Body -->
    <path d="M-40 20 C-40 60, 40 60, 40 20 L 30 -20 C 30 -50, -30 -50, -30 -20 Z" fill="#F4A261"/>
    <!-- Head -->
    <circle cx="0" cy="-60" r="30" fill="#F4A261"/>
    <!-- Relaxed Eyes -->
    <path d="M-15 -65 L-5 -65 M5 -65 L15 -65" stroke="#1A1D24" stroke-width="3" stroke-linecap="round"/>
    <!-- Relaxed Mouth -->
    <path d="M-10 -45 Q0 -40 10 -45" stroke="#1A1D24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Relaxed Arms (Slumped) -->
    <path d="M-40 10 L-60 40" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 10 L60 40" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
    <!-- Relaxed Legs (Crossed/Loose) -->
    <path d="M-20 60 L-30 100" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 60 L10 100" stroke="#F4A261" stroke-width="12" stroke-linecap="round"/>
    <!-- Chair/Seat -->
    <path d="M-50 100 L50 100 L40 115 L-40 115 Z" fill="#E9C46A"/>
  </g>
</svg>