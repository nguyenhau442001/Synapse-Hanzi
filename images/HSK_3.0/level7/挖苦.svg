<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Character 1 (The one being mocked) -->
  <g transform="translate(60, 120)">
    <circle cx="20" cy="-30" r="15" fill="#FFB74D"/>
    <path d="M10 -15 L30 -15 L25 20 L15 20 Z" fill="#4FC3F7"/>
    <path d="M15 20 L10 50 M25 20 L30 50" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 -5 L5 10 M30 -5 L35 10" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="-35" r="2" fill="#1A1D24"/>
    <circle cx="25" cy="-35" r="2" fill="#1A1D24"/>
    <path d="M15 -25 Q20 -28 25 -25" stroke="#1A1D24" stroke-width="1" fill="none"/>
  </g>

  <!-- Character 2 (The mocker) -->
  <g transform="translate(140, 120)">
    <circle cx="20" cy="-30" r="15" fill="#E57373"/>
    <path d="M10 -15 L30 -15 L25 20 L15 20 Z" fill="#90A4AE"/>
    <path d="M15 20 L10 50 M25 20 L30 50" stroke="#90A4AE" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 -10 L-5 -20 M35 -10 L45 -20" stroke="#90A4AE" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="-35" r="2" fill="#1A1D24"/>
    <circle cx="25" cy="-35" r="2" fill="#1A1D24"/>
    <path d="M15 -25 Q20 -22 25 -25" stroke="#1A1D24" stroke-width="1" fill="none"/>
  </g>

  <!-- Speech Bubble representing the mocking tone -->
  <path d="M130 70 L100 90 L130 90 Z" fill="#E57373"/>
  <path d="M130 60 L180 60 Q190 60 190 70 L190 90 Q190 100 180 100 L140 100 L130 110 L130 70" fill="#E57373"/>
  
  <!-- Sharp zig-zag lines inside bubble to represent biting/sarcastic tone -->
  <path d="M145 75 L155 85 L165 75 L175 85" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>