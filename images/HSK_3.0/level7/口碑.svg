<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background decorative glow -->
  <circle cx="120" cy="120" r="80" fill="#242B38" opacity="0.6"/>

  <!-- Stylized Ancient Stone Stele (Bia miệng / Kǒubēi) representing Reputation/Public Praise -->
  <g transform="translate(0, 0)">
    <!-- Stele Base/Pedestal -->
    <path d="M 85 190 L 155 190 L 165 202 L 75 202 Z" fill="#4A5568"/>
    <rect x="92" y="184" width="56" height="6" fill="#718096" rx="2"/>

    <!-- Stele Main Body -->
    <path d="M 85 55 L 155 55 Q 160 55 160 60 L 160 184 L 80 184 L 80 60 Q 80 55 85 55 Z" fill="#2D3748"/>
    <path d="M 83 57 L 157 57 Q 161 57 161 61 L 161 182 L 79 182 L 79 61 Q 79 57 83 57 Z" fill="#3B4252"/>

    <!-- Stele Inner Border / Carved Surface -->
    <rect x="92" y="68" width="56" height="102" rx="3" fill="#1E2430"/>

    <!-- Decorative Top Crest on Stele -->
    <path d="M 95 55 L 145 55 L 140 45 L 100 45 Z" fill="#4A5568"/>
  </g>

  <!-- Golden Word/Mouth & Soundwave Symbols (representing "口碑" - word of mouth / public praise) -->
  <g transform="translate(120, 112)">
    <!-- Central Speech / Mouth Iconographic element in Gold -->
    <path d="M -16 -8 C -16 -16 -8 -20 0 -20 C 8 -20 16 -16 16 -8 C 16 -2 11 4 5 7 L 5 12 L -5 12 L -5 7 C -11 4 -16 -2 -16 -8 Z" fill="#F6AD55"/>
    <circle cx="0" cy="-8" rx="6" ry="6" fill="#1E2430"/>

    <!-- Radiating Soundwaves / Word of Mouth ripples (Left and Right) -->
    <!-- Left waves -->
    <path d="M -24 -20 C -30 -14 -30 2 -24 8" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -32 -28 C -40 -18 -40 6 -32 16" stroke="#ED8936" stroke-width="2.5" stroke-linecap="round" opacity="0.7" fill="none"/>

    <!-- Right waves -->
    <path d="M 24 -20 C 30 -14 30 2 24 8" stroke="#F6AD55" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 32 -28 C 40 -18 40 6 32 16" stroke="#ED8936" stroke-width="2.5" stroke-linecap="round" opacity="0.7" fill="none"/>
  </g>

  <!-- Glowing Star / Excellence Indicator at the top -->
  <g transform="translate(120, 32)">
    <path d="M 0 -8 L 2 -2 L 8 -2 L 3 2 L 5 8 L 0 4 L -5 8 L -3 2 L -8 -2 L -2 -2 Z" fill="#ECC94B"/>
  </g>
</svg>