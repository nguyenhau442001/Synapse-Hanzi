<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background Riverbed / Water Section -->
  <!-- Water Background Area -->
  <path d="M 30 80 Q 120 70 210 80 L 210 110 Q 120 100 30 110 Z" fill="#2E4057" opacity="0.4"/>
  
  <!-- Main River Cross-section & Heavy Silt (淤泥) -->
  <g>
    <!-- Lower riverbed contour -->
    <path d="M 20 185 C 60 205, 180 205, 220 185 L 220 210 L 20 210 Z" fill="#14171D"/>

    <!-- Thick Layer of Silt (淤泥) - Viscous, dark brown/slate textured mud -->
    <path d="M 25 150 C 60 135, 110 145, 140 135 C 170 125, 200 140, 215 145 L 220 185 C 180 205, 60 205, 20 185 Z" fill="#3D3532"/>
    
    <!-- Silt layered organic texture & sediment waves -->
    <path d="M 35 165 C 80 155, 130 170, 205 158" stroke="#4D433F" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 45 178 C 90 168, 140 182, 195 172" stroke="#2B2523" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 60 152 C 90 142, 110 152, 130 145" stroke="#5C4F4A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Trapped air bubbles / organic sediment pockets in mud -->
    <circle cx="75" cy="162" r="3" fill="#5C4F4A" opacity="0.7"/>
    <circle cx="155" cy="155" r="4" fill="#2B2523" opacity="0.6"/>
    <circle cx="115" cy="175" r="2.5" fill="#5C4F4A" opacity="0.8"/>
    <circle cx="185" cy="170" r="3.5" fill="#2B2523" opacity="0.6"/>

    <!-- Waterline above the silt -->
    <path d="M 20 150 Q 120 130 220 150" stroke="#3A506B" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <!-- Contextual Dredging Tool / Shovel handle sinking into the heavy silt (representing cleanup context) -->
  <g>
    <!-- Wooden Handle angled down -->
    <line x1="165" y1="60" x2="135" y2="135" stroke="#C28B56" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Metal Shovel Blade submerged into the thick mud -->
    <path d="M 120 125 L 140 120 L 148 155 C 140 160, 125 160, 118 152 Z" fill="#78849E"/>
    <!-- Shovel blade highlight -->
    <path d="M 125 127 L 137 124 L 140 145 C 136 148, 128 148, 125 145 Z" fill="#9FB3C8" opacity="0.5"/>
  </g>

  <!-- High-contrast focus accent: Mud droplets splashing upwards -->
  <g fill="#4D433F">
    <circle cx="105" cy="122" r="3" />
    <circle cx="95" cy="115" r="2" />
    <circle cx="125" cy="110" r="2.5" />
  </g>

  <!-- Clear focal lighting / rim light on the main silt mass -->
  <path d="M 25 150 C 60 135, 110 145, 140 135 C 170 125, 200 140, 215 145" stroke="#DDA15E" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>