<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Background River & Distant Elements -->
  <path d="M0 160 C60 150, 180 150, 240 160 L240 240 L0 240 Z" fill="#222831"/>
  
  <!-- Central Physical Object: Island and Giant Cargo Ship (The Subject being "笼罩") -->
  <!-- Island -->
  <path d="M40 185 C70 170, 140 170, 180 185 C190 189, 195 195, 190 205 C170 215, 60 215, 45 205 C40 195, 38 189, 40 185 Z" fill="#2E3A46"/>
  <!-- Trees on Island -->
  <circle cx="70" cy="178" r="8" fill="#3E4E59"/>
  <circle cx="85" cy="175" r="10" fill="#3E4E59"/>
  <circle cx="100" cy="179" r="7" fill="#3E4E59"/>

  <!-- Giant Cargo Ship on the River -->
  <g transform="translate(130, 170)">
    <!-- Hull -->
    <path d="M-40 15 L35 15 C40 15, 45 10, 40 5 L-35 5 C-40 5, -45 10, -40 15 Z" fill="#D35400"/>
    <rect x="-30" y="-5" width="55" height="10" fill="#E67E22"/>
    <!-- Containers -->
    <rect x="-25" y="-15" width="16" height="10" fill="#2980B9"/>
    <rect x="-7" y="-18" width="18" height="13" fill="#C0392B"/>
    <rect x="13" y="-15" width="16" height="10" fill="#27AE60"/>
    <!-- Bridge -->
    <rect x="15" y="-25" width="12" height="10" fill="#BDC3C7"/>
  </g>

  <!-- Navigation Warning Light (High contrast accent color) -->
  <circle cx="145" cy="148" r="2.5" fill="#F1C40F"/>
  <circle cx="145" cy="148" r="5" fill="#F1C40F" opacity="0.4"/>

  <!-- Dense Fog Layer (Visualizing "笼罩" - enshrouding/covering completely) -->
  <path d="M0 120 Q30 100, 60 120 T120 115 T180 125 T240 110 L240 240 L0 240 Z" fill="#7F8C8D" opacity="0.35"/>
  <path d="M0 100 Q40 80, 80 105 T160 95 T240 105 L240 240 L0 240 Z" fill="#95A5A6" opacity="0.5"/>
  <path d="M0 75 Q60 60, 120 80 T240 70 L240 240 L0 240 Z" fill="#BDC3C7" opacity="0.65"/>
  <path d="M0 50 Q50 35, 110 60 T240 45 L240 240 L0 240 Z" fill="#ECF0F1" opacity="0.8"/>

  <!-- Atmospheric Wisps -->
  <ellipse cx="80" cy="135" rx="50" ry="12" fill="#FFFFFF" opacity="0.15"/>
  <ellipse cx="160" cy="115" rx="60" ry="15" fill="#FFFFFF" opacity="0.2"/>
</svg>