<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient background glow for focus -->
  <circle cx="120" cy="120" r="80" fill="#242B38" opacity="0.6"/>

  <!-- Ground / Base Foundation Layer (Representing 底 - Foundation / Depth) -->
  <g transform="translate(0, 155)">
    <!-- Deep structural strata / foundation blocks -->
    <rect x="50" y="35" width="140" height="12" rx="3" fill="#3E4C63"/>
    <rect x="40" y="49" width="160" height="12" rx="3" fill="#2E3846"/>
    <rect x="30" y="63" width="180" height="12" rx="3" fill="#1E2530"/>
    
    <!-- Golden accent line highlighting the solid bedrock (Inner Strength / Nội lực căn bản) -->
    <rect x="50" y="32" width="140" height="3" rx="1.5" fill="#F59E0B"/>
  </g>

  <!-- Central Physical Object representing "功底" (Traditional Ink Brush & Solid Ink Stone / Master Foundation) -->
  <g transform="translate(120, 105)">
    <!-- Ink Stone / Grinding Slate (Mực tàu / Nghiên mực - Foundation platform) -->
    <ellipse cx="0" cy="42" rx="72" ry="20" fill="#2A3442"/>
    <ellipse cx="0" cy="40" rx="66" ry="16" fill="#1E2530"/>
    <ellipse cx="-16" cy="39" rx="38" ry="10" fill="#141922"/>

    <!-- Concentrated Liquid Ink Pool (Depicting depth, refinement and mastery) -->
    <ellipse cx="-16" cy="39" rx="32" ry="7" fill="#0F131A"/>
    <ellipse cx="-18" cy="38" rx="24" ry="4" fill="#1F2937" opacity="0.3"/>

    <!-- Dynamic Calligraphy Brush (Bút lông - Skill & Execution) striking firmly -->
    <g transform="rotate(-32) translate(-10, -10)">
      <!-- Brush handle (Bamboo segments) -->
      <rect x="-6" y="-75" width="12" height="100" rx="4" fill="#D97706"/>
      <rect x="-6" y="-55" width="12" height="6" fill="#B45309"/>
      <rect x="-6" y="-30" width="12" height="6" fill="#B45309"/>
      <rect x="-6" y="-5" width="12" height="6" fill="#B45309"/>
      <rect x="-6" y="20" width="12" height="6" fill="#B45309"/>
      
      <!-- Brush Ferrule (Red/Crimson Collar) -->
      <rect x="-7" y="25" width="14" height="14" rx="2" fill="#DC2626"/>

      <!-- Brush Bristles (Firm, resilient core tapering to a sharp precision tip) -->
      <path d="M-6 39 C-6 39 -10 65 0 78 C10 65 6 39 6 39 Z" fill="#111827"/>
      
      <!-- Wet Ink Highlight on tip -->
      <path d="M-2 55 C-3 65 0 73 0 78 C2 73 3 65 2 55 Z" fill="#F59E0B" opacity="0.8"/>
    </g>

    <!-- Energetic Ink Splash / Brush Stroke accent embodying "苍劲有力" (Powerful & Vigorous strokes) -->
    <path d="M-2 70 C 25 60, 48 20, 68 -15" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M15 55 C 35 40, 52 10, 62 -5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Flying Ink Droplets (Dynamic motion of master craftsmanship) -->
    <circle cx="50" cy="5" r="3.5" fill="#F59E0B"/>
    <circle cx="68" cy="-12" r="2" fill="#F59E0B"/>
    <circle cx="32" cy="28" r="2" fill="#38BDF8"/>
    <circle cx="42" cy="18" r="1.5" fill="#F59E0B" opacity="0.7"/>
  </g>
</svg>