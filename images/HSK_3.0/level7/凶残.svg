<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Subtle dark vignette / background depth -->
  <circle cx="120" cy="120" r="90" fill="#15181F" opacity="0.6"/>

  <!-- Character / Object representing 凶残 (Ruthless/Brutal Poacher figure archetype) -->
  <g transform="translate(120, 120)">
    <!-- Aggressive menacing aura/shadow base -->
    <path d="M-60,70 L60,70 L50,90 L-50,90 Z" fill="#2D1515" opacity="0.8"/>
    
    <!-- Torso (Dark rugged vest/tactical gear) -->
    <path d="M-45,35 L45,35 L38,75 L-38,75 Z" fill="#2E3440"/>
    <path d="M-25,35 L25,35 L20,75 L-20,75 Z" fill="#242933"/>
    
    <!-- Shoulders -->
    <path d="M-55,30 L55,30 L45,45 L-45,45 Z" fill="#3B4252"/>

    <!-- Menacing Red/Orange Slash Accents across chest representing brutality/violence -->
    <path d="M-30,45 L25,65" stroke="#BF616A" stroke-width="4" stroke-linecap="round"/>
    <path d="M-20,55 L35,40" stroke="#BF616A" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck & Head Base -->
    <rect x="-12" y="10" width="24" height="25" fill="#D8DEE9"/>
    
    <!-- Face (Hooded/Shadowed Profile with Cruel Expression) -->
    <path d="M-24,-25 C-24,-45 24,-45 24,-25 L20,15 L-20,15 Z" fill="#2E3440"/>
    <path d="M-22,-20 C-22,-38 22,-38 22,-20 L16,12 L-16,12 Z" fill="#D8DEE9"/>

    <!-- Balaclava / Tactical mask covering lower face -->
    <path d="M-18,-5 L18,-5 L16,12 L-16,12 Z" fill="#242933"/>
    <path d="M-18,-5 L0,-12 L18,-5 Z" fill="#3B4252"/>

    <!-- Fierce Glowing Eyes (Orange/Red focus) -->
    <polygon points="-12,-16 -5,-14 -10,-10" fill="#FF5555"/>
    <polygon points="12,-16 5,-14 10,-10" fill="#FF5555"/>
    
    <!-- Eyebrows slanting aggressively downward -->
    <path d="M-15,-20 L-4,-15" stroke="#BF616A" stroke-width="3" stroke-linecap="round"/>
    <path d="M15,-20 L4,-15" stroke="#BF616A" stroke-width="3" stroke-linecap="round"/>

    <!-- Weapon barrel slicing across (Gun barrel pointing threateningly) -->
    <rect x="-85" y="-5" width="70" height="8" rx="2" fill="#4C566A"/>
    <rect x="-85" y="-3" width="70" height="3" fill="#D8DEE9" opacity="0.3"/>
    <!-- Muzzle brake / flash hider -->
    <rect x="-95" y="-7" width="12" height="12" rx="2" fill="#3B4252"/>
    <!-- Hands gripping weapon -->
    <rect x="-35" y="0" width="16" height="22" rx="4" fill="#D8DEE9"/>
    <rect x="-15" y="-2" width="14" height="20" rx="4" fill="#D8DEE9"/>

    <!-- Sharp diagonal slash elements symbolizing extreme cruelty/violence in flat graphic design -->
    <g transform="translate(0, -5)" opacity="0.85">
      <line x1="-70" y1="-50" x2="-50" y2="-70" stroke="#FF5555" stroke-width="5" stroke-linecap="round"/>
      <line x1="-60" y1="-45" x2="-45" y2="-60" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
      
      <line x1="70" y1="-50" x2="50" y2="-70" stroke="#FF5555" stroke-width="5" stroke-linecap="round"/>
      <line x1="60" y1="-45" x2="45" y2="-60" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Outer border accent representing high-contrast dark theme UI card -->
  <rect x="1" y="1" width="238" height="238" rx="23" fill="none" stroke="#3B4252" stroke-width="2" opacity="0.5"/>
</svg>