<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background subtle depth elements -->
  <line x1="30" y1="180" x2="210" y2="180" stroke="#2A2F3B" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="70" x2="120" y2="180" stroke="#2A2F3B" stroke-dasharray="4 4" stroke-width="2"/>
  
  <!-- Railway Platform Ground Line -->
  <rect x="20" y="180" width="200" height="8" rx="3" fill="#3A4150"/>
  <rect x="30" y="188" width="180" height="4" rx="2" fill="#252A34"/>

  <!-- High-speed Train Front (Approaching/Cận kề) -->
  <g transform="translate(0, 0)">
    <!-- Motion lines suggesting movement/arriving -->
    <path d="M40 95 L70 95" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M30 115 L65 115" stroke="#FFA726" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M45 135 L75 135" stroke="#FFA726" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Train Body / Sleek Modern Nose -->
    <path d="M 70 145 C 90 145, 120 140, 160 125 C 190 113, 205 95, 210 85 C 200 85, 140 85, 90 95 C 75 98, 70 120, 70 145 Z" fill="#E0E6ED"/>
    
    <!-- Train Lower Skirt -->
    <path d="M 70 145 C 90 145, 120 142, 165 130 C 185 123, 200 110, 210 100 C 205 125, 180 160, 120 160 C 85 160, 72 152, 70 145 Z" fill="#94A3B8"/>
    
    <!-- Red Accent Stripe -->
    <path d="M 75 135 C 95 135, 130 130, 175 118 C 195 110, 205 102, 210 98 C 205 101, 190 113, 175 121 C 130 133, 95 138, 75 138 Z" fill="#FF5252"/>

    <!-- Windshield / Cockpit Glass -->
    <path d="M 120 95 C 150 95, 185 90, 200 85 C 190 85, 150 88, 130 92 C 123 93, 120 94, 120 95 Z" fill="#1E293B"/>
    
    <!-- Headlight (Glowing Warm Gold/Orange for arrival) -->
    <ellipse cx="205" cy="91" rx="4" ry="7" fill="#FFD54F"/>
    <ellipse cx="207" cy="91" rx="2" ry="4" fill="#FFFFFF"/>
    <!-- Headlight Beam -->
    <polygon points="210,87 235,75 235,105 210,95" fill="#FFD54F" opacity="0.15"/>

    <!-- Wheels / Bogie area -->
    <rect x="90" y="152" width="22" height="12" rx="4" fill="#475569"/>
    <circle cx="101" cy="158" r="4" fill="#1E293B"/>
    <rect x="145" y="145" width="22" height="12" rx="4" fill="#475569"/>
    <circle cx="156" cy="151" r="4" fill="#1E293B"/>
  </g>

  <!-- Destination/Proximity indicator (Subtle target marker overhead) -->
  <g transform="translate(145, 45)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FFA726" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FFA726" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="3" fill="#FFA726"/>
    <!-- Downward indicator arrow representing "arriving/approaching" -->
    <path d="M -4 -18 L 0 -12 L 4 -18" fill="none" stroke="#FFA726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>