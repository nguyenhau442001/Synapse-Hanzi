<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>

  <!-- Ambient light glow representing late night / dawn -->
  <circle cx="120" cy="115" r="70" fill="#2D2B3D" opacity="0.6"/>
  <path d="M 60 170 Q 120 190 180 170" stroke="#FF9F43" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Open Book (The physical object representing "瘾" in context of novels) -->
  <g transform="translate(0, 10)">
    <!-- Book Shadow / Base -->
    <path d="M 60 110 L 120 125 L 180 110 L 165 145 L 120 155 L 75 145 Z" fill="#111318"/>
    
    <!-- Left Pages -->
    <path d="M 62 105 C 80 100 100 105 118 112 L 118 147 C 100 140 80 135 62 140 Z" fill="#E2E8F0"/>
    <!-- Right Pages -->
    <path d="M 118 112 C 136 105 156 100 174 105 L 174 140 C 156 135 136 140 118 147 Z" fill="#CBD5E1"/>

    <!-- Spine -->
    <path d="M 116 110 L 120 112 L 120 147 L 116 145 Z" fill="#94A3B8"/>

    <!-- Text Lines Left -->
    <line x1="72" y1="115" x2="104" y2="119" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="123" x2="108" y2="128" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="71" y1="132" x2="100" y2="136" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

    <!-- Text Lines Right -->
    <line x1="132" y1="119" x2="164" y2="115" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="128" x2="168" y2="123" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="136" y1="136" x2="165" y2="132" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

    <!-- Glowing Magical/Immersive Energy Emanating from Book (Visualizing "Crave/Absorbed") -->
    <path d="M 120 105 C 120 70 90 60 75 45" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M 120 105 C 130 65 160 50 175 35" fill="none" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 120 108 C 120 85 120 65 120 40" fill="none" stroke="#FFA726" stroke-width="4" stroke-linecap="round"/>

    <!-- Floating Glowing Particles / Sparks (Night reading / Trance atmosphere) -->
    <circle cx="75" cy="45" r="3" fill="#FFD54F"/>
    <circle cx="175" cy="35" r="3.5" fill="#FFD54F"/>
    <circle cx="120" cy="30" r="4" fill="#FFE082"/>
    <circle cx="95" cy="65" r="2" fill="#FFB74D"/>
    <circle cx="148" cy="60" r="2.5" fill="#FFB74D"/>
    <circle cx="60" cy="85" r="1.5" fill="#FFA726"/>
    <circle cx="180" cy="80" r="2" fill="#FFA726"/>
  </g>

  <!-- Bookmark Ribbon hanging out -->
  <path d="M 118 112 L 118 160 L 124 168 L 130 160 L 130 115" fill="#E74C3C"/>

</svg>