<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Modern Technology Object (The fast-moving element) -->
  <g transform="translate(140, 80)">
    <rect x="-20" y="-15" width="40" height="30" rx="4" fill="#FFB84D"/>
    <path d="M-10 -5 H10 M-10 0 H10 M-10 5 H10" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 0 L40 0" stroke="#FFB84D" stroke-width="4" stroke-dasharray="4 4"/>
  </g>

  <!-- Legacy/Outdated Object (The lagging element) -->
  <g transform="translate(80, 140)">
    <rect x="-25" y="-20" width="50" height="40" rx="6" fill="#64748B"/>
    <circle cx="0" cy="0" r="10" fill="#1A1D24"/>
    <path d="M-15 -10 L15 10 M-15 10 L15 -10" stroke="#94A3B8" stroke-width="3"/>
  </g>

  <!-- Connection/Path -->
  <path d="M120 95 C120 140 80 140 80 140" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Visualizing the gap/lag -->
  <path d="M140 100 L140 140" stroke="#FFB84D" stroke-width="2" stroke-dasharray="2 4"/>
  <circle cx="140" cy="140" r="3" fill="#FFB84D"/>
</svg>