<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Outer camera lens body / housing -->
    <circle cx="0" cy="0" r="76" fill="#252A34" stroke="#323846" stroke-width="3"/>
    
    <!-- Lens ribbed grip ring -->
    <circle cx="0" cy="0" r="66" fill="none" stroke="#1A1D24" stroke-dasharray="4 4" stroke-width="6"/>
    
    <!-- Secondary inner barrel -->
    <circle cx="0" cy="0" r="54" fill="#1E232D" stroke="#2C323E" stroke-width="2"/>
    
    <!-- Lens glass layers / reflections -->
    <circle cx="0" cy="0" r="42" fill="#11151C"/>
    <circle cx="0" cy="0" r="34" fill="url(#lensGrad)"/>
    
    <!-- Aperture blades creating a focus point -->
    <path d="M-18 -26 L12 -28 L24 -4 L-6 18 Z" fill="#242B38" opacity="0.7"/>
    <path d="M-26 12 L-28 -18 L-4 -24 L18 6 Z" fill="#1C222D" opacity="0.8"/>
    <path d="M26 -12 L18 18 L-6 24 L-18 -6 Z" fill="#2A3241" opacity="0.6"/>
    
    <!-- Center focal glass / deep lens core -->
    <circle cx="0" cy="0" r="22" fill="#0D1015"/>
    <circle cx="-5" cy="-5" r="14" fill="url(#glassHighlight)" opacity="0.5"/>

    <!-- Precision crosshairs / focus reticle in bright orange/gold -->
    <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
      <!-- Top reticle -->
      <line x1="0" y1="-32" x2="0" y2="-18"/>
      <!-- Bottom reticle -->
      <line x1="0" y1="18" x2="0" y2="32"/>
      <!-- Left reticle -->
      <line x1="-32" y1="0" x2="-18" y2="0"/>
      <!-- Right reticle -->
      <line x1="18" y1="0" x2="32" y2="0"/>
      
      <!-- Corner focus brackets -->
      <!-- Top-Left -->
      <path d="M-28 -40 L-40 -40 L-40 -28" fill="none"/>
      <!-- Top-Right -->
      <path d="M28 -40 L40 -40 L40 -28" fill="none"/>
      <!-- Bottom-Left -->
      <path d="M-28 40 L-40 40 L-40 28" fill="none"/>
      <!-- Bottom-Right -->
      <path d="M28 40 L40 40 L40 28" fill="none"/>
    </g>

    <!-- Center pinpoint focus dot -->
    <circle cx="0" cy="0" r="4" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Gradient Definitions -->
  <defs>
    <radialGradient id="lensGrad" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>
    
    <radialGradient id="glassHighlight" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>