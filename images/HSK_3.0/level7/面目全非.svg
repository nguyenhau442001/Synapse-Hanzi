<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Background grid/terrain lines indicating devastation -->
  <path d="M20 190 L60 170 L100 185 L140 160 L180 180 L220 165" stroke="#2A2F3B" stroke-width="2" fill="none"/>
  
  <!-- Flooding wave action lines -->
  <path d="M10 150 C40 130, 80 170, 110 140 C140 110, 180 150, 230 120" stroke="#FF5555" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M0 165 C35 145, 75 185, 105 155 C135 125, 175 165, 240 135" stroke="#FF5555" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Transformation effect / split comparison visual -->
  <!-- Left side: Ghosted outline of what it used to be (the beautiful village/house) -->
  <g opacity="0.25" transform="translate(35, 80)">
    <path d="M20 60 L20 30 L45 10 L70 30 L70 60 Z" fill="none" stroke="#4CD3C2" stroke-width="2" stroke-dasharray="3,3"/>
    <rect x="35" y="35" width="20" height="25" fill="none" stroke="#4CD3C2" stroke-width="2"/>
    <circle cx="85" cy="50" r="12" fill="none" stroke="#4CD3C2" stroke-width="2"/>
    <path d="M85 30 L85 70" stroke="#4CD3C2" stroke-width="2"/>
  </g>

  <!-- Right side: Dynamic action causing complete ruin / transformation (miànmù-quánfēi) -->
  <g transform="translate(130, 75)">
    <!-- Falling / collapsing structure elements -->
    <path d="M15 45 L50 20 L75 50 Z" fill="#E65C00" opacity="0.8"/>
    <rect x="25" y="45" width="35" height="30" fill="#FFAA00" opacity="0.9"/>
    
    <!-- Debris flying / motion lines -->
    <line x1="5" y1="35" x2="-15" y2="25" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="20" x2="85" y2="10" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="65" x2="95" y2="75" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Broken pieces on ground -->
    <polygon points="10,75 30,85 20,90" fill="#E65C00"/>
    <polygon points="50,75 70,80 60,95" fill="#FFAA00"/>
  </g>

  <!-- Central Dynamic Action Element: Force / Impact Burst -->
  <circle cx="120" cy="115" r="45" fill="none" stroke="#FFAA00" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
  
  <path d="M100 115 L140 115" stroke="#FFAA00" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 95 L120 135" stroke="#FFAA00" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Human / Agent Action Vector (Dynamic hands/force interacting with the scene) -->
  <path d="M90 145 C105 130, 135 130, 150 145" stroke="#4CD3C2" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="90" cy="145" r="5" fill="#4CD3C2"/>
  <circle cx="150" cy="145" r="5" fill="#4CD3C2"/>

  <!-- Accent indicators of dramatic alteration -->
  <path d="M190 50 L205 35" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>
  <path d="M205 50 L190 35" stroke="#FF5555" stroke-width="3" stroke-linecap="round"/>

  <path d="M35 50 L50 35" stroke="#4CD3C2" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 50 L35 35" stroke="#4CD3C2" stroke-width="3" stroke-linecap="round"/>
</svg>