<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Container & Background -->
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <!-- Ambient lighting/backdrop glow -->
  <circle cx="120" cy="115" r="75" fill="#252A34" opacity="0.6"/>

  <!-- Scene Elements: Professional Caregiver (看护) attending to an elderly person -->
  <g id="care-scene">
    <!-- Bed / Mattress -->
    <rect x="45" y="145" width="150" height="40" rx="6" fill="#2D3748"/>
    <rect x="50" y="135" width="80" height="15" rx="4" fill="#4A5568"/>
    <rect x="135" y="140" width="55" height="10" rx="3" fill="#E2E8F0"/>
    
    <!-- Bed headboard -->
    <rect x="40" y="120" width="10" height="65" rx="3" fill="#718096"/>

    <!-- Elderly Patient (lying down) -->
    <!-- Head -->
    <circle cx="75" cy="128" r="14" fill="#FBD38D"/>
    <!-- Hair (grey) -->
    <path d="M 61 128 Q 63 115 75 114 Q 87 114 87 125 Z" fill="#CBD5E0"/>
    <!-- Body under blanket -->
    <path d="M 85 138 Q 110 135 150 145 L 150 175 L 85 175 Z" fill="#3182CE"/>

    <!-- Professional Caregiver (Standing/Leaning forward with attentive posture) -->
    <!-- Torso -->
    <path d="M 140 140 C 135 110 150 90 165 90 C 180 90 190 110 185 140 Z" fill="#319795"/>
    
    <!-- Medical Uniform Collar / Details -->
    <path d="M 157 93 L 165 105 L 173 93" fill="none" stroke="#E6FFFA" stroke-width="2" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="165" cy="72" r="12" fill="#F6AD55"/>
    <!-- Hair (Caregiver) -->
    <path d="M 153 72 C 153 60 177 60 177 72 C 177 67 153 67 153 72 Z" fill="#2D3748"/>

    <!-- Caring Hands (Gently adjusting blanket/caring for patient) -->
    <!-- Left Hand -->
    <circle cx="120" cy="142" r="5" fill="#F6AD55"/>
    <!-- Right Hand -->
    <circle cx="132" cy="145" r="5" fill="#F6AD55"/>
    <!-- Arm reaching down -->
    <path d="M 155 110 Q 140 130 128 142" fill="none" stroke="#319795" stroke-width="10" stroke-linecap="round"/>

    <!-- Warm, attentive facial expression / eye detail (implied gentle downward gaze) -->
    <path d="M 169 73 Q 172 75 175 73" fill="none" stroke="#7B341E" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Medical/Care Symbolism (Subtle professional cross accent on pocket) -->
    <rect x="155" y="115" width="12" height="10" rx="2" fill="#285E61"/>
    <path d="M 161 117 V 123 M 158 120 H 164" stroke="#E6FFFA" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Focus Accent: Warm glowing rim light representing attentive care and dedication -->
  <path d="M 130 75 Q 165 65 185 95" fill="none" stroke="#ED8936" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Subtle floor shadow -->
  <ellipse cx="120" cy="190" rx="90" ry="6" fill="#111318"/>
</svg>