<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="24" fill="#1A1D24"/>
  
  <g transform="translate(120, 115)">
    <!-- Clipboard Background / Document -->
    <rect x="-55" y="-75" width="110" height="150" rx="10" fill="#2A2F3D" stroke="#3E475C" stroke-width="3"/>
    
    <!-- Clip Top -->
    <path d="M-20,-75 C-20,-83 20,-83 20,-75 Z" fill="#E67E22"/>
    <rect x="-25" y="-78" width="50" height="8" rx="3" fill="#F39C12"/>
    
    <!-- Document Header Accent / Red Notice Stamp Outline -->
    <rect x="-40" y="-55" width="40" height="6" rx="3" fill="#E74C3C"/>
    <rect x="-40" y="-40" width="70" height="4" rx="2" fill="#4E5D78"/>
    
    <!-- Checklist Items (Disorder to Order representation) -->
    <!-- Item 1: Checked / Fixed -->
    <circle cx="-35" cy="-20" r="6" fill="#2ECC71"/>
    <path d="M-38,-20 L-36,-17 L-30,-24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-22" y="-22" width="55" height="4" rx="2" fill="#8C9BAE"/>
    
    <!-- Item 2: Checked / Fixed -->
    <circle cx="-35" cy="0" r="6" fill="#2ECC71"/>
    <path d="M-38,0 L-36,3 L-30,-4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-22" y="-2" width="45" height="4" rx="2" fill="#8C9BAE"/>
    
    <!-- Item 3: Checked / Restructured -->
    <circle cx="-35" cy="20" r="6" fill="#2ECC71"/>
    <path d="M-38,20 L-36,23 L-30,16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-22" y="18" width="60" height="4" rx="2" fill="#8C9BAE"/>

    <!-- Official Stamp / Seal (Red/Orange regulatory stamp) -->
    <g transform="translate(25, 35) rotate(-15)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#E74C3C" stroke-width="2.5" stroke-dasharray="4,2"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#E74C3C" stroke-width="1.5"/>
      <!-- Checkmark inside stamp to signify rectification passed/completed -->
      <path d="M-8,1 L-3,6 L10,-6" fill="none" stroke="#E74C3C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Wrench Tool overlapping to indicate reorganization/fixing -->
    <g transform="translate(50, -35) rotate(45)">
      <path d="M-5,-25 C-10,-25 -12,-20 -10,-15 L-12,-12 L-18,-6 C-21,-3 -21,2 -18,5 C-15,8 -10,8 -7,5 L-1,-1 L2,-3 C7,-5 12,-3 15,2 C18,7 16,13 12,16 L8,19 C6,21 6,24 8,26 L10,28 C13,31 18,31 21,28 L28,21 C33,16 33,9 28,4 C23,-1 18,-3 13,-2 C11,-3 9,-5 8,-7 L2,-13 C-2,-17 -3,-22 -5,-25 Z" fill="#F1C40F"/>
      <!-- Wrench details -->
      <circle cx="20" cy="18" r="4" fill="#D35400"/>
    </g>
  </g>
</svg>