<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Environment: Park/Street -->
  <path d="M0 180h240v60H0z" fill="#334155"/>
  <circle cx="180" cy="60" r="30" fill="#fbbf24" opacity="0.2"/>
  
  <!-- Character: The Observer -->
  <g transform="translate(40, 100)">
    <path d="M20 120h40v10H20z" fill="#10b981"/>
    <path d="M30 80h20v40H30z" fill="#38bdf8"/>
