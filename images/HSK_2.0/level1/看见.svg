    <!-- Binoculars -->
    <rect x="45" y="55" width="30" height="15" rx="4" fill="#64748b"/>
    <circle cx="52" cy="62" r="5" fill="#0f172a"/>
    <circle cx="68" cy="62" r="5" fill="#0f172a"/>
  </g>
  
  <!-- Subject being observed: Friend behind a tree -->
  <g transform="translate(140, 90)">
    <path d="M10 130h30v10H10z" fill="#ec4899"/>
    <path d="M15 90h20v40H15z" fill="#fb923c"/>
