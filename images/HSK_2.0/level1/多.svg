<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Crowd representing 'Many' -->
  <g transform="translate(20, 120)">
    <!-- Back row -->
    <circle cx="40" cy="40" r="12" fill="#38bdf8"/>
    <circle cx="80" cy="35" r="14" fill="#fbbf24"/>
    <circle cx="120" cy="42" r="13" fill="#ec4899"/>
    <circle cx="160" cy="38" r="11" fill="#10b981"/>
    
    <!-- Middle row -->
    <circle cx="20" cy="70" r="15" fill="#fb923c"/>
    <circle cx="60" cy="65" r="16" fill="#38bdf8"/>
    <circle cx="100" cy="72" r="14" fill="#fbbf24"/>
    <circle cx="140" cy="68" r="15" fill="#ec4899"/>
    <circle cx="180" cy="65" r="13" fill="#10b981"/>
    
    <!-- Front row -->
    <circle cx="40" cy="100" r="18" fill="#fbbf24"/>
    <circle cx="90" cy="95" r="20" fill="#38bdf8"/>
    <circle cx="140" cy="102" r="17" fill="#fb923c"/>
    <circle cx="190" cy="98" r="19" fill="#ec4899"/>
  </g>
  
  <!-- Atmospheric details -->
  <circle cx="30" cy="30" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="210" cy="40" r="2" fill="#f59e0b" opacity="0.4"/>
  <circle cx="120" cy="20" r="4" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Ground plane -->
  <rect x="0" y="200" width="240" height="40" fill="#0f172a" opacity="0.5"/>
</svg>