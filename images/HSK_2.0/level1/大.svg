<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(0, 20)">
    <!-- Oversized Chair -->
    <path d="M40 180 L200 180 L190 100 L50 100 Z" fill="#334155"/>
    <path d="M50 100 L50 70 Q50 40 80 40 L160 40 Q190 40 190 70 L190 100" fill="#475569"/>
    <path d="M60 110 L180 110 L175 170 L65 170 Z" fill="#1e293b"/>
    
    <!-- The Character (Small person in a big chair) -->
    <g transform="translate(100, 130)">
      <circle cx="20" cy="-20" r="12" fill="#fbbf24"/>
      <path d="M12 -20 Q12 -35 20 -35 Q28 -35 28 -20" fill="#fbbf24"/>
      <path d="M15 -22 L17 -22 M23 -22 L25 -22" stroke="#0f172a" stroke-width="1.5"/>
      <path d="M17 -16 Q20 -14 23 -16" stroke="#0f172a" stroke-width="1.5" fill="none"/>
      <rect x="10" y="-8" width="20" height="25" rx="4" fill="#38bdf8"/>
      <rect x="5" y="-5" width="10" height="20" rx="3" fill="#38bdf8" transform="rotate(20 10 0)"/>
      <rect x="25" y="-5" width="10" height="20" rx="3" fill="#38bdf8" transform="rotate(-20 30 0)"/>
    </g>
    
    <!-- Oversized Props -->
    <circle cx="50" cy="190" r="30" fill="#ec4899" opacity="0.8"/>
    <rect x="170" y="170" width="50" height="50" rx="10" fill="#10b981"/>
    
    <!-- Ambient Light -->
    <circle cx="120" cy="120" r="100" fill="url(#lightGrad)" opacity="0.05"/>
    <defs>
      <radialGradient id="lightGrad">
        <stop offset="0%" stop-color="#fb923c"/>
        <stop offset="100%" stop-color="transparent"/>
      </radialGradient>
    </defs>
  </g>
</svg>