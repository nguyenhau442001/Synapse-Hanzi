<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Wooden Name Tag/Desk Plate -->
  <rect x="40" y="140" width="160" height="50" rx="8" fill="#fb923c" stroke="#f59e0b" stroke-width="4"/>
  <rect x="45" y="145" width="150" height="40" rx="4" fill="#1e293b" opacity="0.3"/>
  
  <!-- Decorative Elements: Pen and Notebook -->
  <rect x="160" y="110" width="10" height="60" rx="2" fill="#38bdf8" transform="rotate(20 165 140)"/>
  <path d="M170 120 L165 115 L160 120 Z" fill="#10b981"/>
  
  <rect x="30" y="100" width="60" height="80" rx="4" fill="#ec4899"/>
  <line x1="40" y1="110" x2="80" y2="110" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="40" y1="125" x2="80" y2="125" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="40" y1="140" x2="70" y2="140" stroke="#f1f5f9" stroke-width="2"/>
  
  <!-- Character Interaction: Hand pointing to the name tag -->
  <path d="M120 165 L140 165 L145 150 L135 145 Z" fill="#fbbf24"/>
  <circle cx="145" cy="150" r="8" fill="#fbbf24"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>