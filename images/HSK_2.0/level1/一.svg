<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155" opacity="0.4"/>
  
  <!-- The "One" Subject: A single, vibrant, glowing lantern on a wooden stand -->
  <!-- Stand -->
  <rect x="105" y="160" width="30" height="40" rx="4" fill="#94a3b8"/>
  <rect x="95" y="190" width="50" height="10" rx="2" fill="#64748b"/>
  
  <!-- Lantern Body -->
  <circle cx="120" cy="110" r="45" fill="#f59e0b" opacity="0.2"/>
  <path d="M90 110 C90 85 105 70 120 70 C135 70 150 85 150 110 C150 135 135 150 120 150 C105 150 90 135 90 110" fill="#fbbf24"/>
  
  <!-- Lantern Details -->
  <rect x="118" y="70" width="4" height="20" fill="#b45309"/>
  <rect x="118" y="130" width="4" height="20" fill="#b45309"/>
  <path d="M100 90 L140 90 M100 130 L140 130" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Atmospheric Elements -->
  <circle cx="40" cy="50" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="200" cy="40" r="2" fill="#10b981" opacity="0.6"/>
  <circle cx="180" cy="190" r="4" fill="#ec4899" opacity="0.4"/>
  
  <!-- Light Glow Effect -->
  <circle cx="120" cy="110" r="55" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
</svg>