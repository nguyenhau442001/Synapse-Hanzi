    <circle cx="50" cy="30" r="30" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M25 30c0-20 15-35 25-35s25 15 25 35" fill="none" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="40" cy="25" r="3" fill="#0f172a"/>
    <circle cx="60" cy="25" r="3" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M40 35c5 5 15 5 20 0" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Kitchen Utensil -->
  <path d="M130 180l20-20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="130" cy="180" r="5" fill="#94a3b8"/>
