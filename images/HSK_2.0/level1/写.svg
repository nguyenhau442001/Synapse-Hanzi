<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 160 L240 160 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M20 170 L220 170 L210 240 L30 240 Z" fill="#475569"/>
  
  <!-- Paper -->
  <rect x="70" y="100" width="100" height="120" rx="4" fill="#f8fafc"/>
  <line x1="85" y1="120" x2="155" y2="120" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="85" y1="140" x2="155" y2="140" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="85" y1="160" x2="155" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Character Arm and Hand -->
  <path d="M180 140 C160 130, 140 140, 130 150" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="125" cy="155" r="8" fill="#fbbf24"/>
  
  <!-- Pen -->
  <rect x="115" y="145" width="20" height="4" rx="2" fill="#ec4899" transform="rotate(-30 125 150)"/>
  
  <!-- Desk Lamp -->
  <path d="M190 160 L210 160 L205 80 L195 80 Z" fill="#38bdf8"/>
  <circle cx="200" cy="80" r="15" fill="#38bdf8"/>
  <circle cx="200" cy="80" r="8" fill="#fb923c"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="140" r="40" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Coffee Mug -->
  <rect x="30" y="130" width="30" height="35" rx="4" fill="#10b981"/>
  <path d="M60 135 Q70 135, 70 145 Q70 155, 60 155" stroke="#10b981" stroke-width="4" fill="none"/>
</svg>