<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Bedside table -->
  <rect x="40" y="140" width="160" height="100" rx="8" fill="#334155"/>
  <rect x="50" y="150" width="140" height="30" rx="4" fill="#475569"/>
  
  <!-- Alarm Clock -->
  <circle cx="120" cy="110" r="50" fill="#f1f5f9"/>
  <circle cx="120" cy="110" r="42" fill="#0f172a"/>
  
  <!-- Clock Face Details -->
  <line x1="120" y1="110" x2="120" y2="75" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="110" x2="150" y2="110" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Clock markers -->
  <rect x="118" y="70" width="4" height="10" fill="#fb923c"/>
  <rect x="160" y="108" width="10" height="4" fill="#fb923c"/>
  <rect x="118" y="140" width="4" height="10" fill="#fb923c"/>
  <rect x="70" y="108" width="10" height="4" fill="#fb923c"/>
  <rect x="145" y="80" width="4" height="8" fill="#fb923c" transform="rotate(30 147 84)"/>
  
  <!-- Alarm bells -->
  <circle cx="85" cy="70" r="12" fill="#38bdf8"/>
  <circle cx="155" cy="70" r="12" fill="#38bdf8"/>
  
  <!-- Ambient light -->
  <circle cx="120" cy="110" r="60" fill="#f59e0b" fill-opacity="0.05"/>
  
  <!-- Small decorative items -->
  <circle cx="180" cy="190" r="8" fill="#10b981"/>
  <circle cx="60" cy="200" r="5" fill="#ec4899"/>
</svg>