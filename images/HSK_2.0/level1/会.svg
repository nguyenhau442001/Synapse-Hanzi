<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk and Environment -->
  <rect x="20" y="150" width="200" height="15" rx="4" fill="#334155"/>
  <rect x="30" y="165" width="10" height="75" fill="#475569"/>
  <rect x="200" y="165" width="10" height="75" fill="#475569"/>
  
  <!-- Props: Books and Lamp -->
  <path d="M40 140 L80 140 L85 150 L35 150 Z" fill="#fb923c"/>
  <circle cx="180" cy="110" r="25" fill="#f59e0b" opacity="0.2"/>
  <path d="M180 115 L170 150 L190 150 Z" fill="#f59e0b"/>
  
  <!-- Character -->
  <g transform="translate(120, 130)">
    <!-- Body -->
    <path d="M-40 80 Q0 60 40 80 L30 110 L-30 110 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="35" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M-35 20 Q-35 -10 0 -15 Q35 -10 35 20 L20 10 L0 20 L-20 10 Z" fill="#475569"/>
    <!-- Expression: Confident/Knowing -->
    <ellipse cx="-12" cy="15" rx="3" ry="4" fill="#1e293b"/>
    <ellipse cx="12" cy="15" rx="3" ry="4" fill="#1e293b"/>
    <path d="M-10 30 Q0 38 10 30" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Arms gesturing "knowing/speaking" -->
    <path d="M-40 70 L-60 40" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 70 L65 50" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-65" cy="35" r="8" fill="#fde68a"/>
    <circle cx="70" cy="45" r="8" fill="#fde68a"/>
  </g>
  
  <!-- Floating speech-like energy -->
  <circle cx="160" cy="60" r="5" fill="#10b981"/>
  <circle cx="180" cy="40" r="8" fill="#ec4899"/>
  <circle cx="190" cy="70" r="4" fill="#38bdf8"/>
</svg>