<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <rect x="0" y="180" width="240" height="60" fill="#334155"/>
  <rect x="0" y="180" width="240" height="4" fill="#475569"/>

  <!-- Character -->
  <g transform="translate(60, 60)">
    <!-- Body -->
    <path d="M40 160 C40 130, 60 120, 80 120 C100 120, 120 130, 120 160" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="80" cy="90" r="30" fill="#fde68a"/>
    <!-- Arm holding cup -->
    <path d="M60 110 L40 90 L50 80" stroke="#fb923c" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Cup -->
    <rect x="25" y="65" width="20" height="25" rx="2" fill="#38bdf8"/>
    <path d="M25 70 L45 70" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Steam -->
    <path d="M35 60 Q40 50 35 40" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
    <path d="M40 60 Q45 50 40 40" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
  </g>

  <!-- Environment Details -->
  <circle cx="180" cy="190" r="25" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="175" y="160" width="10" height="30" fill="#10b981" rx="2"/>
  <circle cx="180" cy="160" r="8" fill="#10b981"/>
  
  <!-- Background Decor -->
  <path d="M200 40 L220 40 M210 30 L210 50" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <circle cx="30" cy="40" r="5" fill="#ec4899" opacity="0.6"/>
</svg>