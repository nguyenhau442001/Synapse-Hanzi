  <circle cx="120" cy="90" r="15" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Character -->
  <!-- Shoulders/Body -->
  <path d="M60 240 Q120 180 180 240" fill="#38bdf8"/>
  
  <!-- Head -->
  <circle cx="120" cy="140" r="30" fill="#fde68a"/>
  
