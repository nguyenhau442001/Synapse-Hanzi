    <rect x="105" y="85" width="30" height="35" rx="2" fill="#92400e"/>
    <path d="M60 40 L120 10 L180 40 Z" fill="#ec4899"/>
    
    <!-- Character walking towards the school -->
    <circle cx="120" cy="150" r="12" fill="#38bdf8"/>
