    <line x1="114" y1="170" x2="105" y2="185" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="126" y1="170" x2="135" y2="185" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    
