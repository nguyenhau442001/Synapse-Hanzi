<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <g transform="translate(40, 40)">
    <!-- Desk Surface -->
    <rect x="0" y="120" width="160" height="40" rx="8" fill="#334155"/>
    
    <!-- Clock Body -->
    <circle cx="80" cy="70" r="50" fill="#f1f5f9" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="80" cy="70" r="42" fill="#1e293b"/>
    
    <!-- Clock Face Details -->
    <g stroke="#f8fafc" stroke-width="2" stroke-linecap="round">
      <line x1="80" y1="35" x2="80" y2="42"/>
      <line x1="115" y1="70" x2="122" y2="70"/>
      <line x1="80" y1="105" x2="80" y2="98"/>
      <line x1="45" y1="70" x2="38" y2="70"/>
    </g>
    
    <!-- Clock Hands indicating 9:00 -->
    <line x1="80" y1="70" x2="80" y2="45" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="70" x2="45" y2="70" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
    <circle cx="80" cy="70" r="4" fill="#fb923c"/>
    
    <!-- Decorative elements -->
    <circle cx="140" cy="130" r="15" fill="#10b981" opacity="0.3"/>
    <rect x="20" y="140" width="30" height="10" rx="2" fill="#fb923c" opacity="0.6"/>
    <path d="M180 40 L190 20 L200 40 Z" fill="#38bdf8" opacity="0.4"/>
  </g>
</svg>