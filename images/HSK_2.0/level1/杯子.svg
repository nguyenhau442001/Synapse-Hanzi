<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a" opacity="0.4"/>
  
  <!-- Steam/Atmosphere -->
  <path d="M120 100 C 130 80, 110 70, 125 50 M135 100 C 145 80, 125 70, 140 50" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>
  
  <!-- The Cup (杯子) -->
  <path d="M80 80 L160 80 L150 180 L90 180 Z" fill="#38bdf8"/>
  <ellipse cx="120" cy="80" rx="40" ry="12" fill="#7dd3fc"/>
  <path d="M160 100 C 185 100, 185 140, 160 140" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Highlights/Details -->
  <ellipse cx="120" cy="80" rx="30" ry="8" fill="#bae6fd" opacity="0.5"/>
  <rect x="95" y="90" width="10" height="70" fill="#bae6fd" opacity="0.2"/>
  
  <!-- Context Prop: Book/Notebook -->
  <rect x="30" y="170" width="60" height="40" rx="4" fill="#ec4899" transform="rotate(-10 60 190)"/>
  <path d="M30 170 L90 170 L85 165 L25 165 Z" fill="#db2777"/>
  
  <!-- Context Prop: Pen -->
  <rect x="170" y="180" width="40" height="6" rx="2" fill="#10b981" transform="rotate(20 190 183)"/>
  <circle cx="210" cy="195" r="3" fill="#10b981"/>
  
  <!-- Ambient Glow -->
  <circle cx="120" cy="130" r="80" fill="#f59e0b" opacity="0.05"/>
</svg>