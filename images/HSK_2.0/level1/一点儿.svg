<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Teacup with a small amount of tea -->
  <g transform="translate(120, 150)">
    <ellipse cx="0" cy="0" rx="45" ry="15" fill="#475569"/>
    <path d="M-40 0 L-30 60 L30 60 L40 0 Z" fill="#cbd5e1"/>
    <path d="M-30 0 L-22 55 L22 55 L30 0 Z" fill="#f59e0b" opacity="0.8"/>
    <!-- The "Yidianr" - a small amount of liquid -->
    <ellipse cx="0" cy="45" rx="18" ry="6" fill="#f59e0b"/>
  </g>

  <!-- Steam/Atmosphere -->
  <path d="M105 120 Q115 100 105 80" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M135 120 Q125 100 135 80" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Background decorative elements -->
  <circle cx="40" cy="50" r="4" fill="#38bdf8"/>
  <circle cx="200" cy="40" r="6" fill="#ec4899"/>
  <circle cx="180" cy="120" r="3" fill="#10b981"/>
  
  <!-- Decorative steam swirl -->
  <path d="M120 70 C140 70 140 50 120 50 C100 50 100 30 120 30" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3"/>
</svg>