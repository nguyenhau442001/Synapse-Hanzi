<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clinicBg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09131d"/>
      <stop offset="100%" stop-color="#142634"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="90" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="scrubsGrad" x1="0" y1="90" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="skinDoc" x1="0" y1="40" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="skinPatient" x1="0" y1="80" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0" y1="160" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Dark clinic background -->
  <rect width="240" height="240" rx="24" fill="url(#clinicBg)"/>

  <!-- Examination Room Background Wall Details -->
  <line x1="0" y1="185" x2="240" y2="185" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="0" y="186" width="240" height="54" fill="#0b1723"/>

  <!-- Medical Light Box / Radiograph X-Ray viewer on back wall (Zero text) -->
  <rect x="25" y="25" width="65" height="50" rx="4" fill="#0f2132" stroke="#38bdf8" stroke-width="2"/>
  <rect x="29" y="29" width="57" height="42" rx="2" fill="#0284c7" opacity="0.4"/>
  <!-- Spine / Ribs X-ray visual silhouettes -->
  <path d="M57 34 L57 66" stroke="#e0f2fe" stroke-width="2.5" opacity="0.8"/>
  <path d="M48 40 Q57 43 66 40" stroke="#bae6fd" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M46 47 Q57 51 68 47" stroke="#bae6fd" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M48 54 Q57 58 66 54" stroke="#bae6fd" stroke-width="1.8" fill="none" opacity="0.7"/>

  <!-- Medical Chart Clipboard on Wall -->
  <rect x="180" y="30" width="36" height="48" rx="3" fill="#64748b"/>
  <rect x="192" y="27" width="12" height="6" rx="2" fill="#94a3b8"/>
  <rect x="184" y="36" width="28" height="38" rx="2" fill="#f8fafc"/>
  <line x1="188" y1="42" x2="208" y2="42" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="188" y1="48" x2="204" y2="48" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="188" y1="54" x2="206" y2="54" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="188" y1="60" x2="200" y2="60" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Patient sitting on exam table (Left) -->
  <!-- Patient stool -->
  <rect x="35" y="180" width="45" height="52" rx="3" fill="#1e293b"/>
  <rect x="30" y="176" width="55" height="6" rx="2" fill="#0284c7"/>
  <!-- Patient Body -->
  <path d="M45 130 L75 130 L70 180 L40 180 Z" fill="#64748b"/>
  <!-- Patient Head -->
  <ellipse cx="55" cy="110" rx="11" ry="13" fill="url(#skinPatient)"/>
  <path d="M44 108 C44 95, 66 95, 66 108 Z" fill="#334155"/>
  <!-- Patient Arm resting -->
  <path d="M55 132 L68 152 L78 152" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Doctor Figure (Center-Right, Standing in White Coat, using Stethoscope) -->
  <!-- Legs & Formal Trousers -->
  <path d="M125 175 L122 232 L136 232 L140 175 Z" fill="#1e293b"/>
  <path d="M144 175 L148 232 L162 232 L156 175 Z" fill="#0f172a"/>
  <!-- Polished Black Shoes -->
  <ellipse cx="128" cy="233" rx="10" ry="4" fill="#020617"/>
  <ellipse cx="156" cy="233" rx="10" ry="4" fill="#020617"/>

  <!-- Doctor Inner Scrubs -->
  <path d="M124 95 L156 95 L154 175 L126 175 Z" fill="url(#scrubsGrad)"/>
  <!-- V-neck collar -->
  <polygon points="135,95 145,95 140,110" fill="#0ea5e9"/>

  <!-- Doctor White Lab Coat (Full realistic body coat) -->
  <path d="M112 95 L128 95 L132 178 L108 178 Z" fill="url(#coatGrad)"/>
  <path d="M152 95 L168 95 L172 178 L148 178 Z" fill="url(#coatGrad)"/>
  <!-- Coat Lapels -->
  <polygon points="112,95 130,125 126,165 110,165" fill="#f1f5f9"/>
  <polygon points="168,95 150,125 154,165 170,165" fill="#e2e8f0"/>
  <!-- Breast pocket with medical pen and badge -->
  <rect x="156" y="118" width="10" height="12" rx="1" fill="#cbd5e1"/>
  <line x1="160" y1="114" x2="160" y2="120" stroke="#0284c7" stroke-width="2"/>
  <rect x="158" y="122" width="6" height="5" rx="0.5" fill="#38bdf8"/>

  <!-- Stethoscope around neck and in hand examining patient -->
  <!-- Rubber tubing over shoulders -->
  <path d="M132 94 C132 112, 148 112, 148 94" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <!-- Extension tube down to chest piece -->
  <path d="M140 108 C140 130, 115 138, 92 138" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Chest piece / Diaphragm placed gently on patient's back/chest -->
  <circle cx="88" cy="138" r="6" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="88" cy="138" r="3" fill="#cbd5e1"/>

  <!-- Doctor Arms -->
  <!-- Left arm holding the stethoscope diaphragm to examine -->
  <path d="M112 98 L96 120 L90 136" stroke="url(#coatGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="89" cy="136" r="4.5" fill="url(#skinDoc)"/>

  <!-- Right arm holding medical clipboard / notes -->
  <path d="M168 98 L180 126 L172 144" stroke="url(#coatGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>
  <ellipse cx="172" cy="145" rx="5" ry="4" fill="url(#skinDoc)"/>
  <!-- Small handheld clinical chart -->
  <rect x="166" y="140" width="16" height="22" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>

  <!-- Doctor Neck, Head, and Professional Facial Profile -->
  <rect x="134" y="82" width="12" height="15" fill="url(#skinDoc)"/>
  <ellipse cx="140" cy="72" rx="13" ry="16" fill="url(#skinDoc)"/>
  <!-- Neat short professional hair -->
  <path d="M128 70 C128 54, 153 54, 153 68 C153 72, 150 75, 148 76 C144 60, 134 62, 128 70 Z" fill="#1e293b"/>
  <!-- Professional glasses -->
  <rect x="131" y="68" width="7" height="5" rx="1.5" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="140" y="68" width="7" height="5" rx="1.5" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="138" y1="70" x2="140" y2="70" stroke="#0f172a" stroke-width="1.2"/>
  <!-- Focused, caring eyes & smile -->
  <circle cx="134" cy="70" r="1.1" fill="#0f172a"/>
  <circle cx="143" cy="70" r="1.1" fill="#0f172a"/>
  <path d="M136 78 Q140 81 144 78" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Foreground Examination Desk on Right -->
  <rect x="195" y="172" width="45" height="68" fill="url(#tableGrad)"/>
  <polygon points="190,172 240,172 240,165 186,165" fill="#475569"/>
  <!-- Stethoscope earpieces resting box / medicine bottles on desk -->
  <rect x="202" y="152" width="10" height="14" rx="2" fill="#0284c7"/>
  <rect x="204" y="148" width="6" height="4" rx="1" fill="#f8fafc"/>
  <rect x="216" y="155" width="8" height="11" rx="2" fill="#f59e0b"/>
  <rect x="217" y="152" width="6" height="3" rx="1" fill="#f8fafc"/>

  <!-- Soft focus ambient medical clinic glow -->
  <circle cx="140" cy="70" r="65" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.15"/>
</svg>
