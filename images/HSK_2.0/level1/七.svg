<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Bedside Table -->
  <rect x="40" y="140" width="160" height="100" fill="#334155" rx="8"/>
  <rect x="50" y="150" width="140" height="30" fill="#475569" rx="4"/>
  
  <!-- Alarm Clock -->
  <circle cx="120" cy="110" r="45" fill="#f1f5f9"/>
  <circle cx="120" cy="110" r="38" fill="#0f172a"/>
  
  <!-- Clock Hands indicating 7 o'clock -->
  <line x1="120" y1="110" x2="120" y2="80" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="110" x2="145" y2="135" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="110" r="5" fill="#fb923c"/>
  
  <!-- Lamp -->
  <path d="M180 140 L210 80 L150 80 Z" fill="#fbbf24" opacity="0.8"/>
  <rect x="175" y="80" width="10" height="60" fill="#94a3b8"/>
  
  <!-- Book -->
  <rect x="60" y="190" width="40" height="10" fill="#ec4899" rx="2"/>
  <rect x="65" y="185" width="35" height="5" fill="#fbcfe8" rx="1"/>
  
  <!-- Ambient glow -->
  <circle cx="120" cy="110" r="60" fill="#f59e0b" opacity="0.05"/>
  
  <!-- Window/Night sky hint -->
  <circle cx="210" cy="30" r="15" fill="#e2e8f0" opacity="0.2"/>
</svg>