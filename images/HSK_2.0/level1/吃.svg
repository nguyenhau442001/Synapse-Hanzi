<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="20" y="160" width="200" height="80" fill="#334155" rx="10"/>
  
  <!-- Bowl -->
  <path d="M70 140 Q70 180 110 180 Q150 180 150 140 Z" fill="#fb923c"/>
  <path d="M75 140 Q110 155 145 140" fill="#f59e0b"/>
  
  <!-- Chopsticks -->
  <rect x="130" y="110" width="4" height="60" rx="2" fill="#fbbf24" transform="rotate(20 130 110)"/>
  <rect x="138" y="115" width="4" height="60" rx="2" fill="#fbbf24" transform="rotate(10 138 115)"/>
  
  <!-- Character Head -->
  <circle cx="180" cy="100" r="35" fill="#fde68a"/>
  <path d="M165 95 A 5 5 0 1 0 165 96 M195 95 A 5 5 0 1 0 195 96" fill="#0f172a"/>
  <path d="M170 120 Q180 130 190 120" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Hair -->
  <path d="M150 90 C 150 60 210 60 210 90 L 200 100 L 180 70 L 160 100 Z" fill="#38bdf8"/>
  
  <!-- Arm -->
