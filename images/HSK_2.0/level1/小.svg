<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Room elements to emphasize smallness -->
  <rect x="20" y="40" width="200" height="160" rx="10" fill="#334155" opacity="0.3"/>
  <rect x="30" y="50" width="180" height="140" rx="8" fill="#1e293b"/>
  
  <!-- Massive furniture to make character look small -->
  <rect x="150" y="80" width="70" height="110" rx="5" fill="#475569"/>
  <rect x="160" y="90" width="50" height="20" rx="2" fill="#fbbf24"/>
  <rect x="160" y="120" width="50" height="20" rx="2" fill="#fbbf24"/>
  
  <!-- Character -->
  <g transform="translate(60, 120)">
    <!-- Body -->
    <path d="M10 70 Q 30 70 40 70 L 40 40 Q 25 30 10 40 Z" fill="#38bdf8"/>
    <!-- Head -->
    <circle cx="25" cy="25" r="15" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="20" cy="22" r="2" fill="#0f172a"/>
    <circle cx="30" cy="22" r="2" fill="#0f172a"/>
    <!-- Mouth (Surprised/Small expression) -->
    <path d="M22 30 Q 25 33 28 30" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <!-- Arms -->
    <path d="M5 45 L -5 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 45 L 55 60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative lighting accent -->
  <circle cx="190" cy="60" r="15" fill="#fb923c" opacity="0.2"/>
  <circle cx="190" cy="60" r="8" fill="#fbbf24"/>
</svg>