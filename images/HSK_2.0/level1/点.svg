<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <rect x="0" y="160" width="240" height="80" fill="#0f172a" opacity="0.5"/>
  
  <!-- Clock Body -->
  <circle cx="120" cy="120" r="70" fill="#334155" stroke="#475569" stroke-width="4"/>
  <circle cx="120" cy="120" r="62" fill="#1e293b"/>
  
  <!-- Clock Face Details -->
  <g stroke="#f8fafc" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="65" x2="120" y2="75"/>
    <line x1="175" y1="120" x2="165" y2="120"/>
    <line x1="120" y1="175" x2="120" y2="165"/>
    <line x1="65" y1="120" x2="75" y2="120"/>
  </g>
  
  <!-- Clock Hands -->
  <line x1="120" y1="120" x2="120" y2="85" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="155" y2="120" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="6" fill="#fb923c"/>
  
  <!-- Decorative Props -->
  <circle cx="50" cy="190" r="15" fill="#10b981" opacity="0.8"/>
  <path d="M190 180 L210 180 L200 210 Z" fill="#ec4899" opacity="0.8"/>
  <circle cx="200" cy="50" r="10" fill="#38bdf8" opacity="0.6"/>
  
  <!-- Ambient Light -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
</svg>