<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Desk Surface -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  
  <!-- Laptop Body -->
  <path d="M60 170 L180 170 L195 200 L45 200 Z" fill="#94a3b8"/>
  <path d="M65 175 L175 175 L185 195 L55 195 Z" fill="#475569"/>
  
  <!-- Laptop Screen -->
  <path d="M50 70 L190 70 L190 170 L50 170 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <path d="M60 80 L180 80 L180 160 L60 160 Z" fill="#0f172a"/>
  
  <!-- Screen Content: Abstract UI -->
  <rect x="75" y="95" width="90" height="8" rx="2" fill="#38bdf8" opacity="0.6"/>
  <rect x="75" y="110" width="60" height="8" rx="2" fill="#fb923c" opacity="0.6"/>
  <circle cx="160" cy="140" r="12" fill="#10b981"/>
  
  <!-- Coffee Mug -->
  <path d="M200 150 L230 150 L225 190 L205 190 Z" fill="#ec4899"/>
  <ellipse cx="215" cy="150" rx="15" ry="5" fill="#f472b6"/>
  
  <!-- Ambient Light/Glow -->
  <circle cx="120" cy="120" r="80" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Decorative Elements -->
  <circle cx="30" cy="50" r="4" fill="#fbbf24"/>
  <circle cx="210" cy="40" r="3" fill="#38bdf8"/>
</svg>