<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Background Elements -->
  <circle cx="180" cy="60" r="30" fill="#334155" opacity="0.5"/>
  <path d="M20 200 L100 160 L180 200 Z" fill="#334155" opacity="0.3"/>
  
  <!-- The Subject (Anh ấy) -->
  <g transform="translate(60, 80)">
    <!-- Body -->
    <path d="M40 140 C20 140 10 120 10 100 L10 60 C10 40 30 20 60 20 C90 20 110 40 110 60 L110 100 C110 120 100 140 80 140 Z" fill="#fb923c"/>
    <!-- Head -->
    <circle cx="60" cy="40" r="30" fill="#fde68a"/>
    <!-- Hair -->
    <path d="M35 35 C35 15 50 5 60 5 C70 5 85 15 85 35 Z" fill="#475569"/>
    <!-- Eyes -->
    <circle cx="48" cy="35" r="4" fill="#0f172a"/>
    <circle cx="72" cy="35" r="4" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M50 48 Q60 55 70 48" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Context Props (Friendship/Interaction) -->
  <g transform="translate(150, 120)">
    <circle cx="20" cy="20" r="25" fill="#10b981" opacity="0.8"/>
    <path d="M10 20 L18 28 L30 12" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative Accents -->
  <circle cx="40" cy="180" r="8" fill="#38bdf8"/>
  <circle cx="200" cy="150" r="5" fill="#ec4899"/>
  <path d="M190 40 L200 30 L210 40 L200 50 Z" fill="#fbbf24"/>
</svg>