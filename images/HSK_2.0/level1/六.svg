<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <!-- Wall Clock -->
  <circle cx="120" cy="120" r="70" fill="#334155" stroke="#475569" stroke-width="6"/>
  <circle cx="120" cy="120" r="62" fill="#f8fafc"/>
  
  <!-- Clock Markers -->
  <g stroke="#1e293b" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="65" x2="120" y2="75"/>
    <line x1="175" y1="120" x2="165" y2="120"/>
    <line x1="120" y1="175" x2="120" y2="165"/>
    <line x1="65" y1="120" x2="75" y2="120"/>
  </g>
  
  <!-- Clock Hands pointing to 6 -->
  <line x1="120" y1="120" x2="120" y2="160" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="140" y2="120" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="6" fill="#ec4899"/>
  
  <!-- Desk/Surface -->
  <rect x="0" y="200" width="240" height="40" fill="#1e293b"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="40" r="8" fill="#fbbf24" opacity="0.6"/>
  <circle cx="200" cy="180" r="12" fill="#10b981" opacity="0.4"/>
  <path d="M180 60 L190 40 L200 60 Z" fill="#f59e0b" opacity="0.5"/>
</svg>