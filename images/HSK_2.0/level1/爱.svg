<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Living Room Background Details -->
  <path d="M20 180h200v40H20z" fill="#334155"/>
  <circle cx="180" cy="80" r="30" fill="#fbbf24" opacity="0.2"/>
  <path d="M40 120h40v80H40z" fill="#475569"/>
  
  <!-- Main Characters: A parent hugging a child -->
  <!-- Child -->
  <g transform="translate(100, 130)">
    <circle cx="20" cy="20" r="15" fill="#fde68a"/>
    <path d="M10 40h20l-5 60h-10z" fill="#ec4899"/>
    <path d="M5 100h30v10H5z" fill="#38bdf8"/>
  </g>
  
  <!-- Parent -->
  <g transform="translate(70, 90)">
    <circle cx="40" cy="30" r="20" fill="#fde68a"/>
    <path d="M20 50h40l10 80H10z" fill="#fb923c"/>
    <path d="M15 130h50v20H15z" fill="#10b981"/>
    <!-- Arms wrapping around -->
    <path d="M10 70c-10 0-15 20-5 30l15-10" stroke="#fb923c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M70 70c10 0 15 20 5 30l-15-10" stroke="#fb923c" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Warm Glow Accent -->
  <circle cx="120" cy="120" r="80" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 8" opacity="0.4"/>
  
  <!-- Floor Detail -->
  <ellipse cx="120" cy="220" rx="80" ry="10" fill="#0f172a" opacity="0.3"/>
</svg>