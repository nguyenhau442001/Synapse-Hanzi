<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Table Surface -->
  <path d="M0 180 L240 180 L220 240 L20 240 Z" fill="#334155"/>
  
  <!-- Empty Plate -->
  <ellipse cx="120" cy="190" rx="60" ry="20" fill="#e2e8f0"/>
  <ellipse cx="120" cy="185" rx="50" ry="15" fill="#f8fafc"/>
  
  <!-- Chopsticks -->
  <rect x="160" y="170" width="60" height="4" rx="2" fill="#fb923c" transform="rotate(15 160 170)"/>
  <rect x="165" y="180" width="60" height="4" rx="2" fill="#fb923c" transform="rotate(20 165 180)"/>
  
  <!-- Crumbs/Remnants -->
  <circle cx="100" cy="188" r="2" fill="#cbd5e1"/>
  <circle cx="130" cy="192" r="1.5" fill="#cbd5e1"/>
  <circle cx="115" cy="184" r="2.5" fill="#cbd5e1"/>
  
  <!-- Steam/Action lines representing completion -->
  <path d="M120 160 Q130 140 120 120" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M140 150 Q150 130 140 110" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Clock on wall -->
  <circle cx="180" cy="60" r="30" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
  <line x1="180" y1="60" x2="180" y2="40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="60" x2="200" y2="60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="10" fill="#10b981" opacity="0.3"/>
  <circle cx="60" cy="80" r="5" fill="#ec4899" opacity="0.4"/>
</svg>