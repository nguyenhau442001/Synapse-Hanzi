<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Street Scene -->
  <path d="M0 180 L240 180 L240 240 L0 240 Z" fill="#334155"/>
  <path d="M0 180 L240 180" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- House Silhouette -->
  <path d="M140 180 L140 100 L180 70 L220 100 L220 180 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <rect x="165" y="120" width="30" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="180" cy="150" r="3" fill="#fb923c"/>
  
  <!-- Character walking towards house -->
  <g transform="translate(60, 130)">
    <circle cx="20" cy="20" r="12" fill="#fcd34d"/>
    <path d="M20 32 L20 60 M20 40 L5 55 M20 40 L35 55 M20 60 L10 85 M20 60 L30 85" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Atmospheric Elements -->
  <circle cx="40" cy="50" r="25" fill="#fbbf24" opacity="0.2"/>
  <circle cx="40" cy="50" r="15" fill="#fbbf24"/>
  
  <!-- Path markers -->
  <path d="M80 190 L160 190" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M140 185 L160 190 L140 195" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative street lamp -->
  <path d="M30 180 L30 80" stroke="#94a3b8" stroke-width="4"/>
  <path d="M20 80 L40 80" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="30" cy="75" r="8" fill="#fb923c"/>
</svg>