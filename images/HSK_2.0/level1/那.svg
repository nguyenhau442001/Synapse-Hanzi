<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ground -->
  <path d="M0 180 Q 120 160 240 180 L 240 240 L 0 240 Z" fill="#334155"/>
  
  <!-- Distant House (The "That" object) -->
  <g transform="translate(140, 80)">
    <rect x="0" y="40" width="60" height="60" fill="#fb923c" rx="4"/>
    <path d="M-10 40 L 30 10 L 70 40 Z" fill="#ec4899"/>
    <rect x="15" y="65" width="20" height="35" fill="#0f172a"/>
    <circle cx="45" cy="75" r="8" fill="#f59e0b"/>
  </g>
  
  <!-- Foreground Character pointing -->
  <g transform="translate(40, 100)">
    <path d="M20 120 C 20 80 40 70 50 70 C 60 70 80 80 80 120" fill="#38bdf8"/>
    <circle cx="50" cy="55" r="15" fill="#fde68a"/>
    <!-- Arm pointing -->
    <path d="M60 85 L 110 60" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="115" cy="58" r="5" fill="#fde68a"/>
  </g>

  <!-- Decorative elements for depth -->
  <circle cx="190" cy="40" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="210" cy="30" r="5" fill="#fbbf24" opacity="0.4"/>
  <path d="M10 190 L 30 170 M 20 200 L 40 180" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>