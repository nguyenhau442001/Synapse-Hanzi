<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg)"/>
  
  <g transform="translate(40, 60)">
    <!-- Market Stall Counter -->
    <rect x="0" y="100" width="160" height="40" rx="4" fill="#334155"/>
    <rect x="10" y="140" width="140" height="10" fill="#1e293b"/>
    
    <!-- Fruit Basket -->
    <path d="M20 100 L40 130 L120 130 L140 100 Z" fill="#475569"/>
    <circle cx="50" cy="90" r="15" fill="#ef4444"/>
    <circle cx="80" cy="85" r="18" fill="#f59e0b"/>
    <circle cx="110" cy="95" r="14" fill="#10b981"/>
    
    <!-- Price Tag (Blank) -->
    <rect x="60" y="40" width="40" height="25" rx="4" fill="#f8fafc"/>
    <rect x="70" y="65" width="20" height="20" fill="#f8fafc" transform="rotate(45 80 75)"/>
    
    <!-- Hand pointing -->
    <path d="M160 120 C180 120 190 100 180 80 L170 90 L165 70 L155 80 Z" fill="#fbbf24"/>
    
    <!-- Atmospheric depth -->
    <circle cx="200" cy="30" r="4" fill="#38bdf8" opacity="0.3"/>
    <circle cx="180" cy="50" r="2" fill="#38bdf8" opacity="0.2"/>
  </g>
</svg>